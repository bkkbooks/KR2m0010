及私受饋送增改關文者聽巡按御史按察司官體察究治成化三年令差御史一員於陜西巡茶一年更代七年罷差行人四川巡茶令按察司分巡官往來禁約令禁進貢回回畨僧人等於在京及沿途收買私茶十一年令取回陜西巡茶御史仍差行人十四年令仍差御史於陜西巡察十五年令陜西巡茶御史招畨易馬不拘年例願來者聽十八年令私茶有興販夾帶五百斤者照見行私鹽例押發充軍𢎞治元年奏准凡軍衛有司果無私茶不許分派下人買納作數以上茶課永樂十二年差御史及郎中等官至湖廣貴州二布政司提督委官於辰州銅仁等處金銀場採辦金銀課二十九年差御史監生人等閘辦福建浙江銀課宣德七年奏准福建浙江等處解納歲辦銀課每年各處會合止解二次各輪委官一員護送正統三年令罷閘辦銀課封閉各處坑穴其福建浙江等處軍民私煎銀礦者正犯處以極刑家口遷化外如有逃遁不服追問者量調附近官軍勦捕五年令浙江福建按察司各委堂上官一員提督銀坑若有聚衆偷穵者量調附近官軍捕獲首賊梟首示衆為從及誘引通同有實跡者連當房家小發雲南邉衛充軍九年奏准浙江福建二布政司各添設參議一員專理巡礦禁約偷採令開福建浙江有礦銀場採辦銀課十年令浙江都司添設都指揮僉事一員專管銀場又令差御史等官於福建浙江新舊坑場提督煎辦銀課歲終差官解京如各場額數不敷許於别坑有礦處煎補或又不敷具奏處置不許派民包納令浙江福建提督銀場官吏及諸坑首匠作有稱課不及額掊斂民財及侵盜官銀者皆治罪如律該徒流者浙江發福建福建發浙江擺站死罪者浙江發福建福建發浙江沿海邉衛充軍景泰元年令罷採辦浙江福建等處銀課取回閘辦官令都布按三司巡礦官提調各該府縣護守坑場天順二年仍令開雲南福建浙江銀礦各差內使一員照舊煎辦令各鎮守太監提督四年奏准雲南都布按三司及衛所府州縣凡雜犯死罪并徒流罪囚審無力者俱發新與等場充礦夫採辦銀課令差辦事官於四川會川衛密勒山銀場閘辦銀課二年更代五年令雲南福建浙江閘辦銀課止於本坑採礦煎辦若礦脉微細煎辦不及額數者具實奏聞區處不許科補七年詔封閉各處坑場停止煎辦銀課取回內外官員成化元年奏准凡偷掘銀礦不問軍民舍餘旗校人等依律問罪仍枷號三箇月發落三年令浙江福建二處仍各差內官一員提督採辦銀課四川雲南二處令鎮守內官提督採辦又令封閉四川密勒山銀場四年復開密勒山銀場五年奏准四川地方軍民偷採白銅者為首枷號一箇月依律問罪官員原管事者帶俸原帶俸者守哨六年令偷掘銀礦初犯照舊例枷號發落仍發遼東衛分充軍其有資給衣糧器具及走報事情者照初犯例八年令福建浙江有犯偷礦者浙江發福建福建發浙江沿海邉衛充軍九年奏准各處山場有新生礦脉者從各鎮巡三司等官勘實開採以補附近坑場陪納之數十七年令各處銀場礦脉微細採辦不及者量減銀課又令封閉雲南路南州銅場免徵銅課其私犯銅貨出境本身處死全家發烟瘴地面充軍十九年添設雲南布政司參議一員同按察司僉事管理銀課二十年詔各處閘辦銀課地方民力不堪者量為減免令雲南寧州等處軍民客商有偷採銅礦私煎及潜行販賣出境者照路南州例究治𢎞治二年復令封閉四川密勒山銀場五年詔浙江福建等處歲辦銀課纍民陪納所司踏勘明白量為除豁減免仍將礦穴填塞以弭弊端又令取回浙江福建添設巡礦官員十三年奏准盜掘銀礦銅錫水銀等項礦砂但係山洞捉獲曾經持杖拒捕者不論人之多寡礦之輕重及聚衆至三十人以上分礦至三十斤以上者俱不分初犯再犯問發邉衛充軍若不及數又不拒捕初犯枷號三箇月發落再犯免其枷號亦發邉衛充軍其私家收藏道路背負者止理見獲照常發落不許巡捕人員逼令展轉攀指違者參究治罪已上銀課景泰三年奏准蠲除貴州思印江長官司原額水銀課其婺川縣板坑水銀場局水銀如舊已上水銀課洪武三年令廬州府黃墩崑山及安慶府桐城縣歲納礬課每歲二十二萬七百斤每三斤為一引官給工本錢一百五十文私煎者論如私鹽法已上礬課洪武三十五年差內官於廣東布政司起取蛋户採珠蛋户給與口糧天順八年差內使一員看守平江珠池成化九年令看守亷州府楊梅等池奉御兼管永安池二十年差內官一員看守雷州府樂民珠池二十三年差太監一員看守永安所楊梅珠池又令取回廣東新添守珠池內官𢎞治七年差太監一員看守廣東亷州府楊梅青鶯平江三處珠池兼巡捕亷瓊二府并帶管永安珠池已上珠池明會典卷三十二
