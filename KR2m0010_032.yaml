body:
  text: 明會典卷三十二户部十七金科庫藏一天下起解稅課及贓罰等項悉貯內庫以資國用其交納回報行移次第甚備若諸庫該收某物亦有定例其在京太倉庫并在外諸司庫附見于後課程諸司職掌凡府州縣稅課司局河泊所歲辦商稅魚課并引由契本等項課程已有定額其辦課衙門所辦錢鈔金銀布絹等物不動原封年終具印信文解明白分豁存留起解數目解赴所管州縣其州縣轉解於府府解布政司布政司通類委官起解於次年三月以裏到京本部將解到金銀錢鈔布絹等物不動原封照依來文分豁明白劄付該庫交收出給印信長單及具手本關領勘合回部照數填寫責付原解官收執將所解物件同原領長單并勘合於內府各門照進且如銅錢布匹赴甲字庫交納鈔錠廣惠庫交納金銀絹匹承運庫交納其勘合既於各門照進該庫收訖就於長單後批寫實收數目用印鈐蓋仍付原解官齎赴本部告繳立案附卷備照仍令該部主事㕔於原解官差批內將實收過數目批廽候進課畢日將已解并存用課數通行比對原額如有虧兑照依所虧數目具本奏聞類行各司府州縣著落辦課衙門經該官吏人等追理足備差人解赴京庫交納凡十二布政司并直隸府州遇有起解稅糧折收金銀錢鈔并贓罰物件應進內府收納者其行移次第皆倣此各布政司并直隸府州課程錢鈔并金銀布帛等項折收總計三百六十三萬七百七十八錠有零外有各處土産茶鹽硝礬朱砂水銀等物雖有定額數目瑣碎難以備載今十三布政司并兩直隸府州每歲折收課程等項地畝綿花絨二十四萬六千三百斤絲綿二千九百一十八萬三千四百兩絹一十九萬一千九百七十三匹零户口鈔七千七百三十七萬五千九百二十二貫稅課鈔四千六百一十八萬九十貫魚課鈔三百一十七萬五千三百七十貫船料鈔二千四百五十五萬六千二百四十九貫各礦銀課共十五萬一千七百六十七兩明令凡買賣田宅頭匹赴務投稅除正課外每契本一紙納工本銅錢四十文餘外不許多取凡客店每月置店厯一扇在內赴兵馬司在外赴有司署押訖逐日附寫到店客商姓名人數起程月日月終各赴所司查照如有客商病死所遺財物别無家人親屬者告官為見數行移招召父兄子弟或已故之人嫡妻識認給還一年後無識認者入官凡諸色人等踏造酒麯貨賣者須要赴務投稅方許貨賣違者並依匿稅科斷其自行造酒家用者麯貨不在投稅之限如賣酒之家自無麯貨者須要收買曾經投稅麯貨造酒貨賣依例辦納酒課若係自行造麯者其麵亦須赴務投稅大誥天下府州縣鎮店去處不許有官牙私牙一切客商應有貨物照例投稅之後聽從發賣敢有稱係官牙私牙許鄰里坊廂拏獲赴京以慿遷徙化外若係官牙其該吏全家遷徙敢有為官牙私牙兩鄰不首罪同巡攔敢有刁蹬多取客貨者許客商拏赴京來所在湖地河泊地理所在從古至今辦集課程一定不易之所邇年以來奸邪小人受任將從古以來不係辦課所在小溝小港山澗去處下流雖通辦課去處其小溝小港山澗及灌溉塘池民間自養魚鮮池澤皆以照地起料并不係辦課去處小人生事貪心無厭搜求擾民將農民小溝小澗灌溉池塘養魚池澤取魚罾網罩籠之類一槩搜拏聲言要奏如此虐民今後敢有仍前奪民取採蝦魚器具者許民人拏赴有司有司不理拏赴京來議罪梟令以快吾良民之心所在湖池民舟經涉其河泊之官敢有妄取水面錢者罪不赦憲綱一課程仰本府州縣即將歲辦諸色課程數目逐一開報事例洪武初京城置塌房及六畜場停積客商貨物及猪羊等畜聽其兩平交易革罷官私牙行但收免牙錢一分十八年令酒醋課諸色課若有布帛米穀等項俱折收金銀錢鈔除量存各司府州縣祭祀所用餘令各該司局等官親齎具奏有司帶辦者差吏管解俱次年正月起程直隸府州限正月以裏各布政司限三月以裏到京若金銀鉛硃砂膽礬黃丹青緑毛纓碧甸子鍾乳粉棕毛水銀俱起解本色其餘魚茶酒醋礬硝鉛粉黑錫粉錫石膏商稅窰課等諸色課俱折收金銀錢鈔二十三年榜諭各處稅課司局巡攔令計所辦額課日逐巡辦收於司局按季交與官攢出給印信收票不許官攢侵欺致今巡攔陪納違者重罪令一應課鈔除本處存用外其餘俱解布政司官庫收貯又令各處稅課司局商稅俱三十分稅一不得多收二十四年令三山門外塌房許停積各處客商貨物分定各坊廂長看守其貨物以三十分為率內除一分官收稅錢再出免牙錢一分房錢一分與看守者收用貨物聽客商自賣其小民鬻販者不入塌房投稅二十七年令各處城市沒官房屋但係軍官軍人住者不許取賃錢永樂元年奏准凡軍民之家嫁娶喪祭時節追送禮物染練自織布帛及買已稅之物或船隻車輛運自已物貨并農用之器各處小民挑擔蔬菜各處溪河小民貨賣雜魚民間家園池塘採用雜果非興販者及民間常用竹木蒲草器物并當用雜物銅錫器物日用食物俱免稅六年令六畜場塌房課鈔江東宣課司帶收進納七年差御史監生於各處收課衙門閘辦課程又令京城官店塌房照三山門外塌房例稅錢一分宣課司收免牙塌房錢二分看守人收用十年令應天府都稅司分官提調三山門外塌房收辦課鈔又令各處巡按御史及按察司官體察閘辦課程凡有以該稅鈔數倍增收及將瑣碎之物一槩勒稅者治以重罪十五年令各司府州等衙門歲辦并閘辦課程等項金銀假匹俱起解北京內府庫宣德四年令湖廣廣西浙江商稅課納銀者折收鈔每鈔一百貫准銀一兩九年令各處諸色課程舊折收金銀者照例收鈔十年令天下一應課程俱照洪武年間舊額徵收不許妄自增添又令各稅課司添收麻油等物料正統元年裁革各處稅課司局收鈔不及三萬貫者其該收錢糧令有司帶管四年令各處有客商數少稅課虧缺纍民包納者所在有司按察司及巡按御史踏勘從實徵收七年奏准各處州縣額辦商稅酒紙等課於各州縣收貯以備歲造假匹祭祀及官吏俸給等項支用九年置官房於彰義門收稅商課鈔十一年令各處課稅照永樂七年額例收辦其見辦課鈔比舊增多者以見辦之數為額若辦課一萬五千貫與市鎮買賣處所相離有司路逺及軍衛相參者復設稅課司局雲南貴州原無閘辦之處令所司收辦一年為額所收課鈔皆存留為官吏旗軍俸糧等項支用十二年令巡視塌房御史及順天府堂上官一員估計物貨直鈔若干造冊發都稅等司官攢收掌照價收稅令本部差主事二員於淮安臨清閘辦商稅課鈔一年更代令順天府委官一員於張家灣宣課司閘辦商稅一年更代十三年奏准各處開張鋪店及賣酒醋之家户絶者除其稅十四年令內外門攤商稅課止照洪武年間舊額收受不許過多景泰元年奏准各處商稅課仍照正統年間見行事例收辦二年令大興宛平二縣於和逺店等塌房每塌房僉殷實大户二名或四名看管順天府及二縣拘集各行依時估計物貨價直照舊折收鈔貫仍造冊二本一本發都稅司一本送部查考巡視塌房御史務禁管店小腳不得攬納客商課程以不堪鈔抵數送官及邀截客貨騙害商人其收稅則例上等羅假每匹稅鈔二十五貫牙錢鈔二十五貫塌房鈔二十五貫中等羅假每匹稅鈔一十五貫牙錢鈔一十五貫塌房鈔一十五貫下等羅假每匹稅鈔一十貫牙錢鈔一十貫塌房鈔一十貫上等紗綾錦每匹青紅紙每一千張篦子每一千箇稅鈔六貫七百文牙錢鈔六貫七百文塌房鈔六貫七百文中等紗綾錦每匹細羊羔皮襖每領黃牛真皮每張扇骨每一千把稅鈔五貫牙錢鈔五貫塌房鈔五貫青三梭布每匹紅油紙每八千張冥衣紙每四千張鐡鍋每套四口藤黃每斤稅鈔四貫牙錢鈔四貫塌房鈔四貫褐子綿紬每匹毛皮襖氊衫每領乾鹿每箇稅鈔三貫四百文牙錢鈔三貫四百文塌房鈔三貫四百文官絹官三梭布每匹絨線每斤五色紙每四千五百張高頭黃紙每四千張稅鈔三貫牙錢鈔三貫塌房鈔三貫小絹白中布青匾線夏布每匹手帕每連三箇手巾每十條皮褲每件小靴每套三雙板門每合響銅每斤連五紙每千張連七紙每一百五拾張稅鈔一貫牙錢鈔一貫塌房鈔一貫青大碗每二十五箇青中碗每三十箇青大碟每五十箇稅鈔七百四十文牙錢鈔七百四十文塌房鈔七百四十文洗白夏布青緑紅中串二布每匹包頭每連二十箇氊條每條大碌銅青碌枝條碌生熟銅蘇木胡椒川椒黃蠟蘑菰香菌木耳每斤酒壜土酒海每箇青中碟每五十箇白大盤每十箇書房紙每四簍筆管每五百箇油䩞每副稅鈔六百七十文牙錢鈔六百七十文塌房鈔六百七十文青小碟每五十箇白中盤每十五箇稅鈔六百文牙錢鈔六百文塌房鈔六百文花布被面每假白中串二布每匹靛花青紅花針條每斤青靛銀杏菱米蓮肉軟棗石榴每十斤青大盤每十二箇青盤每十五箇青小盤每二十箇青小碗每三十箇乾鵝天鵝等野味每隻南豐大簍紙每四塊竹椅每把稅鈔五百文牙錢鈔五百文塌房鈔五百文喜紅小絹每匹稅鈔四百七十文牙錢鈔四百七十文塌房鈔四百七十文麻布每匹花椒水牛底皮每斤土青盤每十五個土青碗小白盤每二十箇土青碟每五十箇青茶鍾每七箇稅鈔四百文牙錢鈔四百文塌房鈔四百文小粗綿布每匹氊襪每雙土降香白砂糖餳每斤草席每領雨傘每把翠花每朵草花每十朵刷印馬紙每四塊土尺八紙每塊南豐簍紙每六塊連三紙每一千張毛邉紙中夾紙每一百張酒麯每十塊稅鈔三百四十文牙錢鈔三百四十文塌房鈔三百四十文燈草每斤土青酒鍾土青茶鍾每十二箇土青香爐大白碗每十個中白碗每十五箇白大碟每二十箇白小碟每二十五箇稅鈔三百文牙錢鈔三百文塌房鈔三百文馬牙速香魚膠每斤稅鈔二百四十文牙錢鈔二百四十文塌房鈔二百四十文藥材每斤白小碗每十五箇稅鈔二百文牙錢鈔二百文塌房鈔二百文荔枝圓眼冬笋松子桐油桕油黑砂糖蜂蜜每斤蠟胭脂每兩土粉土硝鹻松香墨煤􅐨麻肥皂末香槐花膠棗雞頭螃蟹蛤蜊每十斤乾免雞鴨每隻白茶鍾每六箇甘蔗藕每十根竹筯每一百雙竹掃帚每十把蒲席每領雜毛小皮每張氊帽每箇草鞋每十雙稅鈔一百七十文牙錢鈔一百七十文塌房鈔一百七十文明乾笋蒲桃海菜金橘橄欖牙棗苧麻每斤稅鈔一百四十文牙錢鈔一百四十文塌房鈔一百四十文綿花香油紫草紅曲紫粉黃丹定粉雲香柿餅栗子核桃林檎甘橘雪梨紅棗楊梅枇杷榛子杏仁蜜香橙烏梅五倍子鹹彈黑乾笋茶葉生薑石花菜蝦米鮮乾魚鮮猪羊肉黑鉛水膠黃白麻綱熟鐡每斤綿絮每套蘆席每領綿胭脂每帖西瓜每十箇稅鈔一百文牙錢鈔一百文塌房鈔一百文乾梨皮荸薺芋頭鮮菱烏菱鮮梨鮮桃杏子李子鮮柿柿花焰硝皂白礬瀝青生鐡每斤乾葱胡蘿蔔每十斤冬瓜每十箇蘿蔔菠芥等菜四十斤稅鈔六十五文牙錢鈔六十五文塌房鈔六十五文其餘估計未盡物貨俱照價直相等則例收納其進塌房鈔并抽分布匹及按月該納房鈔俱為除免三年令遼陽稅課司稅課減半四年令張家灣宣課司并在京都稅司凡遇客商淮麯投稅每百分取二送光祿寺准塌房條稅課鈔每歲所送止十五萬斤如有餘存留下半年支用令張家灣宣課司課鈔減半五年令正陽門等宣課司一應雜貨輪日挨次於條由內開寫普安等三店缷賣其給賜各官福順等店亦照例每店僉大户二名看管按季更替該抽貨物各官親屬斟酌抽取不許容留親戚詐稱