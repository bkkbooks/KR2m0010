body:
  text: 明會典卷五十三禮部十二王國禮一封爵明祖訓親王授以金冊金寳妃正授金册不用寳親王嫡長子年及十嵗朝廷授以金冊金寳立為王世子如或以庶奪嫡輕則降為庶人重則流竄逺方如王年三十正妃未有嫡子其庶子止為郡王待王與正妃年五十無嫡始立庶長子為王世子親王次嫡子及庶子年至十嵗皆封郡王授以鍍金銀冊銀印子孫未封者稱王子王孫言語皆稱裔㫖親王女曰郡主自郡主以下俱授誥命郡王女曰縣主郡王孫女曰郡君郡王曾孫女曰縣君郡王𤣥孫女曰鄉君靖江王府合比王支郡王逓减一等稱呼女封縣君凡王世子承襲王封朝廷遣人行冊命之禮授以金冊傳用金寳凡王世子并郡王娶妃及郡王受封并郡王嫡長襲封者當先上聞朝廷遣人止行冊命之禮凡郡王子孫授以官職子授鎮國将軍三品孫授輔國将軍四品曾孫授奉國将軍五品𤣥孫授鎮國中尉六品五世孫授輔國中尉七品六世孫以下授奉國中尉八品事例洪武二十五年奏定王妃以下有所出者稱夫人永樂間詔加鎮國将軍従一品輔國将軍従二品奉國将軍従三品鎮國中尉従四品輔國中尉従五品奉國中尉従六品正統間令親王有長孫者授以世孫給一品冠服郡王有長孫者授以長孫給二品冠服天順間定凡各王府所生子女年至十五方許請封𢎞治四年定親王世子授封其母始封夫人十年定宗室舊制郡王出府止封一妃鎮國将軍輔國将軍各止封一夫人奉國将軍止封一淑人鎮國中尉止封一恭人輔國中尉止封一宜人奉國中尉止封一安人妾媵不封十一定親王郡王子女封爵遵照祖訓及天順末詔書例親王嫡庶子女郡王嫡長子孫俱年至十嵗請封其餘子孫應封鎮國輔國奉國将軍鎮國輔國奉國中尉者及各郡王各将軍中尉女俱照天順中例年十五許請封製名明祖訓見宗人府之國事例國初親王之國百官送至龍江闗後凡之國日上御奉天門早朝畢文武百官稍退侍立上降寳座後坐王冕服由左順門内引二人朝服前導由東第二橋上奉天門至御前行五拜禮上賜王酒飲訖叩頭畢上起送王至東階上王叩頭下上目送出午門王復叩頭闔門上還宫百官不送惟先一日早赴王府行辭禮洪武間定凡王還國祭祀禮用豕一羊一葷素各一壇祭于端門不用制帛後罷端門祭用葷素二壇祭于承天門外凡王之國所過州縣文武官迎接便服行四拜禮凡王之國沿途合祀神祗近者大小皆親祭逺者望祭仍先遣奉祀官灑掃社稷山川壇及旗纛廟預備祭物王将到國前三日致齋至城外本處文武官率耆老出城迎接不行禮導王詣社稷山川壇祭祀各官及耆老随班陪祭禮畢送王至宫陞殿行賀禮凡王在途遇詔赦迎接行禮畢先退不聴開讀凡王在途遇進賀表箋一體具服行禮天順五年奏准凡王之國果従舊王府城外經過許出相見随即回府若不従城外經過者不許慶賀明祖訓凡遇天子夀日王扵殿前臺上設香案具冕服率文武官具朝服行祝天地禮若遇正旦拜天地後即詣祖廟行禮畢陞正殿出使官便服行四拜禮文武官具服行八拜禮事例洪武十八年定凡王到國慶賀禮儀其日設儀仗扵露臺上下之東西設大樂扵露臺上東西北向陳金鼓旗扵承運門外軍職官員各守殿及王城門設文武百官拜位扵丹墀文東武西設贊禮官二員扵文武百官拜位之北東西相向䕶従執事等官先詣圓殿後候典服官啓請王具冕服訖典儀啓執事者先行四拜禮畢各就位典儀啓請王陞殿導引官前導大樂作陞座訖樂止贊排班引禮引文武官就拜位贊班齊鞠躬樂作四拜平身樂止引禮引班首陞自東階由殿東門入至殿中贊跪外贊同贊跪班首衆官皆跪班首致詞云某官某等敬惟殿下欽承上命至國之初理當慶賀如係王府官則稱臣某等後同内外贊俯伏興引禮引班首復位贊鞠躬樂作四拜平身典儀詣殿中跪啓禮畢樂作導引王還宫樂止各官以次出凡慶賀禮儀俱同惟改致詞凡遇聖節及正旦冬至節日行告祝天地禮其日設香案扵露臺上設王拜位于案前文武官拜位于丹墀之東西王冕服就位各官具朝服随班四拜王詣香案前跪衆官皆跪王致祝詞訖随意致詞俯伏興復位衆官皆俯伏興又四拜禮畢凡中宫夀日王冕服妃具禮服設香案扵内宫門露臺上行告祝天地禮先四拜興王詣香案前跪告祝訖俯伏興復位又四拜禮畢不用樂百官不随班凡東宫夀日行告祝禮王皮弁服百官具朝服随班行禮其儀同前凡慶賀正旦禮王冕服文武百官朝服四拜班首由東陛陞殿致詞云某官某等兹遇三陽開泰萬物咸新敬惟殿下茂膺多福賀畢俯伏興復位又四拜禮畢凡冬至王夀日禮同惟改致詞冬至云某官某等兹遇節應黄鍾日當長至敬惟殿下茂膺多福夀日云某官某等兹遇殿下夀誕之辰某等敬祝千嵗夀凡慶賀正旦冬至王夀日惟王府官屬及附郭衙門文武官員稱賀在外各衛所府州縣衙門預期摘撥佐貳官或首領官一員至日随班行禮本府典儀具啓本云某處差某等官㡬員為正旦前来慶賀啓聞訖然後行禮其有出使官員一體随班凡王妃到國五品以上命婦出城五里迎接送到宫行八拜賀禮凡遇冬至正旦五品以上命婦具服詣宫行賀禮贊四拜班首由東陛陞殿跪外命婦皆跪班首致詞云某封某氏等兹遇正旦云履端冬至云履長之節敬詣王妃殿下稱賀如王府官命婦為班首則稱妾某封某氏等後同興復位四拜禮畢其王妃夀誕禮同惟詣王妃前致詞云某封某氏等敬惟王妃殿下夀誕之辰祝千嵗夀其命婦班次照夫品級明㑹典卷五十三
