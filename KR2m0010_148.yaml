并五綵雲文周圍黃絨織香草文看杖硃紅漆竹片帶雕木貼金龍頭垂紅緑結子打杖以硃紅漆竹片為之板四串用鐡力木六片長一尺一寸上濶一寸九分下濶二寸五分聯以青絲絛垂綵線帉錔大鼓二面以木為匡高三尺冒以革面徑四尺周圍抹金銅釘面施粉繪荷葉四中蓮花一匡加紅油繪寶相花貼金銅環鈸四迎引紅漆木杠黃絨綆舉之朝㑹用硃紅漆木架上施獅子四鼓衣一用紅綺織綵色雲龍邉纓絡文瀝水織瑞草文中和韶樂制度麾一用硃紅漆竿髙一丈一尺飾以抹金銅龍頭鐡鈎一尺七寸綴紅羅織金龍文并綵雲一面升一面降上下有花板上繪雲下繪山水柷一以木為之狀如斛面方二尺深一尺七寸有足四面繪山水樹木後面有孔一椎柄曰止敔一以木為之敔狀如伏虎背刻二十七齟齬長二尺五寸有座以紅漆竹櫟之其半析為二十四莖名為籈搏拊二其形如鼓長一尺四寸冒以革二面粉飾繪綵鳳文硃紅漆木匡繪綵雲文銅釘環貫以黃絨綆琴十張每張用桐木面梓木底長三尺六寸六分黑漆身臨嶽焦尾以鐡力木為之肩濶六寸尾濶四寸七絃俱帶軫其面有徽十三底有鴈足護軫各二用硃紅漆几承之瑟四張每張用梓木為質長七尺首廣一尺三寸五分尾廣一尺一寸黑漆邉體以粉為質繪雲文首尾繪以錦文二十五絃各有柱皆朱絃內一絃黃置於紅漆架簫十二管每管以竹為之長一尺八寸間纒以絃線有六孔前五後一笙十二攢每攢用紫竹十七管下施銅簧參差攢于黑漆木匏中有觜項亦黑漆笛十二管每管以細竹為之紅漆長一尺五寸前一孔次六孔傍二孔塤四箇以土為質形如稱錘平底中虛上鋭孔六上一前三後二黑漆創金雲文箎四管每管用大竹為之長尺有五寸間纒銅絲三道紅漆面吹竅一六孔前一後四頭一近頭又二小孔排簫四架每架髙一尺五分廣一尺一寸五分用竹十六管其下參差列于硃紅漆木匾架二面俱創金鳳文編鐘二架鐘以銅為之十六枚應十二律四清聲設于硃紅漆筍虡筍橫虡上飾以鱗屬為貼金木龍頭二各垂流蘇五并帉錔即周之璧翣遺制鐘虡則植二柱以設筍飾以裸屬為二獅子于趺上筍之上有業有崇牙大板謂之業刻為山形若鋸齒捷業然其上大板繪雲文崇牙以懸鐘筍上列植羽為木雕彩鸞五編磬二架磬以石為之十六枚律如鐘筍飾以羽屬為貼金木鳳頭二虡亦飾以羽屬若鵝狀二於其趺餘並如編鐘筍虡制應鼓二以木為匡冒以革鍍金銅釘環橫置于青緑重斗上貫以硃紅漆柱下四足飾以裸屬刻獅子四於其趺上施四角黃綿布䝉蓋周圍垂瀝水抹金銅蓮花座其上施彩鳳一四角貼金木龍頭下垂綵線流蘇五各垂紅線帉錔擊以紅漆捶明㑹典卷一百四十八
