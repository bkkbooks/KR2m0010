body:
  text: 明㑹典卷一百四十八工部二營造二儀仗一大樂制度并中和韶樂制度附諸司職掌凡製造皇帝皇太子親王鹵簿車駕等項儀仗及修理者除金銀器皿於內府成造其餘器仗照數行下軍器等局委官督工計料依式修造完備進赴鑾駕房收貯供用軍器局造㦸矟節角鑼刀盾弓箭小鼓杖鼓掆鼓金鉦骨朵夾矟樂人大鼓營繕所造清道御杖交椅坯腳踏坯馬杌頭管戲竹龍笛笛板針工局造金鼓旗白澤旗令旗紅曲蓋紫方傘紅方傘傳教幡告止幡絳引幡紅團扇青團扇紅方扇紅繡傘紅銷金傘儀鍠氅戈氅㦸氅信幡幢麾寶源局造香爐香盒交椅腳踏銀盆水罐鞍轡局造拂子鞍籠誕馬錦韀巾帽局造立瓜卧瓜鐙杖響節儀刀梧杖班劒幢竿殳義斧洪武初定大駕鹵簿肅旗一面黃質上濶七尺二寸下三尺二寸黑肅字硃漆攢竹竿長八尺二寸下有鐡纂靖旗一面與肅旗制同但用靖字金鼓旗一對黃質連腰濶一丈二尺五寸下七尺紅金鼓二字硃漆攢竹竿通長一丈四尺九寸內貼金木鎗頭長一尺五寸八分上飾紅纓下有鐡纂金龍畫角二十四枝木質黑漆創金為飾上節寶相花中節纒身單龍雲文下節八寶雙海馬鼓四十八面木匡加紅油冒以革面徑一尺七寸匡畫寶相花面畫雙獅綵毬金四面以銅為之徑一尺七寸金鉦四面銅質竹匡用紅綆繫鉦于匡鉦徑九寸五分杖鼓四箇木匡細腰匡兩頭加黑漆創金雲龍文鐡圈二皆冒以革附于匡聯以紅絨綆加銅龍頭鈎子以青絨匾絛懸之笛四管截竹為之六竅長一尺六寸板四串鐡力木板各六貫以青絲組各長一尺一寸上濶一寸九分下濶二寸五分白澤旗一面紅質上下并外邉加黃襴赤火熖間綵腳傍竿加紅腰綵織白澤飛狀及雲文旗上旁有素額織白澤二青字旗身黃襴火焰通長六尺六寸濶二尺九寸腳長五尺揭以硃漆攢竹竿通長一丈三尺六寸九分內貼金木鎗頭長一尺三寸五分飾以紅纓纂用鐡後凡繡旗襴腳腰額并字色竿纓纂制皆同惟黃旗北斗旗稍異白澤旗一靣青質但白澤為走狀餘同前制門旗四對紅質中織金為門字餘同白澤制黃旗四十面黃質上濶八尺下四尺硃漆攢竹竿通長一丈一尺三寸五分內貼金木鎗頭長一尺三寸五分上飾紅纓下有鐡纂金龍旗十二面青質自此至雨旗質同織金雲龍文額織龍旗二字日旗一面織為日紅色及日字月旗一面織為月白色及月字風旗一面織箕星四及風字雲旗一面織五色雲文及雲字雷旗一面織雷文五及雷字自此至北斗旗星宿皆金織雨旗一面織畢星八附耳一星在旁及雨字白月木星旗一面青質織木星一及木字火星旗一面赤質織火星一及火字土星旗一面黃質織土星一及土字金星旗一面白質織金星一及金字水星旗一面黑質織水星一及水字角宿旗一面青質後二十七宿質同織角宿二及角字亢宿旗一面織亢宿四及亢字氏宿旗一面織氐宿四及氐字房宿旗一面織房宿四鈎連二小星在旁及房字心宿旗一面織心宿三及心字尾宿旗一面織尾宿九神宫小星一及尾字箕宿旗一面織箕宿四及箕字斗宿旗一面織斗宿六及斗字牛宿旗一面織牛宿六及牛字女宿旗一面織女宿四及女字虛宿旗一面織虛宿二及虛字危宿旗一面織危宿三及危字墳墓四星在下室宿旗一面織室宿二離宫六星在旁及室字壁宿旗一面織壁宿二及壁字奎宿旗一面織奎宿十六及奎字婁宿旗一面織婁宿三及婁字胃宿旗一面織胃宿三及胃字昴宿旗一面織昴宿七及昴字畢宿旗一面織畢宿八附耳一星在旁及畢字觜宿旗一面織觜宿三及觜字參宿旗一面織參宿七玉井四小星在左足下伐三星在內及參字井宿旗一面織井宿八又鉞一星在旁及井字鬼宿旗一面織鬼宿四及積尸氣一并鬼字柳宿旗一面織柳宿八及柳字星宿旗一面織星宿七及星字張宿旗一面織張宿六及張字翼宿旗一面織翼宿二十二及翼字軫宿旗一面織軫宿四長沙一星在中左右轄二星在旁及軫字北斗旗一面黑質三邊黃襴黑腰火焰間綵腳織北斗星七輔星一在旁及北斗二字東嶽旗一面青質織綵為山形及東嶽二字自此至羆旗山水諸形皆綵織南嶽旗一面赤質織山形及南嶽二字中嶽旗一面黃質織山形及中嶽二字西嶽旗一面白質織山形及西嶽二字北嶽旗一面黑質織山形及北嶽二字江旗一面赤質織水文及江字河旗一面白質織水文及河字淮旗一面青質織水文及淮字濟旗一面黑質織水文及濟字青龍旗一面青質織青龍形雲文及青龍二字白虎旗一面白質織白虎形雲文及白虎二字朱雀旗一面赤質織朱雀形雲文及朱雀二字𤣥武旗一面黑質織龜蛇形雲水文及𤣥武二字天鹿旗一面赤質織天鹿形雲文及天鹿二字天馬旗一面赤質織天馬形雲文及天馬二字鸞旗一面赤質織鸞形雲文及鸞字麟旗一面赤質織麟形雲文及麟字熊旗一面赤質織熊形雲文及熊字羆旗一面赤質織羆形雲文及羆字紅纛一對硃漆攢竹竿通長一丈三尺九寸內貼金木鎗頭一尺六寸徑一寸四分用犛牛尾染紅簇為纛上施抹金銀頂加于纛建于竿下有鐡纂纛周圍磁珠絡皂纛一把與紅纛制同但用黑犛牛尾抹金銅寶蓋紅節一對硃漆攢竹竿抹金銀寶珠頭用犛牛尾染紅簇成如圓斗大凡四層每層上施抹金銀頂周圍綴磁珠絡建于竿下有鐡纂竿長同紅纛小銅角二箇長三尺八寸加漆貼金大銅角二箇長三尺六寸一分加漆貼金纓頭一箇硃漆攢竹竿貼金木鎗頭用犛牛尾染紅簇圓上施抹金銀頂建于竿下有鐡纂通長一丈一尺四寸九分內鎗頭一尺九寸五分豹尾一箇硃漆攢竹竿帶貼金銅龍頭通長一丈三尺四寸九分內龍頭長一尺一寸八分下䘖抹金銅頂藍斜皮雲蓋垂貼金銅鈴共十二箇周圍磁珠串懸紅黃緑三色鬚頭中垂大豹尾長五尺竿下有銅束凡麾幢幡節等挑竿銅龍頭俱以鐡為鈎弓矢一百副弓用竹為體木為托靶并梢置黑角于梢末又用角為面牛筋鋪背四節纒以絲加黑漆面硃漆背用黃蠟絞絲為絃矢用竹為幹木為扣加鐡箭頭柳葉形兩頭俱用牛筋絲纒之加硃漆近扣處加鴈羽櫜二用黑斜皮為之御杖六十根硃漆攢竹杖銅裹兩頭長四尺九寸誕馬二十四匹紅轡黃韁上施錦韀領頭六對硃漆攢竹杖銅裹兩頭長四尺九寸黃麾一對每把硃漆攢竹竿帶貼金銅龍頭共長一丈二尺五寸內龍頭鈎一尺䘖抹金銅圈懸抹金銅頂四角紅羅寶蓋高七寸五分圍二尺七寸五分蓋四角加抹金銅龍頭四箇懸絨線繫抹金銅珮一十六件間銅鈴三十六箇寶蓋下周以緑羅腰黃羅三簷銷金雲龍文中垂大紅羅幡長六尺三寸濶五寸五分幡上節綵繡荷葉蓋蓮花座其中青羅額金書黃麾二字中節描金雙升龍下節描金雲日文幡下綴五色橫板絳引幡五對制同黃麾但用五色羅為幡不加金繡三簷用紫無額并字傳教幡五對制同黃麾但額用黃羅繡青傳教二字中描金升降雲龍無下節雲日三簷用緑龍頭䘖銅珮四件銅鈴三十二箇其銅珮俱抹金告止幡五對制同黃麾但額用黃羅繡青告止二字描金升降鸞鳳雲文三簷用青銅珮銅鈴如傳教之數信幡五對制同黃麾但用黃羅額繡青信字描金升降雙雲龍與傳教同但三簷用黃銅珮銅鈴如傳教之數龍頭竿五對每把硃漆攢竹竿帶貼金木龍頭通共長一丈二尺五寸內竿頭長二尺五分有龍頭䘖抹金銅圈懸抹金銅頂五角紅羅寶蓋髙七寸五分圍二尺七寸五分蓋五角加抹金銅龍頭五箇絨線繫抹金銅珮十件綴以銅鈴十五箇寶蓋下周以紫羅腰紅羅三簷飾雲龍香草文中垂青羅帶五縫成幡長六尺三寸濶五寸五分每帶上描銀下描金皆香草文中描金孔雀形下綴銅鈴五箇豹尾二對每把硃漆攢竹竿帶貼金銅龍頭共長一丈二尺五寸內龍頭鈎長一尺下䘖抹金銅頂藍斜皮寶蓋周圍帶銅鈴八箇中垂豹尾長四尺五寸儀鍠氅十對每把硃漆攢竹竿帶貼金竿頭共長一丈二尺五寸五分內竿頭長一尺三寸五分帶抹金銅索圈并頂懸五色羅帶縫成氅長六尺三寸濶五寸五分氅下綴銅鈴五箇戈氅十對每把硃漆攢竹竿帶貼金竿頭共長一丈二尺五寸內竿頭一尺六寸二分繫木板兩面粉飾畫升降雙鳥懸五色帶縫成羅氅綴銅鈴氅同儀鍠㦸氅十對制同戈氅但竿頭為㦸形長一尺七寸五分單㦸三對每把硃漆攢竹竿帶貼金龍㦸頭共長八尺三寸九分內㦸頭長一尺九寸龍㦸三對制同單㦸但㦸枝有龍頭班劒三對刻木為劒其上有靶靶下為龍頭䘖劍皆貼金為飾垂紅絲帉錔梧杖三對硃漆攢竹為杖長六尺九寸五分兩頭貼金為飾杖或以木為之立瓜三對硃漆攢竹竿通長六尺九寸刻木為瓜立置于上承以龍頭長一尺四寸皆貼金為飾卧瓜三對制同立瓜但瓜及龍頭長一尺二寸五分儀刀三對刻木為刀鞘及靶貼金龍文為飾垂紅絲帉錔其龍文以貼銀為地鐙杖三對硃漆攢竹竿刻木為馬鐙承以龍頭貼金為飾置于竿首共長六尺九寸內鐙頭長一尺六寸金鉞三對硃漆攢竹竿刻木為斧形承以龍頭貼金為飾置于竿首通長六尺九寸內鉞頭長一尺六寸五分骨朵三對硃漆攢竹竿刻木為骨朵承以龍頭貼金為飾置于竿首共長六尺九寸內骨朵頭長一尺六寸羽葆幢五對硃漆攢竹竿帶貼金銅龍頭共長一丈二尺五寸五分內龍頭鈎一尺䘖抹金銅圈加白羽銅頂緑羅寶蓋下以紅絲圓絛貫紅纓簇圓凡五層每層上施抹金銅頂藍斜皮雲蓋懸銅鈴青龍幢制同羽葆幢但頂無白羽有青紗衣籠之衣長七尺五寸濶一尺二寸金繡青龍雲文自此至𤣥武幢皆一把白虎幢制同青龍幢但用白紗衣籠金繡白虎雲文朱雀幢制同青龍幢但用紅紗衣籠金繡朱雀雲文𤣥武幢制同青龍幢但用皂紗衣籠金繡龜蛇雲文響節十二對貼金攢竹竿帶鐡條共長一丈二寸五分內鐡條至頂長一尺二寸五分貫銅錢十二黃羅為衣籠之銷金為飾升龍雲文頂以木為之用貼金其銅錢文天下太平金節三對硃漆攢竹竿帶貼金銅龍頭通長一丈二尺五寸五分內龍頭鈎一尺䘖抹金銅圈并銅頂緑羅寶蓋以紅絲圓絛貫紅纓凡八層每層上施抹金小銅頂藍斜皮雲蓋懸銅鈴有黃紗衣籠之衣長七尺五寸濶一尺二寸繡升龍四方天㦸十六對硃漆攢竹竿通長一丈二尺五寸五分木為㦸承以龍頭置竿上貼金為飾長二尺五分紫方傘四把每把傘骨面闊并頂五尺五寸傘柄并貼金葫蘆頭共長一丈一尺五寸九分其面冒以紫羅垂紫三簷凡傘柄俱用竹加紅油間纒以藤惟曲柄傘硃紅漆攢竹為之紅方傘四把制同紫方傘紅曲柄繡傘四把每把傘骨面濶并頂四尺二寸五分傘柄并貼金葫蘆頭共長一丈一尺二寸九分其面冒以紅羅繡綵雲垂紅三簷上簷雲龍下二簷瑞草文當曲柄處用鐡心貼金龍頭承傘紅直柄華蓋繡傘四把每把傘骨面濶并頂四尺七寸五分傘柄并貼金葫蘆頭共長一丈一尺二寸九分其面冒以紅羅垂紅三簷皆繡雲花文黃直柄繡傘四把每把傘骨面濶并頂四尺二寸五分傘柄并貼金葫蘆頭共長一丈一尺二寸九分其面冒以黃羅繡綵雲文垂黃三簷雲龍文紅直柄繡傘四把每把傘面冒以紅羅繡綵雲文垂紅三簷瑞草文餘同黃直柄繡傘黃曲柄繡傘二把抹金銀鈴全每把傘骨面濶并頂五尺一寸五分傘柄并貼金葫蘆頭共長一丈二尺一寸九分其面冒以黃羅繡綵雲文垂黃三簷雲龍文當曲柄處用鐡心貼金龍頭承傘青銷金傘三把傘骨面濶并頂五尺一寸五分傘柄并貼金葫蘆頭共長一丈二尺一寸九分其面冒以青羅銷金雲文垂青三簷雲龍