body:
  text: 明㑹典卷十六户部一諸司職掌尚書侍郎之職掌天下户口田粮政令按古其屬有四曰民部度支金部倉部洪武二十三年為天下庶務浩繁欽改為十二部曰浙江江西湖廣陜西廣東山東福建北平河南山西四川廣西各令清理一布政司户口錢糧等事仍量其繁簡帶管直𨽻府州每一部内仍分為民度金倉四科以領其事其有應合行移内外衙門文書俱各案呈本部叅詳允當以憑施行十二子部郎中員外郎主事各掌該部所屬户口田糧等項後至洪武二十九年改十二部為十二清吏司永樂元年改北平清吏司為北京清吏司十九年革北京清吏司増雲南貴州交趾三清吏司宣徳十年革交趾清吏司見今十三司帶管浙江清吏司在京留守左衛龍虎衛義勇右衛羽林右衛義勇中衛應天衛龍驤衛果勇衛神機營中軍直𨽻神武中衛南京龍驤衛龍虎衛龍虎左衛應天㑹羽林右衛留守左衛水軍左衛直𨽻神武中衛湖廣清吏司在京羽林前衛通州衛神武後衛義勇左衛豹韜衛和陽衛國子監太醫院揚威營五軍營左掖教坊司南京豹韜衞豹韜左衛和陽衛直𨽻廣徳州河南清吏司在京府軍前衛大興左衛燕山右衛牧馬千户所裕陵衛效勇營五軍營右哨南新倉湯山草塲倉直𨽻潼闗衛蒲州千户所南京飛熊衛英武衛孝陵衛廣武衛松江千户所汝寧千户所洪塘千户所直𨽻松江府鳯陽府睢陽衛歸徳衛南陽衛潁川衛泗州衛夀州衛宿州衛中都留守司鳯陽衛鳯陽右衛鳯陽中衛留守左衛留守中衛長淮衛皇陵衛懐逺衛江西清吏司在京金吾左衛金吾前衛金吾後衛旗手衛濟陽衛振威衛神機營右哨直𨽻河間府河間衛瀋陽中屯衛大同中屯衛滄州守禦千户所南京應天府旗手衛濟川衛金吾左衛金吾前衛金吾後衛江淮衛雲南清吏司在京順天府府軍衛府軍右衛忠義左衛忠義前衛忠義右衛忠義中衛虎賁左衛敢勇營五軍營右掖山口倉南石渠倉花園草塲北馬房東馬房壩上南倉壩上北倉官莊馬房古北口倉居庸倉隆慶倉永盛倉張家莊馬房楊家橋馬房通濟庫御馬倉薊州倉直𨽻薊州衛鎮朔衛遵化衛武清衛東勝右衛興州前屯衛興州左屯衛興州後屯衛興州中屯衛密雲中衛涿鹿衛涿鹿左衛涿鹿中衛天津衛天津左衛梁城守禦千户所密雲後衛南京府軍衛府軍右衛府軍左衛虎賁左衛直𨽻常州府陜西清吏司在京宗人府中軍都督府左軍都督府右軍都督府前軍都督府後軍都督府吏部户部禮部兵部刑部工部都察院通政使司大理寺翰林院詹事府太僕寺尚寳司行人司欽天監鴻臚寺六科中書舎人中城兵馬司東城兵馬司西城兵馬司南城兵馬司北城兵馬司京衛武學長陵衛獻陵衛景陵衛留守右衛奮武營三千營隨侍營直𨽻定邊衛南京横海衛留守右衛直𨽻寧國府滁州徐州滁州衛宣州衛徐州衛徐州左衛廣西清吏司在京光禄寺太常寺犧牲所内府十庫太倉銀庫寛河衛蔚州左衛留守前衛瀋陽左衛瀋陽右衛西城坊草塲安仁坊草塲北新草塲鳴玉坊草塲崇教坊草塲伸威營神機營右掖東安門倉直𨽻真定府真定衛神武右衛定州衛南京留守前衛瀋陽左衛瀋陽右衛直𨽻淮安府徽州府淮安衛大河衛邳州衛新安衛山東清吏司在京錦衣衛大寧中衛大寧前衛鼓勇營象房直𨽻徳州衛徳州左衛武定守禦千户所南京錦衣衛直𨽻揚州府儀真衛髙郵衛揚州衛沂州衛兩淮都轉運鹽使司山西清吏司在京燕山前衛永清左衛永清右衛興武衛鎮南衛北草塲倉立威營神機營左哨五千下直𨽻保安州隆慶州保安衛寧山衛平定千户所廣昌千户所南京龍江左衛興武衛鎮南衛江隂衛直𨽻蘇州府蘇州衛鎮海衛太倉衛嘉興千户所河東陜西都轉運鹽使司廣東清吏司在京神武左衛義勇前衛義勇後衛鷹揚衛羽林左衛留守中衛顯武營五軍千二營神機營左掖蕃牧千户所壩上倉黄土倉鄭家莊馬房倉直𨽻保定府大名府隆慶衛茂山衛居庸闗紫荆闗南京廣洋衛羽林左衛鷹揚衛留守中衛直𨽻鎮江府太平府和州建陽衛鎮江衛福建清吏司在京驍騎右衛虎賁右衛武成中衛武成後衛留守後衛通州右衛燕山左衛武驤左衛武驤右衛五軍營中軍長安門倉東安門倉西安門倉北安門倉武成中衛倉武成後衛倉燕山左衛倉通州右衛倉金盞兒甸倉明智坊草塲南京水軍右衛龍江右衛虎賁右衛驍騎右衛直𨽻廬州府安慶府廬州衛六安衛安慶衛四川清吏司在京彭城衛武徳衛騰驤左衛騰驤右衛府軍後衛武功左衛武功右衛武功中衛神䇿衛忠義後衛金吾右衛耀武營汗石橋倉汗石橋南倉直𨽻順徳府河間長蘆都轉運鹽使司張家灣鹽倉檢校批驗所南京天䇿衛神䇿衛武徳衛府軍後衛金吾右衛直𨽻池州府貴州清吏司在京㑹州衛富峪衛濟州衛練武營五軍營左哨寳鈔提舉司上林苑監臺基厰義河倉直𨽻廣平府永平府山海衛盧龍衛東勝左衛撫寧衛開平中屯衛興州右屯衛通州左衛永平衛明㑹典卷十六
