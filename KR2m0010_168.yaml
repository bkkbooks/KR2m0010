body:
  text: 明會典卷一百六十八大理寺國初置大理司正三品衙門設卿少卿丞洪武元年革十四年復置始改為大理寺正五品衙門其屬置左右二寺設左右寺正左右寺副左右評事及審刑司官十九年審刑司革二十二年復陞正三品衙門二十六年設司務二十九年寺復革後改寺為司永樂初復為寺設官仍舊諸司職掌本寺官其所屬二寺官職專審録天下刑名凡罪有出入者依律照駁事有寃枉者推情辯明務必刑歸有罪不陷無辜審録囚人叅詳罪名諸司職掌凡刑部十二部都察院十二道五軍都督府斷事官五司問擬一應囚人犯該死罪徒流者具寫奏本發審笞杖罪名者行移公文發審另行入遞預先差人連案同囚送發到寺照依該管地方先從左右寺審録若審得囚無寃枉者取訖各囚服辯在官案呈本寺連囚引領赴堂圓審無異取據原問衙門司獄司印信收管入卷將囚連案責付原押人收領回監聽候發落候逓到各項奏本公文到寺將奏本抄白立案務要仔細叅詳情犯罪名比照律條如罪名合律者准擬本寺依式具本同將原來奏本繳送該科給事中編號収掌然後印押平允回報原衙門如擬施行如罪名不合律者依律照駁亦依式具本將原來奏本繳送該科收編駁回原衙門再擬如二次改擬不當仍前駁回議擬候三次改擬不當照例將當該官吏具奏送問或中間招情有未明者必須駁回再問若公文不必抄白就即立案其叅詳罪名准擬合律照駁不合律及送問等項並如前行若審得囚人告訴寃枉果有明白證佐取責所訴詞狀案呈本寺連囚引領赴堂圓審相同將囚連案依前發回原問衙門聽候發落待奏本公文到寺將原來奏本依式具本如前繳送該科公文止留本寺立案然後仰令左右寺抄案備開囚人供詞行移隔别衙門再問若二次畨異者再取本囚供狀在官照例具奏會同六部都察院通政司等衙門堂上官圓審回奏施行合律照駁式大理寺卿臣某等謹奏為李甲告不應事刑部某部問擬李甲等一十六名數内合律一十五名不合律張丙一名有照駁謹具奏聞一照駁前件本寺照律張丙合得計贓准竊盜一貫之上律杖七十罪無出入其刑部某部却依不應律笞四十未審故失已出張丙杖罪三十所據不當官吏除尚書某侍郎某取自上裁其子部某部官吏某人合送法司問罪仍令改正一准擬事内干連人王乙等各得笞罪十名陳丁等合得杖罪四名李甲一名無罪釋放洪武年月日畨異式大理寺卿臣某等謹奏為某事某衙門問擬某人一名審問畨異原招某囚合隔别衙門再問謹具奏聞洪武年月日二次畨異式大理寺卿臣某等謹奏為某事某衙門問擬某人等二名除審擬允當外數内某人一名先為某衙門具本發審若原係公文者則云公文發審本囚告訴寃枉取責供詞在官已經照例行移隔别衙門再問去後今據某衙門發審仍前執稱寃枉除再取供詞在官外本囚合照例會各衙門堂上官圓審謹具奏聞准擬某人合得某罪一名洪武年月日事例洪武間令刑部都察院五軍斷事官所按輕重獄囚連案牘俱送左右二寺覆審寃濫然後送審刑司評駁是非復轉送磨勘司磨考當否以聞後革去二司諸司刑獄惟二寺分審其屬在京諸司及直𨽻衛所府州縣者左寺審之屬在外十三布政司都司衛所府州縣者右寺審之今分審地方屬南北兩京五府六部内府京衛等衙門并未出京長史司者送左寺屬應天順天二府南北直𨽻衛所府州縣并在外浙江等布政司都司衛所邊衛外夷者送右寺左寺帶管衙門六科光禄寺尚寳司中書舍人承運等十庫宗人府五府六部都察院通政使司詹事府翰林院國子監太常寺太僕寺鴻臚寺行人司太醫院欽天監上林苑監五城兵馬司未出京長史司都稅司太倉等倉大興隆寺臺基厰錦衣衛旗手衛府軍衛府軍左衛府軍右衛府軍前衛府軍後衛羽林左衛羽林右衛羽林前衛金吾左衛金吾右衛金吾前衛金吾後衛虎賁左衛燕山右衛燕山左衛燕山前衛大興左衛濟陽衛濟州衛通州衛彭城衛永清左衛永清右衛武功左衛武功右衛武功中衛武驤左衛武驤右衛騰驤左衛騰驤右衛江淮衛濟川衛留守中衛留守左衛留守右衛留守前衛留守後衛神䇿衛應天衛和陽衛廣洋衛牧馬千户所驍騎右衛鎮南衛龍虎衛龍虎左衛龍江右衛瀋陽右衛瀋陽左衛水軍左衛水軍右衛英武衛龍江左衛虎賁右衛武徳衛廣武衛龍驤衛飛熊衛天䇿衛豹韜衛豹韜左衛興武衛犧牲所鷹揚衛江隂衛横海衛義勇左衛義勇右衛義勇中衛義勇前衛義勇後衛武成前衛武成中衛武成後衛忠義左衛忠義右衛忠義前衛忠義後衛神武左衛神武右衛神武後衛大寧中衛大寧前衛蔚州左衛富峪衛會州衛寛河衛牧馬千戸所右寺帶管衙門順天府并合屬州縣應天府并合屬州縣北直𨽻府州縣并衛所南直𨽻府州縣并衛所大寧都指揮使司萬金都指揮使司長陵衛景陵衛獻陵衛裕陵衛孝陵衛浙江都布按三司并府州縣衛所江西都布按三司并府州縣衛所湖廣都布按三司并府州縣衛所福建都布按三司行都司并府州縣衛所廣東都布按三司并府州縣衛所廣西都布按三司并府州縣衛所四川都布按三司行都司并府州縣衛所雲南都布按三司并府州縣衛所貴州都布按三司并府州縣衛所河南都布按三司并府州縣衛所陜西都布按三司行都司并府州縣衛所山東都布按三司并府州縣衛所山西都布按三司行都司并府州縣衛所邊衛外譯永樂七年以來凡兩法司囚犯大理寺官毎月引赴承天門外行人司持節傳㫖會同五府六部通政司六科等官審録輸情服罪者如原擬發遣其或稱寃有詞則仍令有司照勘推鞫十四年遣御史分按各道罪囚罪重者送京令大理寺詳讞十七年諭都察院等官布政司按察司所擬刑名其間多人命重獄恐有差誤所以俱令具奏轉達刑部都察院叅考仍發大理寺審刑司詳擬已著為令今後直𨽻府州縣所擬刑名令一體具奏十九年奏准刑部都察院問擬囚犯仍照洪武年間定制送本寺審録發遣天順二年令毎年霜降後該决重囚刑部都察院及本寺會官審録八年詔一應囚犯有奉㫖推問者必須經由本寺審錄無得徑自叅奏致有枉人成化十四年奏准毎年會官審録之時各該原問衙門將見審重囚姓名開報本寺原審并接管官會審如囚人稱寃即按原卷從衆叅詳十七年命司禮監太監一員會同三法司堂上官於本寺審録罪囚以後毎五年一次著為令𢎞治三年奏准兩法司囚犯有奉㫖來說者問擬明白仍具本發本寺審録奏請若係機密重情不可漏泄者徑自開具招由奏訖仍發本寺審録凡兩法司發審罪囚本寺承行歴事監生即於來文上粘小方紙一幅横列本寺少卿寺丞之姓於上寺正寺副及該掌行評事之姓於其下若奏本粘於護紙上連囚犯先送評事看詳審覆若情詞不悖議擬相符囚犯服辯文移停當即書允字於其姓之下其或情詞有異議擬未當囚犯畨異文移舛錯則直隨其事明白批之次以傳於寺正寺副各批訖承行監生呈於卿少卿寺丞復各看詳若可允即各書行於其姓之下不然亦隨事批下該寺附案候圓審相同或叅駁或調問各依諸司職掌定制施行請㫖發落諸司職掌凡律内該載請㫖發落者本寺開寫犯由罪名奏聞取自上裁即將奉到㫖意於奏本年月後批寫訖就寫某官批於下押字其餘有奉㫖意者亦同此例批寫訖回寺立案備云前項㫖意於平允内開寫回報於各衙門施行詳擬罪名諸司職掌凡在外都司布政司按察司并直𨽻衛所府州一應刑名問擬完備將犯人就彼監收具由申達合干上司都司并衛所申都督府布政司并直𨽻府州申呈刑部按察司呈都察院其各衙門備開招罪轉行到寺詳擬凡罪名合律者回報如擬施行内有犯該重刑本寺奏聞回報不合律者駁回再擬中間或有招詞事情含糊不明者駁回再問事例𢎞治元年奏准内外問刑衙門議擬囚犯律無正條情犯深重者引律比附奏請定奪不得一概俱擬不應供招之外不許妄加叅語違者在内科道官紏劾在外廵按御史叅究御史有違者本寺查究月報囚數諸司職掌凡本寺毎月審過刑部等衙門一應囚數分豁死罪徒流杖笞等項罪名置立印信文冊著令架閣庫典吏日逐明白附寫候至月終通類具本奏聞事例毎半月本寺將審過囚犯并刑部都察院原來奏本通類封裹屬官賫捧堂上官於御前面奏詳審過審擬合律若干名先行回報原問衙門依律照例發落某人等若干名照依欽奉聖㫖發落問招不明駁回再問擬罪不當照駁再擬若干名并本寺日報囚數奏本送科𢎞治十五年奏准本寺將在内審録囚犯并在外轉詳罪名各自具本封進以便查看類奏南京罪囚事例永樂以後南京大理寺所審徒流已上罪囚先移文回報原問衙門毎季差官類奏請㫖發落成化六年以後俱經本寺復詳其情罪允當者通類奏請回報該寺施行其不當者照例駁回再問處决重囚諸司職掌凡本寺審過刑部等衙門死罪囚人犯該十惡决不待時者毎月具本覆奏聞訖移文回報各該衙門處决不係十惡者待秋分後覆奏處决事例洪武十九年詔應死重囚俱令本寺覆奏聽决永樂三年令處决重囚既覆奏仍録所犯情詞封進四封進之後再得㫖然後處决凡發審罪囚有事情重大執詞稱寃不肯服辯者具由奏請會同刑部都察院或錦衣衛堂上官於京畿道問理奏請發落審録在外罪囚事例正統六年令本寺選差屬官與刑部都察院官請勑於南北直𨽻各布政司會官審録罪囚成化四年奏准差本寺寺正及刑部郎中等官往南北直𨽻會同巡按御史審録八年定為常例毎五年一次法司請勑差官往兩直𨽻各布政司審録見監一應重囚真犯死罪情真無詞者仍令原問衙門監候呈詳待報處决果有寃枉即與辯理情可矜疑者陸續奏請定奪雜犯死罪以下審無寃枉即便發落南京大理寺事例本寺左右二寺帶管衙門與在京同凡本寺詳審過輕重罪囚毎三月一次類奏聖㫖就於本寺奏本上批出欽遵發落成化六年以後奏本俱經大理寺覆奏得㫖發落凡會審囚犯毎五年守備太監奉勑會同南京刑部都察院於本寺審録毎年霜降後本寺會同南京五府六部都察院通政司科道等官於京畿道審録若京畿道有刷卷御史亦在本寺會審凡本寺毎日審過囚犯平允勘合仰貫城鋪鋪兵領送通政司掛號分送刑部都察院衙門大理寺平允勘合本寺差辦事吏送通政司掛號施行明㑹典卷一百六十八
