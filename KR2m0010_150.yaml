body:
  text: 明會典卷一百五十工部四儀仗三中宫鹵簿紅杖一對硃漆攢竹為杖銅裹兩末長四尺九寸清道旗一對純青質硃漆攢竹竿通長一丈二尺五寸貼金木鎗頭長一尺七寸銅束黃麾一對每把硃漆攢竹竿𢃄貼金銅鳯頭共長一丈二尺五寸內鳯頭并鉤一尺銜抹金銅頂大紅羅幡長六尺三寸闊五寸五分內青額金書黃麾二字四角紅羅蓋髙七寸五分圍二尺七寸五分四角加抹金鳯頭四箇絨線繫抹金銅珮一十六箇銅鈴三十六箇寶蓋下緑羅腰黃羅三簷飾銷金雲鳯文幡用描金鸞鳯文下綴五色板凡麾幢幡節等挑竿銅鳯頭俱以鐵為鉤絳引幡三對硃漆攢竹竿帶貼金銅鳯頭共長一丈二尺五寸內鳳頭鈎一尺幡用五色羅長六尺三寸闊五寸五分四角寶蓋髙七寸五分圍二尺七寸五分緑腰紫三簷銷金雲鳳文共長一尺九寸抹金鳳頭四箇抹金銅珮一十六箇其蓋上有抹金銅頂鈒花文幡下垂五色板銅珮間銅鈴三十六箇傳教幡二對與絳引幡制同惟三簷用緑垂紅羅幡中有黃額內青傳教二字四垂絨線繫抹金銅珮四銅鈴三十二告止幡二對與傳教制同惟三簷用青黃額內青告止二字信幡二對與傳教幡制同惟三簷用黃額內青信字龍頭竿五對硃漆攢竹竿帶貼金竿頭共長一丈二尺五寸內竿頭二尺五分幡用青羅長六尺三寸闊五寸五分幡下銅鈴五箇紅蓋髙七寸五分圍二尺七寸五分紫腰紅三簷共長一尺九寸抹金銅鳳頭五箇下垂絨線繫抹金銅珮十箇銅鈴一十五箇簷用銷金雲鳳文幡上節描銀下節描金俱香草文中節描金孔雀文其蓋五角上施抹金銅頂鈒花文儀鍠氅五對硃漆攢竹竿𢃄貼金儀鍠通長一丈二尺五寸五分內儀鍠并竿頭一尺三寸五分抹金銅頂垂氅用五色羅長六尺三寸闊五寸五分下有銅鈴五箇戈氅五對硃漆攢竹竿通長一丈二尺五寸帶貼金木龍頭承戈長一尺六寸二分繫木板粉面畫升降雙鳥綴五色羅氅長六尺三寸闊五寸五分末綴銅鈴五箇戟氅五對與戈氅制同惟貼金木龍頭承戟長一尺七寸五分梧杖三對硃漆攢竹杖貼金兩末通長六尺九寸五分立瓜三對硃漆攢竹柄貼金立瓜置其首承以貼金龍頭通長六尺九寸內瓜及龍頭長一尺四寸卧瓜三對與立瓜制同但瓜卧置其首瓜及龍頭長一尺二寸五分儀力三對刻木為刀鞘及靶貼金鳳文為飾垂紅絲帉錔其鳳文貼銀為地班劍三對刻木為劍其上有靶靶下有龍頭銜劍皆貼金為飾垂紅絲帉錔鐙杖三對硃漆攢竹杖貼金木鐙置其首承以貼金龍頭通長六尺九寸內鐙并龍頭一尺六寸金鉞三對硃漆攢竹柄貼金木斧形置其首承以貼金龍頭通長六尺九寸內金鉞并龍頭長一尺六寸五分骨朵三對硃漆攢竹柄貼金木骨朵置其首承以貼金龍頭長六尺九寸內骨朵并龍頭長一尺六寸響節六對貼金攢竹柄長一丈二寸五分以鐡條貫銅鐡錢十二置其上一尺二寸五分黃羅為衣籠之長一尺五寸銷金雲鳳文節頂以木為之貼金飾其銅錢文天下太平羽葆幢二對硃漆攢竹竿長一丈二尺五寸五分帶貼金銅鳳頭鈎長一尺銜抹金銅索并圓頂綴白鳥羽緑羅蓋簇染紅犛牛尾凡五層繫而垂之每層上施抹金銅頂緑斜皮雲蓋下懸銅鈴紫方傘二把傘骨面闊并頂五尺五寸傘柄并貼金木葫蘆共長一丈一尺五寸九分其面冒以紫羅垂紫三簷傘頂四角抹金銅鳳頭凡傘柄俱用竹加紅油間纒以藤惟曲柄傘硃紅漆攢竹為之紅方傘二把傘骨面闊并頂五尺五寸傘柄并貼金木葫蘆共長一丈一尺五寸九分其面冒以紅羅垂紅三簷傘頂四角抹金銅鳳頭黃銷金傘一把傘骨面闊并頂四尺二寸五分傘柄并貼金木葫蘆共長一丈一尺二寸九分其面冒以黃羅銷金雲文垂黃三簷銷金雲鳳文黃繡曲柄傘二把傘骨面闊并頂四尺二寸五分傘柄并貼金木葫蘆共長一丈一尺二寸九分其面冒以黃羅繡雲文垂黃三簷繡雲鳳文當曲柄處用鐡心貼金龍頭承傘紅繡傘一把傘骨面闊并頂四尺二寸五分傘柄并貼金木葫蘆共長一丈一尺二寸九分其面冒以紅羅繡雲文垂紅三簷上簷雲鳳下二簷瑞草文紅素圓傘二把傘骨面闊并頂四尺二寸五分傘柄并貼金木葫蘆共長一丈一尺二寸九分其面冒以紅羅垂紅三簷紅繡雉方扇六把扇及柄通髙一丈一尺二寸內扇連黑漆板髙三尺五寸二分內板五寸扇下闊二尺四寸五分中闊二尺六寸五分面用紅羅繡鸞鳳花文背用青羅銷金團花文面風衣白羅繡雉尾背風衣用青素羅板創金雲文扇柄用攢竹加黑漆青方扇同紅繡花圓扇六把扇及柄通髙二丈一尺二寸內扇見圓三尺三寸五分面用紅羅繡四季花背用紅羅銷金團鳳文風衣俱用紅素羅扇柄用攢竹加硃漆紅黃素扇柄同青繡方扇四把孔雀翎邉扇及柄通髙一丈一尺二寸扇髙二尺九寸五分闊二尺五寸五分面背俱用青線羅邉用孔雀尾面繡鸞鳳花文背繡金團花文紅羅素圓扇六對扇及柄通髙一丈一尺二寸內扇見圓髙三尺三寸五分面背并風衣俱用紅羅黃羅素圓扇六對扇及柄通髙一丈一尺二寸內扇見圓髙三尺三寸五分面背風衣俱用黃羅拂子二把以紅纓為心素氂牛尾籠之黑漆柄垂紅絲帉錔今用馬尾為拂心用紅纓紅紗燈籠二對硃油竹燈骨下有燭盤外以紅紗蒙之及玉色紗蓋硃漆竿舉之竿首貼金木鳳頭其下鳳尾紅油紙燈籠一對硃油竹燈骨下有木座以竹絲為籠加紅油紙硃漆竿加貼金木鳳頭并尾魫燈一對用魫為之竿同紅紙燈硃油鐡燈骨下有木座金交椅一把木質金葉裹金釘裝釘中鈒雲鳳文穿以黃絲匾絛四垂黃絲帉錔黃織金紵絲褡襠金腳踏一箇木質金葉裹金釘裝釘鈒方勝花文黃織金紵絲踏褥金水盆一箇黃金為之中鈒雲鳳文邉鈒香草文西洋布手巾一條金水罐一箇黃金為之有蓋有提小口巨腹金香爐一箇黃金為之爐鈒雲鳳文以硃紅漆竿舉之竿首抹金銅鳳頭其下鳳尾金香合一箇黃金為之蓋鈒鳳文邉鈒香草文金唾盂一箇黃金為之形圓如缶蓋僅掩口下有盤鈒鳳文洪武年間停造金唾壺一箇黃金為之小口巨腹有蓋鈒鳳文洪武年間停造行障二葉紅素綾為之瀝水繪瑞草障繪升降鸞鳳并雲文坐障一葉紅素綾為之頂繪雲文障繪升降鸞鳳并雲文輅一乘髙一丈一尺三寸四分輅上平盤板前後車櫺并鴈翅四垂如意滴珠板其下轅三條皆硃紅漆轅各長一丈九尺六寸用抹金銅鳳頭鳳尾鳳翎葉片裝釘前施硃紅馬搭攀皮一條平盤左右下護泥板及車輪二貫軸一每輪輻十有八條皆硃紅漆周圍輞全各以抹金鈒花銅葉片裝釘輪內車轂各一用抹金銅鈒蓮花瓣輪盤裝釘軸首左右各用紅漆鐡插拴一箇以抹金銅鈒鳳頂管心裝釘軸中纒黃絨駕轅等索輅亭髙五尺八寸六分硃紅漆四柱各長五尺一寸檻座髙六寸六分其上沉香色描金香草板十二片門髙四尺五寸六分闊二尺四寸左右門闊二尺二寸前并左右各上明下暗沉香色線金菱花槅二扇下絛環板明栨全抹金銅鈒花葉片裝釘後硃紅漆五山屏風創金鸞鳯雲文屏上硃紅漆板創金雲文中粧雕木渾貼金鳳一屏後硃紅漆板俱用抹金銅鈒花葉片裝釘亭底硃紅漆板上施紅花毯紅錦褥并席硃紅漆坐椅一座靠背雕木線金五彩粧鳳一上下香草雲板各一硃紅漆福壽板一并褥椅中黃織金綺靠坐褥四圍椅裙全周圍施黃綺幃幔或用黃線羅亭外用青綺緣邉硃紅簾十二扇各用拽簾黃線圓絛二條黃銅圈全前二柱俱創金其上寶相花中鸞鳳雲文下龜文錦輅頂并圓盤髙二尺八分抹金銅立鳳頂𢃄仰覆蓮座髙九寸六分垂攀頂黃線圓絛四條盤上硃紅漆盤下外四周沉香色描金雲文其內青地五彩雲文以青飾輅蓋內寶蓋硃紅漆匡鬪以八頂冒以黃綺頂心并周圍繡鸞鳳九并五彩雲文天輪三層硃紅漆上安雕木貼金邉耀葉板七十二片內飾青地雕木五彩雲鸞鳳文三層間繪五彩雲襯板七十二片盤下周圍黃銅釘裝上施黃綺瀝水三層每層八十一摺間繡鸞鳳文四垂青綺絡帶四條繡鸞鳳各一圓盤四角連輅座板用攀頂黃線圓絛四條并硃漆木魚輅亭前後各有左右轉角闌干二扇內嵌絛環板皆硃紅漆四扇計一十二柱各柱首雕木紅蓮花一用線金青緑粧蓮花抱柱踏梯一硃紅漆以抹金銅鈒花葉片裝釘行馬架三硃紅漆用抹金銅葉片裝釘鐡搭鈎全黃絹幰衣即遮塵油絹雨衣并氊衣各一座硃紅油合扇梯一副硃紅油托義一件安車一乘髙九尺七寸六分車上平盤板前後車櫺并鴈翅板下轅二條皆硃紅漆轅各長一丈六尺七寸六分用抹金銅鳳頭鳳尾鳳翎葉片裝釘前施硃紅油馬搭攀皮一條平盤左右垂護泥板及車輪二貫軸一每輪輻十有八條皆硃紅漆周圍輞全車轂各一軸首左右各用紅漆鐡插拴一箇軸中纒黃絨駕轅等索車亭髙四尺四寸硃紅漆方柱四長同其上四圍裝五彩花板十二片門髙三尺七寸六分闊二尺二寸六分左右門闊同前并左右各硃紅漆上明下暗十字槅二扇後三山屏風屏後壁板俱硃紅漆用抹金銅鈒花葉片裝釘亭底硃紅漆板上施紅花毯紅綿褥周圍施黃綺幃幔或用黃線羅亭外用青綺緣邉硃紅簾四扇各用拽簾黃線圓絛二條黃銅圈全車蓋用硃紅漆髙二尺六分抹金銅寶珠頂𢃄蓮座髙六寸四角抹金銅鳳頭用攀絛四條并紅漆木魚蓋下施黃瀝水三層銷金鸞鳳文鳳頭下垂紅帉錔踏梯一硃紅漆以抹金銅鈒花葉片裝釘行馬架一硃紅漆用抹金銅葉片裝釘鐡塔鈎全黃絹幰衣即遮塵油絹雨衣并氊衣各一座明會典卷一百五十
