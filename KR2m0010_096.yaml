body:
  text: 明會典卷九十六禮部五十五主客清吏司諸司職掌郎中員外郎主事掌諸畨朝貢等事朝貢一國初諸畨國及四夷土官人等朝貢具見諸司職掌其後慕化者衆事例日增土官衙門添設别見兵部而事關朝貢者續列於後諸司職掌一凡諸畨國及四夷土官人等或三年一朝或每年朝貢者所貢之物會同館呈報到部主客部官赴館點檢見數遇有表箋移赴儀部其方物分豁進貢上位若干殿下若干開寫奏本發落人夫管領先具手本關領內府勘合依數填寫及開報門單於次日早朝照進內府或於奉天門或奉天殿丹陛或華蓋殿及文華殿前陳設本部正官奏啓進納若遇慶賀聖節正旦貢獻之物初到即以數目具本奏聞物候至日通進內府陳設交收一凡進馬騾到於會同館即令典牧所差醫獸辨驗兒騍騸及毛色齒歲明白備寫手本交收及令本館放支草料喂養仍撥人夫管領至期進內府行列於丹墀東伺候御前牽過同手本交付御馬監官收領一凡進象駝到於會同館令本館喂飼次日早進內府御前奏進如候聖節正旦冬至陳設進收日逺先行奏聞象送馴象所駝送御馬監收養至期令進內府陳設一凡進虎豹禽鳥之類到於會同館就令畜養之人喂養具數奏聞送所司收領至期進內府丹墀內陳設一凡進金銀器皿珍寶段匹之類須同貢獻之人驗視明白具寫奏本仍以器具裝盛或黃袱封裹分撥館夫一同貢獻之人收管先期一日關填勘合開報門單次日早照進內府於殿前丹陛等處陳設一一交付長隨內使收受一凡進蘇木胡椒香蠟藥材等物數萬以上者船至福建廣東等處所在布政司隨即會同都司按察司官檢視物貨封完密聽候先將畨使起送赴京呈報數目除國王進貢外畨使人伴附搭買賣物貨官給價鈔收買然後布政司仍同各衙門官將貨稱盤見數分豁原報附餘數目差人起解前來本部委官及行戶部都察院委官會同差督人夫運進承運等庫稱盤入庫本部先期開寫各庫該收貨物手本於午門關領各門勘合填寫照進并出給長單令該庫批寫實收數目回部備照一朝貢諸畨及四夷土官去處畨國高麗國東海暹羅國南海琉球國南海占城國南海真臘國南海安南國南海日本國東海爪哇國南海瑣里西洋瑣里三佛齊浡泥國百花國覽邦國彭亨國淡巴國須文逹那國西南夷四川烏蒙軍民府烏撒軍民府芒部軍民府金築安撫司盧山長官司慕役長官司西堡長官司大華長官司寧谷寨長官司頂營長官司十二營長官司安順州貴州宣慰司後屬貴州布政司平茶洞長官司播州宣慰司龍州龍州宣撫司程畨長官司後為府設流官永寧州鎮寧州康佐長官司建昌衛建安州禮州柏興州酉陽宣撫司木瓜長官司方畨長官司黎州卭部軍民府德昌府普安軍民府東川軍民府長河西天全六畨招討司阿昔簇長官司占藏先結簇長官司蛒匝簇長官司北定簇長官司祁命簇長官司阿昔洞簇長官司勒都簇長官司班班簇長官司者多簇長官司麥匝簇長官司石砫宣慰司泥溪長官司雷坡長官司沐川長官司平夷長官司蠻夷長官司馬湖府後改設流官嶽希蓬長官司隴木頭長官司靜州長官司里州建昌府濶州中縣碧舍縣會川府武安州永昌州隆州薑州黎溪州麻龍縣會理州威龍州昌州普濟州廣西龍英州江州龍州思明府陀陵縣養利州上下涷州思陵州萬承州安平州太平府後改設太平府流官都結州羅陽縣思城州結倫州鎮逺州左州崇善縣茗盈州南丹州結安州永康縣思同州東蘭州那地州全茗州利州鎮安府田州府泗城州奉議州雲南姚安軍民府後改設流官知府姚州元江府廣通縣平緬宣慰司車里軍民宣慰司八百宣慰司麗江府景東府楚雄府後改設流官鶴慶府後改設流官尋甸府後改設流官鄧川州海東土官賔居土官小雲南土官臨安府嶍峩縣大理府後改設流官湖廣施南宣慰司忠建安撫司思南宣慰司後改思恩府設流官永順宣慰司臻部六洞黃坡等處長官司保靜宣慰司曲靖軍民府後改設流官西域西天泥八喇國朵甘沙州烏斯藏薩里薩喇賽瑪爾堪明祖訓一四方諸夷皆限山隔海僻在一隅得其地不足以供給得其民不足以使令若其自不揣量來擾我邊則彼為不祥彼既不為中國患而我興兵輕伐亦不祥也吾恐後世子孫倚中國富強貪一時戰功無故興兵致傷人命切記不可但東北與西北邊境互相密邇纍世戰爭必選將練兵時謹備之今將不征諸夷國名開列於後東北朝鮮國即髙麗其李仁人及子李成桂今名旦者自洪武六年至洪武二十八年首尾凡弒王氏四王姑待之正東偏北日本國雖朝實詐暗通姦臣胡惟庸謀為不軌故絶之正南偏東大琉球國朝貢不時王子及陪臣之子皆入太學讀書禮待甚厚小琉球國不通往來不曽朝貢西南安南國三年一貢真臘國朝貢如常其國濵海暹羅國朝貢如常其國濵海占城國自占城以下諸國來朝時內帶行商多行譎詐故沮之自洪武八年沮至洪武十二年方乃得止其國濵海蘇門答喇其國濵海西洋國其國濵海爪哇國其國濵海彭亨國其國居海中百花國其國居海中三佛齊國其國居海中浡泥國其國居海中明會典卷九十六
