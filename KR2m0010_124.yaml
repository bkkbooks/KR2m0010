body:
  text: 明會典卷一百二十四兵部十九根捕逃軍勾補軍士國初逃故軍役根捕勾補具見諸司職掌宣德初又有畫一條例正統以來纍有增損今條具於後其有係職方司所掌者别開于職方之下諸司職掌凡各衛所開報逃故并老疾勾丁代役軍人先須查對鄉貫住址明白具手本赴內府給批差人前去著落有司官吏逃軍根捉正身如正身未獲先將戶丁起解補役仍根捉正身補替其故軍勾取户內壯丁補役如别無壯丁止有幼小貌男取官吏保結回報行移該衛照勘相同紀録候長成勾補若送回老疾軍人就留原籍住坐將户下壯丁起解替役如勾無户籍或住址差拗名姓不同或係另籍民戶及有戶絶無丁有司體勘回申到部行移該衛照勘在營有無長幼人丁並著落原管官旗務要挨究明白回報定奪勾補若衛所官吏并老疾軍人朦朧妄報依律問罪如原勾軍數不完及勾到軍人中途在逃仍著落原差人員前去勾捉若在外遷延違限送法司問罪明令凡軍民以籍為定軍官頭目無得巧立名色徑行勾捉百姓充軍民戶亦不得詐稱各官軍人貼戶躲避差役果有在逃軍人在內申奉都督府在外申奉中書省明文方許勾取事例洪武二十一年令各衛所將逃故軍編成圖册送本部照名行取不許差人各府縣類造軍戶文册遇有勾丁按籍起解二十二年令各處逃軍能擒獲一名者賞鈔三十錠隱藏出首者二十錠見在軍知而首者十錠為事充軍逃回捕獲者五錠隱藏及轉送者全家發金齒充軍逃軍自首者免罪復役官吏不即起送縱容害民者處死二十三年令生員應補軍役者除豁遣歸卒業軍士借撥征進事故者征進逃故軍男年一二嵗者流民全戶充軍病故者俱免勾丁二十四年令垜集軍故戶止一丁者勾有丁貼戶起解軍去原衛逺者解京該府遣人押送若路順及與京師道里均者從便解發二十七年令武職充軍病故子襲原職者開伍二十九年令垜集軍有幼男在伍者免勾丁生員應起解者送翰林院考試成效者開伍發回讀書不成者照舊補役三十五年定垜集軍正軍貼戶造册輪流更代貼戶止一丁者免役當軍之家免一丁差役永樂二年令坐勾軍有見任文武官及生員吏典等戶止三丁者免勾四丁以上者勾一丁補伍十七年令勾軍人違限半年以上者充軍洪熙元年令軍役丁盡戶絶者具官吏結報該衛轉行府部開豁先為事充軍後薦起為官者不拘見任致仕病故俱免補伍宣德元年奏準凡逃軍三月不首者并里鄰人等問罪就點親鄰管解窩家發附近充軍係軍籍者發邊衛能自首者止罪逃軍遞送隱藏者煙瘴衛分充軍官司故縱者論如律凡逃軍未獲起解户丁若清册未到之先獲解而未至衛所者仍選戶丁解查未到即收補伍候正身到日釋放寧家凡逃軍不許以告狀為由遷延生事有應訴事情令家人代理若長解人中途侵損許告所在官司究治仍速將逃軍接遞凡軍戶有丁而偽作無勾者許改正免罪仍扶揑回申者軍發邊衛里鄰發附近充軍凡起解逃軍戶丁須量地立限遞解若長解縱容違限半年以上者依律問罪一年以上者發附近充軍犯人發邊逺充軍凡起解自首并補役軍丁出一千五百里之外者經過有司每人日給行糧一升過期不與不首逃軍及腹裏衛分不及千五百里者不在此例凡勾軍人違限過一年者許巡按按察司官拏解赴京問罪違法情重者不限年三年奏準凡軍逃還鄉有詐死更名充吏卒僧道等項及隱寄丁口立戶地方者並許自首改正其詐稱名目寄住影射致原籍本衛兩無挨尋者追獲自首俱收寄本處衛所他人告發者與窩家里鄰官吏人等俱照例問罪仍追本犯銀十兩充賞凡軍戶有充糧里老人賄賂官吏及勾軍之人朦朧保勘或里老亦係軍戶遞相欺隱者並許改正違者正軍發原衛戶丁再罰一丁發附近充軍凡山西等處抽丁等軍有賄賂官吏將幼弱私自輪替者許原籍究補同伍指陳并事內作弊之人依律問罪凡軍士全家逃竄里鄰知而容隱者限半年首獲過期事覺軍發邊衛里鄰發附近充軍凡囚充及調衛軍問招更調有更易名貫隱匿丁口者其後逃故衛所行拘有司回無名籍似此迷失者並許自首免罪若他人發覺軍調煙瘴衛分仍選戶丁補充原伍凡紀録軍年應赴伍而衛所在千里之外者許於附近收役行原衛開伍凡起解軍多給家人文引照身逃回者限三箇月自首違者發邊衛充軍仍勾戶丁補原伍里鄰及官吏論罪四年令在京各衛軍本部委官同給事中御史清理凡軍有征差等項死亡不明槩作逃移者保勘問豁其不知下落經三次以上保明者依故軍例停勾凡勾軍不許泛遣孤單無籍之徒如違限二年以上者官員追俸旗軍選戶丁補伍再限一年以所勾軍赴京違者全家調别衛其勾軍須填勘合不許以關牒批帖徑行有司凡應勾軍有賂官吏隱蔽壯丁以家人女壻之類冒名代解者姦民私通軍士招贅其戶丁及過房典賣影射徭役者並許改正歸宗違者官吏坐罪本犯全家調别衛充軍代者就收補原伍如果無壯丁方許以少壯義子及同籍女壻補役凡應繼壯丁故自傷殘肢體者許鄰里拏首全家發煙瘴衛所充軍凡軍戶踈族及異姓人舊為同籍分析後充軍者止於有罪人戶下勾丁若聞親屬充軍妄為文慿作分戶在家及祖孫父子異居并食糧年冬者不許若同籍人生前各自充軍有故儘本房勾補無則以他房三丁以上者補役不及三丁者以其本房丁盡事由行本部開豁凡招募諸色人係全戶充軍有故照名勾補者先以一人解發具實有戶丁申部議奏處分凡正軍在營有丁不許於原籍勾取如已行文有司核實回報本衛以在營之丁收役凡義男女壻有代義父妻人之家為軍者有故止於義父妻人之家勾取如係戶絶覆實開除若出幼過房出贅各家俱屬正軍無丁者宜以妻父義父之家為戶絶還繼本宗如本宗係民仍補義父妻父軍役其官員軍民之家有家人義男女壻之類自願投軍或為事編發者有故止於其人本房勾補本房已絶覆實開除凡故軍戶止一丁充生員者照洪武二十九年例考試開豁凡僧道為事充軍故者免勾丁若故軍戶止一丁在充軍之先為僧道者覆實開豁在後者仍發充軍凡丁盡戶絶軍及山後人查無名籍者軍衛有司會勘造册繳部開豁凡逃軍每季半年一類勾死亡及殘疾者嵗一類勾五年令應充軍之人有父母年七十以上及篤廢殘疾者許於附近衛所收役七年令故軍戶止一丁為見任官者聞伍正統元年奏準凡內外都司衛所不許填給勘合差人勾軍止以遞年逃故等軍姓名貫址造册繳部轉發御史按籍清勾其清軍御史按行所至司府州縣各委官一員將應勾軍丁分投清解御史往來巡督除軍政外一應詞訟發該管衙門問理每嵗八月終照巡撫官事例具清解過軍數回京如有窒礙事理會議奏請凡解軍丁逃軍須連妻小同解違者問罪無妻小者解本身凡抽丁垜集軍先前私自輪替者選壯丁連妻解衛果有老疾等項方許替勾凡被勾貧軍挈家流移招回復業者該解軍丁俱候次年起發係原逃者不準如止附近濳躲者依律究問凡起解軍先過該管都司者即於本司交割先過本衛者交本衛官吏隨與批回有留難者從御史究問批回詐偽者有司辨驗問罪凡內外衛所官有將殷實軍占作軍伴賣放買間新勾軍不行存恤抑逼在逃者軍士事故管軍官不將在營人丁收補及以見役軍妄作事故者清軍官具奏提問凡逃軍及已解軍在家潛住者父祖充軍子孫畏繼於别州縣過繼作贅冒籍而以丁盡戶絶回申或充軍在役而原戶人私開作民戶者並限兩箇月具首免罪如違軍杖一百發煙瘴衛所里鄰人等發附近充軍凡浙江并江南直𨽻等衛所清出帶操軍士除原係廣西南丹奉議潯州等衛者發回原伍其餘悉收充正軍行部轉行原衛開伍若先在逃者仍發原衛附近不許擅收凡勾軍人潛回原籍糧里容留者照窩藏逃軍例問發二年議準凡逃軍殘疾并年六十以上者收贖依親别選戶丁解補如止有幼丁照例紀録凡逃軍未獲暫勾戶丁發旁近寄操者正犯到日即與開除凡軍人中途病故解人即告所在官司相理官給文慿付解人送妻小復還復原籍别選壯丁解補凡軍籍丁盡戶絶已經三次回申者即與除豁不許發册重勾凡兩司府州縣清軍官敷一清理軍伍母干預他事其宣德五年以後逃軍及勾取戶丁妄比事例輒投附近寄操者俱收發原伍凡逃軍軍丁解後復逃者連妻小押赴原衛如解人脫放就發補本軍原伍本軍得獲發邊逺充軍其軍丁已解清册後到者取鄰里保明行衛查勘不必重解戶丁凡勾補軍丁在逃解人發附近充軍者事故免勾丁凡妄指逺年民籍作軍戶者諸司不許準理四年令北人充南軍南人充北軍除遼東萬全山西陜西等處邊衛逃軍及近年土豪鹽法編發充軍不動外其餘清出軍丁各就地方改解附近衛分若南人充南軍北人充北軍不在改調之例計改調衛所北直𨽻順天府調三萬衛大名府調定遼中衛順德府調定遼左衛廣平府調定遼右衛河間府調鐡嶺衛真定府調義州衛保定府調瀋陽中衛永平府調遼海衛南直𨽻鳯陽府調宣府左衛揚州府調宣府前衛淮安府調宣府右衛廬州府調萬全左衛徐州府調萬全右衛和州調永寧衛滁州調懷安衛安慶府調隆慶左衛已上俱原充兩廣雲貴四川湖廣福建邊海衛分軍役應天府調大興左衛太平府調義勇右衛鎮江府調義勇前衛蘇州府調武成中衛常州府調燕山左衛松江府調燕山右衛徽州府調武成前衛寧國府調武成後衛池州府調神武左衛廣德州調燕山右衛已上俱原充遼東山西陜西寧夏等衛軍役山東布政司濟南府調定遼前後二衛兖州府調海州衛萊州府調蓋州衛登州府調復州衛東昌府調東寧衛青州府調金州衛已上俱原充兩廣雲貴四川湖廣福建邊衛衛分軍役河南布政司河南府調萬全左衛河南府調萬全左衛彰德府調開平衛衛輝府調龍門衛懷慶府調龍門守禦千戶所汝寧府調來衛南陽府調美峪守禦千戶所山西布政司太原府并沁州俱調大同右衛平陽府調大同左衛大同府調天城陽和二衛澤州調大同前衛汾州調髙山衛潞州調大同後衛遼州調安東中屯衛陜西布政司西安府調永昌山丹二衛延安府調寧夏前衛鳯翔府調涼州衛鞏昌府調鎮畨衛平涼府調西寧衛慶陽府調寧夏中衛漢中府調莊浪衛已上俱原充南方極邊衛分軍役廣西布政司桂林府調潯州府柳州府調南丹衛梧州府調巡象衛潯州府調河池守禦千戶所南寧府調慶逺衛平樂府調向武守禦千戶所慶逺府調南丹衛太平府調柳州衛田州府調柳州衛思明府調武宣守禦千戶所江州府調慶逺衛泗城州調懷集守禦千戶所龍州調南丹衛南丹州調向武守禦千戶所廣東布政司廣州府調南寧衛惠州府調容縣守禦千戶所肇慶府調武宣守禦千戶所韶州府調鬱林守禦千戶所南雄府調梧州守禦千戶所瓊州府調灌陽守禦千戶所潮州府調桂林中衛雷州府調賀縣守禦千戶所廉州府調柳州衛髙州府調桂林右衛貴州布政司思州思南鎮逺三府俱調赤水衛石阡銅仁黎平三府俱調安莊衛普安鎮寧永寧安順四州俱調興隆衛雲南布政司雲南府大理府俱調金齒衛臨安府曲靖軍民府俱調景東衛楚雄􅊹江二府俱調蒙化衛姚安鶴慶武定三軍民府俱調廣南衛廣西廣南二府尋甸元江二軍民府俱調洱海衛金齒軍民指揮司麗江軍民府永寧孟定孟艮景東順寧五府俱調騰衝守禦千戶所湖廣布政司寶慶府調五開衛辰州調銅鼓衛衡州調九溪衛永州府調