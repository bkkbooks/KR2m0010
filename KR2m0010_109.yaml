body:
  text: 明㑹典卷一百九兵部四城隍二東北諸國東北諸國有數種洪武永樂間相率歸附朝廷官其部長為都督都指揮指揮千百户鎮撫等官賜以勑書印記所設有都司衛所等處今具録于後都司一尼魯罕都司衛三百二十八案明時諸衛多係空名所稱山川城站俱在傳聞疑似之間未嘗親涉其地故譯對訛舛名目重復一地而三四名一名而三四見者甚多又如黑龍江屯河呼爾哈河與明邉界相去絶逺而亦列于衛所未免過為夸大至正統間所置伊實等百數十衛皆寄住摩琳衛中尤空文無實今悉為譯改並識其誤于此諾延衛泰寧衛扶餘衛摩琳衛寄住摩琳衛福題希衛沃濟衛沃濟前衛哈喇烏蘇衛雅罕河衛伊實左衛肥河衛伊爾們河衛齊努溫衛伊爾登河衛訥穆河衛科博欒衛鄂古河衛屯河衛哈爾費延衛和囉噶衛哈爾敏衛塔舒爾河衛珠敦河衛沃楞河衛尼瑪拉衛哈勒琿衛伊爾庫魯衛巴爾達河衛雙城衛蘇完河衛博勒和衛右城衛伊拉齊河衛沃濟右衛沃濟左衛沃濟後衛瑪延山衛圗勒哩山衛費雅河衛綏滿河衛塔山衛達喜穆魯衛阿蘇江衛安河衛賡金河衛竒集河衛嘉河衛薩里衛都爾弼河衛海蘭城衛穆遜河衛枯凌河衛額烈河衛推屯河衛察爾圖山衛圖倫衛伊罕河衛恰庫衛猷特哩衛伊實衛通墾山衛呼爾哈河衛綽拉題山衛穆倫河衛烏爾堅山衛額哲密河衛格林衛界藩河衛哈實瑪衛扎凌衛呼爾哈衛多林山衛穆霞衛塔瑪實克衛阿倫衛實勒們衛色珠倫河衛弼勒古河衛靉河衛阿濟河衛費克圖河衛穆克圖哩山衛固里河衛烏登河衛祜實哈哩衛噶穆衛穆瑚埒河衛巴延衛佛爾們河衛塔克題音衛沙蘭衛烏拉衛實勒們衛呼蘭山衛竒穆尼衛沃楞衛塔納河衛錫璘衛竒塔穆河衛托漠河衛宣城衛蘇穆嚕河衛瑚爾穆衛塔瑪實克衛實勒們衛噶穆河衛尼瑪呼山衛吉灘衛鄂勒歡衛穆勤衛和屯衛喀本河衛和通吉河衛薩爾滸衛額伊瑚衛呼勒河衛和通吉衛尼滿河衛伊實衛伊穆河衛阿爾拉山衛穆霞河衛呼拉爾吉山衛額音河衛們河衛古魯山衛伊拉喀衛克默爾河衛默爾根衛吉灘河衛富勒堅衛尼嚕罕衛伊穆河衛阿都齊河衛色埒河衛訥穆衛納爾吉河衛噶齊克衛佛訥赫衛哈實瑪衛瑚葉衛額蘇倫衛順民衛達罕山衛博和哩衛烏雅山衛托漠衛呼勒山衛哈瑪爾衛塔山前衛默爾根河衛穆遜河衛伊爾們河衛伊拉齊衛烏爾琿山衛托罕河衛扎穆圖衛洮爾河衛三屯河衛阿嚕河衛穆瑚埒衛穆當阿山衛羅羅衛勒克山衛克音河衛噶哈衛呼濟河衛多隆武衛阿濟納河衛額埒衛阿蘇衛遜河衛納爾吉衛塔拉河衛薩喇衛伊實衛費克圖河衛扎津衛伊屯河衛溫托琿河衛法河衛額蘇倫衛拉林河衛拉拉山衛阿濟衛通懇山衛烏屯河衛第拉衛伊拉齊河衛哈爾費延衛赫圖河衛拉們河衛圖河衛赫圖衛竒穆尼衛富色克摩衛薩里河衛哈實瑪衛額埒河衛雅魯衛呼嚕山衛農額勒衛希禪衛法勒圖河衛穆克圖哩衛噶勒弼河衛雅竒山衛伊努衛噶穆衛色珠倫衛溫河衛托里山衛斐森衛噶穆河衛拉拉衛烏屯河衛察罕山衛瞻屯衛穆陳衛伊努山衛希禪衛噶哈衛拉哈衛吉河衛敦珠克山衛占尼河衛實山衛伊屯河衛齊巴噶衛扎敦衛濟爾瑪台衛阿都齊衛納蘇濟勒河衛博和哩衛敦敦河衛伊遜河衛察喇圖衛呼圖哩河衛雅魯河衛布爾堪衛穆倫河衛喜塔爾河衛三汊河衛伊嚕河衛錫里呼衛老哈河衛伊遜河衛雅爾河衛舒翻河衛佛林河衛烏蘇哩河衛烏圖哩衛穆勒肯山衛推屯河衛扎凌山衛博囉河衛都爾弼河衛穆丹河衛薩里衛富倫河衛密拉圖山衛佛爾們衛實勒們河衛默倫河衛費克圖河衛實爾固辰衛綽拉題衛察察爾圖河衛舒翻河衛綽拉題衛布爾哈圖河衛烏蘇衛額埒衛呼勒河衛實勒們河衛烏拉河衛靉河衛薩哈勒察衛布爾哈圖河衛默倫衛哈魯河衛布拉衛扎哈喇哈衛齊努溫河衛率賓江衛浩喇圖吉衛齊努溫衛阿津河衛率賔江衛鄂山衛佛林衛碩隆山衛伊屯衛穆河衛珠敦衛噶穆衛海蘭衛薩爾布衛實山衛海蘭衛珠敦衛赫什赫河衛古城衛福河衛哈勒琿衛烏登河衛鄂古衛斐森衛烏塔里衛拉新河衛錫璘河衛多爾裕衛呼嚕河衛穆霞河衛富爾哈河衛齊巴噶山衛老哈衛珠倫河衛吉達納河衛扎穆圖衛伊蘇圖衛色珠倫衛阿木河衛版長衛所二十四沃濟屯河千户所鄂爾琿山千户所沃濟奎瑪千户所呼特亨千户所德里沃赫千户所沃濟沃勒齊千户所嶽色千户所烏延千户所沃濟堅河千户所瞻河千户所烏登千户所屯河千户所哈克三千户所沃濟屯河千户所喀本千户所五因千户所索爾和綽河千户所沃濟昆河千户所法坦河千户所烏屯河千户所喀勒達千户所鄂爾琿千户所溫托琿河千户所沃濟色勒千户所站七博爾德站黑龍江地方默勒特伊站佛多河站伊罕河衛哈必蘇站哈必蘇站富達里站武都竒站地面七穆遜河地面們河地面雍濶地面薩哈地面尼瑪河伊都地面噶穆地面黑龍江地面寨黑龍江和勒博寨西北諸國西北諸國在國初皆服屬中國因授以指揮等官俱給誥印若哈密又為諸畨入貢要道至封為王給以金印所設諸衛具録于後衛六齊勤䝉古衛罕都衛安定衛鄂端衛察遜衛哈密衛西畨西畨即古土畨種類洪武初遣人招諭又令各族舉舊有官職者至京授以國師及都指揮宣慰使元帥招討等官俾因俗以治自是畨僧有封灌頂國師及贊善闡化等王大乘大寶法王者俱給以印誥傳以為信其所設有都指揮使司指揮司等處今具録于後都指揮司二烏思藏都指揮使司朵甘衛都指揮使司指揮使司一隴答衛指揮使司宣慰使司三朵甘宣慰使司董卜韓胡宣慰使司長河西魚通寧逺宣慰使司招討司六朵甘思討討司朵甘