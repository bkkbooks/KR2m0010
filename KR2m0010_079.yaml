body:
  text: 明㑹典卷七十九禮部三十八建言事例洪武九年頒建言格式使言者直陳得失無事繁文十五年令軍士建言者所司用印實封入遞奏聞本人不必赴京永樂元年令凡有利國利民之事不拘百工技藝之人皆許具實敷奏若官吏人等貪贓壞法顛倒是非酷虐良民及婚姻田土軍役等事一體職掌榜文內事理具狀自下而上陳告如有假以實封建言驀越合於上司徑赴朝廷干冒者治以重罪十三年令凡軍民利病及貪官污吏作弊害民者許諸人具實奏聞景泰四年令建言者該衙門詳細參看果有利國利民可行則行有假以言事報復讐怨者具奏治罪凡天下官吏軍民人等建言民情每嵗本部㑹官議定可否俱赴御前奏過其間可行者移各該衙門施行若泛言不切立案不行至於天下巡撫官各陳地方利弊則從户部㑹議具奏定奪㑹議事例洪武二十四年令在京衙門奉旨為格為例及重事須㑹多官計議然後施行又令各衙門㑹議事六科給事中與議若有衆論不同許靣奏定奪宣德三年奏准官民建言六部尚書都御史六科給事中㑹議奏聞正統十年命內閣官與各衙門㑹議後免㑹議近例凡朝廷有大事當㑹議者該部奏請㑹各部都察院通政司大理寺堂上官或掌科掌道官若合㑹武臣則五府管事官皆預合㑹儒臣則翰林院詹事府春坊司經局及國子監皆預節假事例凡每嵗正旦節自初一日為始文武百官放假五日冬至節本日為始放假三日永樂七年令元宵節自正月十一日為始賜百官節假十日養老事例洪武元年令民年七十以上者許一丁侍養免其雜泛差役十九年令所在有司審耆民年八十九十鄰里稱善者備其年甲行實具狀奏聞貧無産業者八十以上每人月給米五斗肉五斤酒三斗九十以上嵗加給帛一匹絮五斤其有田産僅足自贍者所給酒肉絮帛亦如之其應天鳯陽二府富民年八十以上賜爵里士九十以上賜爵社士皆與縣官平禮永樂十九年詔民年八十以上有司給絹二匹布二匹酒一斗肉十斤時加存恤二十二年令民年七十以上及篤廢殘疾者許一丁侍養不能自存者有司賑給八十以上者仍給絹二匹綿二斤酒一斗時加存問天順八年詔凡民年七十以上免一丁差役有司嵗給酒十瓶肉十斤八十以上者加綿二斤布二匹九十以上者給冠帶每嵗宴待一次百嵗以上者給板木恤孤貧事例洪武初令天下置養濟院以處孤貧殘疾無依者三年令民間立義冢仍禁焚尸若貧無地者所在官司擇近城寬閒之地立為義冢五年令城市鄉村若有身無殘疾老幼少壯男子婦女一時不得已而乞覔本里里長及同里上中人户量為資給候其培養成家還復人户所資之物有司常加檢察毋令失所敢有見乞覔之人不行資給者同里上中人户官驗其家所有糧食除存留足用外餘沒入官以濟貧乏若遇旱潦饑荒人民流移者不在此限宣德三年令天下軍民貧病者惠民藥局給與醫藥天順元年令收養貧民於大興宛平二縣各設養濟院一所於順便寺觀從京倉支米煮飯日給二餐器皿柴薪蔬菜之屬從府縣設法措辦有疾者撥醫調治死者給以棺木四年令京城崇文宣武安定東直西直阜城門外各置漏澤園仍令通州臨清沿河有遺胔暴露者一體掩藏自宫禁例事例永樂二十二年令凡自宫者以不孝論軍犯罪及本管頭目總小旗民犯罪及有司里老宣德二年令凡自淨身者軍還原伍民還原籍不許投入王府及官員勢要之家隱藏躲避差役若再犯者本犯及隱藏之家俱處死該管總小旗里老鄰人知而不舉一體治罪正統十二年令凡自首在官閽者送南海子種菜其隱瞞不首及再擅淨身並私收使用者事發全家發遼東充軍天順二年令淨身者拏問邊遠充軍成化九年令私自淨身希求進用者本身處死全家發煙瘴地方充軍十五年令淨身人巡城御史錦衣衛官督同五城兵馬逐回原籍若該城內外容留潛住者並火甲鄰佑人等一體究治本身枷號一箇月滿日决打一百押回如再來京並家下父兄人等俱治罪二十二年令各王府非奉朝廷明文擅收淨身人俱發回原籍收管不許投託容隱𢎞治元年令錦衣衛拘審淨身人送順天府遞回原籍官司五日一㸃閘不在者即杖並户頭追回見官不許容縱五年令私自淨身者本身並下手之人處斬全家發邊逺充軍兩鄰及歇家不舉者同罪有司里老容隱者一體治罪十三年奏先年淨身人曽經發遣若不候朝廷收取官司明文起送私自來京圖謀進用者問發邊遠充軍雜行諸司職掌一凡本部缺吏員皂𨽻即行移當該衙門撥補明㑹典卷七十九
