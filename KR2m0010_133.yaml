body:
  text: 明㑹典卷一百三十三刑部八問擬刑名二五刑贖罪明令笞一十贖銅半斤杖六十贖銅一斤徒一年贖銅一百二十斤徒一年半贖銅一百四十斤徒二年贖銅一百六十斤徒二年半贖銅一百八十斤徒三年贖銅二百斤流二千里贖銅二百二十斤流二千五百里贖銅二百四十斤流三千里贖銅二百六十斤凡年七十以上十五以下及篤廢殘疾犯笞杖徒流者聽贖若有教令之人罪坐教令者其犯姦盗死罪并十惡者不用此令犯徒流之罪有祖父母父母年及八十以上别無以次侍丁者依例斷决留養凡各處知府知州知縣有犯公罪笞四十以下者許令贖銅凡民官月俸錢米相兼罰俸止罰俸錢軍官月支全米如遇罰俸合與民官一體扣筭追罰俸錢事例洪武三十二年奉准凡合罰官員月俸計十分為率追罰一分入官合依律令每俸一石罰鈔一百文永樂十一年令除公罪依例紀録收贖及死罪情重者依律處治其情輕者斬罪贖鈔八千貫絞罪及榜例死罪六千貫流罪三千貫徒罪二千貫杖罪一千貫笞罪五百貫宣德二年定笞杖罪囚每一十贖鈔二十貫其徒流罪名每徒一等折杖二十三流並折杖一百四十其所罰鈔悉如笞杖所定景㤗元年令内外法司問擬笞杖罪囚有力者納鈔笞一十二百貫每十以二百貫逓加至笞五十為一千貫杖六十一千八百貫每十以三百貫逓加至杖一百為三千貫其貪贓官吏除金銀珠寳仍追本色餘物亦照今例折鈔羅叚每疋八百貫綾紗三百貫大絹一百貫小絹三梭布各三十貫大綿布二十貫小綿布八貫天順五年令罪囚納鈔每笞一十鈔二百貫餘四笞五杖各遞加一百貫至杖六十増為一千四百五十貫餘杖各遞加二百貫成化元年奏准收贖過失殺人絞罪追鈔三十六貫六百文銅錢八貫四百文與死者之家營𦵏𢎞治十三年奏准皇陵户皇陵衛軍旗守衛軍與守衛上直操備官旗舍餘將軍校尉勇士力士運粮駕送黄馬快舡官旗犯笞杖罪俱納鈔凡婦人有犯姦盗不孝并審無力與樂婦各依律决罰其餘有犯笞杖并徒流雜犯死罪該决杖一百者審有力與命婦軍職正妻俱納鈔已上納鈔洪武二十三年令罪囚運米贖罪除十惡并殺人者論死餘死罪運米北邊力不及者或二人併力運納三十年令罪囚運米贖罪死罪一百石徒流遞减其力不及者死罪自備米三十石徒流罪十五石俱運赴甘州威虜地方上納就彼充軍永樂三年令官民雜犯死罪以下量増贖罪米聽於京倉上納免赴北京雜犯死罪納米一百一十石流罪三等八十石加役者九十石徒罪三年者六十石二年半五十石二年併遷徙者四十五石一年半三十五石一年三十石杖罪九十一百俱二十五石六十至八十二十石笞罪十石十一年令流罪運米四十石徒罪三年三十五石二年半三十石二年二十五石一年半二十石一年十五石杖罪十石笞罪五石俱於北京官倉給粮自備車牛運赴懐來上納宣德二年令南京法司問擬監守自盗雜犯死罪以下各自備米於南京倉上納贖罪死罪官吏一百石軍民人等八十石流罪六十石徒三年五十石二年半四十石二年三十五石一年半三十石一年二十五石杖罪一百二十石九十十五石八十一十二石七十一十石六十八石笞罪五十六石四十五石三十四石二十三石一十二石三年令雜犯死罪以下官吏依例納米軍匠力能納者亦如之若家逺不能者行原籍追納就彼官倉收貯若非存留操備上工者遞回納米四年令北京法司并直𨽻河間等八府及河南山東官吏軍民人等犯罪俱納米於北京倉雜犯死罪五十石流罪比死罪减十石徒三年三十五石以下四等遞减五石杖一百十石以下四等遞减一石笞五十五石四十减一石三十又减五斗二十又减一石一十又减五斗南京法司及湖廣江西并南直𨽻太平等府州縣所問雜犯死罪以下官送北京吏典軍民人等納米於南京倉浙江并直𨽻蘇松常鎮四府及江北直𨽻鳯陽等府州縣所問雜犯死罪以下官送北京吏典軍民人等納米於淮安倉其徐州納米於臨清倉俱依南京例死罪官吏一百石軍民八十石流罪减十之四徒三年五十石二年半四十石以下三等遞减五石杖一百二十石九十十五石八十十二石七十六十遞减二石笞五十六石以下四等遞减一石其監守盗粮兠攬貨物與迯亡軍囚夫匠厨子等項及力不能納米者依律問斷五年令在外罪囚贖罪除真犯外文武官吏犯贓者送京師如律處治軍職犯死罪者納米贖罪送京師調衛非贓罪則不分輕重俱納米還職役正統十四年令通州運米至京倉雜犯死罪三百六十石三流并杖一百徒三年者二百八十石餘四等遞减四十石杖每一十八石笞毎一十四石通州運至居庸關隆慶衛等倉雜犯死罪九十石三流并杖一百徒三年七十石餘四等遞减十石杖每一十二石笞毎一十一石景㤗三年令法司罪囚於京倉運米赴宣府宣德倉贖罪雜犯死罪四十五石三流并徒三年三十五石餘四等遞减五石杖一百十石餘四等遞减一石六年令法司罪囚杖以上自備米運赴宣府上倉斬絞罪二十石三流并徒三年十六石徒二年半十三石五斗徒二年十一石一年半九石一年六石五斗杖毎十四斗又令在京法司并北直𨽻罪囚運米沿邊贖罪雜犯死罪九十石三流并徒三年七十石俱减二十石杖九十徒二年半六十石减十五石杖八十徒二年五十石杖七十徒一年半四十石杖六十徒一年三十石俱减十石杖罪每一十二石减作一石五斗笞罪不减成化二年令罪囚納豆贖罪死罪五十石三流三十五石徒三年三十石二年半二十五石二年二十石一年半一十五石一年一十石杖一百者六石九十者五石五斗八十者五石七十者四石五斗六十者四石笞五十者三石五斗四十者三石三十者二石五斗二十者二石一十者一石五斗𢎞治四年令法司徒杖罪囚仍照舊例不分軍民人等但審有力犯該杖六十徒一年納米十五石杖七十徒一年半二十石杖八十徒二年二十五石杖九十徒二年半三十石杖一百徒三年三十五石已上運米成化二年令罪囚納馬贖罪每徒二年與二年半者納馬一匹徒三年與流罪二匹雜犯死罪三匹餘銀不及市馬一匹者俱送兵部㑹太僕寺收積又令在京文武官員軍民人等犯該徒二年以上者送兵部照運灰脚價則例估筭納馬一匹准銀十兩外剰脚價銀兩不勾買馬一匹該司照數追收在官㑹太僕寺委官隨時買馬已上納馬永樂十七年令見𤼵做工笞杖徒流罪囚有願併工運磚者每人日運四箇各照所犯計筭雜犯死罪囚亦准併工每人運磚一萬箇宣德五年令罪囚無力運磚者雜犯死罪准雜工五年徒流各依年限准工杖罪准工十箇月笞罪五箇月天順五年令官員與有力之人照例運磚炭等物每笞一十運灰一千二百斤磚七十箇碎磚二千八百斤水和炭二百斤石一千二百斤餘四笞五杖灰各遞加六百斤磚各遞加三十五箇碎磚各遞加一千四百斤水和炭各遞加一百斤石各遞加六百斤徒一年運灰一萬二千斤磚六百箇碎磚二萬四千斤水和炭一千七百斤石一萬二千斤餘四徒三流灰各遞加六千斤磚各遞加三百箇碎磚各遞加一萬二千斤水和炭各遞加九百斤石各遞加六千斤雜犯二死各運灰六萬四千二百斤磚三千二百箇碎磚一十二萬八千斤水和炭九千斤石六萬四千二百斤已上運磚灰并炭𢎞治十四年奏准刑部都察院問完例難的决人犯并婦人有力者每杖一百該鈔二千二百五十貫折銀一兩每十以二百貫遞减至杖六十為銀六錢笞五十該鈔七百五十貫折銀五錢每十以一百五十貫遞减至笞二十為銀二錢笞一十該鈔二百貫折銀一錢如收銅錢每銀一兩折七百文其依律贖鈔除過失殺人外其餘亦照此數折收按季𩔖送户部明立文案照數支給已上納銀𢎞治十三年奏准凡軍民諸色人役及舍餘審有力者與文武官吏監生生員冠帶官知印承差隂陽生醫生老人舍人不分笞杖徒流雜犯死罪俱令運炭運灰運磚納科納米等項贖罪若官吏人等例該革去職役與軍民人役審無力者笞杖罪的决徒流雜犯死罪各做工擺站哨瞭發充儀從等項情重者煎鹽炒鐡死罪五年流罪四年徒罪照徒年限其在京軍丁人等無差占者與例難的决之人笞杖亦令做工凡各衛所舍餘總小旗犯笞杖者有力運炭納米等項外或令納鈔無力的决凡養牲官軍有犯姦盗詐偽失誤供祀并一應贓私罪名不分輕重官黜罷照例發落軍發原伍若訐告詞訟及因人連累一應公錯犯該笞杖罪名者納鈔并犯徒罪以上不碍行止者運炭等項各還職着役凡在京在外運炭納米贖罪等項囚犯監追半年之上如果貧難改撥做工擺站的决等項發落若軍職監追三月之上不完者在京就改做工在外先發還職准令將該支俸粮實米照該納米數扣除在官准筭凡先犯雜犯死罪運炭納米等項未完及做工等項未滿又犯雜犯死罪者决杖一百除杖過數目准鈔六貫再收贖鈔三十六貫又犯徒流笞杖罪者决其應得杖數五徒三流各依律收贖鈔貫仍照先擬發落若三次俱犯雜犯死罪者奏請定奪凡先犯徒流罪運炭做工等項未曽完滿又犯雜犯死罪除去先犯罪名止擬後犯死罪運炭做工等項若又犯徒流罪者依已徒而又犯徒將所犯杖數或的决或納鈔仍總徒不得過四年又犯笞杖者將後犯笞杖或的决或納鈔仍照先擬發落凡先犯笞杖運炭做工等項未曽完滿又犯徒流罪將先犯罪名或的决或納鈔止擬後犯徒流罪又犯雜犯死罪除去先犯笞杖止擬後犯死罪各運炭做工等項又犯笞杖罪或先重後輕或先輕後重將輕者或的决或納鈔仍將重者令其運炭做工等項𤼵落凡在京法司問擬囚犯有已徒而又犯徒律該决訖所犯杖數總徒四年有大誥及遇䝉恩例通减二等者俱照三流同為一减律例减徒一年其餘徒罪運炭納米做工擺站等項者俱照舊例免杖已上贖刑通例檢屍明令凡檢屍圖式各府刋印每副三幅編立字號半印勘合𤼵下州縣如遇初復檢屍塲劃時委官將引首領官吏仵作行人親詣地所呼集應合聽騐人等眼同仔細檢騐定執生前端的致命根因依式標注署押一幅給付苦主一幅粘連附卷一幅繳申上司其初復檢騐官司行移體式並依已行舊例凡諸人自縊溺水身死别無他故親屬情願安𦵏官司詳審明白准告免檢若事主被強盗殺死苦主自告免檢者官為相視傷損將屍給親埋葬其獄囚患病責保看治而死者情無可疑亦許親屬告免檢復外據殺傷而死者親屬雖告不聽免檢事例凡本部遇有該檢屍傷行令順天府大興縣宛平縣應天府上元縣江寜縣委官帶領仵作人等如式檢騐各取結狀繳報以憑施行打斷事例洪武二十六年以前本部行令主事㕔㑹監察御史五軍斷事司大理寺五城兵馬指揮司官打斷罪囚二十九年令錦衣衛官與監察御史并五軍斷事司及本部官公同决斷𢎞治八年議准南京法司除决囚相視照舊㑹官其杖斷罪囚照依在京法司常例俱令地方火甲不用校尉打斷官員亦照在京事例止有御史主事二員凡本部問擬罪人犯該徒流以下罪名應的决者本部委主事一員仍㑹監察御史一員於打斷㕔公同决訖取獲批單附卷備照其奉有欽依打斷者次日早赴御前復命相視事例洪武二十五年本部原告病故監察御史同錦衣衛官相視都察院原告病故本部主事同錦衣衛官相視取獲批單附卷備照如有欺弊從相視官奏聞近例本部囚人病故㑹同監察御史相視都察院囚人病故㑹同本部主事相視錦衣衛官不預若錦衣衛囚人病故則用監察御史本部主事同徃相視其奉有欽依相視者次日早赴御前復命凡本部各司所問罪囚有在監病故情重及曽經審允者㑹各衙門相視取獲批單回照行令順天府大興縣宛平縣應天府上元縣江寜縣委官帶領仵作人等跟隨相視身屍責令土工領埋其情輕囚犯病故者止許該縣委官相埋各取具該縣委官人等結狀繳報除撥官吏諸司職掌凡本部十二部遇有除到官員并撥到吏典北平部掌行將年籍鄉貫住址備細脚色開供明白明立文案遇有官吏陞除調用及事故即便作缺行移吏部除撥㑹計粮儲諸司職掌凡本衙門官吏人等合用俸給每嵗㑹計若干移咨户部定撥粮長到部送納劄付福建部并委官眼同依數交收在倉隨即出給倉鈔付納戸收領候齊足出給通關一樣三本交付粮長收領仍將收過米數通咨戸部知數月支俸給諸司職掌凡本部官吏人等俸給食米每月各部照磨所將各官吏人等分豁舊管收除實在并合支俸給食米數目開付福建部本部查理無差明立文案將前項數目案呈本部劄付該管主事於堂上關領鎻匙於月初開倉仍出給半印勘合將合支米數填冩明白責付各官家人收領放粮主事於原奉劄付内查照相同然後附簿放支事例本部每月終委官具放過粮數赴户部註銷及折俸銀絹布貨仍係福建清吏司掌行如前㑹計支給明㑹典卷一百三十三
