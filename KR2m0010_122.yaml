body:
  text: 明會典卷之一百二十二兵部十七馬政國朝馬政有太僕苑馬寺専理而統於本部其見於諸司職掌者有四曰廄牧關換折糧收買其餘印俵等項各有事例今具列於後若內廄馬匹則掌於御馬監云廄牧諸司職掌凡太僕寺所屬十四牧監九十八羣専一提調牧養孳生馬騾驢牛其養戶俱係近京民人或五戶十戶共養一匹每騍馬嵗該生駒一匹若人戶不行用心孶牧致有虧欠倒死就便著令買補還官每嵗將上年所生馬駒起解赴京調撥本寺每遇年終比較或羣監官員怠惰或人戶姦頑致有馬匹瘦損虧欠數多依例坐罪計開太僕寺所屬見本衙門南京太僕寺所屬見本衙門遼東太僕寺所屬定遼左衛定遼右衛定遼中衛定遼前衛定遼後衛鐡嶺衛東寧衛瀋陽中衛海州衛蓋州衛金州衛復州衛義州衛遼海衛三萬衛廣寧左屯衛廣寧右屯衛廣寧中屯衛廣寧前屯衛廣寧後屯衛廣寧衛廣寧左衛廣寧右衛廣寧中衛寧逺衛遼東苑馬寺所屬永寧監清河苑山西行太僕寺所屬太原左衛太原右衛太原前衛平陽衛鎮西衛汾州衛安東衛振武衛朔州衛潞州衛保德州千戶所山陰千戶所沁州千戶所寧化千戶所馬邑千戶所陜西行太僕寺所屬平涼衛慶陽衛秦州衛固原衛陜邑苑馬寺所屬長樂監開成苑安定苑弼隆苑革廣寧苑黑水苑添靈武監清平苑萬安苑定邊苑慶陽苑同川監已下四監俱革天興苑永康苑嘉靜苑安勝苑威逺監武安苑隴陽苑保川苑泰和苑熙春監康樂苑鳯林苑香泉苑會寧苑順寧監雲驥苑升平苑巡寧苑永昌苑甘肅行太僕寺所屬甘州左衛甘州右衛甘州中衛甘州前衛甘州後衛永昌衛涼州衛莊浪衛鎮畨衛山丹衛西寧衛肅州衛古浪千戶所鎮夷千戶所莊浪千戶所甘肅苑馬寺所屬已下俱革甘泉監廣牧苑麒麟苑溫泉苑紅崖苑祁連監西寧苑大通苑古城苑永安苑武威監和寧苑大川苑寧畨苑洪水苑安定監武勝苑永寧苑青山苑大山苑監川監暖川苑坌水苑巴川苑大海苑宗水監清水苑美都苑永川苑黑城苑事例洪武二十八年革羣監官令有司提調孳牧江南一十一户共養馬一匹江北五户共養一匹內丁多之家充馬頭専一養馬餘令津貼錢鈔以備倒失買補之用不許輪流有仍前輪流及令孤寡殘疾一槩出辦者發邊衛充軍如馬頭家生畜不旺許令於貼戶家看養凡貌馬一匹配騍馬四匹為一羣立羣頭一人五羣立羣長一人每羣長下選聰明子弟二三人習學醫獸看治馬匹凡補領或孳生三嵗騍駒每二年納駒一匹永樂十年令北直𨽻土民領養孳生馬匹十三年定例每十五丁以下養馬一匹十六丁以上養二匹為事編發者七戶養一匹除其罪為良民十四年令北方人戶五丁養馬一匹免其糧草之半每馬十匹立羣頭一人五十匹立羣長一人十五年定南方養馬例江北每五丁養馬一匹江南十丁養馬一匹凡種馬倒死孳生不及數例應陪償而遇災荒每羣聽以三分之一納鈔入官二十二年令民養官馬者二嵗納駒一匹宣德三年奏準北直𨽻每三丁養騍馬一匹二丁養貌馬一匹免糧草之半貌馬病同羣共治死則均陪若因走失及别故致死者止追本戶四年令山東兖州濟南東昌三府領養孳生馬每五丁養騍馬一匹三丁養貌馬一匹不在免糧之例正統十一年命河南彰德衛輝開封三府照例領養孳生馬匹景泰三年奏準凡貌馬十八嵗以上騍馬二十嵗以上免其算駒天順三年奏準原編孳牧馬頭有消乏者改作貼戶成化元年令孳生馬每三年騍駒一匹三年奏準復二年騍駒一匹額外多餘者官為收買别給空間人戶四年奏準羣長每五年一替八年奏準各處醫獸每州定設二名每縣一名嵗終更替十三年奏準養馬人戶每十年一次審編先上戶次中戶單丁寡婦不許槩僉二十一年奏準凡補領騍駒作種者二年後方與算駒𢎞治二年奏定鳯陽廬揚三府滁和等州孳牧牛共五千隻母牛三千七百隻犍牛一千三百隻六年奏定兩京太僕寺種馬額數貌馬二萬五千匹騍馬十萬匹共十二萬五千匹每二年照例納駒其駒更不搭配於內揀選備用及補種馬之闕其餘賣銀貯庫遇備用不敷量支買補種馬每三年揀選一次老病不堪者賣銀入官撥駒補數北直𨽻河間大名保定順德廣平真定永平七府免糧養馬每地五十畝領貌馬一匹百畝領騍馬一匹共貌馬一萬六百九十五匹騍馬四萬二千七百八十匹山東濟南兖州東昌三府河南開封衛輝彰德三府計丁養馬每五丁領貌馬一匹十丁領騍馬一匹共貌馬六千八百五匹騍馬二萬七千二百二十匹南直𨽻應天鎮江太平寧國廣德五府州每十丁領貌馬一匹十五丁領騍馬一匹共貌馬一千九百九十九匹騍馬七千九百九十六匹鳯陽揚州淮安廬州四府滁和二州滁州一衛每田二頃領貌馬一匹三頃領騍馬一匹內滁州衛遞加一頃共貌母五千五百一匹騍馬二萬二千四匹九年奏準凡牧馬處所有田去馬存丁消息馬在者應牧馬匹改給得業之人及丁多之人領養逃絶免糧田地給與同羣管業不許典賣與人其一馬兩嵗連生二駒者除納官外聽其自用已上民間孳牧凡在京在外衛所俱有孳牧馬匹以給官軍騎操之用在京及南北直𨽻衛所屬兩京太僕寺在外屬各該行太僕寺苑馬寺及都司委官提督每衛委指揮一員所千百戶一員専管孳牧其搭配科駒起解比較等項悉照民間事例洪武二十三年令飛熊廣武英武等衛每五戶養馬一匹永樂十四年令薊州山海諸衛屯軍每人養種馬一匹免納子粒宣德七年令法司及陜西布按二司雜犯死罪應充軍者發陜西行太僕寺養馬正統六年令征戰走傷馬匹驗視明白分給各衛守城官軍牧養遇倒死埋瘞成化七年奏準天下衛所孳牧馬匹有埋沒者俱照原額買補令軍餘朋合領養已上軍衛孳牧正統十四年令順天府所屬州縣寄養各處起解備用馬匹照北直𨽻事例論銀分俵其本府各州縣原領孳生種駒改撥直𨽻永平等府空間人戶其備用馬嵗取二萬匹北直𨽻河南山東取七分南直𨽻三分俱限八月以裏解部發太僕寺驗印給俵或遇法司送到贓罰入官馬牛驢騾驗堪用者亦照此例成化二年奏準南直𨽻起解寄用備用馬有矮小不堪及不足數者每匹徴銀十兩解部發太僕寺收貯以備收買二十一年奏準南京太僕寺所屬地方備用馬匹從各府州縣徑解北京交俵如有拖欠及補完之數仍行南京太僕寺照查𢎞治三年會議備用馬匹嵗取一萬匹直𨽻河南山東并南直𨽻徐州所屬俱解本色內永平府折色本色中半廬州鳯陽三府滁和二州解本色七分折色三分淮揚二府應天江浦六合二縣解本色四分折色六分應天府上元等縣鎮江太平寧國所屬俱解折色凡寄養馬倒死告官給印信文帖相視開剝如無文帖而開作倒死者以盜賣論已上京府寄牧洪武二十三年令五軍都督府錦衣旗手虎賁左右興武鷹揚金吾前後羽林左右龍驤豹韜天䇿神䇿府軍左右前後等衛各置草場於江北湯泉滁州等處牧放馬匹二十五年罷民間嵗納馬草凡軍官馬令自養軍士馬令管馬官擇水草豐茂之所屯營牧放三十年定北邊牧馬草場自東勝以西至寧夏河西察罕諾爾東勝以東至大同宣府開平又東南至大寧又東至遼東又東至鴨緑江又北去不止幾千里而南至各衛分守地又自雁門關外西抵黃河渡河至察罕諾爾又東至紫荆關又東至居庸關及古北口又東至山海衛凡軍民屯種田地不許牧放其荒間平地及山場腹裏諸王駙馬及軍民聽其牧放樵採在邊所封之王不得占為己場妨害軍民永樂二十二年令戶部錦衣衛各委官查勘五府牧馬草場有妨占民田處所另撥官地與民為業永樂以後錦衣旗手府軍左金吾左右大興左羽林燕山左右前忠義左右前後義勇左右中中前後神武左後大寧中武成中寬河會州蔚州龍驤富峪裕陵茂陵等三十一衛五軍三千神機等營各置草場於順天保定等府宛平大興等縣牧放騎操馬匹每嵗春末夏初各營馬匹除例該存留聽用外其餘本部推舉坐營官一員具奏請敕管領下各該草場牧放至九月終回營其收馬每三日演習一次下場之後本部行移該科及都察院具奏差官點閘馬匹倒死官軍逃亡領敕官按月造報如有納賄賣間不行提督致馬瘦損者點閘官指實參奏其在邊者以四月中出牧九月初回營成化四年令北直𨽻京師附近係官草場不許內外官豪勢要妄指求討托故投獻違者許科道官紏劾及各衙門追究治罪六年令德州天津各衛逃故軍人遺下草場為附近軍民盜耕布種者退還官每畝量追花利草三十束不願者每束納銀三分準作逺地拖欠之數照依時價支給京操上直官軍買草餵馬以後年分但有拖欠草束俱照例準折十年令陜西榆林等處近邊地土各營堡草場界限明白敢有那移條欵盜耕草場及越出邊墻界石種田者依律問擬追徴花利完日軍職降調甘肅衛分差操軍民係外處者發榆林衛充軍係本處者發甘肅充軍有毁壞邊墻私出境外者枷號三箇月發落𢎞治九年令給事中御史並戶兵二部委官清查各衛草場有草未墾去處仍舊牧馬已墾成田者照畝收銀解送兵部轉發太僕寺寄庫聼候買馬又令錦衣衛草場地畝徴收租銀許本衛收貼貼補馬草已上營衛放牧洪武榜例凡倒失馬匹從民議和或一縣或三五羣長輳價買補三嵗以上八嵗以下高四尺以上堪中馬匹還官聽候驗印作數違錯及遲延者一體追駒宣德二年令民間起解備用馬中途瘦死及邊軍孳牧倒死者俱免陪補天順二年奏準各營騎操馬遇有倒死者告官相剝坐營官責限該軍朋合買補走失被盜一例追陪成化元年令各處買補孳生馬駒有司四匹軍衛五匹折買堪操騸馬一匹以充備用例後倒失者騍駒三匹貌馬二匹各折買騸馬一匹騍駒每二匹折買貌馬一匹七年奏準各衛軍餘關領馬匹倒死以物力等第出銀每馬一匹上戶出銀三兩中戶二兩下戶一兩餘以屯田子粒銀貼湊買補十三年奏準京營馬隊官軍朋合出銀遇馬匹倒失貼助買補凡馬主係都指揮者出銀三兩指揮二兩五錢千百戶鎮撫二兩旗軍一兩五錢走失被盜者各加五錢謂之樁頭其朋合每嵗以六箇月為率每月都指揮出銀一錢千百戶鎮撫七分旗軍五分在外各邊悉照此例凡各營下場及各邊倒失買補馬匹不及八分者領敕及把總管隊官住俸追買其在京不下場者以五分為則𢎞治二年奏準買補騎操馬匹須四嵗以上八嵗以下價自十二兩至十五兩官軍自願添價收買者聼三年令寄養備用馬倒死買補不及五分者掌印管馬官俱住俸追補六年奏準各營朋合買馬銀兩不敷每馬一匹聼支草場租銀三兩貼助九年奏準各處倒失馬駒應買補者遇孳生蕃息之時量徴價銀解京以備各邊買馬之用大馬一匹徴銀五兩駒一匹倒失者徴銀三兩虧欠者二兩凡騎操馬匹原領者以承領日為始買補者以印烙日為始計在十五年外許賣銀納官另給其未及十五年而病者亦準賣仍追本身樁頭銀貼價買補凡各營馬買補三分不完者把總等官住俸一月四分以上兩月五分以上三月坐營官通計三分不完者住俸一月五分以上兩月凡府州縣買補馬匹不及五分者正官住俸一月不及四分者兩月不及三分者三月京縣不拘多寡止住一月其管馬官不及五分者全住凡孳生種駒已有六年會議定額其各處議合買馬銀兩通行停止有司官吏分毫不許擅科已上買補凡孳生備用騎操折易并進納馬匹俱印烙以防姦弊其孳生及陪納馬駒應交俵者印訖差官照依地方日期將空間增出人丁俵散領養造册具奏其各處印中備用馬匹徑解本部發太僕寺交納以慿散俵洪武舊例江南馬每年三月初一日赴南京牧馬千戶所印俵江北馬每年三月十五日赴南京太僕寺印俵凡孳生駒用云字小印俵散作種用大印給軍騎操者再用云字印宣德八年奏準江北陪補馬駒俱從南京太僕寺印烙正統四年奏準應天鳯陽等處孳生陪補馬駒南京太僕寺官同南京兵部委官及御史分投印俵九年奏準鎮江府所屬地方馬匹於本府應天府所屬於牧馬千戶所太平寧國廣德州所屬於太平府印俵成化十六年奏準凡馬非經官印驗者不收二十一年奏準買補備用免其用印止令起解以備選擇𢎞治二年奏準孳牧備用牛每三年一次差官印烙四年奏準凡印烙馬匹民馬照舊印左給軍則印右如京營邊關馬無右印即係盜買民間官馬追究問罪六年令孳生貌駒看驗不堪及騍駒多餘者俱免印烙從其變賣以充買補備用之數九年令孳生駒齒少力強而不及四尺以上者亦聽印俵凡解俵馬以百匹為率退三十匹以上者該管寺丞參問凡印馬官舊例本部請旨點差公侯伯或駙馬一員本部委官一員景泰間革去侯伯等官差御史二員同兩京太僕寺分管寺丞印俵天順初復差公侯伯及御馬監內官一員成化以來革去內官侯伯每嵗九月中請旨差御史二員同該管寺丞分行印俵已上印俵洪武榜例各衛所府州縣管馬官員職専提調馬匹不許管署衛所府州縣事務及别項差占永樂十一年令御史同錦衣衛官巡視官軍放牧馬匹宣德四年禁官軍人等不許將官馬間時帶鞍坐馱載物件兩人共騎及婦人騎坐違者御史給事中同錦衣衛官拏送本部罰馬一匹仍送法司問罪凡盜賣官馬者追罰馬二匹知情和買牙保鄰人各罰馬一匹宰殺及偷買官驢者亦照此例首告者於犯人名下追鈔五千貫充賞凡巡馬官每三月一換七年令外衛官軍原領騎操馬匹下班之日不許帶回九年命兵部官同御史給事中點視征操馬匹借點及借與者共追馬一匹馬無見在及隱瞞不報者查追仍勘其冒支草料加倍追納天順二年令官軍人等強奪起解馬匹者問罪罰馬一匹仍枷號一箇月成化元年令下班官軍應充馬匹而私自騎回者罰馬一匹四年令官軍勇士私賣官給草料致馬匹瘦死者巡綽官緝拏並買主送問六年令管軍官將官馬撥送與人跟隨迎送或識字人騎占聽候並賃借與人致令傷死者問罪照宣德四年例罰馬入官在外各邊並照此例十年奏準各處解馬赴京有兜攬價直將老馬攙雜驗印者事發俱問罪發邊衛充軍其起解馬除例應折納外有齎價赴京通同收買者問罪𢎞治二年奏準官司借用寄養馬二匹者罰一匹五匹者罰二匹年終分管寺丞具有無追罰數目奏報三年奏準管軍內外官私占官馬及借撥與人者五匹以下降一級以上降二級俱發邊衛立功借者一體論罪凡把總等官剋減官馬草料者計贓滿貫發邊衛立功滿日就彼帶俸盜賣者發瞭哨買至料豆十石以上者充軍凡寄養馬除年老外其餘作踐成疾不堪給軍者原領人戶追罰銀二兩盜賣三匹以上者充軍知情和買者民發擺跕軍發邊方瞭哨五年奏準各邊軍民將不堪馬匹設計中賣及管軍官以私馬俵與軍士多支官價者官軍調邊衛帶俸食糧民及餘丁附近充軍通同作弊者枷號一月發落九年令借撥官馬至瘦損倒死州縣五十匹府二百匹以上借者及管馬官各降一級十年令管馬官撥借官馬馱載圍獵者五匹以下罰馬一匹以上罰二匹十匹以上罰三匹傷死者五匹以下降一級六匹以上降二級馬各抵數追償十四年奏準官軍關支馬料委官一員管領若縱容盜賣者發邊衛立功滿日就彼帶俸買者問罪畢日枷號一箇月發落已上禁約洪武榜例凡管馬官吏時常下鄉提督看驗馬匹要見定駒若干顯駒若干重駒若干明白附寫以俟太僕寺官出巡比較正月至六月報定駒七月至十月報顯駒十一月至十二月報重駒凡季報原領馬為舊管買補孳生為新收事故交俵等項為開除季終為實在春季三月二十四日五夏季六月二十四五秋季九月二十四五冬季十二月二十四五徑送太僕寺類繳其有生質竒異與種馬不同者明白申報凡比較點馬文簿要開原領孳生貌騍馬數分豁該算駒者若干不該算駒者若干已生及未生者若干原馬齒色及所生駒毛色逐一開報凡倒失種馬虧欠馬駒俱在年終完備如是不完府州縣正佐首領官吏決杖二十管馬官吏加等痛治凡管馬官有闒茸貪汚害民者分管及所在掌印官開奏以除民害永樂三年令衛所孳牧騎操馬匹每三年一次造册管馬官齎執赴京比較成化二年奏準管馬官三年任內孳生不虧者稱職額外多生者量加旌擢不及額至百匹者降用分管寺丞以所屬課額虧損遞為黜陟凡京營及各邊騎操馬匹専差太僕寺少卿一員無太僕寺去處從巡撫並分巡官比較如有倒失限三月以裏督令陪償七年奏準府州縣掌印首領官任內馬匹虧欠孳養不增者九年不準給由措置完日與管馬官一體降用衛所掌印官馬數不完許分管寺丞與本部委官一體比較十三年奏準各營各邊每年四月十月二次將原領事故買補馬匹數目具奏以慿比較十四年奏準比較馬政兩京府尹府丞聼納米贖罪𢎞治二年奏準每二年差太僕寺少卿二員南京太僕寺少卿一員分往北直𨽻河南山東南直𨽻地方比較該納馬駒每嵗終分管寺丞具管馬官賢否呈部六年之內馬匹無虧者量加旌擢以外虧損數多照例黜罷三年順天府所屬寄養馬匹専差太僕寺少卿一員比較四年奏準衛所騎操馬免比較其有孳牧去處照例每三年委官赴部比較凡虧欠埋沒違限等項參奏提問凡遼東陜西苑馬寺孳牧馬匹每三年一差官點閲其各行太僕寺苑馬寺於內府關領精微文簿將騎操孳牧馬匹逐一填寫繳部送內府交收計每年比較地方太僕寺所屬南京太僕寺所屬計三年比較地方遼東苑馬寺所屬山西行太僕寺所屬陜西行太僕寺所屬陜西苑馬寺所屬甘肅行太僕寺所屬南京應天衛南直𨽻宣州衛山東濟南衛平山衛登州衛寧海衛成山衛鰲山衛靈山衛安東衛威海衛大嵩衛濟寧衛臨清衛靖海衛竒山千戶所寧津千戶所海陽千戶所膠州千戶所諸城千戶所東平千戶所肥城千戶所浙江盤石衛海寧衛江西袁州衛饒州千戶所廣東雷州衛廉州衛四川成都衛成都中衛建昌衛建昌前衛寧畨衛越巂衛會川衛鹽井衛湖廣武昌衛武昌左衛靖州衛五開衛沅州衛九溪衛長沙衛清浪衛黃州衛銅鼓衛永定衛蘄州衛平溪衛永州衛衡州衛辰州衛嶽州衛沔陽衛常德衛鎮逺衛偏橋衛施州衛澧州千戶所荆州衛荆州左衛荆州右衛襄陽衛安陸衛房縣千戶所竹山千戶所枝江千戶所長寧千戶所瞿塘衛夷陸千戶所德安千戶所忠州千戶所雲南雲南左衛雲南右衛雲南中衛雲南前衛雲南後衛廣南衛曲靖衛六涼衛平夷衛越州衛臨安衛楚雄衛洱海衛大理衛大羅衛蒙化衛景東衛瀾滄衛金齒衛騰衝衛楊林千戶所馬隆千戶所木密關千戶所宜良千戶所安寧千戶所易門千戶所已上比較關換諸司職掌凡官軍關撥馬匹操練行移到司須要該衛官吏保結關馬官軍原有馬匹下落果係曽經征進慣戰人數及無馬匹方才具奏關撥後有事故該衛拘收還官其官軍人等奉旨關撥馬匹亦須備知數目事例洪武間凡各衛原關馬騾驢轉名銷號若係御馬監關領者該府各衛自具手本赴監轉名銷號如是典牧所太僕寺關領之數各府衛取勘明白本部轉行太僕寺典牧所銷號永樂四年令管步軍官告關領者不準有騍馬與兒馬願換者聼宣德四年置給馬勘合每關馬一匹給勘合一道填寫齒色年月付領馬之人收執遇倒死等項陳告注寫應償者追視齒色附簿開注勘合與馬如前收領再有事故照例償給如領馬之人收領凡應償者仍赴御馬監印烙然後給與正統四年奏準官軍領馬騎操必行本衛造册送部並太僕寺外衛操備者行該府造册關領天順元年奏準各營外衛官軍原領騎操馬匹下班之日兊與在京官軍該管官造册送部二年奏準官軍領馬太僕寺具俵過數目毛齒及官軍姓名年月行各衛造册送部如關領數多開報數少或倒失轉交隱匿不報者諸司人首告拿問成化二年令勇士馬倒死二次者不許重關照京營例追補𢎞治元年奏準南京官軍應關馬匹在江北者赴南京太僕寺給領在江南者本寺委官一員赴南京給散四年奏準領馬官有不照次第混亂爭奪者參究法司問罪罰馬一匹就給本身騎操以後更不關給七年奏準官軍應關馬匹貌馬自八嵗以上騸馬十二嵗以上别無傷殘者並準給領各衛及邊關亦照此例凡各邊缺馬騎操奏關銀兩收買者本部委官一員同大僕寺官於收貯馬價內照數支出差官運赴鎮巡官處交收凡騎操馬老病當關給者原馬送光祿寺支用折糧諸司職掌凡各處起解折糧馬匹到部須令獸醫辨驗明白具奏送御馬監交收事例洪武中各處土官衙門秋糧各依原認數目折納馬匹有糧二十五石有餘折馬一匹者有五十餘石折馬一匹者馬或不堪責令差來土官陪納收買諸司職掌凡官給價鈔於各處收買并茶易到馬匹或就彼處給軍騎坐或起解赴京交納須知其數事例洪武中立茶馬司於陜西四川等處聽西畨納馬易茶降金牌信符賜畨簇以防詐偽每三年一差官召各畨合符以應納差發馬交納易茶有以私茶出境者斬關隘不覺察者處極刑民間畜茶不得過一月之用茶户私鬻者籍其園入官二十三年定茶易馬例上等馬每匹一百二十斤中等馬每匹七十斤下等馬每匹五十斤永樂十三年遣御史三員巡督陜西茶馬正統十四年停止茶馬金牌後每嵗遣行人四員巡察私販自潼關以西至甘肅等處通行禁革成化十四年奏準定差御史一員領敕專理茶馬每嵗一代其易馬須四嵗以上六嵗以下髙大堪中者方準收買貌騸馬就彼給各邊騎操騍馬送苑馬寺孳牧如有縱容軍民通同賣老病馬匹者御史同兵備及苑馬寺官驗視退回仍指實參奏𢎞治十年奏準茶易馬除就彼給軍外其餘差官陸續解赴苑馬寺交割俵養已上西畨茶易內府供應事例凡壩上諸馬房各有乳馬以供上用膳羞如有老疾倒死本部奏行太僕寺撥補永樂舊例每嵗于陜西茶易馬及孳生馬內選取堪中騍馬送御馬監分送各馬房領牧以便取乳天順元年奏準嵗選孳牧騍馬五百匹成化九年定取初生騍馬每年一百匹𢎞治九年奏準每嵗取五十匹力士校尉諸司職掌凡力士校尉俱係隨駕人數於民間丁多相應人户內僉點有力精壯無過犯體氣之人應當皆撥錦衣旗手等衛著役如有事故即照原籍另户僉補如解到部照依所補姓名送發該衛果係在逃正身就送該衛發落若正身不獲解到户丁照地方發遣充軍仍挨勾正身事例凡力士舊隸旗手衛今亦隸錦衣及騰驤四衛校尉止隸錦衣衛凡力士校尉係民間僉充者例不勾丁如有老疾聽于嵗終具告本部行該衛勘明具奏釋放若逃回疾故或老疾不堪者仍勾其户丁補當一輩若係原祖充當而在逃者發册清勾到部送問發衛著役原逃事故解到户丁補役者發衛查收凡四丁抽僉者病故俱勾補凡力士校尉病故或老病不能應當其子孫告替補者行移該衛查係在營生長册籍有名無遺礙者具奏收役雖例不勾丁而子孫願替補者亦準查收凡民人投充力士校尉者行原籍官司查無違礙方準收役凡人材不識字者改充力士校尉女户欽升官員子孫例無承襲者將軍子試量身力不及者俱收充校尉凡遇親王出府行錦衣衛撥隨侍校尉六百名郡王出閣行各該護衛撥校尉三十名無護衛于各衛軍餘及民間僉點其將軍以下撥儀從二十名不得用校尉𢎞治七年奏準親王隨侍校尉至就國之日聽以一半從行于附近衛所撥軍餘補數其一半存留在京以備各王出府聽用凡各王府校尉除欽賜外其民間投充者止免差役不許支糧十三年奏準凡校尉事故須籍册內親子弟姪替補若將别姓詐冒替補者問罪官旗調外衛差操冒替之人亦調衛充軍凡校尉犯該一應姦盜搶奪􅫬騙恐嚇求索枉法不枉法等項罪名俱係行止有虧者俱調衛充軍凡詐冒校尉巡捕名色占宿公館妄拏平人嚇取財物生事扇惑擾害軍民者除真犯死罪外其餘俱枷號一箇月發邊衛充軍所在軍衛有司驛遞等衙門阿從故縱者各治罪明會典卷一百二十二
