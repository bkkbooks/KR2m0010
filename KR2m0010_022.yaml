body:
  text: 明會典卷二十二户部七諸司職掌凡各處有司十年一造黃册分豁上中下三等人户仍開軍民竈匠等籍除排年里甲依次充當外其大小雜泛差役各照所分上中下三等人户點差明令凡民年八十之上止有一子若係有田産應當差役者許令雇人代替出官無田産者許存侍丁與免雜役憲綱仰本府州縣嚴督所屬凡有一應差役須於黃册丁糧相應人户內從公點差周而復始毋致放富差貧作弊擾民事例洪武三年令各處軍民凡有未占籍而不應役者許自首十七年令各處賦役必驗丁糧多寡産業厚薄以均其力違者罪之十八年令有司第民户上中下三等為賦役册貯於廳事凡遇徭役取驗以革吏弊二十一年令稅課司局巡攔止取市民殷實户應當不許僉點農民二十四年令寄莊人户除里甲原籍排定應役其雜泛差役皆隨田糧應當令在外布政司按察司府州縣官俱給官錢買馬市民輪流看養三十一年令各都司衛所在營軍士除正軍并當房家小其餘盡數當差正統五年令各府州縣每嵗查見在人户凡有糧而産去及有丁而家貧者為貧難户止聽輕役景泰元年令里長户下空間人丁與甲首户下人丁一體當差若隱占者許甲首首告令各處有司馬夫二十丁買馬十丁養馬俱於市民內僉充成化六年令有司馬夫不許占役丁多富户及辦納月錢十五年令各處差徭户分九等門分三甲凡遇上司坐𣲖買辦採辦務因所𣲖多少定民輸納不許隔年通徴銀兩在官𢎞治元年令各處審編均徭先查該年人户丁田分為等第止編本等差役不許分外加增餘銀若貧難下户并逃亡之數聽其空間亦不許預收餘銀負纍見在里甲凡額外濫設差役盡行革罷如違聽巡撫巡按官紏舉不舉者坐罪鎮守衙門不許干預均徭又令在京事故校尉力士幼軍厨役隨住人口照回當差其有在京潛住冒頂軍匠者遞回四年令各處郡王受封之後若有入繼親王并病故無後者原撥校尉悉發有司聼差不許容隱占用五年令順天府所屬人民有私自投充陵户海户及勇士校尉軍厨躲避糧差者除本役外其户下人丁照舊納糧當差七年令布按二司及各府官馬夫於所屬州縣各僉中等三丁人户十户共出銀四十兩解送掌印官處分給各官自行買馬餧養其州縣者於隔别府分僉充亦徴銀解送各掌印官分給買馬餧養十三年奏準各布政司并直𨽻府州掌印官如遇各部𣲖到物料從公斟酌所屬大小豐歉坐𣲖若豪猾規利之徒買囑該吏妄稟偏𣲖下屬承攬害民者俱問發附近衛所充軍各該掌印官聽從者參究治罪明令凡民間寡婦三十以前夫亡守志者五十以後不改節者旌表門閭除免本家差役事例洪武元年詔民年七十之上者許一丁侍養免雜泛差役四年令免闕里孔氏子孫二十六户徭役令各府縣軍户以田三頃為率稅糧之外悉免雜役餘田與民同役七年令山東正軍全免差役貼軍免百畝以下餘田與民同役又令官員亡故者免其家徭役三年十三年令六部都察院應天府并兩縣判祿司儀禮司行人司隨朝官員除本户合納稅糧外其餘一應雜泛差役盡免又各處功臣之家户有田土除合納糧草夫役其餘糧長里長水馬驛夫盡免鳯陽揚州二府及和州民畜養馬一匹者免二丁十六年令鳯陽臨淮二縣民免雜泛差役二十七年令浙江鹽丁免雜泛差役永樂八年令各處軍衛有司軍匠在京充役者免家下雜泛差役九年令自願徙北京為民及免杖而徙者免徭役五年徒流而徙者免徭役三年二十三年令天壽山種樹人户免雜泛差役宣德元年令天地壇壇户免雜泛差役二年令各處竈户免雜泛差役三年令迤北回還軍餘民人收充御馬監勇士者免其原衛原籍户下人丁差役四年令各衛所軍每一名免户下一丁差役若在營有餘丁亦免一丁供給正統元年令在京文武官員之家除里甲正役外其餘一應雜泛差役俱免凡先聖子孫流寓他處及先賢道國公周敦頥豫國公程皓洛國公程頥溫國公司馬光徽國公朱熹之嫡𣲖子孫所在有司俱免差役四年令雲南土馬軍自備鞍馬兵器糧食聽征者免本户差役四丁六年令陜西土軍優免五丁餘聽科差七年令天文生隂陽生俱免差役一丁其陜西土軍土民餘丁若户丁有在邊操備者亦免雜泛差役十年令監生家免差役二丁十一年令交址老疾致仕官員遺下妻子家人許於所在有司入籍不拘丁數俱待本官故後三年當差子孫家小入籍者撥田耕種亦待三年後當差十二年令雲南土官四品以上優免一十六丁五品六品一十二丁七品十丁八品九品八丁雜職六丁其餘人丁俱另立籍與民一體當差景泰元年令各處操備民壯户內每名免三丁雜泛差役成化二年令宛平昌平二縣墳户免雜泛差役𢎞治元年奏準親王王親雜役免二丁郡王王親一丁鎮國等將軍夫人親父一丁昌平縣墳户等户免三丁不許全户優免又令京城火夫御馬監養馬勇士除本身免二丁其餘與不係養馬者見丁編當尚膳監光祿寺厨役將軍力士轎夫旗校寡婦吏典并御用監司禮監銀作局髙手匠役俱免本身其餘見丁編當軍民諸色人等并賃房諸色人等見丁編當凡火夫總甲一年一次以有抵業行止者充當十三年令免光祿寺酒户差役二丁其有消乏者除豁僉補十五年令陵户海户墳户廟户壇户園户瓜户果户米户藕户窯户羊户每户俱量留二三丁供役其餘丁多者悉查出當差如有投充影射者發邉逺充軍諸司職掌凡民間男女嫁娶不許同姓及尊卑親屬相為婚姻違者律有常憲明令凡嫁娶皆由祖父母父母主婚祖父母父母俱無者從餘親主婚若夫亡携女適人者其女從母主婚若已定婚未及成親而男女或有身故者不追財禮其定婚夫作盜及犯徒流移鄉者女家願棄者聽還聘財其定婚女犯姦經斷夫家願棄者追還聘財五年無故不娶及夫逃亡過三年不還者並聽經官告給執照别行改嫁亦不追財禮凡招壻須憑媒妁明立婚書開寫養老或出舍年限止有一子者不許出贅如招養老女壻者仍立同宗應繼者一人承奉祭祀家産均分如未立繼身死從族長依例議立凡男女婚姻各有其時或有指腹割衫襟為親者並行禁止教民榜文一鄉里人民貧富不等婚姻死喪吉凶等事誰家無之今後本里人户凡遇此等互相賙給且如某家子弟婚姻其家貧窘一時難辦一里人户每户或出鈔一貫人户一百便是百貫每户五百便是五十貫如此資助豈不成就日後某家婚姻亦依此法輪流賙給事例洪武五年令蒙古色目人氏既居中國許與中國人家結婚姻不許與本類自相嫁娶違者男女兩家抄沒入官為奴婢其色目竒徹自相婚姻不在此限永樂四年詔北京山東等處人民流移各處趂食有將女憑媒禮嫁在處人民為妻已生男女者保勘明白仍許完聚不必發回原籍正統四年令武職不得與所管旗軍結婚十一年令雲南四川貴州所屬宣慰宣撫安撫長官司并邉夷府州縣土官衙門不分官吏軍民其男女婚姻皆依朝廷禮法違者罪之𢎞治二年令有訐告服內成婚者如親病已危從尊長主婚招壻納婦罪止坐主婚免離異若親死雖未成服輒婚配仍依律斷離異諸司職掌凡民間須要講讀大誥律令敕諭老人手榜及見丁著業牌面沿門輪遞務要通曉法意仍仰有司時加提督教民榜文一民間子弟七八嵗者或十三嵗者此時欲心未動良心未喪早令講讀三編大誥誠以先入之言為主使知避凶趨吉日後皆稱賢人君子為良善之民免貽父母憂慮亦且不犯刑憲永保身家憲綱凡國家律令并續降條例事理有司官吏須要熟讀詳玩明曉其意監察御史按察司官所至之處令其講讀或有不能通曉者依律究治事例洪武二十一年賜天下武臣大誥令其子弟誦習二十四年令天下生員兼讀誥律二十五年詔令各處官民之家傳誦大誥三編凡遇鄉飲酒禮一人講説衆人盡聽使人皆知趨吉避凶不犯刑憲其秀才教訓子弟引赴京考試有記一編兩編或全記者俱受賞仍具賞過名數曉諭天下永樂元年令各處教官訓導依前教讀講解聽候考試其市井鄉村秀才一體用心教訓如不熟讀及聞知考試推托不赴者治罪十七年令各處軍衛有司凡洪武年間一應榜文俱各張挂遵守如有藏匿棄毁不張挂者凌遲處死成化元年奏準各處修蓋榜房將洪武永樂正統年間節次頒降榜文謄寫張挂諭衆通知四年奏準各處有司每遇朔望詣學行香之時令師生講説大明律及御製書籍俾官吏及合屬人等通曉法律倫理違者治罪明會典卷二十二
