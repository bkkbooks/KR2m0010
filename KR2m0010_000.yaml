front:
  text: 欽定四庫全書史部十三
  hash: sha256:37715509aef7f3494164bc585a87d8624d4b4517ea757749fe3b4d88b8516ad7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0010_WYG_000-1a, image: WYG0617/WYG0617-0001a.png}
body:
  text: 明會典政書類一通制之屬提要臣等謹案明會典一百八十卷明宏治十年奉敕撰十五年書成正德四年重校刋行故卷端有孝宗武宗兩序其總裁官為大學士李東陽焦芳楊廷和副總裁官為吏部尚書梁儲纂修官為翰林院學士毛紀侍講學士傅圭侍讀毛澄朱希周編修潘辰並列銜卷首然皆武宗時重校諸臣其原修之大學士徐溥等竟不列名未詳當日何意也其體例以六部為綱吏禮兵工四部諸司各有事例者則以司分户刑二部諸司但分省而治共一事例者則以科分故一百八十卷中宗人府自為一卷辨首外餘第二卷至一百六十三卷皆六部之掌故一百六十四卷至一百七十八卷為諸文職末二卷為諸武職特附見其職守沿革而已南京諸曹則分附北京諸曹末不别立條目惟體例與北京異者乃别出焉其官制前後不同者如太常司改為太常寺之類則書其舊名而注曰後改為某官其别開公署者如鴻臚寺本為儀禮司之類則書其新名而注曰本為某官其户口貢賦之盈縮制度科條之改異亦相連併載以見變通創建之由大抵以洪武二十六年諸司職掌為主而參以祖訓大誥大明令大明集禮洪武禮制禮儀定式稽古定制孝慈録教民榜文大明律軍法定律憲綱十二書于一代典章最為賅備凡史志之所未詳此皆具有始末足以備後來之考證其後嘉靖八年復命閣臣續修會典五十三卷萬厯四年又續修會典二百二十八卷今皆未見其本莫知存佚殆以嘉靖時祀典太濫萬厯時秕政孔多不足為訓故世不甚傳與乾隆四十六年四月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀明會典序朕惟自古帝王君臨天下必有一代之典以成四海之治雖其間損益沿革未免或異要之不越乎一天理之所寓也純乎天理則垂之萬世而無弊雜以人為雖施之一時而有違蓋有不可易焉者唐虞之時堯舜至聖始因事制法凡儀文數度之間天理之當然無乎不在故積之而博厚發之而高明巍然煥然不可尚已三王之聖禹湯文武視堯舜固不能無間而典制寖備純乎是理則同是以雍熙泰和之盛同歸於治非後世之所能及也自秦而下世之稱治者曰漢曰唐曰宋其間賢君屢作亦號小康但典制之行因陋就簡雜以人為而未盡天理故宋儒歐陽氏謂其治出於二其不能古若也夫豈無所自哉洪惟我太祖髙皇帝以至聖之德代前元而有天下凡一政之舉一令之行必集羣儒而議之遵古法酌時宜或損或益燦然天理之敷布神謨聖斷高出千古近代積習之陋一洗而盡焉我太宗文皇帝仁宗昭皇帝英宗睿皇帝憲宗純皇帝聖聖相承先後一心雖因時損益而率由是道百有餘年之太平端有在矣朕祗承天序即位以來蚤夜孜孜欲仰紹先烈而纍朝典制散見疊出未會於一乃敕儒臣發中祕所藏諸司職掌等諸書參以有司之籍册凡事關禮度者悉分館編輯之百司庶府以序而列官各領其屬而事皆歸於職名曰大明會典輯成來進總一百八十卷朕間閲之提綱挈領分條析目如日月之麗天而羣星隨布我聖祖神宗百有餘年之典制斟酌古今足法萬世者會稡無遺矣特命工鋟梓以頒示中外俾自是而世守之不遷於異説不急於近利由朝廷以及天下諸凡舉措無巨細精粗咸當乎理而得其宜積之既深持之既久則我國家博厚高明之業雍熙泰和之治可以並唐虞軼三代而垂之無窮必將有賴於是焉遂書以為序𢎞治十五年十二月十一日明會典序朕惟古之君天下者或創業立法或因時制宜皆有册籍以垂久逺其見於書若唐虞之世則有典謨夏有典則商有謨言周之禮制號稱大備下及漢唐宋皆有會要而唐之六典尤詳且悉我太祖髙皇帝稽古創制分任六卿著為諸司職掌提挈綱領布列條貫誠可為億萬年之大法也顧其為書作於洪武之中嵗晚年續定者雖官署名職間有更易列聖相承隨時與事因革損益代各不同而皆不失乎皇祖之意是以政化旁行重熙纍洽有前代所不及然嵗月既積簿籍愈繁分曺列署或不能遍觀盡識下至遐方僻壤閭閻草野之民蓋有由之而不知者逮我英宗睿皇帝復辟之時嘗命內閣儒臣纂輯條格以續職掌之後未底於成皇考孝宗敬皇帝繼志述事命官開局纂輯成編釐為百八十卷其義一以職掌為主類以頒降羣書附以歷年事例使官領其事事歸於職以備一代之制仍會府部院寺大小諸司靣相質訂登進於廷將欲布之天下朕嗣位之四年為正德己巳檢閲前帙不能無魯魚亥豕之誤復命內閣重加參校補正遺闕又數月而成仰惟聖祖神宗鴻猷盛烈不能盡述其大而可見者略在此書國是所存治化所著皆於此乎係比方勵精新政乙覽之餘特敕司禮監命工刻梓俾內而諸司外而羣服考古者有所依據建事者有所師法由是而綱舉目張政成化洽保斯世於無疆夫豈曰小補之哉正德四年十二月十九日校正明會典官員職名總裁字位過密無法顯示臣李東陽臣焦芳字位過密無法顯示臣楊廷和副總裁掌詹事府事資政大夫吏部尚書兼翰林院學士臣梁儲纂修翰林院學士臣毛紀翰林院侍講學士臣傅圭翰林院侍讀臣毛澄臣朱希周翰林院編修臣潘辰謄録太常寺少卿臣周文通禮部員外郎臣喬宗大理寺右評事臣方英臣鄧相臣汪麟凡例一會典之作一遵敕旨以本朝官職制度為綱事物名數儀文等級為目凡有籍册可據者先後具載其因革損益間與見行不同者亦存其舊如五軍都督府斷事官之類一本朝舊籍惟諸司職掌見今各衙門遵照行事故會典本職掌而作凡舊文皆全録而諸書所載事有相關者亦並録之若大明律已通行天下尤當遵奉故於刑部照職掌律令條下分類備載而服制圖則附於禮部一凡事有綱有目於目之中又有分類多不能悉舉則各以類書而總注其後曰已上某如已上支給之類或注於本目之下曰某事附如鐵券附之類其類注有不盡者依諸司職掌例各注于本條之下一事類綱目一依諸司職掌其後所增益職掌所未載者則增立之隨事比類各附于本條之次如改調之類一凡纂輯諸書各以書名冠于本文之上采輯各衙門造報文册及雜考故實則總名之曰事例而以年月先後次第書之或嵗久卷籍不存不能詳考者則止書年號如洪武初之類又不能詳則止書曰初曰後洪武初草創未定及吳元年以前者則總書曰國初其無所考見者不敢臆説寧闕而不備一事例出朝廷所降則書曰詔曰敕臣下所奏則書曰奏準曰議準曰奏定曰議定或總書曰令或有增革減罷者則直書之若常行而無所考據者則指事分欵以凡字别之其事繫於年或年繫於事者則連書之繁瑣不能悉載者則略之一本朝設官大抵用周制雖文武並置而政事皆歸文職故諸司職掌所載衙門惟六部都察院通政使司大理寺及五軍都督府斷事官其文武官制則分見於吏兵二部今會典義當從備故文武衙門各有職掌者逐另開具文職如宗人府之類武職如五軍都督府之類敘其建置沿革及所掌職事而事必歸之六部一衙門官職品級有定於諸司職掌之後者今仍書職掌舊文而各注其下曰後改為某衙門如太常司後改為太常寺之類某官如儀禮司正後改為鴻臚寺卿之類其另開衙門則直書後所定名而注其下曰舊為某衙門如鴻臚寺舊為儀禮司之類官職有增添改革者皆備見品級資格並存其舊而增書後所定於本品之下如都給事中增于正七品之類一六部分職而體統本同故於吏部總書建置沿革各衙門有沿革同者則書曰諸衙門悉同其各部諸司建置同者止書於吏部文選司之下更不復出一五軍都督府及六科體統皆同而分掌有異故於中府吏科總書建置沿革其職掌之異者分書於各府各科之下同者則總書於後一官制衙門諸司職掌所載具有次第今另開衙門以此為準惟詹事府職掌未載後因左右春坊司經局無所統屬而設故增于三品之列而以坊局系之儀禮司已改鴻臚寺升四品衙門添設官屬故於禮部存其舊而另開于四品之列上林苑監職掌亦未載今增於五品之列一諸司職掌所開衙門皆今之南京後兩京並置以北京為政令所出故事例悉載於是而南京衙門各開于後其見行事例有不同者則另書之一衙門官職各有統屬者皆互見如都司衛所互見兵部五府之類其文移有互相管攝者各分書其帶管衙門如户部十三司帶管衙門之類後又更易不同者各列於後如見今帶管衙門之類一各衙門事有相關者皆互見惟舉其重者詳書其餘則略不必互見者止書曰見某衙門如致仕條下事例見考功司之類其目同而事異者則各書之如户部兵部皆有賞賜之類一事有各司掌行與舊不同者今仍據諸司職掌書而注曰今歸某司如文選司吏條下舊𨽻本司掌行今歸驗封司之類於本司則增立條目而注曰今歸本司如驗封司吏條下舊𨽻文選司掌行今歸本司之類一戶口賦稅等項數目則例諸司職掌所載後有增減不同者各書於原數之後一儀注依諸司職掌例各具于本事之下惟先定者備書間有損益止書所損益者於後如朝賀條下洪武三年奏更之類其同少而異多者則别書之一郊社等項圖式諸司職掌所載皆存其舊有未備者則補繪之如在京大祀殿之類若冠服花樣等項散見于律例榜册者皆具列以示一代之制如文武品官冠服之類一在外衙門布政使司及府州縣列于戶部圖志條下按察司統於都察院故列於本院刷卷條下寺監及倉場驛遞巡檢河泊等衙門名目各以類附列如行太僕寺苑馬寺附兵部馬政條下倉場見戶部倉科條下之類其名目皆同者不復備列如儒學隂陽醫學之類一土官衙門屬吏部者列於府州縣之次屬兵部者列于衛所之次一詔敕誥旨等文不能悉載止書其事惟制辭冠辭致詞樂章等項常行而舊所未載者依諸司職掌例書之一凡各衙門職掌事重及新增者於綱目之下略敘大意以見始末一會典文字主於行事務從質實凡有司行移字樣悉因其舊其籍册紀述曽經潤飾者亦用本色字樣易之以便遵行一會典成於𢎞治十五年凡事例年月制度數目等項皆以本年為止今奉旨重校並不增入
