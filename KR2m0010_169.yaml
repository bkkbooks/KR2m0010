body:
  text: 明會典卷一百六十九太常寺國初置太常司正三品衙門設卿少卿司丞博士典簿協律郎贊禮郎司樂大祝等官職專祭祀之事洪武三年又置神牲所設廩犧令大使副使等官四年神牲所革七年設典樂二十四年設奉祀祀丞三十年改司為寺司丞為寺丞三十五年大祝革事例凡每歲祭祀日期本寺官預於舊歲十一月初一日奉天殿具奏凡每歲十二月初一日駕詣郊壇看牲本寺官與禮部官導行自後各堂上官以次看牲本寺預取職名具奏仍各具手本知會凡大祀天地先於奉先殿恭請太祖高皇帝太宗文皇帝配享前四日本寺官進祝板及銅人并上殿奏齋戒是日同禮部官詣城隍廟發咨文次日同復命凡大祀天地各壇分獻官本寺預取職名具奏請旨照定各具手本知會仍揭榜於神樂觀前通知凡時享太廟前三日本寺官進銅人并上殿奏齋戒前一日同光祿寺官奏省牲次日同復命凡祀社稷前四日本寺官進祝板銅人奏齋戒前三日同光祿寺奏省牲次日同復命凡祀山川等神前三日本寺官進銅人奏齋戒同禮部官詣城隍廟發咨文次日同復命仍同光祿寺奏省牲次日同復命凡奏齋戒日即於長安左右門出告示知會已上祭祀儀注俱見禮部祠祭清吏司職掌凡薦新品物每月本寺官於御前奏過送光祿寺供薦品物數目見禮部祠祭司凡各陵寢宫觀等處如遇祭祀供養日期合遣官行禮本寺官先期具奏凡册立册封冠婚等項祭告天地太廟社稷本寺俱先具奏至期遣官行禮凡親王之國并來京還國俱告祭于承天門外謁辭陵寢并合祀旗纛等神各有祭祀俱本寺掌行凡營造宫殿等項祭告天地山川太廟社稷后土司工立木告成及修造在京廟宇橋梁各有祭祀俱本寺掌行凡歲時旱潦及命將出師等項祭告天地山川太廟社稷俱本寺掌行計犧牲所喂養各壇每年合用牲口牛犢一百六十五隻北羊三百五十二隻山羊九十九隻豬五百口鹿二十五隻兔一百五十隻計養牲草料菉豆九百石黑豆六百五十石黃豆一百石糯稻榖二百石細草五萬包豆秸二萬五千斤計各壇每年合用香帛等項各色制帛九百五十六段降真等香三千九百五斤黃蠟三千斤木柴四萬四千七百斤鈔三十萬貫銅錢六十萬文計每年各壇合用柴炭天地壇柴二萬五千斤燒香炭一千一百斤太廟每祭柴一萬三千斤嵗暮加一千斤社稷壇每祭柴三千斤山川壇柴一萬一千斤文廟柴二千八百斤凡每年給賞樂舞生并厨役物件本寺俱先期面奏樂舞生該給淨衣布絹白綿數目具神樂觀計厨役該給濶生絹七百匹濶綿布七百匹白綿三百五十斤鈔二萬一百四十貫凡每日督令壇戶於天地壇內外巡視至天庫神庫齋宫及西天門各三名守宿并每月初二十二二十二日三次令厨役打掃殿宇等處凡本寺官吏俸糧舊於禮部帶支後奏準本寺自行收支南京太常寺事例凡每嵗祭祀孝陵三祭并行香四次懿文陵九祭五祀六祭歷代帝王廟一祭先師孔子二祭并朔望行釋菜禮中山武寧王五祭功臣廟五祭忠烈武順昭靈嘉佑王等廟五祭普濟禪師一祭真武廟二祭天妃宫二祭祠山廣惠王廟蔣忠烈王舊廟壽亭侯廟俱二祭五顯靈順廟一祭凡合用祭品香燭帛本寺庫支牛羊等牲南京犧牲所支時果豆粉等應天府買辦麵醬醋等藉田祠祭署支酒南京光祿寺支凡各處解到薦新品物計送南京光祿寺供薦正月韭菜一十斤生菜一十斤薺菜一十斤雞子三百箇鴨子三百箇二月芹菜七斤薹菜一十五斤蔞蒿七斤子鵝二十二隻三月茶笋一十五斤鯉魚二十五斤四月櫻桃一十五斤杏子一十八斤青梅二十斤王瓜一百八十箇雉雞一十隻豬二隻五月桃子一十五斤李子一十五斤又夏至李子五十斤來禽一十五斤茄子二十五箇大麥仁四斗小麥麵八十斤小麥仁五斗嫩雞二十隻六月蓮蓬一百六十箇甜瓜三十箇西瓜三十箇冬瓜一十八箇七月棗子一十二斤葡萄一十二斤雪梨二十斤鮮菱一十二斤芡實一十斤八月藕三十枝芋苖二十斤茭白二十斤嫩薑二十五斤粳米三斗粟米一斗穄米二斗鱖魚一十五斤九月橙子二十斤栗子二十斤小紅豆三斗砂糖一斤八兩鯿魚一十五斤十月柑子二十五斤橘子二十五斤山藥四十斤活兔一十隻蜜一斤十一月甘蔗一百三十根鹿一隻獐一隻鴈一十五隻蕎麥麵四十斤小紅豆一斗一升黑砂糖一斤四兩十二月菠菜二十五斤芥菜二十五斤白魚四十斤計解送太常寺轉送光祿寺供薦二月子鵝二十隻三月笋一十五斤四月青梅二十斤七月雪梨二十斤八月茭白二十斤九月橙子二十斤十月柑子二十五斤十一月甘蔗一百三十根餘月無凡本寺犧牲所牲口合用草料等物喂養計菉豆六百石黃豆二百石糯稻榖五十石稻草一萬五千包酒糟七萬五千斤米粳九百五十石麩皮九百五十石凡各壇廟等處每月本寺督令鋪排厨役打掃天地壇初二十二二十二日三次太廟初十十四二十三十日四次孝陵十三二十九日二次凡天地壇原設壇夫一十五名俱應天府屬縣僉充凡各廟廟户十廟十名帝王功臣廟三名龍江廟三名蔣忠烈王等四廟各一名天妃宫十名凡皇陵祖陵楊王墳徐王墳四祠祭署俱附籍本寺免附州縣凡皇陵朔望供祀洪武九年令用少牢凡祭功臣洪武二十年令軍官首領官陪拜凡本寺原額鋪排二十四名厨役二百四十名明會典卷一百六十九
