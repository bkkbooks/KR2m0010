body:
  text: 明會典卷一百四十刑部十五編發囚軍諸司職掌凡本部問有應合充軍者必須照依律與大誥内議擬明白大理寺審無寃枉開付陜西部本部置立文簿注寫各人姓名年籍鄉貫住址明白照依南北籍編成排甲每一小甲管軍一十名總甲管軍五十名每百户該管一百一十二名一様造冊二本將各總小甲軍人姓名年籍鄉貫住址并該管百户姓名充軍衛分注寫明白一本進赴内府収照一本同總小甲軍人責付該管百户領去充軍仍咨呈該府作數如浙江河南山東陜西山西北平福建并直𨽻應天廬州鳯陽淮安揚州蘇州松江常州和州滁州徐州人發雲南四川屬衛江西湖廣四川廣東廣西并直𨽻太平寧國池州徽州廣徳安慶人發北平大寧遼東屬衛其軍人遇有逃故該管百户具呈合干上司照籍勾補事例洪武三十五年令罪人應發充軍者皆從給事中及行人編次隊伍然後發遣凡問該充軍者在京行兵部定衛在外係巡撫有行者巡撫定衛巡按有行者巡按定衛其所屬自問者有巡撫處申呈巡撫無巡撫處巡按定撥仍抄招行兵部知會合編充軍諸司職掌販賣私鹽詭寄田粮私充牙行私自下海閒吏土豪應合抄劄家屬積年民害官吏誣告人充軍無籍户攬納户舊日山寨頭目更名易姓家屬不務生理逰食斷指誹謗小書生主文野牢子幫虎伴當直司後定合編充軍散見各衙門事例之下皂𨽻獄卒諸司職掌凡本衙門皂𨽻并司獄司㸔監獄卒山東部掌行各部將一應皂𨽻開稱本部皂𨽻若干名内跟官幾名聴差幾名直㕔幾名本部直堂幾名跟官幾名務要明立文案遇有更替本部將新僉皂𨽻取訖年籍鄉貫住址供狀分豁明白發下該部収役將得替皂𨽻令主事㕔出批送應天府給引寧家事例洪武二十三年各處觧到野牢子并幫虎小弓兵人等本部用一百名㸔囚其直堂等項皂𨽻移咨兵部添設三十五年於流罪囚人内相兼撥補永樂年間本部并各司一應皂𨽻俱係各布政司并直𨽻府分僉觧兵部移咨本部知㑹該部案令該司批送本部山東清吏司取供送發収役滿日仍送囘該部轉送寜家逃故者仍行跟捉勾補營造諸司職掌凡本衙門并司獄司堂㕔門牕書案卓椅傘杖鐵槊案衣坐褥等項并官吏公𪠘牆垣牢房遇有損壊不堪及應有營造俱係四川部掌行案呈本部移咨工部量撥囚人修造係干重務者奏聞明會典卷一百四十
