body:
  text: 明會典卷一百六十二工部十六屯田清吏司諸司職掌郎中員外郎主事掌天下屯田之政令屯種國初以軍食為重自內地及邊境荒閒田土各衛所撥軍開墾歲收子粒為官軍俸糧以省餽餉其耕種器具皆給於官而耕牛亦皆有數今備載之開墾諸司職掌凡邊防郡縣守禦去處新立衛分撥軍開墾荒田屯種須要計算頃畝數目及田地肥瘦人力勤惰務在不曠征徭不失軍餉事例見户部田土項丅農具諸司職掌凡屯種去處合用犁鏵耙齒等器著令有司撥官鐵炭鑄造發用若木植令衛軍於出産山場自行採辦造用係干動撥官物具奉施行事例永樂元年令寶源局鑄農器給山東被兵之民牛隻諸司職掌凡屯種合用牛隻設或不敷即便移文取索若官廏數多差人發遣如果路途窵遠此間地方出産可以收買務在公私兩便就給官價民間買用其孳生數目每歲年終通報計天下屯牛二十五萬五千六百六十四隻河南都司三萬六千三百一十九隻水牛二千二百四十七隻黃牛三萬四千七十二隻廣西都司九百五十隻水牛三百六十七隻黃牛五百八十三隻山東都司五千九百九十九隻水牛四百一十九隻黃牛五千五百八十隻北平都司一萬七千四百六十六隻水牛八百四十六隻黃牛一萬六千六百二十隻山西行都司黃牛一萬七千八百一十五隻山西都司黃牛九千一百四十三隻四川都司八千一百九十隻水牛六千五百二十九隻黃牛一千二百四十八隻犏牛三百二十二隻氂牛九十一隻湖廣都司四千六百六十七隻水牛三千九百三十四隻黃牛七百三十三隻廣東都司四百八十二隻水牛四百一十三隻黃牛六十九隻浙江都司二千二百四十六隻水牛一千二百五十四隻黃牛九百九十二隻江西都司四百九十九隻水牛三百六十六隻黃牛一百三十三隻陜西都司二萬七千四百六十七隻水牛四十六隻黃牛二萬六千六百八十三隻犏牛七百三十八隻雲南都司一萬五千二百八十四隻水牛九千七百八十二隻黃牛五千五百二隻貴州都司五千二百七十二隻水牛四千五百六十八隻黃牛七百四隻北平行都司一萬八千五百三十七隻水牛一萬八千五百三十四隻黃牛三隻直𨽻四萬五千八百五十隻水牛七千四百一隻黃牛三萬八千四百四十五隻犏牛四隻中都留守司二萬五千六百隻水牛一千九百四十八隻黃牛二萬三千六百五十二隻遼東都司一萬三千八百七十八隻水牛一十三隻黃牛一萬三千八百六十五隻見今屯牛報册衛分南京金吾前等衛二十七衛共牛五千七百二十一隻金吾前衛水軍左衛龍驤衛龍江左衛鎮南衛龍江右衛龍虎衛旗手衛府軍後衛羽林右衛驍騎衛英武衛江隂衛橫海衛留守左衛留守右衛留守前衛留守後衛天䇿衛虎賁右衛廣武衛虎賁左衛豹韜衛豹韜左衛豹韜右衛鷹揚衛應天衛南直𨽻徐州等衛一十六衛共牛一千九百七十五隻徐州衛徐州左衛武平衛建陽衛蘇州衛高郵衛宿州衛儀真衛廣洋衛宣州衛六安衛邳州衛揚州衛大河衛安慶衛九江衛湖廣都司下瞿塘等四衛所共牛二千一十八隻瞿塘衛襄陽衛長寧守禦千户所枝江守禦千户所河南都司所屬南陽等一十衛所共牛六千二百七十三隻南陽衛睢陽衛南陽中護衛陳州衛潁川衛彰德衛懷慶衛𢎞農衛潁上守禦千户所伊府儀衛司陜西都司所屬涼州等二十四衛所共牛一萬四百六十四隻平涼衛鎮夷守禦千户所高臺守禦千户所鎮番衛山丹衛永昌衛甘州左衛甘州右衛甘州前衛甘州後衛臨洮衛靖虜衛莊浪衛西安左衛西安右衛西安前衛西安後衛河州衛寧夏衛寧夏左衛寧夏右衛寧夏中衛寧夏前衛寧夏後衛雲南都司所屬雲南左等二十五衛所共牛一萬五千六百五十隻雲南左衛雲南右衛雲南中衛雲南前衛雲南後衛廣南衛曲靖衛平夷衛越州衛六涼衛臨安衛楚雄衛洱海衛大理衛景東衛䝉化衛瀾滄衛騰衝衛馬隆守禦千户所陽林堡守禦千戶所宜良守禦千户所木密關守禦千户所易門守禦千户所安寧守禦千户所金齒衛山東都司所屬濟南等九衛所共牛四百九十五隻濟南衛平山衛寧海衛萊州衛臨清衛兖州護衛青州左衛濟寧衛諸城守禦千户所貴州都司所屬貴州前等二十衛所共牛一千一百五十六隻貴州前衛貴州衛龍里衛新添衛平越衛清平衛興隆衛都勻衛威清衛平壩衛普定衛安莊衛安南衛普安衛烏撒衛畢節衛赤水衛永寧衛黃平守禦千户所普安守禦千户所萬全都司所屬宣府前等十六衛所共牛一千一百二十八隻宣府前衛宣府左衛宣府右衛懷來衛隆慶左衛隆慶右衛美峪守禦千户所保安右衛永寧衛永寧後所龍門守禦千戶所開平衛長安嶺堡雲州堡興和守禦千户所龍門衛四川都司所屬成都右等二十三衛所共牛一萬三千三百三十五隻成都右衛成都中衛成都前衛成都後衛寧川衛敘南衛瀘州衛重慶衛利州衛松潘衛茂州衛保寧守禦千户所青州守禦千户所大渡河守禦千户所雅州守禦千户所黔江守禦千户所灌縣守禦千户所建昌衛寧番衛鹽井衛建昌前衛越雋衛會川衛遼東都司所屬定遼左等二十四衛共牛五千一百八隻定遼左衛定遼中衛定遼前衛定遼後衛東寧衛瀋陽中衛鐵嶺衛三萬衛遼海衛海州衛蓋州衛復州衛金州衛廣寧衛廣寧左衛廣寧右衛廣寧中衛廣寧左屯衛廣寧右屯衛廣寧中屯衛廣寧前屯衛廣寧後屯衛義州衛寧遠衛福建都司所屬汀州等十三衛共牛五千二百八十四隻汀州衛建寧衛延平衛邵武衛永寧衛鎮東衛漳州衛福州左衛福州右衛福州中衛平海衛泉州衛興化衛直𨽻永清等三衛共牛三千一百一十七隻永清衛寧山衛興州後屯衛中都留守司所屬鳳陽等九衛所共牛一萬二百一十九隻鳳陽衛鳳陽中衛鳳陽右衛留守左衛留守中衛懷遠衛長淮衛洪塘湖屯田千户所皇陵衛事例永樂二年令太僕寺給山東屯牛又令陜西蘭州等衛屯牛凡百人官共給牛一隻宣德以後各處衛分牛隻數目俱由五軍都督府照會本部立案備照倒死者著令買補孳生者查勘明白年終依例造册奏送該府轉行本部知會墳塋禮部喪葬項內有咨工部造墳安葬之條而本部職掌所載職官墳塋止開武職今以王府墳塋制度具列於前而文職事例附見於後王府墳塋事例永樂八年定親王墳塋享堂七間廣十丈九尺五寸高二丈九尺深四丈三尺五寸中門三間廣四丈五尺八寸高二丈一尺深二丈五尺五寸外門三間廣四丈一尺九寸高深與中門同神厨五間廣六丈七尺五寸高一丈六尺二寸五分深二丈一尺五寸神庫同東西廂及宰牲房各三間廣四丈一尺二寸高深與神厨同焚帛亭一方七尺高一丈一尺祭器亭一方八尺高與焚帛亭同碑亭一方二丈一尺高三丈四尺五寸周圍牆二百九十丈牆外為奉祠等房十有二間正統十三年定王府墳塋親王地五十畝房十五間郡王地三十畝房九間郡王之子地二十畝房三間郡主縣主地十畝房三間天順二年奏准親王以下依文武大臣例或王或妃有先故者並造其壙後葬者止令所在官司起倩夫匠開壙安葬繼妃則附葬其旁同一享堂不許另造成化十三年令親王并妃照舊差官開壙郡王以下止令所在官司量備工料開壙十八年定王府造墳夫匠物料價銀郡王并妃三百五十兩鎮國將軍并夫人二百四十五兩輔國將軍并夫人郡主各二百二十五兩縣主二百一十五兩郡君一百九十六兩縣君一百八十五兩分派有司辦納自造又令王府擅奏重修墳塋者先將輔導官參十九年定將軍以下造墳價銀奉國將軍一百四十七兩一錢二釐二毫中尉一百二十三兩七錢二分五釐八毫郡王并妃冥器八十兩郡主六十兩二十一年定郡王并妃開壙價銀一百兩鎮國將軍并夫人八十兩輔國將軍并夫人七十兩自開安葬𢎞治五年令親王郡王鎮國將軍各於始封父祖塋序昭穆葬郡縣等主於儀賓父祖塋安葬六年令王府自郡王以下造墳并開壙悉照修府事例價銀减半送用十三年奏准凡發掘王府將軍夫人郡主縣主及歷代帝王名臣先賢墳冢開棺為從及發見棺槨者不分首從俱發邊衛發而未至棺槨者首者發附近各充軍十四年奏准郡王開壙價銀五十兩止送四十兩餘皆遞减其鎮國將軍以下墳塋仍照房價事例行勘明白方與請給親王及世子郡王鎮國將軍至郡王長子齊糧麻布通革免職官墳塋諸司職掌凡武職官員或歿於矢石或死於任所先由禮部定奪應合造墳者移咨知會仍審安葬去處若在京者與擇墳地會計工程照例應撥囚徒磚灰造墳中間有公侯伯合用硃紅槨冥器志石磚灰人工别無定例審度支撥其槨具冥器行下寶源軍器營繕針工鞍轡局所依例料造應付若有旨許令祖墳或就任所安葬及造享堂者臨期定奪施行造槨并冥器磚灰公侯伯造槨無冥器都督同知僉事指揮使紅漆槨志石磚四千五百箇石灰四千五百斤囚五十名指揮同知僉事黑漆槨志石磚三千四百五十箇石灰三千四百五十斤囚二十名正副致仕千户衛鎮撫磚一千五百箇石灰一千五百斤囚一十二名百户所鎮撫磚二百四十箇石灰二百四十斤囚六名千百户所鎮撫骨殖安葬磚灰囚减半寶源局造公侯伯都督冥器內用小銅釡一面小銅竈一箇小銅筯一雙小銅火盆一箇槨志事件鐵束二道鐵二箇兩尖釘二百箇鈠環一副軍器局錫造水盆一臺盞一杓一壺瓶一酒甕一唾盂一水罐一香爐一香盒一燭臺一對香匙筯連瓶一副茶鍾一茶盞一碗二槖二燈臺盞一副碟十二油瓶一匙筯連瓶一副營繕所木造牙仗二骨朵二交椅一腳踏一交床一馬杌一誕馬二食卓一香卓一床一拄杖一箱一凳一枕一揮一清道一對樂人八控士二門神二儀仗人十二女使八武士四翣六五穀倉二涼漿瓶二鎗二斧二班劒一紅旗二金一鼓一箭三弓一甲一盔一弩一鍋竈一副火爐一針工局造青羅槨罩一紅紵絲暖帳一紅銷金紗厨一茶褐羅傘一紅絹旗二枕頭一紅紵絲綿被一紅絹夾被一綿衣卧單一紵絲褥一布手巾一襟一鞶一鞍轡局造小鞍籠一小弓箭袋一副明令墳塋石獸職官一品塋地九十步墳高一丈八尺二品塋地八十步墳高一丈四尺三品塋地七十步墳高一丈二尺以上石獸並六四品五品塋地六十步墳高八尺以上石獸並四六品塋地四十步七品以下二十步墳高六尺以上步法皆從塋心各數至邊五品以上許用碑龜趺螭首六品以下許用碣方趺圓碣庶人塋地九步穿心一十八步止用壙志稽古定制墳塋公侯塋地周圍一百步墳高二丈圍牆高一丈一品塋地周圍九十步墳高一丈八尺圍牆高九尺二品塋地周圍八十步墳高一丈六尺圍牆高八尺三品塋地周圍七十步墳高一丈四尺圍牆高七尺四品塋地周圍六十步墳高一丈二尺圍牆高六尺五品塋地周圍五十步墳高一丈圍牆高四尺六品塋地周圍四十步墳高八尺七品以下塋地周圍三十步墳高六尺碑碣石獸公侯石碑螭首高三尺二寸碑身高九尺濶三尺六寸龜趺高三尺八寸石人二石馬二石羊二石虎二石望柱二一品石碑螭首高三尺碑身高八尺五寸濶三尺四寸龜趺高三尺六寸石人二石馬二石羊二石虎二石望柱二二品石碑蓋用麒麟高二尺八寸碑身高八尺濶三尺二寸龜趺高三尺二寸石人二石虎二石羊二石馬二石望柱二三品石碑蓋用天祿辟邪高二尺六寸碑身高七尺五寸濶三尺龜趺高三尺二寸石虎二石羊二石馬二石望柱二四品石碑圓首高二尺四寸碑身高七尺濶二尺八寸方趺高三尺石虎二石馬二石望柱二五品石碑圓首高二尺二寸碑身高六尺五寸濶二尺六寸方趺高二尺八寸石羊二石馬二石望柱二六品石碑圓首高二尺碑身高六尺濶六尺四寸方趺高一尺六寸七品石碑圓首高一尺八寸碑身高五尺五寸濶二尺二寸方趺高二尺四寸事例洪武三年定功臣守墓人户各以封爵官品之差等給之其合用石碑石獸之類亦令有司俱依品秩成造二十六年詔自今凡功臣故不建享堂其墳塋葬具皆令自備惟殁於戰陳者官給之天順二年奏准文武大臣官為造墳者夫故在前併造妻壙妻故在前并造夫壙後葬者止令所在官司起倩夫匠開壙安葬繼室則附葬其旁同一享堂不許另造成化十三年奏准開壙者就令本家自開𢎞治十年仍令有司開壙明會典卷一百六十二
