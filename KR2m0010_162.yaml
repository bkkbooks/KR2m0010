body:
  text: 明會典卷一百六十二工部十六屯田清吏司諸司職掌郎中員外郎主事掌天下屯田之政令屯種國初以軍食爲重自内地及邊境荒閒田土各衞所撥軍開墾歳收子粒爲官軍俸糧以省餽餉其耕種器具皆給於官而耕牛亦皆有數今備載之開墾諸司職掌凡邊防郡縣守禦去處新立衞分撥軍開墾荒田屯種須要計算頃畝數目及田地肥瘦人力勤惰務在不曠征徭不失軍餉事例見户部田土項丅農具諸司職掌凡屯種去處合用犁鏵耙齒等器著令有司撥官鐵炭鑄造發用若木植令衞軍於出産山場自行採辦造用係干動撥官物具奉施行事例永樂元年令寶源局鑄農器給山東被兵之民牛隻諸司職掌凡屯種合用牛隻設或不敷即便移文取索若官廏數多差人發遣如果路途窵遠此間地方出産可以收買務在公私兩便就給官價民間買用其孳生數目毎歳年終通報計天下屯牛二十五萬五千六百六十四隻河南都司三萬六千三百一十九隻水牛二千二百四十七隻黄牛三萬四千七十二隻廣西都司九百五十隻水牛三百六十七隻黃牛五百八十三隻山東都司五千九百九十九隻水牛四百一十九隻黄牛五千五百八十隻北平都司一萬七千四百六十六隻水牛八百四十六隻黃牛一萬六千六百二十隻山西行都司黃牛一萬七千八百一十五隻山西都司黃牛九千一百四十三隻四川都司八千一百九十隻水牛六千五百二十九隻黃牛一千二百四十八隻犏牛三百二十二隻氂牛九十一隻湖廣都司四千六百六十七隻水牛三千九百三十四隻黃牛七百三十三隻廣東都司四百八十二隻水牛四百一十三隻黃牛六十九隻浙江都司二千二百四十六隻水牛一千二百五十四隻黃牛九百九十二隻江西都司四百九十九隻水牛三百六十六隻黃牛一百三十三隻陜西都司二萬七千四百六十七隻水牛四十六隻黄牛二萬六千六百八十三隻犏牛七百三十八隻雲南都司一萬五千二百八十四隻水牛九千七百八十二隻黄牛五千五百二隻貴州都司五千二百七十二隻水牛四千五百六十八隻黄牛七百四隻北平行都司一萬八千五百三十七隻水牛一萬八千五百三十四隻黃牛三隻直𨽻四萬五千八百五十隻水牛七千四百一隻黃牛三萬八千四百四十五隻犏牛四隻中都留守司二萬五千六百隻水牛一千九百四十八隻黃牛二萬三千六百五十二隻遼東都司一萬三千八百七十八隻水牛一十三隻黃牛一萬三千八百六十五隻見今屯牛報册衞分南京金吾前等衞二十七衞共牛五千七百二十一隻金吾前衞水軍左衞龍驤衞龍江左衞鎭南衞龍江右衞龍虎衞旗手衞府軍後衞羽林右衞驍騎衞英武衞江隂衞横海衞留守左衞留守右衞留守前衞留守後衞天䇿衞虎賁右衞廣武衞虎賁左衞豹韜衞豹韜左衞豹韜右衞鷹揚衞應天衞南直𨽻徐州等衞一十六衞共牛一千九百七十五隻徐州衞徐州左衞武平衞建陽衞蘇州衞高郵衞宿州衞儀真衞廣洋衞宣州衞六安衞邳州衞揚州衞大河衞安慶衞九江衞湖廣都司下瞿塘等四衞所共牛二千一十八隻瞿塘衞襄陽衞長寧守禦千户所枝江守禦千户所河南都司所屬南陽等一十衞所共牛六千二百七十三隻南陽衞睢陽衞南陽中䕶衞陳州衞潁川衞彰德衞懷慶衞𢎞農衞潁上守禦千户所伊府儀衞司陜西都司所屬涼州等二十四衞所共牛一萬四百六十四隻平涼衞鎭夷守禦千户所高臺守禦千户所鎭番衞山丹衞永昌衞甘州左衞甘州右衞甘州前衞甘州後衞臨洮衞靖虜衞莊浪衞西安左衞西安右衞西安前衞西安後衞河州衞寧夏衞寧夏左衞寧夏右衞寧夏中衞寧夏前衞寧夏後衞雲南都司所屬雲南左等二十五衞所共牛一萬五千六百五十隻雲南左衞雲南右衞雲南中衞雲南前衞雲南後衞廣南衞曲靖衞平夷衞越州衞六涼衞臨安衞楚雄衞洱海衞大理衞景東衞䝉化衞瀾滄衞騰衝衞馬隆守禦千户所陽林堡守禦千戸所宜良守禦千户所木宻關守禦千户所易門守禦千户所安寧守禦千户所金齒衞山東都司所屬濟南等九衞所共牛四百九十五隻濟南衞平山衞寧海衞萊州衞臨清衞兖州護衞青州左衞濟寧衞諸城守禦千户所貴州都司所屬貴州前等二十衞所共牛一千一百五十六隻貴州前衞貴州衞龍里衞新添衞平越衞清平衞興隆衞都勻衞威清衞平壩衞普定衞安莊衞安南衞普安衞烏撒衞畢節衞赤水衞永寧衞黄平守禦千户所普安守禦千户所萬全都司所屬宣府前等十六衞所共牛一千一百二十八隻宣府前衞宣府左衞宣府右衞懷來衞隆慶左衞隆慶右衞美峪守禦千户所保安右衞永寧衞永寧後所龍門守禦千戸所開平衞長安嶺堡雲州堡興和守禦千户所龍門衞四川都司所屬成都右等二十三衞所共牛一萬三千三百三十五隻成都右衞成都中衞成都前衞成都後衞寧川衞敘南衞瀘州衞重慶衞利州衞松潘衞茂州衞保寧守禦千户所青州守禦千户所大渡河守禦千户所雅州守禦千户所黔江守禦千户所灌縣守禦千户所建昌衞寧番衞鹽井衞建昌前衞越雋衞會川衞遼東都司所屬定遼左等二十四衞共牛五千一百八隻定遼左衞定遼中衞定遼前衞定遼後衞東寧衞瀋陽中衞鐵嶺衞三萬衞遼海衞海州衞蓋州衞復州衞金州衞廣寧衞廣寧左衞廣寧右衞廣寧中衞廣寧左屯衞廣寧右屯衞廣寧中屯衞廣寧前屯衞廣寧後屯衞義州衞寧遠衞福建都司所屬汀州等十三衞共牛五千二百八十四隻汀州衞建寧衞延平衞邵武衞永寧衞鎭東衞漳州衞福州左衞福州右衞福州中衞平海衞泉州衞興化衞直𨽻永清等三衞共牛三千一百一十七隻永清衞寧山衞興州後屯衞中都留守司所屬鳳陽等九衞所共牛一萬二百一十九隻鳳陽衞鳳陽中衞鳳陽右衞留守左衞留守中衞懷遠衞長淮衞洪塘湖屯田千户所皇陵衞事例永樂二年令太僕寺給山東屯牛又令陜西蘭州等衞屯牛凡百人官共給牛一隻宣德以後各處衞分牛隻數目俱由五軍都督府照會本部立案備照倒死者著令買補孳生者查勘明白年終依例造册奏送該府轉行本部知會墳塋禮部喪𦵏項内有咨工部造墳安𦵏之條而本部職掌所載職官墳塋止開武職今以王府墳塋制度具列於前而文職事例附見於後王府墳塋事例永樂八年定親王墳塋享堂七間廣十丈九尺五寸高二丈九尺深四丈三尺五寸中門三間廣四丈五尺八寸高二丈一尺深二丈五尺五寸外門三間廣四丈一尺九寸高深與中門同神厨五間廣六丈七尺五寸高一丈六尺二寸五分深二丈一尺五寸神庫同東西廂及宰牲房各三間廣四丈一尺二寸高深與神厨同焚帛亭一方七尺高一丈一尺祭器亭一方八尺高與焚帛亭同碑亭一方二丈一尺高三丈四尺五寸周圍牆二百九十丈牆外爲奉祠等房十有二間正綂十三年定王府墳塋親王地五十畝房十五間郡王地三十畝房九間郡王之子地二十畝房三間郡主縣主地十畝房三間天順二年奏准親王以下依文武大臣例或王或妃有先故者並造其壙後𦵏者止令所在官司起倩夫匠開壙安𦵏繼妃則附𦵏其旁同一享堂不許另造成化十三年令親王并妃照舊差官開壙郡王以下止令所在官司量備工料開壙十八年定王府造墳夫匠物料價銀郡王并妃三百五十兩鎮國將軍并夫人二百四十五兩輔國將軍并夫人郡主各二百二十五兩縣主二百一十五兩郡君一百九十六兩縣君一百八十五兩分派有司辦納自造又令王府擅奏重修墳塋者先將輔導官參十九年定將軍以下造墳價銀奉國將軍一百四十七兩一錢二釐二毫中尉一百二十三兩七錢二分五釐八毫郡王并妃冥器八十兩郡主六十兩二十一年定郡王并妃開壙價銀一百兩鎮國將軍并夫人八十兩輔國將軍并夫人七十兩自開安𦵏𢎞治五年令親王郡王鎮國將軍各於始封父祖塋序昭穆𦵏郡縣等主於儀賓父祖塋安𦵏六年令王府自郡王以下造墳并開壙悉照修府事例價銀减半送用十三年奏准凡發掘王府將軍夫人郡主縣主及歴代帝王名臣先賢墳塚開棺爲從及發見棺槨者不分首從俱發邊衞發而未至棺槨者首者發附近各充軍十四年奏准郡王開壙價銀五十兩止送四十兩餘皆遞减其鎮國將軍以下墳塋仍照房價事例行勘明白方與請給親王及世子郡王鎮國將軍至郡王長子齋糧麻布通革免職官墳塋諸司職掌凡武職官員或歿於矢石或死於任所先由禮部定奪應合造墳者移咨知會仍審安𦵏去處若在京者與擇墳地會計工程照例應撥囚徒磚灰造墳中間有公侯伯合用硃紅槨冥器誌石磚灰人工别無定例審度支撥其槨具冥器行下寶源軍器營繕針工鞍轡局所依例料造應付若有旨許令祖墳或就任所安𦵏及造享堂者臨期定奪施行造槨并冥器磚灰公侯伯造槨無冥器都督同知僉事指揮使紅漆槨誌石磚四千五百箇石灰四千五百斤囚五十名指揮同知僉事黒漆槨誌石磚三千四百五十箇石灰三千四百五十斤囚二十名正副致仕千户衞鎮撫磚一千五百箇石灰一千五百斤囚一十二名百户所鎮撫磚二百四十箇石灰二百四十斤囚六名千百户所鎭撫骨殖安𦵏磚灰囚减半寶源局造公侯伯都督冥器内用小銅釡一面小銅竈一箇小銅筯一雙小銅火盆一箇槨誌事件鐵束二道鐵二箇兩尖釘二百箇鈠環一副軍器局錫造水盆一臺盞一杓一壺瓶一酒甕一唾盂一水罐一香爐一香盒一燭臺一對香匙筯連瓶一副茶鍾一茶盞一碗二槖二燈臺盞一副碟十二油瓶一匙筯連瓶一副營繕所木造牙仗二骨朶二交椅一脚踏一交床一馬杌一誕馬二食卓一香卓一床一拄杖一箱一凳一枕一揮一清道一對樂人八控士二門神二儀仗人十二女使八武士四翣六五穀倉二涼漿瓶二鎗二斧二班劒一紅旗二金一鼓一箭三弓一甲一盔一弩一鍋竈一副火爐一針工局造青羅槨罩一紅紵絲煖帳一紅銷金紗厨一茶褐羅傘一紅絹旗二枕頭一紅紵絲綿被一紅絹夾被一綿衣卧單一紵絲褥一布手巾一衿一鞶一鞍轡局造小鞍籠一小弓箭袋一副明令墳塋石獸職官一品塋地九十步墳高一丈八尺二品塋地八十步墳高一丈四尺三品塋地七十步墳高一丈二尺以上石獸並六四品五品塋地六十步墳高八尺以上石獸並四六品塋地四十步七品以下二十步墳高六尺以上步法皆從塋心各數至邊五品以上許用碑龜趺螭首六品以下許用碣方趺圓碣庶人塋地九步穿心一十八步止用壙誌稽古定制墳塋公侯塋地周圍一百步墳高二丈圍牆高一丈一品塋地周圍九十步墳高一丈八尺圍牆高九尺二品塋地周圍八十步墳高一丈六尺圍牆高八尺三品塋地周圍七十步墳高一丈四尺圍牆高七尺四品塋地周圍六十步墳高一丈二尺圍牆高六尺五品塋地周圍五十步墳高一丈圍牆高四尺六品塋地周圍四十步墳高八尺七品以下塋地周圍三十步墳高六尺碑碣石獸公侯石碑螭首高三尺二寸碑身高九尺濶三尺六寸龜趺高三尺八寸石人二石馬二石羊二石虎二石望柱二一品石碑螭首高三尺碑身高八尺五寸濶三尺四寸龜趺高三尺六寸石人二石馬二石羊二石虎二石望柱二二品石碑蓋用麒麟高二尺八寸碑身高八尺濶三尺二寸龜趺高三尺二寸石人二石虎二石羊二石馬二石望柱二三品石碑蓋用天祿辟邪高二尺六寸碑身高七尺五寸濶三尺龜趺高三尺二寸石虎二石羊二石馬二石望柱二四品石碑圓首高二尺四寸碑身高七尺濶二尺八寸方趺高三尺石虎二石馬二石望柱二五品石碑圓首高二尺二寸碑身高六尺五寸濶二尺六寸方趺高二尺八寸石羊二石馬二石望柱二六品石碑圓首高二尺碑身高六尺濶六尺四寸方趺高一尺六寸七品石碑圓首高一尺八寸碑身高五尺五寸濶二尺二寸方趺高二尺四寸事例洪武三年定功臣守墓人户各以封爵官品之差等給之其合用石碑石獸之類亦令有司俱依品秩成造二十六年詔自今凡功臣故不建享堂其墳塋𦵏具皆令自備惟殁於戰陣者官給之天順二年奏准文武大臣官爲造墳者夫故在前併造妻壙妻故在前并造夫壙後𦵏者止令所在官司起倩夫匠開壙安𦵏繼室則附𦵏其旁同一享堂不許另造成化十三年奏准開壙者就令本家自開𢎞治十年仍令有司開壙明會典卷一百六十二
