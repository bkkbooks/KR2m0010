body:
  text: 明會典卷一百十二兵部七軍役軍政至重其目有收補重役冒名缺伍老疾等項皆見於諸司職掌以後又有存恤之法今附録之諸司職掌凡內外衛所軍士俱有定數大率以五千六百名為一衛一千一百二十名為一千户所一百一十一名為一百户所其有衛分軍士數多千百戶所統則一每一百户內設總旗二名小旗一十名管領鈐束大小相維以成隊伍管軍官員操練撫綏務在得宜毋敢紊亂空歇若逃故老疾勾丁代補中間冒解同名并各項充軍重復非止一端條開於後收補軍士諸司職掌凡遇各布政司并直𨽻府州縣勾解內外衛所逃故軍人正身并戶丁到部審實明白逃軍照例斷發有能自首者免罪復役其補役戶丁如在京衛分填給勘合差人送發該衛交割在外衛所送赴該府通類差人押送取收管回照仍行移各衛收役年老殘疾發回兊換壯丁其幼小戶下無丁者年十三四以上送衛操練七八歲以下或發在營或發原籍依親行移該衛紀録候長成勾補其有姦頑故推老疾不將壯丁補役者問罪如律仍勾壯丁若長解不行用心管押依律責限發回根捕受贓脫放送法司問罪其有民人首報投軍并逺年歇役軍丁首報著役無衛分者照發外衛有原衛者就發充軍仍行原籍官司體勘若有規避即提送法司問罪重役諸司職掌凡有陳告一戶或為垜集首報收集或為事問發在京在外衛所重復充軍二名三名者須行各衛著落當該官吏保勘明白及揭照黃册果係同户别無人丁具奏定奪其有為事免罪充軍正身并丁多者不準如有隱瞞丁口朦朧陳告者問罪如律事例洪武二十三年令天下衛所有一户充軍二名者免一名為民洪熙元年令軍户重役者不問二處三處止併一處其餘悉與開豁宣德四年令軍戶重役止有幼丁二人者出幼之日以一丁補止役一丁補軍餘餘衛皆免若調發别衛而本衛又勾户丁補役者勘實發回聼補見役衛分軍伍其招募等項見丁充軍事故照名勾補者先解一名次具實有人丁申部擬奏定奪冒名諸司職掌凡有陳告本户係是民籍止與故軍同名同姓被里甲人等賣放正軍朦朧冒解者發回合干有司提對曾經府縣陳告不理著令所管上司衙門歸問若俱不理必須給批差人先提當該吏典并事內干問人數送法司對問其有干問府縣官員具奏提取若被在衛軍人供指就便送法司對問果係故軍生前妄報坐名勾取者揭照黃册是實改正發回為民仍行原衛著落親管官旗挨勾應補正軍事例宣德四年令民户與軍姓名相同冒勾解補者照例審實開豁若同姓同名之人已經到衛食糧三年之上者不準十年令有妄指同姓同名為軍者雖有該部文移坐取有司即與保明不許朦朧冒解正統二年令軍丁訴告冒解者暫收著役行移照勘果係冒解改正為民妄告者行本衛究治軍士缺伍諸司職掌凡內外衛所軍人或有死亡户絶或有升調或為事起發等項缺下隊伍須要行移衛所保勘明白許令除豁即於多餘軍內撥補若死亡止有幼丁許令本衛紀録在伍作數其在逃未獲務要根勾正身俱各不許撥補事例見收補軍士及武庫司清軍項下老疾軍人諸司職掌凡內外衛所軍人或征進工作傷殘或患痼疾及年老不堪征差者須要保勘相驗是實許令户下壯丁代役若無少壯止有幼小人丁許令該衛紀録操練仍令老疾隨營如果户絶無人揭籍查勘明白具奏除豁聼令隨營或依親還鄉缺下軍伍於多餘軍內撥補事例洪武十五年令各衛軍士年老及殘疾有丁男者許替役所管官旗留難者坐罪二十三年令老疾軍有子年一嵗二嵗該紀録者皆與正糧候成丁收役不許别勾以亂隊伍天順八年令府軍前衛幼軍俱終本身不必遷補成化十七年奏準幼軍有老疾者相視明白具奏踈放開伍但逃者仍勾其户丁補役其補役者亦終本身存恤事例宣德元年令新勾到衛軍士限半月收幫月糧兩月葺理居室俟其安定方許差操四年令天下衛所每軍一名免原籍户下一丁差役在營軍餘亦免一丁令專一供給正統二年差給事中御史各一員本部主事一員督同五城兵馬巡點存恤有限內差撥及私役科擾者𠫭奏問罪其各衛仍委官一員專管三年令新軍逃亡過二百人者該衛存恤官罰俸五箇月過百人者二箇月不及百人者兩箇月在外衛所依在京例仍從巡按按察司官點視五年令新到軍人係曾勾赴衛存恤一次重復在逃者不拘正軍户丁即送著役不在存恤之例𢎞治十三年奏準內外都司衛所官吏求索新軍財物因而逼勒在逃者指揮十名以上千户鎮撫六名以上百户四名以上各問罪降一級每十名六名四名各照數遞降不及前數及不曾得財者照常發落僉充民壯軍籍之外有民壯有司僉點以備警急即古民兵之遺意今附於軍役之後事例洪武初立民兵萬户府簡民間武勇之人編成隊伍以時操練有事用以征戰事平復還為民有功者一體升賞正統十四年令各處招募民壯就令本地官司率領操練遇警調用事定仍復為民天順元年令招募民壯鞍馬器械悉從官給本户有糧與免五石仍免户下二丁以資供給如有事故不許勾丁𢎞治二年令選取民壯須年二十以上五十以下精壯之人州縣七八百里者每里僉二名五百里者每里三名三百里者每里四名一百里以上者每里五名春夏秋每月操二次至冬操三歇三遇警調集官給行糧其餘照天順元年例六年令官司私役民壯者照依私役軍餘例問罪明會典卷一百十二
