body:
  text: 明會典卷三十户部十五俸給二事例洪武十八年令天下有司官俸米折鈔每二貫五百文準米一石永樂元年令各都司并河南浙江江西山東山西五布政司按察司及王府官俸舊全支米者米鈔中半兼支湖廣福建廣東廣西陜西北平四川雲南八布政司按察司官俸米鈔兼支及所屬府州縣等官俸全支鈔者俱仍舊十六年奏準浙江等都司布政司按察司長史司中都留守司堂上官并各衛所軍官俸一品至五品俱二分支米八分支鈔宣德八年奏準在外文武官折俸鈔每十五貫折米一石正統元年令萬全大寧都司所屬及北直隸衛所官折俸每歲上半年支鈔下半年支胡椒蘇木又令北直隸府州縣等衙門文職官月支本色米一石二年令貴州布按二司官月支本色米二石三年令雲南布按二司并所屬官員俸一半每石折支海􅚔三十索并不堪布絹假匹等物相兼本色米支一半折鈔四年令福建四品以上官俸四分米六分鈔五品以下米鈔中半兼支浙江湖廣江西廣東山東四川直隸蘇州等處文武官正五品以上米鈔二八分支從五品月支本色米三石二斗六品七品米鈔三七分支八品以下見支一石者增二斗大寧都司并北直隸衛所都指揮指揮每月加二石衛鎮撫千百戶所鎮撫加一石俱折布絹餘處照舊遼東甘肅諸處偹禦官自百户而下該增米俱折絹五年令陜西王府審理工正等官照有司官例月支米二石餘折鈔六年令在外文武官俸折鈔每石二十五貫廣寧等十衛并定遼左等衛指揮等官月增米四斗首領官及倉副使二斗八年令廣東都布按三司并所屬官俸五品以上四分支米六分折鈔六品以下米鈔中半兼支令貴州都司并所屬衛所官俸俱三分本色七分折鈔本色於湖廣布政司附近府州縣稅糧內折徵綿布十萬匹每二匹準米一石運赴貴州鎮逺府準作貴州迤東與隆等衛所官軍俸糧四川布政司折徵綿布十萬匹亦準米五萬石內四萬匹運赴永寧衛準作貴州迤西普安等衛官軍俸糧六萬匹運赴貴州布政司準作附近衛所官軍俸糧其折鈔仍給四川布政司官庫九年令甘肅沿邊官俸五品以上二分米八分鈔六品以下三分米七分鈔令各處稅課司局官照品給俸米鈔兼支革罷巡攔供給十年令河泊所官照稅課司局官例給俸十一年令提督北直隸衛所屯田僉事俸於户部帶支十二年令浙江三司及各府縣官二品至五品月仍支米三石六品至九品月支米二石雜職一石雲南都布按三司并府州縣衛所等衙門文武官三品以上月支米二石五斗四品至五品二石六品至七品一石五斗八品至九品一石二斗雜職八斗餘照舊折支又令貴州都布按三司所屬及貴州宣慰使司等衙門大小文職流官俱於俸給內月支本色米一石餘俸於原籍官司米鈔兼支又令在外文武官折俸鈔仍每十五貫準米一石十三年令廣東都布按三司并所屬衛所府州縣官五品以上二分米八分鈔六品以下三分米七分鈔十四年奏準雲南三司堂上官月支米三石武職官指揮月支米三石正副千户衛鎮撫百户二石五斗試百户所鎮撫二石文職官四品二石五品至七品一石五斗八品至雜職一石每米一石折海􅚔六十索景泰三年令軍職官調各邊者患病十日之外即住俸六年又令張家灣鹽倉收積掣摯客商餘鹽并私鹽給通州并通州等五衛及附近密雲等六衛官折俸每鹽一百四十斤準米一石天順元年令大同等處武職官應襲兒男有功升官者準支半俸又令納粟軍職官月支米一石俱令管事差操若病故子孫襲替一依父祖之例其有軍功升職者如獲功一級加與小旗糧二級加與總旗糧三級加試百户俸至功級多者照升授官加俸後子孫替職一依前例二年詔在外官員有父母年老在家願分俸助養者準於原籍關支又詔四品以上官年七十以禮致仕家貧不能自存者有司歲給米五石成化六年令在外官不許分俸原籍養親又令長蘆山東鹽場官俱給月俸七年令各處倉官及收糧經歷守支二年以上未盡者仍聽全支俸給十三年令在京都指揮選調各都司管事願分俸養親者以本色三分為率許存一分原衛關支十四年令文職有軍功升俸級者後雖升職仍舊帶支𢎞治三年令在京武職選調在外都司官俸通行隨任關支已上在外文武官俸洪武初令教授俸照品級學正而下照雜職例支給十三年奏定學正教諭訓導俸各月支米與雜職同師生廪膳米每人日一升永樂初令鳯陽等府及河南山西陜西湖廣浙江福建廣東廣西四川各府州縣并貴州及四川行都司所屬各衛師生俸廪俱米鈔中半兼支九年奏準各處師生俸米全支正統元年奏準各處教授俸見支五石者照舊見支二石及一石五斗一石者俱增為三石餘折鈔學正見支二石五斗者如舊見支一石五斗及一石者俱增為二石餘折鈔教諭訓導見支一石五斗及一石者俱增為二石餘折鈔十四年奏準各處教官饌米停支其俸月支本色米一石生員月支本色米五斗餘俱折鈔景泰六年令照舊支給口外邉城及糧少處暫為減支已上教官生員俸廪洪武二十九年令天文生月支食米六斗歷事監生月支米一石永樂九年令天文生不分有無家小全支米十六年以撙節京儲令監生有家小者減支四斗無者二斗宣德三年令太醫院醫士有家小者月支米五斗無者三斗醫生二斗九年奏準四夷館習字監生并回回逹官子弟習字者月支米一石正統六年令各衙門歷事監生有家小者月支米一石無者六斗南京各衙門歷事監生有家小者月支米八斗無者六斗景泰六年令刷卷監生有家小者月支米六斗無者四斗成化十年奏準醫士有家小者月支米增為七斗無者五斗醫生有家小者四斗無者三斗已上監生人等月糧洪武七年給天下諸司典吏俸十三年奏定吏員月俸一品二品衙門提控都吏月支米二石五斗掾史令史二斗二斗知印承差典史一石二斗三品四品衙門令史書吏司吏月支米二石承差典吏一石五品衙門司吏月支米一石二斗典吏八斗六品至雜職司吏月支米一石光祿司等典吏六斗又奏定在京三品以下衙門典吏月俸一石六品以下衙門典吏六斗又令在外各衙門吏典俸一石折鈔二貫五百文三十一年奏準在京吏典有家小原支一石以上者每石減支二斗無家小減支五斗提控都吏胥掾令史等項不分有無家小原支米二石者減支五斗原支二石五斗者減支八斗各處布政司并直隸所屬府州縣及各都司衛所吏全支鈔永樂九年令在京各衙門吏典不分有無家小俱全支米十六年令在京各衙門吏月支米一石餘折鈔南京各衙門辦事吏舊支食米五斗者住支十九年令在京各衙門吏有家小者月支米六斗無者四斗五升餘折鈔南京各衙門吏照舊支給每米一石折鈔二十五貫二十二年令在京各衙門吏有家小者月增米四斗無者一斗五升其折色鈔亦照文武官例給胡椒蘇木宣德三年革各衙門辦事吏月支食米正統元年令南京各衙門吏月支米有家小者增二斗無家小者增一斗五升又令在京刷卷人吏俸照各衙門吏典例支給六年令在京令典知印有家小者月支米一石無者六斗七年奏準在外大小衙門通吏令史司吏月支米三斗餘折鈔八年令各處都布按三司知印承差月支米三斗餘折鈔成化四年令在京吏典折色俸照文武官例錢鈔兼支十六年令户部書算月支米五斗已上吏員知印承差俸糧書算附永樂八年奏準安插來降達官每大口月支糧四斗小口二斗三歲以下及續生者不支宣德三年令在京達官俸不拘品級月支米二石餘於南京倉支其折鈔照文武官例十年令在京逹官俸舊全支者減半半支者減十之三四新降附達官自指揮而下遞減又令遼東安樂自在州達官頭目俸糧該支半俸二石四斗而減支者添本色米一石該支半俸二石而減支者添本色米八斗餘折鈔景泰元年奏準來降達官俸本色三分俱於在京支給五年令安插達官人等病故無子孫承襲者家屬仍月支米二石已上外夷歸附官員俸糧洪武初令官吏俸給旗軍月糧按月關支每月不過初五永樂元年令各衙門官吏監生人等凡關過俸糧五斗以下者俱免還官宣德二年令俸糧過期不關者改折鈔四年奏準公差官員無家小者明白開報候回日補支其餘見在者務依期關支不許出月如過三月不關者扣除八年令各衙門官吏俸糧文書至倉一月已上不關者扣除九年奏準各都司衛所官軍俸糧若過三月不關者俱折支鈔正統元年令在京軍官折俸銀本部按季取數類奏赴該庫官出於午門裏會同司禮監官及給事中御史唱名給散八年令在京官吏月支米本部每歲扣算一年該用之數定撥各衙門徑自委官收放仍每歲各將所收糧數造册送部類送户科每月計支過數注銷其積出餘糧歲終本部委官盤量作數十年令在京官吏等項俸糧折色各具手本送本部查明另具手本送天財庫知會各衙門自行關支十二年奏準順天府及大興宛平二縣都稅司等衙門官吏俸糧照五府六部例於儧運糙粳米內撥發本府收支景泰二年令各衛所官軍俸糧折色如上半年鈔延至次年正月下半年蘇木延至次年七月終者俱住支口外官軍不在此例三年令詹事府左右春坊司經局太僕寺官吏俸糧照太常寺例於本衙門收放五城兵馬司大通關會同館官吏及京衛武學師生俸糧按月造册定撥京倉關支又令南京各衙門見收官吏人等俸糧照在京例開立年分造册送科候放支按月具手本委官赴科注銷正糧支盡仍令南京户部委官查盤四年令光祿寺官吏俸糧於禮部帶支尚寶司於通政司帶支五年令在京軍衛有司衙門官吏旗軍俸糧折鈔若過半年不行造册關支者住支如有依期造册而該庫無鈔者方準補給又令各衛所官軍俸糧折色委官賫册赴部轉送該府會關該府仍不拘衛所多寡就為赴庫關領天順元年令上林苑監官吏俸糧於本監收放成化八年令在京文武官折色俸糧自文書到日經五箇月不關者扣除十七年令在京各衛所掌印軍政官及各邉巡撫鎮守把總等官督屬造册及委官關支俸糧折色仍先具委官職名呈報本部及各處管糧官員如過四十五日不造册關支及關支不盡者糧米扣除委官俸糧亦依所違月日住支若各衛所不以委官職名開報者掌印軍政把總官一體住支十八年奏準天津等二十四衛官軍俸糧折色每歲先行造册委官親賫上半年限三月內下半年限九月內赴府投文轉送內府庫關支如過一年不到者照例扣除關出鈔絹等物本府仍委官押運至彼令管糧郎中等官公同該衛官給散又令兩京營繕所文思院官員俸糧工部并南京工部按季造册繳送南京户部照在京各衛經歷等官例定撥南京衛倉支給其有册到一十五箇月不赴部告支者扣除二十年令兩京各衛關支官吏人等折色俸糧俱自本部比號日為始定限三箇月以裏務委官依數赴該庫關出送衛所公同掌印管事并首領官給散具數回報本部查考如有刁蹬留難及用強準折私債聽委官與被害之人指實呈告依律追究如委官通同掌印管事及買頭人等包買折債不行給散或違限不赴該庫官領有贓者以贓論無贓者參問畢俱帶俸差操其積年買頭包買之人照包攬錢鈔例發落𢎞治元年奏準在外并各邉衛所軍官折色俸令各分巡分守官督該掌印官按季造册每歲上半年限次年六月以裏下半年限次年十一月以裏送赴合干司府關給存留在庫鈔貫如不敷凡贓罰布貨器皿衣服頭畜之類皆計鈔折支每銀一兩折鈔七百貫若該衛所過期不造册其折色照例扣除十一年令各邉官軍俸糧每遇春間米貴支與本色秋間收成照時價支折色其餘月分銀米間支如或米賤願折銀者亦不許過支六箇月十三年奏準官員監生吏典旗軍人等關過俸糧及預支應得糧米遇有事故調用等項五斗以上失於還官者事發止問不應追糧還官已上收支俸糧明會典卷三十
