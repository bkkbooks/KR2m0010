body:
  text: 明會典卷一百十七兵部十二侍衛朝廷侍衛將軍等項人員各設官統領凡正旦冬至聖節三大朝會大祀誓戒册封遣祭傳制御殿則用全直常朝則更畨其衣甲器仗及陳列位次各有定制具列于後事例凡大朝御殿華蓋殿導駕錦衣衛將軍十人金盔甲懸金牌佩刀執金瓜盝頂門將軍八人紅盔青甲懸金牌佩刀執金瓜奉天殿御座左右將軍一百十八人錦衣衛九十八人四十二人金盔甲十六人明盔甲俱懸金牌佩刀執金瓜二十人明盔甲懸金牌執大紅刀二十人紅盔青甲懸金牌佩刀執金瓜三千營二十人十人紅盔青甲懸金牌執金瓜十人盔甲如前懸金牌弓矢佩刀簾下錦衣衛將軍四人金盔甲懸金牌佩刀執金瓜殿門將軍三十六人錦衣衛十六人金盔甲金牌佩刀執金瓜三千營二十人紅盔青甲懸金牌弓矢佩刀傘下錦衣衛將軍六人扇頭二人殿角及石柱各二人俱金盔甲懸金牌佩刀執金瓜丹陛將軍六十人錦衣衛二十人四人金盔甲十六人明盔甲俱懸金牌佩刀執金瓜三千營四十人紅盔青甲懸金牌執大紅刀上下纒腰將軍三十四人錦衣衛四人金盔甲金牌佩刀執金瓜三千營三十人紅盔青甲懸金牌執鵓鴿頭刀上下踏凳將軍三十二人錦衣衛十六人紅盔青甲懸金牌佩刀執鐡瓜三千營十六人紅盔青甲懸金牌弓矢佩刀東西創廊將軍十六人錦衣衛八人紅盔青甲懸金牌執金瓜三千營八人盔甲如前懸金牌弓矢佩刀中左中右門將軍十六人錦衣衛八人紅盔青甲懸金牌佩刀執金瓜三千營八人紅盔青甲懸金牌弓矢佩腰刀丹墀左右將軍二千八百五十六人錦衣衛一千六十有六人九百五十二人紅盔青甲懸金牌弓矢佩刀五十人紅皮盔創金甲五十人紅皮盔描銀甲俱懸金牌佩刀執金瓜十四人紅盔青甲懸金牌執開鞘大刀三千營一千七百九十人一千三百有十人紅盔青甲懸金牌弓矢佩刀執金瓜及大黑刀四百八十人明盔甲懸金牌弓矢佩刀俱重行長擺丹墀四隅錦衣衛將軍二百人紅盔青甲懸金牌佩刀作四隊周圍五軍官軍二千人紅盔青甲執義刀及金鎗作四十隊奉天門將軍二十四人錦衣衛八人金盔甲八人明盔甲四人紅盔青甲三千營四人紅盔青甲俱懸金牌佩刀執金瓜東西角門將軍二十四人錦衣衛十六人紅盔青甲懸金牌佩刀執金瓜三千營八人紅盔青甲懸金牌弓矢佩刀金水橋三千營將軍八人紅盔青甲懸金牌佩弓矢腰刀左右品牌三千營將軍各八人左右順門各四人東西城路各二人俱紅盔青甲懸金牌弓矢腰刀凡常朝御奉天門掌領侍衛官三員管大漢將軍及府軍前衛帶刀官一員管紅盔將軍一員管義刀官軍俱鳳翅盔鎖子甲懸金牌佩繡春刀直左右闌干首錦衣衛將軍二十四人明盔甲懸金牌佩刀執金瓜列闌干內勳衛散騎舍人四員府軍前衛官二十員明盔鎖子甲懸金牌佩刀夾左右陛錦衣衛指揮一員常服懸金牌列御道西千戶二員百戶十員俱常服懸金牌列其下錦衣衛將軍八人明盔甲懸金牌佩刀夾御道左右八人明盔甲懸金牌佩刀執金瓜掖兩陛下四人明盔甲懸金牌佩刀執金瓜直左右石匱錦衣衛將軍二十人三千營將軍二十人俱紅盔青甲懸金牌佩刀直左右踏蹬錦衣衛將軍二十八人明盔甲懸金牌佩刀執金瓜二十八人明盔甲懸金牌執大紅刀列丹墀文武班後四十人紅盔青甲懸金牌執金瓜四十人紅盔青甲懸金牌執大刀次之六十六人紅盔青甲懸金牌佩刀又次之三千營將軍七百二人紅盔青甲懸金牌執瓜刀次錦衣衛將軍後二百四十人明盔甲懸金牌弓矢器仗又次之五軍營官軍五百人紅盔青甲銅牌執義刀次三千營將軍後五百人披執如前列金水橋南旗守等衛官四十員常服懸金牌佩刀列義刀後錦衣衛將軍八人明盔甲懸金牌佩刀執金瓜八人紅盔青甲懸金牌佩刀執鐡瓜三千營將軍八人紅盔青甲懸金牌弓矢佩刀列金水橋左右錦衣衛將軍八人紅盔青甲懸金牌弓矢佩刀三千營將軍八人紅盔青甲懸金牌弓矢佩刀直東西角門錦衣衛將軍八人三千營八人披執如前直左右順門錦衣衛將軍四人三千營四人披執如前直東西城路錦衣衛校尉五百人鳴鞭及擎執傘扇儀仗者鵝帽只孫抹金銅束帶皂靴列午門內外其餘方巾青衣抹金銅帶雙魚銅牌執鐡狼牙等器仗列御道西凡各項侍衛將軍遇郊祀等項聖駕出入則於鹵簿儀仗中分行扈從至則護衛齊宫及分守郊壇等處內外門禁凡每日輪將軍一百名分早晚兩班於午門東西聽候夜則坐更凡遇經筵該班大漢將軍二十人有官者便服烏紗帽無官者明盔便服佩刀執金瓜於文華殿內東西侍衛凡五軍義刀官軍每夜於皇城直宿凡管大漢將軍及管義刀官每日侍衛管紅盔將軍官錦衣衛官勳衛散騎舍人府軍前衛旗手衛官各色把總及將軍官軍旗校等俱三日一更畨凡勳衛散騎舍人舊制擇公侯都督及指揮嫡長次子為之俸秩視八品侍衛直宿外或令署各衛所事及聽差遣有才器超卓者不次擢用天順間令俸秩比正千戶月支米十六石凡將軍舊制選軀幹豐偉有勇力者為之立千百戶總旗統屬其衆年深者以次升補成化初令侍衛二十年退間者冠帶榮身十五年令侍經筵八年者授試百戶凡千百尸照品給俸其餘月支米二石身故而子孫願代及投充者驗中方許凡侍衛金牌瓜刀盔甲等件天順八年奏準撥左闕門下祗待房一間頓放凡府軍前衛帶刀官四十員每班二十員旗手等二十衛帶刀官一百八十員每班四十員錦衣衛將軍一千五百七員名每班三百二十五員名三千營紅盔將軍一千五百員名每班七百五十員名把總指揮十六員明盔將軍四百八十員名每班二百四十員名把總指揮四員五軍義刀手三千名每班一千名把總指揮八員明會典卷一百十七
