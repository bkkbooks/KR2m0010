body:
  text: 明㑹典卷一百四十五刑部二十申明誡諭諸司職掌凡貪官汚吏玩法頑民有犯罪名各該部分取問明白議擬審允依律發落外將各人所犯情由罪名開付廣西部明立文案照依原犯情罪備榜差人發去各囚原籍張掛申明誡諭其欽依戴罪官員各該部分自行備榜發去原籍任所張掛曉諭取各囚原籍任所官司回文到部完卷官吏過名諸司職掌凡本部十二部遇有問失出入人罪耽誤公事含糊行移等項一應犯該公罪官吏該笞者官收贖吏移付廣西部紀録候一季終照數類决杖罪以上并取到各衙門官公罪招伏各部亦開付廣西部明立文案候年終案呈通咨吏部紀録通考黜陟事例洪武二十三年詔有司官凡犯過誤者初犯至三犯皆問罪復職許令改過自新三十二年奏准官吏行移錯誤果有害於事者官收贖吏每季類决不必附過永樂二十二年令內外官貪贓者並録其罪名于官以便稽考正統九年𠡠禮部三法司春陽肇序萬物咸新在京文武官員除贓罪外自正統九年十二月二十日以前所犯過名紀録在官者悉與湔除俾奉公守法成化十七年奏准各處吏典有犯公罪問該還役者係在京衙門仍行查抄招由在外各衙門備抄原問略節招由俱轉行本處布政司及直𨽻府州年終造冊類繳兩京吏部以憑查考𢎞治十一年奏准南京各衙門文武官員過名照在京事例湔除類填勘合諸司職掌凡本衙門遇有追贓提人合行下各布政司直𨽻府州追問刑名并取招斷决等項開寫犯人姓名鄉貫住址贓物名項并備細緣由移付廣東部置立文簿逐件附寫每布政司府州類至四五件六七件案呈本部照依原編定字號勘合文簿將案呈事件通具手本差官於原編底簿內附寫明白前赴內府刑科關填勘合完備領回本部押字用印照㑹布政司劄付直𨽻府州施行事例洪武二十九年令本部每司各設勘合卷其各項卷內遇有應行下各布政司及直𨽻府州者俱付該司自行類填勘合其有不係所𨽻地方開付該𨽻司分轉行三十二年令本部各司勘合仍付廣東清吏司類填每年終各布政司直𨽻府州將奉到勘合開立前件責差該吏齎送赴部注銷抄劄諸司職掌凡本部各子部凡問擬犯該姦黨等項合抄劄者明白具本開寫某人所犯合依某律該某罪財産人口合抄入官牒發大理寺審録平允回報各部備由開寫犯人鄉貫住址明白案呈本部具手本赴內府刑科填批差人前去抄劄户下成丁男子如法枷杻同抄到人口金銀細軟馬騾驢羊差人解部如前該庫進納粗重什物變賣價鈔牛隻農具入官并田地房屋召人佃賃照例當差應合抄劄律令姦黨謀反大逆姦黨惡造僞鈔殺一家三人採生折割人為首大誥攬納户安保過付詭寄田糧民人經該不解物灑派拋荒田土倚法為姦空引偷軍黥刺在逃官吏長解賣囚寰中士夫不為君用明令凡犯罪應合籍沒家産除謀反叛逆外其餘遇革者革前未曽抄劄到官革後原免革前已抄劄者沒官凡犯籍沒者除反叛外其餘罪犯止沒田産孳畜凡籍沒犯人家産田地內有祖先墳塋者不在抄劄之限事例洪武十七年令各處抄劄人口家財就解本處衛分成丁男子同妻小收充軍役其餘人口給與軍官為奴金銀珠翠本處官司收貯年終類解馬匹令本衛收養給與無馬軍人騎坐牛隻給與有屯去處屯種無屯去處并一應孳畜粗重物件就行變賣價錢於有司該庫交收二十一年令謀逆姦黨造僞鈔等項沒其資産丁口其餘止收資産仍以農器耕牛還之二十四年令各處抄劄解到罪人家屬有成丁者隨營無成丁者依親俱送大理寺再審續將抄來金銀等項并粗重什物變賣鈔貫通行解部俱不動原封就令彼處原解人役徑送內府該庫進納同本部填寫勘合出給長單二紙齎獲批單字號回部查照相同方行附卷將原差人批迥回原籍官司備照二十八年奏准抄劄遷發律與大誥該載者宜從法司遵守其餘榜文條例該抄劄遷發者止罪本身存留户下人口種田納糧當差二十九年議准抄劄提人革去所差旗軍令當該衙門出批差散騎或舍人齎批往所在有司比號著落附近衛所差撥旗軍眼同有司抄提到官就令原差旗軍解至該衙門仍令親齎家財一同引奏發落如有合提緊關人數及無軍衛去處臨期請㫖差解獄具諸司職掌凡司獄司所設一應獄具山東部掌行務要較勘如法或有損壞案呈本部官為修理置辦事例洪武二十年令焚錦衣衛非法獄具悉以所繫囚送本部審理二十八年詔本部將合用獄具依法較定與諸司遵守敢有仍前不遵者就用非法獄具處治皂𨽻祇禁輒便聽從行使者一體處死聽使之際如曾用言陳告長官不從皂𨽻祇禁不坐成化七年刑科奏准凡問刑衙門務要欽遵律定獄具不許擅用梃棍夾棍腦篐烙鐡等項非法重刑敢有故違擅用者事發問作酷刑官送吏部奏請定奪十一年申明禁約除人命强竊盜并犯該死罪者須用嚴刑究問外其餘有犯輕罪問刑官擅用法外獄具照例拿問𢎞治十三年議准內外問刑衙門除應問死罪并竊盜搶奪重犯須用嚴刑考訊外其餘止用鞭朴常刑若酷刑官員不論情罪輕重輒用梃棍夾棍腦篐烙鐡等項慘刻刑具如一封書鼠彈筝欄馬棍等項名色或灌鼻簽指及用徑寸懶竿不去稜節竹片亂打或打腳踝或鞭脊背若但傷人不曽致死者不分軍民職官俱奏請降級調用因而致死者俱發原籍為民如因公事考訊笞杖臀腿去處致死者依律科斷不在此例明律笞大頭徑二分七釐小頭徑一分七釐長三尺五寸以小荆條為之須削去節目用官降較板如法較勘毋令斤膠諸物裝釘應决者用小頭臀受杖大頭徑三分二釐小頭徑二分二釐長三尺五寸以大荆條為之亦須削去節目用官降較板如法較勘毋令斤膠諸物裝釘應决者用小頭臀受訊杖大頭徑四分五釐小頭徑三分五釐長三尺五寸以荆杖為之其犯重罪贓證明白不服招承明立文案依法栲訊臀腿分受枷長五尺五寸頭濶一尺五寸以乾木為之死罪重二十五斤徒流重二十斤杖罪重一十五斤長短輕重刻志其上杻長一尺六寸厚一寸以乾木為之男子犯死罪者用杻犯流罪以下及婦人犯死罪者不用鐡索長一丈以鐡為之犯輕罪人用鐐連環共重三斤以鐡為之犯徒罪者帶鐐工作明㑹典卷一百四十五
