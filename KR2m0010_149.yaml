body:
  text: 明㑹典卷一百四十九工部三儀仗二大駕鹵簿大輅一乘髙一丈三尺九寸五分闊八尺二寸五分面至地四尺一寸五分輅上平盤前後車􅎉并鴈翅及四垂如意滴珠板其下轅二條皆硃紅漆轅各長二丈二尺九寸五分鍍金銅龍頭龍尾龍鱗葉片裝釘前施硃紅油象塔攀皮一條平盤下方箱四面硃紅漆匡各十有二隔内飾緑地描金繪獸六麟獅犀象天馬天鹿禽六鸞鳯孔雀朱雀雉鶴盤左右下有䕶泥板及車輪二貫軸一毎輪十有八條周圍輞全皆硃紅漆抹金銅鈒花葉片裝釘輪内車心各一用抹金銅鈒蓮花瓣輪盤裝釘軸首左右各用漆貼金減鐵龍頭挿拴一箇以抹金銅鈒龍頂管心裝釘軸中纒黄絨駕轅等索輅亭髙六尺七寸九分四柱長五尺八寸四分檻座髙九寸五分皆硃紅漆前二柱戧金柱首寳相花中雲龍文下龜文錦門髙五尺一寸九分闊二尺四寸九分左右門闊二尺二寸五分其上四周粧雕木沉香色描金香草板十二片前并左右硃紅漆槅二扇明栨全以抹金銅鈒花葉片裝釘槅編黄線絛穿後硃紅漆屏風上雕沉香色描金雲龍五上硃紅漆板戧金雲龍一屏後俱沉香色地上四槅雕描金雲龍四其次雲板如其數下三槅雕描金雲龍三其次雲板亦如之俱抹金銅鈒花葉片裝釘亭内編黄線絛穿硃紅漆匡軟座黄絨墜座大索四條座下蓮花墜石軟座上施花毯大紅錦褥并席硃紅漆坐椅一座其上靠背雕以沉香色描金雲龍一下雕雲板一片硃紅漆福壽板一并褥椅中黄織金椅靠坐褥四圍椅裙全周圍施黄綺幃幔或用黄線羅亭外用青綺縁邉硃紅簾一十扇各用拽簾黄線圓絛二條黄銅圏全輅頂并圓盤髙三尺一分又鍍金銅蹲龍頂帯仰覆蓮座髙一尺二寸九分垂攀頂黄線圓絛四條盤高一寸九分上以硃紅漆其下外四面沉香色地描金雲内四角青地繪五彩雲以青飾輅盖亭内周圍貼金斗栱承硃紅漆匡寳盖鬬以八頂冒以黄綺謂之黄屋頂心并周圍繡五彩雲龍九天輪三層皆硃紅漆上安雕木貼金邉耀葉板八十一片内緑地雕木貼金雲龍文三層間繪五彩雲襯板八十一片盤下周圍黄銅釘裝上施黄綺瀝水三層毎層八十一摺間繡五彩雲龍文四角垂青綺絡𢃄四條各繡五彩雲升龍三圓盤四角連輅座板用攀頂黄線圓絛四條并貼金木魚輅亭前有左右轉角闌干二扇後一字帯左右轉角闌干一扇皆硃紅漆内嵌雕木貼金龍間以五彩雲三扇計一十二柱各柱首雕木貼金蹲龍一及線金五彩粧蓮花抱柱䦨干内四周布花毯太常旗二面在輅亭後左右用黄線羅夾為旗毎面十有二斿毎斿内外繡升龍一硃紅漆攅竹旗竿二左竿旗腰繡日月北斗竿首用鍍金銅龍頭右竿旗腰繡黻字竿首用鍍金銅㦸毎竿綴抹金銅鈴二垂紅纓十有二纓上施抹金銅寳盖下垂青線帉錔踏梯一硃紅漆以抹金銅鈒花葉片裝釘行馬架二硃紅漆其上黄絨匾絛用抹金銅葉片裝釘鐡搭鈎全黄絹幰衣即遮塵油絹雨衣并青氊衣各一座硃紅油合扇梯一副硃紅油托义一件抹金銅寳瓶并象鞍鞦轡氊籠各二副玉輅一乘髙一丈三尺九寸五分闊八尺二寸五分輅上平盤前後車櫺并鴈翅及四垂如意滴珠板其下轅二條皆硃紅漆轅長一丈二尺九寸五分鍍金銅龍頭龍尾龍鱗葉片裝釘前施硃紅油象搭攀皮一條平盤左右下護泥板及車輪二貫軸一毎輪輻十有八條皆硃紅漆周圍輞全各以抹金銅鈒花葉片裝釘輪内車心各一用抹金銅鈒蓮花瓣輪盤裝釘軸首左右各用漆貼金减鐡龍頭揷拴一箇以抹金銅鈒龍頂管心裝釘軸中纒黄絨駕轅等索面至地四尺一寸五分輅亭髙六尺七寸九分硃紅漆四柱各長五尺八寸四分前二柱有搏換貼金升龍檻座髙九寸五分門髙五尺一寸九分闊二尺四寸九分左右門闊二尺二寸五分其上四周粧雕木沉香色描金香草板十二片前并左右各硃紅漆槅二扇明栨全俱以抹金銅鈒花葉片裝釘槅編黄線絛穿後硃紅漆屏風上雕沉香色描金雲龍五屏後下三槅雕木沉香色描金雲龍三下雕雲板如其數俱抹金銅鈒花葉片裝釘亭内編黄線絛穿硃紅漆匡軟座黄絨墜座大索四條座下蓮花墜石軟座上施花毯大紅錦褥并席硃紅漆坐椅一座其上靠背雕以沉香色描金雲龍一下雕雲板一片硃紅漆福壽板一并褥椅中黄織金綺靠坐褥四圍椅裙全周圍施黄綺幃幔或用黄線羅亭外青綺縁邉硃紅簾一十扇各用拽簾黄線圓絛二條黄銅圏全輅頂并圓盤髙三尺一分又鍍金銅蹲龍頂帯仰覆蓮座髙一尺二寸九分垂攀頂黄線圓絛四條盤一寸九分上以硃紅漆其下外四面沉香色地描金雲内四角青地繪五彩雲以青飾輅盖亭内周圍貼金斗拱承硃紅漆匡寳盖鬪以八頂冒以黄綺謂之黄屋頂心并周圍繡五彩雲龍九天輪三層皆硃紅漆上安雕木貼金邉耀葉板八十一片内青地雕木飾玉色雲龍文三層間繪五彩雲襯板八十一片盤下周圍黄銅釘裝上施黄綺􅅹水三層每層八十一摺間繡五彩雲龍文四角垂青綺絡𢃄四條各繡五彩雲升龍二圓盤四角連輅座板用黄線攀絛四條并貼金木魚輅亭前有左右轉角闌干二扇後一字帯左右轉角闌干一扇皆硃紅漆内嵌雕木貼金龍間以五彩雲三扇計一十二柱各柱首雕木貼金蹲龍一用線金五彩粧蓮花抱柱䦨干内四周布花毯太常旗二面在輅亭後左右用黄線羅夾為旗毎面十有二斿毎斿内外繡升龍一硃紅漆攅竹旗竿二左竿旗腰繡日月北斗竿首用鍍金銅龍頭右竿旗腰繡黻字竿首用鍍金銅㦸毎竿綴抹金銅鈴二垂紅纓十有二纓上拖抹金銅寳盖下垂青線帉錔踏梯一硃紅漆以抹金銅鈒花葉片裝釘行馬架二硃紅漆其上黄絨匾絛用抹金銅葉片裝釘鐡搭鈎全黄絹幰衣即遮塵油絹雨衣并青氊衣各一座硃紅油合扇梯一副硃紅油托义一件抹金銅寳瓶并象鞍鞦轡氊籠各二副大馬輦一乗髙一丈二尺五寸九分闊八尺九寸五分輦上平盤板前後車櫺并鴈翅及四垂如意滴珠板其下轅三條皆硃紅漆轅各長二丈五寸九分用鍍金銅龍頭龍尾龍鱗葉片裝釘前施珠紅油馬搭攀皮一條平盤左右下護泥板及車輪二貫軸一毎輪輻十有八條皆硃紅漆周圍輞全各以抹金鈒花銅葉片裝釘輪内車心各一用抹金銅鈒蓮花瓣輪盤裝釘軸首左右各用漆貼金减鐡龍頭挿拴一箇以抹金銅鈒龍頂管心裝釘軸中纒黄絨駕轅等索面至地三尺四寸五分輦亭髙六尺四寸九分硃紅漆四柱各長五尺五寸四分檻座髙九寸五分其上四周硃紅漆絛環板門髙五尺九分闊二尺四寸五分左右門闊二尺二寸五分前并左右各槅二扇後槅三扇明栨全皆硃紅漆抹金銅鈒花葉片裝釘槅心編黄線絛穿亭内編黄線絛穿硃紅漆匡軟座黄絨墜座大索四條座下蓮花墜石軟座上施紅毯紅錦褥并席硃紅漆座椅一座其上靠背雕沉香色描金雲龍一下雕雲板一片硃紅漆福壽板一并褥椅中黄織金綺靠坐褥四圍椅裙全周圍施黄綺幃幔或用黄線羅亭外用青綺縁邉硃紅簾一十二扇各用拽簾圓絛二條黄銅圏全輦頂并轅盤髙二尺六寸五分又鍍金銅蹲龍頂帯仰覆蓮座髙一尺二寸九分垂攀頂黄線圓絛四條盤上下俱硃紅漆以青飾輦盖内寳盖硃紅漆木匡鬪以八頂冒以黄綺謂之黄屋頂心并周圍繡五彩雲龍九天輪三層皆硃紅漆上安雕木貼金邉耀葉板計八十一片内飾緑地雕木貼金雲龍文三層間繪五彩雲襯板八十一片盤下周圍黄銅釘裝上施黄綺瀝水三層毎層八十一摺間繡五彩雲龍文四角垂青綺絡𢃄四條各繡五彩雲升龍三圓盤四角連輦座板用攀頂黄線圓絛四條并貼金木魚輦亭前一字䦨干一扇後一字帯轉角䦨干一扇左右䦨干二扇内嵌絛環板皆硃紅漆四扇計一十四柱各柱首雕木貼金蹲龍一用線金五彩粧蓮花抱柱前䦨干内布紅毯一太常旗二面在輦亭後左右用黄線羅夾為旗毎面十有二斿毎斿内外繡升龍一硃紅漆攅竹旗竿二左竿旗腰繡日月北斗竿首用鍍金銅龍頭右竿旗腰繡黻字竿首用鍍金銅㦸毎竿綴抹金銅鈴二垂紅纓十有二纓上施抹金銅寳盖下垂青線帉錔踏梯一硃紅漆以抹金銅鈒花葉片裝釘行馬架三硃紅漆其上黄線匾絛用抹金銅葉片裝釘鐡搭鈎全黄絹幰衣即遮塵油絹雨衣并青氊衣各一座硃紅油合扇梯一副硃紅油托义一件馬鞍韀鞦轡鈴纓全小馬輦一乘髙一丈一尺五寸九分闊七尺九寸五分輦上平盤前後車櫺并鴈翅及四垂板其下轅二條皆硃紅漆轅各長一丈九尺五分用鍍金銅龍頭龍尾龍鱗葉片裝釘前施硃紅油馬撘攀皮一條平盤左右下護泥板及車輪二貫軸一毎輪輻十有八條皆硃紅漆周圍輞全各以抹金鈒花銅葉片裝釘輪内車心各一用抹金銅鈒蓮花瓣輪盤裝釘軸首左右各用漆貼金减鐡龍頭挿拴一箇以抹金銅鈒龍頂管心裝釘軸中纒黄絨駕轅等索面至地三尺四寸五分輦亭髙五尺五寸九分硃紅漆四柱各長五尺四寸五分檻髙一寸四分其上四圍硃紅漆絛環板門髙五尺闊二尺二寸五分左右門闊二尺一寸九分前并左右各硃紅漆槅二扇明栨全抹金銅鈒花葉片裝釘槅心編黄線絛穿後硃紅漆屏風壁板周圍俱用抹金銅鈒花葉片裝釘亭底硃紅漆板上施紅花毯紅錦褥并席硃紅漆坐椅一座其上靠背雕以沉香色描金雲龍一下雕雲板一片硃紅漆福壽板一并褥椅中黄織金綺靠坐褥四圍椅裙全周圍施黄綺幃幔或用黄線羅亭外用青綺縁邉硃紅簾四扇各用拽簾黄線圓絛二條黄銅圈全輦頂并圓盤髙二尺五寸五分又鍍金銅寳珠頂帯仰覆蓮座髙一尺二寸九分垂攀頂黄線圓絛四條盤上下皆硃紅漆以青飾輦盖内寳盖硃紅漆匡鬪以八頂冒以黄綺謂之黄屋頂心并周圍繡五彩雲龍九圓盤下用黄綺幃幔四扇或用黄線羅天輪三層皆硃紅漆上安雕木貼金邉耀葉板計八十一片内飾緑地貼金雲龍文三層間繪五彩雲襯板八十一片盤上周圍黄銅釘裝上施黄綺瀝水三層毎層八十一摺間繡五彩雲龍四角垂青綺絡𢃄四條繡五彩升雲龍二圓盤四角連輦座板用攀頂黄線圓絛四條并貼金木魚輦亭前一字䦨干一扇後一字帯轉角䦨干一扇左右䦨干二扇内嵌絛環板皆硃紅漆四扇計一十四柱各柱首雕木貼金蹲龍一用線金五彩粧蓮花抱柱前䦨干内布花毯太常旗二面在輦亭後左右用黄線羅夾為旗毎面十有二斿毎斿内外繡升龍一硃紅漆攅竹旗竿二左竿旗腰繡日月北斗竿首用鍍金銅龍頭右竿旗腰繡黻字竿首用鍍金銅㦸各竿綴抹金銅鈴二并紅纓十有二纓上各施抹金銅寳盖下垂青線帉錔踏梯一硃紅漆以抹金銅鈒花葉片裝釘行馬架二硃紅漆其上黄絨匾絛用抹金銅葉片裝釘鐡搭鈎全黄絹幰衣即遮塵油絹雨衣并青氊衣各一座硃紅油合扇梯一副硃紅油托义一件鞍韀鞦轡鈴纓全歩輦髙一丈二尺二寸五分座髙三尺二寸五分方闊八尺二寸五分輦座用硃紅漆其下四面雕木五彩雲渾貼金龍板十二片間以渾貼金仰覆蓮座其下雕木線金五彩雲板二十片座下硃紅漆轅四絛中二條各長三丈五尺九寸左右二條各長二丈九尺五寸九分毎轅以鍍金銅龍頭龍尾裝釘輦亭髙六尺三寸九分四柱各長六尺二寸五分檻髙一寸四分皆硃紅漆其上四圍雕木沉香色描金香草板十二片抹金銅鈒花葉片裝釘門髙五尺七寸九分闊二尺四寸五分左右二門闊二尺三寸五分前并左右各硃紅漆十字槅二扇雕飾沉香色描金雲龍板八片其下雲板如其數後硃紅漆屏風上雕沉香色描金雲龍五屏後雕沉香色描金雲龍板三