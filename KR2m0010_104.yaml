body:
  text: 明會典卷一百四禮部六十三膳羞二下程事例畨夷土官使臣下程凡諸畨國及四夷土官使臣人等進貢等項到會同館俱有常例并欽賜下程本部奏準通行光祿寺支送其欽賜下程一次者仍支常例下程或五日十日一次者常例下程住支若已經給賞兩月之外不行回還者住支下程常例下程每人日支肉半斤酒半瓶米一升蔬菜厨料欽賜下程朝鮮國安南國占城國琉球國爪哇國暹羅國已上各一次每五人羊鵝雞各一隻酒十瓶米七斗五升蔬菜厨料朝鮮國加果子茶食各四盤柴炭各二百斤暹羅國加酒十瓶正統六年占城王孫等二十三人下程牛二隻羊四隻鵝四隻雞十隻酒四十瓶米二石蔬菜厨料天順四年占城王族下程與王孫同但減牛一隻海西尼嚕罕都督一次每一人鵝一隻雞一隻酒二瓶米二斗麵二斤果子四色蔬菜厨料日本國滿剌加國錫蘭山國諾延三衛哈密衛喇特額爾巴拉賽瑪爾堪土魯畨哈喇蘇門答剌伊伯格勒實巴爾戎地面米兒哈蘭密實勒博囉罕衛和囉海衛買買回回鎖魯丹罕都衛鄂端地面迤北納古爾已上各五日一次每十人羊鵝雞各一隻鄂端地面減鵝雞酒二十五瓶哈喇納古爾各減五瓶米五斗麵十二斤八兩果子一斗蘇門答剌納古爾各果子四色燒餅二十箇糖餅二十箇米兒哈蘭減二十箇蘇門答剌加十箇納古爾減餅蔬菜厨料雲南土官十日一次每十人羊鵝雞各一隻送牛肉地方每人牛肉二斤半米一石送糯米地方每人糯米一斗酒二十五瓶果子四色蔬菜厨料榜葛剌國一次每五人羊鵝雞各一隻酒十瓶米五斗麵十斤果子四色蔬菜厨料實喇斯宣德間使臣八人五日一次羊鵝雞各二隻酒二十瓶米四斗麵二十五斤燒餅八十箇果子十五斤蔬菜厨料納木扎勒罕王永樂間使臣十八人一日一次羊五隻鵝四隻雞十隻酒三十瓶米一石麵百斤果子五斗燒餅一百箇糖餅六十箇蔬菜厨料頭目等十六人三日一次羊四隻鵝三隻雞四隻酒二十瓶米七斗麵五十斤果子四斗燒餅八十箇糖餅三十箇蔬菜厨料和卓永樂間使臣二十五人五日一次羊四隻鵝一隻雞四隻酒十五瓶麵三十斤米一石餅一百二十五箇果子四斗蔬菜厨料養獅豹回回永樂間使臣九人一日一次羊一隻鵝一隻雞二隻酒十瓶米三斗麵五十斤餅五十箇蠟燭地面使臣五十人五日一次羊七隻鵝六隻雞十隻酒一百三十瓶米二石麵一百五十斤果子一石餅二百五十箇蔬菜厨料伊斯帕罕永樂間使臣四十四人一日一次羊八隻鵝二隻雞十隻酒三十瓶麵八十斤米一石果子六斗餅二百箇蔬菜厨料哱呢國王永樂間使臣二十一人三日一次羊二隻鵝四隻雞八隻酒二十瓶米一石麵三十斤果子四色蔬菜厨料洪熙間使臣三十六人三日一次羊五隻鵝十隻雞二十隻酒十瓶米二石麵六十斤果子五盤每盤十斤鹽五斤醬三斤花椒一斤香油四斤醋四瓶茶二斤蔬菜厨料阿蘇地面永樂間使臣一百十二人三日一次羊八隻鵝四隻雞八隻酒一百四十瓶米二石五斗麵一百五十斤果子四色燒餅一百二十箇蔬菜厨料竒爾瑪勒永樂間使臣十一人五日一次羊二隻鵝二隻雞四隻酒十瓶麵三十斤米一石餅六十箇果子二斗蔬菜厨料沙哈魯永樂間使臣七十七人一日一次羊十二隻鵝四隻雞十四隻酒五十瓶米一石五斗果子一石麵一百二十斤燒餅二百箇糖餅一盤蔬菜厨料和爾默色永樂間使臣十四人三日一次羊三隻鵝二隻雞四隻酒十五瓶麵四十斤米一石餅八十箇果子四斗蔬菜厨料巴逹克山永樂間使臣四十人一日一次羊二隻鵝二隻雞五隻酒二十瓶米五斗麵二十斤果子二斗燒餅四十箇糖餅四十箇蜜二斤蔬菜厨料三日一次添送羊一隻鵝一隻雞二隻米五斗柳城五日一次每十人羊鵝雞各一隻酒七瓶麵十五斤米五斗果子二斗餅四十箇蔬菜厨料竒爾愛滿五日一次每十人羊鵝雞各一隻酒二十二瓶麵十五斤米五斗果子二斗餅五十箇蔬菜厨料瑪哈穆特王永樂間使臣十三人五日一次羊六隻雞十隻酒二十五瓶麵一百斤米一石餅一百六十箇果子七斗蔬菜厨料頭目六人羊四隻鵝三隻雞四隻酒二十瓶麵八十斤米一石餅一百五十箇果子六斗蔬菜厨料甘把里國柯枝國已上永樂間使臣各六人三日一次羊一隻鵝二隻雞四隻酒十瓶麵二十斤米五斗果子四色蔬菜厨料白松虎兒永樂間使臣十六人一日一次羊二隻鵝二隻雞四隻酒十瓶果子二斗米四斗麵二十斤餅六十箇糖餅一盤蔬菜厨料古里國永樂間使臣十八人三日一次羊二隻鵝四隻雞八隻酒二十瓶米一石麵三十斤果子四色蔬菜厨料日落國烏蘭哈逹哈烈尼嚕罕都指揮等官呼爾察烏思藏等處喇嘛畨僧蘇祿王尚師法王婆羅門可脫癿討來思癿加思蘭已上止支常例下程土官畨僧人等無關文者不支達爾瑪永樂間使臣十八人五日一次羊二隻鵝二隻雞四隻酒十瓶麵三十斤米一石果子二斗餅六十箇蔬菜厨料敏真誠等處永樂間使臣四十人一次羊三隻鵝一隻雞二隻酒四十瓶米一石五斗麵四十斤果子二斗燒餅五十箇糖餅四十箇蔬菜厨料諾爾布十日一次每五人羊鵝雞各一隻酒十瓶米五斗麵十六斤果子四色蔬菜厨料安定王十日一次每十人羊一隻鵝四隻雞八隻酒五十瓶米一石麵二十五斤果子四色蔬菜厨料哈坦國宣德間使臣四人三日一次羊鵝雞各一隻米三斗麵十斤酒五瓶果子四色餅二十箇蔬菜厨料多爾濟巴勒正統間使臣四人十日一次羊一隻鵝雞各二隻米四斗麵十斤果子一升燒餅二十箇蔬菜厨料色佛哷國宣德間使臣四人三日一次羊鵝雞各一隻米三斗麵十五斤酒六瓶果子四色餅三十箇蔬菜厨料察遜衛宣德間使臣七人五日一次羊鵝各一隻雞三隻米三斗酒二十瓶麵十五斤果子四色蔬菜厨料正統間使臣二人十日一次羊一隻酒十瓶麵五斤米二斗果子四色燒餅糖餅各八箇蔬菜厨料天方國嘉裕爾國已上宣德間使臣各二人三日一次羊雞各一隻米二斗麵十斤酒三瓶果子四色餅二十箇蔬菜厨料沙州衛正統間使臣四人五日一次羊鵝各一隻雞二隻酒十瓶米二斗麵五斤果子四色蔬菜厨料喀什噶爾宣德間使臣十四人三日一次羊鵝各二隻雞三隻酒二十一瓶米四斗二升麵二十一斤果子一斗四升蜜一斤餅四十五箇蔬菜厨料齊勤蒙古衛天順間使臣四人五日一次鵝二隻雞四隻酒八瓶米八斗麵八斤果子四色蔬菜厨料真臘國十日一次每十人羊鵝雞各二隻酒二十瓶米一石五斗蔬菜厨料黑葛達國宣德間使臣十一人三日一次羊一隻鵝二隻雞四隻酒十七瓶米四斗麵十五斤果子四色蔬菜厨料凡使臣進貢沿途關支廩給口糧回還亦如之成化十九年令夷人進貢及回至陜西布政司限二十日內照例茶飯管待起程如過期及中途無故停止一日之上者廩給住支凡使臣進貢回還沿途茶飯廩給口糧之外支送下程朝鮮國占城國琉球國爪哇國暹羅國滿剌加國日本國錫蘭山國迤北已上每人肉半斤酒半瓶哈蜜衛喇特賽瑪爾堪土魯畨已上每十人羊一隻酒二瓶半皆日止支一處宣德二年各國畨王王親頭人等朝貢到於福建廣東等處除筵宴及本等廩給口糧外日用下程畨王每人雞二隻肉二斤酒一瓶柴薪厨料王親每人肉一斤酒一瓶柴薪厨料使臣頭目每人肉半斤酒半瓶柴薪厨料畨伴女使人等止支口糧柴薪七年實喇斯等處使臣回到甘州月送羊酒半年之外止支本等廩給口糧正統三年衛喇特使臣停止去處每十人五日一次羊二隻酒十五瓶柴薪厨料衍聖公張真人下程洪熙元年衍聖公進表赴京欽賜羊一隻鵝三隻酒十瓶麵二十五斤茶鹽醬各二斤油燭二十枝宣德四年衍聖公張真人到京欽賜羊一隻鵝二隻酒六瓶麵二十斤茶鹽醬各二斤油燭十枝王國下程永樂間親王之國厨料醬一百斤香油五十斤椒二十斤乾魚一百斤醃羊一隻子鱭魚四十斤醃豬一口醃鵝一隻醃鹿一隻醃麂二隻醃雞九隻白麵一百斤茶芽五斤葉茶二十斤醬瓜四十條黑沙糖十斤藕煎五斤木瓜湯煎五斤醬茄一百五十箇醋蒜三百箇酒五十瓶醋二十瓶芝麻一石糖茄一百五十箇米三石洪熙元年靖江王府輔國將軍來朝欽賜羊十隻鵝十隻雞二十隻酒一百瓶米四石果子五色茶食五盤柴三百斤蔬菜厨料又靖江王府奉國將軍來朝欽賜羊五隻鵝五隻雞十隻酒十五瓶米二石果子五色茶食五盤柴一百五十斤蔬菜厨料宣德間趙世子安陽王來朝欽賜羊三隻鵝三隻雞六隻酒三瓶米一石五斗柴四百斤蔬菜厨料又令親王之國厨料照永樂間例仍加豬二十隻羊二十隻酒一百瓶天順元年襄王來朝回還沿途飲膳厨料并祇待隨從內外官校人等經過軍衛有司量給供用成化間親王之國照宣德間例經過有司去處量送鵝二隻時新菜蔬供用凡各王府差來人員常例下程一次鵝二隻雞二隻酒五瓶米五斗蔬菜厨料厨役諸司職掌一凡選取各項厨役或事故新僉光祿司具呈本部照數類行各處選取精壯慣熟無過犯殘疾之人起送到部轉發光祿司著役若有厨役病故遺下家小呈送到部劄付應天府給引或遞送回還原藉事例凡光祿寺厨役起送來京有司連當房妻小給與口糧腳力紅船其告補者遇有弟男等項本部查勘明白發寺替補其告老疾無丁代替者本部先送光祿寺勘驗明白取具該署官吏人等不扶結狀繳部覆審無礙具奏類送順天府給引照回免其雜泛差役仍行有司僉補其逃厨兒男告補者本部行勘明白暫令補役正身自首仍行文替出其在逃者三月之外參送法司問罪送回轉發著役三月之內免送問隨發著役其在逃三次者依律責罰畢仍發口外為民當房家小隨住其各王府奏保典膳本部移咨吏部查照年深無過者選用其郡王厨役每位四名行令有司護衛人户內中半僉撥凡太常寺厨役洪武間定四百名永樂中添二百名景泰六年添三百名成化十五年添三百名𢎞治五年添三百名共一千五百名分撥太廟郊壇供祀其在逃未及三月者收役三月之外者送問及逃厨兒男告補暫替者俱與光祿寺例同其父母原籍病故者本部行查無礙給引照回奔喪限半年十箇月仍回復役其有刑餘喪過者不許登壇其有為事曽經法司的決者改送光祿寺當差其弟男等項告替者𢎞治七年奏準照景泰間例俱本部查勘明白一年二次類奏替補送寺著役其老疾無丁代替者本部查勘明白亦類奏送順天府給引放回仍行原籍僉補凡太常寺光祿寺厨役私自逃回原籍潛住者𢎞治十三年奏準許里甲人等首官解部不許津貼盤纒其在原籍中途及到部挾詐誆騙告害人者問罪立案不行逃回至三次以上者問發口外為民凡太常寺厨役但係訐告詞訟及因人連纍問該笞杖罪名者納鈔仍送本寺著役徒罪以上及姦盜詐偽并有誤供祀等項不分輕重俱的決做工改撥光祿寺應役俸給諸司職掌一每嵗會計合用俸米數目户部定撥糧長到部送納本部劄付膳部并委官眼同依數交收在倉隨即出給倉鈔付納户收領候齊足出給通關一樣三本交付糧長收領仍將收過米數通咨户部其所收糧米專一放支本部并合屬衙門官吏月俸一本部官吏該支月俸每月初本部通類立案劄付膳部及委官或儀部祠部主客部官一員眼同放支膳部主事廳出給印信俸帖付官吏收執赴倉關支仍將放過某字號倉糧米數目分豁正米附餘開呈本部判送膳部立案一帶支太常司翰林院等衙門官吏俸給每月預先將合支數目開呈本部立案通類劄付膳部委官照依各衙門齊到印信俸帖赴倉依數關支畢日依數開呈一帶支衙門太常司今為寺光祿司今為寺翰林院春坊儀禮司今為鴻臚寺司經局欽天監行人司鑄印局教坊司欽天回回監後革後太常寺翰林院鴻臚寺欽天監行人司各自立倉春坊司經局俱於詹事府帶支藏氷諸司職掌一每嵗氷結之時本部堂上官預先奏聞膳部官赴內官監關支鑰匙錦衣衛差撥力士或工部差撥腳夫各備器具赴正陽門外打掃氷窨就行户部關撥新鮮稻草并蘆席襯墊完備伺候氷凍揀擇潔淨去處取氷節次挑赴氷窨內如法收藏封鎖將鑰匙送付內官仍移付祠部照例祭祀著軍人看守以備應用內府氷窨收藏氷雪係內官監官自行提調合用襯墊蘆席稻草本部照例移咨户部依數支撥就差人送內府氷窨處所交收器皿諸司職掌一凡宴享合用一應器皿及各項厨役懸帶雙魚銅牌光祿司開呈本部移咨工部照數造完轉發光祿司收用一鑄完厨役雙魚銅牌本部具印信手本開寫號數送赴內府印綬監收掌凡遇光祿司厨役合用銅牌本司自具手本赴本監關用今宴享器皿每嵗器皿厰造一萬件發光祿寺收用見工部都水司職掌行移諸司職掌一凡有一應行移在外事務儀部等四部各開事件移付通具印信手本赴禮科關填勘合照會各布政司并劄付直𨽻府州照依坐去勘合內事件轉行所屬作急理辦如有遲誤不完仍行催督每於年終各該有司分豁已未完結事件連原填去勘合張數造册差人親齎奏繳仍用備細開報本部以憑查銷事例凡填寫勘合本部照依地方編寫字號內外底簿二扇并勘合字號紙編寫畢押印完備外號底簿發去各布政司并直𨽻府州收掌內號底簿并勘合號紙本部收貯候儀制等四司凡有一應行移在外事務移付精膳司送發勘合科填寫號紙照會各布政司并劄付直𨽻府州赴通政司挂號送發兵部車駕司轉發各司府州比對硃墨字號相同將開去事件作急完報如號紙盡絶照字號接編如前各該司府州候年終將發去勘合并底簿拆粘具本奏繳仍具清册一本送部稽考勘合字號浙江以字江西準字陜西誠字廣東及字廣西即字河南正字湖廣各字雲南若字貴州柔字山東格字山西致字四川其字福建皆字安慶府能字松江府賢字蘇州府功字淮安府平字鳳陽府修字廬州府勤字保定府雨字應天府雲字揚州府齊字河間府露字徽州府貴字寧國府原字真定府騰字順德府麗字常州府故字池州府亨字大名府結字永平府金字廣平府霜字鎮江府親字太平府賔字保安府岡字滁州官字徐州治字隆慶州崑字廣德府列字和州利字明會典卷一百四
