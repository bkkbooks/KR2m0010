body:
  text: 明會典卷一百五十三工部七皇妃儀仗紅杖一對硃漆攢竹為杖銅裹兩末長四尺九寸清道旗一對純青質硃漆攢竹竿通長一丈二尺五寸內貼金木鎗頭長一尺七寸銅束絳引幡一對硃漆竿帶貼金銅鳳頭共長一丈二尺五寸內鳳頭并鐵鈎一尺幡用五色平羅長六尺三寸闊五寸五分四角寶蓋高七寸五分圍二尺七寸五分緑腰青二簷寶蓋四角鳳頭垂抹金銅珮一十六箇銅鈴三十六箇簷用銷金雲花文其蓋上有抹金銅頂鈒花文幡下綴五色板凡挑竿銅鳳頭以鐵為鈎戈氅一對硃漆竿通長一丈二尺五寸帶貼金木戈頭長一尺六寸二分粉板綴五色羅氅長六尺三寸闊五寸五分幡末綴抹金銅鈴五箇板畫飛鳥戟氅一對與戈氅制同通長一丈二尺五寸內貼金戟龍頭長一尺七寸五分儀鍠氅一對硃漆攢竹竿帶貼金儀鍠頭通長一丈二尺五寸五分內貼金儀鍠頭一尺三寸五分繫抹金銅頂一箇垂五色平羅氅長六尺三寸闊五寸五分氅下銅鈴五箇梧杖一對硃漆攢竹杖貼金兩末通長六尺九寸五分儀刀一對刻木為刀鞘及靶貼金鳳文為飾垂紅帉錔其鳳文貼銀為地班劒一對刻木為劒其上有靶靶下有龍頭銜劒貼金為飾劒貼以銀垂紅帉錔立瓜一對硃漆攢竹柄貼金瓜立置其首承以龍頭通長六尺九寸內龍頭及瓜長一尺四寸卧瓜一對與立瓜製同但瓜卧置其首通長六尺九寸貼金瓜并龍頭長一尺二寸五分鐙杖一對硃漆攢竹杖貼金木鐙置其首承以貼金龍頭通長六尺九寸內鐙并龍頭長一尺六寸骨朵一對硃漆攢竹柄貼金木骨朵置其首承以貼金龍頭通長六尺九寸內骨朵并龍頭長一尺六寸金鉞一對硃漆攢竹柄貼金木斧形置其上承以貼金龍頭通長六尺九寸內金鉞并龍頭長一尺六寸五分響節二對貼金柄長一丈二寸五分以鐵條貫銅錢十二置其首長一尺二寸五分紅羅衣籠之銷金鳳文長一尺五寸節頂木質貼金飾其銅錢文天下太平下有盤攀頂線四條青方傘二把傘骨面闊并頂五尺五寸傘柄并貼金木葫蘆共長一丈一尺五寸九分其面冒以青羅垂青三簷傘頂四角加抹金銅鳳頭凡傘柄俱用竹加紅油間纒以藤紅繡圓傘一把傘骨面闊并頂四尺二寸五分傘柄并貼金木葫蘆共長一丈一尺二寸九分其面冒以紅羅繡雲文垂紅三簷繡雲鳳文紅繡方扇四把扇及柄通高一丈一尺二寸面用紅羅繡鸞鳳花文背用紅羅銷金團花風衣皆紅素羅扇見圓高三尺三寸五分凡扇柄俱用攢竹加黑漆紅花圓扇四把連扇及柄通高一丈一尺二寸內扇見圓三尺三寸五分面用紅羅繡四季花背紅羅銷金團鳳風衣俱紅素羅青繡圓扇四把連扇及柄通高一丈一尺二寸內扇見圓三尺三寸五分面用青羅繡升降孔雀雲文背用青羅銷金團鳳風衣俱青素羅間抹金銀交椅一把木質銀葉裹間抹金飾中鈒雲鳳文四垂紅絲帉錔紅織金紵絲褡襠間抹金銀腳踏一箇木質銀葉裹間抹金飾中鈒方勝花文紅織金紵絲踏褥拂子二把以素氂牛尾為拂黑漆為拂柄垂紅絲帉錔今拂用馬尾心用紅纓間抹金銀水盆一箇銀盆間抹金飾中鈒雲鳳文邊鈒香草文手巾一條間抹金銀水罐一箇銀質間抹金飾有蓋有提小口巨腹鈒花文間抹金銀香爐一箇銀質間抹金兩耳三足有蓋鈒鳳文以硃漆竿舉之抹金銅鳳頭并尾間抹金銀香合一箇銀合間抹金飾蓋鈒鳳文邊鈒香草文間抹金銀唾盂一箇銀為盂間抹金飾形圓如缶蓋僅掩口下有盤鈒鳳文洪武年間停造間抹金銀唾壺一箇銀為壺間抹金飾小口巨腹有蓋鈒鳳文洪武年間停造紅紗燈籠二對硃油竹骨有燭盤外以紅紗蒙之玉色紗為蓋硃漆竿貼金鳳頭尾鳳轎一乘青頂上抹金銅珠頂四角抹金銅飛鳳四各垂銀香圓寶蓋并綵結轎身硃紅漆木匡三面篾織紋簟繪以翟文抹金銅鈒花葉片裝釘硃紅漆木轎扛抹金銅鳳頭鳳尾裝飾青銷金羅緣邊硃紅簾并看帶內紅交牀并坐踏褥紅銷金羅轎衣一件頂銷金寶珠文瀝水香草文看帶并幃皆鳳文紅油絹雨轎衣一件行障二葉紅素綾為之繪雲鳳文瀝水香草文坐障一葉紅素綾為之繪雲鳳文東宫妃儀仗紅杖一對硃漆攢竹杖銅裹兩末長四尺九寸清道旗一對青質青火焰腳硃漆攢竹竿通長一丈二尺五寸內貼金木鎗頭一尺七寸絳引幡一對硃漆攢竹竿貼金銅鳳頭共長一丈二尺五寸內鳳頭長一尺幡用五色平羅長六尺三寸闊五寸五分幡下有五色板四角寶蓋高七寸五分圍二尺七寸五分緑腰緑三簷抹金鳳頭四箇垂抹金銅珮一十六箇銅鈴三十六箇凡挑竿銅鳳頭以鐵為鈎蓋上抹金銅頂鈒花文儀鍠氅一對硃漆竿帶貼金儀鍠頭通長一丈二尺五寸五分內貼金儀鍠頭一尺三寸五分抹金銅頂一箇氅用五色平羅長六尺三寸闊五寸五分氅下綴銅鈴五箇戈氅一對硃漆攢竹竿帶貼金頭通長一丈二尺五寸內貼金頭一尺六寸二分氅用五色平羅長六尺三寸闊五寸五分氅下銅鈴五箇戟氅一對與戈氅制同惟貼金頭長一尺七寸五分梧杖一對硃漆攢竹杖兩末貼金通長六尺九寸五分儀刀一對刻木為刀鞘及靶貼金鳳文為飾垂紅帉錔其鳳文貼銀為地班劒一對刻木為劒其上有靶靶下有龍頭銜劒皆貼金為飾垂紅帉錔立瓜一對硃漆攢竹柄貼金木瓜立置其首承以貼金龍頭通長六尺九寸內瓜及竿頭長一尺四寸卧瓜一對與立瓜制同但瓜卧置其首瓜及竿頭長一尺二寸五分鐙杖一對硃漆攢竹杖以貼金木鐙置其首承以貼金龍頭通長六尺九寸內貼金頭長一尺六寸骨朵一對硃漆攢竹柄以貼金木骨朵置其首承以貼金龍頭通長六尺九寸骨朵頭長一尺六寸五分金鉞一對硃漆攢竹柄貼金木竿頭中為斧形承以貼金龍頭通長六尺九寸內竿頭長一尺六寸五分