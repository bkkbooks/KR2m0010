body:
  text: 明會典卷六十五禮部二十四婚禮皇太子納妃儀成化二十三年定納采問名前期擇日遣官告太廟牲用犢各一用祝文至期前一日所司設御座於奉天殿鴻臚寺設制案節案於御座前內官監禮部陳禮物於文樓下教坊司設中和樂於殿內至日清晨錦衣衛設鹵簿於丹陛丹墀禮部設綵輿教坊司設大樂俱於奉天門外上具衮冕御華蓋殿鴻臚寺奏執事官行叩頭禮畢請升殿導駕奉引如常儀上御奉天殿文武官朝服叩頭訖執事者引正副使朝服就拜位行四拜禮傳制官奏傳制訖由左門出執事官舉制案節案亦由左門出􅏛蓋遮護置丹墀中道傳制官宣制曰兹擇某官某女為皇太子妃命卿等持節行納采問名禮正副使又行四拜禮鴻臚寺奏禮畢上興引禮引節案制案由奉天門左門出執事官引文樓下禮物隨出至奉天門外正副使取節制書置綵輿中儀仗大樂前導從二門行出東長安門外正副使釋朝服乘馬隨行詣皇太子妃府行禮受納采問名皇太子妃府前一日設正副使幕次於大門外道左南向設香案於正堂中設制案節案於香案南别設案於香案之北其日正副使至大門外儀仗大樂分列置綵輿中正中設制案節案於綵輿北引禮引正副使入幕次執事官陳禮物於堂正副使至幕次取節制書置案上禮官一員先入正堂立於東主婚者朝服出見立於西禮官曰奉制聘皇太子妃遣使行納采問名禮引禮引主婚者出迎引禮引正副使捧節及制書先行主婚者隨行至正堂置節及制書於案正使立於案左副使立於案右引禮引主婚者就拜位行四拜禮詣案前跪正使取納采制宣訖授主婚者主婚者受之授執事者置於北案上稍左副使取問名制宣訖授主婚者主婚者受之授執事者置於北案上稍右主婚者俯伏興平身執事者舉答問名表案於主婚者後少西取表授主婚者主婚者受表跪授正使正使置表於案主婚者俯伏興平身退就拜位又行四拜禮畢正副使出置表綵輿中訖主婚者至正副使前致詞云請禮從者酒饌畢主婚者捧幣以勞正副使正副使出主婚者送至大門外正副使進發綵輿於東長安門入至奉天門外以節表授司禮監官奏聞復命納徵告期册封先期一日遣官告太廟所司設制案節案册案妃冠服禮物中和樂至日清晨設鹵簿綵輿大樂傳制遣使禮儀並同前納采問名儀但設妃儀仗車輅於左順門外候禮物過隨行又改制詞云兹册某官某女為皇太子妃命卿等持節行納徵告期册封禮受納徵告期册封皇太子妃府前一日設正副使幕次香案制案節案册案玉帛案並同前受納采問名儀但納徵用玄纁束帛榖圭八馬等物其日正副使至皇太子妃府於綵輿中取節制書册玉帛置於案少候執事者設皇太子妃冠服諸禮物於正堂八馬陳於堂下禮官一員先入正堂主婚者朝服出見禮官曰奉制封皇太子妃遣使行納徵告期册封禮主婚者出迎執事舉玉帛册案前行正使於案取節及納徵制書副使取告期制書捧之以次行主婚者後隨至正堂正副使各以節制書置於案退立於案之左右東西向置玉帛册案於制書案之南引禮引主婚者就拜位行四拜禮引詣案前跪正使取納徵制書宣訖授主婚者主婚者受之以授執事者執事者跪受置於北案正使捧圭授主婚者主婚者受之以授執事者執事者跪受置於北案副使捧纁授主婚者主婚者受之以授執事者置於北案畢副使取告期制書宣訖授主婚者主婚者受之以授執事者置於北案主婚者俯伏興平身復位行四拜禮畢正副使入次少候女官捧皇太子妃首飾冠服入中堂左內官陳儀仗車輅等物於大門之內女官以首飾冠服進皇太子妃內官進皇太子妃儀仗於中堂前司禮監官進前受節册正副使於案取節册授之仍前立候內官二人引捧節册監官入中堂前各置於案皇太子妃具服出閣女官及宫人擁護詣香案前向闕立贊禮女官贊行四拜禮贊宣册贊跪皇太子妃跪宣册女官取册立宣於妃左訖贊受册贊搢圭宣册官以册進授皇太子妃妃受册以授女官女官跪受於右立於西贊出圭興又贊四拜禮畢皇太子妃入閣持節監官由正門出授正副使報受册禮畢正副使出大門外置節綵輿中主婚者請禮從者及以幣勞正副使還至奉天門外以節授司禮監官捧入復命醮戒先期一日所司設皇太子幕次於中左門前丹墀內設皇太子受醮戒位於御座南北向設皇太子拜位於丹陛上北向設贊禮二人位於皇太子丹陛上拜位之北東西相向知班二人位於贊禮之南東西相向設酒饌案於醮戒位之東稍北設司爵司饌各二人位於案之南西向執膳內官先備金爵果合以候是日早鴻臚寺贊引二人具朝服并東宫侍從官先入至文華殿門前候皇太子出行叩頭禮贊引二人及侍從官導從由奉天左門入至幕次具衮冕以候鼓三嚴上御通天冠絳紗袍出鴻臚寺請升座上御奉天殿樂作警蹕文武官盛服行叩頭禮分班列侍如常儀樂止贊引導引皇太子出幕次至殿陛下由東階升至丹陛拜位北向立贊禮贊鞠躬四拜興平身贊引導引皇太子由奉天殿左門入就醮戒位北向立司爵斟酒以進贊引贊跪皇太子跪贊搢圭贊受爵司爵者以爵立授皇太子皇太子啐酒訖以爵授內使內使跪受爵退置於案司饌者以果盒跪進皇太子皇太子取少許食訖司饌者興以果盒退置於案贊出圭贊恭聽戒命上命之曰往迎爾相承我宗事朂帥以敬皇太子曰臣謹受命贊俯伏興平身贊復位贊引仍導由左門出至丹陛上拜位立定贊禮贊鞠躬四拜興平身贊禮畢樂作警蹕上降座還宫樂止贊引導皇太子由東升降丹墀東宫內外官皆導從由奉天左門出午門外幕次易服妃受醮戒親迎日妃家先於祠堂陳設祭物妃服燕居冠服妃父母詣祖宗前行禮奠酒讀祝禮畢執事者具酒饌於內進妃飲食訖父母坐於正堂女執事引妃詣父母前各四拜父母命之曰爾往大內夙夜勤慎孝敬毋違母命之曰爾父有訓爾當敬承妃聽受訖次詣諸尊長行禮畢改服翟衣以候親迎親迎是日早先設皇太子幕次及儀仗奠鴈并所乘輅教坊司大樂及隨侍官舍侍衛官軍俱於午門外妃家先設皇太子幕次於中門之外南向設香案奠鴈案於中堂皇太子受醮戒訖贊引導引至午門外幕次易皮辨服訖贊引跪請升輅皇太子升輅執鴈者後隨樂作儀從先導隨侍官舍官軍導從由東長安門至妃家門外贊引跪請皇太子降輅導引至幕次禮官一員先入至正廳立於東西向主婚者具朝服出見立於東西向禮官曰皇太子奉制行親迎禮引禮二人具服引主婚者迎皇太子於幕次之外內官二員具服引皇太子出幕次主婚者請皇太子入中堂皇太子先行內官具服捧鴈隨入主婚者後行至中堂主婚者進立於堂中之左妃母立於堂中之右東西相向皇太子至中堂女執事二人引妃出房立於妃母之下內官引皇太子至案前內官捧鴈跪進皇太子皇太子以鴈奠於案內官引皇太子稍退近東西向立主婚者詣鴈案前行八拜禮退復位執事者徹案引禮內官導皇太子先行至中門女轎夫舉鳳轎至於中門之內內官具妃儀仗於中門之外女執事引妃出內官跪請皇太子詣轎所啓請揭簾妃升轎內官啓請皇太子升輅前行妃具儀仗從後行由東長安門進至午門外車駕儀仗侍衛官舍官軍俱止妃儀仗入左順門內候內官跪請皇太子降輅導引入幕次候妃至轎止內官跪請皇太子揭簾妃降轎皇太子先行內執事以帷幕擁護妃後行俱步入左順門內內官跪請皇太子乘輿先行女官跪請皇太子妃升轎後行至宫門外皇太子降輿候妃至女官跪啓請皇太子妃降轎入幕次候行合卺禮合巹其日內官先於皇太子內殿外設妃幕次設皇太子座於殿東西向設妃座於西東向各設拜位於座之南設酒案於正中稍南置兩爵兩卺於案上皇太子至宫門外降輿入候於內殿門外之東西向妃降轎女官以帷幕擁護導引入幕次整飾訖導引至內殿門西東向贊引二人導皇太子前升殿女官二人導妃隨升贊請就拜位皇太子與妃各就拜位贊皇太子兩拜妃四拜贊請升座皇太子與妃皆升座女執事二人舉饌案進於皇太子及妃之前女官司樽者取金爵酌酒以進皇太子與妃各受爵飲訖女官進饌皇太子與妃皆舉饌訖女官再以金爵進酒皇太子與妃飲訖女官進饌皆舉饌訖女官再以卺盞酌酒合和以進皇太子與妃皆飲訖又進饌皇太子與妃皆舉饌凡三舉酒饌畢執事者徹饌案贊皇太子與妃興就拜位相向贊兩拜如前儀畢皇太子從者餕妃之饌妃從者餕皇太子之饌皇太子從者導皇太子入宫更禮衣妃從者及女官導妃入宫易常服兩宫朝見第二日清晨皇太子冕冠妃翟衣女官贊引各啓請出宫至某宫門外以伺某宫服燕居服升座贊引引皇太子及妃自左門入皇太子先入妃從之贊禮贊詣某宫前皇太子立於東妃立於西宫人以腵修盤立於妃之右贊皇太子與妃皆四拜執事二人舉案至某宫前宫人以腵修盤授妃妃捧盤置於案執事者舉案妃隨案進至某宫前妃復位贊皇太子與妃皆四拜興執事者徹腵修案於東贊禮畢引皇太子與妃出詣上位宫前伺上位具常服升座贊引引皇太子及妃由左門入詣上位前進棗栗盤行禮同前畢詣皇后宫進腵修盤行禮同前畢贊引引皇太子及妃出是日賜皇太子與妃宴盥饋第三日清晨妃服翟衣贊引引妃至某宫由左門入伺膳至贊引引妃至前贊四拜尚食以膳授妃妃捧膳置於案復位又贊四拜禮贊引引妃退立於西南伺膳畢引妃出升轎詣乾清宫門外降轎由左門入伺膳至贊引引妃詣上位前并皇后前禮俱同廟見第四日內官於奉先殿陳設牲醴祝帛贊引二人引皇太子二人引妃至奉先殿詣德祖玄皇帝皇后神御前贊皇太子與妃皆兩拜贊跪皇太子跪妃亦跪贊搢圭皇太子進圭贊進帛執事者跪進於皇太子右贊獻帛皇太子受帛以獻授執事者贊奠帛執事者以帛奠於神御前贊進爵執事者以爵跪進於右贊獻爵皇太子受爵以獻授執事者贊奠爵執事者以爵奠於神御前贊再進爵執事者以爵進贊獻爵皇太子受爵以獻授執事者贊奠爵執事者以爵奠於神御前贊俯伏興皇太子俯伏興妃亦興贊復位贊皇太子與妃皆兩拜平身次詣各廟禮同前贊詣讀祝位皇太子與妃詣讀祝位贊跪皇太子跪妃亦跪讀祝訖贊俯伏興平身皇太子俯伏興平身妃亦興贊復位贊皇太子與妃皆兩拜平身贊執事者捧祝帛各詣燎所贊詣燎位贊禮畢引禮引皇太子及妃還宫慶賀是日早上具皮辨服御華蓋殿執事官行禮奏請升殿導駕樂作陳設如常儀文武百官具朝服先行四拜禮鴻臚寺官詣丹陛上跪致詞曰某官臣某等恭惟皇太子嘉禮既成益綿宗社隆長之福臣某等不勝欣忭之至謹當慶賀又四拜禮畢上起易服賜宴羣臣如冬至正旦之儀其日命婦慶賀皇太后行禮致詞如前但致詞某官某夫人妾某氏等後又改妾某氏等禮畢慶皇后禮同前但改致詞曰皇太子嘉聘禮成益綿景福餘並同禮畢皇太后賜宴命婦明會典卷六十五
