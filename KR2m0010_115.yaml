  text: 明㑹典卷一百十五兵部十車駕清吏司諸司職掌郎中員外郎主事掌邦國輿輦車乘及天下傳驛廐牧鹵簿鹵簿儀仗陳設𨽻本部諸司職掌所載與後來増定詳畧不同間有未經該載者今並列于後若造作制度則别具工部職掌諸司職掌凡正旦冬至聖節㑹同錦衣衛陳鹵簿大駕於殿之東西須要各依次序毋得錯亂有失朝儀黄麾一對降引旛五對告止旛五對傳教旛五對信旛五對龍頭竿五對戈氅十對㦸氅十對儀鍠氅十對朱雀幢一𤣥武幢一青龍幢一白虎幢一金節三對豹尾二對羽葆幢三對梧杖三對立瓜三對卧瓜三對儀刀三對㦸十二對斑劍三對響節十二對龍㦸三對鐙仗三對金鉞三對骨朶三對金水罐一金盆一金脚踏一金馬杌一鞍籠一紅紗燈籠一對紅油紙燈籠三對紫羅素方傘四把紅羅素方傘四把黄羅直柄繡傘四把紅羅曲柄繡傘四把紅羅單龍扇十把黄羅單龍扇十把黄羅雙龍扇二十把紅羅雙龍扇二十把紅羅素扇二十把黄羅素扇二十把紅羅繡雉方扇十二把紅羅繡花扇十二把玉輅一乘大輅一乘九龍車一乘步輦一乘馬十二匹永樂三年増定肅靖旗一對金鼓旗一對金龍畫角二十四枝鼓四十八靣金四面金鉦四面杖鼓四箇笛四管板四串白澤旗一對門旗四對黄旗四十面金龍旗十二面日月旗二面風雲雷雨旗四面木火金水土星旗五面列宿旗二十八面北斗旗一面東嶽旗一面南嶽旗一面中嶽旗一面西嶽旗一面北嶽旗一面江河淮濟旗四面青龍旗一面白虎旗一面朱雀旗一面𤣥武旗一面天鹿旗一面天馬旗一面鸞旗一面麟旗一面熊旗一面羆旗一面紅纛二把皂纛一把紅節二把小銅角二箇大銅角二箇纓頭一箇豹尾一箇麾一把戯竹一對簫十二管笙十二攅龍笛十二管頭管十二管方響四架􅌙八架琵琶八把箜篌八把杖鼓三十六箇板四串大鼓二面弓矢百副御杖六十根誕馬二十四匹領頭六對黄麾一對絳引旛五對傳教旛五對告止旛五對信旛五對龍頭竿五對豹尾二對儀鍠氅十對戈氅十對㦸氅十對單㦸三對龍㦸三對斑劍三對梧杖三對立瓜三對卧𤓰三對儀刀三對金鐙三對金鉞三對骨朶三對羽葆幢五對青龍幢一白虎幢一朱雀幢一𤣥武幢一響節十二對金節三對方天㦸十二對鳴鞭四條金馬杌一金交椅一金脚踏一金水盆一金水罐一金香爐一金香盒一金唾盂一金唾壺一拂子四把紅紗燈籠六對紅油紙燈籠三對魫燈三對紫羅素方傘四把紅羅素方傘四把紅羅直柄華葢繡傘四把紅羅曲柄繡傘四把黄羅直柄繡傘四把紅羅直柄繡傘四把黄羅曲柄繡傘二把銀鈴全青羅銷金傘三把紅羅銷金傘三把黄羅銷金傘三把白羅銷金傘三把黒羅銷金傘三把黄油絹銷金雨傘一把紅羅繡花扇十二把紅羅繡雉方扇十二把紅羅單龍扇十把黄羅單龍扇十把紅羅雙龍扇二十把黄羅雙龍扇二十把紅羅素扇二十把黄羅素扇二十把壽扇二把黄羅銷金九龍傘一把黄羅曲柄繡九龍傘一把仗馬六匹硃紅馬杌四箇鞍籠二箇金銅玲瓏香爐一寶匣一座板轎一乘步輦一乘大涼步輦一乘大馬輦一乘小馬輦一乘玉輅一乘大輅一乘黄帳房一座丹陛駕凡常日奉天門早朝設丹陛駕於午門外及金水橋南單龍㦸三對雙龍㦸三對斑劍三對梧杖三對儀刀三對立𤓰三對卧𤓰三對鐙杖三對金鉞三對骨朶三對單龍扇二十把雙龍扇二十把黄葢傘二把黄曲柄傘二把五方傘五把鳴鞭四條弓矢五十副太后鹵簿紅杖一對清道旗一對黄麾一對絳引旛三對傳教旛二對告止旛二對信旛二對龍頭竿五對儀鍠氅五對戈氅五對㦸氅五對梧杖三對立𤓰三對卧𤓰三對儀刀三對斑劍三對鐙杖三對金鉞三對骨朶三對響節六對羽葆幢二對紫方傘二把紅方傘二把黄銷金傘一把黄繡曲柄傘二把紅繡傘一把紅素圓傘二把紅繡雉方扇六把紅繡花圓扇六把青繡方扇六把紅羅素圓扇六把黄羅素圓扇六把拂子二把紅紗燈籠二對紅油紙燈籠一對魫燈一對金交椅一把金脚踏一箇金水盆一箇金水罐一箇金香爐一箇金香金一箇金唾盂一箇金唾壺一箇行障二葉坐障一葉輅一乘安車一乘太皇太后鹵簿同前中宫鹵簿紅杖一對清道旗一對黄麾一對絳引旛三對傳教旛二對告止旛二對信旛二對龍頭竿五對儀鍠氅五對戈氅五對㦸氅五對梧杖三對立𤓰三對卧𤓰三對儀刀三對斑劍三對鐙杖三對金鉞三對骨朶三對響節六對羽葆幢二對紫方傘二把紅方傘二把黄銷金傘一把黄繡曲柄傘二把紅繡傘一把紅素圓傘二把紅繡雉方扇六把紅繡花圓扇六把青繡方扇六把紅羅素圓扇六把黄羅素圓扇六把拂子二把紅紗燈籠二對紅油紙燈籠一對魫燈一對金交椅一把金脚踏一箇金水盆一箇金水罐一箇金香爐一箇金香盒一箇金唾盂一箇金唾壺一箇行障二葉坐障一葉輅一乘安車一乘羽儀諸司職掌凡郊祀弔䘮臨祭車駕出入合用某等羽儀導引㑹同錦衣衛須要各依定制陳布毋得相參事例一郊祀鹵簿大駕全設前期視牲用丹陛駕一祭社稷鹵簿大駕内去白澤旗以下至𤣥武豹尾大涼步輦至大輅不設餘同郊祀一祭太廟一祭山川並與社稷同一耕籍田一幸太學俱用鹵簿大駕明㑹典卷一百十五
