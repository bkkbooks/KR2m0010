body:
  text: 明㑹典卷一百六十四都察院一國初置御史臺從一品衙門設左右御史大夫御史中丞侍御史治書侍御史殿中侍御史經歴都事照磨管勾監察御史譯事引進等官洪武十三年改正二品衙門設左右中丞十四年始改都察院為七品衙門止設監察御史又分設浙江江西福建北平廣西四川山東廣東河南陜西湖廣山西道監察御史十六年陞正三品衙門設司務十七年始陞正二品衙門定設左右都御史左右副都御史左右僉都御史經歴都事十二道監察御史二十九年置照磨所照磨檢校永樂元年改北平道為北京道十九年北京道革添設貴州交阯雲南三道宣徳十年交阯道革共十三道諸司職掌左右都御史副都御史僉都御史職專糾劾百司辯明寃枉提督各道及一應不公不法等事其屬有十二道監察御史凡遇刑名各照道分送問發落其有差委監察御史出巡追問審理刷卷等事各具事目請㫖㸃差選用風憲憲綱凡都察院各道監察御史并首領官按察司官并首領官自今務得公明廉重老成歴練之人奏請除授不許以新進初仕及知印承差吏典出身人員充用事例宣徳三年令都察院選進士監生教官堪任御史者於各道歴政三箇月考其賢否第為三等上中等授御史下等送回吏部正統四年令凡御史缺從吏部於進士監生教官儒士出身曾歴一任者選送都察院歴政半年考試除授六年奏准凡御史員缺於行人博士知縣推官斷事理問及各衙門司務各按察司首領官進士監生出身一考兩考者吏部揀選送院問刑半年堂上官考試除授景泰六年奏准進士年三十以上并歴事聴選監生原係舉人者及考滿在部教官該陞者通取赴吏部考選試職一年滿日仍從本院堂上官考察實授不堪用者送回吏部别用成化十年令御史缺選進士年三十以上者問刑半年考試除授博士行人推官知縣兼選仍試職二十年奏准試監察御史一年已滿刑名未熟再試半年仍前考試實授𢎞治元年奏准行人知縣等官送都察院理刑半年滿日聴本院考察各註考語連人送吏部查照選用六年奏准御史員缺數多行取推官知縣等官選補不必限定㡬年一次行取但遇兩京各道缺至八員以上吏部㑹同本院考選照原職分送理刑自後凡行取推官知縣等官或理刑半年或試職一年本院仍考其堪任者除補十五年奏准今後御史有缺照憲綱例於博士行人知縣推官并教官内考選歴練老成者除補㸃差御史憲綱凡差御史分巡并追問審理等事都察院具事目請㫖㸃差回京之日不須經由本院徑赴御前復奏事例凡巡按御史一年已滿差官更代都御史引御史二員御前㸃差一員其提調學校本院㑹吏禮二部㑹推一員奏差刷卷清軍巡鹽巡河巡關巡茶印馬盤糧勘事俱以一員奏差𢎞治十一年奉㫖各具二員㸃差其巡城巡視光禄寺巡庫等項俱本院給劄差委考察風憲憲綱凡監察御史行過文卷從都察院磨勘按察分司行過文卷聴總司磨勘如有違錯即便舉正中間果有枉問事理應請㫖者具實奏聞事例正統六年詔中外風憲係綱紀之司須慎選識量端𢎞才行老成者任之其有不諳大體用心酷刻者並從都察院堂上官考察降黜十四年令御史公差回還都察院堂上官考其稱否具奏天順八年詔御史公差回還不必考覈成化六年奏准各處巡按御史俱要親理詞訟仍將本院遞年發去勘合逐一問結繳報御史回還備開接管已未完勘合件數具呈本院查考七年奏准巡按公差御史回京之日本院堂上官仍依舊例查勘考察保結稱職者具奏照舊管事若有不稱奏請黜罷𢎞治十年奏准各處清軍并巡按等項御史回京本院考察果有不職事蹟及過違限期者參奏黜退考察百司事例凡在外布政司按察司并鹽運司苑馬寺行太僕寺在内順天府五品以下堂上官考滿赴部俱從本院考覈凡在外司府州縣等衙門官每三年朝覲吏部㑹同本院考察凡奉㫖考察在京五品以下官吏部㑹同本院并各該衙門堂上官及掌印官考察凡在京各衙門郎中員外郎主事等官及直𨽻府州等官各衛所首領官在外按察司首領官考滿本院俱發河南道考覈各出考語牒送吏部該司候考審録重囚事例凡每年霜降後本院以各道問擬該决重囚具奏引赴承天門外㑹官審録凡捕獲强盗綁赴御前引奏者本院同刑部大理寺錦衣衛堂上官於午門前㑹問凡每年天氣炎熱之時本院與刑部大理寺奉勑以見監罪囚審録月報罪囚事例凡每月各道月初起至月終止以問過輕重罪囚原報及己未發落實在數目各若干具呈本院轉具掲帖開報刑科查照巡撫地方事例永樂十九年勑大臣十三員各同給事中一員巡行天下宣徳間命巡撫官每嵗八月一赴京議事景泰四年以鎮守侍郎與巡按御史不相統屬難於行事又文移往來亦多窒礙改為都御史巡撫五年定巡撫官赴京議事例遼東大同每年一次寧夏延綏甘肅二年一次俱四月初一日至京南北直𨽻及北方腹裏者仍每年一次四川及南方者亦二年一次俱八月初一日至京其二年一次者若果地方寧静事有應議者聴從一年一次凡各處巡撫官初遣尚書侍郎都御史少卿等官後專用都御史初名巡撫或名鎮守後定為巡撫兼軍務者加總督贊理掌糧餉者加總督兼理他如整飭邊備提督邊關及撫治流民等項皆隨事異名若邊境有事又有總督提督總制參贊贊理及經畧巡視之名近例尚書侍郎治事於外者兼都御史以便行事事畢而罷諸司職掌十二道監察御史照刷卷宗衙門浙江道中軍都督府留守中衛廣洋衛府軍左衛神䇿衛應天衛和陽衛直𨽻廬州府江西道前軍都督府府軍前衛豹韜衛龍江衛龍驤衛天䇿衛直𨽻淮安府福建道户部金吾後衛飛熊衛直𨽻池州府常州府北平道吏部金吾前衛旗手衛直𨽻蘇州府廣西道通政使司鎮南衛五軍斷事官直𨽻安慶府徽州府四川道工部府軍衛直𨽻松江府廣徳州山東道兵部羽林右衛典牧所直𨽻鳳陽府徐州遼東都司廣東道刑部虎賁左衛直𨽻應天府河南道禮部太常司羽林左衛國子監翰林院欽天監光禄司儀禮司教坊司直𨽻揚州府陜西道後軍都督府江隂衛䝉古左右衛府軍後衛鷹揚衛興武衛横海衛大理寺行人司直𨽻和州湖廣道右軍都督府武徳衛水軍右衛廣武衛虎賁右衛留守右衛五城兵馬司直𨽻寧國府山西道左軍都督府留守左衛英武衛錦衣衛水軍左衛驍騎右衛府軍右衛龍虎衛直𨽻鎮江府太平府見今十三道帶管衙門浙江道中軍都督府留守中衛茂陵衛府軍左衛廣洋衛神䇿衛金吾左衛金吾右衛和陽衛應天衛武功中衛武功後衛越府羣牧所金吾前衛牧馬千户所廬州府衛六安州衛江西道前軍都督府豹韜衛天䇿衛邳州衛龍江左右三衛龍驤衛府軍前衛燕山左衛羽林前衛寛河衛淮府羣牧所淮安府衛九江衛大河衛武清衛龍門衛福建道户部金吾後衛裕陵衛忠義左衛武功左右前三衛飛熊衛承運庫廣積庫甲乙丙丁戊字庫寳鈔提舉司天財庫廣惠庫贓罰庫印造鈔局廣盈庫軍儲庫龍江批驗鹽引所抄紙局武成中衛景陵衛常州府池州府美峪千户所獻陵衛開平中屯衛定逺衛行用庫四川道工部軍器局御用監針工局尚衣監文思院皮作局惜薪司寳源局府軍衛濟州衛永清左衛蔚州衛營繕所常山羣牧千户所鞍轡局冠帽局兵仗局織染局大寧前衛金山衛石砫宣撫司播州宣慰司天全六畨招討司酉陽等宣撫司松江府廣徳州潼川州梁府羣牧所懷來衛懷安衛孝陵神宫監陜西道後軍都督府大理寺行人司興武衛神武後衛鷹揚衛義勇中右二衛横海衛牧馬千户所江隂衛韓秦慶三府和州安化王府保定左右中前四衛府軍後衛寧夏衛䝉古左右二衛敢勇報效二營雲南道順天府廣備庫羽林前衛隆慶左右二衛永平府衛廣平府通州三衛盧龍衛密雲中後二衛鎮虜衛撫寧衛東勝左右二衛萬全左右二衛山海衛涿鹿四衛黄花鎮千户所營州左右中前後五衛大同中屯衛居庸關寛河千户所樂安千户所定州千户所宣河千户所趙府河南道禮部翰林院國子監光禄寺都察院伊唐周鄭四府太常寺鴻臚寺欽天監鐘皷司太醫院教坊司羽林左衛彭城衛留守前後二衛衛府羣牧所鄭府儀衛司尚寳司神武左右前三衛揚州府衛兩淮鹽運司大名府汝寧千户所睢陽衛潼關衛髙郵衛寧山衛儀真歸徳武平三衛廣西道通政司六科燕山前右二衛忠義前後二衛富峪衛大興左衛瀋陽左衛㑹州衛鎮南衛武驤左衛騰驤左右二衛徽州府真定府保定府紫荆關倒馬關安慶府衛新安衛真定衛興河千户所廣昌千户所鎮武衛牧馬千户所南丹衛髙山衛廣西衛靖江王府儀衛司廣東道孝陵衛刑部應天府虎賁左衛瀋陽左右二衛常山中䕶衛濟陽衛武功左右二衛武驤右衛長陵衛隆慶州衛懷來千户所安東中䕶衛山西道左軍都督府錦衣衛留守左衛驍騎左右二衛義勇前後二衛府軍右衛水軍左衛英武衛龍虎衛大寧中衛鎮江府衛太平府衛建陽衛朔州衛振武衛天城衛瀋陽中屯衛陽和衛雲川衛蒲州衛平定州千户所威逺衛晉府長史司山東道皇陵衛兵部㑹同館大通關羽林右衛瀋陽中衛常山右䕶衛御馬監濟寧衛永清右衛典牧所滕府牧馬千户所遼東都司鳳陽府衛徐滁二州并衛沂州衛中都留守司泗州衛懷逺衛長淮衛徳州二衛保定後衛廣寧衛夀州衛宿州衛鳳陽中衛鳳陽左衛洪塘湖千戸所湖廣道右軍都督府五城兵馬司留守右衛虎賁右衛江淮衛武徳衛忠義右衛水軍右衛廣武衛義勇左衛荆襄楚三府長史司寧國府衛遼梁岷吉四府宣州衛華陽王府神武中衛茂山衛定州衛開平衛貴州道吏部太僕寺上林苑監旗手衛忠義中衛蘇州府衛順徳府河間府衛保安州衛太倉鎮海二衛梁城千戸所大寧都司興州五衛天津三衛宣府三衛玉林永寧二衛遵化薊州二衛鎮朔蔚州二衛龍門千戸所滄州千户所長蘆鹽運司萬全都司十二道監察御史職掌後為十三道糾劾百司諸司職掌凡文武大臣果係姦邪小人搆黨為非擅作威福紊亂朝政致令聖澤不宣災異迭見但有見聞不避權貴具奏彈劾凡百官有司才不勝任猥瑣闒茸善政無聞肆貪壞法者隨即糾劾凡大小祭祀敢有臨事不恭牲幣不潔䙝瀆神明有乖禮典失於舉行及刑餘疾病之人陪祭執事者隨即糾劾凡朝㑹行禮敢有攙越班次言語諠譁有失禮儀及不具服者隨即糾問凡在外有司擾害善良貪贓壞法致令田野荒蕪民人受害體訪得實具奏提問凡學術不正之徒上書陳言變亂成憲希求進用或才徳無可稱挺身自拔者隨即糾劾以戒奔競憲綱凡風憲任紀綱之重為耳目之司内外大小衙門官員但有不公不法等事在内從監察御史在外從按察司糾舉其糾舉之事須要明著年月指陳實跡明白具奏若係機密重事實封御前開拆並不許虛文泛言若挾私搜求細事及糾言不實者抵罪凡大朝㑹行禮若有失儀聴糾儀御史舉劾常朝大小衙門官員奏事理有未當及失儀者聴侍班御史并給事中劾奏依律罰俸凡祭祀郊社宗廟山川等神若有怠於職事及失儀者并聴糾儀御史舉劾依律責罰凡糾舉官員生殺予奪悉聴上命若已有㫖發落不許再劾凡都察院按察司堂上官及首領官各道監察御史吏典但有不公不法及曠職廢事貪淫暴横者許互相糾舉毋得狥私容蔽其所糾舉並要明具實跡奏請按問明白覆奏區處其有挾私妄奏者抵罪凡國家政令得失軍民利病一切興利除害等事並聴監察御史按察司官各陳所見直言無隱若建言創行事理必須公同評議互相可否務在得宜方許實封陳奏問擬刑名諸司職掌凡鼓下或通政司發下告人連狀到院責令供狀明白保管聴候照出狀内被告人數入流官員具呈本院奏聞提取其軍民人等給批差人提取理對招供明白取訖服辯無招干連隨即保管聴候有罪人數牢固監禁追徴所招贓仗完足責令庫子收貯議擬罪名開寫原發事由問擬招罪照行事理徒流遷徙死罪充軍人數具寫奏本笞杖以下止具牒文僉押完備連囚赴堂備説所犯情節罪名審無異詞然後入遞將囚押送大理寺審録候平允回報若罪名不當駁回再問仍將所駁招罪㕘詳明白再擬改正或有畨異則監收聴候調别衙門再問其餘審允人數除笞杖徒流徒罪准工囚人備開年甲住址畧節招罪工役限期呈堂編發工役的决笞杖人數書寫斷單開具合得罪名㑹請刑部等官公同斷决取完僉批單入卷其充軍囚人具手本送編軍御史處照地方編發取收管附卷絞斬死罪仍令司獄司轉送重囚監牢固枷收聴候大理寺依時覆奏回報具手本㑹請刑部等官公同處决仍取决訖月日批单附卷無招疎放并笞杖的决還職着役寧家人數另具公文差人管送各該衙門給憑發回取批收附卷原收贓仗候季終通類具呈本院出給長单差委御史觧赴内府該庫交納足備取獲庫收附卷如有追無見贓囚人責供明白類行原籍追徴及照出合問人數隨即呈提前項審過囚人設有病故請官相視明白取獲批单附卷若干係重囚牒報大理寺知㑹候本宗事完通具結絶縁由呈堂照驗餘與刑部同憲綱凡告有司官吏人等取受或出首贓私等事直𨽻赴巡按監察御史在外赴按察司并分司及巡按監察御史處陳告追問明白依律施行其應請㫖者奏聞挐問若軍官有犯在京從都察院在外從巡按監察御史按察司并分司密切奏請施行其各都司及衛所首領官有犯即便挐問凡都察院并監察御史按察司綱紀所繫其任非輕行事之際一應諸衙門官員人等不許挾私沮壞違者杖八十若有干礙合問人數敢無故占恡不發者與犯人同罪凡按察司官斷理不公不法等事果有寃枉者許赴巡按監察御史處聲寃監察御史枉問許赴通政司遞狀送都察院伸理都察院不與理斷或枉問者許擊登聞皷陳訴凡風憲官問定官員贓罪如有寃屈許本犯從實聲訴若果真犯實跡不肯伏罪或揑造挾讐等項為詞摭拾原問者於本犯上加二等科罪仍押至午門前聴候再審凡監察御史按察司官追問公事中間如有讐嫌之人並聴移文陳説迴避若䑃朧懷私按問致有違枉者於反坐上加二等科罪所問雖實亦以不應科斷凡監察御史按察司官追問輕重刑名中間果有律令該載不盡者比擬律條開具請㫖凡都察院官及監察御史按察司官吏人等不許於各衙門囑託公事違者比常人加三等有贓者從重論明㑹典卷一百六十四
