body:
  text: 明會典卷一百五十七工部十一窰冶窰冶燒造鑄造諸器物及紙劄之費皆官府取用若銅錢與鈔兼行於民間尤不可缺者今並載之而鑄造則例加詳焉磚瓦諸司職掌凡在京營造合用磚瓦每嵗於聚寶山置窑燒造所用蘆柴官為支給其大小厚薄樣制及人工蘆柴數目俱有定例如遇各處支用明白行下各該管官員放支管事作頭每季交替仍將所燒過物件支銷其見在之數明白交割若修砌城垣起蓋倉庫營房所用磚瓦數多須要具奏著落各處人民共造如燒造琉璃磚瓦所用白土例於太平府採取琉璃窰每一窑裝二樣板瓦坯二百八十箇計匠七工用五尺圍蘆柴四十束每一窑裝色二百八十箇計匠六工用五尺圍蘆柴三十束四分用色三十二斤八兩九錢三分二釐黑窰每中窑一座裝到大小不等磚瓦二千三百箇計匠八十八工用五尺圍蘆柴八十八束事例洪武間令各處客船量數帶載沿江燒造官磚於本部交納以後停止永樂三年令照舊例納磚每百料船納磚二十五箇沙磚加倍後減定磚二十箇沙磚三十箇宣德二年令沿河一帶燒磚以河南山東二都司并直隸衛所撥軍夫五千名仍以添設官十五員分行提督成化十七年添設郎中二員於山東河南及南北直隸原有窑處減半燒造𢎞治八年奏准停止燒磚官員請勑河南山東及南北直隸巡撫官委府州縣官管理仍以布按二司分巡分守官提督燒造陶器諸司職掌凡燒造供用器皿等物須要定奪樣制計算人工物料如果數多起取人匠赴京置窑興工設或數少行移饒處等府燒造事例嵗造內府供用庫每年該用磁罈一千五百箇光祿寺每年該用缸罈瓶共五萬一千八百五十箇隻俱分派河南布政司并直隸真定府燒造河南彰德府每年造瓶罈缸共一萬七千二百八十四件鈞州每年造瓶罈缸共一萬七千二百八十三件直隸真定府曲陽縣每年造瓶罈缸一萬七千二百八十四件俱送光祿寺供用正統元年奏准減省燒造供用庫每嵗止派磁罈七百五十箇景泰五年奏准光祿寺瓶罈以三分為率二分以本寺日進月進內府并賞內外官瓶罈俱令盡數送寺備用量派一分以省民力天順三年奏准光祿寺奏造素白磁龍鳳文碗楪以十分為率減造四分成化四年奏准光祿寺磁器仍依四分例減造十七年奏准光祿寺嵗用瓶罈仍照舊例或二年或三年一次奏造仍令厨役關領必須委官親詣處所挨次支用凡損失就於本厨名下照數追賠還官𢎞治十五年奏准光祿寺嵗用缸瓶罈自本年為止已造完者解用未完量減三分之一仍令本寺該管人員撙節有輕易及毁失者許科道官查究送問賠償鑄器諸司職掌凡鑄造銅鍋銅匱等器及打造銅鍋銅竈鐵窗鐵猫等件行下寶源局定奪模範及計算合用銅鐵木炭等項明白具數呈部行下丁字庫抽分竹木局放支督工依式鑄造鑄造生銅一斤用炭一十二兩黃熟銅一斤用炭一斤紅熟銅一斤用炭一斤生鐵一斤用炭一斤打造紅熟銅一斤用炭八斤黃熟銅一斤用炭八斤瓜鐵一斤用炭一斤八兩事例凡鑄親王各土官衙門金牌信符并上直守衛官軍金牌俱令寶源鑄印二局官金牌信符會同尚寶監於內府金牌厰同造印記會同印綬監於內府六科廊同造造完送銀作局鍍金其鑄鐘用響紅銅於鑄鐘厰鑄造銅鐵諸司職掌凡各處爐冶每嵗煽煉銅鐵彼先行移各司嵗辦後至洪武十八年四月內欽依住罷至今不曽復設如果缺用即須奏聞復設爐冶採取生礦煅煉著令有司差人陸續起解照例送庫收貯如係臨邊用鐵去處就存聽用計各處爐冶該鐵一千八百四十七萬五千二十六斤湖廣六百七十五萬二千九百二十七斤廣東一百八十九萬六千六百四十一斤北平三十五萬一千二百四十一斤江西三百二十六萬斤陜西一萬二千六百六十六斤山東三百一十五萬二千一百八十七斤四川四十六萬八千八十九斤河南七十一萬八千三百三十六斤浙江五十九萬一千六百八十六斤山西一百一十四萬六千九百一十七斤福建一十二萬四千三百三十六斤見今各處嵗辦鐵課福建布政司共二十八萬四千六百三十斤浙江布政司七萬四千五百八十三斤廣東潮州府程鄉縣七萬斤遵化鐵冶班匠工程燒炭人匠七十一户該木炭一十四萬三千七十斤淘沙人匠六十三户該鐵沙四百四十七石三斗鑄鐵等匠六十户附近州縣人夫六百八十三名每年十月上工至次年四月放工每年該運京鐵三十萬斤遵化三衛一所一縣十萬斤薊州三衛一州七萬斤三河二衛二縣六萬斤通州四衛一州七萬斤事例洪武初置湖廣鐵冶七年置江西南昌府進賢冶臨江府新喻冶袁州府分宜冶湖廣興國冶蘄州黃梅冶山東濟南府萊蕪冶廣東廣州府陽山冶陜西鞏昌冶山西平陽府吉州富國豐國二冶太原府大通冶潞州潤國冶澤州益國冶每冶各大使一員副使一員十八年罷各布政司鐵冶二十七年復置山西平陽吉州豐國富國二鐵冶又復置江西袁州府分宜縣鐵冶二十八年罷各布政司官冶令民得採煉出賣每嵗輸課三十分取二永樂二十年設四川龍州鐵冶成化十九年令遵化鐵厰嵗運京鐵每車一輛裝鐵不得過一千七百斤車價不得過三兩五錢俱候農隙之時領運交納鑄錢諸司職掌凡在京鼓鑄銅錢行移寶源局委官於內府置局每季計算人匠數目其合用銅炭油麻等項物料行下丁字庫等衙門放支如遇鑄完收貯奏聞差官類進內府司鑰庫交納取批回實收長單附卷若在外各布政司一體鼓鑄本部類行各司行下寶源局委官監督人匠照依在京則例鑄完錢數就於彼處官軍收貯聽候支用則例當十錢一千箇燻模用油一十一兩三錢鑄錢連火耗用生銅六十六斤六兩五錢炭五十三斤一十五兩二錢當五錢二千箇燻模用油一斤四兩鑄錢連火耗用生銅六十六斤六兩五錢炭五十三斤一十五兩二錢當三錢三千三百三十三箇燻模用油一斤一十四兩鑄錢連火耗用生銅六十五斤九兩二錢五分炭五十三斤八兩三錢五分折二錢五千箇燻模用油二斤五兩五錢鑄錢連火耗用生銅六十六斤六兩五錢炭五十三斤一十五兩二錢小錢一萬箇燻模用油一斤四兩鑄錢連火耗用生銅六十六斤六兩五錢炭五十三斤一十五兩二錢穿錢麻當十錢每串五百箇用一兩當五錢每串五百箇用八錢當三錢每串一千箇用一兩折二錢每串一千箇用七錢小錢每串一千箇用五錢銅一斤鑄錢不等外增火耗一兩當十錢一十六箇折小錢一百六十文當五錢三十二箇折小錢一百六十文當三錢五十四箇折小錢一百六十文折二錢八十箇折小錢一百六十文小錢一百六十文鑄匠每一名一日鑄當十錢一百二十六箇當五錢一百六十二箇當三錢二百三十四箇折二錢三百二十四箇小錢六百三十箇銼匠每一名一日銼當十錢二百五十二箇當五錢三百二十四箇當三錢四百六十八箇折二錢六百四十八箇小錢一千二百六十箇各處爐座錢數山東二十二座半每嵗鑄錢一千二百一十二萬一千文山西四十座每嵗鑄錢二千三百三十二萬八千文河南二十二座半每嵗鑄錢一千三百一十二萬二千文浙江二十座每嵗鑄錢一千一百六十六萬四千文江西一百一十五座每嵗鑄錢六千七百六萬八千文北平二十一座每嵗鑄錢一千二百八十三萬四百文廣西一十五座半每嵗鑄錢九百三萬九千六百文陜西三十九座半每嵗鑄錢二千三百三萬六千四百文廣東一十九座半每嵗鑄錢一千一百三十七萬二千四百文四川一十座每嵗鑄錢五百八十三萬二千文事例洪武四年令鑄洪武通寶錢二十年令各布政司停止鑄錢二十二年復鑄錢與鈔兼用更定錢樣分兩永樂六年令鑄永樂通寶錢宣德八年令鑄宣德通寶錢顔料諸司職掌凡合用顔料專設顔料局掌管淘洗青緑將見在甲字庫石礦按月計料支出淘洗分作等第進納若燒造銀硃用水銀黃丹用黑鉛俱一體按月支料燒煉完備逐月差匠進赴甲字庫收貯如果各色物料缺少定奪奏聞行移出産去處採取或給價收買鈔法紫粉所用數多止用蛤粉蘇木染造時常預為行下本局多為備辦用度如缺蛤粉一體收買黑鉛一斤燒造黃丹一斤五錢三分三釐水銀一斤燒造銀硃一十四兩八分二硃三兩五錢二分次青碌石礦一斤淘造淨青碌一十一兩四錢三分暗色碌石礦一斤淘造淨石碌一十兩八錢七分六釐蛤粉一斤燒造紫粉一斤一兩六錢䃃砂一斤燒造䃃砂碌一十五兩五錢事例洪武間聖㫖如今營造合用顔料但是出産去處便著有司借倩人夫採取來用若不係出産去處著百姓怎麼辦那當該官吏又不明白具奏只指著朝廷名色以一科百以十科千百般苦害百姓似這等無理害民官吏拿來都全家廢了不饒若那地面本出産却奏說無以後著人採取得有時那官吏也不饒雖是出産去處也須量著人的氣力採辦似這等百姓也不艱難生受官民兩便若有司家因而生事擾害他的拿來全家廢了不饒永樂二十二年聖㫖古者工賦隨地所産不强其所無比年如丹漆石青之類所司更不究産物之地一槩下郡縣徵之郡縣逼迫小民鳩斂金幣詣京師博易輸納而商販之徒乘時射利物價騰踴數十倍加不肖官吏夤緣為奸計民所費朝廷得其千百之十一其餘悉肥下人今宜切戒此弊凡合用之物必於出産之地計直市之若仍蹈故習一槩科派以毒民者必誅不宥成化二年令內官監促辦纍年未納物料急用者以官銀收買不急者停止紙劄諸司職掌凡每嵗印造茶鹽引由契本鹽糧勘合等項合用紙劄著令有司抄解其合用之數如庫缺少定奪奏聞行移各司府州照依上年紙數抄造解納如遇起解到部隨即辨驗堪中如法差人進赴乙字庫收貯聽用産紙地方分派造解額數陜西十五萬張湖廣十七萬張山西十萬張山東五萬五千張福建四萬張北平十萬張浙江二十五萬張江西二十萬張河南五萬五千張直隸三十八萬張事例宣德七年令各處進到紙劄不依原式及水濕不堪者本部行移本處抄來補數九年福建進到紙劄不合原式及粗薄不堪其提調官令本部行按察司取招石灰諸司職掌凡在京營造合用石灰每嵗於石灰山置窑燒煉所用人工窑柴數目俱有定例如遇各處支用明白行下各該管人員放支其管事作頭每季交替仍將所燒過物料支銷見在之數明白交割每窑一座該正附石灰一萬六千斤合燒五尺圍蘆柴一百七十八束計七十五工事例馬鞍山齊堂等處各置灰厰俱以武功三衛軍夫採燒搬運赴京凡修理內外等項應用天順間奏准差指揮千百户等官分管提督五年一替明會典卷一百五十七
