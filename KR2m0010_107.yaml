body:
  text: 明會典卷一百七兵部二貼黃國初置軍職黃簿以便稽考永樂後委官清理事例甚詳今具載於後其缺官及更名復姓等項各見本條寫黃續黃諸司職掌凡除官開寫年籍從軍腳色赴內府清理明白寫黃仍寫內外貼黃與正黃關防走號合同請寶鈐記正黃送銅匱收貯內外黃各置文簿附貼亦於內府收掌遇有升調襲替官員次日即具升轉襲替緣由奏聞貼揭續附如有事故亦須總為置簿揭下附貼以慿稽考清黃事例凡武職除授後有升調襲替及降調减革等項每三嵗一次清理以本部侍郎一員總其事都御史一員主紏察翰林院官一員主編纂本部仍委主事一員管理取撥監生辦事官吏供用將清黃之嵗預行在京衛所在外各都司衛所令各官具親供申部以慿清理一取送到各官親供類見都司衛所抄出所供緊關大略將類進貼黃舊册照名挨查如貼黃有名與令供腳色相同者銷作重名其不同者謄出一取謄出親供於厯年征克册內查其所供征克地方於誥勑簿內查其所供受過誥勑於選簿及升除册內查其所供除授年月職事仍將舊貼黃對欵通查如供報明白者照例繕寫若有漏報父兄本身舊名及調守衛所從軍征克地方年月不同或給授誥勑不供流世者依舊貼黃添改有供除授職名與原除日期不同者依選簿升除册改正若親供詳細而貼黃不開或親供流官而貼黃作世襲親供調權試職而貼黃作流官或貼黃歸附年深而親供年淺之類並依親供寫黃一若有詐冒情弊或以流官作世襲試職署職作實授或應襲一輩而冒襲二輩或應减革而未經减革或總小旗妄引事例未經併鎗或調守衛所年月空歇不明等項難以寫黃者俱駁出造册照問俟繳報另行一各官繳到回報照問腳色須將原照問總册查對如回稱拘收誥勑者須開是何年月衛所拘收給還誥勑係千户者須開寫正副稱父及伯叔兄弟者須開各人姓名稱病故者須開本官有無子孫承襲合拘收誥勑者須開本官父祖姓名衛所職事誥勑道數字號以慿燒毁有重受誥勑者須開曾無燒毁拘收緣故几查對明白然後寫黃一寫大黃備開腳色凡姓名舊名年甲貫址從軍歸附來厯征克地方殺獲次數受賞名目升授職役調守衛所并給授誥勑俱要細開仍每姓類作一處分寫或係逹官另行類出每寫一官後空白六行以備續附寫畢仍將各姓見任官父祖腳色與類姓舊册通查有相同者銷作重名止將見任襲替緣由續附若與見任官同者亦銷作重名如將升調止將升調緣由續附凡供殺獲人馬非親手者不許開寫更名復姓者依今改姓名寫黃一小黃止存從軍歸附征克緊要地方并衛所流世職事總集開寫二本一為內黃一為外黃其紙式指揮千百户大小不等每寫一官後各空半幅以備續附一為事充軍抄沒無承襲及義男女壻充總旗者另行類姓用白紙開寫仍具事故緣由一寫畢內外黃依類姓資次編寫字號內黃左比外黃右比凡編號用武字編訖仍分類都司衛所依式分貼一清理逹官貼黃於逹官總册選簿并承勑郎審過册內查對所供鄉貫舊職歸附起數除授升轉緣由及有姓無姓有姓者仍舊無姓者類奏賜姓依百家姓編排其寫黃不類姓上開某人下來歸其編號用逹字餘並與武官同一寫黃後將各起逹官親供腳色編寫勘合與黃同進本部用印鈴記照例給散缺官諸司職掌凡遷調致仕并犯罪罷職等項官員行移到部知㑹即便作缺類寫缺本進赴內府遇有欽依除調補缺官員隨於御前銓注以慿附選事例見除授官員項下更名復姓諸司職掌凡軍官或年幼過房乞養今將本姓或幼名到部更改必須明著緣由奏聞准改仍將改換緣由續附貼黃事例洪武十九年令武臣士卒有欲復姓更名者兵部具奏改正永樂元年令各衛韃靼人同名無姓者照洪武年間例賜以姓氏仍編置勘合以備稽考中國人不得冒韃名以避管事違者治罪十一年令新官義男女壻例襲流官一次不許出新有擅改姓名詐冒承襲者處極刑首告者給賞成化十八年令清黃之年將更名復姓官員類造一册送內府備照優給武職子孫妻女有優給之典後又分優飬之例具列於後諸司職掌凡軍官亡故遺下嫡長子女年未出幼或母年老或無嫡子嫡孫次及庶子或弟或姪合得優給養贍者須慿各衛保結起送到部審取故官從軍腳色一體委官賫赴內府比對貼黃相同具奏如是奉㫖欽與優給隨即於御前附寫欽與優給文簿扣算出幼年分明白開寫嵗數至某年住支或奉特㫖升等優給及流官特與世襲亦須隨即明白注寫通行抄出緣由立案行移錦衣衛作數放支其征進陳亡傷故病故總小旗兒男一體引奏定奪事例洪武三年令世襲武臣沒後子孫應繼襲而年幼者紀其姓名給與半俸沒於王事者給全俸候長襲職四年定優給例凡軍職陳亡無子弟而有父母若妻者給全俸三年後給半俸有子弟而年幼者亦同候襲職給本俸有特㫖令其子孫參隨厯練及未授職者給半俸其病故無子弟而有父母若妻者給半俸終身有子弟年幼者初年給半俸次年又半之俟襲職給本俸特㫖參隨及未授職者亦給半俸軍士陳亡有妻者月糧全給三年後守節無依者月給米六斗終身病故有妻者初年全給次年總小旗月給米六斗軍士給月糧一半守節者給終身將士守禦城池戰沒病故妻子無依者守禦官討其家屬有司給行糧送至京優給願還鄉者亦給糧送回願留見處者依例優給五年奏准凡優給從征死事者全給從征病故者半給守禦病故及從征病回而故者不在此例六年令武官殘疾者月給米二石優養十年有子准承襲無子為民十九年令故官子女幼者給全俸女出嫁住支父母老者給全俸終身二十年令京衛官老疾無子孫者全俸優養己襲替而故再無承襲者亦同二十七年重定優給例凡武臣在任亡故及征傷失陷者自指揮至所鎮撫妻並給米五石終身無子孫者亦如之為事亡故無承襲者不給永樂元年令奉天征討陳亡官員幼男送錦衣衛優給總小旗幼男錦衣衛食糧出幼原衛補役其雜犯為事亡故并典刑之子俱照祖職與全俸優給在外優給官舍婦女有親可依不願赴京者俸糧照例於所在支給正統七年令武職子弟優給但在父兄沒後十年內曽告衛者行勘雖出十年亦准十年外告者不准十四年令優給優養官願回原籍或南京者俸糧隨所在官司關支願在京者俱折銀布景泰二年令口外官願留在京優給優養者俱於後軍都督府𢃄管天順元年令逹官病故無應襲而有正妻者月支米一石優養終身成化五年令世襲官陳亡其子合升流官者依該升俸優給流官病故其子止給世襲俸七年令户絶官優養不分新舊母女俱月支米五石妻二石母妻終身女係新官者出嫁住支係舊官者十四嵗住支犯姦反改節者不准𢎞治七年令武職亡故無子孫承襲有親叔年老不堪承襲者仍月支米三石優養待十年無子照例為民九年令應襲舍人犯强盜者其弟姪依父原職降一級優給十年令優給子孫在京各衛按季具名數引赴專管官司審驗在外從本衛掌印官按季查㸃凡武職年老户無承襲者支全俸優養入大選應襲人殘疾者舊官依洪武六年例新官給全俸入大選不限年嵗母女支優養者新舊官俱入大選妻不准繼母與嬸優養視妻例月支米二石若武職故其子優給亦故户無次丁者其母止作故官妻月支米二石優養舊官為失機等事問發未復職者子孫優給與半俸誥勑給授諸司職掌凡武官所授一品至五品曰誥命六品以下曰勑命其有應合給授者須慿各官報到從軍腳色比對內外貼黃年籍并見授職事流世相同然後奏聞謄黃照品定奪散官寫誥給授如犯法得罪應合追奪到部進送內府收貯若充軍征進者置簿編收其典刑及亡故無嗣者㑹官燒毁正一品初授特進榮祿大夫升授特進光祿大夫從一品初授榮祿大夫升授光祿大夫正二品初授驃騎將軍加授龍虎將軍升授金吾將軍從二品初授鎮國將軍加授奉國將軍升授定國將軍正三品初授昭勇將軍加授昭武將軍升授昭毅將軍從三品初授懷逺將軍加授安逺將軍升授定逺將軍正四品初授明威將軍加授廣威將軍升授宣威將軍從四品初授宣武將軍加授信武將軍升授顯武將軍正五品初授武德將軍升授武節將軍從五品初授武略將軍升授武毅將軍正六品初授昭信校尉升授承信校尉從六品初授忠顯校尉升授忠武校尉續寫事例凡武官誥勑正統後專差通政司官一員提督遇有襲職替職等項官員賫誥前來告續者查對明白照例續寫類奏給還凡已經給授者並依此例不許重給封贈諸司職掌凡武職有功應封贈祖父母父母妻室者照依欽定資格一品封贈三代二品三品封贈二代四品以下封贈一代各照見任職事依例封贈正一品至從六品曾祖父祖父父各照見授職事對品封贈正從一品曾祖母祖母母妻各封贈夫人正從二品祖母母妻各封贈夫人正從三品祖母母妻各封贈淑人正從四品母妻各封贈恭人正從五品母妻各封贈宜人正從六品母妻各封贈安人事例洪武二十四年令凡武職父見任不封嫡繼母在所生庶母不封再醮之婦不封嫡繼母已故所生母見在合照子職封嫡繼母及所生母故止贈嫡母繼母或在嫡母已故合封繼母贈嫡母兄從軍弟襲其職合封贈父母伯叔從軍姪代襲者係為人後合封贈伯叔父母襲祖職者止封贈本父母其致仕官升除不與升授止與原授凡試職官及弟男子姪并致仕官不授誥有特㫖與者不在例其父祖原授官職大未經封贈今子孫見襲官職小該給誥命其祖母并母俱依父祖原職封贈若父祖原授官職小今子孫見授官職大其祖母并母俱依子孫職封贈二十九年令凡義男承襲義父官職又隨義父姓者當封贈義父母若出姓者不封贈其親父母亦未得封贈若本官以後自立功升職者許封贈親父母若代義父總旗先鋒身沒後自立功得官而尚隨義父姓者封贈義父母出姓者封贈親父母女壻承襲妻父職事者封贈妻父母若代妻父總小旗役後自得官者當封贈父母永樂二十年令武職已故妻有子承襲者准贈無子者不許正統六年令武官有廢疾或年幼其弟若叔替職者兄姪終身無子方得封妻婦人夫與子俱有官依文職例從其髙者封贈天順四年奏准朵顔三衛等原授職事勑書有賫至告襲者拘收在部俟定奪職事後給與新勑照回拘收舊勑通類年終會官燒毁凡土官無封贈父祖例止給與本身誥勑加贈諸司職掌凡武官殁於王事者照依生前職事加贈二等死於鋒鏑者照依生前職事褒贈三等軍務軍務除開設衛所仍係本司其餘見屬職方司掌行今並載職掌原文及事例以存舊制開設衛所諸司職掌凡內外衛所軍士隊伍俱有定數如是奉㫖差人㸃視填給勘合户由於內明寫收軍來歷緣由除開設衙門原有旗軍外其續後調到補伍軍士必須窮䆒原伍旗軍下落明白庶不迷失軍伍如是伍內空歇未填勘合亦須咨呈該府著令勾補以慿填給其新收軍人應關户由者一體照户出給勘合户由事例見職方司及車駕司守衛項下聲息諸司職掌凡腹裏邊境險要去處或有嘯聚者飛報聲息到部火速入奏母得遲滯事例見職方司賞賜朝廷賞賜軍官原無定例其功次賞賜則有等第今附列於後諸司職掌几奉特㫖賞賜軍官須慿來文開寫姓名職事衛所欽賞銀鈔假匹等項數目審對明白具本引奏給賞事例凡軍功賞賜之等有三曰加賞曰給賞曰量賞俱查照功次移文禮部照例施行其軍前激賞勘合銀牌遇有奏討臨時請㫖關給見行賞賜等第給賞陜西三邊都指揮每員銀五兩綵段一表裏指揮每員銀三兩綵段一表裏千百户鎮撫每員銀二兩絹二匹旗軍舍餘總小甲人等每名銀二兩布二匹大同宣府與陜西三邊同遼東都指揮每員銀二兩綵段一表裏指揮每員銀一兩絹布各二匹千百户鎮撫每員絹布各二匹旗軍舍餘人等每名絹二匹雲南都指揮每員鈔一千貫綵假三表裏指揮每員鈔八百貫綵假二表裏千户衛鎮撫每員鈔六百貫綵假一表裏百户所鎮撫每員鈔五百貫絹三匹旗軍舍餘每名鈔三百貫絹布各一匹四川指揮每員鈔六百貫綵假一表裏千户每員鈔五百貫絹三匹旗軍每名鈔三百貫絹布各一匹湖廣都指揮每員鈔八百貫綵假二表裏指揮每員鈔六百貫綵假一表裏千户衛鎮撫每員鈔六百貫絹三匹百户所鎮撫每員鈔五百貫絹二匹旗軍人等每名鈔三百貫絹布各一匹廣東貴州與湖廣同加賞各照地方則例於正賞外仍加一倍量賞陜西三邊應得銀兩綵假表裏者减去綵假表裏加絹二匹應得銀兩絹布者减去絹布大同宣府都指揮每員銀三兩綵假一表裏指揮每員銀二兩絹一匹千百户等官每員銀一兩絹一匹旗軍人等每員銀一兩布一匹遼東都指揮每員銀一兩絹布各二匹指揮每員銀一兩絹布各一匹千百户等官每員絹二匹旗軍舍餘人等每名絹布各一匹雲南指揮每員鈔七百貫綵假一表裏千户衛鎮撫每員鈔五百貫絹三匹百户所鎮撫每員鈔四百貫絹二匹旗軍舍餘人等每名鈔二百貫布一匹四川應得鈔貫綵假絹布者减去鈔貫湖廣廣東貴州與四川同文職按察使照都指揮例知府及土官知府宣慰宣撫照指揮例同知通判知州推官知縣及土官千户安撫長官照千户例經厯知事檢校縣丞主簿教諭訓導典史巡檢大使等官照百户例掾史省祭官義官隂陽生醫生千夫長百夫長吏舍老人總小甲民壯民欵土舍逹軍黎兵人等照旗軍例明會典卷一百七
