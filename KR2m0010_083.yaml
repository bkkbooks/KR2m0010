body:
  text: 明㑹典卷八十三禮部四十二祭祀四陵寢國初追封諸王及外戚墳附熙祖陵在今鳯陽府泗州蠙城之北洪武初尊號曰祖陵設泗州祠署置奉祀一員又望祭德祖懿祖二陵置陵户二百九十三户供灑掃每歲正旦清明中元冬至及每月朔望本署官供祭行禮仁祖陵在中都鳯陽府太平鄉洪武初尊號曰皇陵設皇陵衛并祠祭署署官奉祀一員祀丞三員俱勳舊世襲置陵户三千三百四十二户供直宿灑掃於內選禮生二十四名供祭祀執事每歲正旦清明中元孟冬冬至俱署官行禮朔望中都留守司官行禮𢎞治元年以來差內官一員奉勑監護凡官員以公事經過者俱謁陵太祖髙皇帝陵曰孝陵在南京鍾山之陽髙皇后馬氏合葬設神宫監并孝陵衛及祠祭署每嵗正旦孟冬忌辰萬壽聖節俱行香清明中元冬至俱祭祀特令勳舊大臣一員行禮南京各衙門文武官俱陪行禮若親王之國過南京者謁陵官員以公事入城者謁陵出城者辭陵國有大事則遣大臣祭告太宗文皇帝陵曰長陵在京師昌平縣之天壽山文皇后徐氏合葬仁宗昭皇帝陵曰獻陵在天壽山昭皇后張氏合葬宣宗章皇帝陵曰景陵在天壽山章皇后孫氏合葬英宗睿皇帝陵曰裕陵在天壽山睿皇后錢氏合葬憲宗純皇帝陵曰茂陵在天壽山孝穆皇后紀氏合葬諸陵各設神宫監并衛及祠祭署凡清明中元冬至祭祀俱分遣駙馬都尉行禮各衙門文武官陪祭忌辰及正旦孟冬萬壽聖節亦遣駙馬都尉行禮親王之國詣諸陵辭謁祭陵儀注典儀唱執事官各司其事贊引引獻官由右門入至拜位贊就位執事捧香爐詣前跪進香于獻官贊上香贊復位贊拜興拜興拜興拜興衆官同典儀唱奠帛行初獻禮執事捧帛捧爵自跪獻贊跪衆官皆跪贊讀祝贊俯伏興平身衆官同典儀唱行亞獻禮執事捧爵自跪獻典儀唱跪俯伏興平身衆官同典儀唱行終獻禮禮同亞獻典儀唱拜興拜興拜興拜興平身衆官同典儀唱讀祝官捧祝進帛官捧帛詣燎位禮畢祝文維某年某月某朔某日孝曽孫嗣皇帝謹遣某官某昭告于某號某諡皇帝某諡皇后曰氣序流邁時維清明中元冬至追念深恩伏增哀感謹用祭告伏惟尚享諸陵並同惟裕陵稱孝孫嗣皇帝茂陵稱孝子嗣皇帝懿文太子陵在孝陵之左四孟清明中元冬至歲暮及忌辰凡九祭俱孝陵祠祭署兼主之祭儀同前恭讓章皇后陵在京師西山清明中元冬至及忌辰俱遣內官行禮祭儀同前祝文維某年某月某朔某日孝曽孫嗣皇帝謹遣某昭告于恭讓誠順康穆靜慈章皇后尊靈曰日月不居仙逝益逺兹遇某節不勝追慕謹用祭告伏惟尚序恭仁康定景皇帝陵在西山清明中元冬至及忌辰俱遣儀賓行禮祭儀同前祝文維某年某月某朔某日姪孫嗣皇帝謹遣某官某昭告于叔祖恭仁康定景皇帝曰節序流邁時維某節追念親親良增傷感茲以牲醴用修時祭伏惟尚享孝陵諸妃俱陪葬惟二妃葬陵之東西長陵諸妃俱陪葬獻陵諸妃俱陪葬惟三妃别葬金山景陵諸妃俱陪葬惟一妃别葬金山裕陵無陪葬者一葬綿山餘俱葬金山茂陵無陪葬者一葬茂陵西南餘俱葬金山凡陪葬諸妃歲時俱享于殿內其别葬諸妃俱遣內官行禮悼恭太子懷獻世子蘄獻王滕懷王欣穆王許悼王衛恭王貞烈妃楊氏越靖王貞惠妃吳氏秀懷王妃黃氏岐惠王蔚悼王及永清公主長泰公主仙逰公主俱葬西山歲時遣內官行禮諸王墳壽春王妃劉氏霍丘王妃翟氏下蔡王安豐王妃趙氏䝉城王妃田氏寶應王六安王來安王都梁王英山王右俱國初追封墳在鳯陽府西北二十五里地名白塔設祠祭署陵户南昌王妃王氏盱眙王妃唐氏臨淮王妃劉氏山陽王招信王右俱國初追封附葬鳯陽皇陵有司歲時祭祀皆與享其分封諸王葬于本封之國者其子孫自主祭祀此不具列外戚王墳陽王墳在鳯陽府盱眙縣津里鎮洪武初設盱眙祠祭署置墳戶二百一十户徐王墳在鳯陽府宿州新豐里洪武初設宿州祠祭署置墳户九十三户滁陽王墳在直𨽻滁州洪武初立廟墳所置墳户以奉祭祀事例洪武二十六年令車馬過陵者及守陵官民入陵者百步外下馬違者以大不敬論永樂元年太祖髙皇帝忌辰上率諸王奉先殿祭畢仍率百官躬詣孝陵致祭公侯駙馬伯文武四品以上及近侍官於殿前行禮五品以下官於門外行禮七年營山陵於昌平縣黃土山封其山為天壽山正統元年諭禮部每遇山陵祭祀之日與百官俱具淺色衣服二年諭都察院天壽山祖宗陵寢所在敢有剪伐樹木者治以重罪家屬發邊逺充軍即出榜禁約仍令錦衣衛官校巡視工部同欽天監官環山立界界外聽民樵采成化九年奏准南京孝陵祭祀凡文武大小官員有不赴者令御史糾察十五年令鳯陽皇陵皇城并泗州祖陵所在應禁山場地土巡山官軍務要用心巡視不許伐樹取土石開窯燒造燒山及於皇城內外耕種牧放作踐有犯者正犯處死家口俱發邊逺充軍有科斂銀兩饋送不用心巡視及守備留守等官貪圖賄賂不嚴加約束以致下人恣肆作弊不能禁治者一體重罪明㑹典卷八十三
