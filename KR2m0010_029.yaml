body:
  text: 明會典卷二十九户部十四廪祿二俸給一諸司職掌凡在京五軍都督府首領官吏并六部通政司大理寺等衙門官吏俸給本部每歲於秋糧內會定數目起運撥赴各衙門倉內收貯按月造冊照依品從等第分豁該支糧數委官驗名支給其各衛軍官俸給已將人户對定編給勘合自行依期送納供給其首領官吏俸給該衛造冊到部定倉放支年終通為稽考及在外各布政司府州縣官吏俸給照例每米一石折鈔二貫五百文按月於係官錢鈔內支給其支過數目通行歲報本部以慿查考正一品每員月支米八十七石歲該一千四十四石五軍左右都督從一品每員月支米七十四石歲該八百八十八石五軍左右都督同知正二品每員月支米六十一石歲該七百三十二石六部尚書左右都御史五軍僉都督中都留守正都指揮使從二品每員月支米四十八石歲該五百七十六石左右布政使都司指揮同知正三品每員月支米三十五石歲該四百二十石六部侍郎副都御史通政使太常司卿大理寺卿按察使應天府尹都司指揮僉事各衛指揮使中都留守副從三品每員月支米二十六石歲該三百一十二石光祿司卿太僕寺卿布政司參政鹽運使宣慰使各衛指揮同知正四品每員月支米二十四石歲該二百八十八石僉都御史太常司少卿左右通政大理寺少卿太僕寺少卿應天府丞按察司副使各府知府宣慰司同知各衛指揮僉事從四品每員月支米二十一石歲該二百五十二石國子監祭酒布政司參議鹽運司同知宣慰司副使宣撫司宣撫中都國子監祭酒正五品每員月支米一十六石歲該一百九十二石宗人府經歷尚寶司卿六部郎中通政司參議太醫院使光祿司少卿欽天監正欽天回回監正大理寺丞翰林院學士左右春坊大學士左右春坊左右庶子應天府治中按察司僉事各府同知宣撫司同知五軍斷事官各千户所正千户王府長史從五品每員月支米一十四石歲該一百六十八石尚寶司少卿五軍都督府經歷六部員外郎侍讀學士侍講學士鹽運司副使各州知州鹽課司提舉宣慰司僉事宣撫司副使招討司招討安撫司安撫左右春坊左右諭德各衛鎮撫各千户所副千户司經局洗馬正六品每員月支米一十石歲該一百二十石尚寶司丞六部主事太常司丞太僕寺丞欽天監副欽天監五官正欽天回回監副欽天回回監五官正翰林侍讀翰林侍講大理寺正太醫院判都察院經歷兵馬指揮國子監司業京縣知縣各府通判都司經歷斷事司斷事安撫司同知各長官司長官宣撫司僉事招討司副招討留守司經歷左右春坊左右中允中都國子監司業王府審理正各百户所百户儀衛司儀衛正從六品每員月支米八石歲該九十六石大理寺副光祿司丞翰林修撰光祿司各署正應天府推官布政司經歷理問所理問鹽運司判官各州同知鹽課司同提舉安撫司副使各長官司副長官左右春坊左右司直郎左右贊善各千户所鎮撫正七品每員月支米七石五斗歲該九十石太常司博士太常司典簿五軍都督府都事都察院都事監察御史通政司經歷大理寺評事翰林編修營繕所正兵馬司副指揮京縣縣丞各縣知縣王府審理副按察司經歷各府推官安撫司僉事都司都事斷事司副斷事各衛經歷煎鹽提舉中都留守司都事五軍斷事司稽仁稽義稽禮稽智稽信並同從七品每員月支米七石歲該八十四石中書舍人翰林檢討光祿司典簿光祿司各署丞光祿司各署奉祀欽天監五官靈臺郎欽天回回監同應天府經歷太僕寺主簿布政司都事理問所副理問各州判官鹽運司經歷宣慰司經歷儀衛司儀衛副鹽課提舉司副提舉正八品每員月支米六石五斗歲該七十八石都給事中太常司協律郎通政司知事翰林院五經博士太醫院御醫欽天監主簿欽天監五官保章正京縣主簿國子監丞典牧所提領寶鈔提舉司提舉龍江提舉司提舉各府經歷各縣縣丞按察司知事宣慰司都事中都國子監丞各衛知事遼東煎鹽同提舉王府典膳正典寶正奉祠正紀善良醫正照磨所照磨營繕所副從八品每員月支米六石歲該七十二石左右給事中國子監典簿國子監博士助教光祿司録事各署監事翰林典籍儀禮司正五官挈壼正各署祀丞王府典膳副典寶副奉祠副良醫副應天府知事鹽運司知事宣撫司經歷儀衛司典仗正九品每員月支米五石五斗歲該六十六石太常司贊禮郎翰林侍書儀禮司副司丞國子監學正行人司正寶鈔提舉司副提舉五官監候文思院大使會同館大使寶源局大使給事中太僕寺各牧監正鞍轡局大使皮作局大使應天府織染局大使龍江提舉司副提舉各府知事各縣主簿茶馬司大使宣撫司知事典牧所大使安撫司知事王府典簿典樂典儀正教坊司奉鑾五官司厯內府庫大使甲乙丙丁戊字等庫大使承運庫大使照磨所檢校寶鈔廣源廣惠廣積贓罰等庫大使營繕所丞從九品每員月支米五石歲該六十石太常司司樂翰林待詔五官司辰漏刻博士行人司副國子監學録典籍司經局校書正字儀禮司鳴讚序班都稅司大使會同館副使典牧所副使宣課司大使文思院副使寶源局副使鞍轡局副使軍儲倉副使皮作局副使各牧監副監丞馭良司牧局大使司牲局大使寶泉局大使軍器局大使斷事官提控案牘王府典儀副各布政司庫大使府學教授各府司獄巡檢雜造局大使應天府織染局副府倉大使茶馬司副使吏目教坊司韶舞教坊司司樂內府庫副使甲乙丙丁戊字庫副使寶鈔廣源廣惠廣積贓罰等庫副使承運庫副使後改定并添革官員已詳見吏部官制項下事例洪武二十三年令六部都察院所屬歷事官三年無私過者給全俸一年者給半俸永樂元年令在京文武官一品二品四分支米六分支鈔三品四品米鈔中半兼支五品六品六分米四分鈔七品八品八分米二分鈔每新鈔二錠折米一石該衙門按月自赴該庫關支九年令在京文武官九品至七品八分米二分鈔六品七分米三分鈔五品六分米四分鈔四品至一品米鈔中半兼支雜職官全支米辦事官該支半俸者月支米二石餘折鈔十六年令除北京文武官俸照舊其扈從等項官一品至五品米鈔中半兼支六品至九品六分米四分鈔留守等項官一品至四品二分米八分鈔五品三分米七分鈔六品至九品四分米六分鈔雜職官月支米一石餘折鈔每鈔二十五貫折米一石十九年以行在衙門裁革令隨從在京官員一品至五品三分米七分鈔六品至九品四分米六分鈔其米每月在京支五斗餘於南京倉支不願者准在京折鈔雜職官有家小者月支六斗無者四斗五升餘折鈔各衙門支半俸辦事官不分有無家小月支米三斗餘折鈔在京達官并入畨等項官該支全米者米鈔中半兼支南京文武官一品至九品二分米八分鈔二十二年令在京文武官折俸鈔俱給胡椒蘇木胡椒每斤准鈔一十六貫蘇木每斤八貫仍自一品至九品每月在京各添給米五斗共一石其米於折鈔內扣除雜職官有家小者添給四斗共一石無者添給一斗五升共六斗洪熙元年詔官員有父母年老不得離職侍養願分俸於原籍奉養者聽宣德三年令各衙門辦事官月米停支四年令各處鎮守總兵官俸願移支所在官司者聽六年令以承運庫生絹折在京文武官十一月十二月本色俸每匹折米二石七年令以兩京贓罰庫衣服布絹等物折文武官月支本色俸一石八年令兩京文武官折色俸每鈔一十五貫折米一石仍以十分為率七分折絹三分折布絹每匹准鈔四百貫布每匹二百貫九年令仍以胡椒蘇木折兩京文武官俸鈔胡椒每斤准鈔一百貫蘇木每斤五十貫正統元年令在京文武官俸每歲半年折支鈔半年折胡椒蘇木二年令添給南京六品以下官俸本色三分折鈔七分雜職官本色米一石又令以各處起運折色稅糧銀給北京武職南京本色俸每銀一兩折米四石四年令南京文武官五品以上原二八分支者每月添五斗雜職每月添二斗北京文武官自一品至九品俱添本色米一石雜職每月添二斗又令在京文武官每月該支俸仍給本色其十月十一月南京該支米數照舊折絹五年令在京文武官係山西陜西雲南四川北直隸保定等府者不許分俸八年令在京武職官願分南京俸於原籍者照文職例支給九年令在京文武官該支南京四月五月俸并在京軍官該折銀俱照折絹支綿布每匹折米一石十一年令兩京文武官十月十一月本色俸折絹改為七月八月之數景泰元年令在京文職官該支南京俸照在京武職例折銀不願者聽各府都督亦照此例又令以龍江鹽倉檢校批驗所存積鹽折支南京文武官本色俸每鹽五十斤折米一石三年令以太倉銀庫折草銀准在京文武官折俸鈔每銀一兩准鈔五百貫七年令每銀一兩准鈔七百貫又令以甲字庫三梭布折在京文武官俸每布一匹准絹一匹天順元年令在京文職官俸仍照正統時例於南京支本色米七年令兩京文武官七月八月本色俸折絹改為四月五月之數八年令各處巡撫鎮守等官有帶家小隨住者量分本色米於所在官司支給令在京官願分俸於原籍養親者南京本色盡數分回成化二年令各衙門官員在任患病三月者住俸又令南京文武官本色俸每歲間月折支絹又令在京文武官折俸鈔每十貫折米一石四年令在京文武官折色俸錢鈔兼支三分鈔七分銅錢每錢三文准鈔一貫十一年令錢二文准鈔一貫十五年令宛平大興二縣官俸照南京上元江寧二縣例知縣三七分縣丞以下四六分米鈔兼支十六年令在京文武官折色俸鈔折支闊白三梭布每匹折米三十石二十年令五府六部等衙門官員三分四分本色俸每石暫折銀七錢以後如舊例𢎞治元年令五府六部等衙門官員本色俸仍折支銀四年令在京各衛經歷等官該支南京本色俸每石折銀七錢六年令在京文職官分俸於原籍養親者不許分在京折絹俸十年令兩京五府六部等衙門官員三分四分本色俸自後每石折銀七錢十一年令京衛武學及順天府所屬在京衙門官員俸俱照在京衙門例支給又令南京太常寺博士選送都察院理刑及在京太常寺博士行人司行人選送南京都察院理刑者其每月食米於原任衙門扣除一石關支理刑衙門待實授之日照例支給十三年令南京各衛軍職俸糧折支絹匹改於四月支絹八月支布明會典卷二十九
