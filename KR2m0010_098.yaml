body:
  text: 明會典卷九十八禮部五十七朝貢三事例三佛齊國洪武四年遣使奉金字表文來朝貢六年復遣使賀正旦并貢方物八年復遣使從招諭拂菻國朝使來貢十年遣使奉表請印綬命齎駝紐鍍金銀印賜之貢物黑熊火雞孔雀五色鸚鵡諸香兜羅綿被苾布白獺龜筒胡椒肉豆䓻畨油子米腦浡泥國洪武四年遣使進金表銀箋及方物永樂三年遣使封其國主為王給印符誥命六年王率其妃及家屬陪臣來朝至福建遣內臣往宴勞之令所過諸郡設宴至京王奏金字表文及諸珍物妃進中宫東宫箋及方物上御奉天門享王宴是年王卒輟朝三日祭賻甚厚詔諡恭順賜葬南京城外石子岡以西南夷人𨽻籍中國者守之樹碑立祠命有司春秋致祭復令其子襲封遣內官及行人護送還國復從其請封其後山為長寧鎮國之山御製碑文賜之十二年及洪熙元年俱來朝貢貢物單目用銀珍珠寶石金戒指金縧環龍腦米腦梅花腦降香沉速香檀香丁香肉豆䓻黃蠟犀角玳瑁龜筒螺殼鶴頂熊皮孔雀倒挂鳥五色鸚鵡黑小厮金銀八寶器百花國洪武十一年遣使奉金葉表來朝貢貢物白鹿紅猴龜筒玳瑁孔雀鸚鵡倒挂鳥胡椒香蠟彭亨國洪武十一年遣使奉金葉表貢畨奴及方物永樂十二年復遣使朝貢貢物金水罐檀香乳香速香片腦胡椒象牙淡巴國洪武十年遣使奉表朝貢貢物苾布兜羅綿被沉香檀香速香胡椒古里國永樂三年遣使朝貢詔封為古里國王給印及誥五年七年復遣使來朝貢貢物寶石金繫腰珊瑚珠琉璃瓶琉璃碗拂郎雙刃刀寶鐡刀蘇合油阿思摸逹塗兒氣龍涎梔子花花氊單伯蘭布苾布紅絲花手巾畨花人馬象物手巾線結花靠枕木香乳香檀香錫胡椒滿喇加國永樂三年遣使奉金葉表朝貢詔封為國王給印及誥使者言王慕義願同中國屬郡歲效職貢又請封其國西山詔封為鎮國之山御製碑文賜之九年國王率其妻子及陪臣五百四十餘人朝貢命官往勞上御奉天門宴之十年遣使來貢十二年國王母來二十二年宣德九年國王復來正統十年以後屢遣使來貢貢物畨小厮犀角象牙玳瑁鶴頂鸚鵡黑熊黑猿白麂鎖袱金母鶴頂金鑲戒指撒哈喇白苾布薑黃布撒都細布西洋布花縵片腦梔子花薔薇露沉香乳香黃速香金銀香降真香紫檀香丁香烏木蘇木大楓子畨錫畨鹽娑羅國永樂四年東王西王各遣使來朝貢貢物黑小厮花焦布白焦布珍珠玳瑁殼降真香黃蠟小葛蘭國永樂五年附蘇門答喇等國來朝貢貢物珍珠傘白綿布胡椒阿魯國永樂五年附古里等國來朝貢貢物象牙熟腦榜葛喇國永樂六年遣使來朝貢九年至太倉命行人往宴勞之十二年又遣使貢麒麟等物正統三年貢同表用金葉貢物馬馬鞍金銀事件創金琉璃器皿青花白磁撒哈喇者抹黑答立布洗白苾布兜羅綿糖霜鶴頂犀角翠毛鶯哥乳香粗黃熟香烏香麻藤香烏爹泥紫膠藤竭烏木蘇木胡椒錫蘭山國永樂九年以拒絶朝使歸路破其城生擒國王及家屬命釋之擇其屬之賢者立為王十年詔諭其國正統十年天順三年皆遣使來貢貢物寶石珊瑚水晶金戒指撒哈喇象乳香木香樹香土檀香沒藥西洋細布藤竭蘆薈硫黃烏木胡椒碗石蘇門答喇國永樂三年遣使來朝貢詔封為國王給印及誥五年至宣德六年屢遣使來貢表用金葉十年復請封其子為王貢物馬犀牛龍涎撒哈喇梭眼寶石木香丁香降真香沈速香胡椒蘇木錫水晶瑪瑙畨刀弓石青回回青硫黃蘇祿國永樂十五年蘇祿三國東王西王洞王各率妻子頭目人等來朝貢十九年遣使來貢貢物梅花腦米腦竹布綿布玳瑁降香蘇木胡椒蓽茇黃蠟畨錫須文逹那國洪武間遣使奉金葉表貢馬并方物拂菻國洪武四年遣使來朝貢覽邦國洪武九年遣使來朝貢柯枝國永樂二年遣使來朝貢十年復遣使來請封其國之山詔封為鎮國山御製碑文賜之古里班卒國永樂三年遣使來朝貢吕宋國永樂三年遣使來朝貢合貓里國永樂三年遣使來朝貢碟里國永樂三年遣使來朝貢打回國永樂三年遣使來朝貢日羅夏治國永樂三年遣使來朝貢忽魯母思國永樂三年遣使來朝貢甘把里國永樂十二年遣使來朝貢麻林國永樂十三年遣使來朝貢麒麟等物古麻喇國永樂間國王率其臣來朝至福州卒詔諡康靖敕葬閩縣令有司歲時致祭忽魯謨斯國永樂間遣使來朝貢沼納撲兒國永樂間遣使詔諭其國加異勒國永樂間遣使來朝貢祖法兒國永樂間遣其臣來朝貢溜山國永樂間遣其臣來朝貢阿哇國永樂間遣使來朝貢白葛逹國宣德七年遣其臣來朝貢天方國宣德間遣其臣來朝貢默德那國宣德間遣使隨天方國使臣來朝貢南巫里國急蘭丹國竒剌尼國夏剌比國窟察尼國烏涉剌踢國阿丹國魯密國彭加那國捨剌齊國八可意國坎巴夷贊國左法兒國墨葛逹國拔達克山日落國已上十六國永樂初各來朝貢明會典卷九十八
