body:
  text: 明會典卷五十二禮部十一東宫監國永樂七年定一朝儀凡常朝于午門左視事其左右侍衛及在京各衙門官員人等合啓事務如常儀若皇太子御文華殿官員人等承旨召入者方許入凡在京文武衙門遇有內外軍機及王府切要事務悉奏請處分其有各處啓報聲息即調邉官軍勦捕仍遣人馳赴行在所奏聞其皇城四門各城門守衛圍宿比常時皆須增撥官軍仍每日操閲軍馬如各衙門稱奉令旨調遣官軍及處分事務所司須覆啓施行十二年奏定常朝于文華殿視事其在京文武衙門凡有應合奏啓事件奏本俱達北京敢有隱匿者治以重罪其在京衙門合具啓事務仍依常例若係應奏隨即具奏待報其東宫發落事件六科按月差人類進北京敢有于題本上增減改寫旨意者凌遲處死全家籍沒其各衙門差人出外幹辦公事仍將所辦事務開具奏報一慶賀凡遇萬夀聖節正旦冬至先期皇太子率文武百官于文華殿前拜進表文是日早設龍亭于文華殿中丹陛上設大樂鳴鐘鼓皇太子具冕服于丹陛上百官具朝服于丹墀內行十二拜如常儀禮畢儀仗鼓樂導表由中門出皇太子由左門送至午門還宫文武百官導至長安右門外文官五品以上武官四品以上及近侍官監察御史俱乘馬導至三山門外以表授進表官百官各回至期行告天祝夀禮是日早設香案于文華殿丹陛上設駕大樂鳴鐘鼓如常儀皇太子具冕服于丹陛上文武百官具朝服于丹墀內行八拜如常儀其在京文武衙門遇萬夀聖節禮部同文職衙門共進表一通中軍都督府公侯駙馬伯武職衙門共進表一通正旦冬至亦如之其正旦冬至千秋節文武百官于文華殿行慶賀禮如常儀其有王府遣人詣東宫前行禮即納其禮物宴賞差來人其應合答禮者奏聞處分一祭祀凡遇享太廟祭社稷風雲雷雨山川之神預期敕皇太子攝祭其祀典神祗太常寺預期于行在所奏聞遣官行禮十二年奏定凡祀典神祗合應遣官祭者太常寺預期具啓遣官行禮一宴賞凡四夷來朝循例宴之皇太子命禮部遣人送行在所正使人給鈔十錠從人五錠為道里費其每日賞賜有例者循例無例者臨時斟酌賞之其京衛軍士冬夏布絹及邉衛軍士冬衣綿布循例給賞其有折賞物色該部定擬具啓施行十三年奏定京衛軍士冬衣布絹及邉衛軍士冬衣布花襖俱行在户部奏請施行一選法凡文選六部都察院翰林院太醫院欽天監堂上官尚寶司通政司太理寺太常寺光祿寺鴻臚寺國子監堂上掌印官六科都給事中并在外布政司王府長史有闕吏部奏請擢用其考滿黜陟并復職改用等項常選官員俱循例具啓銓注其武職選除在京五府都督在外各都司都指揮闕員者及土官衙門奏保土人任職者兵部奏請擢用自餘襲替優給及例應升降改調官員具啓銓注其土官例應襲替及保用通事把事隨司辦事長官該部具啓裁度餘悉奏請處分其內外大小文武官員俱從行在吏部兵部奏請銓選其有開設大小衙門該部奏請定奪一刑名凡內外文武大小官員有犯所司具啓準問者問之若皇親犯小事令其在家聽候具由奏請待報若所犯情重及干謀逆者即時拘執在官先命皇親會問若事有未當及犯人不服乃命公侯伯五軍六部都察院大理寺會皇親再問畢將所服情犯及議擬罪名具啓候車駕回京奏請處分其在外王府護衛指揮并長史及土官有犯事干惡逆先行收問然後奏聞自餘所犯預奏待報提問其法司問擬罪合決死罪者奏請待報其餘所犯悉具啓決放如特奉令旨原免者不拘此例十二年奏定皇親并軍職王府護衛指揮長史等官與各處土官有犯者俱奏請提問其在京文武衙門官員有犯者堂上官具奏待報發落其五品以下者具啓拿問其在外文職衙門官員有犯者方面及四品以上官員該衙門奏請提問其五品以下具啓拿問一迎詔凡詔書至禮部設龍亭錦衣衛設儀仗教坊司設大樂文武百官各具朝服出三山門外奉迎使者到三山門外下馬候龍亭來捧置詔書于龍亭中使者立于龍亭之東百官行五拜叩頭禮訖衆官乘馬導使者上馬在龍亭後東邉行至長安右門下馬隨龍亭後東由中門入文武百官于承天門外橋南侍立東宫殿下具冕服于午門下五丈餘地奉迎至文華殿置龍亭于正中使者立于東東宫殿下于殿前臺上樂作行五拜三叩頭禮畢樂止升殿殿下展詔讀訖使者捧詔置龍亭中殿下送至午門內錦衣衛先設雲輿于午門外正中禮部官置詔書于雲輿內文武二品以上官迎至承天門鴻臚寺先設開讀案于承天門稍東文武百官入班贊禮唱排班班齊鞠躬樂作四拜平身樂止贊開讀使者取詔授開讀官跪受使者復立位所贊跪衆官皆跪開讀訖開讀官捧詔授使者復置雲輿中贊俯伏樂作四拜平身樂止贊搢笏鞠躬三舞蹈贊跪唱山呼萬嵗者三贊出笏俯伏樂作四拜興平身樂止贊禮畢百官以次退使者捧詔書出承天門外復置龍亭中鼓樂送至會同館使者見東宫殿下行四拜禮畢其日宴使臣于禮部本部待宴一進春十三年奏定其日早文武百官各穿顔色衣服文華殿門外侍班如常儀應天府置春案于文華門丹墀中道之東候東宫殿下升座引禮引府縣官舉春案由東陛升置于殿門外中道各就拜位鞠躬四拜平身禮畢文武百官慶賀行叩頭禮皇太孫監國永樂八年定一每日皇長孫于奉天門左視事侍衛如常儀諸司有事具啓施行若軍機及王府要務一啓皇太子處分一奏聞行在所一遇萬夀聖節設香案于奉天殿丹陛上皇長孫具色服于丹陛上行禮文武官具朝服于北京行部行禮如常儀天下諸司表文俱詣北京進賀四夷朝貢俱送南京禮部啓皇太子施行一文選行在六部都察院等衙門及北京行部所屬衙門如有闕員應除補者五品以上行在吏部移咨南京吏部啓皇太子選補六品以下及考滿起服例應升降復職及對品改用常選官撥用吏典俱循例啓皇長孫施行一武選行在五軍都督府及行後軍都督府所屬衙門例應襲替優給升降者行在兵部亦循例啓皇長孫施行自餘非常選者啓皇太子斟酌行之一內外官吏軍民有犯所司啓皇長孫施行若皇親有犯小事令其在家聽候所司啓皇太子待報施行若所犯情重及干謀逆者即時拘執先命皇親會問若事未當及犯人不服乃命公侯伯五軍六部都察院大理寺會皇親再問將所服情犯啓皇太子候車駕回京奏請處分其王府護衛指揮及長史有犯干惡逆者先行收問然後啓皇太子自餘有犯啓皇太子待報收問其行在刑部都察院北京行部議擬囚人應死者監候啓皇太子待報施行餘悉啓皇長孫裁決明會典卷五十二
