body:
  text: 明會典卷一百三十六刑部十一類進贓罰囚人贓罰本部類進內府收貯備用前後事例不一今具載之而以贓物估計附於後諸司職掌凡各布政司并直𨽻府州應有追到贓物彼處官司用印鈐封批差長解人管解到部照依地方發下該部承行仍照來文內開到金銀鈔貫假匹紬絹等項數目案呈本部具手本差官齎赴內府關領進物勘合回部照數填寫明白又具長單一樣二紙編寫字號用使半印勘合堂上官押字用印對查無差將前項贓物原封不動就差原解人同將勘合長單進赴內府該庫各門守衛官并門吏於各長單書名畫字用訖照進關防放進到庫庫官眼同原解人拆開原封照依原進數目檢閘無欠交收入庫將勘合并長單一紙本庫收留存照外有長單一紙本庫官吏出給實收押字用印交付原解人收齎仍於各門打訖照出關防回部附卷仍將長解原批上批寫解到金銀鈔貫等項贓物已於某年月日進赴內府某庫納訖某部批回原解人將批文齎回該衙門備照其本部問擬犯人除恐嚇詐欺強買賣有餘利科斂求索係取與不和用強生事逼抑取受之贓並還物主外餘有接受枉法不枉法彼此俱罪之贓并應合抄劄犯人家財俱各見數責付庫子收領下庫聽候類解取訖領狀附卷每年春夏秋冬四季庫子將收過各部一應贓物備細開寫自某年某月某日為始至某年某月終收到某部某部追抄犯人某人等名下金銀鈔貫假匹等項若干開呈湖廣部照數案呈本部關給勘合出具長單如前進納湖廣部照依批回移付各部知會各部又於原卷查照相同然後附卷備照明令凡以贓致罪者彼此俱罪之贓沒官用強生事逼取之贓給主事例洪武二十八年令各部將原收各布政司直𨽻府州解到贓銀等項自行送進內府該庫交收永樂二年令各司按季通付湖廣司類進三年令各處官司解到并追收銀兩俱各行取銀匠辨驗成色會官煎銷潔淨其鈔貫假匹衣服等項亦各行取鋪户檢驗堪中進納二十一年令各處官司通查在庫贓銀類解本部轉送內承運庫交收宣德四年改送隨駕司禮監十年仍送承運庫景泰元年令南京刑部都察院等衙門問擬納米囚人折納銀兩并追陪贓罰銀鈔等件俱送應天府官庫收貯委官估計追買物料成造軍器五年令南京各衙門每季各委官一員會同户部委官點收贓罰除金銀煎銷類解及器皿不堪收貯者變賣外其銅錫鐡蠟紵絲綾羅絹布皮張等項及追到解户多科物料送赴南京內庫收貯六年以後令南京刑部將贓罰鈔貫送南京內庫交收其金銀仍追解京轉送內府收貯成化二年令南京兩法司及應天府贓罰銀兩貨物暫免解京俱送南京户部收買米麥以備賑濟十三年令法司贓罰金銀俱要會官煎成足色送庫交收其承行該吏敢有增減成色抵換侵欺者查究治罪𢎞治六年令南京兩法司贓罰金銀珠翠寶石暫送南京內庫收貯候蓄積數多仍照舊解京其見在未曽糴買米麥金銀等項并以後贓罰衣服銅錢絹布等物仍送應天府收貯糴米自後每遇年終各司贓罰金銀鈔貫等項俱付送湖廣司將金銀煎銷成錠并鈔貫等項如前類進南京內庫交收九年奏準在京在外一應該追贓物止直八九兩以下及埋葬銀監追一年之上勘無家産變賣者先照本犯原擬發落出外仍令召保營辦完納不必久禁其犯該充軍立功及贓多情重仍於本犯子孫家屬名下追徴者不在此例十年奏準本部贓罰銀兩支與吏户禮兵工五部及大理寺買辦紙劄筆墨硃炭等項計贓時估明令凡計贓者皆據犯處當時物價若計傭賃器物為贓者亦依犯時價值其傭賃雖多不得過其本物之價事例一金銀銅錫之類金一兩四百貫銀一兩八十貫銅錢一千文八十貫生熟銅一斤四貫鐡一斤一貫錫一斤四貫黑鉛一斤三貫一珠玉之類玉一片長二寸闊一寸厚五分八十貫珍珠一顆重一分一十六貫寶石一粒重一分八貫翠一箇一十貫一羅假布絹絲綿之類紗一匹八十貫綾一匹一百二十貫紵絲一匹二百五十貫羅一匹一百六十貫改機一匹一百六十貫錦一尺八貫髙麗布一匹三十貫大青三梭布一匹五十五貫大白三梭布一匹四十貫中細白綿布一匹二十貫粗綿布一匹一十貫粗苧布一匹一十二貫細苧布一匹二十四貫粗褐一匹四十貫綿紬一匹五十貫大綿布一匹二十貫麻布一匹八貫葛布一匹二十貫大絹一匹五十貫小絹一匹二十貫細絨褐一匹二百四十貫氊假一假五十貫氆氌一假五十貫絲綿一斤二十四貫淨綿花一斤三貫麻一斤五百文一米麥之類粳糯米每一石二十五貫小麥一石二十貫大麥一石一十貫芝麻一石二十五貫薥秫一石一十二貫黃黑菉豌豆每一石一十八貫粟米黃米每一石一十八貫麵一斤五百文一畜産之類馬一匹八百貫騾一頭五百貫驢一頭二百五十貫駝一頭一千貫水牛一隻三百貫黃牛一隻二百五十貫大豬一口八十貫羊一隻四十貫鹿一隻八十貫小豬一口一十二貫犬一隻一十貫獐一隻二十貫貓一箇三貫兔一隻四貫虎豹皮每張四十貫馬皮一張一十六貫牛皮一張二十四貫鹿皮一張二十貫馬騾牛驢豬羊獐鹿肉一斤一貫鵝一隻八貫鴨一隻四貫雞野雞每一隻三貫鴿鷯鶉每一隻五百文天鵝一隻二十貫魚鱉蝦蟹每斤一貫一蔬果之類核桃榛子每一斤一貫棗栗柿餅每一斤一貫菱芡一斤一貫松子一斤一貫葡萄一斤一貫楊梅一斤一貫西瓜一十箇四貫桃梨每一百箇二貫杏李林禽每一百箇一貫柑橙橘石榴每二十箇一貫柿子每三十箇一貫菜一百斤二貫薑一十斤一貫藕一十枝二貫蓮房二十箇一貫冬瓜一箇五百文蒜頭一百箇五百文一巾帽衣服之類紗帽一頂二十貫胡帽一頂八貫貂鼠披肩一頂四十貫棕草帽一頂八貫