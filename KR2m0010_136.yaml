body:
  text: 明㑹典卷一百三十六刑部十一𩔖進贓罰囚人贓罰本部𩔖進内府收貯備用前後事例不一今具載之而以贓物估計附於後諸司職掌凡各布政司并直𨽻府州應有追到贓物彼處官司用印鈐封批差長解人管解到部照依地方發下該部承行仍照來文内開到金銀鈔貫叚疋紬絹等項數目案呈本部具手本差官齎赴内府關領進物勘合回部照數填冩明白又具長單一様二紙編寫字號用使半印勘合堂上官押字用印對查無差將前項贓物原封不動就差原解人同將勘合長單進赴内府該庫各門守衛官并門吏於各長單書名畫字用訖照進關防放進到庫庫官眼同原解人拆開原封照依原進數目檢閘無欠交收入庫將勘合并長單一紙本庫收留存照外有長單一紙本庫官吏出給實收押字用印交付原解人收齎仍於各門打訖照出關防回部附卷仍將長解原批上批寫解到金銀鈔貫等項贓物已於某年月日進赴内府某庫納訖某部批回原解人將批文齎回該衙門備照其本部問擬犯人除恐嚇詐欺强買賣有餘利科歛求索係取與不和用强生事逼抑取受之贓並還物主外餘有接受枉法不枉法彼此俱罪之贓并應合抄劄犯人家財俱各見數責付庫子收領下庫聽候𩔖解取訖領狀附卷每年春夏秋冬四季庫子將收過各部一應贓物備細開冩自某年某月某日為始至某年某月終收到某部某部追抄犯人某人等名下金銀鈔貫叚疋等項若干開呈湖廣部照數案呈本部關給勘合出具長單如前進納湖廣部照依批廻移付各部知㑹各部又於原卷查照相同然後附卷備照明令凡以贓致罪者彼此俱罪之贓沒官用强生事逼取之贓給主事例洪武二十八年令各部將原收各布政司直𨽻府州解到贓銀等項自行送進内府該庫交收永樂二年令各司按季通付湖廣司𩔖進三年令各處官司解到并追收銀兩俱各行取銀匠辨騐成色㑹官煎銷潔净其鈔貫叚疋衣服等項亦各行取鋪户檢驗堪中進納二十一年令各處官司通查在庫贓銀𩔖解本部轉送内承運庫交收宣德四年改送隨駕司禮監十年仍送承運庫景㤗元年令南京刑部都察院等衙門問擬納米囚人折納銀兩并追陪贓罰銀鈔等件俱送應天府官庫收貯委官估計追買物料成造軍器五年令南京各衙門每季各委官一員㑹同户部委官㸃收贓罰除金銀煎銷𩔖解及器皿不堪收貯者變賣外其銅錫鐡蠟紵絲綾羅絹布皮張等項及追到解户多科物料送赴南京内庫收貯六年以後令南京刑部將贓罰鈔貫送南京内庫交收其金銀仍追解京轉送内府收貯成化二年令南京兩法司及應天府贓罰銀兩貨物暫免觧京俱送南京户部收買米麥以備賑濟十三年令法司贓罰金銀俱要㑹官煎成足色送庫交收其承行該吏敢有増减成色抵換侵欺者查䆒治罪𢎞治六年令南京兩法司贓罰金銀珠翠寳石暫送南京内庫收貯候蓄積數多仍照舊解京其見在未曽糴買米麥金銀等項并以後贓罰衣服銅錢絹布等物仍送應天府收貯糴米自後每遇年終各司贓罰金銀鈔貫等項俱付送湖廣司將金銀煎銷成錠并鈔貫等項如前𩔖進南京内庫交收九年奏准在京在外一應該追贓物止直八九兩以下及埋𦵏銀監追一年之上勘無家產變賣者先照本犯原擬發落出外仍令召保營辦完納不必乆禁其犯該充軍立功及贓多情重仍於本犯子孫家屬名下追徴者不在此例十年奏准本部贓罰銀兩支與吏户禮兵工五部及大理寺買辦紙劄筆墨硃炭等項計贓時估明令凡計贓者皆㨿犯處當時物價若計傭賃器物為贓者亦依犯時價值其傭賃雖多不得過其本物之價事例一金銀銅錫之𩔖金一兩四百貫銀一兩八十貫銅錢一千文八十貫生熟銅一斤四貫鐡一斤一貫錫一斤四貫黒鉛一斤三貫一珠玉之𩔖玉一片長二寸闊一寸厚五分八十貫珍珠一顆重一分一十六貫寳石一粒重一分八貫翠一箇一十貫一羅叚布絹絲綿之𩔖紗一疋八十貫綾一疋一百二十貫紵絲一疋二百五十貫羅一疋一百六十貫改機一疋一百六十貫錦一尺八貫髙麗布一疋三十貫大青三梭布一疋五十五貫大白三梭布一疋四十貫中細白綿布一疋二十貫麄綿布一疋一十貫麄苧布一疋一十二貫細苧布一疋二十四貫麄褐一疋四十貫綿紬一疋五十貫大綿布一疋二十貫麻布一疋八貫葛布一疋二十貫大絹一疋五十貫小絹一疋二十貫細絨褐一疋二百四十貫氊叚一叚五十貫氆氌一叚五十貫絲綿一斤二十四貫凈綿花一斤三貫麻一斤五百文一米麥之𩔖稉糯米每一石二十五貫小麥一石二十貫大麥一石一十貫芝蔴一石二十五貫薥秫一石一十二貫黄黒菉豌豆每一石一十八貫粟米黄米每一石一十八貫麫一斤五百文一畜產之𩔖馬一匹八百貫騾一頭五百貫驢一頭二百五十貫駝一頭一千貫水牛一隻三百貫黄牛一隻二百五十貫大猪一口八十貫羊一隻四十貫鹿一隻八十貫小猪一口一十二貫犬一隻一十貫獐一隻二十貫猫一箇三貫兎一隻四貫虎豹皮每張四十貫馬皮一張一十六貫牛皮一張二十四貫鹿皮一張二十貫馬騾牛驢猪羊獐鹿肉一斤一貫鵝一隻八貫鴨一隻四貫雞野雞每一隻三貫鴿鷯鶉每一隻五百文天鵝一隻二十貫魚鱉鰕蠏每斤一貫一蔬菓之𩔖核桃榛子每一斤一貫棗栗柿餅每一斤一貫菱芡一斤一貫松子一斤一貫葡萄一斤一貫楊梅一斤一貫西𤓰一十箇四貫桃棃每一百箇二貫杏李林禽每一百箇一貫柑橙橘石榴每二十箇一貫柿子每三十箇一貫菜一百斤二貫薑一十斤一貫藕一十枝二貫蓮房二十箇一貫冬𤓰一箇五百文蒜頭一百箇五百文一巾㡌衣服之𩔖紗㡌一頂二十貫胡㡌一頂八貫貂䑕披肩一頂四十貫棕草㡌一頂八貫