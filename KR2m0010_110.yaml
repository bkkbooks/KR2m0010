body:
  text: 明㑹典卷一百十兵部五鎮戍凡天下要害處所專設官統兵鎮戍其總鎮一方者曰鎮守獨守一路者曰分守獨守一城一堡者曰守備有與主將同處一城者曰協守又有備倭提督提調巡視等名其官稱掛印專制者曰總兵次曰副總兵曰㕘將曰逰撃將軍舊制俱於公侯伯都督都指揮等官内推舉充任永樂初始命内臣鎮守遼東開原及山西等處自後各邉以次添設相沿至今其鎮戍地方或遇事增添改革俱本部奏請定奪今以見設鎮守分守守備地方并合行事例開具於後而協守遊撃備倭等項附見各條之下分守等項後有添設及守備無勑者亦不備載鎮守二十一處北直𨽻薊州永平山海等處大喜峯口提督界嶺口提督南直𨽻淮安協同漕運揚州備倭浙江等處備倭江西等處湖廣等處洞庭湖巡視福建等處備倭两廣等處廣東備倭廣西等處四川等處雲南等處貴州等處協守河南等處陜西等處逰撃延綏協守逰撃寧夏協守甘肅逰撃山東等處備倭遼東等處廣寧中路協守山西等處兼提督鴈門三關大同協守逰撃宣府協守逰撃分守三十三處北直𨽻馬蘭谷燕河營居庸關宻雲古北口通州湖廣靖州等處廣東髙雷亷肇四府廣西潯梧等處桞慶等處四川建昌行都司松潘等處南路協守東路協守雲南金齒騰衝陜西延綏西路延綏東路寧夏東路協守寧夏西路協守固原等處固靖等處肅州凉州協守莊浪遼東遼陽等處錦義二城開原山西代州等處兼督鴈門等三關偏頭關大同東路西路協守宣府獨石馬營萬全右衛等處懐來永寧等處宣府西路順聖川等處守備一百處北直𨽻天夀山薊州鮎魚石等營薊州黄崖口薊州等城䑓頭營等處山海關等處峨嵋山等處永平等處遵化灤陽等關劉家口遵化等城涿州真定地方黄花鎮紫荆關倒馬關浮圖峪口南直𨽻儀真揚州等處歸徳武平等處九江安慶等處浙江温州處州江西南安贑州湖廣武岡等處川江峽瞿塘等處永道等處郴桂等處清浪等處靖州等處施州等處鄖襄等處福建汀州漳州四川越嶲等衛叙瀘大壩等處雅州等處貴州迤東都匀等衛地方迤西普安等衛地方永寧等五衛地方河南汝寧信陽等處南陽等處陜西洮州階文固原環慶等處靖虜衛蘭州河州岷州靈州西寧鎮番紅城子山丹永昌山東臨清徳州等處沂州等處遼東寧逺等處山西代州兼督鴈門關寧武關大同大同左衛城大同右衛城朔州衛暖㑹隘口朔州衛城陽和城威逺衛城天城等處渾源城懐仁城平魯城山隂城應州城宣府保安舊城馬營中路葛峪等堡獨石城保安新城懐來城萬全左衛萬全右衛龍門城龍門所等處懐安城赤城堡順聖西域柴溝堡西陽河堡張家口堡蔚州洗馬林堡隆慶州雲州堡長安嶺鵰鶚堡永寧城等處新河口堡新開口堡四海冶廣昌城順聖川東城事例洪武二十二年令守禦邉塞官軍不得與外域交通如有假公事出境交通及私市易者全家坐罪宣徳七年令居庸山海關荆子村黑峪口北抵獨石西抵天城每三月差武臣二員御史二員㸃視正統六年令出境征勦鎮守總兵官參將内止遣一二員仍留一二員居守以備不虞景泰元年令凡監鎗内臣專管神機火器其餘一切征務毋得干預沮壊軍政成化元年令邉軍遇敵如曾率衆對敵及衆寡不敵者雖失利不罪其閉門坐視見敵先退者乃坐失機十六年令在外副總兵參將係侯伯或都督者劄付都司若都指揮雖掛印充總兵官於五府亦稱具呈指揮推舉守備者軍中以都指揮體統臨下其公移於都指揮用手本於所部指揮用帖文所部指揮稱具呈二十年令鎮守官官舍隨任者許五人分守許三人其軍伴鎮守内外官二十名分守十五名守備十名團營官軍非警急不許輙便調遣二十一年令各邉每年自九月起至明年三月止俱常川操練四月初具操過軍馬并大風大雪免操日期奏報又令各處盗賊生發如事干城池衙門殺官刼庫刼獄并積至百人以上者限一月以裏不獲聼鎮守巡撫巡按官將分巡分守守備及府州縣衛所巡司掌印巡捕官住俸戴罪挨拿盡絶照舊支俸管事半年不獲者聼巡按御史提問三司掌印官常例發落其餘每一起將守備守禦州縣巡司掌印巡捕等官降一級二起府衛掌印官降一級每三起分巡分守官降一級俱調邉逺去處𢎞治十三年奏准各處鎮守内臣所在選能通書筭軍餘二名總兵官并分守監鎗守備等官各一名令其跟隨書辦與免征操奏本公文内俱照令史僉書以防欺弊其餘官軍號稱主文干預書辦者聼巡撫巡按并按察司官舉問俱調極邉衛所帶俸食糧差操凡各處備禦官軍失班不到者拿獲問罪免其納鈔的决觧送各鎮邉巡官查審軍一班不到者在原備邉處罰班五箇月軍两班官一班不到者改撥本處城堡罰班八箇月軍三班官两班以上不到者極邉城堡發班一年其補班日月各自扣筭若來遲不曾失班者止補來遲日月凡各處鎮守總兵内外官跟隨軍伴二十四名協守副總兵二十名逰撃將軍與分守内外官十八名監鎗内官十六名守備内外官十二名俱不許額外役占及賣放軍人辦納月錢違者許巡撫巡按官查照軍職役占賣放事例上請其巡按御史年終仍將各官有無多占賣放縁由具奏凡各邉將官并管軍頭目私役軍民及軍民私出外境釣豹捕鹿砍木掘鼠等項并把守之人知情故縱該管里老官旗軍吏扶同𨼆蔽若夜不收出境哨探而與夷人交易者除真犯死罪外其餘俱調發烟瘴地靣民人里老為民軍丁充軍官旗軍吏帶俸食糧差操凡各邉關堡墩䑓等項守備去處若官軍用財買閒者官員問罪調極邉衛分守禦旗軍人等發沿邉枷號一箇月常川守哨若原在關營官軍逃回原籍潛住及架砲夜不收守墩軍人寅夜回家輪班不去者俱照前項調衛枷號守哨發落凡失誤軍機除律有正條者議擬監候奏請外若敵擁大衆入冦官軍卒遇交鋒損傷被獲數十人之上不曾虧折大衆或被敵衆入境殺傷軍民數十人之上不曾掠去大衆或被兵白晝寅夜突入境内搶掠頭畜衣糧數多不曾殺擄軍民者俱問守備不設被敵侵入境内擄掠人民本律發邉逺充軍若是交鋒入境損傷擄殺四五人搶去頭畜衣糧不多者亦問前罪數内情輕律重有礙發落者仍備由奏請處置其有被敵入境將爪探夜不收及飛報聲息等項公差官軍人等一時殺傷捉去事出不測者俱問不應杖罪還職如境外被敵殺掠爪探夜不收非智力所能防範者免其問罪凡各邉及腹裏地方遇敵入境若是殺擄男婦十名口以上牲畜三十頭隻以上不行開報者軍民職官問罪降一級加前數一倍者降二級加二倍者降三級甚者罷職其上司及總兵等官知情扶同事發參究治罪凡各處備倭貼守軍人其把總等官縱容舍餘人等代替者正軍問調沿海衛分舍餘人等就收該衛充軍把總等官參問治罪凡大同山西宣府延綏寧夏遼東薊州紫荆宻雲等邉分守守備備禦并府州縣官員禁約該管官旗軍民人等不許擅將應禁林木砍伐販賣違者問發南方烟瘴衛所充軍若前項官員有犯軍職俱降二級發囘原衛所都司終身帶俸差操文職降邉逺叙用鎮守并副參等官有犯指實參奏其經過河道守把官軍容情縱放者究問治罪凡西山一帶宻邇京師地方内外官豪勢要之家私自開窯賣煤鑿山賣石立厰燒灰者問罪枷號一箇月發邉衛充軍干碍内外官員參奏提問凡沿邉沿海旗軍舍餘犯該監守常人盗竊盗掏摸搶奪至徒罪以上者俱送總兵官處查撥缺人墩䑓守哨滿日踈放凡川廣雲貴陜西等處但有漢人交結夷人互相買賣借貸誆騙引惹邉釁及潛住苖寨教誘為亂貽害地方者俱問發邉衛永逺充軍凡官民人等擅造二桅以上違式大船將帶違禁物貨下海入番國買賣潛通海賊同謀結聚及為嚮導刼掠良民者正犯處以極刑全家發邉衛充軍若止將大船雇與下海之人分取番貨及雖不曾造有大船而紏通下海之人接買番貨或探聼番貨到來私買販賣若蘇木胡椒至一千斤以上者俱問發邉衛充軍番貨入官若小民撑使小船於海邉近處捕取魚蝦採打柴木者巡捕官兵不許擾害凡沿邉操備官軍一年一班每班以十月初到明年十月滿復留與次班守冬至後年正月還次班亦然凡每嵗七月本部請勑各邉遣官軍徃敵人出没之地三五百里外乗風縱火焚燒野草以絶兵馬名曰燒荒事畢以撥過官軍燒過地方造册繳奏凡每嵗十月本部請勑各邉鎮守總兵巡撫官遇冬年節不許宴樂仍轉行分守守備等官一體遵守凡各邉軍馬數目逺邉一年一報近邉半年一報本部每三年一次具題差文武大臣各一員同行閱實每年一次具題差御史二員分行巡視有設置未備器械未精軍伍不足守卒年久未更代者逐一理之凡各邉每嵗四月八月遣官軍修葺邉墻墩堡增築草塲封堆時加巡察有越塞耕種移徙界至者治罪明㑹典卷一百十
