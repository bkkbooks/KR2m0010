body:
  text: 明㑹典卷九吏部八吏員兩考役滿起送到京㕘撥各衙門各有資格以後又有辦事之例諸司職掌凡在外各衙門送到考滿吏典於在京對品衙門内用在京各衙門考滿吏典照依資格陞用無缺借用仍支合得俸裁革減併吏對品衙門用借撥者支前役俸農吏罷閒官生員監生承差為事充吏遇缺撥用各支本等俸其五品以下衙門吏典該與俸米食米者照例支給若罷閒永充截替市井吏遇缺量度撥用止支九品衙門司吏俸一石工滿并為事斷發吏遇缺撥用月支食米五斗每月通類行移各衙門收役并勾取在逃吏自首行勾日淺未曽撥補准首仍送着役若及日久窺伺撥補避難及已移文原籍勾解者俱送刑部問罪仍發本部聽用若各衙門退回奸猾託稱不諳吏事舊吏照地方發邊逺充軍為事還役吏典在京者行移各該衙門收役在外者劄付應天府給引轉發着役在京劄順天府洪武禮制一凡内外有出身吏員俱以三年為滿給由止據現歴俸月不許通理正七品出身五軍都督府提控從七品出身五軍都督府掾吏六部都吏正八品出身六部令史從八品出身五軍都督府知印正九品出身五軍都督府典吏六部知印在外二品衙門令史在京三品衙門令史從九品出身六部典吏在外二品衙門知印在外各衛令史察院書吏在外三品衙門書吏諌院書吏後革雜職出身在京三品衙門典吏内府倉庫司局吏攢在外二品衙門典吏内外四品衙門司吏一凡内外無出身吏員亦以三年為滿陞轉五品六品衙門司吏在外三品内外四品衙門典吏滿日於四品衙門司吏在京三品在外二品衙門典吏内陞轉無缺給由如是軍吏不在此限七品衙門司吏五品六品衙門典吏滿日於五品衙門司吏内陞轉無缺給由八品以下衙門吏攅七品衙門典吏滿日於六品七品衙門司吏内陞轉缺給由在京各倉庫局闗塲所等衙門吏攅滿日於五品六品衙門司吏同憲綱凡都察院及按察司吏典須於考退生員與應取吏員相㕘補用不許用曽犯姦貪罪名之人事例凡僉充吏役於農民身家無過年三十以下能書者選用但曽經各衙門主寫文案攅造文冊及充隸兵與市民並不許濫充洪武二十八年奏准正軍户五丁者充吏四丁不許水馬驛站貼軍雜役養馬等項人户四丁以上者充吏三丁不許民户兩丁識字亦許勾充宣徳元年奏准一户有三丁三丁内一丁充吏一丁為官者免其吏農民一丁充吏一丁或自監生生員謫充吏者免其農民先僉一丁充吏後又僉一丁免其後充者生員果有成效入學雖後即免其為吏者若及四丁之上俱不免正統元年奏准軍職衙門不許濫用軍吏違者問調南丹等衛補伍三年奏准還俗僧道營充吏役罷歸為民若出入衙門囑託公事結攬寫發蠧政害民者發口外充軍為民四年奏准在京在外吏典曽充隸兵者歴三年滿日不與出身五年奏准按察司吏典役滿行布政使司轉屬僉撥不許徑行各府州縣僉取景泰三年奏准父兄伯叔充吏離役未久及犯贓問發充軍為民者弟男子姪不許㕘充若役滿出身年逺者不拘此例凡吏役資格洪武十七年奏定在外二品衙門通吏考滿於在京從七品出身吏員内陞轉令史於在京正八品出身吏員内陞轉在外三品衙門令史書吏于在京正九品出身吏員内陞轉在外三品衙門典吏四品衙門司吏于在京從九品出身吏員内陞轉察院磨勘司典吏仍依原定未入流品内出身五品以下衙門吏人依原定資格陞轉其在京一品二品知印承差不許于吏員内取用十九年更定中外諸司吏員役滿轉補資格在京入流衙門吏員充九品衙門司吏九品衙門司吏充八品衙門司吏及七品衙門典吏八品衙門司吏七品衙門典吏充七品衙門書吏及七品衙門六品衙門典吏七品衙門書吏充五品衙門司吏胥史六品衙門典吏充五品衙門典吏及六品衙門司吏六品衙門司吏五品衙門典吏俱充五品衙門司吏胥史四品衙門典吏五品衙門司吏胥史充四品衙門司吏及三品衙門典吏四品衙門司吏三品衙門典吏俱充三品衙門令史及二品衙門典吏三品衙門令史及二品衙門典吏俱充二品衙門令史及一品衙門典吏二品衙門令史充一品衙門掾史及對品衙門都吏都吏充一品衙門提控一品衙門典吏充對品衙門掾史及對品衙門提控皆以三年為滿給由赴部錄用在外衙門若各驛遞傳所河泊閘壩等衙門吏攅充七品衙門典吏七品衙門典吏充五品六品衙門典吏或有俸九品衙門并有俸未入流品衙門吏充七品衙門司吏六品衙門典吏充六品衙門司吏五品衙門典吏六品衙門司吏充五品衙門司吏五品衙門司吏充四品衙門司吏及三品衙門典吏四品衙門典吏充四品衙門司吏及三品衙門典吏三品衙門典吏充二品衙門典吏及三品衙門令史書吏三品衙門令史書吏充二品衙門令史二品衙門令史充二品衙門通吏已上三年滿日無缺給由到部于在京衙門内用三十一年續定吏員出身事例皆以九年考滿出身或在京兩考在外一考或在京一考在外兩考一品二品衙門提控都吏從七品出身掾史令史典吏并内府門吏正八品出身三品衙門令史從八品出身典吏及四品衙門司吏正九品出身四品衙門典吏五品衙門司吏典吏書吏俱從九品出身六品至九品并雜職衙門吏典都察院各道吏典俱除雜職後俱以在外兩考在京一考為滿凡吏典撥歴俱以實俸為准在外通吏撥在京五府六部提控都吏如通吏少則以都布二司令史兼撥在外都布二司令史按察司鹽運司書吏衛令史撥在京五府六部都察院掾史令史在外府司吏撥在京各衛并順天府光祿寺通政司太僕寺令史大理寺胥史在外都布按并各衛府鹽運司典吏撥在京五府六部都察院典吏并總兵官巡撫都御史典吏在外州所司鎮撫司長史司吏撥在京各衛并順天府光祿寺通政司大理寺太僕寺典吏在外縣司州典撥在京鴻臚寺翰林院各千户所司吏在外縣典撥在京十三道書吏典吏巡按書吏各百户所司吏户刑二部都察院順天府照磨所宛大二縣司典并十庫司攅在外倉攅撥在京馬房攅典并草塲抽分局巡檢司閘壩吏各税課司攅典在外巡檢司税課司儒學驛閘吏庫攅撥京通二倉守支攅典其北直隸都司衛所一考役滿吏典本處聽候三月之上無缺轉㕘起送後府轉送到司者撥别處衛所府州縣起送考退廩膳生員充吏者撥附近府分考功司付到重歴者撥臨近衛所俱附卷其廣東廣西四川三布政司湖廣所屬永州辰州寶慶靖州常徳長沙衡州郴州江西所屬南安贑州福建所屬漳州泉州汀州興化及福建行都司所屬建寧左等五衛二十五所并武平等守禦千户所吏典俱南京撥歴凡吏典辦事舊例俱以三年為限成化二十二年奏減半年𢎞治四年又奏減三箇月十一年又奏減三箇月止辦二年其兩考通吏舊例免辦事就撥當該十四年奏准辦事二年若倉攅守支六年鹽課司攅守支八年亦俱免辦事未及六年八年者扣算補辦全無守支者不免其在南京辦事者原無定例𢎞治十年奏准大小二石辦事半年大小一石并州所司吏辦事一年凡吏典裁革永樂二十年南京各衙門設吏一名二名者仍舊三名者減一名四名減二名正統元年奏准天下裁減衙門每房止存司吏一名典吏二名凡吏典丁憂起復成化二十三年奏准一年者免其辦事未及一年者補辦凡在京在外三考役滿吏典給由赴部查考明白通類引奏冠帶入選其上糧免考者行户部該司勘實仍查役内有無過犯無過照資格出身若犯公私徒杖罪及私笞減等不盡者俱降級若犯公私笞罪減盡無科者俱免降級凡在京為事監生承差問發充吏者俱附卷撥各衙門着役凡在京辦事吏典原籍災傷告回省災者類題給引定限回部仍送原役衙門補辦違限半月者送問凡當京聽撥當該吏典告稱取撥未到者送順天府給引照回依限回部聽撥若延住三年之上者行查其願告南京外考者聽凡法司送到各衙門為事還役吏典呈堂送原役衙門還役收查發落者干礙行止發原籍為民其在外吏典有犯笞杖徒流雜犯例該的決與贖罪還役者俱要明著年月日期若離役一年以上不許還役凡在京各衙門開送逃吏類行原籍官司提解中間有一年之内告患病者行兵馬司勘實具結繳報仍候原籍回文至日送衙門着役若一年以上不復役未經告官及原籍提解赴京者俱為民凡江西浙江蘇松吏洪武二十六年奏准不許於户部内用凡雲南貴州四川土吏洪武年間不與出身考滿後仍發原衙門着役宣徳元年奏准土吏考滿到部發本布政司改調别衙門成化四年詔雲南土吏兩考役滿免送赴部就於本布政司給由照例調用十五年奏准革去貴州土吏𢎞治三年奏准倉攅未及周嵗及已周嵗未及守支丁憂曽交盤無礙者起復到部撥各衙門辦事一年半准作守支月日收考違者仍撥原倉守支照三年滿日事例收考又奏准兩考吏到部有少歴未及三月該撥外衛者免其輳補就於辦事月日内照數増加准作該補之數三月以下仍撥外衛輳補十三年奏准革去四川永寧龍州二宣撫司泥溪平夷蠻夷沐川九姓五長官司并各司所屬驛站巡檢司土吏各添設流吏凡户兵二部書算有缺移文到部類行直隸常鎮二府所屬殷實户内㨂選起送赴部考中轉送該部着役諸司職掌凡本部四子部付到合行各布政司直隸府州事件通類具手本赴吏科闗填勘合仍附寫底簿開列前件以憑回銷事例洪武初凡有除授官員皆給勘合到任十九年革勘合其行取官員及查理事務等項仍用勘合各布政司及南北直隸府州各有字號浙江布政司寅字河南布政司申字貴州布政司撫字廣東布政司辰字廣西布政司子字山西布政司午字雲南布政司丑字湖廣布政司夘字山東布政司未字福建布政司亥字陜西布政司戌字江西布政司已字四川布政司畢字應天府酉字揚州府心字鳳陽府房字寧國府牛字廬州府奎字鎮江府危字常州府女字太平府斗字廣平府井字蘇州府氐字真定府栁字隆慶州翼字和州胃字松江府尾字徐州昴字永平府婁字安慶府虚字池州府壁字順徳府張字淮安府箕字保定府觜字滁州角字河間府參字大名府星字廣徳州室字徽州府亢字保安州軫字諸司職掌凡本部額設皁隸照依原定則例分撥跟官聽差如有事故行移兵部照缺取補明㑹典卷九
