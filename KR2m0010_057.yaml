body:
  text: 明會典卷五十七禮部十六冠服衮冕諸司職掌兖冕十二章冕版廣一尺二寸長二尺四寸冠上有覆元表朱裏前後各有十二旒旒五采玉珠十二玉簮導朱纓圭長一尺二寸元衣纁裳衣六章織日月星辰山龍華蟲裳六章織宗彝藻火粉米黼黻中單以素紗為之紅羅蔽膝上廣一尺下廣二尺長三尺織火龍山三章革帶佩玉長三尺三寸大帶素表朱裏兩邊用緣上以朱錦下以緑錦大綬六采用黃白赤元縹緑織成純質五百首小綬三色同大綬間執三玉環朱襪赤舄祭天地宗廟及正旦冬至聖節則服之明集禮祭社稷先農册拜皆服衮冕皮辨服諸司所掌皮辨服其皮辨用烏紗冒之前後各十二縫每縫中綴五采玉十二以為飾玉簮導紅組纓其服絳紗衣蔽膝隨衣色白玉佩革帶玉鈎䚢緋白大帶白襪黑舄明集禮朔望視朝降詔降香進表四夷朝貢朝覲則服皮辨常服明集禮常服烏紗折角向上巾盤領窄袖袍束帶間用金玉琥珀透犀皇后冠服禮服明集禮冠為圎匡冒以翡翠上飾以九龍四鳳大花十二樹小花如大花之數兩博鬢十二鈿服禕衣深青為質畫翟赤質五色十二等素紗中單黼領朱羅縠褾􅙦𥚑蔽膝隨衣色以緅為領緣用翟為章三等大帶隨衣色朱裏紕其外上以朱錦下以緑錦紐約用青組玉革帶青襪青舄以金飾凡受册謁廟朝會皆服之常服明集禮雙鳳翊龍冠首飾釧鐲金玉珠寶翡翠隨用諸色團衫金繡龍帶用金玉燕居則服之事例洪武四年定常服龍鳳珠翠冠真紅大袖衣霞帔紅羅長裙紅禙子冠制如特髻上加龍鳳飾衣用織金龍鳳文加繡飾皇妃冠服內命婦附禮服明集禮冠飾以九翬四鳳花叉九樹小花如大花之數兩博鬢九鈿翟衣青質編次于衣及裳重為九等青紗中單黼領朱縠褾􅙦𥚑蔽膝隨裳色加文繡重雉為章二等以緅為領緣大帶隨衣色玉革帶青襪舄佩綬凡受册助祭朝會則服之常服明集禮鸞鳳冠首飾釧鐲用金玉珠寶翠諸色團衫金繡鸞鳯不用黃帶用金玉犀燕居則服之事例洪武四年定常服山松特髻假鬢花鈿或花叉鳯冠真紅大袖衣霞帔紅羅裙羅禙子衣用織金及繡鳳文東宫妃王妃同五年定內命婦三品以上用花叉翟衣四品五品用山松特髻大衫為禮服貴人視三品以后妃燕居冠及大衫霞帔為禮服珠翠慶雲冠鞠衣禙子緣襈襖裙為常服東宫冠服衮冕諸司職掌衮冕九章冕九旒旒九玉金簮導紅組纓兩玉瑱圭長九寸五分元衣纁裳衣五章織山龍華蟲宗彞火裳四章織藻粉米黼黻白紗中單黼領蔽膝隨裳色織火山二章革帶金鈎䚢玉佩綬五采用赤白元縹緑織成純赤質三百三十首小綬三色同大綬間織三玉環大帶白表朱裏上緣以紅下緣以緑白襪赤舄陪祀天地宗廟及正旦冬至朝賀則服之明集禮從祭社稷及受册納妃皆服衮冕皮辨服皮辨用烏紗冒之前後各九縫每縫中綴五采玉九金簮朱纓玉圭絳紗袍紅裳素白中單蔽膝隨裳色玉佩大帶大綬襪舄明集禮朔望朝降詔降香進表四夷朝貢朝覲則服皮辨常服事例洪武元年定常服烏紗折上巾東宫妃冠服禮服明集禮犀冠刻以花鳳首飾釧鐲用金玉珠寶翠諸色團領衫金繡鸞鳯惟不用黃帶用金玉犀燕居則服之親王冠服衮冕諸司職掌衮冕九章冕五采玉珠九旒紅組纓青纊充耳金簮導圭長九寸二分五釐青衣纁裳衣五章織山龍華蟲火宗彝裳四章織藻粉米黼黻白紗中單黼領青緣蔽膝隨裳色織火山二章革帶金鈎䚢佩玉綬五采赤白元縹緑織成純赤質三百二十首小綬三色同大綬間織三玉環大帶表裏白羅朱緑緣白襪朱履助祭謁廟正旦冬至等朝賀則服之明集禮受册納妃皆服衮冕皮辨服皮辨用烏紗冒之前後各九縫中綴五采玉九金簮朱纓玉圭絳紗袍紅裳素紗中單蔽膝隨裳色玉佩大帶大綬襪舄明集禮朔望朝降詔降香進表四夷朝貢朝覲則服皮辨親王妃冠服公主同禮服明集禮冠飾以九翬四鳳花叉九樹小花如大花之數兩博鬢九鈿翟衣青質五色九等繡翟編次于衣及裳素紗中單黼領朱縠褾襈裾蔽膝隨裳色以緅為領緣繡翟為章二等大帶隨衣色玉革帶青襪舄佩綬凡受册助祭朝會則服之常服明集禮犀冠刻以花鳳首飾釧鐲用金玉珠寶翠諸色團領衫金繡花鳳惟不用黃帶用金玉犀燕居則服之世子冠服衮冕諸司職掌衮冕七章冕三采玉珠七旒紅組纓青纊充耳金簮導圭長九寸青衣纁裳衣三章織華蟲火宗彝裳四章織藻粉米黼黻素紗中單青領襈赤韍革帶佩白玉玄組綬綬紫質用紫黃赤三采織成間織三白玉環白襪赤舄事例洪武二十二年定凡遇聖節千秋節並正旦冬至進賀表箋及其父王生日諸節慶賀皆服衮冕皮辨服皮辨烏紗冒之前後各八縫每縫中綴三采玉八金簮朱纓玉圭絳紗袍紅裳素紗中單蔽膝隨裳色玉佩大帶大綬襪舄世子妃冠服珠翠七翟冠大衫霞帔用大紅金繡雲鳳文金翟頭禙子鞠衣金繡雲鳳文大帶用青羅或用紅玉榖圭玉革帶玉綬花玉佩青羅襪青紵絲描金雲鳳舄上加珠六顆郡王冠服兖冕衮冕五章冕三采玉珠七旒紅組纓青纊充耳金簮導圭長九寸青衣纁裳衣三章織宗彝藻粉米裳二章用黼黻素紗中單青領襈裾玉佩綬間織二玉環襪舄皮辨服皮辨用烏紗冒之前後各七縫每縫中綴三采玉七金簮朱纓玉圭紅裳素紗中單蔽膝隨裳色玉佩大帶大綬襪舄郡王妃冠服郡主同珠翠七翟冠大衫霞帔用大紅金繡雲翟文金墜頭禙子鞠衣金繡雲翟文大帶用青羅或用描金雲翟舄上加珠六顆長子冠服朝服七梁冠大紅素羅衣白素紗中單大紅素羅裳及蔽膝大紅素羅白素紗二色夾帶玉朝帶丹礬紅花錦錦雞綬玉佩象牙笏白絹襪皂皮雲頭履鞋公服皂皺紗幞頭大紅素紵絲衣玉革帶常服烏紗帽大紅紵絲織金獅子開䙆圓領玉束帶皂皮銅線靴長子夫人冠服珠翠五翟冠大紅紵絲衫深青紵絲金繡翟雞禙子青羅金繡翟雞霞帔金墜頭鎮國將軍冠服與長子同鎮國將軍夫人冠服與長子夫人同輔國將軍冠服與鎮國將軍同惟冠六梁帶用犀輔國將軍夫人冠服與鎮國將軍夫人同惟冠用四翟抹金銀墜頭奉國將軍冠服與輔國將軍同惟冠五梁帶用金鈒花常服大紅織金虎豹奉國將軍淑人冠服與輔國將軍夫人同惟禙子霞帔金繡孔雀文鎮國中尉冠服與奉國將軍同惟冠四梁帶用素金佩用藥玉鎮國中尉恭人冠服與奉國將軍淑人同輔國中尉冠服與鎮國中尉同惟冠三梁帶用銀鈒花綬用盤雕公服用深青素羅常服紅織金熊羆輔國中尉宜人冠服與鎮國中尉恭人同惟冠用三翟禙子霞帔金繡鴛鴦文銀墜頭奉國中尉冠服與輔國中尉同惟冠二梁帶用素銀綬用練鵲幞頭黑漆常服紅織金彪奉國中尉安人冠服與輔國中尉宜人同惟大衫用丹礬紅禙子霞帔金繡練鵲文縣主冠服珠翠五翟冠大紅紵絲大衫深青紵絲金繡孔雀禙子青羅金繡孔雀霞帔抹金銀墜頭郡君冠服與縣主同惟冠用四翟禙子霞帔金繡鴛鴦文縣君冠服與郡君同惟冠用三翟鄉君冠服與縣君同惟大衫用丹礬紅禙子霞帔金繡練鵲文明會典卷五十七
