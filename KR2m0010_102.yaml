body:
  text: 明會典卷一百二禮部六十一諸畨四夷土官人等二事例哈密永樂四年賜忠順王紵絲六十匹絹二百一十四匹祖母母妃各紵絲六匹絹六匹嬸母紵絲四匹絹四匹六年賜王紵絲五十匹絹二十匹織金紵絲衣三套皂麂皮靴二雙氊襪二雙祖母母并妃各綵假六表裏成化三年故忠順王外孫為都督賜銅印并織金衣一套八年其都督赴京襲職除馬駝給價外加賞綵假絹織金紵絲衣并靴襪各一賞賜進貢到京使臣分五等一等綵假五表裏絹四匹二等四表裏絹三匹三等三表裏絹二匹四等二表裏絹一匹布一匹五等一表裏絹一匹俱紵絲衣一套靴襪各一雙存留甘州男婦人等有進貢者照五等例賞無者每人絹布各一匹奏事到京使臣不分等第每人綵假二表裏絹一匹紵絲衣一套靴襪各一雙十二年奏準寄住苦峪城使臣賞例仍分五等比前表裏絹各減其一俱不與衣服靴襪存留甘州有進貢者照前五等例無者與絹一匹一回賜大馬每匹四表裏逹馬不分等第每匹二表裏駝每隻四表裏駝羔每隻紵絲一匹絹二匹倒死駝絹六匹折鈔絹一匹梭服每假絹六匹金鋼鑽上等每顆絹四匹成化十年二等每顆絹二匹三等各顆絹一匹四等每二顆絹一匹五等每顆布一匹畨砂水晶石不與價𢎞治三年奏準內府估驗定價例玉石每斤絹一匹夾玉石每四斤絹一匹速來蠻石二斤絹一匹青金石一斤絹一匹把咱石十斤絹一匹魚牙靶小刀每把絹二匹鑌鐡大刀每把絹五匹拐棍刀每把絹五匹兩刀劒每把絹八匹鑌鐡銼一把鑌鐡鏡一面各絹二匹撒哈剌馬黑瞞每假各絹九匹桚馥蘭每斤絹四匹硝子阿思馬亦一箇絹一匹鐡角皮二條絹二匹豹皮即舍利遜皮每二張一表裏哈喇卜花二十張絹一匹鑌鐡二斤絹一匹螺子石六塊絹一匹回回木梳細者六箇絹一匹粗者十箇絹一匹獅子皮一張二表裏哈剌虎剌皮每張一表裏蛇角二枝一表裏蛤蚧四箇絹二匹馬服屯即畨夏布每二假絹一匹藍花手巾二條絹一匹石頭靶八箇磠砂八斤各絹一匹雄黃十五斤絹一匹銀鼠皮六箇貂鼠皮三箇青鼠皮二十箇白兔皮三箇白狐皮一張駝皮獺皮每一箇各絹一匹梧桐鹻每十斤絹一匹癿馬尺即羊甸皮每五張絹二匹卜剌硤兒皮即牛甸皮每四張絹一匹樺皮弓一張絹八匹羚羊角每四斤絹一匹金線豹皮一張一表裏刀紬畨名黃馬海牙兒每假絹一匹松都魯石即水珀舊例每斤鈔五十貫正統四年定每斤添作一百貫每二百貫折絹二匹虎力麻五匹絹二匹珊瑚珠正統中每十四兩絹四匹今定每一兩絹二匹鎖鎖葡萄每斤絹一匹硝子遮眼畨名矮納每三箇絹一匹使臣自進中等馬每匹紵絲一匹絹八匹折鈔絹二匹下等馬每匹紵絲一匹絹七匹折鈔絹一匹新生馬駒中途倒死馬每匹絹三匹駝每隻三表裏絹四匹帶進西馬每匹五表裏阿魯骨馬每匹六表裏一貿易使臣進貢到京者每人許買食茶五十斤青花磁器五十副銅錫湯瓶五箇各色紗羅綾假各十五匹絹三十匹三梭綿布夏布各三十匹藥餌三十斤果品砂糖乾薑各三十斤紙馬三百張花毯二條顔料五斤綿花三十斤烏梅三十斤皂白礬十斤不許過多就館中開市五日除違禁之物并鞍轡刀箭外其餘假匹紗羅等項不係黃紫顏色龍鳳花樣者許官民各色鋪行人等持貨入館兩平賣買該城兵馬司差人密切關防及令通事管束毋得縱容鋪户夷人在外私自交易如有將違禁等物及通事人等故違者許各該委官體察通行拿問其奏討沿途收買牛羊鐡鍋犂鏵者聽於臨洮府蘭州地方與軍民兩平收買不許過多仍令伴送人貟及所在官司防範不許將熟鐡兵器夾賣及因而生事擾人一求討正統四年忠順王奏討與紵絲四表裏天順四年王母差來使臣領去厚榜紙中夾紙各三百張金箔一百貼胡椒蓽茇各十斤桐油十斤白礬十斤心紅三斤丁香乳香檀香各三斤良薑桂皮各五斤細茶二十斤洗面銅盆一箇成化十二年寄居苦峪城阿哩雅等奏討加絹一匹十三年又準加折衣絹一匹十五年再加絹一匹哈里喀三哈薩爾沙迪滿喀什噶爾哈達埒薩蘭色哷克額爾巴拉摩和勒博迪蘇拜勒哈阿勒瑪圖呼瑪克綽爾齊斡齊爾布哈喇帕喇實喇斯尼沙布爾和斯摩哩特布哩斯郭納錫納和坦和爾展庫克新實喇哈雅約蘇雅爾哈戎拜烏倫阿克蘇鄂端頁錫坤城實瑪勒拜伊克恰天方國日落國已上諸國賞賜例與哈密同罕都齊勤蒙古永樂二年賞賜差來都指揮指揮綵假三表裏織金衣一套靴襪各一雙千户綵假二表裏舍人一表裏俱與紵絲衣一套靴襪各一雙一回賜帶過中等馬每匹二表裏駝每隻四表裏自進中等馬每匹紵絲一匹生絹八匹百户鎮撫俱照千户例賞帶進下等馬每匹紵絲一匹生絹四匹存留甘州男婦有進者每名口一表裏生絹一匹無者生絹一匹布一匹自進駝四表裏安定衛洪武八年賜襲封嗣王勑書誥命各一道織金紵絲衣一套綵假六表裏諭祭已故王祭文一道降香一炷新鈔一千貫本部差通事一貟送請封人至西寧衛交割本衛差頭目一貟齎勑誥衣服表裏同原來人前去本地給賜授封别差頭目一員齎降去祭文香鈔另辦齋糧五十石麻布五十匹食茶二百斤量帶軍士一同前去一賞賜到京國師綵假四表裏絹二匹紵絲僧衣一套舍人并使臣每人二表裏紵絲衣一套僧人每人一表裏紵絲畨僧衣一套靴襪各一雙一回賜自進并帶進駝每隻三表裏絹四匹馬每匹二表裏賽瑪爾堪洪武間進貢各賞銀并紵絲表裏衣服等物正統以前賞例優厚成化間定王紵絲十五匹羅三匹紗三十匹熟絹十五匹白氁絲十匹白將樂布十匹洗白布五十匹紵絲帽一頂硃紅漆創金碗八箇王妻紵絲八匹羅二匹紗二匹熟絹八匹白氁絲五匹白將樂布五匹洗白布二十匹到京使臣并存留甘州男婦俱行審等第照哈密賞例一回賜正統四年金線豹一隻八表裏西馬每匹五表裏折鈔絹十匹獅子皮一張二表裏金線豹皮每張一表裏成化十九年阿黑麻王獅子二隻每隻比金線豹例加五表裏𢎞治三年獅子八表裏正副使并送養人止正賞無加賞王止與回賜無特賜土魯畨使臣到京并存留賞賜自進并帶進駝馬等物回賜及賣買一應俱照哈密例烏斯藏洪武永樂以來給賜不等後定從四川起送來者到京喇嘛畨僧人等每人綵假一表裏紵絲衣一套存留喇嘛畨僧人等每人該賞綵假一表裏折與濶生絹四匹紵絲衣一套內二件給本色衣一件折生絹三匹俱賞鈔五十錠折靴襪鈔五十錠食茶六十斤從洮河州起送來者到京喇嘛畨僧人等每人折衣綵假一表裏紵絲并綾貼裏衣二件存留畨僧人等每人該賞折衣綵假一表裏折生絹四匹紵絲并綾貼裏二件俱與食茶五十斤靴襪鈔五十錠進過給軍中等馬每匹紵絲一匹鈔三百錠氆氌等物例不給價帶進方物回賜綵假四表裏一賜封本部行吏部請給誥命內府各衙門關造錦二假紵絲十表裏袈娑僧衣一套髙頂僧帽一頂水晶數珠一串鈴杵二副白磁茶鍾二箇滿答剌一箇連帶鸞帶一條靴襪各一雙茶食一百斤檀香一炷請勑令大慈恩寺推喇嘛二人為正副使帶領喇嘛十名同原來請封喇嘛齎奉前去畨地授封差通事一貟伴送至四川布政司交割從黎州或天全出境差去正副使每人賞鈔八十錠喇嘛六十錠俱與畨僧衣一套靴襪各一雙贊善王授封從陜西洮州出境闡化等三王從四川出境成化五年授封闡化輔教二王差去正使人等自帶買路物件食茶二萬五千斤紵絲三百匹羅一百匹絹一千匹青紅布三千五百匹金箔一萬貼胡椒一百斤十六年賞授封闡化王回還喇嘛覺義等三十貟名正使禪師覺義每人鈔八十錠綵假三表裏絹二匹副使都綱鈔六十錠二表裏差去喇嘛每名鈔四十錠一表裏俱與紵絲畨僧衣一套靴襪各一雙帶去徒衆每人鈔二十錠一表裏進過氆氌等物不給價長河西魚通寧逺等處正統初賞賜宣慰使并指揮僉事自來進貢者宣慰使鈔一百五十錠綵假四表裏指揮僉事鈔一百錠綵假二表裏俱紵絲衣一套靴襪各一雙襲職進貢賞同國師并國師姪男進貢到京者照宣慰使例都綱喇嘛畨僧人等進貢到京者每人鈔五十錠綵假一表裏紵絲畨僧衣一套靴襪各一雙食茶六十斤存留賞同五年喇嘛畨僧進馬到京每人鈔五十錠綵假一表裏折衣綵假二表裏靴襪各一雙進過馬不分等第每匹鈔一百錠十年長河西招撫生畨照本處進貢畨僧例每人止賞錠五十錠綵假一表裏折衣綵假二表裏靴襪各一雙仍加賞折衣綵假一表裏景泰四年每人鈔五十錠綵假一表裏不與衣服靴襪天順元年照舊給賞三年尊勝寺清修翊善大國師護印帶進舍利等物照先年烏斯藏地方都指揮使等事例量給綵假二表裏成化初畨僧人等到京者每人濶生絹二匹鈔五十錠折靴襪鈔五十錠折衣綵假二表裏存留者除鈔絹俱照到京例賞其折衣綵假二表裏每人給本色一表裏內一表裏折濶生絹四匹進過氆氌等物例不給價帶進國師方物給賜綵假二表裏十二年畨人九百名來貢無賫勘合到京并存留畨人畨僧每人俱減絹二匹𢎞治二年尊勝等寺并葛兒拶寺喇嘛畨人共一千三百名來貢亦無賫勘合到京畨僧人等每名減絹二匹存留者每名減絹三匹朵甘斯凡宣慰司差來到京禪師畨僧人等每人賞鈔五十錠綵假一表裏紵絲衣一套存留畨僧人等每人鈔五十錠折表裏濶生絹四匹紵絲衣一套內二件給本色衣一件折濶生絹三匹俱與折靴襪鈔五十錠食茶六十斤進氆氌等物例不給價指揮僉事例加絹四匹國師比照禪師加絹二匹新招撫來貢者到京每人鈔五十錠絹二匹折衣綵假二表裏折靴襪鈔五十錠存留者每人鈔五十錠絹二匹折衣綵假一表裏濶生絹四匹折靴襪鈔五十錠方物俱不給價天順七年朵甘宣慰使進貢到京賞鈔一百五十錠綵假四表裏紵絲衣一套靴襪各一雙董卜韓胡凡差來到京國師禪師都綱道官喇嘛畨僧頭目寨官人等每人賞綵假一表裏存留頭目畨僧人等每人折表裏濶生絹四匹俱與折鈔絹二匹靴襪鈔五十錠畨僧每人紵絲綾貼裏僧衣一套頭目人等每人紵絲綾貼裏俗衣一套進氆氌等物例不給價回賜土官綵假十表裏土官妻綵假四表裏四川威州保縣金川寺畨僧凡金川寺進貢到京喇嘛畨僧每人賞綵假一表裏折衣綵假二表裏存留者每人綵假二表裏其折衣綵假二表裏內一表裏折生絹四匹一表裏折葉茶一百斤俱與鈔六十錠折靴襪鈔五十錠氆氌等物不給價雜谷安撫司與金川寺例同逹蠻思長官司凡逹蠻思長官司正統間進貢到京并存留僧人等每人賞鈔四十錠綵假一表裏折衣二表裏靴襪各一雙𢎞治二年差來畨僧人等到京者每人鈔四十錠一表裏折衣一表裏存留者每人鈔四十錠一表裏折衣一表裏仍折生絹四匹俱與折靴襪鈔十錠茂州文川縣加渴等寺進貢到京喇嘛畨僧頭目寨首每人綵假一表裏折衣二表裏存留畨僧人等每人綵假一表裏折衣二表裏每一表裏折絹四匹俱賞鈔六十錠折靴襪鈔五十錠氆氌等物不給價松潘茂州等處凡進貢到京馬每匹賞鈔一百錠鐡甲氆氌等物不給價陜西洮岷等處畨僧凡洮岷等處各寺喇嘛畨僧到京并存留每人賞折衣綵假一表裏折靴襪鈔五十錠馬每匹紵絲一匹鈔三百錠駝每隻綵假三表裏絹四匹不由所在官司給文起送私自來京謝恩等項進貢者止給馬駝價不賞洮岷等處畨族凡各畨族到京并存留畨人每人賞綵假二表裏絹二匹鈔二十錠折靴襪鈔五十錠進馬每匹