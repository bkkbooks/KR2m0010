body:
  text: 明會典卷一百二禮部六十一諸畨四夷土官人等二事例哈宻永樂四年賜忠順王紵絲六十疋絹二百一十四疋祖母母妃各紵絲六疋絹六疋嬸母紵絲四疋絹四疋六年賜王紵絲五十疋絹二十疋織金紵絲衣三套皂麂皮靴二雙氊襪二雙祖母母并妃各綵叚六表裏成化三年故忠順王外孫為都督賜銅印并織金衣一套八年其都督赴京襲職除馬駝給價外加賞綵叚絹織金紵絲衣并靴襪各一賞賜進貢到京使臣分五等一等綵叚五表裏絹四疋二等四表裏絹三疋三等三表裏絹二疋四等二表裏絹一疋布一疋五等一表裏絹一疋俱紵絲衣一套靴襪各一雙存㽞甘州男婦人等有進貢者照五等例賞無者每人絹布各一疋奏事到京使臣不分等第每人綵叚二表裏絹一疋紵絲衣一套靴襪各一雙十二年奏准寄住苦峪城使臣賞例仍分五等比前表裏絹各减其一俱不與衣服靴襪存留甘州有進貢者照前五等例無者與絹一疋一回賜大馬每匹四表裏逹馬不分等第毎匹二表裏駝毎隻四表裏駝羔毎隻紵絲一疋絹二疋倒死駝絹六疋折鈔絹一疋梭服每叚絹六疋金鋼鑚上等毎顆絹四疋成化十年二等每顆絹二疋三等各顆絹一疋四等每二顆絹一疋五等每顆布一疋畨砂水晶石不與價𢎞治三年奏准内府估驗定價例玉石毎斤絹一疋夾玉石每四斤絹一疋速來蠻石二斤絹一疋青金石一斤絹一疋把咱石十斤絹一疋魚牙靶小刀每把絹二疋鑌鐡大刀每把絹五疋拐棍刀每把絹五疋兩刀劒每把絹八疋鑌鐡銼一把鑌鐡鏡一面各絹二疋撒哈剌馬黒瞞毎叚各絹九疋桚馥蘭每斤絹四疋硝子阿思馬亦一箇絹一疋鐡角皮二條絹二疋豹皮即舍利遜皮每二張一表裏哈喇卜花二十張絹一疋鑌鐡二斤絹一疋螺子石六塊絹一疋回回木梳細者六箇絹一疋粗者十箇絹一疋獅子皮一張二表裏哈剌虎剌皮每張一表裏蛇角二枝一表裏蛤蚧四箇絹二疋馬服屯即畨夏布每二叚絹一疋藍花手巾二條絹一疋石頭靶八箇磠砂八斤各絹一疋雄黄十五斤絹一疋銀䑕皮六箇貂䑕皮三箇青䑕皮二十箇白兎皮三箇白狐皮一張駝皮獺皮每一箇各絹一疋梧桐鹻每十斤絹一疋癿馬尺即羊甸皮每五張絹二疋卜剌硤兒皮即牛甸皮每四張絹一疋樺皮弓一張絹八疋羚羊角每四斤絹一疋金線豹皮一張一表裏刀紬畨名黄馬海牙児每叚絹一疋松都魯石即水珀舊例每斤鈔五十貫正統四年定每斤添作一百貫毎二百貫折絹二疋虎力麻五疋絹二疋珊瑚珠正統中毎十四兩絹四疋今定每一兩絹二疋鎻鎻葡萄每斤絹一疋硝子遮眼畨名矮納每三箇絹一疋使臣自進中等馬每匹紵絲一疋絹八疋折鈔絹二疋下等馬毎匹紵絲一疋絹七疋折鈔絹一疋新生馬駒中途倒死馬每匹絹三疋駝毎隻三表裏絹四疋帶進西馬毎匹五表裏阿魯骨馬毎匹六表裏一貿易使臣進貢到京者毎人許買食茶五十斤青花磁器五十副銅錫湯瓶五箇各色紗羅綾叚各十五疋絹三十疋三梭綿布夏布各三十疋藥餌三十斤果品砂糖乾薑各三十斤紙馬三百張花毯二條顔料五斤綿花三十斤烏梅三十斤皂白礬十斤不許過多就館中開市五日除違禁之物并鞍轡刀箭外其餘叚疋紗羅等項不係黄紫顏色龍鳳花様者許官民各色鋪行人等持貨入館兩平賣買該城兵馬司差人宻切闗防及令通事管束毋得縱容鋪户夷人在外私自交易如有将違禁等物及通事人等故違者許各該委官體察通行拿問其奏討沿途收買牛羊鐡鍋犂鏵者聽於臨洮府蘭州地方與軍民兩平收買不許過多仍令伴送人貟及所在官司防範不許将熟鐡兵器夾賣及因而生事擾人一求討正統四年忠順王奏討與紵絲四表裏天順四年王母差來使臣領去厚榜紙中夾紙各三百張金箔一百貼胡椒蓽茇各十斤桐油十斤白礬十斤心紅三斤丁香乳香檀香各三斤良薑桂皮各五斤細茶二十斤洗面銅盆一箇成化十二年寄居苦峪城阿哩雅等奏討加絹一疋十三年又准加折衣絹一疋十五年再加絹一疋哈里喀三哈薩爾沙迪滿喀什噶爾哈達埒薩蘭色哷克額爾巴拉摩和勒博迪蘓拜勒哈阿勒瑪圖呼瑪克綽爾齊斡齊爾布哈喇帕喇實喇斯尼沙布爾和斯摩哩特布哩斯郭納錫納和坦和爾展庫克新實喇哈雅約蘇雅爾哈戎拜烏倫阿克蘇鄂端頁錫坤城實瑪勒拜伊克恰天方國日落國已上諸國賞賜例與哈宻同罕都齊勤䝉古永樂二年賞賜差來都指揮指揮綵叚三表裏織金衣一套靴襪各一雙千户綵叚二表裏舍人一表裏俱與紵絲衣一套靴襪各一雙一回賜帶過中等馬每匹二表裏駝毎隻四表裏自進中等馬每匹紵絲一疋生絹八疋百户鎮撫俱照千户例賞帶進下等馬每匹紵絲一疋生絹四疋存留甘州男婦有進者每名口一表裏生絹一疋無者生絹一疋布一疋自進駝四表裏安定衛洪武八年賜襲封嗣王勑書誥命各一道織金紵絲衣一套綵叚六表裏諭祭已故王祭文一道降香一炷新鈔一千貫本部差通事一貟送請封人至西寧衛交割本衛差頭目一貟齎勑誥衣服表裏同原來人前去本地給賜授封别差頭目一員齎降去祭文香鈔另辦齋粮五十石麻布五十疋食茶二百斤量帶軍士一同前去一賞賜到京國師綵叚四表裏絹二疋紵絲僧衣一套舍人并使臣每人二表裏紵絲衣一套僧人每人一表裏紵絲畨僧衣一套靴襪各一雙一回賜自進并帶進駝每隻三表裏絹四疋馬每匹二表裏賽瑪爾堪洪武間進貢各賞銀并紵絲表裏衣服等物正統以前賞例優厚成化間定王紵絲十五疋羅三疋紗三十疋熟絹十五疋白氁絲十疋白将樂布十疋洗白布五十疋紵絲㡌一頂硃紅漆戧金椀八箇王妻紵絲八疋羅二疋紗二疋熟絹八疋白氁絲五疋白将樂布五疋洗白布二十疋到京使臣并存㽞甘州男婦俱行審等第照哈宻賞例一回賜正統四年金線豹一隻八表裏西馬每疋五表裏折鈔絹十疋獅子皮一張二表裏金線豹皮每張一表裏成化十九年阿黒麻王獅子二隻每隻比金線豹例加五表裏𢎞治三年獅子八表裏正副使并送養人止正賞無加賞王止與回賜無特賜土魯畨使臣到京并存留賞賜自進并帶進駝馬等物回賜及賣買一應俱照哈宻例烏斯藏洪武永樂以來給賜不等後定從四川起送來者到京喇嘛畨僧人等每人綵叚一表裏紵絲衣一套存留喇嘛畨僧人等每人該賞綵叚一表裏折與濶生絹四疋紵絲衣一套内二件給本色衣一件折生絹三疋俱賞鈔五十錠折靴襪鈔五十錠食茶六十斤從洮河州起送來者到京喇嘛畨僧人等每人折衣綵叚一表裏紵絲并綾貼裏衣二件存留畨僧人等每人該賞折衣綵叚一表裏折生絹四疋紵絲并綾貼裏二件俱與食茶五十斤靴襪鈔五十錠進過給軍中等馬毎匹紵絲一疋鈔三百錠氆氌等物例不給價帶進方物回賜綵叚四表裏一賜封本部行吏部請給誥命内府各衙門闗造錦二叚紵絲十表裏袈娑僧衣一套髙頂僧帽一頂水晶數珠一串鈴杵二副白磁茶鍾二箇滿荅剌一箇連帶鸞帶一條靴襪各一雙茶食一百斤檀香一炷請勑令大慈恩寺推喇嘛二人為正副使帶領喇嘛十名同原來請封喇嘛齎奉前去畨地授封差通事一貟伴送至四川布政司交割從黎州或天全出境差去正副使每人賞鈔八十錠喇嘛六十錠俱與畨僧衣一套靴襪各一雙賛善王授封從陜西洮州出境闡化等三王從四川出境成化五年授封闡化輔教二王差去正使人等自帶買路物件食茶二萬五千斤紵絲三百疋羅一百疋絹一千疋青紅布三千五百疋金箔一萬貼胡椒一百斤十六年賞授封闡化王回還喇嘛覺義等三十貟名正使禪師覺義每人鈔八十錠綵叚三表裏絹二疋副使都綱鈔六十錠二表裏差去喇嘛每名鈔四十錠一表裏俱與紵絲畨僧衣一套靴襪各一雙帶去徒衆毎人鈔二十錠一表裏進過氆氌等物不給價長河西魚通寧逺等處正統初賞賜宣慰使并指揮僉事自來進貢者宣慰使鈔一百五十錠綵叚四表裏指揮僉事鈔一百錠綵叚二表裏俱紵絲衣一套靴襪各一雙襲職進貢賞同國師并國師姪男進貢到京者照宣慰使例都綱喇嘛畨僧人等進貢到京者每人鈔五十錠綵叚一表裏紵絲畨僧衣一套靴襪各一雙食茶六十斤存留賞同五年喇嘛畨僧進馬到京毎人鈔五十錠綵叚一表裏折衣綵叚二表裏靴襪各一雙進過馬不分等第每疋鈔一百錠十年長河西招撫生畨照本處進貢畨僧例每人止賞錠五十錠綵叚一表裏折衣綵叚二表裏靴襪各一雙仍加賞折衣綵叚一表裏景泰四年每人鈔五十錠綵叚一表裏不與衣服靴襪天順元年照舊給賞三年尊勝寺清修翊善大國師䕶印帶進舍利等物照先年烏斯蔵地方都指揮使等事例量給綵叚二表裏成化初畨僧人等到京者每人濶生絹二疋鈔五十錠折靴襪鈔五十錠折衣綵叚二表裏存留者除鈔絹俱照到京例賞其折衣綵叚二表裏每人給本色一表裏内一表裏折濶生絹四疋進過氆氌等物例不給價帶進國師方物給賜綵叚二表裏十二年畨人九百名來貢無賫勘合到京并存留畨人畨僧每人俱减絹二疋𢎞治二年尊勝等寺并葛兒拶寺喇嘛畨人共一千三百名來貢亦無賫勘合到京畨僧人等毎名减絹二疋存留者毎名减絹三疋朶甘斯凡宣慰司差來到京禪師畨僧人等每人賞鈔五十錠綵叚一表裏紵絲衣一套存留畨僧人等每人鈔五十錠折表裏濶生絹四疋紵絲衣一套内二件給本色衣一件折濶生絹三疋俱與折靴襪鈔五十錠食茶六十斤進氆氌等物例不給價指揮僉事例加絹四疋國師比照禪師加絹二疋新招撫來貢者到京每人鈔五十錠絹二疋折衣綵叚二表裏折靴襪鈔五十錠存留者每人鈔五十錠絹二疋折衣綵叚一表裏濶生絹四疋折靴襪鈔五十錠方物俱不給價天順七年朶甘宣慰使進貢到京賞鈔一百五十錠綵叚四表裏紵絲衣一套靴襪各一雙董卜韓胡凡差來到京國師禪師都綱道官喇嘛畨僧頭目寨官人等每人賞綵叚一表裏存留頭目畨僧人等每人折表裏濶生絹四疋俱與折鈔絹二疋靴襪鈔五十錠畨僧每人紵絲綾貼裏僧衣一套頭目人等每人紵絲綾貼裏俗衣一套進氆氌等物例不給價回賜土官綵叚十表裏土官妻綵叚四表裏四川威州保縣金川寺畨僧凡金川寺進貢到京喇嘛畨僧毎人賞綵叚一表裏折衣綵叚二表裏存留者每人綵叚二表裏其折衣綵叚二表裏内一表裏折生絹四疋一表裏折葉茶一百斤俱與鈔六十錠折靴襪鈔五十錠氆氌等物不給價雜谷安撫司與金川寺例同逹蠻思長官司凡逹蠻思長官司正統間進貢到京并存留僧人等每人賞鈔四十錠綵叚一表裏折衣二表裏靴襪各一雙𢎞治二年差來畨僧人等到京者每人鈔四十錠一表裏折衣一表裏存留者每人鈔四十錠一表裏折衣一表裏仍折生絹四疋俱與折靴襪鈔十錠茂州文川縣加渇等寺進貢到京喇嘛畨僧頭目寨首每人綵叚一表裏折衣二表裏存㽞畨僧人等每人綵叚一表裏折衣二表裏每一表裏折絹四疋俱賞鈔六十錠折靴襪鈔五十錠氆氌等物不給價松潘茂州等處凡進貢到京馬每匹賞鈔一百錠鐡甲氆氌等物不給價陜西洮岷等處畨僧凡洮岷等處各寺喇嘛畨僧到京并存留毎人賞折衣綵叚一表裏折靴襪鈔五十錠馬每匹紵絲一疋鈔三百錠駝每隻綵叚三表裏絹四疋不由所在官司給文起送私自来京謝恩等項進貢者止給馬駝價不賞洮岷等處畨族凡各畨族到京并存留畨人毎人賞綵叚二表裏絹二疋鈔二十錠折靴襪鈔五十錠進馬每匹