body:
  text: 明㑹典卷一百三十刑部五賊盜明律謀反大逆凡謀反及大逆但共謀者不分首從皆凌遲處死祖父父子孫兄弟及同居之人不分異姓及伯叔父兄弟之子不限籍之同異年十六以上不論篤疾廢疾皆斬其十五以下及母女妻妾姊妹若子之妻妾給付功臣之家為奴財産入官若女許嫁已定歸其夫子孫過房與人及聘妻未成者俱不追坐知情故縱隱藏者斬有能捕獲者民授以民官軍授以軍職仍將犯人財産全給充賞知而首告官為捕獲者止給財産不首者杖一百流三千里謀叛凡謀叛但共謀者不分首從皆斬妻妾子女給付功臣之家為奴財産並入官父母祖孫兄弟不限籍之同異皆流二千里安置知情故縱隱藏者絞有能告捕者將犯人財産全給充賞知而不首者杖一百流三千里若謀而未行為首者絞為從者皆杖一百流三千里知而不首者杖一百徒三年若逃避山澤不服追喚者以謀叛未行論其拒敵官兵者以謀叛已行論造妖書妖言凡造䜟緯妖書妖言及傳用惑衆者皆斬若私有妖書隱藏不送官者杖一百徒三年盜大祀神御物凡盜大祀神祇御用祭器帷帳等物及盜饗薦玉帛牲牢饌具之屬者皆斬其未進神御及營造未成若已奉祭訖之物及其餘官物皆杖一百徒三年若計贓重於本罪者各加盜罪一等盜制書凡盜制書及起馬御寶聖㫖起船符驗者皆斬盜各衙門官文書者皆杖一百刺字若有所規避者從重論事干軍機錢糧者皆絞盜印信凡盜各衙門印信及夜巡銅牌者皆斬盜關防印信者皆杖一百刺字盜內府財物凡盜內府財物者皆斬盜城門鑰凡盜京城門鑰者杖一百流三千里盜府州縣鎮城關門鑰皆杖一百徒三年盜倉庫門等鑰皆杖一百並刺字盜軍器凡盜軍器者計贓以凡盜論若盜應禁軍器者與私有罪同若行軍之所及宿衛軍人相盜入已者准凡盜論還充官用者各減二等盜園陵樹木凡盜園陵內樹木者皆杖一百徒三年若盜他人墳塋內樹木者杖八十若計贓重於本罪者各加盜罪一等監守自盜倉庫錢糧凡監臨主守自盜倉庫錢糧等物不分首從併贓論罪並於右小臂膊上刺盜官錢糧物三字一貫以下杖八十一貫之上至二貫五百文杖九十五貫杖一百七貫五百文杖六十徒一年一十貫杖七十徒一年半一十二貫五百文杖八十徒二年一十五貫杖九十徒二年半一十七貫五百文杖一百徒三年二十貫杖一百流二千里二十二貫五百文杖一百流二千五百里二十五貫杖一百流三千里四十貫斬常人盜倉庫錢糧凡常人盜倉庫錢糧等物不得財杖六十免刺但得財者不分首從併贓論罪並於右小臂膊上刺盜官錢糧物三字一貫以下杖七十一貫之上至五貫杖八十一十貫杖九十一十五貫杖一百二十貫杖六十徒一年二十五貫杖七十徒一年半三十貫杖八十徒二年三十五貫杖九十徒二年半四十貫杖一百徒三年四十五貫杖一百流二千里五十貫杖一百流二千五百里五十五貫杖一百流三千里八十貫絞强盜凡强盜已行而不得財者皆杖一百流三千里但得財者不分首從皆斬若以藥迷人圖財者罪同若竊盜臨時有拒捕及殺傷人者皆斬因盜而姦者罪亦如之共盜之人不曽助力不知拒捕殺傷人及姦情者止依竊盜論其竊盜事主知覺棄財逃走事主追逐因而拒捕者自依罪人拒捕律科斷劫囚凡劫囚者皆斬若私竊放囚人逃走者與囚同罪至死者減一等竊而未得囚者減二等因而傷人者絞殺人者斬為從各減一等若官司差人追徴錢糧勾攝公事及捕獲罪人聚衆中途打奪者杖一百流三千里因而傷人者絞殺人及聚至十人為首者斬下手致命者絞為從各減一等其率領家人隨從打奪者止坐尊長若家人亦曽傷人者仍以凡人首從論白晝搶奪凡白晝搶奪人財物者杖一百徒三年計贓重者加竊盜罪二等傷人者斬為從各減一等並於右小臂膊上刺搶奪二字若若因失火及行船遭風著淺而乘時搶奪人財物及拆毁船隻者罪亦如之其本與人鬬毆或勾捕罪人因而竊取財物者計贓准竊盜論因而奪去者加二等罪止杖一百流三千里並免刺若有殺傷者各從故鬬論竊盜凡竊盜已行而不得財笞五十免刺但得財者以一主為重併贓論罪為從者各減一等初犯並於右小臂上上刺竊盜二字再犯刺左小臂膊三犯者絞以曽經刺字為坐掏摸者罪同若軍人為盜雖免刺字三犯一體處絞一貫以下杖六十一貫之上至一十貫杖七十二十貫杖八十三十貫杖九十四十貫杖一百五十貫杖六十徒一年六十貫杖七十徒一年半七十貫杖八十徒二年八十貫杖九十徒二年半九十貫杖一百徒三年一百貫杖一百流二千里一百一十貫杖一百流二千五百里一百二十貫罪止杖一百流三千里盜馬牛畜産凡盜馬牛驢騾猪羊雞犬鵝鴨者並計贓以竊盜論若盜官畜産者以常人盜官物論若盜馬牛而殺者杖一百徒三年驢騾杖七十徒一年半若計贓重於本罪者各加盜罪一等盜田野榖麥凡盜田野穀麥菜果及無人看守器物者並計贓准竊盜論免刺若山野柴草木石之類他人已用功力斫伐積聚而擅取者罪亦如之親屬相盜凡各居親屬相盜財物者期親減凡人五等大功減四等小功減三等緦麻減二等無服之親減一等並免刺若行强盜者尊長犯卑幼亦各依上減罪卑幼犯尊長以凡人論若有殺傷者各依殺傷尊長卑幼本律從重論若同居卑幼將引他人盜己家財物者卑幼依私擅用財物論加二等罪止杖一百他人減凡盜罪一等免刺若有殺傷者自依殺傷尊長卑幼本律科罪他人縱不知情亦依强盜論若他人殺傷人者卑幼縱不知情亦依殺傷尊長卑幼本律從重論其同居奴婢雇工人盜家長財物及自相盜者減凡盜罪一等免刺恐嚇取財凡恐嚇取人財物者計贓准竊盜論加一等免刺若期親以下自相恐嚇者卑幼犯尊長以凡人論尊長犯卑幼亦依親屬相盜律遞減科罪詐欺官司取財凡用計詐欺官司以取財物者並計贓准竊盜論免刺若期親以下自相欺詐者亦依親屬相盜律遞減科罪若監臨主守詐取所監守之物者以監守自盜論未得者減二等若冒認及誆賺局騙拐帶人財物者亦計贓准竊盜論免刺略人略賣人凡設方略而誘取良人及略賣良人為奴婢者皆杖一百流三千里為妻妾子孫者杖一百徒三年因而傷人者絞殺人者斬被略之人不坐給親完聚若假以乞養過房為名買良家子女轉賣者罪亦如之若和同相誘及相賣良人為奴婢者杖一百徒三年為妻妾子孫者杖九十徒二年半被誘之人減一等未賣者各減一等十嵗以下雖和亦同略誘法若略賣和誘他人奴婢者各減略賣和誘良人罪一等若略賣子孫為奴婢者杖八十弟妹及姪姪孫外孫若己之妾子孫之婦者杖八十徒二年子孫之妾減二等同堂弟妹堂姪及姪孫者杖九十徒二年半和賣者減一等未賣者又減一等被賣卑幼不坐給親完聚其賣妻為婢及賣大功以下親為奴婢者各從凡人和略法若窩主及買者知情並與犯人同罪牙保各減一等並追價入官不知者俱不坐追價還主發冢凡發掘墳冢見棺槨者杖一百流三千里已開棺槨見尸者絞發而未至棺槨者杖一百徒三年若冢先穿陷及未殯埋而盜尸柩者杖九十徒二年半開棺槨見尸者亦絞其盜取器物磚石者計贓准凡盜論免刺若卑幼發尊長墳冢者同凡人論開棺槨見尸者斬若棄尸賣墳地者罪亦如之買地牙保保知情者各杖八十追價入官地歸同宗親屬不知者不坐若尊長發卑幼墳冢開棺槨見尸者緦麻杖一百徒三年小功以上各遞減一等發子孫墳冢開棺槨見尸者杖八十其有故而依禮遷葬者俱不坐若殘毁他人死尸及棄尸水中者各杖一百流三千里若棄毁緦麻以上尊長死尸者斬棄而不失及髠髮若傷者各減一等緦麻以上卑幼各依凡人遞減一等毁棄子孫死尸者杖八十其子孫毁棄祖父母父母及奴婢雇工人毁棄家長死尸者斬若穿地得死尸不即掩埋者杖八十若於他人墳墓熏狐狸因而燒棺槨者杖八十徒二年燒尸者杖一百徒三年若緦麻以上尊長各遞加一等卑幼各依凡人遞減一等若子孫於祖父母父母及奴婢雇工人於家長墳墓熏狐狸者杖一百燒棺槨者杖一百徒三年燒尸者絞若平治他人墳墓為田園者杖一百於有主墳地內盜葬者杖八十勒限移葬若地界內有死人里長地鄰不申報官司檢驗而輒移他處及埋葬者杖八十以致失尸者杖一百殘毁及棄尸水中者杖六十徒一年棄而不失及髠髮若傷者各減一等因而盜取衣服者計贓准竊盜論免刺夜無故入人家凡夜無故入人家內者杖八十主家登時殺死者勿論其已就拘執而擅殺傷者減鬬毆殺傷罪二等至死者杖一百徒三年盜竊窩主凡强盜窩主造意身雖不行但分贓者斬若不行又不分贓者杖一百流三千里共謀者行而不分贓及分贓而不行皆斬若不行又不分贓者杖一百竊盜窩主造意身雖不行但分贓者為首論若不行又不分贓者為從論以臨時主意上盜者為首其為從者行而不分贓及分贓而不行仍為從論若不行又不分贓笞四十若本不同謀相遇共盜以臨時主意上盜者為首餘為從論其知人略賣和誘人及强竊盜後而分贓者計所分贓准竊盜為從論免刺若知强竊盜贓而故買者計所買物坐贓論知而寄藏者減一等各罪止杖一百其不知情誤買及受寄者俱不坐共謀為盜凡共謀為强盜臨時不行而行者却為竊盜共謀者分贓造意者為竊盜首餘人並為竊盜從若不分贓造意者為竊盜從餘人並笞五十以臨時主意上盜者為竊盜首其共謀為竊盜臨時不行而行者為强盜其不行之人造意者分贓知情不知情並為竊盜首造意者不分贓及餘人分贓俱為竊盜從以臨時主意及共為强盜者不分首從論公取竊取皆為盜凡盜公取竊取皆為盜器物錢帛之類須移徙已離盜所珠玉寶貨之類據入手隱藏縱未將行亦是其木石重器非人力所勝雖移本處未䭾載間猶未成盜馬牛駝騾之類須出䦨圈鷹犬之類須專制在已乃成為盜起除刺字凡盜賊曽經刺字者俱發原籍收充警跡該徒者役滿充警該流者於流所充警若有起除原刺字樣者杖六十補刺詐僞明律詐為制書凡詐為制書及增減者皆斬未施行者絞傳寫失錯者杖一百凡詐為將軍總兵官五軍都督府六部都察院都指揮使司內外各衛指揮使司守禦緊要隘口千戶所文書套畫押字盜用印信及空紙用印者皆絞察院布政司按察司府州縣衙門者杖一百流三千里其餘衙門者杖一百徒三年未施行者各減一等若有規避事重者從重論其當該官司知而聽行各與同罪不知者不知詐傳詔㫖凡詐傳詔㫖者斬皇后懿㫖皇太子令㫖親王令㫖者絞若詐傳一品二品衙門官言語於各衙門分付公事有所規避者杖一百徒三年三品四品衙門官言語者杖一百五品以下衙門官言語者杖八十為從者各減一等若得財者計贓以不枉法因而動事曲法者以枉法各從重論其當該官司知而聽行各與同罪不知者不坐若各衙門追究錢糧鞫問刑名公事當該官吏將奏准合行事理妄稱奉㫖追理者斬對制上書詐不以實凡對制及奏事上書詐不以實者杖一百徒三年非密而妄言有密者加一等若奉制推按問事報上不以實者杖八十徒二年事重者以出入人罪論僞造印信厯日等凡僞造諸衙門印信及厯日符驗夜巡銅牌茶鹽引者斬有能告捕者官給賞銀五十兩僞造關防印記者杖一百徒三年告捕者官給賞銀三十兩為從知情情行用者各減一等若造而未成者各又減一等其當該官司知而聽行與同罪不知者不坐僞造寶鈔凡僞造寶鈔不分首從及窩主知知情行使者皆斬財産並入官告捕者官給賞銀二百五十兩仍給犯人財産里長知而不首者杖一百不知者不坐其巡捕守把官軍知情故縱者與同罪若搜獲僞鈔隱匿入已不解官者杖一百流三千里失於巡捕及透漏者杖八十仍依强盜責限根捕若將寶鈔挑剜補輳描改以真作僞者杖一百流三千里為從及知情行使者杖一百徒三年其同情僞造人有能悔過捕獲同伴首告者與免本罪亦依常人一體給賞私鑄銅錢凡私鑄銅錢者絞匠人罪同為從及知情買使者各減一等告捕者官給賞銀五十兩里長知而不首者杖一百不知者不坐若將時用銅錢剪錯薄小取銅以求利者杖一百若僞造金銀者杖一百徒三年為從及知情買使者各減一等詐假官凡詐假官假與人官者斬其知情受假官者杖一百流三千里不知者不坐若無官而詐稱有官有所求為或詐稱官司差遣而捕人及詐冒官員姓名者杖一百徒三年若詐稱見任官子孫弟姪家人總領於按臨部內有所求為者杖一百為從者各減一等若得財者並計贓准竊盜從重論其當該官司知而聽行與同罪不知者不坐詐稱內使等官凡詐稱內使及都督府四輔諫院等官六部監察御史按察司官在外體察事務欺誑官府扇惑人民者斬知情隨行者減一等其當該官司知而聽行與同罪不知者不坐若詐稱使臣乘驛者杖一百流三千里為從者減一等驛官知而應付者與同罪不知情失盤結者笞五十其有符驗而應付者不坐近侍詐稱私行凡近侍之人在外詐稱私行體察事務扇惑人民者斬詐為瑞應凡詐為瑞應者杖六十徒一年若有災祥之類而欽天監官不以實對者加二等詐病死傷避事凡官吏人等詐稱病病臨事避難者笞四十事重者杖八十若犯罪待對故自傷殘者杖一百詐死者杖一百徒三年所避事重者各從重論若無避故自傷殘者杖八十其受雇倩為人傷殘者與犯人同罪因而致死者減鬬殺罪一等若當該官司知而聽行與同罪不知者不坐詐教誘人犯法凡諸人設計用言教誘人犯法及和同令人犯法却行捕告或令人捕告欲求給賞或欲陷害人得罪者皆與犯法之人同罪明㑹典卷一百三十
