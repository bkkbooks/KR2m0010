body:
  text: 明會典卷一百四十七工部一諸司職掌尚書侍郎之職掌天下百工山澤之政令其屬有四曰營部虞部水部屯部後改營部為營繕虞部為虞衡水部為都水屯部為屯田俱稱清吏司營繕清吏司諸司職掌郎中員外郎主事掌經營興造之衆務營造一營繕所掌工役有內府造作王府制度及儀仗城垣等項今備列于後內府造作諸司職掌凡內府宫殿門舍墻垣如奉旨成造及修理者必先委官督匠度量材料然後興工其工匠早晚出入姓名數目務要點閘關察機密所計物料并各色人匠明白呈稟本部行移支撥其合用竹木𨽻抽分竹木局磚瓦石灰𨽻聚寶山等窑冶硃漆彩畫𨽻營繕所丁線等項𨽻寶源局設若臨期輪班人匠不敷奏聞起取撮工事例洪武十一年令凡在京工匠上工者日給柴米鹽菜歇工者停給二十四年令工匠役作內府者量其勞力日給鈔貫永樂四年營建北京宫殿遣大臣詣四川湖廣江西浙江山西督軍民採木及督北京軍民匠造磚瓦徴天下諸色匠作在京諸衛及河南山東陜西山西都司中都留守司直𨽻各衛選軍士河南山東陜西山西等布政司直𨽻鳳陽淮安揚州廬州安慶徐州和州選民丁俱限明年五月赴北京聽役半年更代五年令各處上工人匠俱照舊印綬監起牌上工不許擅自撥取八年令內府上工人匠一牌上止寫一人名字不許雙名相合十九年令內府尚衣司禮司設等監織染針工銀作等局南京帶來人匠每月支糧三斗無工住支宣德七年令各衛軍匠內府上工者分為兩班月支糧五斗九年敕內府各監局內官內使等凡在內各衙門修造必明白具奏有擅為者悉處重罪又令內官監工匠月支糧五斗上工之日光祿寺仍給飯食正統元年令巾帽局撮工人匠月支米三斗工完住支五年令各處起取營造軍匠月支口糧三斗外其原籍月糧一石內又扣除三斗於見役處添支景泰元年令在京各監局及各厰上工軍匠光祿寺不關飯者月支米一石關飯者五斗三年令兵仗局攢造軍器軍匠仍支米五斗民匠四斗天順元年令司設監各色軍匠月支米五斗令燕山前等衛人匠於尚衣監上工者添支月糧一斗令御馬監軍匠添支月糧一斗民匠餘丁月支糧三斗二年令錦衣等衛及順天府軍匠添支月糧為五斗本年令內官監軍匠添支月糧一斗民匠餘丁上工日關與飯食又令司禮監軍匠月支糧三斗成化九年令錦衣衛鎮撫司髙手軍匠月支糧一石十年令內承運庫人匠鋪户月支糧二斗十二年令軍器鞍轡局軍匠月支米五斗又令修理城軍匠每月添支口糧二斗民匠三斗旗軍并不係食糧隂陽生一斗令留守等衛餘丁印綬監習學匠藝者月支米三斗親王府制明祖訓凡諸王宫室並依已定格式起蓋不許犯分凡諸王宫室並不許有離宫别殿及臺榭遊玩去處事例洪武四年議定凡王城髙二丈九尺下濶六丈上濶二丈女墻髙五尺五寸城河濶十五丈深三丈正殿基髙六尺九寸月臺髙五尺九寸正門臺髙四尺九寸五分廊房地髙二尺五寸王宫門地髙三尺二寸五分後宫地髙三尺二寸五分正門前後殿四門城樓飾以青緑點金廊房飾以青黑四門正門以紅漆金塗銅釘宫殿窠拱攢頂中畫蟠螭飾以金邉畫八吉祥花前後殿座用紅漆金蟠螭帳用紅綃金蟠螭座後壁則畫蟠螭彩雲立社稷山川壇于王城內之西南宗廟于王城內之東南後改蟠螭為龍七年定親王所居前殿名承運中曰圓殿後曰存心四城門南曰端禮北曰廣智東曰體仁西曰遵義九年定親王宫殿門廡及城門樓皆覆以青色琉璃瓦十一年定親王宫城周圍三里三百九步五寸東西一百五十丈二寸五分南北一百九十七丈二寸五分𢎞治八年定王府制前門五間門房十間廊房一十八間端禮門五間門房六間承運門五間前殿七間周圍廊房八十二間穿堂五間後殿七間家廟一所正房五間廂房六間門三間書堂一所正房五間廂房六間門三間左右盝頂房六間宫門三間廂房一十間前寢宫五間穿堂七間後寢宫五間周圍廊房六十間宫後門三間盝頂房一間東西各三所每所正房三間後房五間廂房六間多人房六連共四十二間漿糨房六間淨房六間庫十間山川壇一所正房三間廂房六間社稷壇一所正房三間廂房六間宰牲亭一座宰牲房五間儀仗庫正房三間廂房六間退殿門三間正房五間後房五間廂房十二間茶房二間淨房一間世子府一所正房三間後房五間廂房十六間典膳所正房五間穿堂三間後房五間廂房二十四間庫房三連二十五間馬房三十二間盝頂房三間後房五間廂房六間養馬房一十八間承奉司正房三間廂房六間承奉歇房二所每所正房三間厨房三間廂房六間六局共房一百二間每局正房三間後房五間廂房六間厨房三間內使歇房二處每處正房三間厨房六間歇房二十四間祿米倉三連共二十九間收糧廳正房三間廂房六間東西北三門每門三間門房六間大小門樓四十六座墻門七十八處井一十六口寢宫等處周圍磚徑墻通長一千八十九丈裏外蜈蚣木築土墻共長一千三百一十五丈成化十四年奏準各處王府以工完日為始至五十年後除有儀衛司群牧所并侍衛護衛千户軍校者令自修餘果人力俱乏該府具奏行勘給價自行修理郡王府制事例天順四年定郡王每位蓋府屋共四十六間前門樓三間五架中門樓一間五架前廳房五間七架廂房十間五架後廳房五間七架廂房十間五架厨房三間五架庫房三間五架米倉三間五架馬房三間五架成化十四年奏準各處自郡王以下至鄉君出府之日奏請勘報無房屋者有司給價自行起蓋給價則例山西晉代瀋府郡王一千兩鎮國將軍六百兩輔國將軍并郡主五百兩奉國將軍鎮國輔國中尉并縣主郡君縣君四百兩奉國中尉并鄉君三百兩庶人一百兩湖廣遼岷楚荆吉襄府郡王一千兩鎮國將軍七百兩輔國將軍六百六十兩奉國將軍六百二十兩鎮國輔國奉國中尉并郡主五百兩縣主四百六十兩郡君四百兩縣君三百六十兩鄉君三百四十兩陜西秦韓慶肅府郡王在城一千五百兩寧夏平涼九百兩郡主五百三十兩鎮國將軍一百七十五兩縣主郡君縣君鄉君俱自行起造河南唐鄭趙伊周徽崇府郡王官撥地基料價一千一十兩山東德魯府郡王一千兩鎮國將軍六百兩輔國將軍五百兩奉國將軍四百五十兩中尉四百兩郡主五百兩縣主三百五十兩郡君二百五十兩縣君二百兩鄉君一百五十兩江西淮寧府有地基郡王一千二百兩鎮國將軍六百兩輔國將軍五百五十兩奉國將軍四百五十兩奉國中尉四百兩郡主四百五十兩縣主三百七十兩郡君三百七十兩縣君三百五十兩鄉君三百三十兩無地基郡王一千五百兩鎮國將軍七百五十兩輔國將軍七百兩奉國將軍六百兩奉國中尉五百兩郡主六百兩縣主四百七十兩郡君四百七十兩縣君四百五十兩鄉君四百三十兩四川蜀府內江等五府子女蜀府出辦工料摘撥護衛軍餘成造石泉王府縣主五百兩𢎞治元年奏準郡王并鎮國輔國將軍等長子應出閣者於本府擇便房成婚如無開奏勘實待年豐撥工料銀一百兩送府自於府側修蓋各世長子承繼前宅其郡縣等主并儀賔終後子女不許僣居待有該府郡縣主成婚者與之二年奏準各處王府奏討房價者勘實依原價量減一半給與自造十四年奏準除郡王并妃自鎮國將軍以下其應得減半房價每一百兩者減二十兩不及一百兩者減十兩如鎮國將軍房價該三百兩者給與二百四十兩餘皆遞減明會典卷一百四十七
