body:
  text: 明㑹典卷一百三十一刑部六鬬毆明律鬬毆凡鬬毆以手足毆人不成傷者笞二十成傷及以他物毆人不成傷者笞三十成傷者笞四十青赤腫為傷非手足者其餘皆為他物即兵不用刃亦是㧞髪方寸以上笞五十若血從耳目中出及内損吐血者杖八十以穢物汚人頭面者罪亦如之折人一齒及手足一指眇人目抉毁人耳鼻若破人骨及用湯火銅鐵汁傷人者杖一百以穢物灌入人口鼻内者罪亦如之折二齒二指以上及髠髮者杖六十徒一年折人肋眇人兩目堕人胎及刃傷人者杖八十徒二年折跌人肢體及瞎人一目者杖一百徒三年瞎人兩目折人兩肢損人二事以上及因舊患令至篤疾若斷人舌及毁敗人陰陽者並杖一百流三千里仍将犯人財産一半斷付被傷篤疾之人養贍同謀共毆傷人者各以下手傷重者為重罪原謀減一等若因鬬互相毆傷者各驗其傷之輕重定罪後下手理直者減二等至死及毆兄姊伯叔者不減保辜限期凡保辜者責令犯人醫治辜限内皆須因傷死者以鬬毆殺人論其在辜限外及雖在辜限内傷已復平官司文案明白别因他故死者各從本毆傷法若折傷法上辜内醫治平復者各減二等辜内雖平復而成殘廢篤疾及辜限滿日不平復者各依律全科手足及以他物毆傷人者限二十日以刃及湯火傷人者限三十日折跌肢體及皮骨堕胎者無問手足他物皆限五十日宫内忿爭凡於宫内忿爭者笞五十聲徹御在所及相毆者杖一百折傷以上加凡鬬傷三等殿内又逓加一等皇家袒免以上親被毆凡皇家袒免親而毆之者杖六十徒一年傷者杖八十徒二年折傷以上重者加凡鬬二等緦麻以上各逓加一等篤疾者絞死者斬毆制使及本管長官凡奉制命出使而官吏毆之及部民毆本属知府知州知縣軍士毆本管指揮千戸百戸若吏卒毆本部五品以上長官杖一百徒三年傷者杖一百流二千里折傷者絞若毆六品以下長官各減三等毆佐貳官首領官又各逓減一等減罪輕者加凡鬬一等篤疾者絞死者斬若流外官及軍民吏卒毆非本管三品以上官者杖八十徒二年傷者杖一百徒三年折傷者杖一百流二千里毆傷五品以上官者减二等若減罪輕及毆傷九品以上官者各加凡鬬傷二等其公使人在外毆打有司官者罪亦如之從所属上司拘問佐職統属毆長官凡本衙門首領官及所属屬官毆傷長官者各減吏卒毆傷長官二等佐貳官毆長官者又各減二等減罪輕者加凡鬬一等篤疾者絞死者斬上司官與統屬官相毆凡監臨上司佐貳首領官與所統屬下司官品級高者及與部民有高官而相毆者並同凡鬬論若非相統屬官品級同自相毆者亦同凡鬬論九品以上官毆官長凡流内九品以上官毆非本管三品以上官者杖六十徒一年折傷以上及毆傷五品以上若五品以上毆傷三品以上官者各加凡鬬傷二等拒毆追攝人凡官司差人追徴錢粮勾攝公事而抗拒不服及毆所差人者杖八十若傷重至内損吐血以上及本犯重者各加二等罪止杖一百流三千里至篤疾者絞死者斬毆受業師凡毆受業師者加凡人二等死者斬威力制縳人凡爭論事理聴經管陳告若以威力制縳人及於私家拷打監禁者並杖八十傷重至内損吐血以上各加凡鬬毆傷二等而致死者絞若以威力主使人毆打而致死傷者並以主使之人為首下手之人為從論減一等良賤相毆凡奴婢毆良人者加凡人一等致篤疾者絞死者斬其良人毆傷他人奴婢者減凡人一等若死及故殺者絞若奴婢自相毆傷殺者各依凡鬬傷殺法相侵財物者不用此律若毆緦麻小功親奴婢非折傷勿論至折傷以上各減殺傷凡人奴婢罪二等大功減三等至死者杖一百徒三年故殺者絞過失殺者各勿論若毆緦麻小功親雇工人非折傷勿論至折傷以上各減犯人罪一等大功減二等至死及故殺者並絞過失殺者各勿論奴婢毆家長凡奴婢毆家長者皆斬殺者皆凌遲處死過失殺者絞傷者杖一百流三千里若毆家長之期親及外祖父母者絞傷者皆斬過失殺者減毆罪二等傷者又減一等故殺者皆凌遲處死毆家長之緦麻親杖六十徒一年小功杖七十徒一年半大功杖八十徒二年折傷以上緦麻加毆良人罪一等小功加二等大功加三等加者加入於死死者皆斬若雇工人毆家長及家長之期親若外祖父母者杖一百徒三年傷者杖一百流三千里折傷者絞死者斬故殺者凌遲處死過失殺傷者各減本殺傷罪二等毆家長之緦麻親杖八十小功杖九十大功杖一百傷重至内損吐血以上緦麻小功加凡人罪一等大功加二等死者各斬若奴婢有罪其家長及家長之期親若外祖父母不告官司而毆殺者杖一百無罪而殺者杖六十徒一年當房人口悉放從良若若家長及家長之期親若外祖父母毆雇工人非折傷勿論至折傷以上減凡人三等因而致死者杖一百徒三年故殺者絞若違犯教令而依法決罰邂逅致死及過失殺者各勿論妻妾毆夫凡妻毆夫杖一百夫願離者聽至折傷以上各加凡鬬鬬傷三等至篤疾者絞死者斬故殺者凌遲處死若妾毆夫及正妻者又各加一等加者加入於死其夫毆妻非折傷勿論至折傷以上減凡人二等先行審問夫婦如願離異者斷罪離異不願離異者驗罪收贖至死者絞毆傷妾至折傷以上減毆傷妻二等死死者杖一百徒三年妻毆傷妾與夫毆妻罪同過失殺者各勿論若毆妻之父母者杖一百折傷以上各加凡鬬傷罪一等至篤疾者絞死者斬同姓親屬相毆凡同姓親屬相毆雖五服已盡而尊卑名分猶存者尊長減凡鬬一等卑幼加一等至死者並以凡人論毆大功以下尊長凡卑幼毆本宗及外姻緦麻兄姊杖一百小功杖六十徒一年大功杖七十徒一年半尊屬又各加一等折傷以上各逓加凡鬬傷一等篤疾者絞死者斬若尊長毆卑幼非折傷勿論至折傷以上緦麻減凡人一等小功減二等大功減三等至死者絞其毆殺同堂弟妹堂姪及姪孫者杖一百流三千里故殺者絞毆期親尊長凡弟妹毆兄姊者杖九十徒二年半傷者杖一百徒三年折傷者杖一百流三千里刃傷及折肢體瞎其一目者絞死者皆斬若姪毆伯叔父母姑及外孫毆外祖父母各加一等其過失殺傷者各減本殺傷罪二等故殺者皆凌遲處死其兄姊毆殺弟妹及伯叔姑毆殺姪并姪孫若外祖父母毆殺外孫者杖一百徒三年故殺者杖一百流二千里過失殺者各勿論毆祖父母父母凡子孫毆祖父母父母及妻妾毆夫之祖父母父母者皆斬殺者皆凌遲處死過失殺者杖一百流三千里傷者杖一百徒三年其子孫違犯教令而祖父母父母非理毆殺者杖一百故殺者杖六十徒一年嫡繼慈養母殺者各加一等致令絶嗣者絞若非理毆子孫之婦及乞養異姓子孫致令廢絶者杖八十篤疾者加一等並令歸宗子孫之婦追還嫁粧仍給養贍銀一十兩乞養子孫撥付合得財産養贍至死者各杖一百徒三年故殺者各杖一百流二千里妾各減二等其子孫毆罵祖父母父母及妻妾毆罵夫之祖父母父母而毆殺之若違犯教令而依法決罰邂逅致死及過失殺者各勿論妻妾與夫親屬相毆凡妻妾毆夫之期親以下緦麻以上尊長與夫毆同罪至死者各斬若妻毆傷卑属與夫毆同至死者絞若毆殺夫之兄弟子杖一百流三千里故殺者絞妾犯者各從凡鬬法若尊長毆傷卑幼之婦減凡人一等妾又減一等至死者絞若弟妹毆兄之妻加凡人一等若兄姊毆弟之妻及妻毆夫之弟妹及弟之妻各減凡人一等若毆妾者各又減一等其毆姊妹夫妻之兄弟及妻毆夫之姊妹夫者以凡鬬論若妾犯者各加一等若妾毆夫之妾子減凡人二等毆妻之子以凡人論若妻之子毆傷父妾加凡人一等妾子毆傷父妾又加二等至死者各依凡人論毆妻前夫之子凡毆妻前夫之子者減凡人一等同居者又減一等至死者絞若毆繼父者杖六十徒一年折傷以上加凡鬬傷一等同居者又加一等至死者斬其故殺及自來不曾同居者各以凡人論妻妾毆故夫父母凡妻妾夫亡改嫁毆故夫之祖父母父母者並與毆舅姑罪同其舊舅姑毆已故子孫改嫁妻妾者亦與毆子孫婦同若奴婢毆舊家長及家長毆舊奴婢者各以凡人論父祖被毆凡祖父母父母為人所毆子孫即時救䕶而還毆非折傷勿論至折傷以上減凡鬬三等至死者依常律若祖父母父母為人所殺而子孫擅殺行兇人者杖六十其即時殺死者勿論罵言明律罵人凡罵人者笞一十互相罵者各笞一十罵制使及本管長官凡奉制命出使而官吏罵詈及部民罵本屬知府知州知縣軍士罵本管指揮千戸百戸若吏卒罵本部五品以上長官杖一百若罵六品以下長官各減三等罵佐貳官首領官又各逓減一等佐職統屬長官凡首領官及統屬官罵五品以上長官杖八十若罵六品以下長官減三等佐貳官罵長官者又各減二等奴婢罵家長凡奴婢罵家長者絞罵家長之期親及外祖父母者杖八十徒二年大功杖八十小功杖七十緦麻杖六十若雇工人罵家長者杖八十徒二年罵家長之期親及外祖父母者杖一百大功杖六十小功笞五十緦麻笞四十罵尊長凡罵緦麻兄姊笞五十小功杖六十大功杖七十尊屬各加一等若罵兄姊者杖一百伯叔父母姑外祖父母各加一等罵祖父母父母凡罵祖父母父母及妻妾罵夫之祖父母父母者並絞妻妾罵夫期親尊長凡妻妾罵夫之期親以下緦麻以上尊長與夫罵罪同妾罵夫者杖八十妾罵妻者罪亦如之若罵妻之父母者杖六十妻妾罵故夫父母凡妻妾夫亡改嫁罵故夫之祖父母父母者並與罵舅姑罪同若奴婢罵舊家長者以凡人論訴訟明律越訴凡軍民詞訟皆須自下而上陳告若越本官官司輒赴上司稱訴者笞五十若迎車駕及撃登聞鼓申訴而不實者杖一百事重者從重論得實者免罪投匿名文書告人罪凡投隠匿姓名文書告言人罪者絞見者即便燒毁若将送入官司者杖八十官司受而為理者杖一百被告言者不坐若能連文書捉獲解官者官給銀一十兩充賞告狀不受理凡告謀反逆叛官司不即受理掩捕者杖一百徒三年以致聚衆作亂攻陷城池及刼掠人民者斬若告惡逆不受理者杖一百告殺人及强盜不受理者杖八十鬬毆婚姻田宅等事不受理者各減犯人罪二等並罪止杖八十受財者計贓以枉法從重論若詞訟原告被論在兩處州縣者聴原告就被論官司告理歸結推故不受理者罪亦如之若都督府各部兼察御史按察司及分司經歴去處應有詞訟未經本管官司陳吿及本宗公事未絶者並聴置簿立限發當該官司追問取具歸結縁由勾銷若有遲錯不即舉行改正者與當官官吏同罪其已經本管官司陳告不為受理及本宗公事已絶理斷不當稱訴寃枉者各衙門即便勾問若推故不受理及轉委有司或仍發原問官收問者依依告狀不受理律論罪若追問詞訟及大小公事須要就本衙門歸結不得轉委違者隨所告事理輕重以坐其罪聴訟迴避凡官吏於訴訟人内闗有服親及婚姻之家若受業師及舊有讐嫌之人並聴移文廽避違者笞四十若罪有増減者以故出入人罪論誣告凡誣告人笞罪者加所誣罪二等流徒杖罪加所誣罪三等各罪止杖一百流三千里若所誣徒罪人已役流罪人已配雖經改正放囬驗日犯犯人名下追徴用過路費給還若曽經典賣田宅者著落犯人備價取贖因而致死随行有服親屬一人者絞将犯人財産一半斷付被誣之人至死罪所誣之人已決者反坐以死未決者杖一百流三千里加役三年其犯人如果貧乏無可備償路費取贖田宅亦無財産斷付者止科其罪其被誣之人詐冒不實反誣犯人者亦抵所誣之罪犯人止反坐本罪若吿二事以上重事告實輕事招虚及數事罪等但一事告實者皆免罪若告二事以上輕事告實重事招虚或告一事誣輕為重者皆反坐所剰若已論決全抵剰罪未論決笞杖收贖徒流止杖一百餘罪亦聴收贖至死罪而所誣之人已決者反坐以死未決者止杖一百流三千里若律該罪止者誣告雖多不反坐其告二人以上但有一人不實者罪雖輕猶以誣告論若各衙門官進呈實封誣告人及風憲官挾私彈事有不實者罪亦如之若反坐及加罪輕者從上書詐不實論若獄囚已招伏罪本無寃枉而囚之親屬妄訴者減囚罪三等罪止杖一百若囚已決配而自妄訴寃枉摭拾原問官吏者加所誣罪三等罪止杖一百流三千里干名犯義凡子孫告祖父母父母妻妾告夫及夫之祖父母父母者杖一百徒三年但誣告者絞若告期親尊長外祖父母雖得實杖一百大功杖九十小功杖八十緦麻杖七十其被告期親大功尊長及外祖父母若妻之父母並同自首免罪小功緦麻尊長得減本罪三等若誣告重者各加所誣罪三等其吿謀反大逆謀叛窩藏姦細及嫡母繼母慈母所生母殺其父若所養父母殺其所生父母及被期親以下尊長侵奪財産或毆傷其身應自理訴者並聴吿不在於名犯義之限若告卑幼得實期親大功及女壻亦同自首免罪小功緦麻亦得減本罪三等誣告者期親減所誣罪三等大功減二等小功緦麻減一等若誣告妻及妻誣告妾亦減所誣罪三等若奴婢告家長及家長緦麻以上親者與子孫卑幼罪同若雇工人吿家長及家長之親者各減奴婢罪一等誣吿者不減其祖父母父母外祖父母誣告子孫外孫子孫之婦妾及己之妾若奴婢及雇工人者各勿論若女壻與妻父母果有義絶之狀許相告言各依常人論子孫違犯教令凡子孫違犯祖父母父母教令及奉養有缺者杖一百見禁囚不得吿舉他事凡被囚禁不得吿舉他事其為獄官獄卒非理凌虐者聴吿若因囚禁被問更首别事有干連之人亦各准首依法推問科罪其其年八十以上十嵗以下及篤疾者若婦人除謀反逆叛子孫不孝或己身及同居之内為人盜詐侵奪財産及殺傷之𩔖聴告餘並不得告官司受而為理者笞五十教唆詞訟凡教唆詞訟及為人作詞狀增減情罪誣吿人者與犯人同罪若受雇誣告人者與自誣告同受財者計贓以枉法從重論其見人愚而不能伸寃教令得實及為人書寫詞状而罪無増減者勿論軍民約㑹詞訟凡軍官軍人有犯人命管軍衙門約㑹有司檢驗歸問若姦盜詐偽戸婚田土鬬毆與民相干事務必須一體約問與民不相干者從本管軍職衙門自行追問其有占恡不發首領官吏各笞五十若管軍官越分輙受民訟者罪亦如之官吏詞訟家人訴凡官吏有爭論婚姻錢債田土等事聴令家人告官理對不許公文行移違者笞四十誣告充軍及遷徙凡誣告充軍者民告牴充軍役軍告發邊逺充軍若官吏故将平人頂替他人軍役者以故出入人流罪論杖一百流三千里若誣告人説事過錢者於遷徙比流減半准徒二年上加所誣罪三等併入所得笞杖通論受贓明律官吏受財凡官吏受財者計贓科斷無禄人各減一等官追奪除名吏罷役俱不叙說事過錢者有祿人減受錢人一等無祿人減二等罪止杖一百各遷徙有贓者計贓從重論有禄人枉法贓各主者通算全科一貫以下杖七十一貫之上至五貫杖八十一十貫杖九十一十五貫杖一百二十貫杖六十徒一年二十五貫杖七十徒一年半三十貫杖八十徒二年三十五貫杖九十徒二年半四十貫杖一百徒三年四十五貫杖一百流二千里五十貫杖一百流二千五百里五十五貫杖一百流三千里八十貫不枉法贓各主者通算折半科罪一貫以下杖六十一貫之上至一十貫杖七十二十貫杖八十三十貫杖九十四十貫杖一百五十貫杖六十徒一年六十貫杖七十徒一年半七十貫杖八十徒二年八十貫杖九十徒二年半九十貫杖一百徒三年一百貫杖一百流二千里一百一十貫杖一百流二千五百里一百二十貫罪止杖一百流三千里無禄人枉法一百二十貫絞不枉法一百二十貫之上罪止杖一百流三千里坐贓致罪凡者官吏人等非因事受財坐贓致罪各主通算折半科罪與者減五等一貫以下笞二十一貫之上至一十貫笞三十二十貫笞四十三十貫笞五十四十貫杖六十五十貫杖七十六十貫杖八十七十貫杖九十八十貫杖一百一百貫杖六十徒一年二百貫杖一百徒一年半三百貫杖八十徒二年四百貫杖九十徒二年半五百貫之上罪止杖一百徒三年事後受財凡有事先不許財事過之後而受財事若枉斷者准枉法論事不枉斷者准不枉法論有事以財請求凡諸人有事以財行求得枉法者計所與財坐贓論若有避難就易所枉重者從重論其官吏刁蹬用强生事逼抑取受者出錢人不坐在官求索借貸人財物凡監臨官吏挾勢及豪强之人求索借貸所部内財物者並計贓准不枉法論强者准枉法論財物給主若将自己物貨散與部民及低價買物多取價利者並計餘利准不枉法論强者准枉法論物貨價錢並入官給主若於所部内買物不即支價及借衣服器玩之屬各經一月不還者並坐贓論若私借用所部内馬牛駝騾驢及車船碾磨店舍之𩔖各驗日計雇賃錢亦坐贓論追錢給主若接受所部内饋送土宜禮物受者笞四十與者減一等若因事而受者計贓以不枉法論其經過去處供饋飲食及親故饋送者不在此限其出使人於所差去處求索借貸賣買多取價利及受饋送者並與監臨官吏罪同若去官而受舊部内財物及求索借貸之屬各減在官時二等家人求索凡監臨官吏家人於所部内取受求索借貸財物及役使部民若賣買多取價利之𩔖各減本官罪二等若本官知情與同罪不知者不坐風憲官吏犯贓凡風憲官吏受財及於所按治去處求索借貸人財物若賣買多取價利及受饋送之𩔖各加其餘官吏罪二等因公擅科斂凡有司官吏人等非奉上司明文因公擅自科斂所屬財物及管軍官吏總旗小旗科斂軍人錢粮賞賜者杖六十贓重者坐贓論入已者並計贓以枉法論其非因公務科斂人財物入己者計贓以不枉法論若饋送人者雖不入已罪亦如之私受公侯財物凡内外各衛指揮千戸百戸鎮撫并總旗小旗等不得於私下或明白接受公侯所與寶鈔金銀段匹衣服粮米錢物若受者軍官杖一百罷職發邊逺充軍總旗小旗罪同再犯處死公侯與者初犯再犯免罪附過三犯准免死一次若奉命征討與者受者不在此限尅留盜賊凡巡捕官已獲盜賊尅留贓物不解官者笞四十入已者計贓以不枉法論仍将其贓併論盜罪若軍人弓兵有犯者計贓雖多罪止杖八十官吏聴許財物凡官吏聴許財物雖未接受事若枉者准枉法論事不枉者准不枉法論各減一等所枉重者各從重論明㑹典卷一百三十一
