body:
  text: 明會典卷一百七十詹事府國初設東宫官屬有同知詹事院事副詹事左右詹事詹事丞左右率府使副使同知左右率府事諭德贊善文學中舍正字侍正洗馬庶子等官皆以勳舊大臣兼之不别設府僚又改贊善為贊善大夫設贊讀洪武十年置通事司設司令司丞十四年設左右司直郎十五年置左右春坊設大學士又置司經局設洗馬校書正字二十二年以各衙門無所統屬始置詹事院二十三年設校書二十五年改院為府定設詹事少詹事府丞并主簿録事左右春坊大學士左右庶子左右諭德左右中允左右贊善左右司直郎司經局洗馬校書正字二十九年添設春坊左右清紀郎左右司諫通事舍人各官皆以東宫輔導侍從為職而凡事務俱統于本府事例洪武初置大本堂令皇太子親王講學設官授經後皇太子居文華殿各官分班入直并選秀才入充伴讀天順以後止令東宫官與翰林院官分班講讀永樂初定講讀儀春坊官與翰林院官日分二員講書以尚書春秋通鑑大學衍義貞觀政要等書進講須要纂其事之始終直述大義輯成篇章進呈御覽畢然後赴文華殿講説三師三少及詹事府官鴻臚寺并每科給事中一員侍立進講畢衆官齊出及有召問亦須前項官員一同進出如有獨進并獨員留後者許給事中鴻臚寺官并司直郎清紀郎紏劾凡講讀畢每遇上位發落過五府軍政六部緊要事務及撫諭四夷恩意其大經大法詹事府官同春坊官將緣由於文華殿講書之後衆官未退之時一一敷陳焉凡東宫官屬舊制與翰林院官互兼職事凡遇正旦冬至節行慶賀禮并進厯進春等事本府例該啓皇太子知必先奏聞俟得旨方具啓本進凡遇皇太子千秋節行慶賀禮奏啓本同進凡講讀纂修考試等事皆與翰林院同凡本府官於午門內出入洪武二十六年令給牌為驗後不給凡本府合用紙劄每月於刑部關給筆墨印色順天府買辦送用南京詹事府後不設官止設主簿一員左春坊右春坊司經局建置俱見詹事府事例凡正旦冬至皇太子千秋節兩坊局官二員與翰林院官於文華殿侍班正旦冬至千秋節禮部官進箋并進厯進春通事二員舉案凡講讀纂修考試等事坊局官皆預詳見翰林院凡坊局官吏俸糧舊於禮部帶支後奏準俱從詹事府支給凡紙劄印色等項俱於詹事府分給南京左春坊南京右春坊南京司經局後俱不設官順天府永樂初改北平府為順天府十年升正三品衙門官制印信皆如應天府事例凡每月朔日早朝府尹面奏老人坊廂長聽宣諭承旨出至承天門外傳旨宣諭凡每歲立春先一日本府官迎春於東直門外至日上御奉天殿府尹進春次詣東宫進春皆如儀太皇太后皇太后中宫親王春俱捧在午門外司禮監官捧進凡親耕藉田上秉耒行三推禮府尹捧青箱隨播種于後凡每歲春遣祭先農春秋祭宋丞相文天祥及祭元世祖皆府尹行禮凡清明節七月十五日十月初一日祭厲壇合用守壇官軍本府官先期面奏於各營官軍內差撥凡鄉飲酒禮舊制每歲正月十五日十月初一日舉行後以初一日時享太廟府尹府丞例該陪祭奏準移於初二日舉行如儀凡每三年鄉試本府奏請翰林院官為考試官先一日府丞與考試官及各執事官早朝面辭入院三場題目皆府尹面進事畢府丞與考試等官面見捧鄉試録進太皇太后皇太后中宫東宫親王鄉試録俱在午門外奏請司禮監官捧進仍奏各官及舉人於本府筵宴明日引諸舉人赴御前叩頭凡官吏監生人等告依親省祭給假患病等項各該衙門開具手本送本府給與文引照回原籍凡公侯駙馬伯家人給過文引本府官每季具揭帖於御前奏進凡各處赴京奏訴之人應遞解者法司送至本府解發凡所屬都稅宣課等司批驗茶引等所每年收到商稅等鈔按季解本府類解户部交納取具批收附卷備照凡清理軍役本府通判一員專管凡清理匠役本府通判一員專管凡太僕寺寄養馬匹本府通判一員專管凡易州厰柴炭本府通判一員專管凡漕運河道自通州抵直沽本府通判一員專管凡光祿寺供用諸物在城兩縣給料製造或給價買辦惟衍聖公張真人下程禮部行本府自送凡各廟寺宫觀廟户𢎞治十一年奏定除文廟城隍廟照舊其餘六户以上者各存留十户增多者盡行裁革應天府國初改集慶路為應天府設知府同知通判及經歷知事照磨等官後添設治中推官洪武三年升正三品衙門賜銀印改知府為府尹同知為府丞二十七年添設檢校本府官本府官職專親民之事惟以京府事重品秩體貌視在外諸府特異云事例凡本府每嵗祭歷代忠臣府尹不具祭服用便服行禮凡本府鄉試永樂後不進題凡本府迎春行禮畢其春牛春花等物永樂後俱進太廟內官收送至京凡南京外羅城舊例俱南京工部修理景泰六年奏準行本府屬縣暫撥人夫兼用成化九年奏準自馴象門起八門屬本府修理滄波門起八門屬工部修理又令鎮江寧國二府及廣德州每年各出銀六十兩送本府收貯以備修理之用凡太僕寺官歲終比較馬匹成化十四年奏準府尹府丞許納米贖罪凡南京户兵工三部官銀俱寄收本府永豐庫成化十八年設大使一員僉撥庫子十名明會典卷一百七十
