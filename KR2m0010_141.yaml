body:
  text: 明會典卷一百四十一刑部十六都官科諸司職掌律令捕亡婚姻犯姦雜犯斷獄捕亡明律應捕人追捕罪人凡應捕人承差追捕罪人而推故不行若知罪人所在而不捕者減罪人罪一等限三十日內能自捕得一半以上雖不及一半但所獲者最重皆免其罪雖一人捕得餘人亦同若罪人已死及自首各盡者亦免罪不盡者止以不盡之人為坐其非應捕人臨時差遣者各減應捕人罪一等受財故縱者不給捕限各與囚同罪贓重者計贓以枉法從重論罪人拒捕凡犯罪逃走拒捕者各於本罪上加二等罪止杖一百流三千里毆人至折傷以上者絞殺人者斬為從者各減一等若罪人持杖拒捕其捕者格殺之及囚逃走捕者逐而殺之若囚窘迫而自殺者皆勿論若已就拘執及不拒捕而殺或折傷者各以鬭殺傷論罪人本犯應死而擅殺者杖一百獄囚脫監及反獄在逃凡犯罪被囚禁而脫監及解脫自帶枷鎖越獄在逃者各於本罪上加二等因而竊放他囚罪重者與囚同罪並罪止杖一百流三千里本犯應死者依常律若罪囚反獄在逃者皆斬同牢囚人不知情者不坐徒流人逃凡徒流遷徙囚人役限內而逃者一日笞五十每三日加一等罪止杖一百仍發配所其徒囚照依原犯徒年從新拘役役過月日並不準理若起發已斷決徒流遷徙充軍囚徒未到配所中途在逃者罪亦如之主守及押解人不覺失囚者一名杖六十每一名加一等罪止杖一百皆聽一百日內追捕提調官及長押官減主守及押解人罪三等限內能自捕得或他人捕得若囚已死及自首皆免罪故縱者各與囚同罪受財者計贓以枉法從重論稽留囚徒凡應徒流遷徙充軍囚徒斷決後當該官司限一十日內如法枷杻差人管押牢固關防發遣所擬地方交割若限外無故稽留不送者三日笞二十每三日加一等罪止杖六十因而在逃者就將提調官吏抵犯入本罪發遣候捕獲犯人到官替役至日疏放别敘若臨境官司囚到稽留不即遞送者罪亦如之若發遣之時提調官吏不行如法枷杻以致囚徒中途解脫自帶枷杻在逃者與押解人同罪並罪坐所由受財者計贓以枉法從重論主守不覺失囚凡獄卒不覺失囚者減囚罪二等若囚自內反獄在逃又減二等聽給限一百日追捕限內能自捕得及他人捕得若囚已死及自首皆免罪司獄官典減獄卒罪三等其提牢官曾經躬親逐一點視罪囚枷鎖杻俱已如法取責獄官獄卒牢固收禁文狀者不坐若不曾點視以致失囚者與獄官罪同故縱者不給捕限各與囚同罪未斷之間能自捕得及他人捕得若囚已死及自首各減一等受財者計贓以枉法從重論若賊自外入劫囚力不能敵者免罪若押解罪囚中途不覺失囚者罪亦如之知情藏匿罪人凡知人犯罪事發官司差人追喚而藏匿在家不行捕告及指引道路資給衣糧送令隱避者各減罪人罪一等其展轉相送而隱藏罪人知情者皆坐不知者勿論若知官司追捕罪人而漏泄其事致令罪人得以逃避者減罪人罪一等未斷之間能自捕得者免罪若他人捕得及罪人已死若自首又各減一等盜賊捕限凡捕強竊盜賊以事發日為始當該應捕弓兵一月不獲強盜者笞二十兩月笞三十三月笞四十捕盜官罰俸錢兩月弓兵一月不獲竊盜者笞一十兩月笞二十三月笞三十捕盜官罰俸錢一月限內獲賊及半者免罪若經隔二十日以上告官者不拘捕限捕殺人賊與捕強盜限同婚姻明律男女婚姻凡男女定婚之初若有疾殘老幼庶出過房乞養者務要兩家明白通知各從所願寫立婚書依禮聘嫁若許嫁女已報婚書及有私約而輒悔者笞五十雖無婚書但曾受聘財者亦是若再許他人未成婚者杖七十已成婚者杖八十後定娶者知情與同罪財禮入官不知者不坐追還財禮女歸前夫前夫不願者倍追財禮給還其女仍從後夫男家悔者罪亦如之不追財禮其未成婚男女有犯姦盜者不用此律若為婚而女家妄冒者杖八十追還財禮男家妄冒者加一等不追財禮未成婚者仍依原定已成婚者離異其應為婚者雖已納聘財期約未至而男家強娶及期約已至而女家故違期者並笞五十若卑幼或仕宦或買賣在外其祖父母父母及伯叔父母姑兄姊後為定婚而卑幼自娶妻已成婚者仍舊為婚未成婚者從尊長所定違者杖八十典雇妻女凡將妻妾受財典雇與人為妻妾者杖八十典雇女者杖六十婦女不坐若將妻妾妄作姊妹嫁人者杖一百妻妾杖八十知而典娶者各與同罪並離異財禮入官不知者不坐追還財禮妻妾失序凡以妻為妾者杖一百妻在以妾為妻者杖九十並改正若有妻更娶妻者亦杖九十離異其民年四十以上無子者方聽娶妾違者笞四十逐壻嫁女凡逐壻嫁女或再招壻者杖一百其女不坐男家知而娶者同罪不知者亦不坐其女斷付前夫出居完聚居喪嫁娶凡居父母及夫喪而身自嫁娶者杖一百若男子居喪娶妾妻女嫁人為妾者各減二等若命婦夫亡再嫁者罪亦如之追奪並離異知而共為婚姻者各減五等不知者不坐若居祖父母伯叔父母姑兄姊喪而嫁娶者杖八十妾不坐若居父母舅姑及夫喪而與應嫁娶人主婚者杖八十其夫喪服滿願守志非女之祖父母父母而強嫁之者杖八十期親強嫁者減二等婦人不坐追歸前夫之家聽從守志娶者亦不坐追還財禮父母囚禁嫁娶凡祖父母父母犯死罪被囚禁而子孫嫁娶者杖八十為妾者減二等其奉祖父母父母命而嫁女娶妻者不坐亦不得筵宴同姓為婚凡同姓為婚者各杖六十離異尊卑為婚凡外姻有服尊屬卑幼共為婚姻及娶同母異父姊妹若妻前夫之女者各以姦論其父母之姑舅兩姨姊妹及姨若堂姨母之姑堂姑已之堂姨及再從姨堂外甥女若女壻及子孫婦之姊妹並不得為婚姻違者各杖一百若娶已之姑舅兩姨姊妹者杖八十並離異娶親屬妻妾凡娶同宗無服之親及無服親之妻者各杖一百若娶緦麻親之妻及舅甥妻各杖六十徒一年小功以上各以姦論其曾被出及已改嫁而娶為妻妾者各杖八十若收父祖妾及伯叔母者各斬若兄亡收嫂弟亡收弟婦者各絞妾各減二等若娶同宗緦麻以上姑姪姊妹者亦各以姦論並離異娶部民婦女為妻妾凡府州縣親民官任內娶部民婦女為妻妾者杖八十若監臨官娶為事人妻妾及女為妻妾者杖一百女家並同罪妻妾仍兩離之女給親財禮入官強娶者各加二等女家不坐不追財禮若為子孫弟姪家人娶者罪亦如之男女不坐娶逃走婦女凡娶犯罪逃走婦女為妻妾知情者與同罪至死者減一等離異不知者不坐若無夫會赦免罪者不離強占良家妻女凡豪勢之人強奪良家妻女姦占為妻妾者絞婦女給親配與子孫弟姪家人者罪亦如之男女不坐娶樂人為妻妾凡官吏娶樂人為妻妾者杖六十並離異若官員子孫娶者罪亦如之附過候廕襲之日降一等於邊逺敘用其在洪武元年以前娶者勿論僧道娶妻凡僧道娶妻妾者杖八十還俗女家同罪離異寺觀住持知情與同罪不知者不坐若僧道假託親屬或僮僕為名求娶而僧道自占者以姦論良賤為婚姻凡家長與奴娶良人女為妻者杖八十女家減一等不知者不坐其奴自娶者罪亦如之家長知情者減二等因而入籍為婢者杖一百若妄以奴婢為良人而與良人為夫妻者杖九十各離異改正蒙古色目人婚姻凡蒙古色目人聽與中國人為婚姻務要兩相情願不許本類自相嫁娶違者杖八十男女入官為奴其中國人不願與回回欽察為婚姻者聽從本類自相嫁娶不在禁限出妻凡妻無應出及義絶之狀而出之者杖八十雖犯七出有三不去而出之者減二等追還完聚若犯義絶應離而不離者亦杖八十若夫妻不相和諧而兩願離者不坐若妻背夫在逃者杖一百從夫嫁賣因而改嫁者絞其因夫逃亡三年之內不告官司而逃去者杖八十擅改嫁者杖一百妾各減二等若婢背家長在逃者杖八十因而改嫁者杖一百給還家長窩主及知情娶者各與同罪至死者減一等不知者俱不坐若由期親以上尊長主婚改嫁者罪坐主婚妻妾止得在逃之罪餘親主婚者事由主婚主婚為首男女為從事由男女男女為首主婚為從至死者主婚人並減一等嫁娶違律主婚媒人罪凡嫁娶違律若由祖父母父母伯叔父母姑兄姊及外祖父母主婚者獨坐主婚餘親主婚者事由主婚主婚為首男女為從事由男女男女為首主婚為從至死者主婚人並減一等其男女被主婚人威逼事不由己若男年二十嵗以下及在室之女亦獨坐主婚男女俱不坐未成婚者各減已成婚罪五等若媒人知情者各減犯人罪一等不知者不坐其違律為婚各條稱離異改正者雖會赦猶離異改正離異者婦女並歸宗財禮若娶者知情則追入官不知者則追還主犯姦明律犯姦凡和姦杖八十有夫杖九十刁姦杖一百強姦者絞未成者杖一百流三千里姦幼女十二嵗以下者雖和同強論其和姦刁姦者男女同罪姦生男女責付姦夫收養姦婦從夫嫁賣其夫願留者聽若嫁賣與姦夫者姦夫本夫各杖八十婦人離異歸宗財物入官強姦者婦女不坐若媒合容止通姦者各減犯人罪一等私和姦事者減二等其非姦所捕獲及指姦者勿論若姦婦有孕罪坐本婦縱容妻妾犯姦凡縱容妻妾與人通姦本夫姦夫姦婦各杖九十抑勒妻妾及乞養女與人通姦者本夫義父各杖一百姦夫杖八十婦女不坐並離異歸宗若縱容抑勒親女及子孫之婦妾與人通姦者罪亦如之若用財買休賣休和娶人妻者本夫本婦及買休人各杖一百婦人離異歸宗財禮入官若買休人與婦人用計逼勒本夫休棄其夫别無賣休之情者不坐買休人及婦人各杖六十徒一年婦人餘罪收贖給付本夫從其嫁賣妾減一等媒合人各減犯人罪一等親屬相姦凡姦同宗無服之親及無服親之妻者各杖一百若姦緦麻以上親及緦麻以上親之妻若妻前夫之女及同母異父姊妹者各杖一百徒三年強者斬若姦從祖祖母姑從祖伯叔母姑從父姊妹母之姊妹及兄弟妻兄弟子妻者各絞強者斬若姦父祖妾伯叔母姑姊妹子孫之婦兄弟之女者各斬妾各減一等強者絞誣執翁姦凡男婦誣執親翁及弟婦誣執夫兄欺姦者斬奴及雇工人姦家長妻凡奴及雇工人姦家長妻女者各斬若姦家長之期親若期親之妻者絞婦女減一等若姦家長之緦麻以上親及緦麻以上親之妻者各杖一百流二千里強者斬妾各減一等強者亦斬姦部民妻女凡軍民官吏姦所部妻女者加凡姦罪二等各罷職役不敘婦女以凡姦論若姦囚婦者杖一百徒三年囚婦止坐元犯罪名居喪及僧道犯姦凡居父母及夫喪若僧尼道士女冠犯姦者各加凡姦罪二等相姦之人以凡姦論良賤相姦凡奴姦良人婦女者加凡姦罪一等良人姦他人婢者減一等奴婢相姦者以凡姦論官吏宿娼凡官吏宿娼者杖六十媒合人減一等若官員子孫宿娼者罪亦如之附過候廕襲之日降一等於邊逺敘用買良為娼凡娼優樂人買良人子女為娼優及娶為妻妾或乞養為子女者杖一百知情嫁賣者同罪媒合人減一等財禮入官子女歸宗明會典卷一百四十一
