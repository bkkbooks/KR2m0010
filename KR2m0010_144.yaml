body:
  text: 明㑹典卷一百四十四刑部十九囚人罪名二𢎞治十年定凌遲處死謀反及大逆但共謀者不分首從謀殺祖父母父母及期親尊長外祖父母夫夫之祖父母父母已殺者奴婢及雇工人謀殺家長及家長之期親外祖父母已殺者罪與子孫同妻妾因姦同謀殺死親夫者妻妾謀殺故夫祖父母父母已殺者殺一家非死罪三人及支解人者採生折割人者妻妾故殺夫者弟妹故殺兄姊若姪故殺伯叔父母姑及外孫故殺外祖父母者奴婢毆殺家長者若故殺家長之期親及外祖父母者雇工人故殺家長及家長之期親若外祖父母者斬罪收父祖妾及伯叔母謀反大逆祖父父子孫兄弟及同居之人不分異姓及伯叔父兄弟之子不限籍之同異年十六以上不論篤疾廢疾謀反大逆知情故縱隠藏者謀叛但共謀者不分首從逃避山澤拒敵官兵者盗大祀神祇御用祭器等物及享薦玉帛之屬者盗制書及起馬御寳聖㫖起船符驗者盗乘輿服御物强盗得財者不分首從以藥迷人圖財者罪同强盗不分首從强盗窩主造意分贓者若共謀者行而不分贓及分贓而不行謀殺人因而得財者同强盗不分首從部民謀殺本屬知府知州知縣軍士謀殺本管指揮千户百户吏卒謀殺本部五品以上長官已殺者謀殺緦麻以上尊長已殺者謀殺祖父母父母及期親尊長外祖父母夫之祖父母父母已行者奴婢及雇工人謀殺家長及家長之期親外祖父母已行者若緦麻以上親已殺者罪與子孫同妻妾謀殺故夫之祖父母父母已行者殺一家非死罪三人及支解人為從者採生折割人為從者若已行而未曾傷人者造畜蠱毒殺人及教令者造魘魅符書呪詛殺人者部民毆本屬知府知州知縣軍士毆本管指揮千户百户吏卒毆本部五品以上長官死者毆受業師死者奴婢毆家長死者雇工人毆家長死者妻妾毆夫死者卑㓜毆本宗小功大功兄姊尊屬死者弟妹毆兄姊若姪毆伯叔父母姑及外孫毆外祖父母死者子孫毆祖父母父母及妻妾毆夫之祖父母父母者妻妾毆夫之期親以下尊長死者與夫毆同妻妾毆故夫之祖父母父母者姦小功以上親强者姦從祖祖母姑在室從祖伯叔母從父姊妹母之姊妹及兄弟妻兄弟子妻强者姦父祖妾伯叔母姑姊妹子孫之婦兄弟之女及與和者奴及雇工人姦家長妻女者絞罪兄亡收嫂弟亡收弟婦者謀叛知情故縱隠蔵者若謀而未行為首者逃避山澤不服追喚者部民謀殺本屬知府知州知縣軍士謀殺本管指揮千户百户吏卒謀殺本部五品以上長官已傷者謀殺緦麻以上尊長已傷者奴婢及雇工人謀殺家長之緦麻以上親已傷者罪與子孫同妻妾毆夫至篤疾者卑㓜毆本宗小功大功兄姊尊屬篤疾者弟妹毆兄姊若姪毆伯叔父母姑外孫毆外祖父母刃傷及折肢瞎一目者罵祖父母父母及妻妾罵夫之祖父母父母者妻妾罵故夫之祖父母父母者子孫告祖父母父母妻妾告夫之祖父母父母誣者姦從祖祖母姑在室從祖伯叔母姑從父姊妹母之姊妹及兄弟妻兄弟子之妻及與和者真犯死罪秋後處决斬罪凡官員大臣專擅選用者大臣親戚非奉特㫖除授官職者文官非有大功勲所司䑃朧奏請封公侯爵者當該官吏及受封之人姦邪進䜛言左使殺人者犯罪該死巧言諌免暗邀人心者在朝官員交結朋黨紊亂朝政者刑部及大小各衙門官吏不執法律聽從上司官主使出入人罪者諸衙門官吏及士庶人等上言宰執大臣德政者諸衙門官吏與内官及近侍人員互相交結漏泄事情夤縁作弊扶同奏啓者官吏人等挾詐欺公妄生異議變亂成法者棄毁制書及起馬御寳聖㫖起船符驗各衙門印信及夜廵銅牌者奏事及當該官吏若有規避増减𦂳闗情節䑃朧奏准施行者聞知調兵討襲外畨及收捕反逆賊徒機宻大事漏泄於敵人者近侍官員漏泄機宻重事於人者增减官文書因而失誤軍機者無問故失漏使印信因而失誤軍機者販私鹽拒捕者儀禮司將應朝見官員人等留難不即引見者百工技藝之人應有可言之事亦許奏聞各衙門但有阻當者向太廟太社及宮殿射箭放彈投擲磚石傷人者文武官内官厨子校尉牌面偽造者在京被極刑家屬并經斷人䑃朧充當近侍及宿衛守把皇城京城門禁者當該官司聽囑及受財容令充當者貪取來降人財物因而殺傷人及中途逼勒逃竄者飛報軍情隠匿不速奏聞因而失誤軍機者邉將取索軍器錢糧等物不即奏聞及不依式申報因而失誤軍機者軍器糧草臨敵缺乏及承調遣不依期䇿應告報軍期違限因而失誤軍機者軍臨敵境托故違期三日不至者邊將不固守及守偹不設計因而失陷城寨者與賊臨境望高廵哨之人失於飛報以致陷城損軍者官軍臨陣先退及圍困敵城而逃者軍人私出外境虜掠傷人為首者於已附地靣虜掠者不分首從守禦官致有所部軍人反叛棄城而逃者牧民官激變良民失陷城池者軍器輙棄毁者二十件以上犯夜拒捕及打奪因而毆人致死者境内姦細走透消息於外人及境外姦細入境内探聽事情接引起謀之人將人口軍器出境及下海因而走漏事情者實封公文中途邀截取回者出使馳驛違限因而失誤軍機者調遣軍馬及報軍務軍情文書故不遣使給驛因而失誤軍機者軍需管送違限以致臨敵缺乏失誤軍機者造䜟緯妖書妖言及傳用惑衆者盗各衙門印信及夜廵銅牌者竊盗拒捕及殺傷人者因盗而姦者刼囚者私竊放囚人逃走因而殺人者官司差人追徴錢糧勾攝公事及捕獲罪人聚衆打奪因而殺人及聚至十人為首者白晝搶奪傷人者略誘略賣良人因而殺人者卑幼發尊長墳塜開棺槨見屍者若棄屍賣墳地者毁棄緦麻以上尊長死屍者子孫毁棄祖父母父母及奴婢雇工人棄毁家長死屍者謀殺人造意者奉制命出使而官吏謀殺已殺者因姦同謀殺死親夫者姦夫用毒藥殺人者故殺者餘條以故殺論者依此故用蛇蝎毒蠱咬傷人因而致死者庸醫故違本方詐療疾病取財因而致死及因事故用藥殺人者因姦盗而威逼人致死者皇家袒免以上親而毆死者奉制命出使而官吏毆之至死者吏卒毆本部六品以下長官佐貳官首領官死者首領官及屬官佐貳官毆長官死者官司差人追徴錢粮勾攝公事而毆死者奴婢毆良人死者奴婢毆家長之期親及外祖父母傷者奴婢毆家長之緦麻小功大功親死者雇工人毆家長之期親若外祖父母死者雇工人毆家長之緦麻小功大功親死者妾毆正妻死者毆妻之父母死者卑幼毆本宗緦麻及外姻緦麻小功大功兄姊尊屬死者妻妾毆夫之緦麻尊長至死者毆繼父至死者告謀反叛逆官司不即受理掩捕以致聚衆攻陷城池及刼掠人民者詐為制書及増减者詐傳詔㫖者各衙門當該官吏將奏准合行事理妄稱奉㫖追問者偽造諸衙門印信及厯日符驗夜廵銅牌茶鹽引者偽造寳鈔不分首從及窩主若知情行使者詐假官假與人官者詐稱内使及都督府四輔諌院等官六部監察御史按察司官在外體察事務扇惑人民者近侍之人在外詐稱私行體察事務扇惑人民者姦緦麻親及妻若妻前夫之女及同母異父姊妹强者姦從祖祖姑出嫁從祖姑强者男婦誣執親翁及弟婦誣執夫兄欺姦者姦家長緦麻以上親及妻妾强者放火延燒官民房屋及積聚之物因而盗取財物者放火故燒官民房屋及公廨倉庫係官積聚之物者犯罪拒捕殺人者罪人反獄在逃者故勘平人因而致死者死囚令人自殺子孫為祖父母父母奴婢雇工人為家長者絞罪棄毁官文書事干軍機錢糧者强奪良家妻女姦占為妻妾者配與子孫弟姪家人者背夫逃走因而改嫁者税糧違限一年之上不足提調部糧官吏以私債强奪人妻妾子女因而姦占婦女者師巫假降邪神一應左道亂正之術扇惑人民為首者擅入御膳所及御在所不係宿衛應直合帶兵仗之人但持寸刃入宮殿門内者從車駕行而逃百户以上在宫殿内營造至申時分照數㸃出其不出者至夜持杖入殿門者内使私將兵器入宮殿門内者向太廟及宮殿射箭放彈投甎石者越皇城者皇城門非時擅開閉者文武官内官厨子校尉牌靣詐帶朝恭及在外詐稱官員名號有所求為者私役軍人出境因而致死者或被賊拘執至三名者官軍征討私逃再犯軍人在逃三犯犯夜拒捕及打奪因而毆人至折傷以上者越度沿邉關塞因而出外境者將人口軍器出境及下海者盗各衙門官文書事干軍機錢糧者私盗放囚人逃走因而傷人者官司差人追徵錢糧勾攝公事及捕獲罪人聚衆打奪因而傷人者及聚至十人下手致命者竊盗三犯掏摸罪同略誘略賣良人因而傷人者發塜開棺槨見屍者子孫於祖父母父母奴婢雇工人於家長墳墓因熏狐狸燒屍者謀殺人從而加功者若傷而不死造意者奉制命出使而官吏謀殺已傷者姦夫自殺其夫姦婦雖不知情鬬毆殺人者餘條以鬪毆論者依此同謀共毆人因而致死下手者以他物置人耳鼻并孔竅中及屏去人服食至死者威逼期親尊長致死者皇家袒免以上親而毆之篤疾者奉制命出使而官吏毆之及部民毆本屬知府知州知縣軍士毆本管指揮千户百户吏卒毆本部五品以上長官折傷者若毆六品以下長官佐貳官首領官篤疾者首領官及屬官佐貳官毆長官篤疾者官司差人追徵錢糧勾攝公事而毆至篤疾者以威力制縛人及私家拷打監禁因而致死者奴婢毆良人至篤疾者良人毆他人奴婢若死及故殺者故殺緦麻小功親奴婢者毆緦麻小功大功親雇工人至死及故殺者奴婢過失殺家長者若毆家長之期親及外祖父母者雇工人毆家長及家長之期親若外祖父母折傷者家長及家長之期親外祖父母故殺雇工人者妾毆正妻至篤疾者夫毆妻至死者毆妻之父母至篤疾者卑幼毆本宗緦麻及外姻緦麻小功大功兄姊尊屬至篤疾者尊長毆卑㓜緦麻小功大功至死者故殺同堂弟妹堂姪及姪孫者嫡繼慈養母殺子孫致令絶嗣者妻毆卑屬至死者故殺夫之兄弟子者尊長毆卑幼之婦妾至死者毆妻前夫之子至死者奴婢罵家長者投匿名文書告言人罪者誣告人因而致死隨行有服親屬一人者詐偽制書及増减未施行者詐偽將軍總兵官五府六部都察院都指揮使司内外各衛指揮使司守禦千户所文書套畫押字盗用印信及空紙用印者詐傳皇后懿㫖皇太子親王令㫖者私鑄銅錢者强姦者姦從祖祖姑出嫁從祖姑者姦親屬妾强者奴及雇工人姦家長之期親若妻者失火延燒宗廟及宮闕者犯罪拒捕毆人至折傷以上者官吏懐挾私讎故禁平人因而致死者獄卒凌虐罪囚尅减衣糧因而致死者獄卒以金刃及他物與囚致囚反獄及殺人者雜犯死罪斬罪内府承運庫交割餘剰之物䑃朧擅將出外者稱訴寃枉借用印信封皮入逓借者及借與者盗内府財物者監守自盗倉庫錢糧等物不分首從併贓論罪四十貫餘條以監守自盗論者依此絞罪軍官犯罪不請㫖上議當該官吏車駕行處軍民衝入儀仗内者衝入儀仗内訴事不實者在京守禦官軍逓送逃軍妻女出京城者常人盗倉庫錢糧等物不分首從併贓論罪八十貫餘條以常人盗官物論者依此塜先穿陷及未殯埋開棺槨見屍者官吏受財枉法有禄人八十貫無禄人一百二十貫餘條以枉法論者依此明㑹典卷一百四十四
