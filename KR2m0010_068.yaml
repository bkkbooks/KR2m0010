body:
  text: 明會典卷六十八禮部二十七婚禮四公主婚禮諸司職掌册公主前期告奉先殿用祝帛豬羊行禮如常儀册文維洪武某年嵗次某某月某日皇帝制曰古之君天下者有女必封爾長次女今已成人未有封號特以某郡為爾之號配某官某之子彼為駙馬爾為公主既入某官之門恪遵婦道以奉舅姑閨門整肅內助長佳毋纍父母生身之恩爾惟敬哉謁廟受册次日引禮引公主謁奉先殿用香燭駙馬受誥其日駙馬受誥如常儀誥文夫婦之道人之大倫婚姻以時禮之所重帝女下嫁必擇勳舊為姻此古今通義也朕今命爾為駙馬都尉當堅夫道毋寵毋慢永肅其家以稱親親之意恪遵朕言勿怠公主受醮戒其日早公主具禮服辭奉先殿申時內官陳設儀仗于正宫內丹陛之東西大樂陳于丹墀執事女官備金爵酒壺果合以俟內贊女官二員于殿之東西皇帝常服皇后燕居服升座公主具禮服引禮女官引公主詣皇帝前贊拜樂作四拜樂止贊跪贊受爵女官以爵斟酒立授公主公主受酒飲訖以爵授執事者執事者跪受虛爵退復位贊恭聽戒命隨旨意訓戒公主聽受訖贊興贊復位贊拜樂作四拜興樂止引禮女官又引公主詣皇后前贊拜樂作四拜興樂止贊跪贊受爵執事女官斟酒立授公主公主受酒飲訖以爵授執事者跪受虛爵以退贊恭聽戒命隨旨意訓戒公主聽受訖贊興贊復位贊拜樂作四拜興樂止禮畢公主换燕居冠服命婦送至宫門引禮引公主由宫門東門出過宫門西上升輦至右門內公主降輦駙馬揭簾公主升轎內使備儀仗鼓樂前導合女樂三十六人接引至府公侯百官命婦送至府各回家駙馬受醮戒其日早駙馬父與駙馬具家用祭服告祠堂畢至午後駙馬父坐于正堂駙馬具見尊長服引禮引駙馬至拜位贊鞠躬兩拜興平身贊跪贊搢笏贊受爵執事者斟酒授駙馬駙馬受酒飲訖以爵授執事者贊聽訓戒駙馬父隨意致戒辭駙馬聽訖贊出笏俯伏興贊復位贊鞠躬兩拜興平身禮畢駙馬便服上馬行親迎禮若駙馬父母俱存則父母同坐于正堂行禮如前儀親迎其日駙馬受醮戒訖具儀從鼓樂前導至午門西下馬至朝房具朝服候申時序班二人具服引駙馬由午門西角門入至右紅門內官二員具服接引駙馬至內使監前候報公主醮戒將畢引駙馬至右門西東向立公主至駙馬揭簾公主升轎駙馬先由午門西角門出至上馬處上馬先至府候公主至揭簾公主降轎同謁祠堂謁祠堂執事者先於祠堂設祭物畢引禮女使引駙馬及公主至祠堂拜位駙馬立于東公主立于西贊禮贊鞠躬拜駙馬公主皆兩拜引禮引駙馬詣高祖考妣神位前公主仍立於拜位贊跪駙馬跪公主亦跪贊搢笏駙馬搢笏贊進爵執事者以爵跪進于駙馬右贊受爵駙馬受爵以授執事者贊獻爵執事者以爵奠于高祖考神位前贊冉進爵執事者以爵進贊受爵駙馬受爵以授執事者贊獻爵執事者以爵奠于高祖妣神位前贊出笏俯伏興公主亦興引禮又引駙馬詣曽祖考妣祖考妣各神位前如前儀訖贊詣讀祝位駙馬至讀祝位贊跪駙馬跪公主亦跪讀祝訖俯伏興公主亦興贊復拜位贊拜駙馬公主俱兩拜禮畢導還府行合巹禮合巹其日女使陳設駙馬座于室東西向公主座于室西東向各設拜位于座之南設酒案于室中稍南置兩盞兩巹即葫蘆盞于案上饌案二于室中贊引二人導駙馬二人導公主就拜位贊兩拜駙馬公主相向皆兩拜請就位駙馬公主各就位執事者奉饌案置于駙馬公主前執事者二人以二盞斟酒以進駙馬公主皆飲酒執執事者進饌駙馬公主皆舉筯執事者冉斟酒駙馬公主皆飲酒執事者冉進饌駙馬公主皆舉筯執事者以兩巹盞斟酒合和以進駙馬公主皆飲訖執事者又進饌駙馬公主皆舉筯執事者徹饌案贊駙馬公主興就拜位駙馬公主相向皆兩拜禮畢見舅姑一公主見舅姑舅姑坐于東西向公主立于西東向行四拜禮舅姑答兩拜賜駙馬冠帶衣服紗帽一金帶一後以玉帶紵絲羅衣各一襲斜皮靴一雙鞍馬二明會典卷六十八
