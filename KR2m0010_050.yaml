body:
  text: 明會典卷五十禮部九經筵國初經筵無定日或令文學侍從之臣講説亦無定所正統初始著為儀纍朝因之經筵初開儀凡經筵初開敕勳臣一人知經筵事內閣學士或知或同知經筵事六部尚書左右都御史通政使大理寺卿及學士等官侍班翰林院春坊等官及國子監祭酒二員進講翰林春坊等官二員展書給事中御史各二員侍儀鴻臚寺錦衣衛堂上官各一員供事又鳴贊一員贊禮序班四員舉案侯伯一人領將軍先期直殿內官于文華殿設御座又設御案于殿內御座之東稍南設講案于御案之南稍東是日早司禮監官先陳所講四書經史各一册置御案又各一册置講案皆四書東經史西先期講官撰四書經或史講章各一篇預置于册內是日早上御奉天門早朝畢退御文華殿升御座將軍侍衛如儀鴻臚寺官引知經筵及侍班講讀執事侍儀等官于丹陛上行五拜三叩頭禮畢以次上殿依品級東西序立知經筵官序于侍班官上侍儀御史給事中各二員于殿內之南分東西北向立序班二員舉御案置御座前二員舉講案置御案之南正中鴻臚寺官贊進講講官一員從東班出一員從西班出詣講案前稍南北向並立鴻臚寺官贊鞠躬拜叩頭興平身畢展書官一員從東班出進詣御案前跪展四書畢起退立于御案之東稍南講官一員進至講案前立奏講某書講畢稍退展書官復詣御案前跪掩四書畢退就東班又展書官一員從西班出進詣御案前跪展經畢起退立于御案之西稍南講官一員進至講案前立奏講某經或某史畢少退仍並立展書官復詣御案前跪掩書畢退就西班鴻臚寺贊講官鞠躬拜叩頭興平身禮畢各退就東西班序班二員舉御案二員舉講案退置原所鴻臚寺官贊禮畢命賜宴鴻臚寺官及各官皆跪承旨光祿寺官設宴于左順門宴畢叩頭出月講常儀每月初二十二二十二日會講先期司禮監官陳設書籍御案如前儀至期候上御文華殿侍衛侍儀執事進講賜宴禮同但各官止行叩頭禮日講常儀凡日講止用講讀官內閣學士侍班不用侍衛侍儀執事等官侍班講讀等官入見行叩頭禮東西分立先讀四書次讀經或讀史每本讀十數遍後講官先講四書次講經或講史務在直説大義明白易曉講讀後侍書官侍上習書畢各官叩頭退東宫出閣講學天順二年定初出閣儀是日早侍衛侍儀如常儀執事等官于文華後殿行四拜禮畢鴻臚寺官請皇太子升文華殿執事官導引至殿升座師保等官于丹陛上行四拜禮畢各官退出內侍官導皇太子至後殿升座以書案進每日侍班侍讀講官入分班東西立內侍展書侍讀講官以次進讀叩頭而退每日講讀儀一每日早朝退後皇太子出閣升座內侍以書案進不用侍衛侍儀執事等官惟侍班侍讀講官入行叩頭禮畢分班東西向立內侍展書先讀四書則東班侍讀官向前伴讀十數遍退復原班次讀經書或讀史書則西班侍讀官向前伴讀亦如之務要字音正當句讀分明讀畢各官退一每日已時侍班侍讀侍講及侍書官俟皇太子升座畢入東西向立侍班內侍展書先講早所讀四書則東班侍講官進講一遍退復原班次講早所讀經史書則西班侍講官進講亦然務要直言解説明白易曉講畢內侍收書訖侍書官向前侍習寫字務要開説筆法點畫端楷寫畢各官叩頭而退一午膳後從容逰息或習騎射一每日晚讀本日所授書各數遍至熟而止一凡讀書三日後一溫須背誦成熟遇溫書日免授新書講官通講須曉大義一凡寫字春夏秋月每日寫一百字冬月每日寫五十字一凡遇朔望節假及大風雨雪隆寒盛暑暫停講讀寫字諸王讀書儀天順二年定一初入書堂其日早王至右順門之北書堂面東中坐提督講讀并講讀官行四拜禮畢內官捧書展于案上就案左立講讀官進立于案右伴讀十遍叩頭退一每日講讀清晨王至書堂講讀官行叩頭禮伴讀十遍出飯後復詣書堂伴讀看寫字畢講書直説大意畢仍叩頭退內侍以所寫字送內閣點看明會典卷五十
