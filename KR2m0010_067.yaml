body:
  text: 明㑹典卷六十七禮部二十六婚禮二洪武二十七年更定凡親王納妃預擇親迎日期别擇日行定親納徴發冊催粧等禮其禮物仍依節次名數同日給送納徴發冊催粧前期一日內官監禮部儀禮司設冠服首飾金銀假匹等儀物于文樓下設玉帛案冊案并節于奉天殿內至日早禮部設綵輿教坊司設樂于午門外內官設王妃鳯轎儀仗于綵輿之南皇帝具皮辨服升殿百官侍班正副使先行四拜禮執事官舉節及玉帛案冊案至丹墀置案于中道持節俟立傳制官宣制曰今聘某官某女為某王妃令卿等行納徴發冊等禮正副使又四拜禮畢執事官以節授正使引禮引節并玉帛案冊案冠服等物至午門外置冊及玉帛於綵輿冠服等物以次陳列而行妃家受聘前期一日妃家設香案節案于正堂中玉帛案冊案左右相向至日禮物至妃家主婚者出迎引禮引正使持節副使捧冊執事者捧玉帛至正堂各置于案正副使立于案左右冠服等物以次陳列禮官一員立於左主婚者立於右禮官曰奉制命正使某官某副使某官某為某王行納徴發冊等禮引禮引主婚者詣香案前行四拜禮執事官捧玉圭𤣥纁主婚者先受玉圭次受𤣥纁各授執事再行四拜禮畢內官先以冠服進于妃具服訖內官詣冊案跪捧冊入中堂置于案引禮女官引妃出至冊案前行四拜禮跪女官宣冊訖妃受冊以授執事者冉行四拜禮畢執事者設妃座引禮請妃升座妃家應賀者行四拜禮正副使俟內官出告行禮畢持節出主婚者送至門外正副使回朝復命妃家回奉禮物從午門入內官監官奏聞醮戒其日皇帝具皮辨服執膳內官備金爵酒果王具冕服行四拜禮執事者斟酒立授王王跪飲聽戒命訖冉行四拜禮復詣皇后前禮同親迎前一日妃家令親人鋪房至日王親迎儀衛司先設王儀仗教坊司設樂于長安門外妃家先設王幕次于中門之外香案帛案于中堂是日王受戒命訖具皮辨服升輦至妃家幕次禮官先入正㕔立于東主婚者立于西禮官曰某王奉制行親迎禮主婚者詣幕次迎王王前行主婚者後隨至中堂內官捧禮物入中堂主婚者立於左妃母立於右女執事二人引妃出立于妃母之下內官以帛進王王受帛置于案王立于案左贊禮引主婚者詣帛案前行八拜禮畢引禮內官引王先出中門外詣妃轎所揭簾妃升轎王升輦前行妃具儀從後行王至長安門外降輦候妃至揭簾妃降轎王先行至內釋皮辨服具衮冕與妃詣奉先殿行禮廟見是日內官先于奉先殿陳設牲醴祝帛訖引禮引王與妃詣四廟帝后神御前行四拜禮獻帛獻爵讀祝訖又行四拜禮畢還宫合巹其日內官先於王宫設王座妃座東西相向各設拜位于座之南王具皮辨服妃服鞠衣行拜禮王再拜妃俠拜執事者設酒案于正中饌案于左右置兩爵兩巹于酒案王與妃升座執事者舉饌案進于王及妃之前女官以爵進酒王與妃飲訖進饌饌訖再進酒饌如前儀又以巹盞斟酒進皆飲訖進饌皆饌訖徹案王從者餕妃之饌妃從者餕王之饌朝見次日早王具冕服妃具霞帔禙子皇帝服皮辨服引禮引王與妃詣御前宫人以棗栗盤立于王妃之右王與妃各行四拜禮執事二人舉案妃隨捧進至御前王與妃又行四拜禮復詣皇后前獻服修如前儀禮畢賜王與妃宴回門其日內官先以禮物至妃家王與妃導從如常儀王先至妃家妃父出迎至正㕔王于妃父母前行四拜禮妃父母立受兩拜答兩拜王至中堂坐其餘親屬見王行四拜禮妃至入中堂於父母前行四拜禮其餘親屬於妃前行家人禮𢎞治中續增醮戒等儀其納徴日上先具衮冕詣奉先殿用樂祭告禮畢然後易皮辨服𫝊制其醮戒儀是日內執事設太皇太后皇太后御座于宫中設大樂儀仗于丹陛之東西執膳內官先備酒金爵果合以俟太皇太后具燕居服樂作升座樂止王服衮冕贊引引王由東門入詣太皇太后前贊鞠躬樂作贊四拜興平身樂止執事者以爵斟酒立于東贊禮贊王詣前跪贊搢圭贊受爵執事者以爵立授王王受爵飲訖以爵授執事者執事者跪受以退贊出圭恭聽戒命往迎爾相用成厥家勉率以敬為國之光王聽戒辭訖贊俯伏興平身贊復位贊鞠恭樂作贊四拜興平身樂止贊禮畢贊禮引王詣皇太后宫門外由東門入詣皇太后前贊鞠躬樂作贊四拜興平身樂止執事者以爵斟酒立于東贊禮贊王詣前跪贊搢圭贊受爵執事者以爵立授王王受爵飲訖以爵授執事者執事者跪受以退贊禮贊出圭恭聽戒命往迎爾相承厥家事勉率以敬無忝戒命王聽訖贊俯伏興平身贊復位贊鞠躬樂作贊四拜興平身樂止贊禮畢贊禮引王詣上位宫門外候上具常服皇后具燕居服升座贊禮引王詣上位前行五拜三叩頭禮畢引王出釋衮冕具皮辨服行親迎禮其妃受醮戒儀親迎日妃家先于祠堂陳設祭物妃服燕居冠服妃父母同妃詣祖宗前行禮奠酒讀祝禮畢執事者具酒饌于內進妃飲食訖父母坐于正堂女執事引妃詣父母前各四拜父母隨意致戒辭妃聽受訖次詣諸尊長行禮畢改服翟衣以俟親迎其朝見儀第二日清辰王冕服妃翟衣贊引各啓請出宫至皇城內宫門外以俟太皇太后燕居服升座贊引引王及妃自東門入王先入妃從之贊禮贊引詣太皇太后前王立于東妃立于西宫人以腵修盤立于妃之左贊王與妃皆四拜執事二人舉案至太皇太后前宫人以腵修盤授妃妃捧腵修盤置于案執事者舉案妃隨案進至太皇太后前妃復位贊王與妃皆四拜興執事者徹腵修盤案于東贊禮畢引王與妃出詣皇太后宫前俟皇太后燕居服升座引禮引王及妃自東門入詣皇太后前進腵修盤行禮同前畢出詣上位宫前俟上具常服升座贊引引王及妃自東門詣上位前進棗栗盤皇后前進腵修盤行禮同前畢贊引引王及妃出是日賜王與妃宴王與妃見東宫是日王與妃朝見訖王具皮辨服妃服翟衣詣東宫前行四拜禮東宫皮辨服坐受其盥饋儀第三日清晨妃服翟衣贊引引妃出升輿將至宫內門降輿由東門入俟膳至贊引引妃詣太皇太后前贊四拜尚食以膳授妃妃捧膳置于案復位又贊四拜贊引引妃退立于西南俟膳畢引妃出詣皇太后前行禮同復詣上位前皇后前行禮同明㑹典卷六十七
