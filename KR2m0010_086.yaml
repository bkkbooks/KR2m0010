body:
  text: 明㑹典卷八十六禮部四十五祭祀七合祀神祇二諸司職掌一天下府州縣合祭風雲雷雨山川社稷城隍孔子及無祀鬼神等有司務要每歲依期致祭其壇墠廟宇制度牲醴祭器體式具載洪武禮制洪武禮制祭祀儀式社稷府州縣同壇制東西二丈五尺南北二丈五尺髙三尺俱用營造尺四出陛各三級壇下前十二又或九丈五尺東西南各五丈繚以周墻四門紅油北門入石主長二尺五寸方一尺埋於壇南正中去壇二尺五寸止露圓尖餘埋土中神號各布政司寓治之所雖係布政司官致祭亦合稱府社府稷府稱府社之神府稷之神州稱州社之神州稷之神縣稱縣社之神縣稷之神神牌二以木為之硃漆青字身髙二尺二寸闊四寸五分厚九分座髙四寸五分闊八寸五分厚四寸五分臨祭設于壇上以矮卓盛祭畢藏之房屋神厨三間用過梁通連深二丈四尺中一間闊一丈五尺九寸傍兩間每一間闊一丈二尺五寸鍋五口每口二尺五寸庫房間架與神厨同內用壁不通連宰牲房三間深二丈二尺五寸三間通連中一間闊一丈七尺五寸九分傍二間各闊一丈于中一間正中鑿宰牲小池長七尺深二尺闊三尺磚砌四面安頓木案于上宰牲血水聚于池內祭畢擔去仍用蓋房門用鎖宰牲房前舊有小池者仍舊制不必更改無者不必鑿池止於井內取水滌牲桶四隻寬大可以容牲祝板以木為之白紙寫文帖其上祭畢焚之祝文維洪武年歲次某月朔日某官某等敢昭告于某社之神某稷之神曰品物資生蒸民乃粒飬育之功司土是賴維茲仲春秋禮宜告報祀謹以牲帛醴齊粢盛庶品式陳明薦尚享祭器牲匣四以木為之硃漆底蓋各髙六寸長二尺三寸闊二尺二寸蓋兩頭用銅環二箇底兩傍用銅環四箇案卓神牌案二髙一尺一寸闊一尺九寸長三尺三寸籩豆簠簋案四髙一尺一寸闊一尺九寸長二尺三寸牲匣案四髙六寸闊二尺四寸長三尺五寸祝案一髙一尺一寸闊一尺九寸長三尺三寸酒尊案一髙二尺七寸五分闊一尺五寸長五尺卓面剜三孔仍用木板一片橫裝於剜孔之下以盛酒尊爵帛案一髙二尺七寸五分闊二尺三寸長三寸籩豆簠簋俱用瓷楪簠簋楪稍大酒尊三用瓷尊每尊用蓋布巾一酌酒杓一爵六用瓷爵鉶一用瓷碗香爐二設于壇之左右盥洗尊一用瓷甕酌水杓一盆一錫銅瓷隨用帨布一案一髙二尺七寸五分闊二尺三寸長三尺祭物羊一豕一帛一黑色長一丈八尺鉶一盛和羔籩四棗栗鹽藁魚豆四韭𦵔醢猪肉鮮菁𦵔鹿醢或用麂兔簠二黍稷簋二稻梁祭期每歲仲春仲秋上戊日獻官各布政司及府州縣凡遇祭祀隨處但長官一員行三獻禮餘官止陪祭武官並不預祭儀注齊戒正祭前三日獻官并陪祭官執事人等沐浴更衣散齊二日各宿别室致齊一日同宿祭所散齊仍理事務惟不飲酒不食䓤韭蒜薤不弔喪問疾不聽樂不行刑不判署刑殺文字不預穢惡事致齊惟理祭事省牲正祭前一日執事者設香案于宰牲房外贊引引獻官常服詣省牲所贊省牲執事者牽牲從香案前過贊引贊省牲畢遂烹牲以毛血少許盛于盤其餘毛血以净器盛貯祭畢埋之其牲須要連皮者熟供祭陳設前期執事掃除壇之上下并設獻官幕次于中門外執事者依圖式陳設正祭其日清晨執事者各實籩豆酒尊等器并滌爵臨祭獻官免滌獻官具祭服簽祝板于幕次執事者置祝于案置帛于篚取毛血盤置神位前牲案下將行禮執事者以牲匣盛牲置于案未啓蓋通贊唱執事者各就位唱陪祭官各就位唱獻官就位贊引引獻官入就位通贊唱瘞毛血執事者以毛血瘞于坎遂啓牲匣蓋迎神通贊唱迎神鞠躬拜興拜興拜興拜興平身獻官陪祭皆四拜興平身奠帛行初獻禮通贊唱奠帛行初獻禮捧帛者捧帛執爵者執爵以俟贊禮唱詣盥洗所引禮引獻官至盥洗所贊搢笏執事酌水進巾獻官盥手帨手訖盥手帨手不贊贊出笏獻官出笏贊詣酒尊所贊司尊者舉羃酌酒執事者各以爵受酒贊詣某社神位前引獻官詣神位前贊跪搢笏獻官跪搢笏捧帛者跪進于獻官之右獻官受帛獻帛以帛授執事者奠于案執爵者進于獻官之右獻官受爵贊獻爵獻官獻爵以爵授執事者奠于神位前凡進帛進爵皆在獻官之右奠帛奠爵左皆在獻官之贊出笏獻官出笏贊俯伏興平身獻官俯伏興平身贊詣某稷神位前同上儀贊詣讀祝位獻官詣讀祝位贊跪獻官跪贊讀祝讀祝者取祝跪讀于獻官之左畢興置祝于案贊俯伏興平身獻官俯伏興平身贊復位獻官復位亞獻通贊唱行亞獻禮贊引引獻官詣酒尊所贊司尊者舉羃酌酒執事者各以爵受酒贊詣某社神位前引獻官詣神位前贊跪搢笏獻官跪搢笏執爵者跪進于獻官之右獻官受爵贊獻爵獻官獻爵以爵授執事者奠于神位前贊出笏獻官出笏贊俯伏興平身贊詣某稷神位前同上儀贊俯伏興平身獻官俯伏興平身贊復位獻官復位終獻同亞獻儀飲福受胙通贊唱飲福受胙執事者設飲福位于壇之中稍北執事者先於社神前取羊一腳置于盤執事者于酒尊所酌酒一爵立俟于飲福位之右贊引獻官詣飲福位贊跪搢笏獻官跪搢笏執事者以爵跪進于獻官之右獻官受爵贊飲福酒獻官飲訖以虛爵授執事者執事者跪受爵于獻官之左以退贊受胙執事者以胙跪進于獻官之右獻官受胙以胙授執事者執事者跪受于獻官之左捧由中道出贊出笏獻官出笏贊俯伏興平身獻官俯伏興平身贊復位通贊兩拜獻官陪祭官皆兩拜徹饌通贊唱徹饌執事者各詣神位前以籩豆稍移動送神通贊唱送神贊鞠躬拜興拜興拜興拜興平身獻官陪祭官皆四拜興平身望瘞通贊唱讀祝官捧祝進帛官捧帛各詣瘞所獻官陪祭官移身分東西立俟捧帛祝者由中道過獻官拜位通贊唱望瘞贊引贊詣望瘞位引獻官至望瘞位執事者以祝帛焚于坎中將畢以土實坎贊引通贊同唱禮畢風雲雷雨山川城隍之神凡各布政司府州縣春秋仲月上旬擇日同壇祭設三神位風雲雷雨居中山川居左城隍居右若府州縣則稱某府某州某縣境內山川之神某府某州某縣城隍之神風雲雷雨帛四山川帛二城隍帛一俱白色附郭府州縣官止隨班行禮不必别祭其祭物祭器獻官及齊戒省牲陳設正祭迎神並與社稷禮同但臨祭時執事者先以毛血瘞于坎通贊不唱瘞毛血奠帛初獻先詣風雲雷雨神位前次詣山川神位前次詣城隍神位前次詣讀祝所亞獻終獻同初獻不唱奠帛讀祝飲福受胙其胙于風雲雷雨神位前取羊一腳徹饌送神望燎亦同社稷儀但改瘞字為燎字祝文維洪武年月日某官某等敢昭告于風雲雷雨之神某府州縣境內山川之神某府州縣城隍之神曰惟神妙用神機生育萬物奠我民居足我民食某等欽承上命職守方面布政司用黍職茲土府州縣用今當仲春秋謹具牲醴庶品用仲常祭尚享嶽鎮海瀆帝王陵廟凡五嶽五鎮四海四瀆及帝王陵廟已有取勘定擬致祭去處所在官司以春秋仲月上旬擇日致祭近布政司者布政司官致祭近府州縣者府州縣官致祭各用帛一五嶽五鎮四海各隨方色四瀆用黑色帝王陵廟用白色其牲物祭器儀注並與社稷同但獻官奠爵訖就讀祝惟瘞毛血惟燎與祭風雲雷雨等神同其四海四瀆祝帛俱沉水中毛血仍瘞之祝文五嶽如東嶽則稱曰東嶽泰山之神西嶽華山南嶽衡山北嶽恆山中嶽嵩山皆倣此惟神靈峙方嶽鍾秀厚祇主司生民其功允大時維仲春秋謹具牲醴庶品用伸常祭尚享五鎮如東鎮則稱東鎮沂山之神南鎮㑹稽西鎮吳山北鎮醫巫閭中鎮霍山皆倣此惟神鍾秀崇髙一方巨鎮封表有年功著民社時維仲春秋謹具牲醴庶品用伸常祭尚享四海如東海則稱東海之神西海南海北海皆倣此惟神靈鍾坎德萬水所宗功利深廣溥濟斯民時維仲春秋謹具牲醴庶品用伸常祭尚享四瀆如淮瀆則稱東瀆大淮之神西瀆大河南瀆大江北瀆大濟皆倣此惟神鍾德靈長發源成溪潤澤所加溥利民物時維仲春秋謹具牲醴庶品用伸常祭尚享事例洪武元年命中書省令郡縣訪求應祀神祇名山大川聖帝明王忠臣烈士凡有功於國家及惠愛在民者具實以聞著於祀典令有司歲時致祭二年令祀典神祇有司依時致祭其不在祀典而嘗有功德于民事蹟昭著者雖不致祭其祠宇禁人毁撤六年定天下十二省山川皆各省自祭舊合祭京師及四夷山川悉罷之各城隍之神祭日春用三月三日秋用九月九日七年本部奏定天下府州縣社稷之祭正配位各用羊一豕一令本部頒祭嶽鎮海瀆儀于所在有司其祭各用羊一豕一帛一隨其方色籩豆簠簋皆四鉶一爵三尊三祭期春二月秋八月上旬擇日九年令在外百司祭祀初獻亞獻終獻宜以品級尊卑為序十一年令在外府州縣祭祀典神祇中祀俱用幣小祀只用牲醴十四年令在外祭山川等神以文職長官一員行禮武官不預如軍民指揮使司則從本司行之二十九年令在外未入流官陪祭俱用祭服宣德八年定新官到任以羊豕各一總祀應祀神祇于城隍廟正統二年令應天府建社稷壇春秋祈報以守臣行事明㑹典卷八十六
