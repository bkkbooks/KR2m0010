body:
  text: 明㑹典卷一百七十五尚寶司國初設符璽郎正七品後置尚寶司正三品衙門設卿少卿丞職專寶璽符牌等事洪武元年改正五品衙門御寶奉天之寶皇帝之寶皇帝行寶皇帝信寶天子之寶天子行寶天子信寶制誥之寶𠡠命之寶廣運之寶御前之寶皇帝尊親之寶皇帝親親之寶敬天勤民之寶事例凡誥𠡠等項寫完合用某寶本司官㑹尚寶監官於奉天門用後俱同凡諸王將軍并文武官員誥𠡠寫完本司官於御前奏請寶用凡各衙門勘合用盡預編完某字號勘合并底簿用寶訖勘合本司收貯底簿付尚寶監官繳進凡吏部選過文職貼黃三年一次底簿每年一次本司奏請用寶凡兵部每年選過武職貼黃又每三年清理武職大小貼黃簿本司奏請用寶凡用御寶俱預編某字號勘合一百道底簿一扇用盡再編其勘合本司收貯底簿付尚寶監繳進凡遇慶賀大禮先期一日本司官於御前奏請寶捧是日設寶案於華蓋殿至期官二員各捧寶於御前分行至奉天殿東西相向立上升座西立者過東各置寶於案禮畢仍捧寶分行至華蓋殿置案上而出凡每嵗駕詣郊壇行大祀禮本司官例於承天門外乘馬從寶後行禮畢仍從寶而回凡寶色合用銀硃奏行工部轉行順天府支給官錢買辦其油蜜熟艾白芨皂莢等物俱於各該衙門關用凡每年終本司奏行欽天監擇日洗寶至期尚寶監官關香物入水捧寶於奉天門洗淨入匣凡每年終本司具本年用過寶總數於御前奏進凡大祀天地社稷享太廟并看牲視學耕藉田公侯伯勳衛錦衣衛并金吾等二十衛官扈駕巡綽各赴本司領金牌懸帶凡每日五府都督一員及帶刀千百户一員夜巡內皇城㸃閘鋪軍各赴本司領金牌并申字十七號令牌一面凡每三日金吾等二十衛各輪官四員計每班四十員領金牌隨朝巡綽畢仍赴司㸃閘凡侯伯駙馬一員專管府軍前衛帶刀官二十員每日上直又侯伯一員專管圍子手將軍每夜上宿又中軍都督府都督一員專管大旗下五軍官員將軍六百二十五人又都督一員專管勇士又都指揮一員專管傳令義刀手又侯伯駙馬一員專管大漢將軍又錦衣衛當駕官指揮一員千户二員百户十員三日輪班上直各赴本司關領金牌其金牌之制面上鑄仁義禮智信五字號下鑄守衛二篆字背鑄凡守衛官軍懸帶此牌等二十四字仁字一號至四十號上俱龍形公侯駙馬伯領義字一號至五十號俱虎形指揮勳衛領禮字一號至一百五十三號俱麒麟形千户領智字一號至三百三十號俱獅子形百户領信字一號至一千六十九號俱祥雲形將軍領凡金吾等二十衛守衛官夜巡各赴本司關領令牌午門指揮二員千户一員領申字一號至四號四面長安左右門各指揮二員千户一員東華門指揮一員千戶一員領申字五號至八號四面西華門指揮一員千户一員領申字九號至十二號四面𤣥武門指揮一員千户一員領申字十三號至十六號四面凡留守五衛巡城官并金吾等二十衛守衛官各赴本司關領銅符留守五衛指揮領承字東字西字北字號四面其字號俱左半字金吾等二十衛端門承天門指揮二員千户一員領承字號一面東安門指揮一員千户一員領東字號一面西安門指揮一員千户一員領西字號一面北安門指揮一員千户一員領北字號一面其字號俱右半字已上俱與留守衛比對銅符字號相同方許㸃閘凡皇城九門守衛軍與圍子手各領勇字號銅牌計二萬五十五面凡五城兵馬指揮司夜巡每日一城輪官一員赴本司關領令牌東城兵馬指揮司領木字一號二號二面西城兵馬指揮司領金字一號二號二面中城兵馬指揮司領土字一號二號二面南城兵馬指揮司領火字一號二號二面北城兵馬指揮司領水字一號二號二面凡大祀天地享太廟祭社稷山川等神陪祀供事官及執事人等入壇俱赴本司關領牙牌圓花牌陪字一號至三百五十號陪祀官領長花牌供字一號至三百八十號供事官領長素牌執字一號至一千四百七十號執事人領凡錦衣衛校尉上直俱赴本司領嚴字號雙魚銅牌凡光祿寺吏典厨役遇大祀該班者俱赴本司領善字號雙魚銅牌凡東駕侍衛官員將軍該侍衛日俱赴本司領牌凡文武朝參官并錦衣衛當駕官尚膳監辦膳官騰驤武驤四衛養馬官所領牙牌每年終各衙門造冊送本司查理文武官牙牌字號公侯伯勳字號駙馬都尉親字號文官文字號武官武字號樂官樂字號凡親王之國及鎮守巡撫等官奏請符驗俱從本司關領如在外鎮守等官事故去者則付所在官司收貯候更代者就彼付領每年終各處具由奏報查考符驗之制上織船馬之狀起馬者用馬字號起船者水字號起雙馬者達字號起單馬者通字號起站船者信字號凡監察御史出差巡按清軍巡鹽巡茶巡倉巡河巡捕盤糧勘事等項俱赴本司領印如本道印領盡奏過方許借領别道印其南京御史從都察院差者許在京對道御史代領俱事畢繳還凡官員人等領符牌等項俱用本衙門印信手本及赴司畫字方許領出其宿直侍衛等項有違悮者本司參奏凡金牌青絲絛嵗例該造一千條與嵗造黃絨寶絛及紅錦俱行工部辦用凡寶鈔提舉司奏造鈔牌本司官同户部官并給事中及各監官鑄造其令牌牙牌有損壞不堪懸帶者行印綬監改造凡本司官員并監生每日酒飯俱於光祿寺支給凡本司官員俸糧俱於通政司帶支南京尚寶司事例凡符牌等項南京官軍人等隨駕至行在給與懸帶南京兵部因移文南京工部改造木牌其制俱與銅牌同轉送本司給與守衛夜巡并㸃閘官軍其後凡有失落損壞成造如前今長木牌計一百一面飛字一號起五面效字三號一面橫字五號一面辰字一號起五面棠字三號一面沛字四號一面慎字五號一面曰字三號四號二面恥字四號一面爵字一號一面滅字一號起四面圖字一號一面潔字四號一面玖字三號五號二面手字一號一面楚字二號二面拜字二號四面仕字三號一面雕字一號起五面荒字五號一面近字一號一面兹字一號一面賤字一號一面求字二號一面得字三號一面暑字四號一面禪字四號五號二面藁字四號一面甲字一號起五面多字二號五號二面落字三號四號二面孟字三號四號二面道字一號起五面率字二號起四面庭字一號起四面匪字一號起四面篤字一號起四面宿字一號起四面碣字一號一面辭字一號起三面清字四號一面鬱字四號一面殿字四號一面能字二號一面兄字二號一面毁字二號一面邇字三號五號二面罪字三號一面居字五號一面遣字一號一面計小木牌二千九百二十一面旗手字一號起二百六十九面府軍字一號起二百七十面府左字一號起二百五十五面府右字一號起三百六十四面府後字一號起二百三十五面金左字一號起七十七面金右字一號起一百四面金前字一號起二百八十六面金後字一號起二百三十五面羽左字一號起二百四十五面羽右字一號起二百六十面羽前字一號起五十面虎左字一號起二百六十六面明㑹典卷一百七十五
