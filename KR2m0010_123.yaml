body:
  text: 明㑹典卷一百二十三兵部十八武庫清吏司諸司職掌郎中員外郎主事掌邦國戎噐儀仗辨其出入之數軍器諸司職掌凡内外官軍合用衣甲鎗刀弓矢等噐必須總知其數如遇各衛移文到部申索轉行工部定奪關撥事例凡侍衛大漢將軍披執明盔四十八頂明甲二十四副紅肩纓二十四副金𤓰四十八把茜紅雨籠二十四箇茜紅氊襖二十四領旗將軍明甲八十四副尖頂明盔八十四頂紅肩纓八十四副紅滚刀二十八把𤓰五十六把摩挲刀五十六把茜紅雨籠八十四箇茜紅氊襖八十四領五軍將軍尖頂明盔二百五十四頂盔全明甲二百五十四副肩纓縧號全硃紅靶滚刀二百三十七把鞓帶全摩挲刀四十五把鞓帶全金𤓰四十把紅漆皮盔七百二十三頂盔全青布縧穿甲七百二十五頂長柄黒刀三十九把鞓帯全長柄紅刀五十九把鞓帯全腰刀五百五十三把鞓帯全鵓鴿頭刀三十七把鞓帯全來昔刀二把鞓帯全弓五百二十五張弦五百二十五條撒袋五百二十五副鞓帯全箭一萬四千七百五十枝茜紅盔籠二百五十四箇茜紅氊襖二百五十四件府軍衛帯刀官紵絲弔線甲四十副摩挲刀四十把圍子官軍义五百把滚刀五百把硃紅皮盔一千頂青布鐡甲一千副通計二萬三千九百三十七件皇城内外幷京城各門守直守衛守鎮官軍披執盔甲鎗刀等噐共二萬八千三百五十二件其侍衛將軍并圍子手軍噐俱三年一次兊換守衛等項官軍軍噐午門等門一面每年一次兊換東華西華𤣥武等門三面二年一次兊換凡團營官軍披執操練盔甲弓箭等項軍噐成化間令各該坐營官委官㑹造寄庫有警徑自奏請支用凡京門九門并城上常川擺列張掛軍噐正陽門神銃六箇長鎗二十根滚刀十八把門旗四面崇文宣武等八門每門神銃六箇長鎗六根滚刀十四把門旗二面更鼓各一面共三百六十一件城上布旗大小共二百七十六面拽旗繩并挑竿纓頭全遇有損壞不堪守門内外官徑自奏請兊換凡海運隨舡軍噐洪武間定每舡黒漆二意弓二十張弦四十條黒漆鈚子箭二千枝手銃筒一十六箇擺錫鐡甲二十副碗口筒四箇箭二百枝火鎗二十條火攻箭二十枝火义二十把蒺藜砲一十箇銃馬一千箇神機二十枝凡各邊合用盔甲弓箭等項軍噐俱於各處都司所屬衛所嵗造數内闗用如果不敷及軍情𦂳急添設者赴京請給凡勝字天威并列字等號神鎗神銃等項火噐俱係内府兵杖局掌管都司衛所季造止是編降字號手把銃口其各邊城堡所用大將軍二將軍三將軍并手把銅鐡銃口一出頒降若銃口損失并給用不敷者鎮守巡撫官具數㑹奏方許自造若一時急缺奏請亦從内府頒給勘合諸司職掌凡本部應有行移并催攝一應公務須將出事縁由開寫手本赴内府闗填勘合照㑹各布政司劄付直𨽻府州務要將坐去事件施行作急回報每遇年終查得但有未完事件將各司府州承行官吏具奏提問務要完結事例洪武間每布政司并直𨽻府州各給勾軍勘合一百道底簿二本都司收勘合并底簿一本一本𤼵布政司直𨽻府州凡遇勾軍都司填寫勘合差人賫付各該官司比對字號着落有司勾𤼵所差人員不許下鄉若遷延占恡罪坐有司直𨽻衛分一體編置年終都司衛所將本年勘合分豁已未完數造冊進繳若齎無勘合文書勾軍及有司承行者依不比闗闗防勘合例治罪其在京衛分兵部闗給正統初勾軍止㩀各衛所造冊申部轉𤼵清勾不用勘合永樂七年令紫荆居庸古北喜峯董家山海等六闗各給勘合一百道以禮樂射御書數字為號北京留守行夜軍都督府行在兵部皆用印鈐記兵部底簿勘合送内府都督府底簿付闗口各邊公差者必得内府勘合照驗方許出闗無者從守闗官執奏各邊調軍勘合以勇敢鋒銳神竒精壯强毅克勝英䧺威猛十六字為號并底簿留内府給號簿一本與邊將遇有制勑調軍比對勘合字號相同方許奏行如有制勑而無勘合有勘合而比號不同者皆為詐偽給聚諸司職掌凡文武官員并軍士人等搬取家小完聚行移所在官司起取審實送𤼵完聚或有陳告父母兄弟伯叔子姪先因逺年兵革離散今知下落告取完聚須要行移所在官司體勘相同以慿給聚其有應給之人見當軍役具奏定奪及軍属寡婦還鄉行移應天府給引照回事例洪武間令武職有伯叔兄弟及姊妹之夫在行伍者皆與給聚分俸養贍宣德初令被虜回還留京充役者其原衛見有父母妻舅許令搬取完聚明㑹典卷一百二十三
