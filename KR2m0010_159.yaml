化二年令京城街道溝渠錦衣衛官校并五城兵馬時常巡視禁治作踐如有怠慢許巡街御史㕘奏拏問若御史不言一體治罪六年令皇城周圍及東西長安街并京城内外大小街道溝渠不許官民人等作踐掘坑及侵占淤塞如街道低窪橋梁損壞即督地方火甲人等併力填修七年奏准各處渡船每船設梢夫十名每一州縣設老人一名管理於附近巡司衙門掌之仍大書老人梢夫姓名於船尾如有違誤擺渡及勒要渡錢聴過徃諸人指名陳告十年奏准京城水闗去處每座蓋火鋪一立通水器於該衙門撥軍二名看守遇雨過即令打撈其各厰大小溝渠水塘河漕每年二月令地方兵馬通行疏浚看厰官員不許阻當十五年奏准本部虞衡司添註員外郎一員專一巡視在京街道溝渠二十三年奏准凡豪强據河津要處以船擺渡規利者拏問治罪渡船入官𢎞治十三年奏准京城内外街道若有作踐掘成坑坎淤塞溝渠蓋房侵占或傍城行車縱放牲口損壞城脚及大明門前御道棊盤并䕶門栅欄正陽門外御橋南北本門月城將軍樓觀音堂闗王廟等處作踐損壞者俱問罪枷號一箇月發落又東西公生門朝房官吏人等或帶住家小或做造酒食或寄放貨櫃開設卜肆停放馬驢取土等項作踐問罪枷號一箇月發落明會典卷一百五十九
