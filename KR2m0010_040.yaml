於在外輳歷兩考𢎞治三年定預備倉糧事例有司每十里以下務要積糧一萬五千石軍衛每一千户所積糧一萬五千石每一百户所三百石每三年一次查盤有司少三分者罰俸半年少五分者罰俸一年少六分以上者九年考滿降用軍衛不及三百之數者一體住俸𢎞治十年奏准凡三年一次查盤預備倉糧除義民情願納粟囚犯贖罪納米外但有空閒官地佃收租米及贓罰紙價引錢不係起解支剩無礙官錢盡數糴米三年之內不足原數别無設法者俱免住俸參究明㑹典卷四十
