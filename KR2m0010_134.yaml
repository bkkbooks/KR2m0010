body:
  text: 明會典卷一百三十四刑部九比科諸司職掌律令户役田宅倉庫課程錢債市門里户役明律脫漏户口凡一户全不附籍有賦役者家長杖一百無賦役者杖八十附籍當差若將他人隱蔽在户不報及相冒合户附籍有賦役者亦杖一百無賦役者亦杖八十若將另居親屬隱蔽在户不報及相冒合户附籍者各減二等所隱之人並與同罪改正立户别籍當差其同宗伯叔弟姪及壻自來不曽分居者不在此限其見在官役使辦事者雖脫户止依漏口法若隱漏自已成丁人口不附籍及增減年狀妄作老幼廢疾以免差役者一口至三口家長杖六十每三口加一等罪止杖一百不成丁三口至五口笞四十每五口加一等罪止杖七十入籍當差若隱蔽他人丁口不附籍者罪亦如之所隱之人與同罪發還本户附籍當差若里長失於取勘致有脫户者一户至五户笞五十每五户加一等罪止杖一百漏口者一口至十口笞三十每十口加一等罪止笞五十本縣提調正官首領官吏脫户者十户笞四十每十户加一等罪止杖八十漏口者十口笞二十每三十口加一等罪止笞四十知情者並與犯人同罪受贓者計贓以枉法從重論若官吏曽經三次立案取勘已責里長文狀叮嚀省諭者事發罪坐里長人户以籍為定凡軍民驛竈醫卜工樂諸色人户並以籍為定若詐冒脫免避重就輕者杖八十其官司妄準脫免及變亂板籍者罪同若詐稱各衛軍人不當軍民差役者杖一百發邊逺充軍私創庵院及私度僧道凡寺觀庵院除見在處所外不許私自創建增置違者杖一百還俗僧道發邊逺充軍尼僧女冠入官為奴若僧道不給度牒私自簮剃者杖八十若由家長家長當罪寺觀住持及受業師私度者與同罪並還俗立嫡子違法凡立嫡子違法者杖八十其嫡妻年五十以上無子者得立庶長子不立長子者罪亦同若養同宗之人為子所養父母無子而捨去者杖一百發付所養父母收管若有親生子及本生父母無子欲還者聽其乞養異姓義子以亂宗族者杖六十若以子與異姓人為嗣者罪同其子歸宗其遺棄小兒年三嵗以下雖異姓仍聽收養即從其姓若立嗣雖係同宗而尊卑失序者罪亦如之其子亦歸宗改立應繼之人若庶民之家存養奴婢者杖一百即放從良收留迷失子女凡收留人家迷失子女不送官司而賣為奴婢者杖一百徒三年為妻妾子孫者杖九十徒二年半若得迷失奴婢而賣者各減良人罪一等被賣之人不坐給親完聚若收留在逃子女而賣為奴婢者杖九十徒二年半為妻妾子孫者杖八十徒二年若得在逃奴婢而賣者各減良人罪一等其被賣在逃之人又各減一等若在逃之罪重者自從重論其自收留為奴婢妻妾子孫者罪亦如之隱藏在家者並杖八十若買者及牙保知情減犯人罪一等追價入官不知者俱不坐追價還主若冒認良人為奴婢者杖一百徒三年為妻妾子孫者杖九十徒二年半冒認他人奴婢者杖一百賦役不均凡有司科徴稅糧及攤泛差役各驗籍內户口田糧定立等第科差若放富差貧那移作弊者許被告貧民赴拘該上司自下而上陳告當該官吏各杖一百若上司不為受理者杖八十受財者計贓以枉法從重論丁夫差遣不平凡應差丁夫雜匠而差遣不均平者一人笞二十每五人加一等罪止杖六十若丁夫雜匠承差而稽留不著役及在役日滿而所司不放回者一日笞一十每三日加一等罪止笞五十隱蔽差役凡豪民令子孫弟姪跟隨官員隱蔽差役者家長杖一百官員容隱者與同罪受財者計贓以枉法從重論跟隨之人免罪充軍其功臣容隱者初犯免罪附過再犯住支俸給一半三犯全不支給四犯依律論罪禁革主保里長凡各處人民每一百户內議設里長一名甲首一十名輪年應役催辦錢糧勾攝公事若有妄稱主保小里長保長主首等項名色生事擾民者杖一百遷徙其合設耆老須於本鄉年髙有德衆所推服人內選充不許罷間吏卒及有過之人充應違者杖六十當該官吏笞四十逃避差役凡民户逃往鄰境州縣躲避差役者杖一百發還原籍當差其親管里長提調官吏故縱及鄰境人户隱蔽在已者各與同罪若里長知而不逐遣及原管官司不移文起取若移文起取而所在官司占吝不發者各杖六十其在洪武七年十月以前流移他郡曽經附籍當差者勿論限外逃者論如律若丁夫雜匠在役及工樂雜户逃者一日笞一十每五日加一等罪止笞五十提調官吏故縱者各與同罪受財者計贓以枉法從重論不覺逃者五人笞二十每五人加一等罪止笞四十不及五名者免罪點差獄卒凡各處獄卒於相應慣熟人內點差應役令人代替者笞四十私役部民夫匠凡有司官私役使部民及監工官私役使夫匠出百里之外及久占在家使喚者一名笞四十每五名加一等罪止杖八十每名計一日追給雇工錢六十文若有吉凶及在家借使雜役者勿論其所使人數不得過五十名每名不得使過三日違者以私役論别籍異財凡祖父母父母在而子孫别立户籍分異財産者杖一百若居父母喪而兄弟别立户籍分異財産者杖八十卑幼私擅用財凡同居卑幼不由尊長私擅用本家財物者二十貫笞二十每二十貫加一等罪止杖一百若同居尊長應分家財不均平者罪亦如之收養孤老凡鰥寡孤獨及篤廢之人貧窮無親屬依倚不能自存所在官司應收養而不收養者杖六十若應給衣糧而官吏尅減者以監守自盜論田宅明律欺隱田糧凡欺隱田糧脫漏版籍者一畝至五畝笞四十每五畝加一等罪止杖一百其田入官所隱稅糧依數徴納若將田土移丘換假那易等則以髙作下減瞞糧額及詭寄田糧影射差役并受寄者罪亦如之其田改正收科當差里長知而不舉與犯人同罪其還鄉復業人民丁力少而舊田多者聽從儘力耕種報官入籍計田納糧當差若多餘占田而荒蕪者三畝至十畝笞三十每十畝加一等罪止杖八十其田入官若丁力多而舊田少者告官於附近荒田內驗力撥付耕種檢踏災傷田糧凡部內有水旱霜雹及蝗蝻為害一應災傷田糧有司官吏應準告而不即受理申報檢踏及本管上司不與委官覆踏者各杖八十若初覆檢踏官吏不行親詣田所及雖詣田所不為用心從實檢踏止慿里長甲首朦朧供報中間以熟作荒以荒作熟增減分數通同作弊瞞官害民者各杖一百罷職役不敘若致枉有所徴免糧數計贓重者坐贓論里長甲首各與同罪受財者並計贓以枉法從重論其檢踏官吏及里長甲首失於關防致有不實者計田十畝以下免罪十畝以上至二十畝笞二十每二十畝加一等罪止杖八十若人户將成熟田地移丘換假冒告災傷者一畝至五畝笞四十每五畝加一等罪止杖一百合納稅糧依數追徴入官功臣田土凡功臣之家除撥賜公田外但有田土從管莊人盡數報官入籍納糧當差違者一畝至三畝杖六十每三畝加一等罪止杖一百徒三年罪坐管莊之人其田入官所隱稅糧依數徴納若里長及有司官吏踏勘不實及知而不舉者與同罪不知者不坐盜賣田宅凡盜賣換易及冒認若虛錢實契典賣及侵占他人田宅者田一畝屋一間以下笞五十每田五畝屋三間加一等罪止杖八十徒二年係官者各加二等若強占官民山場湖泊茶園蘆蕩及金銀銅場鐡冶者杖一百流三千里若將互爭及他人田産妄作已業朦朧投獻官豪勢要之人與者受者各杖一百徒三年田産及盜賣過田價并遞年所得花利各還官給主若功臣初犯免罪附過再犯住支俸給一半三犯全不支給四犯與庶人同罪任所置買田宅凡有司官吏不得於見任處所置買田宅違者笞五十解任田宅入官典買田宅凡典買田宅不稅契者笞五十仍追田宅價錢一半入官不過割者一畝至五畝笞四十每五畝加一等罪止杖一百其田入官若將已典賣與人田宅朦朧重復典賣者以所得價錢計贓準竊盜論免刺追價還主田宅從原典買主為業若重復典買之人及牙保知情者與犯人同罪追價入官不知者不坐其所典田宅園林碾磨等物年限已滿業主備價取贖若典主托故不肯放贖者笞四十限外遞年所得花利追徴給主依價取贖其年限雖滿業主無力取贖者不拘此律盜耕種官民田凡盜耕種他人田者一畝以下笞三十每五畝加一等罪止杖八十荒田減一等強者各加一等係官者各又加二等花利歸官主荒蕪田地凡里長部內已入籍納糧當役田地無故荒蕪及應課種桑麻之類而不種者俱以十分為率一分笞二十每一分加一等罪止杖八十縣官各減二等長官為首佐職為從人户亦計荒蕪田地及不種桑麻之類以五分為率一分笞二十每一分加一等追徴合納稅糧還官棄毁器物稼穡等凡棄毁人器物及毁伐樹木稼穡者計贓準竊盜論免刺官物加二等若遺失及誤毁官物者各減三等並驗數追償私物者償而不坐罪若毁人墳塋內碑碣石獸者杖八十毁人神主者杖九十若毁損人房屋垣墻之類者計合用修造雇工錢坐贓論各令修立官屋加二等誤毁者但令修立不坐罪擅食田園瓜果凡於他人田園擅食瓜果之類坐贓論棄毁者罪亦如之其擅將去及食係官田園瓜果若官造酒食者加二等主守之人給與及知而不舉者與同罪若主守私自將去者並以監守自盜論私借官車船凡監臨主守將係官車船店舍碾磨之類私自借用或轉借與人及借之者各笞五十驗日追雇賃錢入官若討雇賃錢重者各坐贓論加一等明會典卷一百三十四
