body:
  text: 明㑹典卷九十九禮部五十八朝貢四事例土官每三年朝覲差人進貢一次限本年十二月終到京一貢物不等馬象金銀器皿降香黃蠟一方物及中途倒死馬匹例不給價其到京馬匹每匹賜鈔一百錠迤北衛喇特永樂七年封迤北順寧賢義安樂三王賜印及誥各遣人來貢以後貢無定期貢物馬駝貂鼠皮海青泰寧衛諾延衛福餘衛洪武二十一年東國遼王惠寧王諾延元帥府元帥等各差人來朝二十二年泰寧衛指揮使等官各賜冠帶永樂元年因泰寧衛指揮使等來朝仍設三衛以後襲升朝貢不絶每年聖節及正旦每衛許一百人來貢貢物駝馬哈密永樂四年封其酋長為忠順王以後襲封賜金印朝貢不常成化元年令每年來朝一次多不過三百人八月初旬驗放入關起送三十人到京貢物青金石必扎達鐵器諸禽皮等物哈喇喀三噶扎爾薩里莾喀什噶爾哈達拉薩蘭繅林額爾巴拉摩和勒博迪蘇巴勒赫阿里瑪圖沙瑪綽爾齊斡齊爾布哈爾保喇實喇斯尼沙布爾和斯摩哩塔布喇實古薩克蘇和坦和珍庫克新沙津哈雅雅蘇雅爾哈戎白烏蘭阿克蘇鄂端伊蘇城坤城沙克巴延克結已上皆西域諸國經哈密來貢者其貢期或三年或五年許來朝一次起送者不過三五十人罕都齊勤䝉古永樂二年設肅州蒙古千户所賜印及誥安定衛洪武七年西域安定王遣使來朝貢鎧甲刀劒等物遣賜織金文綺四匹仍詔其酋長立為四部各賜印曰鄂端曰阿榮曰庫克新曰特哩八年置安定鄂端二衛指揮使司賽瑪爾堪洪武二十年賽瑪爾堪等處地面回回二名為開通道路進馬駝到京二十二年復進馬二十四年進海青以後朝貢不常土魯畨宣德五年遣使來貢後朝貢不常烏思藏洪武七年賜銀印給勘合後每三年一貢各畨王差人填寫原降勘合闡化闡教輔教三王差來人從四川布政司比號贊善王差來人從陜西布政司比號并賫有印信畨本咨文方許入貢每貢各許一百人多不過一百五十人大乘大寶二法王不給勘合進貢不常止許差僧徒十人賫印信畨本隨同四王進貢之人赴京貢物畫佛銅佛銅塔舍利各色珠勒瑪各色特爾默各色氆氌珊瑚犀角左髻毛纓酥油明盔明甲刀劒長河西魚通寧逺等處洪武十六年置長河西等處軍民安撫使司每年一貢給以勘合於四川比號雅州入貢每貢止許五六十人多不過一百人方物該守關官員辨驗申送都布按三司審實起送貢物各色珠勒瑪各色特爾默各色氆氌珊瑚舍利犀角左髻明盔刀畫佛毛纓朵甘思洪武七年升朵甘衛為西安行都指揮使司給以銀印十八年改朵甘思宣慰使司及萬戶府招討司東道萬戶府搭爾千戶所後每年一貢給以勘合於四川比號雅州入境每貢止許五六十人多不過一百人貢物各色珠勒瑪各色特爾默各色氆氌左髻明盔長刀董卜韓胡每年一貢於四川比對勘合人數照朵甘思例貢物各色氆氌各色珠勒瑪各色特爾默珊瑚明盔鐡甲遮甲麻衣白毛纓紅毛纓黑毛纓黃左髻四川威州保縣金川寺畨僧每三年一貢每貢許一百人多不過一百五十人雜谷安撫司每三年一貢每貢許一百人多不過一百五十人逹蠻思長官司舊來朝貢至正統十年以後止𢎞治二年復來松潘茂州等處本地畨僧每年朝貢許三十名多不過五十人附近烏思藏地面者亦照烏思藏例每三年許二三十人多不五六十人陜西洮岷等處畨僧每寺許四五人每年終遇大節一次赴京朝貢洮岷等處畨簇每二年一貢大簇起送為首者四五人小簇起送一二人存留聽賞者大簇不過十五人小簇不過七八人貢物馬銅佛畫佛舍利子酥油青鹽足力麻鐡力麻氆氌左髻毛纓清木香明盔明甲腰刀賔客諸司職掌凡四夷歸化人員及朝貢使客初至㑹同館主客部官隨即到彼㸃視正從定其髙下房舍鋪陳一切處分安妥仍加撫綏使知朝廷恩澤一下程分豁正從人數札付膳部五日一次照例支送酒肉茶麵飲食之物一管待量其來人重輕合與茶飯者定擬食品卓數劄付膳部造辦主客部官一員或主席或分左右隨其高下序坐以禮管待仍令教坊司供應事例洪武二年畨王至京師令本部官於㑹同館禮待永樂以後四夷來朝貢者本部奏待宴官員欽命內臣與文武大臣或學士等官不拘員數成化初凡東北國及西畨朝貢以武職大臣待外國如朝鮮安南日本等處并土官以本部官待而內臣皆預俱從本部奏請㸃差設宴俱於㑹同館惟北使宴於本部本部官亦預明㑹典卷九十九
