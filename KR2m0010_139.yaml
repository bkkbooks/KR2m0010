body:
  text: 明會典卷一百三十九刑部十四軍政明律擅調官軍凡將帥部領軍馬守禦城池及屯駐邊鎮若所管地方遇有報到草賊生發即時差人體探緩急聲息須先申報本管上司轉達朝廷奏聞給降御寶聖㫖調遣官軍征討若無警急不先申上司雖已申上司不待回報輒於所屬擅調軍馬及所屬擅發與者各杖一百罷職發邊逺充軍其暴兵卒至欲來攻襲及城鎮屯聚軍馬之處或有反叛或賊有內應事有警急及路程遙逺者並聽從便火速調撥軍馬乘機勦捕若寇賊滋蔓應合會捕者鄰近衛所雖非所屬亦得調發䇿應並即申報本管上司轉達朝廷知會若不即調遣會合或不即申報上司及鄰近衛所不即發兵䇿應者並與擅調發罪同若親王所封地面有警調兵已有定制其餘上司及大臣將文書調遣將士提撥軍馬者非奉御寶聖㫖不得擅離信地若軍官有改除别職或犯罪取發如無奏奉聖㫖亦不許擅動違者罪亦如之申報軍務凡將帥參隨總兵官征進如總兵官分調攻取城寨克平之後隨將捷音差人飛報一申總兵官一申五軍都督府一行兵部另具奏本實封御前若賊人數多出沒不常如所領軍人不敷須要速申總兵官添撥軍馬設䇿勦捕不速飛申者從總兵官量事輕重治罪若有來降之人即便送赴總兵官轉達朝廷區處其貪取來降人財物因而殺傷人及中途逼勒逃竄者斬飛報軍情凡飛報軍情在外府州差人一申布政司一申都指揮使司及行移本道按察司其守禦官差人行移都指揮使司都指揮使司差人一行本管都督府一具實封布政司一差人行移兵部一具實封俱至御前開拆按察司差人具實封直奏在內直𨽻軍民官司並差人申本管都督府及兵部另具實封各自奏聞若互相知會隱匿不速奏聞者杖一百罷職不叙因而失誤軍機者斬邊境申索軍需凡守邊將帥但有取索軍器錢糧等物須要差人一行布政司一行都指揮使司再差人一行五軍都督府一行合干部分及具奏本實封御前其公文若到該部五軍都督府須要隨即奏聞區處發遣差來人回還若稽緩不即奏聞及各處不行依式申報者並杖一百罷職不叙因而失誤軍機者斬失誤軍事凡臨軍征討應合供給軍器行糧草料違期不完者當該官吏各杖一百罪坐所由若臨敵缺乏及領兵官已承調遣不依期進兵䇿應若承差告報軍期而違限因而失誤軍機者並斬從征違期凡軍官軍人臨當征討已有起程日期而稽留不進者一日杖七十每三日加一等若故自傷殘及詐為疾患之類以避征役者各加一等並罪止杖一百仍發出征若軍臨敵境托故違期一日不至者杖一百三日不至者斬若能立功贖罪者從總兵官區處軍人替役凡軍人不親出征雇倩人冒名代替者替身杖八十收籍充軍正身杖一百依舊充軍若守禦軍人雇人冒名代替者各減二等其子孫弟姪及同居少壯親屬自願代替者聽若果有老弱殘疾赴本管官司陳告驗實與免軍身若醫工承差關領官藥隨軍征進轉雇庸醫冒名代替者各杖八十雇工錢入官主將不固守凡守邊將帥被賊攻圍城寨不行固守而輒棄去及守備不設為賊所掩襲因而失陷城寨者斬若與賊臨境其望髙巡哨之人失於飛報以致陷城損軍者亦斬若被賊侵入境內虜掠人民者杖一百發邊逺充軍其官軍臨陳先退及圍困敵城而逃者斬縱軍虜掠凡守邊將帥非奉調遣私自使令軍人於外境虜掠人口財物者杖一百罷職充軍所部聽使軍官及總旗遞減一等並罪坐所由小旗軍人不坐若軍人不曾經由本管頭目私出外境虜掠者為首杖一百為從杖九十傷人為首者斬為從杖一百俱發邊逺充軍若本管頭目鈐束不嚴杖六十附過還職其邊境城邑有賊出沒乘機領兵攻取者不在此限若於已附地面虜掠者不分首從皆斬本管頭目鈐束不嚴各杖八十附過還職知情故縱者各與犯人同罪不操練軍士凡各處守禦官不守紀律不操練軍士及城池不完衣甲器仗不整者初犯杖八十附過還職再犯杖一百指揮使降充同知同知降充僉事僉事降充千户千户降充百户百户降充總旗總旗降充小旗小旗降充軍役並發邊逺守禦若隄備不嚴撫馭無方致有所部軍人反叛者親管指揮千户百户鎮撫各杖一百追奪發邊逺充軍若棄城而逃者斬激變良民凡牧民之官失於撫字非法行事激變良民因而聚衆反叛失陷城池者斬私賣戰馬凡軍人出征獲到馬匹須要盡數報官若私下貨賣者杖一百軍官賣者罪同罷職充軍買者笞四十馬匹價錢並入官軍官軍人買者勿論私賣軍器凡軍人關給衣甲鎗刀旗幟一應軍器私下貨賣者杖一百發邊逺充軍軍官賣者罪同罷職充軍買者笞四十應禁者以私有論軍器價錢並入官軍官軍人買者勿論毁棄軍器凡將帥關撥一應軍器征守事訖停留不回納還官者十日杖六十每十日加一等罪止杖一百若輒棄毁者一件杖八十每一件加一等二十件以上斬遺失及誤毁者各減三等軍人各又減一等並驗數追陪其曾經戰陳而有損失者不坐不陪私藏應禁軍器凡民間私有人馬甲傍牌火筒火炮旗纛號帶之類應禁軍器者一件杖八十每一件加一等私造者加私有罪一等各罪止杖一百流三千里非全成者並勿論許令納官其弓箭鎗刀弩及魚義禾義不在禁限縱放軍人歇役凡管軍百户及總旗小旗軍吏縱放軍人出百里之外買賣或私種田土或隱占在已使喚空歇軍役者一名杖八十每三名加一等罪止杖一百罷職充軍若受財賣放者以枉法從重論所隱軍人並杖八十若私使出境因而致死或被賊拘執者杖一百罷職發邊逺充軍至三名者絞本管官吏知情容隱不行舉問及虛作逃亡符同報官者與犯人同罪若小旗總旗百户縱放軍人其本管指揮千户鎮撫當該首領官吏知情故縱或容隱不行舉問及指揮千户鎮撫故縱軍人其百户總旗小旗知而不首告者罪亦如之若鈐束不嚴致有違犯及失於覺舉者小旗名下一名總旗名下五名百户名下十名千户名下五十名各笞四十小旗名下二名總旗名下十名百户名下二十名千户名下一百名者各笞五十並附過還職不及數者不坐若軍官私家役使軍人不曾隱占歇役者一名笞四十每五名加一等罪止杖八十並每名計一日追雇工錢六十文入官若有吉凶借使者勿論公侯私役官軍凡公侯非奉特㫖不得私自呼喚各衛軍官軍人前去役使違者初犯再犯免罪附過三犯准免死一次其軍官軍人聽從及不出征時輒於公侯之家門首伺立者軍官各杖一百罷職發邊逺充軍軍人罪同從征守禦官軍逃凡軍官軍人從軍征討私逃還家及逃往他所者初犯杖一百仍發出征再犯者絞知情窩藏者杖一百充軍里長知而不首者杖一百若軍還而先歸者減五等因而在逃者杖八十若在京各衛軍人在逃者初犯杖九十發附近衛分充軍各處守禦城池軍人在逃者初犯杖八十仍發本衛充軍再犯並杖一百俱發邊逺充軍三犯者絞知情窩藏者與犯人同罪罪止杖一百充軍里長知而不首者各減二等本管頭目知情故縱者各與同罪罪止杖一百罷職充軍其在逃官軍一百日內能自出官首告者免罪若在限外自首者減罪二等但於隨處官司首告者皆得准理若各衛軍人轉投别衛充軍者同逃軍論其親管頭目不行用心鈐束致有軍人在逃小旗名下逃去五名者降充軍人總旗名下逃去二十五名者降充小旗百户名下逃去一十名者減俸一石二十名者減俸二石三十名者減俸三石四十名者減俸四石逃至五十名者追奪降充總旗千户名下逃去一百名者減俸一石二百名者減俸二石三百名者減俸三石四百名者減俸四石逃至五百名者降充百户其管軍多者驗數拆算減降不及數者不坐若有病亡殘疾提撥等項事故者不在此限優恤軍屬凡陳亡病故官軍回鄉家屬行糧腳力有司不即應付者遲一日笞二十每三日加一等罪止笞五十夜禁凡京城夜禁一更三㸃鐘聲已靜五更三㸃鐘聲未動犯者笞三十二更三更四更犯者笞五十外郡城鎮各減一等其公務急速疾病生産死喪不在禁限其暮鐘未靜曉鐘已動巡夜人等故將行人拘留誣執犯夜者抵罪若犯夜拒捕及打奪者杖一百因而歐人至折傷以上者絞死者斬廏牧明律牧養畜産不如法凡牧養馬牛駝騾驢羊並以一百頭為率若死者損者失者各從實開報死者即時將皮張鬃尾入官牛斤角皮張亦入官其群頭群副每一頭各笞三十每三頭加一等過杖一百每十頭加一等罪止杖一百徒三年羊減馬三等驢騾減馬牛駝二等若胎生不及日時而死者灰醃看視明白不坐若失去陪償損傷不堪用減死者一等坐罪其死損數目並不准除孳生馬匹凡群頭管領騍馬一百匹為一羣每年孳生駒一百匹若一年之內止有駒八十匹者笞五十七十匹者杖六十都羣所官不為用心提調者各減三等太僕寺官又減都羣所官罪二等驗畜産不以實凡相驗分揀官馬牛駝騾驢不以實者一頭笞四十每三頭加一等罪止杖一百驗羊不以實減三等若因而價有增減者計所增減價坐贓論入已者以監守自盜論各從重科斷養療瘦病畜産不如法凡養療瘦病馬牛駝驢騾不如法笞三十因而致死者一頭笞四十每三頭加一等罪止杖一百羊減三等乘官畜脊破領穿凡官馬牛駝騾驢乘駕不如法而脊破領穿瘡圍繞三寸者笞二十五寸以上笞五十若牧養瘦者計百頭為率十頭瘦者牧養人及羣頭羣副各笞二十每十頭加一等罪止杖一百羊減三等典牧所官各隨所管羣頭多少通計科罪太僕寺官各減典牧所官罪三等官馬不調習凡牧馬之官聽乘官馬而不調習者一匹笞二十每五匹加一等罪止杖八十宰殺馬牛凡私宰自已馬牛者杖一百駝騾驢杖八十誤殺者不坐若病死而不申官開剝者笞四十斤角皮張入官若故殺他人馬牛者杖七十徒一年半駝騾驢杖一百若計贓重於本罪者准盜論若傷而不死不堪乘用及殺猪羊等畜者計減價亦准盜論各追陪所減價錢價不減者笞三十其誤殺傷者不坐罪但追陪減價為從者各減一等若故殺緦麻以上親馬牛駝騾驢者與本主私宰罪同殺猪羊等畜者計減價坐贓論罪止杖八十其誤殺及故傷者俱不坐但各追陪減價若官私畜産毁食官私之物因而殺傷者各減故殺傷三等追陪所減價畜主陪償所毁食之物若放官私畜産損食官私物者笞三十贓重者坐贓論失者減二等各陪所損物若官畜産毁食官物者止坐其罪不在陪償之限若畜産欲觸抵踢咬人登時殺傷者不坐罪亦不陪償畜産咬踢人凡馬牛及犬有觸抵踢咬人而記號拴繫不如法若有狂犬不殺者笞四十因而殺傷人者以過失論若故放令殺傷人者減鬭殺傷一等其受雇醫療畜産及無故觸之而被殺傷者不坐罪若故放犬令殺傷他人畜産者各笞四十追陪所減價錢隱匿孳生官畜産凡牧養係官馬騾驢等畜所得孳生限十日內報官若限外隱匿不報計贓准竊盜論因而盜賣或抵換者並以監守自盜論罪其都羣所太僕寺官知情不舉與犯人同罪不知者俱不坐私借官畜産凡監臨主守將係官馬牛駝騾驢私自借用或轉借與人及借之者各笞五十驗日追雇賃錢入官若計雇賃錢重者各坐贓論加一等公使人等索借馬匹凡公使人等承差經過去處索借有司官馬匹騎坐者杖六十驢騾笞五十官吏應付者各減一等罪坐所由營造明律擅造作凡軍民官司有所營造應申上而不申上應待報而不待報而擅起差人工者各計所役人雇工錢坐贓論若非法營造及非時起差人工營造者罪亦如之其城垣坍倒倉庫公廨損壞一時起差丁夫軍人修理者不在此限若營造計料申請財物及人工多少不實者笞五十若已損財物或已費人工各併記所損物價及所費雇工錢重者坐贓論虛費功力採取不堪用凡役使人工採取木石材料及燒造磚瓦之類虛費功力而不堪用者計所費雇工錢坐贓論若有所造作及有所毁壞備慮不謹而誤殺人者以過失殺人論工匠提調官各以所由為罪造作不如法凡造作不如法者笞四十若成造軍器不如法及織造假匹粗糙紕薄者各笞五十若不堪用及應改造者各併計所損財物及所費雇工錢重者坐贓論其應供奉御用之物加二等工匠各以所由為罪局官減工匠一等提調官吏又減局官一等並均償物價工錢還官冒破物料凡造作局院頭目工匠多破物料入己者計贓以監守自盜論追物還官局官并覆實官吏知情符同者與同罪失覺察者減三等罪止杖一百帶造假匹凡監臨主守官吏將自已物料輒於官局帶造假匹者杖六十假匹入官工匠笞五十局官知而不舉者與同罪失覺察者減三等織造違禁龍鳯文假匹凡民間織造違禁龍鳯文紵絲紗羅貨賣者杖一百假匹入官機户及挑花挽花工匠同罪連當房家小起發赴京籍充局匠造作過限凡各處額造常課假匹軍器過限不納齊足者以十分為率一分工匠笞二十每一分加一等罪止笞五十局官減工匠一等提調官吏又減局官一等若不依期計撥物料者局官笞四十提調官吏減一等修理倉庫凡各處公𪠘倉庫局院係官房舍但有損壞當該官吏隨即移文有司修理違者笞四十若因而損壞官物者依律科罪陪償所損之物若已移文有司而失誤者罪坐有司有司官吏不住公𪠘凡有司官吏不住公𪠘內官房而住街市民房者杖八十若埋沒公用器物者以毁失官物論河防明律盜决河防凡盜决河防者杖一百盜决墟岸陂塘者杖八十若毁害人家及漂失財物淹沒田禾計物價重者坐贓論因而殺傷人者各減鬭殺傷罪一等若故决河防者杖一百徒三年故决墟岸陂塘減二等漂失贓重者准竊盜論免刺因而殺傷人者以故殺傷論失時不修隄防凡不修河防及修而失時者提調官吏各笞五十若毁害人家漂失財物者杖六十因而致傷人命者杖八十若不修墟岸及修而失時者笞三十因而淹沒田禾者笞五十其暴水連雨損壞隄防非人力所制者勿論侵占街道凡侵占街巷道路而起蓋房屋及為園圃者杖六十各令復舊其穿牆而出穢汚之物於街巷者笞四十出水者勿論修理橋梁道路凡橋梁道路府州縣佐二官提調於農隙之時常加㸃視修理務要堅完平坦若損壞失於修理阻礙經行者提調官吏笞三十若津渡之處應造橋梁而不造應置渡船而不置者笞四十明會典卷一百三十九
