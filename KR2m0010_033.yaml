  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0010_WYG_033-1a, image: WYG0617/WYG0617-0364c.png}
body:
  text: 眀㑹典卷三十三户部十八庫藏二贓罰諸司職掌凡各處官民犯法律合籍沒家財及有不才官吏接受贓私追沒到金銀錢鈔衣服等項俱各劄付贓罰庫交收其行移次第照依課程事例施行事例宣徳十年奏准各䖏司府州縣衛所衙門凡在庫贓罰除金銀珠翠起觧京庫其餘銅鐡油麻羅緞布疋衣服之類及寄養贓罰馬騾驢牛等畜俱易米麥榖豆上倉正統三年奏准凡在外府州縣并軍衛等衙門贓罰俱解布政司并直𨽻府州官庫候年終直𨽻府州㑹巡按御史各布政司㑹按察司盤㸃見數其金銀及堪中段疋起解京庫仍具起解存留數目造册送部查考按察司所追贓罰及不堪段疋亦送布政司官庫金銀并堪中段疋每嵗類解都察院轉送京庫四年差給事中并本部主事於各布政司㑹同按察司直𨽻㑹同巡按御史盤驗各庫贓罰凡金銀珠翠及紵絲羅緞成疋堪中者起解京庫如不成疋及衣服器皿之類准折本處官員俸給其餘銅錢硫黄解工部軍器發附近衛所領用七年令各府州縣一應贓罰入官之物俱於年終變賣在官候秋成糴粮預偹賑濟成化十二年奏准各處在庫贓罰俱明白造冊糴米預偹賑濟或解部支用如分巡官各處寄留贓罰所在有司申達總司查考十六年令各運司提舉司毎年積滯并賣過私鹽車船頭匹問追過贓罰銀錢等物各該巡撫巡按等官通查見數解部轉發太倉銀庫内庫事例凡各處解到緞疋金銀纓玉象牙等物送内承運庫收凡各處解到錢鈔等物并各衙門鎻鑰俱係内府天財庫收掌凡各處解到白熟粳糯米等物送内府供用庫收凡各處解到紵絲綾羅硫黄熖硝等物送廣積庫收凡各處解到布疋并各色顔料送甲字庫收凡各處解到紵絲綿布胖襖袴鞋毛襖狐㡌等物送乙字庫收凡各處解到綿花絲綿等物送丙字庫收凡各處解到銅鐡皮張蘇木等物送丁字庫收凡各處解到軍器胡椒等物送戊字庫收凡各處解到闊生絹并翠毛皮送承運庫收凡各處解到錢鈔并紵絲綾羅紬絹氆氌鐡力綿布衣服花絨等物送贓罰庫收凡各處觧到鈔錢送廣惠庫收凡各處解到紵絲紗羅綾錦紬絹布疋等物送廣盈庫收洪武二十六年令揀各處解納布絹如泥汚水跡堪染顔色及稍破壞者皆不必陪塺爛破損不堪用者准陪補亦不治罪定各處折納絹布則例每絲二十兩及十八兩折絹一疋長三丈二尺闊二尺白綿布每疋長三丈一尺闊一尺八寸重三斤永樂十年令在京在外起解一應錢粮務委官勘驗堪中實數起解合干上司解部本部委官看驗相同闗填勘合進納仍於勘合内開各委官職名如解物與勘合不同者許門吏指實具奏十五年令在外各司府州等衙門進納嵗辦并閘辦課程等項金銀緞疋俱解北京内府庫宣徳五年令納官布絹不如法者加倍追陪原解人送問七年差本部主事一員同揀鈔御史給事中巡視甲字等庫凡各處解到布絹絲綿即督官攅人等照洪武年間所定長闊丈尺收受若有兠攬作弊者具奏挐問十年令各處嵗造緞疋委御史同該司官辦驗堪中送該庫交納正統二年令各庫所收布有長三丈以上者但准一疋放支官軍若該管官截去餘尺入已者以監守自盜論又令各處解納折粮布絹選退不堪中者該庫出給印信票帖退還觧人本部差人押追納完仍送問罪不許冄科百姓補納四年令各處解到内府庫物料俱於六科領給勘合填數照進交納九年令各項造作物料止扵官庫支用有不敷者奏給官價𣲖買不許損民十二年令各處折粮等項布疋送甲字庫收若有稀鬆塺跡水跡者送廣盈庫染造支用十四年令各處解到物料送該庫交收方許支用景泰元年奏准各處解京布鈔等項先從本部看驗堪中方許送庫交納又令各處解納銅鐡并生黄牛皮等料送丁字庫收三年奏准各衙門買辦軍需物料及一應支用宜從設法區畫若事干動支錢粮者先行本部㑹查果有三年之積方許回報施行又令各處解納絹疋若驗不中度百疋以上者侵剋解人發口外充軍絹疋責各犯家下追陪承行官吏行巡按御史提問又令蘇松等府運納供用庫粳糯米差御史一員同本庫官監收成化十六年奏准各處額徵絲綿折絹戸口食塩鈔錢司府掌印官務嚴加督責各該州縣官監收本處織造絹疋堪中鈔錢責令大户領解委官管押仍先扵内混取絹一疋鈔五十貫錢五十文包封印記順附公差人役送部收候比驗仍作正數送納其解到錢鈔絹疋比驗以十分為率如一分不堪者罪坐州縣經該官吏三分不堪者罪在本府經該官吏五分以上不堪者罪坐布政司經該官吏若委官大户抵换者照律問罪不堪錢鈔絹盡數沒官二十三年奏准各處錢鈔絹疋本部該司揀驗堪中之數該庫不許重復看驗刁蹬留難其餘闊布皮張物料等項但係十庫錢粮俱㑹同科道部官辨驗果係地道真正本色物件即與收完出給批单通闗不許推調延緩及供用庫所收粮如有多收盜賣虚出及包攬作弊者挐送法司問罪𢎞治三年令各處納絹驗出稀紕刷漿絲經麻緯及单經等項低絹布政司以驗退十州縣及八千疋以上者住俸三箇月府以驗退三州縣及二千四百疋以上者住俸半年州縣驗退八百疋以上者住俸一年四年令巡庫科道官及内外該庫官凡遇本部送到各處解納鈔錠進庫其折腰原封者俱另收轉送天財庫係折腰者用偹給賞係原封者用偹買辦八年令各處解納布絹該府掌印官驗中用印兩頭鈐記每色取式様一疋印封交所委官吏解部看驗送庫仍扵起解批文内開驗中數目用印鈐記若不如法者先將部解官吏送問司府州縣提調掌印官及吏行巡按御史查提揀退布絹加倍追陪粮納攬頭通同侵欺盜賣者發邉逺充軍十四年令各處解納折粮布疋赴部委官扵本衙門驗中送赴該庫并巡視科道官及本部委官收受不必冄揀又令各處起解兩京絹疋不及五十疋者送赴該府類解本部驗退五十疋以上者該府經該官吏叅究治罪庫夫事例内承運庫一百一十八名内府天財庫一百六十七名甲字庫六十二名辨驗鋪戸四名丙字庫三十七名每季辨驗鋪戸二名丁字庫六十名每季辨驗鋪户四名戊字庫一百二十名試驗箭匠二名贓罰庫五十名廣盈庫六十名廣惠庫八十四名乙字庫四十名每季辨驗鋪户三名承運庫四十名每季辨驗鋪户三名廣積庫四十名辨驗火藥匠一名景泰元年奏准庫夫在逃該庫止移文勾取不得擅差吏庫人等逼勒擾人其有交盤晒晾許扵各庫庫夫内互相借撥暫用成化五年奏准各庫夫俱照原額着役盤運錢粮遇夜輪宿看守如有𨼆占及令解户雇倩小脚頂替者俱治罪七年奏准各庫查盤晒晾原起取人夫甲字庫六十名乙字庫晒晾三十名盤庫六十名丙字庫四十名丁字庫六十名戊字庫七十名承運庫六十名贓罰庫擡鈔四十名檢鈔鋪户一百名盤庫二十名廣積庫四十名廣惠庫三十名廣盈庫十五名俱各減三分之一用畢放回如不足用許以各庫夫互相借用不許扵兩縣擅自起𣲖十四年令内府各庫鋪戸三月役滿即另僉替不許容留在庫及妄罰銀兩𢎞治五年令兩京甲字等庫庫夫交盤進納晒晾止照舊例於各庫借用不許行順天等府僉𣲖擾民凡各庫收到商稅等項錢鈔行内外委官盤收合用人夫該户科給事中面奏於順天府起撥太倉庫事例正統七年置太倉庫添設本部主事一員專管凡南直𨽻蘇常等府解納草價銀赴部轉送管庫官處交收成化十六年令巡撫巡按官清查各處運司及提舉司積年收貯并變賣過私塩車舡等項銀兩盡數解部轉發太倉庫以偹邉儲支用在外諸司庫事例洪武間凡天下衙門收用錢粮一年一報務将當年已支見在及天下放支該用數目開報本部稽考二十三年令各司府提調正官監督官攅人等盤㸃在庫一應錢帛若金銀錢鈔并疋帛零段解赴京庫麄重什物及銅鐡錫器收貯備用不堪𤨏碎物件當官燒毁舊破衣服給付孤老仍俱開數目稽考永樂三年差監生扵各處㑹同巡按御史查盤庫藏錢帛等項解京洪熈元年奏准差官扵布政司各都司并直𨽻府州衛所清查庫藏錢帛同下年該収該用數目造冊開報宣徳八年差給事中主事扵各處清查在庫貨物凢紵絲綾羅布絹不成疋及衣服器皿之類皆計時值准作文武官折色俸給支用正統四年令各布政司并直𨽻府州㑹計每嵗該用鈔數年終具報本部存留支用餘鈔解京景泰二年令在外諸司倉庫錢粮非奉本部眀文不許擅支成化十七年令各處司府衛所大小衙門如遇修理等項止許設法措置其在官錢粮必須軍機重務賑濟饑民及奉勘合應該支給者方許㑹官照卷挨次支給年終查筭明白造冊繳部若不應支給并那移出納者經該官員降黜邉逺叙用侵欺者從重歸結二十年令各處巡按御史㑹同布按二司督同各府州縣并鹽運司等衙門掌印官親詣官庫查盤一應錢帛等物應變賣者變賣應存留者存留應起解者起解三分之二𢎞治九年令布按二司并直𨽻府州將在庫金銀錢鈔等項開具數目按季造冊送部及廵按御史以慿查考十二年令各處巡按御史三年一次查盤在外諸司庫藏收貯金銀錢鈔等物及一應贓罰明㑹典卷三十三
