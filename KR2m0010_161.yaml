body:
  text: 明會典卷一百六十一工部十五織造各項織造皆𨽻本司誥敕亦織造之一事至於造冠服器用必有物料造斛斗稱尺各有法則皆見於諸司職掌今具列事例于後段匹諸司職掌凡供用袍服段匹及祭祀制帛等項須於內府置局如法織造依時進送每歲公用段匹務要會計歲用數目並行外局織造所用物料除蘇木明礬官庫足用蠶絲紅花藍靛於所産去處稅糧內折收槐花梔子烏梅於所産令民採取按歲差人進納該庫支用丹礬紅每斤染經用蘇木一斤黃丹四兩明礬四兩梔子二兩黑緑每斤用靛青二斤八兩槐花四兩明礬三兩深青每斤用靛青四斤蠶絲湖州府六萬斤紅花山東七千斤河南八千斤藍靛應天府二萬斤鎮江府二萬斤揚州府二萬斤淮安府二萬斤太平府二萬斤槐花衢州府六百斤金華府八百斤嚴州府六百斤徽州府一千斤寧國府八百斤廣德州二百斤烏梅衢州府一千五百斤金華府二千斤嚴州府一千四百斤徽州府一千五百斤寧國府一千五百斤廣德州五百斤梔子衢州府五百斤金華府五百斤嚴州府二百斤徽州府五百斤寧國府五百斤廣德州二百斤明令凡局院成造段匹務要緊密顔色鮮明丈尺斤兩不失原樣局官常切比較工程合用絲料申請提調正官嚴加提督但有不堪究治追陪事例計各處歲造段匹數目浙江等布政司并直𨽻蘇松等府州縣每年織造紵絲紗羅綾紬絹共三萬五千三百二十四匹一丈七寸六分遇閏月加二千六百六十二匹二丈八尺八寸二分浙江布政司紵絲紗羅紬共一萬二千八百十匹紵絲一萬四百三匹線羅五百二十匹生平羅一千匹紗三百六十六匹色紬五百二十八匹遇閏月加紵絲七百九十五匹線羅三十一匹生平羅二十五匹江西布政司紵絲二千八百三匹遇閏月加二百四十五匹河南布政司紵絲八百匹遇閏月加六十七匹山東布政司紵絲七百二十匹遇閏月加六十匹福建布政司紵絲二千二百五十八匹遇閏月加一百九十一匹二丈四尺湖廣布政司紵絲一千九百六十一匹遇閏月加一百六十九匹山西布政司綾絹一千匹遇閏月加八十六匹綾五百匹絹五百匹四川布政司闊生絹四千五百十六匹遇閏月加三百七十七匹直𨽻蘇州府紵絲一千五百三十四匹遇閏月加一百三十九匹松江府紵絲一千一百六十七匹遇閏月加九十七匹鎮江府紵絲一千四百四十匹遇閏月加一百二十匹常州府紵絲一百匹遇閏月加一十七匹徽州府紵絲七百二十一匹遇閏月加四十八匹寧國府紵絲六百九十六匹遇閏月加四十七匹廣德州紵絲二百四十匹遇閏月加一十四匹揚州府紵絲紬絹共一千一百三十二匹遇閏月加七十二匹闊生絹七百一匹紵絲一百三十一匹紬三百匹改織紵絲一百匹自天順三年起太平府闊生絹五百匹遇閏月加四十二匹池州府闊生絹一千一百七十匹遇閏月加九十一匹安慶府闊生絹六百匹織染局衙門內府置局及外局織局所用物料諸司職掌已具今併以天下織染局具列于後計天下織染局浙江杭州府紹興府嚴州府金華府衢州府台州府溫州府寧波府湖州府嘉興府江西布政司福建福州府泉州府四川布政司河南布政司山東濟南府直𨽻鎮江府蘇州府松江府徽州府寧國府廣德州凡織造段匹闊二尺長三丈五尺額設歲造者闊一尺八寸五分長三丈二尺歲造段匹并闊生絹送承運庫上用段匹并洗白腰機畫絹送織染局婚禮紵絲送針工局供應器皿黃紅等羅并只孫裼裙發文思院洪武三年定神帛織文郊祀上天及配饗皆曰郊祀制帛太廟祖考曰奉先制帛親王配饗曰展親制帛社稷歷代帝王先師孔子及諸神祇皆曰禮神制帛功臣曰報功制帛蒼白青黃赤黑各以其宜二十三年罷天下歲織段匹凡有賞賚皆給絹帛如或缺乏在京織造宣德十年令各處解到段匹原解人員連原封同該司官吏辨驗御史送至午門內會司禮監委官及庫官揀驗堪中收庫不許在部開封正統元年令各處歲造段匹等物該府州縣官將織染局見在各色人匠機張及歲辦并關支領料等物數目開報巡按官以憑稽考十二年奏準歲造段匹俱令腰封編號開寫提調及經織造官吏匠作姓名不堪用者照號問罪責其陪償誥敕諸司職掌凡文武官員誥敕照依品級制度如式製造所用五色紵絲誥身誥帶黃蠟花椒白麵紙劄等項差人赴內府織染局等衙門關支其公侯襲封鐵劵行下寶源局依式打造所用瓜鐵木炭須於丁字庫抽分竹木局關支如遇完備進赴內府鐫嵌鐵劵尺寸公一樣高一尺闊一尺六寸五分二樣高九寸五分闊一尺六寸侯三樣高九寸闊一尺五寸五分四樣高八寸五分闊一尺五寸五樣高八寸闊一尺四寸五分伯六樣高七寸五分闊一尺三寸五分七樣高六寸五分闊一尺二寸五分事例洪武二年新製鐵券給賜功臣面刻誥文背鐫免罪減祿之數字嵌以金為左右二面合以字號凡誥織用五色紵絲其前織文曰奉天誥命敕織用純白綾其前織文曰奉天敕命俱用升降龍文左右盤繞後俱織某年月日造帶俱用五色冠服諸司職掌凡製造皇帝皇太子親王衮冕袍服務要擇日興工仍擇日以進其餘婚禮粧奩并太常寺祭服淨衣及給賜衣服冠帶喪禮衫巾并行移針工巾帽二局如法製造其給賜衣服冠帶須要預先多辦以備不時賞賜給賜衣服冠帶圓領貼裏紗帽角帶事例永樂十二年添設主事一員於六科廊專管成造賞賜衣服其紵絲紗羅絹布每套俱有圓領褡貼裏或女衣或幼小男女衣賞賜番僧則用紵絲禪衣紵絲賞古麻氅哈喇藍綾貼裏絹衣貼裏青布衣各壇該用絹布淨衣每年三起成造共八百五十九套每套四件共三千四百三十六件器用諸司職掌凡供用器物及祭祀器皿并在京各衙門合用一應什物行下該局如法成造若金銀銅鐵等器𨽻寶源局皮革𨽻皮作局竹木𨽻營繕所匹帛𨽻文思院皆須度量所料物色委官覆實相同不許多支妄費事例洪武元年令太廟器皿易以金造乘輿服御諸物應用金者以銅代之二年定祭器皆用磁十七年製祔廟册寶以檀香為之册文填以金永樂間設器皿厰本部添設郎中一員專管厰內十二作曰創金油漆木竹銅錫捲胎蒸籠桶鏇祭器鐵索每年光祿寺坐出該用器皿數目題送本部奏準劄付本厰修造完備該寺差人領用又令守衛軍木牌更造以銅正統十四年奏準今後在京易辦不急之務如馬槽之類不必遠取成化五年令親王諡册寶本部促辦付掌行喪禮等官順賫其冥器下所司就彼製造六年奏準內監歲用馬槽及他器皿令南京類送價直在京成造十二年奏準歲造器皿定數一萬件本部造七千件南京工部三千件二十一年詔南京工部成造馬槽馬樁等項粗重之物沿邊軍民運送勞擾自今停免以後缺用在京衙門成造𢎞治二年奏準添造器皿一萬二千件本部八千四百件南京工部三千六百件凡每歲上用蠅拂等物南京內府造成守備官差人賫至御前進收凡各王府及儀賓誥命每軸造匣裝盛并用紅袱紅錦等物包褁齎送斛斗稱尺諸司職掌凡使用斛斗稱尺著令木稱等匠計算物料如法成造所用鐵刀木杉木板枋生鐵等項行下龍江提舉司等衙門照數放支其合用錘鈎行下寶源局督工鑄造如是成造完備移咨户部較勘收用事例洪武元年令鑄造鐵斛斗升付户部收糧用以較勘仍降其式於天下正統元年奏準蘇松等處原降鐵斛斗升年久廢失見存者少行南京工部照舊式鑄造給領收掌以備較勘又令各處斛斗稱尺府州縣正官照依原降式樣較勘相同官民通用仍將式樣常於街市懸挂聽令比較明會典卷一百六十一
