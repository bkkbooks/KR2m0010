  text: 明㑹典卷一百八兵部三職方清吏司諸司職掌郎中員外郎主事之職掌天下地圖及城隍鎮戍烽堠之政城隍一謂城池也國初設太平等翼元帥府以統諸道兵設總制親兵都指揮使司及都鎮撫以總禁衛後改諸翼為親軍立大都督府設内外衛所及各處都指揮使司後又分大都督府為五府外衛統於都司而都司及内衛各以其方𨽻五軍都督府惟親軍不屬其都司衛所自永樂以來添革改調前後不一各處土官衙門有屬都司衛所統轄及後來添設未經該載本司見管與諸司職掌所載互有同異今備載職掌舊文而以後定衛所别開於後所屬有土官者随處附見其沿革大畧各註本條之下諸司職掌凡天下都司并衛所城池軍馬數目必合周知或遇所司移文修築須要奏聞差人相度准令守禦軍士或所在民人築造然後施行計天下都司衛所都司一十七處留守司一處内外衛三百二十九處守禦千户所六十五處上十二衛金吾前衛金吾後衛羽林左衛羽林右衛府軍衛府軍左衛府軍右衛府軍前衛府軍後衛虎賁左衛錦衣衛旗手衛五軍都督府所屬衛所左軍都督府在京凡本府在京屬衛曽經永樂十八年調守北京者各註其下曰調北京其年月不重出後四府同留守左衛調北京鎮南衛調北京水軍左衛驍騎右衛調北京龍虎衛調北京英武衛瀋陽左衛調北京瀋陽右衛調北京在外浙江都司杭州右衛杭州前衛台州衛寧波衛處州衛紹興衛海寧衛昌國衛温州衛臨山衛松門衛金鄉衛定海衛海門衛盤石衛觀海衛海寧千户所衢州千户所嚴州千户所湖州千户所遼東都司定遼左衛定遼右衛定遼中衛定遼前衛定遼後衛鐡嶺衛東寧衛瀋陽中衛海州衛葢州縣金州衛復州衛義州衛遼海衛三萬衛廣寧左屯衛廣寧右屯衛廣寧前屯衛廣寧後屯衛廣寧中護衛後為中屯衛山東都司青州左護衛後為天津右衛青州護衛革兖州護衛革兖州左護衛後為臨津衛登州衛青州左衛萊州衛寧海衛濟南衛平山衛徳州衛後改屬後府樂安千户所後改名武定屬後府膠州千户所諸城千户所滕縣千户所右軍都督府在京虎賁右衛調北京留守右衛調北京水軍右衛武徳衛調北京廣武衛在外雲南都司雲南左衛雲南右衛雲南前衛大理衛楚雄衛臨安衛景東衛曲靖衛金齒衛洱海衛蒙化衛馬隆衛改雲南右護衛革平夷衛越州衛六涼衛鶴慶千户所革貴州都司貴州衛永寧衛普定衛平越衛烏撒衛普安衛層臺衛赤水衛威清衛興隆衛新添衛清平衛平埧衛安莊衛龍里衛安南衛都匀衛畢節衛黄平千户所四川都司成都左護衛後為龍虎左衛𨽻南京左府成都中護衛後為豹韜左衛𨽻南京前府成都左衛革成都右衛成都前衛成都後衛成都中衛寧川衛茂州衛建昌衛後屬行都司重慶衛叙南衛蘇州衛後為寧畨衛瀘州衛松潘軍民指揮司巖州衛青川千户所保寧千户所威州千户所雅州千户所大渡千户所陜西都司西安左護衛後為神武右衛西安右護衛西安中護衛後為神武前衛西安左衛西安右衛改西安中護衛西安前衛西安後衛華山衛改西安左護衛泰山衛改西安右護衛延安衛綏徳衛平涼衛慶陽衛寧夏衛臨洮衛鞏昌衛西寧衛後屬行都司漢中衛涼州衛後屬行都司莊浪衛後屬行都司蘭州衛秦州衛岷山軍民指揮司洮州衛河州軍民指揮司甘肅衛後為甘州後衛山丹衛後屬行都司永昌衛後屬行都司鳳翔千户所金州千户所寧夏中護衛甘州中護衛後屬行都司西河中護衛後改雲南中護衛革廣西都司桂林左衛後為廣西護衛桂林右衛桂林中衛南寧衛桞州衛馴象衛梧州千户所中軍都督府在京留守中衛調北京神策衛調北京廣洋衛應天衛調北京和陽衛牧馬千户所調北京在外直𨽻揚州衛和州衛髙郵衛淮安衛鎮海衛滁州衛太倉衛泗州衛夀州衛邳州衛大河衛沂州衛金山衛新安衛蘇州衛儀真衛徐州衛安慶衛宿州千户所中都留守司鳳陽右衛鳳陽中衛皇陵衛鳳陽衛留守左衛留守中衛長淮衛懐逺衛洪塘千户所河南都司歸徳衛後屬中府陳州衛𢎞農衛汝寧衛後改千户所屬中府潼關衛後屬中府河南衛睢陽衛宣武衛信陽衛彰徳衛武平衛後屬中府南陽衛寧國衛後為涿鹿左衛屬後府懐慶衛寧山衛後屬後府潁川衛安吉衛後為通州衛親軍潁上千户所河南左護衛河南中護衛河南右護衛三䕶衛後併彭城衛前軍都督府在京天策衛後分為保安右衛龍驤衛調北京豹韜衛調北京龍江衛後改龍江左衛飛熊衛在外直𨽻九江衛湖廣都司茶陵衛武昌衛武昌左衛黄州衛永州衛岳州衛蘄州衛施州衛長沙護衛革辰州衛安陸衛後屬行都司襄陽衛後屬行都司常徳衛沅州衛寶慶衛沔陽衛長沙衛衡州衛瞿塘衛後屬行都司鎮逺衛平溪衛清浪衛偏橋衛五開衛九溪衛荆州左護衛後為荆州左衛屬行都司荆州中護衛革靖州衛永定衛郴州千户所夷陵千户所後屬行都司桂陽千户所徳安千户所後屬行都司忠州千户所安福千户所道州千户所大庸千户所西平千户所麻遼千户所枝江千户所後屬行都司武崗千户所崇山千户所革長寧千户所後屬行都司武昌左右中三䕶衛左改東昌衛右改徐衛州左衛中改武昌䕶福建都司福州中衛福州左衛福州右衛興化衛泉州衛漳州衛福寧衛鎮東衛平海衛永寧衛鎮海衛福建行都司建寧左衛建寧右衛建陽衛延平衛邵武衛汀州衛將樂千户所江西都司南昌左衛南昌前衛袁州衛贑州衛吉安衛後為千户所饒州千户所安福千户所㑹昌千户所永新千户所南安千户所建昌千户所撫州千户所鉛山千户所廣信千户所廣東都司廣州前衛廣州左衛廣州右衛南海衛潮州衛雷州衛海南衛清逺衛惠州衛肇慶衛廣州後衛程