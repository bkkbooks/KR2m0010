body:
  text: 明㑹典卷一百十八兵部十三守衛國初置都鎮撫司總領禁衛又以親軍諸衛分畨守衛而改都鎮撫司為留守五衛時常巡察後差官㸃閘其法漸密今悉載之若大明律所具者見刑部律令項下計各衛分定地方皇城四門自午門左至闕左門東第五鋪午門右至闕右門西第五鋪端門左至承天門左橋南端門右至承天門右橋南長安左門至外皇城以東第六鋪長安右門至外皇城以西第十一鋪右旗手濟陽濟州府軍虎賁左金吾前燕山前羽林前八衛官軍分守東華門左盡左第十一鋪東至東上門左東華門右盡右第一鋪東至東上門右東安門左外盡左第十四鋪內至東上南北門左東安門右外盡右第十四鋪內至東上南北門右右金吾左羽林左府軍左燕山左四衛官軍分守西華門左盡左第一鋪西至西上南北門左西華門右盡右第九鋪西至西上南北門右西安門左外盡左第十二鋪內至乾明門左西安門右外盡右第七鋪內至乾明門右右金吾右羽林右府軍右燕山右四衛官軍分守𤣥武門左盡左第五鋪北至北上門北上西門以左𤣥武門右盡右第四鋪北至九上門北上東門以右北安門左外盡左第十二鋪內至北上西門外以左北安門右外盡右第八鋪內至北上東門外以右右金吾後府軍後通州大興左四衛官軍分守事例凡各門守衛官員照依地方各領銅符收掌守衛承天門領承字號東安門領東字號西安門領西字號北安門領北字號俱隂文右比留守衛巡城官員領承字等四號銅符俱陽文左比凡守衛官遇巡城官到來將銅符比驗相同方許㸃閘凡各門守衛官員遇夜各領令牌賫執巡警午門領申字一號至四號長安左右門及東華門領申字五號至八號西華門領申字九號至十二號北安門領申字十三號至十六號凡皇城每日輪都督一員𢃄刀千百戶一員領申字十七號令牌於內直宿仍㸃各門守衛軍士凡內皇城四圍二十八鋪設銅鈴二十八每更初自闕右門發鈴傳遞至闕門第一鋪止次日納鈴於闕右門第一鋪夜遞如初外皇城四圍七十二鋪銅鈴七十八每更初自長安右門發鈴傳遞至長安左門止次日納鈴於長安右門第一鋪夜遞如初凡內皇城左右每夕輪坐更將軍一百人每更二十人凡內皇城四門設走更官八員於內府給領簿籍每更各門官交互往來於簿上用印一顆為信東華門官南至闕左門北至𤣥武門西華門官北至𤣥武門南至闕右門其三門官更赴東華西華二門亦如之凡官員人等出入四門無牙牌者附寫水牌凡外皇城各門設馬直百戶十八員各領全伍以備隨駕洪武二十七年聖㫖榜例自古到如今各朝皇帝差軍守衛皇城務要本隊伍正身當直上至頭目下至軍人不敢頂替這等守衛是緊要的勾當若是頂替干係利害撥散隊伍守衛尤其利害且如論隊伍守衛撥那所軍若用軍多盡本所守衛若用少或五百三百二百一百務要整百戶守衛若軍别無事故各各見在衛所其當該管軍人員不行仔細檢㸃照依原伍上直致令小人賣放或閒居在衛所或私自縱放不在衛所㸃視不到定將本管指揮千百戶衛所鎮撫總小旗各杖一百指揮降千戶調邊逺千戶降百戶調邊逺百戶降總旗調邊逺衛鎮撫降所鎮撫調邊逺總旗降小旗調邊逺小旗降做軍調邊逺如是受財賣放以致隊伍不全係是圍宿重事不問贓多少處以重罪一當直之時不問全所或一百戶上直必定無全伍何故無全伍且如父母妻子或死喪或因病或本身有病或嫁娶或公差或因事被監或種植蔬菜五穀看守果木婦人産難此數等皆是軍人有妨上直之時理合明白開寫是數事內何等妨占自此等别無虛冒難以問罪理合逐件准該一若本無前條數事倚法為奸妄稱數事內一事不行上直非官吏該管容縱罪坐本軍杖一百流烟瘴若所管官旗人等受財冒為此事不拘贓多少處以重罪一軍人在京衛分近處不出百里之外死喪慶弔許告假行本衛親管官旗首領官吏即時准告放行以快人情敢有留難笞五十上官罰俸一月一凡當直之日務要各千戶差調本管百戶各帥本隊伍旗軍一名一名務要著實不許頂替若有事故儘有事故開除見在不問多少從實當直若將本隊伍一百戶軍調做三四次當直或一旗一直兩旗一直或五名一直三名一直多少不等折散隊伍處以重刑家遷化外一若死喪親姻疾病産難隨即告知本管官旗即時放行毋得刁蹬留難若有刁蹬留難即時親身赴御前陳告若當直之時本身若有暴疾本管官旗即放歸營所請醫調治或看視遲慢放回猶豫致令病甚親管小旗杖一百總旗杖九十百戶住俸一月其病軍食錢帶去不必瑣碎來奏一若軍人别無餘丁家有父母或父或母一時染病不能痊可似這等軍許不當直告知明白在家侍奉父母病疾管甚麼十日五日半月一月不拘幾時直待父母痊可才方上直若父母病痊及父母無病詐稱有病閘驗是實治以重罪輕則流入烟瘴一軍人單夫隻妻者若妻有病本軍許不上直看覷妻室病痊之後才方上直設或無病稱病病痊不直閘驗是實調入烟瘴一若官旗首領官吏不畏法度擅將上直軍人撥散隊伍許本隊伍內不問軍旗人等赴御前陳奏閘驗是實賞鈔五十錠作弊官吏處以重刑一凡㸃大軍病疾不許扛擡赴㸃幼軍自十三赴㸃十二以下皆不赴㸃止㸃視於營中一凡一應關請有孕婦女不許入內違者本管官旗杖一百若不令官旗知㑹匿孕私入者罪坐本婦一凡當直之時守衛何門本日外人於內辦事事畢仍於本門回還若自本門入不自本門出不問是何等人却被别門擒拏雖係國戚亦當即時奏聞區處將所入之門守直官旗軍人俱各處重刑擒拏之門直守軍旗受賞一凡整㸃大軍本管官旗私下縱令正軍不入隊伍臨㸃之際却乃雇覔他人代替㸃視者官旗與雇覔之人俱各處以重刑有能首告者賞鈔一百錠官首告升一階總旗首告升百戶小旗首告升百戶軍人首告升百戶仍賞鈔一百錠本管官旗自行舉覺者不在升賞之例一在京軍人戶下壯丁多者或弟兄子姪或見贅在戶女壻凡遇上直做工公差許輪流代替不輪者聽若遇出征調遣正軍親行正軍軟弱戶下壯丁願隨行代替者亦聽本管官旗首領官吏敢有刁蹬者杖一百罷職總小旗首領官吏邊逺充軍一遇朝參先放直日都督將軍散騎帶刀人員及應直帶刀指揮千百戶衛所鎮撫進然後百官進朝不許攙越混雜一守衛官員凡遇當直須待朝後辰時方許交班違者問罪一凡內官內使小火者出入各門守門官軍務要搜檢精細揣揑交襠或將帶金銀假匹衣服等項須慿勘合放出或有公差幹辦事務明白附寫前去某處公幹及辨驗身上衣服是何顔色見數明白隨即附記事畢回還依數㸃進但有㸃對不同即時奏聞一內官內使須要比對銅符依前搜檢放出若內官內使出門本無銅符及有銅符不行比對明白輒便放出者守門官軍治以重罪一各處進納官物長解及內府做工諸色人等誤帶鈔貫等物入門守門官軍務要用心搜檢止當寄放方許進門若進門之時搜撿潔淨比候出門搜出有帶出物件即時拏奏一官員軍民人等入奏事務守衛官軍人等不許問其緣故所將文書亦不許開看隨即徑直引奏若擅問緣故及將文書開看者依律論罪承天門紅牌一官員人等說謊者處斬一凡大小官員奏事語言不一轉換支吾面欺者斬宣德三年令皇城四門常差御史一員往來巡視五年令各門進出事件每日從守衛官具奏天順元年添差給事中一員巡視各門五年令守衛官有懸帶金牌棄置兵仗擅離信地者錦衣衛官校并巡視給事中御史拏送法司問罪決杖一百發遼東邊衛差操成化四年革馬直官軍選精壯者補宿衛十一年令留守衛官每日巡行各門㸃閘二次十二年奏准每日長安左右門初開先放常朝及見辭等項官吏盡絶方許驗牌放進各監局工役人等有攙越混進及夾帶財物入內買賣者守衛官具奏治罪𢎞治元年奏准朝參文武官隨從官吏人等俱官給木牌懸帶守衛官軍辨驗放入其謝恩見辭工滿囚人進春進厯送納錢糧諸色人經該衙門給與牌面事畢收回人數多者給印信手本送守衛官照入二年令留守衛官每夜分行各門㸃閘二次十年令各門守衛官軍隻日輪給事中雙日輪御史及兵部委官㸃閘十三年奏准凡左道邪術及燒煉丹藥之人擅入皇城夤緣求進而守衛官軍不行關防搜拏者參奏治罪十四年令各門進納錢糧所在守門軍士及門吏邀索財物者聽㸃城及巡視科道官參提問罪守衛軍士食錢諸司職掌凡在京上十二衛守衛隨駕軍人每名一直三日食錢鈔三百文先期一日令各衛將軍名數具手本報進內府本部官一員攢類軍名并該支鈔錠總數送禮科關鈔令該管守衛官領去給散如有公差患故名數食錢明白扣除不許將軍人頂替冒支事例洪武二十八年設皇城四門厨房恩軍為守衛軍士做造飯食長安左右門厨房二所恩軍二百二十五名管軍百戶二員金吾前衛鎮撫司帶管東安門厨房一所恩軍九十七名管軍百戶一員羽林左衛鎮撫司帶管西安門厨房一所恩軍一百十一名管軍百戶一員羽林右衛鎮撫司帶管北安門厨房一所恩軍一百十二名管軍百戶一員金吾後衛鎮撫司帶管永樂七年以後每官軍守衛三日於京倉支直米五升正統六年復設各門厨房分調南京原額恩軍一百名及於在京撥補共五百名簡選百户五員分領做飯其帶管食糧悉依洪武舊例𢎞治二年令守衛官軍每直於各門內倉支直米五升牌面諸司職掌凡隨駕官員力士校尉須憑牌面守衛其牌面內府印綬監掌管輪直官員人等於簿上明白附寫花名畫字給領如遇下直務要交割明白勾銷庶無差失其在外新設衛所申索守禦夜巡銅牌須要定奪數目編置字號行移禮部鑄造就送該部給發事例詳見尚寶司東宫侍衛凡千秋節正旦冬至朝賀俱有將軍及各項官舍旗校左右侍衛文華殿內外管領侍衛官二員錦衣衛明盔將軍三十人三千營紅盔將軍三十人丹陛丹墀及文華門左右錦衣衛擎執傘扇儀仗官校四百十九人答應官校六十六人旗手衛陳列金鼓旗幟官軍一百三十五人隨侍營帶刀官舍一百五十八人答應控馬等項官舍二百二十人五軍義刀官軍三百二人護衛官舍一千五百八十二人凡將軍旗校人等從各營衛於應直人員照例差撥凡隨侍官舍於公侯伯都督都指揮指揮千百戶之家選人物端正年力相應者充仍推指揮二員管領從三千營提調凡隨侍官舍分為三班遇朝賀全集其每月朔望朝參止輪一班明㑹典卷一百十八
