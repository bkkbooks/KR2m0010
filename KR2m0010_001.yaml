body:
  text: 明會典卷一宗人府譜系國初置大宗正院正一品衙門洪武二十二年改院為府設宗人令左右宗正左右宗人職專玉牒譜系之事初以親王領譜事後但以勳戚大臣掌之而不備官永樂七年遷都於北置行在宗人府十八年除行在二字洪熙元年復稱行在正統六年復除之以本府所領係宗室重事故品秩特崇序列於文職衙門之首皇明祖訓凡立宗正院以親王長者主領院事以次官員皆用勳舊大臣專領玉牒譜系辨其親踈敦睦皇族凡宗室有所陳請即為上聞聽天子命凡東宫親王位下各擬名二十字日後生子及孫即以上聞付宗正院所立雙名每一世取一字以為上字其下字臨時隨意選擇以為雙名編入玉牒至二十世後照例續添永為定式東宫位下允文遵祖訓欽武大君勝順道宜逢吉師良善用晟秦王位下尚志公誠秉惟懷敬誼存輔嗣資廉直匡時永信惇晉王位下濟美鍾竒表知新慎敏求審心咸景慕述學繼前修燕王位下今為帝系高瞻祁見祐厚載翊常由慈和怡伯仲簡靖迪先猷周王位下有子同安睦勤朝在肅恭紹倫敷惠澤昭恪廣登庸楚王位下孟季均榮顯英華藴盛容宏才升博衍茂士立全功齊王位下賢能長可慶睿知實堪宗養性期淵雅寅思復會通潭王位下福昌欣保定嘉應必興隆啓處詢從式尊聞汝貴中魯王位下肇泰陽當健觀頥壽以𢎞振舉希兼逹康莊遇本寧蜀王位下恱友申賓讓承宣奉至平懋進深滋益端居務穆清湘王位下久鎮開方嶽揚威謹禮儀剛毅循超卓權衡素自持代王位下遜仕成聰俊充廷鼐鼎彛傳貽連秀郁炳耀壯洪基肅王位下贍祿貢真弼縉紳識烈忠曦暉躋富運凱諫處恆隆遼王位下貴豪恩寵致憲術儼尊儒雲仍祺保合操翰麗龍輿慶王位下秩邃置台鼒倪伸帥倬竒適完因巨衎隲眷發需毗寧王位下磐奠覲宸拱多謀統議中總添支庶濶作哲向親衷岷王位下徽音膺彥譽定幹企禋雍崇理原咨訪寬鎔喜賁從谷王位下賦質僖雄敞叢興闡福昌篤諧恂懌豫擴霽昱禎祥韓王位下沖範徴偕旭融謨朗璟逵亶韶愈皓慥令緒價蕃維瀋王位下佶幼詮勛允恬珵效迥瑝湜源諲晳暐圭璧徹澄昻安王位下斐序斌延賞凝覃濬祉襄恢嚴顓輯矩縝密廓程綱唐王位下瓊芝彌宇宙碩器聿琳琚啓齡蒙頌體嘉歷協銘圖郢王位下偉聞參望奭針誨洎臯夔麒麟餘積兆奎穎曄璿璣伊王位下顒勉諟訏典褒珂采鳯琛應疇頒胄選昆玉冠泉金毖初斯建節勗好必貞詮執凖符鈞正詢旻汝勵虔薦諝演還暢先施遂省稽諏歡爰造就適藝冀塤箎慧堅欣願確鑑潔綽侁孜習獻增盈謐臨饒軼績撝靖江王位下贊佐相規約經邦任履亨若依純一行逺得襲芳名凡郡王子孫有文武材能堪任用者大宗正院具以名聞朝廷考驗換授官職其升轉如常選法如或有犯宗正院取問明白具實聞奏輕則量罪降等重則黜為庶人但明賞罰不加刑責事例凡各王府有新生子女具生年月日并分嫡庶及生母姓氏奏報本府抄出附注宗支簿籍凡各王府親王郡王將軍中尉諸名請封襲封及出閣新封郡主縣主郡君縣君鄉君并薨故等項奏報本府抄出亦各附注宗支簿籍凡各項附注簿籍俱備禮部行查及驗玉牒文册相同回報施行凡親王未之國除授長史等官吏部行本府轉行各府長史司取具到任日期及啓王知會凡各王府奏請祿米户部行本府查勘相同回報施行凡親王出府兵部奏撥儀衛司羣牧所等衙門官軍旗校人等隨侍行本府轉送各長史司啓王知會在外無行凡各王府有郡王將軍中尉及郡主縣主郡君縣君鄉君出閣起造房屋奏行工部轉行本府查勘相同回報施行凡在京郕府秀府儀賓朝參俱由本府帶注門籍凡玉牒翰林院每十年一次纂修本府具各王府宗支開報凡玉牒紙劄永樂二十二年奏準於司禮監關領表背匠工部取用洪熙元年奏準行司禮監别造紙劄翰林院委官一員公同附注宣德三年奏準本府附寫玉牒用翰林院官一員同本府經歷於史館內附寫凡本府合用紙劄𢎞治十年奏準於刑部關領印色順天府買辦凡附注宗支𢎞治十年奏準吏部撥辦事吏三名本府印信於承差內選補知印一名南京宗人府南京在洪武間為京師自永樂定都於北因名南京官署並置在南京者加南京二字今朝廷政令皆自京師出以逹於南京故以南京宗人府次宗人府諸衙門皆然其事例與在京衙門不同者各列於後事例永樂十八年改本府為南京宗人府不復降印惟改降經歷司印與南京各衙門行移凡本府正廳及中門以洪武間親王曾掌府事至今官員人等不敢中廳而坐中門出入明會典卷一
