body:
  text: 明㑹典卷一百三十五刑部十倉庫明律鈔法凡印造寶鈔與洪武大中通寶及歷代銅錢相兼行使其民間買賣諸物及茶鹽商稅諸色課程並聼收受違者杖一百若諸人將寶鈔赴倉場庫務折納諸色課程中買鹽貨及各衙門起解贓罰須要於鈔背用使姓名私記以憑稽考若有不行用心辨驗收受僞鈔及挑剜描輳鈔貫在內者經手之人杖一百倍追所納鈔貫僞挑鈔貫燒毁其民間關市交易亦許用使私記若有不行仔細辨驗誤相行使者杖一百倍追鈔貫止問見使之人若知情行使者並依本律錢法凡錢法設立寶源等局鼓鑄洪武通寶銅錢與大中通寶及歷代銅錢相兼行使折二當三當五當十依數准算民間金銀米麥布帛諸物價錢並依時直聽從民便若阻滯不即行使者杖六十其軍民之家除鏡子軍器及寺觀庵院鐘磬鐃鈸外其餘應有廢銅並聽赴官中賣每斤給價銅錢一百五十文若私相買賣及收匿在家不赴官中賣者各笞四十收糧違限凡收夏稅於五月十五日開倉七月終齊足秋糧十月初一日開倉十二月終齊足如早收去處預先收受者不拘此律若夏稅違限至八月終秋糧違限至次年正月終不足者其提調部糧官吏典分催里長缺糧人户各以十分為率一分不足者杖六十每一分加一等罪止杖一百受財者計贓以枉法從重論若違限一年之上不足者人户里長杖一百遷徙提調部糧官吏典處絞多收稅糧斛靣凡各倉收受稅糧聽令納户親自行概平斛交收作數支銷依令准除折耗若倉官斗級不令納户行概跌斛淋尖多收斛面者杖六十若以附餘糧數計贓重者坐贓論罪止杖一百提調官吏知而不舉與同罪不知者不坐隱匿費用稅糧課物凡送本户應納稅糧課物及應入官之物而隱匿費用不納或詐作損失欺妄官司者並計所虧缺物數准竊盜論免刺其部運官吏知情與同罪不知者不坐攬納稅糧凡攬納稅糧者杖六十著落赴倉納足再於犯人名下追罰一半入官若監臨主守攬納者加罪二等其小户畸零米麥因便輳數於納糧人户處附納者勿論虛出通關硃鈔凡倉庫收受一應係官錢糧等物不足而監臨主守通同有司提調官吏虛出通關者計所虛出之數併贓皆以監守自盜論若委官盤㸃錢糧數本不足符同申報足備者罪亦如之受財者計贓以枉法從重論其監守不收本色折收財物虛出硃鈔者亦以監守自盜論納户知情减二等免刺原與之贓入官不知者不坐其贓還主同僚知而不舉者與犯人同罪不知及不同署文案者不坐附餘錢糧私下補數凡各衙門及倉庫但有附餘錢糧須要盡實報官明白正收作數若監臨主守將增出錢糧私下銷補别項事故虧折之數瞞官作弊者並計贓以監守自盜論若內府承運庫收受金帛當日交割未完者許令附簿寄庫若有餘剩之物本庫明白立案正收開申户部作數若朦朧擅將金帛等物出外者斬守門官失於盤獲搜檢者杖一百私借錢糧凡監臨主守將係官錢糧等物私自借用或轉借與人者雖有文字並計贓以監守自盜論其非監守之人借者以常人盜倉庫錢糧論若將自已物件抵換官物者罪亦如之私借官物凡監臨主守將係官什物衣服氊褥器玩之類私自借用或轉借與人及借之者各笞五十過十日各坐贓論减二等若有損失者依毁失官物律坐罪追陪那移出納凡各衙門收支錢糧等物已有文案勘合若監臨主守不正收正支那移出納還充官用者並計贓准監守自盜論罪止杖一百流三千里免刺若不給半印勘合擅出權帖或給勘合不立文案放支及倉庫不候勘合或已奉勘合不附簿放支者罪亦如之其出征鎮守軍馬經過去處行糧草料明立文案即時應付具數開申合干上司准除不在擅支之限違者杖六十庫稱雇役侵欺凡倉庫務場局院庫稱斗級若雇役之人侵欺借貸移易係官錢糧並以監守自盜論若雇主同情分受贓物者罪亦如之其知情不曽分贓而符同申報瞞官及不首告者减一等罪止杖一百不知情者不坐冒支官糧凡管軍官吏總旗小旗冒支軍糧入己者計贓准竊盜論免刺錢糧互相覺察凡倉庫務場官吏攢攔庫子斗級皆得互相覺察若知侵欺盜用借貸係官錢糧已出倉庫匿而不舉及故縱者並與犯人同罪失覺察者减三等罪止杖一百若官吏虛立文案那移出納及虛出通關其斗級庫子攔頭不知者不坐倉庫不覺被盜凡有人從倉庫中出守把之人不搜檢者笞二十因不搜檢以致盜物出倉庫而不覺者减盜罪二等若夜直更之人不覺盜者减三等倉庫直宿官攢斗級庫子不覺盜者减五等並罪止杖一百故縱者各與盜同罪若被强盜者勿論守支錢糧及擅開官封凡倉庫官攢斗級庫子役滿得代所收錢糧官物并令守支盡絶若無短少方許給由其有應合相沿交割之物聼提調官吏監臨盤㸃見數不得指厫指庫交割違者各杖一百若官物有印封記其主典不請原封官司而擅開者杖六十出納官物有違凡倉庫出納官物當出陳物而出新物應受上物而受下物之類及有司和雇和買不即給價若給價有增减不實者計所虧缺及多餘之價坐贓論若應給俸祿未及期而預給者罪亦如之其監臨官吏知而不舉與同罪不知者不坐收支留難凡收受支給官物其當該官吏無故留難刁蹬不即收支者一日笞五十每三日加一等罪止杖六十徒一年守門人留難者罪亦如之若領物納物之人到有先後主司不依次序收支者笞四十起解金銀足色凡收受諸色課程變賣物貨起解金銀須要足色如成色不及分數提調官吏人匠各笞四十著落均陪還官損壞倉庫財物凡倉庫及積聚財物主守之人安置不如法曬晾不以時致有損壞者計所損壞之物坐贓論著落均陪還官若卒遇雨水衝激失火延燒盜賊劫奪事出不測而有損失者委官保勘覆實顯跡明白免罪不陪其監臨主守若將侵欺借貸那移之數乘其水火盜賊虛揑文案及扣換交單籍冊申報瞞官者並計贓以監守自盜論同僚知而不舉者與同罪不知者不坐轉解官物凡各處徴收錢帛買辦軍需成造軍器等物所在州縣交收差有職役人員陸續類解本府若本府不即交收差人轉解勒令人户就解布政司者當該提調正官首領官吏典各杖八十若布政司不即交收勒令各府就解部者首領官令典罪亦如之其起運官物長押官及解物人安置不如法致有損失者計所損失之物坐贓論著落均陪還官若船行卒遇風浪及失火延燒或盜賊劫奪事出不測而有損失者申告所在官司委官保勘覆實顯跡明白免罪不陪若有侵欺者計贓以監守自盜論若起運官物不運本色而輒齎財貨於所納去處收買納官者亦計贓以監守自盜論擬斷贓罰不當凡擬斷贓罰財物應入官而給主及應給主而入官者坐贓論罪止杖一百守掌在官財物凡官物當應給付與人已出倉庫而未給付若私物當供官用已送在官而未入倉庫但有人守掌在官若有侵欺借貸者並計贓以監守自盜論隱瞞入官家産凡抄沒人口財産除謀反謀叛及姦黨係在十惡依律抄沒其餘有犯律不該載者妻子財産不在抄沒入官之限違者依故入人流罪論若抄劄入官家産而隱瞞人口不報者計口以隱漏丁口論若隱瞞田土者計田以欺隱田糧論若隱瞞財物房屋孳畜者坐贓論各罪止杖一百所隱人口財産並入官罪坐供報之人若里長同情隱瞞及當該官吏知情者並與同罪計所隱贓重者坐贓論全科受財者計贓以枉法各從重論失覺舉者减三等罪止笞五十課程明律鹽法凡犯私鹽者杖一百徒三年若有軍器者加一等誣指平人者加三等拒捕者斬鹽貨車船頭匹並入官引領牙人及窩藏寄頓者杖九十徒二年半挑擔䭾載者杖八十徒二年非應捕人告獲者就將所獲私鹽給付告人充賞有能自首者免罪一體給賞若事發止理見獲人鹽當該官司不許輾轉攀指違者以故入人罪論凡鹽場竈丁人等除正額鹽外夾帶餘鹽出場及私煎貨賣者同私鹽法百夫長知情故縱及通同貨賣者與犯人同罪凡婦人有犯私鹽若夫在家或子知情罪坐夫男其雖有夫而逺出或有子幼弱罪坐本婦凡買食私鹽者杖一百因而貨賣者杖一百徒三年凡守禦官司及鹽運司巡檢司巡獲私鹽即發有司歸勘各衙門不許擅問若有司官吏通同脫放者與犯人同罪受財者計贓以枉法從重論凡守禦官司及有司巡檢司設法差人於概管地面并附場緊關去處常川巡禁私鹽若有透漏者關津把截官及所委巡鹽人員初犯笞四十再犯笞五十三犯杖六十並附過還職如知情故縱及容令軍兵隨同販賣者與犯人同罪受財者計贓以枉法從重論其巡獲私鹽入已不解官者杖一百徒三年若裝誣平人者加三等凡軍人有犯私鹽本管千百户有失鈐束者百户初犯笞五十再犯杖六十三犯杖七十减半給俸千户初犯笞四十再犯笞五十三犯杖六十减半給俸並附過還職若知情容縱及通同販賣者與犯人同罪凡起運官鹽每引二百斤為一袋帶耗五斤經過批驗所依數掣摯稱盤但有夾帶餘鹽者同私鹽法若客鹽越過批驗所不經掣摯關防者杖九十押回盤驗凡客商販賣官鹽不許鹽引相離違者同私鹽法其賣鹽了畢十日之內不繳退引者笞四十若將舊引影射鹽貨者同私鹽法凡起運官鹽并竈户運鹽上倉將帶軍器及不用官船起運者同私鹽法凡客商將官鹽插和沙土貨賣者杖八十凡將有引官鹽不於拘該行鹽地面發賣轉於别境犯界貨賣者杖一百知而買食者杖六十不知者不坐其鹽入官監臨勢要中鹽凡監臨官吏詭名及權勢之人中納錢糧請買􅐭引勘合侵奪民利者杖一百徒三年鹽貨入官沮壞鹽法凡客商中買鹽引勘合不親赴場支鹽中途增價轉賣沮壞鹽法者買主賣主各杖八十牙保减一等鹽貨價錢並入官其鋪户轉買拆賣者不用此律私茶凡犯私茶者同私鹽法論罪如將已批驗截角退引入山影射照茶者以私茶論私礬凡私煎礬貨賣者同私鹽法論罪匿稅凡客商匿稅及賣酒醋之家不納課程者笞五十物貨酒醋一半入官於入官物內以十分為率三分付告人充賞務官攢攔自獲者不賞入門不弔引同匿稅法其造酒醋自用者不在此限若買頭匹不稅契者罪亦如之仍於買主名下追徴價錢一半入官舶商匿貨凡泛海客商舶船到岸即將物貨盡實報官抽分若停塌沿港土商牙儈之家不報者杖一百雖供報而不盡者罪亦如之物貨並入官停藏之人同罪告獲者官給賞銀二十兩人户虧兌課程凡民間周嵗額辦茶鹽商稅諸色課程年終不納齊足者計不足之數以十分為率一分笞四十每一分加一等罪止杖八十追課納官若茶鹽運司鹽場茶局及稅務河泊所等官不行用心辦課年終比附上年課額虧兑者亦以十分論一分笞五十每一分加一等罪止杖一百所虧課程著落追補還官若有隱瞞侵欺借用者並計贓以監守自盜論錢債明律違禁取利凡私放錢債及典當財物每月取利並不得過三分年月雖多不過一本一利違者笞四十以餘利計贓重者坐贓論罪止杖一百若監臨官吏於所部內舉放錢債典當財物者杖八十違禁取利以餘利計贓重者依不枉法論並追餘利給主其負缺私債違約不還者五貫以上違三月笞一十每一月加一等罪止笞四十五十貫以上違三月笞二十每一月加一等罪止笞五十二百五十貫以上違三月笞三十每一月加一等罪止杖六十並追本利給主若豪勢之人不告官司以私債強奪去人孳畜産業者杖八十若估價過本利者計多餘之物坐贓論依數追還若准折人妻妾子女者杖一百強奪者加二等因而姦占婦女者絞人口給親私債免追費用受寄財産凡受寄人財物畜産而輒費用者坐贓論减一等詐言死失者准竊盜論减一等並追物還主其被水火盜賊費失及畜産病死有顯跡者勿論得遺失物凡得遺失之物限五日內送官官物還官私物召人識認於內一半給與得物人充賞一半給還失物人如三十日內無人識認者全給限外不送官者官物坐贓論私物减二等其物一半入官一半給主若於官私地內掘得埋藏之物者並聽收用若有古器鐘鼎符印異常之物限三十日內送官違者杖八十其物入官市門里明律私充牙行埠頭凡城市鄉村諸色牙行及船埠頭並選有抵業人户充應官給印信文簿附寫客商船户住貫姓名路引字號物貨數目每月赴官查照私充者杖六十所得牙錢入官官牙埠頭容隱者笞五十革去市司評物價凡諸物行人評估物價或貴或賤令價不平者計所增减之價坐贓論入己者准竊盜論免刺其為罪人估贓不實致罪有輕重者以故出入人罪論受財者計贓以枉法從重論把持行市凡買賣諸物兩不和同而把持行市專取其利及販鬻之徒通同牙行共為姦計賣物以賤為貴買物以貴為賤者杖八十若見人有所買賣在傍髙下比價以相惑亂而取利者笞四十若已得利物計贓重者准竊盜論免刺私造斛斗稱尺凡私造斛斗稱尺不平在市行使及將官降斛斗稱尺作弊增减者杖六十工匠同罪若官降不如法者杖七十提調官失於校勘者减一等知情與同罪其在市行使斛斗稱尺雖平而不經官司校勘印烙者笞四十若倉庫官吏私自增减官降斛斗稱尺收支官物而不平者杖一百以所增减物計贓重者坐贓論因而得物入己者以監守自盜論工匠杖八十監臨官知而不舉者與犯人同罪失覺察者减三等罪止杖一百器用布絹不如法凡造器用之物不牢固真實及絹布之屬紕薄短狹而賣者各笞五十其物入官明㑹典卷一百三十五
