body:
  text: 明㑹典卷一百三十八刑部十三司門科諸司職掌律令宫衛關津郵驛軍政廏牧營造河防宫衛明律太廟門擅入凡擅入太廟門及山陵兆域門者杖一百太社門杖九十未過門限者各减一等守衛官故縱者各與犯人同罪失覺察者减三等宫殿門擅入凡擅入皇城午門東華西華𤣥武門及禁苑者各杖一百擅入宫殿門杖六十徒一年擅入御膳所及御在所者絞未過門限者各减一等若無門籍冒名而入者罪亦如之其應入宫殿未著門籍而入或當下直而輒入及宿次未到而輒宿者各笞四十若不係宿衛應直合帶兵仗之人但持寸刃入宫殿門內者絞入皇城門內者杖一百發邊逺充軍門官及宿衛官軍故縱者各與犯人同罪失覺察者减三等罪止杖一百軍人又减一等並罪坐直日者宿衛守衛人私自代替凡宫禁宿衛及皇城門守衛人應直不直者笞四十以應宿衛守衛人私自代替及替之人各杖六十以别衛不係宿衛守衛人冒名私自代替及替之人各杖一百百户以上各加一等若在直而逃者罪亦如之京城門减一等各處城門又减一等親管頭目知而故縱者各與犯人同罪失覺察者减三等有故而赴所管告知者不坐從駕稽違凡應從車駕之人違期不到及從而先回還者一日笞四十每三日加一等罪止杖一百百户以上各加一等若從車駕行而逃者杖一百發邊逺充軍百户以上絞親管頭目故縱者各與犯人同罪失覺察者减三等罪止杖一百直行御道凡午門外御道至御橋除侍衛官軍導從車駕出入許於東西兩傍行走外其餘文武百官軍民人等無故於上直行及輒度御橋者杖八十若於宫殿中直行御道者杖一百守衛官故縱者各與犯人同罪失覺察者减三等若於御道上橫過係一時經行者不在禁限內府工作人匠替役凡諸色工匠行人差撥赴內府及承運庫工作若不親身關牌入內應役雇人冒名私自代替及替之人各杖一百雇工錢入官宫殿造作罷不出凡在宫殿內造作所司具工匠姓名報門官及守衛官􅈬於所入門首逐一㸃視放入工作至申時分仍須相視形貌照數㸃出其不出者絞監工及提調內使監官門官守衛官軍㸃視如名數短少􅈬便搜捉隨即奏聞知而不舉者與犯人同罪失覺察者减三等罪止杖一百輒出入宫殿門凡應出宫殿而門籍已除輒留不出及被告劾已有公文禁止籍雖未除輒入宫殿者各杖一百若宿衛人已被奏劾者本司先收其兵仗違者罪亦如之若於宫殿門雖有籍至夜皆不得出入若入者杖一百出者杖八十無籍入者加二等若持仗入殿門者絞關防內使出入凡內使監官并奉御內使但遇出外各門官須要收留本人在身關防牌靣於簿上印記姓名字號明白附寫前去某處幹辦是何事務其門官與守衛官軍搜檢沿身别無夾帶方許放出回還一體搜檢給牌入內以慿逐月稽考出外次數但搜出應干雜藥就令自喫若不服搜檢者杖一百充軍若非奉㫖私將兵器進入皇城門內者杖一百發邊逺充軍入宫殿門者絞門官及守衛官失於搜檢者與犯人同罪向宫殿射箭凡向太廟及宫殿射箭放彈投磚石者絞向太社杖一百流三千里但傷人者斬宿衛人兵仗凡宿衛人兵仗不離身違者笞四十輒離職掌處所笞五十别處宿杖六十百户以上各加一等親管頭目知而不舉者與犯人同罪失覺察者减三等禁經斷人充宿衛凡在京城犯罪被極刑之家同居人口隨即遷發别郡住坐其親屬人等并一應經斷之人並不得入充近侍及宿衛守把皇城京城門禁若朦朧充當者斬其當該官司不為用心詳審或聽人囑託及受財容令充當者罪同若有特㫖選充曾經覆奏明立文案者不在此限衝突儀仗凡車駕行處除近侍及宿衛護駕官軍外其餘軍民並須回避衝入儀仗內者絞若在郊野之外一時不能回避者聽俯伏以待其文武百官非奉宣喚無故輒入儀仗內者杖一百典仗護衛官軍故縱者與犯人同罪不覺者减三等凡有申訴寃抑者止許於仗外俯伏以聽若衝入儀仗內而所訴事不實者絞得實者免罪凡軍民之家縱放牲畜若守衛不備因而衝突儀仗者杖八十衝入皇城門內者杖一百行宫營門凡行宫外營門次營門與皇城門同若有擅入者杖一百內營牙帳門與宫殿門同擅入者杖六十徒一年越城凡越皇城者絞京城者杖一百流三千里越各府州縣鎮城者杖一百官府公廨墻垣者杖八十越而未過者各减一等若有所規避者各從重論門禁鎖鑰凡各處城門應閉而誤不下鎖者杖八十非時擅開閉者杖一百京城門各加一等其有公務急速非時開閉者不在此限若皇城門應閉而誤不下鎖者杖一百發邊逺充軍非時擅開閉者絞其有㫖開閉者勿論懸帶關防牌面凡朝𠫭文武官及內官懸帶牙牌鐡牌㕑子校尉入內各帶銅木牌面如有遺失官罰鈔二十貫㕑子校尉罰鈔一十貫若有拾得隨即報官者將各人該罰鈔貫充賞有牌不帶無牌輒入者杖八十借者及借與者杖一百事有規避者從重論隱藏者杖一百徒三年首告者於犯人名下追鈔五十貫充賞詐帶朝𠫭及在外詐稱官員名號有所求為者絞僞造者斬首告者於犯人名下追鈔一百貫充賞關津明律私越冒度關津凡無文引私度關津者杖八十若關不由門津不由渡而越度者杖九十若越度緣邊關塞者杖一百徒三年因而出外境者絞守把之人知而故縱者同罪失於盤詰者各减三等罪止杖一百軍兵又减一等並罪坐直日者若有文引冒名度關津者杖八十家人相冒者罪坐家長守把之人知情與同罪不知者不坐其將馬騾私渡冒度關津者杖六十越度杖七十詐冒給路引凡不應給路引之人而給引及軍詐為民民詐為軍若冒名告給引及以所給引轉與他人者並杖八十若於經過官司停止去處倒給路引及官豪勢要之人囑託軍民衙門擅給批帖影射出入者各杖一百當該官吏聽從及知情給與者並同罪若不從及不知者不坐若巡檢司越分給引者罪亦如之其不立文案空押路引私填與人者杖一百徒三年受財者計贓以枉法及有所規避者各從重論若軍民出百里之外不給引者軍以逃軍論民以私度關津論關津留難凡關津往來船隻守把之人不即盤驗放行無故阻當者一日笞二十每一日加一等罪止笞五十若官豪勢要之人乘船經過關津不服盤驗者杖一百若撑駕渡船梢水如遇風浪險惡不許擺渡違者笞四十若不顧風浪故行開船至中流停船勒要船錢者杖八十因而殺傷人者以故殺傷論遞送逃軍妻女出城凡在京守禦官軍遞送逃軍妻女出京城者絞民犯者杖一百若各處守禦城池及屯田官軍遞送逃軍妻女出城者杖一百發邊逺充軍民犯者杖八十受財者計贓以枉法從重論其逃軍買求者罪同守門之人知情故縱者與犯人同罪失於盤詰者减三等罪止杖一百軍人又减一等若遞送非逃軍妻女出城者杖八十有所規避者從重論盤詰姦細凡緣邊關塞及腹裏地面但有境內姦細走透消息於外人及境外姦細入境內探聽事情者盤獲到官須要鞠問接引起謀之人得實皆斬經過去處守把之人知而故縱及隱匿不首者並與犯人同罪失於盤詰者杖一百軍兵杖九十私出外境及違禁下海凡將馬牛軍需鐡貨銅錢假匹紬絹絲綿私出外境貨賣及下海者杖一百挑擔䭾載之人减一等物貨船車並入官於內以十分為率三分付告人充賞若將人口軍器出境及下海者絞因而走泄事情者斬其拘該官司及守把之人通同夾帶或知而故縱者與犯人同罪失覺察者减三等罪止杖一百軍兵又减一等私役弓兵凡私役弓兵者一人笞四十每三人加一等罪止杖八十每名計一日追雇工錢六十文入官當該官司應付者同罪罪坐所由郵驛明律遞送公文凡鋪兵遞送公文晝夜須行三百里稽留三刻笞二十每三刻加一等罪止笞五十其公文到鋪不問角數多少須要隨即遞送不許等待後來文書違者鋪司笞二十凡鋪兵遞送公文若磨擦及破壞封皮不動原封者一角笞二十每三角加一等罪止杖六十若損壞公文一角笞四十每二角加一等罪止杖八十若沈匿公文及拆動原封者一角杖六十每一角加一等罪止杖一百若事干軍情機密文書不拘角數即杖一百有所規避者各從重論其鋪司不告舉者與犯人同罪若已告舉而所在官司不即受理施行者各减犯人罪二等凡各縣鋪長專一於概管鋪分往來巡視提調官吏每月一次親臨各鋪刷勘若失於檢舉者通計公文稽留及磨擦破壞封皮不動原封十件以上鋪長笞四十提調吏典笞三十官笞二十若損壞及沉匿公文若拆動原封者與鋪兵同罪提調吏典减一等官又减一等府州提調官吏失於檢舉者各遞减一等邀取實封公文凡在外大小各衙門官但有入遞進呈實封公文至御前而上司官令人於中途急遞鋪邀截取回者不拘逺近從本鋪鋪司鋪兵赴所在官司告舉隨即申呈上司轉達該部追究得實斬其鋪司鋪兵容隱不告舉者各杖一百若已告舉而所在官司不即受理施行者罪亦如之若邀取實封至五軍都督府六部察院公文者各减二等鋪舍損壞凡急遞鋪舍損壞不為修理什物不完鋪兵數少不為補置及令老弱之人當役者鋪長笞五十有司提調官吏各笞四十私役鋪兵凡各衙門一應公差人員不許差使鋪兵挑送官物及私已行李違者笞四十每名計一日追顧工錢六十文入官驛使稽程凡出使馳驛違限常事一日笞二十每三日加一等罪止杖六十軍情重事加三等因而失誤軍機者斬若各驛官故將好馬藏匿推故不即應付以致違限者對問明白罪坐驛官其遇水漲路道阻礙經行者不坐若驛使承受官司文書誤不依題寫去處錯去他所而違限者减二等事干軍務者不减若由公文題寫錯者罪坐題寫之人驛使不坐多乘驛馬凡出使人員應乘驛船驛馬數外多乘一船一馬者杖八十每一船一馬加一等若應乘驢而乘馬及應乘中等下等馬而勒要上等馬者杖七十因而毆傷驛官者各加一等若驛官容情應付者各减犯人罪一等其應乘上等馬而驛官却與中等下等馬者罪坐驛官本驛如無上等馬者勿論若枉道馳驛及經驛不換船馬者杖六十因而走死驛馬者加一等追償馬匹還官其事非警急不曽枉道而走死驛馬者償而不坐若軍情警急及前驛無船馬倒換者不坐不償多支廪給凡出使人員多支廪給者計贓以不枉法論當該官吏與者减一等強取者以枉法論官吏不坐文書應給驛而不給凡朝廷調遣軍馬及報警急軍務至邊將若邊將及各衙門飛報軍情詣朝廷文書故不遣使給驛者杖一百因而失誤軍機者斬若進賀表箋及賑救饑荒申報災異取索軍需之類重事故不遣使給驛者杖八十若常事不應給驛而故給驛者笞四十公事應行稽程凡公事有應起解官物囚徒畜産差人管送而輒稽留及事有期限而違者一日笞二十每三日加一等罪止笞五十若起解軍需隨征供給而管送違限者各加二等罪止杖一百以致臨敵缺乏失誤軍機者斬若承差人誤不依題寫去處錯去他所以致違限者减二等事干軍務者不减若由公文題寫錯者罪坐題寫之人承差人不坐占宿驛舍上房凡公差人員出外幹辦公事占宿驛舍正廳上房者笞五十乘驛馬賫私物凡出使人員應乘驛馬除隨身衣仗外賫帶私物者十斤杖六十每十斤加一等罪止杖一百驛驢减一等私物入官私役民夫擡轎凡各衙門官吏及出使人員役使人民擡轎者杖六十有司應付者减一等若豪富之家役使佃客擡轎者罪亦如之每名計一日追給雇工錢六十文其民間婦女若老疾之人及出錢雇工者不在禁限病故官家屬還鄉凡軍民官在任以疾病故家屬無力不能還鄉者所在官司差人管領應付腳力隨程驗口官給行糧遞送還鄉違而不送者杖六十承差轉雇寄人凡承差起解官物囚徒畜産不親管送而雇人寄人代領送者杖六十因而損失官物畜産及失囚者依律各從重論受寄受雇人各减一等其同差人自相替放者各笞四十取財者計贓以不枉法論若事有損失者亦依損失官物及失囚律追斷不在减等之限乘官畜産車船附私物凡因公差應乘官馬牛駝騾驢者除隨身衣仗外私䭾物不得過十斤違者五斤笞一十每十斤加一等罪止杖六十其乘船車者私載物不得過三十斤違者十斤笞一十每二十斤加一等罪止杖七十家人隨從者皆不坐若受寄私載他人物者寄物之人同罪其物並入官當該官司知而容縱者與同罪不知者不坐若應合遞運家小者不在此限私借驛馬凡驛官將驛馬私自借用或轉借與人及借之者各杖八十驛驢减一等驗日追雇賃錢入官若計雇賃錢重者各坐贓論加二等明㑹典卷一百三十八
