body:
  text: 明㑹典卷一百七十六欽天監國初置太史監設太史令通判太史監事僉判太史監事校事郎并五官正等官後改監為院設院使同知院判五官正典簿雨𤾉司時序郎紀候郎等官洪武元年又改太史院為司天監設監令少監監丞主簿主事五官正副及監候司晨漏刻博士又置回回司天監設監令少監監丞三年始改欽天監為正五品衙門職専厯數天文地理之事四年改監令為正儀大夫少監分朔大夫五官正司𤣥大夫監丞靈臺郎五官保章正平秩郎五官靈臺郎司正郎五官挈壺正挈壺郎等散官十四年定其品級員數其散官從文職給授二十二年改監令為監正監丞為監副三十一年回回監革回回厯法亦隸本監事例凡本監習業者分為四科自五官正以下與天文生隂陽人各専一科回回官生附𨽻本監子弟仍世其業以本國土板厯相兼推算凡天文如日月星辰風雲霾霧本監各委官生晝夜占候或有變異舊例自具白本占奏正統後始會堂上官僉書同奏其觀象臺分定四面每面天文生四人専視凡本監觀星有盤係洪武十七年造又渾天璿璣玉衡簡儀俱正統四年造十一年奏准簡儀修刻黄道等度圭表壺漏俱如南京舊制又造晷影堂以便窺測調品景泰六年又造簡儀銅壺凡定時刻有漏換時有牌報更有鼓警晨昏有鐘鼓其器皆設於譙樓初皆屬順天府正統六年改屬本監輪差漏刻博士提調隂陽人如法調壺換牌其隂陽人仍從順天府各縣僉充鐘鼓改屬旗手衛撥軍擊撞凡推算日月交食本監先期備開分杪時刻并起復方位具奏禮部通行内外諸司臨時救䕶食畢本監仍按占書具奏如食不及一分與回回厯雖食一分以上俱不行救護至救護時本監官専報時候不隨班行禮凡歳造大統厯先期二月初一日進呈来嵗厯様然後刋造一十五本送禮部差人賫至南京并各布政司照様刋印凡每嵗進御覽月令厯大統厯七政躔度厯洪武間以九月初一日進後以十一月初一日進當日以大統厯給賜百官頒行天下東宫厯同日於文華殿進其儀注俱見禮部祠祭司太皇太后皇太后中宫厯俱司禮監官捧進本監仍具本奏知凡頒厯後各王府差人於内府司禮監闗領其内府各衙門亦於司禮監給散如琉球占城等外國正統以前俱因朝貢每國給與王厯一本民厯十本今常給者惟朝鮮國王厯一本民厯一百本凡造厯以洪武甲子為厯元仍依舊法推算不用捷法洪武二十九年欽定厯註永為遵守上厯註三十事東宫親王厯同祭祀祈福施恩封拜覃恩受封行賞封爵賞勞封冊封官肆赦慶賜上冊進表章頒詔冠帶註時坐向方位行幸註時宴㑹招賢出師註時出某方位選將訓兵安撫邊境遣使結婚姻嫁娶註時進人口註時納奴婢沐浴整容剃頭整手足甲療病求醫針刺入學註時安牀註時裁製註時興工動土竪柱上梁註時繕城郭開渠穿井掃舍宇般移註時栽種牧養捕捉畋獵民厯註三十二事祭祀求嗣求解除福上表章上官註時臨赴任政親民結婚姻嫁娶註時冠帶註時坐向方位㑹親友出行入學註時進人口註時安牀註時裁衣註時納財交易開市經絡沐浴剃頭療病開渠穿井修造動土竪柱上梁註時破土安𦵏移徙註時掃舍宇安碓磑栽種牧養伐木捕捉畋獵平治道塗破屋壊垣永樂七年欽定壬遁厯註六十七事祭祀祈福解除冠帶註時坐向方位宴㑹招賢選將訓兵安撫邊境結婚姻進人口註時求醫療病入學註時興工動土註時竪柱上梁註時補垣繕城廓安碓磑開市立劵交易沐浴安牀註時整手足甲緩刑獄施恩恵恤孤惸布政事捕捉施恩封拜覃恩肆赦頒詔雪寃枉賞賀遣使裁製註時上官赴任般移註時開渠穿井修置産室納畜牧養取魚慶賜行幸掃舍宇整容剃頭納采問名行恵慶舉正直出軍代征經絡求嗣上冊進表章修飾垣墻納財栽種臨政親民平治道塗出師註時出某方詔命公卿築隄防宣政事營建宫室命將出師嫁娶畋獵凡進用諸厯俱以紅黑字分辨并各有尺寸裁造親王諸厯及民厯亦各依式裁造其黄藍綾絹及黄紙裹造者俱有定式凡頒厯洪武初有司徴斂工本錢十四年免徴永樂後合用各色綾絹紙劄顔料俱先二年十二月内㑹計有無閏月各用若干奏行山東等布政司真定等七府買辦凡選郊祀時享等項日期每嵗十一月中本監堂上官擇日率厯科官午後沐浴更衣於本衙門齋宿次日早㑹選具副本請㫖仍具例行内府中路并設案題本得㫖次日早掌印官捧正本照例行至奉天門案前跪進俟御覽畢叩頭由東門出復班仍具掲帖差官賫赴禮部太常寺知㑹凡營造出師等事奉㫖選擇年月日時方位進呈若陵寢及各王府安𦵏選擇吉地奏用其差委官生各有次不許紊亂凡每嵗立春日本監差官二員往順天府候氣回監具呈依書占奏凡立春前期候氣官同順天府官赴東直門外導引芒神春牛至府凡遇聖節正旦冬至及頒詔大禮先期本監官面奏設定時鼓於文樓至期定時漏刻博士一員報時五官司辰一員立御道東雞唱五官司辰一員擊鼓漏刻博士一員登文樓上候上陞殿鳴鞭畢報時官捧時牌報卯時雞唱官唱日出卯照萬方光四表畢擊鼓五聲凡本監人員洪武六年令永逺不許遷動子孫只習學天文厯算不許習他業其不習學者發海南充軍凡本監官犯罪成化十三年奏准應為民者仍充天文生應役應發充軍者奏請處治凡本監官生有父母喪例免丁憂凡天文生除本身外再免一丁充當民差隂陽人止免本身其各門不係應役者不准凡天文生食糧月支七斗隂陽人四斗俱照醫士醫生例其譙樓隂陽人止支三斗凡天文生俱以父祖世業代補有缺舊例天下訪取仍㑹禮部考驗收用後或有投充及收用義男女壻者禮部議准不許止選世業子弟立教師教習有成遇天文生缺於内選用其教師亦量陞授𢎞治十一年令訪取世業原籍子孫并山林隠逸之士及致仕退閒等項官吏并監生生員軍民人等有能精通天文厯數隂陽地理及五星子平遁甲大定并六壬占課灼龜等術者每府不過一二人試中收充供役凡觀象臺譙樓合用燈油木炭及祭祀齋宫調品壺漏亦有油炭俱行禮部坐派順天府送用凡天下府州縣舉到隂陽人堪任正術等官者俱從吏部送本監考中送回選用不中者發回原籍為民原保官吏治罪凡本監合用紙劄成化間奏准照例遇吏部送考隂陽生中式者令其量出應用凡天文生有犯𢎞治十三年奏准徒流照舊例決杖一百餘罪收贖笞杖有力納鈔無力的決其犯竊盜掏摸搶奪等項亦刺字充警并雜犯死罪俱做工不在收贖之限凡本監俸糧初於禮部支給後從户部撥本監自行收放南京欽天監事例凡本監造厯每年六月内從禮部發到厯様印完給散南京各衙門并直𨽻各府州縣凡本監造厯紙分派應天寧國二府并浙江解納俱限六月以裏至京凡占候天象本監自洪武以來設觀星臺於鷄鳴山上令天文生分班晝夜觀望或有變異開具掲帖呈堂上官當奏聞者隨即具奏凡天文生俱以世業子弟習學考選食粮分撥各科凡天文生月糧照欽天監例太醫院國初置醫學提舉司後改太醫監又改太醫院設院使同知及典簿等官職専診視疾病修合藥餌等事洪武十四年定為正五品衙門更設太醫院令丞吏目及御醫始依文職授散官二十二年復改院令為院使丞為院判其屬置恵民藥局又於本衙門置生藥庫各設大使副使事例凡本院習業分十三科自御醫以下與醫士醫生各専一科凡本院院使院判御醫日於内府御藥房兩班輪值供事凡收受四方進貢及儲蓄上用藥品俱於内府收掌供用藥餌國初令醫官就内局修製本院官診視御脈御醫㕘看校同㑹内臣就内局合藥將藥貼連名封記具本開寫本方藥性治證之法於日用之下醫官内臣書名以進置簿厯用中書省印合縫進藥奏本既具隨即附簿年月下書名内臣收掌以憑稽考烹調御藥本院官與内臣監視每二服合為一服候熟分為二器其一器御醫先甞次院判次内臣其一器進御凡各王府差人請醫視疾本院奉㫖差官或醫士往視若文武大臣及外夷酋長有疾亦奉㫖往視其治療可否皆具本覆奏或軍中缺醫亦憑總兵巡撫官奏請撥用凡醫家子弟舊例選入本院教習醫術𢎞治五年奏復行之推堪任教師者二三人教習每季考試三年或五年堂上官一員同醫官二員考試通曉本科者收充醫士食糧當差未通曉者聴令學習一年再試三試不中者黜之若五年考試成材者多其教師奏請量加陞授凡醫士醫生洪武間各有額數其後増減不一俱於本院修合藥餌若醫官醫士仍差委各處用藥東直房醫士三十六名安樂堂醫官三員三名醫士三十司禮監醫士二名書堂醫士六名乾明門醫士三名浣衣局醫士二名天夀山醫士二名松林靈臺醫士三名團營醫官一員名醫士十二五軍營醫士三名三千營醫士四名神機營醫官一員醫士四名錦衣衛醫士三名府軍前衛醫士三名恵民局醫士三名㑹同館醫士三名大慈恩寺醫士三名宣府醫士一名紫荆闗醫士二名居庸闗醫士一名龍門千户所醫士一名萬全右衛醫士一名懐來衛醫士一名山海闗醫士一名廣寜衛醫士二名寺子峪醫士一名開原醫士一名永寜衛醫士一名獨石醫士一名倒馬闗醫士一名白羊口醫士一名凡醫士食糧月支七斗醫生月支四斗醫官先年月支二石𢎞治間照醫士例止支七斗凡各王府缺良醫從本院推舉醫士送吏部選用凡本院取充醫役者洪武以來例免原籍民差𢎞治二年令御藥房供事者免二丁本院應役者免一丁凡醫生殘疾及年七十以上不堪應役者放免凡天下嵗辦藥材俱於出産地方派納永樂以後例共五萬五千四百七十四斤成化以來其數漸増今共計一十六萬三千五百五十七斤有零蜈蚣蛇六十四條蛤蚧天雄二十一對虫蛀木𤓰二十箇浙江布政司三萬一千八百五十一斤七兩金箔一百八貼銀箔七十二貼江西布政司七千五百五十六斤一十二兩湖廣布政司四千八百四十九斤七兩七錢二分六釐白花蛇九條烏蛇十條福建布政司二千七百六十五斤一兩九錢一分四川布政司一萬六千四百二十斤八兩天雄四對廣東布政司九千九百二十九斤三兩四錢蛤蚧一十七對廣西布政司九千七百二十三斤一十兩山西布政司八千九百五十五斤四錢五分山東布政司八千七百三十八斤六兩河南布政司八千六百四十九斤四兩陜西布政司一萬一千七百四十四斤七兩遼東都司八百斤應天府三千六百五十八斤八兩鎮江府三千七百一十七斤六兩六錢赤頭蜈蚣四十五條蘇州府一萬八百七十九斤三兩松江府一千四百四十斤徽州府九百四十九斤八兩寜國府四千九百九十四斤一十兩二錢鳥爛蟲蛀下木𤓰二十箇太平府二百八十一斤七兩六錢池州府六百一十三斤鳯陽府二千七斤揚州府七百四十五斤三兩二錢淮安府三千一百二十七斤八兩廬州府八十五斤一十二兩五錢九分安慶府四百五十八斤七兩廣徳州六百三十斤滁州一千五百九十二斤一十一兩二錢五分徐州六十三斤六兩二錢三分和州二百二十三斤一十四兩永平府二百一十五斤隆慶州七百斤保安州七百斤大名府一千五百斤河間府二千一百七十七斤保定府五百斤真定府七百六十五斤凡天下解納藥材俱貯本院生藥庫以御醫二員與大使一員辨驗收放禮部仍委官一員監收至年終照例造冊二本一留本院備照一送禮部查考凡藥材如丹砂鹿茸等項先因在外鎮守等官額外進貢沿途害人成化二十三年詔禁止勿進凡軍中馬病本院給與藥餌凡天下府州縣舉到醫士堪任醫官者俱從禮部送本院考試仍委該司官一員㑹考中者送吏部選用不中者發回原籍為民原保官吏治罪凡本院合用紙劄俱令府州縣舉到醫士考中者量納應用後不行成化十八年奏准仍照舊例南京太醫院事例凡本院藥餌俱南京禮部收到湖廣等布政司解來生藥製造凡南京各營該用藥餌俱撥醫士隨病供應凡醫士醫生俱以世業子弟習學考選分撥各科凡醫士醫生月糧照太醫院例明㑹典卷一百七十六
