body:
  text: 明會典卷一百六十七通政使司洪武三年初置察言司設司令掌受四方章奏尋革十年始置通政使司正三品衙門設通政使左右通政左右參議經歷司經歷知事諸司職掌本司官職專出納帝命通達下情關防諸司出入公文奏報四方臣民實封建言陳情伸訴及軍情聲息災異等事出納帝命凡有帝命必當詳審覆奏允當然後施行通達下情凡有四方陳情建言伸訴寃枉民間疾苦善惡等事知必隨即奏聞及告不公不法等事事重者於底簿內謄寫所告緣由齎狀奏聞仍將所奉㫖意於上批寫送該科給事中轉令該衙門抄行常事者另置底簿將文狀編號用使關防明立前件連人狀送當該衙門整理月終奏繳底簿送該科督併承行該衙門回銷開拆實封凡天下臣民實封入遞或人齎到司須於公㕔眼同開拆仔細檢看事干軍情機密調撥軍馬及外國來降進貢方物急缺官員提問軍職有司官員并請㫖定奪事務即於底簿內謄寫略節緣由當將原來實封御前陳奏畢就於奏本後批寫㫖意送該科給事中收轉令該衙門抄出施行其進繳稅銀文冊勘合通關起解軍囚等項附簿明白止送該科收不須入奏關防諸司公文勘合本司置立出入文簿令各房令典分掌凡內外衙門公文到司必須辨驗允當隨即於簿內編號注寫某衙門行某處為某事公文用日照之記勘合用驗正之記關防畢令鋪兵於文簿內書名畫字遞送若行移不當及違式差錯洗補互相推調等項事重者入奏區處常事照依欽定事例在外貼送當該衙門如律在京衙門退回改正將發過公文并差錯件數月終類奏文簿繳進若各處公文事干軍情災異機密重事隨即入奏送該科給事中收如呈禀五軍六部都察院等衙門公文緊要者入奏仍用欽降勘合用使本衙門印信云寫㫖意貼送當該衙門覆奏施行若誤遞到有施行者奏訖亦貼送當該衙門無施行者亦入奏送該科給事中收照月奏凡本司發過五軍六部都察院及內外諸司衙門公文并照駁各衙門差錯公文實封等件及行移勘合原告文狀拏人起數給由人員每月類奏年終通行類數開奏事例洪武十四年令本司職專出納與內外諸司俱無文移有徑行本司者以違制論永樂四年令本司奏事雖小必聞凡每日早朝引奏天下臣民及入遞所奏事或五事七事遇大寒大暑减免奏數不一凡軍民人等一應奏告詞訟許本司參詳除謀逆機密重情無主人命全家被人殘害侵欺係官錢糧僞造寶鈔私鑄銅錢并干已事情外中間看係革前并不干已事及審出添揑等項虛情例不該奏告就於本後明白參出抄送法司該道再加詳審立案不行凡在京大小衙門但係奏出不分公事私事并在外鎮守等項內臣陳情已事巡撫都御史巡按等項御史總兵副參及分守守備備倭等項武職宣慰宣撫招討等司及府州縣等衙門一應錢糧軍馬刑名乞恩認罪繳勑等項本冊俱赴本司投進凡每月以前五府等衙門出入公文等項數目面奏送科外其給由起復官員仍奏令吏部查凡天下府州縣奏到本年雨澤本年終面奏類送户科凡本司日逐收下奏本夾板年終面奏令錦衣衛差人運送司禮監交收凡本司合用紙劄於刑部見收囚人紙劄內關用印色等項原從順天府買用後奏過於刑部支給官錢買用凡有大事命官會議及會推文職大臣本司官皆預凡有大獄命官會問及秋後審録重囚本司官皆預凡六科中書舍人行移各衙門俱經本司轉行凡尚寶司六科中書舍人官員俸糧俱從本司帶支南京通政使司事例凡南京軍民人等陳告狀詞置立底簿將狀編號用使關防明立前件連人狀送各該衙門整理皆如舊例凡南京各衙門公文出入俱赴本司掛號凡每月朔望日各衙門堂上官會議本司掌印官預凡每嵗秋後法司會各衙門官審録重囚本司掌印官預凡南京六科中書舍人行移各衙門俱從本司轉行凡南京尚寶司六科中書舍人俸糧俱於本司帶支中書舍人國初中書省設直省舍人從八品洪武九年改中書舍人正七品後中書省革更定為從七品衙門職專書寫誥勑冊符等事事例凡本衙門官無正佐例推年深者一人掌印凡王府自郡王以下至奉國中尉自王夫人以下至鄉君合給誥命俱從吏部奏准送寫凡親王郡王并妃初受封號合授金冊銀冊俱從銀作局造冊文寫完仍從本局鐫刻凡公侯伯初受封爵合給鐵劵從工部造完送寫誥文轉送銀作局鐫刻以右一面頒給左一面年終奏送古今通集庫收貯凡內外文武官應給誥勑從翰林院領寫該用軸數於御前奏過印綬監關出寫完與尚寶司及該科官同於奉天門用寶訖本衙門收貯從該部請㫖頒給凡寫完誥勑類成寶簿一品二品各一扇三品至五品共一扇六品至九品共一扇其在外官品級雖與京官相同俱列于後每年終於御前奏過送古今通集庫收貯凡誥勑軸俱南京織染局織造齎送印綬監交收本監會同本衙門官選檢收貯或不堪用仍會同參奏凡寫誥勑年月成化二十三年奉㫖照奏准年月填寫凡誥勑勘合底簿係印綬監收掌每遇該關數目赴本監依品級填寫其字號舊用二十八宿等字永樂以後改用急就章編寫凡編字號公侯伯本身并追封用仁字蕃王亦用仁字文官本身用十二支字追封用文行忠信字武臣用千字文以上每字編滿一千號仍從前續編若王府并駙馬都尉俱不編號凡寫誥勑合用紙劄筆墨具奏於司禮監關用其武官誥勑合用紙劄筆墨該兵部具奏行順天府買用凡武官誥命舊例用監生謄黃并寫誥共八十名成化十三年定用三十五名內十五名謄黃二十名寫誥凡親王之國勑符字號赴內閣謄寫凡大祀天地分官二員隨駕供事凡萬夀聖節正旦冬至及傳制傳臚等項各分官四員於奉天殿侍班凡東宫千秋令節并正旦冬至分官二員於文華殿侍班凡會試委官一員與制勑房官收掌試卷凡每日各官并監生酒飯俱光祿寺供給凡各官俸通政司關支監生月糧兵部關支凡本衙門行移各衙門俱從通政司轉行文華殿門東房别設中書舍人分直職專奉㫖書寫書籍等項內官職升遷不一不拘員數南京中書舍人後不設吏科國初總設給事中正五品洪武四年改正七品六年始分吏户禮兵刑工六科各設給事中從七品二十四年添設都給事中正八品左右給事中從八品改給事中正九品職專參駁紏劾等事後又定都給事中正七品左右給事中給事中俱從七品各科並同事例凡吏部引選文職官員掌科官一員與本部尚書侍郎同赴御前請㫖選用并看用選官印子填寫榜文凡吏部選除在外衙門官員該領赴任文憑俱先赴本科畫字定限考滿官復任同凡吏部初選有司官該領為政須知俱先赴本科畫字凡吏部纍次選過官缺除大選外每一月或兩月堂上官赴科附簿以備查考凡吏部貼黃本科官一員㑹同稽勳司官赴印綬監領貼凡吏部纍次選除過官員職名附寫文簿用寶年終本科奏送印綬監轉送古今通集庫收貯凡尚寶司奏過文職官員合給誥勑用寶本科官與中書舍人吏部驗封司官同赴奉天門監視其合追奪從吏部奏繳者亦會本科官燒燬凡長安左右門宇衛官繳到文職朝官門籍查有填注公差患病等項於次月具奏凡在京文職官員丁憂該領孝字號勘合吏部開具送科填寫各官俱先赴科畫字凡天下諸司文職官員考滿到京各具給由文冊送科稽考凡天下諸司官吏三年朝覲到京奏繳須知文冊到科查出錢糧等項數目差錯者經該官吏參奏究治凡各衙門大小官員不由吏部銓選推舉徑自朦朧奏請乞恩傳㫖升除等項本科參出施行凡內外衙門及巡撫巡按等官保舉官員未當或交通囑託濫保官員准本科俱參出施行户科事例凡有司徴收秋糧南京戶部照例刋印勘合給付糧長將本區合徴稅糧依期送納各該倉庫填寫實收數目奏繳其勘合仍送本科注銷凡各鹽運司提舉司合辦鹽課年終具辧完實數造冊奏繳就差該吏赴科注銷凡各河泊所魚課年終具辦過數目填完原降勘合奏繳送科收查凡在京各衙門放支過糧數每月造冊赴科注銷凡各府州縣管糧官員及各倉場大使等官考滿給由各親齎本冊赴科交查凡街市鋪行不拘軍民人等例各當差本科時常清理凡光祿寺該收錢糧每季本科差官一員監收凡甲字等庫官遇考滿等項本科官一員引奏將放過錢糧等物委官查盤凡應天府龍江關每年三月將批過各處進關糧米數目差吏來奏本科官引奏令該衙門查理凡户部差官監收各處糧米本科官赴司禮監填給精微勘合批文一道給付嵗滿更替回還仍將原批赴監銷繳凡遇節日等項賞賜各衙門官吏監生人等鈔錠本科官於午門裏照數給散若各科監生辦事半年已滿每人例賞胡椒折鈔亦從本科給散凡户部關給京官折俸絹布等物每月該本科官按冊磨算如有差錯者參奏凡戶部關給軍官折俸銀兩每季本科差官一員會同給散凡賞賜京衛軍士冬衣布花例出榜文本科掌科官同給事中一員捧榜面奏付長安右門守衛官領出張掛其冬衣布花本科與各科每年輪差一員會同給散凡甲字等十庫該收錢鈔等物每季本科與各科輪差官一員監收凡查盤邊方糧草本科與各科官輪差凡巡視各處牧馬草場及種苜蓿園地本科與各科官輪差禮科事例凡每日各衙門御前面奏并封進奏本等項事理俱先具印信奏目送本科查考類寫奏目送司禮監進呈凡官員人等節錢路費鈔錠及辦事已滿監生折鈔胡椒并外國賞賜衣服等件俱本科出票給賞仍面奏數目其前月總數仍於月終面奏凡御史出巡印信及鎮巡等官關防俱從本科畫字出給字號關繳凡行人序班監生差往各王府祭葬報訃伴送夷人等項該給內府精微批文俱從本科定限事畢送科銷繳凡朝參官員牙牌應改造者從禮部手本關領俱由本科出給字號凡內外給由公差官吏人等朝見本科官引奏該衙門整理凡錦衣衛差人勘提囚犯到京本科官引奏請㫖凡禮部給度僧道本科差官一員會同考試兵科事例凡兵部引選襲替武職官員掌科官一員與本部尚書侍郎御前奉㫖同選并看用選官印子凡兵部選過官員赴任俱先赴本科畫字其文憑定限給付凡內外武職比試及總小旗併鎗本科官一員會官監視定其對偶并批中否送兵部施行凡內府各門進出事件并內官出入皆有印信大小勘合填寫關防本科官編成字號并置底簿小勘合用本科印大勘合用司禮監精微印領出每三日俱給與守衛官員填寫出入事件填完小勘合送內府收大勘合送本科收以憑查考凡皇城內外守衛官軍三日更代每班各衛經歷開寫名數具奏本送本科類寫揭帖次日早掌科官於御前奏進及祭享朝賀圍宿官軍并朔望東駕侍衛官軍五府各衛俱開寫名數具啓本送本科類寫揭帖先一日於御前奏進凡揀選守衛及操練官軍本科差官一員會選凡東南西北四城兵馬司官每月三日一㸃各城守門官軍㸃過本日晚各具奏本送科類寫揭帖次日早送司禮監凡兵部造完武職貼黃及續附貼黃并中書舍人寫完武職誥勑尚寶司官用寶俱本科官一員監視其誥勑有應追奪者亦同尚寶司官燒毁凡在京各衙門公差人員合給內府批文俱赴本科關領鑰匙赴司禮監開門給付事完仍赴本科關領銷繳凡登聞鼓下所受狀詞并口外投降男子該收勇士畨人習儀該撥馬騎年例打氷打蓼草等事該撥軍士但奉㫖該本科承行者錦衣衛當直官填寫駕帖送本科僉名給與施行凡午門外直宿將軍於夜間或因祭祀遞出鑰匙或以物投下試驗警忽將軍即赴科來報早朝本科官引至御前奏知凡邊方險阻關堡并衝要地方每三年各邊官畫圖送本科收貯凡各邊鎮巡等官造獲功及陳亡官軍若出境燒荒里數并撥過官軍文冊俱送本科收查凡各邊巡撫官并南北直𨽻奏差御史印烙過馬駒及南北太僕寺苑馬寺各都司等衙門印俵過馬牛等數及天下給過驛馬數南京造過馬快等船并差過起數各造冊送科收照凡天下清軍御史清過軍士三年一造冊巡按御史及二司府州縣官問過充軍人每年一造冊送本科收照凡兵部清理在京各衛軍士本科差官一員凡每年巡視各草場牧放馬匹官軍本科差官一員凡兵部存恤京衛勾到各處軍士每月本科差官一員凡每月巡視官馬本科與各科輪差官二員凡每月單日巡視皇城宿直官軍本科與各科輪差官二員凡每月㸃閘各營操練官軍本科與各科輪差官一員凡南京內官出入公幹并皇城四門出入事件填過精微勘合將盡先行具奏兵部轉行本科將該給勘合編完字號赴司禮監用精微印并附底簿給出發南京兵科給用刑科事例凡法司送到原報并續收實在囚人數目揭帖每月三次本科早朝奏進凡法司具奏斬絞罪囚决不待時并秋後處决者本科仍三覆奏得㫖然後行刑凡擊登聞鼓訴寃并錦衣衛等衙門捉獲人犯三法司處決罪囚奉欽依者俱該錦衣衛直日官將原給駕帖填寫緣由并人犯姓名除鼓下詞狀從各科直鼓官批送外其餘俱送本科列名批鈐以憑送問處決凡法司見監斬絞罪囚在獄病故者各用手本送本科注類以備覆奏凡法司問過罪囚各用揭帖每月初一日輪報各科查對相同填寫精微文簿仍類送本科收貯凡在外問刑衙門每年將完銷過兩京法司行移勘合填寫底簿送本科收貯以備查考凡每月五城兵馬司捉獲囚數具奏送本科備照凡每月初法司問過軍職住俸京軍記罪各具報本科附簿以憑查考凡各衙門於東安等門進出一應錢糧先該本科編成字號勘合底簿户部用印發各門吏收掌將勘合比對朱墨相同仍以略節填寫底簿送本科稽考凡奉㫖差官勘問在外事情本科與各科官輪差凡嵗終法司問擬過輕重罪囚開數送本科類奏凡法司奏差勘事審録决囚等項官員都察院奏差御史巡按及奏差監生書吏人吏赴各該清軍刷卷提學巡鹽巡茶巡關等項御史處書辦各該請給內府精微批文各具手本赴本科轉給本科仍照各項批定立限期轉發各衙門給付事完各齎原批赴本科轉送內府銷繳工科事例凡工部軍器局製造軍器本科差官一員試驗凡囚人運磚贖罪工部於司禮監關領精微簿二扇法司附簿送本科每月一注以憑稽考凡工部奏差造墳抽分等項官員各該請給內府精微批文具手本赴本科轉給本科仍照批定限期給付事完各齎原批赴本科轉送內府銷繳凡南京龍江瓦屑壩二處抽分竹木等物每季將收放過數目造冊差人賫繳本科官引奏查理凡南京差軍士栽種過漆桐棕樹苗秧管領百户具數前來本科官引奏凡囚人工役運炭等項工部按季委辦事官管領遇有逃者本科官引奏挨拏凡營建監工本科與各科官輪差凡畨中走回男子收充勇士該給房價者錦衣衛官齎帖到科批寫送部凡各衙門於午門西安門進出一應錢糧該本科編成字號勘合底簿戶部用印發各門吏收掌將勘合比對朱墨相同仍以略節填寫底簿候完俱送本科稽考凡南京六畜場并在京宣課司等衙門抽分猪羊等物本科編成字號勘合用印送司禮監等衙門轉發填用六科通行事例凡每日早朝六科輪官一員於殿廷左右執筆紀録聖㫖仍於文簿內注寫本日某官某欽記相同以防壅蔽凡處置禮儀邊務等事及軍民人等陳言有關大體者掌科官奉㫖同文武大臣㑹議凡舉用文武大臣如總制總兵之類奉㫖會推掌科官皆預凡兩京大臣方靣等官有不職者俱得劾奏或大班靣劾及諸人有不公不法等事俱當劾奏凡三年天下諸司朝覲畢除黜退外其有公事未完等項俱大班劾奏凡一應題奏本內違礙事情及字樣差訛洗補迹汚等項參出該部抄行凡各衙門題奏本狀奉㫖發落事件開坐具本户禮二科俱送吏科刑工二科俱送兵科每日早朝六科掌科官同於御前進呈凡各衙門題奏發下聖㫖各該衙門堂上官一員隨赴本科批押于後凡六科每日收到各衙門題奏本狀奉聖㫖者各具奏目送司禮監交收又置文簿陸續編號開具本狀俱送監交收凡各衙門題奏過本狀俱附寫文簿後五日各衙門具發落日期赴科注銷過期稽緩者參奏凡各衛該朝官各具職名置卯厯一扇輪送各科每日早各官赴科領厯畫卯仍將前厯送科月終查考若五卯以上不到者參究凡內官內使傳㫖各該衙門補本覆奏再得㫖然後施行凡行慶賀大禮各科官十員導駕二員導表傳制導駕員數同東宫行慶賀禮導駕導箋俱二員凡每嵗大祀天地都給事中各一員入壇陪祀或分獻給事中各一員從駕供事凡郊祀慶成各科官一員於殿上侍宴凡經筵各科輪官二員侍儀凡殿試舉人掌科官充受卷等執事官凡冊封宗室及蕃王或告諭夷邦各科官充副使或正使凡三法司奉㫖於午門前鞫問罪囚許掌科官同問凡登聞鼓下每日各科輪官一員如有申訴寃枉并陳告機密重情者受狀具題夲封進如决囚之日有訴寃者受狀後批手令校尉停决候㫖凡各科官員并監生俸糧於通政司帶支凡各科官員并監生每日酒飯俱光祿寺供給凡各科合用紙劄於刑部關用印色於順天府買用凡各科行移各衙門俱經通政司轉行南京吏科事例凡直𨽻府州所屬司獄司等衙門給由官員該給文憑南京吏部考核過俱赴本科填給凡南京各衙門官丁憂除堂上官外其餘該給孝字號勘合者俱赴本科填給南京户科事例凡南京各衙門放支過糧數每月造冊赴本科注銷凡天下造到户口黃冊俱送後湖收貯本科官與南京户部官專管查理曬晾等項南京禮科事例凡南京各衙門差官等項精微批文俱赴本科附簿回日注銷南京兵科事例凡直𨽻各衛所總小旗併鎗本科官監視凡南京各教場該操軍時月本科官㸃閘凡馬快船裝載進鮮并進用物件本科官監視南京刑科事例凡每嵗秋後審録重囚本科與各科官皆預南京工科事例凡南京內府衙門及皇城門鋪等處損壞合該修理工程大者本科官與南京工部等官會勘具奏修理凡南京丁字戊字等庫軍器錢糧本科與內官同收南京六科通行事例凡紏劾言事及行移等項俱與六科同凡公差官員人等精微勘合各科俱掌管出給凡每年錦衣等衛所軍士該給冬衣布鈔各科輪散凡估計兩京光祿寺等處并監收南京甲字等庫錢糧各科輪管凡南京皇城內外守衛及京城內外守門官軍各科輪㸃凡各處解到軍人於各衛所存恤各科輪管明會典卷一百六十七
