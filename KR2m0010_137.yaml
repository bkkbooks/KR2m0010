body:
  text: 明㑹典卷一百三十七刑部十二收買紙劄本部紙劄舊例收買應用後令囚人納紙而各衙門紙劄亦從本部關給各有事例今具列于後諸司職掌凡本衙門合用奏啓本案驗行移簿籍囚人寫招服辨一應紙劄山西部掌行每季㑹計合用奏啓本等紙各若干估計合用鈔若干本部明立文案開付湖廣部於贓罰鈔內照數關支差官前去街市及客商販賣去處照依時價兩平收買數足到部堂上官用印封鈐責付庫子收領在庫聽候各部將各季用紙數目呈堂判送湖廣部立案照數關支候至季終銷用盡絶各部開稱為某事用過某色紙若干逐一開付本部將各部花銷紙數查理明白將來付附卷其餘季分如前施行事例洪武二十七年奏准問過罪囚除逃軍逃囚全家抄劄起發并劫賊外其餘官吏軍民人等俱各辦納紙劄一分每年春夏秋冬四季本衙門置立文簿一扇輪流管掌各部追到紙劄俱送該管部分附簿明白著令管庫吏典庫子收貯每月各部分合用紙劄赴該部關支應用餘剩之數季終該部呈繳本部出給長單送赴內府該庫交納取獲長單附卷天順二年令本部囚人官民紙劄俱收貯在庫每季劄委主事一員輪流掌管放支及令照磨所置立印信文簿將日逐大理寺審允回報犯人姓名備寫以慿稽考其浙江等十三司亦各立文簿一扇公同收紙令史將囚人紙劄每名追收附簿每日一次將有紙犯人開具手本二本一本送照磨所查名勾銷一本連紙送管庫主事收庫以備各衙門關支其管庫主事收放紙劄一季滿日將紙數呈堂批送山西司查照成化二年奏准囚人有力者該折奏本手本榜紙中夾紙張照依時價兩平折納收受入庫候各衙門關用每官紙一分榜紙四十張告紙一分勘合紙二十張中夾紙三十張軍民紙一分中夾紙五十張奏本紙十張手本紙五張內中夾紙每張折納手本紙二張每五張折納榜紙一張每二張半折納奏本紙一張十三年奏准各司囚人紙劄各立文卷一宗􅈬令收紙令史呈行收過并送過數目明立文案每五日一次具印信手本仍送管庫主事處交收守取印信實收附卷備收其管庫主事置立收放紙數文卷一宗收過某司紙劄若干放過某衙門紙劄若干明白立案附卷候管庫委官滿日連卷呈堂發下照磨所照刷批送山西司收照其各司紙劄文卷亦每月一次送所照刷如有隱漏不報增减紙數者呈堂究問凡問過囚人發審有名者各納紙一分文武職官正妻監生生員吏典總小旗知印承差僧道僧道官醫生天文生應襲舍人里老俱官紙軍校竈匠㕑役勇士力士及各餘丁隂陽人民人婦女俱民紙原告及訴人該納官紙者仍納官紙該納民紙者俱納民紙供明亦照例納紙凡強竊盜死罪逃軍民匠囚犯充軍遇革釋放者並免納紙凡囚犯紙劄照依時估聽其自行買納若無藉之徒及管押吏典人等通同作弊分外增騙錢物者問罪枷號一箇月發落若監追紙劄三箇月之上不能完納者放免𢎞治十年奏准吏户禮兵工五部及大理寺嵗用紙劄刑部關支不敷於都察院見收類解紙劄內關用如又不敷并刑部題奏本紙俱於兩法司支贓罰銀買辦有餘作次年之用處决重囚諸司職掌凡大理寺秋後覆奏處决重囚如本寺牒至即差皂𨽻照名於司獄司將犯人押赴法場仍令主事廳具手本㑹請監察御史等官公同處决批回附卷事例洪武元年令處决重刑須從秋後無得非時以傷生意三年令臣民有罪法當死者三覆五奏毋轍行刑宣德十年令死罪臨决須三次覆奏明白然後加刑正統元年令重囚三覆奏畢仍給駕帖付錦衣衛監刑官領校尉詣法司取死囚赴市凡秋後處决重囚內有訴寃枉者直鼓給事中接受本狀封進仍批手令校尉前去市曹暫免行刑聽候請㫖𢎞治十三年申明凡律該决不待時重犯鞫問明白曽經大理寺詳允奏奉欽依處决者各該部院并該科即便覆奏㑹官處决不必監至秋後凡殺一家非死罪三人及支解人為首在監死者除將財産斷付被殺者之家妻子流二千里仍銼碎死尸梟首示衆凡強盜殺傷人放火燒人房屋姦汚人妻女劫牢獄倉庫干係城池衙門并積至百人以上不分曾否傷人俱即奏請審决梟首示衆每嵗秋後差官分往兩直𨽻處决重囚北直𨽻一員南直𨽻江南一員江北一員每月禁刑日期初一日初八日十四日十五日十八日二十三日二十四日二十八日二十九日三十日詳擬罪名諸司職掌凡各布政司并直𨽻府州遇有問擬刑名笞杖就彼决斷徒流遷徙充軍雜犯死罪解部審録發落其合的决絞斬凌遲處死罪名各處開坐備細招罪事由照行事理呈部詳議比律允當者則開緣由具本發大理寺覆擬如覆擬平允行移各該衙門如法監收聽候依時差官審决如有决不待時重囚詳擬允當隨即具奏差官前去審决其有情詞不明或出入人罪失出入者駁回改正再問若故出入情弊顯然具奏連原問官吏提問審録罪囚明祖訓凡聽獄訟要明不明則刑罰不中罪加良善久則天必怒焉或有大獄必當靣訊庶免構陷煆鍊之弊事例洪武三十年令五府六部都察院六科通政司詹事府詳審罪囚三十一年令軍民人等犯徒流以下俱不申詳止將死罪并應議文武官員不分罪名輕重俱監候具由申呈合干上司轉達待報發落三十二年令徒流雜犯死罪充軍囚犯仍復申詳但止將原發招由轉呈候審允訖行令照依原擬發落永樂十七年令在外死罪重囚悉送京師㑹官審録洪熙元年令公侯伯五府六部堂上官內閣學士及給事中㑹審重囚可疑者仍令再問天順二年令每嵗霜降後該决重囚三法司㑹多官審録永為定例成化元年奏准內閣不必㑹同審囚十四年奏准凡真犯死罪重囚推情取具招辨依律擬罪明白具本連證佐干連人卷俱發大理寺審録如有招情未明擬罪不當稱寃不肯服辨者俱駁回再問若招情明白擬罪合律輸情服辨者本寺將審允緣由奏奉欽依准擬依律處决方才回報原問衙門監候照例具奏將犯人引赴承天門外㑹同多官審録其審録之時原問原審并接管官員仍帶原卷聽審情真無詞者覆奏處决如遇囚畨異稱寃有詞各官仍親一一照卷陳其始末來歷并原先問審過緣由聽從多官從公𠫭詳果有可矜可疑或應合再與勘問通行備由奏請定奪𢎞治七年命三法司錦衣衛堂上官凡捕獲強盜綁赴御前引奏者仍在午門前㑹問明白追贓擬罪如律備由具奏奉有欽依刑科覆奏隨即處决中間果有情可矜疑者明白上請定奪或有寃枉亦與辨明差官審録明令凡所在重刑須要追勘一切完備在京申御史臺在外從監察御史提刑按察司審録無寃有司結案待報若犯人畨異或家屬稱寃聽牒移推事例洪武十四年差監察御史分按各道罪囚凡罪重者悉送京師二十四年差刑部官及監察御史清理天下獄訟二十五年令刑部詳審在外呈詳獄囚務得真情然後差官審决惟雲南路逺令本處㑹官詳審處决永樂元年各布政司所屬死罪重囚至百人以上者差御史審决正統三年令各處巡撫侍郎審録罪囚無巡撫者巡按清軍御史審録四年令都布按三司每嵗委官㑹巡按御史審録罪囚六年令監察御史及刑部大理寺官分往各處㑹同先差審囚官及巡按御史按察司官詳審疑獄十二年差刑部大理寺官往南北直𨽻及十三布政司㑹同巡按御史三司官審録死罪可矜可疑及事無證佐可結正者具奏處置徒流以下减等發落若御史别有公務督同所在有司審録原問官故入等罪俱不追究𢎞治二年令法司每年立秋時將在外監候聽决重囚不分有無訴訟備查各囚籍貫姓名及在外見監問有無招擬一應死罪囚犯通行具奏轉行各該巡按御史㑹同都布按三司并分巡分守南北直𨽻行移差去審刑主事㑹同巡按御史督同都司府衛從公研審除情真罪當者照例處决果有寃抑者即與辨理情可矜疑者徑自具奏定奪其未轉詳者責令轉詳未問結者督同問結俱要遍歷衙門逐一研審著為定例夏月録囚事例永樂二年四月諭三法司官天氣向熱獄囚淹久令五府六部六科給事中協同疏决死罪獄成者秋後處决輕罪隨即决遣有未能决者令出獄聼候四年五月諭三法司天氣已熱除犯斬絞罪外徒流以下皆令知在聽候發落宣德二年五月六月七月節諭三法司天氣炎熱見監罪囚作急問斷該運土運磚者照例發落干礙奏請者一月一次類奏三年諭法司及北京刑部今天氣暄熱獄中一應罪囚禁錮日久即將輕重罪犯具奏發落不許時刻遲滯正統十四年春夏旱災命內臣一員公同三法司堂上官㑹審見監聽决罪囚情重者具實類奏處置天順四年令法司將見監罪囚纍訴寃枉者㑹同三法司堂上官刑科給事中各一員審録成化四年令司禮監太監㑹同三法司堂上官審録罪囚二十一年命兩京法司錦衣衛天氣炎熱㑹審見監罪囚徒流以下减等發落重囚有可矜疑及枷號者具奏定奪二十二年諭法司見今雨澤少降天氣向熱內外衙門見監罪囚恐有寃抑兩京令司禮監太監守備太監同三法司堂上官㑹審兩直𨽻差刑部郎中各一員㑹同巡按御史各處在城令巡撫巡按同三司掌印官各府州衛所令巡按御史同分巡分守官逐一審録死罪情可矜疑者具奏處置徒流以下减等發落不許遲慢𢎞治元年夏令兩法司錦衣衛將見監罪囚情可矜疑者俱開寫來看自後嵗以為常嵗報罪囚諸司職掌凡本部問發罪囚每遇年終各該部分開稱自洪武某年正月初一日為始至十二月終本部通問發過囚人若干內凌遲若干斬若干絞若干斬罪免死終身工役若干絞罪免死終身工役若干流罪若干徒罪若干充軍若干隨營若干杖罪若干笞罪若干疏放寧家若干俱付山東部通類如前案呈本部開坐奏聞事例凡法司問過輕重罪囚每年十二月開報刑科具本類奏明㑹典卷一百三十七
