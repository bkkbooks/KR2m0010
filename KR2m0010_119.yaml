body:
  text: 明會典卷一百十九兵部十四驛傳自亰師達於四方設水馬驛并遞運所以便公差人員往來其間有軍情重務必給符驗以防詐偽至於公文遞送又置鋪舍以免稽遲及應役人等各有事例今并驛遞名目具照官制開列於後後裁革不一不復詳載諸司職掌凡天下水馬驛遞運所專一遞送使客飛報軍情轉運軍需等項合用馬驢船車人夫必因地里要衝偏僻量宜設置其僉點人夫設置馬驢船車什物等項俱有定例須要常加提督有司整治或差人點視不許空歇但有人夫馬驢船車什物損壞缺少將有司并驛所當該官吏坐罪仍督併修理補買會同館事例國初改南京公館為會同館永樂初設會同館於北京三年併烏蠻驛入本館正統六年定為南北二館設大使一員副使二員內副使一員分管南館一接待各王府公差進奏人員及四裔朝貢使客原設馬驢館夫鋪陳什物俱有定額本部委官提督點視如有馬驢倒死夫役在逃鋪陳不整照例勾解買補應合給驛應得腳力者填寫勘合發館起關應付其南京會同館從南京兵部一體委官提督一各王府公差人員及遼東蓋州復州海西等衛女直朵顔三衛以至土魯畨賽瑪爾堪哈密赤斤罕東等衛回回西畨法王洮岷等處雲貴四川湖廣土官畨人等俱於北館安頓凡迤北瓦刺朝鮮日本安南等國進貢陪臣人等俱於南館安頓一四裔使臣除有例開市交易外不許往來街市交接間人違者將該管人員參送問罪一本館額設館夫四百名分屬南北二館專造飯食以供使客係順天府所屬僉充者三年一代在外府州僉充者一年一代其法司囚人問充館夫在逃者就發本館永充館夫一本館額設馬一百七十一匹驢一百三十七頭俱係順天府所屬土民及南直𨽻鎮常蘇三府浙江江西等布政司紹興南昌等府糧僉人户照依在外驛分事例集價置買以供走遞其鋪陳什物順天府所屬各照原定等第置買送部驗中發館應用一凡遇夷人朝貢之時館夫人等在館供事者俱要懸帶官給火印木牌照驗出入事畢赴本館交收𢎞治十三年奏準會同館夫供役三年轉發該管有司收當民差另僉解補不許過役更易姓名揑故僉補違者官吏一體坐罪若五年以上不行替役及近館無籍軍民人等用強攬當者俱問發邊衛充軍馬驛諸司職掌凡馬驛設置馬驢不等如衝要去處或設馬八十匹六十匹三十匹其餘雖非衝要亦係經行道路或設馬二十匹十匹五匹大率上馬一匹該糧一百石中馬一匹該糧八十石下馬一匹該糧六十石其僉點人户先儘各驛附近去處僉點如果不敷許於相鄰府縣點差如一户糧數不及百石者許衆户輳數共當一夫其收買馬匹鞍轡氊衫什物驛夫各照田糧驗數出備一各驛馬匹須分上中下三等馬膊上懸挂小牌明寫等第慿符應付一各驛馬夫須置銅鈴遇有緊急公務將懸帶馬上前路驛分專一聽候鈴聲隨即供應不致妨誤一各驛馬鞍已置木綿及氊塌軟座經過使客不許將氊衫於馬鞍上墊坐如遇隂雨方許給付氊衫雨帽事例洪武八年定馬夫免糧則例自京至宿州十三驛馬夫田租全免自百善道至鄭州免三分之二自滎陽至陜西山西北平二百二十一驛免三分之一十六年令僉蘇松嘉湖四府民占田四十頃之上者出上馬一匹三十頃之上出中馬一匹二十頃之上出下馬一匹十八年命各處驛馬不問官給自備其孳息聽令貨鬻惟為事囚軍官給馬匹有孳生者仍令報官永樂二年命僉江西八府民充馬户每糧五百石僉上馬一匹如一户糧不及數許併户僉充糧多者充馬頭責令集價買馬成化元年奏準南北直𨽻及山東等處各驛馬夫俱於本地相應人户內僉充免其賦役其南方糧僉夫役悉與開除𢎞治三年議準各處徵收馬價銀係會同館者解兵部係在外驛分者解該管官司照例支給每一夫一馬歲給工食草料銀二十五兩買補上馬一匹上鋪陳一副各給銀十五兩中馬一匹中鋪陳一副各給銀十三兩下馬一匹下鋪陳一副各給銀十兩仍督令如法買補十三年奏準南北直𨽻山東等處馬驛僉到馬頭願雇土民代役者聽若用強包攬者問罪旗軍發邊衛民并軍丁人等發附近俱充軍其有交通包攬之徒將正身姓名揑寫虛約投托官豪勳戚之家前去原籍妄拿正身家屬逼勒取財者所在官司應提問者收問應奏人員羈留奏請提問俱照前例充軍該管官司坐視縱容者參究治罪水驛諸司職掌凡水驛設船不等如使客通行正路或設船二十隻十五隻十隻其分行偏路亦設船七隻五隻大率每船該設水夫十名於有司人户納糧五石之上十石之下點充不拘一户二户相合俱驗所該糧數輪流應當事例𢎞治七年命定協濟水夫則例每船一號夫十名歲徵工食過關銀一百二十兩每三年加修理船隻鋪陳銀四十兩每十年加置造船隻鋪陳銀八十八兩其水夫從該驛雇倩本處誠實土民應當十一年議準各處水驛驛船每隻歲減水夫二名扣銀二十四兩收積在官遇修理置造之年量數支用更不加徵修理置造銀兩計天下水馬驛北直𨽻順天府順義縣順義驛良鄉縣固節驛懷柔縣古北口驛密雲縣密雲驛涿州涿鹿驛通州和合驛潞河水馬驛三河縣夏店驛武清縣河西水驛楊村驛楊青驛薊州公樂驛漁陽驛遵化縣本縣馬驛遵化驛石門鎮驛豐潤縣永濟馬驛義豐驛玉田縣陽樊驛大名府艾家口水驛濬縣新鎮水驛平川水驛內黃縣黃池水驛順德府邢臺縣龍岡馬驛內丘縣中丘馬驛廣平府永年縣臨洺馬驛邯鄲縣叢臺驛河間府河間縣瀛海馬驛靜海縣奉新驛任丘縣鄚城驛新中驛獻縣樂城驛阜城縣阜城驛青縣流河驛興濟縣乾寧驛交河縣新橋驛富莊驛景州東光驛吳橋縣連窩驛滄州磚河驛真定府恆山驛井陘縣陘山驛欒城縣關城馬驛獲