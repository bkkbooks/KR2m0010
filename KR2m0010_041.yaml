body:
  text: 明㑹典卷四十一户部二十六南京户部見今十三司帶管浙江清吏司南京左軍都督府南京水軍左衛并倉南京留守左衛并倉南京龍虎左衛南京龍驤衛并倉南京龍虎衛并倉南京應天衛并倉雲南清吏司南京府軍衛并倉南京府軍左衛并東西倉南京府軍右衛并東西倉南京虎賁左衛并倉順天府常州府應天府龍江關石灰關江東巡檢司瓜埠巡檢司南京兵部大勝關三山門水關上方門水關馴象門水關上新河鈔關廣東清吏司南京中軍都督府南京刑部南京羽林左衛南京濟川衛南京鷹揚衛并倉南京留守中衛并倉南京廣洋衛并倉太平府鎮江府保定府河間府和州福建清吏司南京後軍都督府南京長安等四門倉南京虎賁右衛并倉南京水軍右衛并倉南京驍騎右衛并倉南京龍江右衛南京留守後衛南京兵部典牧所安慶府廬州府陜西清吏司南京右軍都督府南京大理寺南京鴻臚寺南京翰林院南京羽林右衛南京留守右衛南京橫海衛寧國府滁州徐州湖廣清吏司南京國子監南京太醫院南京豹韜左衛并倉南京豹韜衛并東西二倉南京羽林前衛南京和陽衛本部軍儲倉南京教坊司廣德州山西清吏司南京興武衛并南北二倉南京龍江左衛并北倉南京江陰衛并倉南京鎮南衛山東陜西都轉運鹽使司蘇州府江西清吏司南京通政使司南京尚寶司南京都察院南京户科等六科應天府龍潭稅課局龍江裏外河泊所批驗茶引所南京五城兵馬司都稅司聚寶門宣課司江東宣課司太平門稅課司龍江宣課司龍江稅課局聚寶門朝陽門分司南京旗手衛并東西二倉南京江淮衛南京金吾後衛并東西南三倉南京金吾前衛南京金吾左衛廣西清吏司南京前軍都督府南京內官監南京司禮監南京太常寺南京光祿寺南京神樂觀南京神帛堂南京織染局孝陵神宫監南京御馬監南京供用庫南京兵仗局南京酒醋麵局南京犧牲所南京甲乙丙丁戊字庫南京承運寶鈔廣惠廣積贓罰庫南京瀋陽左衛南京瀋陽右衛并倉南京留守前衛徽州府淮安府河南清吏司南京禮部南京欽天監南京廣武衛南京飛熊衛南京英武衛孝陵衛南京牧馬千户所鳯陽府松江府山東清吏司南京兵部南京太僕寺南京錦衣衛并烏龍潭倉南京中軍都督府中和橋馬草場南京金川門馬草場平凉中護衛安東中護衛瀋陽中護衛遼東都司揚州府兩淮都轉運鹽使司四川清吏司南京工部龍江鹽倉檢校批驗所南京武德衛南京神策衛并倉南京金吾右衛南京天策衛并南北二倉南京府軍後衛并倉池州府順德府貴州清吏司南京吏部大名府真定府民科事例凡各處造到黃冊每年終本部備行後湖管冊主事將查過黃冊起數造冊進繳凡各處十年一造黃冊解部完日本部差官四員㑹官清查具奏凡各處軍民户籍不明解人前來挨查後湖黃冊不許將概府州縣全抄止許查本户糧田軍民丁産來厯明白即便發回亦不許因而帶抄别户以泄事機凡各處起運供應等項數目浙江布政司南京各衛倉秋糧米三十萬石南京內府供用庫白熟粳米四千石南京丙字庫夏稅串五絲二萬兩荒絲二萬兩中白綿三千兩南京承運庫農桑絹三千五百九匹五尺九寸三分八釐八絲二忽五微南京各場馬草一十九萬包常州府南京各衛倉米四千七百二十七石二斗七升南京光祿寺次等白粳米六千石南京神樂觀糙粳米五百石南京國子監白熟粳米三千五百石糙粳米二千五百石黃豆一百石南京犧牲所菉豆六百石南京內官監白熟細米四十四石南京公侯駙馬伯并五府六部都察院等衙門米四萬三千石每米一石或隨時價折銀七錢南京倉小麥一萬石每石或折銀四錢南京山川壇籍田祠祭署小麥一百六十石南京庫麻布二千七十七匹二丈五尺六寸五分一釐一毫南京內府供用庫細稻草一萬五千包南京定場馬草一十三萬包南京酒醋麵局細稻草一萬五千包南京光祿寺蜂蜜一千五百斤南京寶鈔廣惠庫商稅魚茶課鈔二十六萬三千八十九貫八百二十四文錢五十二萬六千一百八十二文鎮江府南京各衛倉秋糧米五千石南京光祿寺蜂蜜五百斤南京定場馬草三萬七千包太平府南京御馬監黑豆五百石菉豆二百石南京各衛倉秋糧米二千六百石黃豆二千石南京神樂觀黃豆一百六十石南京光祿寺菉豆四百四十石南京犧牲所黃豆二百石南京倉小麥二千五百石南京酒醋麵局小麥一百石南京庫農桑絹一百一十六匹二丈六尺三寸九分四釐南京御馬監細稻草一萬包南京定場馬草一十萬包廬州府南京御馬監細稻草一萬包南京定場馬草二萬包安慶府南京各衛倉秋糧米一萬四千石南京光祿寺司牲司馬草三萬包南京御馬監細稻草五千包南京定場馬草三萬包福建布政司南京承運庫夏稅農桑絹六百匹南京寶鈔廣惠庫錢鈔六百六萬八千七百四十三貫六百七十文南京內府速香五年一次㑹計一千一百三十七斤八兩寧國府南京酒醋麵局黃豆五百二十石南京各衛倉豆一萬三千九百八十石米一萬石南京國子監小麥一百石南京光祿寺蜂蜜一千斤南京倉小麥一萬石每石或折銀四錢南京庫農桑絲折絹三十匹二尺京庫折銀草五十七萬包每包折銀三分本色草二十萬包滁州南京犧牲所糙粳米七百二十石稻穀五十石准米二十五石南京內府供用庫芝麻七百石黃蠟三百斤南京各衛倉米二十石京庫折銀草一萬一千包每包折銀三分本色草一萬包南京犧牲所細稻草一萬五千包徐州京庫折銀草五萬包湖廣布政司南京各衛倉米三十一萬石南京甲字庫白綿布一十萬匹南京丙字庫綿花絨五萬斤南京承運庫農桑絹四千九百九十二匹一丈九尺二分七釐五毫五絲南京廣惠庫錢鈔三百四十七萬二千七百四十三貫南京國子監供用乾魚二萬二千一百二十五斤廣德州南京各衛倉米五千石本部小麥二千五百石每石折銀四錢南京神樂觀芝麻三十石南京內府供用庫黃豆三百石菉豆三百石黃蠟八百三十斤葉茶八百斤南京承運庫夏稅絲一百一十六斤二錢九分六釐二毫農桑絹一十九匹一丈六尺七寸南京內府細稻草二萬五千包各場草二萬包蘇州府南京公侯駙馬伯并五府六部都察院等衙門米二萬七千九百五十二石南京光祿寺白熟粳米六十八石次等白粳米六千石白熟糯米一千三百石南京酒醋麵局白熟糯米八百石南京各衛倉米五萬九千四百一十二石南京神樂觀米八百石南京倉折銀小麥一萬石每石折銀四錢南京承運庫農桑絲折絹六百四十匹二丈九寸三分三釐南京光祿寺蜂蜜一千九百斤南京定場草一十四萬包南京內官監齊頭稻草一千束南京內府供用庫燈草三百斤南京寶鈔廣惠庫魚課鈔二萬二千八百五十錠一百二十六文江西布政司南京各衛倉米四十七萬石南京庫濶白綿布一十萬匹准米一十萬石濶白苧布七萬匹准米四萬九千石苧布一千三百四十一匹二丈四寸户口鈔四百二十七萬九千五百八十五貫二百五十文錢八百五十五萬六千二百二十七文應天府孝陵神宫監糙粳米五百石白熟糯米六十石准糙粳米六十六石芝麻五十石黃豆三百石菉豆四十石稻皮四十石准米二石稻穀六百石准米三百石南京酒醋麵局菉豆二十石稻皮二百石准米一十石南京光祿寺黃豆一千五百五十三石芝麻六十石稻穀八百四十石准米四百二十石粟穀一十石准米五石南京國子監菉豆一百石南京長安等四門倉糙粳米一萬四千五百石南京各衛倉米三萬二千五百九十二石孝陵神宫監小麥六十石南京酒醋麵局小麥七百石麥穩一百石准小麥一十石南京庫絲綿折絹一千二百一十四匹一尺六寸九分二釐八毫南京倉小麥六千二百石南京光祿寺小麥六百石南京庫農桑絲折絹一百四十三匹二尺七寸三分四釐四毫南京內府供用庫黃白蠟二千斤蘱草二千斤蒲杖二千斤南京光祿寺蜂蜜一千斤孝陵神宫監細稻草一萬包南京定場草五萬一千二百九十二包徽州府南京光祿寺小麥六百石南京倉小麥二千三百石每石折銀四錢南京承運庫人丁絲折絹八千七百七十九匹四尺三分三釐二毫農桑絲折生絹一十五匹一丈四尺七寸南京內府供用庫芝麻八百石黃蠟二千斤白蠟三百五十斤芽茶四千斤葉茶四千斤南京各衛倉米三萬二千石南京光祿寺蜂蜜一千二百斤淮安府南京各衛倉米六百二十五石南京定場細稻草一十六萬五千包松江府南京公侯駙馬伯并五府六部都察院等衙門米共五萬七千石南京光祿寺次等白粳米七千石准糙粳米七千七百石白熟糯米一千石准糙粳米一千一百石南京神樂觀糙粳米七百石南京倉小麥一萬五千石每石折銀四錢南京庫絲綿折絹六百九十七匹三丈一尺五寸七分農桑絲折絹一百六十七匹二丈一尺六寸一分六釐南京各衛倉米九千五十八石南京光祿寺蜂蜜一千五百斤南京定場草六萬三千包鳯陽府南京定場草九萬包揚州府京庫折銀草二十二萬包每包折銀三分南京定場草一十萬七千八十包南京錦衣衛馴象千户所南京光祿寺夏稅畨麥六十石四斗八升四合五勺九抄五撮九圭二粟四微兩淮都轉運鹽使司南京光祿寺樣鹽二千斤青白鹽四萬斤孝陵神宫監白鹽三千斤南京內府供用庫青白鹽二萬斤池州府南京御馬監豆五百石南京長安等四門倉米四千二百七十六石南京各衛倉米一萬五千石黑豆一萬四千五百二十四石南京神樂觀小麥六百石南京內府供用庫芽茶一千斤黃蠟五百七十五斤南京光祿寺蜂蜜三百斤南京定場細稻草三萬包和州南京犧牲所糙粳米七百二十石南京內府供用庫黃蠟一百七十斤葉茶二百斤南京神樂觀細稻草一千四百四十包魚課鈔四千一百一十三錠四貫六百文龍江鹽倉每年進納南京各衙門鹽數南京內官監青鹽三千五百斤鹽包三千五百箇南京太常寺祭祀潔净白鹽一百九十斤六兩南京神樂觀青鹽三千斤凡各衛所馬草每年二月本部查勘㑹計該用數目五月咨户部定奪凡年例錢糧每年五月本部差監生赴內府供用庫㑹計移咨戶部定奪凡各處兌運糧每嵗本部選差員外郎或主事南直𨽻一員浙江一員湖廣一員江西一員督同各司府州縣掌印官并分巡分守管糧官員依限徵兌凡南京錦衣衛馴象所養象蘆根茭草令應天等府於嵗糧額內改撥大小麥隨糧運赴本衛象房與稻草相兼支用度支科事例凡賞賜京衛軍士夏冬布鈔每年行移該衛造冊繳報徑赴內府該庫於四月關支夏布八月關支布鈔本部委官一員管理年終赴京復命凡月糧留守五衛入伍恩軍及種苜蓿豌豆并看船恩軍有家小者月支糧一石無家小者四斗牧馬千户所養馬恩軍有家小者月支糧一石隻身四斗留守左衛看守朝陽門桐樹棕樹恩軍有家小者月支糧一石隻身五斗留守左等五衛入伍恩軍照旗軍例支月糧操練守城旗軍力士校尉有家小者月支糧一石無家小者六斗錦衣等衛屯軍不論新舊選操備者每年十月至三月赴操支與食米五斗四月至九月下屯住支選去運糧者二月至七月各支行糧其月糧住支錦衣衛舍人餘丁選操備者月支米三斗看倉餘丁月支口糧三斗操備舍餘月支糧四斗巡江官軍口糧沿途支給馬快船軍行糧六箇月共三石六斗餘丁行糧共一石八斗俱於南京倉支給各衛所運糧軍餘全支本色米一石寶鈔提舉司鈔紙匠月支米五斗凡各衛所官吏旗軍月支