body:
  text: 明㑹典卷九十七禮部五十六朝貢二事例朝鮮國朝鮮古高麗國洪武二年國王遣使奉表賀即位請封貢方物五年令三歲或一歲遣使朝貢二十五年更其國號曰朝鮮永樂以來每歲聖節正旦皇太子千秋節皆遣使奉表朝賀貢方物其餘慶慰謝恩等項皆無常期若朝廷有大事遣使頒詔於其國其國王請封亦遣使行禮貢物金銀器皿各色苧布白細花席人參豹皮獺皮黄毛筆白綿紙種馬每三年五十疋安南國洪武二年遣使朝貢因請封爵詔封爲安南國王永樂四年以其臣簒立發兵討平之宣徳間遣使來謝罪請命因宥而封之今三年一朝貢别有進中宫東宫方物其或以慶慰謝恩等事來貢者不在三年一貢之例朝廷有大事遣使頒詔於其國其國王請封亦遣使行禮貢物金銀器皿薰衣香降真香沉香速香木香黒線香白絹犀角象牙紙扇暹羅國洪武四年遣使來朝貢進金葉表并方物賀正旦八年遣使賫詔及印綬往賜之十六年給勘合文册凡中國使至必照騐相同永樂元年遣使乞量衡爲國中式自後定例每三年一朝貢貢物象象牙犀角孔雀尾翠毛龜筒六足龜寶石珊瑚金戒指片腦米腦糠腦腦油腦柴檀香速香安息香黄熟香降真香羅斛香乳香樹香木香烏香丁香阿魏薔薇水丁皮碗石紫梗藤竭藤黄硫黄沒藥烏爹泥肉豆䓻胡椒白豆䓻蓽撥蘇木烏木大楓子苾布油紅布白纒頭布紅撒哈剌布紅地絞節智布紅杜花頭布紅邊白暗花布乍連花布烏邊葱白暗花布細棋子花布織人象花文打布西洋布織花紅絲打布剪絨絲雜色紅花被面織雜絲打布紅花絲手巾織人象雜色紅花文絲縵琉球國洪武間其國中山王山南王山北王皆遣使奉表箋貢馬及方物二十五年中山王遣子姪入國學永樂以來國王嗣立皆請命册封自後惟中山王來每二年許朝貢一次每船一百人多不過一百五十人貢物馬硫黄蘇木胡椒螺殻海巴刀生紅銅錫牛皮擢子扇磨刀石瑪瑙烏木降香木香一貢物内象牙等物進收硫黄蘇木胡椒運送南京該庫馬就於福建發缺馬驛站走遞磨刀石發福建官軍收貯占城國洪武二年遣使朝貢詔封爲占城國王四年遣使奉金葉表來朝貢十六年復遣子來賀聖節乃遣使賫與勘合文册二十四年復來朝貢以其臣弑立命絶之永樂後其國與諸國皆來朝貢始定每三年一來正統後其國襲封遣使行禮貢物象象牙犀犀角孔雀孔雀尾橘皮抹身香龍腦薰衣香金銀香竒南香土降香檀香栢木燒碎香花棃木烏木蘇木花藤香蕪蔓畨沙紅印花布油紅綿布白綿布烏綿布圓璧花布花紅邊縵雜色縵畨花手巾畨花手帕兠羅綿被洗白布泥真臘國洪武六年遣使來貢後朝貢不常貢物象象牙蘇木胡椒黄蠟犀角烏木黄花木土降香寳石孔雀翎日本國洪武七年遣僧人來朝貢以無表文却之其臣亦遣僧人貢馬及茶布刀扇等物以其私貢仍却之十四年國王遣使來復却其貢僧人俱發陜西四川各寺居住三十五年復來朝貢後定爲十年一來貢貢物馬盔鎧劒腰刀鎗塗金粧彩屏風洒金厨子洒金文臺洒金手箱描金粉匣描金筆匣抹金提銅銚洒金木銚角盥貼金扇瑪瑙水精數珠硫黄蘇木牛皮爪哇國洪武三年遣使貢方物并納元所授宣諭十四年上金葉表來貢及黒奴三百人後絶其貢永樂二年其國東王遣使朝貢且請印章命鑄鍍金銀印遣使賜之正統八年定每三年一貢自後朝貢無常貢物胡椒蓽茇蘇木黄蠟烏爹泥金剛子烏木畨紅土薔薇露竒南香檀香麻滕香速香降香木香乳香龍腦血竭肉豆䓻白豆䓻藤竭阿魏蘆薈没藥大楓子丁皮畨木鼈子悶虫藥碗石蓽澄茄烏香寶石珎珠錫西洋鐡鐡鎗摺鐡刀苾布油紅布孔雀火雞鸚鵡玳瑁孔雀尾翠毛鶴頂犀角象牙龜筒黄熟香安息香𤨏里國洪武五年遣使奉金字表文朝貢并圖其土地山川以獻貢物馬紅撒哈喇紅八者蘭布紅畨布覬木里布白苾布珠子項串西洋𤨏里國洪武三年遣使來朝進金葉表文及方物永樂元年復遣使來朝貢物黄黒虎馬明㑹典卷九十七
