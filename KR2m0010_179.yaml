就行該府兵部提發歸結起解贓罰凡各司問過犯人所受贓物或金或銀或錢鈔段匹等件照數於犯人名下追足責付庫子下庫收貯按季各司關官一貟㸃閘辨驗無僞細開各起犯人原受金銀鈔段等件具呈本㕔備呈該府出給長單責令原管官員并經手庫子進赴內府贓罰庫交納足備取獲實收附卷存照月報軍官凡各司見行監門為事軍官每月初旬分豁某衛指揮千百户衛所鎮撫為某事某年月日入監逐一開呈本㕔備呈該府以憑具奏處決重囚凡各司問過重囚除十惡決不待時外有該秋後處決者發下司獄司牢固監收候大理寺秋分後覆奏聞訖回報各司即將合決犯人押赴法場仍具手本㑹請監察御史刑部大理寺等衙門公同處決批回附卷詳擬罪名凡各都司據各斷事司問擬犯人招罪明白備呈該府定奪各府連呈判送五軍斷事官詳擬本㕔連案送該司承行該司隨即抄案參詳所問招詞或原擬笞杖徒流絞斬罪名比律允當具本備開原發事由問擬招罪照行事理牒繳大理寺覆擬候平允回報到司連案繳呈本㕔具呈該府轉行各都司如擬施行雜行工役囚人凡各司問擬囚人犯該笞杖徒流准工者開坐招犯具呈本㕔編立字號造冊二本一本進繳內府工科一本連囚牒發工部轉發工役候工滿本部仍將各囚送回本㕔查照原擬工限相同扣算工程無缺明白具手本赴工科於進繳字號冊內銷訖原號就將囚人引赴承天門叩頭疏放官吏俸給凡五司并司獄司官吏俸給按月初旬呈申到㕔同將本㕔官吏俸給通行造冊一本備開官吏姓名合得俸糧數目牒繳吏部主事㕔照數放支本㕔仍出印信俸帖差人賫領前去吏部倉依數開支施行公用紙劄凡本㕔并五司合用紙劄於官收贓罰鈔內關支差官一員照依按月時估價值兩平收買於各宗卷內銷用仍將用過紙數盡實花銷明白附卷牢獄司獄司額設司獄二員専一監收五司見問囚人驗罪輕重如法枷鎖按月五司輪委官一員親臨提調其監禁事理並與刑部同分門衙門左司在京驍騎右衛英武衛鎮南衛龍虎衛留守左衛水軍左衛羽林左衛瀋陽左衛瀋陽右衛府軍左衛在外浙江都司山東都司遼東都司右司在京府軍右衛水軍右衛留守右衛虎賁右衛廣武衛武德衛在外陜西都司四川都司廣西都司貴州都司雲南都司中司在京旗守衛和陽衛廣洋衛留守中衛牧馬所神䇿衛應天衛府軍衛虎賁左衛在外直隸衛所河南都司前司在京豹韜衛龍江衛飛熊衛金吾前衛府軍前衛留守前衛天䇿衛龍驤衛在外湖廣都司江西都司廣東都司福建都司福建行都司後司在京錦衣衛金吾後衛府軍後衛興武衛鷹揚衛江隂衛橫海衛留守後衛䝉古左衛䝉古右衛在外北平都司北平行都司山西都司山西行都司南京中軍都督府五府建置職掌已見中軍都督府永樂遷都後命中府掌府事官守備南京通行節制南京衛所洪熙元年始以內臣同守備宣德十年設參贊機務官景泰三年添設協同守備官凡守備協同用公侯伯都督參贊以文臣兼初無定職後多委南京兵部尚書其職掌具載於後所屬并節制衛所留守中衛神䇿衛廣洋衛應天衛和陽衛牧馬千户所已上原係本府所屬錦衣衛旗手衛金吾前衛金吾後衛金吾左衛金吾右衛府軍衛府軍後衛府軍右衛府軍左衛羽林左衛羽林右衛羽林前衛虎賁左衛孝陵衛江淮衛濟川衛左軍所屬十衛右軍所屬五衛前軍所屬七衛後軍所屬五衛已上並聽節制事例凡京城各門鎖鑰牌面俱本府收掌其晨昏啓閉交代牌鎖及各衛發牌長巡撞門等項悉如舊制凡裏外各城門每歲春秋二季㑹同內守備協同參贊官巡視其守把官軍有老弱不堪及事故者具奏㑹同選補凡皇城守衛官軍委留守五衛官照例巡㸃有不到者先行提問仍按季類本奏聞遇缺照例選補凡孝陵墻垣守備官不時親行巡視凡大小教場操練軍士新江口操習戰船神機營演放火器俱各府公侯伯都督及都指揮等官専管遇該操日守備官㑹同內守備參贊等官親詣閲視凡各營操備官軍并馬匹數目每年二次奏報地方圖本及軍馬文冊每三年一次奏報凡龍江大勝江淮新江口等關不時差官巡㸃其浦子口九江等處每嵗差官巡㸃二次凡兵仗局造完一應軍器㑹同內守備等官驗視每嵗進貢黃船差官監撥凡武學官生課業每月㑹同南京兵部堂上官比較南京及直隸衛所總小旗併鎗照例㑹同監併凡地方盜賊每年委各衛官分行緝捕南京各衛屯田地方奏准専設官一員巡視凡南京錦衣衛巡江官回還具報捉獲鹽徒盜賊名數五城兵馬司應天府上元江寧二縣捕盜官及江東等巡檢司悉聽督理凡南京户部於水次兌支官軍俸糧差官監兌工部龍江瓦屑壩抽分竹木局每季具抽分數目以憑奏報凡南京一應安插夷人督令應天府屬縣依時稿勞凡守備一應機務每日㑹同參贊等官於守備㕔署理畢仍理府事凡每月朔望日守備參贊等官及各府堂上官㑹同內守備官議合行事務凡守備㕔奏准添除理辦軍務南京通政使司經歷一員審事鎮撫或千百户一員承行書辦掾史四名南京左軍都督府所屬留守左衛鎮南衛水軍左衛驍騎右衛龍虎衛英武衛瀋陽左衛瀋陽右衛龍虎左衛龍江右衛南京右軍都督府所屬留守右衛虎賁右衛水軍右衛武德衛廣武衛南京前軍都督府所屬留守前衛龍江左衛龍驤衛飛熊衛天䇿衛豹韜衛豹韜左衛南京後軍都督府所屬留守後衛橫海衛鷹揚衛興武衛江隂衛事例凡各府掌府事及協同管事官各一員分理所屬衛所軍務或奉勑管領大教場及江上操備等事其衛所仍聽守備衙門節制施行明㑹典卷一百七十九
