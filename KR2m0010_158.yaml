body:
  text: 明會典卷一百五十八工部十二都水清吏司諸司職掌郎中員外郎主事掌天下陂池川瀆之政令河渠國朝重水利凡閘壩陂池橋道之事具載諸司職掌永樂遷都後尤重漕運故河道洪泉等項有關漕事者事例甚詳今具列於後諸司職掌凡各處閘壩陂池引水可灌田畝以利農民者務要時常整理疏浚如有河水横流泛溢損壞房屋田地禾稼者須要設法隄防止遏或所司呈稟或人民告訴即便定奪奏聞若隸各布政司者照會各司直隸者劄付各府州或差官直抵處所踏勘丈尺闊狹度量用工多寡若本處人民足完其事就便差遣倘有不敷著令隣近縣分添助人力所用木石等項於官見有去處支用或發遣人夫於附近山場採取務在農隙之時興工毋妨民業如水患急於害民其功可卒成者隨時修築以禦其患計天下河道盧溝河盧溝河出山北代州泛溢輒壞民田廬宣德以來每河岸衝決輒命官修築𢎞治二年命内官及文武官各一員發軍民夫修治又命給事中御史各一員同管理工役滹沱河滹沱河出真定府西山天順以來每決輒命官修築𢎞治二年命真定等府衛發軍民同築大通河大通河在京城東自前元導昌平白浮甕山諸泉至通州高麗莊長一百六十餘里每十里置一閘蓄水通舟以免漕運陸輓之勞至國朝永樂以來諸閘猶多存者仍設官夫守視成化間命文武官疏浚以通糧運稍通復止而運河亦賴以濟遇有淤淺隨時挑浚白河白河在通州其源出口外經密雲縣合大通榆渾諸河凡三百六十里至直沽入海每決輒發丁夫修築於淺處設鋪舍置夫甲專管挑浚舟過則招呼使避淺而行自此而南凡運河淺鋪以次而設薊州河薊州軍餉國初每嵗用遮洋船出海轉運而至風波甚險𢎞治初議發軍夫萬人鑿河四十里以免海運每三年一次修浚衛河衛河元名御河出河南輝縣至臨清州下直沽入海長二千餘里今為運河每旱乾水溢輒發州縣丁夫修治沁河沁河出山西沁源縣由太行山麓至河南原武縣黑洋山與河汴合流至徐州以濟徐吕二洪景泰五年於黑洋山北黄河缺口開河以接舊道其水利深淺尺寸管洪官每季奏報汶河汶河出山東泰安州萊蕪縣原山南從濟水西北流入海元於寧陽縣堽城之左築壩遏之南流至今濟寧州合沂泗二水以達于淮永樂九年修舊壩復於東平州戴村築新壩而汶盡入漕河至分水龍王廟前四分南流六分北流其南有洸河一道亦入漕河黄河黄河發源載于元史其流至河南散漫泛溢至山東峻急衝決河防之法歴代有之正統十三年河溢滎陽縣自開封府城北經曹濮州陽穀縣以入運河至兖州府沙灣之東大洪之口而決諸水從之入海景泰四年命官塞之乃更作九堰八閘以制水勢復於開封金龍口筒瓦廂等處開渠二十里引河水東北入運河𢎞治二年復決金龍口東北至張秋鎮入運河而紅荆口并陳留通許二縣水俱淤淺復阻糧道命官塞之五年復決命内臣及文武官徃治又決張秋運河水盡入海發丁夫數萬於黄陵岡南浚賈魯河一帶分殺水勢下由梁進口至丁家道口會黄河出徐州流入運河又從黄河南浚孫家渡口别開新河一道導水南行由中牟至潁州東入于淮又浚四府營淤河由陳留縣至歸德州分為二派一由宿遷縣小河口一由亳縣渦河會于淮又從黄陵岡至楊家口築壩堰十餘并築大名府三尖口等處長隄二百餘里及修南岸干家店筒瓦廂等處隄一百六十里始塞張秋更名曰安平鎮又於河東置減水石壩下分五洞以洩水勢遇有淤塞損壞管河官隨時修治金龍口今名荆隆口南旺湖南旺湖在山東濟寧州周圍一百五十餘里中為二長隄西隄設斗門上有橋外蓄水號曰水櫃隨時啓閉以濟運河遇有淤塞管河官隨時挑浚昭陽湖昭陽湖北屬山東滕縣南屬沛縣周圍八十餘里納諸縣水湖口置石閘放水入薛河由金溝口以達運河徐州洪徐州洪在徐州為運河要害亂石峭利凡百餘步又名百步洪成化四年命官鑿石又甃石路長一百三十餘丈二十年置石壩長八十丈遇有損壞管河官隨時修築吕梁洪吕梁洪在徐州東南六十里有上下二洪相距七里亦運河要害成化八年命官甃二石隄共長七十餘丈十六年命官築石壩長一百六十五丈復於壩西築隄二十餘丈洪東甃石路四百二十丈遇有損壞管河官隨時修築管家湖管家湖在淮安府城西門外舊有隄永樂十四年命官於湖内築長隄以便運舟隨時修築寶應諸湖自寶應縣至槐樓南諸湖相接西抵泗州盱眙縣界皆運河所經湖東有隄長三十餘里洪武九年用磚修高家潭等處成化二十一年造石隄漸修至二十餘里其南高郵邵伯諸湖皆有石隄每嵗壞輒修築康濟河高郵湖運河所經舊有隄長三十餘里舟行湖中被風觸隄徃徃破壞𢎞治三年命官於湖之東别開河一道以避其險名曰康濟河南北各置閘以時啟閉又用磚石修築東岸浙西諸水浙西諸水太湖為大納六府溪澗港瀆之水注於江河以入于海每水道壅塞或下田不洩長洲吳江常熟諸縣多被渰没永樂二年命官徃治自嘉定縣劉家港徑入于海常熟縣白茅港徑入于江乃浚吳淞南北岸安亭等浦引太湖諸水入劉家白茅二港使直注江海又浚松江府范家浜至南蹌浦口上接大黄浦以達湖􅍩之水𢎞治七年復命官發民夫二十萬自吳江至長橋導太湖之水散入澱山陽城昆承等湖又開吳淞江并大石趙屯等浦洩澱山湖水由吳淞江以達于海開白茅港并白魚洪鮎魚口諸處洩昆承湖水以注于江又開七浦鹽鐵等塘洩陽城湖水以達于海開湖州府漊涇洩天目諸山之水自西南入于太湖開常州府北瀆洩荆溪之水自西北入于太湖又開各斗門以洩運河之水由江隂以入于江泉兖州府東平州九泉獨山泉安圏泉鐵鈎