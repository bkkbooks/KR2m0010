body:
  text: 明㑹典卷五十四禮部十三王國禮二朝見明祖訓凡朝臣奉使至王府或因事經過見王並行四拜禮雖三公大將軍亦必四拜王坐受之若使臣道路本經王國故意迂廽躲避不行朝王者斬凡王府文武官並以清晨至王府門侯見其王所居城內布政司都指揮司并衛府州縣雜職官皆于朔望日至王府門候見若有事召見者不在此限事例洪武十八年定每日王府官屬常朝依文武左右班立遇朔望本處守禦衛分及府州縣等官朝見各照品級依文武東西列班行叩頭禮畢四品以上及長史紀善升殿五品以下于丹墀東西序立北向若有事召見者不在朔望之限又王府凡有辭見官員人等每日早晚俱引見成化三年續定凡京官公差出使在外道經王府報名見辭如遇朔望三司等官至府候見公差出使亦詣府隨班行禮若進表祭祀係應行禮儀出使公差官不必隨同行禮表箋明祖訓凡正旦遣使進賀表箋王具冕服文武官具朝服滌寶用寶訖置表于龍亭王率文武官就位王于殿前臺上文武官于臺下行十二拜禮畢王送表出宫城門止離五丈地文官送出國門武官從王還宫凡進賀表箋皇太子親王于天子前自稱曰長子某第幾子某王某稱天子曰父皇陛下稱皇后曰母后殿下若孫則自稱曰長孫某封某第幾孫某封某稱天子曰祖父皇帝陛下稱皇后曰祖母皇后殿下若天子之弟則自稱曰第幾弟某封某稱天子曰大兄皇帝陛下稱皇后曰尊嫂皇后殿下若天子之姪則自稱曰第幾姪某封某稱天子曰伯父皇帝陛下叔父皇帝陛下稱皇后曰伯母皇后殿下叔母皇后殿下若封王者其分居伯叔及伯叔祖之尊則自稱曰某封臣某稱天子曰皇帝陛下稱皇后曰皇后殿下若從孫再從孫三從孫自稱曰從孫某封某再從孫某封某三從孫某封某稱皇帝曰伯祖皇帝陛下叔祖皇帝陛下皇后曰伯祖母皇后殿下叔祖母皇后殿下事例洪武十八年定凡遇正旦冬至預期進賀表箋萬夀聖節預期進賀表文俱行十二拜禮其日清晨設龍亭于正殿中設儀仗大樂于露臺西設表箋案于龍亭前設香案于表箋案前進表箋使者立于香案東捧表箋官立于香案西設香案亭于承運門中道設王拜位于露臺上百官拜位于丹墀王冕服就位百官朝服隨班班齊贊鞠躬樂作四拜平身樂止引禮啓請王詣香案前跪贊百官皆跪執事者以表箋跪授王王受以授使者跪受置龍亭訖俯伏樂作平身樂止復位贊鞠躬樂作四拜平身樂止啓請王搢圭贊百官搢笏鞠躬三舞蹈跪山呼者三俯伏樂作興又四拜樂止禮畢儀仗鼓樂前導百官朝服送至郊外王送至宫城門就回護衛官從王還宫凡遇特進中宫箋文王冕服百官朝服隨班俱行十二拜禮陳設如前儀班齊四拜啓請王詣香案前跪百官皆跪執事者以箋跪授王王受以授使者使者跪受置龍亭訖俯伏興復位再行八拜禮畢不必舞蹈山呼凡遇特進東宫箋文陳設如前儀王具皮辨服百官具朝服隨班行四拜禮啓請王詣香案前跪百官皆跪執事者以箋跪授王王受以授使者使者跪受置龍亭訖俯伏興復位又四拜禮畢受厯事例洪武十八年定親王受厯每嵗九月初一日欽天監進次年厯日頒訖即遣使者齎厯至王國長史司官先啓聞設香案于殿上王常服出殿門迎接使者捧厯詣殿上置于案退立于案東引禮引王詣前贊四拜贊跪使者取厯立授王王受訖以授執事者復置于案贊王俯伏興再四拜禮畢迎詔明祖訓凡遇詔赦至王國武官隨王侍衛不出郊外文官具朝服出郊奉迎安奉詔赦于龍亭乘馬前導王具冕服于王城門外五丈餘地奉迎至王宫置龍亭于正殿中王于殿前臺上先行五拜禮畢升殿侍立于龍亭東側武官護衛文官于臺下自行十二拜禮跪聽開讀洪武禮制凡使者欽齎詔書至王府至王城門外一里逺下馬隨龍亭由中門靠東邉入龍亭至殿中使者立于殿外東序西向候行禮畢使者見王行四拜禮事例洪武十八年奏定凡有特㫖御筆至王所則遣官于郊外迎接設香案于殿中候使者至王宫門外王出迎使者以聖㫖置殿上香案導引啓王四拜興詣香案前使者以聖㫖授王王跪看畢仍置于案俯伏興復位又四拜禮畢各官不必陪班祭祀明祖訓凡王國宫城外立宗廟社稷等壇宗廟立于王宫門左與朝廷太廟位置同社稷立于王宫門右與朝廷大社位置同風雲雷雨山川神壇立于社稷壇西旗纛廟立于風雲雷雨山川壇西司旗者致祭凡祭五祀用豕一祝帛香燭酒果司戶之神于宫門左設香案正月初四日門官致祭司竈之神于厨舍設香案四月初一日典膳官致祭中霤之神于宫前丹墀內近東設香案六月土旺戊日承奉司官致祭司門之神于承運門稍東設香案十一月初一日門官致祭司井之神于井邉設香十月初一日典膳官致祭事例洪武初令王祭宗廟用冕服文武百官祭服陪祭祭器籩豆八簠簋各二牲用少牢其廟制許立五廟二昭二穆與始祖之廟為五以始封之王為始祖靖江王國則以南昌王為始祖四時之祭皆用王者禮樂十一年定王府社稷無配位社稱國社之神稷稱國稷之神十八年定祭社稷儀一齊戒正祭前四日奉祀所具本啓聞於午後沐浴更衣于齊宫次日為始齊三日凡齊戒不飲酒不茹葷不弔喪問疾不聽樂不行刑不判署刑殺文書不預穢惡事一省牲正祭前一日清晨設香案于宰牲房外導引官四員導王常服詣省牲位啓省牲執事者牽牲過香案前訖啓省牲畢遂宰牲以盤盛毛血伺祭瘞之一陳設前期掃除壇場幕次至期掌祭官率執事陳設籩豆簠簋酒樽等物一正祭其日昧爽王具皮辨服文武官祭服典儀唱樂舞生就位執事官各司其事導引官四員導王詣拜位內贊啓就位典儀唱瘞毛血執事者以毛血瘞于坎內典儀唱迎神典樂舉麾唱迎神樂奏廣清之曲候樂作內贊啓鞠躬四拜興平身樂止典儀唱奠帛初獻禮典樂舉麾唱初獻樂奏夀清之曲武生舞武功之舞執事者捧帛爵獻于神位前讀祝官取祝跪于神位之左內贊啓典儀唱讀祝訖內贊啓俯伏興平身樂作通贊同唱百官俯伏興平身樂止典儀唱亞獻禮典樂舉麾唱亞獻樂奏豫清之曲文生舞文德之舞執事官舉爵進獻如前儀訖樂作典儀唱終獻禮典樂舉麾唱終獻樂奏熙清之曲文生舞文德之舞執事官進爵如亞獻儀訖樂止典儀唱飲福受胙典膳以福酒及胙自神位前由正門左捧出內贊啓跪搢圭典膳以福酒跪進內贊啓飲福酒訖典膳以胙跪進內贊啓受胙啓出圭俯伏興平身內贊啓鞠躬四拜興平身通贊同唱百官四拜典儀唱徹饌典樂舉麾唱徹饌樂奏雍清之曲執事官各詣神位前徹饌訖樂作典儀唱送神典樂舉麾唱送神樂奏安清之曲內贊啓四拜通贊同唱四拜樂止典儀唱讀祝官捧祝掌祭官捧帛各詣瘞位典樂舉麾唱望瘞樂奏時清之曲內贊啓禮畢一祭山川儀與社稷但不瘞毛血詣瘞位改為燎位及樂歌不同一祭旗纛遣武官戎服行禮儀與山川同但樂用大樂一五祀儀孟春祀户孟夏祀竈季夏祀中霤孟秋祀門孟冬祀井俱于本月上旬擇日中霤則于土旺日遣官致祭用大樂行三獻禮不用飲福受胙宣德二年令王府祭宗廟用文公家禮筵宴事例洪武十八年定凡大宴七爵禮儀其日設王座于存心殿設酒亭于座西南膳亭于東南設文武官四品以上座次于殿內東西相向酒樽食桌于殿外五品以下座次于兩廊設細樂于殿內大樂于殿外典儀啓請升座殿下常服出樂作升座樂止引禮引文武四品以上官及長史詣殿內五品以下詣殿外列班北向贊鞠躬樂作四拜樂止進筵樂作有花則進花進訖樂止色長跪啓一奏喜千春之樂次唱樂作進第一爵酒贊各官跪色長跪唱進酒飲訖樂止贊衆官俯伏興贊各官就座執事者進各官卓樂作有花則散花樂止色長跪啓承應畢進第二爵酒色長跪啓二奏永南山之曲各官立斟酒畢復坐執事者隨斟各官酒色長跪唱進酒飲畢樂止進湯鼓吹響節前導至殿外大樂作各官起立進畢復坐執事者即供各官湯色長跪唱進湯樂作食畢樂止色長跪啓承應畢進第三爵酒色長跪啓三奏桂枝香之曲進酒進湯如前儀飲畢色長跪啓承應畢進第四爵酒色長跪啓四奏初春曉之曲進酒進湯如前儀色長跪啓承應畢進第五爵酒色長跪啓五奏乾坤泰之曲進酒進湯如前儀色長跪啓承應畢進第六爵酒色長跪啓六奏昌運頌之曲進酒進湯如前儀色長跪啓承應畢進第七爵酒色長跪啓七奏泰道開之曲進酒進湯如前儀畢收爵進湯及大膳如前儀進畢收膳色長跪啓承應畢贊徹案自下而上贊起文武官如前列班樂作四拜樂止分東西序立典儀跪啓禮畢樂作引王還宫樂止各官以次出常宴五爵禮儀同凡遇正旦聖節王夀日設宴用花其餘常宴不用來朝明祖訓凡親王每嵗朝覲不許一時同至務要一王來朝還國無虞信報别王方許來朝諸王不拘嵗月自長至幼以嫡先至嫡者朝畢方及庶者亦分長幼而至周而復始母得失序凡諸王居邉者無警則依朝來朝有警則從便不拘朝期凡天子與親王雖有長幼之分在朝廷必講君臣之禮蓋天子之位即祖宗之位宜以祖宗所執大圭于上鏤字題曰奉天法祖世世相傳凡遇親王來朝雖長于天子者天子執相傳之圭以受禮蓋見此圭如見祖考也凡諸王來朝祭祀辦與未辦先常服見天子三叩頭不拜奉天殿見畢不拘何殿樓閣門下天子執大圭王具冕服叙君臣禮行五拜三叩頭見畢諸王係尊長天子係姪孫引王至何便殿王坐東面西天子衣常服叙家人禮行四拜不叩頭王坐受然雖行家人禮君臣之分不可不謹天子居正中南面坐以待尊長次見東宫行四拜禮如王係尊長東宫答拜凡親王係天子伯叔之類年踰五十則不朝世子代之孫姪之輩年踰六十則不朝世子代之凡親王來朝若遇大宴㑹諸王不入筵宴中若欲筵宴于便殿去處精潔茶飯叙家人禮以待之羣臣大㑹宴中王並不入席所以慎防也凡親王每嵗來朝自備飲膳其隨從官員軍士盤費馬匹草料俱各自備毋得干預有司恐惹事端事例凡王世子既授封其叔父行禮班次遇節令行公禮依宗子法重在世子家庭私㑹依家人禮尊歸叔伯凡親王來朝預先具奏有㫖免來則寫書報王樂事例洪武初定凡王國宗廟樂生三十六人鐘磬各一瑟二琴八塤箎簫笛各二笙四柷敔各一摶拊二歌工八舞生七十二文舞三十六人各執羽籥武舞如文舞之數各執干戚中各以二人為引舞又定王府樂工例設二十七户于各王境內撥與供用十五年定王國樂工樂器冠服之制凡朝賀用大樂樂工二十七人樂器用戲竹二頭管四笛四杖鼓十二大鼓一花梨木拍板一冠服用紅絹綵畫胸背方花小袖單袍有花鼓吹冠錦臂鞲皂靴抹額用紅羅彩畫束腰用紅絹宴禮七奏樂樂工八人樂器用紫竹簫二紫竹笙二􅌙二花梨木拍板一冠服同前迎膳大樂樂工八人樂器用戲竹二杖鼓二小鼓一花梨木柏板一冠服亦同前其餘樂工冠服用緑絹彩畫胸背方花小袖單袍無花鼓吹冠抹額以紅絹彩畫束腰以紅絹婚姻明祖訓凡親王妃宫人等必須選擇良家子女以禮聘娶不拘處所勿受大臣進送恐有奸計但是娼妓不許狎近事例天順間定凡宗室有請繼室者無後者方許𢎞治間定凡王府擇婚務要㑹同長史承奉教授等官于本境內揀選家道清白人物俊秀年長成者就行彼處按察司核勘明白方許具奏並不許倫理失序于例有違凡王府前妃有出聽王自備財禮于本境民間女內選娶一人以為內助不授繼妃之封凡王府選婚若先通媒合納賄營求及扶同保勘婚配不當者經該官吏媒合人等通坐以枉法罪名營求撥置之人問發邉衛充軍凡各處郡王除正妃外妾媵多不過四人鎮國輔國將軍除正夫人奉國將軍除正淑人外妾媵各不過三人鎮國中尉除恭人輔國中尉除宜人奉國中尉除安人外妾媵各不過二人生子之日先期開具姓名奏報以後請名請封庶無僣差若是濫收過數將輔導隱匿不奏官員參提究問奏請降調邉方凡各王府選擇儀賔須年十五以上人物長成俊秀者方許具奏成婚凡王府選中儀賔俱送本處儒學讀書習禮教官嚴加訓迪務俾講學修德既婚之後仍在本學讀書凡宗室降為庶人者天順間奏准其子女婚嫁有司每人辦與四表裏首飾銀二十兩猪四口羊四隻自令婚配奏事明祖訓凡親王及嗣或出逺方或守其國或在京城朝廷凡有宣召或差儀賔或駙馬或內官齎持御寶文書并金符前去方許起程詣闕凡王遣使至朝廷不須經由各衙門直詣御前敢有阻當者即是奸臣其王使至午門直門軍官火者火速奏聞若不奏聞即係奸臣同黨事例正統九年令各郡王奏事以所奏事理先令長史司啓親王知參詳可否然後出批付令奏聞惟機密事不在此例𢎞治十三年申定各郡王并將軍中尉凡有奏請先令長史司具啓親王知㑹參詳可否若應該具奏者然後給批差人齎奏如違該衙門將齎奏人員并教授一體參究其所奏事件仍行長史司具啓親王查勘參詳明白具奏方才施行若機密重事或與親王事有干涉及郡王分封相離窵逺不在一城居住者許令徑自具奏本府將軍以下俱啓王代奏若事與親王無干及不係機密重情無故驀越具奏者所司備查前例上請區處若已經參詳奏行勘問未結重復奏擾即將奏詞立案不行凡王府發放一應事務所司隨即奏聞必待欽准方許奉行若不奏聞及已奏不待回報擅自承行者一體治以重罪在京各王出府之日法司即查前例通行長史司知㑹遵守明㑹典卷五十四
