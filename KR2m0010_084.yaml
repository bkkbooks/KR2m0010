body:
  text: 明㑹典卷八十四禮部四十三祭祀五祭厯代帝王國初祭三皇廟用勾􅉭祝融風后力牧配享洪武六年始建厯代帝王廟於欽天山之陽畧用同堂異室之制祭三皇至元世祖凡十六位皆開基創業有功徳於民之主後復擇古名臣三十七人從祀兩廡皆用始終全節者每歲郊祀時既附祭厯代帝王秋八月復擇日遣官祭於本廟諸司職掌一齋戒凡齋戒前一日太常官宿于本司次日具本奏致齋二日𫝊制遣官行禮今欽天監擇定秋祭日祭期本部預行南京太常寺齋戒行禮一省牲牛五羊五豕六鹿一兎八凡正祭前一日獻官承制畢詣本壇省牲一正祭陳設五室十六位每室犢一羊一豕一每位登一鉶二籩豆各十簠簋各二帛一白色禮神制帛已上五室共設酒尊三爵四十八篚五于中室東南西向設祝文案于西一儀注典儀唱樂舞生就位執事官各司其事賛引引獻官至盥洗所賛搢笏出笏引至拜位賛就位典儀唱迎神恊律郎舉麾奏樂樂止賛四拜陪祭官同典儀唱奠帛行初獻禮奏樂執事官各捧帛爵進于神位前賛引賛詣三皇神位前搢笏執事官以帛進于獻官奠訖執事官以爵進于獻官賛獻爵凡三出笏詣五帝神位前儀同前爵凡五詣三王神位前爵凡三詣漢髙祖光武唐太宗皇帝神位前爵凡三詣宋太祖元世祖皇帝神位前爵凡二儀並同前出笏詣讀祝所跪讀祝讀祝官取祝跪于獻官左讀畢進于神位前賛俯伏興平身復位樂止典儀唱行亞獻禮奏樂執事官各以爵獻于神位前樂止典儀唱行終獻禮儀同亞獻典儀唱飲福受胙賛詣飲福位跪搢笏執事官以爵進飲福酒執事官以胙進受胙出笏俯伏興平身復位賛兩拜典儀唱徹饌奏樂執事官各于神位前徹饌樂止典儀唱送臣奏樂賛四拜平身樂止典儀唱讀祝官捧祝掌祭官捧帛饌各詣瘞位樂止賛禮畢從祀名臣東廡第一壇風后皋陶龍伯益𫝊説召公奭召穆公虎張良曹參羊一豕一鉶九篚一籩豆各二棗栗菁𦵔鹿醢簠簋各一黍稷共稻梁共帛九白色禮神制帛酒盞二十七饌盤一篚一第二壇周勃馮異房𤣥齡李靖李晟潘羙岳飛水華黎愽爾忽伯顔羊一豕一鉶十籩豆各二簠簋各一帛十酒盞三十饌盤一篚一西廡第一壇力牧䕫伯夷伊尹周公旦太公望方叔蕭何陳平陳設與東廡第一壇同第二壇鄧禹諸葛亮杜如晦郭子儀曹彬韓世忠張浚博爾术赤老温陳設同一祝文維洪武某年歲次某甲子某月某日皇帝謹遣具官某致祭于太昊伏羲氏炎帝神農氏黄帝軒轅氏帝金天氏帝髙陽氏帝髙幸氏帝陶唐氏帝有虞氏夏禹王商湯王周武王漢髙祖皇帝漢光武皇帝唐太宗皇帝宋太祖皇帝元世祖皇帝曰昔者奉天明命相繼為君代天理物撫育黔黎彛倫攸序井井䋲䋲至今承之生民多福思不忘而報特祀以春秋惟帝兮英靈來歆來格尚享一樂章迎神仰瞻兮聖容想鸞輿兮景從降雲衢兮後先來俯鑒兮微衷荷聖臨兮蒼生有崇睠諸帝兮是臨予頓首兮幸䝉奠帛秉微誠兮動聖躬來列坐兮殿庭予今願兮效勤捧禮帛兮列酒尊鑒予情兮欣享方旋駕兮雲程初獻酒行兮爵盈喜氣兮雍雍重荷䝉兮再瞻再崇羣臣欣兮躍從願覩穆穆兮聖容亞獻酒斟兮禮明諸帝熙和兮悦情百職㚏走兮滿庭陳籩豆兮數重亞獻兮願成終獻獻酒兮至終早整雲鸞兮將還宫予心眷戀兮神聖欲攀留兮無蹤躡雲衢兮緩行得遥瞻兮逹九重徹饌納肴羞兮領陳烝民樂兮幸生將何以兮崇報維嵗時兮載瞻載迎送神旛􅓚繚繞兮導來蹤鸞輿冉冉兮歸天宫五雲擁兮祥風從民歌聖佑兮樂年豐望燎神機不測兮造化功珍羞禮帛兮薦火中望瘞庭兮稽首願神鑒兮寸衷事例洪武元年令以太牢祀三皇六年議定三皇五帝三王及漢唐宋創業之君俱於京師立廟每歲春秋致祭遂建帝王廟於京師中一室以居三皇東一室五帝西一室夏禹商湯周文王又東一室周武王漢光武唐太宗又西一室漢髙祖唐髙祖宋太祖元世祖又命厯代帝王廟皆祀開基創業之君周文王雖基周命然終守臣節唐髙祖雖有天下然皆太宗之力可勿設二主止於陵廟致祭七年令帝王廟皆塑衮冕坐像惟伏義神農未有衣裳之制不必加以冕服二十年令武成王從祀帝王廟罷其舊廟仍去王號二十一年定厯代名臣從祀帝王廟以宋趙普負太祖為不忠不可從祀元臣木華黎於安童為祖不可以其孫從祀而去其祖可祀木華黎而罷安童既祀伯顔阿木亦不必祀祭先師孔子春秋仲月上丁日遣官行禮國初上如江淮先謁孔子廟幸學崇儒重道之意已肇于此後監前代凟禮之失既詔正嶽鎮海凟與城隍之號其厯代忠臣烈士亦止依當時封號惟孔子封爵特仍其舊後四配十哲兩廡諸賢封爵亦仍舊不改每歲二丁傳制遣官致祭列聖登極皆遣官祭告闕里又駕幸太學行釋奠禮每月朔望遣内臣降香諸司職掌一齋戒一省牲儀並同前牛一山羊五今京師用北羊豕九今十四鹿一兎五一正祭陳設正壇犢一羊一豕一登一籩豆各十今各十二鉶二簠簋各二帛一白色禮神制帛共設酒尊三爵三篚一于壇東南西向設祝文案于壇西四配位每位羊一豕一登一鉶二籩豆各十簠簋各一爵三帛一篚一十哲東武壇豕一分五帛一篚一爵三每位鉶一籩豆各四簠簋各一酒盞一西五壇陳設同東廡五十三位共十三壇今五十五位共十四壇共豕一今豕三帛一篚一爵三每壇籩豆各四簠簋各一酒盞四西廡五十二位共十三壇今五十五位共十四壇陳設並同東廡一儀注典儀唱樂舞生就位執事官各司其事分獻官陪祭官各就位賛引引獻官至盥洗所賛詣盥洗位搢笏出笏引至拜位賛就位典儀唱迎神奏樂樂止賛四拜陪祭官同典儀唱奠帛行初獻禮奏樂執事官捧帛爵詣神位前賛引賛詣大成至聖文宣王神位前搢笏執事以帛進奠訖執事以爵進賛引賛獻爵出笏詣讀祝位跪讀祝讀祝官取祝跪于獻官左讀祝俯伏興平身賛詣兖國復聖公神位前搢笏獻爵出笏詣郕國宗聖公神位前儀同前詣沂國述聖公神位前詣鄒國亞聖公神位前儀並同前賛復位樂止典儀唱行亞獻禮奏樂執事以爵獻于神位前樂止典儀唱行終獻禮奏樂儀同亞獻樂止典儀唱飲福受胙賛詣飲福位跪搢笏執事以爵進賛飲福酒執事以胙進賛受胙出笏俯伏興平身復位賛二拜陪祭官同典儀賛徹饌奏樂執事各詣神位前徹饌樂止典儀唱送神奏樂賛引賛四拜陪祭官同典儀唱讀祝官捧祝掌祭官捧帛饌各詣瘞位典儀唱望瘞奏樂賛引賛詣望瘞位樂止賛禮畢分獻官儀注典儀唱分獻官陪祭官各就位各至拜位候讀祝訖唱分獻官行禮賛引賛詣盥洗所賛搢笏賛出笏賛陞壇賛詣神位前賛搢笏執事以帛進于分獻官奠訖執事以爵進於分獻官獻訖賛出笏賛復位一祝文維洪武某年歲次某甲子月日皇帝遣具官某致祭于大成至聖文宣王惟王徳配天地道冠古今刪述六經垂憲萬世謹以牲帛醴齊粢盛庶品祇奉舊章式陳明薦以兖國復聖公郕國宗聖公沂國述聖公鄒國亞聖公配尚享一樂章迎神大哉宣聖道徳尊崇維持王化斯民是宗典祀有常精純並隆神其來格於昭聖容奠帛自生民來誰㡳其盛維王神明度越前聖粢帛具成禮容斯稱黍稷非馨惟神之聽初獻大哉聖王實天生徳作樂以崇時祀無斁清酤惟馨嘉牲孔碩薦修神明庶幾昭格亞獻終獻百王宗師生民物軌瞻之洋洋神其寧止酌彼金壘惟清且㫖登獻于三於嘻成禮徹饌犠象在前豆籩在列以享以薦既芬既潔禮成樂備人和神悦祭則受福率遵無越送神有嚴學宫四方來宗恪㳟祀事威儀雍雍歆格惟馨神馭還復明禋斯畢咸膚百福事例洪武元年遣官釋奠于先師孔子定以仲春仲秋二上丁日降香遣官祭于國子學四年更定孔子釋奠祭器禮物各置髙案籩豆簠簋登鉶悉用磁器牲用熟樂舞生擇監生及文職大臣子弟在學校者預教習之十五年詔天下通祀孔子頒釋奠儀二十六年頒大成樂於天下府學令州縣如式製造永樂八年令天下文廟聖賢衣冠繪塑不合古制者悉改正二十八年黜莽大夫楊雄進漢董仲舒從祀正統元年令刋印儒學從祀先賢名爵位次頒行天下永為遵守二年以宋儒胡安國蔡沈真徳秀從祀三年禁天下祀孔子於釋老宫又定祭丁品物其不係出産者鹿兎以羊代榛棗以土産果品代八年追封元吴澄為臨川郡公從祀景泰六年以兩廡祭品儉薄從太常寺奏増豕四隻棗栗各五十斤黍稷各一斗形塩五十斤及行南京國學一例増設成化二年追封董仲舒為廣川伯胡安國為建寧伯蔡沈為崇安伯真徳秀為浦城伯十二年増樂舞為八佾籩豆各為十二𢎞治九年追封宋楊時為將樂伯從祀釋菜每月初一日祭酒率本監官并監生行禮儀注其日侵晨執事者各司其事分獻官各官分列於大成門内監生排班俟獻官至通賛唱排班獻官以下各就位通賛唱班齊闢户鞠躬拜興拜興平身行禮引賛詣獻官前唱詣盥洗所獻官盥手帨巾訖引賛唱詣酒罇所司罇者舉羃酌酒訖引賛唱詣大成至聖文宣王神位前跪獻爵俯伏興平身執事者行事並同釋奠引賛唱詣兖國復聖公神位前郕國宗聖公神位前沂國述聖公神位前鄒國亞聖公神位前儀並同前至亞聖公位十哲兩廡分獻官一同行禮畢諸引賛同唱復位諸引賛導獻官分獻官至原拜位立通賛唱鞠躬拜興拜興平身闔户禮畢十哲兩廡分獻禮行事並同釋奠祭先農遣應天府官祭今遣順天府官祭國初以郊廟社稷先農俱為大祀每親祭先農遂耕籍田以后稷氏配神又嘗改請仁祖配神後以山川厯代帝王先師孔子及先農旗纛俱列中祀止遣應天府官致祭先農不設配位祭畢猶親耕籍田永樂遷都後乃遣順天府官致祭列聖登極之初行耕籍禮則親祭每歲以仲春上戊日遣官致祭諸司職掌一齋戒二日一省牲牛一羊一豕一鹿一兎一一正祭陳設先農之神南向犢一羊一豕一登一鉶二籩豆各十簠簋各二帛一青色禮神制帛設酒尊三爵三篚一于壇東南西向設祝文案于壇西一儀注典儀唱樂舞生就位執事官各司其事賛引引獻官至盥洗所賛詣盥洗所搢笏出笏賛引賛就位典儀唱瘞毛血迎神奏樂樂止賛引賛四拜陪祭官同典儀唱奠帛行初獻禮奏樂賛引賛詣神位前搢笏執事官以帛跪進于獻官奠訖執事官以爵跪進于獻官賛引賛獻爵出笏詣讀祝所跪讀祝讀祝官取祝跪于獻官左讀祝畢進于神位前賛引賛俯伏興平身復位樂止典儀唱行亞獻禮奏樂執事以爵進于神位前樂止典儀唱行終獻禮儀同亞獻典儀唱飲福受胙賛引賛詣飲福位執事以爵進賛引賛飲福酒執事以胙進賛引賛受胙出笏俯伏興平身復位賛引賛兩拜典儀唱徹饌奏樂執事于神位前徹饌樂止典儀唱送神奏樂賛引賛四拜樂止典儀唱讀祝官捧祝掌祭官捧帛饌各詣瘞位典儀唱望瘞賛引賛詣望瘞位賛禮畢一祝文維洪武某年歲次某甲子月日皇帝謹遣具官某致祭于先農之神惟神初興農事乃種嘉糓為民立命萬世永頼今將東作親耕籍田謹以牲醴庶品用修常祀尚享一樂章迎神東風啟蟄地脈奮然蒼龍掛角煜煜天田民命惟食創物有先圜鐘既奏有降斯筵奠帛帝出乎震天發農祥神降于筵藹藹洋洋禮神有帛其色惟蒼豈伊具物誠敬之將初獻九榖未分庶草收同表為嘉種實在先農黍稌斯豐酒醴是共獻奠之初以蘄感通亞獻倬彼甫田其隰其原來耜云載驂御之間報本思享亞獻惟䖍神其歆之自古有年終獻帝籍之典享祀是資潔豐嘉粟咸仰于斯時惟親耕享我農師禮成于三以訖陳詞徹饌於赫先農歆此潔修于篚于爵于饌于羞禮成告徹神惠敢留餕及終畆豐年是求送神神無不在於昭于天曰迎曰送于享之筵冠裳在列金石在懸徃無不之其佩翩翩望燎祝帛牲醴先農既歆不留不䙝瘞之厚深有幽其瘞有赫其臨曰禮之常匪今斯今事例洪武二年親祭先農以后稷氏配享十年遣官祭先農令應天府官率農民耆老陪祭祭旗纛旗手衛指揮祭祭神旗附國家旗纛蔵之内府每嵗仲秋祭山川日遣旗手衛指揮祭于山川壇内之旗纛廟霜降日又祭于教塲至歲暮享太廟日又祭于承天門外永樂後别有神旗之祭専祭火雷之神每月朔望神機營提督官請祭於教塲内今附于後諸司職掌一齋戒二日一省牲牛一羊一豕一一正祭陳設神七位南向旗頭大將六纛大將五方旗神主宰戰船正神金皷角銃鉋之神弓弩飛鎗飛石之神陣前陣後神祇五昌等衆犢一羊一豕一登一鉶二籩豆各十簠簋各二帛七黑二白五禮神制帛共設酒尊三爵一篚一于壇東南西向設祝文案于壇西一儀注賛引引獻官至盥洗所賛詣盥洗所賛就位迎神作樂執事官于神位前斟酒訖賛引賛四拜陪祭官同賛奠帛行初獻禮作樂執事捧帛爵進賛引賛詣神位前執事以帛進奠訖執事以爵進賛獻爵訖賛復位跪讀祝讀訖賛俯伏興平身樂止賛引唱行亞獻禮執事於神位前斟酒樂止唱行終獻禮儀同亞獻唱飲福受胙賛詣飲福位跪飲福酒受胙以下儀與祭先農同祭神旗牲用羊一豕一無帛一儀注賛引引獻官就位賛四拜賛初獻禮賛跪賛讀祝訖賛俯伏興平身賛亞獻禮賛終獻禮賛四拜賛詣焚祝所訖賛禮畢一祝文維某年月日皇帝遣某官某致祭于天威神機火雷無敵大將軍之神惟神威勇猛勵剛勁精强訇雷掣電歘火㚏風䕶國庇民厥功顯著肅靖兇暴寧謐封疆遇有征討惟神是頼驅鋒遣鏑端直竒妙萬發萬中疊貫連穿破敵致勝如拉枯朽無堅不摧無捍不滅神其蓄銳毓靈用之則應特以牲品致祭神其享之祭五祀四孟及季夏分祭各羊一豕一禮神制帛一嵗暮合祭共羊五豕五制帛五一儀注賛引引獻官詣盥洗所搢笏洗訖出笏賛就位賛四拜賛行初獻禮賛詣神位前搢笏奠帛獻爵如素祭獻茶出笏復位賛跪讀祝訖俯伏興平身賛行亞獻禮執事捧爵自跪獻于神位左賛行終獻禮執事捧爵自跪獻于神位右賛四拜賛焚祝帛賛詣焚祝所禮畢一祝文維某年月日皇帝遣某官某致祭于司戸之神宫内祭内官行禮曰職司于户謹出入之行蔵晝開暮闔衛䕶無私時維孟春謹以牲醴致祭神其鑒知尚享司竈之神光禄寺祭内官行禮祝文曰日月飲食必資于竈㸑有常所神實司之時維孟夏謹以牲醴致祭神其鑒知中霤之神奉天殿外文樓前西向司禮監官行禮季夏土旺後戊日祭祝文曰室之中霤神司其職居中向明照察無私時維季夏謹以牲醴致祭神其鑒知司門之神午門前祭守門内官行禮祝文曰職司于門謹出入之行蔵晝開暮闔衛䕶無私時維孟秋謹以牲醴致祭神其鑒知司井之神宫内祭内官行禮祝文曰神司茲井源泉潔清其用日新以供飲食時維孟冬謹以牲醴致祭神其鑒知歲暮合祭五祀太廟西廡下東向太常寺官行禮儀注與前分祭同分祭用禮神制帛各一合祭用帛五祝文曰惟神安養䕶衛各著厥功茲當歲暮特以牲醴報祭神其鑒知明㑹典卷八十四
