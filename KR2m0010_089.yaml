body:
  text: 明㑹典卷八十九禮部四十八喪服國初頒降大明令凡喪服等差多因前代之舊後更定服制著為孝慈録復圖列于大明律今具載于後大明令斬衰三年斬衰者用至粗麻布不縫下邊謂之斬衰子為父嫡孫為祖後者為祖為曽高後者亦同女在室為父已許嫁同女嫁反在父室為父謂父喪期年內被出者父為嫡子妻為夫妾為主為夫之父為人後者為所後父過房與人做孩兒的為後父齊衰三年齊衰者亦用稍粗麻布縫下邊謂之齊衰子為母父在同女在室為母已許嫁同為祖後者祖卒為祖母為曽高後者亦同母為長子女嫁反在室為母謂母喪期年內被出者婦為夫之母繼母與母同慈母與母同繼母為長子妾為主之長子為人後者為所後母過房與人做孫兒的為後母齊衰杖期父卒母嫁及出妻之子為母報服亦同為祖後者祖在為祖母為曽高後者亦同父卒嫡繼慈飬母歸宗為之服若改嫁從者為之服報服亦同夫為妻齊衰期年為祖父母父所生庶母亦同為伯叔父母為兄弟為衆子為兄弟之子女在室者為嫡孫為姑姊妹女在室者適人無夫子者同女在室者為兄弟姪姪女在室同婦人無夫子者為兄弟姪姪女及姊妹在室同女為祖父母出嫁同妾為其子妾為其父母庶子為其母謂嫡母在室女適人為兄弟之為父後者為人後者為其父母報服亦同女適人者為父母妾為嫡妻為繼父之同居者妾為主之衆子舅姑為嫡婦為夫親兄弟之子男女同齊衰五月為曽祖父母女為曽祖父母出嫁同齊衰三月為高祖父母女為高祖父母出嫁同為繼父不同居謂先曽同居今不同居大功九月大功者以粗熟布月長殤九月中殤七為同堂兄弟姊妹在室同為衆孫女在室同為女適人者為姑姊妹適人者女適人為兄弟姪姑姊妹及姪女在室者同出母為女為人後者為其兄弟報服亦同女適人者為伯叔父母報服亦同為人後者為其姑姊妹在室者報服亦同為夫之祖父母為夫之伯叔父母為兄弟子之父為夫兄弟子之婦夫為人後者其妻為本生舅姑為衆子婦為子之長殤中殤男女同為叔父之長殤中殤為姑姊妹之長殤中殤為兄弟之長殤中殤為嫡孫之長殤中殤嫡曽𤣥孫同為兄弟之子長殤中殤為夫兄弟之子長殤中殤男女同小功五月小功者以稍粗熟布為伯叔祖父母為兄弟之孫為兄弟之孫女在室者為同堂伯叔父母為同堂兄弟之子為同堂兄弟之女在室者為從祖姑姊妹之在室者報服亦同為從祖祖姑在室者報服亦同為再從兄弟為外祖父母為同堂姊妹在室者報服亦同為母之兄弟姊妹報服亦同為孫女適人者妯娌相為服為人後者為其姑姊妹適人者報服亦同為夫同堂兄弟之子為夫兄弟之孫為夫之姑姊妹在室者適人同報服亦同之為庶母慈已者為同母異父兄弟姊妹為嫡孫之婦為嫡母之父母兄弟姊妹母出為繼母之父母兄弟姊妹為兄弟妻報服亦同為男女之下殤為叔父姑姊妹兄弟之下殤為嫡孫之下殤為衆孫之長殤男同女為兄弟之子之下殤為同堂兄弟姊妹之下殤為人後者為其姑姊妹兄弟之長殤出嫁姑為姪之長殤男女同為夫兄弟子之下殤男女同為夫之叔父之長殤緦麻三月緦麻者以稍細熟布為族兄弟為族曽祖父母為兄弟之曾孫為族祖父母為兄弟之曽孫女之在室者為外孫男女同為同堂兄弟之孫同堂兄弟之孫女在室同出嫁則無服為再從兄弟之子再從兄弟之女在室同出嫁則無服為曽孫𤣥孫為從母兄弟姊妹為姑之子為舅之子為族曽祖姑在室者報服亦同為族姑在室者報服同為族祖姑在室者報服亦同為從祖姑姊妹適人者報服亦同女適人者為同堂伯叔父母報服同為從祖祖姑適人者庶子為父後者為其母為人後者為外祖父母為兄弟之孫女適人者報服亦同為夫兄弟之曽孫為夫同堂兄弟之孫為夫再從兄弟之子男女同為衆孫之婦為庶母父之妾有子者為乳母為妻之父母報服亦同為夫之曽祖父母為夫之從祖祖父母為兄弟孫之婦為夫之從祖父母為夫兄弟孫之婦為同堂兄弟子之婦為甥之婦為夫之外祖父母為外孫婦為同堂兄弟之妻為夫之舅姨為夫同堂兄弟子之婦為夫之從父兄弟之妻為夫之從姊妹在室及適人者為姊妹之子之婦子為父母妻妾為夫改葬既葬除之為從父兄弟姊妹之中殤下殤為衆孫之中殤下殤男女同為從祖叔父之長殤為從祖兄弟之長殤為從父兄弟之子長殤為兄弟之孫長殤為舅姨之長殤為從祖姑姊妹之長殤為人後者為其兄弟之中殤下殤出嫁姑為姪之中殤下殤男女同為人後者為其姑姊妹之中殤下殤為人後者為從父母兄弟之長殤為夫之叔父之長殤下殤為夫之姑姊妹之長殤准禮有三殤年十九至十六為長殤十五至十二為中殤十一至八嵗為下殤長殤中殤降正服一等下殤降長殤中殤一等即生三嵗至七嵗者為無服之殤其已娶已嫁則服之如成人孝慈録斬衰三年子為父母庶子為所生母子為繼母子為慈母母卒父命他妾飬己者子為養母謂自幼過房與人女在室為父母女嫁反在室為父母謂已嫁被出而歸在父母家者嫡孫為祖父母承重及曽高祖父母承重者同父不在故嫡孫為祖承重服若父祖俱亡而子孫為曽高祖後者同為人後者為所後父母為人後者為所後祖父母承重夫為人後則妻從服婦為舅姑即公婆庶子之妻為夫之所生母妻妾為夫齊衰杖期嫡子衆子為庶母謂父之妾嫡子衆子之妻為夫之庶母為嫁母出母即親生母因父卒改嫁及父在被出者父卒繼母改嫁而已從之者夫為妻齊衰不杖期父母為嫡長子及衆子父母為女在室者雖適人而無夫與子者亦同繼母為長子及衆子慈母為長子及衆子孫為祖父母女雖適人不降為伯叔父母即伯伯姆姆叔叔嬸嬸妾為夫之長子及衆子為所生子為兄弟為兄弟之子及兄弟之女在室者即姪男及姪女為姑及姊妹在室者雖適人而無夫與子者同妾為嫡妻嫁母出母為其子女在室及雖適人而無夫與子者為其兄弟及兄弟之子姊妹及姪女在室者同繼母改嫁為前夫之子從已者為繼父同居兩無大功之親者謂繼父無子孫叔伯兄弟已身亦無伯叔兄弟之類婦人為夫親兄弟之子婦人為夫親兄弟之女在室者女出嫁為父母妾為其父母為人後者為其父母即本生父母女適人為兄弟之為父後者祖為嫡孫父母為長子婦齊衰五月為曽祖父母女雖適人不降齊衰三月為高祖父母女雖適人不降為繼父先曽同居今不同者為繼父雖同居而兩有大功以上親者大功為同堂兄弟及姊妹在室者為姑及姊妹及兄弟之女出嫁者父母為衆子婦為女之出嫁者祖為衆孫女在室同為兄弟之子之婦即姪婦婦人為夫之祖父母即夫之公婆婦人為夫之伯叔父母即夫之伯伯姆姆叔叔嬸嬸婦人為夫之兄弟之子婦即姪婦婦人為夫兄弟之女嫁人者女出嫁為本宗伯叔父母即伯伯姆姆叔叔嬸嬸女出嫁為本宗兄弟及兄弟之子女出嫁為本宗姑姊妹及兄弟之女在室者為人後者為其兄弟及姑姊妹在室者夫為人後者其妻為夫本生父母為兄弟之子為人後者小功為伯叔祖父母謂祖之兄弟即伯公伯婆叔公叔婆為同堂伯叔父母謂父之伯叔兄弟為再從兄弟及再從姊妹在室者謂同曽祖兄弟即父伯叔兄弟之子女為同堂兄弟之子即堂姪為從祖祖姑在室者謂祖之親姊妹即姑婆為從祖姑在室者即堂姑是父之同堂伯叔姊妹為同堂兄弟之女在室者即堂姪女為兄弟之妻為人後者為其姑姊妹適人者為嫡孫婦為同堂姊妹之出嫁者為孫女適人者為兄弟之孫及兄弟之孫女在室者即姪孫為外祖父母即外公外婆為母之兄弟姊妹即舅舅姨姨為同母異父之兄弟姊妹為姊妹之子即甥為夫之姑及夫之姊妹在室出嫁同為夫之兄弟及夫兄弟之妻為夫兄弟之孫及夫兄弟之孫女在室者為夫同堂兄弟之子及夫同堂兄弟之女在室者緦麻為族曽祖父母謂曽祖之兄弟及妻即太伯公伯婆叔公叔婆為族伯叔祖父母謂祖之同堂兄弟及妻即堂伯公伯婆叔公叔婆為族父母謂父之再從兄弟同曽祖者即族伯伯姆姆叔叔嬸嬸為族兄弟及族姊妹在室者謂三從兄弟姊妹同高祖者為族曽祖姑在室者謂曽祖之姊妹即太姑婆為族祖姑在室者謂祖之同室姊妹即堂姑婆為族姑在室者謂父之再從姊妹即族姑為兄弟之曽孫女在室同即曾姪孫為曽孫𤣥孫為同堂兄弟之孫女在室同出嫁則無服為再從兄弟之子女在室同即同曽祖兄弟之子為從祖祖姑及從祖姑及從祖姊妹之出嫁者從祖祖姑謂祖之親姊妹從祖姑父之同堂姊妹從祖姊妹已身再從姊妹為兄弟之孫女出嫁者為同堂兄弟之女出嫁者堂姪女為乳母為舅之子為姑之子為兩姨兄弟為外孫男女同為壻為妻之父母妻亡而别娶亦同妻之親母雖嫁出猶服為兄弟孫之婦為同堂兄弟子之婦為同堂兄弟之妻為外孫婦為甥婦婦人為夫之曽祖高祖父母為夫之從祖祖父母即夫之祖親兄弟伯公伯婆叔公叔婆為夫之從祖父母夫之堂伯叔為夫兄弟之曽孫為夫之同堂兄弟為夫同堂兄弟之孫孫女同為夫再從兄弟之子為夫兄弟孫之婦為夫同堂兄弟子之婦為夫同堂兄弟之妻為夫同堂姊妹在室出嫁同為夫之外祖父母為夫之舅及夫之姨為夫之從祖祖姑及從祖姑在室者從祖祖姑是夫之姑婆從祖姑是夫之堂姑女出嫁為本宗從祖祖父母即伯公伯婆叔公叔婆女出嫁為本宗從祖父母即堂伯堂叔女出嫁為本宗同堂兄弟之子女即堂叔堂姪女女出嫁為本宗從祖祖姑及從祖姑在室者從祖祖姑即姑婆從祖姑即堂姑女出嫁為本宗同堂姊妹之出嫁者為人後者為本生外祖父母明㑹典卷八十九
