body:
  text: 明㑹典卷一百二十七刑部二憲科諸司職掌律令職制公式儀制人命名例盜賊詐偽鬭毆伸寃名例大明律舊以名例律附于斷獄之後洪武二十二年更定寘于篇首葢以此為刑名之總例也諸司職掌次于儀制人命之後蓋未更定者今依律仍以名例為篇首餘如職掌而律令憲科等四科皆同故次卷亦不復列明律五刑笞刑五一十贖銅錢六百文二十贖銅錢一貫二百文三十贖銅錢一貫八百文四十贖銅錢二貫四百文五十贖銅錢三貫杖刑五六十贖銅錢三貫六百文七十贖銅錢四貫二百文八十贖銅錢四貫八百文九十贖銅錢五貫四百文一百贖銅錢六貫徒刑五一年杖六十贖銅錢一十二貫一年半杖七十贖銅錢一十五貫二年杖八十贖銅錢一十八貫二年半杖九十贖銅錢二十四貫三年杖一百贖銅錢二十四貫流刑三二千里杖一百贖銅錢三十貫二千五百里杖一百贖銅錢三十三貫三千里杖一百贖銅錢三十六貫死刑二絞斬贖銅錢四十二貫十惡一曰謀反謂謀危社稷二曰謀大逆謂謀毁宗廟山陵及宫闕三曰謀叛謂謀背本國潛從他國四曰惡逆謂毆及謀殺祖父母父母夫之祖父母父母殺伯叔父母姑兄姊外祖父母及夫者五曰不道謂殺一家非死罪人及支解人若採生造畜蠱毒魘魅六曰大不敬謂盜大祀神御之物乗輿服御物盜及偽造御寶合和御藥誤不依本方及封題錯誤若造御膳誤犯食禁御幸舟船誤不堅固七曰不孝謂告言呪罵祖父母父母夫之祖父母父母及祖父母父母在别籍異財若奉養有缺居父母喪身自嫁娶若作樂釋服從吉間祖父母父母喪匿不舉哀詐稱祖父母父母死八曰不睦謂謀殺及賣緦麻以上親毆告夫及大功以上尊長小功尊屬九曰不義謂部民殺本屬知府知州知縣軍士殺本管指揮千戸百戸吏卒殺本部五品以上長官若殺見受業師及聞夫喪匿不舉哀若作樂釋服從吉及改嫁十曰内亂謂姦小功以上親父祖妾及與和者八議一曰議親謂皇家袒免以上親及太皇太后皇太后緦麻以上親皇后小功以上親皇太子妃大功以上親二曰議故謂皇家故舊之人素得侍見特䝉恩待日久者三曰議功謂能斬将奪旗摧鋒萬里或率衆来歸寜濟一時㦯開拓疆宇有大勲勞銘功太常者四曰議賢謂有大德行之賢人君子其言行可以為法則者五曰議能謂有大才業能整軍旅治政事為帝王之輔佐人倫之師範者六曰議勤謂有大将吏謹守官職早夜奉公㦯出使逺方經涉艱難有大勤勞者七曰議貴謂爵一品及文武職事官三品以上散官二品以上者八曰議賔謂承先代之後為國賔者應議者犯罪凡八議者犯罪實封奏聞取㫖不許擅自勾問若奉㫖推問者開具所犯及應議之狀先奏請議議定奏聞取自上裁其犯十惡者不用此律職官有犯凡京官及在外五品以上官有犯奏聞請者不許擅問六品以下聽分巡御史按察司并分司取問明白議擬奏聞區處若府州縣官犯罪所轄上司不得擅自勾問止許開具所犯事由實封奏聞若許准推問依律議擬回奏候委官審實方許判決其犯應該笞決罰俸收贖紀錄者不在奏請之限若所屬官被本管上司非理凌虐亦聽開具實跡實封徑直奏陳軍官有犯凡軍官犯罪從本管衙門開具事由申呈五軍都督府奏聞請㫖取問若六部察院按察司并分司及有司見問公事但有干連軍官及承告軍官不公不法等事須要宻切實封奏聞不許擅自勾問若奉㫖推問除笞罪收贖明白回奏杖罪以上須要論功定議請㫖區處其管軍衙門首領官有犯不在此限文武官犯公罪凡内外大小軍民衙門官吏犯公罪該笞者官收贖吏每季類決不必附過杖罪以上明立文案每年一考紀錄罪名九年一次通考所犯次數重輕以憑黜陟文武官犯私罪凡文官犯私罪笞四十以下附過還職五十解見任别叙杖六十降一等七十降二等八十降三等九十降四等俱解見任流官於雜職内叙用雜職於邊逺叙用杖一百者罷職不叙若軍官有犯私罪該笞者附過收贖杖罪解見任降等叙用該罷職不叙者降充總旗該徒流者照依地里逺近𤼵各衛充軍若建立事功不次擢用若未入流品官及典吏有犯私罪笞四十者附過各還職役五十罷見役别叙杖罪並罷職役不叙應議者之父祖有犯凡應八議者之祖父母父母妻及子孫犯罪實封奏聞取㫖不許擅自勾問若奉㫖推問者開具所犯及應議之狀先奏請議議定奏聞取自上裁若皇親國戚及功臣之外祖父母伯叔父母姑兄弟姊妹女壻兄弟之子若四品五品官之父母妻及應合襲廕子孫犯罪從有司依律追問議擬奏聞取自上裁其犯十惡反逆緣坐及奸盜殺人受財枉法者不用此律其餘親屬奴僕管莊佃甲倚勢虐害良民陵犯官府者加常人罪一等止坐犯人不在上請之律若各衙門追問之際占恡不𤼵者並聽當該官司實封奏聞區處軍官軍人犯罪免徒流凡軍官軍人犯罪律該徒流者各決杖一百徒五等皆𤼵二千里内衛分充軍流三等照依地里逺近𤼵各衛充軍該𤼵邊逺充軍者依律𤼵遣並免刺字若軍丁軍吏及校尉犯罪俱准軍人擬斷亦免徒流刺字犯罪得累減凡一人犯罪應減者若為從減自首減故失減公罪逓減之類並得累減以理去官凡任滿得代改除致仕等官與見任同封贈官與正官同其婦人犯夫及義絶者得與其子之品官同犯者並依職官犯罪律擬斷無官犯罪凡無官犯罪有官事𤼵公罪亦得収贖紀録卑官犯罪遷官事𤼵在任犯罪去任事𤼵犯公罪笞以下勿論杖以上紀録通考為事黜革笞杖以上皆勿論若事干埋沒錢粮遺失官物罪雖紀録勿論事須追究明白但犯一應私罪並論如律其吏典有犯公罪罪名亦依上擬斷除名當差凡職官犯罪罷職不叙追奪除名者官爵皆除僧道犯罪曾經決罰者並令還俗軍民匠竈各從本色𤼵還原籍當差流囚家屬凡犯流者妻妾從之父祖子孫欲隨者聴遷徙安置人家口亦准此若流徒人身死家口雖經附籍願還鄉者放還其謀反逆叛及造畜蠱毒若採生折割人殺一家三人㑹赦猶流者家口不在聽還之律常赦所不原凡犯十惡殺人盜係官財物及强盜竊盜放火𤼵塜受枉法不枉法贓詐偽犯姦畧人畧賣和誘人口若姦黨及讒言左使殺人故出入人罪若知情故縱聴行藏匿引送説事過錢之類一應真犯雖㑹赦並不原宥其過誤犯罪及因人連累致罪若官吏有犯公罪並從赦原其赦書臨時定罪名特免及減降從輕者不在此限徒流人在道㑹赦凡徒流人在道㑹赦計行程過限者不得以赦放有故者不用此律若曽在逃雖在程限内亦不放免其逃者身死所隨家口願還者聽遷徙安置人准此其徒流遷徙安置人已至配所及犯謀反逆叛縁坐應流若造畜蠱毒採生拆割人殺一家三人㑹赦猶流者並不在赦放之限犯罪存留養親凡犯死罪非常赦所不原者而祖父母父母老疾應侍家無以次成丁者開具所犯罪名奏聞取自上裁若犯徒流者止杖一百餘罪收贖存留養親工樂戸及婦人犯罪凡工匠樂戸犯流罪者三流並決杖一百留住拘役四年若欽天監天文生習業已成能專其事犯流及徒者各決杖一百餘罪收贖其婦人犯罪應決杖者姦罪去衣受刑餘罪單衣決罰皆免刺字若犯徒流者決杖一百餘罪收贖徒流人又犯罪凡犯罪已𤼵又犯罪者從重科斷已徒已流者又犯罪者依律再科後犯之罪其重犯流者依留住法三流並決杖一百於配所拘役四年若犯徒者依所犯杖數該徒年限決訖應役亦總不得過四年其杖罪以下亦各依數決之其應加杖者亦如之老小廢疾收贖凡年七十以上十五以下及廢疾犯流罪以下收贖八十以上十嵗以下及篤疾犯反逆殺人應死者議擬奏聞取自上裁盜及傷人者亦收贖餘皆勿論九十以上七嵗以下雖有死罪不加刑其有人教令坐其令者若有贓應償受贓者償之犯罪時未老疾凡犯罪時雖未老疾而事𤼵時老疾者依老疾論若在徒年限内老疾亦如之犯罪時幼小事𤼵時長大依幼小論給没贓物凡彼此俱罪之贓及犯禁之物則入官若取與不和用强生事逼取求索之贓並還主其犯罪應合籍沒財産赦書到後罪雖決訖未曽抄劄入官者並從赦免其已抄劄入官守掌及犯謀反逆叛者並從赦免若罪未處決物雖送官未經分配者猶為未入其縁坐人家口雖已入官罪人得免者亦從免放若以贓入罪正贓見在者還官主已費用者若犯人身死勿徴餘皆徴之若計雇工賃錢為贓者亦勿徴其估贓者皆據犯處當時中等物價估計定罪若計雇工錢者一人一日為銅錢六十文其牛馬駝騾驢車船碾磨店舍之類照依犯時雇工賃直賃錢雖多各不得過其本價其贓罰金銀並照犯人原供成色從實追徴入官給主若已費用無存者追徵足色犯罪自首凡犯罪未𤼵而自首者免其罪猶徴正贓其輕罪雖𤼵因首重罪者免其重罪若因問被告之事而别言餘罪者亦如之其遣人代首若於法得相容隱者為首及相告言者各聽如罪人身自首法若自首不實及不盡者以不實不盡之罪罪之至死者聴減一等其知人欲告及逃叛而自首者減罪二等坐之其逃叛者雖不自首能還歸本所者減罪二等其損傷於人於物不可陪償事𤼵在逃若私越度闗及姦并私習天文者並不在自首之律若强竊盜詐欺取人財物而於事主處首服及受人枉法不枉法贓悔過回付還主者與經官司自首同皆得免罪若知人欲告而於財主處首還者亦得減罪一等其强竊盜若能捕獲同伴解官者亦得免罪又依常人一體給賞二罪俱𤼵以重論凡二罪以上俱發以重者論罪各等者從一等科斷若罪先𤼵已經論決餘罪後𤼵其輕若等勿論重者更論之通計前罪以充後數其應入官陪償刺字罷職罪止者各盡本法犯罪共逃凡犯罪共逃亡其輕罪囚能捕獲重罪囚而首告及輕重罪相等但獲一半以上首告者皆免其罪其因人連累致罪而罪人自死者聽減本罪二等若罪人自首告及遇赦原免或䝉特恩減罪收贖者亦准罪人原免減等贖罪法同僚犯公罪凡同僚犯公罪者並以吏典為首首領官減吏典一等佐貳官減首領官一等長官減佐貳官一等若同僚官一人有私自依故出入人罪論其餘不知情者止依失出入人罪論若申上司不覺失錯准行者各逓減下司官吏罪二等若上司行下所屬依錯施行者各逓減上司官吏罪三等亦各以吏典為首公事失錯凡公事失錯自覺舉者免罪其同僚官吏應連坐者一人自覺舉餘人皆免罪其斷罪失錯已行論決者不用此律其官文書稽程應連坐者一人自覺舉餘人亦免罪主典不免若主典自舉者並減二等共犯罪分首重凡共犯罪者以造意為首隨從者減一等若家人共犯止坐尊長若尊長年八十以上及篤疾歸罪於共犯罪以次尊長侵損於人者以凡人首從論若共犯罪而首從本罪各别者各依本律首從論若本條言皆者罪無首從不言皆者依首從法其犯擅入皇城宫殿等門及私越度闗若避役在逃及犯姦者亦無首從犯罪事𤼵在逃凡二人共犯罪而有一人在逃見獲者稱逃者為首更無證佐則決其從罪從獲逃者稱前人為首鞫問是實還依首論通計前罪以充後數若犯罪事發而在逃者衆證明白即同獄成不須對問親屬相為容隠凡同居若大功以上親及外祖父母外孫妻之父母女壻若孫之婦夫之兄弟及兄弟妻有罪相為容隠奴婢雇工人為家長隠者皆勿論若漏泄其事及通報消息致令罪人隠匿逃避者亦不坐其小功以下相容隠及漏泄其事者減凡人三等無服之親減一等若犯謀叛以上者不用此律吏卒犯死罪凡在外各衙門吏典祗候禁子有犯死罪從各衙門長官鞫問明白不須申禀依律處決然後具由申報本管上司轉達刑部奏聞知㑹處決叛軍凡邊境城池若有軍人謀叛守禦官捕獲到官顯跡證佐明白鞫問招承行移都指揮使司委官審問無寃隨即依律處治具由申達五軍都督府奏聞知㑹若有布政司按察司去處公同審問處治如在軍前臨陣擒殺者不在此限殺害軍人凡殺死軍人者依律處死仍将正犯人餘丁抵數充軍在京犯罪軍民凡在京軍民若犯杖八十以上者軍𤼵外衛充軍民𤼵别郡為民化外人有犯凡化外人有犯罪者並依律擬斷本條别有罪名凡本條自有罪名與名例罪不同者依本條科斷若本條雖有罪名其有所規避罪重者自從重論其本應罪重而犯時不知者依凡人論本應輕者聽木本法加減罪例凡稱加者就本罪上加重稱減者就本罪上減輕唯二死三流各同為一減加者數滿乃坐又加罪止於杖一百流三千里不得加至於死本條加入死者依本條稱乗輿車駕凡稱乗輿車駕及御者太皇太后皇太后皇后並同稱制者太皇太后皇太后皇太子令並同稱期親祖父母凡稱期親及稱祖父母者曽高同稱孫者曽𤣥同嫡孫承祖與父母同其嫡母繼母慈母養母與親母同稱子者男女同稱與同罪凡稱與同罪者止坐其罪至死者減一等罪止杖一百流三千里不在刺字絞斬之律若受財故縱與同罪者全料其故縱謀反逆叛者自依本律稱准枉法論准盜論之類但准其罪亦罪止杖一百流三千里並免刺字稱以枉法論及以盜論之類皆與真犯同刺字絞斬皆依本律科斷稱監臨主守凡稱監臨者内外諸司統攝所屬有文案相闗涉及雖非所管百姓但有事在手者即為監臨稱主守者該管文案吏典專主掌其事及守掌倉庫獄囚雜物之類官吏庫子斗級攢攔禁子並為主守其職雖非統屬但臨時差遣管領提調者亦是監臨主守稱日者以百刻凡稱一日者以百刻計工者從朝至暮稱一年者以三百六十日稱人年者以籍為定稱衆者三人以上稱謀者二人以上稱道士女冠凡稱道士女冠者僧尼同若於其受業師與伯叔父母同其於弟子與兄弟之子同斷罪依新頒律凡律自頒降日為始若犯在已前者並依新律擬斷斷罪無正條凡律令該載不盡事理若斷罪而無正條者引律比附應加應減定擬罪名轉達刑部議定奏聞若輒斷決致罪有出入者以故失論徒流遷徙地方徒役各照所徒年限並以到配所之日為始𤼵塩塲者每日煎鹽三斤鐵冶者每日炒鐵三斤另項結課直𨽻府州江南發山東塩塲江北𤼵河間塩塲福建布政使府分𤼵兩淮鹽塲浙江布政司府分𤼵山東鹽塲江西布政司府分𤼵泰安萊蕪等處鐡治湖廣布政司府分𤼵廣東海北鹽塲河南布政司府分發浙東鹽塲山東布政司府分發浙東鹽塲山西布政司府分𤼵鞏昌鐵冶北平布政司府分𤼵平陽鐵冶陜西布政司府分𤼵大寜綿州鹽井廣西布政司府分𤼵兩淮鹽塲廣東布政司府分𤼵浙西鹽塲海北海南府分𤼵進賢新喻鐵冶四川布政司府分𤼵黄梅興國鐵冶流三等照依地里逺近定𤼵各處荒蕪及瀕海縣安置直𨽻府州流陜西福建布政司府分流山東北平浙江布政司府分流山東北平江西布政司府分流廣西湖廣布政司府分流山東河南布政司府分流福建山東布政司府分流福建山西布政司府分流福建北平布政司府分流福建陜西布政司府分流福建廣西布政司府分流廣東廣東政政司府分流福建四川布政司府分流廣西邊逺充軍直𨽻州府江南𤼵定遼都指揮使司北平都指揮使司所轄永平衛山西都指揮使司陜西都指揮使司所轄蘭州衛河州衛江北𤼵廣東都指揮使司所轄海南衛四川都指揮使司所轄貴州衛雅州千戸所福建布政司府分發北平都指揮使司所轄永平衛浙江布政司府分𤼵定遼都指揮使司江西布政司府分發山西都指揮使司湖廣布政司府分𤼵山西都指揮使司河南布政司府分𤼵廣西都指揮使司所轄南寜衛太平千戸所山東布政司府分𤼵廣東都指揮使司所轄海南衛山西布政司府分𤼵廣東都指揮使司所轄南南衛北平布政司府分發廣西都指揮使司所轄南寜衛太平千戸所陜西布政司府分𤼵廣西都指揮使司所轄南寜衛太平千戸所廣西布政司府分𤼵陜西都指揮使司所轄蘭州衛河州衛廣東布政司府分𤼵山西行都指揮使司四川布政司府分𤼵廣西都指揮使司所轄南寜衛太平千戸所明㑹典卷一百二十七
