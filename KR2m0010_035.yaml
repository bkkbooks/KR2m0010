  text: 明會典卷三十五户部二十庫藏四鹽法一國朝鹽課専以供給邉方糧餉或水旱凶荒亦藉賑濟其利甚博然必私鹽禁嚴而後官鹽流通法久弊滋故自洪武以來鹽法條件因時漸密云諸司職掌凡天下辦鹽去處每嵗鹽課各有定額年終各該運司并鹽課提舉司將周嵗辦過鹽課出給中信通關具本入遞奏繳本部委官於內府户科領出立案附卷作數及查照繳到通關內該辦鹽課比對原額有虧照數追理其客商興販鹽貨各照行鹽地方發賣不許變亂合用引目各運司申報本部委官關領本部將來文立案委官于內府印造候畢日將造完引目呈堂關領回部督匠編號用印完偹明立文案給付差來官收領回還取領狀入卷備照其各處有司凡有軍民客商中賣官鹽賣畢隨即將退引赴住賣官司依例繳納有司類解各運司運司按季通類解部本部塗抹不用凡遇開中鹽糧務要量其彼處米貴賤及道路逺近險易明白定奪則例立案具奏出榜給發各司府州并淮浙等運司張挂召商中納鹽課衙門兩浙都轉運鹽使司許村場鹽課司本司仁和場鹽課司嘉興分司西路場鹽課司鮑郎場鹽課司蘆瀝場鹽課司海沙場鹽課司橫浦場鹽課司松江分司下沙場鹽課司青村鹽場課司袁浦場鹽課司浦東場鹽課司天賜場鹽課司青浦場鹽課司下沙二場鹽課司後增下沙三場鹽課司後增寧紹分司西興場鹽課司錢清場鹽課司三江場鹽課司曹娥場鹽課司龍頭場鹽課司石偃場鹽課司鳴鶴場鹽課司清泉場鹽課司長山場鹽課司穿山場鹽課司玉泉場鹽課司大嵩場鹽課司昌國正鹽場鹽課司正統五年裁革溫台分司永嘉場鹽課司雙穗場鹽課司長林場鹽課司黃巖場鹽課司杜瀆場鹽課司長亭場鹽課司天富南鹽場鹽課司天富北鹽場鹽課司兩淮都轉運鹽使司泰州分司富安場鹽課司拼茶場鹽課司安豐場鹽課司角斜場鹽課司梁垜場鹽課司東臺場鹽課司何垜場鹽課司小海場鹽課司草偃場鹽課司丁溪場鹽課司淮安分司白駒場鹽課司劉莊場鹽課司廟灣場鹽課司板浦場鹽課司伍祐場鹽課司徐瀆浦場鹽課司莞瀆場鹽課司臨洪場鹽課司新興場鹽課司通州分司吕四場鹽課司餘東場鹽課司餘中場鹽課司餘西場鹽課司金沙場鹽課司西亭場鹽課司石港場鹽課司馬塘場鹽課司掘港場鹽課司豐利場鹽課司天賜場鹽課司福建都轉運鹽使司上里場鹽課司浯州場鹽課司海口場鹽課司牛田場鹽課司惠安場鹽課司􅜉州場鹽課司潯美場鹽課司山東都轉運鹽使司膠來分司信陽場鹽課司濤洛場鹽課司石河場鹽課司行村場鹽課司登寧場鹽課司西由場鹽課司海滄鹽課司濵樂分司王家岡場鹽課司官臺場鹽課司固堤場鹽課司髙家港場鹽課司新鎮場鹽課司寧海場鹽課司豐國場鹽課司永阜場鹽課司利國場鹽課司豐民場鹽課司富國場鹽課司永利場鹽課司河間長蘆都轉運鹽使司滄州分司海潤場鹽課司阜民場鹽課司利國場鹽課司海豐場鹽課司利民場鹽課司益民場鹽課司海阜場鹽課司阜財場鹽課司富民場鹽課司潤國場鹽課司深州海盈場鹽課司青州分司越支場鹽課司嚴鎮場鹽課司惠民場鹽課司興國場鹽課司富國場鹽課司蘆臺場鹽課司豐財場鹽課司厚財場鹽課司三汊沽場鹽課司石碑場鹽課司歸化場鹽課司濟民場鹽課司廣東鹽場提舉司小江場鹽課司石橋場鹽課司東管場鹽課司招收場鹽課司靖康場鹽課司矬銅場鹽課司隆井場鹽課司淡水場鹽課司雙恩場鹽課司鹹水場鹽課司歸德場鹽課司黃田場鹽課司海晏場鹽課司香山場鹽課司海北鹽課提舉司博茂場鹽課司新安場鹽課司武郎場鹽課司茂暉場鹽課司白石場鹽課司大小英感思場鹽課司臨川場鹽課司三村馬裊場鹽課司官寨丹兜場鹽課司白沙場鹽課司博頓蘭馨場鹽課司西鹽白皮場鹽課司蠶村調樓場鹽課司陳村樂會場鹽課司東海場鹽課司河東都轉運鹽使司解河東場分司成化十年設解鹽西場分司同前解鹽中場分司𢎞治二年設陜西靈州鹽課司漳縣西河縣四川鹽課提舉司廣福等三井鹽課司仙泉井鹽課司華池等三井鹽課司郁山井鹽課司通海等三井鹽課司塗甘井鹽課司上流等九井鹽課司永通等七井鹽課司羅泉等五井鹽課司黃市等二井鹽課司大寧縣大寧場鹽課司福興等六井鹽課司新羅等二井鹽課司雲安場等五井鹽課司富義等十三井鹽課司鹽井衛黑鹽井鹽課司白鹽井鹽課司雲南黑鹽井鹽課提舉司黑鹽井鹽課司阿陋猴井鹽課司琅井鹽課司白鹽井鹽課提舉司白鹽井鹽課司安寧鹽井鹽課提舉司安寧鹽井鹽課司五井鹽課提舉司師井鹽課司諾鄧鹽井鹽課司山井鹽課司大井鹽井鹽課司順蕩鹽井鹽課司鹽課數目諸司職掌兩浙鹽運司鹽場三十五處嵗辦鹽二十二萬四百五十七引二百斤零福建鹽運司鹽場七處嵗辦鹽一十萬四千五百七十二引三百斤零山東鹽運司鹽場一十九處嵗辦鹽一十四萬三千三百八十七引一百五十斤零兩淮鹽運司鹽場二十九處嵗辦鹽三十五萬二千五百七十六引一百斤零北平河間鹽運司後改河間長蘆鹽運司鹽場二十四處嵗辦鹽六萬三千一百五十三引三百斤零廣東鹽課提舉司鹽場一十四處嵗辨鹽四萬六千八百五十五引一百斤零海北鹽課提舉司鹽場一十五處嵗辦鹽二萬七千四十引二百斤零陜西西和縣嵗辦鹽一十三萬一千五百三十斤零漳縣嵗辦鹽五十一萬五千六百七十斤零靈州嵗辦鹽二百八十六萬七千四百七斤後增四川鹽課提舉司上流等九井鹽課司嵗辦鹽一百九十一萬九千五百七十斤零永通等七井鹽課司嵗辦鹽八十四萬四千七百七十斤郁山井鹽課司嵗辦鹽二十二