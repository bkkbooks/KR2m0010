body:
  text: 明會典卷二十四户部九㑹計軍馬所在轉運供給諸司職掌已具見今各處錢糧除存留外其起運京邊各有定數備列於後若起運南京者則見於南京户部諸司職掌凡有軍馬去處所需錢糧等項本部必先查考某處蓄積有餘某處歲用不給量其水陸路程地理逺近難易計其人夫多寡明白具奏差官於糧多去處撥運闕糧衛分支用事例𢎞治十五年起運數目浙江布政使司夏稅京庫折銀麥八萬石每石折銀二錢五分絲綿三十二萬兩絲綿折絹一百九十六萬兩每二十兩折絹一匹秋糧供用庫白熟粳米二萬三千石准糙米二萬五千三百石酒醋麵局糯米二千七百石准糙米二千九百七十石惜薪司白熟糯米一十五石一斗准糙米一十六石六斗一升京庫白糯米一百石准糙米一百一十石光祿寺白熟粳米二萬五千石准糙米二萬九千五百石白熟糯米四千三百八十五石七斗准糙米四千八百二十四石二斗七升京庫折銀米六十萬五百石每石折銀二錢五分京倉兊軍儧運米六十萬石山東布政使司夏稅京倉小麥三萬四千七十五石京庫綿布二萬匹准小麥二萬四千石絲折絹五萬四千九百九十匹一丈五尺四寸七分六釐邊倉本色小麥一萬八千七百七十五石鈔五十萬錠照例折銀准小麥五萬石綿布一十三萬二千四百一十八匹准小麥一十五萬石千九百一石六斗秋糧京倉米石十五萬五千六十石京庫綿布一萬五千匹准米一萬五千石綿花六萬二千斤准米六千二百石邊倉本色米二十萬八千八百石綿布一十二萬九千匹准米一十二萬九千石綿花七萬七千斤准米七千七百石京場草二百一十二萬四千三百八十束京庫折銀草一百七萬五千一百束邊場草三十二萬束河南布政使司夏稅京倉糧一萬七千九百五十石邊倉小麥九千六百石秋糧京倉米二十九萬二千六十五石三斗京庫絹二萬五千七百五十匹零布八萬一千八百三十七匹花絨一十三萬三百四十二斤四錢户口食鹽鈔六百一十四萬七千一百一十貫京場草一百五十三萬七千八百九十六束邊倉粟米七萬一千六百九十石山西布政司夏稅大同麥二萬九千三百石大同府銀億庫布四萬二千五百匹准麥五萬一千石宣府麥一萬七千八百石萬全萬億庫布六千匹准小麥七千二百石雁門等三關麥一萬二千石京庫農桑絲折絹四千七百七十七匹秋糧大同米二十九萬石千五百石宣府米二萬五千石大同府銀億庫綿布一十八萬匹准米一十八萬石花絨八萬斤准米八千石萬全都司萬億庫綿布六萬二千五百匹准米六萬二千五百石花絨二萬二千五百斤准米二百五十石大同在城並在外草場草二百四十四萬四千四百四十八束偏頭等三關米八萬一千石偏頭關並代州草場草一百一十萬束邊庫户口食鹽鈔一百五十萬七千三百九十錠三貫湖廣布政使司夏稅京庫折絹二萬二千九百二十一匹一丈六尺五寸三分九釐六絲七忽二微二塵七纖一渺秋糧京庫折銀米七萬二千石每石折銀二錢五分江西布政司夏稅京庫折銀米麥六萬石每石折銀二錢五分絲絹折絹八千二十九匹二丈三尺八寸四分八釐農桑絲折絹三千四百八十六匹二丈二尺一寸一分五釐秋糧京倉兊軍儧運米四十萬石京庫折銀米九十七萬石每石折錢二錢五分闊白苧布五萬匹准米三萬五千石福建布政使司秋糧京庫折銀米三十六萬四千石每石折銀二錢五分廣東布政使司秋糧京庫折銀米四十萬石每石折銀二錢五分順天府夏稅京倉小麥二千一百一十石邊倉喜峰口等倉小麥八千七百四十石秋糧京倉米豆七百三十七石邊倉山海等倉米豆二萬三千七百二十石七斗京庫人丁絲折絹二萬一千七十五匹一丈六尺六寸農桑絲折絹一千七百六十四匹一丈七尺三寸一釐三毫五絲地畝綿花絨九千四百三十六斤一十四兩五錢六分四釐戶口食鹽鈔四十九萬五百九十三貫直𨽻真定府夏稅京倉糧九千二百五十石邊倉糧五千五百七十石京庫絹一萬四千一百三十三匹九尺五寸秋糧京倉米二萬五千九百一十八石四斗六升邊倉米一萬二千五百石京庫花絨三萬五千三十三斤一兩户口食鹽鈔一百二十四萬五百六十八貫折銀草三十八萬九千束每束折銀三分直𨽻保定府夏稅京倉小麥二千七百五十石邊倉小麥一千三百五十石京庫人丁絲折絹一千一百五十六匹農桑絲折絹一千六百一十一匹九尺二分五釐本色絲二百二十四斤一兩一錢二分户口食鹽鈔四十五萬九百三十六貫錢鈔中半秋糧京倉米三千四百二十五石京庫花絨九千五百七十四斤八兩五錢六分邊倉米二萬一千五百石京場草六十八萬九千二百九十束京庫折銀草三十六萬束每束折銀三分直𨽻大名府夏稅京倉小麥八千五百二十五石京庫闊白布二千四百匹邊倉小麥九千一百石邊庫闊白布一千三百匹京庫人丁絲折絹六千八百二十八匹一丈四尺一寸農桑絲折絹八百一十匹二丈七尺九寸四分一釐二毫邊庫户口食鹽鈔七十八萬一千一百三十一貫秋糧京倉米三萬四百石邊倉米四萬一千四百五十石邊庫闊白布二千匹京場草一百六萬一千七百八十二束京庫折銀草四十五萬五千束邊倉草二十九萬束直𨽻河間府夏稅京倉小麥六千六百六十八石邊倉小麥三千一百七十五石京庫人丁絲折絹四千九百二匹二丈六尺三寸三分一釐三毫七絲五微秋糧京倉米一萬五千九百石邊倉米八千八百五十石京庫地畝花絨四千六百四十七斤一十三兩五錢京場草六千萬六千九百束邊倉草五萬束京庫綿花絨三萬斤准米三千石鈔一十四萬四千六百七十貫直𨽻順德府夏稅京倉麥豆共一萬一千四百五十石京倉農桑絲折絹三百五十一匹一丈二尺六寸八分五耗人丁絲折絹一千五百四十八匹地畝綿花絨五千五斤四兩户口食鹽鈔三十五萬七千三百五十四貫邊倉麥豆共五千四百二十石秋糧京倉米豆芝麻一萬六千九百七十五石邊倉米豆共五千九百六十石京場草三十四萬九千一百束京庫折銀草一十七萬三百束直𨽻廣平府夏稅京倉麥一萬五百五十石邊倉麥四千六百石京庫絹三千一百四十匹一丈八寸四分户口食鹽鈔六十六萬三千一十八貫秋糧京倉米一萬一千八百石邊倉米二萬一千三百石京庫花絨一萬四千五百八十四斤一十五兩八錢一分京場草五十三萬九千八百束京庫折銀草二十四萬四千束每束折銀三分五釐直𨽻永平府京庫絹一百七十四匹一丈五寸京場草三萬束應天府秋糧京倉兊軍儧運米一十萬石京庫折銀草三十萬三千九百包每包折銀三分直𨽻蘇州府夏稅京庫麥三萬石每石折銀二錢五分秋糧在京各衙門白粳米五萬四千八百石京倉兊軍儧運米六十五萬五千石京庫闊白布十九萬匹准米十九萬石折銀米七十六萬六千石每石折銀二錢五分絲折絹一萬二千五百五十五匹折銀草三十七萬包每包折銀三分户口食鹽鈔八十萬八千四百六十四錠二貫直𨽻松江府夏稅京倉糧六萬石每石折銀二錢五分秋糧京倉米四萬七千六十五石五斗京庫布一十七萬五千匹折銀米二十八萬石折銀草二十二萬包每包折銀三分户口食鹽鈔四十六萬三千六十五貫直𨽻常州府夏稅京庫折銀小麥九萬石秋糧在京吏部等衙門米四萬三千四百七十二石七斗三升京倉兊軍儧運米一十七萬五千石京庫折銀米二十五萬六千石每石折銀二錢五分折闊白布米五萬石每石折布一匹折銀草五十三萬包每包折銀三分人丁絲折絹一千五百七十三匹一丈一尺一分七釐一毫農桑絲折絹三百二十四匹二丈四尺六寸户口食鹽鈔二百三十六萬一千三十九貫直𨽻淮安府夏稅京倉糧三千石京庫絹一千四百六十一匹一丈九尺七寸五分秋糧京倉米二萬六千石京庫絹一千四百四十一匹一丈九尺折銀草二十三萬七千包每包折銀三分戶口食糧鈔一百九十六萬八千三百九十貫直𨽻鎮江府夏稅京庫人丁絲折絹二百五匹二丈八尺六寸二分七釐九毫農桑絲折絹一十三匹二丈七尺六寸三分户口食鹽鈔二十四萬七千三百六十五貫錢鈔中半直𨽻徽州府夏稅京庫折銀糧二萬二千石每石折銀二錢五分秋糧京庫折銀糧七萬一千石每石折銀二錢五分户口食鹽鈔七十七萬九千七百貫直𨽻寧國府秋糧京倉兊軍儧運米三萬石京庫折銀草五十七萬包每包折銀三分户口食鹽鈔五十一萬五千九百九十三貫直𨽻鳳陽府夏稅京倉糧三千石京庫絹一千三百八十匹折銀草一十一萬八千包每包折銀三分户口食鹽鈔九十五萬六千二十五貫直𨽻安慶府夏稅京庫農桑絲絹三百五十三匹二丈九尺折銀草一十二萬包每包折銀三分户口食鹽鈔一十四萬五千二百七十六貫九百三十文錢鈔中半直𨽻太平府夏稅京庫人丁絲折絹一百二匹九尺六寸四分二釐農桑絲折絹一百一十六匹一丈六尺九分四釐户口食鹽鈔一十七萬八千八百四十五貫錢鈔中半直𨽻揚州府夏稅京倉小麥二百石秋糧京倉米六萬一百石京庫折銀草二十二萬包絲綿折絹八百四十一匹二丈四尺直𨽻廬州府夏稅京倉小麥一千石京庫農桑絲絹六百八十七匹一丈三尺二分六釐二毫五絲折銀草五萬包每包折銀三分户口食鹽鈔十十九萬九千六百四十二貫三百七十五文錢鈔中半直𨽻池州府夏稅京庫絲折絹一十五匹農桑絲折絹一百九十八匹秋糧京倉兊軍儧運米二萬五千石京場草六萬二千包京庫户口食鹽鈔一十二萬九千九百三十八貫直𨽻徐州夏稅酒醋麵局小麥一千石京庫絲折絹三千二十五匹二丈二寸四分二釐五毫八絲農桑絲折絹二千五百五十八匹二尺六寸九分五釐秋糧京倉兊軍米三萬石京庫折銀草五萬包每包折銀三分户口食鹽鈔五十一萬四千三百九十八貫直𨽻廣德州秋糧京庫折銀草二十三萬包每包折銀三分戶口食鹽鈔八十八萬二千八十四貫直𨽻滁州夏稅京庫農桑絲折絹二百一十七匹五尺四寸四分五釐折銀草一萬一千包每包折銀三分户口食鹽鈔五萬二千六百九十五貫直𨽻和州夏稅京庫農桑絲折絹九十五匹二丈七尺二寸六分户口食鹽鈔五萬九千九百一十貫錢鈔中半明會典卷二十四
