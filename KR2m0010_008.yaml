body:
  text: 明會典卷八吏部七驗封清吏司諸司職掌郎中員外郎主事掌邦之封爵國初封功臣因前代之制爵有五等曰公侯伯子男後子男革不封其有功封公侯伯者皆給誥劵或世襲或不世襲各因其功之髙下為等諸司職掌一凡公侯伯子男見職授封者必須隨即奏請封號爵祿等級及駙馬婚禮俱用具奏給授誥命劄付翰林院撰文具手本送中書舍人書寫尚寶司用寶完備擇日具奏頒降一凡功臣歿後加封公追封為王侯追封為公合封三代者照依追贈封爵一體追封其襲爵子孫非建立竒功異能生死只依本爵一凡命婦因子孫官爵封母并祖母者並加太字追封則不用一凡封贈公侯伯子男者其公侯夫人各從其爵伯子男夫人止封夫人不須用爵一凡功臣封號如開國輔運守正文臣之類非特奉聖旨不與一凡見封公侯伯子男封贈三代并妻室合依欽定事例各依見授名爵照例封贈事例凡勳階如特進光祿大夫柱國之類乃一品官所該給授公侯伯間有特旨給授者舊制亦惟本身受封始得後襲封者或有之諸司職掌公父祖父曽祖父各封某國公母祖母曽祖母各封某國夫人本官妻封某國夫人侯父祖父曽祖父各封某侯母祖母曽祖母各封某侯夫人本官妻封某侯夫人伯子男同諸司職掌凡受封官身死須以嫡長男承襲如嫡長男事故則嫡孫承襲如無嫡子嫡孫以嫡次子孫承襲如無嫡次子孫方許庶長子孫承襲不許攙越仍用具奏給授誥命劄付翰林院撰文具手本送中書舍人書寫尚寶司用寶完偹具奏頒降及孔氏襲封衍聖公如之其湖廣四川雲南廣西土官承襲務要本司委官體勘别無爭襲之人明白取具宗支圖本具官吏人等結狀呈部具奏照例承襲移付選部附選司勳貼黃考功附寫行止類行到任見到者關給劄付頒降誥勑事例洪武十三年奏定公侯封號曰開國輔運推誠宣力武臣某公某侯食祿若干石世襲者曰世襲某公某侯食祿若干石追封者曰開國輔運推誠宣力武臣其將軍某公某侯追封某王某公諡某凡公侯伯歿後子孫奏請襲爵本部奏準行該府保勘應否襲爵取具結狀宗圖連人送部奏請定奪凡土官承襲國初皆本部掌行洪武三十年以宣慰宣撫安撫長官等司職掌土兵改隸兵部其府州縣巡檢驛傳土官仍屬本部正統元年奏準土官在任先具應襲子姪姓名開報合干上司候亡故照名起送承襲六年奏準預取應襲兒男姓名造册四本都布按三司各存一本一本年終類送本部以憑查考以後每三年一次造繳天順二年奏準土官病故該管衙門委堂上官體勘應襲之人取具結狀宗圖連人保送赴部奏請定奪𢎞治二年奏準十年外文書到部者不準承襲五年詔十年內曽在本處上司具告者亦準承襲文武官俱有封贈武官歸兵部惟公侯伯以封爵從本司掌行與文職封贈制度具列于此諸司職掌一凡文職官一品至五品武職官一品至六品照依生前散官果有功迹合加封者例與加贈諸司職掌一凡公侯一品贈三代二品三品贈二代四品至七品贈父母妻室一凡文官一品至七品止封散官職事其合封三代二代并父母及妻者照依子孫見授職事照例封贈一凡封贈文官散官如上階特進光祿大夫光祿大夫之類非特奉聖旨者不與一凡文官應封贈祖父母父母妻室者照依欽定資格一品贈三代二品三品贈二代四品至七品贈一代各照見授職事依例封贈正一品至從七品曽祖父祖父父各照見授職事對品封贈正從一品曽祖母祖母母妻各封贈一品夫人正從二品祖母母妻各封贈夫人正從三品祖母母妻各封贈淑人正從四品母妻各封贈恭人正從五品母妻各封贈宜人正從六品母妻各封贈安人正從七品母妻各封贈孺人一凡遇前項封贈依例具本奏聞吏科給事中置立文簿附寫各該封贈爵職欽用勑符御寶本部抄録具印信手本送中書舍人書寫誥勑其文職官員申請封贈本部行移保勘如果於例相應然後照例施行一凡文職官一品至七品止封贈散官職事其合封一代二代三代者俱照見授職事父母見任者不封已致仕并不在任者封之能在任棄職就封者聽一凡諸子應封父母嫡母在所生之母不得封嫡母亡得並封若所生母未封贈不得先封其妻一兩子當封從一高者婦人因其子封贈而夫子兩有官亦從一髙者一應封妻者止封正妻一人如正妻生前未封已歿繼室當封者正妻亦當追贈其繼室止封一人一凡命婦因子孫品級封母并祖母者並加太字若已亡歿或曽祖祖父在者不加一凡正從七品至正從六品止封一次升至正從五品封贈一次升至正從三品封贈一次升至正從二品封贈一次升至正從一品封贈一次洪武十六年正從四品亦封贈一次一凡曽祖父母祖父母父母曽犯十惡姦盜除名等罪及例所封妻不是以禮娶到正室或係再醮倡優婢妾並不許申請一凡諸職官曽受贓者不許申請封贈之後但犯取受之贓並行追奪其祖父原有官進一階非因子封贈者不在追奪之例一凡婦人因夫子得封者不許再嫁如不遵守將所授誥敕追奪斷罪離異一凡在京官四品以上試職實授頒給誥命取自上裁已給誥命者亦須一考滿方許封贈五品以下官初到任試職一年後考核堪用者與實授仍具奏頒給誥敕不堪用者不與已給誥敕者亦須一考方許封贈一凡在外官員三年為一考稱職者頒給誥敕再考稱職聽請封贈其有才能卓異之人出自特恩者不拘此例事例凡武職子任在京文職成化二十三年詔書照依文官事例父職髙于子者依原職進一階職卑者從子官封凡在京品官考滿應得本身誥命或以親老乞停本身而移封其親者本部奏請定奪凡兩京官應得誥敕封贈其父有犯罪問革為民不該受封子將本身誥勑奏請移封者取自上裁凡公侯伯有加師保者𢎞治十四年奏準止授本身誥命不許乞贈三代國初因前代任子之制文官一品至七品皆得廕子一人以世其祿後乃漸為限制諸司職掌一凡用廕者以嫡長子如嫡長子有廢疾立嫡長子之子孫曽玄同如無立嫡長子同母弟曽玄同如無立繼室所生如無立次室所生如絶嗣者傍廕其親兄弟各及子孫如無傍廕伯叔及其子孫一凡用廕者孫降子曽孫降孫及傍廕者皆於合敘品從降一等一凡職官子孫廕敘正一品子正五品敘從一品子從五品敘正二品子正六品敘從二品子從六品敘正三品子正七品敘從三品子從七品敘正四品子正八品敘從四品子從八品敘正五品子正九品敘從五品子從九品敘正六品子於未入流品相應上等職事內敘從六品子於未入流品中等職事內敘正七品子於未入流品下等職事內敘一凡職官用廕各止一名年及二十五以上須試本經或四書能通大義其有不通者發回習學再試一凡廕官各具其父祖歷仕緣由去任身故嵗月并所授誥勑彩畫宗支指實該承廕人姓名年甲本處官司體勘房親揭照籍册别無詐冒及無廢疾過犯等事上司審驗相同保結申覆令親齎文解赴部一凡廕敘其逺方地面官員宜照原籍於附近布政司所轄去處銓用事例成化三年奏準在京三品以上官員子孫聽令一人送國子監讀書出身若大臣果有勳勞於國出自特恩録用其子孫者不在此限官員封贈有誥勑制度等第必視其品秩若頒給之制見於諸司職掌其後事例多不同今偹録之諸司職掌一公侯一品至五品皆授以誥命六品至九品皆授以勑命婦人誥敕同夫品級一公侯誥用玉軸一品官同伯子男誥用犀軸二品官同三品四品官用抹金軸五品以下用角軸一在京官四品以上試職實授頒給誥命取自上裁五品以下官初任試職一年後考核堪用者與實授頒給誥勑已入流倉官不須試職候一年任滿給與敕命守支未入流品官員俱與實授不給敕命在外官員三年為一考稱職者頒給誥勑升職官員合與實授者於本任內歷事一年後方可出給誥敕若有才能卓異之人出自特恩者不拘此例欽天監翰林院太醫院正官頒給誥敕取自上裁本部遇有應給誥勑官員具本奏聞仍具印信手本開寫合授散官并年籍腳色送中書舍人候書寫完偹本部具印信手本送尚寶司於御前用寶訖具奏御前頒給其有追奪為事官員誥敕具本奏繳內府會同吏科給事中中書舍人於勘合底簿內附寫為事緣由眼同燒毁事例洪武十七年奏定有封爵者給誥皆如一品之制惟公侯用玉軸伯子男用犀軸為别永樂二十二年詔五品以下官曽經一考稱職未給誥敕升用改除者一體封贈未及一考升用改除者滿日方給在京王府長史一體給誥洪熙元年令方面官到京曽經一考稱職給與本身誥命九年考滿方與封贈宣德元年令在外王府長史紀善九年無過者許給誥勑四年令文官有犯貪汚者追奪原給誥敕未給者不給五年令應授誥敕官員未授之先曽犯贓罪已經赦宥者悉免追奪若授誥敕之後犯贓罪雖經赦宥皆追奪十年令在外官員三年考滿稱職者給與誥敕正統二年奏準收糧經歷滿十萬石給與敕命三年令文官誥敕俱待九年考滿方與十二年定誥敕軸數一品五軸二品三軸三品二軸四品五品一軸六品以下一軸仍待三考滿方給天順元年奏定一品四軸二品三品三軸四品至七品二軸二年詔文官未及一考父母見在者授封其父在而母亡或母在而父亡者奏準共給一道凡各王府將軍郡主儀賓誥命禮部奏準移咨本部類奏撰寫用寶并造袱匣完偹該府具奏關領仍候禮部移咨到日類奏給授凡兩京應請誥敕官員三年考滿各衙門勘實移咨本部行考功司查其考稱出身歷任兩月一次具奏凡在外司府州縣等官九年考滿取給誥敕付考功司查其考稱平常仍行各該衙門掌印官勘實其巡撫巡按奏保旌異官員本部查曽經考滿果勘旌異者仍行都察院轉行巡按御史覆勘卓異政績具奏定奪凡兩京各衛收糧經歷三年考滿任內收糧十萬石之上者給與敕命凡誥敕用寶誥用制誥之寶敕用敕命之寶仍以文簿與誥敕各編字號復用寶識之文簿藏于內府凡功臣鐵劵刻其文於上以黃金填之左右各一面右給功臣左藏內府諸司職掌一自榮祿大夫至將仕佐郎凡九等十八級所餘官員合得散官照依定制奏聞給授及選部付到在京各衙門實授官員及考功考過試職一年堪用并三年稱職者合得初授升授散官具奏行移該衙門轉行給授一凡白身人入仕并雜職人等初入流者與對品初授散官任內歷俸三年初考稱職與升授散官又歷俸三年再考功迹顯著方與加授散官若考核平常者止與初授其任內未經初考遷調改除者仍照見授職事與初授散官已經初考合得升授遷調改除仍係本等品級者照見授職事與升授散官若升等者止與對品初授或有已得升授未經再考遷調改除仍係本等品級者照見授職事與升授散官已經再考合得加授遷調改除仍係本等品級者與加授散官若升等者止與對品初授其有先曽歷任二品三品等職今次降用若係有罪及闒茸不稱職貶降者照依見授職事與初授散官若量才任使不係貶降但今授職事比與原授降等其原授散官誥敕仍舊者亦照見授職事與對品初授散官俱於三年之後照例升授其加贈一節考驗本人生前功迹合得加授者照例給與正一品初授特進榮祿大夫升授特進光祿大夫從一品初授榮祿大夫升授光祿大夫正二品初授資善大夫升授資政大夫加授資德大夫從二品初授中奉大夫升授通奉大夫加授正奉大夫正三品初授嘉議大夫升授通議大夫加授正議大夫從三品初授亞中大夫升授中大夫加授太中大夫正四品初授中順大夫升授中憲大夫加授中議大夫從四品初授朝列大夫升授朝議大夫加授朝請大夫正五品初授奉議大夫升授奉政大夫從五品初授奉訓大夫升授奉直大夫正六品初授承直郎升授承德郎從六品初授承務郎升授儒林郎儒出身宣德郎吏才幹出身正七品初授承事郎升授文林郎儒出身宣義郎吏才幹出身從七品初授從仕郎升授徵仕郎正八品初授迪功郎升授修職郎從八品初授迪功佐郎升授修職佐郎正九品初授將仕郎升授登仕郎從九品初授將仕佐郎升授登仕佐郎明會典卷八
