發附近衛所充軍原係腹裏衛所者發邉衛充軍其客商收買餘鹽買求掣摯至二千斤以上者亦照前例發遣經過官司縱放及地方火甲里老知而不舉各治以罪巡捕官員乘機興販至二千斤以上亦照前例問發凡貧難軍民將私鹽肩挑背負易米度日者不必禁捕其豪強鹽徒聚衆撑駕大船張挂旗號擅用兵伏響器者巡捕巡鹽官兵尋訪擒捕若拒敵殺傷人命者俱梟首示衆各處鹽場無籍之徒號稱長布衫趕船虎光棍好漢等項名色把持官府詐害客商犯該徒罪以上及冉犯杖罪以下者俱發邉衛充軍凡偽造鹽引印信賄屬運司吏書人等將已故并逺年商人名籍中鹽來厯填寫在引轉賣􅫬騙財物為首者依律處斬外其為從并經紀牙行店戶運司吏書一應知情人等但計贓滿貫者不拘曽否支鹽出場俱發邉衛充軍又令各王府不許奏討食鹽其織造官有奏討引鹽越境貨賣者聼本部并戶科論奏治罪十四年令兩淮行鹽地方有司凡遇商人運到引鹽即拘告報數目於賣畢追收退引按季繳送運司聼巡鹽御史年終通查具奏如有不繳至五千引之上者該府州縣官聼本部參奏問罪清理鹽法官員事例永樂十三年差御史給事中內官各一員於各處閘支鹽課十四年差監察御史一員巡視河間運司私鹽宣德十年差鹽察御史一員於兩淮通州狼山鎮守提督軍衛巡捕私鹽正統元年差侍郎及監察御史巡視長蘆等處私鹽二年取回兩淮巡鹽御史三年取回兩淮兩浙長蘆整理鹽法內外官及御史等官又令兩淮兩浙長蘆等運司每嵗各差御史一員巡視及催督鹽課十一年令長蘆巡鹽御史兼理山東鹽法景泰元年差侍郎二員清理兩淮兩浙鹽法二年取回兩浙巡鹽御史令鎮守侍郎兼理鹽法三年令巡河御史兼理兩淮鹽法裁省巡鹽御史又差監察御史二員於兩浙兩淮巡鹽七年令廣西按察司各道分巡官兼催督各該鹽課司鹽課禁革姦弊又令四川按察司各道分巡官兼督鹽課天順四年令山西按察司分巡該道官兼巡視河東鹽池成化四年差都御史一員清理兩淮鹽法九年差監察御史一員于河東運司巡鹽十七年令雲南布政司提督銀場恭議兼理鹽法𢎞治元年差侍郎二員兼僉都御史清理兩淮兩浙鹽法二年令福建清軍御史兼理鹽法仍照兩淮等處巡鹽御史例年終具奏催辦過鹽課六年添設廣東按察司僉事一員専理鹽法十三年差都史一員清理兩淮鹽法運司鹽場官吏禁約事例正統元年奏準各鹽運鹽課司及各場官吏考滿考退等項到部者俱送户部發回住俸責限催辦未完鹽課其應考滿未起程者免赴京亦住俸催辦完日奏請定奪景泰元年令各鹽場大使守支九年應考滿者原經收已𣲖商鹽年久不至準給與後到客商其餘不盡之數交盤見任官攢依例給由令運司同知副使判官等官各定分司催督鹽課不得更易互管仍按季具數總司查併遇有考滿止開該催分司鹽數稽考及有事故等項但許附近分司𢃄管不得轉委二年令各處嵗辦鹽課經管官員務依時催督煎辦按季開報合千上司年終出給總足通關奏繳如有拖欠該九年考滿住俸催完方準給由又令各運司提舉司官吏縱容庫役門子那移作弊及分司官員鹽課司官攢通同富豪總催鑊稱人等詐害客商批驗所監掣官員并官攢作弊害人受贓滿貫者俱發邉衛充軍成化十六年令各處鹽課次年正月不完者該場官住俸杖追分司并運司官以十分為率三分不完者一體住俸其各官三年六年考滿巡鹽御史查勘任內鹽課完足方許起送若九年考滿所督鹽課過違年限不完者查送吏部降二級敘用官攢丁憂事故等項從巡鹽御史委官查盤經手鹽課交付接管官攢方許離任每年終分司各將辦過鹽課開報巡鹽御史查盤造册奏繳二十一年奏準各鹽場官皆周嵗考滿即守支所辦鹽課其有支盡附餘盤與見任官接管給由不得任外久住及任內托故去任每三年即令各處盤糧給事中御史查盤𢎞治元年令各處鹽場官仍舊九年考滿二年令巡鹽御史查考各處該年鹽課其有延至次年六月終不完者於本衙門遞降一級運使六年不完者一體施行又令各巡鹽御史清查各運司提舉司鹽場官自成化元年以後未經考退者不分在任改任但于任內有報足通關而虧欠鹽課一千引之上者俱作素行不謹一萬引者俱作貪官分司三年之內所屬場分各年有報完虧欠者亦作不謹六年亦所貪官俱行吏部定奪其攢典不分見役去役俱發為民又令各鹽場官攢如遇分司官吏到場及相識官員經過科𣲖總催頭目出辦銀貨答應者計贓彼此俱罪其稱拜見銷牌解册者俱問擬入已之贓若書算皂隸吏典人等下場求索者仍坐親管官鈐束不嚴之罪各該運司每場置立循環簿二扇責見役總催每月附寫使用數目于上月終賫送運司遞换書寫巡鹽御史不時查究八年令各運司運使及分司官任內鹽課拖欠者不許赴部考滿及别升官職十二年令各運司官考滿務開任內各年分已辦過正課若干補課若干如正課已完補課未完者亦不許申送給由茶鹽引印戶部鹽引之印篆文一顆戶部茶引之印篆文一顆鹽糧勘合并茶鹽引由契本銅版鹽糧勘合銅版一片茶糧勘合銅版一片鳯陽府廣濟關勘合銅版一片長淮關勘合銅版一片兩淮都轉運鹽使司銅版二十四片兩浙都轉運鹽使司銅版二十一片福建都轉運鹽使司銅版四片廣東鹽課提舉司銅版二片梧州府銅版一片海北鹽課提舉司銅版二片黑鹽井鹽課提舉司銅版二片河東都轉運鹽使司銅版四片安寧鹽井鹽提舉司銅版二片白鹽井鹽課提舉司銅版一片河間長蘆都轉運鹽使司銅版二片四川鹽課提舉司銅版一片五井鹽課提舉司銅版一片靈州鹽課司銅版一片鞏昌府銅版一片威楚鹽使司銅版二片延安府銅版三片廣西布政司銅版二片茶鹽銅版三片涼州鹽課司銅版一片契本銅版五片安寧鹽使司銅版二片龍江鹽倉銅版一片建昌府銅版二片茶由銅版一十片應天府置石灰山關銅版一片龍江關半印勘合銅版一片事例洪武間户部茶鹽引印及鹽糧勘合并茶鹽引由契本銅版俱收貯內府户科編號木記收貯户部凡遇各處急缺糧草則戶部奏請印刷編定召商開中正統十一年以戶部改為南京戶部具奏鑄換印與銅版各增南京二字於戶部之上仍收貯南京內府戶科遇開中本部差官至彼印刷編定賫赴開中處所給發其印及銅版木記用使年久平乏糢糊則奏請改鑄刋造權量權量本部掌行其制造見工部斛斗稱尺諸司職掌凡天下官民人等行使斛斗稱尺凡有一定決則頒行各司府州縣牧掌務要如式成造較勘相同印烙給降民間行使其在京倉庫等處合用斛斗稱尺等項本部較勘印烙發用明令凡斛斗稱尺司農司照依中書省原降鐡斗鐡升較定則樣製造發直𨽻府州及呈中書省轉發行省依樣製造較勘相同發下所屬府州各府正官提調依法製造較勘付與各州縣倉庫收支行用其牙行市鋪之家須要赴官印烙鄉村人民所用斛斗稱尺與官降相同許令行使事例洪武元年令兵馬司并管市司三日一次較勘街市斛斗稱尺并依時估定其物價在外府州各城門兵馬一體兼領市司宣德七年令重鑄鐡斛每倉發與一隻永為法則較勘行使正統元年令各布政司府州縣倉分歲收糧五十萬石及折收倉庫嵗收布絹等物十萬匹以上者工部各給鐡斛一張銅尺木各一把景泰二年令工部成造等稱天平各四十副須給本部及在外支收衙門掌管用使其所屬衙門許依式成造應用成化五年以新舊鐡斛大小不一仍令工部照依洪武年間法則鐡斛式樣重新鑄造發江南江北山東河南兊糧處令各處兊糧官員依式置造木斛送漕運衙門較勘印烙給發交兊以為永久定規十五年令鑄鐡斛頒給江西湖廣二布政司及各兊糧米次并支糧倉分較造木斛印烙收用其鐡斛仍識以成化十五年奏淮鑄成永為法則十三字及監鑄官員匠作姓名於上又令京城內外并順天府所屬地方凡諸色貨物行人依式製造平等斛斗稱尺天平等件赴官較勘印烙方許行使違者如律治罪兩鄰知情扶同隱匿互相借用者事發一體究治時估物貨價值髙下不一官司與民貿易隨時估計已具諸司職掌今以內外買辦物料備列于後而贓罰時估則見刑部光祿寺買辦厨料見本寺職掌之下諸司職掌凡民間市肆買賣一應貨物價值須從州縣親民衙門按月從實申報合于司遇有買辦軍需等項以憑照價收買明令凡內外軍民官司並不得指以和顧和買擾害於民如果官司闕用之物照依時值對物兩平收買或客啇到來中買物貨並仰隨即給價如或減駁價直及不即給價者從監察御史按察司體察或赴上司陳告犯人以不應治罪憲綱一時估仰府州縣行屬務要每月初旬取勘諸物時估逐一覆實依期開報毋致髙擡少估虧官損民一上司收買一應物料仰本府州縣照依按月時估兩平收買隨即給價毋致虧損於民及縱令吏胥里鋪戶人等因而尅落作弊事例宣德八年令各處買辦諸色物料聼差殷實大戶賫價於出産地方收買供用九年令應天府買辦物料於都稅司支鈔給主正統二年令買辦物料該部委官一員會同府縣委官拘集該行鋪戶估計時價關出官錢仍委御史一員會同給與鋪行收買送納三年令買辦賞賜達官器皿及鄉試會試合用紙劄等物并遇有買辦之類皆估計價鈔數目照舊具奏限一月內赴庫領散不許過違如官司暫用凳卓器皿係買辦者用畢送工部厰寄收以待再用八年令朝廷所用物件免有司買辦查出産地方於存留糧內折收解京沿途官司應付船隻腳力南直𨽻府并山東者送北京該衙門收福建廣東浙江湖廣江西四川者送南京該衙門收嵗終具奏九年令嵗用果品厨料照舊支領官錢派買不許於存留糧內折徵令凡遇造作等項急用物料止於官庫關用有不敷者方許具奏先給官價派買景泰六年令京城內不係常久開張鋪靣及小本出攤提買等項買賣俱免買辦明會典卷三十六
