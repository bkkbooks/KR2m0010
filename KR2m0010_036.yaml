body:
  text: 明會典卷三十六户部二十一鹽法二事例洪武初定鹽引目內條例凡兩淮運司遇客商販賣鹽貨每鹽二百斤為一引給與半印引目每引納官本米若干收米入倉隨即給引支鹽凡各場竈丁人等除正額鹽外將煎到餘鹽夾帶出鹽場及私鹽貨賣者絞百夫長知情容縱或通同貨賣者同罪兩鄰知私煎鹽貨不首者杖一百充軍凡守禦官吏巡檢司巡獲私鹽俱發有司歸問犯人絞有軍器者斬鹽貨車船頭匹沒官引領牙人及窩藏寄放者杖一百發煙瘴地面充軍挑挑擔馱載者杖一百充軍有能自首者免罪常人捉獲者賞銀一十兩仍須追究是何場分竈戶所賣鹽貨依律處斷鹽運司拿獲私鹽隨發有司追斷不許擅問有司通同作弊脫放與犯人私鹽同罪凡起運官鹽每引四百斤帶耗鹽一十斤為二袋客鹽每引二百斤為一袋經過批驗所依數掣摰官鹽自揚子江至湖南襄鄧俱係經過官司辨驗鹽引如無批驗掣摰印記者笞五十押回盤驗凡諸色軍民權豪勢要人等乘坐無引私鹽船隻不伏盤驗者杖一百軍民俱發煙瘴地面充軍有官者依上斷罪罷職凡將官運鹽貨偷取或將沙土插和抵换者計贓比常盜加一等如係客商鹽貨以常盜論客商將買到官鹽插和沙土貨賣者杖八十凡客商興販鹽貨不許鹽引相離違者同私鹽追斷如賣鹽了畢五日之內不行繳納退引者杖六十將舊引影射鹽貨同私鹽論罪偽造鹽引者處斬凡起運官鹽并場户往來船載上倉將帶軍器者並行處斬凡諸人買私鹽食用者減販私鹽人罪一等因而販賣者處絞凡各處鹽運司運載官鹽許用官船轉運如竈户鹽丁却用别船裝載即同私鹽科斷置兩淮都轉運鹽使司定嵗辦鹽數每引四百斤官給工本米一石置兩浙都轉運鹽使司定嵗辦鹽其引之斤重亦如兩淮二年置山東北平河間都轉運鹽使司及靈州鹽課司廣東海北提舉司嵗辦鹽課每引四百斤置河東都轉運鹽使司嵗辦鹽課每引二百斤十五年置雲南鹽課提舉司十七年定兩淮兩浙鹽工本鈔每引二貫五百文河間廣東海北山東福建四川每引俱二貫二十三年定兩淮兩浙各竈戶每丁嵗辦小引鹽十六引引重二百斤復鹽工丁半之其餘工丁四引令兩淮兩浙引鹽斤重復如舊二十七年令優免鹽丁雜泛差役令兩浙兩淮竈戶有犯笞杖斷決徒流遷徙雜犯死罪者止杖一百仍發煎鹽其事故竈丁勘實以附近有田糧丁力相應人戶撥補凡公侯伯及文武四品以上官不得令家人奴僕行商中鹽侵奪民利二十八年令各處邉方缺糧本部奏請開中納米定為則例出榜召商於缺糧倉分上納仍先編置勘合并底簿發各該布政司并都司衛分及收糧衙門收掌如遇客商納完糧填寫所納糧并該支引鹽數目付客商賫各該運司及鹽課提舉司照數支鹽其底簿發各運司及鹽課提舉司收掌候中鹽客商納米完賫執勘合到比對硃墨字號相同照數行場支鹽又令兩淮兩浙鹽運司煎鹽工本照各場額辦鹽數關鈔遣監生管運給散山東福建河東止于官庫內關領給散永樂十七年令各處客商原中不拘資次鹽引遇到即支又令中鹽客商賫倉鈔赴運司運司查原來印信比對明白即與𣲖場支鹽宣德四年令各運司提舉司查勘中鹽客商土民年逺事故者行原籍官司每引給資本鈔二十錠五年罷差監生于兩淮兩浙給散煎鹽工本鈔每嵗照山東例于官庫內關領給散令往來內官內使官軍人等夾帶私鹽者許應捕官軍人等盤拿九年令各處運司并鹽課司但有客商夾帶私鹽者原支引鹽俱沒入官十年令各處總兵鎮守及沿河捕盜錦衣衛官監察御史浙江等布政司直𨽻府州縣各巡按監察御史及按察司官俱設法緝捕私鹽如巡檢司捉獲私鹽者準作事迹若雖獲盜而不獲私鹽者不準升用其各處軍官縱家人興販者家人問罪正犯發本衛充軍若所管旗軍餘丁興販者該管官旗一體坐罪又令各運司提舉司查勘過限未繳鹽引及客商貫址造册送部行各處巡按御史及各按察司追究銷繳又令竈戶犯該徒罪有力者準納米贖罪正統元年令各處有首獲私鹽者鹽入官以鈔照時值給賞又令兩淮運司竈戶有死絶充軍者有司於有力民户內僉補若有清出幼丁亦照舊額收補二年令竈丁逃移者鹽課勘實停徵令兩淮官鹽聽客商於貴州地方貨賣鹽引于鎮逺府告銷又令兩淮兩浙貧難竈丁除原額鹽課照舊收納其有餘鹽者不許私賣俱收貯本場運司造册發附近州縣每一小引官給米麥二斗又令各該中鹽衛分造册一本具客商名數徑繳本部其鹽運司仍將該司額辦鹽數申報每年終支過引鹽及客商姓名另具總數徑申本部注銷又令各處竈丁有犯俱免納米及調場笞杖者的決雜犯死罪與徒流罪者除嵗辦額鹽外令每日煎鹽三斤死罪準工五年流罪準工四年徒五等各照年限俱計日煎鹽贖罪裁革寧波府岱山蘆花二場鹽課司鹽課歸并大嵩場鹽課司催辦令兩淮運司永樂年間客商該支引鹽以十分為率支與淮鹽四分其六分兊與山東運司支給不願兊者聽令守支三年奏準召商納馬中鹽每上等馬一匹一百二十引中等馬一匹一百引令竈户起運官鹽運司給批總填數目用印鈐蓋定限給付執照各處批驗所巡檢所巡檢司照數掣摯盤驗送納畢在京於戶部在外於本衙門送繳批發運司查銷又令各運司給客商引目每引目每引納中夾紙一張至關引之時類解户部倒引又令兩淮運司雲南鹽課提舉司官鹽客商中納支給不敷者準于河東陜西福建廣東各提舉司兊支又令河間長蘆及河東陜西運司官鹽客商中納支給不敷者準於廣東海北鹽課司兊支又令長蘆運司商鹽願發賣别處者聼於所在官司告驗轉給文慿改易地方其退引水程仍照例告􅌳又令各邉召商中納鹽糧淮浙兼中如以十分為率淮鹽八分浙鹽二分或淮鹽七分浙鹽三分淮鹽止米麥二色浙鹽雜糧皆準又令陜西四川雲南中鹽客商免納引紙又令販賣私鹽軍民人等有能捕獲百斤以上至二千斤以上為止每鹽一斤賞鈔一貫其近海近場窮軍貧民有以肩挑易米者不必具奏徑自問結四年令兩淮貧難竈丁戶下該徵稅糧於本州縣存收免令逺運五年裁革昌國正監場其鹽課歸併附近穿山場管理添設下砂二場三場鹽課司官吏皆如下砂場設置令兩淮兩浙長蘆運司每嵗額辦鹽課以十分為率八分給與守支客商二分另為收積在官候邉方急缺糧儲召中以所積見鹽人到即支謂之存積其八分年終挨次給守支客商謂之常股凡中常股價輕存積價重又令年逺客商中鹽未支者每引給資給資本鈔三十錠願守支者聼六年令兩淮兩浙勸借支鹽客商米麥收積該場賑給貧難竈丁其該支引鹽仍挨次放支七年奏準雲南布政司及遼東等都司衛分每年終將當年收過糧數并客商姓名貫址填給勘合字號俱造册􅌳部其各處運司提舉司於年終亦將本年客商賫到勘合字號并姓名貫址及中過鹽糧造册􅌳部比對查考令兩淮運司所屬鹽場以路塗便利者為上場寫逺者為下場富安安豐梁垜東臺河垜五上場配臨洪一下場丁溪草偃小海白駒劉莊伍祐六上場配徐瀆一下場新興角斜拼茶豐利馬塘石港西停金沙餘西九上場配板浦一下場餘中餘東吕四三上場配莞瀆一下場掘一上場配廟灣一下場凡支鹽之時上場𣲖盡方以下場輳數補𣲖以便鹽商八年奏準永樂洪熙宣德年間客商原中淮浙長蘆運司引鹽願兊支河東山東福建運司者每一引支與二引不願者聼其守支九年令雲南各鹽課司每竈户添撥餘丁二人免其差役専一採薪煎鹽鹽課不許擅除又令客商中鹽不許過三千引其所納糧限半年內完足不完者扣日截出勘合十年令客商年久不得支鹽願兊支者如係原中地方準量各場逺近三七關非原中地方一引兊與二引者量地逺近中半關支又令山東官臺場鹽課每二引折納綿布一匹運赴登州府偹遼東支用又令湖廣衡州長沙二府屬兩淮行鹽地方十三年令兩淮運司于各場利便處置立倉囤每年以揚州蘇州嘉興三府所屬附近州縣及淮安倉并兊軍餘米內量撥收貯凡竈户若有餘鹽送赴該場每二百斤為一引給與米一石年終具奏造册申部其鹽召商于開平遼東甘肅等處開中不拘資次給與兩浙運司及松江嘉興二分司仁和許村等場亦照此例十四年令增兩淮兩浙存積鹽為四分召商供給邉儲又令中鹽客商先將倉鈔賫赴本部送禮部鑄印局辨驗前去運司支鹽景泰元年奏準兩浙運司各場凡近場滷丁令於鹽場煎辦鹽課水鄉竈户離場三十里之外者每丁嵗出米六石或折收價物置立倉庫收貯委官専掌按季查算滷丁代納鹽數若干照名給與食用令增兩淮兩浙存積鹽為六分又令各處該上鹽糧倉分置立內外字號底簿二扇用半即勘合內號一扇本倉收外號一扇申送運司候各商賫倉鈔前來比對印信硃墨字號相同仍查原投印信勘合并印信流通文簿俱同每於十二月𣲖場支給造册繳部查照免商人赴部辨印又令起運兩京官鹽并客商發賣引鹽南京於龍江批驗所掣摯俱赴江東門北京於張家灣批驗所掣摯俱赴崇文門開報兩京戶部各委官看驗批放入城各門不許混放又令竈丁餘鹽每引給米淮鹽八斗浙鹽六斗長蘆鹽四斗又令商人支鹽賣畢截角退引過期不繳者行各處巡鹽御史按察司查提又令各運司提舉司及所屬鹽課司原有山場灘蕩供採柴薪者不許諸人侵占其年久逃移竈戶及充軍死絶者即於見在竈户內以空間壯丁撥補又令各處客商引鹽出場遷延三月不去者拘收入官又令各商中到存積官鹽人到即支其常股鹽每年依期將見在商人挨次量髙低場分𣲖搭封驗引目赴場關支備將商名貫址勘合字號米鹽數目搭𣲖場分造册繳部年終仍將放支過商名鹽數類總造册送部查照又令收糧衙門類填勘合每道客商不得過二十名年終通將商人糧斛鹽數并倉鈔勘合造册送部查考二年令客商報占鹽數遷延一年之上不報完者即於常股鹽內𣲖撥挨次關支三年奏準淮浙山東長蘆運司收到客商退引按季類解福建河東陜西運司并四川雲南廣東靈州小鹽池等鹽課提舉司年終解俱開客商某於某年月日支出官鹽若干發賣某行鹽地方及某月日繳到及已繳若干未繳若干其有沉匿在庫通同庫役人等轉賣影射私鹽者照私鹽榜例問罪令各處客商越境貨賣引鹽者不問多寡俱發遼東鐡嶺衛充軍其所在官司并巡捕巡司官兵人等不行如法緝拿者一體治罪受財縱放者邉衛充軍若應補人捉獲及諸人告發者量行給賞又令客商官鹽內夾帶私鹽者官私鹽俱沒入官又令兩淮運司各場竈户有將該徵糧草不分起運存留願折納餘鹽者每正糧米麥豆五斗草五包束各折徵鹽一小引四年奏準凡有代支引鹽者戶部行各該府衛體勘各具結狀繳部方準代支及關給資本鈔或兊换引鹽如有詐冒發邉衛充軍令四川鹽課提舉司於每年三月以前具上中下三等鹽課司并商名引鹽數目挨次挨號扣課均𣲖開布按二司并巡鹽官處定於三月初一日會同照引唱名給散以引目連各商通帖散帖封發各鹽課司收庫分𣲖各井逐月支鹽隨時批訖退引給付各商限次年三月終繳送提舉司類總轉達布按二司并巡鹽官比對相同照數完造嵗報若遇急用邉糧開中務亦先年出榜次年三月唱名支鹽又令各運司提舉司客商引目支鹽出場該場即為截角仍具商名引數申繳總司收照添設四川仙泉井鹽課司副使一員五年令廣東海北二鹽課司竈丁有私煎餘鹽