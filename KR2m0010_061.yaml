body:
  text: 明㑹典卷六十一禮部二十冠禮皇太子冠禮洪武元年定前期太史監承制筮曰工部制衮冕逺遊冠折上巾服翰林撰祝文祝辭禮部備儀注中書省承制命某官為贊既筮日遣官奏告天地宗廟禮部告示文武百官於皇城守宿至期之前一日內使監令陳御座香案于奉天殿中侍儀司設皇太子次於殿之東房賔贊次於午門外皇太子拜位於丹陛上正中賔贊受制位於皇太子拜位之西北東向承制官位於御座之東西向宣制官位於皇太子位之東北西向賔贊拜位於內道之東北面西上餘陳設如朝會儀至日侵晨執事官設罍洗於東階東南罍在洗東篚在洗西內使監官設皇太子冠席於殿上東南西向醴席於西階上南向張帷幄於東序內設褥席於帷中又張帷於序外御用監陳服於帷內東領北上衮服九章逺遊冠絳紗袍折上巾絳紗袍緇纚犀簮二物同箱在服南櫛實于箱又在南司尊實醴於側尊加勺羃設醴於席之南設坫於尊東置二爵于坫進饌者實饌設於尊北諸執事者各就其所冕九旒逺逰冠十八梁折上巾冠冕各盛一箱執事者各執其物立於階西東面北上鼓初嚴文武百官具朝服次嚴護衛等各就位東宫官導從皇太子至殿門贊禮同太常博士引詣奉天殿東房侍衛官入詣謹身殿奉迎三嚴文武百官入就位皇帝服通天冠絳紗袍御輿以出樂作升座樂止捲簾鳴鞭報時訖賔贊就位樂作四拜樂止侍儀司跪承制降自東階詣賔前稍東西向稱有𠡠賔贊跪侍儀宣制曰皇太子冠命卿等行禮宣訖贊皆四拜文武侍從班俱就殿內位賔贊及應行禮官詣東階下位東宫官太常博士詣殿前東房引皇太子入就冠席樂作皇太子即席樂止賔贊詣罍洗樂作搢笏盥帨出笏樂止升自西階執事者捧折上巾進賔降一等受之右執項左執前進皇太子席前北面祝云云皆隨時撰述祝畢跪冠樂作興席南北面立贊冠者進席前跪正冠興立於賔後內使跪進服服訖樂止賔揖皇太子復坐賔贊降詣罍洗如前儀贊冠者進跪脫折上巾置於箱興以授內使內使跪受置於席執事捧逺逰冠進賔降二等受之樂作進冠如前儀贊冠者進跪簮結紘內使進服樂止賔揖皇太子復坐詣罍洗脫冠俱如前儀執事者捧衮冕進賔降三等受之進冠亦如前儀畢太常博士引皇太子下降自東階樂作由西階升即醴席南向坐樂止賔詣罍洗樂作盥帨升自西階樂止贊冠取爵詣司尊前酌醴授賔跪進爵於皇太子席前祝云云祝畢皇太子搢圭跪授爵樂作飲訖奠爵執圭進饌者捧饌設於皇太子席前皇太子搢圭食訖樂止執圭執事官徹爵與饌太常博士引皇太子降自西階殿東房易朝服詣丹墀拜位樂作東宫官各就拜位樂止賔贊詣皇太子位稍東西向賔少進字之辭曰奉𠡠字某太常博士啓皇太子再拜跪聽宣𠡠畢復再拜興進御前跪奏曰臣不敏敢不祗奉奏畢復位侍立官並降殿復位在位官皆四拜禮畢皇帝興樂作還宫樂止內給事導皇太子入內朝見皇后如朝正旦儀百官以次出明日謁廟如時享禮陪祀官先赴廟庭皇太子服衮冕執圭太常博士前導由南門入至拜位皇太子及陪祭官皆再拜興皇太子升殿詣神位前三上香復位及陪祭官皆再拜畢皇太子還宫明日百官俱朝服詣奉天殿稱賀退易公服詣東宫稱賀賜宴成化十四年續定習儀前期一日各執事官先於本部習儀次日赴文華殿習儀告廟前期一日遣官具特牲告廟行一獻禮陳設前期一日錦衣衛設幕次文華殿之東序鴻臚寺設節案於殿內之北正中設香案於節案之南設冠席於殿內之東南向設醴席於西上南向內使張帷幄於東序內設座椅几案䄄褥於幄中又張帷於序外陳袍服皮辨衮服圭帶舄等物各以箱盛置於帷中案上具翼善冠皮辨九旒冕各用盤盛以紅袱覆之置於東階之南案上光祿寺設盥洗所於東階冠案之南稍東設司尊所於醴席之西南司尊者實醴於尊側加勺羃設坫於尊東置二爵於坫進饌者實饌設於尊北諸執事者皆立於其所教坊司設樂遣官是日早上位具皮辨服御奉天殿傳制遣官文武百官各具朝服侍班如常儀制詞曰朕皇太子某冠命卿等持節行禮迎節至期內侍導皇太子先於東序帷幄中坐候持節將至禮部詣東序啓皇太子迎節樂作禮部官導皇太子出迎於殿門外持節官捧節入置於案頭立于節案之東樂止禮部等官導皇太子詣香案前樂作行四拜禮畢樂止持節官同賔贊并宣𠡠戒等官序立於東南盥洗所之次就冠席禮部啓皇太子就冠席樂作禮部等官導皇太子詣至冠席內侍二人夾侍皇太子即席西南向坐樂止初加鴻臚寺鳴讃贊行初加冠禮樂作引禮序班引賔贊皆詣盥洗所賔贊皆搢笏以次盥手訖出笏樂止鳴讃二人稍南東西向立賔贊官升自東階稍西向內使揭蓋袱樂作以盤捧翼善冠升賔降階一等受之樂止賔右手執冠後左手執冠前進皇太子席前北面立祝曰吉月令辰乃加元服懋敬是承永介景福樂作賔跪進冠興復位贊者跪正冠興立於賔後樂止禮部官啓易服皇太子入帷幄易新袍服出禮部官啓復坐再加鳴讃贊行再加冠禮樂作內侍揭蓋袱以盤捧皮辨升賔降二等受之樂止賔右手執皮辨後左手執皮辨前前進如前儀祝曰冠禮申舉以成令德敬慎威儀惟民之式樂作內侍釋翼善冠賔跪進皮辨興復位贊者跪正皮辨興立於賔後樂止禮部官啓易服皇太子入帷幄易皮辨服舄出禮部官啓復坐三加鳴讃贊行三加冠禮樂作內侍揭蓋袱以盤捧冕旒升賔降階三等受之樂止進如前儀祝曰章服咸加飭敬有䖍永固皇圖於千萬年樂作內侍釋皮辨冠賔跪進冕旒興復位贊者跪簮結紘興立於賔後樂止禮部官啓易服皇太子入帷幄易衮服出禮部官啓復坐釂禮鳴讚贊行釂禮禮部官啓皇太子詣醴席樂作禮部等官引皇太子降自東階由西階升即醴席南向坐樂止光祿寺官舉醴卓樂作引禮序班引賔贊詣盥洗所賔贊搢笏盥手訖出笏升西階贊者取爵詣司尊所酌醴授賔賔執爵詣席前立樂止祝曰㫖酒孔馨嘉薦載芳受天之福萬世其昌畢賔跪進爵鳴讃贊皇太子搢圭受爵置於案教坊司啓樂奏喜千春之曲次啓進酒皇太子舉爵飲訖奠爵於案樂止光祿寺官進饌樂作饌至案樂止饌訖贊出圭徹卓賔贊復位受𠡠戒鳴讃贊受敕戒禮部官啓請皇太子詣受敕戒位禮部等官引皇太子降自階由東階詣拜位樂作引禮禮序班引宣𠡠戒官詣皇太子拜位稍東西向立樂止稱有制鳴讃贊跪皇太子跪宣敕戒曰孝事君親友於兄弟親賢愛民居仁由義毋怠毋驕荗隆萬世樂作俯伏興四拜興平身樂止禮部官捧節出樂作禮部等官引皇太子送節至殿門外引還東序內侍引還宫持節及賔贊宣敕戒等官復命謁見當日皇太子具冕服謁祭奉先殿用樂行禮如常儀謁祭奉慈殿用樂行禮如常儀畢皇太子仍具冕服詣太皇太后前謝詣皇太后前謝詣上位前謝詣皇后前謝俱行五拜三叩頭禮俱用樂稱賀次日早上位具皮辨服御華蓋殿鴻臚寺奏請升殿文武百官具朝服稱賀詞曰皇太子冠禮既成禮當慶賀行五拜三叩頭禮畢就詣文華殿行賀皇太子禮錦衣衛陳設儀仗如常儀明會典卷六十一
