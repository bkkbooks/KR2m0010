body:
  text: 明㑹典卷八十五禮部四十四祭祀六合祀神祇一諸司職掌一在京十一廟北極真武祭物用素三月三日九月九日遣南京太常寺官祭道林真覺普濟禪師祭物用素三月十八日遣南京太常寺官祭都城隍八月祭帝王後一日遣南京太常寺官祭祠山廣惠二月十八日遣南京太常寺官祭五顯靈順四月八月九月二十八日遣南京太常寺官祭漢秣陵尉蔣忠烈晉成陽卞忠貞公宋濟陽曹武惠王南唐劉忠肅王元衛國忠肅公已上五廟俱四孟朔日歲暮除日遣應天府官祭惟蔣忠烈舊廟四月二十六日加一祭故功臣位號令具列于後正殿中山武寧王徐達開平忠武王常遇春岐陽武靖王李文忠寧河武順王鄧愈東甌襄武王湯和黔寧昭靖王沐英東序都指揮使馮國用郢國公僉都督耿再成西海武莊公僉都督丁德興濟國公都督同知張德勝蔡國忠毅公靖海侯吳􅍬海國襄毅公平章康茂才蘄國武義公副使茆成東海郡公西序參政胡大海越國武莊公都督同知趙德勝梁國公廣德侯華髙巢國武莊公都督同知俞通海虢國忠烈公江隂侯吳良江國襄烈公宣寧侯曹良臣安國忠烈公安陸侯吳復黔國威毅公副使孫興祖燕山忠愍侯右正祭中山武寧王以下六人配以郢國公以下十五人又兩廡各設牌一面總書故指揮千百户衛所鎮撫之靈四孟歲暮遣駙馬都尉祭若正旦清明中元孟冬冬至又别遣太常寺官祭武寧王大功坊之家廟後增祀神祇漢前將軍壽亭侯關公廟四孟歲暮遣應天府官祭五月十三日又遣南京太常寺官祭天妃宫正月十五日三月二十三日遣南京太常寺官祭京都太倉神廟二八月十五日遣南京户部官祭司馬馬祖先收神廟二八月中旬擇日遣南京太僕寺官祭已上俱南京北極佑聖宫即真武廟三月三日九月九日遣太常寺官祭都城隍廟五月十一日遣太常寺官祭京都太倉神廟二八月中旬擇日遣户部官祭司馬馬祖先牧神廟二八月中旬擇日遣太僕寺官祭元世祖廟二八月中旬擇日遣順天府官祭漢前將軍壽亭侯關公廟五月十三日遣太常寺官祭宋文丞相祠二八月中旬擇日遣順天府官祭東嶽泰山廟三月二十八日遣太常寺官祭靈濟宫正旦冬至萬夀聖節遣內閣禮部及內官各一員祭二真君生辰遣禮官祭已上俱京師諸司職掌一各處聖帝明王忠臣烈士載在祀典不係淫祀者其廟宇陵寢皆要備知其處每年定奪日期或差官往祭或令有司自祭本部悉帝王陵廟伏羲氏商髙宗俱陳州祭漢光武孟津縣祭周世宗鄭州祭宋太祖太宗真宗仁宗俱鞏縣祭已上並屬河南神農氏鄠縣祭舜帝寧逺縣祭已上並屬湖南軒轅氏延安府祭周文王武王成王康王漢髙祖景帝俱西安府祭漢文帝咸寧縣祭漢武帝興平縣祭漢宣帝長安縣祭後魏文帝富平縣祭隋髙祖扶風縣祭唐髙祖三原縣祭唐太宗醴泉縣祭唐憲宗蒲城縣祭唐宣宗涇陽縣祭已上並屬陜西髙陽氏髙辛氏俱滑縣祭商中宗內黃縣祭元世祖順天府祭已上並屬北直𨽻堯帝東平州祭少昊氏曲阜縣祭已上並屬山東媧皇氏趙城縣祭商湯王榮河縣祭已上並屬山西夏禹王宋孝宗俱㑹稽縣祭已上屬浙江祝文維某帝王功加當時德垂後世陵寢所在邱止益䖍維時仲春秋謹具牲醴庶品用伸祀禮尚享事例洪武三年遣官訪厯代帝王陵寢仍命各行省之臣同詣所在審視若有廟祀并具圖以進四年遣使祭厯代帝王陵寢始罷天下府州縣祀三皇九年遣官視厯代帝王陵寢凡三十六陵令百步內禁入樵採設陵户二人看守有司督近陵之民以時封培每三年一傳制遣道士齎香帛分詣各府州縣陵寢處所令有司致祭凡遇登極俱遣官分投祭告各處祠廟北直𨽻開州忠烈廟祀元死事臣郭嘉通州開平忠武王祠以燕山侯孫興祖配享真定北嶽廟恆山之神容城劉靜修祠祀元儒劉囚永平夷齊廟舊有封號今止稱殷伯夷叔齊之神永平韓昌黎祠祀唐韓文公愈山海關顯功祠祀中山武寧王徐達古北口靈威廟祀宋楊業南直𨽻鎮江焦光祠祀漢隱士焦光常州泰伯祠洪武初有御製祭文又蘇州亦有廟常州吳季子廟洪武初賜額曰嘉賢常州陳司徒廟祀隋臣陳果仁江隂陳烈士廟烈士宋人名忠蘇州吳公祠祀孔門弟子言偃蘇州泰伯廟蘇州伍子胥廟今稱吳大夫伍公之神又杭州亦有廟蘇州范文正公祠祀宋參知政事范仲淹又陜西慶陽亦有祠蘇州韓蘄王廟祀宋韓世忠蘇州魏了翁祠祀宋參知政事魏文靖公蘇州顧侍郎祠祀顧野王蘇州兩尚書廟祀國朝夏忠靖公原吉周文襄公忱吳江二髙祠祀越范蠡晉張翰唐陸龜蒙松江三陸廟祀孫吳陸丞相遜以其子大司馬杭及從子丞相凱配享徽州廣惠廟隋郡人汪華有保障功後立廟祀之宋加封廣惠王寧國義烈廟祀宋赤心將劉晏寧國褒烈廟祀宋宣州守李光太平忠臣廟祀洪武初樞密院判花雲王䁀及知府許瑗皆以死勤事者池州西祠祀梁昭明太子統貴池文節祠宋通判趙昴發夫婦死節祀之鳯陽顯濟廟神莫詳所自國初禱雨有應祀之揚州旌忠廟祀宋死事之臣王方魏全髙郵康澤祠祀宋人耿遇德淮安平江祠祀永樂間漕運總兵陳瑄安慶余忠襄公祠祀元守臣余闕後以前守臣韓建之及義兵萬户李宗可配享皆同時死節者滁州豐山廟及柏子潭廟俱以本名稱其神徐州靈源𢎞濟廟河平神廟龍神廟俱歲祭山西平陽中鎮廟祀中鎮霍山之神平陽平水祠今以本號稱其神平陽薛文清祠祀翰本朝禮部左侍郎兼林院學士薛瑄蒲州西海廟西海之神蒲州河瀆廟大河之神汾州永澤廟今稱白彪山馬跑泉之神汾州狄武襄廟祀宋將狄青長子崔令祠祀唐縣令崔元靖沁州南山神廟及焦龍神廟俱稱以本名沁州龍泉神廟今稱伏牛山龍泉之神山東泰安東嶽廟泰山之神泰安孫明復祠以其徒石守道配享兖州黃石公祠兖州顔孟二氏祠兖州宗聖公祠兖州青山廟今稱為青山之神兖州大河神祠正統間有朝宗順正惠通靈顯廣濟之稱兖州泗水神廟今稱以本名沂州東鎮廟沂山之神萊州東海廟東海之神安平顯惠等廟國朝塞張秋决口功成改張秋為安平鎮立真武龍王天妃三廟以鎮之賜額曰顯惠又修黃陵岡河口功成亦賜額曰昭應俱祀之海州衛德勝廟永樂中廣寧伯劉江禦倭冦有功請賜額以祀真武海州衛都督及永康侯廟成化中以都督衛青及永康侯徐安生備倭有功祀之遼東北鎮廟醫巫閭山之神河南濟瀆廟大濟之神河南中嶽廟嵩山之神懷慶北海廟北海之神均州黃丞相廟祀漢循吏建成侯黃霸新鄭子産廟祀春秋鄭子産密縣卓太𫝊祠祀漢循吏褒德侯卓茂滎澤紀信祠今稱漢將軍紀公又四川順慶府亦有廟祀歸德協忠廟祀唐臣張巡許逺配以雷萬春南霽雲姚誾賈賁四人河南二程祠又博野亦有二程祠湯隂嶽王廟祀宋武穆王飛又杭州亦有墳墓衛輝三仁廟祀殷微子箕子比干衛輝衛源廟今以本名稱其神衛輝黑龍神廟今稱本名陜西藍田三吕祠祀宋寶文閣學士吕大忠及其弟大鈞大臨華隂西嶽廟華山之神邠州姜嫄公劉二廟岐山周公廟郿縣橫渠祠祀宋儒張載隴州西鎮廟吳山之神甘州武勇祠祀伏羌伯毛忠榆林余肅敏祠祀尚書余子俊浙江杭州伍子胥廟稱號與蘇州同杭州靈衛廟祀宋錢塘令朱蹕暨金勝祝威二將杭州鄒詹事徐贊善二祠祀洪熙宫僚鄒濟徐善述杭州于少保祠祀兵部尚書于謙紹興南鎮廟會稽山之神紹興孝女廟祀漢孝女曹娥後配以宋孝女朱娥仁和禇公廟祀唐臣禇遂良山隂愍孝廟祀宋孝子蔡定㑹稽旌忠廟祀宋南渡時義士唐琦嵊縣貞婦祠祀宋臨海王貞婦蕭山劉侯廟祀漢郡守劉寵蕭山德惠祠祀宋縣尹楊時及本朝魏尚書驥嚴州烏龍廟今稱以本名金華越國公祠洪武初祀忠臣胡大海近以按察副使陶成配享金華正學祠祀宋儒何基王柏元儒金履祥許謙四人溫州仁濟廟祀晉郡人周凱溫州忠惠廟祀宋死事人徐震溫州忠烈廟祀宋教授劉士英溫州忠惠廟祀宋死事臣張理青田誠意伯廟祀洪武初劉基樂清忠烈侯廟祀唐死事人田居邠嘉興陸宣公祠祀唐相陸贄海寧許侯廟唐忠臣許逺生於海寧特祀之江西南昌忠臣廟祀洪武初平章趙德勝樞密判官李繼先左副指揮使劉齊統軍元帥許圭右副元帥趙國昭同知元帥朱潜元帥副使牛海龍千户張子明張德山百户徐明總管夏茂江西行省都事葉思成知洪都葉琛臨海同知趙天麟等一十四人新淦蕭公廟祀邑人蕭伯軒及其子叔祥孫天任萍鄉甘侯廟祀章太守甘車宜春仰山祠祀宜山二龍之神廬陵忠節祠祀宋歐陽文忠修楊忠襄邦又胡忠簡銓周文忠必大楊文節萬里文忠烈天祥本朝劉忠愍球李忠文時勉廣信張叔夜祠景泰中以永豐知縣鄧顒死節配享祠中貴溪謝文節祠祀宋忠臣謝枋得饒州忠臣廟在康郎山祀樞密同知丁普郎張志雄等三十五人皆國初死戰者九江崇烈廟祀元江州總管李黼以其姪秉昭及義兵萬户李宗可配享九江狄梁公廟祀唐司空狄仁傑湖廣德安淮瀆廟大淮之神武昌昭勇廟祀孫吳將軍甘寧常德陽山廟祀陽山之神以征南將軍梁松配享道州周濂溪祠沅州英顯廟祀唐刺史林公沅州顯應廟祀明山之神長沙洞庭廟祀洞庭湖龍神湘隂黃陵廟祀舜二妃湘隂屈原廟今稱楚三閭大夫屈平氏之神衡州南嶽廟衡山之神嶽州謝晦廟今稱宋荆州刺史謝公之神澧州彭思王廟祀唐刺史李元則沔陽馬侯廟祀漢新息侯馬援沔陽諸葛武侯祠寶慶賀參政祠洪武初參政賀興隆死事立祠祀之龍陽潘將軍廟祀孫吳潘太常濬龍陽張將軍廟祀漢將軍張飛四川成都江瀆廟大江之神成都三守廟祀蜀郡太守秦李氷漢文翁宋張成都先主廟以諸葛武侯配享合州鄉賢祠舊有祠後增祀宋守臣王堅及安撫使張珏潼川旌忠廟祀南唐東川節度使夏魯琦馬湖顯應祠以元人于法之神著靈彼土祀之龍州李龍陽廟州人李龍遷仕梁有功德今稱梁龍陽李公之神福建福州靈濟宫祀南唐徐知誥知訓兄弟候官麻刺王饗堂永樂間麻刺國王入貢卒于候官賜諡康靖今歲祭其墓建寧靈通廟祀唐京畿令謝夷甫建安朱子祠以文肅黃幹文簡劉爚文正蔡沉文忠真德秀配享又徽州亦有祠將樂道南祠祀宋儒楊時延平威寧廟祀五代閩將劉瓊延平顯惠廟祀隋汀州刺史穆肅延平旌福廟祀宋將樂令陳攄尤溪忠顯廟祀宋烈士余望尤溪忠愍廟祀宋武節郎趙師檟福陽熊去非祠祀宋儒熊禾汀州漁滄廟祀唐銀青光祿大夫樊令汀州王推官祠祀景泰中推官王得仁上杭褒忠祠祀正統中巡按監察御史五驥及福建都指揮丁泉廣東廣州南海廟南海之神廣州天妃廟今山東直𨽻諸處多有廟不具載廣州楊都堂祠祀景泰時僉都御史楊信民後以按察副使毛吉配享南海真武靈應祠南海忠義祠洪武初祀南海民關敏崖山三忠祠祀宋忠臣文天祥陸秀夫張世傑韶州張文獻及余襄公祠祀唐張九齡宋余靖近以唐刺史鄧文進配享于文獻祠中肇慶包孝肅公祠祀宋郡守包丞相拯瓊州靈山祠神有六曰靈山曰香山曰瓊崖曰通濟曰定邊曰班帥今並祭之瓊州髙山廟祀毗耶山之神電白髙凉夫人廟祀神髙州太守馮寶妻洗氏電白靈湫廟今稱以本名廣西南寧三公祠祀宋狄青孫沔余靖後配以雍守蘇緘及推官談必慶逺葉參議祠天順間府同知葉禎父子同死事贈官歲祀之雲南雲南二忠祠祀洪武間使臣王忠文公禕及尚書吳雲黔寧王廟祀西平侯沐英以其子定逺王晟配貴州鎮逺侯廟祀永樂中總兵官顧成已上在外府州縣明㑹典卷八十五
