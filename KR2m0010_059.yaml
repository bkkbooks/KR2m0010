body:
  text: 明㑹典卷五十九禮部十六房屋器用等第諸司職掌一凡官員葢造房屋並不許歇山轉角重簷重栱繪畫藻井其樓房不係重簷之例聴從自便公侯前㕔七間或五間兩厦九架造中堂七間九架後堂七間七架門屋三間五架門用金漆及獸面擺錫環家廟三間五架俱用黒板瓦盖屋脊用花様瓦獸梁棟斗栱簷角綵色繪飾牕房柱用金漆或黒油飾其餘廊廡庫厨從屋等房從宜葢造俱不得過五間七架一品二品㕔堂五間九架屋脊許用瓦獸梁棟斗栱簷桷青碧繪飾門屋三間五架門用緑油及獸面擺錫環三品至五品㕔堂五間七架屋脊用瓦獸梁棟簷桷青碧繪飾正門三間三架門用黒油擺錫環六品至九品㕔堂三間七架梁棟止用土黄刷正門一間三架黒門鐵環一品官房舍除正㕔外其餘房舍許從宜葢造比正屋制度務度减小不許太過其門牕户牖並不許用朱紅油漆一庶民所居房舍不過三間五架不許用斗栱及綵色装飾一器皿公侯一品二品酒注酒盞用金餘用銀三品至五品酒注用銀酒盞用金六品至九品酒注酒盞用銀餘皆用滋漆木器並不許用硃紅及抹金描金雕琢龍鳳文庶民酒器用錫盞用銀餘滋漆一傘葢一品二品銀浮屠頂茶褐羅表紅絹裏三簷三品四品用紅浮屠茶褐羅表紅絹裏三簷已上傘盖俱用黒色茶褐雨傘俱用紅油絹五品用紅浮屠頂青羅表紅絹裏雨簷雨傘同四品六品至九品用紅浮屠頂青絹表紅絹裏兩簷兩傘俱用油紙一官員牀面屛風槅子並用雜色漆飾不誰雕刻龍鳯文并金飾硃漆一官員鞍轡公侯一品二品用銀减鐵事件䩞用描銀三品至五品用銀减鐵事件䩞用油畫六品至九品用擺錫鐵事件䩞用油畫一凡軍官軍士應用弓矢止是黒漆弓袋箭囊並不許用硃漆描金粧飾一已上服色器皿房屋等項並不許雕刻刺繡古帝王后妃聖賢人物故事及日月龍鳳獅子麒麟犀象等形明令凡官民服色冠帶房舍鞍馬貴賤各有等第上可以兼下下不可以僣上官員任滿致仕與見任同其父祖有官身沒非犯除名不叙子孫許居父祖房舍衣服車馬比父祖用有官者依品級其御賜者及軍官軍人服色不在禁例一車輿並不得雕飾龍鳳紋職官一品至三品許用間金粧飾銀螭繡帶青幔四品五品素絲頭繡帶青幔六品至九品用素雲頭素帶青幔轎子比同車製庶民車用黒油齊頭平頂皂幔轎子比同車製並不許用雲頭一帳幔並不許得用赭黄龍鳳紋職官一品至三品許用金花刺繡紗羅四品五品刺繡紗羅六品以下許用素紗羅一傘葢庶民並不得用羅絹凉傘許用油紙雨傘一鞍轡庶民不得描金惟用銅鐵粧飾稽古定制一在京功臣宅舍地勢寛者住宅後許留空地十丈住宅左邉右邊各許留空地五丈若見住舊居所在地勢窄隘已有年矣左右前後皆是軍民所居止仍舊居不許那移軍民以留地一京城係人煙輻輳去處其地有限設使官員之家往往窺覷住宅左右前後空地日侵月占圍在牆内作園種植菜蔬及為㳺玩處所甚妨軍民居住且京城官員不下數千若一槩倣傚京城内地多為菜園百十萬軍何處居住今後官員住宅照依前定丈尺不許多留空地如有過此即便退出與軍民居住令子孫赴告官給園地另于城外量撥一在京文職官員所居房屋臨時奏請量撥居住凡公侯内外文武四品以上官不得令子孫家人奴僕於市肆開張鋪店生放錢債及出外行商中鹹興販物貨以給家用器物之類遣人扵外賣買以給家用不係商賈取利者不在禁例一古先哲王之制大邑不過三國之一中五之一小九之一且如國王所居之城九里公侯所居之城止得三里伯止得一二里伯八十步子男止得一里古人尊卑之分如此今已矣功臣之家不守分限往往扵住宅前後左右多占地丈葢造亭館或開掘池塘以為㳺翫似此越禮犯法所以不能保守前功共享太平之福一古人扵地有王氣之處往往埋金以厭之或井其地以洩之前代帝王如此用心今京城已故各官多有不諳道理扵住宅内自行開挑池塘養魚種蓮以為玩好非惟洩斷地胍實于本家不利以致身亡家破今後京城内官員宅院不許開挑池塘亦不得于内取土築墻掘成坑坎事例洪武三年令寺觀庵院除殿宇梁棟門牕神座案卓許用紅色外其餘僧道自居房舍並不許起造斗栱彩畫梁棟及僣用紅色什物床榻椅卓六年令凡各處僧道寺觀金采装飾神佛龍鳳等像除舊有外不許再造凡舟車坐轎除紅漆外許雜色漆飾五品以上車用青幔餘並不許其坐轎止許婦人及官民老疾者乗之凡傘葢京城内一品二品許用其餘止許用雨傘京城外聴用之凡帳幔職官一品至五品許用綾羅紗被褥用紵絲錦繡六品至九品帳幔用紗絹被褥用綾羅紬絹庶民用紬絹布十六年令尚書侍郎左右都御史通政使大理寺卿應天府尹國子祭酒翰林等學士許張傘葢三十五年申明軍民房屋不許葢造九五間數一品二品㕔堂各七間六品至九品㕔堂梁棟止用粉青刷飾庶民所居房舍從屋雖十所二十所隨所宜葢但不得過三間官員傘葢不許用金繡硃紅裝飾公侯駙馬伯與一品二品同官民人等不許僣用金酒爵其椅卓木器之類並不許用硃紅金飾鞍轡馬頷下纓并鞦轡俱用黒色不許紅纓及描金嵌金天青硃紅粧飾軍民用鐵事件黒緑油䩞餘同諸司職掌正統十二年令庶民房屋架多而間少者不在禁限景泰四年令在京三品以上許乗轎其餘不許違例在外各衙門俱不許乗轎天順八年詔京城内外寺觀今後不許増修請額成化九年申明兩京官員油傘遇雨任用其凉傘京城内不許張設若出郊出外不拘此限𢎞治七年申明兩京及在外文武官員除奉有特㫖及文職例應乗轎者止許四人扛擡其兩京五府管事并在京在外鎮守守偹等項公侯伯都督等官不分老少皆不許乗轎違例乗轎及擅用八人者指實奏聞明㑹典卷五十九
