body:
  text: 明會典卷一百四十二刑部十七雜犯明律拆毁申明亭凡拆毁申明亭房屋及毁板榜者杖一百流三千里夫匠軍士病給醫藥凡軍士在鎮守之處丁夫雜匠在工役之所而有疾病當該官司不為請給醫藥救療者笞四十因而致死者杖八十若已行移所司而不差撥良醫及不給對證藥餌醫治者罪同賭博凡賭博財物者皆杖八十攤場錢物入官其開張賭坊之人同罪止據見發為坐職官加一等若賭飲食者勿論閹割火者凡官民之家不得乞養他人之子閹割火者違者杖一百流三千里其子給親囑託公事凡官吏諸色人等曲法囑託公事者笞五十但囑即坐當該官吏聽從者與同罪不從者不坐若事已施行者杖一百所枉罪重者官吏以故出入人罪論若為他人及親屬囑託者減官吏罪三等自囑託已事加本罪一等若監臨勢要為人囑託者杖一百所枉重者與官吏同罪至死者減一等若受贓者並計贓以枉法論若官吏不避監臨勢要將囑託公事實迹赴上司首告者升一等私和公事凡私和公事者減犯人罪二等罪止笞五十失火凡失火燒自己房屋者笞四十延燒官民房屋者笞五十因而致傷人命者杖一百罪坐失火之人若延燒宗廟及宫闕者絞社減一等若於山陵兆域內失火者杖八十徒二年延燒林木者杖一百流二千里若於官府公廨及倉庫內失火者亦杖八十徒二年主守之人因而侵欺財物者計贓以監守自盜論其在外失火而延燒者各減三等若於庫藏及倉厫內燃火者杖八十其守衛宫殿及倉庫若掌囚者但見火起皆不得離所守違者杖一百放火故燒人房屋凡放火故燒自己房屋者杖一百若延燒官民房屋及積聚之物者杖一百徒三年因而盜取財物者斬殺傷人者以故殺傷論若放火故燒官民房屋及公廨倉庫係官積聚之物者皆斬其故燒人空間房屋及田場積聚之物者各減一等並計所燒之物減價儘犯人財産折銼陪償還官給主般做雜劇凡樂人般做雜劇戲文不許粧扮歷代帝王后妃忠臣烈士先聖先賢神像違者杖一百官民之家容令粧扮者與同罪其神仙道扮及義夫節婦孝子順孫勸人為善者不在禁限違令凡違令者笞五十不應為凡不應得為而為之者笞四十事理重者杖八十斷獄明律囚應禁而不禁凡獄囚應禁而不禁應枷鎖杻而不枷鎖杻及脫去者若囚該杖罪笞三十徒罪笞四十流罪笞五十死罪杖六十若應枷而鎖應鎖而枷者各減一等若囚自脫去及司獄官典獄卒私與囚脫去枷鎖杻者罪亦如之提牢官知而不舉者與同罪不知者不坐其不應禁而禁及不應枷鎖杻而枷鎖杻者各杖六十若受財者並計贓以枉法從重論故禁故勘平人凡官吏懷挾私讎故禁平人者杖八十因而致死者絞提牢官及司獄官典獄卒知而不舉首者與同罪至死者減一等不知者不坐若因公事干連平人在官無招誤禁致死者杖八十有文案應禁者勿論若故勘平人者杖八十折傷以上依凡鬪傷論因而致死者斬同僚官及獄卒知情共勘者與同罪至死者減一等不知情及依法栲訊者不坐若因公事干連平人在官事須鞫問及罪人贓狀證佐明白不服招承明立文案依法栲訊邂逅致死者勿論淹禁凡獄囚情犯已完監察御史提刑按察司審録無寃别無追勘事理應斷決者限三日內斷決應起發者限一十日內起發若限外不斷決不起發者當該官吏三日笞二十每三日加一等罪止杖六十因而淹禁致死者若囚該死罪杖六十流罪杖八十徒罪杖一百杖罪以下杖六十徒一年陵虐罪囚凡獄卒非理在禁陵虐毆傷罪囚者依凡鬪傷論尅減衣糧者計贓以監守自盜論因而致死者絞司獄官典吏及提牢官知而不舉者與同罪至死者減一等與囚金刃解脫凡獄卒以金刃及他物可以自殺及解脫枷鎖之具而與囚者杖一百因而致囚在逃及自傷或傷人者並杖六十徒一年若囚自殺者杖八十徒二年致囚反獄及殺人者絞其囚在逃未斷之間能自捕得及他人捕得若囚已死及自首者各減一等若常人以可解脫之物與人及子孫與祖父母父母奴婢雇工人與家長者各減一等若司獄官典及提牢官知而不舉者與同罪至死者減一等若受財者計贓以枉法從重論若獄囚失於點檢致囚自盡者獄卒杖六十司獄官典各笞五十提牢官笞四十主守教囚反異凡司獄官典獄卒教令罪囚反異變亂事情及與通傳言語有所增減其罪者以故出入人罪論外人犯者減一等若容縱外人入獄及走泄事情於囚罪無增減者笞五十若受財者並計贓以枉法從重論獄囚衣糧凡獄囚應請給衣糧醫藥而不請給患病應脫去枷鎖杻而不脫去應保管出外而不保管應聽家人入視而不聽司獄官典獄卒笞五十因而致死者若囚該死罪杖六十流罪杖八十徒罪杖一百杖罪以下杖六十徒一年提牢官知而不舉者與同罪若已申稟上司不即施行者一日笞一十每一日加一等罪止笞四十因而致死者若囚該死罪杖六十流罪杖八十徒罪杖一百杖罪以下杖六十徒一年功臣應禁親人入視凡功臣及五品以上官犯罪應禁者許令親人入視徒流者並聽親人隨行若在禁及至配所或中途病死者在京原問官在外隨處官司開具致死緣由差人引領親人詣闕面奏發放違者杖六十死囚令人自殺凡死罪囚已招服罪而囚使令親戚故舊自殺或令雇倩人殺之者親故及下手之人各依本殺罪減二等若囚雖已招服罪不曾令親故自殺及雖曾令自殺而未招服罪輒殺訖或雇倩人殺之者親故及下手之人各以鬪殺傷若雖已招服罪而囚之子孫為祖父母父母及奴婢雇工人為家長者皆斬老幼不考訊凡應八議之人及年七十以上十五以下若廢疾者並不合栲訊皆據衆證定罪違者以故失入人罪論其於律得相容隱之人及年八十以上十嵗以下若篤疾皆不得令其為證違者笞五十鞫獄停囚待對凡鞫獄官推問罪囚有起內人伴見在他處官司停囚待對者雖職分不相統攝皆聽直行勾取文書到後限三日內發遣違限不發者一日笞二十每一日加一等罪止杖六十仍行移本管上司問罪督發若起內應合對問同伴罪囚已在他處州縣事發見問者聽輕囚就重囚少囚從多囚若囚數相等者以後發之囚送先發官司併問若兩縣相去三百里之外者各從事發處歸斷違者笞五十若違法將重囚移就輕囚多囚移就少囚者當處官司隨即收問仍申逹所管上司究問所屬違法移囚之罪若囚到不受者一日笞二十每一日加一等罪止杖六十依告狀鞫獄凡鞫獄須依所告本狀推問若於狀外别求他事撫拾人罪者以故入人罪論同僚不署文案者不坐若因其告狀或應掩捕搜檢因而檢得别罪事合推理者不在此限原告人事畢不放回凡告詞訟對問得實被告已招服罪原告人别無待對事理隨即放回若無故稽留三日不放者笞二十每三日加一等罪止笞四十獄囚誣指平人凡囚在禁誣指平人者以誣告人論其本犯罪重者從重論若官吏鞫問獄囚非法栲訊故行教令誣指平人者以故入人罪論若追徵錢糧逼令誣指平人代納者計所枉徴財物坐贓論其物給主其被誣之人無故稽留三日不放回者笞二十每三日加一等罪止杖六十若鞫囚而證佐之人不言實情故行誣證及化外人有罪通事傳譯畨語不以實對致罪有出入者證佐人減罪人罪二等通事與同罪官司出入人罪凡官司故出入人罪全出全入者以全罪論若增輕作重減重作輕以所增減論至死者坐以死罪若斷罪失於入者各減三等失於出者各減五等並以吏典為首首領官減吏典一等佐二官減首領官一等長官減佐二官一等科罪若囚未決放及放而還獲若囚自死各聽減一等辨明寃枉凡監察御史按察司辨明寃枉須要開具所枉事迹實封奏聞委官追問得實被誣之人依律改正罪坐原告原問官吏若事無寃枉朦朧辨明者杖一百徒三年若所誣罪重者以故出入人罪論所辨之人知情與同罪不知者不坐有司決囚等第凡獄囚鞫問明白追勘完備徒流以下從各府州縣決配至死罪者在內聽監察御史在外聽提刑按察司審録無寃依律議擬轉逹刑部定擬奏聞回報直𨽻去處從刑部委官與監察御史在外去處從布政司委官與按察司官公同審決若犯人反異家屬稱寃即便推鞫事果違枉同將原問原審官吏通問改正其審録無寃故延不決者杖六十若明稱寃抑不為申理者以入人罪故失論檢驗尸傷不以實凡檢驗尸傷若牒到托故不即檢驗致令尸變及不親臨監視轉委吏卒若初復檢官吏相見符同尸狀及不為用心檢驗移易輕重增減尸傷不實定執致死根因不明者正官杖六十首領官杖七十吏典杖八十仵作行人檢驗不實符同尸狀者罪亦如之因而罪有增減者以失出入人罪論若受財故檢驗不以實者以故出入人罪論贓重者計贓以枉法各從重論決罰不如法凡官司決人不如法者笞四十因而致死者杖一百均徵埋葬銀一十兩行杖之人各減一等其行杖之人若決不及膚者依驗所決之數抵罪並坐罪所由若受財者計贓以枉法從重論若監臨之官因公事於人虗怯去處非法毆打及自以大杖或金刃手足毆人至折傷以上者減凡鬪傷罪二等至死者杖一百徒三年追埋葬銀一十兩其聽使下手之人各減一等並罪坐所由若於人臀腿受刑去處依法決打邂逅致死及自盡者各勿論長官使人有犯凡在外各衙門長官及出使人員於所在去處有犯者所部屬官等不得輒便推問皆須申覆上司區處若犯死罪收管聽侯回報所掌印信鎖鑰發付次官收掌若無長官次官掌印者亦同長官違者笞四十斷罪引律令凡斷罪皆須具引律令違者笞三十若數事共條止引所犯罪者聽其特旨斷罪臨時處治不為定律者不得引比為律若輒引比致罪有出入者以故失論獄囚取服辨凡獄囚徒流死罪各喚囚及其家屬具告所斷罪名仍取囚服辨文狀若不服者聽其自理更為詳審違者徒流罪笞四十死罪杖六十其囚家屬在三百里之外止取囚服辨文狀不在具告家屬罪名之限赦前斷罪不當凡赦前處斷刑名罪有不當若處輕為重者當改正從輕處重為輕其常赦所不免者依律貼斷若官吏故出入者雖會赦並不原宥聞有恩赦而故犯凡聞知有恩赦而故犯罪者加常犯一等雖會赦並不原宥若官司聞知有恩赦而故論決囚罪者以故入人罪論徒囚不應役凡鹽場鐡冶拘役徒囚應入役而不入役及徒囚因病給假病已痊可不令計日貼役者過三日笞二十每三日加一等罪止杖一百若徒囚年限未滿監守之人故縱逃回及容令雇人代替者照依囚人應役月日抵數徒役並罪坐所由受財者計贓以枉法從重論仍拘徒囚依律論罪貼役婦人犯罪凡婦人犯罪除犯姦及死罪收禁外其餘雜犯責付本夫收管如無夫者責付有服親屬鄰里保管隨衙聽候不許一槩監禁違者笞四十若婦人懷孕犯罪應栲決者依上保管皆待産後一百日栲決若未産而栲決因而墮胎者官吏減凡鬬傷罪三等致死者杖一百徒三年産限未滿而栲決者減一等若犯死罪聽令穩婆入禁看視亦聽産後百日乃行刑未産而決者杖八十産訖限未滿而決者杖七十其過限不決者杖六十失者各減三等死囚復奏待報凡死罪囚不待覆奏回報而輒處決者杖八十若已覆奏回報應決者聽三日乃行刑若限未滿而行刑及過限不行刑者各杖六十若立春以後秋分以前決死刑者杖八十其犯十惡之罪應死及強盜者雖決不待時若於禁刑日而決者笞四十斷罪不當凡斷罪應決配而收贖應收贖而決配各依出入人罪減故失一等若應絞而斬應斬而絞者杖六十失者減三等其已處決訖别加殘毁死尸者笞五十若反逆緣坐人口應入官而放免及非應入官而入官者各以出入流罪故失論吏典代寫招草凡諸衙門鞫問刑名等項若吏典人等為人改寫及代寫招草增減情節致罪有出入者以故出入人罪論若犯人果不識字許令不干礙之人代寫明會典卷一百四十二
