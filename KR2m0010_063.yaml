body:
  text: 明會典卷六十三禮部二十二冠禮品官冠禮明集禮前期擇日主者告於家廟無廟則告於祠堂北面再拜告云某之子某年漸長成將以某月某日加冠於其首謹以告乃筮賔主者北面再拜告云卜以某甲子吉冠某速某賔加冠庶幾臨之謹告前二日主者戒賔及贊冠者主者至賔大門外掌次者引之次儐者受主者之命入告賔曰某之子某將加冠願吾子教之賔曰某不敏恐不能供事以辱吾子敢辭主者曰某猶願吾子教之賔曰吾子重有命某敢不從主者再拜賔答拜主者還賔拜送主者戒贊冠者亦如之亦通使子弟戒之前一日掌事者設次于大門外之右南向其日夙興掌事者設洗於堂阼階東南東西當東霤六品以下當東榮南北以堂深罍水在洗東加勺羃篚在洗西南肆實巾一於篚加羃席於東房內西牖下無房者張帷為之陳服於席東領北上莞筵四加藻席四在南側尊甒醴在服北加勺羃設坫四品以下設篚無坫在尊北饌陳於坫北設洗於東房近北罍水在洗西篚在洗東北肆實以巾質明賔贊至於主者大門外掌次者引之次賔贊公服諸行事者各服其服無公服者服常服執尊罍篚者皆就位其冠各一箱各一人執之待於西階之西東面北上設主者之席於阼階上西面賔席於西階東面冠者席於主者東北西面主者公服立於阼階下當東序西靣諸親公服非公服者常服立於罍洗東南西靣北上尊者在别室儐者公服立於門內道東北靣將冠者雙童髻空頂幘雙玉導金寶飾綵袴褶錦紳烏皮履六品以下導不以玉立於房內南靣主者贊冠者公服立於房內戶東西靣賔及贊冠出次立於門西贊冠者稍退俱東靣北上儐者進於主者之左北靣受命出立門東西面曰敢請事賔曰某子有嘉禮命某執事儐者入告主者迎賔於大門之外東西靣再拜賔答拜凡主賔拜揖皆贊禮者相導主者揖贊冠者贊冠者報揖主者又揖賔賔報揖主者入賔及贊冠者次入及內門行至階主者立於階東西面賓贊立於階西東面主者請升賔曰某偹將事敢辭主者固請賔固辭主者終請賔三辭主者升自阼階立於西東西向賔升自西階立於席西東向贊冠者及庭盥於洗升自西階入於東房立於主者贊冠者之南俱西面主者贊冠者引將冠者立於房外之西南面賔之贊冠者取纚櫛簮跪奠於冠者筵南端席北稍東西面立賔揖將冠者賔主俱即席坐將冠者進升席西南坐賔之贊冠者進筵前東面跪脫雙童髻置於箱櫛畢設纚興復位立賔主俱興賔降至罍洗盥手訖詣西階主者立於席後西面賔立於西階上東面執緇布冠者升授賔賔降一等受之右執項左執前進將冠者筵前東向立祝曰令月吉日始加元服棄爾幼志慎爾成德夀考維祺介爾景福乃跪冠興復西階上席後東面立賔之贊冠者進筵前東面跪結纓興復位冠者興賔揖冠者冠者適房賔主俱坐冠者著青衣素裳之服出房户西南面立賔主俱興賔揖冠者冠者進升席西向坐賔之贊冠者跪脫緇布冠置於箱櫛畢設纚興復位執進賢冠者升賔降二等受之右執項左執前進冠者筵前東向立祝曰吉月令辰乃申爾服恭爾威儀淑慎爾德眉夀萬年永受胡福乃跪冠興復位賔之贊冠者跪設簮結纓興復位冠者興賔揖冠者冠者適房賔主俱坐冠者著絳紗服出自房戶西南面立賔主俱興賔揖冠者冠者進升席西向坐賔之贊冠者跪脫進賢冠置於箱櫛畢設纚興復位執爵辨者升賔降三等受之右執項左執前進冠者筵前東向立祝曰以嵗之正以月之令咸加爾服兄弟具在以成厥德黃耉無疆受天之慶乃跪冠興復位賔之贊冠者跪設簮結纓興復位冠者興賔揖冠者適房賔主俱坐主者贊冠者撤纚櫛簮箱及筵入於房又設筵於室戶西南向冠者著爵辨之服出房户西南面立賔主俱興主者贊冠者盥手洗觶於房酌醴出房南面立賔揖冠者冠者就筵西南面立賔進受醴進冠者筵前北面立祝曰甘醴維厚嘉薦令芳拜受祭之以定爾祥承天之休夀考不忘冠者筵西拜受觶賔復西階上東面答拜執饌者奉饌薦於冠者筵前冠者左執觶右取脯祭於籩豆之間贊冠者取胏一以授冠者冠者奠觶於薦西以祭冠者坐取觶祭醴奠觶再拜執觶興賔答拜賔主俱坐冠者升筵跪奠觶於薦東興進北面跪取脯降自西階入見母進奠脯於席前退再拜以出冠者母不在則使人受脯於西階下初冠者入見母賔主俱興賔降當西序東面立主者降當東序西面立冠者既見母出立於西階東南面賔少進字之曰禮儀既偹令月吉日昭告爾字爰字孔嘉髦士攸宜宜之于嘏永受保之曰伯某甫冠者曰某雖不敏夙夜祗奉賔出主者送於內門外主者西向請賔曰吾子辱執事請禮從者賔曰某得將事敢辭主者固請賔曰某既不得命敢不從賔就次主者入初賔出冠者東面見諸親諸親拜之冠者答拜冠者西面拜賔之贊冠者賔之贊冠者答拜訖見諸尊於别室賔主既釋服改席訖賔與衆賔俱出次立於門西東面主者出門東西面主者揖賔賔報揖主者先入賔及衆賔從之至階賔立於西階上贊冠者在北少退俱東面主者立於東階上西面衆賔降立於西階下東面掌事者以幣篚升授主者主者授幣篚於賔賔受之又以幣篚授贊冠者贊冠受之俱復位主者還阼階上北面拜送賔贊降自西階主者送賔於大門外之東西面再拜賔出主者入孤子則諸父諸兄戒賔冠之日主者紒而迎賔拜揖讓如冠主冠於阼階之下禮賔拜送皆如上儀明日見廟冠者朝服質明贊禮者引入廟南門中庭道西北向贊再拜訖引出士庶冠禮洪武三年定凡男子年十五至二十皆可冠將冠筮日筮賔於祠堂戒賔俱同品官儀是日夙興張帷為房於聽事之東賔主執事者皆盛服設盥於阼階下東南陳服於房中西牖下東向北上席二在南酒壺在服北次盞注幞頭帽巾各盛以盤蒙以巾帕執事者三人捧之立於堂下西階之西南向東上主人立於阼階下子弟親戚立於盥東儐者立於門外以俟賔將冠者雙紒袍勒帛素履待於房中賔至主人出迎揖而入坐定將冠者出於房執事者請行事賔之贊者取櫛總箆幧頭置於席南端賔揖將冠者將冠者即席西向坐賔之贊者為櫛合紒施總加幧頭賔主皆降主人立於阼階下賔盥訖主人揖讓升自西階皆復位執事者以巾進賔降西階一等受之詣冠者席前東向云云跪為著巾興復位冠者興賔揖冠者適房易服深衣大帶出房即冠席賔盥訖降二等受帽進祝贊者徹巾賔跪冠興復位冠者興賔揖冠者入房易服旋服襴衫腰帶出房即冠席賔盥訖降三等受幞頭進祝三祝皆同品官詞贊者徹帽加幞頭復位冠者興賔揖冠者適房易公服出房執事者徹冠席入帷中更設醴席於西階南向贊者酌醴出房立於冠者之南賔揖冠者即醴席西向立賔受醴詣席前北面祝同品官詞冠者於席西拜受賔答拜執事者薦饌冠者即席坐飲食訖再拜賔答拜冠者離席立於西階之東南向賔字同品官詞冠者拜賔答拜冠者拜父母父母為之起拜諸父之尊者遂出見鄉先生及父之執友先生執友皆答拜訖賔退主人請禮賔辭固請許諾乃入設酒饌延賔及儐贊者賔退主人酬賔贊侑以幣乃拜謝禮畢主人以冠者見祠堂告曰某之子某冠畢敢見冠者北面焚香再拜出明會典卷六十三
