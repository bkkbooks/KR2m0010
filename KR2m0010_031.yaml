  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0010_WYG_031-1a, image: WYG0617/WYG0617-0332c.png}
body:
  text: 明會典卷三十一户部十六廩祿三廪給諸司職掌凡公差人員廪給已有定例其驛傳并府州縣應合支用去處必須照依文慿驗日支給仍將歲支數目通類開報合干上司以慿稽考明令凡經過使客正官一名支分例米三升從人一名支米二升宿頓使客正官支米五升從人支米三升水路俱支經過分例陸路遇晚關宿頓分例凡各站有分例去處所在有司於商稅及諸色課程內撥留糧米差點有役人員掌管遇有使客依例支給不許稽停支過數開申合干上同事例正統四年令鎮守巡撫甘肅內外官員不支廪給每月支食米三石六年令跟隨甘肅總兵官指揮千百户等官每人月給口糧四斗五升成化十三年令延綏巡撫官照甘肅例出巡每日支廪米五升在倉支五升回日通在倉支一斗十六年兵部奏準凡使客該支廪給者多係有職之人如便道經過非公幹去處每驛則支三升宿亦支三升如本等公幹去處經過每驛亦支三升宿支五升一日經過兩三驛以上俱許支給但止宿者次日起程不許巧立名色多支起關廪米從征把總領軍官并跟隨頭目例支廪給日行一程止許關支一次使客該支口糧者不拘便道經過止宿去處及本等公幹經過止宿去處每驛一例俱支一升五合一日經過兩三驛以上俱許支給跟隨巡撫巡按清軍刷卷巡鹽巡河盤糧勘事等項有役之人支廪給南京大理寺差來官請旨待報發落罪囚支廩給若非官者支口糧南京各衙門差郎中主事御史給事中等官并各處鎮守總兵巡撫巡視撫治巡按副參逰擊等官差官赴京奏事公幹等項回還俱支廪給若非官者支口糧齎捧詔敕制諭飛報軍務重事及奉特旨差使人員支廪給公侯駙馬伯都督各許帶從人一名支口糧其公差巡按清軍刷卷巡鹽巡河盤糧勘事巡捕等項官員并旗校一體支廪給各處王府并鎮守總兵巡撫巡按三司等官差儀賓千百户等官進表箋進貢繳敕謝恩并奏機密賊情緊急聲息等項重事及乞恩回奏繳册繳圖軍器糧草燒荒等項不急常事俱支廪給非官者支口糧衍聖公并顔孟二氏五經博士年例赴京往回及衍聖公差來掌書俱支廪給醫獸家人廟丁支口糧正一嗣教大真人并隨行法師人等自貴溪縣起至南京俱支廪給琉球安南占城朝鮮國差來使臣支廩給南京各衙門差進表箋官支廪給來降夷人支廪給在京各衙門差郎中員外郎主事御史等官不及百里巡視倉場等項支廪給親王郡王差儀賓千百户等官回還支廪給總小旗軍校支口糧雲南貴州都布按三司四川陜西行都司差進表箋官支廪給留守司并各處都布按三司等官及行太僕寺苑馬寺差人赴京奏事公幹回還係官者支廪給非官者支口糧口外走回人口不堪收充勇士者及婦女送回原籍者一體支口糧在京在外病故官員遺下家口還鄉者支口糧哈密竒木嘉色稜赤斤蒙古等地面差來使臣人等朵顔三衛建州等衛差來進貢人員四川雲南貴州湖廣烏思藏董卜韓胡土官通事把事畨僧人等陜西岷州洮州西寧畨人畨僧人等俱支廪給貴州湖廣土官衙門頭目舍人官族土人從人土民人等支口糧南京太常寺差官赴京關領香帛等項支廪給二十年令寧夏巡撫官照甘肅延綏例關支廪米行糧馬草諸司職掌凡遇行軍馬匹日支糧草已有定例其應付一節該衛先具軍馬數目開呈本部立案出給批文差官齎領經過官司并驛分照依坐去軍人馬匹數目照例驗程支給其有為事編發應支行糧人數亦合照例關支仍仰所在官司將支過數目申達上司作數其所齎批文候至所止地方隨即赴官告繳遞回本部於原編底簿內銷注明祖訓凡親王每歲來朝自偹飲膳其隨從官員軍士盤費馬匹草料俱各自備毋得干預有司恐惹事端事例洪武三十五年令親王之國隨行內外官員及有執事旗校厨役人等沿途有司應付口糧本府駕馬并隨駕馬騾及護衛官軍下隨侍馬匹應付草料隨侍官軍回還亦準支令大同守邉軍士出哨巡邉守墩瞭高等項公差驗日計程關給行糧永樂四年令從征旗軍人等沿途給與行糧日行一程止關一次宣德三年奏準各處鎮守總兵等官帶去官軍皆按月支行糧四斗五升邉衛軍士隨總兵官出境征進追勦逹賊者準驗日支行糧其餘不時差遣沿邉探聽聲息及境外巡邏瞭哨者不支十年令各衛旗軍調於大同操偹者月支行糧五斗正統二年令大同巡邉軍士月給行糧五斗料豆一石二斗四年令沿邉各衛砌關口旗軍離衛四百里以上者準月支口糧三斗令廣東往來伴送使臣赴京公幹旗軍人等回還口糧每名日支一升若一日經過兩處者不許重支令甘肅寧夏等處各衛征操軍士若遇警隨總兵官出境征進追勦達賊及差出探聽聲息巡邏哨瞭者每月行糧三斗驗日支給五年令城守禦千户所官軍在京操備者月支行糧四斗陜西都司都指揮管領旗軍於甘肅寧夏及綏德等寨堡備禦者照甘肅偹禦旗軍例月支米五斗廩給住支大同巡邉軍士行糧五斗料一石二斗六年令大同境外衝要守墩官軍及離城百里之上者給行糧其內地不及百里者不給又令遼東沿邉城堡守墩哨瞭官軍行糧每人月給四斗五升又令各邉哨偹官軍在邉者月給行糧回衛即罷支七年令密雲各衛邉軍出境巡哨夜不收人等驗日於古北口日支行糧一升守關操備非出境外者不支又令各處進貢馬每匹日支料四升草一束又令各處草場每歲牧放馬匹官軍沿途官司日支口糧一升一日經過兩處不許重支八年令河南山東等處在京操偹官軍月給行糧四斗十三年令遼東各營堡操守餘丁舍人原無月糧者準支行糧十四年令寧夏官軍遇差巡哨者日支行糧一升景泰三年令松潘等衛所官軍差出三百里之外巡哨貼守經五日之程者支行糧又令南京各衛駕船軍餘往來經兩月之程者人支行糧八斗半年者二石八斗天順五年奏準凡都督等官率領達官軍人征勦者都督都指揮日支行糧三升指揮千百戶鎮撫頭目旗軍一升五合舍人儒士家人一升馬每匹日支料四升草一束南京達官軍人等亦照此例成化八年令征進達官軍舍不分官舍軍餘沿途每人日給米二升半如一日經過兩站者不許重支到邉仍照行糧常例十五年令各邉防護修墩燒官軍若在百里及五日之內堪自偹糧料者不許關支行糧馬草若五日及百里之外者聽令關支仍將支過數目於在營中月册內扣除其遇警截殺探賊按伏官軍不能自帶糧料者並聽隨處關支如鎮守等官於無事點視邉防等項許各處城堡軍馬護送不得多帶人馬濫支草料𢎞治二年奏準沿邉各衛所征哨并按伏偹堡等項官軍出百里之外者俱日支口糧一升五合都指揮與把總等官日支廪米三升備禦官軍日支行糧一升七合馬日支料三升草一束在營草料住支如百里之內起關濫支廪米行糧口糧者聽巡撫巡按官參奏四年革中都留守司各都司并南直隸衛所京操官軍沿途口糧如有私起關文支給及買頭人等通同有司驛分官吏應付者領班管操官員調發邉衛差操旗軍及有司驛分俱坐盜支官糧罪九年令各邉內外官帶領關支廪給口糧頭目鎮守不過五名分守并守備不過三名明會典卷三十一
