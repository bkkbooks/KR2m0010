body:
  text: 明會典卷七十禮部二十九宴禮大宴儀一諸司職掌一是日尚寶司設御座于奉天殿錦衣衛設黃麾于殿外之東西金吾等衛設護衛官二十四員于殿東西教坊司設九奏樂歌于殿內設大樂于殿外立三舞雜隊于殿下光祿寺官設酒亭于御座下之西膳亭于御座下之東珍羞醯醢亭于酒膳亭之東西設御筵于御座之東西設群臣四品以上位于殿內之東西設羣臣酒尊食卓于殿外設五品以下位卓于東西兩廊司壺尚食各供乃事引禮引羣臣殿外東西相向立儀禮司跪奏請升座駕興大樂作升座鳴鞭樂止鳴贊引文武官四品以上由東西門入至殿中橫班北向立五品以下官列于殿外丹墀北向立樂作贊四拜樂止光祿寺官進御筵大樂作捧案至御前樂止進花樂作進訖樂止光祿官開爵注酒捧詣御前進第一爵酒贊內外官皆跪教坊司跪奏進酒飲畢贊衆內外官俯伏興樂作贊四拜平身樂止贊各就位序班隨進羣臣卓散花樂作散訖樂止序班即進群臣盞第二爵酒教坊司跪奏二奏皇風之曲樂作光祿司官斟酒御前序班隨斟羣臣酒教坊司跪奏進酒候皇帝舉酒羣臣以次舉飲訖樂止光祿官進湯鼓吹響節前導至殿外鼓吹止殿上樂作羣臣起立光祿司官進湯御前羣臣復位序班即供羣臣湯樂止教坊司跪奏進湯樂作候皇帝舉筯羣臣次舉皇帝進湯訖贊饌成樂止武舞入教坊司跪奏平定天下之舞舞畢出第三爵酒教坊司跪奏三奏眷皇明之曲樂作進酒如前儀樂止教坊司跪奏樂奏撫安四夷之舞舞畢出第四爵酒教坊司跪奏四奏天道傳之曲樂作進湯如前儀食畢教坊司跪奏樂奏車書會同之舞舞畢出第五爵酒教坊司跪奏振皇綱之曲進酒如第三爵儀飲畢教坊司跪奏百戲承應舞畢出第六爵酒教坊司跪奏六奏金陵之曲進酒進湯如前儀教坊司跪奏八蠻獻寶進呈舞畢出第七爵酒教坊司跪奏七奏長揚之曲進酒如前儀教坊司跪奏採蓮隊子呈應畢出第八爵酒教坊司跪奏八奏芳醴之曲進酒進湯如前儀食畢教坊司跪奏魚躍于淵呈應畢出第九爵酒教坊司跪奏九奏駕六龍之曲進酒如前儀飲訖光祿司官收御前爵序班隨收群臣盞光祿司官進湯進大膳大樂作羣臣起立進訖復坐序班隨供羣臣飯教坊司跪奏進膳食訖贊膳成樂止光祿司官收膳訖教坊司跪奏百花隊舞呈應舞畢出鳴贊唱徹案序班徹群臣卓訖光祿司官即徹御案贊宴成羣臣皆出席北向立序班即徹羣臣座殿外官皆詣丹墀北向立贊鞠躬樂作贊四拜平身樂止羣臣分東西立儀禮司跪奏禮畢駕興大樂作鳴鞭百官以次出中宴一凡中宴禮儀同前但進酒七爵常宴一凡常宴同中宴禮儀但百官一拜三叩頭進酒或三爵或五爵而止一凡文武官每遇筵宴四品以上官文東武西各照品級上殿侍座五品以下於殿下丹墀內文東武西各照品級序坐其奉特旨賜殿內坐者不在此限如在奉天門則四品以上官坐于門上五品以下坐于丹墀內務要容止恭肅不許攙越喧譁禮儀定式一凡百官于奉天華蓋謹身武英等殿筵宴奏事須穿履鞋方許上殿違者從禮部官監察御史儀禮司紏舉送法司如律續定大宴儀是日陳設如前儀駕自右順門至奉天門丹陛大樂作升座鴻臚寺官贊拜百官四拜興平身樂止光祿寺官進御筵內官捧案進膳樂作設案畢樂止內官進花進膳樂作進訖樂止教坊司跪奏一奏上萬夀之曲侑食樂作內官斟酒捧爵至御案前鴻臚寺贊跪文武百官皆跪教坊司跪奏進酒鴻臚寺官贊俯伏興平身樂止贊各就坐百官就座簮花訖教坊司跪奏平定天下之舞舞畢出教坊司跪奏二奏仰天恩之曲樂作內官斟酒捧爵至御案前教坊司奏進酒進酒畢樂止殿外導湯樂作至殿內迎湯樂作內官捧湯至御案前教坊司奏進湯樂作鴻臚寺官贊饌成內官徹湯樂止教坊司奏黃童白叟鼓腹謳歌承應舞畢奏撫安四夷之舞舞畢教坊司跪奏三奏感地德之曲樂作進酒如前儀樂止教坊司跪奏車書會同之舞舞畢教坊司跪奏四奏民樂生之曲樂作進酒如前儀樂止殿外導湯樂作至殿內迎湯樂作內官捧湯至御案前教坊司奏進湯樂作鴻臚寺官贊饌成內官徹湯樂止教坊司跪奏表正萬拜之舞舞畢教坊司跪奏五奏感皇恩之曲樂作進酒如前儀樂止殿外導湯膳樂作至殿內迎湯膳樂作內官捧湯膳至御案前教坊司奏進膳樂作鴻臚寺官贊饌成內官徹湯膳并御筵樂止教坊司跪奏五奏天命有德之舞舞畢奏纓鞭德勝蠻夷隊舞承應畢教坊司更進致語畢鴻臚寺官復贊四拜平身樂止鴻臚寺官跪奏禮畢事例凡大祀天地次日慶成大宴文武百官及四夷使臣土官人等其位次公侯駙馬伯文職四品以上及學士武職都指揮使以上升殿東西侍坐學士坐于文職四品官之上翰林院左右春坊經筵官六科都給事中尚寶司卿少卿司丞通政司參議大理寺寺丞國子監司業帶俸參議太常寺寺丞鴻臚寺少卿寺丞順天府治中欽天監正副太醫院院使院判神樂觀提點道録司知觀等官中左門序坐皇親都指揮同知僉事逹官都指揮同知僉事署都指揮僉事皇親正副千户百户所鎮撫兵馬副指揮外國副使海西女直都指揮等官中右門序坐翰林院修撰等官六科給事中監察御史中書舍人陪祀郎中員外郎五府經歷都察院經歷都事照磨檢校司務翰林院帶俸官太常寺典簿博士等官犧牲所千百户詹事府主簿通事舍人鴻臚寺署丞主簿序班欽天監五官等官太醫院御醫逹官指揮使同知僉事正千户副千户百户所鎮撫外國四夷人等丹墀東序坐指揮使指揮同知陪祀指揮同知僉事外國四夷人等丹墀西序坐其遇朝覲各布政司方面行太僕寺卿運使知府官員陪祀者與宴方面官列于中左門班次卿運使知府列于東丹墀班次衍聖公張真人與宴列于二品文官班次其餘真人領宴及以事故者亦領宴其法王佛子國師禪師僧官剌麻俱於大慈恩寺宴內官一員待宴先期本部行各衙門開預宴官員職名畫位次進呈仍懸長安門示衆宴之日紏儀御史四人二人立于殿東西二人立于丹墀錦衣衛鴻臚寺禮科亦各委官紏舉宣德八年命朝鮮黑婁琉球陪臣列于殿內東西班後侍坐正統三年特命翰林院侍講一人升殿列學士之下天順三年令張真人不必預宴賜饌與之四年令女直都督列於殿內西班後侍坐六年令安南陪臣迤北使臣列於殿內東西班後侍坐成化四年令修撰等官給事中御史中書舍人及錦衣衛堂上官凡近侍風憲者另列于丹陛下之東西稍北其陪祀官郎中員外郎以下及各衙門官分列於丹陛下之南明會典卷七十
