body:
  text: 明㑹典卷八十七禮部四十六祭祀八合祀神祇三洪武禮制凡各處守禦官俱于公廨後築臺立旗纛廟設軍牙六纛神位春祭用驚蟄日秋祭用霜降日祭物用羊一豕一帛一白色祝一香燭酒果先期各官齊戒一日至日守禦長官武服行三獻禮若出師則取旗纛以祭班師則仍置于廟儀注與社稷同但瘞毛血望燎與風雲雷雨等神同祭文惟神正直無私指揮軍士助揚威武皆仗神功某等欽承上命守禦茲土惟茲仲春秋謹以牲醴庶品用伸常祭尚享以上各項祭祀壇廟宰牲房屋牲帛日期並依已定制度合用牲匣籩豆簠簋尊爵盥洗等器並如社稷壇㨾制成造但案卓用髙卓祭厲洪武禮制凡各府州縣每歲春清明日秋七月十五日冬十月一日祭無祀鬼神其壇設于城北郊間府州名郡厲縣名邑厲祭物牲用羊三豕三飯米三石香燭酒紙隨用儀注先期三日主祭官齊沐更衣用常服備香燭酒果詣本處城隍發告文通贊者贊鞠躬拜興拜興平身詣神位前跪進爵獻爵奠爵俯伏興平身復位鞠躬拜興拜興平身焚告文禮畢至日設城隍位于壇上祭物用羊一豕一設無祀鬼神于壇下左右如府則曰本府境內無祀鬼神祭物用羊二豕二解置于器同羔飯等鋪設各鬼神位前執事者陳設畢通贊者唱執事者各就位陪祭官各就位主祭官就位鞠躬拜興拜興拜興拜興平身詣神位前跪三獻酒俯伏興平身復位讀祭文訖鞠躬拜興拜興拜興拜興平身以祭文同紙焚訖贊禮畢祭文維洪武年月日某府官某遵承禮部劄付為祭祀本府闔境無祀鬼神等衆事該欽奉皇帝聖㫖普天之下后土之上無不有人無不有鬼神人鬼之道幽明雖殊其理則一故天下之廣兆民之衆必立君以主之君總其大又設官分職于府州縣以各長之各府州縣又於每一百户內設一里長以綱領之上下之職綱紀不紊此治人之法如此天子祭天地神祇及天下山川王國各府州縣祭境內山川及祀典神祇庶民祭其祖先及里社土榖之神上下之禮各有等第此事神之道如此尚念冥冥之中無祀鬼神昔為生民未知何故而沒其間有遭兵刀而橫傷者有死於水火盜賊者有被人取財而逼死者有被人强奪妻妾而死者有遭刑禍而負屈死者有天灾流行而疫死者有為猛獸毒蟲所害者有為饑餓凍死者有因戰鬪而殞身者有因危急而自縊者有因墻屋傾頽而壓死者有死後無子孫者此等鬼魂或終于前代或沒于近世或兵戈擾攘流移于他鄉或人烟斷絶久缺其祭祀姓名泯沒于一時祀典無聞而不載此等孤魂死無所依精魄未散結為隂靈或倚草附木或作為妖怪悲號于星月之下呻吟于風雨之時凡遇人間節令心思陽世魂杳杳以無歸身墮沉淪意懸懸而望祭興言及此憐其慘悽故勑天下有司依時享祭在京都有泰厲之祭在王國有國厲之祭在各府州有郡厲之祭在各縣有邑厲之祭在一里又各有鄉厲之祭期于神依人而血食人敬神而知禮仍命本處城隍以主此祭欽奉如此今某等不敢有違謹設壇于城北以三月清明日七月十五日十月一日置備牲醴羔飯専祭本府闔境無祀鬼神等衆靈其不昧永享此祭凡我一府境內人民儻有忤逆不孝不敬六親者有姦盜詐僞不畏公法者有拗曲作直欺壓良善者有躲避差徭靠損貧户者似此頑惡奸邪不良之徒神必報于城隍發露其事使遭官府輕則笞决杖斷不得號為良民重則徒流絞斬不得生還鄉里若事未發露必遭隂譴使舉家並染瘟疫六畜田蠶不利如有孝順父母和睦親族畏懼官府遵守禮法不作非為良善正直之人神必達之城隍隂加護佑使其家道安和農事順序父母妻子保守鄉里我等闔府官吏等如有上欺朝廷下枉良善貪財作弊蠧政害民者靈必無私一體昭報如此則鬼神有鑒察之明官府非諂諛之祭尚享告城隍文某府遵承禮部劄付為祭祀本府無祀鬼神該欽奉皇帝聖旨普天之下后土之上無不有人無不有鬼神人鬼之道幽明雖殊其理則一今國家治民事神已有定制尚念冥冥之中無祀鬼神昔為生民未知何故而沒其間有遭兵刀而橫傷者有死于水火盜賊者有被人取財而逼死者有被人強奪妻妾而死者有遭刑禍而負屈死者有天灾流行而疫死者有為猛獸毒蟲所害者有為饑餓凍死者有因戰鬭而殞身者有因危急而自縊者有因墻屋傾頽而壓死者有死後無子孫者此等鬼魂或終于前代或沒于近世或兵戈擾攘流移于他鄉或人烟斷絶久缺其祭祀姓名泯沒于一時祀典無聞而不載此等孤魂死無所依精魄未散結為隂靈或倚草附木或作為妖怪悲號于星月之下呻吟于風雨之時凡遇人間節令心思陽世魂杳杳以無歸身墮沉淪意懸懸而望祭興言及此憐其慘悽故勑天下有司依時享祭命本處城隍以主此祭鎮控壇場鑒察諸鬼等類其中果有生為良善誤遭刑禍死于無辜者神當達於所司使之還生中國永享太平之福如有素為凶頑身死刑憲雖獲善終亦出僥幸者神當逹于所司屏之四裔善惡之報神必無私欽奉如此今某等不敢有違謹於年月日于城北設壇置備牲酒羔飯享祭本府無祀鬼神等衆然幽明異境人力難為必資神力庶得感通今特移文于神先期分遣諸將召集本府闔境鬼靈等衆至日悉赴壇所普享一祭神當欽承勑命鎮控壇場鑒察善惡無私昭報為此合行移牒請照驗欽依施行里社洪武禮制凡各處鄉村人民每里一百户內立壇一所祀五土五榖之神專為祈禱雨晹時若五穀豐登每歲一户輪當㑹首常川潔淨壇場遇春秋二社預期率辦祭物至日約聚祭祀其祭用一羊一豕酒果香燭隨用祭畢就行㑹飲㑹中先令一人讀抑强扶弱之誓其詞曰凡我同里之人各遵守禮法毋恃力凌弱違者先共制之然後經官或貧無可贍周給其家三年不立不使與㑹其婚姻喪葬有乏隨力相助如不從衆及犯姦盜詐僞一切非為之人並不許入㑹讀誓詞畢長幼以次就坐盡歡而退務在恭敬神明和睦鄉里以厚風俗儀注前祭一日㑹首及預祭之人各齊戒一日㑹首先遣執事人掃除壇所為瘞坎于壇所之西北方深取足容物㑹首洗滌厨房鑊器以淨室為饌所至晚宰牲執事者以碟取毛血與祭器俱置于饌所祭器俱用瓷瓦器祭日未明執事者于厨中烹牲設五土五穀神位于壇上五土居東五榖居西設讀祝所于壇上居中間設㑹首拜位于壇下俱南向設預祭人位於其後設引禮及諸執事人位又於其後執事者于饌所實祭物于碟內解牲體置于二爼置酒于尊書祝文于紙祭物既備執事者各捧設于神位前燃香明燭自㑹首以下各服常服盥手入就拜位立定執事者執壺于尊中取酒立于五土神位之左引禮者唱鞠躬拜興拜興平身㑹首以下皆鞠躬拜興拜興平身執事者取毛血瘞于坎中引禮引㑹首詣五土神位前唱跪㑹首詣五土神位前跪舉杯執壺者斟酒引禮唱三祭酒㑹首三祭酒訖引禮唱俯伏興平身執壺者詣五榖神位之左引禮引㑹首詣五榖神位前唱跪㑹首詣五榖神位前跪舉杯執壺者斟酒引禮唱三祭酒㑹首三祭酒訖引禮唱俯伏興平身㑹首俯伏興平身引禮唱就讀祝位讀祝者取祝立于讀祝位之左㑹首詣讀祝所引禮唱跪㑹首跪唱讀祝讀祝者跪讀祝訖興置祝于案引禮唱俯伏興平身㑹首俯伏興平身引禮唱復位㑹首復位引禮唱鞠躬拜興拜興平身㑹首以下皆鞠躬拜興拜興平身執事者徹祭物讀祝者取祭文焚瘞于坎所禮畢行㑹飲讀誓文禮祝文維洪武年月日某府某州某縣某鄉某里某人等謹致祭于五土之神五穀之神曰惟神參贊造化發育萬物凡我庶民悉賴生植時維仲春東作方興秋歲事有成謹具牲醴恭伸祈告報祭伏願雨晹時若五穀豐登官賦足供民食充裕神其鑒知尚享鄉厲洪武禮制凡各鄉村每一里户內立壇一所祭無無祀鬼神専祈禱民庶安康孳畜蕃盛每歲三祭春清明秋七月十五日冬十月一日祭物牲酒隨鄉俗置辦其輪流㑹首及祭畢㑹飲讀誓等儀與祭里社同祭文某縣某鄉某村某里某社里長某人承本縣官裁㫖該欽奉皇帝聖㫖普天之下后土之上無不有人無不有鬼神人鬼之道幽明雖殊其理則一故天下之廣兆民之衆必立君以主之君總其大又設官分職於府州縣以各長之各府州縣又於每一百户內設一里長以綱領之上下之職綱紀不紊此治人之法如此天子祭天地神祇及天下山川王國各府州縣祭境內山川及祀典神祇庶民祭其祖先及里社土穀之神上下之禮各有等第此事神之道如此尚念冥冥之中無祀鬼神昔為生民未知何故而沒其間有遭兵刀而橫傷者有死於水火盜賊者有被人取財而逼死者有被人强奪妻妾而死者有遭刑禍而負屈死者有天災流行而疫死者有為猛虎毒蟲所害者有為飢餓凍死者有因戰鬭而殞身者有因危急而自縊者有因墻屋傾頽而壓死者有死後無子孫者此等鬼魂或終于前代或沒于近世或兵戈擾攘流移於他鄉或人烟斷絶久缺其祭祀姓名泯沒於一時祀典無聞而不載此等孤魂死無所依精魄未散結為隂靈或倚草附木或作為妖怪悲號於星月之下呻吟於風雨之時凡遇人間節令心思陽世魂杳杳以無歸身墮沉淪意懸懸而望祭興言及此憐其慘悽故勑天下有司依時享祭在京都有泰厲之祭在王國有國厲之祭在各府州有郡厲之祭在各縣有邑厲之祭在一里又各有鄉厲之祭期於神依人而血食人敬神而知禮仍命本處城隍以主此祭欽奉如此今某等不敢有違謹設壇于本里以三月清明日七月十五日十月一日率領某人等百家聯名於此置備羔飯肴物祭于里里無祀鬼神等衆靈其不昧依期來享凡我一里之中百家之內倘有忤逆不孝不敬六親者有姦盜詐僞不畏公法者有拗曲作直欺壓良善者有躲避差徭靠損貧户者似此頑惡奸邪不良之徒神必報於城隍發露其事使遭官府輕則笞决杖斷不得號為良民重則徒流絞斬不得生還鄉里若事未發露必遭隂遣使舉家並染瘟疫六畜田蠶不利如有孝順父母和睦親族畏懼官府遵守禮法不作非為良善正直之人神必達之城隍隂加護佑使其家道安和農事順序父母妻子保守鄉里如此則鬼神有鑒察之明我民無諂諛之祭靈其無私永垂昭格尚享祭告城隍文某府某縣某鄉某村某里里長某人率領某里人民某人等聯名謹具狀告于本縣城隍之神今來某等承奉縣官裁㫖遵依上司所行為祭祀本鄉無祀鬼神事該欽奉皇帝聖㫖普天之下后土之上無不有人無不有鬼神人鬼之道幽明雖殊其理則一今國家治民事神已有定制尚念冥冥之中有等不在祀典之神不得血食之鬼魂無所依私顯靈怪悲號于星月之下呻吟于風雨之時憐其慘悽故勑天下有司依時享祭鄉村里社一年三祭仍命禮請本處城隍以主此祭鎮控壇場鑒察諸鬼等類其中果有生為良善誤遭刑禍死於無辜者神必達于所司使之還生中國來享太平之福如有生為凶惡身死刑憲雖獲善終出於僥幸者神必屏之四裔善惡之報神必無私欽奉如此今某等不敢有違欽依於某年某月某日就本里設壇謹備羔飯肴物祭享于本鄉無祀鬼神等衆然幽明異境人力難為必資神力庶得感通今特䖍誠告于神先期分遣諸將遍厯所在招集本里鬼靈等衆至日悉赴壇所受祭神當欽奉勑命鎮控壇場鑒察善惡無私昭報為此謹具狀告本縣城隍之神俯垂昭鑒謹狀犧牲諸司職掌一凡祭祀所用牲醴脯醢等物必須預備看飬臨期依數供辦不可有缺事例洪武初立神牲所設官二人牧飬神牲祀前三月付廪犧令滌治如法其中祀滌三十日小祀滌十日者亦如之後改立犧牲所設武職并軍人専管牧飬其各壇合用犧牲俱有定數具太常寺職掌六年本部奏准郊廟犧牲已在滌者或有傷則出之死則埋之其有疾者亦飬於别所待其肥腯以備小祀中祀之用若未及滌或有疾傷者歸所司别用景泰四年令本部鑄造牲字牢字火烙各一㑹同禮部御史印記各處解到大祀牛羊𢎞治三年令稅課司抽分祭祀猪隻自今依時價折收銀一千兩按季送太倉銀庫每歲委官支出㑹同御吏照依時估收買純全猪胚送犧牲所喂飬陸續供祀明㑹典卷八十七
