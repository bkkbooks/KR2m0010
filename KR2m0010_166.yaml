body:
  text: 明會典卷一百六十六都察院三追問諸司職掌凡在外軍民人等赴京或擊登聞鼓或通政司投狀陳告一應不公寃枉等事欽差監察御史出巡追問照出合問流品官員就便請旨拿問帶同原告一到追問處所著令原告供報被告干連人姓名住址立案令所在官司抄案提人案驗後仍要抄行該吏書名畫字如後呈解原提被告人到不詳停滯即於來解內立案將原被告當官引問取訖招供服辨判押入卷明立文案開具原發事由問擬招罪照行事理除無招笞杖輕罪就彼摘斷徒流死罪連人卷帶回審擬奏聞發落餘並與問擬刑名相同憲綱凡監察御史按察司官有追問諸衙門官員取受不公刑名等事除軍官京官並勳舊之臣及在外文職五品以上官具奏請旨方許取問其餘六品以下取問明白從公決斷之後仍具奏聞若奉特旨委問者須將始終緣由議罪回奏取自上裁凡有告爭户婚田土錢糧鬭訟等事須於本管衙門自下而上陳告歸問如理斷不公或寃抑不理者直𨽻赴巡按監察御史在外赴按察司或分司及巡按監察御史處陳告即與受理推問如果得實將原問官吏依律究治其應請旨者具實奏聞若見問未經結絶又赴本管上司告理不許輒便受狀追卷變易是非須要即時附簿發下原問官司立限歸結如理斷不當及應合歸結而不歸結者即便究問違者監察御史按察司體察究治如不係分巡時月及巡歷已過所按地面却有陳告官吏不公不法者隨即受理追問凡監察御史按察司官分巡去處如有陳告官吏取受不公等事須要親行追問不許轉委違者杖一百凡有軍民相干詞訟等事移文到日其應該會問官員隨即前去若無故不即會問及偏徇占吝者從監察御史按察司官按問其應請旨者具實奏聞審録諸司職掌凡在外布政司按察司都司並直𨽻府州刑名有犯死罪囚人收監在彼止開招罪申逹合干上司詳議允當移文本院通類具奏點差監察御史會同刑部委官按臨審決其到所在官司隨即令首領官吏抄案各該衙門追吊原行人卷赴官恭詳招罪果無出入及審取犯人服辨無異就令所司抄案差委獄卒將犯人押赴法場各照原擬處決將原吊卷宗發還該衙門收照却行具本開坐決過犯人花名回奏仍呈原委官司知會若囚人畨異原招即合辨理重提一干人證到官從公對問明白帶回審録發落其原問官吏果有受贓出入人罪情弊通行具奏拿問憲綱凡各都司布政司所屬並直𨽻府州縣軍民諸衙門應有罪囚追問完備杖罪以下依律決斷徒流死罪議擬備申上司詳審直隸聽刑部巡按監察御史在外聽按察司並分司審録無異徒流罪名就便斷遣至死罪者議擬奏聞事內干連人數先行摘斷不須對問者發落寧家必合存留待對者知在聽候直隸去處從刑部委官與巡按監察御史在外從都司布政司按察司及巡按監察御史公同審録處決如畨異原招事有寃抑者即與從公辨理若果寃抑並將原問原審官吏按問其應請旨者奏聞區處若審録無異故延不決及明稱寃枉不與伸理者並依律罪之清軍事例宣德二年敕六科掌科給事中各道掌道監察御史推舉亷能給事中御史各十四員具奏差往各處清理軍役正統五年議準在京在外都司衛所不許差人勾軍止將逃故等項造册送部選差能幹御史一十七員分定地方請敕前去浙江等布政司並直𨽻保定等府州清理每年八月終仍具清解過軍數回京具奏天順二年奏準清軍御史三年一次赴京查考更替𢎞治十年奏準清軍御史三年滿日敢有枉道回家及年限未滿揑造册籍回京本院嚴加考察奏請黜退十五年奏準清軍御史自到地方日為始扣至三年滿日赴京復命提學事例正統元年選差監察御史才行兼備者二員提督南北直𨽻學校其考試生員黜退為吏及蠲免差役追徴食糧等項俱聽照例施行成化十三年奏準各處軍民嵗貢生員俱聽提督學校官考試巡城事例正統十三年令巡視京城等項御史凡事有姦弊聽其依法受理送問成化四年令錦衣衛五城兵馬司禁約賭博緝捕強盜巡城御史通行提調五年奏準巡視五城監察御史不許監收各場草束二十一年奏準京城坐鋪火夫除官員二門並無丁外其餘勇士力士將軍校尉人匠等項家人餘丁例不優免敢有投託內府及在外各衙門分付優免者聽該城兵馬司呈送巡城御史送問𢎞治元年奏準在京捕盜官兵人等遇有地方劫殺人財不行用心緝捕聽錦衣衛堂上並巡城御史指實參奏拏問七年奏準京城九門守門官吏如有私立小班多勒客商車輛等項財物巡城御史拏問巡關事例居庸關直抵龍泉關一帶山海關直抵古北口一帶各差監察御史一員請敕前去公同各該分守守備等項內外官員巡視關口點閘軍士整飭器械操演武藝並受理守關人等一應詞訟就彼發落不許軍衛有司擅便拘提有誤守把如守備等官有罷軟疾弱不堪任事之人指實具奏替换山海等關每半年鎮巡等官將捉獲軍囚開奏若鎮巡等官怠惰聽巡按巡關御史糾舉若非應捕人捉獲軍囚者給賞巡茶馬事例陜西洮州河州西寧茶馬司三處收貯官茶易換畨馬每嵗差監察御史一員請敕前去申明節次條例提督都布按三司軍衛有司並守備把隘等官不許官豪勢要及軍民之家興販私茶潛入畨境通同交易舊例三年一次招畨易馬其後不拘年限願來者聽所買上中下等馬俱解陜西行太僕寺巡鹽事例宣德十年選差御史一員於直隸揚州府通州狼山鎮提督軍衛巡司官旗弓兵人等巡捕禁革私鹽正統三年令兩淮兩浙長蘆等運司每嵗各差御史一員領敕巡視禁約催督鹽課十年令長蘆巡鹽御史兼理山東鹽法成化九年差御史一員巡視河東運司鹽課巡河事例成化八年奏準山東濟寧州直抵南京一帶河道兩淮巡鹽御史帶管通州直抵濟寧州一帶河道長蘆巡鹽御史帶管提督所屬軍衛有司時加疏濬修築禁治豪強革除姦弊及督收船鈔點視驛跕緝捕盜賊盤檢馬船等項捕盜事例宣德四年以冬月河凍選差御史錦衣衛官各三員往良鄉固安通州三路督令軍衛有司各照地方設法捕盜成化二年奏準選差監察御史二員各請敕一員自通州直抵臨清一員自臨清直抵儀真與原差巡河御史提督捕盜十四年以朝覲官在途令巡捕御史錦衣衛官先河凍時兩月差遣盤糧事例遼東宣府甘肅及湖廣兩廣四川等處每三年各差監察御史一員同給事中一員領敕前去各該地方會同巡按御史並原管糧官將各倉庫一應糧料草束銀兩吊取各年收放卷簿自某年查盤以後但係續收之數逐一盤驗要見每年收支現在若干草束亦依法丈量並原糴糧料用過價銀數目若有陳腐粳粃不堪之數並虛出盜賣虧折等弊應提問者提問應參奏者參奏施行雜差事例宣德四年差監察御史九員於京城九門整理鈔法每日將各門收過鈔數開坐奏聞又差監察御史一員同給事中會同光祿寺堂上官驗收牲口果品厨料等物並監收白糧九年差監察御史一員巡視在京倉一員巡視通州倉一員巡視各處收草一員巡視甲字等庫一員提督象牛羊等房錢糧一員巡察光祿寺凡內外官員人等多支食料及需索搔者皆令執奏又差御史一員同給事中錦衣衛官巡視官軍騎操馬匹不許間時帶鞍騎坐及馱載等項正統二年令巡視光祿寺御史同户部主事監收錢糧又差監察御史一員同給事中五城兵馬司五府錦衣衛兵部原委官存恤清到軍士五年令各門收鈔御史等官提督守門官軍遇有將官馬馱載物件等項拏問七年奏準監察御史除憲綱並詔敕內該載應合御史理辦及軍機等項事務如果都布按三司不能完結或完報未明者明白具奏取自上裁其餘常事各衙門自行分管理辦者不許輒擬奏差委又差御史一員同太僕寺官給俵馬匹景泰四年差御史一員於兩廣監軍成化元年差給事中御史各一員巡察各營姦弊遇有該管頭目私役賣放科斂及不行如法操練等項指實劾奏五年各處草場止令本部原委主事等官督同官攢收受其御史照舊往來巡視六年令通州盧溝橋等處抽分局監察御史一季一換按月造册具本會同該局官吏御前復命七年議準在京抽分竹木局五處仍令原設官攢照例抽分每季差御史一員與主事往來巡視提督已上巡按巡鹽巡茶馬巡光祿寺巡關巡城巡倉巡京營御史俱一年滿清軍御史三年滿提學御史九年滿點存恤抽分監收御史俱三月滿刷卷盤糧三年一差印馬一年一差與監試監軍捕盜等項御史事畢即回任管事或御史缺少如清軍刷卷等項以南京御史差遣侍班紏儀監祭員數每日奉天門朝恭丹墀二員午門外二員每月朔望日奉天殿朝恭丹墀二員奉天門外二員萬夀聖節正旦冬至殿上四員丹墀十二員皇太子千秋節文華殿上二員門外二員登極頒詔天下殿上四員丹墀十二員午門外二員承天門外二員上徽號頒詔天下殿上四員丹墀二員午門外二員承天門外二員駕幸太學行釋奠禮監禮四員駕還奉天門行慶賀禮丹墀二員祭酒等官率諸生上表謝恩殿上二員丹墀二員册立東宫傳制殿上四員丹墀十二員午門外二員承天門外二員上表稱賀殿上四員丹墀十二員東宫行冠禮傳制殿上二員丹墀二員行慶賀禮殿上二員丹墀二員文華殿上二員門外二員册封皇后頒詔天下殿上四員丹墀二員午門外二員承天門外二員行慶賀禮殿上二員丹墀二員册封親王殿上二員丹墀二員皇子行冠禮殿上二員丹墀二員册封妃並王妃及行納徴禮傳制殿上二員丹墀二員進實録殿上四員丹墀十二員經筵二員進春進厯並科舉傳制狀元率諸進士上表俱殿上二員丹墀二員大祀天地誓戒殿上二員丹墀二員監禮二員五府六部等衙門點齋二十四員大祀禮成聖駕回行慶賀禮殿上二員丹墀二員待宴二員糾儀四員太廟時享祫祭春秋祭太社太稷太嵗風雲雷雨等神並祭諸陵監禮各二員祭嶽鎮海瀆歷代帝王傳制殿上二員丹墀二員祭先師孔子傳制殿上二員丹墀二員監禮二員日月食糾儀六員南京都察院事例凡本院問擬刑名審録處決重囚及提問職官等項俱與南京刑部同凡本院副都御史僉都御史奉督操江官軍並巡視江道自九江至鎮江蘇松等處成化九年奏準専督巡江後復令兼督操江官軍凡南京各衙門聖節正旦冬至千秋節先期進表箋至期習儀行慶賀禮及迎接詔書開讀俱差御史二員糾儀凡南京孝陵祭祀及祭歷代帝王廟祭先師孔子祭大江之神俱差御史糾儀凡各道御史糾劾言事與都察院同凡應天府鄉試差御史二員監試凡奏差各道御史清軍刷卷巡江管屯鳯陽巡倉等項各有印信在京對道御史關領差人給付事完復命進繳凡照刷南京光祿寺及南京內府庫文卷給散京衛旗軍冬夏布匹各差御史一員事完復命凡監收南京內府各庫布絹差御史一員凡點閘南京皇城門禁差御史一員凡巡城兼巡街道正統間差御史一員𢎞治五年奏準差二員一員分管中東南三兵馬司一員分管西北二兵馬司地方凡監收南京各衛倉及草場糧草南北二處分差御史二員凡點閘南京各教場操練官軍差御史一員凡巡視各衙門人匠存恤各衛新軍監收庫房店舍等項鈔課看裝馬快船隻及石灰山關清水潭稱掣商鹽各差御史或不妨道事暫委監視凡監收龍江等關抽分竹木差御史一員兼督江東宣課司抽分豬羊等項凡南京巡江差御史二員一員自龍王關上至九江一員自龍江關下至蘇松等處凡監收鳯陽糧斛差御史一員正統二年令兼理鳯陽中等九衛所並鳯陽府等軍民詞訟凡南京巡視屯田差御史一員成化四年奏準専理江北四十二衛屯田遇有詞訟應參奏者備呈總督糧儲都御史具奏處分凡巡視等項御史正統十三年奏準若係該管事有姦弊聽依法受理送問其告爭田土婚姻錢債及一應不係該管事內詞訟不許接受明會典卷一百六十六
