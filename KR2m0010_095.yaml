body:
  text: 明會典卷九十五禮部五十四歷日諸司職掌一在京欽天監每歲算歷已成則預先行移各布政司刋印九月初一日進歷仍頒賜京官一頒歷儀注前期一日尚寶設御座於奉天殿教坊司設中和樂於殿內其日陳設如常儀儀禮司設御歷案於殿中設歷案於丹陛中道設百官歷案於丹陛下鼓初嚴引禮引文武官進歷官入詣侍立位鼓三嚴執事文武官詣華蓋殿行五拜三叩頭禮畢傳制受歷侍從等官各就位皇帝服皮辨服出樂作升座捲簾樂止鳴鞭訖引禮引進歷官就位贊禮唱鞠躬樂作贊四拜平身樂止典儀唱進歷引禮引進歷官由東階升詣丹陛案前贊跪搢笏取歷由殿東門靠東入至殿中內贊唱跪外贊唱衆官皆跪唱進歷監官以歷置于案內贊唱出笏俯伏興外贊亦唱俯伏興平身內贊唱復位引禮引進歷官由百官門出樂作引至拜位樂止贊禮唱鞠躬樂作四拜平身樂止進歷官退執事舉百官歷案於丹墀中道鳴贊唱排班班齊鞠躬樂作贊四拜平身樂止傳制官詣御前跪奏傳制俯伏興由殿東門靠東出至丹陛東西向立稱有制贊禮唱跪衆官皆跪宣制曰欽天監進某年大統歷其賜百官頒行天下贊禮唱俯伏興樂作贊四拜平身唱頒歷頒歷官取歷散于百官散畢駕興百官以次出事例洪武六年令歷日惟直𨽻府州及北平陜西二行省頒給其餘皆令依式印造給與所屬十三年令預刋明年大統歷以十月朔日進其諸王及在京文武百官直𨽻府州俱欽天監印造頒給十二布政司則欽天監預以歷本及印分授之使刋印以授府縣頒之民間自是歲以為常三十五年令以十一月朔日進歷著為令藝術諸司職掌一凡天文地理醫藥卜筮師巫音樂等項藝術之人本部務要備知以憑取用一在外行術占卜之人聽於本鄉不許越境興造妖妄等事事例洪武二十六年以卜筮者舊有禁惟瞽目卜筮及隂陽人憑此生理許開卦肆僧道諸司職掌一僧道度牒欽依三年一出給仍要各司考試能通經典者申送到部具奏出給一各布政司并直𨽻府州縣申呈開設僧道衙門舉保道僧人劄付僧録司道士劄付道録司考試如果中試就申吏部施行事例洪武五年給僧道度牒令僧録道録司造周知册頒行天下寺觀凡遇僧道即與對册其父兄貫籍告度日月如有不同即為偽冒六年令各府州縣止存大寺觀一所併處其徒擇有戒行者領之若請給度牒必考試精通經典者方許民家女子未及四十者不許為尼姑女冠二十年令民年二十以上者不許為僧二十四年令清理釋道二教凡各府州縣寺觀但存寬大可容衆者一所併居之不許雜處于外違者治以重罪親故相隱者流願還俗者聽其佛經畨譯已定者不許增減詞語道士設醮亦不許拜奏青詞各遵頒降科儀民有效瑜珈教稱為善友假張真人名私造符録者皆治以重罪又令天下僧道有創立菴堂寺觀非舊額者悉毁之二十六年道士請給度牒者審皆逃民發錦衣衛令習工匠二十七年令榜示天下寺觀凡歸併大寺設砧基道人一人以主差稅每大觀道士編成班次每班一年高者率領餘僧道俱不許奔走於外及交搆有司以書册稱為題疏強求人財其一二人於崇山深谷修禪及學全真者聽三四人不許毋得私創菴堂若遊方問道必自備路費毋索取於民所至僧寺必揭周知册驗實不同者拏送有司僧道有妻妾者許諸人趕逐相容隱者罪之願還俗者聽亦不許收民間兒童為僧違者并兒童父母皆坐以罪年二十以下願為僧者亦須父母具告有司具奏方許三年後赴京考試通經典者始給度牒不通者杖為民有稱白蓮靈寶火居及僧道不務祖風妄為議論沮令者皆治重罪二十八年奏準天下僧道赴京考試不通經典者黜還俗年六十以上者免試三十五年令清理釋道二教凡歷代以來及洪武十五年以前寺觀有名額者不必歸併新創者歸併如舊永樂元年令三年一給度牒六年令軍民子弟僮奴自削髮為僧者并其父兄送京師發五臺山做工畢日就北京為民種田及盧龍牧馬寺主僧擅容留者亦發北京為民種田十年諭本部天下僧道多不守戒律民間修齋誦經動輒較利厚薄又無誠心甚至飲酒食肉遊蕩荒淫略無顧忌又有無知愚民妄稱道人一槩蠱惑男女雜處無别敗壞風化洪武中僧道不務祖風及俗人行瑜珈法稱火居道士者俱有嚴禁即揭榜申明違者殺不赦十五年禁僧尼私建菴院十六年定天下僧道府不過四十人州不過三十人縣不過二十人限年十四以上二十以下父母皆允方許陳告有司行鄉里保勘無礙然後得投寺觀從師受業五年後諸經習熟然後赴僧道録司考試果諳經典始立法名給與度牒不通者罷還為民若童子與父母不願及有祖父母父母無他子孫侍養者皆不許有年三四十以上先曽出家而還俗及亡命黥刺亦不許寺觀住持容留違者罪之宣德元年諭本部僧道行童請給度牒甚多宜令僧道官取勘本部同翰林院官禮科給事中及僧道官考試能通大經給與度牒八年令天下有司關津但遇削髮之人捕送原籍治罪如律十年禁僧道私自簮剃及妄言惑衆者正統元年奏準僧道給度牒者仍照洪武年間例造册頒行天下寺觀以防姦偽六年令僧道多有壞亂心術不務祖風混同世俗傷壞風化都察院即遵洪武舊例出榜禁約違者罪之新創寺觀曽有贈額者聽其居住今後再不許私自創建十四年令僧道應給牒者先令僧道衙門勘試申送有司審係額內并貫籍明白仍試精通本教經典方許申送本部覆試中式然後具奏請給景泰六年令今後僧道務要本戶丁多本人持行修潔不係軍匠鹽竈等籍里老保結呈縣覆實具申府司類呈該部方許收度仍勘各寺觀原定額數如有數多不與出給成化十三年禁約遊方僧人凡僧道住持敕建寺觀許二人敕賜并在外寺觀各止許一人𢎞治十三年奏準僧道有犯挾妓飲酒者俱問發原籍為民若姦拜認義父母親屬俱發邊衛充軍武職有犯容止僧尼在家與人姦宿者公侯伯問擬住俸戴頭巾間住都督都指揮指揮千百戶鎮撫帶俸間住有犯挾妓飲酒者公侯伯罰俸一年不許侍衛管軍管事都督以下帶俸差操原係帶俸者常川帶俸凡漢人出家習學畨教不拘軍民曽否關給度牒俱問發原籍各該軍衛有司當差若漢人冒作畨人者發邊衛充軍祥異諸司職掌一凡各處獻來祥瑞本部準其事收下如有非時災異即時奏聞若遇日月交蝕則預先行移諸司救護一日食儀注前期結綵於禮部儀門及正堂設香案于露臺上向日設金鼓於儀門內兩傍設樂人於露臺下設各官拜位於露臺上下俱向日立至期欽天監官報日初食百官具朝服典儀唱班齊贊禮唱鞠躬樂作四拜興平身樂止跪執事俸鼓詣班首前班首擊鼓三聲衆鼓齊鳴候欽天監官報復圓贊禮唱鞠躬樂作四拜平身樂止禮畢一月食儀注同前但百官便服於都督府救護事例洪武元年敕天下有司凡遇災異俱具實奏聞二年令有司或有災異無論大小皆即時飛奏四年令天下勿奏祥瑞若災異即時奏聞凡天下災異有司申逹巡撫巡按等官即行具奏每數月禮部以歲月先後類奏凡民間一産三男令有司給米養贍教坊承應樂舞朝會宴享等禮各有承應樂舞以教坊𨽻本司具列於此而樂戶禁例附之事例凡聖節冬至正旦行朝賀禮上徽號進實録册封頒詔進春進歷遣祭郊祀聽受誓戒進士傳臚及進士上表俱用中和韶樂兼用堂下樂凡朔望并歲首半月太常寺奏祭祀升殿俱用堂下樂凡大祀天地享太廟祭社稷山川耕藉田幸太學𨗳駕俱用堂下樂凡大祀慶成聖節冬至正旦大宴俱用丹陛樂侑食樂凡禮部進表箋及迎詔俱用大樂凡中和韶樂設於奉天殿內用樂先一日於御前奏知如再用即奏云安定不動計用舉麾奉鑾一員侍班韶舞一員看節次色長二人歌工十二人樂工七十二人凡堂下樂設於奉天門北簷下凡用領樂韶舞等官三員俳長二人色長十二人歌工十二人樂工一百三人凡丹陛樂設於奉天殿前丹陛上凡用領樂俳長二人色長四人歌工十二人樂工一百八人凡侑食樂設於奉天殿內凡用唱盞奏樂奉鑾等官五員領樂色長四人歌工四人樂工三十一人凡大樂提調色長一人凡大祀天地𨗳駕回駕出南天門錦衣衛官奏起輦色長一人唱作樂奉鑾一人唱樂奏神歡之曲樂作𨗳至奉天門樂止駕至奉天門堂下樂作駕至奉天殿樂止上易服鴻臚寺官奏請升殿色長唱作樂奉鑾舉麾唱樂奏聖安之曲中和韶樂作上升座樂止鳴鞭致詞俟贊禮堂下樂作禮畢樂止贊禮畢奉鑾舉麾唱樂奉安安之曲中和韶樂作駕興還至華蓋殿樂止凡用領樂官五員俳長四人協用俳長辦事色長十二人各色色長八十四人樂工十八撥第一撥一百八人第二撥至十七撥每撥不等大約二三十人歌工每撥十二人凡太廟時享𨗳駕回上祭畢至廟街門裏升輦錦衣衛官奏起輦本司俳長唱作樂官一員奏樂奏敬祖宗之曲𨗳至午門裏樂止凡用領樂官五員俳長十人各色色長四十人樂工四撥每撥一百八人歌工十二人凡祭社稷𨗳駕回上祭畢至社稷門裏升輅錦衣衛官奏起輅本司俳長唱作樂官一員奏樂奏神歡之曲𨗳至午門裏樂止凡用領樂官五員俳長四人各色色長十六人樂工二撥每撥一百二人歌工十二人凡祭山川𨗳駕回上祭畢升輦錦衣衛官奏起輦色長唱作樂官一員奏樂奏神歡之曲𨗳至奉天門樂止計用樂十八撥樂章樂器并用人數俱同郊祀回凡幸太學𨗳駕回上幸太學行釋奠禮及堂上講書畢升輦錦衣衛官奏起輦色長唱作樂官一員跪奏樂奏神歡之曲𨗳至奉天門樂止上升座樂作坐定樂止百官行禮樂作禮畢樂止駕還宮樂作至奉天殿樂止計用樂十八撥樂章樂器并用人數俱同郊祀回凡耕藉田并𨗳駕回駕祭先農畢至藉田所戶部尚書捧鞭跪進本司官引裝扮裏行十八人內村田樂老人四人木㑍十四人各念禾詞外行七十二人各作樂器攛掇隨駕行三推禮畢駕至儀門升座樂止觀三公九卿耕訖侍立本司承應用大樂攛掇百戲院本探子斤斗隊舞畢本司官跪贊致語駕至殿內升座進湯進膳俱用樂順天府官并耆老人等行禮謝恩樂作禮畢樂止次百官行禮樂作禮畢樂止賜百官酒飯復入班行禮樂作禮畢樂止尚膳官進膳樂作進訖樂止百官入席本司官奏一奏本太初之曲進酒樂作進訖樂止進膳樂作進訖樂止本司官跪奏進湯樂作徹湯樂止二奏仰大明之曲進酒進膳進湯樂作進訖樂止皆如前三奏民初生之曲進酒進膳進湯樂作進訖樂止復皆如前徹御案畢樂止百官行禮樂作禮畢樂止鴻臚寺官奏禮畢不作樂駕回升輦仍用十八撥樂工歌工前𨗳起輦色長唱作樂本司官跪奏樂奏神歡之曲𨗳至午門前樂止凡大宴駕出至奉天門色長唱作樂丹陛樂作駕升奉奉天殿樂作鴻臚寺贊百官四拜禮畢樂止光祿寺進御筵樂作內官設案訖樂止進花進膳樂作進訖樂止奉鑾奏一奏上萬夀之曲侑食樂作斟酒贊跪本司官奏進酒樂止各官就坐奏樂奏平定天下之舞引舞樂工二人舞人樂工三十二人舞畢奏二奏仰天恩之曲侑食樂作奏進酒樂止殿外𨗳湯樂作領樂俳長一人色長四人攛節樂工二十四人殿內迎湯樂作領樂色長二人歌工四人湯至奏進湯樂作贊饌成徹湯樂止奏黃童白叟鼓腹謳歌承應舞念禾詞俳長一人歌工四人樂工十五人白叟六人黃童八人舞畢奏樂奏撫安四夷之舞引舞樂工二人歌工四人樂工十七人高麗舞琉球舞北畨舞回回舞各四人舞畢奏三奏感地德之曲侑食樂作奏進酒樂止奏樂奏車書會同