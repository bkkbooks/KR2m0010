body:
  text: 明會典卷十五吏部十四諸司職掌凡在京大小衙門及在外布政司并直𨽻府州縣吏典各以三年考滿給由其倉攢典以周嵗為滿除稅課司庫局攢典考滿之日隨即交割明白給由府州縣倉攢典將經收糧斛支銷盡絶方許給由應有府州縣吏典考滿當即給由如布政司府州縣過違一年直𨽻并在京過違半年給由到部俱送法司取問如不過違者隨付司封照依資格撥用事例洪武十七年議定吏員考滿試中第一第二等者於在京有出身衙門內用第三等者於在京未有出身衙門內用仍以等第姓名出榜曉諭遇缺以次撥用二十六年奏準各衙門吏三年役滿於本衙門見缺令史書吏內升用再歷三年給由赴京如有餘吏送付吏部不許一槩縣升於州州升於府府升於布政司等衙門及王府長史司託故不給由者治罪三十一年奏準吏員考滿不給由丁憂不起復及侍親等項託故在間已經官府問斷仍充吏役者重厯三考永樂十一年奏準在外吏考滿照官員給由程限赴部若託故遷延者問罪妻子同發北京充軍種田二十年令吏典不給由丁憂不起復得代不赴京赴京不著役者悉發保安衛充軍宣德三年奏準吏役滿擇其年五十以下堪用者存留五十以上不堪用者俱罷為民有赦前在逃能自首者仍令為民隱而不首事覺發隆慶州為民七年敕諭吏員三考滿當授官者吏部通引於內府會同六部都察院翰林院堂上官出題南北類試錦衣衛堂上官監察御史六科給事中監試考其文義粗曉行移得當書札不謬三事俱可取者為一等二事可取者為二等三事俱不可取者放回民當差正統元年奏準在外吏役除為事月日明有文案許令補輳其患病在家月日不補輳亦準實厯三年考滿三箇月內遇缺許令升補三箇月外雖有缺不準升參六年給由違限者問罪解京重厯給假省親祭祖送幼子還鄉違限等項送問者俱不重厯十二年奏準考滿吏歇役在家過違例限不行給由或丁憂服滿起復違限或侍親親終起復違限或丁憂起復不補原缺參補别衙門或託故在間年久復充吏役或一考多厯一箇月或給由起送違限雖告有堪信文憑遷延二年之上或給由起復到部將役內年月日期增減及多增五嵗以上有規避者或丁憂少守制多守制一箇月或越關在逃行提解京者俱參問重厯或厯役一考或厯役未滿公差事完已滿一考或厯役一考滿為事回還或丁憂服滿起復及截替裁革吏本衙門有缺俱許三箇月以裏參補無缺起送合千府州縣查缺四箇月以裏參補又無缺起送本布政司查缺五箇月以裏參補其都司衛所吏典無缺起送該管有司查缺依例輳撥兩考給由但違一年之上參補者參問重厯或為事歇役或考滿為事歇役俱以問結之日為始應還役者仍補原役輳厯兩考已滿為事還役者俱照限給由違者參問重厯或為事做工公差等項俱以問結事完工滿之日為始若遷延一年之上著役者參問重厯其倉場攢典以守支盡絶之日為始依例給由違者參問重厯景泰二年奏準在外吏兩考役滿止以實撥辦事月日為準丁憂月日亦準實厯數內有省祭送幼子還鄉為事虛曠月日仍撥補輳五年奏準有過名吏公文吏册開報不明者先取親供結狀準收實撥冠帶仍行查勘但有隱匿貪淫等罪例不出身者發隆慶永平等處為民天順三年奏準四川福建兩廣等處吏丁憂起復送幼子等項及年四十五以上曽撥充南京當該者就行撥補及將例前實撥當該三考滿日行南京吏部查理如無充當𨽻兵及貪淫等項就行考試中者起送赴部奏請定奪不中者就彼發回原籍為民成化三年奏準吏員考滿照宣德年間事例會官考選七年令三考滿吏典從吏部陸續考試不必會官仍照三等例行二十三年令吏典三考滿考試不中者給與冠帶間住凡在外一考吏滿無缺起送赴部者查無違礙付驗封司撥補兩考凡吏典給由例限南直𨽻并各布政司俱十四箇月北直𨽻者八箇月違者送問凡吏典一考役滿不轉參兩考役滿不給由展轉揑故歇役三年之上者就彼問發為民中間雖有事故亦不準理未及三年者行查雲南吏典不行轉參給由者同其有接喪丁憂服滿遷延三年之上不起復者亦問發為民未及三年果有事故實迹查照定奪雖在三年之內起送過限到部者仍送問重厯凡吏典給由赴部中途被水火盜賊失落原給公文雖告有所在官司文憑亦待行勘明白方許付撥若將批咨申文手本內緊關年月字樣洗改有迹或給批年逺遇革不倒換新批者俱送問凡吏典給由查無本處造到吏册亦準驗封司暫撥辦事行勘無礙辦事滿日照例實撥倉場攢典例同凡倉場攢典守支八年前役不盡者委官交盤明白交與見任官攢守支給由其批內不開守支盡絶年月日期及違限者送問曽經收放糧草者查照守支年分多寡免其辦事就撥當該全無收放者起送赴部駁回另厯凡在外輳補三考二考吏役內曽犯笞杖罪名不抄原問衙門招由繳部者不準收考凡三考役滿吏考其法律立為三等通者為一等依資格出身其次為二等雜職出身不通者為三等給與冠帶放回原籍間住凡在外鹽運司及遇例納米等項吏典俱送户部查理鹽課通關回報方許收考凡户兵二部書算九年考滿中一等者依資格出身二等者雜職出身三等者冠帶間住諸司職掌見教官項下事例洪武二十六年奏準在外承差於能幹人員內選取三年考滿役內無私過雜職內用有私過充吏役正統元年奏準在外三司承差有缺於民間丁糧相應殷實之家選其才貌可用者縣申州州申府府申布政司覆勘相同方許收參有私過者充吏役保舉官員坐罪凡承差役滿到部審實付文選司分撥各衙門辦事知印役滿查明參充年月日期收考奏請冠帶付文選司分撥辦事但犯笞罪以上俱發充吏考滿不給由丁憂不起復為事在逃遇赦者仍發重厯若役滿到部違限隱匿過名多厯少厯增減年嵗及批咨內洗改緊蘭字樣俱查問在外官員有政迹者舊制許巡按等官奏舉其後又有旌異之名今録事例於後憲綱凡監察御史按察司官巡厯去處但知有司等官守法奉公亷能昭著者隨即舉聞事例凡有司官員政迹卓異許各該上司奏保旌異以示激勸宣德十年詔府州縣官廉勤公正能恤民者親臨上司宜以禮待仍具其政迹奏聞以憑旌擢成化七年奏準有司官員必待三年六年政迹卓異方許薦舉仍令吏部先察舉主舉者亷即用其人不必覆勘舉者非人雖有政迹亦必覆勘𢎞治六年奏準各處巡撫巡按并布按二司遇府州縣官才行俱優者無分嵗貢吏員出身一體舉保五品以上官員果有才德出衆者開報本部奏請定奪事例凡在外有司官員果有政迹深得民心者任滿去職許令百姓保留宣德八年奏準在外官員九年考滿凡有保留者行所屬布政司按察司及直𨽻巡撫巡按官覆勘凡官員任滿考核及朝覲考察各有定制若因事考察間一舉行無常例具列於後事例正統元年奏準兩京五品以下官員從本衙門堂上官考察如有不才及老疾者本部驗實具奏定奪國子監教官禮部尚書及祭酒司業公同考察如無學行者送部别用景泰三年奏準六部等衙門堂上官考察各屬主事等官才力不勝者降縣典史老疾者冠帶致仕天順八年奏準本部都察院會同內閣考察在京五品以下文職并在外布按二司官有不公者許令科道官指實劾奏南京各衙門照例考察有不公者令南京科道劾奏成化四年令兩京文職堂上官曽經科道紏劾及年老不堪任事才德不稱職者各自陳致仕取自上裁五品以下官本部會同都察院及各堂上掌印官公同考察年老無為貪淫酷暴者革職翰林院屬官并帶俸官譯字等官本院學士會同內閣考察𢎞治元年令兩京五品以下官照例考察翰林院官亦從吏部考察其被黜之人有造言生事托拾妄奏者發譴為民十年令兩京官照例考察惟翰林院學士不在五品之例凡考察京官每十年一次舉行不拘見任帶俸丁憂公差養病省祭等項俱公同本衙門堂上官考察凡在外大小衙門官員考察洪武六年令監察御史及按察司察舉有無過犯具奏黜陟永樂元年令府州縣官到任半年之上者巡按御史按察司察其能否亷貪之迹具奏洪熙元年令考察布按二司官不職者降為縣官宣德七年令各處巡撫侍郎同巡按御史考察方面官仍同方面官考察州縣官直𨽻府州縣從巡按御史考察十年敕諭直𨽻府州縣從吏部差官及巡按御史考察各布政司府州縣從布政司及巡按御史考察其布按二司堂上官從吏部都察院考察屬官從巡按御史按察司考察景泰三年敕都御史等官考察天下有司官員七年令天下府州縣官年老殘疾罷軟不任事及貪酷生事科斂害民者許巡撫巡按并按察司堂上官會同考其布按二司官聽巡撫巡按官考察𢎞治元年令考察罷間官吏在京潛住有擅出入禁門交結者各門官盤結拿送錦衣衛打一百發煙瘴地面永遠充軍官員事故具見諸司職掌各有事例若致仕舊𨽻稽勳司掌行今歸本司附載事例於後諸司職掌凡在京衙門及在外布政司并直𨽻府州縣官吏果有家屬干犯極刑除緦麻踈逺異姓親屬不準外其小功已上親例合回避開寫為因何事得何罪名係何衙門取問處決實迹親身赴京陳告以憑行移原籍及任所并原取問衙門照勘取具原籍官吏里鄰結狀并宗支圖本及任所官吏保結明白以憑定擬奏準方許去官離職事例洪武間凡官吏有小功已上親屬干犯極刑官於邊逺敘用吏發邊逺軍衛衙門永充吏役永樂元年令極刑家屬官有才能本部明白具奏不拘例用宣德七年敕諭凡犯罪典刑者已屢經赦宥其子弟果有才行文學聽保舉選用惟犯謀反大逆典刑者子孫不在選用之例諸司職掌凡在京衙門及在外布政司并直𨽻府州縣官吏具告老病殘疾劄付太醫院轉行惠民藥局委官相視明白果成篤廢殘痼疾病分豁堪與不堪醫治明白具奏取自上裁事例正統四年奏準年老廢疾官員不能動履者驗實取具同僚官醫保結備申定奪天順二年令御史不許養病省親成化二年奏準內外文武官員患病三箇月之上俸糧截日住支御史如果久病勘實許還原籍調治六年奏準各處巡撫巡按等官遇有司府州縣官員告稱老疾不堪任事者依例放回原籍不分大小俱類奏以憑揭黃作缺凡告老疾官員年五十五嵗以上者冠帶致仕未及五十五嵗者冠帶間住其考滿官員到部但年六十五嵗以上不得取選凡兩京考滿官員到部年七十者例應致仕未及七十自陳老疾乞恩放回者堂上官本部覆奏定奪其餘行原衙門勘實具奏請旨在外各衙門官員給由起復等項到部奏告老疾者行順天府撥醫驗實通類引奏發落凡兩京見任官員并辦事進士乞恩養病者行原衙門勘實具奏請旨放回病痊之日赴部聽用仍行巡按御史并按察司查勘其在外方面有司官員不許養病國初官員凡以理致仕者朝廷待以優禮與見任同又有升秩給俸賜敕之典其後大臣致仕或給驛還鄉或命有司嵗撥人夫月給食米有差其尤寵異者或賜敕或加賜白金文綺或又官其子孫皆特恩云諸司職掌見稽勳司明令凡內外大小官員年七十者聽令致仕其有特旨選用者不拘此例事例洪武十二年令內外文武官年老致仕者三品以上仍舊四品以下者各升一等給與誥敕其厯事未及三年及為事降用或工役屯種取到者依本等職事致仕不給誥敕十三年令文武官六十以上者皆聽致仕仍給誥敕永樂十九年詔文官七十以上不能治事者許明白具奏放回致仕若無子嗣孤獨不能自存者有司月給米二石養其終身宣德十年詔文武官年未及七十老疾不能任事者皆令冠帶致仕免其雜泛差徭成化元年詔文武官以理致仕五品以上者進階一級四年詔聽選官員九年考滿該升用者年力衰邁不能任事照該升品級給與散官致仕十一年詔給由考稱該升及冠帶未任聽選官員有家貧親老疾病等項願告致仕者授以應該升除職名以榮終身二十二年詔在京文職以理致仕五品以上年及七十者進散官一階其中廉貧不能自存衆所共知者有司嵗給米四石𢎞治四年奏準自告願退官員不分年嵗俱令致仕凡九年考滿官員告致仕者考稱無過升二級不稱有過原職致仕諸司職掌凡在京及在外府州縣官員除授之時投報供狀當即於簿內附寫厯仕腳色始末緣由或任內調除如有事故開附行止以憑稽考事例𢎞治十三年奏準文職官吏監生生員冠帶官知印承差隂陽生醫生但有職役者犯贓犯姦并一應行止有虧俱發為民其知印承差笞杖公罪充吏犯在革前重厯僧道官係京官具奏提問在外依律徑自提問受財枉法滿貫亦問充軍及僧道有犯姦盜詐偽逞私爭訟怙終故犯并一應贓私罪名有玷清規妨礙行止者俱發還俗若犯公事失錯因人連纍及過誤致罪於行止戒規無礙者悉令運炭運米等項各還職為僧為道義官犯該行止有虧者革去冠帶不礙行止者不革王府文職因人連纍并一應過誤律該笞杖罪名者議擬納鈔贖罪還職不必解京就彼奏請發落若係希圖改調故意犯贓有礙行止等項及犯該徒流以上者俱解京奏請改調邊遠敘用重者從重論諸司職掌凡有在京衙門及在外布政司并直𨽻府州縣見任官員但係兵刑等部都察院等衙門或因事提問等項問過應有的決紀録公私過名開咨本部於紀録文册內明白附寫候九年通考以憑黜陟其有司官員三年考滿給由到部供報任內公私過名於册內比查除上司未行知會紀録罪名另行抄録外有已行知會任內公私過名隱匿不報者議擬具奏送法司問罪事例洪武九年令諸司正佐首領雜職官犯公私罪應笞者贖應徒流杖者紀録每嵗一考嵗終布政司呈中書省監察御史按察司呈御史臺俱送本部紀録𢎞治元年奏準內外各衙門問過官吏公私過名及罰俸等項年終造册類繳赴部送司以備稽考國初令有司保舉人才即古鄉舉里選之遺意纍朝下詔亦必及之其事例備載於後諸司職掌凡各府州縣每嵗於所轄隅廂鄉都內拔選容止端謹無過人才一名申送布政司考核轉行按察司覆考堪充嵗貢開坐考過詞語差人送部應有賢良方正及山林巖穴隱逸之士并通曉經書儒士秀才孝廉俱各訪求到官審無過犯違礙不拘名數差人伴送到部或內外官員人等薦舉人材秀才即便行移原籍官司起取赴部如儒士秀才出題考試果否通經賢良隱逸等項人材量其才能定其髙下仍取本户丁糧數目作何營生及户內有無雜役事故供結明白然後開發選部選用如將鄙陋不堪之人一槩朦朧濫舉原舉官吏依貢舉非其人律問罪事例洪武十七年令各布政司直𨽻府州縣舉秀才人材必由鄉舉里選知州知縣等官會同境內耆宿長者訪求德行聲名著於州里之人先從鄰里保舉有司再驗言貌書判方許進呈若不行公同精選者坐以重罪三十五年詔山林隱逸懷才抱德之士有司詢訪以禮敦請赴京量才擢用其有志尚間逸不願出仕者具名來奏永樂元年敕內外諸司文職官員各舉所知或堪重任或沉滯下僚或可剸繁而優遊散地或抱道懷才隱居田里無問逺近並舉以聞洪熙元年詔民間有行己廉正才堪撫字者許見任官具實舉薦宣德七年詔各處文學才行出衆之士自二十五嵗以上令所在有司保舉赴京選用八年詔各布政司按察司府州縣官連名保舉賢良方正一人起送吏部量才擢用正統十四年詔各處舉到儒士照永樂年間事例送翰林院嚴加考試選用不中者發原籍為民景泰三年詔各處見任官員果有才行政事優長拘於資格屈在下僚及有文學才行堪授職任之士隱於民間及官貟罷職委無贓犯重情而才學可用者並聽在內四品以上官員在外巡撫巡按方靣并各府州縣正官指陳實迹薦舉赴京考用所舉之人後犯贓罪連坐舉主天順元年詔處士中有學貫天人材堪經濟隱居髙蹈不求聞達者所司具實奏聞五年令天下有才兼文武或學行異等或謀勇出衆者許所在官司具實奏聞國初外官每年一朝洪武二十九年始定三年一朝之制以辰戌丑未年為期朝正後本部會同都察院考察奏請定奪其存留者俱引至御前刑部及科道官各露章紏劾怠職之罪一時譴責宥免皆出上命及宥免還任各賜敕一道以申戒飭云諸司職掌凡在外官員三年遍行朝覲其各布政司按察司鹽運司府州縣及土官衙門流官等衙門官一貟帶首領官吏各一貟名理問所官一貟照依到任須知依式對欵攢造文册及將原領勑諭諸司職掌內事迹文簿具本親賫奏繳以憑考核各衙門先儘正官到任日淺佐二官到任日久必先佐二官來若係裁革未及二十里長州縣止設正官首領官各一貟去處只令首領官吏來朝其程途遠近各量里路比照行人馳驛日期起程本衙門速將起程月日申部逺者不許過期近者不許預先離職俱限當年十二月二十五日到京其來朝官貟服色各照品級花樣及欽依今定樣製務要新鮮潔淨俱各自備腳力不許馳驛及指此為由科擾於民明令凡各處府州縣有司官員在任三年不許注代許令親將三載任內行過事迹赴京朝覲如無規避依舊復任其佐二官首領官一體三載來朝如一時勾當輪換前來事例洪武十一年令官員來朝察其言行功能第為三等稱職而無過者為上賜坐而宴有過稱職者為中宴而不坐有過而不稱職者為下不預宴序立於門宴者出然後退十七年令天下諸司官吏來朝明年正旦各造事迹文册仍畫土地人民圖本俱以十二月二十五日至京其服色各以品級為差惟雲南逺在邊鄙特免其來宣德五年令廉察朝覲官員貪汚者發邊衛充軍老疾鄙猥者為民其考滿月日已過者回任後將行過事迹造册送合干上司依例考核差人奏繳正統九年令廣西臨邊縣分係裁減衙門免其朝覲須知文册府州縣類進十年令朝覲官員廉能著稱治行超卓者賞衣服一襲鈔一百錠仍賜宴於禮部天順四年令朝覲官貟才行超卓政績顯著者賜宴禮部仍賞衣服一襲鈔一千貫老疾者致任罷軟無為者冠帶間住有贓者發原籍為民成化五年奏準雲南長官司免來朝州縣裁減去處止該吏一名賫文隨司府州縣官員進繳其各府首領官遇邊務差占亦免來朝𢎞治六年令方面知府年老未滿罷軟無為非本部訪有實迹或有巡撫巡按止是一處開報并其餘官員到任未及二年非老疾貪酷顯著者俱留辦事且令朝覲之年先期行文布按二司考合屬巡撫巡按考方靣年終具奏行各該衙門立案待來朝之日詳審考察如有不公許其伸理其科道官必待吏部考察後有失當方許指名紏劾八年奏準各處巡撫巡按會同從公考察布按二司并直𨽻府州縣各鹽運司行太僕寺苑馬寺等官賢否如無巡撫巡按會同清軍或巡鹽考察俱無巡按自行考察其布政使按察使及分巡分守并知府知州知縣并司寺正官各訪所屬官員賢否開具揭帖送巡撫巡按以憑稽考其巡撫官當朝覲之年仍具揭帖密報本部止據見任不謹名目不許追論素行其開報官員若愛憎任情議擬不當本部都察院并科道官指實劾奏罪坐所由若被黜官員有不服考察托拾妄奏者發遣為民諸司職掌凡諸司置立文簿將行過事迹逐件從實開寫承行發落緣由務要簡當每季差典吏一名依期賫赴本管上司查考布政司考府府考州州考縣務從實效除將敕諭事理令諸司進課官吏賫擎前去及行移布政司并直𨽻府州縣照依敕諭事理各置紅油木牌刋刻青字於本衙門公廳上常川懸挂永為遵守每嵗進課之時將考過事迹各賫赴京奏繳以憑通考若遇三年朝覲來朝官吏先將舊年春夏秋三季來考冬季事迹未完許於次年進課之時令該吏進呈毋得誑惑繁文因而生事科擾事例洪武二十三年敕方今所用布政司府州縣按察司官多係民間起取秀才人材孝廉各人授職到任之後略不以到任須知為重公事不謀體統不行終日聽信小人浸潤謀取贓私酷害下民以此仁義之心淪沒殺身之計日生一旦繫獄臨刑神魂倉皇至於哀告懇切奈何虐民在先當此之際雖欲自新不得可矣如此者往往相繼而犯上纍朝廷下辱鄉閭悲哀父母妻子孰曽有鑑其非而改過也哉所有責任條例條列於後一布政司治理親屬臨府嵗月稽求所行事務察其勤惰辨其廉能綱舉到任須知內事目一一務必施行少有頑慢及貪汚坐視恬忍害民者驗其實迹奏聞提問設若用心提調催督宣布條章去惡安善儻耳目有所不及精神有所不至遺下貪官汚吏及無藉頑民按察司方乃是清一府臨州治亦體布政司施行耳目有所不及精神有所不至遺下貪官汚吏及無藉頑民布政司方乃是清一州臨縣治亦體府治施行耳目有所不及精神有所不至遺下貪官汚吏及無藉頑民本府方乃是清一縣親臨里甲務要明播條章去惡安善不致長姦損良如此上下之分定民知有所依巨細事務訴有所歸上不紊政於朝廷下不銜寃於滿地此其治也歟若耳目有所不及精神有所不至遺下無藉頑惡之民本州方乃是清一若布政司不能清府府不能清州州不能清縣縣不能去惡安善遺下不公不法按察司方乃是清一按察司治理布政司府州縣務要盡除姦弊肅清一方耳目有所不及精神有所不至巡按御史方乃是清倘有通同貪官汚吏以致民寃事枉者一體究治一此令一出諸司置立文簿將行過事迹逐一開寫每季輪差吏典一名賫赴本管上司查考布政司考府府考州州考縣務從實效毋得誑惑繁文因而生事科擾每嵗進課之時布政司將本司事迹并府州縣各賫考過事迹文簿赴京通考敢有坐視不理有違責任者罪以重刑嗚呼今之布政司不拏所屬貪贓官吏又不申聞闒茸不才諸等不公不法亦不究問府文到司並不審其為何但知遞送而已府亦以州文如此州亦以縣文如此自布政司至府州皆不異郵亭耳所以不治為此也南京吏部文選清吏司事例凡南京六部等衙門堂上正佐官皆缺洪武永樂以來委給事中郎中等官署掌印信𢎞治十二年奏準如吏户禮兵工五部及通政司缺就於各衙門堂上官內推舉一貟三法司缺就於三法司堂上官內推舉一貟署掌仍將推舉過職名奏聞凡南京各衙門新除復任官貟吏部咨開職名到部各取到任日期并各衙門繳到各官文憑收候年終類繳吏部如遇丁憂者先行咨繳凡南京大小衙門升轉丁憂事故等項官貟作缺到部類咨吏部凡南京各道御史有缺吏部咨送試職理刑等官到部轉咨南京都察院分撥各道取到院日期咨吏部至試職理刑滿日本院考過移文本部咨送吏部奏請實授凡南京各衙門官貟奏行給假省親本部劄送應天府給引定限回任若違限一年半以上本部暫令到任管事具奏請旨照例送問凡南京法司送到還職官貟係在京所屬送原衙門復任直𨽻所屬具揭帖赴南京吏科填給文憑復任日期繳報凡南京各衙門官吏告送幼子還鄉行勘明白定限送應天府給引照回凡南京坐監監生不願出仕者具告到部行本監查勘無礙照例擬授職名填注衙門給與散官奏令冠帶間住凡南京國子監呈送願就教職監生到部咨送吏部施行凡南京各衙門厯事監生舊例考過勤謹逐起差人具奏成化九年奏準本部案候每季通類具奏凡南京各衙門寫本監生俱行本部轉行南京國子監取撥惟户工二部徑自行取𢎞治二年奏準俱從本部取撥轉送凡南京五府六部等衙門知印有缺本部咨吏部請旨點撥到部轉送該衙門著役三年役滿到部咨送吏部考試同九年周嵗考滿官類奏凡南京各衙門三考役滿吏典成化十一年詔免其赴京從本部照例考試中式者就令冠帶辦事不中者徑發為民二十三年詔考試不中者給與冠帶間住凡本部每季考過三考吏典一等二等冠帶分撥各衙門辦事滿日從七品出身者起送吏部聽選其餘俱給引照回原籍省祭三等冠帶間住每年類奏驗封清吏司事例凡南京文職散官每年正月以裏通行各衙門取勘厯任親供應請初授升授加授散官類咨吏部具奏給授凡民瘼事每年正月九月十一月三次通類勘合行十三布政司并南北直𨽻府州如有蝗蟲生發即行撲滅毋貽民患凡本部編置各布政司直𨽻府州勘合紙張底簿書填盡日又復編置發行凡南京各衙門辦事吏典𢎞治十年奏準大小二石辦事半年大小一石并州所吏辦事一年方許實撥京考若缺多照例以次升參凡在京各衙門辦事已滿吏聽撥當該願告南京者吏部咨到本部收附撥簿與南京各衙門應撥當該吏相兼取用凡南京各衙門老疾吏典行應天府撥醫看驗并告貧難者取同鄉人執結是實給引放回為民稽勳清吏司事例凡南京各衙門堂上官丁憂本部咨送吏部關領內府勘合其餘官貟就送南京吏科關填勘合給與若辦事官吏監生俱送應天府給引照回守制按季開咨吏部并南京都察院轉行原籍官司查勘凡起復官吏監生到部扣算聞喪服滿年月日比對相同其在京丁憂者查有類勘保結在卷辦事官監生付文選司吏付驗封司查無類勘保結者仍付該司暫撥行查在外丁憂吏典付考功司若有洗改咨批緊關字樣者送問考功清吏司事例凡南京各衙門官貟考滿到部舊例三年六年九年起送赴京應考核者本部咨南京都察院考過咨送吏部覆考景泰元年奏準例應考核者從本部覆考連人咨送吏部成化二十一年奏準六年者本部考核類奏免其赴京凡應天府所屬在外六縣縣官學官三年六年九年考滿俱本府考核詞語送本部咨送吏部凡南直𨽻所屬司獄司稅課司局驛遞閘壩河舶等官三年六年考滿景泰元年奏準俱赴本部給由考核復職行南京吏科填給文憑復任其牌册差人類送吏部查考凡南京各衙門願告致仕養病官貟行勘明白具奏放回凡各處兩考役滿吏典永樂間定撥廣東廣西四川三布政司分𨽻本部宣德十年奏準添撥江西南安贑州二府福建漳州泉州二府湖廣永州辰州寶慶三府及靖州正統五年奏準添撥湖廣常德長沙衡州三府并郴州福建汀州興化二府𢎞治三年奏準添撥福建邵武湖廣德安二府十年奏準添撥福建行都司并所屬建寧左等五衛二十五所并武平等守禦千户所明會典卷十五
