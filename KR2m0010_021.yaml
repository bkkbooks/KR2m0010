body:
  text: 明會典卷二十一户部六事例洪武二十三年令監生同各府州縣官拘集各里甲人等審知逃户該縣移文差親鄰里甲於各處起取其各里甲下或有他郡流移者即時送縣官給行糧押赴原籍州縣復業永樂十九年令原籍有司覆審逃户如户有稅糧無人辦納及無人聽繼軍役者發回其餘準於所在官司收籍撥地耕種納糧當差其後仍發回原籍有不回者勒於北京為民種田宣德五年奏準逃户已成産業每丁種有成熟田地五十畝以上者許告官寄籍見當軍民匠竈等差及有百里之內開耕田地或百里之外有文憑分房趂田耕種不悮原籍糧差或逺年迷失鄉貫見住深山曠野未經附籍者許所在官司取勘見數造册送部查考其餘不回原籍逃民及窩家俱發所在衛所充軍照例撥與田地耕種辦納子粒若軍衛屯所容隱者逃民收充本衛所屯軍窩家軍餘人等照隱藏逃軍榜例發邊衛充軍該管軍衛有司官吏旗軍鄰里容隱者照榜例坐罪若逃軍詐作逃民許限內自首各還原衛所著役限外不首者逃軍并窩家亦照榜例問斷正統元年令山西河南山東湖廣陜西南北直𨽻保定等府州縣造逃户周知文册借開逃民鄉里姓名男婦口數軍民匠竈等籍及遺下田地稅糧若干原籍有無人丁應承糧差若係軍籍則開某衛軍役及有無缺伍送各處巡撫并清軍御史處督令復業其已成家業願入籍者給與户由執照仍令照數納糧若本户原有丁多稅糧十石以上今止存一二丁者認種地五十畝原籍有人辦糧者每人認種地四十畝俱照輕租民田例每畝起科五升三合五勺原係軍匠籍者仍作軍匠附籍該衛缺人則發遣一丁補役該輪班匠則發遣一丁當匠原籍民竈籍者俱作民竈籍竈户免鹽課量加稅糧如仍不首雖首而所報人口不盡或展轉逃移及窩家不舉首者俱發甘肅衛所充軍二年令各處有司委官挨勘流民名籍男婦大小丁口排門粉壁十家編為一甲互相保識分屬當地里長帶管若團住山林湖濼或投托官豪勢要之家藏躲抗拒官司不服招撫者正犯處死户下編發邊衛充軍里老窩家知而不首及占吝不發者罪同四年添設山東山西河南陜西湖廣布政司所屬并順天等府州佐二官各一員撫治流民後事減地方革罷八年令逃軍逃匠逃囚人等自首免罪各發著役罪重者從實開奏量與寬減其逃民不報籍復業團聚非為抗拒官府不服招撫者户長照南北地方發缺軍衛所充軍家口隨住逃軍逃匠逃囚人等不首者發邊衛所充軍十三年奏準天下諸司衙門老疾致仕事故等項官員離原籍千里之外不能還鄉者許告所在官司行原籍官司照勘原係軍民匠籍照舊收附如遇缺伍失班即送壯丁補役若原籍無人辦納稅糧於附籍州縣照數撥與地畝承種納糧抵補原籍該納之數若附近原籍不及千里者仍發回納糧當差景泰三年令文職改調事故等項官員遺下家人子弟如有畏避原籍軍匠竈役朦朧報作民籍寄住以致原籍缺役者不分年月久近己未附籍押發原籍官司收聽繼天順八年添設湖廣布政司參議一員於荆襄漢陽等府撫治流民成化元年添設陜西按察司副使一員於漢中府撫治流民六年奏準流民願歸原籍者有司給與印信文憑沿途軍衛有司每口給口糧三升其原籍無房屋者有司設法起蓋草房四間仍不分男婦每大口給與口糧三斗小口一斗五升每户給牛二隻量給種子審驗原業田地給與耕種優免糧差五年仍給下帖執照七年令荆襄南陽等處深山窮谷係舊禁山場若不附籍流民潛住團聚為非者許軍衛有司巡捕官兵里老人等拘送各該官司問刑衙門問發邊逺充軍窩藏之人罪同若不係禁約山場止於餘外平地州縣軍屯官莊藏住不報籍者遞發原籍當差逃囚軍匠人等不分山內山外俱發邊衛充軍十七年添設四川按察司副使一員於重夔保順四府撫治流民十八年令各衛所附籍軍丁無糧草者盡發原衛當差有者户留一丁應納丁老及有他故仍於本衛取回一丁頂補其原無籍名有産欲報者亦準一丁附籍二十三年詔陜西山西河南等處軍民先因飢荒逃移將妻妾子女典賣與人者許典賣之家首告準給原價贖取歸宗其無主及願留者聽隱匿者罪同𢎞治八年添設河南布政司參政一員於南陽府撫治流民九年令河南分巡汝陽道僉事兼理撫民聽巡撫鄖陽御史節制十三年奏準凡問發直𨽻隆慶保安二州為民人犯但有在逃及違限不赴配所者俱行提問罪仍改發遼東自在安樂二州為民事例洪武十四年詔天下府州縣編賦役黃册以一百一十户為里推丁多者十人為長餘百户為十甲甲凡十人嵗役里長一人管攝一里之事城中曰坊近城曰廂鄉都曰里凡十年一周先後則各以丁數多寡為次每里編為一册册首總為一圖鰥寡孤獨不任役者則帶管於百一十户之外而列於圖後名曰畸零册成一本進户部布政司及府州縣各存一本二十四年奏準攢造黃册格式有司先將一户定式謄刻印板給與坊長廂長里長并各甲首令人户自將本户人丁事産依式開寫付該管甲首其甲首將本户并十户造到文册送各該坊廂里長坊廂里長各將甲首所造文册攢造一處送赴本縣本縣官吏將册比照先次原造黃册查算如人口有增即為作數其田地等項買者從其增添賣者準令過割務不失原額所據排年里長仍照黃册內原定人户應當設有消乏許於一百户內選丁糧近上者補充圖內有事故户絶者於畸零內補輳如無畸零方許於鄰圖人户內撥補其上中下三等人户亦照原定編排不許更改果有消乏事故有司驗其丁産從公定奪仍於各文册前面本縣照依式樣類總填圖所在有司官吏里甲敢有團局造册科斂害民或將各處寫到如式無差文册故行改抹刁蹬不收者許老人指實連册綁縛害民吏典赴京具奏犯人處斬若頑民粧誣排陷者抵罪若官吏里甲通同人户隱瞞作弊及將原報在官田地不行明白推收過割一槩影射減除糧額者一體處死隱瞞人户家長處死人口遷發化外凡編排里長務不出本都且如一都有六百户將五百五十户編為五里剩下五十户分𣲖本都附各里長名下帶管當差不許將别都人口補輳其畸零人户許將年老殘疾并幼小十嵗以下及寡婦外郡寄莊人户編排若十嵗以上者編入正管且如編在先次十嵗者今已該二十嵗其十嵗已上者各將年分逺近編排候長一體充當甲首其有全種官田人户亦編入圖內輪當凡册式內定列田地山塘房屋車船各項欵目所在官司有者依式開寫無者不許虛開若類縣總都總收除項下止許開寫人丁事産總數不必備開花户其州縣將各里文册類總填圖完備仍依定式將各里人丁事産攢造一處另造類册一本於內分豁各鄉都人丁事産總數正官首領官吏躬親磨算查對相同於各里并本州縣總册後書名畫字用印解赴本府其提調正官首領官吏於各州縣造到文册躬親檢閲磨算相同本府依定式另造總册一本於內分豁各州縣人丁事産總數并州縣造到各項册後一體開寫年月書名畫字用印直𨽻府州本府委官一員率各州縣提調造册官吏親齎其布政司所轄府州仍申解布政司本司官吏躬親檢閲磨算相同依式類造總册一本於內分豁各府州人丁事産總數於各州造到總册後填寫年月書名畫字用印委官一員率各府州縣官吏親齎俱限年終進呈凡菴觀寺院已給度牒僧道如有田糧者編入黃册與里甲納糧當差於户下開寫一户某寺院菴觀其僧某道當幾年里長甲首無田糧者編入帶管畸零下作數凡黃册字樣皆細書大小行欵髙低照坐去式樣面上鄉都保分等項照式刋印不許用紙浮貼其各州縣每里造册二本進呈册用黃紙面布政司府州縣册用青紙面又令各處布政司及直𨽻府州縣并各土官衙門所造黃册俱送户部轉送後湖收架委監察御史二員户科給事中一員户部主事四員監生一千二百名以舊册比對清查如有户口田糧埋沒差錯等項造册徑奏取旨其官員監生合用飲饌器皿等項并膳夫俱於國子監取用如不敷於都稅司并上元江寧縣等衙門支撥紙札於刑部都察院關領不敷之數并筆墨於應天府支給官錢買辦查册房屋册架過湖船及卓橙什物俱工部等衙門添撥夫匠修造凡官員監生吏卒人匠等每五日一次過湖晾晒司禮監户部收掌鎖鑰不許一應諸人往來又奏準凡雲南各府攢造黃册除流官及土官馴熟府分依式攢造外其土官用事邊逺頑野之處里甲不拘定式聽從實編造貴州宣慰司不造播州宣慰司附近通漢語者編造其餘夷民不造正統十二年奏準南京户部清查各處黃册於國子監取監生四十名本部委官一員提督另謄查對發各該司府州縣對欵改造差吏徑送南京户部仍類造改過總册一本送部查考差錯官吏人等查提問罪景泰二年奏準凡各圖人户有父母俱亡而兄弟多年各㸑者有父母存而兄弟近年各㸑者有先因子幼而招壻今子長成而壻歸宗另㸑者有先無子而乞養異姓子承繼今有親子而乞養子歸宗另㸑者俱準另籍當差其兄弟各㸑者查照各人户內如果别無軍匠等項役占規避窒礙自願分户者聽如人丁數少及有軍匠等項役占窒礙仍照舊不許分居凡各里舊額人户除故絶并全户充軍不及一里者許歸併一里當差餘剩人户發附近外里輳圖編造不許寄莊若有詭立姓名者許首告改正其有自願賣與本處人民為業除豁寄莊户籍者聽若違例寄莊者所在有司拘問田地入官其軍衛官下家人旗軍下老幼餘丁曽置附近州縣田地願將人丁事業於所在州縣附籍納糧當差者聽凡各處招撫外郡人民在境居住及軍民官員事故改調等項遺下家人弟男子姪置有田地已成家業者許令寄籍將户內人事産報官編入圖甲納糧當差仍於户下注寫原籍貫址軍民匠竈等户及今收籍緣由不許止作寄籍名色如違所在官司解京發口外充軍田産入官凡攢造黃册如有姦民豪户通同書手或詭寄田地飛走稅糧或瞞隱丁口脫免差徭或改換户籍埋沒軍伍匠役者或將里甲那移前後應當者許自首改正入籍免本罪其各司府州縣委官并當該官吏提督書算從實攢造仍先以提調委官并書算姓名貫址造册一本繳部如有似前作弊者事發問罪充軍三年令各處攢造黃册官吏里書人等揑甲作乙以有為無以無為有者事發所在官司解京並發口外為民六年奏準四川威州并保縣極邊畨夷黃册免造天順五年奏準各處流移人户及軍民官員事故遺下家人先年編成里甲開墾荒地為業已久者各府委官丈量俱照輕則每畒起科秋糧米三升三合草一斤造入黃册納糧當差如仍寄籍及不附籍者解原籍復業田産入官凡各司府州縣總册各委官吏親齎進呈其各里文册另差官徑送南京户部𢎞治三年奏準各處大造黃册俱責成分巡分守知府正官其州縣監造官不拘正佐但推選行止端莊年力精鋭幹辦明敏者專管仍先令里書抄寫原本舊管交監造官即拘排年里甲親供似册供詞細開人口正耗稅糧出入户籍緣由其有舊本宿弊許自首改正免罪監造官參詳考訂攢造册稿然後别選諳曉書手依稿謄寫定限二三月完送本府知府親自磨對仍拘原供排年里甲覆審明白申送分巡分守處辨驗印封類解如經該官吏不用心查對里書故將原册改抹致有丁口增減田糧飛走户籍錯亂者本犯發附近衛所充軍里書發口外為民若干礙監造官員亦治以枉法重罪其黃册字俱照題本字樣真楷書寫事完選委司府官員率領各屬經該官吏定限年終到部送後湖查考中間查有洗改字樣過違限期先將差來人問罪若事干軍伍稅糧重情一體查究照例處治其黃册俱用厚紙背面如法裝釘仍於册內鄉都圖里之上書寫某府州縣里保軍民匠竈等籍易於查究四年奏準先年造册之時有將丁口漏報或稅糧詭寄户籍那移者許先行備開緣由自首本管州縣申詳合干司府查對相同明白改正免罪其官吏里書人等如有通同作弊照例問罪造册完日州縣各計人户若干填寫帖文各一紙後開年月并填委官里書人役姓名用印鈐蓋申逹司府知會給發各户親領執照使知本户舊管新收開除實在丁糧各若干慿此納糧當差下次造册各户抄謄似本開報州縣以為慿據十三年令攢造黃册係軍户者務備開某户某人及於某年月日為某事發充某衛所軍其有事故等項亦備細開具以便查考事例洪武二十四年令選取各處富民充實京師永樂元年令選浙江江西湖廣福建四川廣東廣西陜西河南及直𨽻蘇松常鎮揚州淮安廬州太平寧國安慶徽州等府無田糧并有田糧不及五石殷實大户充北京富户附順天府籍優免差役五年宣德三年令應當富户之家所在官司再免二丁雜泛差役以備供送六年令富户在京入籍逃回原籍或躲避他處順天應天府官查出申部令所在官司即時挨究解發若親鄰里老知者許於官司出首免罪本人能自首赴京者亦免罪若知而不首及有司占吝不發即便究問正犯發口外充軍事故死絶等項各該官司照數僉補正統元年令刑部都察院所犯死罪官吏及糧長大户免運磚收籍順天府其原僉富户有病故者免僉補七年詔免年七十以上無依單丁無力富户仍照數於本州縣殷實人户內僉補逃者本身問罪全家起發永逺充軍十一年令順天府每十年一次委官審勘富户若有年老消乏等項行移原籍官司僉補天順八年詔在京富户今後如有事故不必僉補成化十四年令順天府查勘在逃富户應清勾者造册送部發各該司府州縣拘解補役十六年令各府委官清理原造富户籍册不得違例僉補勾丁及以應放免者重役其富户為事抵充在廂病故者免勾補逃亡病故者仍勾一丁終身除豁明會典卷二十一
