body:
  text: 明會典卷七十四禮部三十三表箋諸司職掌一天壽聖節在外五品以上衙門止進表文一通正旦冬至拜進皇帝表文中宫箋文東宫箋文各一通在外各王府并各布政司按察司及直隸府州表箋俱各差官齎進禮部各州表箋進于各府各府進于布政司其餘五品以上衙門隸布政司者亦進于布政司布政司差官類進禮部其各都司及直隸衛所差官齎進五軍都督府至日禮部官以各處所進表箋目通類奏聞洪武禮制一凡表箋止作散文不許循習四六舊體務要言詞典雅不犯應合回避凶惡字樣仍用硃筆圈點句讀表用黃紙箋用紅紙為函外用夾板夾護拜進並依見行儀式一凡進上位表箋及一應丈字若有御名廟諱合依古二名不偏諱嫌名不諱若有二字相連者必須回避寫字之際不必缺其點畫一凡在外衙門進賀表箋前期一日結綵于公廨及街衢文武官各齋沐於本衙門內宿歇其日清晨設龍亭于庭中設儀仗于庭外露臺上之東西設鼓樂于露臺南之東西北向設表箋于龍亭前設香案于表箋案前設進表箋官位于龍亭之東鼓初嚴各官具服鼓次嚴引禮引班首具服詣香案前滌印用印訖以表箋置于案班首退于幕次鼓三嚴各官入班贊禮唱班齊鞠躬樂作四拜平身樂止唱進表引禮引班首由東階升詣香案前贊跪傳贊衆官皆跪唱搢笏班首搢笏執事者以表箋跪授班首班首跪授進表箋官進表箋官跪受表箋置龍亭中贊內外官俯伏興班首復位贊禮唱鞠躬樂作四拜平身樂止唱搢笏鞠躬三舞蹈跪山呼者三唱出笏俯伏興樂作四拜平身樂止金鼓儀仗鼓樂百官具服前導進表箋官在龍亭後靠東行至郊外置龍亭南向儀仗鼓樂陳列如前儀文武官東西侍立班首取表箋授進表官就於馬上受表即行百官以次退表箋式聖節正旦冬至羣臣上表洪武間定某衙門某官臣某等誠歡誠忭稽首頓首上言伏以天佑下民四時序而風雨時五穀熟而人民育恭惟皇帝陛下承天受命君師宇內相以奠之和以安之是以克享天心永膺寶厯大一統文明之治開萬載太平之基臣某等幸遇明時欣逢聖旦正旦司長至守職守承宣布政用職憲綱按察司用職在牧民府州用職典鹽司鹽運司用職總戎師都司用職典戎行腹裏衛所用職守藩維邊境衛所用職守邊夷土官衙門用心馳遙賀仰紫宸而三祝祈聖壽以齊天無任瞻天仰聖激切屏營之至謹奉表稱賀以聞某年某月某日某衙門某官臣某等謹上表聖節正旦冬至親王上表洪武間定第某子某王某今作某王臣某誠歡誠忭稽首頓首上言伏以皇天眷命統馭萬方聖治神功臣民歡戴恭惟皇帝陛下纘承列聖奉天勤民是以本支繁盛而宗社永安也臣某恪守藩邦欣逢聖旦正旦長至心馳遙賀敬仰紫宸祝聖壽於萬年同天長而地久無任瞻天仰聖激切屏營之至謹奉表稱賀以聞某年某月某日第某子某王某謹上表羣臣謝恩表洪武間定某衙門某官臣某某年月日欽蒙給賜某物升授某職謹奉表稱謝者臣某誠歡誠忭稽首頓首上言伏以聖恩敷布廣大如天凡在臣民均霑雨露恭惟皇帝陛下聖神文武治同百王春育海涵兆民欣戴是以天心永眷而基業愈昌也臣某等深蒙恩寵補報是圖惟堅葵藿之誠上祝萬年之壽無任瞻天仰聖激切屏營之至謹奉表稱謝以聞太皇太后聖旦正旦冬至親王上表𢎞治初定伏以天佑皇明衍慶源於萬世位髙宸極溥德澤於八紘臣庶歡欣華夷仰戴恭惟聖慈仁壽太皇太后陛下睿知聰明齋莊中正同任姒之至聖輔文武之治功德化昭明謀謨廣大是以宗社奠安本支隆盛而建家國天下悠久之福也臣某叨守外邦兹逢聖旦正旦長至謹秉誠心馳遙賀於九重祝齊天之萬壽無任瞻天仰聖激切屏營之至謹奉表稱賀以聞某年某月某日某王某謹上表太皇太后聖旦正旦冬至羣臣上表成化間定伏以運啓皇明德隆坤載茂衍慶源之序昭宣化理之基中外騰歡臣民仰戴恭惟聖慈仁壽太皇太后陛下齋莊貞靜中正仁慈克相先聖而續後之功益大用興聖嗣而治平之道維新光被八紘祥開萬世是以誕膺天下之至養而安享尊榮之多福也臣某叨守外邦職守藩維欣逢聖旦正旦長至仰宫闈之深逺祝聖壽於久長無任瞻仰激切屏營之至謹奉表稱賀以聞皇太后壽旦正旦冬至親王上表羣臣同𢎞治初定伏以景運𢎞開重熙纍洽實資坤德之懿允開邦本之隆海內臣民不勝歡戴恭惟皇太后陛下聰明端淑恭儉慈祥夙贊理於宫闈克迓承於天眷遂啓嗣統之瑞聿興致治之光是以誕膺徽號而享盛福於悠久也臣某親王羣臣注見前欣逢令旦正旦長至仰九重而拜賀祝萬壽以維期無任瞻仰激切屏營之至謹奉表稱賀以聞已上並用小字真書其署名加小表文前上面貼黃帖一方如印大帖下用印黃帖上所書如聖壽寫進賀聖壽表文正旦寫進賀正旦表文冬至寫進賀冬至表文謝恩寫進上謝恩表文末後年月日上亦用印封皮上用黃帖上所書如前黃帖下用印印下寫具官臣某上進謹封於上進謹封字上用印副本用手本小字真書後年月日上用印黃綾表禙袱匣中宫壽旦正旦冬至親王上箋羣臣同宣德間定伏以天眷聖明萬年盛業中宫正治協相洪猷敬惟皇后殿下懋嗣徽音𢎞昭令範仁慈施於宫壼懿德著於家邦是以宗廟尊安而本支蕃衍也臣某屬籍親藩羣臣見前欣逢壽旦正旦長至肅班行而敬拜祝寶算以齊天無任瞻仰激切屏營之至謹奉箋稱賀以聞東宫千秋節正旦冬至親王上箋伏以天眷皇家茂隆大本前星協應四海歸心敬惟皇太子殿下天錫英資日新聖學懋德祗承於謨烈重明翊贊於治平是以宗社尊安臣民咸戴也臣某奉守藩邦欣逢誕辰正旦長至仰春宫而稱頌祝壽算於千秋無任瞻仰激切屏營之至謹奉箋稱賀以聞東宫千秋節正旦冬至羣臣上箋伏以皇天眷佑景運𢎞開大本益隆臣民欣戴敬惟皇太子殿下寬仁育德敬謹存心嗣承萬世之洪圖寅奉重熙之寶厯是以貞符協應萬邦永寧也臣某等職守藩維欣逢令節正旦長至仰望前星敬祝千秋之壽無任瞻仰激切屏營之至謹奉箋稱賀以聞已上書寫署名印封皆與表同但易箋文并紅帖紅綾袱匣事例洪武二十九年以天下諸司所進表箋多務竒巧詞體駢儷令翰林撰慶賀謝恩表箋成式頒于天下諸司令凡遇慶賀謝恩則如式録進正統間奏準凡表箋字畫俱用洪武正韻寫進又令天下諸司進賀表箋非職官不得遣萬壽聖節三司堂上官自進冬至等節許差本司首領官及所屬府州衛所佐二官進明會典卷七十四
