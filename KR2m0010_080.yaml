body:
  text: 明會典卷八十禮部三十九祠祭清吏司諸司職掌郎中員外郎主事掌祠祀享祭天文漏刻國忌廟諱卜筮醫藥道佛之事祭祀一國朝天地太廟社稷山川諸神皆天子親祀國有大事則遣官祭告若先農城隍旗纛馬祖五祀太厲京倉先賢功臣合祀神祗皆遣官致祭而帝王陵寢及孔子廟則傳制特遣郊祀郊壇國初建圜丘于鍾山之陽以冬至祀天建方丘于鍾山之隂以夏至祀地洪武二年以後俱奉仁祖淳皇帝西向配享而中都亦有南北丘之制十年春始定合祀之禮時天地壇大祀殿未成暫合祀天地于奉天殿至十二年正月乃合祀于大祀殿仁祖淳皇帝配享如前命官分獻日月星辰嶽鎮海瀆山川諸神凡一十四壇二十一年又增修壇壝於大祀殿丹墀內疊石為臺東西相向為日月星辰四壇又於內壝之外以次為壇二十亦東西相向為五嶽五鎮四海四瀆風雲雷雨山川太嵗天下神祗歷代帝王諸壇其日月星辰初有朝日夕月禜星之祭至是始罷歷代帝王及太嵗風雲雷雨嶽鎮海瀆山川月將城隍諸神初俱春秋二祭至是亦停春祭惟每嵗八月中旬擇日於山川壇及帝王廟祭之三十二年以後郊壇更奉太祖高皇帝配享永樂八年後巡幸北京多命皇太子代祀禮畢遣本部尚書復命十八年北京天地壇成復每嵗親祀如儀而南京壇有事則遣官祭告洪熙元年奉太祖高皇帝太宗文皇帝並配享其儀注及牲帛祝號具于諸司職掌後有增定者各附書于下太廟社稷山川並同諸司職掌一齋戒凡齋戒前二日太常司官宿于本司次日具本奏聞致齋三日次日進銅人傳制諭文武官齋戒不飲酒不食蔥韭薤蒜不問病不弔喪不聽樂不理刑名不與妻妾同處當日本部官同太常司官於城隍廟發咨仍於各廟焚香三日一告廟凡正祭前二日用祝文酒果奉先殿告仁祖配上帝皇祗告廟祝文維洪武某年嵗次某甲子某月某日孝子皇帝某用敢昭告于皇考仁祖淳皇帝兹以正月某日恭祀上帝皇祗于大祀殿謹請皇考配神伏惟鑒知謹告見用祝文洪熙元年定維某年嵗次某甲子某月某日孝曽孫嗣皇帝某用敢昭告于太祖聖神文武欽明啓運俊德成功統天大孝高皇帝太宗體天𢎞道高明廣運聖武神功純仁至孝文皇帝兹以正月某日恭祀上帝皇祗于大祀殿謹請配神伏惟鑒知謹告一省牲用牛二十八今二十九二豕三十四鹿二羊三十兔十二正祭前二日太常司官奏聞明日與光祿司官省牲次日省牲畢一同復命就奏定分獻官二十四員一正祭陳設共二十七壇後增壇一正殿三壇後增壇一上帝南向犢一登一實以大羔煮肉汁不用鹽醬籩十二實以形鹽藁魚棗栗榛菱芡鹿脯白餅白麵造黑餅蕎麥粉造糗餅米粉造粉餈糯米餈糕豆十二實以韭葅以韭切去本末取中四寸菁葅芹葅筍葅醯醢豬肉鮓用鹽酒拌物調和鹿醢兔醢魚醢脾析用牛百葉切細湯熟用鹽酒造用豚胉豬肩上肉􅓞食用糯米飯羊脂蜜熬糝食用牛羊豕肉細切與粳米飯同熬簠簋各二實以黍稷稻粱玉用蒼璧帛一蒼色織成郊祀制帛四字皇祗南向犢一登一籩十二豆十二簠簋各二玉用黃琮帛一黃色郊祀制帛仁祖配位在東西向犢一登一籩十二豆十二簠簋各二玉用蒼璧帛一蒼色郊祀制帛共設酒尊六爵九篚三于東南西向祝文案一于殿西後太祖太宗配位俱在東西向犢登以下陳設各同共設酒尊八爵十二篚四丹墀四壇大明在東西向犢一登一籩十無糗餌粉餈下同豆十無􅓞食糝食下同簠簋各二帛一紅色禮神制帛酒尊三爵三篚一夜明在西東向犢一登一籩十豆十簠簋各二帛一白色禮神制帛酒尊三篚一星辰一壇在東西向犢一羊三豕三登一鉶二盛和羔用肉鹽舊籩豆各十簠簋各二酒盞三十帛一白色禮神制帛酒尊三爵三篚一星辰二壇在西東向陳設同前東十壇北嶽壇天夀山附增犢一羊一豕一登一鉶二籩豆各十簠簋各二酒盞十今二十帛一黑色禮神制帛今帛二設酒尊三爵三篚一北鎮壇陳設同前東嶽壇陳設同帛一青色禮神制帛東鎮壇陳設同東海壇陳設同太嵗壇陳設同帛一白色禮神制帛帝王壇陳設同帛十六白色禮神制帛酒盞三十山川壇陳設同帛二白色禮神制帛酒盞三十神祗壇羊五豕五鉶三無太羹籩豆各八簠簋各二酒盞三十帛一白色禮神制帛酒尊三爵三篚一四瀆壇陳設與北嶽同帛四黑色禮神制帛酒盞三十西十壇北海壇陳設與北嶽同西嶽壇陳設同帛一白色禮神制帛下同西鎮壇西海壇陳設並同中嶽壇鍾山附陳設同帛二黃色禮神制帛酒盞二十中鎮壇陳設同帛一黃色禮神制帛酒盞十風雲雷雨壇陳設同帛四白色禮神制帛酒盞三十南嶽壇陳設同帛一紅色禮神制帛酒盞十南鎮壇南海壇陳設並同一儀注典儀唱樂舞生就位執事官各司其事陪祀官分獻官各就位導引官導引皇帝至御位內贊奏就位典儀唱燔柴瘞毛血迎神協律郎舉麾奏樂樂止內贊奏四拜百官同典儀唱奠玉帛奏樂內贊奏升壇至上帝前奏搢圭執事官以玉帛跪進于皇帝右奠訖奏出圭至皇祗前奏搢圭執事官以玉帛跪進于皇帝左奠訖奏出圭至仁祖前奏搢圭執事官以玉帛跪進于皇帝右奠訖奏出圭今至太祖前儀同前至太宗前儀同前復位樂止典儀唱進俎奏樂齋郎舁饌至內贊奏升壇至上帝前奏搢圭進俎至皇祗前奏進俎出圭至仁祖前奏搢圭進俎出圭今至太祖前儀同前至太宗前儀同前復位樂止典儀唱行初獻禮奏樂內贊奏升壇至上帝前奏搢圭執事官以爵跪進于皇帝右奏獻爵出圭至皇祗前奏搢圭執事官以爵跪進于皇帝左奏獻爵出圭詣讀祝位跪讀祝樂止讀祝官取祝跪于神位右讀訖樂作奏俯伏興平身百官同至仁祖前奏搢圭獻爵出圭今至太祖前儀同前至太宗前儀同前復位樂止典儀唱行亞獻禮奏樂內贊奏升壇至上帝前奏搢圭執事官以爵跪進于皇帝右奏獻爵出圭至皇祗前奏搢圭執事官以爵跪進于皇帝左奏獻爵出圭至仁祖前奏搢圭執事官以爵跪進于皇帝右奏獻爵出圭今至太祖前儀同前至太宗前儀同前復位樂止典儀唱行終獻禮奏樂儀同亞獻樂止太常卿進立殿西向東唱賜福胙內贊奏詣飲福位跪搢圭光祿司官以福酒跪進奏飲福酒光祿司官以胙跪進奏受胙出圭俯伏興平身復位奏四拜百官同典儀唱徹饌奏樂執事官各壇徹饌樂止典儀唱送神奏樂內贊奏四拜百官同樂止典儀唱讀祝官捧祝進帛官捧帛掌祭官捧饌各詣燎瘞位奏樂執事官各執祝帛饌出內贊奏禮畢一分獻儀注典儀唱行初獻禮贊引引獻官詣神位前搢笏執事官以帛進于分獻官奠訖執事官以爵進于分獻官贊引贊獻爵出笏贊引引至酒尊南北向立典儀唱行亞獻禮執事官以爵進于分獻官贊引贊獻爵典儀唱行終獻禮儀同亞獻贊引引分獻官復位徹饌執事官各壇徹饌典儀唱送神典儀唱讀祝官捧祝進帛官捧帛掌祭官捧饌各詣瘞位執事官各執帛饌詣燎所一祝文維洪武某年嵗次某甲子正月嗣天子臣某用敢昭告于昊天上帝后土皇地祗時維孟春三陽開泰敬率臣僚以玉帛犧齊粢盛庶品恭祀于大祀殿備兹燎瘞皇考仁祖淳皇帝配神尚享見用祝文洪熙元年定維某年嵗次某甲子某月某日至備兹燎瘞皆同上太祖聖神文武欽明啓運俊德成功統天大孝高皇帝太宗體天𢎞道高明廣運聖武神功純仁至孝文皇帝配神尚享一樂章迎神樂奏中和之曲荷蒙天地兮君主華夷欽承踴躍兮備筵而祭誠惶無已兮寸衷微仰瞻俯首兮惟願來期想龍翔鳯舞兮慶雲飛必昭昭穆穆兮降壇壝奠帛樂奏肅和之曲天垂風露兮雨露霑黃壤氤氲兮氣化全民勤畎畝兮束帛鮮臣當設宴兮奉來前進俎樂奏凝和之曲庖人兮列鼎肴羞兮以成方俎兮再獻願享兮以歆初獻樂奏壽和之曲武功之舞聖靈兮皇皇穆嚴兮金床臣今樂舞兮景張酒行初獻兮捧觴亞獻樂奏豫和之曲文德之舞載斟兮再將百辟陪祀兮具張感聖情兮無已拜手稽首兮願享終獻樂奏寧和之曲文德之舞三獻兮樂舞揚肴羞具納兮氣藹而芳祥光朗朗兮上下方况日吉兮時良徹饌樂奏雍和之曲粗陳菲薦兮神喜將感聖心兮何以忘民福留兮佳氣昻臣拜手兮謝恩光送神樂奏安和之曲旌幢爌熀兮雲衢長龍車鳯輦兮駕飛揚遙瞻冉冉兮上下方必蒸民兮永康望燎樂奏時和之曲進羅列兮燎瘞方炬焰發兮煌煌神變化兮束帛將感至恩兮無量事例洪武二年定齋戒日期文武百官先沐浴更衣本衙門宿歇次日聽誓戒畢致齋三日宗廟社稷亦致齋三日惟不誓戒三年賜郊祀執事官新衣仍戒其齋潔無致褻慢又改作犧牲所牲房中為三間以養郊祀牲左三間養宗廟牲右三間養社稷牲餘屋養山川百神之牲令本部鑄銅人一高一尺五寸手執牙簡如大祀齋戒則書致齋三日中祀齋戒則書致齋二日于簡上太常司進置于齋所五年令諸衙門各置木齋戒牌刻文其上曰國有常憲神有鑒焉凡遇祭祀則設之又奏準凡上親祀皇太子留宫中居守親王戎服侍從皇太子親王雖不陪祀一體齋戒六年令燔柴犢牛先刳淨陳之于器置之燔爐之右候駕自齋宫詣壇太和鐘鳴則舉火爐內以燔柴候贊燔柴即以犢牛置柴上燔之七年奏準先時大祀太常司奏中嚴奏外辦盥洗升壇飲福受胙各有贊詞又各壇俱設爵洗位滌爵拭爵初升壇再拜祭酒唱賜福胙之類俱似繁瀆悉令刪去又定大祀分獻禮上行初獻禮奠玉帛將畢分獻官即行初獻禮亞獻終獻皆如之又令祭祀皆免上香又定大祀拜禮始迎神四拜至飲福受胙四拜至送神四拜共十二拜而畢八年置陪祀官圓牙牌及供事官員人等長牙牌各令懸帶無者不許入壇是年始用上親製大祀樂章又定大祀登壇脫舄禮凡郊祀廟享前期一日有司以席藉地設御幕於壇東南門外及設執事官脫履之次於壇門外西階至祀時上自幕次脫舄升壇其升壇執事導駕贊禮讀祝等官皆脫舄門外以次升壇供事協律郎樂舞生依前跣襪就位祭畢降壇納舄九年議定郊社之禮國之大事雖有三年之喪亦不敢廢十年議定天地合祀之典即圜丘舊址為壇以屋覆之名大祀殿每嵗正月擇日行禮十一年議定在京大祀中祀俱用幣在外王國及府州縣祀典神祇亦如之其餘小祀止用牲醴凡看牲前一月初一日大駕親往是後文武大臣日輪一員次日早復命凡分獻用文武大臣及近侍官二十四員太常寺請旨點充凡陪祀文官五品以上及六科都給事中武官四品以上皆預其有刑喪過犯體氣之人不預餘祭並同惟都給事中不預明會典卷八十
