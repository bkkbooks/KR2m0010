body:
  text: 明會典卷二十户部五國初核實天下户口具有定籍令各務所業其後休養既久生齒漸繁户籍分合及流移附屬并脫漏不報者多其數乃減於舊今以近嵗造册數目備列於後以見增減之故云諸司職掌凡各處户口每歲取勘明白分豁舊管新收開除實在總數縣報於州州類總報之於府府類總報之於布政司布政司類總呈逹本部立案以憑稽考仍每十年本部具奏行移各布政司府州縣攢造黃册編排里甲分豁上中下三等人户遇有差役以憑點差若有逃移者所在有司必須窮究所逃去處移文勾取赴官依律問罪仍令復業十三布政司并直𨽻府州人户總計一千六十五萬二千八百七十户人口總計六千五十四萬五千八百二十一口浙江布政司人户二百一十三萬八千二百二十五户人口一千四十八萬七千五百六十七口湖廣布政司人户七十七萬五千八百五十一户人口四百七十萬二千六百六十口江西布政司人户一百五十五萬三千九百二十三户人口八百九十八萬二千四百八十一口河南布政司人户三十一萬五千六百一十七户人口一百九十一萬二千五百四十二口北平布政司人户三十三萬四千七百九十二户人口一百九十二萬六千五百九十五口陜西布政司人户二十九萬四千五百二十六户人口二百三十一萬六千五百六十九口廣西布政司人户二十一萬一千二百六十三户人口一百四十八萬二千六百七十一口山東布政司人户七十五萬三千八百九十四户人口五百二十五萬五千八百七十六口山西布政司人户五十九萬五千四百四十四户人口四百七萬二千一百二十七口廣東布政司人户六十七萬五千五百九十九户人口三百萬七千九百三十二口福建布政司人户八十一萬五千五百二十七户人口三百九十一萬六千八百六口四川布政司人户二十一萬五千七百一十九户人口一百四十六萬六千七百七十八口雲南布政司人户五萬九千五百七十六户人口二十五萬九千二百七十口直𨽻蘇州府人户四十九萬一千五百一十四户人口二百三十五萬五千三十口寧國府人户九萬九千七百三十二户人口五十三萬二千二百五十九口徐州人户二萬二千六百八十三户人口一十八萬八百二十一口滁州人户三千九百四十四户人口二萬四千七百九十七口池州府人户三萬五千八百二十六户人口一十九萬八千五百七十四口揚州府人户一十二萬三千九十七户人口七十三萬六千一百六十五口廬州府人户四萬八千七百二十户人口三十六萬七千二百口安慶府人户五萬五千五百七十三户人口四十二萬二千八百四口松江府人户二十四萬九千九百五十户人口一百二十一萬九千九百三十七口鳯陽府人户七萬九千一百七户人口四十二萬七千三百三口應天府人户一十六萬三千九百一十五户人口一百一十九萬三千六百二十口廣德州人户四萬四千二百六十七户人口二十四萬七千九百七十九口淮安府人户八萬六百八十九户人口六十三萬二千五百四十一口徽州府人户一十二萬五千五百四十八户人口五十九萬二千三百六十四口常州府人户一十五萬二千一百六十四户人口七十七萬五千五百一十三口鎮江府人户八萬七千三百六十四户人口五十二萬二千三百八十三口太平府人户三萬九千二百九十户人口二十五萬九千九百三十七口和州人户九千五百三十一户人口六萬六千七百一十一口十三布政司并直𨽻府州𢎞治四年造册户口數目人户九百一十一萬三千五百四十六户人口五千三百三十八萬一千一百七十三口浙江布政司人户一百五十萬三千一百二十四户人口五百三十萬五千八百四十三口山西布政司人户五十七萬五千二百四十九户人口四百三十六萬四百七十六口雲南布政司人户一萬五千九百五十户人口一十二萬五千九百五十五口四川布政司人户二十五萬三千八百三户人口二百五十九萬八千四百六十口湖廣布政司人户五十萬四千八百七十户人口三百七十八萬一千七百一十四口福建布政司人户五十萬六千三十九户人口二百一十萬六千六十口江西布政司人户一百三十六萬三千六百二十九户人口六百五十四萬九千八百口山東布政司人户七十七萬五百五十五户人口六百七十五萬九千六百七十五口河南布政司人户四十三萬六千八百四十三户人口二百六十一萬四千三百九十八口貴州布政司人户四萬三千三百六十七户人口二十五萬八千六百九十三口廣東布政司人户四十六萬七千三百九十户人口一百八十一萬七千三百八十四口陜西布政司人户三十萬六千六百四十四户人口三百九十一萬二千三百七十口廣西布政司人户四十五萬九千六百四十户人口一百六十七萬六千二百七十四口南直𨽻應天府人户一十四萬四千三百六十八户人口七十一萬一千三口寧國府人户六萬三百六十四户人口三十七萬一千五百四十三口太平府人户二萬九千四百六十六户人口一十七萬三千六百九十九口鎮江府人户六萬八千三百四十四户人口一十七萬一千五百八口鳯陽府人户九萬五千一十户人口九十三萬一千一百八口松江府人户二十萬五百二十户人口六十二萬七千三百一十三口揚州府人户十萬四千二百四户人口六十五萬六千五百四十七口廬州府人户三萬六千五百四十八户人口四十八萬六千五百四十九口安慶府人户四萬六千五十户人口六十萬六千八十九口池州府人户一萬四千九十一户人口六萬九千四百七十八口常州府人户五萬一百二十一户人口二十二萬八千三百六十三口蘇州府人户五十三萬五千四百九户人口二百四萬八千九十七口淮安府人户二萬七千九百七十八户人口二十三萬七千五百三十七口徽州府人户七千二百五十一户人口六萬五千八百六十一口廣德州人户四萬五千四十三户人口二十二萬七千七百九十五口和州人户七千四百五十户人口六萬七千一十六口徐州人户三萬四千八百八十六户人口三十五萬四千三百一十一口滌州人户四千八百四十户人口四萬九千七百一十二口北直𨽻順天府人户一十萬五百一十八户人口六十六萬九千三十三口大名府人户六萬六千二百七户人口五十七萬四千九百七十二口保定府人户五萬六百三十九户人口五十八萬二千四百八十二口真定府人户五萬九千四百三十九户人口五十九萬七千六百七十三口永平府人户二萬三千五百三十九户人口二十二萬八千九百四十四口廣平府人户二萬七千七百六十四户人口二十一萬二千八百四十六口河間府人户四萬二千五百四十八户人口三十七萬八千六百五十八口順德府人户二萬一千六百一十四户人口一十八萬一千八百二十五口隆慶州人户一千七百八十七户人口二千五百四十四口保安州人户四百四十五户人口一千五百六十口明令凡各處漏口脫户之人許赴所在官司出首與免本罪收籍當差凡嫡庶子男除有官廕襲先儘嫡長子孫其分析家財田産不問妻妾婢生止依子數均分姦生之子依子數量與半分如别無子立應繼之人為嗣與姦生子均分無應繼之人方許承紹全分凡無子者許令同宗昭穆相當之姪承繼先儘同父周親次及大功小功緦麻如俱無方許擇立逺房及同姓為嗣若立嗣之後却生親子其家産與原立子均分並不許乞養異姓為嗣以亂宗族立同姓者亦不得尊卑失序以亂昭穆凡婦人夫亡無子守志者合承夫分須憑族長擇昭穆相當之人繼嗣其改嫁者夫家財産及原有粧奩並聽前夫之家為主凡户絶財産果無同宗應繼者所生親女承分無女者入官凡祖父母父母在者子孫不許分財異居其父祖許令分析者聽凡軍民醫匠隂陽諸色户許各以原報抄籍為定不得妄行變亂違者治罪仍從原籍憲綱一户口仰本府州縣取勘所屬籍定户口分豁城市鄉都舊管收除實在數目開報事例洪武三年令中書省臣凡行郊祀禮以天下户口錢糧之籍陳於臺下祭畢收入內庫藏之令本部榜諭天下軍民凡有未占籍而不應役者許自首軍發衛所民歸有司匠𨽻工部詔本部籍天下户口及置户帖各書户之鄉貫丁口名歲以字號編為勘合用半印鈐記籍藏於部帖給於民令有司點閘比對有不合者發充軍官吏隱瞞者處斬十九年令各處民間凡成丁者務各守本業出入鄰里必欲互知其有逰民及稱商賈雖有引若錢不盈萬文鈔不及十貫俱送所在官司遷發化外正統三年令四川清軍官員取勘各府州縣人户有三姓五姓十姓合為一户者俱各另為立户應當糧差不許合户附籍天順八年令在營官軍户丁舍餘不許附近寄籍如原籍丁盡許摘丁發回成化二年令在京軍職漏報户下舍人者發邉方立功三年六年令軍户不許將弟男子姪過房與人脫免軍伍𢎞治十三年奏準軍户子孫畏懼軍役另開户籍或於别府州縣入贅寄籍等項及至原衛發册清勾買囑原籍官吏里書人等揑作丁盡户絶回申者俱問罪正犯發煙瘴地面里書人等發附近衛所俱充軍官吏參究治罪明會典卷二十
