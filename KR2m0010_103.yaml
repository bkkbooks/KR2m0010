body:
  text: 明會典卷一百三禮部六十二精膳清吏司諸司職掌郎中員外郎主事掌邦國牲豆酒膳辦其品數膳羞一諸司職掌一凡遇正旦聖節冬至或吉慶筵宴所用諸品膳羞酒醴並須提調光祿司供辦若管待諸畨國朝貢等使客并外夷來降土官人等茶飯物料本部自行備辦其宴之日赴會同館管待令教坊司供應若奉旨管待之人俱於本部筵宴正官主席一土官使客至會同館除柴米鋪陳本館應付外本部照依正從名數每五日一次支送下程一管待物料先期一日本部劄付膳部照依時價收買仍令物户親齎赴部對物給價其合用羊隻主事廳具手本赴光祿司關領原編羊隻字號勘合於司牧局照號關取造辦管待畢日仍回呈本部開具買過物件同支過價鈔數目主事廳回呈關過羊隻字號毛色斤重本部判送立案通類開銷一管待物件則例每正一卓果子五色按酒五色湯三品小割正飯用羊一支送下程則例五日每正一名豬肉二斤八兩乾魚一斤四兩酒一瓶麵二斤鹽醬各二兩茶油各一兩花椒二錢五分燭每房五枝已上下程若奉旨優待不拘此例一衍聖公張真人到京下程鵝二隻麵一十五斤酒四瓶茶醬鹽各一斤燭一十枝一買辦管待物料鈔貫若支銷盡絶本部照例具奏依數關領鈔錠回部收貯在庫聽候買辦如支銷未盡依上關用筵宴事例郊祀慶成永樂二年上卓按酒五般果子五般茶食五般燒煠五般湯三品雙下饅頭馬肉飯酒五鍾中卓按酒四般果子四般湯三品雙下饅頭馬豬羊肉飯酒五鍾隨駕將軍按酒一般粉湯雙下饅頭豬肉飯酒一鍾金鎗甲士象奴校尉雙下饅頭教坊司樂人按酒一般粉湯雙下饅頭酒一鍾天順元年上卓寶粧茶食嚮糖纒碗八箇棒子骨二塊大銀錠油酥八箇花頭二箇鳳鴨一隻菜四色按酒五般湯三品小銀錠笑靨二楪鴛鴦飯二塊大饅頭一分果子五般黑白餅一楪鮓一楪每人酒五鍾上中卓寶粧茶食嚮糖纒碗八箇棒子骨二塊大銀錠油酥八箇花頭二箇甘露餅四箇菜四色按酒五般小銀錠笑靨二楪湯三品鴛鴦飯二塊大饅頭二分果子五般每人酒五鍾中卓寶粧茶食雲子麻葉二楪甘露餅四箇大銀錠油酥八箇煠魚二塊小銀錠笑靨二楪果子按酒各五般菜四色花頭二箇湯三品熟豬羊飯二塊大饅頭四分每人酒五鍾下卓寶粧茶食大銀錠油酥八箇煠魚二塊果子四般按酒四般菜四色湯三品馬肉飯二塊大饅頭二分每人酒五鍾聖節永樂十三年上卓按酒五般果子五般茶食燒煠鳳雞雙棒子骨大銀錠大油餅湯三品雙下饅頭馬肉飯酒五鍾上中卓按酒四般果子四般燒煠銀錠油餅雙棒子骨湯二品雙下饅頭馬肉飯酒三鍾中卓按酒四般果子四般燒煠茶食湯二品雙下饅頭羊肉飯酒三鍾僧官等用素卓按酒五般果子茶食燒煠湯三品雙下饅頭蜂糖糕飯將軍按酒一般夀麵雙下饅頭馬肉飯酒一鍾金鎗甲士象奴校尉雙下饅頭酒一鍾教坊司樂人按酒一般粉湯雙下饅頭酒一鍾給表內官內使上卓按酒五般果子湯二品小饅頭酒三鍾中卓按酒四般果子湯二品小饅頭正旦莭永樂間上卓茶食像生小花果子五般燒煠五般鳳雞雙棒子骨大銀錠大油餅按酒五般菜四色湯三品簇二大饅頭馬牛羊胙肉飯酒五鍾上中卓茶食像生小花果子五般按酒五般菜四色湯三品簇二大饅頭馬牛羊胙肉飯酒五鍾中卓果子四般按酒四般菜四色湯二品簇二饅頭馬豬牛羊胙肉飯酒三鍾隨駕將軍按酒細粉湯椒醋肉并頭蹄簇二饅頭豬肉飯酒一鍾金鎗甲士象奴校尉雙下饅頭教坊司樂人按酒熝牛肉雙下饅頭細粉湯酒一鍾冬至莭永樂間上卓按酒五般果子五般茶食湯三品雙下饅頭馬羊肉飯酒五鐘中卓按酒四般果子四般茶食湯三品雙下饅頭酒五鍾將軍按酒一般雙下饅頭粉湯酒一鍾金鎗甲士象奴校尉雙下饅頭教坊司樂人按酒一盤雙下饅頭粉湯酒一鍾皇太后夀旦正統間上卓按酒四般菜四色夀麵一碗酒三鍾中卓同但夀麵二碗酒六鍾東宫千秋節宣德間上卓按酒四般菜四色夀麵一碗酒三鍾中卓按酒五般菜四色夀麵二碗酒六鍾立春節永樂間上卓按酒四般湯一碗春餅一楪菜四色酒三鍾中卓按酒四般湯一碗春餅二楪菜四色酒六鍾元宵節永樂間上卓按酒四般果子茶食小饅頭粉湯圓子一碗菜四色酒三鍾中卓按酒四般果子茶食小饅頭粉湯圓子二碗菜四色酒六鍾四月八節永樂間上卓按酒二般不落莢一楪涼糕一楪小點心一楪菜四色湯一碗酒三鍾中卓按酒二般不落莢一楪涼糕一楪小點心一楪菜四色湯二碗酒六鍾端午節永樂間上卓按酒五般果子小饅頭湯三品糕一楪粽子一楪菜四色酒五鍾中卓按酒四般果子小饅頭湯三品糕一楪粽子一楪菜四色酒五鍾教坊司樂人按酒一般湯飯酒一鍾重陽節永樂間上卓按酒二般糕二楪小點心一楪湯一碗菜四色酒三鍾中卓按酒二般湯二碗小點心一楪糕二楪菜四色酒六鍾臘八節永樂間上卓按酒四般臘麵一碗菜四色酒三鍾中卓按酒四般麵二碗菜四色酒六鐘祭太廟享胙永樂元年上卓按酒五般果子五般小饅頭粉湯酒三鍾中卓按酒四般果子四般小饅頭粉湯酒四鍾祭稷稷享胙永樂二年上卓按酒五般果子五般茶食五般湯三品雙下饅頭馬豬羊肉飯酒五鍾中卓按酒四般果子四般湯三品雙下饅頭豬肉飯酒五鍾祭先農享胙永樂元年上卓按酒四般簇四小饅頭粉湯酒六鍾駕幸太學筵宴𢎞治元年上卓按酒五般果子五般大銀錠大油酥寶粧鳯鴨小點心棒子骨湯三品菜四色大饅頭羊背皮酒五鍾中卓按酒五般果子五般茶食五般煠魚小點心大饅頭菜四色羊腳子飯湯三品酒五鍾進士恩榮宴永樂十三年上卓按酒燒煠四般寶粧茶食果子五般軟按酒五般菜四色湯三品雙下大饅頭羊肉飯酒五鍾上中卓按酒燒煠四般寶粧茶食果子四般軟按酒四般菜四色湯三品雙下饅頭羊肉飯酒五鍾天順元年每卓煠魚大銀錠堆花雙棒子骨寶粧雲子麻葉甘露餅大油餅鳳雞􅖷豬肉􅖷羊肉小銀錠笑靨兒椒醋豬肉椒末牛馬椒醋雞并魚湯三品果子五般小饅頭雙下大饅頭牛羊肉飯酒五鍾𢎞治三年上卓按酒五般果子五般寶粧茶食五般鳳鴨一隻小饅頭三楪小銀錠笑靨二楪棒子骨二塊羊背皮一箇花頭二箇湯五品菜四色大饅頭一分米糕二楪添換羊肉一楪酒七鍾上中卓寶粧茶食按酒果子各五般鳳鴨一隻小饅頭三楪小銀錠笑靨二楪煠魚二楪羊腳子飯二塊花頭二箇湯五品菜四色大饅頭二分添換羊肉一楪酒七鍾中卓茶食按酒果子各五般甘露餅一楪小饅頭二楪小銀錠笑靨二楪煠魚二楪牛肉飯二塊花頭二箇湯五品菜四色大饅頭二分添換羊肉一楪酒七鍾管待畨夷土官筵宴凡諸畨國及四夷使臣土官人等進貢例有欽賜筵宴一次二次本部預開筵宴日期奏請內臣一員大臣一員待宴及行光祿寺備辦於會同館待教坊司用樂鴻臚寺令通事及鳴讚供事儀制司領宴花人一枝若使臣數多分二日宴回還之日差官伴送沿途備辦飲食經過去處茶飯管待各有次數許鎮守總兵官或三司或府衛正官二三員陪席朝鮮國筵宴二次宣德三年使臣回還薊州永平府茶飯管待占城國琉球國瓜哇國暹羅國筵宴二次使臣回還至廣東布政司茶飯管待一次哈蜜筵宴二次使臣回還至良鄉湯飯陜西布政司茶飯管待一次衛喇特筵宴二次正統間使臣進貢至大同茶飯管待一次回還良鄉湯飯至真定府陜西布政司甘肅茶飯管待額爾巴拉筵宴二次正統間使臣回還至真定府陜西布政司甘肅茶飯管待今例良鄉湯飯至陜西布政司管待一次賽瑪爾堪筵宴二次永樂間使臣回還至甘肅管待一次正統十二年使臣數少甘肅管待多則陜西布政司管待甘肅止送下程今例至良鄉湯飯陜西布政司管待一次哈喇筵宴二次宣德七年使臣朝貢至潼關陜西甘肅管待土魯畨筵宴二次使臣回至良鄉湯飯陜西布政司管待一次滿剌加國筵宴二次使臣回至廣東布政司管待一次永樂間使臣回經過府州管待正統間濟寧江西布政使廣東布政司管待宣德八年國王朝貢廣東布政司并南雄贑州臨江淮安濟寧六府州茶飯管待至通州令行在光祿寺辦送茶飯接待日本國筵宴二次使臣回還至寧波府管待一次宣德間使臣通州湯飯令行在光祿寺辦送至濟寧州浙江布政司并寧波府茶飯管待錫蘭山國筵宴二次使臣回至廣東布政司管待一次安南國尼嚕罕都督諾延三衛雲南土官喇嘛畨僧罕都衛養獅豹回回爉燭地面坤城地面日羅國安定王鄂端地面筵宴一次和卓呢國王竒爾瑪勒阿克蘇地面和爾默色國巴逹克山竒爾愛滿米兒哈蘭甘把里國柯枝國白松虎兒古里國逹爾瑪納古爾諾爾布永樂間筵宴一次哈坦國色佛哷國天方國嘉裕勒國黑葛達國喀什爾噶宣德間筵宴一次戎地面和囉海衛察遜衛竒木嘉色稜買買回回鎖魯丹正統間筵宴一次齊勤蒙古衛天順間筵宴一次蘇門答剌筵宴一次使臣回至廣東布政司管待一次榜葛剌國筵宴一次使臣回經過府州茶飯管待伊伯格勒實巴爾筵宴一次使臣回至大同茶飯管待一次實喇斯伊斯帕罕柳城永樂間筵宴一次使臣回經過府衛茶飯管待納木扎勒罕王永樂間筵宴一次使臣回至保定真定彰德衛輝懷慶河南各府潼關衛陜西布政司平涼府甘肅茶飯管待密實勒永樂間筵宴一次使臣回至良鄉湯飯甘肅管待一次瑪哈穆特王永樂間筵宴一次使臣進貢經過有司茶飯管待天順四年陜西布政司茶飯管待一次烏蘭哈逹宣德間使臣朝貢沿途茶飯接待哈里筵宴一次永樂間使臣朝貢經過府衛茶飯管待至涿州良鄉令光祿寺辦送茶飯接待回還自良鄉抵陜西布政司經過府州茶飯管待呼爾察永樂十四年使臣進貢經過府衛州縣管待蘇祿國永樂十五年筵宴一次國王來朝經過府衛茶飯管待回還亦如之真臘國景泰間筵宴一次使臣回還廣東布政司管待一次沙州衛正統間筵宴一次使臣回還至良鄉湯飯甘肅管待一次尚師法王永樂間尚師法王來朝經過府分茶飯管待回還亦如之可脫癿永樂間使臣進貢經過府分茶飯管待至良鄉令光祿寺辦送茶飯接待討來思宣德六年使臣回至真定府陜西布政司甘肅茶飯管待迤北正統間筵宴二次成化十一年使臣朝見酒飯中卓按酒每楪加四兩茶食每楪加二兩果品內核桃榛子紅棗各加二兩膠棗一楪加四兩餘同常例𢎞治元年使臣進貢至大同茶飯管待榆河驛湯飯回還至大同茶飯管待筵宴畨夷土官卓面則例永樂元年上卓按酒五般果子五般燒煠五般茶食湯三品雙下大饅頭羊肉飯酒七鍾中卓按酒果子各四般湯二品雙下饅頭牛馬羊肉飯酒五鍾天順元年上卓髙頂茶食雲子麻葉大銀錠油酥八箇棒子骨二塊鳳鵝一隻小銀錠笑靨二楪茶食果子按酒各五般米糕二楪小饅頭三楪菜四色花頭二箇湯三品大饅頭一分羊背皮一箇添換小饅頭一楪按酒一般茶食一楪酒七鍾中卓寶粧茶食雲子麻葉二楪甘露餅四箇鮓魚二塊大銀錠油酥八箇小銀錠笑靨二楪果子按酒各五般菜四色花頭二箇湯三品馬肉飯一塊大饅頭一分添換小饅頭一楪羊肉一楪茶食一楪酒七鍾畨夷人等朔望朝及見辭酒飯常例上卓按酒用牛羊等肉共五楪每楪生肉一斤八兩茶食五楪每楪一斤果五楪核桃紅棗榛子每楪一斤膠棗柿餅每楪一斤八兩中卓按酒用羊牛肉四楪每楪生肉一斤茶食四楪每楪十兩果四楪核桃榛子紅棗每楪十兩膠棗十二兩酒三鍾湯飯各一碗明會典卷一百三
