  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0010_WYG_062-1a, image: WYG0617/WYG0617-0633a.png}
body:
  text: 明會典卷六十二禮部二十一冠禮皇太孫冠禮永樂九年定前期二日各執事官於本部習儀次日赴華蓋殿習儀前期錦衣衛設幕次於華蓋殿之東序鴻臚寺設掌贊宣敕戒等官位於殿內道之東北向西上設應行禮官屬位於內道東西上設護衛武官位於內道之西東上設諸執事起居位於武官位之東北向設通贊典禮二人位於殿內東西相向內侍設皇太孫冠席於殿內東南西向設醴席於西上南向張帷幄於東席內陳設裀褥於幄中又張帷於序外內侍陳服於內內東領北上衮服九章翼善冠絳紗袍緇纚網巾犀簮三物同箱在服南櫛實於箱又在南司尊實醴於側尊加勺羃設於醴席之南設坫於尊東置二爵於坫進饌者實饌設於尊北諸執事者皆立於其所冕九旒翼善冠緇纚網巾各以箱盛候是日早上御奉天殿傳制遣官制詞曰朕皇太孫某冠命卿等持節行禮傳制畢掌冠官持節至華蓋殿行禮候節至禮部鴻臚寺等官詣東序啓皇太孫出迎殿門外贊禮導皇太孫迎節至殿置於中設香案樂作贊禮贊皇太孫行四拜禮畢禮部等官啓皇太孫詣冠席內侍二人夾侍皇太孫即席正南向樂止引禮引賔贊以次詣罍洗樂作搢笏盥手帨手訖出笏樂止自西階執緇纚及網巾者升掌冠降一等受之進皇太孫席前北面立祝曰吉月令辰乃加元服懋敬是承永介景福畢供奉官束髮掌冠跪加網巾樂作賔興席南北面立贊冠者北面跪正之興立於掌冠後內使跪進服訖樂止掌冠啓皇太孫復坐執翼善冠者升掌冠降二等受之右執項左執前進皇太孫席前北面立祝曰冠禮申舉以成令德敬慎威儀惟民之式畢乃跪冠樂作掌冠興席南北面立贊跪進席前面北跪正冠興立於掌冠後皇太孫興內使進絳紗袍服訖樂止掌冠啓皇太孫復坐贊冠進席前北面跪脫翼善冠置於箱興內侍跪脫服亦置於席執衮冕者升賔降三等受之右執項左執前進皇太孫席前北面立祝曰章服咸加飭敬有虔永固皇圖於千萬年畢乃跪冠樂作掌冠興席南北向立贊冠者進席前北面跪簮結紘興立於掌冠後內侍跪進衮服訖樂止禮部等官引皇太孫降自東階樂作由西階升即醴席南向坐樂止引禮引掌冠詣罍洗樂作搢笏盥手訖出笏升西階樂止贊冠者取爵詣司樽所酌醴授掌冠掌冠受爵跪進於皇太孫席前北面祝曰旨酒孔馨嘉薦載芳受天之福萬世其昌畢皇太孫搢圭受爵樂奏喜千春之曲飲訖奠爵進饌者捧饌設於皇太孫席前皇太孫食訖出圭執事徹饌樂止禮部等官啓請引皇太孫降自西階詣拜位樂作就位引禮引宣敕戒官詣皇太孫位稍東西向稱有制贊皇太孫跪樂止聽宣敕戒詞曰孝事君親友于兄弟親賢愛民居仁由義毋怠毋驕荗隆萬世樂作俯伏興拜興拜興拜興拜興平身樂止禮部官啓禮畢贊禮畢樂作禮部官引皇太孫送節至殿門外引還東序內侍引還宫樂止掌冠等官復命皇太孫當日謁廟畢就詣上位前謝及東宫前謝次日文武百官具朝服稱賀詞曰皇太孫冠禮既成當慶賀次詣文華殿稱賀次詣皇太孫前行賀禮親王冠禮諸司職掌一前期三日各執事官於本部習儀至日傳制遣官持節行禮一前期儀衛司先設王邸在東序張帷幄設禋褥於序中又張帷於序儀制司設掌贊宣敕戒等官序立位於王邸東稍西向具九旒冕翼善冠絳紗袍等服并網簮金簮二物各以箱成候持節者至禮部儀禮司等官啓王出迎門外贊禮導王行節入王邸置中庭樂作贊王詣香案前四拜畢禮部等官啓就冠席西南向內侍二人夾侍樂止引禮引賔贊以次詣罍洗樂作搢笏盥手樂止通贊典儀二人露臺東西向冠席在東序南西向醴席在西南向行禮之時諸執事官升自東階稍西向掌冠者執網巾升賔降一等受之進王席前稍北面立祝曰惟茲吉日冠以成人克敦孝友福祿來臻畢供奉官束髮掌冠跪進網巾樂作贊冠者跪正之興立掌冠後內侍跪進服訖樂止掌冠啓王復坐執翼善冠升賔降二等受之右手執冠後左手執冠前進如前儀祝曰冠禮斯舉實由成德敬慎威儀惟民之則畢跪進冠興樂作掌冠啓復坐贊冠進跪脫翼善冠興內使跪脫袍服執衮冕者升賔降三等受之進如前儀祝曰冠至三加命服用章敬神事上永固藩邦跪進服興樂作贊冠跪簮結紘興立掌冠後王興內侍跪進衮服訖樂止禮部官引王降自東階樂作由西階升醴席南向坐樂止引禮引掌冠詣罍洗樂作搢笏盥手訖升西階樂止贊冠者取爵詣司尊所酌醴授賔賔跪進席前北面祝曰旨酒嘉薦載芬載芳受茲景福百世其昌畢王搢圭受爵樂奏喜千春之曲飲訖奠爵出圭進饌饌訖引王降自西階詣東序易服訖樂止請王詣拜位樂作引禮引宣敕戒官至中庭西向立稱有制王跪樂止宣敕戒曰孝於君親友於兄弟親賢愛民率由禮義毋溢毋驕永保富貴樂作俯伏興四拜興樂止禮部官啓禮畢引王還樂止掌冠等官復命王是日謁廟畢就詣父皇及東宫前謝次日百官稱賀畢詣王府行叩頭禮成化二十三年續定習儀前期各執事官於奉天門前東廡習儀三日陳設前期鴻臚寺設王冠所於奉天門前東廡左順門之北設節案香案各一於廡內之北正中設冠席於東階之上西向設醴席於西階之上東向光祿寺設司尊所一於東階之下稍南設盥洗所一於司尊所之南內侍設帷幄於香案之東冠席之後稍北俱西向帷中設坐椅几案各一别設案於東階之南司尊所之北具翼善冠皮辨九旒冕皆以盤盛紅袱覆之置於案具袍服皮辨服衮服圭帶舄等物皆以箱盛置於幄中案上教坊司設樂於南遣官是日早皇上預告奉先殿畢具皮辨服御華蓋殿鴻臚寺奏請升殿傳制遣官持節行禮文武百官各具朝服侍班如常儀迎節至期內侍導王先於帷幄中坐候持節將至禮部官啓王迎節樂作禮部同鴻臚寺卿導王王出階下節至持節官捧節入置於北正中案上樂止王隨節入持節官立於節案之東賔及宣敕戒宣祝等官序立於東南盥洗所之次禮部官鴻臚寺卿導王詣香案前立樂作行四拜禮畢樂止就冠席禮部官啓王就冠席樂作禮部官同鴻臚寺卿導王詣冠席坐樂止內侍二人立於王左右初加鴻臚寺鳴讚贊行初加冠禮樂作引禮序班引賔詣盥洗所搢笏盥手訖樂止鳴讚二員稍南北向立賔升自東階稍西向樂作內侍揭蓋袱以盤捧翼善冠升賔降一等受之樂止賔右手執冠後左手執冠前詣王席前稍東面立贊宣祝宣祝官祝曰祝辭與諸司職掌同祝訖樂作賔跪進冠訖興復位樂止禮部官啓易服王入帷幄易新袍服出禮部官啓復坐再加鳴讚贊行再加冠禮樂作內侍揭蓋袱以盤捧皮辨升賔降二等受之樂止賔以右手執辨後左手執辨前如前儀贊宣祝宣祝官祝曰祝辭與諸司職掌同祝訖樂作內侍釋翼善冠賔跪進皮辨訖興復位樂止禮部官啓易服王入帷幄易皮辨服舄出禮部官啓復坐三加鳴讚贊行三加冠禮樂作內侍揭蓋袱以盤捧冕旒升賔降三等受之樂止進如前儀贊宣祝宣祝官祝曰祝辭與諸司職掌同祝訖樂作內侍釋皮辨賔跪進冕旒訖興復位樂止禮部官啓易服王入帷幄易衮服出禮部官啓復坐釂禮鳴讚贊行釂禮禮部官啓王詣釂席樂作禮部官同鴻臚寺卿引王降自東階由西階升醴席東向坐樂止光祿寺舉醴卓置於前樂作引禮序班引賔詣盥洗所搢笏盥手訖取爵詣司尊所酌醴由西階升詣席前立樂止贊宣祝宣祝官祝曰祝辭與諸司職掌同祝訖賔跪進爵鳴讚贊王搢圭受爵置於案教坊司啓樂奏喜千春之曲次啓進酒王舉爵飲訖奠爵於案賔興樂止光祿寺官進饌大樂作饌至案樂止饌訖贊出圭徹卓賔復位受敕戒鳴讚贊受敕戒禮部官啓王詣受敕戒位禮部同鴻臚臚寺卿引王降自西階由東階詣拜位立樂作引禮序班引宣敕戒官至庭中西向立樂止稱有制鳴讚贊王跪宣敕戒曰戒辭與諸司職掌同樂作王俯伏興四拜興樂止鴻臚寺卿啓禮畢持節官捧節出王送節出門外節行至階下內侍引王還帷中釋衮冕具翼善冠服回宫持節及賔贊宣敕戒等官復命謁見是日王具冕服謁祭奉先殿用樂行禮如常儀仍具冕服謁見皇太后畢謁見皇上皇后俱行五拜三叩頭禮次謁皇妃東宫及妃各行四拜禮皆用樂稱賀次日早上位常服升金臺百官常服稱賀致詞云皇子冠禮已成禮當稱賀行五拜三叩頭禮畢是日朝罷司禮監請皇子具常服詣奉天門前東廡坐百官常服行四拜禮明會典卷六十二
