body:
  text: 明會典卷二十五户部十漕運國朝自永樂遷都於北軍國之需皆仰給東南漕運之法日益詳備今特具列於後事例運糧衛所南京三十四衛錦衣衛府軍左衛府軍右衛府軍衛虎賁左衛鷹揚衛廣洋衛羽林左衛留守中衛神策衛府軍後衛武德衛水軍左衛留守左衛龍虎左衛羽林右衛龍虎衛應天衛留守右衛橫海衛龍江右衛水軍右衛驍騎右衛虎賁右衛瀋陽右衛金吾前衛金吾後衛旗手衛豹韜衛豹韜左衛龍江左衛江隂衛鎮南衛興武衛直𨽻三十三衛所廬州衛六安衛安慶衛淮安衛大河衛新安衛邳州衛九江衛蘇州衛鎮海衛太倉衛嘉興中左千户所宿州衛武平衛夀州衛泗州衛河南潁川衛潁上守禦千户所歸德衛揚州衛通州守禦千户所髙郵衛鹽城守禦千户所泰州守禦千户所儀真衛興化守禦千户所金山松江守禦千户所鎮江衛建陽衛徐州衛徐州衛滁州衛宣州衛中都留守司八衛所留守左衛留守中衛鳳陽衛鳳陽右衛鳳陽中衛懷逺衛長淮衛洪塘湖屯田千户所浙江都司一十三衛所杭州前衛杭州右衛溫州衛寧波衛紹興衛台州衛處州衛海寧衛海寧守禦千户所湖州守禦千户所嚴州守禦千户所衢州守禦千户所金華守禦千户所山東都司九衛所德州衛德州左衛東昌衛濟寧衛平山衛兖州護衛濮州守禦千户所東平中守禦千户臨清衛湖廣都司一十二衛所武昌衛武昌左衛蘄州衛黃州衛荆州衛荆州左衛荆州右衛沔陽衛嶽州衛襄陽衛安陸衛德安守禦千户所江西都司一十二衛所南昌前衛南昌左衛袁州衛贑州衛吉安守禦千户所安福守禦千户所永新守禦千户所撫州守禦千户所建昌守禦千户所􅖳山守禦千户所廣信守禦千户所饒州守禦千户所永樂元年令於淮安用船可載三百石以上者運糧入淮河沙河至陳州潁岐口跌坡下用淺船可載二百石以上者運至跌坡上别以大船載入黃河至八栁樹等處令河南車夫運赴衛河轉輸北京二年命總兵官一員副總兵官一貟統領官軍海運又以海運糧到直沽用三板划船裝運至通州等處交卸水路閣淺遲誤海船回還令於小直沽起蓋蘆囤二百八座約收糧一十萬四千石河西務起蓋倉囤一百六十間約收糧一十四萬五千石轉運北京三年令總督糧儲官於天津衛城北造露囤一千四百所五年令山東布政司量起車夫將濟南府并濟寧州倉糧運送德州倉候衛河船接運六年令海運船運糧八十萬石於京師其會通河衛河以淺河船相兼轉運八年令湖廣江西浙江三處倉糧除本處支用其餘糧本部差官督各該司府起運十二年令湖廣造淺船二千隻歲於淮安倉支糧運赴北京其太倉舊納糧悉改納淮安倉收貯又令北京山東山西河南中都直𨽻徐州等衛俱選官軍運糧各都指揮一員統領十三年罷海運糧令浙江嘉湖杭與直𨽻蘇松常鎮等府秋糧除存留并起運南京及供給內府等項之數其餘并坐太倉海運之數盡改撥運赴淮安倉揚州鳳陽淮安三府秋糧內每歲定撥六十萬石徐州并山東兖州府秋糧內每歲定撥三十萬石俱運赴濟寧倉令淺河船於會通河以三千隻支淮安糧運至濟寧以二千隻支濟寧糧運赴通州倉每歲通運四次其天津并通州等衛各撥官軍於通州接運至北京又令浙江都司并直𨽻衛分官軍於淮安運糧至徐州置倉收囤京衛官軍於徐州運糧至德州置倉收囤山東河南都司官軍於德州運糧至通州交收淮安當盈倉徐州倉本部各委主事一貟監督收放其儧運糧每石俱兩平斛斗收於官軍儧運止一尖一平定為例又令各衛所運糧官軍行糧每貟名不分逺近俱支三石十六年令浙江湖廣江西布政司并直𨽻蘇松常鎮等府所屬稅糧除存留及起運南京外餘糧坐撥二百五十萬石令糧里人户自􅊀船隻運赴北京通州河西等處上倉又令沿河閘壩每三處差御史一員儧運十七年令侍郎副都御史并武職大臣各一員催督浙江等布政司直𨽻蘇松等府起運糧儲仍令各部差郎中員外郎等官分投整理二十一年奏準每歲漕運以兩運赴京倉一運赴通州倉交收洪熙元年令官軍運糧船內許附載物貨資給盤剝折耗之費宣德二年令運糧軍船工部及諸衙門不許撥載他物致誤運又令浙江江西湖廣并直𨽻蘇松等府起運淮安徐州倉糧撥民自運赴通州倉其運糧軍士於淮安南京倉支運本年差侍郎五貟都御史一貟催督浙江等布政司南直𨽻蘇松等府民運糧及淮安等倉官軍支運糧三年奏準各都司衛所不差原選委官及軍闕不補者正官并首領官俱罰俸半年又令各都司衛所選委指揮等官專一提督運糧不許别項差操軍士闕即為撥補四年仍令江西湖廣浙江民運糧一百五十萬石貯淮安倉蘇松寧國池州廬州安慶廣德民運糧二百七十四萬石貯徐州倉應天鎮江常州太平淮安揚州鳳陽及滁和二州民運糧二百二十萬石貯臨清倉令官軍支運山東河南北直𨽻府州縣糧徑赴北京其儧運軍船量地逺近與糧多寡如淮安上糧民船十抽其一徐州十三抽一臨清十五抽一給與官軍兼舊船運載本年差侍郎都御史少卿郎中貟外郎等官催督各司府儧運糧儲五年奏準運糧官軍船南京中都留守及直𨽻衛所於淮安修理山東等都司於臨清修理湖廣江西浙江都司皆回原衛修理有司給與材料又令河南南陽懷慶汝寧三府糧運於臨清倉開封彰德衛輝三府糧運於德州倉交收又令巡按御史布按二司及原漕運都指揮選軍菅運官員軍多衛分指揮二員少者一貟又令江南民糧兊撥附近衛所官軍運載至京量其逺近給與路費耗米六年奏準浙江江西湖廣蘇松常鎮太平等府僉撥民丁及軍多衛所添撥軍士與見運軍士通二十四萬分兩班更替儧運本年差給事中御史於南京各衛會同該府堂上在外會同各都司按察司堂上官及中都留守司直𨽻衛所點選運糧官軍其管運官貟不能撫恤以致逃故者從總兵官處治所虧糧仍令補還七年令官軍運糧各於附近府州縣水次交兊江南府州縣民運糧於瓜洲淮安二處交兊河南所屬民糧運至大名府小灘兊與遮洋船官軍領運又令增撥南京豹韜左等衛及各都司直𨽻衛所軍餘並見運官軍共一十六萬儧運糧儲八年令兊運民糧加耗湖廣每一石八斗江西浙江七斗南直𨽻六斗江北揚州淮安鳳陽五斗徐州四斗山東河南三斗若民自運至淮安瓜洲等處兊軍者四斗九年令漕運官軍有犯罰運淮安徐州倉糧赴京贖罪流罪五十石徒罪五等自四十石至十五石杖罪每一十一石笞罪每一十五斗又令官軍運糧五百萬石以三分為率通州倉收二分京倉收一分各該兊糧處布政司委堂上官二貟按察司一貟總理十年令各處運糧官軍但有軟弱事故者於見操屯田軍官內兊補其提督運糧都指揮等官許乘糧船一隻量帶官糧又令湖廣江西浙江耗米俱六斗南直𨽻五斗江北直𨽻四斗徐州三斗五升山東河南二斗五升又令各衛所官軍行糧止支二石又令漕運總兵官每年八月赴京議事又又令各處起運京倉大小米麥先封乾圎潔淨樣米送部轉發各倉收候運糧到日比對相同方許收納正統元年奏準兊運糧務二月以裏兊完其加耗江北淮安鳳陽四斗五升浙江蘇松等府民自運至瓜洲兊運者三斗七升淮安者三斗餘如舊又令民運糧至瓜淮就令揚州淮安府衛委官并該倉官攢見數交兊又令浙江湖廣江西山東河南中都留守并南直𨽻衛所官軍行糧皆於本處官倉支給如倉無見在於存留糧內平斛兊支南京各衛於應天府原定各衛秋糧內兊支舊支二石五斗今增為二石七斗山東河南北直𨽻路近者不增三年令各衛所運糧官有比試違限者俱住俸於淮安倉支糧運米數赴京完納復職又令犯罪罰運者仍運該運之數無力者發極邊衛分五年賞運糧官軍鈔指揮八錠千户衛鎮撫六錠百户所鎮撫五錠旗軍四錠加本處無鈔許賫本部勘合徐州迤南衛分於淮安所屬州縣關支徐州迤北衛分於衛輝府官庫關支六年令各衛兊軍民糧兊完就出通關若路途窵逺衛所於本都司出給通關填給勘合七年令漕運官軍若一衛有數船遭風漂流者委官核實全衛改撥於通州及天津倉上納八年令運糧船損壞撥附近地方産有物料於清江衛河提舉司修造每處工部差官一貟監收督造各衛所仍差撥官軍蓋立厰房相兼匠作用功及貽辦物料九年令各處民糧每歲該起運京師之數先儘本都司衛所兊運其有不盡者布政司坐撥各府縣輪流運送於淮安徐州臨清德州等倉交收十一年差本部主事一貟於各處提督軍民兊糧十三年令各處兊運民糧每二石與新蘆席一領其淮安等處倉支運者每二石領墊倉舊席一領至京通二倉每百領除損壞止納七十領又令兊軍糧料於東安等門并五府六部都察院等衙門及京倉收六分通州倉收四分支軍糧料於淮安徐州臨清德州等倉關支於通州倉收遮洋船運於東店倉收十萬石林南倉收五萬石又奏準各處原坐兊軍京糧或有災傷免徴者許於原坐徐州淮安南京該納糧改撥輳兊又令各處解納在京及通州倉糧每石俱一尖一平斛收兩平斛放支民糧送納臨清淮安倉者每石俱一尖一平斛收兩平斛放支官軍儧運俱一尖一平斛支赴京通二倉交收又令湖廣江西浙江加耗俱六斗五升南直𨽻五斗五升江北揚州淮安鳳陽四斗五升河南民糧於蕭縣水次兊者四斗民自運至瓜淮等處兊軍運者三斗其兊運料豆加耗亦準此例十四年令蘇州府委官督糧里及殷實大户人等自運京儲旗軍退回屯守景泰元年令都御史一貟總督漕運又令蘇松常鎮等府民糧自運至瓜州兊軍者加耗四斗五升淮安兊軍者四斗五年令河南山東布按二司管糧官催督兊運軍糧青州濟南二府運送德州倉兖州東昌二府及河南布政司所屬運送臨清倉每石加耗四斗七年令揚州迤南衛所運糧官軍每貟名支行糧三石淮安迤北衛州每貟名二石天順元年令各處監兊民糧司府州官每歲承委後先行本部知會徑赴總督漕運官處比較四年令運糧官軍雜犯死罪者比流罪加納米三十石共八十石於淮安徐州倉支運六年江南糧運有未到通州者令戶部侍郎一貟催儧就于天津德州附近倉分收貯仍量留耗米以待下年帶運七年令運糧官軍犯罪者照例納米收贖罷淮徐支運糧例八年令官軍運糧或遇風水不測損壞船糧若在百里內者務要府州縣正官在百里外者許所在有印信官司勘實結申總兵等官處如有詐妄罪坐原勘官糧米仍依原定分數交納成化元年奏準各處運糧旗軍附帶土産物貨河西務張家灣等處免其稅課三年令浙江江西湖廣南直𨽻衛所并南京各衛俱於本處支行糧三石江北鳳陽等八衛所並直𨽻廬州安慶六安滁州泗州壽州儀真揚州八衛俱於淮安倉支米麥二石八斗髙郵淮安大河邳州徐州滁州左六衛俱於徐州倉支米麥二石六斗遮洋船並南京水軍左等八衛於南京各衛倉大河等五衛於淮安常盈倉山東於臨清倉俱支米二石四斗德州天津等九衛於德州倉支米二石六斗令蘇松等府民自運糧仍舊軍運七年令運糧都指揮並把總指揮軍伴於相應軍餘內撥二十名就令駕船俱照運糧軍餘一體關支行糧賞鈔八年令運糧至京倉北直𨽻並河南山東衛所限五月初一日南直𨽻並鳳陽等衛所限七月初一日若過江支兌者限八月初一日浙江江西湖廣都司衛所限九月初一日其把總都指揮及領運千百户等官違限二十日以上住俸戴罪儧運若連三年違限者遞降一級二年不違限者量加奬異三年不違限者量加旌擢俱奏請定奪九年奏準運糧官軍盤剝費用正糧不敷總督等官出給印信文憑付把總官於太倉折草等項銀內借與完納下年照數送還十年令湖廣江西浙江加耗每石四斗應天並江南直𨽻各府一斗五升徐州二斗山東河南一斗五升十六年令各處運糧通加耗一斗各把總官變賣時價解送清江衛河提舉司給與官軍造船其有司木料並抽分木植價銀停止又令河南民糧歲用遮洋船於元城縣小灘水次領兊又令蘇松常鎮四府歲運兊軍糧仍舊交兊於瓜淮水次其瓜洲南京戶部差官一貟督兊淮安委本部常盈倉收糧官督兊又令遮洋船運糧薊州者如遇風水漂流照淺河船例改撥補數十七年南京運糧官軍行糧令江西蘇松等處該納南京倉糧就同兊運帶去瓜洲淮安扣支每米一石增水腳價一斗五升二十年以河道淺阻糧運遲滯令所運糧已到者悉免晒揚每石加收耗米四升未到者令在京各衛所官軍人等於通州張家灣等處地方臨船預支三箇月每石加腳價米三升河西務七升其所兊糧每石兊運該收耗米五升並免晒米四升俱作正數放支如無本色者每斗折銀五分送本色庫其兊之未盡者俱於通州倉上納二十一年令每年本部差官一貟於山東河南南京差官四貟於浙江江西湖廣南直𨽻地方督同各司府州縣正官並分巡分守管糧官將原會兊軍糧米徵完俱限十二月以裏運赴原定水次倉交兊不完者各管糧官住俸次年正月終不完者革去冠帶經該官吏並管糧委官拏問若民糧已到領兊官軍未遲或刁蹬者領運官參問又令運糧把總等官每年糧完清查欠債旗軍開報巡倉御史及本部監督委官處不分逺近年分止依律加息三分償還其各衛所官借銀千兩以上者革去冠帶五千兩者住俸萬兩者降一級不許管軍管事若運糧俱完不欠債至六年之上者許總兵等官具奏把總都指揮及衛所千百户等官俱量升一級又令運糧官貟老疾不勝任者赴漕運衙門告驗聽把總官坐名報取代補若無相應官許於軍政佐二內取補規避運糧官貟仍發上運旗軍不上運或逃避者究問仍發運糧又令各府州縣兊運軍糧如十二月及次年正月不完者管兊官照例革去冠帶住俸至五月不完者經該官吏及管糧官從重參究若管運軍官至正月終不到水次領兊者一體住俸候交兊完日問罪二十三年令改造遮洋運船為淺船從新河儧運其該運糧并人夫亦照淺船例均𣲖每船旗軍十名𢎞治二年議準每嵗本部郎中貟外郎主事內推選一貟領勑催儧糧船禁革姦弊又奏準漕運糧遭風漂流者勘實具奏將兊運京倉減除通州倉上納如漂流十石減除一百石每石省腳價米一斗正糧照例加耗所省米兩平收受以補漂流之數又令官軍上納京通二倉兊運者加耗七升改兊加耗四升支運並遮洋船仍舊一尖一平斛收受三年耴回各處監兊主事等官止令各該管糧官監兊五年令運糧官軍借債但係三年以前者盡為革罷近年者止照律出息若放債之家倚勢逼放及擅執官軍考掠糶賣官糧準折者軍發邊衛充軍民發口外為民果有窮困衛所闕少腳價者許於太倉量借銀兩完納候下年照數送還七年令兩京戶部仍差主事等官於湖廣江西浙江山東河南及南直𨽻各府催督兼監兊民糧八年奏淮各處兊運糧每嵗布按二司及直𨽻府州縣管糧官督屬徴收年終運赴水次候正月交兊如有不完提巡撫等官依例究治初違限一年二年者附過還職連違三年者以罷軟起送吏部其各該分巡分守管糧官員以十年為率五分不完者亦照此例把總及運糧官亦依限前去水次領兊如違管運官照府州縣例把總官照分巡分守例一體查處連違限三年聽漕運衙門黜退不許管軍管事十二年奏準自天津該運京通二倉糧儲腳價不敷許令太倉銀庫借用如把總等官縱容旗軍花費及私下還債以監守自盜論立功滿日帶俸差操債主以盜官物論罪勢豪官貟奏請發落家人伴當發廣西煙瘴衛分充軍又奏準運糧都司衛所把總官所管運船俱以十分為率若有一半以上違限寄放德州等處不行到倉者令漕運都御史提問降一級納米完日照舊管運一半以上者參奏提問又令本部會同兵部及漕運都御史等官考察運糧各衛所指揮千百戶廉幹有為者存留管事貪婪無為者革退另選相應官代補又勑本部侍郎一員會漕運總督等官令本部原委郎中並收糧主事分投催儧糧船如遇親王黃船二隻經過一時回避外其餘王府各船務令兩岸分行扯牽不許混擠以阻糧運十三年奏準官軍漕運將正耗糧米照數交兊不許折收輕賫及中途糶賣違者軍餘欠十石小旗欠五十石總旗欠一百石以上者俱問發邊衛哨瞭百戶欠三百石千户欠五百石指揮欠一千石把總都指揮等官欠三千石以上俱問發原衛帶俸差操若總欠數多總督漕運總兵等官另行奏請定奪原賣官銀責付領運交納所得價銀入官又定各處兊運衙門解送樣米山東直𨽻限三月以內江北直𨽻鳳陽等處限五月以內南京並江南等處限六月以內浙江湖廣江西限七月以內到部如有故違遲悮先將差來人役送問承行並管糧官吏行各該巡按御史一體究治又令運糧衛所各置文薄一扇凡兊過糧數並腳米多寡一應盤費使用及侵欺債負等項逐一附寫事完之日送漕運衙門查究邊糧事例洪武二年令户部於蘇州府太倉儲糧三十萬石以備海運供給遼東四年令青州府官軍運山東糧儲給遼東定遼邊衛蘭州涼州河州岷州洮州寧夏莊浪西寧臨洮甘肅山丹永昌等衛軍糧每歲令西安等府送納大路官軍轉運邊衛二十四年令蘭州岷州臨洮寧夏四衛官軍以平涼鞏昌等府民納米麥對撥供給其洮州涼州河州西寧莊浪甘肅山丹永昌八衛以各府見在倉糧陸續儧運供給二十五年令海運蘇州太倉糧米六十萬石供給遼東官軍下年同二十九年以陜西各府州縣民轉運邊餉道逺令于驛道有軍民處置倉各就近地計程接遞三十年令法司將徒流遷徙死罪囚人先自平涼起擺到西涼將運去糧米就西涼收貯候擺到甘肅完訖却從西涼起擺至平涼接遞每囚二名共買車一輛牛二隻運米四石後每車一輛再貼囚人兩名共當永樂十年令陜西鞏昌臨洮等府稅糧以附近府縣民運納蘭縣抵甘州每五十里設一站令囚人及官軍轉運十三年發山東山西河南及鳳陽淮安徐邳等處民丁十五萬運糧赴宣府各給行糧腳價仍免差役一年十七年以口外糧料數少令於京倉支撥選取營造次撥旗軍儧運其擺堡運糧及坐堡管堡官除軍職外仍於吏部聽選方靣府州縣官內選取一百貟差用以文職大臣把總管運十九年以宣府等處闕糧令法司囚人運糧贖罪雜犯死罪十石流罪八石徒罪六石杖罪四石笞罪二石二十年令各府州縣民運邊糧者各免差役一年宣德三年令行在戶部差官以九月終發永平府屬縣民及東勝諸衛軍兼運林南東店倉糧於遵化城內供給官軍五年令歲開運平糧四萬石自京師至獨石立十一堡每堡屯軍一千名各具連車以六十日為限其開平􅊀禦官軍輪班於獨石搬運仍令都督一貟領軍防護伯一貟總督六年令五軍操備並彭城永清左右三衛旗軍擺堡儧運糧料一十萬石赴獨石等處差武職一貟把總提督七年奏準法司囚犯送本部通類差官押赴通州各衛倉支糧自備車輛運赴山海衛倉正統元年令陜西各府歲納甘州各衛稅糧民運至蘭縣自蘭縣起發軍夫運至涼州自涼州運至各衛二年令山西嵗運宣府稅糧一半改運大同七年令直𨽻蘇州等府起運南京糧折銀五萬兩運赴陜西布政司轉運甘肅等處糴糧給軍九年令山東等布政司直𨽻大名等府稅糧折布俱運赴永平山海江西等布政司直𨽻蘇常等府州稅糧折銀運山海遼東糴買糧料十二年令每嵗運糧十萬兩於遼東糴買糧料仍令直𨽻永平府永平盧龍等衛罪囚運山海倉糧赴遼東寧逺等倉贖罪又令每歲運銀十五萬兩於宣府糴買糧料景泰三年令五軍等營撥軍七萬運糧七萬石於懷來每人給腳銀三錢四年令法司及直𨽻罪囚於通州倉支豆運赤城直𨽻並萬全都司等處罪囚於隆慶衛倉支米運龍門又令召人自通州倉運米赴獨石每石給腳銀六錢馬營五錢五分六年令法司罪囚領運通州倉糧赴宣府不完者發巡撫官處減半自備米納宣府斬絞罪二十石流並徒三一十六石徒二年半十三石五斗徒二年十一石一年半九石一年六石五斗杖每十四斗雜行諸司職掌凡一應錢糧等事行移各布政司及直𨽻十八府州本部預為編置勘合並底簿二扇一扇本部收貯一扇發下各司府州如有行移將各該事件移付通類科通行於原編底簿內附寫置立前件書填勘合內云洪武某年某月某日書填某字幾號勘合照會某布政使或劄付某府州仰比對朱墨字號相同行下所屬照依坐去勘合內事件施行候事完呈報到部於前件下注寫回銷緣由以憑稽考其內外倉庫司局等衙門官貟任滿須從本部查考任內錢糧等項如是收支明白别無虧欠然後咨發吏部聽用若有虧少及收支不明必須究問至若本部官貟考核及皂𨽻更替公用印色紙劄等事悉皆理之石刻職掌凡沒官房租錢印造茶鹽引由錢法契本勘合通關等事時估除授給由吏役照刷文卷紀録屯種夫役漕運差批通類遲錯勘合等事吏役各庫文簿改革考較編置通類勘合等事斛斗稱尺通類勘合稅糧通關市舶等事並皆掌之事例洪武四年令內外倉庫放令錢糧內則中書外則行省第其字號為符劵然後放出十四年置半印勘合下諸司收掌六部都察院應有行移即便比對勘合朱墨相同火速奉行諸司亦置六部都察院册七扇如勘合至日即便附寫緣由本衙門收貯仍將原文繳回內府其勘合附寫緣由明白滿日差人赴內府奏繳十九革各衙門出納官物勘合令該部行文書下庫用印信手本於各門關防出入二十九年令內外衙門關支物料本部編置勘合送內府收掌其該衙門奏領勘合赴該庫比號相同照數放支又令司禮監編置內官衙門勘合底簿本部編置在外衙門勘合與底簿內將一扇送內府收貯本衙門與該庫各收一扇凡各衙門關領物件自行開數具奏關出勘合填寫物數齎赴本部比號謄録底簿僉押用印仍與該衙齎去該庫比號照數支領本庫將勘合送司禮監收銷或有差錯等項該衙門即便具奏改正用印鈐蓋宣德五年奏準編直勘合付各衙門填寫實徴總數遣該吏親賫赴部查理近者限本本十月逺者十二月到部自後俱循此例其各年開豁之數一體編發勘合令填繳以憑查勘明會典卷二十五
