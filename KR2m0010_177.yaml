body:
  text: 明㑹典卷一百七十七上林苑監永樂五年置上林苑監正五品衙門設左右監正左右監副左右監丞典簿所屬良牧蕃育嘉蔬林衡川衡氷鑑典察左右前後十署每署設典署署丞録事職専苑囿蕃牧種植等事洪熙元年本監止存左監丞典簿餘皆革又以蕃育署帶管良牧川衡兩署嘉蔬署帶管氷鑑林衡兩署其四署與各典察署所管人户俱撥蕃育嘉蔬署暫管宣德十年止存蕃育嘉蔬良牧林衡四署餘皆革蕃育署原管畜養户二千三百五十七分撥畜養草場地一千五百二十頃三十四畝二分二釐計畜養鵝八千四百七十隻雄四千二百一十七隻雌四千二百五十三隻鴨二千六百二十四隻雄八百八十九隻雌一千七百三十五隻雞五千五百四十隻雄七百八十三隻雌四千七百五十七隻嘉蔬署原管栽種户九百分撥栽種蔬菜等地一百一十八頃九十九畝八分四釐八毫良牧署原管牧養户二千四百七十六分撥牧養牲口草場等地二千三百九十九頃一十三畝六分六釐計牧養牛羊猪四千五百六十六隻牛九百二十九隻牯牛九十七隻牸牛八百三十二隻羊二千五百六十九隻綿羊二千三百九十六隻公羊一百四十八隻母羊二千一百四十八隻山羊一百七十三隻公羊一十六隻母羊一百五十七隻猪一千六十八口兒猪六十八口母猪一千口林衡署原管栽種户一千九百八十三分撥栽種果樹花木等地二百三十八頃一十五畝七分一釐遷民住基地一十頃九十五畝自種地五十一頃四十二畝事例凡牧養牲口栽種果蔬等項永樂間用北京效順人充役後於山西平陽澤潞三府州起撥民一千户俱照邊民例給與盤纒口糧連當房家小同來分派使用仍令自備牛具種子於附近荒閒地土內儘力耕種食用喂養牲口凡牧養每二丁養羊一隻每五丁養牛一隻餘各驗丁派養其牲口編號造册挨次進送內府并太常寺光祿寺供應每嵗除原種取用不缺外牛孳生犢一隻羊孳生羔二隻餘皆與民自用羊毛惟種羊依時剪取入官孳生羊毛從民收用凡牧養栽種地東至白河西至西山南至武清北至居庸西南至渾河永樂十四年奉㫖一應人不許於內圍獵有犯禁者每人罰馬九匹鞍九副鷹九連狗九隻銀一百兩鈔一萬貫仍治罪雖親王勳戚犯者亦同凡大興宛平二縣附近果園正統元年令聽本監管屬逺者并外府州縣果木俱令有司自行管屬果品聽其自進凡原撥并續撥栽種蔬菜果木樹花牧牲草場衙門公廨及住基等地𢎞治十四年踏勘過共四千一百三十四頃八十五畝八分八毫見在地三千九百七十頃五十八畝八分三釐㑹勘出侵占失迷地一百六十四頃二十六畝九分七釐八毫四至築立封堆一千六百七箇凡日逐進用菜蔬果品宣德十年奏准以荆府遺下舊房一所東安門外舊行用庫房一所頓放𢎞治五年又奏准以東安門外保大坊官房一所頓放五城兵馬指揮司國初置兵馬指揮使司設都指揮副都指揮知事後改兵馬指揮司為正四品衙門設指揮使副指揮知事各門設兵馬洪武十年改正六品衙門設指揮副指揮職専京城巡捕等事知事革二十三年定設五城兵馬指揮司添設吏目事例凡弓兵每司額設八十名一年更替從在外州縣僉解兵部職方司分撥應役凡各城坐鋪火夫除有例優免外其餘俱要編當敢有投托內府及在外各衙門差人或給免帖擅入各司分付優免聽該司連人呈送巡城御史治罪其勇士等項正身改調京衛充軍干礙內外官員奏請定奪凡京城該管地方街道坍塌溝渠擁塞及皇城周圍坍損工部都水司行委分管填墊疏通凡地方或有盜賊生發即督領弓兵火甲人等擒捕凡官民房舍火起不分地方各司督領弓兵火甲人等俱持器具救火凡巡城御史批發囚犯該司取供送法司擬罪發落凡刑部都察院照勘提人檢尸追贓分委該司承行凡各司地方堆垜發賣食鹽户部行該司官巡察有無文引曽否掣割其有夾帶興販及不由崇文門放入者捕送治罪凡軍民人等在於街市鬭毆及姦淫賭博撒潑搶奪一應不務生理之徒俱許擒拏凡地方軍匠人等舊例令各家俱於門前置粉壁一面開寫本家籍貫人口身役營生并寫不敢窩藏逃軍逃匠囚徒盜賊等項以憑挨究凡每月捉獲囚數各司官於御前奏知送科凡夜巡各司每日輪官二貟赴尚寶司關領銅牌二面凡光祿寺打掃各司每月輪三日撥火夫三百名凡駕詣郊壇及親王出府之國成婚開設舉場修設齊醮發送宫人率領火甲供事凡選妃禮部儀制司行各司選報該管地方良家女子送諸王館備選凡各司官奉㫖不許各衙門擅自拘辱及占用弓兵火甲亦不許內府衙門拘要打卯挨捕逃匠凡各司官貟俸糧俱於兵部帶支南京五城兵馬指揮司職掌巡捕及街道溝渠囚犯等事皆與五城兵馬司同明㑹典卷一百七十七
