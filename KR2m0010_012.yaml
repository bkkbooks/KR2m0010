body:
  text: 明㑹典卷十二吏部十一稽勳清吏司諸司職掌郎中員外主事掌邦國官人之勳級舊制文武勳俱𨽻本司掌行後文勳及公侯伯授勳者歸本部驗封司武勳歸兵部武選司今存諸司職掌舊文於此文勳後仍歸本司凡文職官員一品至五品應合授勳者照依散官定擬奏聞給授正一品左柱國右柱國從一品柱國正二品正治上卿從二品正治卿正三品資治尹從三品資治少尹正四品贊治尹從四品贊治少尹正五品修正庶尹從五品協正庶尹諸司職掌凡武職官員一品至六品應合授勳者照依散官定擬奏聞給授正一品左柱國右柱國從一品柱國正二品上護軍從二品護軍正三品上輕車都尉從三品輕車都尉正四品上騎都尉從四品騎都尉正五品驍騎尉從五品飛騎尉正六品雲騎尉從六品武騎尉凡官職後有增减者既見於文選官制項下今於資格下亦備書之其有升降者依見制為定諸司職掌正一品太師太傅太保已上增宗人府宗人令左右宗正左右宗人從一品少保少傅少保太子太師太子太傅太子太保已上增正二品太子少師太子少傅太子少保已上增六部尚書都察院左右都御史襲封衍聖公真人從二品左右布政使正三品太子賓客後添設六部侍郎左右副都御史通政使大理寺卿太常司卿後為寺詹事府詹事後添設應天府尹順天府尹後添設按察使從三品光祿司卿後為寺太僕寺卿行太僕寺卿後添設鹽運使布政司左右參政宣慰使苑馬寺卿後添設正四品左右僉都御史大理寺少卿左右通政太常司少卿後為寺少詹事後添設太僕寺少卿行太僕寺少卿後添設鴻臚寺卿舊為儀禮司正應天府丞順天府丞後添設宣慰司同知按察司副使苑馬寺少卿後添設各府知府從四品國子監祭酒中都國子監祭酒後革布政司左右參議鹽運司同知宣慰司副使宣撫司宣撫正五品翰林院學士左右春坊大學士尚寶司卿華蓋殿大學士謹身殿大學士後添設武英殿大學士文淵閣大學士東閣大學士文華殿大學士六部郎中應天府治中順天府治中欽天監回回監正回回監正後革左右春坊左右庶子通政司左右參議光祿司少卿後為寺太醫院使大理寺左右寺丞五軍都督府斷事官後革各府同知王府長史司左右長史宗人府經厯上林苑監正後添設按察司僉事宣慰司僉事宣撫司同知從五品五軍都督府經厯左右斷事官後革左右春坊左右諭德六部員外郎尚寶司少卿翰林院侍讀學士侍講學士司經局洗馬鴻臚寺左右少卿舊為儀禮司左右司副各州知州鹽運司副使鹽課提舉司提舉招討司招討宣撫司副使安撫司安撫正六品尚寶司丞六部主事太常司丞後為寺欽天監回回監副回回監副後革太僕寺丞行太僕寺丞後添設京縣知縣太醫院判閣門使後革兵馬司指揮王府審理正翰林院侍讀侍講詹事府丞後添設國子監司業中都國子監司業後革欽天監回回監五官正回回監五官正後革大理寺左右寺正左右春坊左右中允都察院經厯神樂觀提㸃上林苑監左右監副後添設僧録司左右善世道録司左右正一中都留守司經厯斷事各府通判都司經厯斷事長官司長官副招討宣撫司僉事安撫司同知應天府通判順天府通判後添設從六品大理寺左右寺副左右春坊左右贊善左右春坊左右司直郎翰林院修撰鴻臚寺左右寺丞舊為儀禮司左右寺丞光祿司丞後為寺應天府推官順天府推官後添設光祿司各署正後為寺僧録司左右闡教道録司左右演法鹽運司判官布政司經厯理問所理問各州同知鹽課提舉司同提舉安撫司副使長官司副長官正七品五軍都督府都事六科都給事中舊正八品監察御史太常司博士典簿後為寺京縣丞通政司經厯大理寺左右評事兵馬副指揮都察院都事營繕所正翰林院編修行人司正舊正九品按察司經厯五軍斷事官五司稽仁稽義稽禮稽智稽信後俱革王府審理副煎鹽提舉司提舉後革都司都事都司副斷事各府推官各縣知縣中都留守司都事副斷事安撫司僉事蠻夷長官司長官從七品中書舍人六科左右給事中舊從八品給事中舊正九品行人司副舊從九品太僕寺主簿應天府經厯順天府經厯後添設詹事府主簿後添設光祿司典簿各署丞後為寺翰林院檢討太常司各處祠祭等署奉祀後為寺各州判官欽天監回回監五官靈臺郎回回監五官靈臺郎後革鹽運司經厯鹽課提舉司副提舉布政司都事宣慰司經厯理問所副理問蠻夷長官司副長官正八品六科都給事中後升正七品各衛知事通政司知事京縣主簿國子監丞户刑部照磨中都國子監丞後革大通關提舉司提舉後添設寶鈔提舉司提舉龍江提舉司提舉欽天監回回監主簿五官保章正回回監主簿五官保章正後革太常司協律郎後為寺典牧所提領太醫院御醫行人司行人舊未入流僧録司左右講經道録司左右至靈翰林院五經博士煎鹽提舉司同提舉王府典寶正奉祀正良醫正典膳正紀善元符宫崇真宫靈官營繕所副各府經厯各縣丞按察司知事宣慰司都事從八品六科左右給事中後升從七品鹽運司并應天府知事順天府知事後添設欽天監回回監五官挈壺正回回監五官挈壼正後革光祿司録事後為寺各署監事儀禮司正後升為鴻臚寺卿鴻臚寺主簿後添設翰林院典籍神樂觀知觀僧録司左右覺義道録司左右𤣥義王府典膳副奉祠副典寶副良醫副國子監助教典簿博士宣撫司經厯太常司各祠祭等署祀丞後為寺布政司照磨崇真宫副靈官正九品六科給事中後升從七品儀禮司左右司副後升為鴻臚寺少卿左右司丞後升為鴻臚寺丞太常司贊禮郎後為寺各府知事各縣主簿國子監學正行人司正後升正七品户刑部檢校司經局校書鴻臚寺司賓署司儀署署丞後添設典牧所大使各牧監正欽天監回回監五官司厯回回監五官司厯後革龍江寶鈔提舉司副提舉王府長史司典簿典儀正奉祠所典樂㑹同館大使欽天監回回監五官監候回回監五官監候後革茶鹽馬司大使承運庫大使翰林院侍書寶鈔廣運廣積贓罰甲乙丙丁戊字庫大使皮作鞍轡寶源顔料局大使應天府織染局大使順天府織染局大使後添設文思院大使煎鹽提舉司副提舉後革教坊司奉鑾宣撫司安撫司知事營繕所丞從九品司務舊未入流都稅司大使國子監學録典籍司經局正字欽天監五官司晨漏刻博士各牧監副儀禮司鳴贊序班後升為鴻臚寺京府照磨後添設軍儲倉大使茶鹽馬司副使寶鈔廣運廣積贓罰甲乙丙丁戊字庫副使宣課司大使太常司樂後為太常寺司樂典牧所副使府學教授行人司副後升從七品㑹同館副使府倉大使各府稅課司大使軍器局大使布政司庫寶泉雜造織染軍器局大使寶泉局大使後革王府典儀副司牲司大使司牧局大使後添設承運庫副使皮作鞍轡寶源局副使各府織染雜造局大使翰林院待詔觀察使後革文思院副使承天門待詔後革太醫院吏目各州吏目五軍斷事官提控案牘後革巡檢司獄千户所吏目陰陽學正術醫學正科僧綱司都綱道紀司都紀鹽課提舉司吏目太平門稅課司大使崇文門稅課司大使教坊司左右韶舞左右司樂應天府織染局副使順天府織染局副使後添設杭州府城南稅課司大使未入流司務後升從九品阜民司大使副使遞運所大使河泊所官關大使副使各州學正各縣典史教諭閘􅄵官行人司行人後升正八品驛丞羣長國子監掌饌軍儲倉副使牧監録事府倉副使州縣衛倉大使副使稅課司副使稅課分司大使副使醫學典科訓科隂陽學典術訓術翰林院孔目王府引禮舍人僧綱司副都綱道紀司副都紀僧正司僧正道正司道正僧㑹司僧㑹道㑹司道㑹斷事司吏目司牲司副使都稅司副使宣課司副使茶鹽課司大使副使鹽運司衛所州庫大使布政司寶泉軍器織染雜造局副使寶泉局副使後革廣西慶遠裕民司大使副使布政司理問所提控案牘茶鹽批驗所大使副使長史司倉庫大使副使巾帽針工二局大使副使布政司庫副使司竹局大使兵馬指揮司吏目鐵冶所大使各府織染雜造局副使長官司吏目太平門稅課司副使崇文門稅課司副使後添設京衛倉副使河州衛軍民指揮使司稅課司大使工部軍器局副使遼陽稅課司大使揚州府邵伯瓜洲稅課司大使副使後革青州府樂安稅課司大使杭州府城南稅課司副使鹽倉大使副使稅課局大使副使抄紙局大使副使印鈔局大使副使鑄印局大使副使抽分竹木局大使副使生藥庫大使副使惠民局大使副使銀場局大使副使明㑹典卷十二
