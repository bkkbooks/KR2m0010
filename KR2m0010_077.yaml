body:
  text: 明會典卷七十七禮部三十六學校二科舉鄉試事例洪武三年詔開科舉以今年八月為始使中外文臣皆由科舉而選京師及各行省鄉試八月初九日試初場復三日試第二場又三日試第三場直隸府縣貢額百人河南山東山西陜西北平福建浙江湖廣各四十人廣西廣東各二十五人若人才多處或不及者不拘額數初場經義二道四書義一道第二場論一道第三場䇿一道中式者後十日復以騎射書算律五事試之四年詔各行省連試三年自後三年一舉著為定例又令科舉凡詞理平順者皆預選列惟吏胥心術已壞不許應試六年詔科舉暫且停罷别令有司察舉賢才必以德行為本文藝次之十七年頒行科舉成式一凡三年大比直隸府州縣試於應天府外府州縣試於各布政司舉人不拘額數從實充貢八月初九日第一場試四書義三道每道二百字以上經義四道每道三百字以上未能者許各減一道四書義主朱子集注經義易主程朱傳義書主蔡氏傳及古注疏詩主朱子集傳春秋主左氏公羊穀梁胡氏張洽傳禮記主古注疏後四書五經主大全十二日第二場試論一道三百字以上判語五條詔誥表內科一道十五日第三場試經史時務䇿五道未能者許減二道俱三百字以上一應試國子學生府州縣學生員之學成者儒士之未仕者官之未入流而無錢糧等項粘帶者皆由有司保舉性資敦厚文行可稱者各具年甲籍貫三代本經縣州申府府申布政司鄉試其學官及罷間官吏倡優之家隸卒之徒與居父母之喪者並不許應試一考試官皆訪明經公正之士於儒官儒士內選用官出幣帛先期敦聘主文考試二員文幣各二表裏同考試官四員文幣各一表裏在內應天府請在外各布政司請提調官在內應天府官一員在外布政司官一員監試官在內監察御史二員在外按察司官二員供給官在內應天府官一員在外府官一員收掌試卷官一員彌封官一員謄録官一員書寫於府州縣生員人吏內選用對讀官四員受卷官二員已上皆選居官清慎者充之巡綽監門搜檢懷挾官四員在內從都督府委官在外從守禦官委官一舉人試卷及筆墨硯自備每場草卷正卷各紙十二幅首書姓名年甲籍貫三代本經會試殿試同前期在內赴應天府在外赴布政司印卷置簿附寫於縫上用印鈐記仍將印卷官姓名置長條印記用於卷尾各還舉人一試前二日圖畫東西行席舍間數編排開寫某行間係某處舉人某人坐又於間內貼其姓名出榜曉示一試之日黎明舉人入場每人用軍一人看守禁講問代冒黃昏納卷未畢者給燭三枝燭盡文不成者扶出一文字回避御名廟諱及不許自敘辛苦門地謄録官檢點得出送提調監試官閲過不録一考試官及簾內簾外官許各將不識字從人一名不許縱令出入一試官入院之後提調官監試官封鑰內外門户不許私自出入如送試卷或供給物料提調監試官眼同開門點檢送入即便封鑰一舉人作文畢送受卷官收受類送彌封官撰字號封記送謄録所謄録畢送對讀官對讀畢送內院看試提調監試官不得干預一搜檢懷挾官凡遇每場舉人入院一一搜檢除印過試卷及筆墨硯外不得將片紙隻字搜檢得出即記姓名扶出仍行本貫不許再試一巡綽官凡遇舉人入院並須禁約喧鬨如已入席舍常川巡綽不得私相談論及覺察簾內外不得漏泄事務一受卷所置立文簿凡遇舉人投卷就於簿上附名交納以憑稽數毋致遺失一彌封所先將試卷密封舉人姓名用印關防仍置簿編次三合成字號照樣於試卷上附書毋致漏泄一謄録所務依舉人原卷字數語句謄録相同於上附書某人謄録無差毋致脫漏添換一對讀所一人讀紅卷一人讀墨卷須一字一句用心對同於後附書某人對讀無差毋致脫漏一舉人試卷用墨筆謄録對讀受卷皆用紅筆考試官用青筆其用墨處不許用紅用紅處不許用墨毋許混同一在京及各布政司搭蓋試院房舍并供用筆墨心紅紙劄飲食之類皆於官錢支給咨報户部一凡試官不得將弟男子姪親屬入試徇私取中違者許指實陳告二十四年定文字格式一凡出題或經或史所問須要含蓄不顯使答者自詳問意以觀才識一凡對䇿須參詳題意明白對答如問錢糧即言錢糧如問水利即言水利孰得孰失務在典實不許敷衍繁文遇當寫題處亦止曰云云不必重述一凡作四書經義破承之下便入大講不許重寫官題又令科舉嵗貢於大誥內出題或䇿論判語參試之永樂三年令北直隸府州縣於順天府鄉試十五年北京行部及應天府鄉試考試官命翰林院春坊官主考賜宴於本部及本府洪熙元年定取士額數南京國子監并南直隸共八十名北京國子監并北直隸共五十名江西五十名浙江福建各四十五名湖廣廣東各四十名河南四川各三十五名陜西山西山東各三十名廣西二十名雲南交址各十名貴州願試者就試湖廣宣德二年令貴州就試雲南四年令雲南鄉試增五名七年令順天府鄉試額取八十名正統二年令開科不拘額數五年復定取士額順天府仍八十名應天府百名浙江福建皆六十名江西六十五名河南廣東皆五十名湖廣五十五名山東四川皆四十五名陜西山西皆四十名廣西三十名雲南二十名六年令順天府鄉試增二十名又令考官必求文學老成行止端莊者不許將六十嵗以上及致仕養病與署事舉人并年少新進學力未至者舉用其出題不許摘裂牽綴及問非所當問取文務須淳實典雅不許浮華違者從風憲官糾劾治罪九年奏準各處應試生儒人等從提學官考送在京各衙門吏典承差人等聽本衙門保勘禮部嚴考通經無犯者送試仍行原籍勘實不許扶同詐冒景泰元年令開科不拘額數又令在京在外鄉試同考試官五經許用五員專經考試又令應試儒士册內原有名籍及各衛官舍軍餘曽送入學者許入試其查無名籍儒士及贅壻義男并文武官舍軍校匠餘悉不許於外郡入試三年令凡科舉布按二司會同巡按御史公同推保見任教官年五十以下三十以上平日精通文學持身廉謹者聘充考官四年復定取士額南北直隸各增二十五名浙江江西福建河南湖廣山東各增三十名廣東四川陜西山西廣西各增二十五名雲南增十名天順二年令兩京天文生陰陽人及官生子弟許就在京鄉試三年令兩京鄉試易書詩三經各添考官一員八年奏準依親監生從提學官考就本處鄉試成化二年定在京科場事宜一考試等官俱於當月初七日入院舉人試日四更搜入各就席舍坐待黎明散題至黃昏謄正未畢者給燭不完者扶出一舉人不許懷挾并越舍互録及凂託軍匠人等夾帶文字其軍匠人等亦不許替帶及縱容懷挾互録文字違者各治以罪一巡綽搜檢看守官軍止於在營差撥曽差者不許再差若他人冒頂正軍入場者罪之一提調監試官公同往來巡視不許私自入號其巡綽官止於號門外看察不許入內與舉人交接違者聽提調監試官舉問一試場外照例五城兵馬率領火夫弓兵嚴加防守不得違悮一每場謄録紅卷送入內簾考試候三場考試紅卷已定方許吊取墨卷於公堂比對字號毋致踈漏一謄録對讀等官取吏部聽選官年四十上下五品至七品有行止者充之一謄録對讀所須真正謄録明白對讀若謄録字樣差失潦草及對讀不出者罪之三年令雲南鄉試復增十名六年令監臨等官不許侵奪考官職掌若場中有弊照例舉問十年定在京科場事宜一監試官都察院十日以前選差公正御史公同提調官於至公堂編次號圖提點席舍審察執役人等禁約希求考試聲譽一每場進題考試官先行密封不許進題官與聞以致露泄一生員作文全場減場者監試官各用全減關防印記至黃昏全場謄正未畢者給燭不及數者扶出一受卷供給巡綽等官入院監試官搜檢鋪陳衣箱等物不許夾帶文字硃紅墨筆厨役皂隸人等審實正身供事不許久慣之徒私替出入一搜檢巡綽取在外都司輪班京操官軍三場調用把門人等時加更換不許軍人故帶文字裝誣生員勒取財物又令雲南解額復增五名十三年令舉人文字凡遇御名廟諱下一字俱要減寫點畫考試等官不許越數多取出題校文須依經按傳文理純正不許監臨等官干預小録不許開寫掌行科舉文字吏典及謄録對讀生員姓名二十一年令南京監生人等從南京都察院考送應天府鄉試𢎞治四年令各處鄉試簾內事不許簾外干預考官務以禮待不許二司并御史欺凌斥辱文章純駁悉聽去取不得簾外巧立五經官以奪其權如考官不能勝任而取士弗當刋文有差連舉主坐罪又令各處提學官平日巡厯地方將教官考定等第以備科舉聘取若有不堪即從彼處提學官於等第內别舉不許徇私五年奏準吏部聽選監生給假在家者許就本處鄉試醫士醫生在册食糧執役者方許在京應試其在部未考嵗貢或在監告就教職監生及不係在任依親官生并天文生陰陽人例不許習他業者皆不許入試七年奏準雲南貴州鄉試進呈録稱雲貴鄉試録貴州量助錢糧以備雲南供給雲貴解額共增五名又定科舉條件一考官不許聽囑濫請各將舉主職名咨呈本部一應舉生儒人等不許未熟三場初學之士及外處人冒濫入試亦不許重冒古今顯者姓名有即改正一席舍照依編定字號并所治本經相間入坐毋得攙越錯亂一作文務要純雅通暢不許用浮華險怪艱澀之詞答䇿不不許引用繆誤雜書其陳及時務須斟酌得宜便於實用不許泛為夸大及偏執私見有乖醇厚之風一御名廟諱及親王名諱仍依舊制二名不偏諱不必缺其點畫違者黜落一文字試題上不許加奉試字真正卷務依所出題目次第楷書不許草書及先後錯亂一舉人止憑文字髙下去取不得論其地方中式多寡臨時偏徇進黜以廢公論一小録文字不許提調監試等官代作及將舉人原文改刻其考試等官各開職名不許稱張公李公字樣十年令太醫院各官醫下子孫弟姪本院册內有名者照舊鄉試十三年奏準應試生儒舉人監生但有懷挾文字銀兩并越舍與人換寫文字者俱問發充吏三考滿日為民若係官吏就發為民其官旗軍人夫匠人等受財代替夾帶傳遞及縱容不舉察者旗軍調邊衛食糧差操官罰俸一年夫匠發口外為民若冒頂正軍入場看守屬軍衛者發邊衛屬有司者發附近俱充軍會試事例洪武三年詔凡鄉試中者行省咨中書省判送禮部會試額取舉人百名十七年頒行科舉成式凡鄉試中式舉人出給公據官為應付廩給腳力赴禮部印卷會試就將鄉試文字咨繳本部照驗以鄉試之次年二月初九日十二日十五日為三場舉人不拘額數考試官本部敦請主文考試官二員同考試官八員提調官本部官一員餘同在京鄉試十八年令會試主考官二員并同考官三員臨期具奏於翰林院官請用其餘同考官五員於在外學官請用又令會試下第舉人願回讀書以俟後舉者聽三十年令再試寄監下第舉人中式者次其等第除教授教諭訓導不中者為州吏目永樂七年令會試考官賜宴於本部又令下第舉人再試送國子監進學其優等者仍賜冠帶或加俸給後令發回原學進業洪熙元年奏準會試取士臨期請旨不過百名南卷取十之六北卷取十之四後復以百名為率南北各退五名為中卷正統五年奏準增額為百五十人景泰元年令會試文字合格者通具中數臨期奏請定奪又令會試受卷彌封謄録對讀等官於吏部聽選官取用四年奏準會試考官翰林春坊專其事京官由科第有學行者兼取以充教官不許天順元年令考官不拘員數務在得人八年令教官由舉人署職任滿該升年四十以下願會試者聽成化二年令本部官一員提督供給十七年令會試同考官書詩經各增一員二十二年奏準南北卷復各退二卷為中卷二十三年奏準舉人授教官六年有功迹者許會試𢎞治三年奏準南北卷仍照舊例止各退五名為中卷七年奏準受卷彌封謄録對讀官增十六員謄録等生員照例除在京并通州學外順天府所屬并鄰近學選撥已冠能書生員七百名又令各布政司并應天府量於本處科舉供給餘銀送部以備會試供給雲南兩廣免送十二年令署職教官照成化二十三年例兩科準算六年願會試者聽其任滿該升如遇會試將近不拘年歲亦許會試若給假或揑病久不入選窺伺會試者不準殿試事例凡殿試用三月初一日後或用十五日先期本部奏請讀卷并執事等官其讀卷以內閣官及六部都察院通政司大理寺正官詹事府翰林院堂上官提調以本部尚書侍郎監試以監察御史二員受卷彌封掌卷俱以翰林春坊司經局光祿寺鴻臚寺尚寶司六科及制勑房官巡綽以錦衣金吾等衛官印卷以本部儀制司官供給以光祿寺本部精膳司官至日早上御奉天殿文武百官各具公服行叩頭禮畢侍立如常儀禮部官引諸舉人至丹墀內東西北向立上賜䇿題序班舉䇿案由左階降置中道贊禮諸舉人行五拜三叩頭禮畢分列序立禮部等官分題諸舉人各就試案對䇿畢詣東角門納卷而出受卷官以試卷送彌封官彌封訖送掌卷官轉東閣讀卷官處詳定髙下明日今用殿試後二日讀卷官俱詣御前叩頭跪內閣官以取定第一甲三名試卷進讀讀訖御筆親定三名次第讀卷官俱叩頭賜宴宴畢仍賜鈔退拆第二甲三甲試卷填寫黃榜明日清晨讀卷官俱詣華蓋殿內閣官拆上所定三卷奏第一甲第一名某姓名某貫人第二第三名亦如之制勑房官填榜尚寶司用寶訖內閣官捧出授禮部官是日上具皮辨服錦衣衛陳設儀仗教坊司設中和韶樂大樂于殿上如常儀鴻臚寺設案于殿內稍東置黃榜于上文武百官各具朝服侍班諸舉人先期赴國子監領進士巾服至是服之列班北向執事官於華蓋殿行禮畢鴻臚寺官奏請升殿樂作導駕官前導升座樂止序班舉榜案于殿中贊禮舉人四拜訖傳制官跪奏傳制俯伏興由東門出詣丹陛東立西向執事官舉榜案至丹墀御道中置定稱有制贊禮舉人皆跪傳制曰某年某月某日䇿試天下貢士第一甲賜進士及第第二甲賜進士出身第三甲賜同進士出身復傳第一甲第一名某臚傳序班遞唱訖序班引出班前跪傳第二名第三名如之復傳第二甲某等幾名第三甲某等幾名儀並如前惟不出班贊禮諸舉人俯伏樂作四拜興平身執事官舉榜案由奉天門左門出樂止傘蓋鼓樂迎導諸舉人後從至長安左門外張挂順天府官用傘蓋儀從送狀元歸第是日榜初出文武百官入班鴻臚寺官詣丹陛中道跪致詞云天開文運賢俊登庸禮當慶賀贊五拜三叩頭禮畢而出明日賜狀元及進士宴於本部命大臣一員待宴讀卷執事等官皆預進士并各官皆簮恩榮宴牌花教坊司承應宴畢狀元及進士赴鴻臚寺習儀又明日賜狀元冠帶朝服一襲諸進士寶鈔人五錠後三日狀元率諸進士上表謝恩文武百官仍朝服侍班先期鴻臚寺設表案于奉天殿門之東至日錦衣衛設鹵簿上具皮辨服御華蓋殿執事官行叩頭禮畢鴻臚寺官請升殿樂作導駕官導引如常儀升座樂止鳴鞭文武官行禮侍班如常儀鴻臚寺官引狀元及進士入班贊四拜興平身贊進表鴻臚寺官舉表案于殿中贊宣表宣訖俯伏興徹案狀元及進士又四拜興平身禮畢明日狀元率諸進士謁國子監謁先師孔子廟行釋菜禮禮畢易冠服本部奏請命工部於國子監立石題名明會典卷七十七
