body:
  text: 明會典卷一百四十三刑部十八提調牢獄諸司職掌凡本部見問囚人設置司獄司監禁每月山東部案呈差委主事一員躬親提調一應牢獄各部每夜又各委官各點本部囚數應柙而柙應枷杻而枷杻應鎖鐐而鎖鐐將監門鎖閉牢固封鎖其總提牢官將鎖匙拘收督令司獄輪撥獄卒直更提鈴至天明各提牢官將監門鎖封看訖令司獄於總提牢官處關領鎖匙眼同開鎖照依各部取囚勘合內名數點放出監各該獄卒管押赴部問畢隨即押回監收頃刻不得摘離左右務要內情不得外出外情不得內入使人知幽囚困苦之狀以頓挫其頑心又行提督司獄人等常加潔淨不致刑具顛倒獄囚飯食以時接遞母得作弊刁蹬其有寃抑不伸及淹禁日久不與決者提牢官審察明白呈堂整治明令凡牢獄禁繫囚徒年七十以上十五以下廢疾散收輕重不許混雜枷杻常須洗滌席薦常須鋪置冬設暖匣夏備涼漿無家屬者日給倉米一升冬給絮衣一件夜給燈油病給醫藥並令於本處有司係官錢糧內支放獄司預期申明關給毋致缺誤有官者犯私罪除死罪外徒流鎖收杖以下散禁公罪自流以下皆散收司獄官常切拘鈐獄卒不得苦楚囚人提牢官不測點視違者禁子嚴刑斷罪獄官申達上司究治凡各府司獄專管囚禁如有寃濫許令檢舉申明如本府不準直申憲司各衙門不許差占府州縣牢獄仍委佐二官一員提調其男女罪囚須要各另監禁司獄官常切點視州縣無司獄去處提牢官點視若獄囚患病即申提牢官驗實給藥治療除死罪枷杻外其餘徒流杖罪囚人病重者開疏枷杻令親人入侍笞罪以下保管在外醫治病痊依律斷決如事未完者復收入禁即與歸結事例洪武十五年令獄囚貧不能自給者人給米日一升二十四年革去獄囚口糧永樂元年按月劄委主事一員提調牢獄每日公同本部巡風官點視封監督令司獄人等嚴謹巡守至明查照各司取囚票帖判送司獄司點付皂𨽻押至該司問畢送監正統十四年奏準每囚仍日給米一升及有贓罰破碎衣服應該變賣者分給穿用成化十二年令有司支給官銀買辦藥餌送部療治囚人應用及令各處惠民藥局療治囚人拘役囚人諸司職掌凡本部問擬刑名除真犯死罪的決外其餘笞杖徒流雜犯死罪應合準工者議擬明白審録允當開付河南部本部置立文簿編成字號注寫各囚姓名年籍鄉貫住址并為事緣由工役年限日期分豁滿日充軍踈放終身工役凡遇修砌城垣街道修蓋官員房屋及起築功臣墳塋等項其該衙門移文到部照依工作處所合用笞杖等囚撥付監工人員收領前去工役取訖領狀在卷本部一樣造册二本編寫字號并領去囚人姓名年籍鄉貫住址及為某事工役幾年幾日分豁滿日充軍踈放終身工役監工某人領去某處工作一本進赴內府一本咨發工部收照候各囚工滿監工人員查理役過工程具呈工部計算無欠合準工滿比查原册相同連人咨發本部又於原卷簿內查理相同然後具手本差官齎赴內府底册內前件項下注銷明白合疏放者引赴御橋叩頭畢送應天府給引寧家合充軍者付發陜西部照籍編發明令凡徒役湖廣省所屬江北府州縣發興國鐡爐拘役江南府州縣發黃梅鐡爐拘役江西省所屬江東府州縣發新喻鐡爐拘役江西府州縣發進賢鐡爐拘役浙江省所屬犯徒者發兩淮鹽運司所屬鹽場拘役江淮省所屬犯徒者發兩浙鹽運司所屬鹽場拘役直𨽻府州江北府州縣發兩浙鹽運司所屬鹽場拘役江南府州縣發兩淮鹽運司所屬鹽場拘役事例洪武八年令雜犯死罪者免死工役終身徒流罪照年限工役官吏受贓及雜犯私罪當罷職役者發鳳陽屯種民犯流罪者鳳陽工役一年然後屯種十五年令笞杖罪囚悉送滁州種苜蓿每一十十日十六年令徒流笞杖罪囚代農民力役贖罪役十日準笞二十杖一十徒流各計年準之三十五年徒罪囚人撥充國子監膳夫照年限拘役又令罪囚工役笞罪每等五日杖罪每等十日徒罪準所徒年月加以應杖之數流罪三等俱四年一百日雜犯死罪工役終身永樂二年奏準徒流發充恩軍者於長安左右門造守衛官軍飯食於漢趙二府牧馬不充軍者充國子監膳夫將軍軍伴土工或於北京為民種田遵化炒鐡或自買船遞運或擺站運鹽笞杖罪止鑄錢準工十一年令囚徒運糧無力者發天夀山種樹死罪終身徒流各照年限杖罪每等五百株笞罪每等一百株宣德二年令匠役雜犯死罪鎖鐐終身工役徒流笞杖罪論年限工役正統五年令囚犯無力贖罪者沿海邉衛旗軍舍餘照舊例的決還役隨住陜西民雜犯死罪文職官吏知印承差贓罪滿貫照例發莊浪等衛安遠等遞運所充軍擺站其餘各處軍職旗軍舍餘笞杖的決雜犯死罪五年流罪四年徒罪照徒年限福建浙江山東發本處沿海貴州四川廣西雲南陜西湖廣發本處沿邊廣東發廣西沿邊江西南直𨽻發浙江金山衛沿海北直𨽻河南發宣府俱送總兵官處定撥衛所立功備禦哨瞭滿日發回衛所還職著役民人隂陽人等俱發附近衝要去處擺站十三年令四川各井竈丁犯罪加役雜犯死罪者罰役五年流以下遞減年月俱於本井上工日加煎鹽三斤天順四年令雲南罪囚雜犯死罪并徒流罪無力者解發各場煎銀死罪五年流罪四年徒罪各照年限成化十六年令問發運灰運炭等項罪囚有貧難無力監追半年之上運納不及者許赴所司告送原問衙門但係軍民舍餘及例該革去職役之人俱照例改撥做工擺站其例該復還職役之人有貧難情願做工者亦與改撥𢎞治二年令內外徒罪囚犯不分軍民舍餘無力者俱決訖所犯杖數照徒年限發遣做工炒鐡等項科擬十三年奏定凡天文生有犯竊盜掏摸搶奪等項亦刺字充警并雜犯死罪俱做工不在收贖之例凡內府匠作犯該監守常人盜竊盜掏摸搶奪者俱問罪做工炒鐡等項其餘有犯徒流罪者拘役住支月糧凡太常寺厨役但係訐告詞訟及因人連纍問該笞杖罪名者納鈔畢仍送本寺著役徒罪以上及姦盜詐偽并有誤供祀等項不分輕重俱的決做工改撥光祿寺應役凡樂户雜犯死罪無力做工流罪決杖一百拘役四年徒杖笞罪俱不的決止擬拘役滿日著役若犯竊盜掏摸搶奪等項亦刺字充警凡王府旗軍舍餘人等犯該笞杖者納鈔及杖罪以上無力者在京俱做工在外俱發充儀從囚人罪名一諸司職掌真犯死罪律令十惡變亂成法朦朧奏啓棄毁制書印信漏泄軍情大事強占良家妻女背夫在逃改嫁收父祖妾及伯叔母嫂弟婦失誤軍機殺傷來降人及逼勒逃竄拒捕激變良民失陷城池造妖書妖言盤詰姦細強盜盜制書印信誣執翁姦劫囚白晝搶奪傷人發塜見尸略人略賣人因而傷人奴婢毆罵家長謀故鬪毆等項殺人威逼期親尊長致死妻妾毆夫篤疾姦家長妻女強姦竊盜三犯詐偽誣告故入人死罪已決告謀逆不受理以致攻陷城池罪囚反禁在逃故禁故勘平人致死放火故燒人房屋盜財物者邀取實封公文從軍征討私逃再犯秋糧違限一年之上不足三犯逃軍師巫假降邪神及妄稱彌勒佛會軍人私出外境虜掠傷人死囚之子孫為父母等自殺大誥僧道不務祖風説事過錢冒解罪人逸失濫設吏卒耆民赴京靣奏事務阻當者擅立幹辦等項名色間民同惡官吏下鄉擅差職官魚課擾民經該不解物不對關防勘合關隘騙民居處僣上用市民為吏卒造作買辦不與價慶節和買空引偷軍臣民倚法為姦官吏長解賣囚寰中士夫不為君用鄉民除患阻當耆民赴京雜犯死罪律令盜倉庫錢糧官吏受贓過滿稱訴寃枉借用印信封皮私越冒度關津出外境私將人口軍器出境及下海投匿名文書告人罪毆制使及本管長官折傷遞送逃軍妻小出京城凌虐罪囚致死者大誥官民犯罪買重作輕或盡行買免攬納户安保斷指誹謗事例洪武三十年定決不待時十惡強盜劫囚激變良民失陷城池罪囚反獄在逃告謀逆不受理以致攻陷城池偽造制書寶鈔印信厯日等秋後處決詐偽強姦越皇城者失誤軍機朦朧奏啓朋姦欺罔背夫在逃因而改嫁收父祖妾及伯叔母嫂并弟婦棄毁卷宗説事過錢更名易諱盤詰姦細發塜見尸向宫殿射箭奴婢毆家長妻妾毆夫篤疾者誣執翁姦竊盜三犯拒捕傷人造妖書妖言盜制書印信拒捕姦黨從軍征討私逃再犯守禦軍逃三犯大臣專擅選官強占良家妻女經斷人朦朧充當近侍及宿衛漏泄軍情大事邀取實封公文放火故燒人房屋盜取財物殺傷來降人及逼勒逃竄持杖入宮殿門略人略賣人因而傷人者軍人私出外境虜掠傷人阻當耆民赴京誣告一二十人從車駕而逃百户以上謀故鬪毆等項殺人棄毁制書印信威逼期親尊長致死交結近侍官員故禁故勘平人致死宫殿造作罷不出在京偷盜詐騙犯姦擅入御膳御在所死罪工役充軍在逃白晝搶奪傷人者擅開閉皇城門者故入人死罪已決誣告人死罪已決者工役終身逸夫變亂成法朝見留難私鑄銅錢交結安置居處僣用空引偷軍間民同惡官吏下鄉受財故縱鄉民除惡擅差職官冒解罪人慶節和買關隘騙民濫設吏卒興販畨貨長解賣囚不立文案盜內府財物市民為吏卒經該不解物盜倉庫錢糧僧道不務祖風臣民倚法為姦師巫假降邪神官吏受贓過滿軍官犯死罪不請旨論功上擬妄立幹辦等名造作買辦不與價內府交納餘剩金帛擅將出外私將人口軍器出外境及下海秋糧違限一年之上稱訴寃枉借用印信封皮容留恩軍撥置寫發私越冒度關津出外境者投匿名文書告人罪者毆制使本管長官拆傷者遞送逃軍妻女出京城衝突儀仗并訴事不實姦家長妻女死囚之子孫為祖父母等自殺永樂元年定遷發種田棄毁官文書漏泄事情脫漏户口人户以籍為定收留迷失子女隱蔽差役主保小里長逃避差役欺隱田糧檢踏災傷錢糧盜賣田宅盜種官民田棄毁器物稼穡等男女婚姻僧道娶妻典雇妻女出妻逐壻嫁女居喪嫁娶強占良家妻女良賤為婚姻嫁娶違律主婚媒人鈔法攬納稅糧官物隱匿入官家財鹽法舶舟匿貨違禁取利費用受寄財物把持行市服舍違式私賣戰馬私藏應禁軍器私越冒度關津詐冒給路引關津留難遞送逃軍妻女出京城私出外境及違禁下海宰殺馬牛隱匿孳生官畜産邀取實封盜各衙門官文書盜關防印記盜園陵樹木常人盜倉庫錢糧竊盜恐嚇取財詐欺官司取財發塜盜賊窩主採生折割人造畜蠱殺人同謀共毆人因而致死殺子孫及奴婢圖賴人威逼人致死尊長為人殺私和拒毆追攝人威力制縛人奴婢毆家長罵制使及本管長官奴婢罵家長越訴誣告干名犯義教唆詞訟受贓有事以財請求在官求索借貸人財物家人求索因公擅科斂尅留盜贓詐為制書詐病死傷避事詐傳三品四品衙門官言語教誘人犯法犯姦縱容妻妾犯姦親屬相姦賭博囑託公事放火燒毁人房屋罪人拒捕獄囚脫監及反獄在逃知情藏匿罪人囚應禁而不禁獄囚誣指平人盜決河防侵占官街明會典卷一百四十三
