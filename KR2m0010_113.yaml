  text: 明會典卷一百十三兵部八關津一關津巡檢司提督盤詰之事已見諸司職掌今以合行事例及天下巡司具列於後設置巡檢司諸司職掌凡天下要衝去處設立巡檢司專一盤詰往來姦細及販賣私鹽犯人逃軍逃囚無引面生可疑之人須要常加提督或遇所司呈稟設置巡檢司差人踏勘果係緊關地靣奏聞準設行移工部蓋造衙門吏部銓官禮部鑄印行移有司照例於丁糧相應人戶內僉點弓兵應役事例凡巡檢司不係緊關應裁革者具奏行移吏部削除官制禮部拘銷印信弓兵發回有司當差凡弓兵在京五城兵馬司在外府州縣及巡檢司俱一年更替其湖廣辰州府西關渡口巡檢司沅州晃州巡檢司貴州都勻衛獨山鎮巡檢司四川黃平安撫司重安渡口巡檢司係原撥囚人充當者事故勾丁補役凡軍民人等往來但出百里者即驗文引凡各處巡檢司縱容境內隱藏逃軍一嵗中被人盤獲十名以上者提問如律凡軍民無文引及內官內使來歷不明有藏匿寺觀者必須擒拏送官仍許諸人首告得實者賞縱容者同罪計天下巡檢司順天府宛平縣盧溝橋巡檢司王平口巡檢司齊家莊巡檢司石港口巡檢司固安縣河寧巡檢司昌平縣白洋口巡檢司黃花鎮巡檢司通州張家灣巡檢司北關巡檢司𢎞仁橋巡檢司三河縣泥窪鋪巡檢司武清縣楊村巡檢司小直沽巡檢司河西務巡檢司寶坻縣蘆臺巡檢司漷縣楊村巡檢司霸州苑家口巡檢司薊州豐潤縣馬家窩巡檢司北直𨽻大名府元城縣小灘巡檢司濬縣新鎮巡檢司東明縣杜勝巡檢司滑縣老岸鎮巡檢司內黃縣回隆廟巡檢司開州金堤巡檢司長垣縣大岡巡檢司順德府邢臺縣西王巡檢司廣平府永年縣臨洺鎮巡檢司河間府獻縣單橋巡檢司交河縣泊頭鎮巡檢司景州安陵巡檢司滄州長蘆巡檢司真定府靈夀縣義頭鎮巡檢司平山縣十八盤下口村巡檢司定州行唐縣兩嶺口巡檢司保定府定興縣河陽巡檢司唐縣周家鋪口巡檢司倒馬關巡檢司軍城鎮巡檢司嶽嶺口巡檢司易州五虎嶺巡檢司官座嶺巡檢司竒峰嶺口巡檢司金坡鎮巡檢司淶水縣乾河口巡檢司永平府灤州樂亭縣新橋海口巡檢司隆慶州紅門口巡檢司棒槌峪巡檢司應天府江淮巡檢司秣陵鎮巡檢司江東巡檢司上元縣淳化鎮巡檢司句容縣龍潭巡檢司江浦縣西江口巡檢司髙淳縣廣通鎮巡檢司溧陽縣上興埠巡檢司六合縣瓜埠巡檢司南直𨽻鎮江府丹徒縣丹徒鎮巡檢司安港巡檢司髙資鎮巡檢司薑家觜巡檢司丹陽縣呂城鎮巡檢司包港巡檢司金壇縣湖溪巡檢司常州府武進縣奔牛鎮巡檢司小河巡檢司澡港巡檢司宜興縣張渚巡檢司下邾巡檢司湖巡檢司無錫縣望亭巡檢司髙橋巡檢司江隂縣利港巡檢司范港巡檢司石頭港巡檢司靖江縣馬馱沙新港巡檢司蘇州府長洲縣吳塔巡檢司陳墓巡檢司吳縣角頭巡檢司木瀆巡檢司橫金巡檢司東山巡檢司嘉定縣顧徑巡檢司吳塘巡檢司劉家港巡檢司江灣巡檢司常熟縣甘草巡檢司許浦港巡檢司白茅港巡檢司福山港巡檢司黃泗浦巡檢司崑山縣茜涇巡檢司石浦巡檢司巴城巡檢司唐茜涇港口巡檢司吳江縣震澤巡檢司欄溪巡檢司汾湖巡檢司平望巡檢司因瀆巡檢司長橋巡檢司同里巡檢司簡村巡檢司崇明縣三沙巡檢司西沙巡檢司松江府華亭縣小貞村巡檢司澱山巡檢司金山巡檢司泖橋巡檢司陶宅鎮巡檢司戚木涇巡檢司上海縣三林莊巡檢司吳淞江巡檢司新涇巡檢司南蹌巡檢司黃浦巡檢司徽州府歙縣黃山巡檢司街口巡檢司王子寨巡檢司休寧縣黃竹嶺巡檢司績溪縣濠寨巡檢司祁門縣良禾嶺巡檢司婺源縣太白巡檢司寧國府宣城縣水陽巡檢司黃池鎮巡檢司寧國縣嶽山巡檢司胡樂巡檢司太平縣宏潭巡檢司南陵縣峩嶺巡檢司涇縣茹麻嶺巡檢司太平府繁昌縣三山巡檢司荻港巡檢司當塗縣大信巡檢司采石巡檢司蕪湖縣河口鎮巡檢司池州府貴池縣李陽河巡檢司池口鎮巡檢司銅陵縣大通巡檢司東流縣吉陽鎮巡檢司鴈汊巡檢司香口鎮巡檢司鳳陽府五河縣上店巡檢司潁州沈丘鄉巡檢司太和縣北原和巡檢司亳縣義門巡檢司泗州盱眙縣舊縣巡檢司天長縣城門鄉巡檢司夀州北爐橋巡檢司正陽巡檢司霍丘縣開順鎮巡檢司丁塔店巡檢司髙塘店巡檢司揚州府江都縣歸仁巡檢司瓜州鎮巡檢司邵伯鎮巡檢司萬夀巡檢司上官橋巡檢司泰興縣口岸巡檢司黃橋巡檢司印莊巡檢司儀真縣舊江口巡檢司髙郵州時堡巡檢司張家溝巡檢司寶應縣槐樓巡檢司衡陽鎮巡檢司興化縣安豐巡檢司通州石港巡檢司狼山巡檢司海門縣吳陵巡檢司張港巡檢司泰州寧鄉鎮巡檢司西溪巡檢司海安巡檢司如臯縣掘港巡檢司西場巡檢司石莊巡檢司淮安府山陽縣廟灣巡檢司馬邏鄉巡檢司羊寨鄉巡檢司鹽城縣清溝巡檢司喻口鎮巡檢司清河縣馬頭巡檢司安東縣長樂巡檢司壩上巡檢司海州東海巡檢司惠澤巡檢司髙橋巡檢司贑榆縣臨洪鎮巡檢司荻水鎮巡檢司邳州直河口巡檢司宿遷縣劉馬莊巡檢司廬州府廬江縣冷水關巡檢司合淝縣廬鎮關巡檢司無為州奧龍河鎮巡檢司黃洛河巡檢司土橋河鎮巡檢司泥汊河鎮巡檢司巢縣焦湖巡檢司六安州故埠巡檢司上土市巡檢司和尚灘巡檢司麻埠巡檢司英山縣七引店巡檢司安慶府懷寧縣觀音港巡檢司長楓夾鎮巡檢司望江縣雷港口巡檢司楊灣口巡檢司宿松縣涇江口鎮巡檢司小孤山巡檢司歸林灘鎮巡檢司桐城縣源子港鎮巡檢司馬踏石巡檢司六百丈巡檢司北夾關巡檢司灊山縣天堂寨巡檢司太湖縣小池巡檢司後部巡檢司白沙巡檢司廣德州杭村巡檢司陳陽巡檢司廣安巡檢司建平縣陳村