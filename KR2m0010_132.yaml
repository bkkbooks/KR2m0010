body:
  text: 明㑹典卷一百三十二刑部七伸寃事例洪武元年置登聞鼓於午門外日令監察御史一人監之凡民間詞訟皆須自下而上或府州縣省官及按察司官不為伸理及有寃抑機密重情許擊登聞鼓監察御史隨即引奏其户婚田土鬬毆相爭軍役等項具狀赴通政司并當該衙門告理不許徑自擊鼓守鼓官不許受狀後又移置於長安右門外令六科給事中并錦衣衛官各一員輪流直鼓收狀類進候㫖意一出即差該直校尉領駕帖備批㫖意於上連狀并原告押送各該衙門問理其有軍民人等故自傷殘恐嚇受奏者聼錦衣衛守鼓官校執奏追究教唆主使寫狀之人治罪所奏事情立案不行𢎞治十三年奏准凡文武官吏人等犯該為民等項罪名不分己未結正伸訴寃枉者准行辨理其有妄奏寃枉托拾原問官員勘問涉虛原問為民者發口外為民原問充軍者發極邊衛所充軍凡將本狀同財雇寄與人赴京奏訴者并兜攬受雇受寄之人屬軍衛者俱發邊衛充軍屬有司者俱發口外為民原詞立案不行凡各處軍民詞訟除叛逆機密等項重事許其赴京奏告其有親鄰全家被人殘害及無主人命官吏侵盜係官錢糧并一應干己事情俱要自下而上陳告若有驀越奏告者俱問罪除四川行都司所屬及雲貴兩廣各給引照回若四川其餘地方并南北直隸浙江等處各遞回所司聽理若將不干己事混同開欵奏告者法司參詳止將干己事件開欵施行其不干己者明白開欵立案不行凡犯罪逃走來京奏訴者不分雲貴兩廣并四川行都司所屬及宣慰宣撫等司軍民人等一體問罪遞回聽理凡為事官吏軍民人等赴京奏訴一應事情審係被人奏告曽經巡撫巡按或兩京法司見問未結者仍行原問各該衙門併問歸結若曽被人在巡撫巡按官或兩京法司具告事發却又朦朧赴隔别衙門告理或隱下被人奏告緣由牽扯别事赴京奏行别衙門勘問者查審明白俱將奏告情詞立案不行仍將犯人轉發原問衙門收問歸結若已經巡撫巡按官或兩京法司問結發落人犯赴京奏訴寃枉者方許改調無礙衙門勘問辨理凡在外刁徒身背黃袱頭插黃旗口稱奏訴直入衙門挾制官吏者所在官司就拏送問若係干已事情及有寃枉者照常發落不係干已事情别無寃枉并追䆒主使之人一體問罪屬軍衛者發邊衛充軍屬有司者俱發口外為民凡代人揑寫本狀教唆或扛幫赴京及赴巡撫巡按并按察司官處各奏告叛逆等項機密強盜人命重事不實并全誣十人以上者俱問發邊衛充軍凡驀越赴京及赴巡撫巡按按察司官處各奏告叛逆等項機密重事不實并全誣十人以上屬軍衛者發邊衛充軍屬有司者發口外為民凡法司遇一應稱寃調問及東厰錦衣衛奏送人犯如有寃枉及情可矜疑者即與辨理具奏發落無拘成案若明知寃枉不與辨理者以故入人罪論凡法司遇有重囚稱寃原問官輒難辨理者許該衙門移文㑹同三法司錦衣衛堂上官就於京畿道㑹問辨理果有寃枉及情可矜疑者奏請定奪問擬刑名一國朝問刑之法已見諸司職掌後損益事例不一分類散見各部其無所附著及問擬通例贖罪檢尸打斷相視等項皆附於此諸司職掌凡鼓下并通政司等衙門送原告連狀到部先於原告簿內附寫告人姓名鄉貫住址并將告詞於詞狀簿內全文抄畢連人狀判送該部承行該部先行立案責差皂𨽻將引原告前去召保聼候提人對問取訖保狀附卷照出合問人數具呈本部具手本赴內府刑科給批差人提取及提人到部判送該部歸問先將犯人名數立案責令司獄司監收聽候引問仍差原召保皂𨽻前去拘喚原告與被告通行對問復行案呈本部將原給批文赴內府刑科銷繳其引問一干人證先審原告詞因明白然後放起原告拘喚被告審問如被告不服則審干證人如干證人供與原告同詞却問被告如各執一詞則喚原被告干證人一同對問觀看顔色察聽情詞其詞語抗厲顔色不動者事理必真若轉換支吾則必理虧略見真僞然後用笞决勘如又不服則用杖决勘仔細磨問求其真情若犯重罪贓證明白故意恃頑不招者則用㭄栲問情狀既實取訖招供罪辨判押入卷明立文案開具原發事由問擬招罪照行事理死罪徒流者具寫奏本笞杖罪名止具公文連囚牒發大理寺審候平允回報復行立案除十惡重囚决不待時外餘令司獄司仍前監收聽候依時覆奏處决其餘各付該部發落工役付河南部編軍付陜西部贓罰付湖廣部其有發回寧家者主事㕔出批送應天府經歷司交割給引寧家明祖訓守成之君止守律與大誥並不許用黥刺剕劓之刑臣下敢有奏用此刑者文武羣臣即時劾奏皇親國戚有犯除謀逆不赦外其餘所犯輕者與在京諸親㑹議重者與在外諸王及在京諸親㑹議皆取自上裁其所犯之家止許法司舉奏並不許擅自拏問明令凡各府推官職專理獄通署刑名文字不預餘事凡有解到罪囚必先推詳實情然後圓審各衙門不許差占凡鬬毆詞訟犯人依律保辜若所招罪重者依法監禁罪輕者保管在外其餘原告證佐干連人等毋令隨衙妨廢生理違者究治凡鞫問罪囚必須依法詳情推理毋得非法苦楚煆鍊成獄違者究治凡訴訟之人有司置立口告文簿一扇選設書狀人吏一名如應受理者即便附簿發付書狀隨即施行如不應受理者亦須書寫不受理緣由明白附簿官吏署押以慿稽考凡差使人員不許接受詞狀審理罪囚違者以不應論罪凡告事者告人祖父不得指其子孫為證告人兄不得指其弟為證告人夫不得指其妻為證告人本使不得指其驅奴婢為證違者治罪凡籍沒犯人家産田地內有祖先墳塋者不在抄劄之限凡特㫖臨時處决罪名不著為律令者大小衙門不得引此為例若輒引比律致令罪有輕重者以故出入人罪論凡諸奸邪進讒言佐使殺人者雖遇大赦不在原免凡年老及篤廢殘疾之人除告謀反叛逆及子孫不孝聽自赴官陳告外其餘公事許令同居親屬通知所告事理的實之人代告誣告者罪坐代告之人凡婦人除犯惡逆奸盜殺人入禁其餘雜犯責付有服宗親收領聽候一應婚姻田土家財等事不許出官告狀必須代告若夫亡無子方許出官理對或身受損害無人代告許令告訴事例洪武十五年令吏户禮兵工五部凡有應問罪人不許自理俱付刑部鞫問十八年頒行大誥令一切官吏諸色人等户有一本若犯笞杖徒流罪名每减一等無者每加一等二十八年令法司擬罪許引大誥减等洪熙元年令一應罪犯悉依大明律科斷法司不許深刻妄引榜文及諸條例比擬景泰六年都察院奏准南京各該衙門內外守備等官除所屬軍衛衙門及各營厰不係緊關重事許令受理量情發落及有舊例應該准理者照舊准理外若事情頗重及干礙民間或原無事例者俱不許一概濫受侵奪職掌此外一應詞訟悉令經由南京通政司告送法司施行法司亦不許發應天府問理其提人勘事檢驗尸傷等項俱照兵部奏准事例係軍衛管束者責成軍衛有司管束者責成有司若係外處來京買賣浮住者方許責成兵馬司幹理成化元年令凡問囚犯一依大明律科斷照例運磚做工納米等項發落所有條例並宜革去及不許深文妄加參語濫及無辜其有奉㫖推問者必須經由大理寺審録毋得徑自參奏致有枉人凡天下軍民人等代抱本狀除道路極逺與事情迫切及老弱婦人依律問罪遣回聽理餘皆遞運押解七年令在外官吏軍民人等有犯除謀逆等項重情及奉㫖差官提勘外其餘人命贓私違法等情止行巡按御史并按察司官勘問當解京者提解赴京若御史按察司官有犯另行無礙衙門勘理不許擅擬差人提擾二十一年令凡販賣寶石制作玩器者發邊逺充軍𢎞治十三年奏定凡職官有犯避難因而在逃者依律問擬罷職不叙其武職或因貧難及上下陵逼等項曠職三箇月者問罪還職仍帶俸差操半年以上者調發邊衛差操若文武職官犯罪事發脫逃者除真犯死罪并例該充軍者照本等律例問擬外雜犯死罪并徒流罪俱問發為民原該為民者發口外為民杖罪以下例應還職暫時躲避並已經問斷送發運炭等項貧難無力因而在逃者止問本罪照原擬發落凡軍職年七十以上十五以下及廢疾犯該雜犯死罪者運炭納米等項發落免發立功凡軍職宿娼及和娶樂人為妻妾者問調别衛帶俸差操凡軍職犯姦除姦所捕獲及刁姦坐擬姦罪者俱革職為民其指姦及非姦所捕獲者仍擬還職凡軍職有犯監守常人盜受財枉法滿貫律該斬絞罪者俱發邊方立功五年滿日還職仍於原衛所帶俸差操其犯該竊盜掏摸盜官畜産白晝搶奪姦宿所部妻女行止有虧者俱發原籍為民無原籍者本衛所隨住若監守常人盜枉法不滿貫與求索科斂誆騙計贓滿貫問該流罪减至杖一百徒三年者俱運炭或納米完日還職帶俸差操其减至杖九十徒二年半以下與别項罪犯俱照常發落原管事者管事原帶俸者帶俸若犯前項流罪遇例通减二等至杖九十徒二年半者仍帶俸差操凡軍職并土官有犯強盜人命等項真犯死罪者先行該管衙門拘繫備由奏提若軍職有犯别項罪名散行拘審果有干礙然後參提凡納粟軍職有犯若原係總小旗千百户指揮等官遇例納粟照見任軍職事例施行若由白衣納粟者止照常例發落其犯姦盜詐僞說事過錢誆騙財物行止有虧者俱問罪革職凡官吏旗校舍餘軍民人等有因為事問發或為民充軍或罷職冠帶閒住或降調出外各來京潜住者問擬明白原係為民者發口外為民充軍者發邊衛充軍冠帶閒住者發回原籍為民口外為民者改發口外衛分充軍凡在京五軍都督府選差官舍押解充軍犯人若受財賣放犯該枉法絞罪者官發立功滿日還職調外衛帶俸差操中間又犯姦淫囚犯婦女者守哨滿日革職為民舍人發邊衛充軍凡在京軍民各色匠役犯該雜犯死罪無力做工徒流罪拘役俱住支月糧笞杖納鈔或的决若犯竊盜掏摸搶奪一應情重者亦擬炒鐵等項發落不在拘役之限民匠仍刺字充警凡在京囚犯遇蒙恩例通减二等者罪雖遇例减等若律應仍盡本法及例該充軍為民立功調衛等項者仍依律例一體擬斷發遣凡內外問刑例應委官勘問及軍衛有司㑹勘者如財産等項限一月勘檢人命兩月駁勘者亦限一月如違及托故推調者參奏提問另行委官作急勘報凡養象軍奴犯該雜犯死罪無力做工徒流罪决杖一百俱住支月糧各照年限常川養象滿日仍舊食糧養象笞杖的决凡上班京操及運糧官員旗軍人等犯該人命強盜等項重罪者官拘繫奏提旗軍人等就便提問外其餘一切小事候下班回還交糧畢日官參奏與旗軍人等各提問凡各處大戶家人佃㒒結搆為盜殺官劫庫劫獄放火許大户隨即送官追問若大戶知情故縱除真犯死罪外其徒流杖罪及窩賊三名以上屬軍衛者發邊衛屬有司者發附近各充軍凡皇親功臣管莊家僕佃户人等勾引外處來歷不明之人窩藏為盜坐家分贓者問發邊衛充軍其該管家長參究治罪凡官司差人追徴錢糧勾攝公事并捕獲罪人但聚衆至十人以上中途打奪為從者如係親屬并同居家人照常發落若係異姓同惡相濟及槌師打手俱發邊衛充軍凡各處有司軍衛衙門主文書算快手皂𨽻總甲門禁庫子人等久戀衙門說事過錢把持官府飛詭稅糧起滅詞訟陷害良善及賣放強盜誣執平人為從事發有顯跡情重者旗軍問發邊衛民并軍丁發附近俱充軍情輕者問罪枷號一月縱容官員作罷軟黜退失覺察者照常發落若各鄉書手飛詭稅糧二百石以上者問發邊衛充軍凡告爭家財田産但係五年之上并未及五年驗有親族寫立分書已定出賣文契是實者斷令照舊管業不許重分再贖告詞立案不行凡將妻妾作姊妹及將拐帶不明婦女或將親女并居喪姊妹嫁賣與人作妻妾使女名色騙財之後設詞托故公然領去或瞰起程中途聚衆行凶邀搶人財者除真犯死罪外其餘屬軍衛者發邊衛充軍屬有司者發口外為民媒人知情罪同若婦人有犯罪坐夫男若不知情及無夫男者止坐本婦照常發落凡號稱喇虎等項名色白晝在街撒潑口稱聖號及總甲快手應捕人等指以巡捕勾攝為由各毆打平人搶奪財物者除真犯死罪外犯該徒罪以上不分人多少若初犯一次屬軍衛者發邊衛充軍屬有司者發口外為民雖係初犯若節次搶奪及再犯纍犯笞杖以上者俱發原搶奪地方枷號一月照前發遣若里老鄰佑知而不舉所在官司縱容不問各治以罪凡凶徒因事忿爭執持鎗刀弓箭銅鐡簡劍鞭斧扒頭流星骨朵麥穗稱箠等凶器但傷人及誤傷傍人與剜人眼睛折跌人肢體全抉人耳鼻口唇斷人舌毁敗人隂陽者俱問發邊衛充軍若聚衆執持凶器傷人及圍繞房屋搶檢家財棄毁器物姦淫婦女除真犯死罪外徒罪以上俱不分首從發邊衛永逺充軍凡盜內府財物者係雜犯死罪准贖外若盜乘輿服御物者仍作真犯死罪依律議擬凡在外官庫被盜銀至一千兩以上一月不獲經該并巡捕官俱各住俸半年不獲提問被盜二三次者奏請降調其該道分巡分守官參奏罰治不及前數者俱照常發落庫子儘其財産均追陪償候真贓得獲照數給還若各官妄拿平人逼認盜贓追陪者亦問罪降調凡知強竊盜賊而接買受寄若馬騾等畜至二頭匹以上銀貨坐贓至滿貫者俱問罪不分初犯再犯枷號一月發落若三犯以上不拘贓數多寡與知強盜後而分贓至滿貫者俱免枷號發邊衛充軍凡詐冒內官恐嚇官司誆騙財物者除真犯死罪外其餘枷號一月發邊衛充軍所在官司阿諛故縱不行擒拿者各治以罪凡假充大臣家人名目豪橫鄉村生事害民強占田土房屋招集流移住種者許所在官司拿問發邊衛充軍若隱瞞不舉者各治以罪凡詐冒皇親族屬婚黨家人在京在外巧立名色挾制財物侵占地土并有禁山場攔當船隻勒要銀兩出入大小衙門囑託公事販賣錢鈔私鹽包攬錢糧假稱織造私開牙行擅搭橋梁侵漁民利及往來河道吹響器張旗號經過軍衛有司衙門需索人夫酒食勒要車輛船隻者除真犯死罪外徒罪以上俱於所犯地方枷號一月發邊衛充軍若被害之人赴所在官司告訴不即受理觀望逢迎不即問斷舉奏者各治以罪凡投充王府及鎮守總兵兩京內臣功臣戚里勢豪之家為家人伴當等項名色事干嚇騙財物撥置打死人命強占地土等項情重者除真犯死罪外其餘俱問發邊衛充軍各該勢豪之家容留及占吝不發者參究治罪凡官吏問發充軍及口外為民者免其運炭納米等項并律該决杖就拘當房家小起發隨住其餘人口存留原籍辦納糧差若發邊衛充軍者原係邊衛發極邊原係極邊常川守哨發口外為民者原係口外并邊境民人發别處極邊凡各州縣里甲解户納户鋪户但有差占及供送人來京犯罪俱查理明白笞杖的决發落徒罪以上審無力者與逃民俱遞回原籍官司各照彼中事例發落凡真犯死罪免死并叛逆家屬子孫及例該永逺充軍者止在本房勾補盡絶即與分豁其餘雜犯死罪并徒流等罪照例充軍及口外為民者俱止終本身凡在外軍民詞訟除叛逆機密重事許鎮守總兵參將守備等官受理外其餘不許濫受輒行軍衛有司問理南京詞訟干係地方者許內外守備官員受理其餘一應詞訟悉遵舊制赴南京通政司告送法司問理其在外軍衛有司不係掌印官不許受詞訟凡問刑衙門行文軍衛有司提人遷延三月以上不到經該官吏住俸候事完之日方許關支半年不到經該官員參提問罪凡法司問斷各處進本等項人犯發各衙門程遞者除原有杻鐐及牢固字樣照舊外其押解人役若擅加杻鐐非法亂打搜檢財物剝脫衣服逼致死傷及受財故縱并聽慿狡猾之徒買求殺害者除真犯死罪外徒罪以上屬軍衛者發邊衛充軍屬有司者發口外為民凡王府文武官王妃家父母儀賓俱請㫖提問其儀賓犯該充軍有礙發遣奏請定奪凡在外徒罪囚犯發充儀從者每月追銀三錢照徒年追足即將囚犯先行發落所追銀兩轉送該府聽其雇人充當不許將犯人拘禁擾害違者先將該府旗校人等拿問輔導等官參奏究問果礙宗室儀賓具實奏請定奪凡王府人役犯罪巡撫巡按都布按三司官徑自提問衛所府州縣俱要行文長史司及教授提人㑹官約問王府各官不許占吝不發若犯該姦盜詐僞及搶奪鬪毆人命等項重情事須急捕者所在官司捉拿監候然後移文㑹問凡各王府有犯先行追究設謀撥置之人應提問者就行提問應奏提者奏提杖罪以上官員奏請降調逺方旗校舍餘人等邊衛充軍十四年奏准凡軍職有犯除笞罪收贖外其杖罪以上不分收贖及運灰做工等項俱依律論功定議發落十五年奏准法司遇有見監重囚令人奏訴查有原行者照舊免問給引照回外其餘見監人犯查無原行不分輕重俱將奏訴人問罪的决亦與給引照回仍行原籍官司先查本犯見監在獄及奏訴人依限投到方與提人問理若揑稱見監希求免遞及案候三箇月不到者即將所奏情詞不問虛實俱立案不行仍問罪發落凡竊盜三犯遇革釋放或饒死充軍革前逃回及竊盜纍犯不悛者俱問竊盜三犯罪名若犯别罪及革後逃回照問刑條例議擬凡奉㫖於在京拿人錦衣衛給駕帖刑科批日若差人出外提人取物并勘問事情皆給精微批齎赴所在官司比號相同然後行事如不同就擒解京其法司提在京人犯止用手本差辦事吏或防軍將原告押送各該衙門認拿被告人犯其情輕干證人犯及婦女不係姦盜者著落店家保領聽牌其情尤輕係干證者照出聽牌凡通政司等衙門送到詞訟不分見在并重罪無罪俱照被告名籍分送該司收問若被告在逃久拿不獲或病故公差等項俱照原告司分收問其都察院調到付到囚人對道司分收問明㑹典卷一百三十二
