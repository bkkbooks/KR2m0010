body:
  text: 明㑹典卷一百二十九刑部四祭祀明律祭享凡大祀及廟享所司不將祭祀日期預先告示諸衙門者笞五十因而失誤行事者杖一百其已承告示而失誤者罪坐失誤之人若百官已受誓戒而弔喪問疾判署刑殺文書及預筵宴者皆罰俸錢一月其知有緦麻以上喪或曽經杖罪遣充執事及令陪祀者罪同不知者不坐若有喪有過不自言者罪亦如之其已受誓戒人員散齊不宿淨室罰俸錢半月致齊不宿本司者罰俸錢一月若大祀牲牢玉帛黍稷之屬不如法者笞五十一事缺少者杖八十一座全缺者杖一百若奉大祀犧牲主司喂養不如法致有瘦損者一牲笞四十每一牲加一等罪止杖八十因而致死者加罪一等中祀有犯者罪同餘條准此毁大祀丘壇凡大祀丘壇而毁損者杖一百流二千里壝門減二等若棄毁大祀神御之物者杖一百徒三年遺失及誤毁者各減三等致祭祀典神祗凡社稷山川風雲雷雨等神及聖帝明王忠臣烈士載在祀典應合致祭神祗所在有司置立牌面開寫神號祭祀日期於潔淨處常川懸掛依時致祭至期失誤祭祀者杖一百其不當奉祀之神而致祭者杖八十歷代帝王陵寢凡歷代帝王陵寢及忠臣烈士先聖先賢墳墓不許於上樵採耕種及牧放牛羊等畜違者杖八十䙝瀆神明凡私家告天拜斗焚燒夜香燃㸃天燈七燈䙝瀆神明者杖八十婦女有犯罪坐家長若僧道修齊設醮而拜奏青詞表文及祈禳火灾者同罪還俗若有官及軍民之家縱令妻女於寺觀神廟燒香者笞四十罪坐夫男無夫男者罪坐本婦其寺觀神廟住持及守門之人不為禁止者與同罪禁止師巫邪術凡師巫假降邪神書符呪水扶鸞禱聖自號端公太保師婆及妄稱彌勒佛白蓮社明尊教白雲宗等㑹一應左道亂政之術或隱藏圗像燒香集衆夜聚曉散佯修善事扇惑人民為首者絞為從者各杖一百流三千里若軍民裝扮神像鳴鑼擊鼓迎神賽㑹者杖一百罪坐為首之人里長知而不首者各笞四十其民間春秋義社不在禁限儀制明律合和御藥凡合和御藥誤不依本方及封題錯誤醫人杖一百料理揀擇不精者杖六十若造御膳誤犯食禁厨子杖一百若飲食之物不潔淨者杖八十揀擇不精者杖六十不品嘗者笞五十監臨提調官各減醫人厨子罪二等若監臨提調官及厨子人等誤將雜藥至造御膳處所者杖一百所將雜犯就令自喫門官及守衛官失於搜檢者與犯人同罪並臨時奏聞區處乘輿服御物凡乘輿服御物收藏修整不如法者杖六十進御差失者笞四十其車馬之屬不調習駕馭之具不堅完者杖八十若主守之人將乘輿服御物私自借用或轉借與人及借之者各杖一百徒三年若棄毁者罪亦如之遺失及誤毁者各減三等若御幸舟船不堅固者工匠杖一百若不整頓修飾及在船篙棹之屬缺少者杖六十並罪坐所由監臨提調官各減工匠罪二等並臨時奏聞區處收藏禁書及私習天文凡私家收藏𤣥象器物天文圖䜟應禁之物及歷代帝王圗像金玉符璽等物者杖一百若私習天文者罪亦如之並於犯人名下追銀一十兩給付告人充賞御賜衣服凡御賜百官衣服使臣不行親送轉付他人給與者杖一百罷職不叙失誤朝賀凡朝賀及迎接詔書所司不預先告示者笞四十其已承告示而失誤者罪亦如之失儀凡祭祀及謁拜園陵若朝㑹行禮差錯及失儀者罰俸錢半月其糾儀官應糾舉而不糾者罪同奏對失序凡在朝侍從官貟特承顧問官高者先行回奏卑者以次進對若先後失序者各罰俸錢半月朝見留難凡儀禮司官將應朝見官員人等託故留難阻當不即引見者斬大臣知而不問與同罪不知者不坐上書陳言凡國家政令得失軍民利病一切興利除害之事並從五軍都督府六部官面奏區處及聽監察御史提刑按察司官各陳所見直言無隱若內外大小官員但有本衙門不便事件許令明白條陳實封進呈取自上裁若知而不言茍延嵗月者在內從監察御史在外從按察司紏察若百工技藝之人應有可言之事亦許直至御前奏聞其言可用即付所司施行各衙門但有阻當者鞫問明白斬其陳言事理並要直言簡易每事各開前件不許虛飾繁文若縱橫之徒假以上書巧言令色希求進用者杖一百若稱訴寃枉於軍民官司借用印信封皮入遞者借者及借與者皆斬見任官輒自立碑凡見任官實無政跡輒自立碑建祠者杖一百若遣人妄稱已善申請于上者杖八十受遣之人各減一等禁止迎送凡上司官及使客經過若監察御史按察司官出巡按治而所在各衙門官吏出郭迎送者杖九十其容令迎送不舉問者罪亦如之公差人員欺陵長官凡公差人員在外不循禮法欺陵守禦官及知府知州者杖六十附過還役歷過俸月不准若校尉有犯杖七十祗候禁子有犯杖八十服舍違式凡官民房舍車服器物之類各有等第若違式僣用有官者杖一百罷職不叙無官者笞五十罪坐家長工匠并笞五十若僣用違禁龍鳳文者官民各杖一百徒三年工匠杖一百連當房家小起發赴京籍充局匠違禁之物並入官首告者官給賞銀五十兩若工匠能自首者免罪一體給賞僧道拜父母凡僧尼道士女冠並令拜父母祭祀祖先喪服等第皆與常人同違者杖一百還俗若僧道衣服止許用紬絹布匹不得用紵絲綾羅違者笞五十還俗衣服入官其袈裟道服不在禁限匿父母夫喪凡聞父母及夫之喪匿不舉哀者杖六十徒一年若喪制未終釋服從吉忘哀作樂及參領筵宴者杖八十若聞期親尊長喪匿不舉哀者亦杖八十若喪制未終釋服從吉者杖六十若官吏父母死應丁憂詐稱祖父母伯叔姑兄姊之喪不丁憂者杖一百罷職役不叙無喪詐稱有喪或舊喪詐稱新喪者罪同有規避者從重論若喪制未終冒哀從仕者杖八十其當該官司知而聽行各與同罪不知者不坐其仕宦逺方丁憂者以聞喪月日為始奪情起復者不拘此律棄親之任凡祖父母父母年八十以上及篤疾别無以次侍丁而棄親之任及妄稱祖父母父母老疾求歸入侍者並杖八十若祖父母父母及夫犯死罪被囚禁而筵宴作樂者罪亦如之喪葬凡有喪之家必須依禮安葬若惑于風水及託故停柩在家經年暴露不葬者杖八十其從尊長遺言將尸燒化及棄置水中者杖一百卑幼並減二等若亡歿遠方子孫不能歸葬而燒化者聽從其便其居喪之家修齊設醮若男女溷雜飲酒食肉者家長杖八十僧道同罪還俗鄉飲酒禮凡鄉黨序齒及鄉飲酒禮已有定式違者笞五十人命明律謀殺人凡謀殺人造意者斬從而加功者絞不加功者杖一百流三千里殺訖乃坐若傷而不死造意者絞從而加功者杖一百流三千里不加功者杖一百徒三年若謀而己行未曽傷人者杖一百徒三年為從者各杖一百但同謀者皆坐其造意者身雖不行仍為首論從者不行減行者一等若因而得財者同强盜不分首從論皆斬謀殺制使及本管長官凡奉制命出使而官吏謀殺及部民謀殺本屬知府知州知縣軍士謀殺本管指揮千戶百戶若吏卒謀殺本部五品以上長官已行者杖一百流二千里已傷者絞殺者皆斬謀殺祖父母父母凡謀殺祖父母父母及期親尊長外祖父母夫夫之祖父母父母已行者皆斬已殺者皆凌遲處死謀殺緦麻以上尊長已行者杖一百流二千里已傷者絞已殺者皆斬其尊長謀殺卑幼已行各依故殺罪減二等己巳傷者減一等已殺者依故殺法若奴婢及雇工人謀殺家長及家長之期親外祖父母若緦麻以上親者罪與子孫同殺死姦夫凡妻妾與人姦通而於姦所親獲姦夫姦婦登時殺死者勿論若止殺死姦夫者姦婦依律斷罪從夫嫁賣其妻妾因姦同謀殺死本夫者凌遲處死姦夫處斬若姦夫自殺其夫者姦婦雖不知情絞謀殺故夫父母凡妻妾謀殺故夫之祖父母父母者並與謀殺舅姑罪同若奴婢謀殺舊家長者以凡人論殺一家三人凡殺一家非死罪三人及支解人者凌遲處死財産斷付死者之家妻子流二千里為從者斬採生拆割人凡採生拆割人者凌遲處死財産斷付死者之家妻子及同居家口雖不知情並流二千里安置為從者斬若已行而未曽傷人者亦斬妻子流二千里為從者杖一一百三千里里長知而不舉者杖一百不知者不坐告獲者官給賞銀二十兩造畜蠱毒殺人凡造畜蠱毒堪以殺人及教令者斬造畜者財産入官妻子及同居家口雖不知情並流二千里安置若以蠱毒毒同居人其被毒之人父母妻妾子孫不知造蠱情者不在流逺之限若里長知而不舉者各杖一百不知者不坐告獲者官給賞銀二十兩若造魘魅符書呪詛欲以殺人者各以謀殺論因而致死者各依本殺法欲令人疾苦者減二等其子孫于祖父母父母奴婢雇工人於家長者各不減若用毒藥殺人者斬買而未用者杖一百徒三年知情賣藥者與同罪不知者不坐鬬毆及故殺人凡鬬毆殺人者不問手足他物金刃並絞故殺者斬若同謀同毆人因而致死者以致命傷為重下手者絞絞原謀者杖一百流三千里餘人各杖一百屏去人服食凡以他物置人耳鼻及孔竅中若故屏去人服用飲之之物而傷人者杖八十致成殘廢疾者杖一百徒三年令至篤疾者杖一百流三千里將犯人財産一半給付篤疾之人養贍至死者絞若故用蛇蝎毒蟲咬傷人者以鬬毆傷論因而致死者斬戲殺誤殺過失殺傷人凡因戲而殺傷人及因鬬毆而誤殺傷傍人者各以鬬殺傷論其謀殺故殺人而誤殺傍人者以故殺論若知津河水深泥濘而詐稱平淺及橋梁渡船朽漏不堪渡人而詐稱牢固誑令人過渡以致陷溺死傷者亦以鬬殺傷論若過失殺傷人者各准鬬殺傷罪依律收贖給付其家夫毆死有罪妻妾凡妻妾因毆罵夫之祖父母父母而夫擅殺死者杖一百若夫毆妻妾因而自盡身死者勿論殺子孫及奴婢圗賴人凡祖父母父母故殺子孫及家長故殺奴婢圗賴人者杖七十徒一年半若子孫將已死祖父母父母奴婢雇工人將家長身尸圗賴人者杖一百徒三年期親尊長杖八十徒二年大功小功緦麻各遞減一等若尊長將已死卑幼及他人身尸圗賴人者杖八十其告官者隨所告輕重並依誣告平人律論罪若因而詐取財物者計贓准竊盜搶去財物者准白晝搶奪論免刺各從重科斷弓箭傷人凡故向城市及有人居止宅舍放彈射箭投擲磚石者笞四十傷人者減凡鬭傷一等因而致死者杖一百流三千里車馬殺傷人凡無故於街市鎮店馳驟車馬因而傷人者減凡鬬傷一等死死者杖一百流三千里若於鄉村無人曠野地內馳驟因而傷人致死者杖一百並追埋葬銀一十兩若因公務急速而馳驟殺傷人者以過失論庸醫殺傷人凡庸醫為人用藥針刺誤不依本方因而致死者責令别醫辨驗藥餌穴道如無故害之情者以過失殺人論不許行醫若故違本方詐療疾病而取財物者計贓准竊盜論因而致死及因事故用藥殺人者斬窩弓殺傷人凡打捕户於深山曠野猛獸往來去處穿作坑穽及安置窩弓不立望竿及抹眉小索者笞四十以致傷人者減鬬毆傷二等因而致死者杖一百徒三年追徴埋葬銀一十兩威逼人致死凡因事威逼人致死者杖一百若官吏公使人等非因公務而威逼平民致死者罪同並追埋葬銀一十兩若威逼期親尊長致死者絞大功以下遞減一等若因姦盜而威逼人致死者斬尊長為人殺私和凡祖父母父母及夫若家長為人所殺而子孫妻妾奴婢雇工人私和者杖一百徒三年期親尊長被殺而卑幼私和者杖八十徒三年大功以下各遞減一等其卑幼被殺而尊長私和者各減一等若妻妾子孫及子孫之婦奴婢雇工人被殺而祖父母父母家長私和者杖八十受財者計贓准竊盜論從重科斷常人私和人命者杖六十同行知有謀害凡知同伴人欲行謀害他人不即阻當救護及被害之後不首告者杖一百明㑹典卷二十九
