body:
  text: 明會典卷八十一禮部四十祭祀二時享太廟廟號洪武元年上高祖考尊諡曰玄皇帝廟號德祖妣曰玄皇后曽祖考尊諡曰恆皇帝廟號懿祖妣曰恆皇后祖考尊諡曰裕皇帝廟號熙祖妣曰裕皇后考尊諡曰淳皇帝廟號仁祖妣陳氏曰淳皇后永樂元年上高廟尊諡曰聖神文武欽明啓運俊德成功統天大孝高皇帝廟號太祖后馬氏尊諡曰孝慈昭憲至仁文德承天順聖高皇后永樂二十二年上文廟尊諡曰體天𢎞道高明廣運聖武神功純仁至孝文皇帝廟號太宗后徐氏尊諡曰仁孝慈懿誠明莊獻配天齊聖文皇后洪熙元年上仁廟尊諡曰敬天體道純誠至德𢎞文欽武章聖達孝昭皇帝廟號仁宗正統七年上后張氏尊諡曰誠孝恭肅明德𢎞仁順天啓聖昭皇后宣德十年上宣廟尊諡曰憲天崇道英明神聖欽文昭武寬仁純孝章皇帝廟號宣宗天順六年上后孫氏尊諡曰孝恭懿憲慈仁莊烈齊天配聖章皇后天順八年上英廟尊諡曰法天立道仁明誠敬昭文憲武至德廣孝睿皇帝廟號英宗成化四年上后錢氏尊諡曰孝莊憲穆𢎞惠顯仁恭天欽聖睿皇后成化二十三年上憲廟尊諡曰繼天凝道誠明仁敬崇文肅武宏德聖孝純皇帝廟號憲宗廟制國初於闕左建四廟德祖廟居中懿祖居東第一廟熙祖居西第一廟仁祖居東第二廟廟與主皆南向洪武元年定以四時孟月及嵗除凡王享二年重定時享春以清明夏以端午秋以中元冬以冬至惟嵗除如舊三年又定時享仍用四孟月惟孟春特享于各廟各行神奏樂餘時俱奉三祖神主合享于德祖之廟德祖仍南向三祖以次東西向初獻時亦各奏本廟樂餘皆同奏德廟樂洪武九年始改建太廟其制前為正殿後為寢殿俱翼以兩廡寢殿九間以一間為一室中一室奉安德祖帝后神主懿祖居東第一室熙祖居西第一室仁祖居東第二室主皆南向几席床榻衾褥楎椸篋笥帷幔器皿之屬皆如生事之儀及時享于正殿則設德祖帝后衣冠于神座居中南向神座俱不奉神主止設衣冠禮畢藏之懿祖神座列于左西向熙祖列于右東向仁祖列懿祖之次西向又以親王配享于東壁功臣配享于西壁孟春擇上旬吉日孟夏孟秋孟冬用朔日嵗暮用除日俱行合享之禮俱奏德廟之樂不别行特享禮奏各廟樂洪武三十一年以後奉安高廟神主於寢殿居西第二室南向正殿神座居熙祖之次東向此南京太廟之制及遷都北京建廟與南京同洪熙元年奉安文廟神主於寢殿居東第三室南向正殿神座則居仁祖之次西向宣德元年奉安仁廟神主於寢殿居西第三室南向正殿神座則居高廟之次東向宣德十年奉安宣廟神主於寢殿居東第四室南向正殿神座則居文廟之次西向天順八年奉安英廟神主於寢殿居西第四室南向正殿神座則居仁廟之次東向而九廟已備𢎞治元年始復建祧廟於寢殿後奉藏懿祖神主及儀物於其中則熙祖寢殿神主奉遷于東第一室正殿神座奉遷于西向首位而仁祖以下皆以次奉遷則憲宗祔廟神主於寢殿居西第四室正殿神座居宣廟東向之次每嵗暮則復奉懿祖神座於正殿之左居熙祖之上行祫祭之禮諸司職掌一齋戒凡齋戒前一日太常寺官宿于本司次日具本奏致齋三日次日進銅人一省牲牛九羊八山羊十豕十九鹿一兔四今時享牛十四羊十三山羊十六豕三十兔十二祫祭則各增其一鹿山羊如舊凡正祭前二日太常司官奏明日與光祿司官省牲至次日省牲畢同復命一正祭陳設皇高祖前犢一羊一豕一登二鉶二籩豆各十二簠簋各二帛二白色奉先制帛皇曽祖陳設同皇祖陳設同皇考陳設同共設酒尊三金爵八磁爵十六篚四于殿東設祝文案于殿西今皇曽祖已祧太祖太宗仁宗宣宗英宗憲宗陳設並同通設酒尊九祫祭加一金爵十七祫祭加二磁爵三十四祫祭加四篚九祫祭加一親王配享四壇共二十一位今具列位號夀春王妃劉氏上二位第一壇霍丘王妃翟氏下蔡王安豐王妃趙氏南昌王上六位第二壇蒙城王妃田氏旴𣅿王妃唐氏臨淮王妃劉氏上六位第三壇寶應王六安王來安王都梁王英山王山陽王招信王上七位第四壇第一壇犢一羊一豕一登二鉶二籩豆各十簠簋各二帛二展親制串爵六第二壇犢一羊一豕一登六鉶六籩豆各十簠簋各二帛六展親制帛爵十八第三壇陳設與二壇同第四壇犢一羊一豕一登七鉶七籩豆各十簠簋各二帛七爵二十一共設酒尊三于殿東南北向篚四功臣配享十壇今十六壇具列名爵中山武寧王徐達開平忠武王常遇春岐陽武靖王李文忠寧河武順王鄧愈東甌襄武王湯和黔寧昭靖王沐英虢國忠烈公俞通海蔡國忠毅公張德勝越國武莊公胡大海梁國武桓公趙德勝泗國武莊公耿再成永義侯桑世傑河間忠武王張玉東平武烈王朱能寧國忠莊公王真榮國恭靖公贈少師姚廣孝各壇羊一豕一鉶一籩豆各二簠簋各一帛一報功制帛爵三篚一共設酒尊三于殿西南北向一儀注典儀唱樂舞生就位執事官各司其事導引官導引皇帝至御位內贊奏就位典儀奏迎神奏樂樂止內贊奏四拜百官同典儀唱奠帛行初獻禮奏樂執事官各捧帛金爵受酒獻于神御前讀祝官取祝跪于神御右內贊奏跪典儀唱讀祝讀祝訖進于神御前內贊奏俯伏興平身百官同樂止典儀唱行亞獻禮執事官各以磁爵受酒獻于神御前樂止典儀唱行終獻禮儀同亞獻樂止太常司卿進立殿東西向唱賜福胙光祿司官捧福酒胙自神御前中門左出皇帝前內贊奏跪搢圭光祿司官以福酒跪進內贊奏飲福酒光祿司官以胙跪進內贊奏受胙出圭俯伏興平身內贊奏四拜百官同典儀唱徹饌奏樂執事官徹饌樂止太常卿詣神御前跪奏禮畢請還宫奏樂內贊奏四拜百官同樂止典儀唱讀祝官捧祝進帛官捧帛各詣燎位奏樂內贊奏禮畢一時享祝文維洪武某年某月某日孝玄孫皇帝今云孝曽孫嗣皇帝敢昭告于高曽祖考四廟太皇太后今云八廟太皇太后皇考憲宗純皇帝時維孟春夏秋冬禮嚴祭祀謹以牲醴庶品用伸追慕之情尚享一嵗暮祝文時當嵗暮明旦新正謹率羣臣以牲醴庶品恭詣太廟用伸追慕之情尚享一樂章迎神中和之曲慶源發祥世德惟崇致我眇躬今云助我祖宗開基建功京都之內親廟在東維我子孫永懷祖宗氣體則同呼吸相通來格來崇皇靈顯融初獻夀和之曲武功之舞思皇先祖耀靈于天源衍慶流繇高逮玄玄孫受命追遠其先明禋世崇億萬斯年亞獻豫和之曲文德之舞對越至親儼然如生其氣昭明感格在庭如見其形如聞其聲愛而敬之發乎中情終獻熙和之曲文德之舞承前人之德化家為國毋曰豫小子基命成續今云惟前人之功肇膺天厯延及豫小子爰受方國欲報其德昊天罔極殷勤三獻我心悅懌徹饌雍和之曲樂奏儀肅神其燕娛告成于祖亦佑皇妣敬徹不遲以終祀禮祥光煥揚錫以嘉祉還宫安和之曲顯兮幽兮神運無迹鸞馭逍遙安其所適其靈在天其主在室子子孫孫孝思無斁祧廟成化二十三年十二月憲宗純皇帝將升祔太廟懿祖神主禮宜奉祧熙祖以下當以次奉遷先期遣官祭告太廟每廟用犢一上親告憲宗几筵內侍官陳設酒饌如常儀畢太常寺官同內執事官于太廟奉遷懿祖室內神主衣冠于德祖室內之左原奉享床幔儀物及正殿東一位神座俱暫貯于神庫奉先殿懿祖神座儀物亦貯于內神庫至日奉祔憲宗純皇帝神主于太廟寢殿內西第四室亦設神座于正殿西第四位東向居宣宗章皇帝之下奉先殿內亦奉祔神位於西第四室及新建後殿成奉安懿祖神主衣冠儀物于中南向自後每嵗暮享太廟仍奉請懿祖出臨正殿西向之位以享祫祭之禮祫祭前期太常寺陳設懿祖神座于正殿之左熙祖之上前一日用祝文酒果遣官祭告太廟云維年月日孝曽孫嗣皇帝謹遣某官敢昭告于八廟太皇太后皇考憲宗純皇帝兹者嵗暮特修祫祭之禮恭迎懿祖皇帝同臨享祀伏惟鑒知謹告又用祝文酒果遣官祭告懿祖于祧廟云維年月日孝曽孫嗣皇帝謹遣某官敢昭告于懿祖恆皇帝兹者嵗暮恭于太廟舉行祫祭之禮祗請聖靈詣廟享祀特伸預告伏惟鑒知謹告祫祭祝文維年月日孝曽孫嗣皇帝敢昭告于八廟太皇太后皇考憲宗純皇帝時當嵗暮明旦新正謹率羣臣以牲醴庶品恭詣太廟特修祫祭之禮用伸追慕之情尚享奉先殿國朝以太廟時享未足展孝思之誠復於宫內建奉先殿朝夕致敬朔望行禮時節獻新忌辰致祭忌辰仁祖淳皇帝四月十六日淳皇后四月二十一日太祖高皇帝五月初十日孝慈高皇后八月初十日太宗文皇帝七月十八日仁孝文皇后七月初四日仁宗昭皇帝五月十二日誠孝昭皇后十月十八日宣宗章皇帝正月初三日孝恭章皇后九月初四日英宗睿皇帝正月十七日孝莊睿皇后六月二十六日憲宗純皇帝八月二十二日薦新品物正月韭菜四斤生菜四斤薺菜四斤雞子二百六十箇鴨子二百四十箇二月芹菜三斤薹菜五斤氷蔞蒿五斤子鵝二十二隻三月茶笋十五斤鯉魚二十五斤四月櫻桃十斤杏子二十斤青梅二十斤王瓜五十箇雉雞十五斤豬二隻五月桃子十五斤李子二十斤夏至李子二十斤紅豆一斗沙糖一斤八兩來禽十五斤茄子一百五十箇大麥仁三斗小麥麵三十斤嫩雞三十五隻六月蓮蓬二百五十箇甜瓜三十箇西瓜三十箇冬瓜三十箇七月棗子二十斤葡萄二十斤梨二十斤鮮菱十五斤芡實十斤雪梨二十斤八月藕四十枝芋苗二十斤茭白二十斤嫩薑二十五斤粳米三斗粟米三斗稷米三斗鱖魚十五斤九月橙子二十斤栗子二十斤小紅豆三斗沙糖一斤八兩鯿魚十五斤十月柑子二十五斤橘子二十五斤山藥二十斤兔十五隻蜜一斤八兩十一月甘蔗一百三十根鹿一隻鴈十五隻蕎麥麵三十斤紅豆一斗沙糖一斤八兩十二月菠菜十斤芥菜五斤鯽魚十五斤白魚十五斤已上奉先殿供薦品物與南京奉先殿供薦品物同其子鵝鮮笋梅子雪梨茭白橙子柑子橘子甘蔗至今猶是南京太常寺預先附進太常寺收受奏送光祿寺供薦奉慈殿成化二十三年九月上既即位十一月追上母妃紀氏尊諡曰孝穆慈慧恭恪莊僖崇天承聖皇太后祔葬茂陵遂以羣臣議於宫中别建奉慈殿奉安神主一嵗五享四序薦新及六月二十八日忌辰祭祀俱如太廟奉先殿之儀事例洪武元年造太廟祭器凡銀器以金塗之酒壺盂盞每事皆八盤碗二百四十及楎椸枕簟篋笥帷幔浴室皆具又令太廟祭器以金塗銀者俱易以金二年孟春享太廟以功臣七人配享設青布幃六間于太廟庭中內設功臣位遣官分獻讀祝又詔太廟祝文止稱孝子皇帝不稱臣凡遣太子行禮止稱命長子某勿稱皇太子著為令又詔凡時物太常先薦宗廟然後進御三年定每月朔望薦新品物及獻新儀皆命太常卿供事其在月薦之外者太常卿奉旨與內使監官各服常服捧獻不行禮禮部議準太廟每室舊止用幣一令用二定親王從享功臣配享儀親王皆設位于東廡西向功臣皆設位西廡東向四年罷廟庭幃設之次於廟內設黃布幄殿其中並設兩廡祖考神位居中親王及功臣列於兩廡每行禮既奠獻祖考則遣大臣各分獻兩廡不讀祝是秋又命功臣仍於廡間配享不設布殿九年新太廟成奉安四代神主以親王並王妃二十一位侑于殿內東壁功臣十二位配于西壁不分獻自是四時之祭皆行合享之禮二十五年議定太廟時享若值國有喪事樂宜備而不作洪熙元年行祔廟禮升功臣四人配享成化元年增造南京太廟寶座之未備者明會典卷八十一
