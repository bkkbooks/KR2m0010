body:
  text: 明㑹典卷一百二十六刑部一諸司職掌尚書侍郎之職掌天下刑名及徒𨽻勾覆闗禁之政令其屬古有四部曰憲部曰比部司門部都官部洪武二十三年因天下庶務浩繁欽改為十二部曰浙江江西福建山東北平四川山西湖廣廣東廣西河南陜西各令清理一布政司刑名等事其雲南布政司𨽻陜西部仍量其繁簡帶管直𨽻府州并在京衙門每部仍分憲比司門都官四科以領其事凡遇刑名各照部分送問𤼵落後至洪武二十九年改十二部為十二清吏司永樂元年改北平清吏司為北京清吏司十九年革北京清吏司増雲南貴州交阯三清吏司宣德十年革交阯清吏司浙江部帯管中軍都督府神䇿衛和陽衛留守中衛廣洋衛直𨽻和州江西部帶管前軍都督府龍驤衛府軍前衛龍江衛天䇿衛直𨽻廬州府福建部帯管戸部金吾後衛應天衛牧馬千戸所直𨽻常州府廣德州山東部帶管左軍都督府兵部羽林右衛尚寶司典牧所直𨽻鳯陽府滁州北平部帶管吏部金吾前衛太醫院直𨽻蘇州府四川部帶管工部府軍衛僧錄道録司直𨽻松江府山西部帶管旗手衛驍騎右衛龍虎衛翰林院欽天監五城兵馬府直𨽻鎮江府徐州湖廣部帶管右軍都督府虎賁右衛留守右衛水軍右衛直𨽻池州府寧國府廣東部帶管府軍左衛水軍左衛虎賁左衛錦衣衛留守左衛應天衛廣西部帶管通政使司鎮南衛五軍斷事官直𨽻徽州府安慶府河南部帶管禮部羽林左衛武德衛府軍右衛光禄司太常司國子監儀禮司教坊司直𨽻揚州府淮安府陜西部帶管後軍都督府豹韜衛府軍後衛蒙古左右衛橫海衛興武衛江隂衛鷹揚衛大理寺行人司直𨽻太平府雲南布政司浙江等十二部郎中貟外郎主事各掌本布政司并帶管在京衙門直𨽻府州刑名等事見今十三司帶管衙門浙江清吏司帶管中軍都督府刑科内官監御用監司設監神䇿衛和陽衛留守中衛廣洋衛騰驤左衛金吾前衛武功右衛瀋陽右衛涿鹿左中二衛蕃牧千戸所直𨽻和州江西清吏司帶管前軍都督衛龍驤衛府軍前衛龍江衛天䇿衛火藥局酒醋麫觔局御馬監留守前衛永清右衛羽林衛寛河衛龍驤左右二衛燕山左衛龍門衛忠義前後二衛直𨽻武清衛直𨽻廬州府直𨽻廬州衛直𨽻九江衛直𨽻六安衛宣府前衛福建清吏司帶管戸部戸科太僕寺印綬監都知監孝陵衛獻陵衛裕陵衛景陵衛應天衛牧馬千戸所武功中衛武城中衛忠義左衛美峪千戸所直𨽻開平中屯衛直𨽻定邊衛㑹州衛中都留守左中衛直𨽻常州府直𨽻廣德州山東清吏司帶管左軍都督府兵部兵科尚寶司長陵衛羽林右衛典牧所司苑局戈㦸司㑹同館供用庫中都留守司直𨽻鳯掦府直𨽻鳯陽衛直𨽻滁州直𨽻滁州衛直𨽻泗州衛直𨽻沂州衛直𨽻壽州衛德州衛安東中䕶衛保定後衛遼東行太僕寺龍門千戸所遼東行太僕寺遼東都司德府群牧所東直門外牛房四川清吏司帶管工部工科府軍衛僧録道録司織染局巾㡌局懷安衛廣武衛太寧前衛金吾左衛永清左衛武驤右衛直𨽻大名府直𨽻松江府直𨽻金山衛懷來衛濟州衛常山羣牧所蔚州左衛山西清吏司帶管翰林院欽天監上林苑監金吾右衛旗手衛驍騎右衛龍虎衛南城兵馬指揮司北城兵馬指揮司直𨽻鎮江府大同衛直𨽻徐州直𨽻徐州衛直𨽻鎮江衛鎮魯衛英武衛威逺衛瀋陽中䕶衛大寕中衛高山衛義勇前後三衛倒馬闗平定州千戸所瀋陽中屯衛陽和衛玉林衛山隂千戸所混堂司雲川衛甜食房湖廣清吏司帶管右軍都督府虎賁衛留守右衛永軍右衛司禮監尚寶監尚善監茂陵衛茂山衛江淮衛濟州衛忠義右衛保定左右二衛武功左衛義勇左衛神武中衛直𨽻池州府直𨽻寧國府直𨽻宣州府直𨽻定州衛廣東清吏司帶管府軍左衛水軍左衛虎賁左衛錦衣衛留守左衛應天府濟陽衛懷來千戸所飛熊衛直𨽻隆慶州廣西清吏司帶管通政使司鎮南衛五軍斷事司寶鈔局銀作局富峪衛羽林前後二衛直𨽻隆慶左右二衛燕山前右二衛大興衛中城兵馬指揮司武驤左衛直𨽻通州左右二衛靖江衛直𨽻徽州府直𨽻安慶府直𨽻新安府直𨽻安慶衛河南清吏司帶管禮部光禄寺太常寺國子監鴻臚寺禮科中書舍人府軍右衛羽林左衛儀衛司武德衛太和衛睢陽衛留守後衛神武左右前衛靈䑓衛兵杖局犧牲所汝寕千戸所東城兵馬指揮司神樂觀教坊司直𨽻揚州府直𨽻淮安府兩淮鹽運司直𨽻彭城衛直𨽻邳州衛直𨽻儀真衛直𨽻高郵衛武平衛宿州衛大河衛歸德衛直𨽻寕山衛直𨽻通州鹽城海州三千戸所陜西清吏司帶管後軍都督衛大理寺行人司尚衣監豹韜衛府軍後衛蒙古左右衛横海衛興武衛鷹揚衛針工局西城兵馬指揮司神武後衛騰讓右衛平凉衛義勇右中二儀龍虎右衛直𨽻保定中前二衛直𨽻建陽府紫荆闗直𨽻太平府河東陜西鹽運司陜西行太僕寺甘肅行太僕寺江隂衛貴州清吏司帶管吏部吏科金吾前衛司菜局直𨽻蘇州府直𨽻保定府長蘆鹽運司直𨽻順德府直𨽻蘇州衛直𨽻河間府忠義中衛河間衛萬全都司保定保安二衛大寕都司玉林衛直𨽻真保府直𨽻太倉衛蔚州衛開平衛直𨽻薊州衛鎮朔衛直𨽻天津左右二衛直𨽻遵化衛涿鹿衛直𨽻天津衛宣府左右二衛興和千戸所永昌千戸所德州衛永寕衛廣昌千戸所梁城千戸所保安州獨石衛興州左右中前後五衛雲南清吏司帶管順天府太醫院儀衛司直𨽻永平州直𨽻廣平州直𨽻真定衛密雲中後二衛直𨽻潼闗衛鎮魯衛直𨽻大同中屯衛撫寕衛直𨽻東勝左右二衛直𨽻盧龍衛直𨽻永平衛萬全左右二衛寛河千戸所蒲州千戸所武定千戸所營州左右中前後五屯衛樂安千戸所武平千戸所明㑹典卷一百二十六
