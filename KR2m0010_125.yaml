body:
  text: 明會典卷一百二十五兵部二十雜行俸給諸司職掌凡本部官吏人等并合屬五城兵馬司典牧所大勝關會同館等衙門官吏俸給每月初明白立案將實支官吏姓名并該支米數劄付該部填給勘合委官下倉放攴如有事故臨倉扣除還官仍將實支米數回呈立案事例見吏部稽勳司印色諸司職掌凡本部合用印色支銷盡絶移咨工部轉行該庫放支事例見吏部稽勳司紙劄諸司職掌凡本部合用紙劄移咨刑部於贓罰鈔內關支價鈔買用明白立案開銷以慿稽考事例見吏部稽勳司考核諸司職掌凡本部所屬太僕寺并各牧監羣五城兵馬司典牧所大勝關會同館等衙門官吏但有考滿必從本衙門開報年籍鄉貫腳色職役并行過事迹到部以慿考核咨送吏部定奪事例永樂間令凡王府羣牧所千戶首領官比護衛首領官免其考核拘收皮張諸司職掌凡軍民官司解到馬騾驢牛等頂皮張鬃尾并肉臟變賣錢鈔到部錢鈔具手本送赴該庫交納皮張鬃尾咨送工部交收仍取實收附卷事例正統間令凡官司倒死馬皮就於所在官庫收貯成造軍器支銷係蟲蛀不堪者照時估易鈔備用𢎞治初令凡南京典牧所等衙門退出倒死牛犢皮角徑送南京該庫交收成造軍器不必解京軍士鹽糧諸司職掌凡馬步軍士月支糧鹽并典牧所養馬象人冬夏布匹月支鹽糧遇有公文到部總其名數行移該部放支事例宣德間凡在京軍士關支月糧每衛委公正指揮一員専理其事依期關給其新至軍仍令親管頭目即與監支若冒支及容情作弊者紏舉究治其各衛軍士關領賞賜冬衣布花本部委官會同戶部委官給事中御史各一員給散詳見戶部度支科皂𨽻諸司職掌凡各衙門官員合用跟隨皂𨽻俱於法司取撥笞杖囚人應役必須明立文案簿籍開寫姓名鄉貫應該拘役年月發送某衙門著役遇滿撥替其有在逃即便根捉仍送法司問罪若病故者照名行移法司撥補明令凡府州縣額設祇候禁子弓兵於該納稅糧三石之下二石之上人戶內差點除納稅糧外與免雜泛差役毋得將糧多人戶差占應天府祇候二十名禁子三十名各府以秋糧為額二十萬石之上祇候二十名禁子一十五名一十萬石之上祇候一十八名禁子一十三名各州縣以秋糧為額一十萬石之上祇候一十五名禁子一十名弓兵三十名五萬石之上祗候一十三名禁子八名弓兵三十名五萬石之下祇候一十名禁子七名弓兵三十名事例洪武初凡丞相大都督準侯例儀從十五人從一品十三人正從二品九人三品七人四品五人五品四人六品七品二人八品九品一人中書省御史臺公使各二十六人六部各十人斷事司察院各八人應天府十五人上元江寧二縣各十人其武官隨從人指揮使至僉事各四人尋加二人千戶以下三人百戶以下二人俱在正伍取用三日一易衛所直廳六人守門二人守監四人守庫一人俱選老軍充役一月一易永樂間令各項皂𨽻以均徭人戶為之在京在外俱以一年為滿洪熙間令凡文官給假回原籍者跟隨皂𨽻準其帶去宣德間令隨從皂𨽻係不願應當者每名月辦柴薪銀一兩正統間定官員隨從皂𨽻文職一品二品十二名三品十名四品六名五品六品四名七品至九品二名內翰林院編修檢討六科給事中中書舍人監察御史俱近侍各加一名知縣係親民正官欽與四名國子監博士助教學正學録二名翰林院譯字官一名武職五府管事都督錦衣衛官事指揮鎮撫司管事鎮撫俱照文官品級例帶俸都督各六名錦衣衛帶俸都指揮指揮各四名長陵衛指揮使并同知各六名僉事四名則出特恩其文武衙門公使皂𨽻六部都察院通政使司大理寺直堂皂𨽻各三十名鴻臚寺翰林院直堂各十五名宗人府太常寺國子監直堂各十名詹事府左春坊直堂各八名右春坊直堂五名司經局直堂六名太僕寺欽天監太醫院直堂各六名光祿寺尚寶司六科中書舍人制敕房係內府衙門各用看朝房皂𨽻四名上林苑監行人司各直廳四名六部各司都察院各道大理寺左右二寺各直廳四名刑部各司都察院各道大理寺左右二寺係理刑部門各用把門二名都察院經厯司通政司經厯司各直廳四名戶部刑部都察院照磨所及各衙門司務廳各直廳二名通政使司有奏訴寃枉人等戶部山西清吏司兵部職方武府二清吏司俱有軍囚人等各用看監四名宗人府經厯司直廳二名詹事府主簿廳直廳一名鴻臚寺司賔署司儀署主簿廳太常寺博士廳典簿廳太僕寺主簿廳各二名欽天監主簿廳二名看書五名觀星臺把門四名國子監繩愆廳直廳三名典簿廳直廳二名刑部看監一百三十九名都察院看監一百二十八名五軍都督府直堂各八名府經厯司直廳各四名錦衣衛直堂二十名鎮撫司直廳五名看監三十二名經厯司直廳四名其在外司府州縣官員隨從皂𨽻照京官品級僉撥其公堂皂𨽻弓兵并看監禁子各照原額僉點布政司按察司直堂皂𨽻各三十名把門各六名各司經厯司照磨所直廳各四名都司斷事司布政司理問所直廳各八名把門各二名各府直堂皂𨽻十六名把門四名各州直堂皂𨽻十二名把門二名各縣直堂皂𨽻八名把門二名各府經厯司照磨所直廳各四名各州吏目廳各縣典史廳各二名成化十四年令凡各官丁憂升除等項去任名下皂𨽻銀兩封收送官選補復任在一月以裏者全送兩月以上者照扣一年之上不曽除補者盡數扣除收過柴價不久改升事故等項除三月以裏免扣其餘悉令還官應用如缺官日久日月已滿仍照日期扣算其扣除銀俱送戶部收貯備荒年終造册進繳𢎞治初令凡兩京公使并倉庫稱子等役不願應當者每名嵗出工食銀十兩十一年令各處解到柴薪價銀本部收貯該司行移應得皂𨽻衙門知會各該衙門差人賫文赴司關領分送各官其改升事故等項各該衙門即日查算除任內應得外悉扣還官其續任補缺但以到任之日為始補與應得之數十五年令郡王將軍府教授典膳每員皂𨽻一名郡王府教授典膳皂𨽻民間僉撥二名每名止許辦柴薪銀八兩將軍下教授係吏部除授由學校出身者仍與皂𨽻一名許辦柴薪價銀一十二兩係本處軍民舍餘出身者不與又令凡解到皂𨽻不必拘定某州縣𣲖撥某衙門但從本部將各衙門擬定次序皂𨽻以到部之日為序三品以上官嵗該皂𨽻十名十二名者俱先撥三名四品官該六名者先撥二名九品以上官該二名二名四名者俱先撥一名譯字等官該一名者俱先撥半名各照次序周而復始大率一品二品官嵗該十二名者上半年以裏不許撥過六名四品官該六名者上半年以裏不許過三名餘官倣此武學國朝自正統以來承平日久天下軍衛子弟多習儒業延至邊徼亦或設學建官以教之其在京師勳戚子孫襲爵及被選尚主者亦學于國子監至於各衛幼官與子弟未襲職者資多可教於是兩京並建武學嚴立教條儲養訓習以備任用其子弟有志科目者亦許應試設教授訓𨗳品秩俸廪如京府儒學之制教條係本司掌行因具載之事例正統初奏定教條一幼官及武職子弟所讀之書小學論語孟子大學內一本武經七書百將傳一本每日總授不過二百字有志者不拘必須熟讀三日一溫就於所讀書內取一節講説大義使之通曉春夏秋月每日辰時初刻入學至未時末散冬月申時散一都指揮等官年長者止令五日一會聽講其會講之日教授訓𨗳咸在內輪一員以大誥武臣厯代鑑百將傳及古今名臣嘉言善行內據一段升座講説務在坦直明白易曉各官齊班祇揖立聼有未曉者許其請問再為解説務使粗知大義講罷祇揖而散其幼官子弟亦隨後聽講一幼官子弟日寫倣紙一張率以百字為率有志者不拘一幼官子弟有事請假先自訓𨗳以達教授明立假簿量事繁簡緩急定與限期依限赴學一都指揮等官升堂聽講執弟子禮不係聽講之時相見各以禮待其幼官以下常在學肄業者必行師弟子禮一都指揮等官聽講之日遇有公差及當操之日皆須報知本學明注簿籍事畢仍前會講幼官內有領隊管隊官如遇操練之時分作兩班輪下教場三日一換亦須報知本學明注簿籍操畢仍前赴學不該操者依舊在學一本學置紀過簿一扇都指揮等官有犯學規者學官以言訓飭不從者明書其過三次不改具呈總兵官隨宜懲戒其餘幼學子弟有犯量情責罰一提督御史下學悉依憲綱禮儀其勉勵官員子弟須稽考勤惰量加警飭毋致廢弛一教官幼官及武職子弟廪饌每人月給食米三斗一武職五十以上者操練聽講以下者入學讀書成化初申定教條一每日早教官升堂幼官子弟序立分東西序揖退俟訓𨗳還齋畫卯背書授書寫倣遇會講之日訓𨗳升堂諸生序立聼講一都指揮等官雖見授三品職事讀書聽講及與教官出入相見並應執弟子禮毋或輕慢以乖禮義一教官表儀後學必正其衣冠謹於言行使學者有所觀瞻不許放肆怠惰粗暴輕率有乖師範一都督以下子弟文學優長有志科目者聽於京闈鄉試果有武藝智謀許府衛從公禮薦以慿應試一每月初二日十六日教官率幼官子弟於城外空地演習弓馬一在京千百戶鎮撫應襲子弟願入武學者聽一在學幼官有䇿略精通人馬熟間者從公禮薦赴部會官試驗奏請任用其餘抱藝八分不及薦舉年二十五以上三十以下者本學查明送部轉發各營聽用一幼官武生肄業外每五日一次習演弓馬各營總兵官兵部堂上官每月各一員下學考驗武庫司籍其功能嵗終檢閲具奏其一次答䇿文理可觀并馬步中五六箭者賞鈔一百貫三四箭者五十貫若積纍至於能專其業可以為將或坐營把總守備者不次擢用十年以上怠於進學者黜退送操一幼官武生考驗纍居優等者十年一次本部會同總兵官舉送各營各衛遇有坐營把總掌印軍政員缺相兼選用其餘盡行黜退别選以後每月考校外另委該司官一員不時點閘逃學十日之上或一次二次者量責半年之上及連逃三次者呈送法司仍追食過饌米還官依例送操其教授等官學行出衆作養成材數多者依國子監官事例升用南京兵部武選清吏司事例凡所屬軍官亡故老疾應襲替及減革者每嵗春秋二季具本起送咨兵部定奪凡軍官亡故老疾子孫幼小應得優給及戶無承襲應優養者行勘明白類咨兵部定奪凡南京各衛所軍政官員照例五年一次會同五府錦衣衛堂上官考選會本具奏若軍政官遇有急缺申呈到部查委見任官員署管候有官之日另行其運糧官員有缺聼漕運衙門移咨本部查不係為事有礙官員行衛起送凡南京軍官為事復職取供抄招年終類咨兵部知會凡軍職係舊官具告比試者勘取供結咨送兵部聽比凡軍官應請誥命行勘明白移咨兵部請給車駕清吏司事例凡皇城各門俱於南京旗手等十三衛揀選精壯官軍輪班守衛從本司委官及科道官不時點閘如牌面字樣糢糊及盔甲什物損壞行移南京工部給換堪修整者收發修整若有違犯照例參奏送問計兩班守衛官軍及帶刀官共六千一百七十九員名一班守衛官一百一十七員旗軍二千九百六十七名帶刀官一十員二班守衛官一百一十八員旗軍二千九百五十五名帶刀官一十二員凡例不勾丁校尉力士年老有疾者勘驗明白類咨兵部具奏放回照例僉補凡南京各營騎操馬匹有缺行令照例支租銀及朋合樁頭銀買補完日行南京太僕寺委官印烙給操凡南京太僕寺每年報到孳生馬駒應印烙者具奏行移都察院差御史同本寺委官印烙其各府州孳生牛犢每三年帶印備用老瘦不堪者變賣銀兩解京凡南京光祿寺等衙門供應牛隻有倒死者送太平門外埋瘞退出老瘦不堪者送典牧所收養候有臕息開呈本司聽用倒死者告行相剝皮張本所具奏類送南京工部轉該庫交收凡南京各衛馬快船公差出給勘合裏河者往回限三箇月限外又過三箇月小甲參問兵部留候聼差者以批回日期扣算上江者限五十日限外過五十日者參問其小甲過半年者并船夫軍餘參問凡馬快船應撥通州聽候者江淮濟川二衛輪流委官給精微批管送凡撥船裝運物件行移南京都察院及該科差御史給事中各一員監視品物用米者一船十五扛至二十扛其餘酌量裝載不許多占夫船其每年撥過船數仍行移兵部以備查考凡馬快船夫甲每十年審實重編民夫逃故者依清軍例勾補官旗人等借倩役使者參奏治罪計南京江淮衛大小馬船四百零九隻濟川衛大小馬船四百零八隻每船一號六百科者民夫五十名三百料者民夫二十五名江淮關擺渡馬船二隻新江關擺渡馬船二隻浦子口擺渡馬船二隻龍江關擺渡馬船二隻儀真擺渡馬船四隻南京錦衣等四十衛快船九百五十八隻每船小甲一名軍餘十四名撥船厰把總指揮三員造船厰把總指揮三員錦衣等衛管船撥船委官八十員凡南京會同館從本司提督計本館館夫五十九名馬四十五匹馬夫四十五名鋪陳四十五副驢三十頭驢夫三十名鋪陳三十副凡南京刑部送到軍伴編發南京錦衣衛各所充當凡會同館江淮濟川等衛應天等府滁和二州修造船隻歇役地租工食馬驢鋪陳等項價銀俱本司收受內租銀送應天府寄庫其餘聼候支用職方清吏司事例凡南京裏城正陽等一十三門外城江東等一十八門關俱於各衛揀選精壯官軍守把從本部委官與科道官不時點閘凡各營及江操官軍俱有原奉敕管操武臣統領操練從內外守備及本部參贊官閲視本部仍委官一員並行南京科道差官不時點閘計營操四處大教場小教場神機營凡驗軍及存恤新軍俱照在京事例武庫清吏司事例凡南京各衛所逃故軍匠發册該府州縣清勾其原籍無丁者聽該府州縣差人賫文查理備由批回凡在外軍民戶籍不明解查者本司揭查軍册行南京戶部於後湖查民册備抄類行原籍以慿開豁凡南京京衛武學從本司提調每月本部堂上官照例下學考驗凡南京各衙門皂𨽻照例差撥其撥剩及扣除還官者收貯本司以備災傷州縣撥補明會典卷一百二十五
