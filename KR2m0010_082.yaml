body:
  text: 明會典卷八十二禮部四十一祭祀三祭社稷春秋仲月上戊日國初太社太稷異壇同壝祭太社以后土勾龍氏配祭太稷以后稷氏配每獻禮先詣太社及配位壇前獻畢方詣太稷及配位壇前行禮洪武十年改建社稷壇于午門外之右同壇同壝壇上層方五丈第二層方五丈三尺高五尺四出陛用五色土隨方築之先是社主用石高五尺闊二尺上微尖立於社壇上半埋土中近南向北稷不用主至是埋石主於社稷壇之正中微露尖于外壝垣四靣開靈星門垣之色亦以四方色飾之臨祭時奉太社神牌居東太稷神牌居西俱北向奉仁祖神牌配神西向至是始罷勾龍后稷配位自奠帛至終獻皆同時行禮洪武三十一年後更奉太祖配神永樂中北京社稷壇成位置陳設俱與南京舊制同洪熙後始奉太祖太宗同配諸司職掌一齋戒與祭太廟禮同一告廟祝文與大祀同正祭前二日用祝文酒果奉先殿告仁祖配社稷後告太祖太宗同配社稷一省牲禮與太廟同今牛三今四羊三今四豕三四鹿一兔二一正祭陳設太社在東北向犢一羊一豕一登一鉶二籩豆各十二簠簋各二帛一黑色禮神制帛玉用兩圭有邸太稷在西北向陳設同仁祖配位在東西向陳設同無玉後太祖太宗配位俱在東西向陳設並同無玉共設酒尊三今四爵九今十二篚三今四于壇西北東向祝文案一一儀注典儀唱樂舞生就位執事官各司其事導引官導引皇帝至御位內贊奏就位典儀唱瘞毛血迎神奏樂樂止內贊奏四拜百官同典儀唱奠玉帛行初獻禮奏樂執事官各捧玉帛爵獻于神位前讀祝官取祝跪于神位左內贊奏跪典儀唱讀祝讀訖進于太社神位前內贊奏俯伏興平身百官同樂止典儀唱行亞獻禮奏樂執事官各捧爵獻于神位前樂止典儀唱行終獻禮儀同亞獻太常卿進立于壇西東向唱賜福胙光祿司官捧福胙自神位前由正門左出至皇帝前內贊奏搢圭光祿司官以福酒跪進內贊奏飲福酒光祿司官以胙跪進內贊奏受胙出圭俯伏興平身內贊奏四拜百官同典儀唱徹饌奏樂執事官各詣神位前徹饌樂止典儀唱送神奏樂內贊奏四拜百官同樂止典儀唱讀祝官捧祝進帛官捧帛掌祭官捧帛饌各詣瘞位奏樂內贊奏禮畢一祝文維洪武某年某月某日皇帝敢昭告于太社之神太稷之神惟神贊輔皇祇發生嘉穀粒我蒸民萬世永賴時當仲春秋禮嚴告祀報謝謹以玉帛牲齊粢盛庶品備兹瘞祭皇考仁祖淳皇帝配神尚享後太祖聖神文武欽明啓運俊德成功統天大孝高皇帝太宗體天𢎞道高明廣運聖武神明純仁至孝文皇帝配神一樂章迎神豫惟土穀兮造化功為民立命兮當報崇民歌且舞兮朝雍雍備筵率職兮候迓迎想聖來兮祥風生欽當稽首兮告拜年豐初獻氤氲氣合兮物遂蒙民之立命兮荷隂功豫將玉帛兮獻微衷初斟醴薦兮民福洪亞獻豫今樂舞兮再捧觴願神昭格兮軍民康思必穆穆兮靈洋洋感厚恩兮拜祥光終獻干羽飛旋兮酒三行香煙繚繞兮雲旌幢豫今稽首兮欣且惶神顔悅兮霞彩彰徹饌俎陳微禮兮神喜將琅然絲竹兮樂舞揚願祥普降兮遐邇方蒸民率土兮盡安康送神氤氲氤氲兮祥光張龍車鳯輦兮駕飛揚遙瞻稽首兮去何方民福留兮時雨暘望瘞捧肴羞兮詣瘞方鳴鸞率舞兮聲鏗鏘思神納兮民福昻豫今稽首兮謝恩光事例洪武元年議定社稷壇臨祭若遇風雨於齋宫望祭三年於壇北建祭殿五間又北建拜殿五間以備風雨祭祀四年定祭太社太稷正位用祝文配位不用十年本部議社稷合祭共為一壇皆設本主而丹漆之祭則設于壇上祭畢復奉貯于庫太祖太宗陳設同前祭山川仲秋國初建山川壇於天地壇之西正殿七間祭太嵗風雲雷雨五嶽五鎮四海四瀆鍾山之神東西廡各十五間分祭京畿山川春夏秋冬四月將及都城隍之神壇西南有先農壇壇東有旗纛廟壇南有藉田一所今京師山川壇建於永樂中位置陳設俱與南京舊制同惟正殿鍾山之右添祭天壽山之神諸司職掌一齋戒凡齋戒前一日太常司官宿于本司次日具奏本奏致齋二日次日進銅人凡正祭前二日太常司官同本部官詣城隍廟發咨一省牲禮與太廟同十牛十四今十五羊十三今十四豕四今十五鹿一兔七一正祭陳設正殿七壇太嵗犢一羊一豕一登一鉶二籩豆各十簠簋各二帛一白色禮神制帛酒盞三十風雲雷雨陳設同帛四白色禮神制帛五嶽陳設同帛五五色禮神制帛各依方位下同五鎮陳設同帛五五色禮神制帛四海陳設同帛四四色禮神制帛四瀆陳設同帛四黑色禮神制帛鍾山陳設同帛一白色禮神制帛天壽山增陳設同帛一黑色禮神制帛共設酒尊三爵七篚七于殿東南西向今爵篚各八設祝文案于殿外正道西東廡三壇京畿山川犢一羊一豕一登一鉶二籩豆各十簠簋各二帛一白色禮神制帛酒盞三十夏季月將陳設同帛三白色禮神制帛冬季月將陳設同帛三白色禮神制帛共設酒尊三爵三篚三于壇南北向西廡三壇春季月將秋季月將陳設同前都城隍陳設同帛一白色禮神制帛共設酒尊三爵三篚三于壇南北向一儀注典儀唱樂舞生就位執事官各司其事導引官引皇帝至御位內贊奏就位典儀唱迎神奏樂執事官各詣神位前斟第一層酒樂止內贊奏四拜百官同典儀唱奠帛行初獻禮奏樂執事官各捧帛爵獻于神位前讀祝官取祝跪于皇帝左內贊奏跪典儀唱讀祝讀畢置于案上內贊奏俯伏興平身百官同樂止典儀唱行亞獻禮奏樂執事官各詣神位前斟第二層酒樂止典儀唱行終獻禮執事官各詣神位前斟第三層酒樂止太常司卿立於殿東西向唱賜福胙典儀唱飲福受胙光祿司官捧福胙自神位前由正門左出至皇帝前內贊奏跪搢圭光祿司官以福酒跪進內贊奏飲福酒光祿司官以胙跪進內贊奏受胙出圭俯伏興平身奏兩拜百官同典儀唱徹饌奏樂執事官各于神位前徹饌樂止典儀唱送神奏樂內贊奏四拜百官同典儀唱讀祝官捧祝掌祭官捧帛饌各詣燎位奏樂內贊奏禮畢一祝文維洪武某年某月某日皇帝致祭于太嵗之神風雲雷雨之神嶽鎮海瀆山川城隍之神惟神主司民物參贊天地化機發育有功歷代相承有秋報之禮今農事告成謹以牲帛醴齊粢盛庶品用伸報祭尚享一樂章迎神吉日良辰祀典式陳太嵗尊神雷雨風雲京畿山川城隍之神濯濯厥靈昭鑒我心以候以迎來格來歆奠帛靈其涖止有赫其威一念潛通幽明弗違有帛在篚物薄而微神兮安留尚祈享之初獻神兮安留有薦必受享祀之初奠兹醴酒晨光初升祥徴應候何以侑觴樂陳雅奏亞獻我祀維何奉兹犧牲爰酌醴齊二觴再升洋洋如在式燕以寧庶表微衷交于神明終獻執事有嚴品物斯祭黍稷非馨式將其意薦兹酒醴成我常祀神其顧歆永言樂只徹饌春祈秋報率為我民我民之生賴于爾神維神佑之康寧是臻祭祀云畢神其樂歆送神三獻禮終九成樂作神人以和既燕且樂雲車風馭靈光昭灼瞻望以思邈彼寥廓望燎俎豆既徹禮樂已終神之雲旋倐將焉從以望以燎庶幾感通時和嵗豐惟神之功事例洪武二年封京都及天下城隍神三年正嶽鎮海瀆城隍諸神號又命合祀太嵗四季月將風雲雷雨嶽鎮海瀆山川城隍旗纛諸神又奏準自今遣官祭山川壇諸神春用驚蟄後三日秋用秋分後三日獻官及陪祀執事官皆前期齋戒三日至日清晨上服皮辨服御奉天殿降香中嚴升御座以待祭畢獻官回奏解嚴還宫七年令祭山川諸神於春秋仲月上旬擇日後又以孟春郊祀時諸神既預祭壇內二定以仲秋祭社稷後擇日祭之十年令祭山川諸神上親行中七壇禮餘壇以功臣分祀明會典卷八十二
