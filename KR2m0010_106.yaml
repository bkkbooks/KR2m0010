body:
  text: 明㑹典卷一百六兵部一諸司職掌尚書侍郎之職掌天下軍衛武官選授之政其屬有四曰司馬職方駕部庫部後改司馬為武選駕部為車駕庫部為武庫職方仍舊俱稱清吏司武選清吏司諸司職掌郎中員外郎主事掌武官勳祿品命銓選本司銓選除勳祿詳見吏部其官制資格及除授襲替升用總小旗俱有舊行及新增事例未該載者今各以類附見於後官制諸司職掌凡內外大小軍職衙門官員俱有額數後武職升授漸多不拘額數但有見任帶俸之别都督府左都督右都督都督同知都督僉事留守司正留守副留守指揮同知都指揮司都指揮使二員都指揮同知二員都指揮僉事四員衛指揮使一員指揮同知二員指揮僉事四員衛鎮撫二員所正千户一員副千户二員所鎮撫二員百户一十員儀衛司儀衛正一員儀衛副二員典仗六員洪武三十年改土官屬本部續附於後宣慰使司正官宣慰使各一員同知各一員副使各一員僉事各一員宣撫司正官宣撫各一員同知各一員副使各一員僉事各一員安撫司正官安撫各一員同知各一員副使各一員僉事各一員招討司正官招討副招討長官司正官長官副長官蠻夷官司長官副長官蠻夷官苖民官千夫長千夫長副千夫長勳祿諸司職掌凡武官一品至六品所授上柱國至武騎尉曰勳嵗支俸米曰祿遇有除授官員須要明白照品定擬其品級次第詳於吏部職掌武官資格諸司職掌凡內外軍職官員俱有原定資格正一品左都督右都督從一品都督同知正二品都督僉事正留守都指揮使從二品都指揮同知正三品副留守都指揮僉事各衛指揮使從三品留守司指揮同知各衛指揮同知正四品各衛指揮僉事正五品儀衛正正千户從五品衛鎮撫儀衛副副千户正六品典仗百户從六品所鎮撫土官資格從二品宣慰使正四品宣慰司同知從四品宣慰司副使宣撫司宣撫正五品宣慰司僉事宣撫司同知從五品招討司招討宣撫司副使安撫司安撫正六品副招討宣撫司僉事安撫司同知從六品安撫司副使長官司長官正七品安撫司僉事蠻夷官司長官從七品蠻夷官司副長官除授官員諸司職掌凡武官或有功升除或調除别衛或為事復職若見缺官員應合調補遇有前項官員到部須要審取從軍腳色委官賫赴內府比對貼黃中間歸附年月征克地方升轉月日衛所流官世襲相同然後具本明著緣由連人引至御前陳奏請㫖轉調除授或奉特㫖升遷隨將欽與職事花名衛所流官世襲及升調緣由就於御前升選仍照選簿內條寫榜文次日入奏將引選過官員看畢抄榜給慿定限到任仍行該府轉行所在衛所催任繳慿事例洪武初令護衛儀衛司等官升除王具本奏知從兵部選授三十五年令在京武職有願調除外任者聽原管事者管事原帶俸者帶俸永樂初令凡奉天征討守城征哨拏人有功欽升都督都指揮者照洪武舊制與流官見升指揮除已定流世者仍舊未定者俱與流官其千百户鎮撫儀衛正副典仗俱與世襲若係致仕官及因官下舍人除授并義男女壻等項襲替者俱與流官已行厯功與世襲者仍前世襲各衛所官旗軍有全城歸順江上朝見并招船招人擒首奸惡逃叛等項欽升官員若係洪武年間原授職役今升千百户衛所鎮撫者俱與世襲升指揮者與流官革除年間升授及德州等處選署今升職者亦與流官其各都司衛所官有革除年間除授及德州等處選署曽經管事者與流官止終本身十年令總兵官在外遇官軍有功合與官者先諭告使知具姓名功蹟奏聞除授凡武官升試職未經實授者須立功方許實授宣德三年令凡內官傳㫖除授官員不問職之大小有𠡠無𠡠皆須覆奏然後施行本部奏定武選條式一腳色二狀貌三才行四封贈五襲廕仍具有無殘疾從親管及同僚同隊及首領官保勘以慿稽考正統三年定官員調衛例南京及江南直𨽻調北京附近衛所北京直𨽻并江北直𨽻山東調山海宣府等衛所山西河南調大同延安綏德等衛所陜西調甘肅寧夏衛所浙江江西調福建廣東衛所湖廣調貴州四川衛所福建調廣東廣東調廣西四川調雲南雲南調廣西廣西調貴州四年令額外多餘武職聽於有糧衛所添注景泰二年議淮軍職與王府姻親者但係方面重任改調其護衛及外衛官俱不必調天順元年令錦衣衛官為事復職雖遇赦仍調在京别衛𢃄俸王府官為事復職者亦調衛成化十四年奏准在外各衛指揮以功升都指揮者俱改注都司在內者仍舊𢎞治七年令王親同城居住及附近者查係見任調五百里之外管事願帶俸者存留其王妃夫人郡主縣主亡故年久無親生子者王親子孫並許推用管事不在帶俸改調之例凡軍官給慿南京上十二衛并南北直𨽻衛分給本衛慿五府屬衛給該府慿中都留守司及外都司屬衛給各司憑凡單本選過軍職遇大選仍通類具本附選凡職官人等不由銓選推舉朦朧奏請以圖進用及夤緣奔競乞恩傳奉沮壞選法者職官問罪降級調衛旗軍舍餘問發邊衛俱𢃄俸食糧差操升賞功次軍職官有功查勘明白造册到部當升賞者各照立功地方則例具奏升賞其論功以捍禦北敵為首朵顔三衛次之西畨及苖蠻又次之內地反賊又次之其捕盜并緝獲妖言亦有升賞之例附見於後事例洪武十九年令從征官沒於陳所者子孫襲職升一等二十九年令各衛指揮千百户獲倭船一艘及賊者升一級賞銀五十兩鈔五十錠在船軍士生擒殺獲倭賊一人者賞銀五十兩陸地交戰生擒殺獲一人者賞銀二十兩三十五年令官軍對敵之際能立竒功者升二級頭功升一級次功不升永樂四年令一家陳亡二三人者升二級宣德九年定南方殺蠻賊例凡斬賊首三顆以上及斬獲首賊者俱升一級斬首一顆俘獲一二人斬從賊首一顆以上及目兵兵欵有功者俱加賞不升㬌泰元年令馬邑等處當先殺賊者百户所鎮撫以上升署職一級總旗以下升實授一級不賞軍職舍人有冠帶者升實授百户無者升所鎮撫文職舍人升試所鎮撫義男餘丁人等不分有無冠帶俱升小旗有不願者俱給賞其南方金沙江等處頭功四次三次及衝冒瘴毒亡者升一級陳亡者升二級二年令遼東官軍二次當先斬獲敵首馬匹者升一級加賞被傷及戰回死者升一級陳亡升二級俱給賞一次斬獲者升一級不賞三年令貴州香爐山等處獲功九次至十七次者升一級內百户所鎮撫以上殺獲三名顆者升實授不及數者升署職四年令父在而子孫隨軍陳亡别無應繼者升其父二級五年令自已獲功該升而同籍親人有陳亡無嗣者許併其功於見存之人通論升賞六年令浙江福建殺賊官軍獲功五次至七次者升一級不賞民快人等冠𢃄終身陳亡者與其子冠帶仍給賞一次至四次給賞不升天順元年令陜西殺敵領軍官并敵退劫營兵丁當先敗敵及擒斬首級為首并陳亡者俱升一級給賞齊力向前並生擒斬獲為從者給賞不升其南方誘獲苖蠻僞王侯殺賊二十五次至三十九次斬首三顆擒賊首一二名及陳亡者升一級給賞十三次至十九次斬首三顆者升一級不賞殺賊二十五次至三十九次斬首不及數及陳亡土官人等俱加賞不升凡土官有功無升例六年令擒斬畨敵一名顆為首升一級不賞為從及傷故者給賞不升七年令六次先登殺敗敵兵者升一級加賞三次及陳亡者升一級給賞齊力策應者給賞不升成化二年令官軍妄報功次冒受升賞者事發革去仍降原職役一級調衛差操四年令四川平山都掌官軍擒斬八名顆以上及俘獲男女者升二級加賞七名顆以下有俘獲及陳亡者升一級量賞五名顆以下有俘獲升一級不賞三名顆以下及土官擒斬四名顆以上與陳亡土兵俱加賞不升六年令夜不收出境哨探被賊殺死者升賞依陳亡例奪去馬匹免追十四年申明升賞功次一甘肅寧夏陜西延綏偏頭關大同宣府山海關一帶外兵一人擒斬一名顆升一級至三名顆升三級二人共擒斬一名顆為首升一級至三名顆升三級驗係壯男與實授幼男婦女與署職為從及四名顆以上俱給賞一遼東女直一人擒斬二名顆升一級至六名顆升三級驗係壯男與實授幼男婦女與七名顆以上并不及數者俱給賞不升一陜西甘肅四川貴州湖廣兩廣畨賊苖蠻一人擒斬三名顆升一級至九名顆升三級驗係壯男與實授幼男婦女與十名顆以上并不及數者俱給賞一內地反賊一人擒斬六名顆升一級至十八名顆升三級驗係壯男與實授幼男婦女與十九名以上并不及數者俱給賞其功次須驗不係一日一處者方如前例若係一日一處之數止擬一級其餘給賞陳亡官軍與哨探被殺夜不收人等俱升一級一陳前刀箭重傷者升署職一級當先次數多者分别等第加賞無傷而當先數多者止給賞有輕傷者亦加賞一俘獲賊屬人口奪獲頭畜器械并齊力助陳者量賞人口就給俘獲原主一把總領軍官所部五百人擒斬敵兵五名顆升一級每五名加一級所部一千人者十名顆升一級每十名加一級俱至三級而止二級實授一級署職若係都指揮使以上止升署職二級其餘加賞别種賊冦推類而行已升之外功次更多并不及數者給賞一陳前當先殿後斬將搴旗擒斬賊首等項竒功臨時奏擬升賞一土官功次各照前項地方則例升散官至三級而止其餘功次與土人俱厚賞不升一報捷官舍人等以擒斬敵兵多寡為等第七十名顆以上賞衣服一套九十名顆以上者賞鈔一千貫升一級一百十名顆以上賞衣服一套升試所鎮撫别種賊冦遞加女直三倍畨賊苖蠻六倍反賊十倍一軍人有功升一級至小旗舍人升一級至冠𢃄小旗小旗升一級至總旗冠帶小旗升一級至冠帶總旗總旗升一級至試百户冠𢃄總旗升一級至實授百户試所鎮撫升一級至實授所鎮撫實授所鎮撫升一級至實授百户百户升副千户副千户升正千户正千户升指揮僉事僉事升指揮同知同知升指揮使該升都指揮都督者類推而行其軍人舍人至小旗小旗至總旗舍人至試所鎮撫總旗至試百户俱無署職惟百户以上聽以次署升其署職至實授亦作一級有緣事該降即以此為則遞降一官軍人等爭奪擒斬功次者不許紀録一詐冒功次者勘問降一級功次不准一出師監督總兵等官并鎮守總兵巡撫紀功供給等官班師之日本部照功次册具奏升賞凡逺年功次不許奏擾𢎞治元年令領兵守備官不得自報功次所部旗軍斬獲不及五名顆者領軍官不准陛賞十三年奏准跟隨內臣將官頭目不分有無職役若非奏帶不許報功果係奏𢃄獲功該升職役只合注於本管衙門不許希求注於錦衣衛違者該升職役俱革罷扶同勘報者參究治罪凡臨陳報有斬獲賊級者紀功官從公審驗若用錢買者賣者俱問罪係官旗就在本衛係軍發邊衛民并軍丁人等發附近俱充軍若外兵扺邊官兵明知被獲人口遺棄在彼囚而妄殺冒作賊級者與殺平人者一體論斷凡擅殺平人報功其本管將官頭目失於黔束者問罪量其所殺多寡輕則降級調衛重則罷職充軍俱奏請定奪捕盜緝獲妖言附明令凡常人捕獲强盜一名竊盜二名各賞銀二十兩强盜五名以上竊盜十名以上各與一官名數不及折算賞銀應捕入不在此限事例宣德元年令擒獲强盜賞鈔二千貫為首官旗軍校升一級民匠人等免差役一年十年令凡軍官於所轄地方擒獲强盜即係應捕人員不准升賞若不係該管地方及公差在外擒獲者指揮四名以上千户衛鎮撫三以上百户所鎮撫二名以上照例升賞旗校軍民匠役等不限地方成化二年令緝獲妖言提督官升一級官校給賞十九年令官校捕盜至三百名以上提督官升一級𢎞治二年令捕獲出境妖人搆結邊外謀為不軌為首者升一級為從升一級十年令捕盜至四百名以上者提督官升一級推舉事例凡五軍都督府缺掌印管事官本部具奏㑹官於公侯伯都督內推舉錦衣衛缺掌印管事官於本衛及各衛指揮等官內推舉中都留守司缺正副留守於皇親勳舊及內外武臣并保舉將材內推舉考選軍政事例宣德八年令在外都司衛所缺軍政官行巡按御史及按察司等官公同考選每都司及衛俱掌印官一員佐二官二員每千户所俱掌印官一員非遇緊急軍情不許輒調成化二年令軍政官每五年一次通以見任掌印帶俸差操及新襲職官一體考選八年令帶俸武職先雖犯罪後能改過自新父祖雖為事或脫逃子孫能自立行止有守有為者並許考選管事十三年議准㑹同五府官將所屬官員通行考選每衛不限指揮使同知僉事共三員衛鎮撫一員如無鎮撫選相應千户署管每所不拘正副千户一員百户十員專管軍政俱限年二十五嵗以上五十嵗以下有六十以上精力未衰者驗實存留見任不敷許選别衛先儘見任次𢃄俸後遇在外五年之期在京亦復舉行南京衛所照例其終身帶俸官除犯貪淫五年之外能改過自新者從巡撫巡按官保用十五年令軍政急缺在外從巡撫巡按定委奏保兩京從各衛軍政首領官保舉五府覆勘係親軍者兩京兵部覆勘定奪不拘五年後犯貪淫等罪連坐舉主十六年令騰驤等四衛官員有不職者聽本部及科道官察訪舉劾二十一年令百户襲職回衛就得管事不在考選之例𢎞治七年令南京各衛所軍政員缺不許以千户署衛事百户署所事漕運有缺亦行南京兵部照軍政事例選補不許坐名行取掌印佐二官員代替十三年申明凡軍職五年考選有營求囑託者指名黜退永令𢃄俸其不得與選生事教唆陷害己選官員者問罪不分官軍俱調邊衛帶俸食糧差操凡帶俸官俱不許管軍管事襲職替職諸司職掌凡軍官亡故年老征傷須以嫡長兒男承襲替職或嫡長男早喪及篤廢殘疾則嫡孫襲替如無嫡子嫡孫則庶長子孫襲替若嫡庶子孫俱無方許弟姪襲替其應合承繼弟男子姪務要曾經操練弓馬熟間并當該衛所正官保結呈送其審供查黃引選等項緣由並與除授官員相同事例凡左右都督至都指揮僉事俱係流官有缺從朝廷升調不許世襲洪武十八年令武職年五十之上者許以子替職二十二年令都指揮原係世襲指揮使者出職仍授世襲指揮使若指揮同知升都指揮同知者出職仍授指揮同知二十九年令祖從軍父為事典刑襲祖職父從軍兄為事典刑襲父職父從軍就為事典刑者發充軍三十年令武職子孫應襲替而無文書來告者不准襲永樂元年令官舍旗軍餘丁曽厯戰功升授職役者其子准承襲無子其父兄弟姪見受職役小者俱准襲職事相等無應襲者義子女壻不准襲若先不曾立功就與職役後亦無戰功者不准襲指揮千百户子弟隨征有功升指揮千百户後又征進有功升職者准承襲不曽征進者不准若已致仕後有功升職亡故并告代者原替職或見支優給子孫職任小者就與父兄所升職事若職事相等不許以次子孫别襲十一年令新官義男女壻已襲流官一次者不許再襲十二年令武職犯罪充軍者子孫襲職俱調衛犯强劫典刑者子孫襲祖職調沿海衛十五年令委保襲替詐冒不實者本身及保勘官俱罷職揭黃永不許襲宣德四年令武職及子弟有犯不孝并蒸父妾收兄弟之妻敗倫傷化者不許復職承襲永為定例五年令武職守城失機貽患邊方者不准襲十年奏准武職并子弟有犯不孝并敗倫傷化者本身問罪許子孫承襲嫡長有犯嫡次子孫承襲正統二年令武職應襲子孫十年之內人文到部者准令襲若止移文往來人不到部雖稱患病事故而月日在十年之外者不准襲若原籍行移回報雖出十年而曽於限內告者亦准襲七年令武職故而嫡長子孫年十嵗以下者庶男弟姪許借職候嫡長出幼令還職違者充軍十嵗以上不許本部議准侍衛將軍係永樂年間世襲千户者子孫襲替授百户係實授百户試百户者襲替授總旗十四年令武職臨陳退怯致所部失陷二十人者不准襲有犯不孝致典刑者取祖父以次子孫承繼本犯子孫不許景泰三年令武職有因年逺及典刑等項例不應襲而有嫡子孫弟姪者給與冠𢃄操備月支米一石有功照舍人例升賞四年令納粟補軍職者不准襲天順元年奏准武職自永樂後升官不以軍功者總小旗比試中箭升職者總小甲冒補總小旗後有功升職者永樂年間王府保升官無世襲者皇親及內官家人傳奉升職及保升者襲替俱减革三年令擒獲强盜升職者不准襲成化元年令正統十四年守城有功升職者被兵走回遇駕拏馬及出使瓦剌乞升者天順初迎駕升者擒獲妖言升者俱革不准襲六年奏准武職絶嗣許從軍立功一祖子孫承繼其為原籍疏族不許凡納粟官例許承襲止許子與孫承襲八年令武職原係帶俸者子孫襲替仍帶俸係管事者仍管事十三年令試職署職遇天順元年及八年例實授者襲替俱减革十四年令武職降調充軍本身在不准襲十五年令納粟招軍升職者俱承襲三輩革其自己立功升官後為事罷職及充軍者革十七年奏准武職絶嗣傍枝不許承襲如己襲者不許再襲義男女壻詐冒承襲不改正者照例治罪二十一年令內外武職有犯强盜典刑者子孫不許承襲調邊衛充軍二十二年令降級官見在而子孫願就見降職事者准令襲逃官不知去向三年者亦准襲被告脫逃該徒以上問革為民者至六十乃許襲𢎞治元年奏准武職襲替有請託內外權要乞升官職者照奸詐犯法在逃例革職為民取應繼子孫承襲三年奏准傍支承襲例如髙曾祖原係功升總小旗以後從曾伯叔祖或從伯叔祖堂伯叔又立功升都指揮革襲試百户千户革襲署百户子孫准承襲百户革充冠𢃄總旗一輩子孫止替旗役其試職署職如無軍功雖遇例不許實授若髙曾祖不係功升旗役者傍支子孫不准承襲四年令緝獲謀反犯人升職者襲二輩革招撫夷人升職者襲一輩革强盜窩主不分贓及不行者襲職降一等五年令武職為人命典刑者子孫襲職調别衛為事脫逃革職者子孫仍照舊例襲職六年奏准侍衛將軍係永樂二十二年七月十八日以前升除者准世襲以後遞加减革其减革依正統七年例七年令武職有犯劫盜問擬明白者不分典刑監故子孫永不許襲其已前充軍襲調事例更不施行本年奏准護衛官有選充儀賔者子仍襲本衛九年令應襲舍人犯劫盜者弟姪照祖職降一等承襲該優給者依此例十一年令妄保襲替者不分受財不受財及借職病故致仕悉照永樂十五年例施行十二年令武職一祖從軍代役立功之人絶嗣者其親弟姪並許相沿承襲弟姪長房絶嗣次房子孫為堂兄弟者亦准襲若隔一二輩不曾承襲今來告者其原立功之人係指揮者减襲試百户千户减襲署百户百户替冠帶總旗一輩以後止替總旗若堂伯叔兄弟旁支子孫不分己未襲替俱不許襲十三年奏准武職子孫襲替被人奏告姦生乞養倫序不明等情已經勘明繳告到部而原告又行奏告者軍調邊衛民發口外為民原詞立案凡武職乞恩升者不准襲報捷升者不准襲缺唇跛足矮短殘疾不准襲舍人有功升職過於父祖者子孫襲所升職開原職不及父祖者襲原職開所升職嫡長男已襲職嫡次有功升職而絶嗣者别支不許襲襲職官為事革罷者子孫襲祖職凡武職為事械故監故未復職者問發立功病故者子孫襲職俱調衛凡調衛者子孫襲替不得還原衛凡武職年未六十有告殘疾願替職者在內從本部驗實在外從原衛勘明本部查照引奏附選凡軍職襲替有不由軍功例該减革而揑奏官吏沮壞選法者問調邊衛帶俸凡軍官子孫襲替其經該官司查勘明白過違二年不與保送并勒要財物者問發𢃄俸差操土官襲替事例洪武二十七年令土官無子許弟承襲三十年令土官無子弟而壻為夷民信服者令壻襲或許其妻襲永樂十五年令土官告襲雖出十年亦准襲正統二年奏准土官應襲者預為勘定造册在官依次承襲天順八年令土官告襲者勘明㑹奏就彼冠帶𢎞治二年令土官應襲子年五嵗以上者勘定立案告襲之日年十五以上即令襲職如年未及暫令協同流官管事五年令土官襲職後令習禮三月回任管事十三年奏准土官襲替有撥置不該承襲之人爭奪讎殺者俱問發極邊烟瘴地充軍夷人襲替事例洪武永樂年間降附逹官亡故者子孫襲替降一級正統間令海西建州等女直襲替授職二十五年升一級成化間令逹官襲替免降級新遷安插者許就衛所襲替係流官者仍减襲其海西等女直襲替乞升不拘父子但乞一次者不許再乞𢎞治六年令海西等處人告襲者查原齎𠡠書除天順以前升授職事俱仍舊成化以後乞升者都指揮行大通事勘明即與襲替都督仍行鎮巡等官勘奏定奪其襲升誥𠡠人給一道係總𠡠者悉與除銷凡哈密等處使臣求襲父職者查有原降誥𠡠照例襲替換給誥𠡠其餘外夷乞討官封俱臨時奏請定奪比試事例凡遇內外襲替官舍比試行移中軍都督府㑹同內外官於大教場內令官舍跪聽聖諭畢給事中㸃定對數錦衣衛官校看守每馳馬越一墻一溝開弓發箭矢凡三矢畢兩人相向馳馬使鎗箭俱中鎗不避利便者鳴鑼二聲為雙收一聲者為單收不鳴者為不中查例施行洪武初令應襲子弟送都督府比試騎射間習始許襲替若年幼者紀名候長比試然後襲替二十七年令子弟未及二十嵗者襲職至年二十乃比試年及者即與試初試不中襲職署事食半俸二年後再比中者食全俸仍不中者降充軍雲南土官襲職免比試永樂初令洪武三十一年至三十五年奉天征討獲功升職者為新官子孫年十六出幼襲替免比試三十一年以前者為舊官子孫年十五出幼襲替俱比試永樂元年以後獲功者出幼比試與舊官同六年令比試一次不中者發開平再試不中者發交址三試不中者發烟瘴地面俱充軍别選子弟襲職十年復舊制再比不中仍令食半俸三試不中者發充軍十二年令四川護衛官襲替就彼比試正統間令比試違限係無力者三年以上住俸二年半二年以上住俸一年一年以上住俸半年十二年令武職𨽻雲南都司者依守備官例就本處㑹官比試景泰四年令冠帶總旗署百户事者承襲照例比試𢎞治六年令比試不中者悉照永樂十年例施行十二年令武職自來不曾比試者子孫襲職俱住俸三年升用總小旗併鎗附諸司職掌凡總小旗缺役務選年深精壯勇敢軍人小旗併鎗軍人併鎗得勝升小旗小旗併鎗得勝升總旗須慿各府照會開繳當該衛所保結文狀到部然後類寫具奏請㫖准用仍咨呈該府行下各該衛所收補或奏㫖取用年深總旗除授須自各衛取勘從軍腳色保結呈送到部仍審實來厯相同具本引奏選用其附選出榜抄榜給慿催任一如除授官員施行事例凡總小旗補役以併鎗勝負為升降遇有應併人役到部照依比試事例行移㑹官於中軍都督府前監併其分别勝負亦與比試相同洪武初令護衛總小旗從王所補授二十五年令總小旗亡故親男弟姪及義男女壻能併鎗者俱准併勝者補原役護衛總小旗併鎗免赴京雲貴四川兩廣從本都司官監併後奏准福建遼東陕西都司山西行都司俱照此例二十八年令異姓併鎗得勝者授役年月從本身始不勝者總旗子降小旗小旗子降充軍異姓者不分總小旗名下俱充軍但不勝者俱不許再併其有陳亡失陷傷故殘疾出海運糧覆沒者補役免併鎗永樂間令奉天征討有功者免併鎗一次正統二年奏准南京直𨽻衛所總小旗從守備及兵部堂上官㑹併湖廣浙江江西山東河南萬全山西大寧都司福建行都司中都留守司具由申部轉行各司㑹同巡按按察司官監併四川行都司所屬布按二司同本司正官監併八年令總旗代役未併鎗獲功一級該升試百户者以功准併鎗補實授總旗竒功一次頭功二次該升實授百户者各除一級准併鎗升試百户十二年令應併鎗之人違限十年或年過三十例該收軍者發沿邊立功五年滿日併補若限內獲功一級准免併鎗即與實授凡陳亡征傷殘疾旗役例免併鎗者以十年為率若替役十年之外不經告明者不准天順元年令總小旗係總兵等官及各衛編置不經本部奏補者有功止依軍人例升賞成化六年令奉天征討小旗未經類引獲功二級該升試百户者准未併鎗例减一級實授總旗其本身獲功升授者不在此例延綏等處守邊總小旗依湖廣等處例申部轉行就本處㑹官監併𢎞治十三年奏准凡謀故殺死總小旗者就於犯人户內勾取壯丁抵充軍數其旗役仍令本户餘丁補當明㑹典卷一百六
