  - {type: page-break, offset: 0, content: '', id: KR2m0010_WYG_014-1a, image: WYG0617/WYG0617-0138a.png}
body:
  text: 明會典卷十四吏部十三考功清吏司諸司職掌郎中員外郎主事掌文職官吏之考課考核官吏見於諸司職掌者若京官試職有司官遇缺借除之類後事例多不同今備載之諸司職掌一凡在京六部太常司光祿司通政司太理寺國子監太僕寺欽天監翰林院太醫院儀禮司屬官五軍都督府各衛軍職文官應天府首領官并所屬上元江寧二縣官俱從本衙門正官考核應天府五品以下官監察御史從都御史考核給事中從都給事中考核東宫官王府官尚寶司中書舍人都給事中儀禮司行人司正官從本衙門將該考官員行過事迹并應有過犯備細開寫送本部考核欽天監翰林院太醫院正官都御史試職實授頒給誥敕取自上裁其有特恩實授給與誥敕者不拘此例一凡在京官初入仕者且令試職一年後考核堪用者與實授不堪用者降黜量才録用其在任未經考核試職官遇有調除仍於本衙門及别衙門本等職事內用通理月日降除及對品改除者止理見任月日俱候一年照例考核或有為事釋免再任除授者試職照例考核一凡六部五品以下官太常司光祿司通政司大理寺國子監太僕寺欽天監翰林院太醫院儀禮司屬官厯任三年聽於本衙門正官察其行能驗其勤惰從公考核明白開寫稱職平常不稱職詞語送監察御史考核本部覆考其在京軍職文官俱從監察御史考核各以九年通考其四品以上官員任滿黜陟取自上裁其在外有司官員三年考滿給由到京考核平常稱職者遇缺借除京官亦以九年通考若行人司行人以一年為滿從本司正官考核分豁稱職不稱職呈送禮部轉送本部覆考稱職者於從九品內升用不稱職者於未入流品官內敘用有過罰差一年儀禮司序班在職一年本司考核堪用不堪用送禮部轉行本部覆考堪用請旨實授不堪用黜降若三年考滿俱發監察御史考核送本部覆考但係一應京官三年考滿具奏俱於在京對品內調用一凡通政司光祿司翰林院尚寶司給事中中書舍人東宫官俱係近侍官貟監察御史係耳目風紀之司太醫院欽天監及王府官不係常選任滿黜陟取自上裁一凡在京五品以下官俱令試職候一年後考核定奪比先除授已經試職一年二年之上及已實授一年二之上者一例考核試職堪任用者與實授及已實授堪任用者俱給與誥敕三年考滿許請封贈其試職及已實授而不堪任用者一體黜降其有經考滿復任者不必再考頒給誥敕聽請封贈已入流倉官不須試職候一年任滿給與敕命守支未入流品官貟俱與實授不給敕命以上付發司封具奏頒給施行事例凡在京官洪武初三年一調用二十九年始以九年為滿三十年定考核署事官貟等第勤慎者仍治其事實授在任三月才力不逮者奏請黜降𢎞治元年令兩京各衙門屬官考滿堂上官出與考語送都察院并吏部覆考如原來考語得當續出考語不嫌雷同不當聽覆考官從公考核平常者引奏復職有贓者罷黜為民其有前考平常後能懲艾勉於為善者亦宜書稱前考稱職後或放肆改節者亦書平常以憑黜陟凡在京堂上正佐官三年六年考滿不停俸在任給由不考核不拘貟數引至御前奏請復職永樂元年奏準太僕寺光祿寺通政司大理寺國子監鴻臚寺翰林院五品以下堂上官照例不考五年奏準詹事府六品以上官照太常寺等官例亦不考俟九年奏請黜陟南京堂上官考滿日停俸赴京給由其年七十以上例應致仕者皆不引奏特具本奏請取自上裁凡各處巡撫都御史三年六年考滿移咨到部具奏復職仍行本官知會凡欽天監官考滿洪武四年奏準職司天文比與常選人貟不同不準考滿三十五年令欽天監正佐官俱不考核今大小官貟俱照例考滿凡各科給事中考滿正統二年奏準本科如無都給事中許掌科給事中考核凡五府六部等屬官首領官行人司行人天地等壇長陵等陵官俱咨都察院劄付河南道考核牒回覆考凡兵馬司兵馬考滿先赴兵部考核咨送本部行河南道覆考京縣管馬官亦咨兵部轉行太僕寺查馬數咨回本部發落凡左右春坊司經局尚寶司六科給事中中書舍人神樂觀提點知觀考滿俱不咨都察院止本部考核九年考滿定該升品級具奏取自上裁行人司司正司副亦止本部考核凡順天府治中通判推官三年六年考滿咨送都察院堂上官考核咨回本部覆考凡中書舍人九年考滿稱職成化四年奏準係進士舉人出身者升貟外郎監生出身升主事乞恩報效出身升寺副等官凡在京衙門堂上官及監察御史調除外任雖品級相等俸月不準通理其餘調外任者品級相等俱準通理凡兩京所正所副所丞大使副使司獄等官俱例不考核查俸明白引奏復職九年考滿雖係事繁衙門止升一級凡王府官及護衛首領官洪武三十年例不考核凡南京庫官周嵗考滿户部查錢糧明白送部入選凡南京各衙門官貟俱南京吏部都察院考核停俸赴京給由本部類引復職給憑還任成化二十二年奏準六年考滿不赴京凡在京官貟三年六年考滿俱不停俸在任給由滿後三月無故不給由者參問公差準理厯俸三十六箇月或三十七箇月俱準一考多厯少厯俱參問凡各帶俸官員本衙門查有相應貟缺照該升品級升授如無亦升各衙門相應職銜仍帶俸凡內府各衙門工匠出身官貟九年考滿成化十四年奏準俸職俱不升右在京官諸司職掌凡在外有司府州縣官三年考滿先行呈部移付選部作缺銓注司勳開黃仍令給由其見任官將本官任內行過事迹功業文册紀功文簿稱臣僉名交付本官親賫給由如縣官給由到州州官當面察其言行辦事勤惰從實考核稱職平常不稱職詞語州官給由到府府官給由到布政司考核如之以上俱從按察司官覆考仍將考核覆考詞語呈部直𨽻府州縣官考核如前其府官給由送監察御史考核本部覆考類奏以上三年考滿給由考核平常稱職者於對品內别用不稱職正官佐二官黜降首領官貟充吏役俱以九年通考黜陟其雲南有司官貟任滿給由一體考核不稱職者黜降緣係邊方具奏復任九年通考一凡各處布政司按察司鹽運司首領官屬官從本衙門正官考核按察司首領官從監察御史考核其餘衙門並從本道按察司覆考其茶馬司鹽課提舉司正官至首領官并在外軍職文官任滿俱送本處布政司正官考核仍送本處按察司覆考布政司官四品以上按察司鹽運司五品以上俱係正官佐二官三年考滿由進牌别無考核衙門從都察院考核本部覆考具奏黜陟取自上裁明令凡各處府州縣官貟任內户口增田野闢為上所行事迹從監察御史按察司考核明白開坐實迹申聞以憑黜陟凡各處任滿官貟須要隨即將帶家小起離任所親賫解由到省次日引見如到來當該房分不行引見問罪事例凡布政司堂上官咨送都察院考核按察司官徑赴都察院投文考核俱本部覆考首領等官河南道考核本司覆考洪武十七年令布政司按察司官年終來朝將所屬官貟考過堪用平常不堪用名數親自奏聞直𨽻府州官同天順四年奏準管屯副使僉事考滿到部將任內該管屯田數目移文該部查理如果完結考作稱職不完考平常凡南北直𨽻府州正佐官及衛首領官無上司所轄者考滿到部俱送河南道考核牒回本司覆考係清軍者兵部稽考清解軍數管馬者兵部行太僕司稽考馬數管糧及帶辦商稅者户部稽考有無拖欠俱待移咨到日方準引奏洪武二年詔府州縣正官三年一考課吏部考核黜陟佐二及首領官在任三年所司具其政績申達省部吏目典史在任者給由到京三年奏準府同知一考無過者升知府知縣二考無過者升知州縣丞一考無過者升知縣十二年奏準兩廣所屬地有瘴癘者有司俱以三年升調雖係兩廣而無瘴癘者仍以九年為滿福建汀漳二府湖廣郴州江西龍南安逺二縣地亦瘴癘一體三年升調三十五年令有司官三年考滿到部考核稱職平常者俱復任九年通考不稱職者仍依例降用宣德五年奏準天下官貟三年六年考滿者俱令赴部給由所欠稅糧立限追徵九年考滿就便銓注任內錢糧完足方許給由正統三年奏準有司親民官貟考滿給由牌內開寫任前并任內逃民數目及招撫復業多少以憑黜陟五年令在外大小衙門官貟考滿除教職隂陽醫學外俱照洪武年間定制即便離職依限給由赴京考核其牌册內滿後有開支俸管事者不準十年奏準沿海收糧官員三年考滿俱留辦事候九年通考赴部𢎞治二年奏準有司官雖不開稱職平常不稱職字樣其詞內有勤能端謹者即以稱職論頗可者即以平常論誤事懶惰者即以不稱論初考二考就與定稱否引奏復職三考仍候行查定奪全無考核詞語者行查差錯官吏俱照例參問三年奏準雲南貴州布政司官除方靣知府外同知以下并軍職衙門首領官三年六年考滿許赴本布政司給由其浙江等布政司并南北直𨽻府州縣等衙門官員三年六年俱赴部給由驛遞等官在外者赴本布政司南直𨽻者赴南京吏部俱造牌册繳部北直𨽻者赴本部給由又奏準給由官貟厯俸或一百八箇月或一百一十箇月俱準九年考滿若多厯少厯者俱參問少厯一月以上者問罪復除補任未及一月者若任內錢糧等項俱已完結亦照例問罪免其補輳考核選用如有未完事件雖少厯亦令回任完結方許給由九年奏準凡天下司府佐二官及州縣正佐并衛所首領五品以下官員九年考滿到部考核繁稱無過升二級有過并簡而稱職無過升一級若繁簡平常有徒杖罪或初次不給由者俱照例遞降定擬該升該降品級挨次選用若守候一年之上有願遞減選用者比照從四品告願正五品事例除授職事仍給與該升服色俸級凡行太僕寺卿丞考滿永樂三年命從都察院考核吏部覆考黜陟八年奏準北京遼東陜西甘肅等處苑馬寺卿丞等官依行太僕寺官例考核主簿從本寺考仍送都察院河南道考核本部覆考其屬官監正監副録事止於各寺考本部覆考圉長三年考滿從本監本寺官考核闒茸不稱者送部黜降稱職平常者仍令在任六年再考九年通考仍行兵部稽其所養馬數升降其九年考滿者先以缺申部候代官至方許給由凡鹽運司判官永樂八年奏準依本司堂上官例考核凡考滿官吏在途病故正統五年奏準所在官司據其隨行親人具告即便差人相視明白給與堪信文憑遺下原賫牌册批文就與轉繳凡都察院理刑推官黜改知縣者雖品級相等不準通理刑部都察院司獄稅課司大使改除千户所吏目亦不準通理凡給由例限南直𨽻并浙江等布政司俱一年零二箇月北直𨽻八箇月凡在外起送考滿官俱要合干上司查勘明白一一具結如無一處印信保結者行查凡紙牌內不填小日不僉書不稱臣該吏背書不畫字稽勳司駁送本司紀録年終類奏凡公文批牌內不開除授到任考滿年月日期增減十嵗以上户口無新增俸月多厯少厯不開前任事迹隱匿過名及紙牌不填字號漏用印信批咨申結內洗改為事丁憂患病痊可年月緊關字樣者俱參問少厯者復除補輳若增減不及十嵗差錯籍貫出身除授復任年月日不署職背書該吏名缺不開報及丁憂起復復除共輳九年不開前後備細俸月者俱準改正凡患病二年之上雖有文憑不準不及二年患帖無告官痊可月日亦不準凡中途聞喪不將牌册赴所在官司告繳及至起復之日方告繳者送問若中途被水火盜賊失落公文者行查凡丁憂起復更調改除官貟前後兩任以十八箇月為半如前任日少許通理多則再厯三年不得以後任輳滿其厯過俸月於後考內通理凡三年六年雖有專責差占必須一次給由違者送問仍照例考察繁稱有過者止升一級簡稱及繁平常有過者俱本等用簡平常有過者降一級若有例前納米曽經繳報牌册到部者不在此限其雲南所屬官三年六年不行赴本布政司給由不繳牌册到部亦同此例凡厯任六年止具三年事迹給由者舊例參問今準作三年考滿亦不補造六年牌册候九年考滿以六年事迹再造牌册給由𢎞治十五年令考察行太僕寺苑馬寺官不必會同布按二司各寺官果有才行超卓者一體推舉升用又奏準在外衙門七品以上官有三年或六年曽經到部考稱及任內曽有旌異例該升擢自願致仕者本部擬升職銜或加散官服色令其致仕如左右布政使無官可升另行奏請定奪右在外有司官諸司職掌一凡內外雜職官三年給由無私過未入流升從九品從九品升正九品稅課司局及河洎所倉庫官先於户部查理嵗課軍器織染雜造等局官送工部查理造作花銷明白送部通類具奏其倉官收糧不及千石者本等用虧折陪納足備者照依品級降用其有私笞者本等用但犯贓私并私罪曽經杖斷未入流降邊逺從九品降未入流不識字者本等用如有學無成效及罷間生貟除授雜職者犯贓私杖罪發在京衙門書寫事例凡倉庫司局等官俱行户部查勘經收錢糧河洎所官行户工二部查勘魚課織染局官行工部查勘假匹鹽課稅課司局官行户部查勘鹽課商稅在南京者俱由南京查勘明白起送赴部洪武九年令倉庫司局管錢榖官以厯俸周嵗為滿收受少者以數付交代官給由多者以半俸守支畢日給由雖經改除亦以九年通論十四年令各處倉官周嵗考滿守支俸給三分內支一分守支畢日未入流升從九品已入流升正九品二十八年奏準內外倉官厯過全俸雖未周嵗所收糧數已滿千石遇有父母喪守制服滿後照起復官員本等改用又令內庫官一年為滿就將原收物件盤與新官接管給由對品改用永樂八年奏準順天府廣備庫大使副使照內府庫官事例周嵗為滿給由正統元年奏準在京居賢等坊草場大使副使收草十萬束以上者升一級不及數者本等用又奏準山東都司所屬沿海倉官考滿守支盡絶給由布政司查理明白仍送原衙門照例給由五年奏準司府州縣衛所考滿丁憂起復倉庫稅課司河泊所官將任內收過課程等項備開納獲通關字號及倉庫錢糧支銷明白餘剩物件交與見任官攢收掌支銷取具各該府州縣衛所官吏保結轉達布政司都司就令考滿官員親賫赴京丁憂回還原籍者將首尾交盤明白亦將緣由申報本部候各官起復以憑查考𢎞治五年奏準大同宣府遼東甘肅等處各草場官俱以九年為期或八年前後遇例差官經盤堆垜如法數目不少準令起送凡倉場官收糧千石草十萬束以上無過升一級有笞杖罪本等用徒罪降用收糧不及千石草不及十萬束本等用有過降用係雜職降邊逺雜職內用若收糧不及千石草不及十萬束者厯俸周嵗許交盤給由其在大司宣府者守支盡絶其盤收前官糧草該減俸如支盡絶給由到任半年無糧收受者起送赴部行户部查勘明白付文選司别用若初到之時雖曽盤收不係經收者亦起送其正糧守支盡絶即當減俸若守候二年之上放支不盡絶者仍聽全支本等俸給不及二年不許仍支全俸或守支間奉上司委署别衙門印信亦不許遷延過違年限丁憂復除或改除河泊所官千户所吏目俸月不準通理違者皆送問凡在京長安四門倉副使不係經收糧斛官員本等入選南京者具奏入選凡在外河泊庫官鹽稅局織染局鹽倉茶鹽批驗所等官三年六年考滿係北直𨽻者赴本部考核引奏復職係南直𨽻者赴南京吏部係布政司者赴各布政司查理明白就令復職各布政司仍將各官牌册具本差人類繳候九年通考以憑查考若丁憂起復改除者前任少許通理多則不許通理違者俱送問多厯少厯違限錯厯亦俱送問九年無過升一級有過本等用凡內外收糧經厯州判官吏目俱以三年為滿守支盡絶給由到部送河南道考核本司覆考具奏入選南京所屬俱由南京河南道吏部考核其有丁憂起復未經南京衙門考核者行查各衛倉經厯每衛止留一員收糧斛其餘三年一替起送赴部俱以原職改除補輳九年照依繁簡事例考核黜陟任內收糧十萬石以上無過考稱或平常俱升一級不稱者本等用收糧不及十萬石有過考稱或平常不稱俱本等用其守支年深與守支間丁憂起復例同凡在京各衛倉經厯宣德四年奏準三年考滿者給半俸守支若糧不及千石照依倉官例交盤給由調用仍候九年黜陟凡巡檢洪武初考滿給由無私過者升正九品犯私笞者本等用杖罪降雜職二十五年奏定考滿捕獲軍囚盜賊等項二百名之上無私杖者升一級有私杖對品用一百名之上無私杖者對品用有私杖降雜職三十名之上無私杖者降雜職有私杖者降邊逺雜職不滿三十名者發邊逺充軍若有強賊及逃軍聚衆劫掠能擒獲以除民害者二十名之上無私杖者升一級有私杖者對品用有私杖者降雜職九名之上無私杖者降雜職有私杖者降邊逺雜職若擒強賊逃軍六十名之上或止二十名而又能獲軍囚二百名之上及擒偽造寶鈔及偽印者具奏升用永樂元年巡檢考滿應升自陳不堪别用乞仍舊職者聽正統六年奏準土官巡檢三年六年攢造牌册赴本布政司給由復職九年通考赴部黜陟凡沿海及土官巡檢俱不論軍囚無過本等用有過降用盧溝橋張家灣白溝河通州北關漷縣楊村河西務單家橋巨河小直沽河陽興濟緊要地方軍囚強盜俱二名折一名成化間定巡檢考滿事例獲強盜三名至九名軍囚不及一百名者無過降雜職有過降邊逺雜職強盜十名之上軍囚百名之上無過對品用有笞杖過降雜職徒罪降邊逺雜職軍囚二百名之上強盜二十名之上有招或不及二十名或無強盜無過升一級有笞杖過對品用徒罪降雜職若獲成羣強盜二十名之上或六十名之上又有招由軍囚二百名之上有事由或不及無過升一級有笞杖過對品用徒罪降雜職若獲偽印一顆或二顆有覆造招由軍囚不論有無無過升一級有笞杖過對品用徒罪降雜職凡巡檢三年考滿以新官更替日扣算例限府州縣掌印正官將任內捉獲軍囚等項從實查勘具結起送其沿海巡檢亦要畫圖貼説以憑查考若起送無府縣巡司保結軍囚公文止開起數不開花名或止開花名無籍貫并所犯事由強竊盜抄招無縣印鈐縫偽印不開是何衙門印信及令犯人當官覆造相同丁憂起復無本司關文及洗改軍囚姓名者俱行勘若公文不開事迹洗改更替日月強竊盜軍囚總數者送問若考滿丁憂起復前任厯少通理至一十八箇月之上另厯三年凡驛遞閘壩官舊制俱三年赴部給由惟雲南驛丞各以三年一次赴布政司考核九年通考然後赴部宣德四年奏準貴州所屬驛丞照雲南事例考核正統元年奏準廣東所屬雜職衙門三年六年考滿照廣西雲南例驛丞遞運所大使赴布政司考核河泊稅課等官仍舊又奏準各處水馬驛丞及遞運所大使九年將滿吏部預選官交代住俸管事新官至日方許給由三年奏準驛遞閘壩官直𨽻府州縣所轄三年赴部其有布政司所轄三年赴布政司并按察司考察稱職平常復職仍將各官牌册年終類進九年赴部通考五年奏準南北直𨽻驛遞閘壩司獄等官三年赴巡按御史考核定與稱職不稱職考語連牌册發有司收候年終類繳九年赴部通考景泰元年奏準南北直𨽻驛遞閘壩司獄等官三年六年考滿南直𨽻者赴南京吏部北直𨽻者赴本部凡驛丞九年考滿公文牌册內事迹不開報應付過使客備細花名起數者送問凡驛遞等官丁憂改除前任日少許通理多則不許通理多厯少厯違限錯厯俱送問丁憂起復無印信關文者行查無過升一級有過本等用𢎞治十四年令天下有司儒學巡檢倉庫驛遞等官考滿到部功迹不足或有過名有願告退者照有司不稱職例各仍原職致仕右雜職官入流倉官收糧經厯附諸司職掌一凡各處府州縣學訓導與教官一體厯俸九年考滿給由其訓導給由到部出題考試將所試文字送翰林院批考通經者於縣學教諭內敘用若不通經旨本處復充訓導自來不通經者量才别用教官考核稱職升一等平常者本等用不稱職者黜降不通經者别用若承差考滿無私過於行人內用其犯私笞杖罪發行人司聽差一年無過升用有贓私者發在京衙門充吏其五軍都督府知印三年考滿於從八品內升用六部知印三年考滿於九品內升用事例洪武二十六年奏定考滿教官訓導以九年之內科舉取中生員名數為則定擬升降縣學額設生員二十名教諭九年之內科舉取中生員三名又考通經者為稱職升用若科舉取中生貟二名又考通經者為平常本等用若科舉取中生員不及二名又考不通經者為不稱職降黜别用州學額設生貟三十名學正九年之內科舉取中生員六名又考通經為稱職升用若科舉取中生貟三名又考通經者為平常本等用若科舉取中生員不及三名又考不通經者為不稱職黜降别用府學額設生員四十名教授九年之內科舉取中生貟九名又考通經者為稱職升用若科舉取中生員四名又考通經者為平常本等用若科舉取中生員不及四名又考不通經者為不稱職黜降别用府州縣學訓導分數生員一十名九年之內科舉取中生員三名又考通經者升教諭若科舉取中生貟二名或一名又考通經仍充訓導若科舉生員全無又考不通經降黜别用又奏準教諭科舉及數考不通經有司內用科舉不及數通經降訓導三十五年命教授考通經任內止有舉人三名者降學正永樂元年欽定舉人署教諭事者任內有科舉中式一名又有嵗貢中式一名署訓導事者有科舉中式一名或有嵗貢中式一名俱與實授六年令教官考滿吏部同六科都給事中選其有才識者留六科理事一年後從本科都給事中考其髙下用之宣德五年重定舉人名數教授五名為稱職三名為平常不及三名為不稱學正三名為稱職二名為平常不及二名為不稱教諭二名為稱職一名為平常訓導一名為稱職不及者皆為不稱稱職者升平常者本等用不稱者降正統九年奏準教官九年任滿無舉人者試其學問果優仍任教官教授學正教諭俱降訓導訓導調邊逺其不中者仍降雜職𢎞治二年奏準九年考滿教官考通經府州縣學舉人及數方升衛學并選貢衙門雖無舉人亦升若丁憂復除者論前後任多少若任府州縣學日多從府州縣學論任衛學并選貢衙門學日多從衛學并選貢衙門論凡教官考滿初場考四書本經義各一篇二場論䇿各一道教授學正教諭俱本部定中否訓導送翰林院定中否考不通經係舉人出身者教授改吏目學正等官改典史監生儒士出身者教授改稅課司大使學正等官降河泊所官衛學并選貢衙門學官考不通經亦同前例冒報舉人者送問無府州縣委官保結者行查雲南各處教官從選貢衙門例亦不論舉人十四年令公侯駙馬伯家教書訓導九年考滿者比在外府州縣學訓導例九年教無成效考中者於邊逺學校降用考不中者於雜職內降用行國子監查無功迹者革職為民右教官諸司職掌一凡內外入流并雜職應考官員任滿給由赴京本部從實考校才能優劣依例黜陟果有殊功異能超邁等倫者取自上裁繁而稱職無過升二等有私笞公過升一等有紀録徒流罪一次本等用二次降一等三次降二等四次降三等五次以上雜職內用繁而平常無過升一等有私笞公過本等用有紀録徒流罪一次降一等二次降二等三次降三等四次以上雜職內用簡而稱職與繁而平常同簡而平常無過本等用有私笞公過降一等有紀録徒流罪一次降二等二次雜職內用三次以上黜降考核不稱職初考繁處降二等簡處降三等若有紀録徒流罪者俱於雜職內用凡九年之內二考稱職一考平常從稱職二考稱職一考不稱職或二考平常一考稱職或稱職平常不稱職各一考者俱從平常二考平常一考不稱職從不稱職一繁簡則例在外府以田糧十五萬石以上州以七萬石以上縣三萬石以上或親臨王府都司布政司按察司并有軍馬守禦路當驛道邊方衝要供給去處俱為事繁府州縣田糧在十五萬七萬三萬石之下僻靜去處俱為事簡在京衙門俱從繁例事例凡九年考滿官員永樂四年奏準各都司衛所布政司按察司行太僕寺鹽運司鹽課提舉司煎鹽提舉司市舶提舉司茶馬司考核俱從繁例宣慰宣撫安撫招討長官司俱係土官衙門從簡例八年令官員九年考滿給由初考稱職次考未經考核今考稱職者初考次考不給由三考稱職者俱從稱職初考不給由次考稱三考平常者初考平常次考不給由後考稱者俱從平常初考不給由次考平常三考不稱職者從不稱職凡考滿官患病不滿三箇月及非緣事住俸月日不作實厯者參問增減十嵗以上考滿後非因公差摘占厯俸半年以上及不報前任事迹并隱匿過名者俱送問𢎞治十三年令在外大小文職若九年已滿托故在任久住不行赴部及不申缺者參提究問就彼放回原籍冠帶間住明會典卷十四
