body:
  text: 明會典卷一百五十二工部六儀仗五親王儀仗世子同令旗一對紅素綾質中黃綾為令字闊二幅上長六尺九寸下三尺六寸硃漆攢竹竿通長八尺二寸內鐵纂五寸柄或以木為之清道二對硃漆攢竹杖銅裹兩末長四尺九寸幰弩一張并箭紫幰蓋以帛為之洪武年間停造刀盾一十對盾制以木畫獅頭加飾硃漆刀金塗紅靶緑鞘紅緑間點鯋魚皮為飾帶青絛紅穗洪武年間停造弓箭二十副每副弓一櫜二刺緑斜皮絛雲子鐵釘鉸絡於韋帶箭三十枝以竹為之上黑翎下鐵鏃洪武年間停造白澤旗一對紅質黃欄赤火焰腳繡白澤形為飛狀旗上四角五色雲子皆繡成竿長一丈三尺六寸九分內貼金木鎗頭一尺三寸五分上紅纓下鐵纂柄或以木為之金鼓旗一對紅質黑金鼓二字闊二幅硃漆攢竹竿通長一丈四尺九寸末有鐵纂上飾紅纓并貼金木鎗頭畫角十二枝木質黑漆創金上寶相花中單龍纒身雲文下八寶雙海馬為飾花匡鼓二十四面紅油匡畫寶相花釘環鈸皆擺錫粉塗革面畫獅子繡毬徑一尺七寸挂以紅絨匾絛以木為質杖鼓二面黑漆木匡細腰創金花文粉塗革面挂以青絨匾絛金鉦二面以響銅為之徑九寸邊有小竅外以紅竹匡絡以紅絨綆鑼二面鑼口徑一尺三寸掆鼓二面紅油木匡畫寶相花粉塗革面畫荷并葉鐵釘環鈸皆擺錫懸以紅絨綆板一串鐵力木板六各長一尺一寸上闊一寸九分下闊二寸五分聨以青絛笛二管以竹為之長一尺六寸六孔小銅角一對以銅為之高三尺五寸加硃漆描金雲龍文大銅角一對以銅為之高三尺四寸八分硃漆描金升降雲龍文戲竹一對硃漆竹柄通長六尺內貼金木龍頭七寸竹絲二十四莖長四尺五寸上垂紅緑帉錔大樂鼓一面紅油木匡畫寶相花冒以革傅以粉畫荷并葉匡高一尺六寸面徑二尺貼金銅釘鈸環木紅絹鼓衣畫盤螭并花文舉以紅木扛紅絨匾絛板一串制同前但加紅緑帉錔杖鼓十二面制同前但加木紅絹鼓衣畫盤螭并花文及有貼金木魚首銜紅緑帉錔名魚頭鞭笛四管制如前貼金木龍頭通長一尺七寸鹿角管束兩末八孔龍口銜紅緑帉錔頭管四管以烏木為管六寸八分以牙管束卷蘆為稍九竅絳引幡一對每把硃漆攢竹竿帶貼金銅龍頭長一丈二尺五寸內龍頭一尺幡用五色平羅長六尺三寸闊五寸五分四角紅羅蓋高七寸五分圍二尺七寸五分蓋上有抹金銅頂鈒花文緑二簷共長一尺九寸紅緑帉錔四自此至信幡腰皆用緑色描金香草二簷銷金雲文幡下綴五色板自此至節凡竿柄或以木為之凡挑竿銅龍頭皆以鐵為鈎傳教幡一對每把硃漆攢竹竿帶貼金銅龍頭共長一丈二尺五寸內龍頭一尺幡用紅平羅長六尺三寸闊五寸五分四角紅羅蓋高七寸五分圍二尺七寸五分蓋上抹金銅頂鈒花文青二簷共長一尺九寸幡上黃羅牌內書青傳教二字紅緑帉錔四以羅為之告止幡一對制同傳教但紅平羅二簷黃羅牌內書青告止二字信幡一對制同傳教但黃平羅二簷黃羅牌內書青信字儀鍠氅一對硃漆攢竹竿通長一丈二尺五寸五分內貼金木儀鍠并龍頭一尺三寸五分抹金銅氅頂一箇氅用五色平羅長六尺三寸闊五寸五分氅下銅鈴五箇戈氅一對硃漆攢竹竿通長一丈二尺五寸內貼金木戈并龍頭一尺六寸二分五色平羅氅長六尺三寸闊五寸五分下綴銅鈴五箇氅上硃漆木板戟氅一對制同前但貼金木戟并龍頭長一尺七寸五分梧杖一對硃漆攢竹為之杖通長六尺九寸五分兩末貼金儀刀四對刻木為刀鞘并靶銀地貼金為螭虎文紅帉錔班劒一對刻木為劒并靶靶下有龍頭皆貼金惟劒貼銀紅帉錔斧一對硃紅攢竹柄通長六尺九寸內貼金木斧并龍頭長一尺六寸五分立瓜一對硃漆攢竹柄通長六尺九寸內貼金木立瓜及龍頭一尺四寸卧瓜一對硃漆攢竹柄通長六尺九寸內貼金木卧瓜并龍頭一尺二寸五分骨朵一對硃漆攢竹柄通長六尺九寸內貼金木骨朵并龍頭一尺六寸鐙杖一對硃漆攢竹柄通長六尺九寸內貼金木鐙杖并龍頭一尺六寸殳義一對硃漆攢竹竿貼金木殳并龍頭通長一丈二尺五寸內龍頭一尺八寸五分戟十對硃漆攢竹竿通長一丈二尺五寸五分內貼金木戟及龍頭二尺五分矟十對硃漆攢竹竿通長一丈二尺五寸內貼金木矟及龍頭一尺七寸夾矟一對制同前但其首為夾矟麾一把硃漆攢竹竿帶貼金銅龍頭共長一丈二尺五寸五分內挑竿龍頭鐵鈎一尺緑蓋下三紅纓為二層每層各綴抹金銅頂藍斜皮雲蓋下綴銅鈴其緑蓋上抹金銅頂鈒花文幢一把制同麾但為五纓五層節一把制同麾但為八纓八層響節四對漆貼銀攢竹竿通長一丈二寸五分􅤾鐵條長一尺二寸五分貫銅鐵錢十二衣用紅平羅銷金鳳文長一尺五寸闊八寸上加貼金木圓頂并木盤攀頂絨線四條錢文天下太平紫方傘一把每把傘骨面闊并頂徑四尺傘柄并貼金木葫蘆共長一丈九寸面用紫平羅紫三簷其頂四角抹金銅龍頭四箇凡傘柄俱用紅油竹間纒以藤惟曲柄硃漆攢竹為之紅方傘二把每把傘骨面闊并頂徑四尺傘柄并貼金木葫蘆共長一丈九寸面用紅平羅紅三簷其頂四角抹金銅龍頭四箇紅銷金傘一把傘骨面闊并頂徑四尺一寸五分傘柄并貼金木葫蘆長一丈九寸面用紅平羅銷金寶珠團文紅三簷銷金香草邊寶珠龍文紅繡圓傘一把傘骨面闊并頂徑四尺一寸五分傘柄并貼金木葫蘆共長一丈九寸面用紅平羅紅三簷頂繡雲文簷繡瑞草紅曲柄傘二把每把傘骨面闊并頂徑四尺一寸五分傘柄并貼金木葫蘆共長一丈九寸面用紅平羅紅三簷當曲柄處用鐵心貼金木龍頭承傘紅油絹銷金雨傘一把傘骨面闊并頂徑六尺四寸傘柄并貼金木葫蘆共長八尺六寸面銷金寶珠龍文邊銷金雲龍丈青繡圓扇四把每把扇及黑漆竹柄通高一丈七寸五分內扇見圓高三尺三寸五分面背并風衣用青平羅面繡升降孔雀雲文背銷金龍團花文凡扇柄俱以攢竹為之紅繡圓扇四把每把扇及黑漆竹柄通高一丈七寸五分內扇見圓高三尺三寸五分面背并風衣用紅平羅面繡四季花背銷金龍團花文紅繡方扇四把每把扇及黑漆竹柄通高一丈七寸五分內扇面徑高三尺三寸五分面背并風衣用紅平羅面繡升降孔雀雲文背銷金寶珠團文誕馬八匹紅轡青韁上施錦韉韉以紅油皮為之鞍籠一箇皮質紅油貼金升降龍文邊香草文馬杌一箇木質銀葉裹銀釘鉸中鈒盤龍文間抹金拂子二把黑漆木柄用銅環銅釘鉸繫素氂牛尾末垂紅帉錔今拂用馬尾紅纓為心交椅一把木質銀葉裹銀釘鉸中鈒花雲龍文穿以紅絲匾絛四垂紅帉錔椅間抹金紅織金紵絲褡襠腳踏一箇木質銀葉裹銀釘鉸鈒方勝文間抹金紅織金紵絲踏褥水盆一箇寬緣平底鈒盤龍邊鈒香草文銀質間抹金手巾一條水罐一箇有蓋有提小口巨腹鈒花文銀質間抹金香爐一箇兩耳三足有蓋鈒龍文硃漆竿貼金龍頭并尾爐銀質渾抹金香盒一箇蓋鈒龍文邊鈒香草銀質渾抹金唾盂一箇形圓如缶蓋僅掩口盤鈒龍文銀質間抹金洪武年間停造唾壺一箇小口巨腹有蓋鈒香草文銀質間抹金洪武年間停造紅紵絲拜褥一紅紗燈籠二對紅油竹骨下有燭盤蒙以紅紗玉色紗蓋硃漆竿貼金龍頭并尾紅油紙燈籠二對紅油竹骨下有燭盤木座以竹絲編為籠加紅油紙硃漆竿貼金龍頭并尾魫燈一對紅油鐵骨以魫為之餘同紙燈帳房一座幃幕全以青綿布為之緑色螭頭硃漆柱并帳竿竿首各施彩粧蹲獅頂用氊象輅一乘高一丈一尺六寸九分闊七尺九分輅上平盤板前後車櫺并鴈翅板其下轅三條皆硃紅漆轅各長一丈八尺五寸用抹金銅龍頭龍尾葉片裝釘前施硃紅油馬搭攀皮一條平盤左右下護泥板及車輪二貫軸一每輪輻十有八條皆硃紅漆周圍輞全各以抹金銅葉片裝釘輪內車轂各一用抹金銅鈒蓮花瓣輪盤裝釘軸首左右各用紅漆鐵插拴一箇以抹金銅鈒龍頂管心裝釘軸中纒紅絨駕轅等索面至地三尺五分輅亭高五尺二寸九分硃紅漆四柱其長同檻高一寸四分其上周圍硃紅漆絛環板門高四尺五寸九分闊二尺二寸五分左右門闊同前并左右各硃紅漆上明下暗槅二扇明栨全抹金銅鈒花葉片裝釘後硃紅漆五山屏風屏後板俱用抹金銅鈒花葉片裝釘亭底硃紅漆板上施紅花毯紅錦褥并席硃紅漆坐椅一座硃紅漆納板一并褥椅中紅織金椅靠坐褥四圍椅裙全周圍施紅羅幃幔或用紅綺亭外用青綺緣邊硃紅簾十二扇各用拽簾紅線圓絛二條黃銅圈全輅頂并圓盤高二尺四寸五分又抹金銅寶珠頂帶仰覆蓮座高九寸垂攀頂紅線圓絛四條盤上下皆硃紅漆以青飾輅蓋內寶蓋硃紅漆木匡鬭以八頂冒以紅綺頂心繡雲龍一餘繡五彩雲文天輪三層皆硃紅漆上安雕木貼金邊耀葉板六十三片內飾青地雕木五彩雲文三層間繪五彩雲襯板六十三片盤下周圍黃銅釘裝上施紅綺瀝水三層每層八十一摺繡瑞草文前垂青綺絡帶二條各繡升龍二并五彩雲文圓盤四角連輅座板用攀頂紅線圓絛四條并紅漆木魚輅亭前一字欄干一扇後一字帶轉角欄干一扇左右欄干各一扇內嵌絛環板皆硃紅漆四扇計一十四柱各柱首雕木紅蓮花一用線金青緑粧蓮花抱柱前欄干櫺板上布花氊紅旗二面在輅亭後左右用紅線羅夾為旗每面六斿每斿內外繡升龍一紅漆攢竹旗竿二左竿旗腰繡日月北斗竿首用抹金銅龍頭右竿旗腰繡黻字竿首用抹金銅戟各竿綴抹金銅鈴二垂紅纓五纓上各施抹金銅花蓋下垂帉錔踏梯一硃紅漆以抹金銅鈒花葉片裝釘行馬駕三硃紅漆其上紅絨匾絛用抹金銅葉片裝釘鐵搭鈎全紅絹幰衣即遮塵油絹雨衣并氊衣各一座郡王儀仗令旗一對紅質黃令字硃漆攢竹竿通長八尺二寸下有鐵纂柄或以木為之清道一對硃漆攢竹杖銅裹兩末長四尺九寸幰弩一張并箭紫幰蓋以帛為之自此至弓箭俱洪武年間停造刀盾八對盾制以木上畫獅子下飾硃漆刀金塗紅靶緑鞘紅緣間點鯋魚皮為飾帶青絛紅穗弓箭十八副每副弓一櫜二黑質紅緣刺緑斜皮雲子鐵釘鉸絡于韋帶箭三十枝以竹為之上用翎下鐵鏃金鼓旗一對紅質黑金鼓二字闊二幅硃漆攢竹竿并貼金木鎗頭通長一丈四尺九寸末有鐵纂上飾紅纓畫角十枝木質黑漆創金文上寶相花中單龍纒身雲文下八寶雙海馬為飾花匡鼓二十面木質紅油匡畫寶相花釘鈸環皆擺錫粉塗革面畫獅子繡毬徑一尺七寸挂以紅絨匾絛掆鼓一面紅油木匡畫寶相花粉塗革面畫荷并葉鐵釘環鈸皆擺錫懸以紅絨綆金鉦一面以響銅為之徑九寸邊有小竅外以紅竹匡絡以紅絨綆鑼二面鑼口徑一尺三寸板一串鐵力木板六各長一尺一寸上闊一寸九分下闊二寸五分聨以青絛笛二管以竹為之長一尺六寸六孔戲竹一對硃漆竹柄通長六尺內貼金木龍頭七寸竹絲二十四莖長四尺五寸上垂紅緑帉錔大樂鼓一面紅油木匡畫寶相花冒以革傅以粉畫荷并葉匡高一尺六寸面徑二尺抹金銅釘鈸環木紅絹鼓衣畫盤螭并花文舉以紅木扛紅絨絛板一串制同前但加紅緑帉錔杖鼓八面黑漆木匡細腰創金花文粉塗革面聨以紅綆挂以青絛木紅絹鼓衣畫盤螭并花文及有貼金木魚首銜紅緑帉錔名魚頭鞭笛四管貼金木龍頭通長一尺七寸鹿角管束兩末八孔龍口銜紅緑帉錔頭管四管以烏木為管長六寸八分以牙管束卷蘆為梢九竅絳引幡一對每把硃漆攢竹竿帶貼金銅龍頭長一丈二尺五寸內龍頭一尺幡用五色平羅長六