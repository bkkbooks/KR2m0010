body:
  text: 明會典卷一百六十工部十四船隻諸司職掌凡在亰并沿海去處每嵗海運遼東糧儲船隻每年一次修理其各衛征戰風快船隻等項若有缺少損壞及當修理者務要會計木釘灰油麻藤及所用物具依數撥用如有不敷亦當預為規畫或令軍民採辦或就客商收買或外處撥支審度便利定擬奏聞行下龍江提舉司計料明白行移各庫放支物料其工程物件照依料例文册然後興工如或新造海運船隻須要度量産木水便地方差人打造其風快小船就京打造者亦須依例計造木料等項就於各場庫支撥若內外有船隻務要周知其數設或需索運用酌量勞逸多寡撥與其各湖河泊所帶辦魚油縹每嵗催督進納備用一千料海船一隻合用杉木三百二根雜木一百四十九根株木二十根榆木舵桿二根栗木二根櫓坯三十八枝丁線三萬五千七百四十二箇雜作一百六十一條箇桐油三千一十二斤八兩石灰九千三十七斤八兩艌麻一千二百五十三斤三兩二錢船上什物絡麻一千二百九十四斤黃藤八百八十五斤白麻二十斤棕毛二千二百八十三斤一十二兩四百料鑽風海船一隻合用杉木二百二十八根桅心木二根雜木六十七根鐵力木舵桿二根櫓坯二十枝松木五根丁線一萬八千五百八十箇雜作九十四條箇桐魚油一千一斤一十五兩石灰三千五斤一十三兩艌麻七百二十九斤八兩八錢船上什物絡麻五百七十四斤一十四兩四錢黃藤三百八十八十三斤八兩棕毛七百三斤白麻一十斤事例後定四百料糧船一隻合用底板楠木三根棧板楠木三根出腳楠木一根梁頭雜木三根前後伏獅拿獅雜木二根草鞋底榆木一根封頭楠木連三方一塊封梢楠木短方一塊梚腳梁雜木一假面梁楠木連二方一塊將軍柱雜木一假桅夾雜木一假大小釘鐲七百箇艌麻二百斤油灰六百斤桐油三十斤船上什物大桅一根頭桅一根大蓬一扇頭蓬一扇索三副度三條貓纜一條貓頂一條擊水一條絍䕊一條箍頭繩一條八皮四條撁䕊三條抱桅索二副櫓四枝腳索二副招頭木一根篙子十根挽子一把水橛二根榔頭一箇跳板一塊櫓跳四塊櫓繩四條戽斗一箇鐵貓一箇弔桶一箇挨䉡木二根竹水斗一箇舵一扇舵牙一根舵關門捧一根水桶一箇前後襯倉水基竹瓦蓋篷并襯倉蘆席各項船隻一黃船國初造黃船制有大小皆為御用之物至洪熙元年計三十七隻正統十一年計二十五隻常以十隻留京師河下聽用成化八年本部奏準照快船事例定限五年一修十年成造其停泊去處常用厰房苫蓋軍夫看守一馬快船國初四川雲南市易馬騾及蠻夷酋長貢馬者皆由大江以逹京師有司載送悉用民船洪武十年令武昌嶽州荆州歸州各造馬船五十隻每隻定民夫三十人以備轉送一海運船永樂五年改造海運船二百四十九隻備使西洋諸國正統七年令南京造遮洋船三百五十隻給官軍由海道運糧赴薊州等倉登州衛每年裝運遼東布花鈔錠原設海船一百隻正統間止存三十一隻一鮮船南京各該衙門每年進貢等項物件共三千起用船一百六十二隻南京司禮監二起制帛一起計二十扛實用船五隻筆料一起實用船二隻南京守備并尚膳監等衙門各項物件二十八起實用船一百五十五隻用冰物件六起守備處三起鮮梅四十扛或三十五扛實用船八隻枇杷四十扛或三十五扛實用船八隻楊梅四十扛或三十五扛實用船八隻尚膳監三起鮮笋四十五扛實用船八隻頭起鰣魚四十四扛實用船七隻二起鰣魚四十四扛實用船七隻不用冰物件二十二起守備處五起鮮藕荸薺橄欖等物五十五扛實用船六隻鮮茶十二扛實用船四隻木樨花十二扛實用船二隻石榴柿子四十五扛實用船六隻柑橘甘樜五十扛實用船六隻尚膳監八起天鵝等物二十六扛實用船三隻醃菜臺等物共一百三十罈實用船七隻槽笋一百二十罈實用船五隻蜜煎櫻桃等物七十罈實用船四隻乾鰣魚等物一百二十盒罈箱實用船七隻紫蘇榚等物二百四十八罈實用船八隻木樨花煎等物一百五罈實用船四隻鷀䳓等物十五扛實用船二隻司苑局五起荸薺七十扛實用船四隻薑種芋苖等物八十扛實用船五隻苖薑一百擔實用船六隻鮮藕六十五扛實用船五隻十樣果一百四十扛實用船六隻內府供用庫三起香稻五十扛實用船六隻苖薑等物一百五十五扛實用船六隻十樣果一百一十五扛實用船五隻御馬監一起苜蓿種四十扛實用船二隻一備倭船沿海衛所每千户所設備倭船十隻每一百户備倭船一隻每一衛五所共船五十隻每船旗軍一百名春夏出哨秋回守月支行糧四斗船有虧折有司補造損者軍自修理一戰船新江口戰船永樂五年額設一百三十一隻宣德以後增至三百一十九隻至成化十年堪操者止有一百四十隻折卸未造內三四百料者俱改造二百料快船一糧船各處官軍儧運糧共淺船一萬三千餘隻湖廣江西浙江三都司江南衛分皆於本處改造其南京江北直𨽻及山東等都司船八千餘隻例於衛河清江提舉司改造松木者五年一造雜木者七年一造杉木者十年一造一各衛所見駕遮洋淺船共一萬八百六十隻有司五千一百四十隻加一百六十三隻清江提舉司四千七百四十隻內除一千四十六隻衛河提舉司九百八十隻遮洋三百四十六隻淺船六百三十四隻內除三百二十隻一各原衛所造船江南直𨽻一千三百五十一隻鎮江衛一百七十八隻蘇州衛二百一十九隻舊除二十七隻新添一百七十八隻太倉衛九十五隻鎮海衛一百三十六隻建陽衛一百二十八隻宣州衛五十隻新安衛一百隻安慶衛二百隻九江衛一百五十五隻松江守禦千户所五十隻守禦嘉興中左千户所四十隻浙江一千九百九十九隻杭州前衛一百九十七隻無除杭州右衛二百一十九隻紹興衛二百四十八隻寧波衛二百八十七隻台州衛二百七十八隻溫州衛二百七十一隻處州衛一百九十隻湖州守禦千户所五十七隻嚴州守禦千户所九十七隻海寧守禦千户所三十四隻金華守禦千户所二十五隻衢州守禦千户所四十九隻海寧衛四十七隻江西八百六十六隻南昌前衛一百八十隻除二隻南昌左衛一百三十二隻袁州衛一百七十六隻贑州衛一百隻吉安守禦千户所六十三隻安福守禦千户所四十隻永新守禦千户所三十五隻撫州守禦千户所五十隻建昌守禦千户所三十二隻鉛山守禦千户所四十三隻廣信守禦千户所三十五隻饒州守禦千户所五十二隻湖廣九百二十四隻武昌左衛一百八隻多二隻武昌衛一百一十六隻嶽州衛六十一隻荆州左衛四十三隻荆州衛四十七隻荆州右衛四十八隻安陸衛九十七隻沔陽衛九十六隻襄陽衛四十四隻蘄州衛一百二十八隻黃州衛一百隻德安守禦千户所三十六隻一清江提舉司造船南京衛分一千五百八十隻錦衣衛一十八隻金吾後衛一十四隻羽林右衛一十七隻虎賁左衛二十隻府軍衛一十三隻府軍右衛一十一隻神䇿衛一十三隻留守中衛一十一隻留守左衛一十九隻龍虎衛四十八隻驍騎右衛二十六隻鎮南衛三十七隻廣洋衛一百四隻龍江右衛一百三十九隻江隂衛七十七隻豹韜左衛一百二十八隻鷹揚衛三十一隻旗手衛二十四隻羽林左衛九隻瀋陽右衛八隻金吾前衛一十四隻武德衛三十五隻留守右衛四十三隻虎賁右衛五十五隻橫海衛七十二隻水軍右衛七十三隻豹韜衛三十四隻興武衛四十隻龍虎左衛一百四十二隻水軍左衛一百六十隻龍江左衛九十一隻江北直𨽻二千三百八十五隻淮安衛二百一十二隻大河衛三百三十二隻邳州衛一百三十三隻泗州衛三百二十四隻夀州衛一百三十六隻徐州衛一百二十三隻徐州左衛一百七十二隻歸德衛四十九隻揚州衛一百四十三隻通州守禦千户所五十四隻泰州守禦千户所四十八隻鹽城守禦中左千户所四十四隻髙郵衛一百四十二隻興化守禦千户所四十一隻儀真衛一百一十隻滁州衛七十九隻廬州衛一百四十六隻六安衛九十七隻中都留守司七百七十五隻鳳陽中衛一百九隻懷逺衛九十四隻留守左衛一百八隻鳳陽右衛一百隻鳳陽衛九十九隻長淮衛一百二十七隻留守中衛七十五隻洪塘湖屯田千户所二十隻宿州衛二十隻武平衛二十三隻一衛河提舉司造船北直𨽻九十三隻德州左衛三十五隻德州衛三十隻天津衛八隻天津左衛三隻天津右衛六隻通州右衛二隻通州左衛二隻神武中衛五隻定邊衛二隻山東五百四十一隻臨清衛二百三隻東昌衛五十二隻平山衛七十五隻濮州備禦千户所一十八隻東平守禦千户所一十九隻濟寧衛一百二十五隻兖州護衛四十九隻遮洋船三百四十六隻大河衛五十四隻揚州衛三十六隻水軍左衛二十四隻龍江左衛二十一隻龍江右衛二十五隻水軍右衛二十隻廣洋衛二十四隻江隂衛二十一隻應天衛一十二隻淮安衛三十二隻長淮衛三十六隻髙郵衛二十五隻橫海衛一十六隻船式樣底長五丈二尺頭長九尺五寸梢長九尺五寸底闊九尺五寸底頭濶六尺底梢闊五尺頭伏獅闊八尺梢伏獅闊七尺梁頭一十四座底板厚二寸棧板厚一寸七分釘一尺三釘龍口梁闊一丈深四尺使風梁闊一丈四尺深三尺八寸後斷水梁闊九尺深四尺五寸兩􅫏共闊七尺六寸造糧船則例一清江提舉司每年該造船五百三十三隻每隻該用銀一百兩以三分為率原船舊料一分旗軍自備一分官給一分該銀三十三兩三錢共該銀一萬七千七百四十八兩九錢一衛河提舉司每年該造船一百三十隻遮洋船三十五隻每隻該用銀一百二十兩以十分為率除原船舊料三分外官給新料銀八十四兩共該銀二千九百四十兩淺船九十五隻每隻以三分為率原船舊料一分旗軍自備一分官給一分該銀三十三兩三錢共該銀三千一百六十三兩五錢通該銀六千一百三兩五錢成化十七年議定清江衛河二提舉司造船料價銀一萬七千兩二十一年議準淺船舊料一分每隻添銀一十一兩有零連前官給共銀四十五兩二提舉司出批差人於浙江杭州湖廣荆州二抽分厰領回分給官軍聽其買料從便造完順運糧赴本部原差提督二提舉司官處查驗印烙𢎞治三年議準每船一隻官給銀五十兩軍自辦五十兩舊船準二十兩共銀一百二十兩十四年議準每隻增銀五兩荆州銀價悉於蕪湖取用各船禁例天順元年令馬快等船裝送官物除本船軍夫外若每船添夫關文開寫上水二十名下水五名軍三名七出辦非奉旨不許關文開寫添撥人夫字樣違者許所在官司指實具奏違例應付者一體治罪成化四年奏準馬快船不許附帶私鹽客貨若於關文外多索一夫一軍及分關前錢物者巡河御史按察司官將隨從人役并附船各商拏問民編口外軍發邊衛鹽貨入官九年兵部奏準南京進時鮮等項船隻照依所擬隻數差撥運送仍於管運官員關文內明白開寫數目以憑沿河官員查照應付本部仍通行淮揚迤北一𢃄巡撫巡按管河洪閘等官各行所在官司凡遇各起進解等項船隻經過務要逐一查驗比與今次所擬隻數相同方許應付人夫拽送前去不許畏避將夾帶數外船隻一概應付十年令馬快等船每駕船軍餘一名食米之外聽帶貨物三百斤凡南京差人奏事乘坐官船私載貨物者聽巡河御史郎中及管洪閘主事盤問治罪凡漕運軍人許𢃄土産換易柴鹽每船不得過十石違者盤檢入官凡運糧馬快商賈等船經由津渡巡檢司照驗文引若豪勢之人不服盤詰聽所司拿送巡河御史郎中處究治十二年奏準馬快船隻匱扛務要南京內外守備官員會同看驗酌量數目開報南京兵部照例會同給事中御史看驗十分滿載方許發行𢎞治十三年議準凡黃船附搭客貨及夾帶私物者小甲客商人等俱問發極邊衛分永逺充軍貨物入官若客商人等止是空身附搭者亦連小甲俱發附近衛充軍車輛諸司職掌凡大小車輛若有成造及修理者務要計算合用木植魚膠鐵篐等項物料行下丁字庫等衙門依數放支如或修造其有司預備車輛必須備知其數倘或需索使用酌量勞逸多寡撥與牛車一輛合用榆木三根棗木一根槐木一根杉木板枋一根魚線膠一斤鐵箍八箇鐵釘四十枚鐵穿四箇車澗八條車頭二箇事例洪武五年令造獨轅車山西河南共八百輛北平山東共一千輛永樂十三年令各處造車務用乾燥堅壯木植依降去樣車成造就於車上編號印烙附册開寫看驗提調官吏并匠作姓名日後有不堅固者照名究治正統十四年造戰車一千輛每輛上用牛皮一十六張下用馬皮二十四張計各處造車數目河南布政司一千四百輛都司五百輛陕西布政司五百輛都司三十輛山東布政司一千二百五十輛都司六百二十輛山西布政司一千五百輛都司八百輛鳳陽府二百五十輛徐州三十輛淮安府一百五十輛淮安衛二十五輛大河衛二十五輛夀州衛二十輛泗州衛二十輛邳州衛二十輛中都留守司一百五十輛宿州衛二十輛徐州衛二十輛北京行後府一千輛明會典卷一百六十
