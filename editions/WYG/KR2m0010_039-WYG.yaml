body:
  text: 明㑹典卷三十九户部二十四國家倉庾之設徧于天下兩京直𨽻并各布政司府州縣各都司衛所及各王府皆有倉具列于後預備倉亦附見不備録云諸司職掌凡天下設置倉厫其在各該衛所常存二年糧斛分為二十四厫収貯以備支用其在各司府州縣各有倉厫収貯糧米以給歲用且如在京衛所倉糧必須查勘見數分豁某字厫原収某年分秋糧米若干本部攢造印信文册一本進赴内府該科収貯凡各衛支過月糧本衛具手本奏進與同本部委官於原進册内註銷仍呈報本部知數其在外倉厫凡有勘合下倉放支亦必稟請提調正官眼同支給比候年終將支過數目同實在糧斛通行開報以憑稽考誥凡攬納户攬到人户諸色物件糧米等項不行赴各該倉庫納足隱匿入已虛買實収者追物還官然後處以重刑籍没家產憲綱凡在京及各布政司并巡歴地方倉庫局務等衙門但係錢糧出納去處從監察御史并按察司分司官不時巡視若有作弊就便究治倉庫房屋仰本府州縣提調官常加㸃視若有損壞即便修理及嚴加闗防官吏斗級庫子人等収支作弊仍將見在錢糧等物分豁新舊収除實在備細數目繳報兩京并直𨽻府州縣都司衞倉京倉長安門倉東安門倉西安門倉北安門倉舊太倉一十一衞忠義前衞倉忠義後衞倉義勇右衞倉蔚州左衞倉大寧中衞倉錦衣衞倉神武左衞倉景陵衞倉獻陵衞倉神武後衞倉羽林前衞倉南新倉八衞府軍衞倉燕山右衞倉彭城衞倉龍驤衞倉龍虎衞倉永清衞倉金吾左衞倉濟州衞倉新太倉七衞裕陵衞倉義勇中衞倉大寧前衞倉㑹州衞倉富峪衞倉茂陵衞倉義勇前衞倉海運倉六衞忠義左衞倉忠義右衞倉寛河衞倉燕山左衞倉義勇後衞倉義勇左衞倉北新倉五衞府軍左衞倉府軍右衞倉府軍前衞倉燕山前衞倉金吾前衞倉大軍倉四衞永清左衞倉旗守衞倉大軍倉武成中衞倉濟陽倉二衞金吾右衞倉濟陽衞倉禄米倉二衞彭城衞南新倉府軍前衞南新倉西倉五衞虎賁左衞倉大興左衞倉府軍後衞倉金吾後衞倉羽林左衞倉通州倉西倉通州衞倉通州左衞倉通州右衞倉定邊衞倉神武中衞倉武清衞倉南倉通州衞倉通州左衞倉通州右衞倉定邊衞倉中倉通州衞倉通州左衞倉通州右衞倉神武中衞倉東倉神武中衞倉水次倉五處天津水次倉徳州水次倉臨清水次倉徐州水次倉清江浦水次倉順天府壩上倉壩上東馬房倉黃土倉壩上北馬房倉鄭家莊馬房倉義河倉吳家駝牛房倉東直門裏外牛房倉壩上南倉金盞兒甸倉湯山草塲倉壩上北倉北髙倉南石渠倉山口倉􅗭石橋倉北草塲倉良鄉縣豐濟倉昌平縣居庸倉密雲縣隆慶倉古北口倉涿州常盈倉陸樊倉三河縣峪口官莊馬房倉峪口楊家橋馬房倉峪口張家莊馬房倉薊州本州倉遵化縣水盈倉喜峰口倉平谷縣積留倉河間府巨盈倉滄州長蘆倉真定府豐盈倉定州永豐倉保定府廣盈中左右倉唐縣軍城倉新興倉易州紫金新城倉易州倉永平府東盈倉永豐倉山海倉界嶺口倉劉家口倉遷安鎮倉遷安縣三屯營倉𢎞治十二年設撫寧縣撫寧倉隆慶州本州倉懷來廣阜倉雲州堡倉獨石廣積倉赤城廣備倉龍門廣盈倉長安嶺倉馬營廣盈倉鵰鶚堡倉龍門倉永寧縣永寧倉四海冶倉保安州洗馬林堡倉葛峪堡倉新興倉萬全廣積倉趙川堡倉永豐倉萬全廣盈倉懷安廣備倉宣徳倉柴溝堡倉宣政倉宣化倉膳房堡倉𢎞治九年設北直𨽻衞倉天津衞倉天津左衞倉天津右衞倉隆慶衞倉涿鹿衞倉涿鹿左衞倉涿鹿中衞倉密雲中衞倉密雲後衞倉薊州衞倉遵化衞東店倉東勝衞倉鎮朔衞東店倉萬全都司洪州舊堡倉大小白羊二堡倉青邊常峪二堡倉新河口堡倉四海冶倉張家口堡倉西陽河堡倉新河口堡倉順聖川新城馬房倉南京四十一衞倉錦衣衞烏龍潭倉旗手衞倉金吾前衞倉金吾後衞倉羽林左衞倉羽林右衞倉虎賁左衞倉虎賁右衞倉驍騎右衞倉龍驤衞倉鷹揚衞倉神䇿衞倉留守中衞倉留守左衞倉留守右衞倉留守前衞倉留守後衞倉興武衞倉豹韜衞倉府軍衞倉府軍左衞倉府軍右衞倉府軍後衞倉龍虎衞倉武徳衞倉和陽衞倉鎮南衞倉瀋陽左衞倉瀋陽右衞倉孝陵衞倉廣洋衞倉天䇿衞倉江陰衞倉水軍左衞倉水軍右衞倉應天衞倉横海衞倉龍江左衞倉龍江右衞倉龍虎左衞倉豹韜衞倉應天府常平倉鎮江府大軍倉蘇州府永豐倉嘉定縣吳淞江軍儲倉太倉州太倉軍儲倉𢎞治十年自嘉定縣改𨽻鎮海軍儲倉𢎞治十年自崑山縣改𨽻崇明縣永豐倉松江府青村倉軍儲北倉軍儲南倉上海縣廣儲倉徽州府永豐倉寧國府軍儲倉太平府豐濟倉鳳陽府本府倉廣儲一二三四五倉今歸併二倉定逺縣廣儲倉潁州廣積倉潁上縣本縣倉亳州軍儲倉泗州廣濟倉夀州本州倉宿州際留倉睢陽倉揚州府軍儲倉儀真縣廣實倉髙郵州廣儲倉興化縣永興倉通州通濟倉泰州常豐倉淮安府大軍倉常盈倉東新倉鹽城縣永積倉海州通濟倉永濟倉邳州邳州倉廬州府永豐倉六安州軍儲倉安慶府萬億倉永盈倉永福倉廣運倉永成倉事例洪武四年設軍儲倉二十所各置官掌管二十八年置皇城長安東安西安北安四門倉每倉設副使一員永樂七年置北京金吾左右羽林前常山左右中燕山左右前濟陽濟州大興左武成中左右前後義勇中左右前後神武左右前後忠義左右前後武功中寛河會州大寧前中富峪蔚州凡三十七衛倉及錦衣中懷來守禦二千户所倉每倉設副使一員十三年設淮安常盈倉令本部主事一員提督収放十五年令各倉庫収納錢糧務要納户親身上納如有兠攬作弊之人納户通同不行首吿者一體治以重罪十六年奏准凡納户送糧到倉辨騐堪中隨即収受不許刁蹬留難勒掯財物及通同盗賣虛出實収又令通州張家灣起蓋倉厫七十間名通濟倉収貯各處儧運糧宣徳三年奏准凡設内外衞所倉每倉置一門榜曰某衞倉三間為一厫厫置一門榜曰某衞某字號厫凡収支非納户及關糧之人不許入每季差監察御史本部屬官錦衣衞千百户各一員往來巡察各倉門以致仕武官各二員率老幼軍丁十名看守倉外置冷鋪以軍丁三名巡警致仕官半年更代在外倉都布按三司設法關防巡按御史㸃視凡軍民偷盗官吏斗級通同者正犯處斬仍追所盗糧入官全家發邊逺充軍給家產一半賞首吿者同盗能首者免本罪亦給被首吿者家產之半充賞其攬納虛収及虛出通關者罪同偷盜又令在京各衞添設經歴一員監収支糧其内外衞所倉俱令各衛首領官與倉官專管罷軍職管糧四年榜諭各倉凡収支糧草官吏人等有折収金銀并攬納偷盜者許諸人首吿或拏送法司正犯處斬仍追原物入官家屬發邊逺充軍首吿者賞鈔五千貫五年令在京各衞倉每厫置牌一面開所収糧數并部運官吏旗軍糧長納户及収糧官攢斗級姓名于上掛厫門以便㸃閘又令各處軍民運糧到京赴本部吿判該司徑送本部委官處定厫収受轉行該衞用印信下帖發該倉収納六年添置北京及通州倉又令南京及淮安徐州臨清各倉實収通關户部刋印仍置號簿編寫内外字號用半印空填年月每年量印㡬千道并外號簿發監収官執掌眼同該倉官攢查明填寫實収米數給付納户原籍官司吿繳比對查考七年令法司犯贓徒流死罪官吏人等有力者編充通州各衞倉斗級如官攢軍斗人等有偷盜虛出等弊許首吿得實放免仍賞鈔一千貫若通同偷盜作弊者加以重罪逃走者發口外充軍八年添設萬全都司都事一員提督所屬衞所倉十年置萬全都司赤城堡倉又令都察院副都御史一員總督南京各倉并各象馬房草塲江北應天等五衞及鳳陽府各差郎中或員外郎或主事一員御史一員專一提督収放其郎中等官三年一代御史一年一代南京錦衣虎賁左右及鷹揚等四衞空閒倉厫令户部委員外郎主事二員監督各該衙門銓撥倉官三十二員攢典三十二名軍斗一百六十名均派各倉収受糧斛又令本部郎中主事各倉塲分管糧草三年更代正統初令南京户部侍郎一員總督各倉塲糧草元年定通州五衞倉名在城中者為大運中倉城内東者為大運東倉城外西者為大運西倉又令南京六部推選郎中員外郎主事共六員各衞倉四員應天等六衞倉一員直𨽻鳳陽府倉一員監督収放又令各司府州縣無軍衞去處倉厫収糧不及一千石者官攢斗級裁革三年令各衞倉糧放支盡絶盤有糠粃米塵給與屯軍糞田又令本部侍郎一員同内官總督在京通州倉糧及提督象馬牛羊等房草豆革宣府大同各衞倉軍斗撥發囚人充當五年添設郎中主事五員分投提督徳州倉并象馬等倉塲収放又添設保徳州判官一員於偏頭關倉監収支糧龍門守禦千户所吏目一員監収支糧七年榜諭各衞差委解支官軍月糧頭目不許擅立大小把總名色及官攢人等通同作弊違者令巡倉御史并本部管糧官拏問又令南京户部每嵗委員外郎或主事一員提督倉糧註銷糧數九年添設本部主事一員於山海提督収放兼巡視永平府界嶺口劉家口喜峯口倉塲十年令總督在京通州倉侍郎兼提督臨清徐州淮安等處倉糧十四年令内外各倉塲監督収放糧草郎中主事等官一年一代囘日備開數目繳部仍將經行卷簿相沿交割若有虧折欺蔽續差官員徑自具奏革大軍倉官攢軍斗多餘之數止留大使一員副使一員攢典二名軍斗二十名景泰二年革南京總督倉塲侍郎仍令副都御史一員總督三年令在京并通州倉軍斗収糧不及三萬石者每十名内摘發五名囘衞又令南京各倉塲監督官収放糧草託故囘家致官攢人等循私作弊者照闒茸事例起送吏部又令南京各倉築立髙厚牆垣不許軍民人等就牆起蓋房屋牆外仍立冷鋪僉撥軍夫巡守革各倉塲致仕官守把門禁止令辦事官一員管理又令各倉斗級庫子開冩年甲鄉貫住址編造文册候巡視官員㸃閘又令各倉官攢斗級人等不許勒要納户分例曬米地鋪及闗糧人擡斛等項錢物又令各倉監収官員嚴督官攢庫斗人等修葺倉塲開通溝渠其有曠職坐視渰没糧草者拏問追賠四年令各倉収糧官攢軍斗不許小脚人等奪攬挑擔如納户自願雇倩者每米一百石止許小脚二十名又令直𨽻通州左等四衞并直𨽻武清衞各倉每副使一員照通州倉事例止僉撥軍斗一十五名添設山東按察司副使一員提督永平等處糧草兼理屯田五年令京倉納糧部運官逓串納户領籌其揚米摯斛行槩擡斛折席等項止許正設軍斗如納户自願雇人者聽六年令南京各倉放糧以勘合到日為始過違四十五日者扣除不支又令南京各倉止委御史及郎中等官巡視監督其本部巡倉官不必差委又令南京各倉照京通二倉會籌溜筩放米不許將帯錢物交通軍斗求打好米増多斛面違者拏問七年令京通二倉各處該納糙粳米未完者准以陳米補納仍令該倉應時放支不許存留又令兩京東安等四門倉収剰餘糧并篩揚不堪米數照光禄寺事例批冩數目即令納户領出該倉官攢刁難掯留者治罪天順元年令在京各倉塲凡把持誆騙包攬坑䧟納户攪擾倉塲之人許人指實首告連當房家小發邊逺充軍添設户部郎中一員於永平山海薊州等處一員於宣府一員於大同俱提督糧草三年又令通州新城增置倉厫三百間七年奏准直𨽻淮安府常盈倉徐州廣運倉各存留大使一員副使二員攢典二名斗級一百名修倉夫匠二百名山東東昌府臨清倉存留大使一員副使一員攢典一名斗級二十名臨清廣積倉存留大使一員副使二員攢典二名斗級三十名二倉共存留修倉夫匠二百名各倉原設官攢等項多餘之數裁減八年又令考退倉塲經歴大使副使等官仍支俸守支盡絶放囬添設鳳陽府通判一員管理廣儲等六倉糧斛成化二年令本部管糧官提調官軍人匠修理倉厫仍令巡倉御史常川㸃視十一年令京通二倉各委本部員外郎一員定厫坐撥糧米務令挨次不許狥情虛占厫座十四年令南京倉塲監督巡視等官凡浙江江西蘇松等處嫌疑地方之人照吏部銓官事例不許差委十六年令南京都察院委御史二員一員巡視各衞倉糧一員巡視象馬草塲并光禄寺等衙門原設總巡御史裁革十八年奏准南京都察院委御史二員一員分管皷樓以南一十九倉并中和橋馬草塲及長安等四門倉糧草一員分管皷樓以北一十八倉并金川門馬草塲光禄寺犧牲所及各監局等衙門糧草二十三年令京通二倉并淮安徐州臨清水次各倉塲内官原設者存留添設者取囘革鳳陽府管糧通判仍留本部主事一員御史一員巡視𢎞治七年人南京錦衣等衞烏龍潭等四十一倉仍委本部員外郎主事八員分投提督十二年奏准凡京倉小脚歇家營求在官指稱公用為由索取囤基等項錢物及别項求索許被害之人赴總督及巡倉官處陳吿就於本倉門首枷號一箇月軍發邊衞充軍民發口外為民干礙内外官員奏請定奪十三年奏准在京在外并各邊但係一應収放糧草去處若職官子弟積年光棍跟子買頭小脚跟官伴當人等三五成羣搶奪籌斛占堆行槩等項打攪倉塲及欺凌官攢或挾詐運納軍民財物者杖罪以下於本處倉場門首枷號一箇月發落徒罪以上與再犯杖罪以下免其枷號屬軍衞者發邊衞屬有司者發附近俱永逺充軍内外倉塲等處糧草并各處軍需等項不拘起運存留但有色攬誆騙不行完納事發問罪責限三箇月以裏完納者照常發落過期不完者儘其財産陪納發邊衞充軍經年不完者仍枷號一箇月照前發遣各邊武職主使家人伴當跟隨交結人員挾勢攬納作弊者參問降二級聽使之人仍照前例問發各處掌印官將所屬起解一應錢糧批文妄作人情攬與内外勢要官豪問發為民干擬勢豪參究治罪明會典卷三十九
