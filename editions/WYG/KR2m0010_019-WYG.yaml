三年後每畒收租一斗二十年令陜西屯軍五丁抽一稅糧照民田例又令屯軍種田五百畒者歲納糧五十石又令四川建昌衞附近田土先儘軍人次與小旗總旗百户千户指揮屯種自給其新立蘇州栢興㑹川涪州等衞一體摽撥又令陜西臨洮岷州寧夏洮州西寧甘州莊浪河州甘肅山丹永昌凉州等衞軍士屯田每歲所收穀種外餘糧以十分之二上倉給守城軍士三十年詔廣西遷仁屯田所土兵免納屯糧令凡屯軍内少壯者守城老弱者屯種若有餘丁多亦許屯種三十五年令各處衞所每衞委指揮一員每所委千户一員提督屯種年終以上倉并給軍子粒數目造冊赴京比較各該都司每歲仍委指揮一員督察年終同赴京復奏又令各處屯田衞所每軍歲徵正糧一十二石直𨽻差御史比較各都司所屬廵按御史同按察司掌印官比較年終造冊奏繳户部不及數者具奏降罰所收子粒行御史等官盤查永樂二年令各處衞所凡屯軍一百名以上委百户一員三百名以上委千户一員五百名以上委指揮一員提督若屯軍不及一百名者亦委百户一員提督若官員軍餘家人自願耕種者不拘頃畒任其開墾子粒自收官府不許比較又奏准屯田所受每粟榖糜黍大麥蕎穄各二石稻榖薥秫各二石五斗穇稗各三石並各准米一石小麥芝麻與米同三年更定屯田則例令各屯置紅牌一面寫刋於上每百户所管旗軍一百一十二名或一百名七八十名千户所管十百户或七百户五百户三四百户指揮所管五千户或三千户二千户提調屯田都指揮所收子粒多寡不等除下年種子外俱照每軍歲用十二石正糧為法比較將剩餘并不敷子粒數目通行計筭定為賞罰令按察司都司并本衞隔别委官㸃閘是實然後准行直𨽻衞所從廵按御史并各府委官及本衞隔别委官㸃閘歲收子粒如有稻榖粟薥秫大麥蕎麥等項粗糧俱依數折筭細糧如各軍名下除存種子并正糧及餘糧外又有餘剩數不分多寡聽各該旗軍自收不許管屯官員人等巧立名色因而分用五年浙江江西湖廣廣西廣東河南雲南四川按察司増置僉事一員陜西福建山東山西按察司増置僉事二員盤量屯糧宣徳五年令各處屯田都布按三司各委官提督在京并直𨽻衞所從廵按御史提督若有總兵官鎮守去處亦令提督十年令廵按陜西監察御史兼理屯田正統元年奏准各處屯種每軍止徵餘糧六石令陜西旗軍餘丁所種屯田五十畒之外每畒納糧五升二年令各處軍職舍人除應襲外及家人女婿無差使者每五丁朋作一名委官管領撥與閒地四十二畒耕種照屯田例辦納子粒添設浙江福建陜西等處按察司僉事各一員提督屯田三年令各都司衞所管屯官三年滿日造冊二千里以裏者赴京比較二千里以外者從按察司并廵按御史比較令四川都司衞所屯種水田者納米陸地者納豆無豆者抵斗折米四年令大同宣府遼東陜西沿邊空閒之處許官軍户下人丁儘力耕種免納子粒六年添設貴州按察司副使一員提督屯田七年添設湖廣布政司叅政一員按察司副使一員提督屯田八年令各處按察司原無提督屯田官者各添設僉事一員又令屯田有自開墾荒地每畒歲納糧五升三合五勺减延綏等處屯田軍子粒每百畒嵗納六石者止納四石减陜西行都司屯田子粒每百畒嵗納一十石减延綏等處屯田子粒每百畒嵗納八石九年令浙江等處屯軍遺下田地撥與官旗軍士户下人丁佃種照官田納糧餘剩及積荒田地撥與民間佃種照民田納糧其積荒田地待耕三年成熟亦照例徴納候有軍之日撥軍屯種十年令南京各衞正軍選操餘丁屯種其正糧一十二石餘糧六石俱免上倉供給操軍其月糧住支如本軍人丁數少屯田撥付他軍者仍支月糧减陜西行都司等處屯田子粒嵗納八石十年添設陜西按察司副使一員專一提督水利及屯田十一年令各處衞所類造屯田坐落地方四至頃畒子粒數目文冊一本繳合干上司一本發該管州縣以備查考添設山東按察司僉事一員提督北直𨽻屯田十二年令開平衞屯軍餘糧六石减免二石景㤗三年令提督南京倉塲并廵撫南直𨽻蘇松等府及順天北直𨽻各府都御史兼提督屯種四年添設山東按察司副使一員監督永平等處收支兼理屯田天順元年令京城附近直𨽻八府及山東河南等處荒閒田地及有人佃種無糧差者撥與所在衞所軍餘屯種納糧又令本部差郎中四員於宣府大同薊州永平山海等處提督糧儲兼理屯田成化六年令陜西延綏等處屯田每軍百畒徴草二束九年令榆林以南招募軍民屯田每一百畒於隣堡上納子粒六石十一年令雲南按察司總督銀塲僉事兼理屯田十三年添設雲南按察司副使一員專管屯田二十一年添設山東按察司僉事一員專管屯種二十三年裁革山東按察司管屯僉事仍令廵察海道副使兼理𢎞治十三年奏准凡用强占種屯田者問罪官調邊衞帶俸差操旗軍軍丁人等發邊衞充軍民發口外為民管屯等官不行用心清查者紏奏治罪國初農桑之政勸課耕植具有成法初皆責成有司嵗久政弛乃稍添官專理其政今具列於後諸司職掌凡民間一應桑株各照彼處官司原定則例起科絲綿等物其絲綿每嵗照例折絹俱以十八兩為則折絹一疋所司差人類觧到部劄付承運庫收納以備賞賜支用其樹株果價等項並皆照例徴收錢鈔除彼處存留支用外其餘錢鈔一體類觧本部行移該庫交收仍將存用數目出給印信通闗具本入逓奏繳本部查領附卷作數其進納絹疋錢鈔一節俱照依後項金科課程條欵一體施行教民榜文一河南山東農民中有等􅂴惰不肯勤務農業以致衣食不給朝廷已嘗差人督併耕種今出號令此後止是各該里分老人勸督每村置鼓一面一凡遇農種時月五更老人擂鼓衆人聞鼓下田該管老人㸃閘若有􅂴惰不下田者許老人責决務要嚴切督併見丁着業毋容惰夫逰食若是老人不肯勤督農民窮窘為非犯法到官本鄉老人有罪一如今天下太平百姓除本分納糧當差之外别無差遣各宜用心生理以足衣食每户務要照依號令如法栽種桑株棗柿綿花每嵗養蠶所得絲綿可以衣服棗柿豐年可以賣鈔使用遇儉年可以當糧食此事有益爾民里甲老人如常提督㸃視敢有違者家遷化外憲綱一農桑乃生民衣食之源仰本府州縣行移提調官常用心勸諭農民趂時種植仍將種過桑麻等項田畒計料絲綿等項分豁舊有新收數目開報事例國初令天下農民凡有田五畒至十畒者栽桑麻木綿各半畒十畒已上者倍之田多者以是為差有司親臨督視惰者有罰不種桑者使出絹一疋不種麻者使出麻布一疋不種木綿者使出綿布一疋洪武元年奏准桑麻科徴之額麻每畒八兩木綿每畒四兩栽桑者四年以後有成始徴其租十八年以農桑起科太重百姓艱難令今後以定數為額聽從種植不必起科二十五年令鳯陽滁州廬州和州每户種桑二百株棗二百株柿二百株宣德二年添設浙江錢塘仁和海寜新城昌化嘉興海鹽崇徳八縣縣丞各一員治農正統八年令各處不出蠶絲處所每絹一疋折銀五錢觧京支用成化元年添設河南山東等布政司叅政各一員所属各府同知一員職專提督人民栽種耕耘及預備倉糧糴買勸借九年添設蘇松常鎮湖五府并所属長洲等縣勸農通判縣丞各一員十年添設山東布政司叅政一員專理勸農十一年添設直𨽻祁安滄冀深趙州平谷滿城容城完雄深澤束鹿髙陽新安河間獻阜城肅寧任丘東光故城南皮慶雲真定井陘獲鹿元氏靈壽槀城欒城無極平山阜平南宫新河棗强武邑饒陽安平武强栢鄉隆平髙邑臨城賛皇寧晉衡水沙河南河平鄉廣宗任唐山鉅鹿内丘永年曲周肥鄉鷄澤廣平邯鄲成安威元城大名南樂魏清豐内黄濬滑長垣縣判官主簿各一員專理勸農添設江西南昌新建豐城進賢建昌臨川崇仁樂安新喻新淦廬陵吉水永新㤗和永豐安福新昌鄱陽樂平餘干縣主簿各一員勸農添設湖廣沔陽荆門二州黄岡麻城江陵監利棗陽衡山安仁慈利縣判官主簿各一員勸農添設河南光州判官一員尉氏滎澤商水夏邑新野淅川新安西平信陽確山新蔡息縣主簿各一員勸農添設應天府溧陽溧水二縣主簿各一員勸農十九年添設山西布政司叅政一員專理農務二十一年添設海泰二州鹽城沭陽贛榆縣判官主簿各一員勸農國朝重䘏民隠凡遇水旱災傷則蠲免租稅或遣官賑濟蝗蝻生發則委官打捕皆随時與地而異其法云諸司職掌凡各處田禾遇有水旱災傷所在官司踏勘明白具實奏聞仍申合干上司轉逹本部立案具奏差官前往災所覆踏是實將被災人户姓名田地頃畒該徵稅糧數目造冊繳報本部立案開寫災傷縁由具奏如奉㫖賑濟仍定奪大小男女口數則例差官前去賑濟給賞畢日仍將散過糧鈔分豁備細數目造冊繳報以憑稽考誥往為有司徴收稅糧不便所以復設糧長教田多的大户管着糧少的小户想這等大户肯顧自家田産必推仁心利濟小民當復設之時特令赴京面聽朕言闗給勘合不許地方犬牙相制只教官着周圍附近的人户易催易辦若區内田有洒𣲖的教收在自户下不過割的便過割了如果有積年荒田明白具本來奏除豁了各糧長目擊耳聞前去一至本鄉巧立名色其弊多端剥削吾良民不可勝言地方依舊犬牙相制民間洒𣲖包荒不過割的俱不來奏知却通同刁猾頑民妄告水災本災一分告災十分及至差人詣所在查踏却乃多方設計賄賂所差進士行人監生扶同准災揑合回奏其被災人户災本一分今告十分並不敢將此等人户一槩赴京賑濟以致實災小民混淆難以分别至今不得賑其貧乏使朕宵衣皇皇無已吁朕設糧長本欲便於細民不期此等之徒奸貪無厭身家不顧實為民患惟天可鍳智人詳之明祖訓凡天下承平四方有水旱等災當驗國之所積於被災去處優免稅糧若豐稔之嵗雖無災傷又當騐國所積稍有附餘擇地痩民貧處亦優免之不為常例然優免在心臨期便决勿使小人先知要名於外事例洪武元年令水旱去處不拘時限從實踏勘實災稅糧即與蠲免十八年令災傷去處有司不奏許本處耆宿連名申訴有司極刑不饒二十五年令山東災傷去處每户給鈔五錠二十六年令天下有司凡遇嵗饑先發倉廪賑貸然後具奏二十七年定災傷去處散糧則例大口六斗小口三斗五嵗以下不與永樂元年令吏部行文各處有司春初差人廵視境内遇有蝗虫初生設法撲捕務要盡絶如是坐視致使滋蔓為患者罪之若布按二司官不行嚴督所屬廵視打捕者亦罪之每年九月行文至十一月再行軍衞令兵部行文自是永為定例二年定蘇松等府水渰去處給米則例每大口米一斗六嵗至十四嵗六升五嵗以下不與每户有大口十口以上者止與一石其不係全災内有缺食者原定借米則例一口借米一斗二口至五口二斗六口至八口三斗九口至十口以上者四斗候秋成抵斗還官六年令福建瘟疫死絶人户遺下老㓜婦女兒男有可驗口給米稅糧鹽米各項暫且停徴待成丁之日自行立户當差八年令被災去處人民典賣子女者官為給鈔贖還二十二年令各處災傷有按察司處按察司委官直𨽻處廵按御史㑹同踏勘宣徳九年差給事中御史錦衣衞官往山東河南打捕蝗虫正統五年令各衞所屯軍有因水旱子粒無收缺食者照缺食民人事例賑濟候秋成還官九年令揚州府江潮泛漲渰死人民量給鈔錠收瘞景泰四年山東河南江北直𨽻徐州等處災傷令所在問刑衙門責有力囚犯於缺糧州縣倉納米賑濟雜犯死罪六十石三流徒三年四十石徒二年半三十五石徒二年三十石徒一年半二十五石徒一年二十石杖罪每一十一石笞罪每一十五斗成化十二年令各處廵按御史按察司官踏勘災傷係民田者㑹同布政司官係軍田者㑹同都司官𢎞治十一年令災傷處所及時委官踏勘夏災不得過六月終秋災不得過九月終若所司報不及時風憲官徇情市恩勘有不實聽本部叅究明㑹典卷十九
