body:
  text: 明㑹典卷十九户部四諸司職掌凡各州縣田土必須開豁各户若干及條段四至係官田者照依官田則例起科係民田者照依民田則例徴斂務要編入黄冊以憑徴收税糧如有出賣其買者聽令増收賣者即當過割不許洒𣲖詭寄犯者律有常憲其民間開墾荒田從其自首首實三年後官為收科仍仰所在官司每嵗開報本部以憑稽考凡公侯禄米各有等第皆於浙西蘇松等府官田内撥賜其佃户仍於有司當差凡民間有犯法律該籍沒其家者田土合拘收入官本部書填勘合類行各布政司府州縣將犯人户下田土房屋召人佃賃照依沒官則例收科仍將佃户姓名及田地頃畆房屋間數同該科税糧賃錢數目開報合干上司轉達本部知數十二布政司并直𨽻府州田土總計八百四十九萬六千五百二十三頃零浙江布政司田土計五十一萬七千五十一頃五十一畒湖廣布政司田土計二百二十萬二千一百七十五頃七十五畒河南布政司田土計一百四十四萬九千四百六十九頃八十二畒零江西布政司田土計四十三萬一千一百八十六頃一畒北平布政司田土計五十八萬二千四百九十九頃五十一畒陜西布政司田土計三十一萬五千二百五十一頃七十五畒廣西布政司田土計一十萬二千四百三頃九十畒山東布政司田土計七十二萬四千三十五頃六十二畒山西布政司田土計四十一萬八千六百四十二頃四十八畒零廣東布政司田土計二十三萬七千三百四十頃五十六畒四川布政司田土計一十一萬二千三十二頃五十六畒福建布政司田土計一十四萬六千二百五十九頃六十九畒雲南布政司田土原無數目直𨽻蘇州府田土計九萬八千五百六頃七十一畒寧國府田土計七萬七千五百一十六頃一十一畒徐州田土計二萬八千三百四十一頃五十四畒滁州田土計三千一百五十頃四十五畒池州府田土計二萬二千八百四十四頃四十五畒揚州府田土計四萬二千七百六十七頃三十四畒廬州府田土計一萬六千二百二十三頃九十九畒安慶府田土計二萬一千二十九頃三十七畒松江府田土計五萬一千三百二十二頃九十畒鳯陽府田土計四十一萬七千四百九十三頃九十畒應天府田土計七萬二千七百一頃二十五畒廣德州田土計三萬四十七頃八十四畒淮安府田土計一十九萬三千三百三十頃二十五畒徽州府田土計三萬五千三百四十九頃七十七畒零常州府田土計七萬九千七百三十一頃八十八畒鎮江府田土計三萬八千四百五十二頃七十畒太平府田土計三萬六千二百一十一頃七十九畒和州田土計四千二百五十二頃二十八畒𢎞治十五年十三布政司并直𨽻府州實在田土總計四百二十二萬八千五十八頃九十二畒零官田共五十九萬八千四百五十六頃九十二畒零民田共三百六十二萬九千六百一頃九十七畒零浙江布政司官田五萬四千七百八十一頃九十三畒九分六釐民田四十一萬七千五百六十頃七十七畒八分一釐湖廣布政司官田一十八萬五千八百九十六頃二十三畒六分民田五萬二百三十二頃二十三畒二釐河南布政司官田三千八百四頃四十六畒民田四十一萬二千二百九十五頃二十二畒四分七釐江西布政司官田二萬六千八百七十頃四十二畒九分六釐民田三十七萬五千四百八十二頃三畒七分一釐陜西布政司官田六千八百六十二頃九十五畒二分四毫民田二十五萬三千七百九十九頃八十六畒六分廣西布政司官田二千八百四十一頃五十四畒四分七毫民田一十萬五千六頃四十七畒三分二釐七毫山東布政司官田二千八百九十二頃九十畒三分三釐九毫民田五十四萬三十六頃四十七畒二分九釐九毫山西布政司官田一萬一千九百五十七頃九十一畒五分七釐民田三十七萬八千八百五十一頃四十二畒三分六釐廣東布政司官田一萬七千九百六十一頃九十六畒二分三釐民田五萬四千三百六十二頃四十九畒九分三釐四川布政司官田二千一百三十四頃一十二畒三分五釐六絲民田一十萬五千七百三十五頃五十畒三分三毫福建布政司官田一萬一千二百九十頃八十五畒一釐八絲民田一十二萬三千八百七十五頃三十二畒七分八釐雲南布政司官田二百五頃五十六畒四分三釐民田三千四百二十五頃七十八畒五分七釐貴州布政司田地自來原無丈量頃畒每歲該納糧差俱於土官名下總行認納如洪武年間例直𨽻蘇州府官田九萬七千七百八十六頃三十五畒三分六釐三毫民田五萬七千四百六十三頃六十二畒四分六釐三毫寧國府官田九千七百七十一頃八十八畒六釐二毫民田五萬九百一十一頃九畒一毫徐州官田二百三頃三十五畒二分二釐一毫民田二萬九千八百八頃八十七畒六分四釐滁州官田二百四十頃六十五畒九分七毫民田二千六百七十二頃一十七畒九分二毫池州府官田一千八百二十三頃五十七畒四分九釐三毫民田七千九十六頃五畒六分五釐八毫揚州府官田七千九百三十四頃五十七畒二分二釐民田五萬四千三百六十二頃四十九畒九分三釐廬州府官田五百六十八頃七十六畒一分七釐七毫一絲民田二萬四千八百六十一頃六十九畒八分一釐安慶府官田四百九十七頃六十二畒三分三釐民田二萬一千三百九十三頃三畒八分四釐松江府官田三萬九千八百五十六頃三十三畒五分二釐九毫民田七千三百頃二十八畒三分五釐七毫鳯陽府官田一千五百八十五頃五十六畒民田五萬九千六百七十七頃一十畒七分六釐七毫應天府官田一萬九千九百六十四頃三十九畒四分四釐民田五萬九頃六十八畒七分四釐五毫一絲廣德州官田一千三十九頃三十六畒六毫民田一萬四千三百六十四頃九十三畒八分淮安府官田五千三十九頃八十六畒三分二釐六毫九絲民田九萬六千三十三頃八十七畒九釐五毫六絲徽州府官田八百二十一頃五十七畒四分六釐八毫民田二萬四千四百五十五頃九十四畒六分三釐常州府官田九千四十一頃五十五畒六分八釐四毫民田五萬二千七百三十六頃一十九畒八分八釐鎮江府官田一萬三百五十六頃八十六畒二分五釐五毫民田二萬二千三百六十五頃四十八畒九分三釐太平府官田四千四百五十五頃六十三畒四分二釐三毫民田一萬一千七百八十八頃一十九畒七分九釐和州官田六千四十八頃一十三畒二分七釐九毫民田五千八百四十三頃五十六畒二分六釐七毫順天府官田八百三十五頃五十五畒七分九釐一絲五忽民田六萬七千八百八十四頃五十七畒七分八釐永平府官田一百頃六十八畒九分七釐八毫民田一萬四千七百四十三頃八十八畒六分三釐真定府官田五百一十頃三畒八分二釐八毫五絲九忽民田三萬八千四百七十頃六十一畒六分七釐保定府官田四百八頃六十二畒三分一釐九毫三絲民田三萬五千一百二十頃八十八畒五分八釐順德府官田七十九頃二十一畒八分三毫五絲民田一萬三千七百四十三頃三十四畒一分三釐廣平府官田一百一十六頃八十九畒八釐三毫民田二萬一百二十一頃二十五畒一分四釐大名府官田五萬一千七百三十九頃六十二畒二分四釐民田二百五十四頃四分三釐二毫河間府官田一百二十九頃三十六畒四釐四毫四絲民田二萬四千九十一頃三十五畒八分四釐一毫保安州民田三百四頃五十七畒七分五釐隆慶州民田一千五十九頃四十二畒四分二釐明令凡典賣田土過割稅糧各州縣置簿附寫正官提調收掌随即推收年終通行造冊觧府毋令産去稅存與民為害凡民間賦稅自有常額諸人不得於諸王駙馬功勲大臣及各衙門妄獻田土山塲窰冶遺害於民違者治罪誥應天宣城太平廣徳鎮江五府州為是興王之地久被差徭特將夏秋稅糧不時全免惟元宋入官田地我朝籍沒之田民田全免官田若令全免民難消受所以减半徵收凡民間洒𣲖包荒詭寄移坵換叚這等俱是姦頑豪富之家將次沒福受用財賦田産以自己科差洒𣲖細民境内本無積年荒田此等豪猾買嘱貪官汚吏及造冊書筭人等其貪官汚吏受豪猾之財當科糧之際作包荒名色徵納小户書筭手受財將田洒𣲖移坵換叚作詭寄名色以此靠損小民此誥續出所在富家當體朕意將田歸於已名照例當差倘不體朕意所在被害人户及鄉間鯁直豪傑㑹議將倚恃豪傑之家捉拿赴京連家遷發化外將前項田土給賞被擾羣民的不虚示將自己田地移坵換叚詭寄他人及洒𣲖等項事發到官全家抄沒若不如此靠損小民事例洪武初令官田起科每畒五升三合五勺民田每畒三升三合五勺重租田每畒八升五合五勺蘆地每畒五合三勺四抄草塌地每畒三合一勺沒官田每畒一斗二升又令各處人民先因兵燹遺下田土他人開墾成熟者聽為己業業主已還有司於附近荒田撥補又令各處荒閒田地許諸人開墾永為己業俱免雜泛差科三年後並依民田起科稅糧又令復業人民見今丁少而舊田多者不許依前占護止許儘力耕墾為業見今丁多而舊田少者有司於附近荒田驗丁撥付三年令以北方府縣近城荒地召人開墾每户十五畒又給地二畒種菜有餘力者不限頃畒皆免三年租稅七年詔蘇松嘉湖等府田如每畝起科七斗五升者减半十三年詔陜西河南山東北平等布政司及鳯陽淮安揚州廬州等府民間田土許儘力開墾有司毋得起科又令减蘇松嘉湖四府重租糧額舊額田畝計七斗五升至四斗四升者减十之二四斗三升至三斗六升者减十之一俱止徵三斗五升以下仍舊十五年令天下僧道常住田土不許典賣又令各處奸頑之徒將田地詭寄他人名下者許受寄之家首告就賞為業二十年令本部覈實天下土地其兩浙等處富民多畏避徭役詭寄田産遣監生往丈量畫圖編號悉書主名為魚鱗圖冊以備查考二十四年令公侯大官以及民人不問何處惟犁到熟田方許為主但是荒田俱係在官之數若有餘力聽其再開其山塲水陸田地亦照原撥賜則例為主不許過分占為己有又令山東槩管農民務見丁着役限定田畒着令耕種敢有荒蕪田地流移者全家遷發化外充軍二十六年令開墾荒蕪官田俱照民田起科二十八年令山東河南開荒田地永不起科永樂三年凡開墾官湖作官田每畒夏稅麥二升秋糧米三斗十三年令民間事故人户抛荒田土有司取勘開豁稅糧另行承佃如係官田亦照民田起科宣徳四年詔各處官田每畒舊例納糧一斗至四斗者各减十分之二四斗一升至一石以上者各减十分之三正統元年令浙江直𨽻松蘇等處官田准民田起科每畒秋糧四斗一升至二石以上者减作二斗七升二斗一升以上至四斗者减作二斗一斗一升至二斗者减作一斗三年詔各處凡有入額納糧田地不堪耕種另自開墾補數者有司勘實不許重復起科四年奏准江西浙江福建并直𨽻蘇松等府凡官民田地有因水坍漲去處令所在有司逐一丈量漲出多餘者給與附近小民承種照民田則例起科坍沒無田者悉與開豁稅糧六年令山東河南北直𨽻并順天府但有開荒無額田地俱從輕起科五年令北直𨽻府州縣將富豪軍民人等包耕田地除原納糧田地外其餘均撥貧民及衝塌田地人户耕種照例起科其貧民典當田宅年久無錢取贖及富豪軍民占種逃民田地待復業之日照數斷還原主十三年令各處寺觀僧道除洪武年間置買田