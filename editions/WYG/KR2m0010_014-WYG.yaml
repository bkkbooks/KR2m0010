body:
  text: 明會典卷十四吏部十三考功清吏司諸司職掌郎中員外郎主事掌文職官吏之考課考覈官吏見於諸司職掌者若京官試職有司官遇缺借除之類後事例多不同今備載之諸司職掌一凡在京六部太常司光禄司通政司太理寺國子監太僕寺欽天監翰林院太醫院儀禮司屬官五軍都督府各衛軍職文官應天府首領官并所屬上元江寧二縣官俱從本衙門正官考覈應天府五品以下官監察御史從都御史考覈給事中從都給事中考覈東宫官王府官尚寶司中書舍人都給事中儀禮司行人司正官從本衙門將該考官員行過事蹟并應有過犯備細開寫送本部考覈欽天監翰林院太醫院正官都御史試職實授頒給誥勅取自上裁其有特恩實授給與誥勅者不拘此例一凡在京官初入仕者且令試職一年後考覈堪用者與實授不堪用者降黜量才録用其在任未經考覈試職官遇有調除仍於本衙門及别衙門本等職事内用通理月日降除及對品改除者止理見任月日俱候一年照例考覈或有為事釋免再任除授者試職照例考覈一凡六部五品以下官太常司光禄司通政司大理寺國子監太僕寺欽天監翰林院太醫院儀禮司屬官厯任三年聴於本衙門正官察其行能驗其勤惰從公考覈明白開寫稱職平常不稱職詞語送監察御史考覈本部覆考其在京軍職文官俱從監察御史考覈各以九年通考其四品以上官員任滿黜陟取自上裁其在外有司官員三年考滿給由到京考覈平常稱職者遇缺借除京官亦以九年通考若行人司行人以一年為滿從本司正官考覈分豁稱職不稱職呈送禮部轉送本部覆考稱職者於從九品内陞用不稱職者於未入流品官内叙用有過罰差一年儀禮司序班在職一年本司考覈堪用不堪用送禮部轉行本部覆考堪用請㫖實授不堪用黜降若三年考滿俱發監察御史考覈送本部覆考但係一應京官三年考滿具奏俱於在京對品内調用一凡通政司光禄司翰林院尚寳司給事中中書舍人東宫官俱係近侍官貟監察御史係耳目風紀之司太醫院欽天監及王府官不係常選任滿黜陟取自上裁一凡在京五品以下官俱令試職候一年後考覈定奪比先除授已經試職一年二年之上及已實授一年二之上者一例考覈試職堪任用者與實授及已實授堪任用者俱給與誥勅三年考滿許請封贈其試職及已實授而不堪任用者一體黜降其有經考滿復任者不必再考頒給誥勅聴請封贈已入流倉官不須試職候一年任滿給與勅命守支未入流品官貟俱與實授不給勅命以上付發司封具奏頒給施行事例凡在京官洪武初三年一調用二十九年始以九年為滿三十年定考覈署事官貟等第勤慎者仍治其事實授在任三月才力不逮者奏請黜降𢎞治元年令兩京各衙門屬官考滿堂上官出與考語送都察院并吏部覆考如原来考語得當續出考語不嫌雷同不當聴覆考官從公考覈平常者引奏復職有贓者罷黜為民其有前考平常後能懲艾勉於為善者亦宜書稱前考稱職後或放肆改節者亦書平常以憑黜陟凡在京堂上正佐官三年六年考滿不停俸在任給由不考覈不拘貟數引至御前奏請復職永樂元年奏准太僕寺光禄寺通政司大理寺國子監鴻臚寺翰林院五品以下堂上官照例不考五年奏准詹事府六品以上官照太常寺等官例亦不考俟九年奏請黜陟南京堂上官考滿日停俸赴京給由其年七十以上例應致仕者皆不引奏特具本奏請取自上裁凡各處巡撫都御史三年六年考滿移咨到部具奏復職仍行本官知㑹凡欽天監官考滿洪武四年奏准職司天文比與常選人貟不同不准考滿三十五年令欽天監正佐官俱不考覈今大小官貟俱照例考滿凡各科給事中考滿正統二年奏准本科如無都給事中許掌科給事中考覈凡五府六部等屬官首領官行人司行人天地等壇長陵等陵官俱咨都察院劄付河南道考覈牒回覆考凡兵馬司兵馬考滿先赴兵部考覈咨送本部行河南道覆考京縣管馬官亦咨兵部轉行太僕寺查馬數咨回本部發落凡左右春坊司經局尚寳司六科給事中中書舍人神樂觀提㸃知觀考滿俱不咨都察院止本部考覈九年考滿定該陞品級具奏取自上裁行人司司正司副亦止本部考覈凡順天府治中通判推官三年六年考滿咨送都察院堂上官考覈咨回本部覆考凡中書舍人九年考滿稱職成化四年奏准係進士舉人出身者陞貟外郎監生出身陞主事乞恩報効出身陞寺副等官凡在京衙門堂上官及監察御史調除外任雖品級相等俸月不准通理其餘調外任者品級相等俱准通理凡兩京所正所副所丞大使副使司獄等官俱例不考覈查俸明白引奏復職九年考滿雖係事繁衙門止陞一級凡王府官及䕶衛首領官洪武三十年例不考覈凡南京庫官周嵗考滿户部查錢糧明白送部入選凡南京各衙門官貟俱南京吏部都察院考覈停俸赴京給由本部類引復職給憑還任成化二十二年奏准六年考滿不赴京凡在京官貟三年六年考滿俱不停俸在任給由滿後三月無故不給由者叅問公差准理厯俸三十六箇月或三十七箇月俱准一考多厯少厯俱叅問凡各帶俸官員本衙門查有相應貟缺照該陞品級陞授如無亦陞各衙門相應職銜仍帶俸凡内府各衙門工匠出身官貟九年考滿成化十四年奏准俸職俱不陞右在京官諸司職掌凡在外有司府州縣官三年考滿先行呈部移付選部作缺銓注司勲開黄仍令給由其見任官將本官任内行過事蹟功業文冊紀功文簿稱臣僉名交付本官親賫給由如縣官給由到州州官當面察其言行辦事勤惰從實考覈稱職平常不稱職詞語州官給由到府府官給由到布政司考覈如之以上俱從按察司官覆考仍將考覈覆考詞語呈部直𨽻府州縣官考覈如前其府官給由送監察御史考覈本部覆考類奏以上三年考滿給由考覈平常稱職者於對品内别用不稱職正官佐貳官黜降首領官貟充吏役俱以九年通考黜陟其雲南有司官貟任滿給由一體考覈不稱職者黜降縁係邊方具奏復任九年通考一凡各處布政司按察司鹽運司首領官屬官從本衙門正官考覈按察司首領官從監察御史考覈其餘衙門並從本道按察司覆考其茶馬司鹽課提舉司正官至首領官并在外軍職文官任滿俱送本處布政司正官考覈仍送本處按察司覆考布政司官四品以上按察司鹽運司五品以上俱係正官佐貳官三年考滿由進牌别無考覈衙門從都察院考覈本部覆考具奏黜陟取自上裁明令凡各處府州縣官貟任内户口増田野闢為上所行事蹟從監察御史按察司考覈明白開坐實蹟申聞以憑黜陟凡各處任滿官貟須要隨即將帶家小起離任所親賫解由到省次日引見如到来當該房分不行引見問罪事例凡布政司堂上官咨送都察院考覈按察司官徑赴都察院投文考覈俱本部覆考首領等官河南道考覈本司覆考洪武十七年令布政司按察司官年終来朝將所屬官貟考過堪用平常不堪用名數親自奏聞直𨽻府州官同天順四年奏准管屯副使僉事考滿到部將任内該管屯田數目移文該部查理如果完結考作稱職不完考平常凡南北直𨽻府州正佐官及衛首領官無上司所轄者考滿到部俱送河南道考覈牒回本司覆考係清軍者兵部稽考清解軍數管馬者兵部行太僕司稽考馬數管糧及帶辦商稅者户部稽考有無拖欠俱待移咨到日方准引奏洪武二年詔府州縣正官三年一考課吏部考覈黜陟佐貳及首領官在任三年所司具其政績申達省部吏目典史在任者給由到京三年奏准府同知一考無過者陞知府知縣二考無過者陞知州縣丞一考無過者陞知縣十二年奏准兩廣所屬地有瘴癘者有司俱以三年陞調雖係兩廣而無瘴癘者仍以九年為滿福建汀漳二府湖廣郴州江西龍南安逺二縣地亦瘴癘一體三年陞調三十五年令有司官三年考滿到部考覈稱職平常者俱復任九年通考不稱職者仍依例降用宣徳五年奏准天下官貟三年六年考滿者俱令赴部給由所欠税糧立限追徵九年考滿就便銓注任内錢糧完足方許給由正統三年奏准有司親民官貟考滿給由牌内開寫任前并任内逃民數目及招撫復業多少以憑黜陟五年令在外大小衙門官貟考滿除教職隂陽醫學外俱照洪武年間定制即便離職依限給由赴京考覈其牌冊内滿後有開支俸管事者不准十年奏准沿海收糧官員三年考滿俱留辦事候九年通考赴部𢎞治二年奏准有司官雖不開稱職平常不稱職字様其詞内有勤能端謹者即以稱職論頗可者即以平常論誤事􅂴惰者即以不稱論初考二考就與定稱否引奏復職三考仍候行查定奪全無考覈詞語者行查差錯官吏俱照例叅問三年奏准雲南貴州布政司官除方靣知府外同知以下并軍職衙門首領官三年六年考滿許赴本布政司給由其浙江等布政司并南北直𨽻府州縣等衙門官員三年六年俱赴部給由驛逓等官在外者赴本布政司南直𨽻者赴南京吏部俱造牌冊繳部北直𨽻者赴本部給由又奏准給由官貟厯俸或一百八箇月或一百一十箇月俱准九年考滿若多厯少厯者俱叅問少厯一月以上者問罪復除補任未及一月者若任内錢糧等項俱已完結亦照例問罪免其補輳考覈選用如有未完事件雖少厯亦令回任完結方許給由九年奏准凡天下司府佐貳官及州縣正佐并衛所首領五品以下官員九年考滿到部考覈繁稱無過陞二級有過并簡而稱職無過陞一級若繁簡平常有徒杖罪或初次不給由者俱照例逓降定擬該陞該降品級挨次選用若守候一年之上有願逓減選用者比照從四品告願正五品事例除授職事仍給與該陞服色俸級凡行太僕寺卿丞考滿永樂三年命從都察院考覈吏部覆考黜陟八年奏准北京遼東陜西甘肅等處苑馬寺卿丞等官依行太僕寺官例考覈主簿從本寺考仍送都察院河南道考覈本部覆考其屬官監正監副録事止於各寺考本部覆考圉長三年考滿從本監本寺官考覈闒茸不稱者送部黜降稱職平常者仍令在任六年再考九年通考仍行兵部稽其所養馬數陞降其九年考滿者先以缺申部候代官至方許給由凡鹽運司判官永樂八年奏准依本司堂上官例考覈凡考滿官吏在途病故正統五年奏准所在官司㨿其隨行親人具告即便差人相視明白給與堪信文憑遺下原賫牌冊批文就與轉繳凡都察院理刑推官黜改知縣者雖品級相等不准通理刑部都察院司獄税課司大使改除千户所吏目亦不准通理凡給由例限南直𨽻并浙江等布政司俱一年零二箇月北直𨽻八箇月凡在外起送考滿官俱要合干上司查勘明白一一具結如無一處印信保結者行查凡紙牌内不填小日不僉書不稱臣該吏背書不畫字稽勲司駁送本司紀録年終類奏凡公文批牌内不開除授到任考滿年月日期増减十嵗以上户口無新増俸月多厯少厯不開前任事蹟隠匿過名及紙牌不填字號漏用印信批咨申結内洗改為事丁憂患病痊可年月緊關字様者俱叅問少厯者復除補輳若増减不及十嵗差錯籍貫出身除授復任年月日不署職背書該吏名缺不開報及丁憂起復復除共輳九年不開前後備細俸月者俱准改正凡患病二年之上雖有文憑不准不及二年患帖無告官痊可月日亦不准凡中途聞喪不將牌冊赴所在官司告繳及至起復之日方告繳者送問若中途被水火盗賊失落公文者行查凡丁憂起復更調改除官貟前後兩任以十八箇月為半如前任日少許通理多則再厯三年不得以後任輳滿其厯過俸月於後考内通理凡三年六年雖有專責差占必須一次給由違者送問仍照例考察繁稱有過者止陞一級簡稱及繁平常有過者俱本等用簡平常有過者降一級若有例前納米曽經繳報牌冊到部者不在此限其雲南所屬官三年六年不行赴本布政司給由不繳牌冊到部亦同此例凡厯任六年止具三年事蹟給由者舊例叅問今准作三年考滿亦不補造六年牌冊候九年考滿以六年事蹟再造牌冊給由𢎞治十五年令考察行太僕寺苑馬寺官不必㑹同布按二司各寺官果有才行超卓者一體推舉陞用又奏准在外衙門七品以上官有三年或六年曽經到部考稱及任内曽有旌異例該陞擢自願致仕者本部擬陞職銜或加散官服色令其致仕如左右布政使無官可陞另行奏請定奪右在外有司官諸司職掌一凡内外雜職官三年給由無私過未入流陞從九品從九品陞正九品税課司局及河洎所倉庫官先於户部查理嵗課軍器織染雜造等局官送工部查理造作花銷明白送部通類具奏其倉官收糧不及千石者本等用虧折陪納足備者照依品級降用其有私笞者本等用但犯贓私并私罪曽經杖斷未入流降邊逺從九品降未入流不識字者本等用如有學無成效及罷閒生貟除授雜職者犯􅂍私杖罪發在京衙門書寫事例凡倉庫司局等官俱行户部查勘經收錢糧河洎所官行户工二部查勘魚課織染局官行工部查勘叚疋鹽課税課司局官行户部查勘鹽課商税在南京者俱由南京查勘明白起送赴部洪武九年令倉庫司局管錢榖官以厯俸周嵗為滿收受少者以數付交代官給由多者以半俸守支畢日給由雖經改除亦以九年通論十四年令各處倉官周嵗考滿守支俸給三分内支一分守支畢日未入流陞從九品已入流陞正九品二十八年奏准内外倉官厯過全俸雖未周嵗所收糧數已滿千石遇有父母喪守制服滿後照起復官員本等改用又令内庫官一年為滿就将原收物件盤與新官接管給由對品改用永樂八年奏准順天府廣備庫大使副使照内府庫官事例周嵗為滿給由正統元年奏准在京居賢等坊草塲大使副使收草十萬束以上者陞一級不及數者本等用又奏准山東都司所屬沿海倉官考滿守支盡絶給由布政司查理明白仍送原衙門照例給由五年奏准司府州縣衛所考滿丁憂起復倉庫税課司河泊所官将任内收過課程等項備開納獲通關字號及倉庫錢糧支銷明白餘剰物件交與見任官攅收掌支銷取具各該府州縣衛所官吏保結轉達布政司都司就令考滿官員親賫赴京丁憂回還原籍者將首尾交盤明白亦將縁由申報本部候各官起復以憑查考𢎞治五年奏准大同宣府遼東甘肅等處各草塲官俱以九年為期或八年前後遇例差官經盤堆垜如法數目不少准令起送凡倉塲官收糧千石草十萬束以上無過陞一級有笞杖罪本等用徒罪降用收糧不及千石草不及十萬束本等用有過降用係雜職降邊逺雜職内用若收糧不及千石草不及十萬束者厯俸週嵗許交盤給由其在大司宣府者守支盡絶其盤收前官糧草該减俸如支盡絶給由到任半年無糧收受者起送赴部行户部查勘明白付文選司别用若初到之時雖曽盤收不係經收者亦起送其正糧守支盡絶即當减俸若守候二年之上放支不盡絶者仍聴全支本等俸給不及二年不許仍支全俸或守支間奉上司委署别衙門印信亦不許遷延過違年限丁憂復除或改除河泊所官千户所吏目俸月不准通理違者皆送問凡在京長安四門倉副使不係經收糧斛官員本等入選南京者具奏入選凡在外河泊庫官鹽税局織染局鹽倉茶鹽批驗所等官三年六年考滿係北直𨽻者赴本部考覈引奏復職係南直𨽻者赴南京吏部係布政司者赴各布政司查理明白就令復職各布政司仍將各官牌冊具本差人類繳候九年通考以憑查考若丁憂起復改除者前任少許通理多則不許通理違者俱送問多厯少厯違限錯厯亦俱送問九年無過陞一級有過本等用凡内外收糧經厯州判官吏目俱以三年為滿守支盡絶給由到部送河南道考覈本司覆考具奏入選南京所屬俱由南京河南道吏部考覈其有丁憂起復未經南京衙門考覈者行查各衛倉經厯每衛止留一員收糧斛其餘三年一替起送赴部俱以原職改除補輳九年照依繁簡事例考覈黜陟任内收糧十萬石以上無過考稱或平常俱陞一級不稱者本等用收糧不及十萬石有過考稱或平常不稱俱本等用其守支年深與守支間丁憂起復例同凡在京各衞倉經厯宣徳四年奏准三年考滿者給半俸守支若糧不及千石照依倉官例交盤給由調用仍候九年黜陟凡巡檢洪武初考滿給由無私過者陞正九品犯私笞者本等用杖罪降雜職二十五年奏定考滿捕獲軍囚盗賊等項二百名之上無私杖者陞一級有私杖對品用一百名之上無私杖者對品用有私杖降雜職三十名之上無私杖者降雜職有私杖者降邊逺雜職不滿三十名者發邊逺充軍若有强賊及逃軍聚衆刼掠能擒獲以除民害者二十名之上無私杖者陞一級有私杖者對品用有私杖者降雜職九名之上無私杖者降雜職有私杖者降邊逺雜職若擒強賊逃軍六十名之上或止二十名而又能獲軍囚二百名之上及擒偽造寳鈔及偽印者具奏陞用永樂元年巡檢考滿應陞自陳不堪别用乞仍舊職者聴正統六年奏准土官巡檢三年六年攅造牌冊赴本布政司給由復職九年通考赴部黜陟凡沿海及土官巡檢俱不論軍囚無過本等用有過降用盧溝橋張家灣白溝河通州北闗漷縣楊村河西務單家橋巨河小直沽河陽興濟緊要地方軍囚强盗俱二名折一名成化間定巡檢考滿事例獲強盗三名至九名軍囚不及一百名者無過降雜職有過降邊逺雜職強盗十名之上軍囚百名之上無過對品用有笞杖過降雜職徒罪降邊逺雜職軍囚二百名之上強盗二十名之上有招或不及二十名或無强盗無過陞一級有笞杖過對品用徒罪降雜職若獲成羣強盗二十名之上或六十名之上又有招由軍囚二百名之上有事由或不及無過陞一級有笞杖過對品用徒罪降雜職若獲偽印一顆或二顆有覆造招由軍囚不論有無無過陞一級有笞杖過對品用徒罪降雜職凡巡檢三年考滿以新官更替日扣算例限府州縣掌印正官將任内捉獲軍囚等項從實查勘具結起送其沿海巡檢亦要畫圖貼説以憑查考若起送無府縣巡司保結軍囚公文止開起數不開花名或止開花名無籍貫并所犯事由強竊盗抄招無縣印鈐縫偽印不開是何衙門印信及令犯人當官覆造相同丁憂起復無本司闗文及洗改軍囚姓名者俱行勘若公文不開事蹟洗改更替日月強竊盗軍囚總數者送問若考滿丁憂起復前任厯少通理至一十八箇月之上另厯三年凡驛逓閘壩官舊制俱三年赴部給由惟雲南驛丞各以三年一次赴布政司考覈九年通考然後赴部宣徳四年奏准貴州所屬驛丞照雲南事例考覈正統元年奏准廣東所屬雜職衙門三年六年考滿照廣西雲南例驛丞逓運所大使赴布政司考覈河泊税課等官仍舊又奏准各處水馬驛丞及逓運所大使九年將滿吏部預選官交代住俸管事新官至日方許給由三年奏准驛逓閘壩官直𨽻府州縣所轄三年赴部其有布政司所轄三年赴布政司并按察司考察稱職平常復職仍將各官牌冊年終類進九年赴部通考五年奏准南北直𨽻驛逓閘壩司獄等官三年赴巡按御史考覈定與稱職不稱職考語連牌冊發有司收候年終類繳九年赴部通考景泰元年奏准南北直𨽻驛逓閘壩司獄等官三年六年考滿南直𨽻者赴南京吏部北直𨽻者赴本部凡驛丞九年考滿公文牌册内事蹟不開報應付過使客備細花名起數者送問凡驛逓等官丁憂改除前任日少許通理多則不許通理多厯少厯違限錯厯俱送問丁憂起復無印信闗文者行查無過陞一級有過本等用𢎞治十四年令天下有司儒學巡檢倉庫驛逓等官考滿到部功蹟不足或有過名有願告退者照有司不稱職例各仍原職致仕右雜職官入流倉官收糧經厯附諸司職掌一凡各處府州縣學訓導與教官一體厯俸九年考滿給由其訓導給由到部出題考試將所試文字送翰林院批考通經者於縣學教諭内叙用若不通經㫖本處復充訓導自来不通經者量才别用教官考覈稱職陞一等平常者本等用不稱職者黜降不通經者别用若承差考滿無私過於行人内用其犯私笞杖罪發行人司聴差一年無過陞用有贓私者發在京衙門充吏其五軍都督府知印三年考滿於從八品内陞用六部知印三年考滿於九品内陞用事例洪武二十六年奏定考滿教官訓導以九年之内科舉取中生員名數為則定擬陞降縣學額設生員二十名教諭九年之内科舉取中生員三名又考通經者為稱職陞用若科舉取中生貟二名又考通經者為平常本等用若科舉取中生員不及二名又考不通經者為不稱職降黜别用州學額設生貟三十名學正九年之内科舉取中生員六名又考通經為稱職陞用若科舉取中生貟三名又考通經者為平常本等用若科舉取中生員不及三名又考不通經者為不稱職黜降别用府學額設生員四十名教授九年之内科舉取中生貟九名又考通經者為稱職陞用若科舉取中生員四名又考通經者為平常本等用若科舉取中生員不及四名又考不通經者為不稱職黜降别用府州縣學訓導分數生員一十名九年之内科舉取中生員三名又考通經者陞教諭若科舉取中生貟二名或一名又考通經仍充訓導若科舉生員全無又考不通經降黜别用又奏准教諭科舉及數考不通經有司内用科舉不及數通經降訓導三十五年命教授考通經任内止有舉人三名者降學正永樂元年欽定舉人署教諭事者任内有科舉中式一名又有嵗貢中式一名署訓導事者有科舉中式一名或有嵗貢中式一名俱與實授六年令教官考滿吏部同六科都給事中選其有才識者留六科理事一年後從本科都給事中考其髙下用之宣徳五年重定舉人名數教授五名為稱職三名為平常不及三名為不稱學正三名為稱職二名為平常不及二名為不稱教諭二名為稱職一名為平常訓導一名為稱職不及者皆為不稱稱職者陞平常者本等用不稱者降正統九年奏准教官九年任滿無舉人者試其學問果優仍任教官教授學正教諭俱降訓導訓導調邊逺其不中者仍降雜職𢎞治二年奏准九年考滿教官考通經府州縣學舉人及數方陞衛學并選貢衙門雖無舉人亦陞若丁憂復除者論前後任多少若任府州縣學日多從府州縣學論任衛學并選貢衙門學日多從衛學并選貢衙門論凡教官考滿初塲考四書本經義各一篇貳塲論䇿各一道教授學正教諭俱本部定中否訓導送翰林院定中否考不通經係舉人出身者教授改吏目學正等官改典史監生儒士出身者教授改税課司大使學正等官降河泊所官衞學并選貢衙門學官考不通經亦同前例冐報舉人者送問無府州縣委官保結者行查雲南各處教官從選貢衙門例亦不論舉人十四年令公侯駙馬伯家教書訓導九年考滿者比在外府州縣學訓導例九年教無成效考中者於邊逺學校降用考不中者於雜職内降用行國子監查無功蹟者革職為民右教官諸司職掌一凡内外入流并雜職應考官員任滿給由赴京本部從實考校才能優劣依例黜陟果有殊功異能超邁等倫者取自上裁繁而稱職無過陞二等有私笞公過陞一等有紀録徒流罪一次本等用二次降一等三次降二等四次降三等五次以上雜職内用繁而平常無過陞一等有私笞公過本等用有紀録徒流罪一次降一等二次降二等三次降三等四次以上雜職内用簡而稱職與繁而平常同簡而平常無過本等用有私笞公過降一等有紀録徒流罪一次降二等二次雜職内用三次以上黜降考覈不稱職初考繁處降二等簡䖏降三等若有紀録徒流罪者俱於雜職内用凡九年之内二考稱職一考平常從稱職二考稱職一考不稱職或二考平常一考稱職或稱職平常不稱職各一考者俱從平常二考平常一考不稱職從不稱職一繁簡則例在外府以田糧十五萬石以上州以七萬石以上縣三萬石以上或親臨王府都司布政司按察司并有軍馬守禦路當驛道邊方衝要供給去處俱為事繁府州縣田糧在十五萬七萬三萬石之下僻静去處俱為事簡在京衙門俱從繁例事例凡九年考滿官員永樂四年奏准各都司衛所布政司按察司行太僕寺鹽運司鹽課提舉司煎鹽提舉司市舶提舉司茶馬司考覈俱從繁例宣慰宣撫安撫招討長官司俱係土官衙門從簡例八年令官員九年考滿給由初考稱職次考未經考覈今考稱職者初考次考不給由三考稱職者俱從稱職初考不給由次考稱三考平常者初考平常次考不給由後考稱者俱從平常初考不給由次考平常三考不稱職者從不稱職凡考滿官患病不滿三箇月及非縁事住俸月日不作實厯者叅問増减十嵗以上考滿後非因公差摘占厯俸半年以上及不報前任事蹟并隠匿過名者俱送問𢎞治十三年令在外大小文職若九年已滿托故在任久住不行赴部及不申缺者叅提究問就彼放回原籍冠帶閒住明㑹典卷十四
