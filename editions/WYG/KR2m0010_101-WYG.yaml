body:
  text: 明㑹典卷一百一禮部六十給賜一諸畨四夷土官人等一事例朝鮮國洪武間賜國王金印并大統厯錦繡絨綺王母妃金綺紗羅相國等官綵叚紗羅永樂間給國王冕服九章圭玉佩玉春秋㑹通大學衍義等書王父紵􅁝紗羅妃珠翠七翟冠紅紵絲大衫素紵絲員領霞帔金墜又給綾絹茄藍香㡌珠鍍金銀匣象牙犀角通鑑綱目列女傳等書腦麝沉香白花蛇等藥正統間給逺逰冠絳紗袍翼善冠龍衮玉帶數各不等其品物同者不復具列又以本國奏乞弓材牛角特許嵗買五十枝一常貢馬匹方物例不給價一差來進貢陪臣賞織金紵絲衣一套綵叚四表裏絹五疋書状通事押物等官毎人素紵絲衣一套二表裏絹二疋布一疋從人絹衣一套布一疋俱靴襪一雙一差來奏事陪臣賞織金羅衣一套二表裏絹二疋通事毎人素羅衣一套一表裏布二疋從人絹衣一套布一疋靴韈同前暹羅國洪武間賜國王大統厯織金紵絲紗羅等物永樂十五年給王錦四疋紵絲紗羅各十疋内各織金四疋王妃紵絲紗羅各六疋内各織金二疋宣徳間各减半以後俱照此例一賞賜使臣正副使及通事總管客人畨伴初到賞及正賞衣服紵絲絹布靴襪及金銀帶紗㡌諸物有差一使臣人等進到物貨例不抽分給與價鈔一給賞畢日出給告示許於會同館開市除書籍及𤣥黄紫皂大花西畨蓮叚疋并一應違禁之物不許收買其餘聽貿易琉球國洪武十六年賜國王鍍金銀印并文綺等物山南王亦如之後賜中山王山南王山北王紵絲紗羅冠服王妃紵絲羅王姪王相寨官絹公服一賞賜差来正議大夫長史使者通事從人衣服紵絲布絹及差来王弟王男衣服冠帶紵絲有差一正貢例不給價附来貨物官抽五分買五分占城國洪武二年賜國王鍍金銀印并大統厯使臣文綺紗羅各一疋仍給冠帶永樂元年賜國王錦二疋紵絲六疋紗羅各四疋王妃紵絲四疋紗羅各三疋以後俱照此例一貢物例不給價一賞賜差来王弟王孫并通事總管火長從人衣服紵絲紗羅有差真臘國洪武六年賜國王大統厯并綵叚等物景㤗三年賜王錦二叚紵絲六疋紗羅各四疋王妃紵絲四疋紗羅各三疋一賞賜差来頭目并通事總管火長衣服紵絲絹布有差安南國洪武元年賜國王鍍金銀印并大統厯綵叚等物景泰二年照朝鮮國宣徳十年例給賜綵叚十表裏錦四叚一賞賜差来陪臣鈔綵叚織金衣服行人從人鈔綵叚紗羅衣服有差一開市貿易與暹羅國同日本國永樂間賜國王冠服紵絲紗羅金銀古器書畫等物宣徳十年囬賜國王紵絲二十表裏紗羅各八疋錦二疋銀二百兩妃銀一百兩以後俱照此例一賞使差來正副使并僧人居座土官通事初到賞僧衣靴㡌及正賞紗羅紵絲絹布銅錢諸物有差一正貢例不給價正副使自進并官收買附來物貨俱給價不堪者令自貿易𤓰哇國永樂初賜東西王紵絲紗羅帳幔手巾羊酒器皿王妃紵絲紗羅手巾等物正統三年賜王紵絲十疋紗羅各三疋妃紵絲六疋紗羅各二疋以後回賜不為例景泰三年因王求討給傘蓋一把蟒龍衣服一領一賞賜使臣通事頭目人等初到賞織金素羅衣服靴襪正賞紵絲紗羅絹布女使并女頭目俱同一貢物例給價𤨏里國洪武五年賜國王大統厯及織金綵叚紗羅各四疋使臣綵叚紗羅各二疋傔從髙麗布各二疋西洋𤨏里國洪武三年以其國來朝渉海道逺賜賚甚厚永樂元年許來朝附載胡椒等物皆免稅三佛齊國洪武四年賜國王大統厯及綵叚紗羅使臣紗羅綵叚有差六年賜國王二十四疋正使三人各二疋衣一套副使二人各一疋通事以下布帛有差十年給王及使臣織金綵叚紗羅靴襪等物有差浡泥國洪武四年賜國王織金綵叚紗羅及使者綺帛有差永樂六年給王冠帶襲衣王子還國賜金廂玉帶一條金百兩銀三千兩及錢鈔錦綺羅衾褥帳幔器皿等物王母王叔以下各有賜俱加厚一正賞外附帶物貨俱給價百花國洪武十一年賜國王及使者織金綵叚紗羅衣服有差彭亨國洪武十一年賜國王王妃紵絲紗羅共四十八疋使臣織金綵叚衣服有差淡巴國洪武十年賜國王織金綵叚紗羅使臣綵叚襲衣等物有差古里國永樂間賜國王王妃紵絲紗羅等物滿剌加國永樂三年賜國王綵叚襲衣九年賜錦繡龍衣二套麒麟衣二套及金銀器皿帷帳裀褥王妃及其子姪陪臣傔從綵叚紗羅襲衣有差王還國給金廂玉帶一條儀仗一副鞍馬二疋金百兩銀五百兩鈔四十萬貫銅錢二千六百貫錦綺紗羅三百疋絹一百疋金綺二疋織金文衣二件王妃冠服一副及銀鈔錦綺紗羅等物陪臣賞物有差其後給賞俱從厚一正賞外附來貨物皆給價其餘貨物許令貿易娑羅國永樂四年賜國王紵絲紗羅共十六疋織金大紅錦手巾一副王妃紵絲紗羅共八疋正副使并從人鈔紵絲羅并衣服靴襪小葛蘭國永樂五年差内官給賜頭目紵絲紗羅共十一疋阿魯國永樂五年差内官給賜頭目紵絲紗羅共十疋榜葛剌國永樂三年賜國王紵絲紗羅各四疋絹八疋王妃紵絲紗羅各三疋絹六疋十二年給國王錦四叚綾六十疋頭目人等給賞有差錫蘭山國宣徳八年賜國王紵絲十八疋紗四疋王妃紵絲八疋紗四疋正使正賞綵叚八表裏折鈔絹十疋紗羅三疋織金紵絲衣一套副使正賞綵叚四表裏折鈔絹七疋紗羅各二疋織金紵絲衣一套通事畨伴人等給賞有差一使臣人等自進物俱給價蘇門荅剌國永樂三年賜國王綵叚襲衣宣徳六年賜錦二叚紗羅各四疋絹十三疋妃紵絲五疋紗羅各四疋絹六疋進馬回賜綵叚二十表裏以後俱照此例正使賞綵叚五表裏紗羅各一疋折鈔絹四疋通事頭目使臣妻等各賞有差一正貢外使臣人等自進物俱給價蘇祿國永樂間賜國王紗㡌金廂玉帶鈒花金帶金蟒龍等衣服金銀錢鈔珍珠錦紵絲紗羅器皿鋪陳等物王妃冠服銀錢鈔紵絲等物王男女親戚頭目使女冠帶衣服諸物各有差一貨物例給價免抽分土官永樂二年給賜土官衙門木邦八百大甸麓川平緬緬甸車里老六宣慰使司干崖大候里馬茶馬四長官司潞江安撫司孟艮孟定灣甸鎮康等府各給信符勘合金字紅牌其制銅鑄信符五面内隂文者一面上有文行忠信四字與四面合編某字一號至一百號批文勘合底簿其字號如車里以車字為號緬甸以緬字為號隂文信符勘合俱付土官底簿付雲南布政司其陽文信符四面及批文一百道藏之内府凡朝廷遣使則齎陽文信符及批文各一至布政司比同底簿方遣人送使者以往土官比同隂文信符及勘合即如命奉行信符之發一次以文字號二次行字號周而復始又置紅牌鏤金字勑書諭之凡有調發及當辦諸事須慿信符乃行如越次及比字號不同或有信符而無批文有批文而無信符者即是詐偽許擒之赴京治以死罪又編勘合一百道付各衙門勘合底簿一扇付布政司凡有軍民疾苦及奉信符辦過事務進貢方物之類俱於勘合内填寫遣人齎至布政司比號寫底簿布政司都司遣官同齎所填勘合奏聞若邊境聲息及土人詞訟從都司布政司按察司官㑹同計議行之其事已行及承行縁由並填寫勘合奏聞如總兵官鎮守遇有前事總兵官亦㑹三司計議仍用都司或布政司印信文書寫總兵官處分之語方許奉行亦填寫勘合具奏若朝廷命總兵官掛將軍印征討調遣軍馬不待三司文移即時發遣亦填寫勘合差人奏聞填寫勘合或字畫錯誤明白圈註以本司印信鈐蓋凡所收底簿及勘合用之將盡具奏再頒或總兵官都司布政司等官新除到任及遇時節不許齎禮物相慶仍以紙寫一道付之或有貪婪無藉凌害者不待填寫勘合止具本遣人齎勑不經總兵官及三司徑赴京陳奏者治以重罪一給賞差來到京土官弟男頭目人等各照衙門品級髙下為差三品四品鈔一百錠綵叚三表裏五品鈔八十錠綵叚三表裏六品七品鈔六十錠綵叚二表裏八品九品鈔五十錠綵叚一表裏雜職衙門并頭目人等自進馬匹方物鈔四十錠綵叚一表裏差来通把事頭目每人鈔二十錠綵叚一表裏随来土官弟男并把事頭目人等每人鈔二十錠從人伴吏每人鈔一十錠數内有進馬一二疋與方物輕者止照雜職例賞凡該賞半表裏者折與濶生絹二疋鈔錠并馬價照舊凡到京過期者减半給賞後或全賞𢎞治三年以後正月内到者亦全賞二月内到者减半迤北永樂宣徳間賜順寧王綵叚十表裏妃五表裏頭目一等者五表裏二等至四等者四表裏正統二年賜托克托布哈王綵叚十五表裏虎斑絹十疋妃八表裏頭目一等八表裏二等六表裏三等五表裏四等四表裏外有加賜後一等二等遂為定例三等止與三表裏或二表裏四等五等皆二表裏六年賜太師額森叚絹如托克托布哈王其妻每口五表裏一等二等數内頭目每人加賜織金綵叚一表裏天順以後一等二等者不加賜三等者俱二表裏一賞賜差來正副使臣每人賞織金衣服一套靴韈各一雙七年賞例一等正副使初到織金紵絲衣一套紅氊㡌一頂靴襪各一雙正賞綵縀六表裏絹二疋二等使臣初到賞同正賞綵叚四表裏絹三疋三等帶牌并使臣初到賞同正賞綵叚二表裏絹二疋四等初到賞紵絲衣一套小男與小衣紅氊㡌一頂靴襪各一雙正賞綵叚一表裏絹一疋五等各頭目差来使臣下從人初到賞與四等同正賞綵叚一表裏正副使妻初到賞織金紵絲女衣一套靴襪各一雙正賞綵叚二表裏絹二疋衆使臣妻女初到賞絹女衣一套小女賞小女衣靴韈各一雙正賞絹二疋從人妻初到賞絹女衣二件靴襪各一雙正賞絹一疋自來男婦男子初到賞絹衣二件小男與小衣紅氊㡌一頂正賞絹一疋婦女初到賞絹衣二件小女與小衣靴襪各一雙正賞與男子同後定賞例一等正副使每人賞綵叚六表裏絹五疋二等使臣綵叚四表裏絹三疋三等綵叚二表裏絹二疋四等綵叚一表裏絹一疋俱與紵絲衣一套紅氊㡌一頂靴襪各一雙數内婦女不與紅氊㡌使臣自進中等馬每匹綵叚二表裏折鈔絹二疋下等馬綵叚一表裏絹八疋折鈔絹一疋下下等馬綵叚一表裏絹六疋折鈔絹一疋帶進在彼頭目馬匹不分等第每匹回賜綵叚二表裏給賜在彼頭目一等每人綵叚八表裏二等六表裏三等三表裏四等二表裏一等二等𦂳要頭目加賜織金綵叚一表裏一回賜永樂九年回賜順寧等王上等馬者各綵叚十表裏海青一連四表裏白狐皮二十七箇四表裏宣徳間囬賜順寧王及使臣人等進馬中等者毎匹二表裏折鈔絹二疋下等者紵絲一疋絹八疋折鈔絹一疋下下者絹六疋折鈔絹一疋駝毎隻三表裏折鈔絹十疋中途寄留倒死新生駒馬每匹絹三疋折鈔絹半疋駝每隻絹六疋折鈔絹一疋海青一連一表裏銀䑕皮二百個十二表裏貂䑕皮二箇絹一疋青䑕皮十箇絹一疋土豹一箇絹七疋半正統元年回賜使臣銀䑕皮每六箇絹一疋玉石每一斤絹一疋二年回賜托克托布哈王及頭目使臣人等馬每匹二表裏貂䑕皮五十箇四表裏使臣者每二箇絹二疋銀䑕皮五十箇二表裏使臣者十五箇絹一疋白兎皮三箇絹一疋白􅈢皮一箇絹一疋小厮一名二表裏三年貂䑕皮每十箇一表裏四年貂䑕皮每三箇絹一疋使臣人等到京續進馬俱照下等馬例回賜五年回賜銀䑕皮與熟紅絹六年青䑕皮每二十箇絹一疋使臣人等馬分三等托克托布哈王并太師額森馬不分等第八年額森阿勒古馬每匹六表裏使臣馬每匹四表裏絹八疋九年進西馬者每匹五表裏絹十疋薩哈連毎叚絹九疋十二年阿勒古馬回賜四表裏一求討在彼頭目一等二等并三等内有係酋長親及親信用事者俱請㫖給賜𢎞治三年三等以下不給賜差來使臣𢎞治元年并三年四年俱有特賜一貿易本部出給告示除違禁物不許貿易其叚絹布疋聽於街市與官貟軍民人等兩平買賣正統十年許買賣五日十二年許衛喇特使臣賣馬景泰元年許買銅湯瓶鍋紅纓鞍轡剪子等物泰寧衛諾延衛福餘衛凡差來并自來都督賞綵叚四表裏絹二疋都指揮綵叚三表裏絹二疋指揮百户所鎮撫頭目每人綵叚二表裏絹一疋各織金紵絲衣一套各加綵叚一表裏舍人每人綵叚二表裏絹一疋織金衣一套從人每人綵叚一表裏絹一疋素紵絲衣一套婦女有進貢者毎人一表裏絹一疋紵絲女衣一套随來婦女一表裏絹一疋絹女衣一套以上靴襪各一雙奏事進貢都指揮絹二疋綵叚三表裏織金衣一套指揮毎人絹一疋綿布一疋綵叚二表裏紵絲衣一套靴襪各一雙舍人因事進貢者每人綵叚一表裏織金衣一套絹一疋靴襪各一雙一回賜自進并帶進過馬匹不分等第每匹回賜綵叚二表裏絹一疋駝每隻三表裏絹十疋在衛都督指揮毎貟加賜綵叚一表裏一貿易領賞畢日許於㑹同舘開市三日舖行人等照例将貨入館兩平交易其回還沿途貨買牛隻犁鏵鐡鍋等件行移鴻臚寺㑹同大通事差本寺通事一貟伴送及順天府轉行薊州遵化等處如遇三衛夷人回還到彼聽令兩平交易每人止許收買牛一隻犁鏵一副鍋一口不許将違禁之物私自夾賣違者許廵按御史䆒治一求討賞賜外復有求討請㫖量與物件到京者照名給散在衞者請勑開付差来人領去眀㑹典卷一百一
