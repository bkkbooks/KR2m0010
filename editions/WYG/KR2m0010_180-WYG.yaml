body:
  text: 明㑹典卷一百八十上二十二衛在京在外各衛所並見兵部職方司其官制資格見武選司而錦衣等二十二衛其職掌有異於諸衛者故别具於此其餘統軍行事彼此相同者不復備載錦衣衛洪武初置儀鑾司十五年罷司置錦衣衛統軍與諸衛同而所𨽻又有將軍力士校尉人等其職掌直駕侍衛巡捕等事若有重囚下本衛鎮撫司推鞠二十年以法凌虐将本衛刑具燒毁以所繫囚送刑部二十六年申明鞠刑之禁凡罪囚俱送法司永樂後定都北京照例開設凡職事仍舊而任遇漸加視諸衛獨異云事例凡聖節正旦冬至大朝㑹郊祀等項車駕出入及每日常朝該設鹵簿儀仗俱本衛提督所屬官校依次陳列凡每日常朝輪指揮一員千户二員百户十員旗校五百名於奉天門下擺列侍衛聽候糾儀拏人朝退輪百户一員巡察皇城四圍其餘分守東華西華等門聽候宣喚至夜輪百户二員校尉四十名同該日指揮於内直房直宿以備傳報其餘出宿外直房凡郊祀及太廟社稷等祀本衛指揮俱帶刀隨駕直宿齋宫之外大祀仍命指揮一員守直凡經筵日本衛掌印官於文華殿侍衛凡緝訪京城内外姦宄本衛掌印官奉勑専管領屬官二員旗校八十名其東厰内臣奉勑緝訪别領官校俱本衛差撥凡緝捕京城内外盜賊本衛指揮一員奉勑専管領屬官五員旗校一百名凡京城内外修理街道疏通溝渠本衛指揮一員奉㫖専管領屬官三員旗校五十名凡奉㫖午門外或京畿道鞠問罪囚本衛堂上官同三法司官會問凡每嵗秋後承天門外審錄重囚本衛堂上官同三法司及各衙門官㑹審凡奉㫖處決重囚本衛從刑科給駕帖差官同法司監決其囚人家屬或奏訴得㫖姑留者校尉從刑科批手馳至市曹停刑凡奉㫖差官出外勘門事情係㑹同三法司堂上官者於指揮内具名上請㑹同科道部屬官者於千户内具名上請凡奉㫖提取罪犯本衛從刑科給駕帖都察院給批差官前去其差官就於該直千百户内具名上請凡殿試舉人本衛堂上官充巡綽官其嵗貢生於午門内考試俱本衛官校看守凡五軍官舍比試總小旗并鎗本衛堂上堂同内外官監視仍差撥官校看守凡侍衛將軍有缺兵部職方司選身材豐偉堪中者開送本衛試其勇力中者送部具奏收用凡山陵巡禁樵採每季委百户二員旗校二十名凡五城兵馬司地方每季委千户五員百户十員旗校二百五十名分坐各城外地方千户五員百户十員旗校二百五十名分巡俱緝捕盜賊凡京城内外緝捕喇唬兇徒每季委千户一員百户一員旗校五十名凡通州張家灣一路緝捕姦盜每季委千户一員百户一員旗校五十名凡巡察官馬禁私負䭾載每季委千户二員旗校二十名凡京城各門監收課鈔每季委百户九員凡㑹同館監撥夷人乗坐馬疋每季委百户一員凡採辦朝㑹金燈庭燎并貼買軍官及騎操馬匹並於本衛原撥蘆塲内取用凡本衛值㕔額定校尉力士一百名看監百户一員校尉力士五十名巡視監墻二十名經歴司掌本衛文移出入等事諸衛並同鎮撫司掌問理本衛刑名與諸衛同而兼管軍匠後添設鎮撫二員専理刑名成化十四年始増鑄印信各為一司事例凡問刑悉照洪武舊例徑自奏請不經本衛或本衛有事送問問畢仍自具奏俱不呈堂凡鞫問姦惡重情得實具奏請㫖發落内外官員有犯送問亦如之舊制俱不用㕘語凡東厰及本衛各處送到囚犯𢎞治十三年令本司從公審察究問務得真情若有寃枉即與辨理不許拘定成案濫及無辜凡獄情宣徳六年節奉聖㫖看監千百户等有透漏獄情者斬成化二十年節奉聖㫖一應大小獄情俱要嚴密闗防不許透漏及受人囑託本衛堂上官亦不許干預有故違者指實奏聞治以重罪凡本司紙劄正統五年奏准令囚人買用凡本司獄具𢎞治十三年奏准悉照各衙門舊制行凡本司值㕔百户一員當該吏典十名辦事吏二十名總旗一名校尉三十名看監百户五員總旗五名校尉一百名皂𨽻三十名值堂把門皂𨽻十一名錦衣中所錦衣左所錦衣右所錦衣前所錦衣後所各所官分領軍士與諸衛同而各所又分十司統領校尉掌鹵簿儀仗及值駕拏人直宿等事凡本衛各項差委輪流承行鑾輿司大輅一乗玉輅一乗大馬輦一乗小馬輦一乗步輦一乗大凉步輦一乗板轎一乗寳匣一座具服幄殿一座擎蓋司紫方傘四把紅方傘四把紅曲柄繡傘四把紅直柄華蓋􅏛四把黄直柄繡傘四把紅直柄繡傘四把黄曲柄繡􅏛二把五方傘十把銀鈴傘二把扇手司紅黄羅雙龍扇四十把紅黄羅單龍扇二十把紅黄素羅扇四十把紅繡雉方扇十二把紅繡花扇十二把雙龍夀扇二把旌節司金節三對方天㦸四對響節十二對旛幢司黄麾一對絳引旛五對傳教旛五對告止旛五對信旛五對政平訟理旛一對龍頭竿五對朱雀幢一𤣥武幢一青龍幢一白虎幢一豹尾二對羽葆幢五對班劒司班劒三對儀刀三對梧杖三對立𤓰三對卧𤓰三對斧鉞司金盆罐一副金交椅一把金脚踏一箇紅紗燈三對紅紙燈三對魫燈三對骨朶三對金鉞三對金鐙三對單龍㦸三對雙龍㦸三對戈㦸司儀鍠氅十對戈氅十對㦸氅十對弓矢司盔甲一百副弓矢一百副刀一百把盾一百面馴馬司金鞍錦韀馬三十疋上中所上左所上右所上前所上後所中後所親軍所各所官分管力士及軍匠其侍衛將軍千百户總旗等於中後所支俸食糧凡文移用中後所印信馴象所本所官領本衛軍奴養象以備朝㑹陳列及駕輦䭾寳之用旗手衛國初置旗手千户所洪武十八年陞為衛永樂中照例開設掌大駕金鼓旗纛統領隨駕力士及宿衛等事事例凡聖節正旦冬至大朝㑹本衛官先期於御前奏請金鼓旗纛擺列遇郊祀等項車駕出入則陳於錦衣衛鹵簿之前每歳六月六日照例奏請晒晾計開肅靖旗一對金鼓旗一對金龍畫角二十四枝鼓四十八面金四面鉦四面杖鼓四箇笛四管板四串門旗四對白澤旗一對黄旗四十面金龍旗十二面日月旗二面風雲雷雨旗四面五星旗五面列宿旗二十八面北斗旗一面五嶽旗五面四瀆旗四面青龍旗一面白虎旗一面朱雀旗一面𤣥武旗一面天鹿旗一面天馬旗一面鸞旗一面麟旗一面熊旗一面羆旗一面紅纛一面皂纛一面紅節一對小銅角一對大銅角一對纓頭一箇豹尾一箇凡每月朔望日神機營提督官請祭神旗本衛遣官軍於午門樓上迎請導從至教塲祭畢迎回仍如法置放凡每嵗仲秋祭旗纛之神本衛掌印官行禮祭畢復命凡鐘鼓樓鐘鼓每夜遣軍人依時撞擊以憑巡警凡宿衛分守皇城南面地方金吾前衛洪武間上十衛之一永樂以後照例開設掌守衛皇城南面及巡警京城各門遇陳設鹵簿掌擎執方天㦸二十四件金吾後衛建置同前掌守衛皇城北面及廵警京城各門羽林左衛建置同前掌守衛皇城東面及巡警京城各門羽林右衛建置同前掌守衛皇城西面及巡警京城各門府軍衛建置同前掌守衛皇城南面及巡警京城各門府軍左衛建置同前掌守衛皇城東面府軍右衛建置同前掌守衛皇城西面府軍前衛建置同前掌輪畨帶刀侍衞統領㓜軍府軍後衛建置同前掌守衛皇城北面及巡警京城各門虎賁左衛建置同前掌守衛皇城南面及巡警京城各門金吾左衛洪武三十五年以燕山左䕶衛改設掌守衛皇城東面及巡警京城各門金吾右衛洪武三十五年以燕山右䕶衛改設掌守衛皇城西面及巡警京城各門羽林前衛洪武三十五年以燕山中䕶衛改設掌守衛皇城南面及巡警京城各門燕山左衛洪武間北平屬衛永樂四年陞親軍掌守衛皇城東面及巡警京城各門燕山右衛改置同前掌守衛皇城西面燕山前衛改置同前掌守衛皇城南面及巡警京城各門大興左衛改置同前掌守衛皇城北面及巡警京城各門濟陽衛改置同前掌守衛皇城南面濟州衛改置同前掌守衛皇城南面及巡警京城各門通州衛改置同前掌守衛皇城北面及巡警京城各門各衛通行事例凡旗手等二十衛指揮等官每日輪四十員懸金牌佩刀於奉天門丹墀左右侍衛朝退巡綽各門其巡警京城各門係各衛衛所鎮撫與五軍屬衛相兼南京錦衣等衛建置事例見前明㑹典卷一百八十
