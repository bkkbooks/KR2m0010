body:
  text: 明㑹典卷四十九禮部八耕籍洪武二年定皇帝祀先農畢太常卿奏請詣耕籍位皇帝至位南向立公侯以下及應従耕者各就耕位户部尚書北面進耒太常卿導引皇帝秉耒三推户部尚書跪受耒太常卿奏請復位南面坐三公五推尚書九推各退就位太常卿奏禮畢太常卿導引皇帝還大次應天府尹及上元江寧兩縣令率庶人終畆是日宴勞百官耆宿扵壇所永樂間續定凡祭先農畢駕至籍田所户部尚書捧鞭跪進教坊司官率其屬作樂隨駕行三推禮畢駕至儀門陞座樂作觀三公九卿耕訖教坊司承應用大樂百戯畢跪奏致語駕至殿内陞座進湯進膳俱用樂畢順天府官率耆老人等謝恩樂作禮畢樂止次百官行禮樂作禮畢樂止賜百官酒飯百官復入班行禮樂作禮畢樂止尚膳官進膳樂作進訖樂止百官入席教坊司官奏一奏本太初之曲進酒樂作進訖樂止進膳樂作進訖樂止教坊司官跪奏進湯樂作徹湯樂止二奏仰大明之曲進酒進膳進湯如前儀三奏民初生之曲進酒進膳進湯如前儀徹御案畢樂止百官復入班行禮樂作禮畢樂止鴻臚寺官奏禮畢駕還視學洪武十五年定前期一日有司洒掃殿堂設御幄于大成門東上南向設御座于彞倫堂至日學官率諸生迎駕于成賢街左駕至學官及諸生俯伏叩頭興駕入靈星門止于大成門外上入御幄禮官入奏請具皮弁服次請行禮導引官導上出御幄就御位百官各就位導引官導上詣盥洗位搢圭盥帨出圭詣酒尊所酌酒詣先師神位前再拜百官皆再拜搢圭執事官跪進爵上獻爵授執事官奠于神位前出圭再拜百官皆再拜四配十哲兩廡分獻如常儀導引官導上入御幄易常服升輿詣學學官率諸生先列于堂下東西上至彞倫堂升御座贊唱學官諸生行禮五拜叩頭東西序立于堂下三品以上及侍従官以次入堂東西序立贊進講祭酒司業博士助教四人以次升堂由西門入至堂中贊舉經案于御前禮部官奏請授經于講官祭酒跪受賜講官坐乃以經置講案叩頭就西南隅設几榻坐講賜大臣及翰林儒臣坐皆叩頭序坐于東西諸生圜立以聽講畢祭酒叩頭退就本位司業博士助教各以次進講畢出堂門復位贊唱有制學官諸生列班俱北面跪聽宣諭五拜叩頭禮畢學官率諸生出成賢街跪俟駕還明日祭酒率學官上表謝恩成化元年續定前期一日太常寺備祭儀設大成樂器于殿上列樂舞生于階下之東西國子監洒掃殿室内外錦衣衛設御幄于大成門之東上南向設御座于彞倫堂正中鴻臚寺設經案于堂内之左設講案于堂内之西南至日置經于經案錦衣衛設鹵簿駕教坊司設大樂舊不用樂至是始用俱于午門外是日早百官免朝先詣國子監門外迎駕分獻陪祀官先詣國子監具祭服伺候行禮駕従東長安門出鹵簿大樂以次前導樂設而不作太常寺先陳設祭儀于各神位前設酒罇爵如常儀舊不用牲至是始用執事設上拜位于先師神位前正中是日學官率諸生迎上至大成門外入御幄禮官入奏請具服上具皮弁服訖奏請行禮導引官導上出御幄中道詣大成殿陛上典儀唱執事官各司其事執事官各先斟酌于爵候導上至拜位贊就位百官亦各就拜位四配十哲分獻官各詣廡前俱北向立贊迎神樂作樂止贊上鞠躬拜興拜興平身通贊百官行禮同贊搢圭上搢圭執事官跪進爵樂作上受爵獻畢復授執事官奠于神位前樂止贊出圭上出圭四配十哲兩廡分獻官以次詣神位前奠爵訖仍以次出殿門外東西向立典儀唱送神樂作樂止贊上鞠躬拜興拜興平身通贊陪祀官行禮同導引官導上由中道出分獻官以次退上入御幄易常服訖禮官入奏請幸彞倫堂上升輿禮官前導由靈星門出従太學門入諸生先分别于堂下東西學官列于諸生前駕至學官諸生跪伺駕過然後起仍前序立百官分列堂外稍上左右侍立上至彞倫堂升御座贊學官諸生行五拜叩頭禮武官都督以上文官三品以上及翰林院學士升堂執事官各以次序立贊進講祭酒司業以次升堂由東西小門入至堂中執事官舉案于御前禮官奏請授經于講官祭酒跪受經受畢上賜講官坐祭酒乃以經置講案叩頭就西南几榻坐講上賜武官都督以上文官三品以上及翰林院學士坐皆叩頭序坐于東西諸生圜立于外以聽祭酒講畢叩頭退就本位司業進講如儀畢出堂門復位贊有制學官諸生列班俱北面跪聽宣諭畢贊行五拜叩頭禮畢學官諸生以次退先従東西小門出列于成賢街之右伺候尚膳監進茶御前上命光祿寺賜各官茶畢各官退列于堂門外叩頭序立駕興升輿由太學門出升輦鹵簿大樂前導樂作駕出太學門學官諸生伺駕至跪叩頭退百官常服先詣午門外伺候駕還鹵簿大樂止于午門外上御奉天門鳴鞭百官常服鴻臚寺致詞行慶賀禮畢鳴鞭駕興還宫百官退明日國子監祭酒率學官監生上表謝恩上具皮弁服御奉天殿錦衣衛設丹陛駕百官朝服侍班行禮畢上易服御奉天門禮部引奏賜祭酒司業學官及三氏子孫衣服諸生鈔錠畢駕還是日上御奉天門賜宴武官都督以上文官三品以上翰林院學士及祭酒司業學官三氏子孫與宴又明日祭酒司業率學官監生謝恩上賜𠡠勉勵師生祭酒捧出師生迎導至太學開讀行禮如儀再明日祭酒司業率學官監生復謝恩𢎞治元年奠加幣牲用太牢致齋一日餘如成化元年儀視學樂視學還導駕樂章御鑾歌神歡之曲臣聞古帝王受天命統四方宵衣旰食治道章一心誠敬感昊蒼龍翔鶴舞神心樂康臣民讚時皇萬夀無疆駕至奉天門陞座樂章萬嵗樂與朝賀同朝天子與朝賀同還宫樂章萬嵗樂前同大射禮洪武三年㝎凡遇郊廟之祭先期命文武官執事行大射之禮工部制虎中鹿中及諸侯卿大夫射侯等器其儀按周禮大司馬之職王大射則合諸侯之耦其屬有射人掌張三侯司弓矢掌六弓八矢之法服不氏掌贊張侯以旌居之而待獲古大司馬今兵部之職也今以兵部掌之其射鵠有七虎鵠五采天子射用之熊鵠五采皇太子射用之豹鵠五采親王射用之豹鵠四采一品二品文武官射用之糝鵠三采三品至五品文武官射用之狐鵠二采六品至九品文武官射用之布鵠無采文武官子弟及士民俊秀射用之乏又名容凡射時置于鵠右執旗及待獲者以蔽身設福并韋當射時置于前以齊矢設射中五皮樹中天子大射用之閭中天子宴射用之虎中皇太子親王射通用之兕中一品至五品文武官用之鹿中六品至九品及文武官子弟士民俊秀通用之其職事設司正官二貟掌驗射者品級尊卑人力强弱而定耦其中否則書扵筭兵部官職之司射二員掌先以强弓射鵠誘射以鼓衆氣以武職官充之司射器官二員掌辨弓力强弱分為三等騐人力强弱而授之工部官職之舉爵者掌以馬湩授中者飲光祿寺官職之請射者掌定耦射射畢再請某耦射每鵠二人侍儀司職之待獲者掌矢納于司射器者以各隸僕共其役執旗者掌于容後執五色旗如射者中的舉紅旗應之中采舉采旗應之偏西舉白旗偏東舉青旗過于鵠舉黄旗不及鵠舉黒旗以軍士二人掌之設引禮二人掌引文武官進退命侍儀司舍人職之明㑹典卷四十九
