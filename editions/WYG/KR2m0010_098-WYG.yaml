body:
  text: 明㑹典卷九十八禮部五十七朝貢三事例三佛齊國洪武四年遣使奉金字表文來朝貢六年復遣使賀正旦并貢方物八年復遣使從招諭拂菻國朝使來貢十年遣使奉表請印綬命齎駝紐鍍金銀印賜之貢物黒熊火雞孔雀五色鸚鵡諸香兠羅綿被苾布白獺龜筒胡椒肉豆䓻畨油子米腦浡泥國洪武四年遣使進金表銀箋及方物永樂三年遣使封其國主爲王給印符誥命六年王率其妃及家屬陪臣來朝至福建遣内臣往宴勞之令所過諸郡設宴至京王奏金字表文及諸珍物妃進中宫東宫箋及方物上御奉天門享王宴是年王卒輟朝三日祭賻甚厚詔諡恭順賜葬南京城外石子岡以西南夷人𨽻籍中國者守之樹碑立祠命有司春秋致祭復令其子襲封遣内官及行人䕶送還國復從其請封其後山爲長寧鎮國之山御製碑文賜之十二年及洪熙元年俱來朝貢貢物單目用銀珎珠寶石金戒指金縧環龍腦米腦梅花腦降香沉速香檀香丁香肉豆䓻黄蠟犀角玳瑁龜筒螺殻鶴頂熊皮孔雀倒挂鳥五色鸚鵡黒小厮金銀八寳器百花國洪武十一年遣使奉金葉表來朝貢貢物白鹿紅猴龜筒玳瑁孔雀鸚鵡倒挂鳥胡椒香蠟彭亨國洪武十一年遣使奉金葉表貢畨奴及方物永樂十二年復遣使朝貢貢物金水罐檀香乳香速香片腦胡椒象牙淡巴國洪武十年遣使奉表朝貢貢物苾布兠羅綿被沉香檀香速香胡椒古里國永樂三年遣使朝貢詔封爲古里國王給印及誥五年七年復遣使來朝貢貢物寶石金繫腰珊瑚珠琉璃瓶琉璃碗拂郎雙刃刀寶鐡刀蘇合油阿思摸逹塗兒氣龍涎梔子花花氊單伯蘭布苾布紅絲花手巾畨花人馬象物手巾線結花靠枕木香乳香檀香錫胡椒滿喇加國永樂三年遣使奉金葉表朝貢詔封爲國王給印及誥使者言王慕義願同中國屬郡歲效職貢又請封其國西山詔封爲鎮國之山御製碑文賜之九年國王率其妻子及陪臣五百四十餘人朝貢命官往勞上御奉天門宴之十年遣使來貢十二年國王母來二十二年宣徳九年國王復來正統十年以後屢遣使來貢貢物畨小厮犀角象牙玳瑁鶴頂鸚鵡黒熊黒猿白麂鎻袱金母鶴頂金鑲戒指撒哈喇白苾布薑黄布撒都細布西洋布花縵片腦梔子花薔薇露沉香乳香黄速香金銀香降真香紫檀香丁香烏木蘇木大楓子畨錫畨鹽娑羅國永樂四年東王西王各遣使來朝貢貢物黒小厮花焦布白焦布珎珠玳瑁殻降真香黄蠟小葛蘭國永樂五年附蘇門荅喇等國來朝貢貢物珍珠傘白綿布胡椒阿魯國永樂五年附古里等國來朝貢貢物象牙熟腦榜葛喇國永樂六年遣使來朝貢九年至太倉命行人往宴勞之十二年又遣使貢麒麟等物正統三年貢同表用金葉貢物馬馬鞍金銀事件戧金琉璃噐皿青花白磁撒哈喇者抹黒荅立布洗白苾布兠羅綿糖霜鶴頂犀角翠毛鶯哥乳香麤黄熟香烏香麻藤香烏爹泥紫膠藤竭烏木蘇木胡椒錫蘭山國永樂九年以拒絶朝使歸路破其城生擒國王及家屬命釋之擇其屬之賢者立爲王十年詔諭其國正統十年天順三年皆遣使來貢貢物寶石珊瑚水晶金戒指撒哈喇象乳香木香樹香土檀香沒藥西洋細布藤竭蘆薈硫黄烏木胡椒碗石蘇門荅喇國永樂三年遣使來朝貢詔封爲國王給印及誥五年至宣徳六年屢遣使來貢表用金葉十年復請封其子爲王貢物馬犀牛龍涎撒哈喇梭眼寶石木香丁香降真香沈速香胡椒蘇木錫水晶瑪瑙畨刀弓石青回回青硫黄蘇禄國永樂十五年蘇禄三國東王西王峒王各率妻子頭目人等來朝貢十九年遣使來貢貢物梅花腦米腦竹布綿布玳瑁降香蘇木胡椒蓽茇黄蠟畨錫須文逹那國洪武間遣使奉金葉表貢馬并方物拂菻國洪武四年遣使來朝貢覽邦國洪武九年遣使來朝貢柯枝國永樂二年遣使來朝貢十年復遣使來請封其國之山詔封爲鎮國山御製碑文賜之古里班卒國永樂三年遣使來朝貢吕宋國永樂三年遣使來朝貢合猫里國永樂三年遣使來朝貢碟里國永樂三年遣使來朝貢打回國永樂三年遣使來朝貢日羅夏治國永樂三年遣使來朝貢忽魯母思國永樂三年遣使來朝貢甘把里國永樂十二年遣使來朝貢麻林國永樂十三年遣使來朝貢麒麟等物古麻喇國永樂間國王率其臣來朝至福州卒詔諡康靖勅葬閩縣令有司歲時致祭忽魯謨斯國永樂間遣使來朝貢沼納撲兒國永樂間遣使詔諭其國加異勒國永樂間遣使來朝貢祖法兒國永樂間遣其臣來朝貢溜山國永樂間遣其臣來朝貢阿哇國永樂間遣使來朝貢白葛逹國宣徳七年遣其臣來朝貢天方國宣徳間遣其臣來朝貢黙徳那國宣徳間遣使隨天方國使臣來朝貢南巫里國急蘭丹國竒剌尼國夏剌比國窟察尼國烏渉剌踢國阿丹國魯密國彭加那國捨剌齊國八可意國坎巴夷賛國左法兒國墨葛逹國㧞達克山日落國已上十六國永樂初各來朝貢明㑹典卷九十八
