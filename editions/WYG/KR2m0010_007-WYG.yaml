應天府給引照回仍行體勘至期各還職役不在作缺之數如違限日久不到者就行提問事例洪武間在京大小衙門官吏給假省親祭祖等項自行具奏取自上裁如准夲部覆奏定限放回其考滿吏給假别無粘帶就行定限除路程日期外别與假一箇月在家俱給引照回洪熈元年詔内外文職官員離家年久者許具奏挨次給假省親祭祖宣徳元年奏准外官九年考滿到部許令給假省祭陞除以後不許給假又令京官給假但違限一年之上停俸五個月景泰六年奏准聴選監生并考滿起復裁減等項官員守候日久許其給假依限回部聴用天順二年奏准辦事官滿者數多俱候類奏方得放回省祭自後各衙門送到查審明白即送順天府給引照回以次取用成化五年令監生給假違限三年之上者送問未及三年告有事故文憑俱免問罪十一年令京官離家十年者方許省祭二十三年詔兩京文職有離家六年之久欲給假省親者查無違碍許其歸省凡兩京給假省祭官員除往回水程許在家兩箇月違限一年以上住俸五箇月一年半以上者送問凡京官及進士奏乞畢姻行同郷官員保勘明白具奏定奪凡官吏監生妻故送㓜子還鄉行勘是實官具奏許在家兩箇月違限半年以上者送問監生吏典給引放回明㑹典卷七
