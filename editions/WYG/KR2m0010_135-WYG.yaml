body:
  text: 明㑹典卷一百三十五刑部十倉庫明律鈔法凡印造寳鈔與洪武大中通寳及歴代銅錢相兼行使其民間買賣諸物及茶塩商稅諸色課程並聼收受違者杖一百若諸人將寳鈔赴倉塲庫務折納諸色課程中買塩貨及各衙門起解贓罰須要於鈔背用使姓名私記以憑稽考若有不行用心辨騐收受偽鈔及挑剜描輳鈔貫在内者經手之人杖一百倍追所納鈔貫偽挑鈔貫燒毁其民間關市交易亦許用使私記若有不行仔細辨驗誤相行使者杖一百倍追鈔貫止問見使之人若知情行使者並依本律錢法凡錢法設立寳源等局鼓鑄洪武通寳銅錢與大中通寳及歴代銅錢相兼行使折二當三當五當十依數准筭民間金銀米麥布帛諸物價錢並依時直聽從民便若阻滯不即行使者杖六十其軍民之家除鏡子軍器及寺觀庵院鐘磬鐃鈸外其餘應有廢銅並聽赴官中賣每斤給價銅錢一百五十文若私相買賣及收匿在家不赴官中賣者各笞四十收粮違限凡收夏稅於五月十五日開倉七月終齊足秋粮十月初一日開倉十二月終齊足如早收去處預先收受者不拘此律若夏稅違限至八月終秋粮違限至次年正月終不足者其提調部粮官吏典分催里長欠粮人户各以十分為率一分不足者杖六十每一分加一等罪止杖一百受財者計􅂍以枉法從重論若違限一年之上不足者人户里長杖一百遷徙提調部粮官吏典處絞多收稅粮斛靣凡各倉收受税粮聽令納户親自行槪平斛交收作數支銷依令准除折耗若倉官斗級不令納户行槪跌斛淋尖多收斛面者杖六十若以附餘粮數計􅂍重者坐􅂍論罪止杖一百提調官吏知而不舉與同罪不知者不坐隠匿費用稅粮課物凡送本户應納稅粮課物及應入官之物而隠匿費用不納或詐作損失欺妄官司者並計所虧欠物數准竊盗論免刺其部運官吏知情與同罪不知者不坐攬納税粮凡攬納稅粮者杖六十著落赴倉納足再於犯人名下追罰一半入官若監臨主守攬納者加罪二等其小户畸零米麥因便輳數於納粮人户處附納者勿論虛出通關硃鈔凡倉庫收受一應係官錢粮等物不足而監臨主守通同有司提調官吏虛出通關者計所虛出之數併􅂍皆以監守自盗論若委官盤㸃錢粮數本不足符同申報足備者罪亦如之受財者計􅂍以枉法從重論其監守不收本色折收財物虛出硃鈔者亦以監守自盗論納户知情减二等免刺原與之􅂍入官不知者不坐其􅂍還主同僚知而不舉者與犯人同罪不知及不同署文案者不坐附餘錢粮私下補數凡各衙門及倉庫但有附餘錢粮須要盡實報官明白正收作數若監臨主守將増出錢粮私下銷補别項事故虧折之數瞞官作弊者並計􅂍以監守自盗論若内府承運庫收受金帛當日交割未完者許令附簿寄庫若有餘剰之物本庫明白立案正收開申户部作數若䑃朧擅將金帛等物出外者斬守門官失於盤獲搜檢者杖一百私借錢粮凡監臨主守將係官錢粮等物私自借用或轉借與人者雖有文字並計􅂍以監守自盗論其非監守之人借者以常人盗倉庫錢粮論若將自已物件抵換官物者罪亦如之私借官物凡監臨主守將係官什物衣服氊褥器玩之𩔖私自借用或轉借與人及借之者各笞五十過十日各坐􅂍論减二等若有損失者依毁失官物律坐罪追陪那移出納凡各衙門收支錢粮等物已有文案勘合若監臨主守不正收正支那移出納還充官用者並計􅂍准監守自盗論罪止杖一百流三千里免刺若不給半印勘合擅出權帖或給勘合不立文案放支及倉庫不候勘合或已奉勘合不附簿放支者罪亦如之其出征鎮守軍馬經過去處行粮草料明立文案即時應付具數開申合干上司准除不在擅支之限違者杖六十庫秤雇役侵欺凡倉庫務塲局院庫秤斗級若雇役之人侵欺借貸移易係官錢粮並以監守自盗論若雇主同情分受􅂍物者罪亦如之其知情不曽分􅂍而符同申報瞞官及不首告者减一等罪止杖一百不知情者不坐冐支官粮凡管軍官吏總旗小旗冐支軍粮入己者計􅂍准竊盗論免刺錢粮互相覺察凡倉庫務塲官吏攅攔庫子斗級皆得互相覺察若知侵欺盗用借貸係官錢粮已出倉庫匿而不舉及故縱者並與犯人同罪失覺察者减三等罪止杖一百若官吏虛立文案那移出納及虛出通關其斗級庫子攔頭不知者不坐倉庫不覺被盗凡有人從倉庫中出守把之人不搜檢者笞二十因不搜檢以致盗物出倉庫而不覺者减盗罪二等若夜直更之人不覺盗者减三等倉庫直宿官攅斗級庫子不覺盗者减五等並罪止杖一百故縱者各與盗同罪若被强盗者勿論守支錢粮及擅開官封凡倉庫官攅斗級庫子役滿得代所收錢粮官物并令守支盡絶若無短少方許給由其有應合相沿交割之物聼提調官吏監臨盤㸃見數不得指厫指庫交割違者各杖一百若官物有印封記其主典不請原封官司而擅開者杖六十出納官物有違凡倉庫出納官物當出陳物而出新物應受上物而受下物之𩔖及有司和雇和買不即給價若給價有增减不實者計所虧欠及多餘之價坐􅂍論若應給俸禄未及期而預給者罪亦如之其監臨官吏知而不舉與同罪不知者不坐收支留難凡收受支給官物其當該官吏無故留難刁蹬不即收支者一日笞五十每三日加一等罪止杖六十徒一年守門人留難者罪亦如之若領物納物之人到有先後主司不依次序收支者笞四十起解金銀足色凡收受諸色課程變賣物貨起觧金銀須要足色如成色不及分數提調官吏人匠各笞四十著落均陪還官損壊倉庫財物凡倉庫及積聚財物主守之人安置不如法曬晾不以時致有損壊者計所損壊之物坐􅂍論著落均陪還官若卒遇雨水衝激失火延燒盗賊刼奪事出不測而有損失者委官保勘覆實顯跡明白免罪不陪其監臨主守若將侵欺借貸那移之數乗其水火盗賊虛揑文案及扣換交單籍冊申報瞞官者並計􅂍以監守自盗論同僚知而不舉者與同罪不知者不坐轉解官物凡各處徴收錢帛買辦軍需成造軍器等物所在州縣交收差有職役人員陸續𩔖解本府若本府不即交收差人轉觧勒令人户就解布政司者當該提調正官首領官吏典各杖八十若布政司不即交收勒令各府就解部者首領官令典罪亦如之其起運官物長押官及觧物人安置不如法致有損失者計所損失之物坐􅂍論著落均陪還官若船行卒遇風浪及失火延燒或盗賊刼奪事出不測而有損失者申告所在官司委官保勘覆實顯跡明白免罪不陪若有侵欺者計􅂍以監守自盗論若起運官物不運本色而輙齎財貨於所納去處收買納官者亦計􅂍以監守自盗論擬斷􅂍罰不當凡擬斷􅂍罰財物應入官而給主及應給主而入官者坐􅂍論罪止杖一百守掌在官財物凡官物當應給付與人已出倉庫而未給付若私物當供官用已送在官而未入倉庫但有人守掌在官若有侵欺借貸者並計􅂍以監守自盗論隠瞞入官家產凡抄沒人口財產除謀反謀叛及姦黨係在十惡依律抄沒其餘有犯律不該載者妻子財產不在抄沒入官之限違者依故入人流罪論若抄劄入官家產而隠瞞人口不報者計口以隠漏丁口論若隠瞞田土者計田以欺隠田粮論若隠瞞財物房屋孳畜者坐􅂍論各罪止杖一百所隠人口財產並入官罪坐供報之人若里長同情隠瞞及當該官吏知情者並與同罪計所隠􅂍重者坐􅂍論全科受財者計􅂍以枉法各從重論失覺舉者减三等罪止笞五十課程明律塩法凡犯私塩者杖一百徒三年若有軍器者加一等誣指平人者加三等拒捕者斬塩貨車船頭匹並入官引領牙人及窩蔵寄頓者杖九十徒二年半挑擔䭾載者杖八十徒二年非應捕人告獲者就將所獲私塩給付告人充賞有能自首者免罪一體給賞若事發止理見獲人塩當該官司不許輾轉攀指違者以故入人罪論凡塩塲竈丁人等除正額塩外夾帶餘塩出塲及私煎貨賣者同私塩法百夫長知情故縱及通同貨賣者與犯人同罪凡婦人有犯私塩若夫在家或子知情罪坐夫男其雖有夫而逺出或有子㓜弱罪坐本婦凡買食私塩者杖一百因而貨賣者杖一百徒三年凡守禦官司及塩運司巡檢司巡獲私塩即發有司歸勘各衙門不許擅問若有司官吏通同脱放者與犯人同罪受財者計􅂍以枉法從重論凡守禦官司及有司巡檢司設法差人於概管地面并附塲𦂳關去處常川巡禁私塩若有透漏者關津把截官及所委巡塩人員初犯笞四十再犯笞五十三犯杖六十並附過還職如知情故縱及容令軍兵隨同販賣者與犯人同罪受財者計􅂍以枉法從重論其巡獲私塩入已不觧官者杖一百徒三年若裝誣平人者加三等凡軍人有犯私塩本管千百户有失鈐束者百户初犯笞五十再犯杖六十三犯杖七十减半給俸千户初犯笞四十再犯笞五十三犯杖六十减半給俸並附過還職若知情容縱及通同販賣者與犯人同罪凡起運官塩每引二百斤為一袋帶耗五斤經過批驗所依數掣摯秤盤但有夾帶餘塩者同私塩法若客塩越過批驗所不經掣摯關防者杖九十押囬盤騐凡客商販賣官塩不許塩引相離違者同私塩法其賣塩了畢十日之内不繳退引者笞四十若將􅃇引影射塩貨者同私塩法凡起運官塩并竈户運塩上倉將帶軍器及不用官船起運者同私塩法凡客商將官塩挿和沙土貨賣者杖八十凡將有引官塩不於拘該行塩地面發賣轉於别境犯界貨賣者杖一百知而買食者杖六十不知者不坐其塩入官監臨勢要中塩凡監臨官吏詭名及權勢之人中納錢粮請買􅐭引勘合侵奪民利者杖一百徒三年塩貨入官沮壊塩法凡客商中買塩引勘合不親赴塲支塩中途増價轉賣沮壊塩法者買主賣主各杖八十牙保减一等鹽貨價錢並入官其鋪户轉買拆賣者不用此律私茶凡犯私茶者同私塩法論罪如將已批騐截角退引入山影射照茶者以私茶論私礬凡私煎礬貨賣者同私鹽法論罪匿稅凡客商匿稅及賣酒醋之家不納課程者笞五十物貨酒醋一半入官於入官物内以十分為率三分付告人充賞務官攅攔自獲者不賞入門不弔引同匿稅法其造酒醋自用者不在此限若買頭匹不稅契者罪亦如之仍於買主名下追徴價錢一半入官舶商匿貨凡泛海客商舶船到岸即將物貨盡實報官抽分若停塌沿港土商牙儈之家不報者杖一百雖供報而不盡者罪亦如之物貨並入官停藏之人同罪告獲者官給賞銀二十兩人户虧兌課程凡民間週嵗額辦茶塩商稅諸色課程年終不納齊足者計不足之數以十分為率一分笞四十每一分加一等罪止杖八十追課納官若茶塩運司塩塲茶局及税務河泊所等官不行用心辦課年終比附上年課額虧兑者亦以十分論一分笞五十每一分加一等罪止杖一百所虧課程著落追補還官若有隠瞞侵欺借用者並計贓以監守自盗論錢債明律違禁取利凡私放錢債及典當財物每月取利並不得過三分年月雖多不過一本一利違者笞四十以餘利計贓重者坐贓論罪止杖一百若監臨官吏於所部内舉放錢債典當財物者杖八十違禁取利以餘利計贓重者依不枉法論並追餘利給主其負欠私債違約不還者五貫以上違三月笞一十每一月加一等罪止笞四十五十貫以上違三月笞二十每一月加一等罪止笞五十二百五十貫以上違三月笞三十每一月加一等罪止杖六十並追本利給主若豪勢之人不告官司以私債強奪去人孳畜產業者杖八十若估價過本利者計多餘之物坐贓論依數追還若准折人妻妾子女者杖一百強奪者加二等因而姦占婦女者絞人口給親私債免追費用受寄財產凡受寄人財物畜產而輒費用者坐贓論减一等詐言死失者准竊盗論减一等並追物還主其被水火盗賊費失及畜產病死有顯跡者勿論得遺失物凡得遺失之物限五日内送官官物還官私物召人識認於内一半給與得物人充賞一半給還失物人如三十日内無人識認者全給限外不送官者官物坐贓論私物减二等其物一半入官一半給主若於官私地内掘得埋藏之物者並聽收用若有古器鐘鼎符印異常之物限三十日内送官違者杖八十其物入官市􅌀明律私充牙行埠頭凡城市鄉村諸色牙行及船埠頭並選有抵業人户充應官給印信文簿附寫客商舡户住貫姓名路引字號物貨數目每月赴官查照私充者杖六十所得牙錢入官官牙埠頭容隠者笞五十革去市司評物價凡諸物行人評估物價或貴或賤令價不平者計所増减之價坐􅂍論入己者准竊盗論免刺其為罪人估贓不實致罪有輕重者以故出入人罪論受財者計贓以枉法從重論把持行市凡買賣諸物兩不和同而把持行市專取其利及販鬻之徒通同牙行共為姦計賣物以賤為貴買物以貴為賤者杖八十若見人有所買賣在傍髙下比價以相惑亂而取利者笞四十若已得利物計贓重者准竊盗論免刺私造斛斗秤尺凡私造斛斗秤尺不平在市行使及將官降斛斗秤尺作弊増减者杖六十工匠同罪若官降不如法者杖七十提調官失於校勘者减一等知情與同罪其在市行使斛斗秤尺雖平而不經官司校勘印烙者笞四十若倉庫官吏私自増减官降斛斗秤尺收支官物而不平者杖一百以所増减物計􅂍重者坐􅂍論因而得物入己者以監守自盗論工匠杖八十監臨官知而不舉者與犯人同罪失覺察者减三等罪止杖一百器用布絹不如法凡造器用之物不牢固真實及絹布之屬紕薄短狹而賣者各笞五十其物入官明㑹典卷一百三十五
