  text: 明㑹典卷一百二十一兵部十六驛傳三遞運所諸司職掌凡遞運所設置船隻不等如六百料者每隻水夫十三名五百料者每隻水夫十二名四百料者每隻水夫十一名三百料者每隻水夫十名其水夫皆於五石以下糧户内㸃差一每所設置車輛不等如大車一輛載米十石者人夫三名牛三頭布袋十條小車一輛載米三石者人夫一名牛一頭每夫一名辦牛一頭於十五石糧户内㸃充如無相應人户許衆户凑糧共當一遞運船隻俱用紅油刷飾每船置牌一面開寫本船字號料數及水夫姓名檣柁篙櫓篷索鐵猫篾纜等項一應浮動什物數目常川懸掛務要牌不離船以慿㸃視如是船隻什物損壞缺少即申合干有司委官計料修補一遞到官物所官驗實物件斤重擔數多寡隨即計筭船隻料數差撥裝運不許將前路運船越過遞送其長押人員不許索要過料船隻及多取水夫夾帶私己物貨所官亦不許徇情應付事例洪武二十四年令各處逃軍囚徒及補役軍丁遞運所接交防送二十七年議准驛遞水馬夫更不免糧止令有司總計地方合備牛馬船車等物以所管人户田糧照舊額加數均派分年應役如舊一百石者加至五百石其餘倣此遞加其兩浙税户市民囚充及湖廣山西原額站户已免垜集充軍者仍舊應當不在均派之例永樂十年令立遞運所夫頭於船户内選丁糧多者為之常川在所應役其單丁糧少者令津貼夫頭天順五年議准各處驛遞有豪强軍民包攬夫役者軍發邊衛民及餘丁發附近充軍計天下遞運所北直𨽻順天府大興遞運所良鄉縣良鄉遞運所涿州涿鹿遞運所涿州遞運所通州北闗遞運所本州遞運所三河縣東闗遞運所武清縣楊青遞運所漷縣楊村遞運所薊州南闗遞運所豐潤縣東闗遞運所玉田縣藍田遞運所大名府濬縣李家道口遞運所大名縣艾家口遞運所順徳府邢臺縣邢臺遞運所内丘縣内丘遞運所廣平府永年縣臨洺遞運所邯鄲縣邯鄲遞運所河間府任丘縣鄚城遞運所滄州長蘆遞運所吳橋縣連窩遞運所真定府真定縣真定遞運所井陘縣井陘遞運所欒城縣欒城遞運所獲鹿縣鹿泉遞運所定州定州遞運所新樂縣新樂遞運所趙州趙州遞運所柏鄉縣柏鄉遞運所保定府清苑縣清苑遞運所安肅縣安肅遞運所慶都縣慶都遞運所定興縣定興遞運所永平府東闗遞運所新店遞運所撫寧縣西闗遞運所南直𨽻應天府龍江遞運所鎮江府通津遞運所常州府奔牛壩遞運所蘓州府胥門遞運所松江府雲間遞運所太平府采石遞運所池州府大通遞運所鳯陽府遞運所頴州遞運所頴上縣遞運所太和縣界溝遞運所泗州遞運所壽州遞運所揚州府邵伯遞運所界首遞運所儀真縣遞運所淮安府遞運所山陽縣淮北下闗遞運所清河縣小村坊遞運所清河遞運所桃源縣遞運所沭陽縣桑墟莊遞運所郭家莊遞運所海州駝峯遞運所盧家莊遞運所贑榆縣下分水嶺遞運所中崗遞運所邳州遞運所睢寧縣新安遞運所安慶府本府遞運所徐州遞運所沛縣遞運所浙江杭州府遞運所嚴州府桐廬縣遞運所金華府遞運所蘭溪縣遞運所衢州府常山縣新站遞運所嘉興府嘉禾遞運所江西南昌府南浦遞運所臨江府清江遞運所吉安府螺川遞運所五雲遞運所贑州府水西遞運所南安府横浦遞運所建昌府旴江遞運所撫州府臨川遞運所廣信府遞運所玉山縣玉山遞運所鉛山縣車盤遞運所鉛山遞運所貴溪縣薌溪遞運所饒州府鄱陽遞運所南康府遞運所九江府九江遞運所湖廣武昌府遞運所黄州府蘄州遞運所荆州府遞運所歸州遞運所夷陵州本州遞運所常徳府栗店遞運所永州府遞運所辰州府沅陵縣沅陵遞運所辰溪縣辰溪遞運所添設沅州城南遞運所黔陽縣安江遞運所長沙府遞運所衡州府遞運所岳州府巴陵縣城陵遞運所澧州水東遞運所福建福州府遞運所懷安縣遞運所古田縣水口遞運所建寧府建寧遞運所崇安縣大安遞運所崇安遞運所建陽縣建陽遞運所延平府遞運所嵢峽遞運所廣東廣州府遞運所清逺縣横石遞運所新㑹縣新㑹遞運所惠州府龍川縣遞運所韶州府曲江遞運所南雄府小嶺中站遞運所潮州府海陽縣三河遞運所黄崗遞運所雷州府海康縣雷陽遞運所遂溪縣桐油遞運所徐聞縣呇磊遞運所廉州府欽州寧越遞運所靈山縣格木遞運所安河遞運所瓊州府瓊山縣海口遞運所髙州府三合遞運所廣西桂林府遞運所全州遞運所栁州府栁州遞運所梧州府梧州遞運所藤縣雙競遞運所􅉱林州陸川大洞遞運所北流遞運所潯州府遞運所平樂府遞運所昭平遞運所南寧府南寧遞運所横州海棠橋遞運所太平府遞運所四川成都府遞運所重慶府遞運所忠州雲根遞運所叙州府遞運所䕫州府遞運所萬縣遞運所瀘州遞運所嘉定州遞運所烏撒軍民府黑章遞運所在城遞運所永寧宣撫司永寧遞運所赤水河遞運所貴州貴州宣慰使司畢節遞運所安南衛尾洒遞運所河南開封府祥符遞運所祥符縣時和遞運所扶溝縣崔橋遞運所中牟縣中牟遞運所延津縣廩延遞運所鈞州遞運所新鄭縣新鄭遞運所襄城縣襄城遞運所添設鄭州遞運所榮澤縣遞運所榮陽縣榮陽遞運所氾水縣成臯遞運所河南府洛陽縣洛陽遞運所偃師縣偃師遞運所新安縣新安遞運所磁澗遞運所鞏縣遞運所沔池縣義昌遞運所沔池遞運所陜州硤石遞運所七星店遞運所横渠遞運所張茅遞運所閿鄉縣遞運所靈寳縣靈寳遞運所彰徳府安陽縣安陽遞運所湯隂縣宜溝遞運所塌河遞運所磁州磁州遞運所衛輝府河平遞運所北闗閘遞運所新鄉縣新鄉遞運所獲嘉縣獲嘉遞運所亢村遞運所淇縣淇縣遞運所懷慶府河内縣河内遞運所萬善遞運所武