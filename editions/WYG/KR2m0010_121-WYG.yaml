朝覲往來俱許馳驛八年令三司官按行所部許乗驛南京部院公差官赴京回還與遞運船正統二年奏准總兵鎮守官征哨出入各乘原闗馬匹其驛傳馬驢車輛俱不許應付四年令太僕寺官出巡許支廩給七年令巡按直𨽻御史奏刑名重事所差人許給驛驢紅船常事不許各處鎮守等官差人奏事應攴廩給者回日本部於勘合内批限到彼住支天順元年令各王府及總兵鎮守等官有乞恩等項事干己私者不許給驛止令入遞具奏成化四年奏准貴州布按二司進表官依都司例往還並許給驛五年令南京守備及各邊鎮守巡撫等官遇軍情重事㑹議既定各自具本共差一人馳奏常行事理三五起併差一人各王府進貢等項許差内外官一二人䕶扛軍校一二名扛多者不過五名六年奏准親王乞恩等項事情每歲春秋各一次差人馳驛類奏郡王將軍中尉等有應奏事理即於春秋具啟本府親王轉奏其𦂳急事務仍依舊制十二年奏准南京三法司奏請重刑待報及提問軍職者差來人並許乘驛其兩京抽分巡街等官不出百里外者不許𢎞治五年奏准天下驛分各於巡按御史處給簿一扇遇應付過夫馬車船等項及過客職名逐一填註年終類冊繳報以慿查考應付脚力諸司職掌一在京差辦事官行人舍人往各處催攝公事水路應付順便船隻陸路逺者應付脚力或車輛驢匹一四夷畨使各處土官來朝并回還水路遞運船陸路脚力一力士校尉差去雲南四川兩廣福建水路應付巡檢司船裝送一文武官員到任一千五百里之外一老疾軍人軍屬寡婦并病故官員遺下家小還鄉一為事編發差試百户管領前去雲南遼東大寧等處充軍并撥守雲南大寧遼東等處補役軍人水路應付船隻事例洪武二十五年奏准為事發雲南兩廣福建遼東充吏安置者應付船隻與充軍者同天順八年令文武官公差病故者所在棺歛䕶送還鄉成化五年奏准凡公差監生有病故者照依故官家屬例應付口糧人夫脚力驛遞應付總例凡五府六部都察院遣人馳驛公幹而有三司委官同事者許同驛船若三司自委官或承差人等赴所屬公幹者都司委官水乗軍衛快船陸行自備布按二司委官承差水乗遞運船陸路官乗官馬承差人等自備凡齎擎詔􅃯飛報軍情及特㫖差遣者陸給雙馬水給站船公侯駙馬伯都督從人與驢匹隨從巡撫風憲巡河等官者與中等馬水給站船凡各王及各處鎮巡三司官差官進奉表箋繳勅謝恩者陸給雙馬水給站船者貢物者遞運夫䕶送其尋常奏事與驢匹紅船若順齎㫖意公文者水給站船陸與下等馬南京各衙門及各邊副参遊撃等官留守三司行太僕寺苑馬寺差人入奏並同凡南京進表官馳驛者許乗馬船原起驛船慿以到闗不許重坐凡南京太常寺委官及孝陵鳳陽陵户墳户社長領香帛等物往來俱給驛船陸起驛驢俱撥遞運人夫䕶送其陵户等驛驢每二人共與一匹凡衍聖公朝覲往還陸起上馬驛車水給站船或馬快船應付人夫皂𨽻顔孟二博士與中等馬衍聖公掌書與驛驢廟户家人醫獸每二人給驢一匹凡嗣教張真人來朝自貴溪至南京陸路上等馬一水給驛船三遞運船二隨行法師與驛驢南京至北京水給驛船一馬快船二陸起車輛并應付皂𨽻人夫凡巡視倉場等官不及百里者不與脚力凡錦衣衛官齎勅㫖出外應馳驛者量地逺近於闗文定限回程違者㕘奏凡外官領勅赴任如提學兵備之類陸起雙馬水起站船無支給凡清軍文冊付應得脚力之人順齎凡故官家口還鄉應得脚力者陸路驛驢車輛水路紅船雲南赴任官同無支給凡差往山西陕西甘肅寧夏等處公幹及彼處赴京者並給馬驢往還不許勒要應付船隻違者㕘奏若果係患病勘實方許凡公差到京人員半月外不回還者革去應得脚力果患病者不拘凡朝鮮國使臣與下等馬添撥驛車安南琉球占城等國使臣與驛驢站船凡諸國從人俱與驛驢水路紅船無支給凡諾延泰寜等衛都督都指揮哈宻竒木嘉色稜齊勤蒙古等衛使臣俱與下等馬添撥驛車哈宻等處從人仍與驛驢凡烏思藏董卜韓胡土官通事畨僧洮岷西寧畨僧人等俱與驛驢車輛水起紅船内齎勅者與下等馬水起驛船其貴州湖廣土官舍人土民人等二人俱驢一匹凡來降夷人陸與下等馬添撥車輛水起驛船人衆者給遞運馬快船口外走回人口不堪充勇士與婦女願回原管官司者俱與脚力凡前項應給驛船之人係官者兩人同載非官者四人同載共闗文一紙應給紅船之人係官者四人同載非官者六人同載共闗文一紙前途遇應分路處方許分闗如一時偶無同載官員而有役人附載者依兩官共船之例若公差人員有文卷旗牌火印火藥之類須䕶送者許量撥遞運人夫陳告消乏諸司職掌凡糧僉水馬遞運人户陳告消乏驛所即申有司體勘是實就便僉替不許刁蹬靠損事例天順間奏准天下驛遞夫役每十年一次磨勘重編丁糧相應者作正消乏者作貼應僉替者即與僉替成化間奏准市民馬户有告消乏者並許勘實僉替符驗諸司職掌凡在内公差人員係軍情重務及奉特㫖差遣給驛本部填給勘合所差人員轉赴内府闗領符驗給驛前去事完就便銷繳事例洪武二十三年重造符驗給在外官司凡各王府及山西北平山東陜西廣東福建遼東貴州等都司布政司各給六道雲南都司布政司陜西凉州衛各給十道浙江江西湖廣四川廣西布政司及金齒衛各給五道都司不與如有軍務以多槳快船飛報中都留守司各道按察司陜西寧夏衛各給四道山海宻雲永平河州岷州洮州大理臨安普安松潘建昌茂州諸衛各給三道畢節烏撒永寧普定平越楚雄曲靖洱海五開鎮逺興隆諸衛各處宣慰使司及衍聖公張真人各給二道其餘衙門及腹裏軍衛運司俱不給二十四年令各處布按二司符驗各减一道雲南布政司及凉州衛减二道四川都司給起馬符驗三道瀘州衛原領仍許存留衍聖公張真人停給永樂以後增給浙江寧波衛宣府都司符驗各一道陜西綏徳衛二道宣徳四年奏准在外有符驗官司歲終具給驛起數及所幹事造冊繳部以慿稽考成化十四年奏准各處分守協守副㕘逰撃等官所領符驗止許用於本境傳報聲息及謝恩等項餘事不許𢎞治九年申明舊例凡欽命文武大臣出外公幹該請符驗者本部具手本赴尚寳司轉行印綬監於寳簿内填註所領官員職名親領應用還日徑自奏繳本部仍用手本赴監註銷其填巡等官在外更調陞用者本部即於原擬本内將該用符驗奏准行令就彼交收俟其回奏復用手本赴監對號轉註急遞舖諸司職掌凡十里設一鋪每鋪設鋪長一名鋪兵要路十名僻路或五名或四名於附近有丁力田糧一石五斗之上二石之下㸃充須要少壯正身每鋪設十二時日晷一箇以驗時刻鋪門首置立牌門一座并牌額全常明燈燭一副簿厯二本鋪兵每名各置夾版一副鈴襻一副纓鎗一把棍一條回厯一本一遞送公文照依古法一晝夜通一百刻每三刻行一鋪晝夜須行三百里但遇公文到鋪不問角數多少須要隨即遞送無分晝夜鳴鈴走遞前鋪聞鈴鋪司預先出鋪交收隨即於封皮格眼内填寫時刻該遞鋪兵姓名速令鋪兵用袱包裹夾板拴繫齎小回厯一本急遞至前鋪交收於回厯上附寫到鋪時刻以慿稽考毋致停滯差迷如是公文到來不即遞送停積等待因而失悞事機者問罪一各州縣於額設司吏内選充鋪長一名專一巡㸃所轄鋪分督令各鋪司兵如法走遞親臨府州縣提調官常加檢㸃鋪長失於整㸃隨即問罪每月置立文簿當該提調官署押附寫遞過公文時刻角數以慿稽考一無印信文字不許入遞其各衙門但有入遞公文須要堅厚好紙封裹轉遞各鋪明白附厯於上開寫並無破損並不曾折動原封但有磨擦破壞及折動原封者就將來文封皮上寫記原遞鋪兵姓名遞發及將遞來鋪兵拘捉解官有司即為追究一鋪舍損壞什物不完鋪兵數少及有老弱之人在鋪當役者有司提調官吏即便修理僉㸃補替事例洪武二十五年令急遞鋪接送公文必須辨認果是前鋪鋪兵方許交領但有詐冐押解赴京凡在外衙門有應遞公文令鋪兵當官交領其差使人員遇有公文亦須經由所在官司辨驗方許入遞凡有人於中途鋪分投下公文不係知識者許本鋪司兵挐解赴京凡有司官吏鋪長司兵有公文不行明白辨驗輕易接遞致令别生事端者治罪正統三年奏准各鋪添設鋪司一名兩京總鋪添設三名各布政司總鋪添設二名專一齎送㫖意公文如有稽違依律問罪七年議准各鋪遞送簿厯該管官司每月一次巡視刷勘有將公文毁壞增改沉匿者問擬明白發口外充軍𢎞治十三年奏准各鋪司兵若有無籍之徒不容正身應當用强包攬多取工錢致將公文稽遲沉匿等項問罪旗軍發邊衛民并軍丁人等發附近俱充軍其提調官該吏鋪長各治以罪馬快船事例洪武初置江淮濟川二衛馬快船及南京錦衣等衛風快船以備水軍征進之用既建北京遂專以運送郊廟香幣上供品物軍需器仗及聽候差遣俱屬南京兵部掌管輪流差撥遇有損壞及夫甲在逃行移各該衙門勾補修造正統六年令編排南京馬快船以五十號為一班輪赴北京聴用半年一替合用口糧於南京總領凡該班馬快船前班以四月初到後班以十月初到本部拘收勘合轉付通州守備官收掌㸃視限滿得替或遇差撥仍齎勘合赴本部批迴景泰元年議准南京錦衣等衛風快船改屬南京兵部七年添設南京兵部主事一員專管快船天順元年令馬快船裝運官物除本船軍夫外合用添撥人夫並於闗文開寫上水二十名下水五名軍衛三分有司七分違者及應付者治罪凡私載及求索之物盡數入官八年令馬快船例該聽候半年外其餘運物到京者並將勘合投部以聽差撥成化六年奏准馬快船附載私貨者本船小甲并附船之人俱發口外充軍其空身附搭者以違制論十六年令馬快船回還順帶官物者上水夫八名下水夫四名應付馬快船事例一凡欽差内臣公侯伯出外公幹如操江鎮守之類應從水路者一每年欽差公侯伯郎中等官赴各王府冊封者一在京大臣以禮致仕有㫖馳驛還鄉及丁憂病故者一襲封衍聖公嗣教張真人朝覲回還一南京内外官進貢回還一安南日本等國使臣朝貢回還明㑹典卷一百二十一
