body:
  text: 明㑹典卷十三吏部十二諸司職掌在京未入流品衙門吏攅滿日於九品衙門吏員内用九品衙門吏攅滿日於八品衙門司吏七品衙門典吏内用八品衙門司吏七品衙門典吏滿日於七品衙門書吏六品衙門典吏内用七品衙門書吏滿日於五品衙門司吏内用六品衙門司吏滿日於五品衙門司吏内用五品衙門典吏滿日於五品衙門司吏四品衙門典吏内用五品衙門司吏滿日於四品衙門司吏三品衙門典吏内用四品衙門典吏滿日於四品衙門司吏三品衙門典吏内用四品衙門司吏滿日於三品衙門令史胥史二品衙門典吏内用三品衙門典吏滿日於三品衙門令史胥史二品衙門典吏内用三品衙門令史胥史滿日於二品衙門令史一品衙門典吏内用二品衙門典吏滿日於二品衙門令史一品衙門典吏内用二品衙門令史滿日於一品衙門掾史對品衙門都吏内用都吏滿日於一品衙門提控内用一品衙門典吏滿日於對品衙門掾史内用掾史滿日於對品衙門提控内用在外大小衙門典吏不許陞轉三十六箇月考滿給由赴京聽用事例詳見驗封司諸司職掌凡除授過官員開寫年籍鄉貫住址脚色貼黄通類具奏赴内府用寳附貼如有陞調改降官員續附轉貼及本部選部考功付并各衙門開到官員事故明白下落縁由通類具奏開揭如無的確下落行移該問及原任衙門照勘明白以憑施行事例凡續附貼黄每月一次具奏年終類進内庫收貯諸司職掌凡事故官員照依揭下貼黄於事故冊内類姓開寫年籍脚色鄉貫住址厯任俸月過名及事故下落縁由以憑存照諸司職掌凡内外官吏人等例合丁憂者務要經由本部京官具奏闗給内府孝字號勘合吏典人等劄付應天府在京劄付順天府給引照囬在外官吏人等移文知㑹所在官司給引回還除祖父母父母承重丁憂外期年喪服不許守制及移文原籍官司體勘明白開寫是否承重祖父母及嫡親父母取具官吏里鄰人等結罪文狀回報如有詐冐就便解部仍以聞喪月日為始不計閏二十七月服滿起復若有過期不行移文催取到部果無事故在家遷延者咨送法司問罪明令凡官吏丁憂除公罪不坐外其犯贓罪及係官錢糧依例勾問事例凡官吏守制服滿定限赴部在京北直𨽻四個月河南山東六個月山西陜西浙江江西湖廣南直𨽻八個月福建兩廣貴州四川十箇月雲南一年此外違限二箇月之上叅問凡在京堂上官丁憂具奏給與孝字號勘合司屬以下官并太醫院醫士舊例類引奏請𢎞治元年奏准不引官闗勘合醫士送順天府給引南京堂上官丁憂親自赴京奏給勘合司屬以下官本部以勘合發南京吏部填給起復齎赴本部類繳其吏貟人等各給引如舊在外官吏俱從所在官司放回併申本部洪武十九年令欽天監官不守制後許奔喪三箇月二十六年令倉官放糧守支未絶聞父母喪者交盤付見任官吏方許守制二十八年令隂陽醫學官丁憂起復就彼復職世襲土官在職守制三十五年令太常寺官雖由樂舞生出身聞父母喪亦許囬原籍守制永樂元年令王府官父母歿於任所者囬原籍守制太醫院官及醫士有父母歿葬於京城外者許依墳守制正統七年令官吏匿喪者俱發原籍為民十二年令内外大小官員丁憂者不許輙便保奏奪情起復天順二年令官吏以舊喪詐作新喪者發順天府昌平遵化薊州等處為民係順天府者發口外為民若父母見在詐稱死亡者發口外獨石等處充軍其聞父母喪匿不舉哀不離職役者原籍三千里之上限一年不及者限半年過限者發口外隆慶永寧等處為民成化十五年令詐匿喪官員所在官司容情起送或因他事發覺正犯悉照見行事例發落經該官吏以枉法從重論𢎞治三年令官吏未滿接服守制不行申報及扶同官吏究問若稱已行申報中途沉滯者官員監生不許附選吏典不許實撥俟行查至日定奪凡京官公差養病在外丁憂不給勘合及相繼丁憂不以勘合并官司申文赴部改填或勘合遭風水濕無告官明文者俱問罪凡官吏丁憂月日多少者問罪例限外違限二箇月者問罪如患病既痊後水程違限二箇月者及患病二年之上雖有文憑者亦問罪文移不開父母病故并聞喪服滿月日及那移洗改月日者稱病不開得患與痊疴日期及無所在官司印信明文者俱問罪凡為事問革考察退任詐稱丁憂起復者發口外為民扶同起送官吏以枉法論凡官吏監生丁憂起復給批違限一年之上送問行查或限内限外為事無招雖有招開還職役不明或長孫承重不開父故年月及有無伯兄或丁養父母憂不開自㓜過房或咨申不粘原籍官吏人等執結者俱行查凡巡檢倉庫等官丁憂去任不告給上司明文王府官丁憂不告給長史司明文辦事官吏在部丁憂回家十年之上起復兩考役滿吏七年之上起復到部者俱行查近例令各王府儀賓凡遇父母之喪徑自啓王不分原籍逺近暫令前去奔喪量程逺近定與假限事畢依期回還仍須各王隨為具奏舊制官員致仕𨽻本司掌行後歸考功司諸司職掌凡官員年七十以上若果精神昏倦許令親身赴京面奏如准本部查照相同方許去官離職事例見考功司諸司職掌凡官員父母年七十之上許令移親就禄侍養如果父母老疾去官路逺户内别無以次人丁者方許親身赴京面奏揭籍定奪及吏貟人等父母年老别無人丁者務要經由本部移文體勘是實明白奏准方令離役俱候親終服滿起復赴部聴用諸司職掌凡官吏人等或年幼過房乞養欲復本姓者經由本部移文原籍官司體勘是實及官㓜名改諱具奏改正貼黄仍行知㑹移咨户部改附籍冊吏員人等㓜名改諱者移文本部准改事例洪武三年詔䝉古色目人入仕後或多更姓名嵗久子孫相傳昧其本源如已更易者聴其改正又令官吏人等名字有天國君臣聖神堯舜禹湯文武周漢晉唐等國號相犯者悉更之又令官吏人等奏告更名復姓若自幼過房乞養或入贅與人因從外姓報入户籍外姓係軍匠竈户而本姓係民者不許改復十九年詔軍民并吏胥人等敢有更名易諱及兩三名字被人告發家財給賞告人本身處死家口遷發化外諸司職掌凡本部官吏人等俸給每月初間明白立案及帶支衙門將實支官吏姓名同該支米數造冊赴部劄付該部官員放支仍將實支米數回呈立案諸司職掌凡本部合用印色支銷盡絶移咨工部轉行該庫放支事例洪武間凡本部合用印色每年約用紫粉斤數具呈本部赴户科闗領外承字號勘合前去户部比號相同附寫底簿明白就齎勘合赴内府外承運庫比號相同照數關領回部應用仍將支過數目回呈本部立案備照後奏准於順天府官錢内具奏支給買用諸司職掌凡本部合用紙劄移咨刑部於贓罰鈔内闗支價鈔買用明白立案開銷以憑稽考事例洪武間凡紙劄每季各司㑹計合用數目明白開附本司案呈本部填寫實支數目具手本赴户科闗領乙字號勘合赴户部比號相同附寫底簿齎勘合赴内府乙字庫照數闗領回部應用支銷盡絶明白花銷立案備照後奏准於刑部都察院見收囚人紙劄内具奏闗用明會典卷十三
