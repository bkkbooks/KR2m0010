body:
  text: 明㑹典卷九十四禮部五十三䘮葬國初武臣亡歿朝廷念其勲勞賻卹之典特從優厚具見諸司職掌其後漸爲限制今併文臣卹典竝著於後而外夷官員亦附焉諸司職掌一優給則例凡陣亡失䧟傷故渰没者全支邉逺守禦出征并出海運糧病故者減半一品米六十石麻布六十疋二品米五十石麻布五十疋三品四品米四十石麻布四十疋五品六品米三十石麻布三十疋一公侯亡故不分病故陣亡止給麻布一百疋本部奏輟朝三日仍具手本行移在京衙門知㑹一將引本官家人赴内府給與布疋一咨工部造辦㝠器棺槨及撥人匠磚石造墳安葬一劄付欽天監選擇墳地一具手本赴光禄寺備辦祭物遣官行禮一本部奏議封諡一自初䘮至除服以次遣官致祭聞䘮入歛首七至終七下葬百日新冬周年二周除服一都督至都指揮亡故本朝奏輟朝二日移咨工部造辦棺槨等項仍備辦祭物自初䘮至除服節次遣官致祭聞䘮下葬百日周年除服如合優給者照前則例并咨兵部照例追贈一指揮使至指揮僉事亡故本部移咨工部造墳安葬亦節次遣官致祭安靈下葬周年除服照例優給追贈一衛所鎮撫千百戸亡故本部移咨工部造墳安葬止二次遣官致祭安靈下葬照例優給追贈一公侯及在京一品二品父母妻䘮三品四品父母䘮曽受封贈及致仕者各照品級造墳安葬在外止祭祀未封贈者無一在外都指揮使至指揮僉事止是本部遣人往祭一次若囘京安葬則照例祭祀造墳千百戸别無祭葬例一公侯在外病故聞䘮止輟朝一日靈襯到京仍輟朝三日下葬輟朝一日事例洪武五年定官民䘮儀品官棺用油杉朱漆槨用土杉墻翣公侯六三品以上四五品以上二㝠器公侯九十事一品三品八十事三品四品七十事五品五十事六品七品三十事八品九品二十事引披鐸公侯四引六披左右各八鐸一品二品二引四披左右各六鐸三品四品二引二披左右各二鐸羽旛竿長九尺五品以上一人執之以引柩六品以下不用功布品官用之長三尺方相四品以上四目七品以上兩目八品以下不用柳車上用竹格以綵結之旁施帷幔四角埀旒蘇誌石二片品官皆用之其一爲蓋書某官之墓其一爲底書姓名鄉里三代生年月日及子孫卒葬月日婦人則隨夫及子孫封贈二石相向用鐵束埋墓中祭物四品以上用羊豕九品以上用豕庶人棺所用堅木油杉爲上栢次之土杉松木又次之用黒漆金漆不得用朱紅􅁳器一事功布以白布三尺引柩栁車以衾復棺誌石二片如品官之儀塋地周圍十八歩每面四歩半祭物用豕力不及者隨家有無永樂後續定官員祭葬則例凡公侯承襲病故者祭二壇若管府事有功蹟加太子太保以上及守備南京者俱祭十六壇凡駙馬都尉病故者祭十五壇凡伯爵承襲病故者祭二壇其年㓜襲爵不久而故者祭一壇若管事有功蹟加太子太保以上者祭十五壇凡公侯駙馬伯病故俱輟朝一日齋粮麻布取自上裁其葬禮俱照依定制若公侯伯爲事病故者祭葬等項恩典俱無凡公侯伯母與妻俱祭二壇係皇親者加祭壇數取自上裁已上公侯伯駙馬例凡兩京二品以上文官并父母妻三品文官并父母曽授本等封者俱照例祭葬其三品父母止授四品封及四品官并父母授本等封者俱止賜祭一壇若止授五品以下封者祭葬俱無其有出自特恩者不在此限凡一品官病故者輟朝一日祭九壇父母授封至一品者祭二壇妻祭一壇凡尚書左右都御史在任病故者祭二壇其加有東宫三少或兼大學士贈一品者祭四壇父母妻祭俱一壇凡兩京三品官病故者俱祭一壇致仕者亦然以其侍郎兼學士贈尚書者祭二壇凡兩京三品以上官葬祭制度俱照依品級其四品五品官得特恩賜葬者亦以本等品級爲定惟衍聖公葬祭照一品禮行已上文官例凡左右都督至都督僉事管府事病故者俱祭六壇齋粮麻布取自上裁其先有功後閒住病故者祭二壇母妻祭俱一壇凡都督僉事以上葬禮俱照品級若署都督僉事祭一壇無葬凡中都留守正副俱祭一壇凡在京親軍衛分帶俸都指揮使及同知僉事在御馬監把總或出充遊擊參將等官有功無過者祭一壇凡錦衣衛管事指揮使同知僉事或帶都指揮職銜者俱祭一壇其係于皇親者祭葬取自上裁凡在京在外文武官員不拘品級其以死勤事者恩典取自上裁已上武官例凡女直都督等官永樂間差官賫香鈔諭祭近例因其奏請給與表裏祭文令帶囬自祭凡逹官都督等官永樂宣徳間來京病故者隨時遣官諭祭或給棺賜葬近例本部年終類奏分遣官祭之若在邊没於戰陣者不在此例凡外國使臣病故者令所在官司賜棺及祭或欲歸葬聽從其便已上四夷官例賜諡國朝親王諡例用一字郡王二字其文武大臣亦用二字與否取自上裁若官品未高而侍從有勞或以死勤事特恩賜諡者不拘常例事例洪武初議諡俱本部奉㫖施行二十五年令本部行翰林院擬奏請㫖𢎞治四年令今後有乞恩贈諡者本部斟酌可否務合公論不許一槩比例濫請十五年奏准凡親王薨逝行巡撫巡按等官覈勘郡王病故行本府親王及承奉長史等官覈勘善惡得實明白結報具奏定諡又奏准文武大臣有請諡者本部照例上請得㫖行吏兵二部備查實蹟本部定爲上中下三等以行業俱優者爲上行實頗可者爲中行實無取者爲下開送翰林院擬諡請㫖明㑹典卷九十四
