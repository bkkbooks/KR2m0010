body:
  text: 明㑹典卷七十六禮部三十五貢舉舉保舊例舉保俱隸本部凡有司起送至者咨發吏部聽用以後徑送吏部而本部所掌惟歲貢生員諸司職掌一凡舉保孝㢘人才秀才及山林隠逸本部即行所屬委自正官選求民間果係名實相副素無過犯之人有司起送到部咨發吏部聽用歲貢諸司職掌一歲貢生員到部本部奏聞送翰林院考試如果中式者送國子監讀書其入學五年以上及二次不中者發充吏典提調官吏及教官訓導照例决罰事例洪武十六年奏准天下府州縣學自明年為始歲貢生員各一人俱限正月至京從翰林院試經義四書義各一道判語一條中式者入國子監不中者罰充吏十八年令歲貢不中式者遣復學肄業提調官吏論以貢舉非其人律教官訓導罰俸一年貢不如期者以違制論二十一年令歲貢府學一年州學二年縣學三年各貢一人必性資純厚學業有成年二十以上者方許二十二年令雲南選貢送監二十四年奏准歲貢不中者有司官任及三年者照例論罪二年者住俸半年一年者住俸三箇月學官無分久近照例責罰生員食廩五年者充吏不及者復學次年復不中者雖未及五年亦充吏二十五年令歲貢府學一年二人州學二年三人縣學一年一人二十六年令四川土官衙門歲貢生員免考送監二十八年奏准歲貢初試不中者遣復學停廩肄業提調官教官訓導取招生員限次年再試兩廣四川限兩年再試復不中者照例充吏提調官教官訓導仍舊責罰三十年令歲貢不中復學者免停廩永樂元年令廣西土官衙門照雲南例生員有成材者不拘常例從便舉貢如十年之上學業無成者就准本處充吏二年令歲貢照洪武二十五年例直隸浙江河南限正月到部山東山西陜西湖廣福建江西限二月四川廣西廣東限三月八年令凡州縣户不及五里者州一年縣二年各貢一人十八年令貴州選貢送監十九年令歲貢照洪武二十一年例又令歲貢生員起送到部遇有事故不許補貢其在家或中途事故者勘明准另次考補貢若丁憂及患病勘明仍補該年之貢如託故延至三年之外者亦不准收有司朦朧送補者各治罪宣德二年令貴州府學照縣學例三年一貢七年令歲貢照洪武二十五年例八年令天下州不及二十里歲貢一人正統四年奏准生員科舉停支廩米准作食粮月日充貢六年令府學一年貢一人州學三年貢二人縣學二年貢一人七年令歲貢精選端重有文及通書算者起送仍限正月到部十三年奏准州學四年貢三人天順六年令歲貢照例將食粮年深者嚴加考試務要通曉文理方許起送又令歲貢生員取考科貢開除廩米月日准作食粮之數其餘俱作虚曠若同案食粮則以籍名先後為次仍將考過試卷粘連批文親齎赴部成化元年令三氏學三年貢一人提學官考試起送二年奏准衛學照縣學例二年貢一人四年令雲南貴州選貢仍照舊例考送又令歲貢已起送或在家中途事故過一年之上不許補貢又令歲貢生員丁憂起服月日准作實數其養病侍親及服闋不復學皆作虚曠十六年令歲貢不分軍民生俱聽提學官考試其衛學在布政司地方布政司給批起送在兩直隸地方各府起送在各邊都司起送凡京學二年貢三人軍民指揮使司衛學照府學例軍民生相間一年貢一人都司及土官學照州學例三年貢二人𢎞治八年奏准自九年起至十三年止順天應天二府四年各該貢六名者許貢一十二名其餘府學每年該貢一名者許貢二名州學三年該貢二名者二年許貢三名縣學衛學二年該貢一名者每年各貢一名以後仍照見行例十三年奏准自十四年為始各處州學俱四年三貢其雲南四川貴州等處除軍民指揮使司儒學軍民相間一年一貢其餘土官及都司學各照先年奏准事例三年二貢凡廣西雲貴湖廣四川等處但有冒籍生員食粮起貢及買到土人倒過所司起送公文頂名赴吏部投考者俱發口外為民賣與者行移所在官司追􅂍問罪若已授職依律問以詐假官死罪賣者發邊衛充軍其提調經該官吏朦朧起送者各治以罪十四年奏准萬全都司照府學例一年一貢其餘都司所屬衛分少者不許濫比又令今後各處送到歲貢生員願授教職者雖係南監人數亦送北監坐監一年本監按季考試能通三塲文字委係家貧親老者方許告送吏部嚴加考試中者方送廷試取中選用不中仍送回本監肄業本部仍行提學官今後務嚴考貢之法不許姑息起送學校一國朝學校之設徧於天下為作養人材之地本部職掌所重者若科舉乃學校中事而其䂓約有不止於禮射書算者今載於後諸司職掌一在京國子監中都國子監及天下府州縣學校本部悉掌之一科舉凡遇子午卯酉年則鄉試辰戌丑未則㑹試畢則殿試其取中舉人咨發吏部聽用一禮射書算既有定式各處學校生員務要講習精熟以備考試國子監兩京同事例見本衙門中都國子監後裁革府州縣儒學選補生員事例洪武初令在京府學生員六十人在外府學四十人州學三十人縣學二十人日給廩膳生員聽於民間選補仍免其家差徭二丁二十年令増廣生員不拘額數二十七年令武官舍餘年十五以下許入府州縣學讀書宣德三年定増廣生員在京府學六十人在外府學四十人州學三十人縣學二十人照例優免差徭七年令衛所官舍軍餘俊秀者許入附近府州縣學聽赴本處鄉試正統元年生員名缺許本處官員軍民之家及社學俊秀無過犯子弟選補十二年奏准生員常額之外軍民子弟願入學者提調教官考選俊秀待補増廣名缺一體考送應試天順六年令廩膳有缺於増廣内考選學問優等者幇補増廣有缺於本處官員軍民之家選聰敏俊秀子弟補充景泰二年令雲南貴州軍民生相兼廩膳照例科貢三年各處軍生許考補廩膳照例科貢成化三年令衛學四衛以上軍生八十人三衛以上軍生六十人二衛一衛軍生四十人不及者不拘有司儒學軍生二十人十七年土官嫡子許入附近儒學𢎞治七年奏准廩膳有缺務於増廣内考補不許將别學増廣調補學規事例洪武二年詔天下府州縣立學校學者專治一經以禮樂射御書數設科分教三年定學校射儀前期戒射定耦選職事充司正副司正司射司射器請射舉爵收矢執旗樹鵠陳設訖至日執事者入就位請射者引主射正官及各官員子弟士民俊秀者各就品位司射器者以弓矢置於各正官及司射前請射者詣正官前圓揖畢引詣司射器前受弓矢訖復位司正執算入立于中後請射者詣司射前曰請誘射引司射二人耦進各以三矢搢于腰帶之右以一矢挾於二指間推年齒相讓年長者為上射年幼者為下射上射先詣射位向鵠正立發矢司正書中投算置于中舉旗者如所射應之射畢退立于傍讓下射者詣位射訖請射者俱引復位收矢者收矢復於射者司正取所中算請射者次請士民俊秀射次請官員子弟射次請品卑至品髙者射其就射位發矢取算書中舉旗收矢復位皆如前儀既畢司正副司正各持算白中於主射正官舉爵者酌酒授中者飲之中的者三爵中采者二爵飲訖請射者請屬官以下仍捧弓矢納於司射器還詣主射正官前相揖而退十五年頒禁例於天下學校鐫勒卧碑置於明倫堂之左永為遵守一今後府州縣生員若有大事干於己家者許父兄弟姪具狀入官辯訴若非大事含情忍性毋輕於至公門一生員之家父母賢智者少愚痴者多其父母賢智者子自外入必有家教之方子當受而無違斯孝行矣何愁不賢者哉其父母愚痴者作為多非子既讀書得聖賢知覺雖不精通實愚痴父母之幸獨生是子若父母欲行非為子自外入或就内知則當再三懇告雖父母不從致身將及死地必欲告之使不陷父母於危亡斯孝行矣一軍民一切利病並不許生員建言果有一切軍民利病之事許當該有司在野賢人有志壯士質樸農夫商賈技藝皆可言之諸人毋得阻當惟生員不許一生員内有學優才贍深明治體果治何經精通透徹年及三十願出仕者許敷陳王道講論治化述作文詞呈稟本學教官考其所作果通性理連僉其名具呈提調正官然後親賫赴京奏聞再行面試如果真才實學不待選舉即時錄用一為學之道自當尊敬先生凡有疑問及聽講説皆須誠心聽受若先生講解未明亦當從容再問毋恃己長妄行辯難或置之不問有如此者終世不成一為師長者當體先賢之道竭忠教訓以導愚䝉勤考其課撫善懲惡毋致懈惰一提調正官務在常加考較其有敦厚勤敏撫以進學懈怠不律愚頑狡詐以罪斥去使在學者皆為良善斯為稱職矣一在野賢人君子果能練達治體敷陳王道有關政治得失軍民利病者許赴所在有司告給文引親賫赴京面奏如果可采即便施行不許坐家實封入逓一民間凡有寃抑干於自己及官吏賣富差貧重科厚歛巧取民財等事許受害之人將實情自下而上陳告毋得越訴非干己事者不許及假以建言為由坐家實封者前件如已依法陳告當該府州縣布政司按察司不為受理聽斷不公仍前寃枉者然後許赴京伸訴一江西兩浙江東人民多有不干己事代人陳告者今後如有此等之人治以重罪若果鄰近親戚全家被人殘害無人伸訴者方許一各處斷發充軍及安置人數不許進言其所管衛所官員毋得容許一若十惡之事有干朝政實跡可驗者許諸人宻切赴京面奏一前件事理仰一一講解遵守如有不遵並以違制論二十四年令各處儒學每遇朔望有司官至日早詣學謁廟行香師生出大門外迎接行禮畢請至明倫堂師生作揖教官侍坐生員東西序立講書提調官考課畢退師生復送至大門外回學其别廟行香師生不必隨行如遇春秋祭祀迎接詔旨師生仍依定例二十五年定禮射書數之法一朝廷頒行經史律誥禮儀等書生員務要熟讀精通以備科貢考試一遇朔望習射於射圃樹鵠置射位初三十步加至九十步每耦二人各挾四矢以次相繼長官主射射畢中的飲三爵中采二爵一習書依名人法帖日五百字以上一數務在精通九章之法永樂三年申明師生每日侵晨升堂行恭揖禮畢方退晩亦如之生員㑹食肄業毋得出外遊蕩正統六年令提調官置簿列生員姓名又立為籖公暇揭取稽其所業提學官所至察提調勤怠以書其稱否其生員有奸詐頑僻藐視師長齟齬教法者悉斥退為民成化三年令提學官躬厯各學督率教官化導諸生仍置簿考驗其德行優文藝贍治事長者列上等簿或有德行而劣於經義或有經義而短於治事者列二等簿經義雖優治事雖長而德行或缺者列三等簿歲課月考循序而升非上等不許科貢又令生員今後雖遇邊事緊急艱難之處亦不許納粟納馬等項出身若以此例開端許該部科道官紏正廩饌事例洪武初令師生廩食月米六斗後復令日米一升魚肉鹽醯之類皆官給之十五年定廩饌月米一石正統元年令師生日逐㑹饌有司僉與膳夫府學四名州學三名縣學二名𢎞治三年奏准膳夫毎名歲出柴薪銀四兩以備㑹饌之用八年令膳夫每名歲出柴薪銀十兩若師生不行㑹饌有司失於供應聽提學官究治考選事例洪武二十七年令生員入學十年之上學無成效送部充吏其有成效及十年以下照依入學年月編次造冊解部以備取用其科舉歲貢亦照編次起送又令廩膳十年之上學無成效増廣年二十之上不通義理者皆充吏其託故偽訟革罷不應選者照卷追徵食過廩膳還官米數實收開繳户部知數本生送吏部充吏二十九年定罷閒等項生員應否追粮充吏例凡食粮年深以偽訟愚鈍等事革退者假父殘疾告回侍親者因富户技藝户倉脚夫起取户丁因而在京潜住者侍親親終及病痊制終不行入學者因愚鈍患病侍親等事經斷罷閒後以人材等項舉保為官者皆充吏不追粮凡在學讀書及在家丁憂病故者因父伯叔任軍官别無親男坐名起取襲職者告單丁重役及父母年老侍親者因父為事代父起解問發充軍者父兄叔姪當軍户内無丁告退者為手足殘疾耳目盲聾告退者為事充軍工役及以愚鈍犯法等故黜罷後為事充軍工役者為本支親屬極刑黜退者户内軍故勘合坐名勾補者皆免充吏不追粮永樂二年令増廣生員入學十年若年二十之上魯鈍不能行文者充吏七年令每歲御史按察司公同提調官將生員食粮十年之上學無成效者充吏宣德三年奏准巡按御史㑹布按二司并提調教官考試生員廩膳十年之上學無成效者發附近布政司直隸發附近府州充吏六年以下鄙猥無學者追還廩米為民増廣必選聰俊能文者留充其魯鈍鄙陋不通文理并額外者悉黜為民正統元年令廩膳六年以上不諳文理者充吏増廣六年以上不諳文理者為民四年令生員以疾病罷黜者免追廩米生員有犯詿誤聽贖罪還學若犯奸盜詐偽挾制官府毆罵師長教唆詞訟說事過錢包占人財物田土等項廩膳追粮解京増廣附近軍民衙門俱贖罪充吏其犯受􅂍姦盜不分廩増照例運磚運炭納米擺站等項滿日發回原籍為民充警七年奏准提學官三年一次㑹同各府州縣正官考選生員其年老殘疾及人物鄙猥者悉黜為民十年奏准提學官㑹布政司堂上官一員兩直隸㑹巡按御史公同提調教官考選生員年四十以上不諳文理者廩膳十年以上送吏部六年以上送附近布政司増廣十年送本布政司兩直隸送本府俱充吏六年以上并鄙猥殘疾者悉黜為民雲南貴州免考十四年令生員有犯該發充吏者廩膳免追廩米若犯受􅂍奸盜冒籍宿娼居喪娶妻妾事理重者兩直隸發充國子監膳夫各布政司充隣近儒學膳夫齋夫滿日原籍為民廩膳仍追廩米景泰三年令各處㑹官考選照正統間例其軍生入學年深者一體考選不中者追廩原籍當差天順五年令各處㑹官考選仍照正統間例其廩膳未及六年考不中者追廩為民六年𠡠生員考試不諳文理者廩膳十年以上發附近六年以上發本處増廣十年以上發本處俱充吏六年以上為民未及六年者量加决罰又令生員爭貢及越訴者俱充吏成化五年令北直隸生員考退者不分年歲久近俱免充吏悉發為民還追食過廩米九年奏准北直隸考退生員免追廩米止照各處提學官見奉勑諭一例充吏風憲官提督事例正統元年奏准各處添設按察司副使僉事一員南北直隸監察御史各一員請勑專一提調學校十年令提學官遍詣所屬學校嚴加考試提督生徒學業務見實效有不職者禮部都察院堂上官詢察具奏罷黜景泰元年革罷提學風憲官聽巡按御史各司府州縣官提督考察後復令按察司分巡各道副使僉事照依提學官先奉勅書事理提督兩直隸御史提督天順六年復設各處提督學校官仍賜勑諭一學者讀書貴乎知而能行先將聖賢經書熟讀背誦牢記不忘却從師友講解明白俾將聖賢言語體而行之敦尚孝弟忠信禮義㢘恥之行不許徒務口耳之學將來朝廷庶得真才任用一為學工夫必收其放心主敬窮理毋得鹵莽間斷其於修已治人之方義利公私之辨須要體認精切庶幾趨向不差他日出仕方能顧惜名節事業可觀一習學舉業亦窮理之事果能精通四書本經便㑹行文有等生徒不肯實下功夫惟記誦舊文意圖僥倖出身今宜痛革此弊其所作四書經義䇿論等文務要典實平順説理詳明不許浮誇恠誕至於習字亦須端楷庶不乖教養之意一學校無成皆由師道不立今之教官賢否不齊先須察其德行考其文學果所行所學皆善須禮待之若一次考驗學問踈淺及怠於訓誨者姑戒勵之令其進學改過若再考無進不改送吏部别用其貪淫不肖實跡彰聞者不必考其文學即送按察司直隸送巡按御史問理吏部别選有學行者徃補其缺一師生每日坐齋讀書及日逐㑹饌有司僉與膳夫齋夫府學膳夫四名齋夫八名州學膳夫三名齋夫六名縣學膳夫二名齋夫四名不許違悞缺役一生員考試不諳文理者廩膳十年以上發附近去處充吏六年以上發本處充吏増廣十年以上發本處充吏六年以上罷黜為民未及六年者量加决罰勉勵進學一生員之家並依洪武年間例除本身外户内優免二丁差役有司務要遵行不許故違一凡巡視學校水路乗驛舟陸路乘官馬仍於本司帶書吏一名隨行陸路與官驢俱支廩給一府州縣提調官員宜嚴束生徒不許出外遊蕩為非凡學内殿堂齋房等屋損壞即辦料量工修理若恃有提督憲職將學校中一切合行之事推故不行用心整理者量加决罰懲戒一所過之處遇有軍民利病及不才官吏貪酷害人事干奏請者從實奏聞一本職專督學校不理刑名如有軍民人等訴告寃枉等事許受詞狀輕則發下所在有司問理重則送按察司直隸送巡按御史提問一科舉本古者鄉舉里選之法今南北所取舉人名數已有定制近年奔競之徒利他處學者寡少徃徃赴彼投充増廣生員詐冒鄉貫隠蔽過惡一槩應試所在教官僥倖以為己功其弊滋甚今後不許違者聽本職及提調科舉官監試官拿問一布政司按察司官及巡按御史不許侵越提督者職事若以公務至府州縣亦當勉勵師生勤力學業不許推故不理若提督官行止不端許巡按監察御史指實奏聞一所轄境内遇有衛所學校一體提調整理武職子弟悉令其習讀五經七書百將傳及操習武藝其中有能習舉業者亦聽科舉一各處歲貢生員照例將食粮年深者嚴加考試不必㑹官如果年深者不堪充貢就便照例黜罷却將以次者考充務要通曉文理方許起送赴部一廩膳増廣生員已有定額廩膳有缺於増廣内考選學問優等者幇補増廣有缺於本處官員軍民之家選擇資質聰敏人物俊秀子弟補充不許聽信有司及學官徇私作弊若有額外之數須嚴加考選通曉文藝者存留待缺不許將不堪者一概存留躱避差徭一古者鄉閭里巷莫不有學即今社學是也凡提督去處即令有司每鄉每里俱設社學擇立師範明設教條以教人之子弟年一考較擇取勤效仍免為師之人差徭一師生於學校一切事務並要遵依洪武年間卧碑行不許故違成化六年令貴州按察司分巡官兼理本處學校社學事例洪武八年詔有司立社學延師儒以教民間子弟十六年詔民間立社學有司不得干預其經斷有過之人不許為師二十年令民間子弟讀御製大誥後令為師者率其徒能誦大誥者赴京禮部較其所誦多寡次第給賞復命兼讀律令正統元年令各處社學提學官及司府州縣官嚴督勤課不許廢弛其有俊秀向學者許補儒學生員成化元年令民間子弟願入社學者聽其貧乏不願者勿强明㑹典卷七十六
