body:
  text: 明會典卷一百五十五工部九虞衡清吏司郎中員外郎主事掌天下虞衡山澤之事而辨其時禁採捕虞衡掌採捕之事野味以供賓祭皮張翎毛以供軍器軍裝皆不可缺者至於禁令亦本司所掌今并載之野味諸司職掌凡每嵗祭祀及供御并嵗時筵宴合用野味預先行移各司府州著落所屬於山林去處多辦走獸湖泊去處多辦飛禽照依坐定嵗辦數目令各處獵户除春夏孕字之時不採外當於秋間採捕其各項活野味依例用寛大籠櫃差人沿途如法喂養茁壯到部出給長單一樣二本并闗給勘合進赴内府光禄寺交收將長單一本批迴入卷一本就留本司備照如有倒死不堪之數驗其解物人在路果無延緩稽遲日期者止是著令賠償起解如是故行遲緩者問罪計各處嵗辦一萬四千二百五十隻湖廣三千隻本司分派附近府州二千五百隻坐去窵逺府州五百隻辰州府八十隻永州府一百隻衡州府七十隻寶慶府六十隻襄陽府一百二十隻郴州三十隻靖州二十隻安陸州二十隻江西一千隻本司分派附近府分八百隻坐去窵逺府分二百隻南安府一十五隻袁州府六十隻贛州府六十隻吉安府六十五隻直隸七千五百隻河南一千二百隻浙江八百隻山東七百五十隻見今嵗辦野味一萬四千五百一十四隻浙江八百隻江西一千隻湖廣三千隻河南一千二百隻山東七百五十隻應天府三百隻直隸蘇州府四百隻鎮江府三百隻廬州府八百隻寧國府二百隻揚州府一千五十三隻淮安府二千六十一隻池州府二百隻常州府三百隻安慶府五百隻松江府三百隻太平府三百八隻徽州府二百一隻和州一百隻廣德州二百九隻徐州五百隻滁州一十二隻嵗進供應野味活鹿二百六十七隻活天鵝三百二十隻河南二百二十七隻河南府生鹿五十七隻汝寧府生鹿七隻南陽府生鹿七十隻懷慶府生鹿一十一隻衛輝府生鹿二十六隻彰德府生鹿五十六隻開封府天鵝六十五隻直隸廬州府天鵝七十四隻生鹿一十隻淮安府天鵝六十八隻生鹿二隻揚州府天鵝六十六隻生鹿二隻鳳陽府天鵝三十一隻生鹿一十六隻山東天鵝一十六隻生鹿一十隻事例宣德十年奏准江南直隸及布政司所進野味俱送南京光禄寺江北直隸及布政司所進野味俱送北京光禄寺正統元年奏准各處所進獐麂鷀䳓等野味依彼中時值易價鈔就彼官庫收貯年終開報成化二十二年奏准大祀該用大樣角鹿二十五隻先期㑹計行廬鳳二府河南布政司嵗辦鹿隻内每三隻准買一隻常數外増三隻備用餘仍嵗辦起解南京工部奏准江南司府州縣嵗辦活鹿每一隻收銀一兩七錢天鵝一隻收銀五錢解南京光禄寺收買供進𢎞治元年南京光禄寺奏准令原産有司府州縣照舊採捕解納皮張諸司職掌凡各處每嵗差人起解雜色皮張及各該軍衛屯田去處倒死頭匹皮貨到部照例開給長單勘合付解人進納若熟皮劄付丁字庫交收生皮劄付皮作局熟造類進設或成造軍器等項皮張不敷須要預為收買其收貯在庫之數務要時常整㸃不致腐壞計各處嵗辦雜皮二十一萬二千張江西二萬張浙江二萬張河南一萬五千張福建一萬張山東一萬五千張四川一萬張廣西一萬張廣東一萬張湖廣二萬張陜西二萬張北平二萬張山西二萬張直隸二萬二千張見今嵗辦雜皮三十四萬七百六十一張浙江三萬三千張江西三萬三千張福建二萬張湖廣三萬三千張山東二萬五千張山西三萬二千張廣東一萬五千張廣西一萬五千張四川一萬五千張河南二萬五千張陜西三萬張順天府五千七百八十張直隸蘇州府四千張鎮江府四千張廬州府二千張寧國府四千張揚州府五千張淮安府四千張池州府一千張常州府二千張安慶府一千張松江府二千張太平府四千張徽州府三千張和州一千張廣德州三千張徐州三千張真定府三千七百一十三張保定府三千七百五十張河間府二千一百三十六張永平府一千三百九十張順德府七百張廣平府二千二百一十四張大名府三千七十八張翎毛諸司職掌凡造箭合用翎毛或各處嵗辦或官為收買如遇差人起解到部劄付丁字庫交收仍出給長單勘合付解人進納計各處嵗辦一千三百五十五萬六千根江西三百萬根浙江三百萬根河南六十萬根福建五十萬根山東六十萬根四川一十萬根廣西一十萬根廣東一十萬根湖廣二百萬根陜西五十萬根北平五十萬根山西五十萬四千根直隸二百五萬二千根見今各處嵗辦翎毛二千二百七十二萬六千五百五十根浙江三百九十三萬一千一百四十四根江西三百九十七萬七千六十六根福建七十四萬三千九百四十二根湖廣五百七十七萬九千七十七根山東六十萬根山西五萬四千根廣東六十九萬九千一百三十九根廣西二十一萬四千七百二十六根四川二十四萬四千四十八根河南六十萬根陜西五十萬根順天府六萬八千一百七十八根應天府一十六萬五千二百七根直隸蘇州府九十五萬五千一百三十五根鎮江府二十三萬一千一百六十四根廬州府二十二萬四千五百六根寧國府一十二萬八千四百一根揚州府三十萬一千二百六根淮安府五十三萬六千八百四十五根池州府二十三萬七千二百八十八根常州府一十八萬二千九百三十三根安慶府一百八萬九千七百七十八根松江府三十四萬五千九百六根太平府七萬根徽州府五萬根和州二十一萬三千八百一十五根廣德州一萬根徐州五萬根滁州六千根河間府六萬七千根事例洪武二十三年詔浙江等處河泊所翎毛不係上産免徵正統十四年奏准浙江等布政司并直隸府州縣今後解納嵗辦帶毛硝熟麂皮每三分為率一分作退毛硝熟鴨翎俱折鵝翎禁令諸司職掌凡歴代帝王忠臣烈士先聖先賢名山嶽鎮神祇凡有德澤於民者皆建廟立祠因時致祭各有禁約設官掌管時常㸃視不許軍民於内作踐䙝瀆其有荒蕪山場蘆蕩去處如遇官府營造取用竹木蘆柴等項須要臨時定奪禁約設若官無所用聴民採取事例洪武二年令天下神祇不在祀典而嘗有功德於民事蹟昭著者其祠宇禁人毁撤九年遣官祭歴代帝王陵寢禁樵採設陵户宣德十年詔各處山場園林湖池坑冶及花果樹木等項原係民業曽經官府採取見有人看守及禁約者悉聴採取明會典卷一百五十五
