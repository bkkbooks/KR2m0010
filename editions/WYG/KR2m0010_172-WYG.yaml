body:
  text: 明㑹典卷一百七十二鴻臚寺國初置侍儀司為從六品衙門職專朝儀宣贊等事洪武九年改為殿庭儀禮司設使副承奉鳴贊序班十三年承奉革添設司儀更使為司正副為左右司副三十年始改鴻臚寺陞正四品衙門定設卿少卿丞主簿司賔署丞司儀鳴贊序班後又設外夷通事亦隸焉事例凡行朝賀等禮本寺合用官員每日奉天門朝㕘掌禮堂上官一員鳴贊一員糾儀序班二員齊文武班序班各三員東西引人并舉案等項序班各七員傳贊序班一員午門外鳴贊二員糾儀序班二員朔望日奉天殿朝㕘掌禮堂上官一員鳴贊二員糾儀序班二員齊文武班序班三員傳贊序班四員奉天門外鳴贊二員糾儀序班二員萬壽聖節掌禮堂上官一員宣表目官一員宣表官一員祝贊官一員已上俱堂上官内贊鳴贊一員對贊鳴贊二員接贊鳴贊三員東西傳贊鳴贊各四員陳設表案序班四員玉帛案序班四員陳設方物序班二員導案序班二員殿前序班四員引進表官序班四員齊文武班并引監生人等序班共四員門外催人序班共四員東西角門序班各一員引進表官并外夷人員通事序班十二員正旦冬至同但添傳制官一員東宫千秋節掌禮堂上官一員宣箋目官一員宣箋官一員祝贊官一員典儀官一員已上俱堂上官内贊鳴贊一員通贊鳴贊二員接贊鳴贊二員東西傳贊序班各五員陳設箋案序班四員玉帛案序班四員陳設方物序班二員導案序班二員殿前序班二員引進箋官序班四員齊文武班并引外夷人員通事序班十員正旦冬至同但添傳令官一員進厯掌禮堂上官一員内贊鳴贊一員通贊鳴贊二員贊進厯鳴贊一員東西傳贊序班各二員引進厯上殿官序班二員設厯案并舉案序班四員東西引進厯官序班各二員文武班散厯序班各二員引文武官序班各二員引外夷通事序班八員進春同冊封遣官傳制掌禮堂上官一員内贊鳴贊一員通贊鳴贊一員對贊鳴贊二員設冊節案并舉案序班十員引遣官序班二員齊文武班序班各三員傳贊序班二員奉天門外鳴贊二員進士傳臚掌禮堂上官一員傳臚官三員俱堂上官内贊鳴贊二員通贊鳴贊二員對贊鳴贊二員贊進士行禮鳴贊一員東西引進士序班一員舉黄榜案并接送序班四員導案署丞主簿三員齊文武班序班各三員東西傳贊等項序班各三員進士上表同但無傳臚官經筵掌禮堂上官一員内贊鳴贊二員舉御案序班二員舉講官案序班二員侍班序班二員慶成宴掌禮堂上官一員其餘堂上官俱侍班内贊鳴贊二員接贊鳴贊五員侍班序班二員殿上東西宴席一班至七班執事序班共十八員東西角門序班共四員丹墀糾儀等項序班共十員殿内外丹陛丹墀各東西傳贊序班共八員禮部中府救䕶通贊鳴贊二員對贊鳴贊二員陳設序班四員執鼓侍班序班四員齊官員人等班次等項序班共二十六員凡大朝賀本寺堂上官先入候上御華葢殿奏執事官行禮畢奏請陞殿候上出御奉天殿外贊贊排班班齊四拜内贊贊進表贊宣表目堂上官一員宣表目訖内贊贊宣表外贊贊跪堂上官一員宣表訖外贊贊俯伏堂上官一員于露䑓祝贊訖外贊贊俯伏四拜堂上官一員奏傳制由殿東門出至丹陛稱有制外贊贊跪傳制畢外贊贊俯伏贊三舞蹈山呼四拜卿奏禮畢外贊贊禮畢萬壽聖節行禮同惟不傳制凡每日常朝文武百官入至奉天門丹墀分班序立上御座鳴鞭訖本寺卿贊入班鳴贊贊拜叩頭畢百官仍分班序立本寺堂上官於御前宣奏午門外謝恩見辭人員數畢門外鳴贊贊班齊五拜三叩頭禮畢卿贊奏事各衙門官以次奏事畢其王府及鎮巡等官差來并外夷朝貢等項人員該賜酒飯者堂上官引至御前宣奏承㫖若文武官員人等該御前行禮有賜酒飯者堂上官承㫖畢卿仍贊奏事奏奏事畢初鳴鞭後如有太常寺奏忌辰及大臣遣祭復命畢方贊入班有王府進表及出差人繳節守衛官進事件幆帖尚寳司等衙門請寳等項畢方贊奏事凡大朝賀朔望日朝㕘傳制及太常寺奏祭祀本寺官俱先一日於御前奏請陞殿凡大朝賀文武百官及外夷人員先二日赴朝天宫等處習儀本寺官於御前奏知凡謝恩見辭官員人等先於本寺報名該面見辭及領𠡠繳𠡠或賜酒飯者預先具白本題知次日早俱於午門外行禮俟常朝官叩頭畢本寺官具名數帖宣念行禮畢其該面謝見辭者仍引赴御前鳴贊贊叩頭或賜𠡠與酒飯者俱贊叩頭凡在外來朝官員人等皆於本寺預先演禮然後引入行禮其公差及給由官吏先將文冊投下明日引入凡王府并鎮守守備備倭等官外夷宣慰宣撫招討等司進貢賫本人員天下諸司朝覲給由官員并奏繳軍職文憑稽考公文完銷勘合及總兵等官㑹奏聲息等項本冊俱赴本寺引奏凡常朝官員及午門外謝恩見辭等項官員人等或有失儀該侍班序班隨即拏人劾奏其在京堂上官具本劾奏凡在外總兵等官奏報捷音本寺官引差來人於御前宣奏凡復命朝見人員繳𠡠進題本及四夷朝貢人員進畨字文書俱本寺官接至西陛授内官捧進凡正旦冬至節令百官有例放假本寺官面奏承㫖訖賛百官入班行叩頭禮其元宵節賜假賛五拜三叩頭禮凡節令賜百官宴本寺官承旨訖賛百官入班行叩頭禮宴畢仍賛叩頭凡經筵大寒暑停講本寺承旨至開講時具本請旨凡給賜文武官誥𠡠本寺官舉案引至御前候該部官奏過賛叩頭畢仍舉案引出給散凡公侯伯受封襲封上表謝恩本寺官舉案引至御前俟禮部官奏過賛五拜三叩頭禮畢捧表至東陛授内官捧進凡外夷進貢方物本寺官引至御前俟禮部官奏過賛叩頭畢舉案至東陛授内官捧進凡賞賜外夷人員衣服綵段等件本寺官舉案引至御前俟禮部官奏過賛叩頭畢仍舉案引出給散凡本寺俸粮舊於禮部帶支後奏准本寺自行收放南京鴻臚寺事例凡遇萬夀聖節正旦冬至行慶賀禮俱先於南京朝天宫習儀至期行禮本寺堂上官祝賛鳴賛賛禮序班執事其禮與在外同凡東宫千秋節行慶賀禮本寺堂上官祝賛鳴賛賛禮序班執事其禮亦與在外同凡南京各衙門遇萬壽聖節正旦冬至進表及東宫千秋節進箋於南京禮部行禮俱本寺掌行凡南京各衙門赴南京禮部中府行救䕶禮俱本寺官賛禮凡本寺官吏俸粮與鴻臚寺同明㑹典卷一百七十二
