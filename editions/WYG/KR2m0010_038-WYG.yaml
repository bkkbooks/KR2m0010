front:
  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0010_WYG_038-1a, image: WYG0617/WYG0617-0426a.png}
body:
  text: 明會典卷三十八户部二十三自洪武永樂以來凡光禄寺犧牲所御馬監并象馬牛羊房等草俱於民間照田糧科徴官為置塲収納官軍馬草給以牧地係兵部掌行其採打秋青草與民納草相兼支用已見民科草料今特以𢎞治十五年各司府州實徴馬草數及兩京草塲事例附録于後諸司職掌凡在京徴収芻草俱於田畝内照例科徴當徴収之時本部先行定擬具奏行移該徴有司限定月日先取部運官吏姓名開報候起運至日照數填定撥各該衛所并典牧千户所等衙門交納以備支用其在外衙門亦各照依已定則例徴収施行浙江布政使司馬草八十七萬四千三百九十一包八斤二兩三錢陜西布政使司馬草一百五十一萬四千七百一十二束一十一斤五兩二錢四分三釐三毫三絲山東布政使司馬草三百八十一萬九千五百一十三束一十四斤一十四兩九錢一分二釐河南布政使司馬草二百二十八萬八千三百九十六束九斤九兩一錢一分四釐九毫二絲二忽山西布政使司馬草三百五十四萬四千四百四十八束九分五釐五毫順天府馬草二百萬七千九百二十三束七分八毫八絲八忽二微九纖直𨽻真定府馬草一百三十七萬四千一百五十三束三分九釐七毫四絲直𨽻保定府馬草一百一十一萬七千五百六束直𨽻大名府馬草一百八十六萬九千八百三十八束四分三釐二毫二絲直𨽻河間府馬草六十七萬四千五百五十三束八分五釐二毫二絲六忽八微七纖直𨽻順徳府馬草五十四萬五千四百八十一束二分九釐二毫七絲六忽六微直𨽻廣平府馬草七十九萬四千八十九束一分四釐七毫八絲直𨽻永平府馬草三十萬三千七百四十二束七分五釐一毫直𨽻隆慶州馬草七萬三千四百四十一束五分六釐五毫直𨽻保安州馬草一萬七千七百五十四束七分五釐應天府馬草三十七萬六千四百五十八包一斤九兩四錢二分六釐四毫直𨽻蘇州府馬草五十三萬七千八百九包八斤四兩一錢八分二釐直𨽻松江府馬草三十一萬六千二百二十五包四斤九錢四釐直𨽻常州府馬草七十一萬四千三百四十三包五斤九兩六錢二分直𨽻淮安府馬草四十五萬四千七百二十包二斤六兩九錢二分七釐八毫八絲直𨽻鎮江府馬草一十二萬七百八十四包四斤一十兩二錢直𨽻寧國府馬草七十九萬八千四百九十二包六斤直𨽻鳳陽府馬草二十三萬四千二百九十三包四斤二兩八錢九分六釐二毫直𨽻安慶府馬草一十九萬一千九百四十九包三斤一十二兩直𨽻太平府馬草三十五萬四千九百七十四包五斤一十二兩四錢八分直𨽻揚州府馬草三十四萬九千二百三十六包六斤七兩二錢二釐直𨽻廬州府馬草九萬七千七百七十五包一十二兩三錢八毫四絲直𨽻池州府馬草九萬六千三百一十一包四斤八兩四錢四分直𨽻徐州馬草一十萬包直𨽻廣徳州馬草三十萬二千九百五十二包三斤一十兩五錢一分二釐直𨽻滁州馬草五萬五千九百八包五兩六分二釐直𨽻和州馬草二萬六千九十包五斤七兩五錢四分四釐京城草塲五處明智坊草塲安仁坊草塲北新草塲西城坊草塲臺基厰草塲二十四馬房倉并象房牛羊房倉御馬倉中府外塲天師庵草塲埧上馬房倉埧上南馬房倉埧上東馬房倉埧上北倉埧上北馬房倉北髙倉義河倉金盞兒甸倉湖渠馬房倉北草塲黃土倉南石渠西倉南石渠倉􅗭石橋倉􅗭南橋南倉湯山草塲鄭家莊馬房倉峪口楊家橋馬房倉峪口官莊馬房倉峪口張家莊馬房倉東安門倉司牲司司牧局錦衣衞馴象所内象房倉錦衣衞馴象所外象房倉東直門裏牛房倉東直門外牛房倉吳家駝牛房倉宣府在城草塲雞鳴山草塲懷安等處草塲赤城等處草塲永寧等處草塲萬全左等衞草塲南京草塲四處中軍都督府中和橋馬草塲金川門馬草塲錦衣衞通濟門馬草塲錦衣衞通濟門象草塲事例宣徳二年令御馬監象馬牛羊草太常光禄寺犧牲草俱分派兩直𨽻及山東河南山西陜西諸府州地畝草内徴納八年南京錦衣等衞所草塲令各衞所每處撥軍餘五名辦事官吏各一員名專一守門闗防出入都督府及本部各委官一員提督御史主事各一員巡視九年令監察御史并本部主事於象馬牛羊等房倉塲監督収受草料仍令内官一員通政使司通政一員往來提督十年令在京花園并象房草塲各設辦事官二員千百户二員率領軍餘人等看守正統元年令都察院榜示壩上大馬房草場内外官員人等不許私役官軍占種交通擅借及縱容官豪建立窑座創蓋寺廟等項每嵗秋後遣給事中御史等官巡視其有仍前不悛者處以極刑十四年明智坊草塲北新草塲并舊臺基厰草塲每塲銓撥大使副使各一員攢典二名辦事官二員順天府每處撥脚夫十名兵部撥致仕官一員軍餘四名守支草束巡視把門景泰三年令御史一員巡視草塲禁約附近軍民之家并管馬内外家人不許兠攬納户草料通同作弊成化十六年令本部収草主事等官提督御馬倉草塲各該官旗人等築立封堆開挑壕塹栽種榆栁為界仍令給事中御史等官不時巡察𢎞治十三年奏准京通并馬房倉塲等處収受草束及兠攬之徒恃强將不堪水濕小草充數嘱託監収官員収送者拏送問罪枷在本處倉塲門首三箇月發落諸司職掌凡内外衞所軍糧不敷於有糧倉分照數盤撥如是在倉糧儲正數支銷盡絶積出附餘或蓄積預備腐爛虧折必須委官盤典見數仍將盤過數目分豁某字厫若干開報若干上司以慿稽考追究事例永樂二十年令兩京各衞所直𨽻應天蘇松順天等府州衞所及山東河南山西陜西浙江江西湖廣福建廣東廣西雲南貴州四川各布政司所屬及都司衞所并遼東都司所屬倉糧俱差官盤㸃洪熙元年令差官於貴州等布政司都司及直𨽻府州衞所取勘倉糧分豁舊管新収實在同下年該収該用之數造册開報正統七年山西大同府并萬全都司萬全左等衞遼東都司三萬等衞直𨽻山海衞及永平府并順天府遵化縣雲南等處廣西慶逺府廣東瓊州府陜西寧夏甘肅永昌鎮番鎮夷倉并延安綏徳等倉糧令各巡撫管糧官照例盤量其雲南金齒等處及廣西慶逺府廣東瓊州府令本處按察司各委堂上官盤量成化初奏准差官查盤各邊糧料等項十三年差給事中御史查盤各邊錢糧宣府延綏四川每一處各二貟其大同甘肅寧夏薊州各與偏頭鴈門等闗永平山海固原洮岷等處相鄰并廣西廣東貴州湖廣每二處共二員如見在御史數少就差彼處巡按御史公同查盤十九年令遼東宣府大同山西延綏寧夏甘肅等處年例運送官銀并鹽糧税糧馬草椽席折収等項銀兩每年支剩并新収一應見在銀兩與京通二倉註銷清册一時查造遼東宣府大同山西每季註銷甘肅寧夏延綏陜西年終註銷𢎞治三年奏准凡盤查倉糧正糧勾數積有附餘照數作正支銷若耗糧不足計其守支久近准除折耗守支三年以上者每石追耗糧一升三年以下者升半全無耗糧者查究問罪八年奏准盤折草束務提商人納户追出攬頭姓名令均賠還官攬頭照例全家發邊逺充軍又令各塲収草官攢有守支八九年例該起送及周嵗考滿官其収受草束着令部官無部官處着落分巡分守官查盤見數若有塌爛虧折者官攢仍令守支不許朦朧起送後有虧折連坐以罪又令大同宣府及陜西遼東各邊収草大垜五萬束小垜三萬束每三年一次差給事中御史查盤其查盤之時於内量折一垜見數就以虛報之數問擬侵欺罪名其餘草垜據此折算十一年奏准凡科道官查盤邊方馬草但有塌陷狼藉無人管顧者即將該管守備掌印等官參奏挐問革去管軍管事又奏准各邊盤糧除正耗勾數外耗糧不必作正責令經手人員看守候一年以上放盡者每石開折耗糧一升如有耗糧不及年久者照例問罪追賠其查盤草束正數已勾亦候放支盡絶方以守支逺近扣算耗草多寡十四年奏准各邊查盤糧料照例每石一年開折一升各以守支年分扣算逓減其餘已經查盤正糧放支盡絶者積有耗糧附餘就令經手人員即便作正放支如有虧欠一併究治若正耗之外又有積出附餘一體作正支銷明會典卷三十八
