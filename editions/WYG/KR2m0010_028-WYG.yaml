body:
  text: 明會典卷二十八户部十三經費國初廩禄自諸王及公侯文武官以下皆為定制其後又有折色之例隨時損益今具録之王府禄米明祖訓凡親王每歲合得糧儲皆在十月中一次盡數支撥其本府文武官吏俸禄及軍士糧儲皆係按月支給每月不過初五其甲仗接闕撥付所在有司照依原定數目不湏每次奏聞敢有破調稽遲者斬凡親王錢糧就於王所封國内府分照依所定則例期限放支毋得移文當該衙門亦不得頻奏若朝廷别有賞賜不在已定則例之限凡親王郡王王子王孫及公主郡主等每歲支撥親王唐制歲該榖四千八百石絹四千八百匹綿四百五十斤宋制領節度使歲該榖二千四百石錢四千八百貫絹二百疋綾一百疋羅十疋綿五百兩今定米一萬石郡王唐制歲該米七百石田六十頃宋制領觀察使歲該粟一千二百石錢二千四百貫絹二十疋綿五十兩今定米二千石鎮國將軍唐制歲該米六百石田五十頃宋制郡王子以下量材授官照其官品髙下給禄今定米一千石輔國將軍唐制歲該米五百石田四十頃今定米八百石奉國將軍唐制歲該米四百石田二十五頃今定米六百石鎮國中尉唐制嵗該米三百石田十四頃今定四百石輔國中尉唐制歲該米二百石田八頃今定米三百石奉國中尉唐制歲該米一百石今定二百石公主及駙馬食禄米二千石郡主及儀賔食禄米八百石縣主及儀賔食禄米六百石郡君及儀賔食禄米四百石縣君及儀賔食禄米三百石鄉君及儀賔食禄米二百石凡皇太子次嫡子幷庻子既封郡王之後必俟出閤每歲撥賜與親王子已封郡王者同女俟及嫁每嵗撥賜與親王女已嫁者同凡郡王嫡長子襲封郡王者其嵗賜比初封郡王减半支給各府禄米秦府秦王歲支禄米一萬石米鈔中半兼支郡王初封歲支禄米二千石本色五百石折色一千五百石襲封一千石米鈔中半兼支鎮國將軍嵗支禄米一千石輔國將軍嵗支禄米八百石奉國將軍嵗支禄米六百石鎮國中尉嵗支禄米四百石俱米鈔中半兼支晉府晉王嵗支本色禄米一萬石郡王初封嵗支禄米二千石襲封一千石米鈔中半兼支鎮國將軍嵗支禄米一千石輔國將軍歲支禄米八百石奉國將軍嵗支禄米六百石鎮國中尉嵗支禄米四百石俱米鈔中米兼支周府周王嵗支本色禄米二萬石襲封嵗支本色禄一萬二千石郡王初封嵗支禄米二千石襲封一千石俱米鈔中半兼支鎮國將軍嵗支禄米一千石輔國將軍嵗支禄米八百石奉國將軍嵗支禄米六百石鎮國中尉嵗支禄米四百石俱米鈔中半兼支楚府楚王嵗支本色禄米一萬石郡王初封嵗支禄米二千石襲封一千石俱米鈔中半兼支鎮國將軍嵗支禄米一千石輔國將軍嵗支禄米八百石奉國將軍嵗支禄米六百石鎮國將軍嵗支禄米四百石輔國中尉嵗支禄米三百石俱米鈔中米兼支魯府魯王嵗支禄米一萬石米鈔中半兼支郡王初封嵗支禄米二千石襲封一千石俱鈔米中半兼支鎮國將軍嵗支禄米一千石輔國將軍嵗支禄米八百石奉國將軍嵗支禄米六百石俱米鈔中半兼支蜀府蜀王嵗支本色禄米一萬石郡王初封嵗支米二千石襲封一千石俱米鈔中半兼支鎮國將軍嵗支禄米一千石輔國將軍嵗支禄米八百石奉國將軍嵗支禄米六百石俱米鈔中半兼支代府代王嵗支禄米六千石米鈔俱中半兼支郡王初封嵗支禄米二千石襲封一千石俱米鈔中半兼支鎮國將軍嵗支禄米一千石輔國將軍嵗支禄米八百石奉國將軍嵗支禄米六百石俱米鈔中半兼支肅府肅王嵗支禄米一千石本色七百石折色三百石郡王初封嵗支禄米一千石米鈔中半兼支襲封同遼府遼王嵗支本色禄米二千石郡王初封嵗支禄米二千石襲封一千石俱米鈔中半兼支鎮國將軍嵗支禄米一千石輔國將軍嵗支禄米八百石奉國將軍嵗支禄米六百石鎮國中尉嵗支禄米四百石輔國中尉嵗支禄米三百石奉國中尉嵗支禄米二百石俱米鈔中半兼支慶府慶王嵗支禄米一萬石本色七千五百石折色二千五百石正德五年革禄米三之一郡王初封嵗支禄米一千石米鈔中半兼支襲封同鎮國將軍嵗支禄米一千石輔國將軍嵗支禄米八百石奉國將軍嵗支禄米六百石俱米鈔中半兼支寧府寧王嵗支禄米一萬石米鈔中半兼支郡王初封嵗支禄米一千石米鈔中半兼支襲封同鎮國將軍嵗支禄一千石輔國將軍嵗支禄米八百石奉國將軍嵗支禄米六百石俱米鈔中半兼支岷府岷王嵗支本色禄米一千五百石郡王初封嵗支禄米五百石米鈔中半兼支襲封同鎮國將軍嵗支禄米一千石輔國將軍嵗支禄米八百石俱米鈔中半兼支韓府韓王嵗支禄米三千石本色二千石折色一千石郡王初封嵗支禄米一千石米鈔中半兼支襲封同鎮國將軍嵗支禄米一千石輔國將軍歲支禄米八百石奉國將軍嵗支禄米六百石鎮國將軍嵗支禄米四百石俱米鈔中半兼支瀋府瀋王嵗支禄米一萬石本色六千石折色四千石郡王初封嵗支禄米二千石襲封一千石俱米鈔中半兼支鎮國將軍嵗支禄米一千石輔國將軍嵗支禄米八百石奉國將軍嵗支禄米六百石俱米鈔中半兼支唐府唐王嵗支本色禄米五千石郡王初封嵗支禄米二千石襲封一千石俱米鈔中半兼支鎮國將軍嵗支禄米一千石輔國將軍嵗支禄米八百石奉國將軍嵗支禄米六百石俱米鈔中半兼支伊府伊王嵗支本色禄米二千石郡王初封嵗支禄米二千石襲封一千石俱米鈔中半兼支鎮國將軍嵗支禄米一千石米鈔中半兼支趙府趙王嵗支禄米一萬石米鈔中半兼支郡王初封嵗支禄米二千石襲封一千石米鈔中半兼支鎮國將軍嵗支禄米一千石輔國將軍嵗支禄米八百石鄭府鄭王嵗支本色禄米一萬石郡王初