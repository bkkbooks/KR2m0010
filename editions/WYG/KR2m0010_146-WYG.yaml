body:
  text: 明㑹典卷一百四十六刑部二十一南京刑部見今十三司帶管衙門浙江清吏司大名公主府光華郡主府魏國公英國公寧陽侯廣恩伯廣寧伯襄城伯安平伯新寧伯興安伯安順伯南京中軍都督府南京神䇿衛南京留守中衛南京廣洋衛南京和陽衛南京瀋陽右衛南京金吾前衛江西清吏司汝陽公主府南京前軍都督府南京都察院南京龍驤衛南京天䇿衛南京龍江左右二衛直𨽻廬州府直𨽻武清衛直𨽻宣州衛直𨽻廬州衛直𨽻九江衛直𨽻六安衛萬全都司龍門衛福建清吏司寧國公主府南康公主府南京户部南京太僕寺南京應天衛孝陵衛南京金吾後衛南京牧馬千户所直𨽻常州府直𨽻廣徳州直𨽻定邊衛直𨽻開平中屯衛萬全都司美峪千户所山東清吏司趙府周府瀋府韓府安府寧府魯府大成公主府咸寧大長公主府信國公陽武侯彭城伯南京兵部南京尚寳司南京㑹同館南京左軍都督府南京羽林右衛南京瀋陽左衛皇陵衛直𨽻鳳陽府直𨽻滁州直𨽻滁州衛直𨽻沂州衛直𨽻宿州衛直𨽻泗州衛直𨽻壽州衛直𨽻懐逺衛中都留守司鳳陽衛長淮衛留守中左二衛大寧都司保定後衛萬全都司龍門千户所四川清吏司臨安公主府南京工部南京僧録司南京道録司南京府軍衛南京廣武衛南京金吾左衛直𨽻大名府直𨽻松江府直𨽻金山衛萬全都司懐來衛懐安衛山西清吏司懐慶公主府南京翰林院南京欽天監南京南城兵馬司南京北城兵馬司南京旗手衛南京龍虎衛南京英武衛南京龍虎左衛南京金吾右衛南京驍騎右衛直𨽻鎮江府直𨽻鎮江衛直𨽻徐州直𨽻徐州衛直𨽻瀋陽中屯衛湖廣清吏司安慶公主府成國公保定侯隆平侯鎮遠侯永康侯豐城侯成山伯榮昌伯忻城伯南京右軍都督府南京虎賁右衛南京留守右衛南京水軍右衛南京江淮衛南京濟川衛直𨽻池州府直𨽻寧國府直𨽻宣州衛直𨽻定州衛大寧都司茂山衛萬全都司保安左右二衛廣東清吏司汝寧公主府應天府南京錦衣衛南京飛熊衛南京府軍左衛南京水軍左衛南京虎賁左衛南京留守左衛直𨽻隆慶州廣西清吏司永安公主府含山公主府南京通政使司南京中兵馬司南京羽林前後二衛南京鎮南衛直𨽻徽州府直𨽻安慶府直𨽻安慶衛直𨽻新安衛直𨽻通州衛直𨽻隆慶衛直𨽻通州左右二衛萬全都司隆慶左右二衛河南清吏司永平公主府南京禮部南京光禄寺南京太常寺南京鴻臚寺南京中書舍人南京國子監南京東城兵馬司南京武德衛南京羽林左衛南京留守後衛南京府軍右衛南京教坊司直𨽻揚州府直𨽻揚州衛直𨽻淮安府直𨽻淮安衛直𨽻儀真衛直𨽻髙郵衛直𨽻寧山衛陜西清吏司忠勇王定國公廣平侯安逺侯西寧侯武安侯泰寧侯清平伯遂安伯應城伯安鄉伯廣義伯忠勤伯南京後軍都督府南京大理寺南京行人司南京西城兵馬司南京豹韜衛南京横海衛南京興武衛南京府軍後衛南京鷹揚衛南京豹韜左衛南京江隂衛直𨽻太平府直𨽻建陽衛貴州清吏司永嘉公主府南京吏部直𨽻蘇州府直𨽻順德府直𨽻保定府直𨽻河間府直𨽻真定府直𨽻太倉衛直𨽻河間衛直𨽻天津衛直𨽻蘇州衛直𨽻開平衛直𨽻遵化衛直𨽻薊州衛直𨽻鎮朔衛直𨽻徳州衛直𨽻涿鹿衛直𨽻天津左右衛直𨽻興州中左右前後五衛直𨽻忠義中衛直𨽻梁城千户所萬全都司保定衛永寧衛宣府左右二衛廣昌千户所雲南清吏司常寧公主府黔國公順天府南京太醫院直𨽻廣平府直𨽻永平府直𨽻潼闗衛直𨽻鎮海衛直𨽻真定衛直𨽻永平衛直𨽻撫寧衛直𨽻東勝左右衛直𨽻盧龍衛直𨽻大同中屯衛大寧都司營州左右中前後五屯衛寛河千户所萬全都司萬全左右衛事例凡南京法司問擬該决重囚永樂間連人卷𩔖解北京該部審奏裁决宣德以後免解京止送南京大理寺審允本寺𩔖奏奉欽依回文到部其决不待時者本部即行覆奏秋後處决者監候秋分後覆奏各㑹官審决不三覆具奏凡審録重囚本部照天順二年事例毎嵗霜降後但有該决重囚㑹南京五府六部都察院通政司大理寺錦衣衛堂上官并六科於太平門外法司公舘審録其情真矜疑等項俱奏請裁决凡處决重囚不及十名者具本回奏十名以上照舊令本部及御史錦衣衛監决官赴京復命凡南京法司提問職官不論品級俱具奏請㫖凡南京法司問理刑名宣德二年令止理京城軍民詞訟在外者不許准理凡南京軍民詞訟𢎞治元年奏准但有附近常鎮等府縣滁州等州衛人証干連必須提對者量提緊闗人犯責對歸結其有革爵者之子孫徑自拘問凡本部問完强盗得財斬罪人犯𢎞治二年奏准照在京事例霜降以後一體㑹官審録仍在𩔖奏待報處决若有矜疑奏請定奪凡南京内官内使有犯𢎞治三年奏准情輕者暫發南京錦衣衛知在凡守衛軍士見上直有罪犯深重者法司行該管衙門押送問罪不許擅拏其該管官司亦不許占恡遲悞以致脫逃凡内外守偹衙門軍民詞訟𢎞治元年奏准除所屬軍衛及營厰不係緊闗重事許令受理及有舊例應准理者照舊若事情頗重及干碍民間或原無事例者不許一槩濫受悉令經由南京通政司告送法司施行十五年奏准守偹衙門有不該受理詞訟而輙與准行者許承行衙門叅奏如或轉相容隠聽南京科道官糾舉凡内外守偹衙門受理詞訟若告二事以上内一事該理者止理一事其不該理者立案不行若原在守偹衙門告理未曽審斷而被告又赴法司告理者案候併問或原告在法司未結而被告又赴守偹衙門告理者亦就連人通送法司問結明㑹典卷一百四十六
