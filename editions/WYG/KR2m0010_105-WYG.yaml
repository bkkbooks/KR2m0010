body:
  text: 明㑹典卷一百五禮部六十四南京禮部儀制清吏司事例凡南京吏部等衙門毎年慶賀萬夀聖節表文俱本部具本輪差南京六部都察院通政司大理寺堂上官一員齎進若慶賀皇太子千秋節箋文俱具本輪差南京太常寺光禄寺太僕寺國子監鴻臚寺翰林院欽天監太醫院堂上官一員齎進若慶賀冬至正旦表箋文俱具本輪差屬官一員齎進凡禮部咨送舉人及嵗貢等項生員到部劄付南京國子監收發肄業其坐監歴事舉人告應㑹試者咨送禮部若下第回部違限者限外不准坐監歴事日期凡新舊舉人監生入監復監者本部准禮部咨俱限七箇半月到部違者依例送問凡南監坐監舉人監生丁憂者本部憑原籍官司文書養病者本司憑本監典簿㕔保勘畢姻及搬取家小送幼子還鄉者本司定與限期俱送應天府給引回還凡南京公侯駙馬伯應用囚充儀從俱准刑部各司手本轉送着役凡南京各衙門送到該驗印信俱本司帖下鑄印局辨驗回報祠祭清吏司事例凡南京陵寢等項祭祀本部毎年准禮部咨預行南京太常寺等衙門各以時致祭惟歴代帝王廟遇子午卯酉年朝廷傳制遣道士齎香帛致祭各陵寢本廟不祭凡南京各衛官軍毎年打掃天地壇一次本部先准禮部咨行南京中軍都督府差撥應用凡南京祭祀犧牲本部准禮部咨預行浙江等布政司及直𨽻寧國府和州應天府江浦縣解納牛犢山北羊隻照數解部發南京太常寺犧牲所收養待用凡南京太常寺樂舞生事故名缺本部查勘收補凡毎年三月内禮部咨送到次年大統厯様發南京欽天監刋造印完至十一月初一日給散南京各衙門及直𨽻太平等府州縣凡各處該解南京欽天監造厯紙劄毎年以六月終為限違者叅䆒凡考試南京欽天監天文生本部覆審明白行令本監堂上官帶領考官赴部公同出題考試中者照例題奏請收充食糧辦事不中者仍令習學再考凡考選南京欽天監推筭觀候子弟本部揀選分撥各令父兄教習聽用凡南京太醫院醫士醫生名缺本部取勘明白行令着役凡湖廣等布政司解到藥味本部送發南京太醫院交納取庫收附卷備照凡南京僧道録司申到各寺觀住持名缺本部覆勘明白咨禮部劄付住持凡南京教坊司官及排長色長名缺本部查勘明白咨禮部奏補主客清吏司事例凡浙江湖州府長興縣直𨽻常州府宜興縣湖廣寳慶府新化縣毎年送至薦新茶芽及福建建寧府建安縣毎年送至茶芽紫筍并直𨽻滁州衛毎年二次送至天鵝雁鷀䳓鵪鶉鯽魚俱本部收送南京光禄寺供薦凡直𨽻寧國府宣城縣雪梨蘇州府吳縣柑橘浙江杭州府錢塘仁和二縣甘蔗俱本部收送南京太常寺供薦凡福建廣東等布政司解到畨國所貢硫黄蘇木胡椒畨錫等物俱本部送南京内府廣積等庫收貯精膳清吏司事例凡各處解到南京太常寺光禄寺在逃厨役本部送南京刑部問發該寺收役若厨役告稱有疾願將報冊弟姪兒男替役者本部行該寺勘結發令頂替其告鰥寡老疾無丁者行該寺勘結送應天府給引寧家行令原籍於相應民户内僉補行人司洪武十三年置行人司正九品衙門設行人左右行人職専奉使之事又改行人為司正左右行人為司副更設行人三百四十五員二十七年陞正七品衙門減行人為三十三員洪武禮制出使禮儀一凡使者欽齎詔書赴王府至王城門外一里逺下馬隨龍亭由中門靠東邊入龍亭至殿中使者立於殿外東序西向候行禮畢使者見王行四拜禮一凡使者欽齎詔書至各處開讀預期一日報知本處官司照依已降儀式迎接行禮使者到郊外下馬候龍亭到來親捧詔書置龍亭中使者立於龍亭之東本處官具服行五拜禮訖衆官前導使者上馬在龍亭後東邊行至衙門下馬隨龍亭後由中門入至㕔上立於龍亭之東候衆官四拜訖使者取詔授開讀人開讀人跪受使者復立位所宣讀訖開讀人捧詔授使者使者復置龍亭中候衆官行禮畢本處官改服與使者於後㕔行禮使者居東本處官居西俱荅拜一凡使者欽齎勑符丹符到處多係機宻重事不許先期報知亦不許本處官司迎接若與衆官直至本衙門開看置勑符於案使者立於案東衆官四拜使者取符宣讀訖符復置於案衆官再行四拜禮畢本處官遂與使者行禮若與一兩人止於本家接符從便置放使者以符授本官本官叩頭開看禮畢乃與使者行禮一凡遇詔赦經過道路官員軍民人等即於道傍俯伏候詔赦過畢方起一凡出使在外如遇詔赦到各處出迎郊外與本處官一同隨班行五拜三叩頭禮有職者隨品序列無職差使人便服隨具服班之後不許攙越行禮畢同本處官導龍亭至衙門中隨大班依上項班次行禮一凡行人開讀詔赦宴㑹則與本處正官並坐位在東席其餘公差行人之類在外不許預坐官照品級序列一凡出使官員及行人公差在外如遇旦節慶賀有職者隨品序列無職差使人便服隨具服班之後不許攙越一同大班行禮若係齎詔勅使臣則於月臺上先行五拜三叩頭禮退一凡行人奉㫖公差在外與本處官列東西坐行人居東如在州縣則居中靠東坐非特㫖差使齎各衙門印信公文止許投下公文隨即入館不許在㕔與在職官列坐事例凡開讀詔赦奉使四夷諭勞賞賜賑濟徵聘賢才整㸃大軍及軍務祭祀等事例該本衙門官差遣不許别衙門侵奪如臨時乏人方許别官兼差凡差文武大臣往各王府持節行冊封禮本司官例充副使凡陜西四川産茶地方洪武間毎嵗三月至九月差行人於各處禁約私茶出境後改差御史本司官不差凡審諭罪囚洪武三十年置政平訟理二旛除武臣死罪上親鞫問其餘法司以所犯具奏後引罪囚至承天門本司官持訟理旛傳㫖諭之其無罪應釋者持政平旛宣德意遣之後不行凡刑部都察院問過充軍犯人送五軍都督府編發者毎五日各開報本司本司歴事監生填寫精微文簿填滿繳進内府凡本司官吏監生月糧舊於禮部帶支後奏准本司自行收支凡本司合用紙劄於刑部闗用印色於順天府買用南京行人司本司今止司副一員署印明㑹典卷一百五
