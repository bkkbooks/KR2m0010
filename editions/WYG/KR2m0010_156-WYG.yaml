body:
  text: 明㑹典卷一百五十六工部十軍器軍裝諸司職掌凡軍器專設軍器局軍裝設針工局鞍轡設鞍轡局掌管時常整㸃若有缺少件數隨即行下本局算計物料委官監督定立章程如法造完差人進赴内府該庫收貯如遇軍職衙門闗支仍復計較可否果係應合闗人數即便奏聞照依軍法定律支給如係舊管征差軍士不應闗給者行移駮問馬鞍務要查勘本軍先前曽無闗過或轉納何處要見明白纔方放支不許含糊一槩支給若直𨽻及各布政司呈稟成造亦須定奪具奏行下依式造完明白支撥仍拘收原關舊損件數入官修理若各處有司嵗造之數起解到部務要辨驗堪中行下該庫交收如有不堪者就將原經手人員取問其軍裝衣鞋别無定例若有奉旨給賞臨期下庫支給軍法定律每一百户銃手一十名刀牌手二十名弓箭手三十名鎗手四十名軍器局造二意角弓交阯弓黑漆鈚子箭有蠟弓弦無蠟弓弦魚肚鎗頭蘆葉鎗頭馬軍鴈翎刀步軍腰刀將軍刀馬軍义紅油團牌水磨鐵帽水磨頭盔水磨鎖子䕶頂頭盔紅漆齊腰甲水磨齊腰鋼甲水磨栁葉鋼甲水銀摩娑長身甲併鎗馬赤甲針工局造長胖襖袒袴鞍轡局造鞍轡鞭事例凡青布鐵甲每副用鐵四十斤八兩造甲每副重二十四斤至二十五斤銅手銃重五六斤至十斤軍器鞍轡二局成造每年一造鐵盔三千六百頂甲三千六百副腰刀三千六百把長鎗一千八百條鐵牌盔二百四十頂團牌二百四十面撒袋一千八百副腰刀鞓帶三千六百條三年一造碗口銅銃三千箇手把銅銃三千把銃箭頭九萬箇信砲三千箇椵木馬子三萬箇檀木槌子三千把檀木送子三千根檀木馬子九萬箇南京兵仗局前厰季造數硃紅油貼金勇字鐵盔一百五十頂硃紅漆貼金勇字皮盔二百頂硃紅油貼金勇字牌手鐵盔五十頂併鎗馬赤甲四百副黑漆二意角弓二百四十張弓弦六百八十條明素油撒袋二百四十副黑漆鞘靶腰刀三百四十副黑漆透甲鐵箭射馬鐵箭共一萬七千五十枝硃紅布漆攅竹桿馬鎗一百條硃紅布漆攅竹桿旗鎗一十條硃紅布漆鍍水銀獅子頭團牌五十面斬馬刀五十把洪武四年以脚蹬弩給各邊將士仍令天下軍衛如式製造七年令線穿甲悉易以皮十一年定天下嵗造軍器數盔甲等項一萬三千四百六十五件馬步軍刀二萬把十六年令造甲每副領葉三十片身葉三百九分心葉十七肢窩葉二十俱用石灰淹裹軟熟皮穿浙江沿海并廣東衛所用黑漆鐵葉綿索穿成其餘俱造明甲二十年令天下都司衛所各置局軍士不堪征差者習弓箭穿甲等匠免致勞民二十三年以天下嵗造弓箭擾人令工匠輪班赴京成造二十五年令官軍闗領軍器將姓名數目造册收貯仍於各器上記官軍姓名損失即令償官二十六年造栁葉甲鎖子頭盔六千副給城守衛軍士永樂元年奏准造弓式面闊三指其力自七十斤至四十斤分為四等箭造尖銳錐箭造腰刀靶通用斜皮銃砲或専用熟銅或生熟銅相兼鑄造二年奏准各處成造軍器合用顔料係軍衛者軍衛自辦係有司者有司支撥不許將不係土産硃漆等項高貴之物一槩科擾正統元年奏准令旗令牌在外不許輕造閒常不許擅用班師之後照驗還官四年令造軍器於兵仗局各取一件為式每三月差給事中御史試驗又令天下各衛所所造軍器每月具報惟湖廣銅鼓等衛路逺者嵗終一報景泰二年奏准通行天下衛所每衛一季成造盔甲鎗刀弓各四十件圓牌二十面弦八十條箭一千二百枝撒袋四十副銃箭四百枝每千户所一季成造盔甲鎗刀弓各十件圓牌五面弦二十條箭三百枝撒袋十副銃箭一百枝永為定例仍令巡按御史同按察司官五年一次吊卷查盤如有成造不如法及侵欺等項情弊就便追問五年令各處守備官採取雜木製銃箭火藥操演務要密切關防不許漏洩式樣違者重罪天順八年造戰車製如民間小車但前増三面木板闊二丈二尺高六尺彩畫飛虎獸面上開小窓下三面各留銃眼成化二年令每步隊造小車六輛輛載九人軍裝二人推挽放銃七人行則為陣止則為營空處張掛布圍畫作獅頭牌面又於營外每車添設木樁二根絆馬索一條每車用布幕二扇俱用旗鎗張掛小紅纓頭并生鐵鈴鐺又奏准天下衛所照依原定則例督匠按季成造軍器完日會同原辦物料有司掌印官員查㸃見數如法試驗堪中仍用油漆調硃於㸃過軍器背面書寫某衛某所某年某季成造字樣候至五年本部通行各該巡按御史查盤若各該衛所官旗人等仍前侵欺物料以致缺料成造及不如法者將指揮千百户各降一等敘用不許管事旗軍人等各發極邊衛分充軍𢎞治十一年奏准成造令旗令牌三百面副每旗定用闊絹一幅長四尺闊一尺九寸每鎗連桿長六尺五寸圍圓二寸三分每牌連卧虎蓋長八寸厚七分俱編令字一號起至令字三百號止用火烙印記仍置印信文簿一扇開立前件遇有征進并内外鎮巡等項官員領去各邊應用隨將原領旗牌逐一附寫字號若有事故等項繳回奏換就於前件項下明白註銷如有損壞或比對原號不同者聴從本部㕘提究問又奏准於河南鈞磁二州各委官燒磁砲五千箇完日送巡撫官處驗中運送來京轉發該局收貯備用𢎞治十三年奏准成造斬馬大刀完日差人解部山東二千五百把河南二千把浙江四千把福建二千把江西一千五百把南直隸二千五百把又奏准成造拒馬木一千架竹牌二千面滚刀五千把又奏准今後各處解到軍器本部收候𩔖送該庫交收敢有生事刁難需索財物者重罪不饒又奏准各處軍器局造作長鎗斬馬刀牌甲弓箭不如法者都布按三司堂上委官各府衛掌印官并管局委官㕘問降級各處巡按御史都布按三司分巡分守官查盤軍器若衛所官旗人等侵欺物料那前補後虚數開報及三年不行造册奏繳者官降一級帶俸差操旗軍人等發邊衛充軍其各該都司并分巡分守官怠慢誤事者㕘究治罪凡火器係内府兵仗局掌管在外不許成造其銅鐵手把銃碗口銃邊關奏討及添造必須鎮守巡撫等官公同會議該用數目明白奏准鑄造給用火車火傘大將軍二將軍三將軍奪門將軍神鎗神銃斬馬銃手把銅銃手把鐵銃碗口銃一窩蜂神機箭銃箭襄陽礮信礮盞口礮神礮大樣神機礮小樣神機礮碗口礮銅礮大礮小礮旋風銅礮礮裏礮右軍器洪武九年令將作司造綿布戰衣用紅紫青黄四色江西等處今後造戰襖表裏異色使將士變更服之以新軍號謂之鴛鴦戰襖宣德十年定造胖襖則例每件長四尺六寸裝綿花絨二斤袴裝綿花絨半斤䩺鞋各長九寸五分至一尺或一尺二分成化十五年奏准各處解到胖襖袴鞋俱送東西廣備二庫仍差御史及本部官各一員眼同官攅人等驗收十八年令山西大同太原平陽并澤潞等處所屬嵗辦皮張折造胖襖袴鞋留貯行都司以備官軍之用甘州河橋巡檢司日稅羊皮及毛成造皮襖分給墩軍延綏寧夏嵗造胖襖袴鞋就彼貯庫其嵗辦皮張成造皮襖備用𢎞治二年奏准給散守墩架礮夜不收人等胖襖每三年一次十一年奏准山西大同太原照舊徵收胖襖平陽并澤潞等五州胖襖該於本布政司寄庫者照先年例每件折銀一兩五錢候支盡之日仍徵本色十五年奏准南京各庫收貯胖襖袴鞋每五年一次差官揀選三十萬副令南京兵部差馬快船作次運送來京備用右軍裝明會典卷一百五十六
