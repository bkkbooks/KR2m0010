body:
  text: 明㑹典卷五十八禮部十七冠服朝服諸司職掌一文武官朝服梁冠赤羅衣白紗中單俱用青飾領緣赤羅裳青緣赤羅蔽膝大帶用赤白二色絹革帶綬佩白襪黒履一品至九品俱以冠上梁數分等第公冠八梁加籠巾貂蟬立筆五折四柱香草五叚前後用玉為蝉侯冠七梁加籠巾貂蟬立筆四折四柱香草四段前後用金為蟬伯冠七梁加籠巾貂蟬立筆二折四柱香草二叚前後玳瑁為蟬俱左挿雉尾駙馬冠與侯同不用雉尾一品冠七梁不用籠巾貂蟬革帶與佩俱用玉綬用緑黄赤紫四色絲織成雲鳳四色花錦下結青絲網綬環二用玉笏用象牙二品冠六梁革帶綬環用犀餘同一品三品冠五梁革帶用金佩用玉綬用黄緑赤紫四色織成雲鶴花錦下結青絲網綬環二用金笏用象牙四品冠四梁革帶用金佩用藥玉餘同三品五品冠三梁革帶用銀鈒花綬用黄綠赤紫四色織成盤鵰花錦下結青絲網綬環二用銀鍍金笏用象牙六品七品冠二梁御史加獬豸革帶用銀佩用藥玉綬用黄緑赤三色絲織成練鵲花錦下結青絲網綬環二用銀笏用槐木八品九品冠一梁革帶用烏角佩用藥玉綬用黄緑二色絲織成鸂􅈃花錦下結青絲網綬環二用銅笏用槐木一文武官朝服扵大祀慶成正旦冬至聖節及頒降開讀詔赦進表傳制則服之事例洪武三十年奏准雜職等官凡遇大朝賀等禮亦照九品官具朝服行禮公服諸司職掌一文武官公服用盤領右袵袍或紵絲紗羅絹從宜製造袖寛三尺一品至四品緋袍五品至七品青袍八品九品綠袍未入流雜職官袍笏帶與八品以下同公服花様一品用大獨科花徑五寸二品小獨科花徑三寸三品散答花無枝葉徑二寸四品五品小雜花紋徑一寸五分六品七品小雜花徑一寸八品以下無紋幞頭用漆紗二等展角各長一尺二寸其雜職官員幞頭用垂帶笏依朝服為之腰帶一品用玉或花或素二品用犀三品四品用金荔枝五品以下用烏角鞓用青革仍垂撻尾於下鞾用皂其在京文武官於每日早晚朝奏事及侍班謝恩見辭則服之在外文武官員于毎日清早公座服之一凡各處雜職未入流品人貟若遇大朝賀進表等陪班行禮止用公服事例洪武二十四年定公侯駙馬伯公服服色花樣腰帶與一品同文武官公服花様如無從織買用素隨宜朝服公服制度内外文武官同其公服武官應直守衛者不拘此服二十六年令常朝止穿便服若遇􅃋望具公服朝恭内外未入流雜職官幞頭展角與入流官同不用垂帶祭服諸司職掌一文武官陪祭服一品至九品青羅衣白紗中單俱用皂領緣赤羅裳皂緣赤羅蔽膝方心曲領其冠帶佩綬等第並同朝服明集禮凡遇上親祀郊廟社稷羣臣分獻陪祀則具祭服事例洪武六年品官家用祭服三品以上去方心曲領四品以下並去佩綬二十九年令在外未入流品陪祭俱用祭服與九品同常服諸司職掌一品官常服用雜色紵絲綾羅綵繡庶民止用紬絹紗布不許别用一花様公侯駙馬伯麒麟白澤文官一品二品仙鶴錦雞三品四品孔雀雲鴈五品白鷴六品七品鷺鷥鸂􅈃八品九品黄鸝鵪鶉練鵲風憲官用獬豸武官一品二品獅子三品四品虎豹五品熊羆六品七品彪八品九品犀牛海馬一官員及軍民僧道人等衣服帳幔並不許元黄紫三色并織繡龍鳳文違者罪及染造之人其朝見人員四時並用顔色衣服不許純素洪武禮制凡各處雜職未入流品人員若遇朝賀進表箋陪班行禮止用烏紗㡌紅團領衫黑角束帶凡文武官常朝視事以烏紗㡌團領衫束帶為公服一品玉帶二品花犀帶三品金鈒花帶四品素金帶五品銀鈒花帶六品七品素銀帶八品九品烏角帶凡年老致仕及事親辭閒官員許用紗㡌束帶若為事黜降者服與庶人同事例洪武三年令百官服色凖所授散官不許見任之職二十二年令文武官除本等紗㡌外遇雨雪許戴雨㡌公差出外許戴㡌子入城不許其公差人員出外者亦如之二十三年令官員人等衣服寛窄以身為度文職官衣長自領至裔去地一寸䄂長過手復回至肘袖樁廣一尺袖口九寸公侯駙馬與文職官同武職官衣長去地五寸袖長過手七寸袖樁廣一尺袖口僅出拳二十五年定公侯駙馬伯束帶與一品同雜職未入流官與八九品同三十年令致仕官服色與見任同若遇朝賀及謝恩見辭一體具服行禮景泰四年令錦衣衛指揮侍衛毋得衣麒麟服色天順二年令官民人等衣服不得用蟒龍飛魚斗牛大鵬像生獅子四寳相花大西畨蓮大雲花様及姜黄栁黄明黄𤣥色綠等色儀賓冠服朝服公服常服俱照品級與文武官同惟笏皆用象牙常服花様視武官教坊司官冠服事例洪武間令教坊司官常服冠帶與百官同至御前供奉執粉漆笏服黒漆幞頭黒緑羅大袖襴袍黑角偏帶皂靴命婦冠服禮服諸司職掌一品冠用金事件珠翟五箇珠牡丹開頭二箇珠半開三箇翠雲二十四片翠牡丹葉一十八片翠口圏一副上帶金寳鈿花八箇金翟二箇口銜珠結二箇二品至四品冠用金事件珠翟四箇珠牡丹開頭二箇珠半開四箇翠雲二十四片翠牡丹葉一十八翠口圈一副上帶金寳鈿花八箇金翟二箇口銜珠結二箇一品至四品霞帔用雲霞文鈒花金墜子禙子用雲霞文五品至六品冠用抹金銀事件珠翟三箇珠牡丹開頭二箇珠半開五箇翠雲二十四片翠牡丹葉一十八翠口圈一副上帶抹金銀寳鈿花八箇抹金銀翟二箇口銜珠結子二箇霞帔用雲霞文五品鍍金鈒花銀墜子六品鈒花銀墜子七品至九品冠用抹金銀事件珠翟二箇珠月桂開頭二箇珠半開六箇翠雲二十四片翠月桂葉一十八片翠圈口一副上帶抹金銀寳鈿花八箇抹金銀翟二箇口銜珠結子二箇七品霞帔禙子與八品同八品九品霞帔用繡纒枝花墜子與七品同禙子繡枝團花事例洪武五年定命婦圓衫之制以紅羅為之繡重雉為等第一品九等二品八等三品七等四品六等五品五等六品四等七品三等其餘不用繡雉二十四年定命婦冠服八侯伯與一品同大袖衫用真紅色一品至五品紵絲綾羅隨用六品至九品綾羅紬絹隨用霞帔禙子皆用深青縀疋公侯及一品二品金繡雲霞翟文三品四品金繡雲霞孔雀文五品繡雲霞鴛鴦文六品七品繡雲霞練鵲文命婦入内朝見君后在家見舅姑并夫及祭祀則服之大袖衫領闊三寸兩領直下一尺間綴紐子三前身長四尺一寸二分後身長五尺一寸内九寸八分行則摺起末綴紐子二紐在掩紐之下拜則放之袖長三尺二寸二分根闊一尺口濶三尺五分落摺一尺一寸五分掩紐二就用衫料連尖長二寸七分闊二寸五分各扵領下一尺六寸九分處綴之扵掩下各綴紐門一以紐住摺起後身之餘者兠子亦用衫料兩塊斜裁上尖下平處各闊一尺五分縫合扵領下一尺七分處綴之上綴尖皆縫合以蔵霞帔後垂之末者霞帔二條各長五尺七寸闊三寸二分各繡禽七隨品級用前四後三各繡臨末左右取尖長二寸七分前後垂横綴青羅襻子牽聨並之前垂三尺三寸五分尖綴墜子一後垂二尺三寸五分臨末挿兠子内蔵之墜子中鈒花禽一四面雲霞文禽如霞帔隨品級用笏以象牙為之圎首方脚長六寸四分闊一寸五分厚一分五釐常服事例洪武二十四年定命婦常服用顔色圎領衫生員巾服事例洪武二十四年定生員襴衫用玉色布絹為之寛袖皂緣皂絛軟巾垂帶吏員巾服事例洪武四年定各衙門掾史令史書吏司吏典吏穿皂盤領衫繫絲絛戴四方平定巾十四年令吏員皂衣改用青色三十年令令史典吏皆服吏巾巾様不與庶民同士庶巾服公使人等附明集禮士庶初戴四帶巾今改四方平定巾雜色盤領衣不許用黄執仗之士首服鏤金額交脚幞頭服諸色辟邪寳相花裙襖銅葵花束帶皂紋靴刻期冠方頂巾衣胸背鷹鷂花腰線襖子諸色闊絲匾絛象牙雕花環行縢八帶鞋皁𨽻冠圎頂巾衣皂衣事例洪武三年令庶民男女衣服並不得僣用金繡錦綺紵絲綾羅許用紬絹素紗其首飾釧鐲並不許用金玉珠翠止用銀靴不得裁製花様金銀粧飾四年令皁𨽻公使人穿皁盤領衫戴平頂巾繫白褡􅈩帶錫牌六年令庶民巾環不得用金玉瑪瑙珊瑚琥珀未入流品者並同庶民㡌不得用頂㡌珠許用水晶香木校尉只孫束帶幞頭靴鞋刻期雕刻雜花象牙絛環外餘同庶民十四年令農民之家許用紬紗絹布商賈之家止許穿絹布如農民之家但有一人為商賈者亦不許穿紬紗校尉用金鵝㡌黑漆戧金荔枝改作銅釘様毎五釘攅就四面稍起邊欄鞓用青𦂳束之各衙門祇禁原穿皁衣改用淡青凡僧道服色禪僧茶褐常服青絛玉色袈裟講僧玉色常服緑絛淺紅袈裟教僧皁常服黑絛淺紅袈裟僧官皆如之道士常服青法服朝服皆用赤色道官亦如之惟僧錄司官袈裟道録司官法服朝服皆緑紋飾以金二十二年令将軍力士校尉旗軍常戴頭巾或􅜵腦官下舍人并儒士吏員民人常戴本等頭巾鄉村農夫許戴斗笠蒲笠出入市井不禁不親農業者不許二十三年令耆民儒士生員衣制同丈職惟袖過手復回不及肘三寸庶民衣長去地五寸袖長過手六寸袖樁廣一尺袖口五寸軍人衣長去地七寸袖長過手五寸袖樁廣不過一尺窄不過七寸袖口僅出拳二十五年令文武官同籍父兄伯叔弟姪子婿及儒生員吏典知印承差欽天監天文生太醫院醫士瑜珈僧正一道士将軍散騎舍人帶刀之人正伍馬軍并馬軍小旗教讀大誥師生許穿靴校尉力士遇上直許穿出外不許其庶民商賈技藝步軍及軍下餘丁管歩軍縂小旗官下家人火者皂𨽻伴當在外醫卜隂陽人皆不許止許穿皮扎䩺其北平山東山西宣大陜西河南并直𨽻徐州地寒人民許穿牛皮直縫靴二十六年禁官民步卒人等不許服對襟衣惟騎士不拘士庶妻冠服婢使人等附明集禮士庶妻首飾許用銀鍍金耳環用金珠釧鐲用銀服淺色團衫用紵絲綾羅紬絹事例洪武五年令凡民間婦人禮服惟用紫染色絁不用金繡凡婦女袍衫止用紫緑桃紅及諸淺淡顔色不許用大紅鴉青黄色帶用藍絹布凡女子在室者服飾之制皆作三小髻金􅁫珠頭􅣎窄袖禙子凡婢使人等綰髙頂髻用絹布狹領長襖長裙小婢使綰雙髻用長袖短衣長裙成化十年禁官民人等婦女不許僣用渾金衣服寳石首飾樂人巾服明集禮樂藝冠青卍字頂巾繫紅緑褡􅈩樂妓則戴明角冠皂禙子不許與庶民妻同事例洪武十二年令教坊司伶人常服綠色巾以别士庶之服十四年令樂人戴鼓吹冠不用錦絛惟用紅􅭫膊服色不拘紅綠二十一年令教坊司婦人不許戴冠穿禙子二十五年令樂工當承應許穿靴出外不許三十年令樂人衣服許用明綠桃紅玉色水紅茶褐顔色其餘不得穿用俳色長樂工俱戴皂頭巾繫雜色餘凡御前供奉俳長皆服鼓吹冠紅羅胸背小袖袍紅絹褡膊皂靴色長皆服鼓吹冠紅青緑紵絲衫畫百花袍紅絹褡膊歌工皆服弁冠紅羅織錦胸背大袖袍紅生絹錦領中單黒角束帶紅熟絹錦脚袴皂皮琴鞋白綿布夾襪樂工服色與歌工同凡中宫供奉女樂奉鸞等官妻本色䯼髻青羅圎領提調女樂服黒漆唐巾大紅羅銷金裙襖胸帶大紅羅抹額青緑羅彩畫雲肩描金牡丹花皂靴奏樂女樂服色與歌章同明㑹典卷五十八
