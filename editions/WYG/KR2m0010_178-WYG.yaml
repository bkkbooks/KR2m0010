body:
  text: 明㑹典卷一百七十八僧録司國初置善世院洪武十五年改僧録司正六品衙門設左右善世左右闡教左右講經左右覺義職専釋教之事屬禮部衙門置於天界寺永樂遷都後置於大興隆寺南京仍舊事例凡本司官皆選精通經典戒行端潔者為之不支俸如有行移以僧人掌行僕從以佃户充役凡僧有三等曰禪曰講曰教在外僧人府屬僧綱司州屬僧正司縣屬僧㑹司管轄皆統於本司凡度僧以十年一度在京行童從本寺具名在外從僧綱等司造􅁽給批俱從本司轉申禮部本部官仍同禮科官考試能通經典者給與度牒其僧人額設府不過四十人州三十人縣二十人凡僧人給授度牒洪武二十五年令本司造周知􅁽自在京及在外寺院僧名以次編之其年甲姓名字行及始為僧年月與所授度牒字號俱載於僧名之下頒示天下僧寺凡游方行脚至者以􅁽驗之其不同許獲送有司解至京治以重罪容留者罪如之其後不造嵗久仍有詐偽者至正統五年復照舊造凡各處額設寺俱有僧人住持從各寺僧人保舉有戒行通經典者上僧綱等司僧綱等司申於本司給與劄付其有錢糧大寺轉申禮部出給劄付凡本司官每月止朝朔望班列於西如遇慶賀頒詔等事行禮皆預班列於東凡在京祭祀本司官皆不預在外同凡僧官僧人服色見禮部儀制司洪武二十五年令瑜珈僧許穿靴凡内外僧官専一檢束天下僧人恪守戒律清規違者從本司懲治若犯與軍民相干者從有司懲治南京僧録司事例見僧録司道録司國初置𤣥教院洪武十五年改道録司正六品衙門設左右正一左右演法左右至靈左右𤣥義職専道教之事屬禮部衙門置於朝天宫兩京俱同事例凡本司官選用并不支俸及行移等項俱與僧録司同凡道士有二等曰全真曰正一在外道士府屬道紀司州屬道正司縣屬道㑹司管轄皆統於本司凡道童限年給度牒各司申送及考試等項俱與僧録司同凡本司官每月止朝朔望如遇慶賀頒詔等事行禮皆預班列於東凡在京祭祀本司官皆不預在外同凡慶成宴本司官皆預凡道官道士服色見禮部儀制司洪武二十五年令正一道士許穿靴凡内外道官専一檢束天下道士違者從本司懲治若犯與軍民相干者從有司懲治南京道録司事例見道録司神樂觀洪武十二年置神樂觀設提㸃知觀専管樂舞生屬太常寺事例凡樂舞生洪武初選用道童後樂生用道童舞生以軍民俊秀子弟為之十三年又詔公侯及諸武臣子弟習樂舞之事又令禮部揀選樂舞生有過及疾病者放歸為民凡樂舞生每嵗所給米麥衣布及時節賞賜之數具刻於御製碑隂凡遇朝㑹本觀提㸃班在僧録司左善世之下道録司正一之上知觀班列於僧録司左覺義之上道録司左至靈之下凡樂舞儀節本寺令協律郎等官教習每遇祭祀先期於本觀演習凡大祀天地樂麾恊律郎一員樂生七十二人文舞生六十四人引舞二人武舞生六十四人引舞二人執事一百二十三人典儀一人傳贊五人通贊二人罍洗八人正殿四壇捧帛四人執爵四人司尊三人内垣四壇捧帛等共十六人外垣二十壇捧帛等八十人燒香共六十八人㸃燭共十二人凡時享太廟舉麾樂舞生皆同前執事六十三人典儀一人通贊一人正九壇捧帛九人執爵十七人司尊二人親王四壇捧帛四人斟酒四人功臣十六壇捧帛十六人斟酒四人五祀捧帛等五人燒香共六人嵗暮祫祭捧帛添一人執爵添二人餘同前五祀執事十二人贊引一人讀祝一人捧帛五人執爵五人司尊一人旗纛執事五人贊引一人讀祝一人捧帛一人執爵一人司尊一人燒香共六人凡祭社稷舉麾樂舞生同前執事十二人典儀一人通贊一人正四壇捧帛四人執爵四人司尊二人燒香共十人凡祭先師孔子舉麾樂舞生同前執事三十二人典儀一人通贊一人罍洗三人對引一人正一壇捧帛一人執爵一人司尊一人四配四壇捧帛四人執爵四人十哲二壇贊引二人捧帛二人執爵二人司尊二人東西二廡贊引二人捧帛二人執爵二人司尊二人燒香共三人凡樂舞生執事人等歳用米麥等物俱從户部撥送本觀收貯米二千六百石麥六百石豆一百六十石芝麻三十石鹽三千斤柴二十五萬斤月支米一百九十三石三斗八升共支米二千三百七十六石各陵寢時祭每嵗共支行糧熟米一十五石五斗二升文廟春秋二祭每名支行糧熟米一升共三石五斗六升每嵗正旦中元冬至三節每名支米一斗五升共九十石每嵗支過外餘米作閏月并急差支用凡樂舞生嵗給淨衣并布絹鈔貫等物天地壇登壇淨衣每名一套計四百七套社稷壇登壇淨衣每名一套計二百二十六套每套俱計四件每名鈔二貫計四千八百五十九貫每名夏布三疋棉布三疋生絹一疋白綿半斤凡本觀原額膳夫三十名俱順天府屬縣㸃充南京神樂觀事例凡每年本觀樂舞生三百五十名該用綿布一千五十疋絹三百五十疋綿一百七十五斤闗太常寺奏行南京户部轉行甲字等庫闗支該用鹽三千斤柴一十五萬五千四百斤南京户部工部闗支該用秋糧米二千石小麥六百石黄豆一百六十石芝麻三十石碾米牛用稻草一千五百包直隸常州等府武進等縣進納凡本觀原額膳夫三十名俱應天府屬縣㸃充明㑹典卷一百七十八
