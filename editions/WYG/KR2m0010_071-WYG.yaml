body:
  text: 明㑹典卷七十一禮部三十大宴儀二事例凡正旦冬至萬夀聖節洪武永樂間大宴並如慶成儀宣徳正統後朝官不與宴者給賜節錢鈔錠各處進表官亦令與宴免宴則通賜節錢凡立春元宵四月八端午重陽臘八等節永樂間俱於奉天門通賜百官宴用樂其後賜宴日早朝畢光禄寺面奏百官復入班行叩頭禮駕還宫百官出宴於午門外不用樂宴畢復向闕行叩頭禮乃退凡東宫千秋節永樂間賜五府六部等衙門堂上官左右春坊科道近侍錦衣等衛随駕帶刀指揮千户等官及天下進箋官宴於文華殿并文華門東西廊王府進箋官并外國使臣宴於本部宣徳以後通宴於午門外凡皇太后夀旦正統四年賜百官通宴於午門外大宴樂一洪武間定殿内侑食樂樂器麾竿一柷一敔一搏拊一琴四瑟二簫四笙四笛四塤二箎二排簫二鍾一磬一應鍾一樂章一奏炎精開運之曲諸司職掌原不開此曲今備于此炎精開運篤生聖皇大明御極逺紹虞唐河清海宴物阜民康威加夷䝤徳被戎羌八珎有薦九鼎馨香鼓鐘鐄鐄宫徴洋洋怡神養夀理隂順陽保兹遐福地久天長二奏皇風之曲皇風被八表熈熈聲教宣時和景象明紫宸開繡筵龍衮曜朝日金爐裊祥烟濟濟公與侯被服麗且鮮列座侍丹扆磬折在周旋羔豚升華爼玉饌充方圓初筵奏南風繼歌賡載篇瑶觴欣載舉拜俯禮無愆同樂及斯辰於皇千萬年奏平定天下之舞舞士三十二人皆左執干干長三尺五寸上濶一尺下廣六寸朱質上畫雉羽中畫升龍雲氣右秉戚戚長二尺五寸朱紅漆柄金裝戚斧分為四行每行八人舞作發揚蹈厲坐作擊刺之狀皆冠黄金束髮冠紫紛纓青羅生色畫舞鶴花窄䄂衫白生絹襯衫錦領紅羅銷金大袖窄袍紅羅銷金裙皂生色畫衣沿襈白羅銷金汗袴藍青羅銷金沿紅絹擁項紅結子紅絹束腰塗金束帶青絲大絛錦臂鞲緑雲頭皂靴舞師二人執旌以引之旌長七尺五寸朱紅漆柄金龍吞口懸五采羽九層每層用塗金寳葢紅絲絛穿末垂絲結子皆冠黄金束髮冠紫紛纓青羅大袖衫白絹襯衫錦領塗金束帶緑雲頭皂靴樂章清海宇㧞劍起淮土䇿馬定寰區王氣開天統寳歴應乾符武畧文謨龍虎風雲創業初將軍星繞弁勇士月彎弧選騎平南楚結陣下東吳跨蜀長驅萬里山河壯帝居三奏眷皇明之曲赫赫上帝眷我皇明大命既集本固支榮厥本伊何育徳春宫厥支伊何藩邦以寧慶延百世澤被羣生及時為樂天禄是膺千秋萬嵗永觀厥成奏撫安四裔之舞舞士十六人東方四人椎髻於後繫紅銷金頭䋲紅羅銷金抹額中綴塗金愽山兩旁綴塗金環明金耳環青羅生色畫衣大袖衫紅生色領袖紅羅銷金裙青銷金裙沿紅生絹襯衫錦領塗金束帶烏皮鞋西方四人間道錦纒頭明金耳環紅紵絲細褶襖子大紅羅生色雲肩緑生色沿藍青羅銷金汗袴紅銷金沿繫腰合鉢十字泥金數珠五色銷金羅香囊紅絹擁項紅結子赤皮靴南方四人綰朝天髻繫紅羅生色銀錠紅銷金抹額明金耳環紅織金短襖子緑織金細褶短裙絨綿袴子間道紵絲手巾泥金項牌金珠纓絡綴小金鈴錦行纒泥金獅蠻帶緑銷金擁項紅結子赤皮靴北方四人戴單于冠貂䑕皮簷雙垂髻紅銷金頭䋲紅羅銷金抹額諸色細褶襖子藍青生色雲肩紅結子紅銷金汗袴繫腰合鉢皂皮靴四裔各為一行舞作拜跪朝謁喜躍俯伏之狀舞師二人執幢以引之幢長七尺五寸朱紅漆柄金頭吞口懸五采羅幢五層每層綴五色銷金吹帶末垂紅粉結子皆戴白捲簷毡㡌塗金㡌頂一撒紅纓紫羅㡌襻紅緑金繡襖子白銷金汗袴藍青銷金沿塗金束帶緑擁頂紅結子赤皮靴樂章小將軍大明君定宇寰聖恩寛掌江山黄支烏弋赤甲朱鳶手高擎寳貝􅋥殿前歡五雲宫闕連霄漢金光明照眼玉溝金水聲潺潺頫􅇟觀趨蹌㸔儀鑾嚴肅百千般威人心膽寒慶新年虎豹闗文武班五彩間慶雲朝霞燦黄金殿喜氣増丹墀内仰聖顔翠遶紅圍錦繡班高樓十二欄笙簫趂紫檀仙音韻瑶􅌙按拜舞齊歌謡讃吾皇萬夀安過門子定宇寰定宇寰掌江山撫百蠻謳歌拜舞仰祝讃萬萬年帝業安四奏天道傳之曲馬負圖兮天道傳龜載書兮人文宣羲卦畫兮禹疇叙皇極建兮合自然綿綿歴數歸明主祥麟在郊威鳯舞九夷八貢康衢謡聖子神孫繼祖武垂供無為邁前古奏車書㑹同之舞舞士三十二人左執籥籥長一尺五寸朱紅漆筀竹為之上門三竅右秉翟翟長三尺五寸朱紅漆柄金龍吞口上綴雉羽五層每層用塗金寳葢紅絲絛穿末用紅絲結子分為四行毎行八人舞坐作進退舒徐揖讓升降之狀皆冠黒光描金方山冠青紛纓衣素紅羅大䄂衫紅生絹襯衫錦領紅羅擁項紅結子塗金束帶白絹大口袴白布襪茶褐鞋舞師二人執翿以引之翿長七尺五寸朱紅漆柄金龍吞口懸白鷺羽九層用塗金寳葢紅絲絛穿末垂紅絲結子冠服與舞士同惟大䄂衫用青不用紅羅項紅結子樂章泰階平乾坤清寧治功告成武定禍亂文致太平郊則致其禮廟則盡其誠卿雲在天甘露零風雨時若百穀登禮樂雍和政刑肅清儲嗣既立封建乃行讒佞屏四海賢俊立朝廷玉帛鐘鼓陳兩楹君臣賡歌揚頌聲五奏振皇綱之曲周南詠麟趾卷阿歌鳯凰藹藹稱多士為楨振皇綱赫赫我大明徳尊踰漢唐百揆脩庶績公輔理隂陽峨冠正襟珮都俞在高堂坐令八紘内熈熈民樂康氣和風雨時田疇見豐穰獻禮過三爵歡娛良未央奏百戲承應六奏金陵之曲鐘山蟠蒼龍石城距金虎千年王氣都于今歸聖主六代繁華輕幾秋江流東去無時休誰言天塹分南北英雄豈但嗤曹劉我皇昔住濠梁屋神遊天錫真人服提兵乗勢渡江來詞臣早獻金陵曲歌金陵進珎饌諧八音繼三嘆請觀漢祖用兵時為嘗馮異滹沱飯奏百戲承應七奏長楊之曲長楊曵緑黄鳥和鳴菡蓞呈鮮紫燕輕盈千花浥露日麗風清及時為樂芳樽在庭管音嘒嘒絲韻泠泠玉振金聲各奏尔能皤皤國老載勸載懲明徳惟馨垂之聖經唐風示戒永保嘉名無已太康哲人是聴奏百戲承應八奏芳醴之曲夏王厭芳醴商湯遠色聲聖人示深戒千春垂令名惟皇登九五玉食保尊榮日昃不遑餐布徳延羣生天庖具豐膳鼎鼐事調烹豈但資肥甘亦足飬遐齡逹人悟茲理恒令五氣平随時知有節昭哉天道行奏隊舞承應九奏駕六龍之曲日麗中天漏下遲公卿侍宴多令儀簫韶九奏觴九獻爐烟細逐祥風吹羣臣舞蹈天顔喜嵗熟民康長若此六龍廽駕鳯樓深寳扇齊開扶玉几景星呈瑞慶雲多兩曜増暉四序和聖人道大如天地嵗嵗年年奈樂何奏隊舞承應進膳樂樂器笙二笛二鼓一板一杖鼓八樂章水龍吟寳殿祥雲紫氣濛龍徳宫聖明君氤氲霧靄檜栢間青松龍樓鳯閤雕梁畫棟此是􅅾萊洞太平清樂樂器笙四笛四頭管二􅌙四杖鼓八小鼓一板一方響一樂章太清歌萬國來朝進貢仰賀明聖主一統華夷普天下八方四海南北東西託聖徳堯王保䕶國家太平天下都歸一將兵器銷為農器旌旗不動酒旗招仰荷天地上清歌一願四時風調雨順民心喜攝外國將寳貝攝外國將寳貝見君王來朝寳殿裏珊瑚瑪瑙玻璃進在丹墀開天門託長生日月光天徳萬萬嵗永固皇基公卿文武來朝㑹開玳宴捧金杯設立大樂樂器戲竹二簫四笙四笛二頭管二琵琶二􅌙二二十絃二方響二鼓一板一杖鼓八陞座還宫樂章萬嵗樂雨順風調昇平世萬萬年山河社稷八方四面狼烟息慶龍虎風雲㑹百官行禮樂章朝天子聖徳聖威洪福齊天地玉階前文武兩班齊擺列在丹墀内舞蹈揚塵山呼萬嵗統山河壯帝畿禮儀讃喜慶龍虎風雲㑹迎膳樂樂器戲竹二笙一笛四頭管二􅌙二鼓一板一杖鼓十樂章水龍吟同前大祀慶成大宴萬國來朝隊舞纓鞭徳勝隊舞萬夀聖節大宴九夷進寳隊舞夀星隊舞冬至大宴讃聖喜隊舞百花聖朝隊舞正旦大宴百戲蓮花盆隊舞勝鼓採蓮隊舞明㑹典卷七十一
