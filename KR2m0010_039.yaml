body:
  text: 明會典卷三十九户部二十四國家倉庾之設遍于天下兩京直𨽻并各布政司府州縣各都司衛所及各王府皆有倉具列于後預備倉亦附見不備録云諸司職掌凡天下設置倉厫其在各該衛所常存二年糧斛分為二十四厫收貯以備支用其在各司府州縣各有倉厫收貯糧米以給歲用且如在京衛所倉糧必須查勘見數分豁某字厫原收某年分秋糧米若干本部攢造印信文册一本進赴內府該科收貯凡各衛支過月糧本衛具手本奏進與同本部委官於原進册內注銷仍呈報本部知數其在外倉厫凡有勘合下倉放支亦必稟請提調正官眼同支給比候年終將支過數目同實在糧斛通行開報以憑稽考誥凡攬納户攬到人户諸色物件糧米等項不行赴各該倉庫納足隱匿入已虛買實收者追物還官然後處以重刑籍沒家産憲綱凡在京及各布政司并巡歷地方倉庫局務等衙門但係錢糧出納去處從監察御史并按察司分司官不時巡視若有作弊就便究治倉庫房屋仰本府州縣提調官常加點視若有損壞即便修理及嚴加關防官吏斗級庫子人等收支作弊仍將見在錢糧等物分豁新舊收除實在備細數目繳報兩京并直𨽻府州縣都司衛倉京倉長安門倉東安門倉西安門倉北安門倉舊太倉一十一衛忠義前衛倉忠義後衛倉義勇右衛倉蔚州左衛倉大寧中衛倉錦衣衛倉神武左衛倉景陵衛倉獻陵衛倉神武後衛倉羽林前衛倉南新倉八衛府軍衛倉燕山右衛倉彭城衛倉龍驤衛倉龍虎衛倉永清衛倉金吾左衛倉濟州衛倉新太倉七衛裕陵衛倉義勇中衛倉大寧前衛倉會州衛倉富峪衛倉茂陵衛倉義勇前衛倉海運倉六衛忠義左衛倉忠義右衛倉寬河衛倉燕山左衛倉義勇後衛倉義勇左衛倉北新倉五衛府軍左衛倉府軍右衛倉府軍前衛倉燕山前衛倉金吾前衛倉大軍倉四衛永清左衛倉旗守衛倉大軍倉武成中衛倉濟陽倉二衛金吾右衛倉濟陽衛倉祿米倉二衛彭城衛南新倉府軍前衛南新倉西倉五衛虎賁左衛倉大興左衛倉府軍後衛倉金吾後衛倉羽林左衛倉通州倉西倉通州衛倉通州左衛倉通州右衛倉定邊衛倉神武中衛倉武清衛倉南倉通州衛倉通州左衛倉通州右衛倉定邊衛倉中倉通州衛倉通州左衛倉通州右衛倉神武中衛倉東倉神武中衛倉水次倉五處天津水次倉德州水次倉臨清水次倉徐州水次倉清江浦水次倉順天府壩上倉壩上東馬房倉黃土倉壩上北馬房倉鄭家莊馬房倉義河倉吳家駝牛房倉東直門裏外牛房倉壩上南倉金盞兒甸倉湯山草場倉壩上北倉北髙倉南石渠倉山口倉泳永旱石橋倉北草場倉良鄉縣豐濟倉昌平縣居庸倉密雲縣隆慶倉古北口倉涿州常盈倉陸樊倉三河縣峪口官莊馬房倉峪口楊家橋馬房倉峪口張家莊馬房倉薊州本州倉遵化縣水盈倉喜峰口倉平谷縣積留倉河間府巨盈倉滄州長蘆倉真定府豐盈倉定州永豐倉保定府廣盈中左右倉唐縣軍城倉新興倉易州紫金新城倉易州倉永平府東盈倉永豐倉山海倉界嶺口倉劉家口倉遷安鎮倉遷安縣三屯營倉𢎞治十二年設撫寧縣撫寧倉隆慶州本州倉懷來廣阜倉雲州堡倉獨石廣積倉赤城廣備倉龍門廣盈倉長安嶺倉馬營廣盈倉雕鶚堡倉龍門倉永寧縣永寧倉四海冶倉保安州洗馬林堡倉葛峪堡倉新興倉萬全廣積倉趙川堡倉永豐倉萬全廣盈倉懷安廣備倉宣德倉柴溝堡倉宣政倉宣化倉膳房堡倉𢎞治九年設北直𨽻衛倉天津衛倉天津左衛倉天津右衛倉隆慶衛倉涿鹿衛倉涿鹿左衛倉涿鹿中衛倉密雲中衛倉密雲後衛倉薊州衛倉遵化衛東店倉東勝衛倉鎮朔衛東店倉萬全都司洪州舊堡倉大小白羊二堡倉青邊常峪二堡倉新河口堡倉四海冶倉張家口堡倉西陽河堡倉新河口堡倉順聖川新城馬房倉南京四十一衛倉錦衣衛烏龍潭倉旗手衛倉金吾前衛倉金吾後衛倉羽林左衛倉羽林右衛倉虎賁左衛倉虎賁右衛倉驍騎右衛倉龍驤衛倉鷹揚衛倉神䇿衛倉留守中衛倉留守左衛倉留守右衛倉留守前衛倉留守後衛倉興武衛倉豹韜衛倉府軍衛倉府軍左衛倉府軍右衛倉府軍後衛倉龍虎衛倉武德衛倉和陽衛倉鎮南衛倉瀋陽左衛倉瀋陽右衛倉孝陵衛倉廣洋衛倉天䇿衛倉江陰衛倉水軍左衛倉水軍右衛倉應天衛倉橫海衛倉龍江左衛倉龍江右衛倉龍虎左衛倉豹韜衛倉應天府常平倉鎮江府大軍倉蘇州府永豐倉嘉定縣吳淞江軍儲倉太倉州太倉軍儲倉𢎞治十年自嘉定縣改𨽻鎮海軍儲倉𢎞治十年自崑山縣改𨽻崇明縣永豐倉松江府青村倉軍儲北倉軍儲南倉上海縣廣儲倉徽州府永豐倉寧國府軍儲倉太平府豐濟倉鳳陽府本府倉廣儲一二三四五倉今歸併二倉定逺縣廣儲倉潁州廣積倉潁上縣本縣倉亳州軍儲倉泗州廣濟倉夀州本州倉宿州際留倉睢陽倉揚州府軍儲倉儀真縣廣實倉髙郵州廣儲倉興化縣永興倉通州通濟倉泰州常豐倉淮安府大軍倉常盈倉東新倉鹽城縣永積倉海州通濟倉永濟倉邳州邳州倉廬州府永豐倉六安州軍儲倉安慶府萬億倉永盈倉永福倉廣運倉永成倉事例洪武四年設軍儲倉二十所各置官掌管二十八年置皇城長安東安西安北安四門倉每倉設副使一員永樂七年置北京金吾左右羽林前常山左右中燕山左右前濟陽濟州大興左武成中左右前後義勇中左右前後神武左右前後忠義左右前後武功中寬河會州大寧前中富峪蔚州凡三十七衛倉及錦衣中懷來守禦二千户所倉每倉設副使一員十三年設淮安常盈倉令本部主事一員提督收放十五年令各倉庫收納錢糧務要納户親身上納如有兜攬作弊之人納户通同不行首告者一體治以重罪十六年奏準凡納户送糧到倉辨驗堪中隨即收受不許刁蹬留難勒掯財物及通同盜賣虛出實收又令通州張家灣起蓋倉厫七十間名通濟倉收貯各處儧運糧宣德三年奏準凡設內外衛所倉每倉置一門榜曰某衛倉三間為一厫厫置一門榜曰某衛某字號厫凡收支非納户及關糧之人不許入每季差監察御史本部屬官錦衣衛千百户各一員往來巡察各倉門以致仕武官各二員率老幼軍丁十名看守倉外置冷鋪以軍丁三名巡警致仕官半年更代在外倉都布按三司設法關防巡按御史點視凡軍民偷盜官吏斗級通同者正犯處斬仍追所盜糧入官全家發邊逺充軍給家産一半賞首告者同盜能首者免本罪亦給被首告者家産之半充賞其攬納虛收及虛出通關者罪同偷盜又令在京各衛添設經歷一員監收支糧其內外衛所倉俱令各衛首領官與倉官專管罷軍職管糧四年榜諭各倉凡收支糧草官吏人等有折收金銀并攬納偷盜者許諸人首告或拏送法司正犯處斬仍追原物入官家屬發邊逺充軍首告者賞鈔五千貫五年令在京各衛倉每厫置牌一面開所收糧數并部運官吏旗軍糧長納户及收糧官攢斗級姓名于上挂厫門以便點閘又令各處軍民運糧到京赴本部告判該司徑送本部委官處定厫收受轉行該衛用印信下帖發該倉收納六年添置北京及通州倉又令南京及淮安徐州臨清各倉實收通關户部刋印仍置號簿編寫內外字號用半印空填年月每年量印幾千道并外號簿發監收官執掌眼同該倉官攢查明填寫實收米數給付納户原籍官司告繳比對查考七年令法司犯贓徒流死罪官吏人等有力者編充通州各衛倉斗級如官攢軍斗人等有偷盜虛出等弊許首告得實放免仍賞鈔一千貫若通同偷盜作弊者加以重罪逃走者發口外充軍八年添設萬全都司都事一員提督所屬衛所倉十年置萬全都司赤城堡倉又令都察院副都御史一員總督南京各倉并各象馬房草場江北應天等五衛及鳳陽府各差郎中或員外郎或主事一員御史一員專一提督收放其郎中等官三年一代御史一年一代南京錦衣虎賁左右及鷹揚等四衛空間倉厫令户部委員外郎主事二員監督各該衙門銓撥倉官三十二員攢典三十二名軍斗一百六十名均派各倉收受糧斛又令本部郎中主事各倉場分管糧草三年更代正統初令南京户部侍郎一員總督各倉場糧草元年定通州五衛倉名在城中者為大運中倉城內東者為大運東倉城外西者為大運西倉又令南京六部推選郎中員外郎主事共六員各衛倉四員應天等六衛倉一員直𨽻鳳陽府倉一員監督收放又令各司府州縣無軍衛去處倉厫收糧不及一千石者官攢斗級裁革三年令各衛倉糧放支盡絶盤有粳粃米塵給與屯軍糞田又令本部侍郎一員同內官總督在京通州倉糧及提督象馬牛羊等房草豆革宣府大同各衛倉軍斗撥發囚人充當五年添設郎中主事五員分投提督德州倉并象馬等倉場收放又添設保德州判官一員於偏頭關倉監收支糧龍門守禦千户所吏目一員監收支糧七年榜諭各衛差委解支官軍月糧頭目不許擅立大小把總名色及官攢人等通同作弊違者令巡倉御史并本部管糧官拏問又令南京户部每嵗委員外郎或主事一員提督倉糧注銷糧數九年添設本部主事一員於山海提督收放兼巡視永平府界嶺口劉家口喜峯口倉場十年令總督在京通州倉侍郎兼提督臨清徐州淮安等處倉糧十四年令內外各倉場監督收放糧草郎中主事等官一年一代回日備開數目繳部仍將經行卷簿相沿交割若有虧折欺蔽續差官員徑自具奏革大軍倉官攢軍斗多餘之數止留大使一員副使一員攢典二名軍斗二十名景泰二年革南京總督倉場侍郎仍令副都御史一員總督三年令在京并通州倉軍斗收糧不及三萬石者每十名內摘發五名回衛又令南京各倉場監督官收放糧草託故回家致官攢人等循私作弊者照闒茸事例起送吏部又令南京各倉築立髙厚牆垣不許軍民人等就牆起蓋房屋牆外仍立冷鋪僉撥軍夫巡守革各倉場致仕官守把門禁止令辦事官一員管理又令各倉斗級庫子開寫年甲鄉貫住址編造文册候巡視官員點閘又令各倉官攢斗級人等不許勒要納户分例曬米地鋪及關糧人擡斛等項錢物又令各倉監收官員嚴督官攢庫斗人等修葺倉場開通溝渠其有曠職坐視淹沒糧草者拏問追賠四年令各倉收糧官攢軍斗不許小腳人等奪攬挑擔如納户自願雇倩者每米一百石止許小腳二十名又令直𨽻通州左等四衛并直𨽻武清衛各倉每副使一員照通州倉事例止僉撥軍斗一十五名添設山東按察司副使一員提督永平等處糧草兼理屯田五年令京倉納糧部運官遞串納户領籌其揚米摯斛行槩擡斛折席等項止許正設軍斗如納户自願雇人者聽六年令南京各倉放糧以勘合到日為始過違四十五日者扣除不支又令南京各倉止委御史及郎中等官巡視監督其本部巡倉官不必差委又令南京各倉照京通二倉會籌溜筒放米不許將帶錢物交通軍斗求打好米增多斛面違者拏問七年令京通二倉各處該納糙粳米未完者準以陳米補納仍令該倉應時放支不許存留又令兩京東安等四門倉收剩餘糧并篩揚不堪米數照光祿寺事例批寫數目即令納户領出該倉官攢刁難掯留者治罪天順元年令在京各倉場凡把持誆騙包攬坑陷納户攪擾倉場之人許人指實首告連當房家小發邊逺充軍添設户部郎中一員於永平山海薊州等處一員於宣府一員於大同俱提督糧草三年又令通州新城增置倉厫三百間七年奏準直𨽻淮安府常盈倉徐州廣運倉各存留大使一員副使二員攢典二名斗級一百名修倉夫匠二百名山東東昌府臨清倉存留大使一員副使一員攢典一名斗級二十名臨清廣積倉存留大使一員副使二員攢典二名斗級三十名二倉共存留修倉夫匠二百名各倉原設官攢等項多餘之數裁減八年又令考退倉場經歷大使副使等官仍支俸守支盡絶放回添設鳳陽府通判一員管理廣儲等六倉糧斛成化二年令本部管糧官提調官軍人匠修理倉厫仍令巡倉御史常川點視十一年令京通二倉各委本部員外郎一員定厫坐撥糧米務令挨次不許徇情虛占厫座十四年令南京倉場監督巡視等官凡浙江江西蘇松等處嫌疑地方之人照吏部銓官事例不許差委十六年令南京都察院委御史二員一員巡視各衛倉糧一員巡視象馬草場并光祿寺等衙門原設總巡御史裁革十八年奏準南京都察院委御史二員一員分管鼓樓以南一十九倉并中和橋馬草場及長安等四門倉糧草一員分管鼓樓以北一十八倉并金川門馬草場光祿寺犧牲所及各監局等衙門糧草二十三年令京通二倉并淮安徐州臨清水次各倉場內官原設者存留添設者取回革鳳陽府管糧通判仍留本部主事一員御史一員巡視𢎞治七年人南京錦衣等衛烏龍潭等四十一倉仍委本部員外郎主事八員分投提督十二年奏準凡京倉小腳歇家營求在官指稱公用為由索取囤基等項錢物及别項求索許被害之人赴總督及巡倉官處陳告就於本倉門首枷號一箇月軍發邊衛充軍民發口外為民干礙內外官員奏請定奪十三年奏準在京在外并各邊但係一應收放糧草去處若職官子弟積年光棍跟子買頭小腳跟官伴當人等三五成羣搶奪籌斛占堆行槩等項打攪倉場及欺凌官攢或挾詐運納軍民財物者杖罪以下於本處倉場門首枷號一箇月發落徒罪以上與再犯杖罪以下免其枷號屬軍衛者發邊衛屬有司者發附近俱永逺充軍內外倉場等處糧草并各處軍需等項不拘起運存留但有色攬誆騙不行完納事發問罪責限三箇月以裏完納者照常發落過期不完者儘其財産陪納發邊衛充軍經年不完者仍枷號一箇月照前發遣各邊武職主使家人伴當跟隨交結人員挾勢攬納作弊者參問降二級聽使之人仍照前例問發各處掌印官將所屬起解一應錢糧批文妄作人情攬與內外勢要官豪問發為民干擬勢豪參究治罪明會典卷三十九
