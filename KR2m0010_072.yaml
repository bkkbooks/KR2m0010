body:
  text: 明㑹典卷七十二禮部三十一大宴樂二永樂間定殿內侑食樂樂器麾一簫四笙四笛四塤二箎二排簫二琴四編鐘一編磬一柷一敔一搏拊一應鼓一樂章一奏上萬夀之曲龍飛定萬方受天命振紀綱彛倫攸叙四海康普天率土盡來王臣民舞蹈嵩呼載揚稱觴奉吾皇聖夀天長奏平定天下之舞引舞二人皆服青羅包巾青紅緑玉色羅銷金胸背襖子渾金銅帶紅羅褡禣皂雲頭靴青緑羅銷金包臀舞人三十二人服色與引舞樂工同樂章四邉靜威伏千邦四夷來賔納表章顯禎祥承乾象皇基永昌萬載山河壯刮地風聖主過堯勝禹湯立五常三綱八蠻進貢朝今上頓首誠惶朝中宰相燮理隂陽五榖收成萬民歡暢賀吾皇齊讃揚萬國來降二奏仰天恩之曲皇天眷聖明五辰順四海寧風調雨順百榖登臣民鼓舞樂太平賢良在位邦家永禎吾皇仰洪恩夙夜存誠奏黃童白叟鼓腹謳歌承應樂器笛四大鼓一小鼓一韸子二拍板二酒壺一酒鍾一杖鼓二樂章豆葉黃雨順風調五榖收成倉廩豐盈大利民生計賴著皇恩四海清鼓腹謳歌白叟黃童共樂咸寧奏撫安四裔之舞引舞樂工二人皆服紅氈帽紅羅銷金項帕紅青緑羅銷金襖子紅羅褡禣紅青緑羅銷金包臀皂雲頭靴攛掇樂器笛二頭管二􅌙二琵琶二水盞一韸子二拍板二二絃二高麗舞四人背服笠子青羅銷金胸背襖子銅帶皂靴琉球舞四人皆服綿布花手巾青羅大䄂襖子銅帶白碾光絹間道踢褲皂皮鞋北畨舞四人皆服狐帽青紅紵絲銷金襖子銅帶伍魯速回回舞四人皆服青羅帽比里罕綿布花手巾銅帶皂靴樂章小將軍順天心聖德誠化畨邦盡朝京東方歸伏舞於龍廷貢皇明寶貝擎殿前歡四裔率土歸王命都來仰大明萬邦千國皆歸正現帝庭朝仁聖天階班列衆公卿齊聲歌太平慶豐年和氣增鸞鳯鳴紫霧生祥雲朝霞映爇金爐香味馨列丹墀御駕盈絃管簫韶五音應龍笛間鳯笙渤海令金杯中酒滿盛御案前列羣英君德成皇圖慶嵩呼萬嵗聲過門子聖主興聖主興顯威靈蠻夷靜至仁至德至聖明萬萬年帝業成三奏感地德之曲皇心感地靈順天時德厚生含𢎞光大品物亨鍾竒育秀産俊英河清海宴麟來鳯鳴隂陽永和平相我文明奏車書㑹同之舞舞人三十四人皆服皂羅頭巾青緑玉色皂沿邉襴茶褐線絛皂皮四縫靴樂章新水令錦衣花帽設丹墀具公服百司同㑹麟至舞鳯來儀文武班齊朝賀聖明帝水仙子八方四面錦華夷天下蒼生仰盛德風調雨順升平世世遍乾坤皆讃禮託君恩民樂雍熙萬萬年皇基堅固萬萬載江山定體萬萬嵗洪福天齊四奏民樂生之曲世間的萬民荷天地感聖恩乾坤定位四海春君臣父子正大倫皇風浩蕩人心載醇熙熙樂天真永戴明君奏表正萬邦之舞引舞二人皆執紅纓纛服青羅包巾紅羅銷金項帕紅生絹錦領中單紅生絹銷金通袖襖子青綿絛銅帶織錦臂鞲皂雲頭靴各色羅銷金包臀紅絹搭膊舞人樂工六十四人皆執干一小鉞斧一服色與引班同樂章慶太平奸邪濁亂朝綱搆禍難煽動戈戕赫怒吾皇親征壩上指天戈敵皆降武士歡白溝戰場旌旗雲合迷日光令嚴氣張三軍踴躍齊奮揚掃除殘甲如風蕩凱歌傳四方仁聖不殺降望河南失攙搶滚繡毬肆旅拒恃力强一心搆殃築滄州百尺城隍聘蠆毒恣虎狼孰能禦當順天心有德隆昌倒戈斂甲齊歸降撫將生還逹故鄉自此仁聞愈彰陳陳贏不數孫吳兵法良神謀睿算合陰陽八陳堂堂行天上虎略龍韜孰敢當俘囚十萬皆踈放感荷仁恩戴上蒼得勝回兩旁四方展鳥翼風雲鴈行出竒兵敵難量士强馬强遍百里眠旗卧鎗勝兵回樂洋洋小梁州敵兵戰敗神魂喪擁貔貅直渡長江開市門肆不移宣聖恩如天曠綸音頒降普天下仰吾皇五奏感皇恩之曲當今四海寧頌聲作禮樂興君臣慶㑹齊太平衣冠濟濟宴彤庭文臣武將共荷恩榮忠心盡微誠仰答皇明奏天命有德之舞引舞二人俱執紅纓纛服青幪紗如意冠紅生絹錦領中單紅生絹大袖袍各色絹綵畫直纒黑角偏帶藍絹綵皂雲頭皮鞋白布襪舞人樂工六十四人皆執紅漆羽籥雉雞尾服色與引舞樂工同樂章慶宣和雨順風調萬物熙一統華夷四野嘉禾感和氣一幹百穗一幹百穗窄磚兒梯航萬國來丹陛太平年永固洪基正東西南北來朝㑹洽寰宇布春暉四裔咸賔聲教美自古明王在慎德不須威武服強敵祥瑞集鳯來儀佳期萬萬嵗聖明君主華夷六奏慶豐年之曲萬方仰聖君大一統撫萬民豐年時叙雨露均穰穰五穀貨財殷酣歌擊壤風清俗淳四裔悉來賔正統皇仁七奏集禎應之曲皇天眷大明五星聚兆太平騶虞出現甘露零野蠶成繭嘉禾生醴泉湧地河水清乾坤萬萬年四海永寧八奏永皇圖之曲天心眷聖皇正天位撫萬邦仁風宣布禮樂張戎夷稽首朝明堂皇圖鞏固賢臣贊襄太平日月光地久天長九奏樂太平之曲皇恩被八紘三光明四海清人康物阜嵗屢登含哺鼓腹皆歡聲民歌帝力唐堯至仁乾坤永清共樂太平丹陛大樂樂器戲竹二簫十二笙十二笛十二頭管十二􅌙八琵琶八二十絃八方響二鼓一拍板六杖鼓十一升座還宫樂章萬嵗樂與洪武間同百官行禮樂章朝天子與洪武間同導膳樂樂器戲竹二笙六笛六頭管六鼓一拍板二杖鼓八􅌙四樂章水龍吟與洪武間同迎膳樂樂器笙四笛四頭管四􅌙二方響一大鼓一拍板一杖鼓四樂章與導膳同進膳樂樂器笙四笛四頭管四􅌙二方響一鼓一拍板一杖鼓四樂章太清歌上清歌開天門俱與洪武間同大祀慶成纓鞭得勝蠻夷隊舞萬夀聖節九夷進寶隊舞冬至節讃聖喜隊舞正旦節百戲蓮花盆隊舞小宴樂侑食樂樂器簫二笙二􅌙二一奏本太初之曲朝天子混兮沌兮水土成原氣不分南北與東西未辨天和地萬象包涵其中祕密難窮造化機是陰陽本體乃為之太極兩儀因而立二奏仰大明之曲殿前歡太極兮混然方始見儀形清浮濁偃乾坤定日月齊興照青霄萬象明陽須動隂須靜隂與陽皆相應流行二氣萬物俱生奏百戲承應三奏民初生之曲沽美酒乾坤清宇宙寧六合淨四維正萬象原來一氣生定三才五行民與物共成羣太平令為一類不分人品竟生食豈曉庖烹避寒暑巢居穴遁披樹葉相尋趂如何是愛親世情治生雖混然各安其性奏百戲承應四奏品物亨之曲醉太平黎民生世間萬物長塵寰隂陽交運轉循環久逺時庶繁相傳氣候應無間品物交錯慿誰鑒望聖人出世整江山主萬民得安奏百戲承應五奏御六龍之曲清江引人心久仰生聖君天使人生聖聖人受天機體天居中正御六龍聖明登九重碧玉簫君坐神京海嶽共從新民仰君恩聖治有人倫人品分萬物增聖承乾百福臻垂法明尊天命興後朝皆從正奏百感承恩六奏泰階平之曲十二月聖乃有言天天是無言聖聖人臨正萬物亨通恩威盛社稷安仁德感江山定選用英賢興王正分善惡賞罰均平三公九卿左右股肱庶士康寧奏百戲承應七奏君德成之曲十二月皇基以興聖帝修身奉天體道聖德踰明敬天地勤勞萬民立法度下咸寧堯民歌風俗禮樂厚彛倫愛興學校進儒經賢臣良將保朝廷四野人民頌歡聲用的是賢英賢英定太平寰海皆歸正奏百戲承應八奏聖道行之曲金殿萬年歡三綱既定九疇傳興聖道如天嘉禾齊秀寒暑和平聖威無邉皇基穩勝磐石慶雲生景星長現三光輝耀百穀收成萬姓安寧德勝令聖德感皇乾甘露降山川萬邦來朝貢竒珍擺布全玉階下鳴鞭仰聖主升金殿丹墀列英賢讃吾皇豐稔年奏百戲承應九奏樂清寧之曲即普天樂萬邦寧皇圖正父君母后天下咸欽君治外永聖明后治內長安靜後聖承乾皆從正德相傳聖子神孫天威浩蕩江山永固洪福無窮沽美酒和氣生滿玉京祥烟起映皇宫明聖開基整萬民風雲㑹帝庭奏簫韶九韻成太平令紫霧隱金鸞彩鳯祥光罩良將賢臣玉案列珍羞美醖寶鼎爇龍涎香噴至尊永寧儲嗣守成賀萬萬嵗一人有慶奏魚躍于淵承應設立大樂樂器笙二笛二頭管二􅌙二鼓一板一杖鼓八升殿還宫百官行禮樂章萬嵗樂與前同進膳樂章水龍吟與前同永樂間奉天門宴百官止用本太初仰大明民初生三奏樂章進酒進膳樂同惟百官行叩頭禮用朝天子樂章宴畢導駕還宫用御鑾歌東宫宴樂樂器簫四笙四􅌙二樂章一奏喜千春之曲賀聖朝開國承天聖感極多總一統封疆濶百姓快活萬物榮光共沐恩波仙音韻合讃升平詠歌齊朝拜千千嵗東宫滿國春和二奏永南山之曲水仙子洪基永固海波清盛世明時禮樂興華夷一統江山靜民通和樂太平讃東宫仁孝賢明秉鈞衡端正順乾坤泰亨坐中華萬世昌寧奏百戲承應三奏桂枝香之曲蟾宫曲曉光融宴享春宫日朗風和嘉氣葱葱鎮領台樞規宏綱憲禮節至公事聖上柔聲婉容問安寧勤孝䖍恭果斷寬宏剛健文明聖德合同奏百戲承應四奏初春曉之曲小梁州端拱嚴宸事紫微秉運璇璣四時百物總相宜仰賴明君德大業勝磐石皇儲仁孝明忠義美遐方順化朝儀孝能歡慈愛心敬篤上尊卑意禮上和下睦民鼓舞樂雍熙奏百戲承應五奏乾坤泰之曲滿庭芳春和玳筵安邦興國欽聖尊賢文英武烈於民便禮樂成全享太業中庸不遍順天常節儉為先逹文獻嚴儀訓典孝敬億千年奏百戲承應六奏昌運頌之曲喜秋風文武安軍民樂宴文華㑹班僚五雲齊動鈞天樂賀春宫讃皇朝奏百戲承應七奏泰道開之曲沽美酒布春風滿畫樓對嘉景鳯凰洲高捧金波碧玉甌設威儀左右分品從列公侯太平令效聖上誠心勤厚主宗器嚴備春秋諧律吕仙音齊奏欽王政皇天保佑拜舞頓首讃祝進酒千千嵗康寧福壽迎膳樂樂器戲竹二笙四笛四頭管四􅌙二琵琶二鼓三拍板二杖鼓四樂章水龍吟方響笙􅌙鼓樂喧排寶器開玳筵鸞儀旌節錦繡景相連簮纓趨進皆來朝見春滿文華殿升殿還宫樂章千秋嵗與前同明㑹典卷七十二
