body:
  text: 明㑹典卷三吏部二官制國初官制具載於諸司職掌至洪武末漸加更定革除年間多所變易永樂初悉復其舊暨建兩京各衙門官職并置繁簡隨宜其後亦或因事損益而綱維體統一遵舊制今具列於後其所損益者各附本條之下南京所减員數正佐多寡不一不復備列諸司職掌凡內外各司府州縣衙門并合屬倉庫河泊所稅課司局驛遞閘壩僧道醫術大小衙門合設官員及五軍都督府并各衛所軍職文官制度并令典名數務要周知在京太師太傅太保少師少傅少保國初置三公府後不設官不特授但為大臣加官及贈官太子太師太子太傅太子太保太子少師太子少傅太子少保太子賓客已上皆東宫官不專授但為大臣兼官加官或贈官宗人府正官宗人令左右宗正左右宗人首領官經歷一員吏部正官尚書一員左右侍郎各一員屬官選部司封司勳考功四部後為文選驗封稽勳考功四清吏司郎中各一員員外郎各一員後設主事各一員文選司洪武二十一年添設主事一員考功司正統十一年添設主事一員首領官選部等四部主事各一員初選部等部各有印信又有主事印洪武二十九年改部為司郎中員外郎主事連銜僉書革去主事印司務四員後止設二員户部正官尚書一員左右侍郎各一員永樂後添設提督倉場侍郎一員或尚書屬官浙江等十二部後為浙江江西湖廣陜西廣東山東福建河南山西四川廣西貴州雲南十三清吏司郎中各一員員外郎各一員後設主事各一員浙江司正統二年添設主事一員十四年又添一員本年又添一員江西司正統五年添設主事一員七年又添設一員八年添設郎中一員總理宣府糧儲十四年又添設主事一員湖廣司正統二年添設主事一員十四年又添一員成化六年又添一員陜西司正統三年添設主事二員十四年又添一員廣東司正統元年添設主事一員四年又添一員十四年又添一員山東司正統二年添設主事一員七年又添一員九年又添一員十四年又添一員後革𢎞治十三年又添設郎中一員遼東管糧原在貴州司今改本司福建司正統六年添設主事一員十年又添一員十四年又添一員後又添一員後革一員河南司正統元年添設郎中一員後革二年添設主事二員十四年又添一員山西司宣德元年添設主事一員承運庫辦事四年又添一員七年添設郎中一員大同管糧正統元年又添一員薊州管糧二年又添主事一員十四年又添一員四川司宣德七年添設員外郎一員後革正統元年添設主事一員二年又添一員七年添設郎中一員後革十四年又添主事一員廣西司正統十四年添設主事一員成化元年又添一員三年又添一員貴州司正統二年添設主事一員十四年又添一員成化元年又添一員雲南司宣德七年添設員外郎一員後革九年添設主事一員後革正統二年添一員專管收放蘇常等府草價銀八年又添一員專管監督御馬監草料九年又添二員專管提督山海等處糧儲景泰元年添設郎中一員後革首領官浙江等十二部主事各二員內北平部四員後改革與郎中員外郎連銜僉書照磨所照磨一員檢校一員司務四員後止設二員所屬衙門寶鈔提舉司提舉一員副提舉一員後不設典史一員後革抄紙局大使一員副使一員後不設印鈔局大使一員副使一員後不設廣盈庫後添設大使一員副使一員寶鈔廣惠庫大使一員副使一員廣積庫大使一員副使一員典使一員贓罰庫大使一員副使二員外承運庫後革大使一員副使一員甲乙丙丁戊字庫大使各一員副使六員丙丁字庫二員行用庫後革大使一員副使一員御馬倉後添設大使一員副使一員軍儲倉後革大使一員副使一員張家灣檢校批驗所南京大使一員副使一員龍江鹽倉檢校批驗所南京大使一員副使一員禮部正官尚書一員左右侍郎各一員屬官儀部祠部主客部膳部後為儀制祠祭主客精膳四清吏司郎中各一員員外郎各一員後設主事各一員儀制司正統六年添設主事一員祠祭司正統六年添設主事一員主客司正統等年添設主事二員首領官儀部等四部主事各一員後改革與郎中員外郎連銜僉書司務四員後止設二員所屬衙門儀禮司後改為鴻臚寺另開於後司正一員後改為卿左右副使二員後改為少卿左右司丞四員後改為寺丞革二員鳴贊四員後改為屬官添設五員序班四十四員後為屬官革十員首領官後添設主簿一員後添設屬官後添設司儀署後添設署丞一員後添設司賓署後添設署丞一員後添設行人司司正一員左右司副二員行人三百四十五員後減為三十七員鑄印局大使一員副使二員後添設一員教坊司奉鑾一員左右韶舞二員左右司樂二員兵部正官尚書一員左右侍郎各一員屬官司馬職方駕部庫部後為武選職方車駕武庫四清吏司郎中各一員員外郎各一員後設主事各一員武選司洪武宣德等年添設主事三員正統十年添設員外郎一員後又添設郎中一員車駕司正統十四年添設主事一員成化三年添設郎中一員職方司洪武三十五年添設主事一員後又添三員正統十年添設郎中一員武庫司正統十四年添設主事一員𢎞治九年添設員外郎一員首領官司馬等四部主事各二員後改革與郎中員外郎連銜僉書司務四員後止設二員所屬衙門典牧所南京設提領一員大使一員副使一員後革典史一員㑹同館大使一員副使一員後添設一員大勝關大使一員副使一員刑部正官尚書一員左右侍郎各一員屬官浙江等十二部後為浙江江西湖廣陜西廣東山東福建河南山西四川廣西貴州雲南十三清吏司郎中各一員員外郎各一員後設主事各二員正統六年各司俱添設主事一員廣西司四川司成化元