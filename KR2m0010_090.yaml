body:
  text: 明會典卷九十禮部四十九喪禮一大喪禮洪武三十一年遺詔一天下臣民令到出三日皆釋服嫁娶飲酒皆無禁一母發民哭臨宫殿中當臨者皆以旦晡各十五舉哀禮畢非旦晡臨毋得擅哭一當給喪事及哭臨者皆毋跣絰帶毋過三寸無布車兵器一諸王各於本國哭臨不必赴京中外管軍戍守官員毋得擅離信地許遣人至京一王國所在文武衙門官民軍士今後一聽朝廷節制護衛官軍王自處分一諸王不在令中者皆以此令比類從事本部議奏事宜一在京五府六部等衙門官員聞喪次日各易素服烏紗帽黑角帶赴內府聽宣遺詔畢於本衙門齊宿素服朝晡詣几筵哭仍各置孝服至第四日成服朝晡哭臨至葬畢而止仍自成服日為始服孝服二十七日而除其命婦亦於第四日各具孝服由西華門入哭臨不許戴金銀首飾一諸王世子郡王王妃郡王妃郡主內使宫人等俱服斬衰三年自聞喪第四日成服為始二十七月而除凡臨朝視事素服烏紗帽黑角帶退朝服衰服一官員麻布大䄂圓領衫不緝邊麻布帽就用所戴帽以布裹之仍垂帶麻腰絰麻鞋一命婦麻布大袖圓領長衫麻布蓋頭一明器行移工部及內府司設監等衙門成造照衣生存所用鹵簿器物名件一作神主用栗木為之制度依家禮一差行人齎捧遺詔前去各布政司并直隸府州衙門開讀一在外大小衙門文武官人等詔書到日素服烏紗帽黑角帶行四拜禮跪聽宣訖舉哀再行四拜禮畢仍各置孝服至第四日成服為始每旦率合屬官僚人等於本衙門朝闕設香案哭臨三日而除一在外大小衙門各令官一員赴京致祭所用香燭祭物本部備辨永樂二十二年遺詔喪服禮儀一遵太祖皇帝遺制本部議奏事宜一宫中自皇太子以下成服日為始服斬衰二十七月而除親王世子郡王及王妃世子妃郡王妃公主郡主以下聞喪皆哭盡哀行五拜三叩頭禮第四日成服斬衰二十七月而除凡王親事素服烏紗帽黑角帶退服衰服服內並停音樂嫁娶其祭祀止停百日一在京文武官初聞喪素服烏紗帽黑角帶明日清晨詣思善門外哭五拜三叩頭退各置斬衰服於本衙門宿歇不飲酒食肉第四日成服具衰服詣思善門外朝夕哭臨三日又朝臨十日供熙後朝臨七日各十五舉聲成服日為始服衰服二十七日凡入朝及衙門視事用布裹紗帽垂帶素服腰絰麻鞋退服衰服二十七日之外素服烏紗帽黑角帶二十七月而除聽選辦事等官服衰服監生吏典僧道人等素服以成服日為始皆赴順天府朝闕設香案朝夕哭臨三日又朝臨十日洪熙後朝臨七日各十五舉聲仍各素服二十七日而除文武官命婦聞喪第四日各服麻布大䄂圓領長衫麻布蓋頭清晨由西華門入哭臨三日命婦去金銀首飾素服二十七日凡音樂祭祀官員軍民人等停一月軍民素服婦人素服不粧飾俱二十七日一在外俱以聞喪日為始令到日之文武官員素服烏紗帽黑角帶行四拜禮跪聽宣讀訖舉哀再行四拜禮畢各置斬衰服於本衙門宿歇不飲酒食肉第四日成服每旦率合屬官僚人等服衰服就本衙門朝闕設香案朝夕哭臨三日又朝臨十日洪熙後無朝臨十日禮各十五舉聲成服日為始服衰服二十七日衙門視事用布裹紗帽垂帶素服腰絰麻鞋退服衰服二十七日後素服烏紗帽黑角帶二十七月而除文武官命婦聞喪素服舉哀三日各十五舉聲去金銀首飾素服二十七日而除軍民男女皆素服一十三日凡音樂祭祀官員軍民人等並停百日男女嫁娶官員停百日軍民停一月一在京文武官孝服每員官給麻布一匹自製四裔使臣工部造與孝服諸王公主遣官及內外文武官員人等詣几筵祭祀者光祿寺備祭物翰林院撰祭文引赴思善門外行禮各處進香官辭歸者諸王公主所遣臨期司禮監請㫖給賜其方面官與路費鈔二十錠餘十錠一京城聞喪日為始寺觀各聲鍾三萬杵禁屠宰四十九日一上尊諡儀前期三日齊戒前一日遣官祭告天地宗廟社稷如常儀是日內侍官置冊寶輿于奉天門捧冊寶置輿中皇帝具衰服詣奉天門內侍官舉冊寶輿導引官導皇帝後隨降階升輅百官序立金水橋南北向俟冊寶輿將至皆跪冊寶輿過畢興隨皇帝後至思善門外序立北向皇帝降輅冊寶輿由中門入至几筵殿丹陛上導引官導皇帝由左門入內贊唱執事官各司其事導引官導皇帝就丹陛上拜位捧冊寶官捧冊寶由左門入至几筵前分左右立北向導引官奏四拜皇太孫親王皇孫陪拜丹陛上百官陪拜思善門外內贊及鴻臚寺官同時傳贊四拜畢導引官導皇帝由殿左門入詣大行皇帝神位前奏跪內贊及鴻臚寺官傳贊皇太孫以下及百官皆跪奏進冊捧冊官跪進冊于皇帝之左皇帝受冊獻畢授捧冊官置于案奏進寶捧寶官跪進寶皇帝受寶獻畢授捧寶官置于案奏宣冊宣冊官跪宣冊于皇帝之左畢奏宣寶如宣冊畢奏俯伏興平身四拜傳贊亦如之奏復位導引官導皇帝由殿左門出就拜位奏四拜傳贊同禮畢行祭禮導引官導皇帝詣几筵前就拜位奏四拜畢奏跪獻酒畢贊讀祝讀祝官讀畢亞獻終獻禮並如初奏四拜傳贊並同畢導引官導皇帝由左門入詣神位前捧冊寶授內侍官捧入導引官導皇帝入內置冊寶畢奏叩頭畢導引官導皇帝由左門出至丹陛上奏禮畢傳贊同導引官導皇帝還宫一二十七日以後皇帝服素冠麻衣麻絰臨朝退仍衰服一葬祭等儀發引前三日行奏告禮百官預齊戒三日遣官以葬期告天地宗廟社稷皇帝衰服告几筵皇太子親王以下皆衰服隨班行禮是日後百官衰服朝一臨至發引日止京師內外禁樂至祔祭日止禁屠宰至葬畢日止發引前一日遣官祭金水橋午門端門承天門御橋大明門德勝門清河橋沙河京都應祀神祇并經過去處應祀神祠是夕設辭奠皇帝后妃皇太子親王以下皆衰服以序致祭司禮監禮部錦衣衛官提督執事者設大升輿於午門外依圖式陳設葬儀於午門外并大明門外發引日設啓奠內侍陳設禮饌拜位如常儀內導引官導皇帝衰服詣拜位皇太子親王以下各就拜位贊禮贊四拜奠帛獻酒讀祝四拜舉哀興哀止望瘞禮畢內導引官導皇帝詣几筵殿內稍東西向立皇太子親王以下丹陛上稍東立執事者升徹帷幕等物拂拭梓宫畢內待徹啓奠內執事官進龍輴于几筵殿下設真亭神帛輿諡冊寶輿于丹陛上設祖奠如啓奠儀畢內導引官導皇帝詣梓宫前稍東西向立導皇太子由殿左門入立于皇帝之南稍東西向親王以下俱於丹陛上稍東西向立內侍於梓宫前跪奏請靈駕進發內侍捧諡冊寶次捧神帛由殿中門出各置輿內次捧銘旌由中門出執事官升捧梓宫內執事持翣左右蔽梓宫降殿內侍官於梓宫前跪奏請梓宫升龍輴執事官奉登龍輴訖以綵帷飾梓宫執翣仍列左右內侍繖扇侍衛如儀列舊所御儀仗居前諡冊神帛真亭銘旌以次而行內導引官導皇帝由殿左門出后妃皇太子親王及宫眷後隨至午門內設遣奠如祖奠儀進帛爵讀祝官各隨地之所宜立侍於梓宫前跪奏請靈駕進發司禮監官率儀衛諡冊寶輿等前行皇帝后妃皇太子親王以下皆哭盡哀內侍於皇帝前跪奏請還宫內侍導引皇帝還宫后妃以下俱還宫執事舁梓宫由中門出至午門外禮官跪奏請梓宫升大升輿執事官奉梓宫升輿訖禮官跪奏請靈駕進發司禮監禮部錦衣衛整視葬儀以次前行皇太子親王以下哭送靈駕出至端門外行辭祖禮執事官預設褥位于太廟中香案前梓宫至端門外禮官跪奏請辭祖導引官導皇太子易常服詣神帛輿前跪禮官捧神帛授皇太子皇太子捧神帛輿由廟街左門入至太廟褥位跪置神帛于褥興皇太子正立於神帛後贊禮贊跪皇太子跪禮官跪于皇太子之左奏太宗文皇帝謁辭禮官興贊禮贊俯伏興皇太子俯伏興贊五拜三叩頭禮畢皇太子跪捧神帛興仍由廟左門出至輿前以神帛授禮官禮官跪受神帛安奉輿中訖跪奏請靈駕進發皇太子仍喪服親主以下隨行梓宫由承天門大明門中門出皇太子親王以下俱由左門出步送至德勝門外騎送至陵在途并至陵俱朝夕奠哭臨諸王皇親駙馬公侯伯及文武百官軍民耆老四品以上命婦以序沿途設次致祭祭畢文武官不係山陵執事及分送者并命婦耆老悉還大升輿行緣途每程預設校尉舁送選委內官同錦衣衛官專一提督務在起止有節行步安徐緣途宿頓之處預先搭蓋席殿仍量蓋席房以貯儀仗等物至陵執事官先陳龍輴于獻殿門外俟大升輿至禮官詣大升輿前跪奏請靈駕降輿升龍輴詣獻殿執事官奉梓宫升龍輴由中門入皇太子親王俱由左門入詣獻殿安奉訖諡冊寶等輿仍陳於前行安神禮執事陳禮饌如常儀設皇太子拜位于梓宫前內侍導皇太子詣拜位贊四拜興贊跪奠酒讀祝俯伏興贊四拜舉哀興哀止贊禮畢親王以下陪拜如常儀遣官祀后土并天壽山俟掩𤣥宫設遷奠執事官陳禮饌如常儀設皇太子拜位于梓宫前內侍導皇太子詣拜位贊四拜興贊跪奠帛奠酒讀祝訖俯伏興贊四拜舉哀興哀止望瘞親王以下陪拜如常儀退將掩𤣥宫內侍導皇太子親王以下詣梓宫前跪內侍奏請靈駕赴𤣥宫俯伏興執事官升奉遷梓宫入皇堂安奉訖內侍捧諡冊寶置于前陳列明器等畢行贈禮執事官陳禮饌于皇堂門外奉玉帛安置于香案前設皇太子拜位于前內侍導皇太子詣拜位贊四拜興贊跪贊奠酒贊進贈執事官捧玉帛跪進于皇太子之右皇太子受玉帛獻畢以受內執事捧入皇堂安置訖贊俯伏興皇太子俯伏興贊四拜舉哀興哀止贊贈事畢內侍出遂掩𤣥宫掩畢行享禮于𤣥宫前如遷奠儀遣官祀后土及祭天壽山掩𤣥宫將畢內侍設香案于𤣥宫門外陳禮饌如儀設題主案于香案前西向設皇太子拜位于前北向內侍盥手出主于案上題主官盥手西向題主畢內侍奉主置于神座藏神帛于箱中置其後內侍跪奏請太宗文皇帝神靈上神主奏訖贊四拜興贊跪獻酒讀祝俯伏興贊四拜舉哀興哀止內侍啓櫝受主訖跪奏請神主降座升輿奉神主升靈輿至獻殿上內侍跪奏請神主降輿升座奉神主即座訖行初虞禮執事官陳禮饌于神主前設皇太子拜位于香案前內侍引皇太子就拜位贊四拜興贊行初獻禮贊跪皇太子跪奠帛奠酒讀祝畢俯伏興亞獻終獻贊四拜舉哀興哀止望瘞禮畢內侍捧神帛箱埋于殿前屏處潔地焚凶器于野葬日初虞柔日再虞剛日三虞後間日一虞至九虞止在途皇太子行禮還京皇帝親行禮神主啓行將還內侍於神主前跪奏請神主降座升輿還京奏訖俯伏興於靈座上奉神主升靈輿進行儀仗侍衛如儀皇太子後隨在途仍朝夕奠神主還京先於城外置幄次錦衣衛教坊司備鼓吹不作百官衰服奉候城外神主至入幄次百官序列於前行五拜三叩頭禮畢侯神主進行百官後從至午門外儀衛等退導引官導皇帝衰服奉迎于午門內神主至舉哀步導神主升几筵殿內皇帝立于殿上稍東西向內侍于靈輿前跪奏請神主降輿升座奏訖捧神主安奉于靈座訖行安神禮執事官陳設如常儀內導引官導皇帝詣拜位奏四拜興奏跪奠湭讀祝俯伏興奏四拜舉哀興哀止奏禮畢皇太子親王以下陪拜如常儀百官於思善門外隨班行禮傳唱如儀明日百官行奉慰禮虞祭內侍陳禮饌拜位于几筵前如常祭儀內導引官導皇帝衰服詣拜位皇太子親王以下衰服各就拜位行四拜禮初獻奠帛獻酒讀祝亞獻終獻贊四拜舉哀興哀止望瘞禮畢卒哭用虞祭後剛日禮同虞祭自是惟朝夕奠祔享用卒哭之明日太常寺陳設禮饌于太廟如常享儀樂設而不作設儀衛繖扇于午門外內侍官設皇帝拜位于几筵殿上進御輦于殿前丹陛上內導引官導皇帝衰服詣拜位贊四拜舉哀興哀止立於拜位之東西向內侍詣靈座前跪奏請太宗文皇帝神主降座升輦詣太廟祔享奏訖內侍捧神主由殿中門出安奉于御輦內侍執繖扇侍衛如儀至思善門外皇帝易祭服升輅後隨至門外儀衛繖扇列于太廟南門外之左右導引官導皇帝詣御輦前贊跪皇帝跪太常卿跪奏請太宗文皇帝神主降輦詣太廟祔享奏訖贊俯伏興皇帝俯伏興導引官導皇帝捧神主由左門入典儀唱樂舞生就位執事官各司其事至丹陛典儀唱太宗文皇帝謁廟內贊奏請詣神主前至廟前內侍捧神主置褥位朝于北皇帝於神主後行八拜禮各廟俱八拜禮畢內侍捧神主太常卿立壇東西向唱賜座皇帝搢主內侍捧神主進于皇帝皇帝捧神主安于座導引官導皇帝詣拜位行祭禮如時享儀文官五品以上武官四品以上隨班行禮禮畢太常卿於神主前跪奏請太宗文皇帝神主還几筵奏訖導引官導皇帝捧神主由廟左門出至門外安奉于御輦儀衛繖扇導從如來儀皇帝升輅後隨至午門外儀衛止皇帝至思善門降輅釋祭服易衰服隨御輦至几筵殿前內侍於輦前跪奏請神主降輦升座內侍奉神主升座訖內導引官導皇帝由殿左門入行安禮禮如前儀禮畢皇帝釋服還宫明日百官素服烏紗帽黑角帶行奉慰禮一大祥奉安神主神座儀物于太廟前一日遣官祭告太廟至日上祭告几筵殿皇太后皇后以下各祭一壇王府遣官共祭一壇在京文武官員共祭一壇一禫祭遣親王詣陵行禮洪熙元年遺詔山陵制度務從儉約喪制用日易月皆以二十七日釋服毋禁嫁娶音樂在外親王藩屏為重不可輒離本國各處總兵鎮守備禦重臣及文武大小官員亦毋擅離職守聞喪之日止於本處朝夕哭臨三日悉免赴闕行禮其本部奏議事宜自聞喪日為始不鳴鍾鼓在京禁屠宰十三日諸王世子郡王及王妃郡主以下並遵遺詔喪服二十七日而除既上尊諡禮畢乃頒詔是日百官素服烏紗帽黑角帶先俟于承天門外上翼善冠素服黑角帶御奉天門執事官入行五拜三叩頭禮鴻臚寺官奏請升殿嗚鞭訖序班設詔案尚寶司用寶畢鳴讃唱請頒詔以詔授禮部官置于案序班舉案由左門出用傘導至承天門文武百官先行四拜禮平身贊禮稱有制百官跪聽開讀訖再行四拜禮禮畢百官以次出祔廟後上仍素服御西角門視朝遇時享等禮太常寺奏祭祀其日早鳴鍾鼓上始服黃袍御奉天門視朝時享畢仍素服御西角門視朝至禫祭後始釋素服成化二十三年大祥以後儀前期三日齊戒前一日遣官詣太廟行祭告禮用祝文至日侵晨設酒果於几筵殿設神主輦一冊寶亭二于殿前丹陛上上服淺淡服行祭告禮畢司禮監官詣几筵殿前跪奏請神主升輦詣太廟奏訖內侍捧神主冊寶俱由殿中門出安奉于輦及冊寶亭內侍擎執繖扇侍衛如儀上隨行至右順門上易祭服升輅後隨至午門外儀衛繖扇導至廟街門內儀衛繖扇分列于太廟南門外之右上降輅司禮監官導上詣神主輦前贊跪上跪司禮監官于上左跪于神主輦前奏請神主奉安太廟奏訖贊俯伏興上俯伏興導引官前導內侍捧神主冊寶前行上後隨由中門入至寢廟奉安訖上叩頭興導引官導上由殿東門轉至丹陛上祭祀如時祭儀樂設而不作用祝文文武官具祭服隨班行禮祭畢上仍祭服升輅詣武英殿前降輅升几筵殿奉迎神位內侍舉神位亭前行由中門出上升輅後隨由思善門入至奉先殿門外上降輅司禮監官導上詣神位亭前贊跪上跪司禮監官于上左跪于神主亭前奏請神位奉安奉先殿奏訖贊俯伏興上俯伏興導引宮前導內侍於亭內捧神位前行上後從由中門入至奉先殿奉安訖上叩頭興就位行祭告禮用酒果用樂用祝文至禫祭免朝一日擇日遣官詣陵致祭明㑹典卷九十
