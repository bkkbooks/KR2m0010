body:
  text: 明會典卷二十六户部十一度支科經費國朝賞賜用鈔錠胡椒蘇木銅錢並銀兩衣服等項不一其係禮兵二部掌行者具見各部惟嵗給軍士冬衣布花等件係本部掌行故備載於此諸司職掌凡在京賞賜該用鈔錠本部量數具奏於內府關支凡有欽賞官軍人等當該衙門將該賞人名鈔數於本部委官處磨算相同將該賞數目附簿驗名給散其委官仍將日逐各起賞過鈔數開呈本部立案備照候季終本部將原關並賞過鈔數通類具奏及賞賜胡椒蘇木銅錢等項亦如之其在外如有欽依賞賜官軍及賑濟饑民等項本部約量會計鈔錠具奏委官赴內府照數關領㸃閘明白於户科給批差人管運仍行移所在官司如運鈔到彼照依坐去則例眼同驗名給散造冊回報本部以憑稽考事例洪武三年給賞四川鹽井等六衛軍士每名綿布二匹綿花一斤仍加絹一匹六年給賞北平軍士永平居庸古北口為一等密雲薊州為一等北平在城為一等通州真定為一等二十八年令陜西行都司甘州等衛新發充軍者照舊軍事例給賞冬衣布花一年以後减半永樂五年令賞賜北平各衛軍士冬衣布花該布絹三匹者內絹一匹折與蘇木一斤八兩該布二匹者一匹折蘇木一斤該布一匹者仍舊奉天征討旗軍原衛無家小并全家在京者全賞其北京有家小者在京賞綿布一匹原衛家小布二匹綿花一斤八兩為事發充局匠布一匹牧馬千戶所養馬幼軍於贓罰庫關賞舊衣三件八年令甘州等衛洪武三十一年以後充軍人數照舊軍例給賞冬衣布花十一年令南京操練民間子弟並餘丁幼軍照例給賞夏布十四年令在京各衛軍士該賞夏布三匹及二匹者內各一匹折新鈔三錠十五年令北京所屬衛所軍士全賞本色布花遼東都司所屬衛分正軍恩軍有家小者綿布二匹綿花一斤八兩隻身旗軍並養羊小厮及老幼久病殘疾復役未及三年逃軍並習學軍匠綿布一匹綿花一斤八兩幼軍一歲至五歲隻身在營有一母伯叔父母一姐者並六歲至十四歲隻身者各給綿布一匹綿花一斤若在營有一母一伯叔父母一姐一妹一弟者照養羊小厮例十七年定賞山西都司所屬衛分布花則例振武衛正軍有家小綿布四匹綿花一斤八兩隻身旗軍並巡營守門鋪養馬看倉看草老幼久病殘疾復役未及三年逃軍綿布二匹綿花一斤八兩太原左右中三護衛太原左右前三衛鎮西衛寧化千户所正軍校尉續添校尉並各護衛牧養馬匹軍人有家小綿布三匹綿花一斤八兩隻身旗軍校尉巡營守門鋪養馬看倉看草老幼久病殘疾復役未及三年逃軍及瀋陽中護衛平陽潞州衛沁州汾州千户所正軍校尉並巡營守門鋪養馬看倉看草老幼殘疾復役未及三年逃軍綿布二匹綿花一斤八兩山西行都司所屬大同左右前後朔州天城陽和安東中屯等衛正軍恩軍校尉並旗手等衛調去入伍軍匠有家小者綿布四匹綿花一斤八兩隻身旗軍校尉並旗手等衛調去入伍軍匠及巡營守門鋪養馬看倉看草老幼久病殘疾復役未及三年逃軍綿布二匹綿花一斤八兩又令在京各衛軍士該賞布一匹者與本色二匹者內一匹折新鈔五錠三匹四匹者各支二匹餘每匹折新鈔五錠十八年令賞賜各衛軍士冬衣布花照先欽定賞賜例絹每匹折與蘇木一斤六兩胡椒四兩布每匹折蘇木一斤胡椒三兩十九年令在京各衛軍士該賞布三匹者內一匹折蘇木一斤一匹折新鈔三錠該布二匹者內一匹折蘇木一斤該布一匹者仍舊在京者與綿布南京者與夏布其南京隨住北京者仍於南京給之二十二年令在京各衛軍士該賞布三匹綿花一斤半者與絹二匹胡椒一斤該布二匹綿花一斤半者與絹二匹該布一匹綿花一斤半者與絹一匹胡椒半斤其南京衛所軍士止賞布匹該三匹者內二匹折絹一匹一匹折胡椒一斤該二匹者折絹一匹該一匹者折胡椒一斤宣德五年令在京各衛軍士該賞綿布三匹二匹者內一匹折鈔五錠南京各衛軍士全給綿布不支綿花八年令梁城守禦千户所軍士照例給賞冬衣布花十年令軍士冬衣布花在京差監察御史給事中會戶部官在外巡按御史等官會戶部委官給散正統元年令西安左衛旗軍調寧夏各邊備禦者全支綿布三匹綿花一斤八兩增給遼東操備軍士綿花為三斤三年令報效家人義男女壻民人餘丁各賞布三匹本色二匹折鈔一匹逃囚布一匹逃軍布二匹內折鈔一匹綿花俱一斤八兩四年奏准北直𨽻衛分軍士冬衣布花每歲七月中差官給散俱限十二月終回京又令在京並南京各衛所旗軍力士校尉將軍人等該賞布花見在並征差在營有家小隻身及年十五歲以上矮小軍人在營有家小並年十四歲以下幼軍在營或有一母一伯叔父母一姐一妹一弟者征差運糧陳亡失陷傷故落水淹死病故但有長幼兒男同家小在營者在營亡故有兒男家小在營者初年下屯關支月糧未收子粒有無家小者年老殘疾還鄉換丁在營有家小者王府隨侍旗軍校尉並養馬軍人醫獸操練民間子弟並餘丁俱布三匹為事發遣征進在京有家小者年老殘疾無丁代役並習學局匠及赦前為事發充局匠俱有家小及矮小隻身軍人年十五歲以上者各衛燒窯挑柴看桐漆樹種苜蓿及四門厨房做飯食糧恩軍赦前收役在營有家小者俱布二匹征差運糧陳亡失陷傷故落水淹死在營止有老軍與隻身妻女並年六歲至十四歲隻身男及同籍隻身弟壻等項在營者為事食糧恩軍在營隻身者在營亡故止有六歲至十四歲隻身男在營者為事發遣征進在彼病故在京有兒男者旗軍年老殘疾無丁代役並習學局匠及赦前為事發充局匠在營俱隻身者赦後為事發充局匠及王府養羊幼軍小厮俱布一匹牧馬千戶所養羊幼軍舊衣三件征差隻身並在營止有幼男女年十歲以下候本軍回還照例補賞為事被監有無家小候復役補賞七年令陜西都司調去甘肅沿邊操備腹裏屯軍每名給賞綿布三匹內折鈔一匹綿花一斤八兩八年令甘肅延綏等處操備旗軍有家小者每名給賞布三匹隻身布二匹綿花俱一斤八兩令陜西都司所屬寧夏中護衛河州洮州岷州寧夏左右前屯衛寧夏寧夏中靖虜等衛寧夏羣牧千户所正軍恩軍校尉有家小者每名給賞布四匹隻身旗軍校尉並養羊小厮巡營守門鋪養馬看倉看草老幼久病殘疾復役未及三年逃軍布二匹綏德衛慶陽延安西安右護衛西安左西安後鞏昌漢中秦州平凉等衛鳯翔守禦千户所西固城禮店千户所階州守禦千户所平凉中護衛蘭州西安前甘州中護等衛甘州羣牧守禦千户所鄭府儀衛司羣牧千户所正軍校尉有家小者布三匹隻身旗軍校尉及巡營守門鋪養馬看倉看草老幼久病殘疾復役未及三年逃軍布二匹綿花俱一斤八兩寧夏在城驛並寧夏遞運所及髙橋兒等各驛遞運所恩軍花布各照彼處附近衛所軍士原定腹裏口外事例給賞陜西行都司所屬甘州左甘州右中前後凉州西寧永昌山丹莊浪鎮番等衛古浪城鎮夷守禦千户所正軍恩軍並鎮夷守禦千户所京衛紀罪旗軍並凉州莊浪二衛自買馬匹充軍報效士民有家小者布四匹隻身旗軍校尉並養羊幼軍巡營守門鋪養馬看倉看草老幼久病殘疾復役未及三年逃軍布二匹綿花俱一斤八兩九年令各衛軍士該賞布花許在衛妻子家人代領隻身無親者照數印封責親管官旗領送本軍十年令陕西延慶西安秦鞏鳳翔等衛所屯田旗軍分調定邊等衛備冬者每名給賞布二匹內折鈔一匹綿花一斤八兩又令聚落陽和天城三驛擺站囚軍每名給賞綿布二匹綿花一斤八兩又令河南都司並直𨽻寧州衛南陽衛頴上守禦千户所旗軍於延安綏德等處備邊過冬者每名給賞布一匹綿花一斤八兩鈔二十五貫又令陜西延綏慶陽二衛並西安左等四衛旗軍原調守邊備冬者每名給賞布四匹內二匹並綿花一斤八兩給與家小餘布二匹再增綿花一斤八兩給守邊正軍若本家有選差常川守邊備冬餘丁者每名再給布一匹綿花一斤本衛守城操練者照舊又令河南都司所屬衛所旗軍於宣府操備過冬者每名給賞布三匹綿花一斤八兩十二年令陜西寧夏備禦寧羌衛軍士每名給賞布二匹綿花一斤八兩其家小在原衛者則給綿布二匹綿花一斤八兩又令廣昌守禦千户所照例給賞布花鈔錠景泰三年令永寧夜不收馬軍並保安等城旗軍內陸續解到衛新軍給賞冬衣布花又定後軍都督府所屬通州右等衛所並大寧萬全二都司所屬衛所賞賜布花則例通州左右永平薊州遵化忠義中鎮朔隆慶東勝左右密雲中興州中屯左屯右屯前屯後屯營州中屯右屯左屯前屯後屯定州河間大同中屯瀋陽中屯茂山保定前後左右中定邊開平中屯天津天津左右武清撫寧真定涿鹿左涿鹿盧龍涿鹿中神武中右等衛及廣昌平定蒲州梁城寬河等守禦千户所正軍恩軍有家小該布三匹者內一匹折鈔五錠綿花一斤八兩隻身旗軍及發去異姓軍士巡營守門鋪養馬看倉看草老幼久病殘疾復役未及三年逃軍該布二匹者內一匹折鈔五錠綿花一斤八兩平定蒲州二守禦千户所正軍及巡營守門鋪養馬看倉看草老幼久病殘疾復役未及三年逃軍該布二匹者內一匹折鈔五錠綿花一斤八兩宣府前左右萬全左右懷來山海密雲後開平蔚州保安保安右永寧懷安隆慶左右龍門等衛興和美峪龍門等守禦千户所除夜不收守墩旗軍布四匹全支本色其餘正軍恩軍並旗手等衛調去入伍軍匠有家小該布四匹者內一匹折鈔綿花一斤八兩隻身旗軍調去入伍軍匠隻身者及養羊小厮巡營守門鋪養馬看倉看草老幼久病殘疾復役未及三年逃軍及習學軍匠不分有無家小全支布二匹綿花一斤八兩又令陜西寧羌臨洮二衛金州文縣二守禦千户所鎮邊玉林威逺雲川髙山等衛及山隂馬邑守禦千户所軍士俱照例給賞冬衣布花成化六年令直𨽻遵化等衛所軍士調撥喜峯等極邊口堡守備過冬者有家小賞布三匹無家小者二匹七年令各邊民夜不收給賞布一匹綿花半斤十四年令給賞冬衣布花事故扣除之數該屬五府者送該府經歷司親軍衛所送掌印官同首領官封收待下年給散又令給賞冬衣布花以七月初一日奏領勘合八月初一日下庫關領十五日以給陸續給散十五年令南京賞賜各衛軍士夏布每歲三月初旬取勘四月終旬給賞又令遼東並萬全都司宣府前等衛守哨夜不收旗軍人等每名給賞布四匹內半匹折鈔又令永平薊州沿邊關營操守軍士該賞布匹全關本色十九年令陕西文縣階州西固城守禦千户所有家小正軍每名給賞布一匹綿花一斤八兩隻身並把門等項布一匹如不足數布一匹給銀二錢綿花一斤五分又令四川荗州上班守備旗軍每名給賞布二匹綿花一斤二十三年令賞賜軍士冬衣布花每布一匹折銀二錢五分綿花每斤折銀七分𢎞治三年令四川建昌等六衛軍士每名給賞布二匹內布一匹折鈔五錠如無鈔折銀一錢五分綿花一斤折銀七分又令山西都司所屬衛所振武衛並雁門千户所屯守正軍有家小每名綿布四匹本色二匹折鈔二匹綿花一斤八兩本色一斤折鈔八兩隻身旗軍並巡營守門鋪養馬看倉看草老幼久病殘疾復役未及三年逃軍每名綿布二匹本色一匹折鈔一匹綿花一斤八兩本色一斤折鈔八兩保德州守禦千户所屯守正軍有家小每名綿布三匹折鈔一匹綿花一斤八兩隻身旗軍並巡營守門鋪養馬看倉看草老幼久病殘疾復役未及三年逃軍每名支綿布二匹綿花一斤八兩太原左右前鎮西衛寧化守禦千户所晉府儀衛司寧化等王府正軍校尉有家小每名綿布三匹本色一匹折鈔二匹綿花一斤八兩本色一斤折鈔八兩隻身旗軍校尉並巡營守門鋪養馬看倉看草老幼殘疾久病復役未及三年逃軍每名綿布二匹本色一匹折鈔一匹綿花一斤八兩本色一斤折鈔八兩平陽潞州瀋陽中護衛汾州守禦千户所沁州守禦千户所瀋府儀衛司正軍校尉巡營守門鋪看倉看草老幼久病殘疾每名綿布二匹本色一匹折鈔一匹綿花一斤八兩本色一斤折鈔八兩山西行都司所屬大同左右前後朔州天城陽和安東中屯鎮邊玉林威逺雲川髙山山隂守禦千户所馬邑守禦千户所代府長史司帶管屯田旗軍有家小每名綿布二匹屯田老幼等項旗軍無家小每名綿布一匹綿花俱一斤八兩又令陜西都司所屬固原衛西安前千户所慶府儀衛司正軍恩軍校尉人等賞布花如正統七年例又令見在寧夏西安左等衛並延綏慶陽三衛操備有馬餘丁每名綿布二匹綿花一斤又令秦府儀衛司韓府儀衛司肅府儀衛司正軍校尉有家小每名綿布三匹綿花一斤八兩隻身旗軍及巡營守門鋪養馬看倉看草老幼久病殘疾復役未及三年逃軍每名綿布二匹綿花一斤八兩又令陜西行都二司所屬衛所旗軍該賞布花如不勾全賞照例减賞原支四匹者支與三匹原支三匹者支與二匹不敷布花照例折鈔每綿布一匹折鈔五錠綿花一斤折鈔二貫明會典卷二十六
