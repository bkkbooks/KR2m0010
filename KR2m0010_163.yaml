body:
  text: 明會典卷一百六十三工部十七抽分客商興販竹木等項抽分各有分數以防過取今備載於後諸司職掌凡龍江大勝港俱設立抽分竹木局如遇客商興販竹木柴炭等項照例抽分及令軍衞自設場分收貯柴薪按月給與禁軍孤老等燒用竹木等物堆垜在場今各局按旬奏申知數目有用度以憑計料揀定數目度量關塡勘合支撥如是營造數多抽分不敷定奪奏聞給價收買或差人砍辦三分取一蘆柴茅草稻草茭苗草蔂草三十分取二杉木軟篾棕毛黃籐白籐十分取二松木松板杉篙杉板檀木黄楊梨木雜木檐杯鋤頭柄竹掃箒茭苗苕箒猫竹水竹雜竹木炭煤炭竹交椅筀竹黃籐鞭桿木柴箭竹事例洪武十三年罷天下抽分竹木坊永樂六年開設通州白河盧溝通積廣積五抽分竹木局十三年令照例抽分三十分取六松木柏木椵柴椵木長柴把柴雜木塊柴鞭桿松木板煤炸木炭檀木片柴杉木板猫竹水竹筀竹杉木篙車軸車輞車輻雜竹箭竹黄籐鞭桿雜木檐板茭苗苕箒竹掃箒芒苗苕箒石竹篾梢柴三十分取三棕毛蒿柴荳稭薥稭桿三十分取二石灰石炭杉木磚瓦黄籐白籐軟竹篾黄楊木三十分取一茅草稻草蔂草茭草穀草雜草雜柴三十分取五蘆葦三十分取十五蘆葦柴宣德九年令蔚州及美峪九宫口五福山龍門關等處山場除成材大木不許採取其小木及椽枋之類聽人採取貨賣經過抽分去處毎十根抽三根正統元年設真定府抽分本府税課司帶管木植三十分抽四分編號印記從滹沱河運至通州抽分竹木局交收二年奏准大通關并廣利閘遇有軍民人等告拆船隻相料明白無礙逐隻放過閘口至本局河下照數拆抽不許私拆天順間設保定府抽分唐縣委官一員前去倒馬關會同抽分木植三十分抽六分本部差官賣銀發唐縣官庫收貯聽用成化五年令京城九門并通州等處抽分局厰例不該抽之物不許擅取六年令通州等五處抽分竹木局毎處差主事給事中御史各一員按季更換毎月初六日各造册與本局官同復命七年令毎處止差御史一員又設杭州荆州太平三處抽分毎歳本部差官三員凡竹木等物毎十分抽一分選中按季送清江衞河二提舉司造船次等年終運至通州送器皿厰造器皿餘賣銀聽用十五年奏准南京龍江瓦屑埧二抽分竹木局抽收在場竹木等物毎年南京工部都察院各委官一員會同監督抽分官員查盤見數聽候領用變賣造册奏繳局官考滿事故交盤明白方許離任惜薪司柴薪供應大庖厨照舊用潔凈雜木其餘俱於所抽柴炭内支放或朽爛木植内定數折支各衙門造作該用物料具印信領狀關領不許冒支多派又令管莊僕佃人等占守水陸關隘抽分勒取財物挾制把持害人者都發邊衞永遠充軍十七年設蘭州抽分本州衞掌印官會同將河橋上岸捉獲木植毎十分抽二分過河橋捉獲者盡數入官俱送本處官厰収貯公用𢎞治四年奏准北新安磨石口龎村三厰於盧溝抽分局官二員内每季輪差一員管理柴炭國初供應柴炭悉於沿江蘆洲并龍江瓦屑二場取用及永樂遷都於北則於白羊口黃花鎮紅螺山等處採辦宣德間始設易州山厰專官總理景泰間移於平山又移於滿城天順初仍移於易州而派辦運納各有定例今具列於後事例正統初令各處納到木柴内有檀榆柘桑栗木揀出按月具數奏報送兵仗局用景泰間奏准應天等處歳辦蘆柴以十分爲率减免四分三分折鈔三分本色折鈔毎束二貫五百文鈔一萬貫又折收銀二十二兩五錢天順元年令易州一帶山場係關隘人馬經行去處不許採取柴炭八年坐派易州厰柴炭四百三十餘萬成化元年增至六百五十餘萬二年又增至一千一百八十餘萬三年又增至一千七百四十餘萬又奏准本部南廊正陽關臺基各厰官攢照依户部倉場事例經手柴炭務要支放盡絶有餘仍交盤明白方許給由四年奏准内府各衙門柴炭减省支用止照成化三年例採辦九年令於蘆柴三分本色内以一半折銀毎束二分俱送應天府官庫收貯支用年終造册具奏其折納木柴者毎百斤折銀四分𢎞治元年奏准沿江一帶蘆洲除欽賜欽撥并内外衙門舊額及先年軍民人等開墾起科納銀曾經黃册造定者照依所撥納糧數目定立界至給與明文管業其餘有人曾告承佃而舊額洲場坍塌者即將新佃柴課依數輳補本處舊額見在或有新生别洲許令撥補附近坍塌不敷之數其灊山大湖等縣不近大江原無蘆洲而有柴額者准令毎束折銀二分三年令蘆柴毎束連脚耗徴銀四分五年奏准九江安慶毎畝好蘆地科銀二分二釐稀蘆地二分二釐池州好地三分五釐稀地二分五釐應天揚州太平鎮江廬州和州等府州好地四分稀地二分七釐各處毎畝熟地三分五釐軍屯熟地并灘田灘地各三分低窪熟地二分五釐荻草地二分草塌一分五釐草蕩一分其起科納糧者免徴柴課有願徴糧不願納課者聽九年奏准今後各處造作派辦務要照依原議從實估計不許多派惟燒琉璃純用木柴黒窯磚瓦用木柴三分雜柴七分其工程已完者照例停免不必再行追擾毎年派去本厰數目但有過一千五百萬之外本部照例另行斟酌奏請定奪夫役夫役舊有定例自永樂以後營造工大起撥供用漸多今營造之外又有柴夫以供内府之用亦具載之諸司職掌凡在京城垣河道毎歳應合修繕其用工數多須於農隙之時於近京免糧應天太平鎭江寧國廣德等五府州預先定奪奏聞行移各府起取除役占等項照依欽定則例優免外其餘人户毎四丁共輳一夫著令各備鍬杵籃擔委官部領定限十月初赴京計定工程分數做造滿日放囘若有不當夫役及做工未滿逃囘者並行治罪及各處起到倉脚夫俱發應天府收籍爲民遇有官差度量差撥著令輪流周而復始若差使數多做工日久照例毎名日給工錢五百文坊長减半以周養贍優免二丁水馬驛夫遞運船水夫會同館夫輪班人匠在京見役皂𨽻校尉力士見任官員廩膳生員訓導馬船夫光祿司厨子防送夫軍户鋪兵免一丁凡年七十以上及廢疾之人事例洪武元年定設法毎田一頃出丁夫一人三年置直𨽻應天等十八府州及江西九江饒州南康三府均工夫圖册毎歳農隙其夫赴京供役毎歳率用三十日遣歸田多丁少者以佃人充夫其佃户出米一石資其費用非佃人而計畝出夫者其資費毎田一畝出米二升五合二十六年令倉脚夫毎一坊長製牌一面以後各衙門差使奏過給牌取夫工完繳牌永樂九年令天壽山工役病故者給棺送囘原籍與鈔一百貫安𦵏免其户役一年沿途得病不曾上工故者亦送回與鈔五十貫免户役半年十一年令放囘軍夫人匠沿途有病者所在官司醫治砍柴夫事例宣德四年設易州山厰起倩砍柴夫毎季二萬五千八百五十五名四季共十萬三千四百二十名順天府毎季一千七百三十二名真定府三千二百九十六名保定府二千四百九十二名濟南府三千八百三十名兖州府八百八十名半東昌府四百一十名青州府一千七百七十名太原府五千六百二十四名平陽府二千七百一十一名半澤州一千二百三十三名潞州一千一百八十二名遼州一百一十三名沁州一百七十四名汾州四百七名景泰元年奏准减免五千名成化四年奏准毎名一季收脚價銀三兩又奏准易州龍灣二厰管柴官毎州縣人夫一百名以上者留一員專管一百名以下者有州去處該州官管不係州轄縣分就令本府把總官管二十一年奏准解價官收畢遣囘不許私留管工𢎞治七年奏准五名之内僉㸃夫頭一名按季賚價赴欽差管官處交收擡柴夫事例洪武間南京惜薪司夫三千名俱應天府上元江寧二縣起取永樂宣德間内府惜薪司坐派擡柴夫二千名照應天府例於大興宛平二縣起取宣德間議准减免南京惜薪司夫止存三百名常川於龍江瓦屑二處挑運柴炭後一縣止差雇夫坊長其脚價俱句容溧陽溧水三縣出辦正統元年奏准北直𨽻八府除真定保定二府採燒柴炭令河間永平順德三府大名廣平二府順天一府各起三千名各當一年周而復始成化二十一年奏准毎名一月徴銀一兩二錢二十三年奏准照舊起夫𢎞治元年奏准毎名一月徴銀一兩四錢五年詔有司衞所解到夫價止收正數不許分外多收八年奏准真定保定與順天府共當一年十四年奏准廣平府原額九百名内减二百名分派大名府起取又各府遇該當年分一年分爲兩季徴銀毎府總差官吏各一人解部轉送惜薪司雇人上工又令照舊起夫供役夫價銀免徴雜行諸司職掌凡催捉軍需物料勾提囚匠等項欽置勘合如遇四子部合行事理或五件十件類具手本責差該吏齎赴内府工料關填勘合行移各司承奉理辦如有不完舉奏提問其官吏給由缺官條格等項及本部并合屬官吏俸給按月放支仍毎歳會計行移户部撥支遇有當行行移吏部等衙門定奪施行事例凡勘合字號浙江布政司堂字徽州府基字蘇州府端字鳳陽府正字淮安府建字廣西布政司緣字揚州府德字福建布政司積字應天府右字池州府念字四川布政司力字和州谷字常州府維字廣東布政司福字河南布政司善字除州聲字滁州甲字陜西布政司寶字寧國府賢字真定府通字大名府承字永平府興字江西布政司習字鎮江府行字雲南布政司興字順德府集字太平府作字保定府廣字山西布政司當字隆慶州英字保安州高字湖廣布政司因字河南府聚字廣平府達字山東布政司尺字松江府立字廬州府名字廣德州傳字貴州府政司長字安慶府表字毎月二十二日於内府司禮監六科廊領出精微簿四扇一扇紀四司毎日行出公文内填各布政司并直𨽻府州勘合字號及硃語三扇紀四司毎日收入公文營繕司一扇虞衡都水二司共一扇屯田司一扇俱填各項解户鄉貫姓名并納完某料於前件下明註某日批迴至次月二十六日齎赴六科廊官處看過送精微科年終類繳原領衙門收貯農桑諸司職掌已見户部民科農桑項下事例洪武二十七年命工部行文書教天下百姓務要多栽桑棗毎一理種二畝秧毎一百户内出人力挑運柴草燒地耕過再燒耕燒三遍下種待秧高三尺然後分栽每五尺濶一壠毎一户初年二百株次年四百株三年六百株栽種過數目造册囘奏違者全家發雲南金齒充軍南京工部營繕清吏司事例凡内府衙門及皇城門鋪等處損壞工程大者本部委官會同科道并内官監各委官會勘具奏修理若工程不多本部徑自修理凡裏外城垣門鋪官㕔損壞工程大者本部委官相計明白會同内外守備等官具奏修理工程不多本部措置物料委官徑自修理凡南京大小衙門損壞俱申達本部工程大者具奏修理委官監督工完將用過物料工程數目開報以備查考凡南京各衞倉專設主事一員提督修理遇有損壞開報本部計料興工凡南京刑部都察院送到問擬運磚運炭等項囚人本部委官照原問罪名收料完足出給實收連人送司仍送各該衙門發落凡南京刑部都察院送到做工囚人撥各窑做工工滿日仍送囘原問衙門完卷各司同凡各色班匠俱江西湖廣福建三布政司起送虞衡清吏司事例凡湖廣浙江廣西三布政司及應天府毎歳解到活鹿天鵝俱送南京光祿寺交納凡四川布政司毎歳解到白毛硝生麂皮漆鐵廣東廣西福建三布政司解到皮翎俱送南京丁字庫交納凡南京兵仗局前厰毎年成造毛襖狐帽完日俱轉送南京乙字庫交納毎季成造軍器完日㑹官試驗奏報凡直𨽻寧國府解到歳造酒瓶一十萬件送南京光禄寺交納凡直𨽻安慶徽州二府解到歳造糧長勘合紙二千九十七張底簿中夾紙三百八十一張送南京户部交納都水清吏司事例凡南京橋道水洞損壊坍塌本部委官相計修理凡南京錦衣等衞大小黃船及新江口戰巡等船損壞俱本部委官相計修理凡南京錦衣等衞快船損壞本部委官相勘明白毎隻給價銀七十兩令該衞官軍打造凡毎年織造御覽等厯銷金包袱合用柘黄線羅行南京織染所織造送用凡奉先殿硃紅漆供卓等件本部毎年一次修換凡直𨽻寧國等府毎歳解到茭苗苕箒并竹掃箒俱送南京供用庫交納凡南京供用庫篩簸及進香稻竹籠一年一造神官監進鮮苗嫩薑果品等物竹簍二年一造内官監進鰣魚鮮笋果品等物涼盒及司苑局進薦新荸薺鮮藕等物竹簍俱三年一造神官監薑棚葡萄架俱五年一造屯田清吏司事例凡各處歳辦牛隻數目本司類造文册繳報凡南京光禄寺合用柴薪毎年呈會本部行龍江瓦屑埧二抽分局關支應天府僉差坊長二名督夫運納凡南京神樂觀樂舞生及長安等五門守衞官軍合用柴薪本部俱於南京司禮監關填勘合行龍江抽分竹木局關支計各處歳辦蘆課銀應天府上元等五縣江淮等巡檢司三千九百二十五兩二錢鎮江府金壇等三縣包港等巡檢司一千六百三十八兩一錢太平府繁昌等三縣三山等巡檢司二千八百四十七兩八錢揚州府儀真等三縣舊江口等巡檢司二千三百三十兩五錢安慶府懷寧等六縣小孤山等巡檢司七千四百三兩八錢廬州府無爲州泥汊河等巡檢司二千七百四十九兩六錢池州府貴池等六縣池口等巡檢司二千八百九十六兩三錢九江府湖口等縣龍口等巡檢司二千二百九十五兩二錢和州浮沙口等巡檢司六百七十八兩二錢計各處該納物件生漆廬州府一千八百七十五斤池州府一千二百五十斤漆園一千七百三十六斤一十四兩六錢棕毛棕園四千五百四十九斤八兩已上俱三年一納桐油桐園二千一百九十七斤四兩六錢一年一納凡營繕等司送到上元江寧二縣鋪户納過各色物料數目本司會同各司官照依時價估計明白於蘆柴等銀内支領凡本部各司類行浙江等布政司并直𨽻蘇州等府勘合俱由本司承行明會典卷一百六十三
