body:
  text: 明會典卷二吏部一官制國初因前代之制置中書省設左右丞相等官天下政事皆由之而出其屬有四部分治錢穀禮儀刑名營造之務洪武元年始置吏户禮兵刑工六部俱正三品衙門設尚書侍郎等官仍屬中書省十三年中書省革升六部為正二品衙門如周官六卿各任其職建置大意具見祖訓條章自是中書之政分於六部永樂初升北平為北京總置行部後既遷都又分置六部各稱行在某部十八年定都於北除行在二字其舊在南京者加南京二字洪熙元年復稱行在宣德三年行部革正統六年復除行在二字遂為定制兩京六部并諸衙門建置沿革悉同以吏部為各部之首故總敘於此諸司職掌尚書侍郎之職掌天下官吏選授勳封考課之政令其屬有四曰選部司封司勳考功皇明祖訓一自古三公論道六卿分職並不曾設立丞相自秦始置丞相不旋踵而亡漢唐宋因之雖有賢相然其間所用者多有小人專權亂政今我朝罷丞相設五府六部都察院通政司大理寺等衙門分理天下庶務彼此頡頏不敢相壓事皆朝廷總之所以穩當以後子孫做皇帝時並不許立丞相臣下敢有奏請設立者文武群臣即時劾奏將犯人凌遲全家處死文選清吏司洪武元年初置六部每部設郎中員外郎主事十三年每部分四子部每子部各設郎中員外郎主事如周官六卿各率其屬而治本部四子部曰總部曰司封曰司勳曰考功二十二年改總部為選部二十九年又改選部為文選司封為驗封司勳為稽勳考功仍舊俱稱清吏司各部諸司建置沿革悉同以文選為諸司之首故總敘於此其名目沿革各有不同則别見於本部之下諸司職掌郎中員外郎主事掌天下文吏班秩品命國初選用人才不拘一途設賢良方正聰明正直孝弟力田通經孝廉等科或從耆民及稅户人材與科貢之士兼收並用隨才授任多出親擢其後始定銓選之法諸司職掌凡內外官員考滿侍親致仕丁憂殘疾極刑考功司勳來付案呈本部立案作缺類寫缺本赴內府銓注如遇本科遷調改降及內外衙門開到為事提問等項官員本部立案作缺仍連送選部移付司勳照勘明白開附轉續貼黃考功附寫行止如事故不明難以作缺者本科自行照勘回報明白者一體作缺開附貼黃行止事例洪武間內外大小衙門缺官逐日申部作缺臨選類缺赴科填注銓選永樂間按季造册送部成化以來在內缺官照舊移報本部在外所司五日一申巡撫都御史巡按御史都御史御史兩月一奏以憑銓補諸司職掌凡考功付到考滿官司勳付到起服官及內外衙門送到降用裁減截替别用官員就憑來文附簿立案起服考滿官止憑來付案呈本部審實相同比例無差就便謄録選本引選本科該管裁減改降截替并為事釋放罷間起取官員隨令備供歷任腳色開寫公私過名赴堂題判送稽勳考功查對貼黃紀録明白類奏照例選用如有公過差錯就行引問取招移付考功紀録通問如隱匿的決及贓私等項過名及改換出身有害於事者具奏送問進士監生通經秀才人材孝廉賢良方正等項俱憑來文附簿責供年籍住址出身名色丁産營生過名分成等第然後引奏選用隂陽醫術行移太醫院欽天監考試如果堪用照例具奏引選不堪用者將原舉官吏依貢舉非其人律付考功紀録本人放回仍督令别舉僧道亦憑僧道録司考試堪用申送本部俱該類奏引選其應選官員人等除僧道隂陽醫士就除原籍其餘俱各照例避貫銓注如無相應見缺借除在京在外者皆仍支合得俸給通理月日凡在京初入仕者試職其在京實授試職官員凡有升除即與實授量才授職比與前任品級降等者亦實授外任官員果有才德薦舉升除在京者亦實授若因朝覲給由等項到部遇有缺員就便對品改除者實授升除者試職如遇特旨升降及與實授者不在此限在京已入流倉官不須試職未入流品官員俱與實授舉人出身第一甲三名第一名從六品第二名第三名正七品賜進士及第第二甲從七品賜進士出身第三甲正八品賜同進士出身在外承差有缺於能幹人員內取用考滿者準考功來付於行人內用起復者準司勳來付於五府六部知印內用五府六部知印有缺具奏於識字人材內取用大明令凡內外管屬衙門官吏有係父子兄弟叔姪者皆須從卑回避凡流官注擬並須回避本貫事例凡進士第一甲第一名除翰林院修撰第二名第三名除編修其餘分送各衙門辦事內外以次兼除凡進士間選為庶吉士洪武間分置近侍衙門永樂以後止𨽻翰林院命學士等官教之學業成者除翰林官其後二甲除編修三甲除檢討兼除科道部屬等官凡國子監監生入選分北監南監正行雜行每兩月一次考試選用或有急缺不拘時月凡監生不願出仕成化十一年詔聽選者授從七品依親坐監者正八品有司職名二十三年令仍填注衙門給與散官凡各部主事及大理寺評事歷俸未及兩考員外郎寺副未及一考序升者俱令署職考滿後奏請實授凡給事中有缺舊皆類選後止於進士內年三十以上者考選奏補𢎞治十五年令博士行人兼選又令照御史例選歷練老成者除補其都給事中左右給事中有缺於年深左右給事中給事中內具奏升用凡中書舍人有缺舊皆類選後止於進士舉人監生內選除間有大臣子孫廕授或令試職習字出身者不在此例凡監察御史有缺舊皆類選後於進士舉人教官等項選除近例於行人博士進士及行取進士舉人出身知縣推官本部會同都察院考選分送兩京理刑或試職滿日升除實授𢎞治十五年令照憲綱例於博士行人知縣推官并教官考選歷練老成者除補凡行人洪武二十七年令於進士內除授凡國子監監丞博士助教學正學録於教官內升用凡太常寺協律郎司樂以掌樂教師執事樂舞生選補天地山川壇并各陵奉祀祀丞以樂舞生選補神樂觀提點知觀於奉祀祀丞內選補俱從本寺選定送部奏除其曾經問罪者不許選除凡欽天監官不由常選非奉特旨不得升補監正監副有缺於本監官內推補五官正五官靈臺郎於屬官內推補保章正以下於天文生內選補凡太醫院官不由常選院使院判御醫多奉特旨升用御醫有缺或行本院於醫士內選補各王府良醫俱於醫士內選用凡各王府長史等官但曾經過犯之人不許選用親王妃父原無官者授兵馬指揮及郡王妃父授兵馬副指揮職銜俱不任事凡文職本身并族屬有女為王妃或夫人男為儀賓等項俱各見在及有子孫者不許升除京職如已故及無子孫者一體升除凡公侯伯家宣德以前置教書儒士一人駙馬家或有學録正統元年詔公侯伯自保通經秀才各除教官一員景泰五年令教書三年考中者給冠帶三年授職後奏保勘實考中者準令教書三年除訓導於本都督府帶俸𢎞治十三年奏革保舉從本部選除凡兩京禮部鑄印局儒士辨印三年滿日除授本局大使副使無缺除各府檢校凡鴻臚寺通事初辦事三年食糧三年禮部考中冠帶又三年除序班凡各處舉到經明行修懷才抱德之士舊例送翰林院考試後止於本部考分撥各衙門辦事一年本衙門考勤謹者徑自引奏送本部選用凡教職洪武十八年以會試下第舉人俱授學正教諭二十六年以監生年三十以上能文章者授教諭等官訓導有缺以舉人及考中監生并通經儒士選用永樂元年令由舉人授者皆署職其所教生員科貢及數者方與實授正統八年令副榜舉人限年及三十除授十一年令內外諸司官各舉山林隱逸經明行修之士及科舉出身仕宦為民無贓罪通經學者除授景泰元年令歲貢生員願就教職者從翰林院考中除學正教諭訓導成化元年奏準嵗貢及納馬納粟四十五嵗出身者止除訓導後惟嵗貢考除餘不準進士及內外見任官科目出身願就教職者聽凡承差在外都布按三司役滿到部分撥各衙門辦事二年滿日除驛丞凡宗人府五府六部都察院知印有缺於役滿承差內引奏選用三年滿日考中宗人府五府從八品用六部都察院正九品用不中與不願考者俱雜職用都司布政司知印從九品用凡監生吏員係廣西人除州縣正官外不拘本地皆許選任教官係雲南人亦許凡户部官不得用浙江江西蘇松人凡內外大小官員丁憂起復赴部除京官不考外如布按二司鹽運使知府考過復除知州知縣歷俸半年之上者亦考過復除不中者遞降其餘不考凡類選官有進士監生吏員出身及考滿起復病痊等官數內該有除授升授改除降調等項考試已定查審得實先具各官印子數進入至日早朝將畢本部官請旨選官上退御便座奏選官總數畢引官叩頭駕回印綬監出印子用於各官職名之上對數相同司禮監官持本入奏本部官出就闕左俟旨出填榜揭示於午門東廊各官通知畢送吏科收貯凡在部聽選挨次未到官員監生情願告就逺方者成化五年奏準廣東廣西雲南四川貴州陜西山西遼東所屬衙門邊逺去處缺官查照考驗奏請選用凡府佐州縣正官每遇朝覲年後員缺數多將挨次未及科貢監生揀選除補或逺方知縣缺多將地方相應科貢監生選補𢎞治十二年奏準每年二八月除常選外揀選一次凡雲南等處極邊司府倉大使從九品員缺數多於考中二等雜職出身吏員內每年一次選補其南北二京倉場及各邊雜職倉官并各王府倉庫官員缺於常選未及告願雜職者每年正三五七九十一月選用諸司職掌凡內府除授官員令主事抄寫處所到部呈堂具本覆奏附選京官就令赴任行移在京各衙門在外官員關領劄付其布政司正佐官員關領照會俱定限到任仍行取到任月日候回報立案送司勳附黃如遇特旨升改降除官員皆要具本覆奏附選一體行移其在外官員赴任一千五百里之外者移咨兵部應付腳力後惟雲南應付腳力近年貴州亦許應付諸司職掌凡內外開設裁革減併一應衙門欽奉聖旨或據準各處來文開列各項緣由若係開設復設衙門定擬衙門品級合設官員數目具奏附寫官制照例除官設吏若係裁革減併衙門具奏銷除官制見任官吏取回移付該科别用俱咨禮部鑄銷印信仍立案連送付司勳貼黃缺科作缺司封行移設吏事例凡父兄伯叔仕堂上官其弟男子姪有任科道官者對品改調在外有僚屬者亦改調凡各衙門官遇有更革及合回避任滿如本衙門無相應員缺於相應衙門對品改調有為事問結送部收查發落例該降調及奉特旨降調者具奏除授凡京官有才堪繁劇者具奏調用外官有才堪治繁見任偏僻及堪治簡見任繁劇地方巡撫巡按官奏請更調者酌量更調或俱無可取起送赴部别用凡京官與王府結親者改調外任若王府官不拘軍民職但與王同城居住者皆改調事例凡保舉人才洪武十五年令朝覲官各舉所知一人永樂元年令內外諸司文職官於臣民中有沉滯下僚隱居田里者各舉所知正統元年御史有缺令在京三品以上官各舉一員除見任知縣不舉知縣有缺令在京四品以上官及國子監翰林院堂上各部郎中員外郎掌科掌道官各舉一員俱從本部推訪除授不職者併坐舉主五年令進士辦事一年監生歷事考中并坐監三年以上由吏員授官曾歷兩考者悉聽保舉十四年方面知府命在京三品以上官保舉有才能出衆屈在下僚者聽風憲官及上司舉薦升擢景泰三年詔各處見任官有屈在下僚文學才行之士隱於民間文官罷職無贓犯而才學可用者並聽在京四品以上在外巡撫巡按方面并府州縣正官舉薦聽用凡在外布按二司府州縣等官及教官有政迹才行者許巡撫巡按官奏舉事例凡兩京衙門堂上官本部具缺奏請多從特旨升用每缺一員推二人奏請簡用尚書侍郎都御史通政使大理寺卿皆會各部都察院通政司大理寺三品以上官推舉巡撫都御史在內地者會户部在邊方者會兵部推舉在外方面官本部推二人簡用凡南京翰林院掌印官缺本部具奏行翰林院推舉簡用凡通政司缺通政參議鴻臚寺缺寺丞等官俱於相應官內擇音吐洪亮便於言説者具奏簡用明會典卷二
