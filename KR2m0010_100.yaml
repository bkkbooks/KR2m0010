front:
  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0010_WYG_100-1a, image: WYG0617/WYG0617-0910a.png}
body:
  text: 明會典卷一百禮部五十九給賜一朝廷給賜畨夷及官員人等事例不一或出一時特恩不可勝紀今舉其可考者具列於後其軍功賞例則見於兵部武選司賞賜項下諸司職掌一凡諸畨四夷朝貢人員及公侯官員人等一切給賜如往年有例者止照其例無例者斟酌髙下等第題奏定奪然後本部官具本奏聞關領給賞一凡賞賜金銀鈔錠匹帛之類金銀請長隨內官關領匹帛係內承運庫收貯冠帶衣靴係工科工部官收掌鈔錠係户部官收掌主客部官分投關領其物或於奉天門或奉天殿丹陛或華蓋殿用卓頓放引受賜人朝北立置物於前受賜人叩頭畢以物授之如多至十人百人則先以所賜之物唱名分授各人行列叩頭畢於該科出帖赴午門倒換勘合照出所賜之物復令次日謝恩一凡逺夷之人或有長行頭匹及諸般物貨不係貢獻之數附𢃄到京願納入官者照依官例具奏關給鈔錠酬其價值在京文武官員人等公差人員附事例登極宣德十年皇帝登極賜在京文武羣臣及軍民人等銀絹布鈔公銀六十兩侯伯駙馬五十兩一品二品四十兩三品二十兩四品至五品遞減五兩六品至九品遞減二兩雜職三兩故侯伯之家及未承襲者各十兩將軍校尉軍匠人等各二兩優給幼官并紀録幼軍各於其例減半辦事官監生生員人材吏典隂陽醫士樂人各絹一匹在京廂民工匠厨役僧道人等各布一匹營造山陵軍人鈔一百貫乾魚三斤聽選公差及四夷朝貢人員各賜鈔有差修實録永樂元年賜監修官銀一百兩綵幣六表裏織金紗衣一套鞍馬一副總裁官銀八十兩綵幣五表裏織金紗衣一套鞍馬一副纂修官銀五十兩綵幣四表裏紗衣一套催纂兼謄寫官銀三十兩綵幣二表裏紗衣一套催纂官銀二十五兩綵幣二表裏紗衣一套謄寫監生生員儒士各銀十兩鈔三十錠綵幣一表裏謄寫吏各銀八兩鈔三十錠綵幣一表裏催督官鈔二十錠絹二匹辦事吏各鈔二十錠絹一匹𢎞治四年賜監修并總裁官銀八十兩綵假四表裏羅衣一套鞍馬一副副總裁銀八十兩綵假四表裏羅衣一套纂修官銀三十兩綵假四表裏羅衣一套催纂官銀二十兩綵假二表裏羅衣一套謄録官銀十五兩綵假二表裏羅衣一套收掌文籍官銀十兩綵假二表裏謄録監生銀五兩綵假一表裏辦事吏典鈔二十錠絹一匹各色人匠鈔二十錠布一匹官升擢事故去任及監生事故去者久近不一賞賚有差視學成化元年車駕視學祭酒率學官上表謝恩賜襲封衍聖公紵絲衣一套犀帶一條顔孟子孫五經博士紵絲衣一套帶一條各紗帽一頂其餘族人俱紵絲衣一套講官祭酒司業大紅織金紵絲羅衣各一套監丞以下青織金紵絲各一套監生各鈔五錠吏典二錠册立東宫𢎞治元年文武官各分五等一等賜紵絲二表裏二等至四等一表裏五等紗一匹南京同公差等項官亦同京衛外衛見操官軍及侍衛帶刀直宿錦衣府軍等衛御馬監并武驤左等四衛官舍將軍旗軍勇士午門等門并正陽等九門官軍銀一兩錦衣等衛所官絹一匹力士旗校軍奴并監局軍匠米一石內府軍厨民匠太常光祿寺厨役米七斗經筵凡經筵初開知經筵同知經筵侍班講書展書等官例賜銀幣鈔錠各有等第其日講官或賜冠帶衣服等件出自特恩時節給賜凡每嵗端午節文武百官俱賜扇并五綵夀絲縷若大臣及經筵官或别賜扇并綵絛艾虎等物各以品級為等凡每嵗各處進貢時鮮如青梅枇杷楊梅雪梨藕笋鰣魚諸物賜文武大臣及日講官各以品級為等公差凡總兵鎮守提督巡撫等官辭朝例賜銀幣寶鈔等物各以事之輕重為等凡文武大臣奉旨勘事回還及督工選軍審囚等項事畢例賜鈔幣羊酒等物各以事之輕重為等考滿凡文職大臣考滿有賜寶鈔羊酒者以品級為等其有賜宴及勑諭者出自特恩患病凡文武大臣患病有賜羊酒米蔬等物者皆出特恩省親凡在京官員給假省親例賜路費鈔錠各以品級為等致仕凡文職大臣致仕有賜勑及銀幣等物者皆出特恩節令洪武十六年令在京文武官吏人等正旦元宵節錢支與胡椒斤兩不等十七年令冬至節錢支鈔不等二十二年重定賞例公侯伯鈔十錠武職一品二品七錠三品至八品五錠文職二品至六品六錠七品至九品三錠未入流官二錠監生一錠排色長一錠樂工二貫樂舞生二貫各寺守座住持一錠衆僧一貫二十六年令自今聖節日在京官吏監生軍民僧道並賜鈔永樂二十二年令皇親遇節令照例賜鈔若大臣不預宴公侯伯都督尚書賜鈔一千貫侍即五百貫宣德正統以後遇節令文武官及外夷人員并國師以下除有宴外其餘官吏人等俱照例關支節錢官并監生鈔一錠儒士知印吏典僧道樂工二貫若奉旨免宴關與節錢大小官員各鈔一錠慶賀凡各王府差來進表箋人員每人賜盤纒鈔十錠南京并在外三司官及諸司差來人員各五錠各王府差來進禮物人員二十錠內外官員內府别給綵假一表裏鳳陽等處皇陵祠祭署官員社長土民陵户女户人等朝賀到京鈔十錠南京并三司官進表回辭朝别賜鈔出自特恩明會典卷一百
