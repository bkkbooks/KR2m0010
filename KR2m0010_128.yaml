body:
  text: 明㑹典卷一百二十八刑部三職制明律選用軍職凡守禦去處千戶百戶鎮撫有缺一具缺本實封御前開拆一行都指揮使司轉達五軍都督府奏聞取自上裁選用若先行委人權管希望實授者當該官吏各杖一百罷職役充軍若選用總旗須於戳過鐵鎗人內委用其小旗從便選充不拘此律大臣專擅選官凡除授官員須從朝廷選用若大臣專擅選用者斬若大臣親戚非奉特㫖不許除授官職違者罪亦如之其見任在朝官員面諭差遣及改除不問逺近託故不行者並杖一百罷職不叙文官不許封公侯凡文官非有大功勳於國家而所司朦朧奏請輒封公侯爵者當該官吏及受封之人皆斬其生前出將入相能除大患盡忠報國者同開國功勳一體封侯諡公不拘此律官員襲廕凡文武官員應合襲廕職事並令嫡長子孫襲廕如嫡長子孫有故嫡次子孫襲廕若無嫡次子孫方許庶長子孫襲廕如無庶出子孫許令弟姪應合承繼者襲廕若庶出子孫及弟姪不依次序攙越襲廕者杖一百徒三年其軍官子孫年幼未能承襲者申聞朝廷紀録姓名關請俸給優贍其家候年一十六嵗方令襲職管軍辦事如委絶嗣無可承襲者亦令本人妻小依例關請俸給養贍終身若將異姓外人乞養為子瞞昧官府詐冒承襲者乞養子杖一百發邊逺充軍本家所關俸給截日住罷他人教令者並與犯人同罪若當該官司知而聽行與同罪不知者不坐濫設官吏凡內外各衙門官有額定員數而多餘添設者當該官吏一人杖一百每三人加一等罪止杖一百徒三年若吏典知印承差祗候禁子弓兵人等額外濫充者杖一百遷徙容留一人正官笞二十首領官笞三十吏笞四十每三人各加一等並罪止杖一百罪坐所由其罷閒官吏在外干預官事結攬寫發文案把持官府蠧政害民者並杖八十於犯人名下追銀二十兩付告人充賞仍于門首書寫過名三年不犯官為除去再犯加二等遷徙有所規避者從重論若官府稅糧由帖戶田籍冊雇募攢寫者勿論貢舉非其人凡貢舉非其人及才堪時用應貢舉而不貢舉者一人杖八十每二人加一等罪止杖一百所舉之人知情與同罪不知者不坐若主司考試藝業技能而不以實者減二等失者各減三等舉用有過官吏凡官吏曽經斷罪罷職役不叙者諸衙門不許朦朧保舉違者舉官及匿過之人各杖一百罷職役不叙擅離職役凡官吏無故擅離職役者笞四十若避難因而在逃者杖一百罷職役不叙所避事重者各從重論其在官應直不直應宿不宿各笞二十若主守倉庫務場獄囚雜物之類應直不直應宿不宿者各笞四十官員赴任過限凡已除官員在京者以除授日為始在外者以領照㑹日為始各依已定程限赴任若無故過限者一日笞一十每十日加一等罪止杖八十並附過還職若代官已到舊官各照已定限期交割戶口錢糧刑名等項及應有卷宗籍冊完備無故十日之外不離任所者依赴任過限論減二等其中途阻風被盜患病喪事不能前進者聽於所在官司給憑以備照勘若有規避詐冒不實者從重論當該官司扶同保勘者罪同無故不朝參公座凡大小官員無故在內不朝參在外不公座署事及官吏給假限滿無故不還職役者一日笞一十每三日加一等各罪止杖八十並附過還職擅勾屬官凡上司催㑹公事立案定限或遣牌或差人行移所屬衙門督併如有遲錯依律論罪若擅勾屬官拘喚吏典聽事及差占推官司獄各州縣首領官因而妨廢公務者笞四十若屬官承順逢迎及差撥吏典赴上司聽事者罪亦如之其有必合追對刑名查勘錢糧監督造作重事方許勾問事畢隨即發落無故稽留三日者笞二十每三日加一等罪止笞五十官吏給由凡各衙門官吏給由到吏部限五日付勘完備以憑類選銓注若不即付勘完備者遲一日吏典笞一十每一日加一等罪止笞四十首領官減一等若公私過名隱漏不報者以所隱之罪坐之若罰贖記過者亦各以所罰所記之罪坐之若報重罪為輕罪者坐以所剩罪當該官司符同隱漏者與同罪承報而差漏及上司失於查照者並以失錯漏報卷宗科斷其漏附行止者一人至三人吏典笞十一每三人加一等罪止笞四十若有增減月日更易地方改換出身蔽匿過名者並杖一百罷職役不叙有所規避及受贓者各從重論姦黨凡姦邪進讒言左使殺人者斬若犯罪律該處死其大臣小官巧言諌免暗邀人心者亦斬若在朝官員交結朋黨紊亂朝政者皆斬妻子為奴財産入官若刑部及大小各衙門官吏不執法律聽從上司官主使出入人罪者罪亦如之若有不避權勢明具實跡親赴御前執法陳訴者罪坐姦臣言告之人與免本罪仍將犯人財産均給充賞有官者升二等無官者量與一官或賞銀二十兩交結近侍官員凡諸衙門官吏若與內官及近侍人員互相交結漏泄事情夤緣作弊而符同奏啓者皆斬妻子流二千里安置上言大臣德政凡諸衙門官吏及士庶人等若有上言宰執大臣美政才德者即是姦黨務要鞫問窮究來歷明白犯人處斬妻子為奴財産入官若宰執大臣知情與同罪不知者不坐公式明律講讀律令凡國家律令參酌事情輕重定立罪名頒行天下永為遵守百官官吏務要熟讀講明律意剖決事務每遇年終在內從察院在外從分巡御史提刑按察司官按法去處考校若有不能講解不曉律意者初犯罰俸錢三月再犯笞四十附過三犯於本衙門遞降叙用其百工技藝諸色人等有能熟讀講解通曉律意者若犯過失及因人連纍致罪不問輕重並免一次其事干謀反逆叛者不用此律若官吏人等挾詐欺公妄生異議擅為更改變亂成法者斬制書有違凡奉制書有所施行而違者杖一百違皇太子令㫖者同罪違親王令旨者杖九十失錯㫖意者各減三等其稽緩制書及皇太子令㫖者一日笞五十每一日加一等罪止杖一百稽緩親王令㫖者各減一等棄毁制書印信凡棄毁制書及起馬御寶聖㫖起船符驗若各衙門印信及夜巡銅牌者斬若棄毁官文書者杖一百有所規避者從重論事干軍機錢糧者絞當該官吏知而不舉與犯人同罪不知者不坐誤毁者各減三等其因水火盜賊毁失有顯跡者不坐凡遺失制書聖㫖符驗印信巡牌者杖九十徒二年半若官文書杖七十事干軍機錢糧者杖九十徒二年半俱停俸責尋三十日得見者免罪若主守官物遺失簿書以致錢糧數目錯亂者杖八十限內得見者亦免罪其各衙門吏典考滿替代者明立案驗將原管文卷交付接管之人違者杖八十首領官吏不候交割符同給由者罪亦如之上書奏事犯諱凡上書若奏事誤犯御名及廟諱者杖八十餘文書誤犯者笞四十若為名字觸犯者杖一百其所犯御名及廟諱聲音相似字樣各别及有二字止犯一字者皆不坐罪若上書及奏事錯誤當言原免而言不免當言千石而言十石之類有害於事者杖六十申六部錯誤有害於事者笞四十其餘衙門文書錯誤者笞二十若所申雖有錯誤而文案可行不害於事者勿論事應奏不奏凡軍官犯罪應請㫖而不請㫖及應論功上議而不上議當該官吏處絞若文職有犯應奏請而不奏請者杖一百有所規避從重論若軍務錢糧選法制度刑名死罪災異及事應奏而不奏者杖八十應申上而不申上者笞四十若已奏已申不待回報而輒施行者並同不奏不申之罪其合奏公事須要依律定擬具寫奏本其奏事及當該官吏僉書姓名明白奏聞若有規避增減緊關情節朦朧奏准施行己後因事發露雖經年逺鞫問明白斬若於親臨上司官處禀議公事必先隨事詳陳可否定擬禀說若准擬者上司置立印署文簿附寫略節緣由令首領官吏書名畫字以憑稽考若將不合行事務妄作禀准及窺伺公務冗併乘時朦朧禀說施行者依詐傳各衙門官員言語律科罪有所規避者從重論出使不復命凡奉制勑出使不復命干預他事者杖一百各衙門出使不復命干預他事者常事杖七十軍情重事杖一百若越理犯分侵人職掌行事者笞五十若回還後三日不繳納聖㫖者杖六十每二日加一等罪止杖一百不繳納符驗者笞四十每三日加一等罪止杖八十若有所規避者各從重論漏泄軍情大事凡聞知朝廷及總兵將軍調兵討襲外蕃及收捕反逆賊徒機密大事而輒漏泄於敵人者斬若邊將報到軍情重事而漏泄者杖一百徒三年仍以先傳說者為首傳至者為從減一等若私開司文書印封看視者杖杖六十事干軍機重事者以漏泄論若近侍官員漏泄機密重事於人者斬常事杖一百罷職不叙官文書稽程凡官文書稽程者一日吏典笞五十三日加一等罪止笞四十首領官各減一等若各各衙門遇有所屬申禀公事隨即詳議可否明白定奪回報若當該官吏不與果決含糊行移互相推調以致耽誤公事者杖八十其所屬將可行事件不行區處作疑申禀者罪亦如之其所行公事己果決行移或有未絶或不完者自依官文書稽程論罪照刷文卷凡有司有司有印信衙門文卷遲一宗二宗吏典笞一十三宗至五宗笞二十每五宗加一等罪止笞四十府州縣首領官及倉庫務場局所河泊等官各減一等失錯及漏報一宗吏典笞二十二宗三宗笞三十每三宗加一等罪止笞五十府州縣首領官及倉庫務場局所河泊等官各減一等其府州縣正官巡檢一宗至五宗罰俸錢一十日每五宗加一等罰止一月若錢糧埋沒刑名違枉等事有所規避者各從重論磨勘卷宗凡磨勘出各衙門未完文卷曾經監察御史提刑按察司照刷駁問遲錯經隔一季之後錢糧不行追徴足備者提調官吏以未足之數十分為率一分笞五十每一分加一等罪止杖一百刑名造作等事可完而不完應改正而不改正者笞四十每一月加一等罪止杖八十受財者計贓以枉法從重論若有隱漏不報磨勘者一宗笞四十每一宗加一等罪止杖八十事干錢糧者一宗杖八十每一宗加一等罪止杖一百有所規避者從重論若官吏聞知事發旋補文案以避遲錯者錢糧訃所增數以虛出通關論刑名等事以增減官文書論同僚若本管上司知而不舉及符同作弊者同罪不知情及不同署文案者不坐同僚代判署文案凡應行官文書而同僚官代判署杖八十若因遺失文案而代者加一等若有增減出入罪重者從重論增減官文書凡增減官文書者杖六十若有所規避杖罪以上各加本罪二等罪止杖一百流三千里未施行者各減一等規避死罪者依常律其當該官吏自有所避增減文案者罪同若增減以避遲錯者笞四十若行移文書誤將軍馬錢糧刑名重事緊關字樣傳寫失錯而洗補改正者吏典笞三十首領官失於對同減一等干礙調撥軍馬及供給邊方軍需錢糧數目者首領官吏典皆杖八十若有規避故改補者以增減官文書論未施行者各減一等因而失誤軍機者無問故失並斬若無規避及常行字樣偶然誤寫者皆勿論封掌印信凡內外各衙門印信長官收掌同僚佐二官用紙于印面上封記俱各畫字若同僚佐二官差故許首領官封印違者杖一百漏使印信凡各衙門行移出外文書漏使印信者當該吏典對同首領官并承發各杖六十全不用印者各杖八十干礙調撥軍馬供給邊方軍需錢糧者各杖一百因而失誤軍機者斬漏用鈔印凡印鈔不行仔細致有漏印及倒用印者一張笞一十每三張加一等罪止杖八十若寶鈔庫不行用心檢閘朦朧交收在內者罪亦如之擅用調兵印信凡總兵將軍及各處都指揮使司印信除調度軍馬辦集軍務行移公文用使外若擅出批帖假公營私照送物貨者首領官吏各杖一百罷職役不叙正官奏聞區處信牌凡府州縣置立信牌量地逺近定立程限隨事銷繳違者一日笞一十每一日加一等罪止笞四十若府州縣官遇有催辦事務不行依律發遣信牌輒下所屬守併者杖一百其㸃視橋梁墟岸驛傳遞鋪踏勘災傷檢尸捕賊抄劄之類不在此限明㑹典卷一百二十八
